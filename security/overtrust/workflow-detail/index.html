e":26,"column":0,"depth":3},"kerjaannya-dari-gue-lihat":{"type":"header","text":"Kerjaannya dari gue lihat","value":"kerjaannya-dari-gue-lihat","line":109,"column":0,"depth":3},"flow-yang-gue-nangkep":{"type":"header","text":"Flow yang gue nangkep","value":"flow-yang-gue-nangkep","line":128,"column":0,"depth":3},"beda-paling-penting-process-dan-privilege":{"type":"header","text":"Beda paling penting: process dan privilege","value":"beda-paling-penting-process-dan-privilege","line":141,"column":0,"depth":3},"evaluasi-trust-boundary":{"type":"header","text":"Evaluasi trust boundary","value":"evaluasi-trust-boundary","line":159,"column":0,"depth":3},"outputnya-bukan-sekadar-flag":{"type":"header","text":"Outputnya bukan sekadar flag","value":"outputnya-bukan-sekadar-flag","line":170,"column":0,"depth":3},"kenapa-ini-penting-buat-gue":{"type":"header","text":"Kenapa ini penting buat gue","value":"kenapa-ini-penting-buat-gue","line":180,"column":0,"depth":3},"kelemahan-yang-harus-diakui":{"type":"header","text":"Kelemahan yang harus diakui","value":"kelemahan-yang-harus-diakui","line":189,"column":0,"depth":3},"hubungan-dengan-note-ringkasan-overtrust":{"type":"header","text":"Hubungan dengan note ringkasan Overtrust","value":"hubungan-dengan-note-ringkasan-overtrust","line":200,"column":0,"depth":3},"related-notes":{"type":"header","text":"Related Notes","value":"related-notes","line":206,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":213,"column":0,"depth":2}},"children":[],"parent":"notes.security.overtrust","data":{}},"body":"\u003ch1 id=\"overtrust-workflow-detail-cara-kerja-local-scanner-dan-trust-boundary\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overtrust-workflow-detail-cara-kerja-local-scanner-dan-trust-boundary\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eOvertrust buat gue bukan alat yang cuma \"ngasih daftar issue\". Dari cara kerjanya, dia lebih kayak audit lokal untuk trust boundary workstation.\u003c/p\u003e\n\u003cp\u003eYang bikin Overtrust beda adalah workflow-nya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edia jalanin scan lokal tanpa cloud,\u003c/li\u003e\n\u003cli\u003edia klasifikasi file dan process,\u003c/li\u003e\n\u003cli\u003edia hitung risiko dengan rule deterministik,\u003c/li\u003e\n\u003cli\u003edia keluarkan output yang bisa ditriage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukti ini nggak cuma feeling: kode asli Overtrust di \u003ccode\u003e.references/overtrust\u003c/code\u003e nunjukin prosesnya jelas. Bahkan sebagian besar logikanya memang hardcoded: pattern secret di \u003ccode\u003esecrets.cpp\u003c/code\u003e, heuristik file kind di \u003ccode\u003eclassifier.cpp\u003c/code\u003e, scoring rule di \u003ccode\u003emanifest.cpp\u003c/code\u003e, dan privilege/process rule di \u003ccode\u003eprocscanner_linux.cpp\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"evidence-langsung-dari-kode\"\u003eEvidence langsung dari kode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evidence-langsung-dari-kode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi \u003ccode\u003esrc/main.cpp\u003c/code\u003e, eksekusi utama masuk ke \u003ccode\u003eovertrust::ScanEngine\u003c/code\u003e dan \u003ccode\u003erun_headless()\u003c/code\u003e. Itu berarti target scan, progress, dan hasil JSON semuanya dikelola di executable, bukan di cloud.\u003c/p\u003e\n\u003cp\u003eDi \u003ccode\u003esrc/scanner/engine.cpp\u003c/code\u003e, ada fase-fase ini:\u003c/p\u003e\n\u003cpre class=\"language-cpp\"\u003e\u003ccode class=\"language-cpp\"\u003e\u003cspan class=\"token comment\"\u003e// Phase 1: Walk filesystem\u003c/span\u003e\n\u003cspan class=\"token function\"\u003ewalk_directory\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003efs\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003e\u003cspan class=\"token function\"\u003epath\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003etarget_\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e files\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e total\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e ignore_patterns\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e// Phase 2: Classify + scan each file\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003efor\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token keyword\"\u003eauto\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u0026#x26;\u003c/span\u003e path \u003cspan class=\"token operator\"\u003e:\u003c/span\u003e files\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    FileKind kind \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003eclassify_file\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003epath\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003eswitch\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ekind\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n      \u003cspan class=\"token keyword\"\u003ecase\u003c/span\u003e FileKind\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003eVsCodeExtension\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\n      \u003cspan class=\"token keyword\"\u003ecase\u003c/span\u003e FileKind\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003eNpmPackageJson\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\n      \u003cspan class=\"token keyword\"\u003ecase\u003c/span\u003e FileKind\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003eDockerfile\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ekind \u003cspan class=\"token operator\"\u003e==\u003c/span\u003e FileKind\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003eTextFile \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n        \u003cspan class=\"token keyword\"\u003eauto\u003c/span\u003e secrets \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003escan_for_secrets\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003econtent\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e pstr\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u0 token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token function\"\u003eshannon_entropy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ematched\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e\u0026#x3C;\u003c/span\u003e pat\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003emin_entropy\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econtinue\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token function\"\u003eis_false_positive\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ematched\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token keyword\"\u003econtinue\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDan untuk scan process, \u003ccode\u003esrc/scanner/procscanner_linux.cpp\u003c/code\u003e ternyata nggak cuma baca PID. Dia filter system daemon, kemudian flag:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eproses user dengan kapabilitas berbahaya (\u003ccode\u003eCAP_SYS_PTRACE\u003c/code\u003e, \u003ccode\u003eCAP_SYS_ADMIN\u003c/code\u003e),\u003c/li\u003e\n\u003cli\u003eroot process tanpa seccomp,\u003c/li\u003e\n\u003cli\u003eproses yang buka sensitive file descriptor,\u003c/li\u003e\n\u003cli\u003eagent AI yang baca sensitive file.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSeperti di kode:\u003c/p\u003e\n\u003cpre class=\"language-cpp\"\u003e\u003ccode class=\"language-cpp\"\u003e\u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token function\"\u003eis_ai_tool\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ep\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e\u0026#x26;\u0026#x26;\u003c/span\u003e \u003cspan class=\"token operator\"\u003e!\u003c/span\u003ep\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003esensitive_fds\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token function\"\u003eempty\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token function\"\u003eadd\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"PROC-004\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e Severity\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003eCritical\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token number\"\u003e9.5\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n        \u003cspan class=\"token string\"\u003e\"AI tool \"\u003c/span\u003e \u003cspan class=\"token operator\"\u003e+\u003c/span\u003e proc_label \u003cspan class=\"token operator\"\u003e+\u003c/span\u003e \u003cspan class=\"token string\"\u003e\" is reading sensitive files\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n        \u003cspan class=\"token string\"\u003e\"Open sensitive FDs: \"\u003c/span\u003e \u003cspan class=\"token operator\"\u003e+\u003c/span\u003e std\u003cspan class=\"token double-colon punctuation\"\u003e::\u003c/span\u003e\u003cspan class=\"token function\"\u003eto_string\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ep\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003esensitive_fds\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token function\"\u003esize\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi bukti dari repo memang konsisten: Overtrust bukan sekadar secret scanner. Dia punya sequencing jelas, rule deterministik, dan process-aware logic yang bisa jadi dasar trust boundary check.\u003c/p\u003e\n\u003cp\u003eIni bukan review cloud, bukan inference AI, dan jelas juga bukan pentest runtime. Overtrust lebih cocok kalau lo lagi mau cek: apakah ada komponen lokal yang bisa nyentuh secret, atau apakah ada process/tool yang bisa nge-eksekusi command berbahaya.\u003c/p\u003e\n\u003ch3 id=\"kerjaannya-dari-gue-lihat\"\u003eKerjaannya dari gue lihat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kerjaannya-dari-gue-lihat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eWalau terdengar sederhana, Overtrust sebenarnya punya beberapa layer logika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ewalker.cpp\u003c/code\u003e untuk jalanin filesystem dan apply ignore path.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eclassifier.cpp\u003c/code\u003e untuk menebak jenis file atau artefak.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emanifest.cpp\u003c/code\u003e buat parse manifest VS Code, npm, Dockerfile.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esecrets.cpp\u003c/code\u003e buat deteksi secret, keyword, regex, entropy, dan guard false positive.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprocscanner_linux.cpp\u003c/code\u003e / \u003ccode\u003eprocscanner_win.cpp\u003c/code\u003e buat scan process dan privilege.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: Overtrust nggak cuma \"baca file dan flag\". Dia juga nanya soal konteks. Contohnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah file itu credential wajar?\u003c/li\u003e\n\u003cli\u003eapakah proses ini berjalan dengan privilege tinggi?\u003c/li\u003e\n\u003cli\u003eapakah ekstensi editor punya auth provider?\u003c/li\u003e\n\u003cli\u003eapakah npm script atau Dockerfile jalanin \u003ccode\u003ecurl | bash\u003c/code\u003e?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSemua ini dikerjain secara lokal, nggak dikirim ke cloud.\u003c/p\u003e\n\u003ch3 id=\"flow-yang-gue-nangkep\"\u003eFlow yang gue nangkep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#flow-yang-gue-nangkep\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePertama, Overtrust inisialisasi scan. Lo kasih root path, dia crawl file lokal. Yang menarik: dia nggak cuma ngebaca repo, tapi dia juga ngecek file di luar repo seperti \u003ccode\u003e~/.aws/credentials\u003c/code\u003e dan \u003ccode\u003e~/.kube/config\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eKedua, dia klasifikasi konten. Gue lihat beberapa contoh penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eDockerfile\u003c/code\u003e bisa berarti risiko root/container atau \u003ccode\u003ecurl | bash\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epackage.json\u003c/code\u003e / \u003ccode\u003enpmrc\u003c/code\u003e bisa jadi tanda install script berbahaya atau credential lepas.\u003c/li\u003e\n\u003cli\u003edotfile seperti \u003ccode\u003e.env\u003c/code\u003e, \u003ccode\u003e.npmrc\u003c/code\u003e, \u003ccode\u003e.pypirc\u003c/code\u003e fokus ke credential state.\u003c/li\u003e\n\u003cli\u003emanifest extension VS Code bisa ngasih sinyal runtime extension yang punya terminal/auth access.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau file itu punya ciri secret, Overtrust nggak langsung flag 100%. Dia cek format, entropy, dan apakah keyword itu masuk akal. Jadi ini bukan alarm tanpa filtro.\u003c/p\u003e\n\u003ch3 id=\"beda-paling-penting-process-dan-privilege\"\u003eBeda paling penting: process dan privilege\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#beda-paling-penting-process-dan-privilege\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini yang bikin Overtrust bukan sekadar secret scanner biasa.\u003c/p\u003e\n\u003cp\u003eUntuk Linux, dia lihat process yang jalan dengan privilege kayak:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCAP_SYS_PTRACE\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eCAP_SYS_ADMIN\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003efile descriptor sensitif\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk Windows, dia lihat token seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSeDebugPrivilege\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSeTcbPrivilege\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eelevated token\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi, bukan cuma \"ada secret di disk\". Dia juga nanya, \"ada process yang bisa baca secret itu sekarang nggak?\"\u003c/p\u003e\n\u003ch3 id=\"evaluasi-trust-boundary\"\u003eEvaluasi trust boundary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evaluasi-trust-boundary\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDari seluruh deteksi tadi, Overtrust merangkai risk boundary:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah extension editor bisa jalankan terminal atau akses data?\u003c/li\u003e\n\u003cli\u003eapakah process punya privilege yang bisa ngexfiltrate?\u003c/li\u003e\n\u003cli\u003eapakah ada manifest yang nge-trigger command berbahaya?\u003c/li\u003e\n\u003cli\u003eapakah credential file itu accessible?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue suka bagian ini karena dia mendorong kita mikir ulang tentang workstation: bukan cuma repo, tapi boundary antara manusia, tool, dan secret.\u003c/p\u003e\n\u003ch3 id=\"outputnya-bukan-sekadar-flag\"\u003eOutputnya bukan sekadar flag\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#outputnya-bukan-sekadar-flag\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHasil scan Overtrust bukan list issue doang. Dia ngasih skor, kategori, dan konteks. Dari situ, lo bisa langsung triage:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eissue mana kritis karena process privileged?\u003c/li\u003e\n\u003cli\u003eissue mana low-risk karena file credentialnya nggak aktif atau hanyalah config dev?\u003c/li\u003e\n\u003cli\u003eissue mana false positive karena manifest cuma buat dev biasa?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMakanya gue bilang, kalau \u003ccode\u003enotes.security.overtrust\u003c/code\u003e cuma ringkas, kita bisa kehilangan inti workflow lokal dan trust boundary yang sebenarnya.\u003c/p\u003e\n\u003ch3 id=\"kenapa-ini-penting-buat-gue\"\u003eKenapa ini penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOvertrust jadi relevan buat gue di dua keadaan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esebelum jalanin agentic tool, cek dulu apakah workstation punya trust gap.\u003c/li\u003e\n\u003cli\u003esaat nge-review lingkungan dev, karena perhatian seharusnya nggak berhenti di repo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo cuma anggap ini \u003ccode\u003esecrets scanner\u003c/code\u003e, lo kelewatan. Ini lebih tentang \"siapa yang bisa baca secret\" dan \"siapa yang bisa ngejalanin command\".\u003c/p\u003e\n\u003ch3 id=\"kelemahan-yang-harus-diakui\"\u003eKelemahan yang harus diakui\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kelemahan-yang-harus-diakui\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSekalipun gue suka, gue juga ngerasa ini bukan jawaban semua.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eini bukan vulnerability scanner aplikasi.\u003c/li\u003e\n\u003cli\u003eini bukan alat untuk runtime exploit di cloud.\u003c/li\u003e\n\u003cli\u003eini nggak punya threat intel package reputation.\u003c/li\u003e\n\u003cli\u003eini rule-based, jadi butuh maintenance kalau ekosistem tool atau extension bergeser.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi dalam gaya gue: ini bagus buat audit lokal dan boundary, tapi jangan disalahartikan sebagai pengganti pentest atau SAST.\u003c/p\u003e\n\u003ch3 id=\"hubungan-dengan-note-ringkasan-overtrust\"\u003eHubungan dengan note ringkasan Overtrust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan-dengan-note-ringkasan-overtrust\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003enotes.security.overtrust\u003c/code\u003e tetap versi high-level. Note ini gue buat supaya ada versi detail yang jelas gaya gue dan tetap cerita dari sudut pandang developer.\u003c/p\u003e\n\u003cp\u003eKalau lo mau baca yang ringkas dulu, buka \u003ccode\u003e[[notes.security.overtrust]]\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated Notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.agentic-coding-permission-boundary\"\u003eAgentic coding permission boundary dan risiko filesystem lokal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-docs\"\u003eDeepsec docs: workflow harness, bukan scanner sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-harness\"\u003eDeepsec: security harness untuk codebase besar\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/cheese-cakee/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.references/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/main.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/engine.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/classifier.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/secrets.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/procscanner_linux.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u0
