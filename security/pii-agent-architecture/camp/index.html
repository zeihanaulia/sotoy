:"notes.security.pii-agent-architecture.camp.per-turn-masking","id":"notes.security.pii-agent-architecture.camp.per-turn-masking","vaultName":"vault"},"type":"backlink","position":{"start":{"line":40,"column":3,"offset":1869},"end":{"line":40,"column":49,"offset":1915},"indent":[]},"value":"notes.security.pii-agent-architecture.camp"},{"from":{"fname":"notes.security.pii-agent-architecture.camp.why-camp","id":"notes.security.pii-agent-architecture.camp.why-camp","vaultName":"vault"},"type":"backlink","position":{"start":{"line":76,"column":3,"offset":3713},"end":{"line":76,"column":49,"offset":3759},"indent":[]},"value":"notes.security.pii-agent-architecture.camp"}],"anchors":{"problem":{"type":"header","text":"Problem","value":"problem","line":16,"column":0,"depth":2},"three-question-lens":{"type":"header","text":"Three-question lens","value":"three-question-lens","line":19,"column":0,"depth":2},"cumulative-pii-exposure-cpe":{"type":"header","text":"Cumulative PII Exposure (CPE)","value":"cumulative-pii-exposure-cpe","line":32,"column":0,"depth":2},"camp-architecture":{"type":"header","text":"CAMP architecture","value":"camp-architecture","line":49,"column":0,"depth":2},"threshold-dan-trade-off":{"type":"header","text":"Threshold dan trade-off","value":"threshold-dan-trade-off","line":65,"column":0,"depth":2},"why-this-matters":{"type":"header","text":"Why this matters","value":"why-this-matters","line":72,"column":0,"depth":2},"limitations":{"type":"header","text":"Limitations","value":"limitations","line":80,"column":0,"depth":2},"related-zettel":{"type":"header","text":"Related zettel","value":"related-zettel","line":87,"column":0,"depth":2}},"children":["notes.security.pii-agent-architecture.camp.cpe","notes.security.pii-agent-architecture.camp.indexed-masking","notes.security.pii-agent-architecture.camp.per-turn-masking","notes.security.pii-agent-architecture.camp.why-camp"],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"camp-cross-turn-pii-protection-for-llm-conversations\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#camp-cross-turn-pii-protection-for-llm-conversations\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"problem\"\u003eProblem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini menegaskan bahwa proteksi PII untuk agentic multi-turn masih terlalu stateless. Sistem seperti Presidio, PAPILLON, dan adaptive masking lain sering memeriksa satu pesan per turn, lalu hasilnya hilang begitu saja. Padahal history percakapan yang terus dikirim ulang ke LLM bisa menggabungkan potongan-potongan kecil menjadi profil yang cukup kuat untuk re-identification.\u003c/p\u003e\n\u003ch2 id=\"three-question-lens\"\u003eThree-question lens\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#three-question-lens\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini sebenarnya dibangun dari tiga pertanyaan berurutan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapa yang salah dengan per-turn masking?\u003c/li\u003e\n\u003cli\u003eapa yang baru dari Cumulative PII Exposure (CPE)?\u003c/li\u003e\n\u003cli\u003eapa yang baru dari CAMP sebagai solusi?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo paham tiga ini, lo bisa menilai apakah CAMP cuma \"masking baru\" atau benar-benar perubahan unit analisis dari message-level ke session-level.\u003c/p\u003e\n\u003cp\u003eUntuk pembahasan mendalam soal per-turn masking, lihat \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e.\nUntuk pembahasan mendalam soal CPE, lihat \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e.\nUntuk pembahasan mendalam soal solusi CAMP, lihat \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e.\nUntuk pembahasan indexed masking / tokenized pseudonymization, lihat \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"cumulative-pii-exposure-cpe\"\u003eCumulative PII Exposure (CPE)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cumulative-pii-exposure-cpe\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCAMP memperkenalkan CPE sebagai metrik session-level. Prinsipnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukan hanya apakah satu message mengandung PII,\u003c/li\u003e\n\u003cli\u003etetapi apakah kombinasi entitas yang terkumpul sepanjang session sudah berisiko.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSetiap tipe entitas diberi bobot sensitivitas berbeda: SSN/credit card 1.0, date of birth 0.9, medical 0.85, email 0.8, phone 0.75, person/salary 0.6, location/IP 0.5, organization 0.3.\u003c/p\u003e\n\u003cp\u003eLalu paper menambahkan co-occurrence graph:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enode = tipe entitas yang muncul di session,\u003c/li\u003e\n\u003cli\u003eedge = dua tipe entitas muncul bersama dalam session.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKarena risiko tidak linear, entity baru bisa menaikkan skor lebih besar jika dia terhubung ke banyak entity lain. Formula yang dipakai mirip:\u003c/p\u003e\n\u003cp\u003eCPE = Σ weight(v) × (1 + α × degree(v))\u003c/p\u003e\n\u003cp\u003eJadi satu entity yang \"terhubung\" ke banyak entitas lain memberi amplifikasi risiko.\u003c/p\u003e\n\u003ch2 id=\"camp-architecture\"\u003eCAMP architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#camp-architecture\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSolusi CAMP bekerja sebagai middleware antara user dan external LLM. Komponennya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePer-turn PII extractor\u003c/strong\u003e: masih deteksi PII seperti sistem lama, tetapi hasilnya disimpan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSession registry\u003c/strong\u003e: menyimpan semua entitas PII yang pernah muncul, lengkap dengan tipe, nilai asli, dan turn pertama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCo-occurrence graph + CPE scorer\u003c/strong\u003e: menghitung risiko kombinasi antar entitas sepanjang session.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHard block rules\u003c/strong\u003e: tipe sangat sensitif (SSN, kartu kredit, bank account) langsung diblokir sejak awal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRetroactive pseudonymization\u003c/strong\u003e: ketika threshold terlampaui, tulis ulang seluruh history dengan pseudonym yang konsisten.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDe-masking layer\u003c/strong\u003e: setelah LLM menjawab, ganti synthetic values kembali ke nilai asli sebelum ditampilkan ke user.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh efeknya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehistory asli: \"Nama gue Andi\", \"Gue tinggal di Bandung\", \"Gue kerja di Tokopedia\", \"Gaji gue 28 juta\"\u003c/li\u003e\n\u003cli\u003ehistory pseudo: \"Nama gue Budi\", \"Gue tinggal di Surabaya\", \"Gue kerja di Acme Corp\", \"Gaji gue 21 juta\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eExternal LLM hanya melihat history pseudo. User tetap mendapat jawaban personal setelah de-masking.\u003c/p\u003e\n\u003ch2 id=\"threshold-dan-trade-off\"\u003eThreshold dan trade-off\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#threshold-dan-trade-off\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCAMP punya knob privasi: threshold CPE.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethreshold rendah = proteksi lebih cepat, context lebih sering dipseudonymize,\u003c/li\u003e\n\u003cli\u003ethreshold tinggi = lebih banyak konteks asli lewat, tapi risiko terlambat proteksi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDomain seperti healthcare dan finance harus lebih konservatif. General assistant bisa pakai threshold lebih longgar.\u003c/p\u003e\n\u003ch2 id=\"why-this-matters\"\u003eWhy this matters\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-this-matters\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk security agent design, paper ini mengubah perspektif dari \"masking per pesan\" ke \"mengelola risiko PII pada level sesi\".\u003c/p\u003e\n\u003cp\u003eImplikasinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent harus punya stateful PII registry,\u003c/li\u003e\n\u003cli\u003eproteksi harus sadar \u003cstrong\u003ecumulative exposure\u003c/strong\u003e, bukan hanya \u003cstrong\u003ecurrent message content\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003eretroactive rewriting bisa jadi mekanisme penting ketika seluruh history sudah melewati batas risiko.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"limitations\"\u003eLimitations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#limitations\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCAMP bergantung pada kualitas deteksi PII. Implicit disclosure atau phrasing yang tidak eksplisit masih bisa lolos.\u003c/li\u003e\n\u003cli\u003eEksperimennya synthetic dan belum diuji pada percakapan nyata yang noisy.\u003c/li\u003e\n\u003cli\u003eBobot entitas dan parameter α masih bersifat heuristic.\u003c/li\u003e\n\u003cli\u003ePseudonymization bisa mengganggu semantics untuk kasus tertentu jika tidak preserve meaning dengan hati-hati.\u003c/li\u003e\n\u003cli\u003eDe-masking sulit jika model memparafrase nilai synthetic secara tidak terduga.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettel\"\u003eRelated zettel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettel\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777875390302\"\u003eCross-turn PII exposure requires session-aware masking, not per-turn masking\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOriginal paper: \u003ca href=\"https://arxiv.org/abs/2604.16521\"\u003ehttps://arxiv.org/abs/2604.16521\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ellm (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777875390302\"\u003eCross-turn PII exposure requires session-aware masking, not per-turn masking\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777878417390\"\u003eAgentic privacy lebih baik dengan typed indexed placeholders daripada fake identities\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777881085671\"\u003eThreshold-based session privacy still leaves pre-trigger exposure\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X
