architecture","vaultName":"vault"},"type":"backlink","position":{"start":{"line":56,"column":236,"offset":3866},"end":{"line":56,"column":290,"offset":3920},"indent":[]},"value":"notes.security.pii-agent-architecture.llm-redactor"}],"anchors":{"problem":{"type":"header","text":"Problem","value":"problem","line":15,"column":0,"depth":2},"threat-model":{"type":"header","text":"Threat model","value":"threat-model","line":20,"column":0,"depth":2},"delapan-teknik-yang-dievaluasi":{"type":"header","text":"Delapan teknik yang dievaluasi","value":"delapan-teknik-yang-dievaluasi","line":46,"column":0,"depth":2},"a--local-only-inference":{"type":"header","text":"A — Local-only inference","value":"a--local-only-inference","line":50,"column":0,"depth":3},"b--redaction-dengan-placeholder-restoration":{"type":"header","text":"B — Redaction dengan placeholder restoration","value":"b--redaction-dengan-placeholder-restoration","line":74,"column":0,"depth":3},"c--semantic-rephrasing":{"type":"header","text":"C — Semantic rephrasing","value":"c--semantic-rephrasing","line":81,"column":0,"depth":3},"d--tee-hosted-inference":{"type":"header","text":"D — TEE-hosted inference","value":"d--tee-hosted-inference","line":91,"column":0,"depth":3},"e--split-inference":{"type":"header","text":"E — Split inference","value":"e--split-inference","line":99,"column":0,"depth":3},"f--fully-homomorphic-encryption":{"type":"header","text":"F — Fully Homomorphic Encryption","value":"f--fully-homomorphic-encryption","line":105,"column":0,"depth":3},"g--secure-multi-party-computation":{"type":"header","text":"G — Secure Multi-Party Computation","value":"g--secure-multi-party-computation","line":109,"column":0,"depth":3},"h--differential-privacy-noise":{"type":"header","text":"H — Differential Privacy noise","value":"h--differential-privacy-noise","line":115,"column":0,"depth":3},"benchmark-mereka":{"type":"header","text":"Benchmark mereka","value":"benchmark-mereka","line":121,"column":0,"depth":2},"hasil-utama":{"type":"header","text":"Hasil utama","value":"hasil-utama","line":143,"column":0,"depth":2},"insight-paling-kuat":{"type":"header","text":"Insight paling kuat","value":"insight-paling-kuat","line":166,"column":0,"depth":2},"relevansi-ke-agent-system":{"type":"header","text":"Relevansi ke agent system","value":"relevansi-ke-agent-system","line":185,"column":0,"depth":2},"praktik-arsitektur-yang-gue-ambil":{"type":"header","text":"Praktik arsitektur yang gue ambil","value":"praktik-arsitektur-yang-gue-ambil","line":201,"column":0,"depth":2},"kritik-paper":{"type":"header","text":"Kritik paper","value":"kritik-paper","line":246,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":254,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"llm-redactor-privacy-preserving-llm-requests\"\u003eLLM-Redactor: Privacy-Preserving LLM Requests\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#llm-redactor-privacy-preserving-llm-requests\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"problem\"\u003eProblem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLLM-Redactor mengangkat problem yang sangat praktis: ketika aplikasi, coding agent, atau workflow LLM-powered mengirim prompt ke cloud API, isi prompt itu bisa mengandung PII, secret, kode proprietary, nama organisasi, konteks internal, atau informasi sensitif lain.\u003c/p\u003e\n\u003cp\u003ePaper ini menegaskan bahwa TLS tidak cukup. TLS hanya melindungi dari network observer, bukan dari vendor LLM, log vendor, telemetry pihak ketiga, subpoena, atau kemungkinan data dipakai ulang untuk training dan debugging.\u003c/p\u003e\n\u003ch2 id=\"threat-model\"\u003eThreat model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#threat-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang mereka fokuskan bukan sekadar hacker di jaringan. Ancaman utama yang mereka modelkan adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evendor log exfiltration;\u003c/li\u003e\n\u003cli\u003etraining contamination;\u003c/li\u003e\n\u003cli\u003ethird-party telemetry;\u003c/li\u003e\n\u003cli\u003etiming side channel;\u003c/li\u003e\n\u003cli\u003eplaceholder leakage;\u003c/li\u003e\n\u003cli\u003eadversarial input yang sengaja mem-bypass detector.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk gue, bagian paling penting adalah training contamination.\u003c/p\u003e\n\u003cp\u003eItu bukan hanya soal data dipakai buat training model utama. Itu soal kehilangan kontrol penuh setelah prompt keluar dari boundary kita dan masuk ke sistem vendor.\u003c/p\u003e\n\u003cp\u003eTraining contamination artinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt bisa tersimpan di log vendor atau database debugging (retention contamination);\u003c/li\u003e\n\u003cli\u003eprompt bisa dibuka di dashboard internal, annotation tool, atau bug review (review contamination);\u003c/li\u003e\n\u003cli\u003eprompt bisa dipakai sebagai contoh untuk menguji model di masa depan (evaluation contamination);\u003c/li\u003e\n\u003cli\u003eprompt bisa masuk ke dataset untuk fine-tuning, reward model, classifier, atau policy model (fine-tuning contamination);\u003c/li\u003e\n\u003cli\u003eprompt bisa membuat model menghafal pola unik dan regurgitate data mirip nanti (memorization/regurgitation risk).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi threat model paper ini, vendor dianggap curious tapi tidak jahat: data bisa disimpan, dianalisis, atau diproses untuk improvement tanpa ada niat nyerang. Kalau data sensitif kita masuk ke jalur itu, organisasi kita kehilangan kontrol atas nasib data tersebut.\u003c/p\u003e\n\u003cp\u003eDari sini jelas: privacy request LLM bukan fitur tunggal. Itu kombinasi threat model, workload, cost, latency, dan utility.\u003c/p\u003e\n\u003ch2 id=\"delapan-teknik-yang-dievaluasi\"\u003eDelapan teknik yang dievaluasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#delapan-teknik-yang-dievaluasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini membandingkan delapan pendekatan privacy untuk request LLM.\u003c/p\u003e\n\u003ch3 id=\"a--local-only-inference\"\u003eA — Local-only inference\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a--local-only-inference\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni pendekatan paling aman: jangan kirim request ke cloud kalau bisa dijawab lokal.\u003c/p\u003e\n\u003cp\u003eMenariknya, paper ini tidak memaknai Option A sebagai \"semua request harus diproses lokal.\" Mereka menempatkannya sebagai gatekeeper atau classifier yang memutuskan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIncoming prompt\n      ↓\nLocal classifier / triage model\n      ↓\nApakah request cukup sederhana?\n      ↓\nYa → jawab pakai local model\nTidak → lanjut ke cloud pipeline\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKelebihan: untuk request yang di-handle lokal, leak rate = 0 secara konstruksi karena tidak ada data outbound ke vendor.\nKekurangan: kualitas model lokal terbatas; kalau classifier salah memilih lokal, user bisa dapat jawaban jelek.\u003c/p\u003e\n\u003cp\u003eAngka 94.4% muncul dari Table 6 di paper untuk WL1 PII-heavy prose: 472 prompt local dari 500 total, yaitu 94.4%. Itu bukan klaim umum untuk semua sistem. Itu adalah hasil paper pada dataset sintetis WL1, yang berisi prompt bahasa natural bertemplate dan PII eksplisit.\u003c/p\u003e\n\u003cp\u003eJadi insight yang lebih aman adalah: untuk dataset PII-heavy prose sederhana, local routing dapat menghindari sebagian besar cloud calls. Untuk workload lain, angka itu turun drastis.\u003c/p\u003e\n\u003ch3 id=\"b--redaction-dengan-placeholder-restoration\"\u003eB — Redaction dengan placeholder restoration\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b--redaction-dengan-placeholder-restoration\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSensitive span dideteksi lalu diganti placeholder, misalnya \u003ccode\u003e⟨PERSON_1⟩\u003c/code\u003e atau \u003ccode\u003e⟨EMAIL_1⟩\u003c/code\u003e. Mapping disimpan lokal sehingga response bisa direstore.\u003c/p\u003e\n\u003cp\u003eKelebihannya jelas: efektif untuk data dengan pola eksplisit seperti email, phone, IP, SSN, AWS key, dan bearer token.\nKelemahannya: sangat bergantung pada recall detector. Jika detector gagal menangkap nama organisasi, proprietary code, atau implicit identity, data masih bocor.\u003c/p\u003e\n\u003ch3 id=\"c--semantic-rephrasing\"\u003eC — Semantic rephrasing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c--semantic-rephrasing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sini prompt direwrite oleh model lokal supaya detail identitas dihilangkan.\u003c/p\u003e\n\u003cp\u003eContoh: \u003ccode\u003eThe CFO of Acme Corp whose wife works at a competitor...\u003c/code\u003e jadi \u003ccode\u003eA senior executive with a potential conflict of interest...\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eMasalahnya: identitas kadang memang bagian dari makna prompt. Kalau konteks yang dihapus terlalu banyak, prompt jadi tidak berguna.\u003c/p\u003e\n\u003cp\u003ePaper ini menunjukkan bahwa semantic rephrasing membantu di beberapa workload, terutama proprietary code, tetapi gagal di implicit identity. Untuk WL3, leak rate semantiknya tetap 95-100%.\u003c/p\u003e\n\u003ch3 id=\"d--tee-hosted-inference\"\u003eD — TEE-hosted inference\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d--tee-hosted-inference\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePrompt masih dikirim plaintext, tetapi diproses di enclave terpadu yang diverifikasi.\u003c/p\u003e\n\u003cp\u003ePrivacy datang dari hardware isolation, bukan dari encrypting prompt. Ini cocok untuk konteks sensitif di mana mask tidak cukup.\u003c/p\u003e\n\u003cp\u003eTrade-off: infra kompleks, need attestation, dan masih butuh trust pada hardware vendor.\u003c/p\u003e\n\u003ch3 id=\"e--split-inference\"\u003eE — Split inference\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#e--split-inference\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eModel dibagi dua: layer awal jalan lokal, lalu activation dikirim ke remote.\u003c/p\u003e\n\u003cp\u003eIde bagus: token asli tidak dikirim. Namun activation itself bisa bocor lewat attack inversion, jadi ini bukan santapan privasi instan.\u003c/p\u003e\n\u003ch3 id=\"f--fully-homomorphic-encryption\"\u003eF — Fully Homomorphic Encryption\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#f--fully-homomorphic-encryption\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSecara teori kuat: data tetap terenkripsi. Tapi untuk LLM penuh, belum praktis. Paper hanya mendemonstrasikan classifier kecil, bukan full chat model.\u003c/p\u003e\n\u003ch3 id=\"g--secure-multi-party-computation\"\u003eG — Secure Multi-Party Computation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#g--secure-multi-party-computation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eInput dipecah menjadi secret shares dan diproses oleh server non-colluding.\u003c/p\u003e\n\u003cp\u003ePrivacy-nya kuat jika asumsi non-collusion benar, tetapi overhead dan setup-nya tinggi. Untuk full LLM inference, masih lebih research proof-of-concept.\u003c/p\u003e\n\u003ch3 id=\"h--differential-privacy-noise\"\u003eH — Differential Privacy noise\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#h--differential-privacy-noise\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenambahkan noise pada kata tertentu. Paper pakai ε=4 dan 1.8% kata eligible diganti.\u003c/p\u003e\n\u003cp\u003eIntinya: DP noise bisa membantu sebagai lapisan tambahan, tapi tidak efektif sebagai solusi utama untuk request LLM. Kalau yang bocor adalah API key atau identifier khusus, random substitution belum tentu tepat sasaran.\u003c/p\u003e\n\u003ch2 id=\"benchmark-mereka\"\u003eBenchmark mereka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#benchmark-mereka\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBenchmark sintetis berisi 1.300 prompt dengan 4.014 annotation sensitive spans.\u003c/p\u003e\n\u003cp\u003eEmpat workload:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWL1 — PII-heavy prose (500 sample, 1.946 annotation)\u003c/li\u003e\n\u003cli\u003eWL2 — Secret-heavy configuration (300 sample, 730 annotation)\u003c/li\u003e\n\u003cli\u003eWL3 — Implicit identity (200 sample, 220 annotation)\u003c/li\u003e\n\u003cli\u003eWL4 — Proprietary code (300 sample, 1.118 annotation)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi Table 6, paper juga menunjukkan local routing rate Option A:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWL1 PII: 472 local / 500 total = 94.4%\u003c/li\u003e\n\u003cli\u003eWL2 Secrets: 224 local / 300 total = 74.7%\u003c/li\u003e\n\u003cli\u003eWL3 Implicit: 108 local / 200 total = 54.0%\u003c/li\u003e\n\u003cli\u003eWL4 Code: 114 local / 300 total = 38.0%\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu memperjelas bahwa 94.4% hanya berlaku untuk WL1 yang relatif ringan, dan kemampuan local routing turun saat task jadi lebih semantik atau kode-heavy.\u003c/p\u003e\n\u003cp\u003eKelemahan benchmark: sintetis dan lebih rapi daripada prompt dunia nyata. Real prompt jauh lebih messy, dengan bahasa campur, typos, screenshot OCR, log production, dan kode panjang.\u003c/p\u003e\n\u003ch2 id=\"hasil-utama\"\u003eHasil utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hasil-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling penting: tidak ada teknik tunggal yang menang di semua kondisi.\u003c/p\u003e\n\u003cp\u003ePaper ini menyimpulkan kombinasi praktis terbaik adalah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eA + B + C\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eArtinya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eroute lokal kalau bisa,\u003c/li\u003e\n\u003cli\u003ekalau harus ke cloud, lakukan redaction,\u003c/li\u003e\n\u003cli\u003elalu semantic rephrasing.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eHasilnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWL1 PII: combined leak ~0.6%, zero exact leak across 500 samples.\u003c/li\u003e\n\u003cli\u003eWL2 secret: combined leak ~6.4%.\u003c/li\u003e\n\u003cli\u003eWL4 proprietary code: combined leak ~31.3%.\u003c/li\u003e\n\u003cli\u003eWL3 implicit identity: combined leak ~43.6%, dengan semantic leak masih 95-100% failure untuk redaction/rephrasing.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: untuk PII eksplisit, local+redaction+rephrase efektif. Untuk implicit identity dan proprietary code, masking saja tidak cukup.\u003c/p\u003e\n\u003ch2 id=\"insight-paling-kuat\"\u003eInsight paling kuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-paling-kuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini tidak terjebak klaim simplistik seperti “pakai redaction, privacy solved.”\u003c/p\u003e\n\u003cp\u003eRedaction kuat untuk level 1 kebocoran: email, phone, IP, SSN, hostname, employee ID setelah custom recognizer.\u003c/p\u003e\n\u003cp\u003eTapi lemah untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eperson name,\u003c/li\u003e\n\u003cli\u003eorganization name,\u003c/li\u003e\n\u003cli\u003eaddress,\u003c/li\u003e\n\u003cli\u003eimplicit identity,\u003c/li\u003e\n\u003cli\u003eproprietary context.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau disederhanakan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLevel 1: direct identifiers — redaction efektif.\u003c/li\u003e\n\u003cli\u003eLevel 2: quasi-identifiers — perlu detector dan contextual rules.\u003c/li\u003e\n\u003cli\u003eLevel 3: semantic identity — rephrase bisa membantu, tapi tidak cukup.\u003c/li\u003e\n\u003cli\u003eLevel 4: proprietary context — mungkin perlu local model, TEE, atau refusal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relevansi-ke-agent-system\"\u003eRelevansi ke agent system\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevansi-ke-agent-system\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk sistem agent, relevance-nya besar karena agent punya surface area lebih luas daripada chatbot biasa.\u003c/p\u003e\n\u003cp\u003eAgent tidak cuma mengirim prompt awal. Agent bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eretrieve konteks dari repo atau doc,\u003c/li\u003e\n\u003cli\u003ememanggil tool,\u003c/li\u003e\n\u003cli\u003emenyusun prompt intermediate,\u003c/li\u003e\n\u003cli\u003emenyimpan memory,\u003c/li\u003e\n\u003cli\u003emelakukan subagent handoff,\u003c/li\u003e\n\u003cli\u003emenulis artifact.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi kebocoran bisa terjadi di prompt request, tool args, scratchpad, trace, memory store, atau generated artifact.\u003c/p\u003e\n\u003cp\u003ePaper ini fokus pada outbound LLM request pipeline. Tapi idenya bisa diperluas jadi privacy gateway di depan semua LLM call dan agent boundary.\u003c/p\u003e\n\u003ch2 id=\"praktik-arsitektur-yang-gue-ambil\"\u003ePraktik arsitektur yang gue ambil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktik-arsitektur-yang-gue-ambil\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePipeline praktis yang gue tarik adalah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUser request / Agent context\n        ↓\nSensitivity classifier\n        ↓\nPolicy decision\n        ↓\nLocal route / Redact / Rephrase / TEE / Refuse\n        ↓\nCloud LLM or Local LLM\n        ↓\nPost-processing + Placeholder restoration\n        ↓\nResponse\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk agent system, gue tambahkan layer:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eInput\n  ↓\nDocument/context scanner\n  ↓\nPII + secret + proprietary detector\n  ↓\nRisk scoring\n  ↓\nPolicy router\n  ├── local model\n  ├── cloud redaction\n  ├── cloud redaction + rephrase\n  ├── TEE\n  └── refuse / approval\n  ↓\nTrace sanitizer\n  ↓\nOutput sanitizer\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTrace sanitizer penting, karena banyak sistem agent sekarang pakai Langfuse, LangSmith, atau observability custom. Kalau raw prompt masuk trace, mask saja tidak cukup.\u003c/p\u003e\n\u003ch2 id=\"kritik-paper\"\u003eKritik paper\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kritik-paper\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebenchmark sintetis, tidak mewakili messy prompt dunia nyata.\u003c/li\u003e\n\u003cli\u003eutility evaluation terbatas pada local Qwen 3.5 4B dan Llama 3.2 3B.\u003c/li\u003e\n\u003cli\u003eOption D–G lebih berupa demonstrasi proofof-concept daripada deployment production.\u003c/li\u003e\n\u003cli\u003ebeberapa klaim tampak ambigu, terutama pada angka implicit identity.\u003c/li\u003e\n\u003cli\u003esemantic leak analysis hanya pada subset kecil WL3.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLLM-Redactor menguatkan satu prinsip yang gue pegang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eprivacy-preserving LLM request bukan hanya soal masking, itu soal routing, detection, transformation, trust boundary, dan policy.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePraktis hari ini: kombinasi local routing + redaction + semantic rephrasing adalah baseline yang layak. Untuk implicit identity dan proprietary context, solusi paling aman adalah jangan kirim ke cloud biasa.\u003c/p\u003e\n\u003cp\u003eOriginal paper: \u003ca href=\"https://arxiv.org/abs/2604.12064\"\u003ehttps://arxiv.org/abs/2604.12064\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ellm (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"w
