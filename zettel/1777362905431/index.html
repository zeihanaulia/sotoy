,"column":3,"offset":2227},"end":{"line":45,"column":48,"offset":2272},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.the-developers-guide-to-ai"}}],"anchors":{"ide-inti":{"type":"header","text":"Ide inti","value":"ide-inti","line":19,"column":0,"depth":2},"quote-baseline":{"type":"header","text":"Quote baseline","value":"quote-baseline","line":23,"column":0,"depth":2},"kenapa-ini-core":{"type":"header","text":"Kenapa ini core","value":"kenapa-ini-core","line":27,"column":0,"depth":2},"apa-yang-bikin-ini-beda":{"type":"header","text":"Apa yang bikin ini beda","value":"apa-yang-bikin-ini-beda","line":31,"column":0,"depth":2},"implikasi":{"type":"header","text":"Implikasi","value":"implikasi","line":38,"column":0,"depth":2},"mengapa-ini-penting-untuk-arsitektur-ai":{"type":"header","text":"Mengapa ini penting untuk arsitektur AI","value":"mengapa-ini-penting-untuk-arsitektur-ai","line":46,"column":0,"depth":2},"hubungan":{"type":"header","text":"Hubungan","value":"hubungan","line":50,"column":0,"depth":2},"sumber":{"type":"header","text":"Sumber","value":"sumber","line":58,"column":0,"depth":2}},"children":[],"parent":"zettel","data":{}},"body":"\u003ch1 id=\"grounding-adalah-menyuplai-konteks-yang-hilang-saat-inference-tanpa-mengubah-model\"\u003eGrounding adalah menyuplai konteks yang hilang saat inference tanpa mengubah model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#grounding-adalah-menyuplai-konteks-yang-hilang-saat-inference-tanpa-mengubah-model\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ide-inti\"\u003eIde inti\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ide-inti\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang gue tangkap dari quote ini adalah: kalau model nggak tahu sesuatu, itu nggak selalu berarti kita harus melatih ulang atau ganti model. Kita bisa memberi model konteks yang hilang pada saat inference agar jawabannya terikat ke fakta dan domain yang benar.\u003c/p\u003e\n\u003ch2 id=\"quote-baseline\"\u003eQuote baseline\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#quote-baseline\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“You can work around this constraint by providing the missing context within your prompt at inference time. This is referred to as AI grounding.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"kenapa-ini-core\"\u003eKenapa ini core\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-core\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eQuote ini penting karena dia memindahkan solusi dari perubahan model ke perubahan input. Sebelum ini, gampang berpikir bahwa knowledge gap harus diatasi dengan fine-tuning, model baru, atau data training tambahan. Di sini buku bilang: tunggu dulu, coba dulu tambahkan konteks pada runtime.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-bikin-ini-beda\"\u003eApa yang bikin ini beda\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-bikin-ini-beda\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\"work around this constraint\" artinya batasan model tetap ada.\u003c/li\u003e\n\u003cli\u003e\"missing context\" artinya yang hilang bukan kemampuan bahasa, tapi fakta domain, data privat, atau informasi terbaru.\u003c/li\u003e\n\u003cli\u003e\"within your prompt\" artinya grounding awalnya masih sederhana: letakkan informasi relevan langsung di prompt.\u003c/li\u003e\n\u003cli\u003e\"at inference time\" artinya ini adalah intervensi runtime, bukan training time.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"implikasi\"\u003eImplikasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implikasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGrounding adalah strategi runtime, bukan perubahan model.\u003c/li\u003e\n\u003cli\u003eIni jauh lebih cepat, murah, dan aman untuk data privat dibanding fine-tuning.\u003c/li\u003e\n\u003cli\u003eIni cocok untuk hal-hal yang dinamis seperti dokumen produk terbaru, ticket state, atau kebijakan internal.\u003c/li\u003e\n\u003cli\u003eIni memberi batas yang jelas antara knowledge injection dan model skill change.\u003c/li\u003e\n\u003cli\u003eManual grounding yang bekerja pada tahap awal nanti bisa diskalakan menjadi RAG.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mengapa-ini-penting-untuk-arsitektur-ai\"\u003eMengapa ini penting untuk arsitektur AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-ini-penting-untuk-arsitektur-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMomen ini buat gue adalah pergeseran dari \"model-centric\" ke \"system-centric\". Ada kemampuan model, tapi bukan itu satu-satunya variabel. Arsitektur sistem di sekeliling model punya peran utama dalam memastikan outputnya grounded.\u003c/p\u003e\n\u003ch2 id=\"hubungan\"\u003eHubungan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449641\"\u003eLLM membutuhkan grounding untuk bisa berguna\u003c/a\u003e — grounding umum\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449651\"\u003eLocal model membantu belajar integrasi tanpa vendor noise\u003c/a\u003e — local model sebagai media belajar integrasi\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449645\"\u003eInference dan training adalah dua tahap berbeda\u003c/a\u003e — inference vs training\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449647\"\u003eHallucination adalah konsekuensi arsitektural LLM\u003c/a\u003e — hallucination\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777349193467\"\u003eNilai model dibatasi oleh distribusi data latihnya\u003c/a\u003e — knowledge limit dan grounding\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sumb
