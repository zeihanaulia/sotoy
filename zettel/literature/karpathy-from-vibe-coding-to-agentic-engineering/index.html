vaultName":"vault"},"type":"backlink","position":{"start":{"line":117,"column":3,"offset":9990},"end":{"line":117,"column":73,"offset":10060},"indent":[]},"value":"zettel.literature.karpathy-from-vibe-coding-to-agentic-engineering"}],"anchors":{"claim":{"type":"header","text":"Claim","value":"claim","line":17,"column":0,"depth":2},"evidence":{"type":"header","text":"Evidence","value":"evidence","line":20,"column":0,"depth":2},"llm-knowledge-base":{"type":"header","text":"LLM knowledge base","value":"llm-knowledge-base","line":28,"column":0,"depth":2},"external-support":{"type":"header","text":"External support","value":"external-support","line":33,"column":0,"depth":2},"sources":{"type":"header","text":"Sources","value":"sources","line":42,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":48,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"karpathy--from-vibe-coding-to-agentic-engineering\"\u003eKarpathy — From Vibe Coding to Agentic Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#karpathy--from-vibe-coding-to-agentic-engineering\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"claim\"\u003eClaim\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#claim\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarpathy menunjukkan bahwa AI membuat detail implementasi bisa didelegasikan, tetapi justru meningkatkan nilai understanding, taste, spec, verifikasi, dan judgment manusia.\u003c/p\u003e\n\u003ch2 id=\"evidence\"\u003eEvidence\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evidence\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTrust threshold yang dilewati pada akhir 2023 membuat workflow bergeser dari \"AI assistant\" ke \"AI production\".\u003c/li\u003e\n\u003cli\u003eDalam Software 3.0, prompt dan context window menjadi lever untuk interpreter LLM.\u003c/li\u003e\n\u003cli\u003eKarpathy melihat Software 3.0 bukan cuma tentang menulis kode lebih cepat, tapi juga tentang mengotomasi general information processing: LLM bisa mengambil dokumen mentah dan \"recompile\" mereka menjadi wiki/knowledge base yang lebih mudah dipahami manusia.\u003c/li\u003e\n\u003cli\u003eVibe coding menaikkan floor sementara agentic engineering menjaga quality bar.\u003c/li\u003e\n\u003cli\u003eModel LLM tetap jagged; kemampuan tinggi di domain verifiable tidak menjamin reasoning umum.\u003c/li\u003e\n\u003cli\u003eInfrastruktur saat ini masih human-native; agen perlu environment yang dibangun untuk mereka.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"llm-knowledge-base\"\u003eLLM knowledge base\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#llm-knowledge-base\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKarpathy menegaskan bahwa LLM knowledge base bukan hanya RAG atau vector database. Ia adalah proyek untuk membuat \"wikis for your organization or for you in person\" dari kumpulan dokumen, sehingga informasi mentah bisa direframing, dikelompokkan, dan dipresentasikan sebagai struktur pemahaman baru.\u003c/li\u003e\n\u003cli\u003eIni bukan sekadar \"cari dokumen relevan\". Ini tentang memproyeksikan ulang informasi supaya manusia dapat insight baru: outline, glossary, timeline, q\u0026#x26;a, dependency graph, dan halaman konsep.\u003c/li\u003e\n\u003cli\u003eBaginya, LLM knowledge bases membantu proses berpikir manusia—bukan menggantikan understanding. Oleh karena itu ia menambahkan: \"you can outsource your thinking but you can't outsource your understanding.\" Tool ini mendukung understanding enhancement, bukan outsourcing pemahaman.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"external-support\"\u003eExternal support\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#external-support\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBusiness Insider menulis bahwa Karpathy merasa \"never felt more behind as a programmer\" pada akhir \u003cstrong\u003eDesember 2025\u003c/strong\u003e, dan bahwa profesi programmer sedang \"dramatically refactored\" oleh AI tools.\u003c/li\u003e\n\u003cli\u003eBusiness Insider mencatat Karpathy menulis bahwa agentic coding tools \"crossed some kind of threshold of coherence around December 2025 and caused a phase shift in software engineering.\" Ini menguatkan bahwa Desember 2025 adalah pivot point, bukan sekadar framing pada talk April 2026.\u003c/li\u003e\n\u003cli\u003eBusiness Insider juga menyebut pergeseran rasio Karpathy: dari sekitar 80% manual / 20% agent pada awal November 2025, menuju 80% agent / 20% manual editing setelah December 2025.\u003c/li\u003e\n\u003cli\u003eKarpathy juga publish GitHub Gist \u003ccode\u003ellm-wiki\u003c/code\u003e awal April 2026, yang menjadi blueprint komunitas untuk membangun LLM knowledge bases sebagai markdown wiki yang terus disintesis, bukan sekadar RAG.\u003c/li\u003e\n\u003cli\u003eY Combinator talk \"Software Is Changing (Again)\" (Juni 2025) memberi konteks awal Software 3.0 dan membantu menempatkan talk Sequoia sebagai kelanjutan tesis tersebut.\u003c/li\u003e\n\u003cli\u003eKarpathy Medium \"Software 2.0\" (11 November 2017) adalah akar historis untuk pergeseran paradigma yang dibawa ke Software 3.0.\u003c/li\u003e\n\u003cli\u003eReferensi tambahan yang relevan: paper arXiv tentang vibe coding, agentic coding, dan trust/flow; TechRadar tentang bottleneck delivery; Denser.ai tentang ide LLM Wiki.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sources\"\u003eSources\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sources\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://www.businessinsider.com/openai-founding-member-never-felt-so-behind-programmer-2025-12\"\u003ehttps://www.businessinsider.com/openai-founding-member-never-felt-so-behind-programmer-2025-12\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.businessinsider.com/andrej-karpathy-claude-code-manual-skills-atrophy-software-engineering-tesla-2026-1\"\u003ehttps://www.businessinsider.com/andrej-karpathy-claude-code-manual-skills-atrophy-software-engineering-tesla-2026-1\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.youtube.com/live/LCEmiRjPEtQ\"\u003ehttps://www.youtube.com/live/LCEmiRjPEtQ\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://karpathy.medium.com/\"\u003ehttps://karpathy.medium.com/\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.07\"\u003e2026-05-07\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.llm-wiki\"\u003eKarpathy LLM Wiki: compiled knowledge base vs RAG\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100000\"\u003eAI execution cheapens but direction becomes expensive\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100100\"\u003ePrompt and context become source code in Software 3.0\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100200\"\u003eAgentic engineering preserves quality bar while vibe coding raises floor\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100900\"\u003eVibe coding is exploration flow, not quality discipline\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #a03623;\" href=\"/sotoy/notes/tags.zettel\"\u003ezettel\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #154406;\" href=\"/sotoy/notes/tags.literature-note\"\u003eliterature-note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ekarpathy (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100000\"\u003eAI execution cheapens but direction becomes expensive\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100100\"\u003ePrompt and context become source code in Software 3.0\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100200\"\u003eAgentic engineering preserves quality bar while vibe coding raises floor\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100300\"\u003eVerifiability is the fuel for LLM automation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100800\"\u003eTrust threshold shifts AI workflow from assistant to production\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101000\"\u003eContext window is temporary source code for LLMs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101200\"\u003eLargest AI opportunities are new work formats, not faster old workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101300\"\u003eFuture agentic systems may be AI-hosted with classical tools as co-processors\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101400\"\u003eSpecification fuels classical software; verification fuels agentic AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101500\"\u003eLLM capability is a jagged map, not a smooth curve\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507153000\"\u003eKarpathy LLM Wiki as knowledge compilation loop\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.llm-wiki\"\u003eKarpathy LLM Wiki: compiled knowledge base vs RAG\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to
