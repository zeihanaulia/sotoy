on disimpan?","value":"8-bagaimana-relation-disimpan","line":149,"column":0,"depth":2},"9-bagaimana-konsistensi-dijaga-saat-deletemove":{"type":"header","text":"9. Bagaimana konsistensi dijaga saat delete/move?","value":"9-bagaimana-konsistensi-dijaga-saat-deletemove","line":171,"column":0,"depth":2},"delete-sync":{"type":"header","text":"Delete sync","value":"delete-sync","line":175,"column":0,"depth":3},"move-sync":{"type":"header","text":"Move sync","value":"move-sync","line":184,"column":0,"depth":3},"10-kenapa-ini-penting":{"type":"header","text":"10. Kenapa ini penting?","value":"10-kenapa-ini-penting","line":193,"column":0,"depth":2},"11-apa-implikasi-untuk-agent":{"type":"header","text":"11. Apa implikasi untuk agent?","value":"11-apa-implikasi-untuk-agent","line":209,"column":0,"depth":2},"12-related-documents":{"type":"header","text":"12. Related documents","value":"12-related-documents","line":220,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"openviking-storage-architecture\"\u003eOpenViking storage architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-storage-architecture\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://docs.openviking.ai/en/concepts/05-storage\"\u003ehttps://docs.openviking.ai/en/concepts/05-storage\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eStorage Architecture di OpenViking adalah desain penyimpanan internal yang memisahkan konten asli dari indeks pencarian semantic\u003c/strong\u003e. Ini bukan sekadar \"di-save di folder mana\", tapi cara OpenViking menjaga agar context bisa dibaca seperti filesystem sekaligus dicari seperti vector database.\u003c/p\u003e\n\u003ch2 id=\"1-pertanyaan-kunci-yang-gue-pegang\"\u003e1. Pertanyaan kunci yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKenapa OpenViking memisahkan content storage dan index storage?\u003c/li\u003e\n\u003cli\u003eApa peran VikingFS?\u003c/li\u003e\n\u003cli\u003eApa yang disimpan AGFS?\u003c/li\u003e\n\u003cli\u003eApa yang disimpan Vector Index?\u003c/li\u003e\n\u003cli\u003eBagaimana URI \u003ccode\u003eviking://...\u003c/code\u003e dipetakan ke lokasi fisik?\u003c/li\u003e\n\u003cli\u003eBagaimana relation antar resource disimpan?\u003c/li\u003e\n\u003cli\u003eBagaimana OpenViking menjaga konsistensi saat delete atau move?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"2-storage-architecture-menurut-gue\"\u003e2. Storage Architecture menurut gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-storage-architecture-menurut-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau disederhanakan, OpenViking punya dua dunia penyimpanan utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAGFS\u003c/strong\u003e menyimpan isi asli: L0, L1, L2, multimedia, dan relations.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVector Index\u003c/strong\u003e menyimpan peta semantic: URI, vector, metadata, abstract.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi atas keduanya ada \u003cstrong\u003eVikingFS\u003c/strong\u003e: lapisan URI abstraction yang menerjemahkan \u003ccode\u003eviking://...\u003c/code\u003e ke storage fisik dan mengatur operasi read, write, move, delete, relation, dan find.\u003c/p\u003e\n\u003cp\u003eAnaloginya simpel:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS = rak buku dan isi bukunya.\u003c/li\u003e\n\u003cli\u003eVector Index = katalog perpustakaan.\u003c/li\u003e\n\u003cli\u003eVikingFS = pustakawan yang tahu cara menerjemahkan \"cari auth docs\" menjadi lokasi, ringkasan, dan isi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau katalog rusak, buku tetap ada. Kalau buku dipindah, katalog harus ikut diperbarui.\u003c/p\u003e\n\u003ch2 id=\"3-kenapa-harus-dipisah\"\u003e3. Kenapa harus dipisah?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-kenapa-harus-dipisah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking memisahkan dua layer karena tugasnya berbeda.\u003c/p\u003e\n\u003cp\u003eAGFS butuh durability, hierarki, dukungan file multimodal, dan operasi file klasik. Vector Index butuh kecepatan similarity search, filter metadata, dan recall hybrid.\u003c/p\u003e\n\u003cp\u003eKalau dua tanggung jawab ini dicampur, vector store bisa berubah jadi gudang penuh konten:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eduplikasi data,\u003c/li\u003e\n\u003cli\u003eketidaksinkronan versi,\u003c/li\u003e\n\u003cli\u003estorage mahal,\u003c/li\u003e\n\u003cli\u003edelete/move susah,\u003c/li\u003e\n\u003cli\u003edebug lebih rumit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan pemisahan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS jadi source of truth,\u003c/li\u003e\n\u003cli\u003eVector Index jadi search accelerator.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-apa-peran-vikingfs\"\u003e4. Apa peran VikingFS?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-apa-peran-vikingfs\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVikingFS adalah lapisan abstraksi URI.\u003c/p\u003e\n\u003cp\u003eDia mengurus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emenerjemahkan \u003ccode\u003eviking://...\u003c/code\u003e ke lokasi fisik,\u003c/li\u003e\n\u003cli\u003emembaca dan menulis di AGFS,\u003c/li\u003e\n\u003cli\u003ememindah dan menghapus resource,\u003c/li\u003e\n\u003cli\u003emengelola relation,\u003c/li\u003e\n\u003cli\u003emencari dengan Vector Index.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi ketika agent memanggil:\u003c/p\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003eclient\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eread\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"viking://resources/docs/auth\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVikingFS mengarahkan ke AGFS.\u003c/p\u003e\n\u003cp\u003eKetika agent memanggil:\u003c/p\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003eclient\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003efind\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"authentication methods\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVikingFS/ Search layer pakai Vector Index untuk menemukan URI kandidat, lalu konten asli tetap dibaca dari AGFS.\u003c/p\u003e\n\u003ch2 id=\"5-apa-yang-disimpan-agfs\"\u003e5. Apa yang disimpan AGFS?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-apa-yang-disimpan-agfs\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAGFS adalah backend content storage. Dia menyimpan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e.abstract.md\u003c/code\u003e = L0,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.overview.md\u003c/code\u003e = L1,\u003c/li\u003e\n\u003cli\u003efile asli / folder = L2,\u003c/li\u003e\n\u003cli\u003emultimedia (image, audio, video),\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.relations.json\u003c/code\u003e = graph relation antar resource.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePage juga menulis bahwa AGFS sudah diimplementasi ulang sebagai Rust RAGFS. Artinya backend content storage bisa optimal dan portable.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS menyimpan konten penuh,\u003c/li\u003e\n\u003cli\u003eAGFS menyimpan struktur filesystem,\u003c/li\u003e\n\u003cli\u003eAGFS menyimpan relations.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-apa-yang-disimpan-vector-index\"\u003e6. Apa yang disimpan Vector Index?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-apa-yang-disimpan-vector-index\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVector Index adalah semantic index storage.\u003c/p\u003e\n\u003cp\u003eDia menyimpan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003euri\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eparent_uri\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtext_type\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eis_leaf\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003evector\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esparse_vector\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eabstract\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ename\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edescription\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecreated_at\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eactive_count\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCatatan penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eVector Index tidak menyimpan isi file penuh.\u003c/li\u003e\n\u003cli\u003eAbstract L0 boleh ditempatkan di index karena dipakai untuk recall cepat.\u003c/li\u003e\n\u003cli\u003eIsi penuh dibaca dari AGFS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau index hanya menyimpan peta dan metadata, ia tetap ringan dan bisa dibangun ulang dari AGFS.\u003c/p\u003e\n\u003ch2 id=\"7-bagaimana-uri-viking-dipetakan\"\u003e7. Bagaimana URI \u003ccode\u003eviking://...\u003c/code\u003e dipetakan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-bagaimana-uri-viking-dipetakan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eviking://\u003c/code\u003e adalah alamat konseptual. VikingFS yang menerjemahkan ke lokasi fisik.\u003c/p\u003e\n\u003cp\u003eContoh sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eviking://resources/docs/auth\u003c/code\u003e → \u003ccode\u003e/local/{account}/resources/docs/auth\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eviking://user/memories/preferences\u003c/code\u003e → \u003ccode\u003e/local/{account}/user/{user}/memories/preferences\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eviking://agent/skills/search-web\u003c/code\u003e → \u003ccode\u003e/local/{account}/agent/{agent}/skills/search-web\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eURI tetap stabil walau storage fisik diubah. Ini penting untuk portability dan konsistensi.\u003c/p\u003e\n\u003ch2 id=\"8-bagaimana-relation-disimpan\"\u003e8. Bagaimana relation disimpan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-bagaimana-relation-disimpan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking tidak hanya memakai hierarchy. Ia juga menyimpan graph relation melalui \u003ccode\u003e.relations.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eKetika resource saling terkait, VikingFS bisa menyimpan link seperti:\u003c/p\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003eviking_fs\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003elink\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\n  from_uri\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"viking://resources/docs/auth\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  uris\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"viking://resources/docs/security\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  reason\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"Related security docs\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLalu relation diambil via:\u003c/p\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003erelations \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e viking_fs\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003erelations\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"viking://resources/docs/auth\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni penting karena tidak semua hubungan bisa direpresentasikan lewat folder tree saja.\u003c/p\u003e\n\u003ch2 id=\"9-bagaimana-konsistensi-dijaga-saat-deletemove\"\u003e9. Bagaimana konsistensi dijaga saat delete/move?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-bagaimana-konsistensi-dijaga-saat-deletemove\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonsistensi adalah kunci karena AGFS dan Vector Index dipisah.\u003c/p\u003e\n\u003ch3 id=\"delete-sync\"\u003eDelete sync\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#delete-sync\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau resource dihapus lewat VikingFS,\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS menghapus konten,\u003c/li\u003e\n\u003cli\u003eVector Index menghapus semua record dengan URI prefix yang sama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni mencegah dangling index references.\u003c/p\u003e\n\u003ch3 id=\"move-sync\"\u003eMove sync\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#move-sync\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau resource dipindah/rename,\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS memindah file/directory,\u003c/li\u003e\n\u003cli\u003eVector Index update \u003ccode\u003euri\u003c/code\u003e dan \u003ccode\u003eparent_uri\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau tidak, search akan kembali ke path lama yang tidak ada.\u003c/p\u003e\n\u003ch2 id=\"10-kenapa-ini-penting\"\u003e10. Kenapa ini penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking menerapkan prinsip:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAGFS = file content source of truth,\u003c/li\u003e\n\u003cli\u003eVector Index = search catalog,\u003c/li\u003e\n\u003cli\u003eVikingFS = URI abstraction \u0026#x26; orchestration.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esearch cepat,\u003c/li\u003e\n\u003cli\u003econtent tetap konsisten,\u003c/li\u003e\n\u003cli\u003edelete/move bisa dijaga,\u003c/li\u003e\n\u003cli\u003efile bisa dibaca sebagai filesystem,\u003c/li\u003e\n\u003cli\u003equery bisa ditemukan sebagai vector search.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"11-apa-implikasi-untuk-agent\"\u003e11. Apa implikasi untuk agent?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-apa-implikasi-untuk-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003efind\u003c/code\u003e candidate via Vector Index,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eread\u003c/code\u003e actual content via AGFS,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eabstract\u003c/code\u003e/\u003ccode\u003eoverview\u003c/code\u003e via AGFS,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efollow relations\u003c/code\u003e via \u003ccode\u003e.relations.json\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau agent hanya tahu \u003ccode\u003eviking://\u003c/code\u003e URI, dia tidak perlu tahu detail storage
