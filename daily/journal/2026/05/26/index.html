ps":{"note":{"id":"daily.journal.2026.05.26","title":"2026-05-26","desc":"Ringkasan harian dari membaca Smart Money Strategy oleh Luke Smith.","updated":1779859715950,"created":1779763204650,"custom":{},"fname":"daily.journal.2026.05.26","type":"note","vault":{"fsPath":"vault"},"contentHash":"05cdcea4cc6da95e6983a3d79de2b4ff","links":[{"type":"wiki","from":{"fname":"daily.journal.2026.05.26","id":"daily.journal.2026.05.26","vaultName":"vault"},"value":"book-summaries.smart-money-strategy","position":{"start":{"line":91,"column":17,"offset":11022},"end":{"line":91,"column":56,"offset":11061},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.smart-money-strategy"}}],"anchors":{"apa-yang-gue-ambil-hari-ini":{"type":"header","text":"Apa yang gue ambil hari ini","value":"apa-yang-gue-ambil-hari-ini","line":10,"column":0,"depth":2},"acknowledgements-yang-ngomong-soal-asal-usul-otoritas":{"type":"header","text":"Acknowledgements yang ngomong soal asal-usul otoritas","value":"acknowledgements-yang-ngomong-soal-asal-usul-otoritas","line":21,"column":0,"depth":2},"about-the-author-ke-mana-kredibilitasnya-mengarah":{"type":"header","text":"About the Author ke mana kredibilitasnya mengarah","value":"about-the-author-ke-mana-kredibilitasnya-mengarah","line":26,"column":0,"depth":2},"apa-yang-gue-ambil-dari-introduction":{"type":"header","text":"Apa yang gue ambil dari Introduction","value":"apa-yang-gue-ambil-dari-introduction","line":35,"column":0,"depth":2},"cara-pakai-buku-ini":{"type":"header","text":"Cara pakai buku ini","value":"cara-pakai-buku-ini","line":72,"column":0,"depth":2},"insight-penting":{"type":"header","text":"Insight penting","value":"insight-penting","line":83,"column":0,"depth":2},"catatan-untuk-follow-up":{"type":"header","text":"Catatan untuk follow-up","value":"catatan-untuk-follow-up","line":91,"column":0,"depth":2}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-26\"\u003e2026-05-26\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-26\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eHari ini gue lagi baca \u003cem\u003eSmart Money Strategy\u003c/em\u003e sama Luke Smith dan yang paling nyantol adalah frame-nya, bukan ngomongin produk investasi, tapi gimana financial planner menyusun strategi uang secara berlapis.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-gue-ambil-hari-ini\"\u003eApa yang gue ambil hari ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-ambil-hari-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue nangkep bahwa buku ini punya alur belajar yang sehat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emulai dari posisi awal dan fondasi mental,\u003c/li\u003e\n\u003cli\u003elalu ajarin cara \"strategy stacking\" supaya beberapa keputusan bisa saling menguatkan,\u003c/li\u003e\n\u003cli\u003esetelah itu baru masuk ke strategi nyata seperti cash flow, debt, investasi, proteksi, superannuation, dan estate planning,\u003c/li\u003e\n\u003cli\u003eterakhir mendorong pembaca supaya bikin rencana finansial yang bisa dieksekusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalimat yang keliatan penting buat gue adalah “Every person’s—and every family’s—financial journey is different. There’s no silver bullet or one-size-fits-all approach.” Itu bikin gue sadar bahwa buku ini ngebahas cara berpikir, bukan cara cepat kaya.\u003c/p\u003e\n\u003ch2 id=\"acknowledgements-yang-ngomong-soal-asal-usul-otoritas\"\u003eAcknowledgements yang ngomong soal asal-usul otoritas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#acknowledgements-yang-ngomong-soal-asal-usul-otoritas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAcknowledgementsnya pendek, tapi cukup jelas memosisikan Luke sebagai praktisi. Dia nulis soal perjalanan karier, tim yang mendukung bisnis financial planning-nya, dan satu teman yang mengubah ide jadi buku.\u003c/p\u003e\n\u003cp\u003eItu bikin gue lihat buku ini bukan sekadar teori. Dia muncul dari pengalaman kerja, percakapan klien, dan praktik financial planning sehari-hari. Jadi cara bacanya harus lebih ke kerangka pemikiran planner daripada template investasi.\u003c/p\u003e\n\u003ch2 id=\"about-the-author-ke-mana-kredibilitasnya-mengarah\"\u003eAbout the Author ke mana kredibilitasnya mengarah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#about-the-author-ke-mana-kredibilitasnya-mengarah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAbout the Author-nya penting karena dia buka dengan “Luke Smith is The Strategy Stacker.” Itu langsung merangkum tema besar buku karena bukan sekadar tips, tapi cara strategi finansial digabungkan.\u003c/p\u003e\n\u003cp\u003eKredensialnya juga menguatkan posisi ini sebagai financial planner, Director Envision Financial, bisnis dirintis 2016, dan advising client sejak 2004. Itu bikin buku terasa datang dari pengalaman nyata klien, bukan riset akademis atau strategi market.\u003c/p\u003e\n\u003cp\u003eAda juga poin menarik soal radio lokal. Kalau dia sering ngobrolin financial planning di radio, maka booknya kemungkinan memang dirancang supaya mudah dimengerti oleh orang biasa — sesuai nilai yang dia sebut di acknowledgements.\u003c/p\u003e\n\u003cp\u003eProblem statement-nya relevan karena hidup makin kompleks tapi edukasi finansial praktis masih kurang. Jadi buku ini bukan mau nambah informasi finansial saja, ia mau beri framework supaya orang bisa memahami dan menyusun strategi yang saling terhubung.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-gue-ambil-dari-introduction\"\u003eApa yang gue ambil dari Introduction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-ambil-dari-introduction\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIntroduction bikin gue sadar bahwa masalah utama di finance bukan selalu soal kurang duit, tapi soal terlambat tahu opsi. Banyak orang baru mikir “anjir, ternyata bisa begini” setelah 5 atau 10 tahun, dan itu artinya biaya utamanya bukan cuma uang, tapi juga waktu dan kesempatan.\u003c/p\u003e\n\u003cp\u003eTapi gue juga setuju kalau lo masih di fase survival, planning gak bisa dibikin sama dengan orang yang sudah ada modal. Di fase itu planning paling awal adalah mengelola constraint, bukan ngobrolin produk investasi kompleks. Fokusnya tetap pada cash survival, income growth, debt control, dan menghindari risiko kecil yang bisa bikin hidup makin jatuh.\u003c/p\u003e\n\u003cp\u003eKalimat yang nempel buat gue adalah “I wish I had known that five years ago” dan “I had no idea you could do that.” Itu menunjukkan bahwa gap pengetahuan bisa bikin orang ketinggalan banyak pilihan.\u003c/p\u003e\n\u003cp\u003eYang gue garis bawahi adalah kalau buku ini bukan diberi buat langsung jadi rencana personal. Ini buat bangun knowledge dan understanding. Banyak orang di Indonesia sudah tahu istilah RDPU, SBN, deposito, saham, emas, DPLK, BPJS Ketenagakerjaan, asuransi jiwa, dan asuransi kesehatan. Tapi tahu nama instrumen belum sama dengan paham fungsi strategi dalam hidup. Yang perlu kita tanya adalah bukan “produk ini bagus gak”, tapi “produk atau strategi ini menyelesaikan problem apa?”.\u003c/p\u003e\n\u003cp\u003eBuku ini juga ngebantu lo siap masuk meeting financial planner. Lo jadi bisa bawa framework sendiri dan tidak gampang dikendalikan advisor. Tanpa itu, percakapan gampang berputar di “return berapa?” atau “bayarnya berapa?”. Dengan pemahaman yang dasar, lo bisa minta penjelasan kenapa prioritasnya begitu, apa risiko tunda, apa alternatifnya, apakah ini cocok dengan cash flow lo, dan apa potensi konflik kepentingan.\u003c/p\u003e\n\u003cp\u003eLuke juga ngejelasin perbedaan general advice dan personal advice dengan cara yang gampang diinget. Intinya adalah apakah advisor sudah mempertimbangkan objective, situation, dan needs lo. Objective itu tujuan lo. Situation itu kondisi aktual lo. Needs itu kebutuhan nyata yang harus dipenuhi sekarang. Kalau orang cuma bilang “beli produk X” tanpa nanya tiga hal itu, itu masih general advice.\u003c/p\u003e\n\u003cp\u003ePersonal financial advice bukan tentang produk. Personal advice adalah tentang lo sebagai sistem hidup. Kalau hidup lo berubah — pindah kerja, nikah, punya anak, resign bangun usaha, atau harus urus orang tua sakit — parameter finansial lo ikut berubah juga. Itu bukan soal lo kaya atau enggak. Itu soal decision yang konsekuensinya lebih besar.\u003c/p\u003e\n\u003cp\u003eLuke juga merinci lima fondasi advice yang penting untuk kita catat. Pertama, kenali starting position. Lo harus tahu income, expense, utang, aset, risiko, kewajiban, dan goals lo. Di Indonesia itu berarti cek apakah income lo stabil atau project-based, pengeluaran wajib berapa, ada utang kartu kredit/paylater atau KTA, ada tanggungan keluarga, ada BPJS atau asuransi kantor, ada dana darurat, dan aset likuid berapa. Kalau starting position lo cash flow negatif, strategi pertama adalah stop bleeding. Kalau cash flow positif tapi cash idle, strategi berikutnya mungkin proteksi dan alokasi. Kalau income tinggi tapi tanggungan besar, proteksi jadi fokus.\u003c/p\u003e\n\u003cp\u003eKedua, temukan why lo. Why itu bukan slogan, itu tujuan. Strategi buat rumah 3 tahun lagi beda dengan buat pindah negara, beda dengan buat pensiun tenang atau bantu orang tua. Starting position itu current state, why itu desired state. Plan adalah jalur dari satu ke yang lain.\u003c/p\u003e\n\u003cp\u003eKetiga, pahami opsi yang spesifik buat lo. Bukan semua instrumen market, tapi yang relevan dengan lo. Kalau income belum stabil, opsi yang illiquid berbahaya. Kalau tujuan lo jangka panjang, terlalu banyak cash bisa kalah inflasi. Kalau semua exposure IDR, mungkin hedge sebagian masuk akal. Kalau biaya tinggi, return kotor menipu.\u003c/p\u003e\n\u003cp\u003eKeempat, bangun behaviour yang sehat. Strategi jelek bisa gagal karena perilaku. Misalnya tahu harus investasi tapi setiap bulan uang habis, tahu harus punya dana darurat tapi bocor ke konsumsi, tahu harus hindari utang mahal tapi tetap pakai paylater. Behaviour adalah execution layer dari plan.\u003c/p\u003e\n\u003cp\u003eKelima, bikin plan lalu review dan adjust. Plan bukan sekali jadi, karena hidup berubah, market berubah, income berubah, keluarga berubah, dan target berubah. Framework ini terasa cocok untuk Indonesia: current state, desired state, opsi, behaviour, review, dan adjust. Itu lebih penting daripada meniru produk Australia.\u003c/p\u003e\n\u003cp\u003eDi era informasi, banyak advice finansial di Indonesia cuma general advice atau sales yang dibungkus edukasi. Kalau advice itu nggak mempertimbangkan kondisi lo, jangan perlakukan sebagai instruksi. Gunakan sebagai referensi, lalu sesuaikan dengan realitas lo sendiri.\u003c/p\u003e\n\u003cp\u003eDi era informasi, banyak advice finansial di Indonesia cuma general advice atau bahkan sales yang dibungkus edukasi. Kalau advice itu nggak mempertimbangkan kondisi lo, jangan perlakukan sebagai instruksi. Gunakan sebagai referensi, lalu sesuaikan dengan realitas lo sendiri.\u003c/p\u003e\n\u003cp\u003eDi konteks Indonesia, yang penting adalah pisahin prinsip dari vehicle. Superannuation di Australia bukan harus ditiru mentah-mentah. Yang bisa kita pakai adalah prinsip bahwa pensiun harus dibangun dengan kontribusi rutin, horizon panjang, tax-aware, dan gak dicampur dengan cash flow harian. Buat kita, padanannya bisa BPJS Ketenagakerjaan, dana pensiun, SBN, reksa dana, deposito, atau kombinasi lain.\u003c/p\u003e\n\u003cp\u003eLuke juga ngebahas waste. Dia bilang dia dibesarkan supaya benci waste, termasuk waste of time, effort, money, talent, opportunity, dan knowledge. Itu bikin gue lihat financial planning bukan cuma soal menghemat. Itu soal mengurangi kebocoran resource hidup, termasuk energi dan kesempatan.\u003c/p\u003e\n\u003cp\u003eSatu hal lagi yang gue tangkap adalah manusia itu resource. Ability to earn income adalah aset paling penting, lalu ability to manage money adalah aset kedua. Kalau dua itu belum terjaga, semua strategi investasi bisa jadi sia-sia. Ini sangat relevan buat Indonesia karena banyak orang fokus ke instrumen tanpa cek dulu apakah income mereka stabil atau kemampuan ngatur uangnya sudah siap.\u003c/p\u003e\n\u003cp\u003eJadi introduction ini bikin gue baca buku ini sebagai alat untuk ekstraksi prinsip, lalu mapping ke realitas Indonesia, bukan sebagai manual produk dari Australia.\u003c/p\u003e\n\u003ch2 id=\"cara-pakai-buku-ini\"\u003eCara pakai buku ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cara-pakai-buku-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue baca buku ini, propernya bukan “baca sampai akhir lalu nambah pengetahuan.” Luke nyebut “educate first and financial plan second,” dan itu bikin cara gue baca berubah. Ini lebih ke membangun literasi dan struktur berpikir sebelum ketemu planner atau bikin keputusan.\u003c/p\u003e\n\u003cp\u003eGue jadi lihat buku ini seperti peta strategi, bukan instruksi langsung. Setiap strategi harus gue cek apakah cocok untuk kondisi hidup apa, butuh fondasi apa dulu, bisa digabung dengan apa, dan risikonya apa kalau dipakai terlalu cepat.\u003c/p\u003e\n\u003cp\u003eSekarang gue juga mulai pisahin principle dari vehicle. Vehicle itu mekanisme lokal, misalnya superannuation di Australia. Yang penting buat gue bukan punya superannuation, tapi prinsipnya, bahwa pensiun harus dibangun dengan kontribusi rutin, horizon panjang, perlindungan dari impuls jangka pendek, dan struktur yang efisien. Di Indonesia, padanannya bisa BPJS Ketenagakerjaan, dana pensiun, SBN, reksa dana, deposito, atau kombinasi instrumen lain.\u003c/p\u003e\n\u003cp\u003eGue bikin dua kolom mental, satu untuk prinsip yang bisa gue ambil dan satunya untuk detail yang harus gue sesuaikan dengan konteks gue sendiri. Prinsip seperti rencanakan pensiun sejak dini bisa universal, tapi detail Australia seperti superannuation mesti diterjemahkan ke konteks lokal.\u003c/p\u003e\n\u003cp\u003eBuku ini bukan pengganti planner, tapi bikin obrolan gue dengan advisor jadi lebih tajam. Setelah baca, gue jadi bisa tanya “apa dependency sebelum gue mulai investasi lebih agresif?” atau “strategi mana yang paling prioritas untuk kondisi gue?”.\u003c/p\u003e\n\u003ch2 id=\"insight-penting\"\u003eInsight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBuku finance yang bagus biasanya start dari kondisi hidup, bukan dari produk investasi yang paling cuan.\u003c/li\u003e\n\u003cli\u003eJudul \"strategy\" di sini bukan strategi trading; ini tentang bagaimana menggabungkan beberapa keputusan finansial.\u003c/li\u003e\n\u003cli\u003eStrategy stacking itu mirip arsitektur software, kekuatan ada di relasi antar-komponen, bukan satu komponen saja.\u003c/li\u003e\n\u003cli\u003eKalau cash flow dan proteksi belum rapi, investasi bisa jadi rapuh.\u003c/li\u003e\n\u003cli\u003eKalau baca dari perspektif lokal, detailnya harus diterjemahkan ke konteks Indonesia, seperti BPJS, pajak lokal, instrumen investasi lokal, dan mekanisme pensiun yang beda.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"catatan-untuk-follow-up\"\u003eCatatan untuk follow-up\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-untuk-follow-up\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBikin ringkasan lebih fokus ke tiap bagian buku supaya nanti gampang di-review.\u003c/li\u003e\n\u003cli\u003eCari istilah setara untuk superannuation di konteks Indonesia.\u003c/li\u003e\n\u003cli\u003eJadikan ini referensi kalau mau nulis checklist perencanaan finansial pribadi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eReferensi utama \u003ca href=\"/sotoy/notes/book-summaries.smart-money-strategy\"\u003eSmart Money Strategy\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://learning.oreilly.com/library/view/smart-money-strategy/9781394176946/\"\u003eSmart Money Strategy di O'Reilly\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitte
