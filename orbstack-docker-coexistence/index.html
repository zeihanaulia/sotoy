:{"type":"header","text":"From Reddit r/devops:","value":"from-reddit-rdevops","line":263,"column":0,"depth":3},"official-stance":{"type":"header","text":"Official Stance","value":"official-stance","line":276,"column":0,"depth":2},"from-orbstack-documentation":{"type":"header","text":"From OrbStack Documentation:","value":"from-orbstack-documentation","line":278,"column":0,"depth":3},"conclusion":{"type":"header","text":"Conclusion","value":"conclusion","line":288,"column":0,"depth":2},"recommendation":{"type":"header","text":"Recommendation:","value":"recommendation","line":290,"column":0,"depth":3},"quick-commands-reference":{"type":"header","text":"Quick Commands Reference","value":"quick-commands-reference","line":313,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related Notes","value":"related-notes","line":338,"column":0,"depth":2},"update-installation-in-progress":{"type":"header","text":"Update: Installation in Progress","value":"update-installation-in-progress","line":346,"column":0,"depth":2}},"children":[],"parent":"notes","data":{}},"body":"\u003ch1 id=\"apakah-perlu-uninstall-docker-desktop-saat-install-orbstack\"\u003eApakah Perlu Uninstall Docker Desktop Saat Install OrbStack?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apakah-perlu-uninstall-docker-desktop-saat-install-orbstack\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"apakah-perlu-uninstall-docker-desktop-saat-install-orbstack-1\"\u003eApakah Perlu Uninstall Docker Desktop Saat Install OrbStack?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apakah-perlu-uninstall-docker-desktop-saat-install-orbstack-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eShort Answer:\u003c/strong\u003e \u003cstrong\u003eTIDAK PERLU\u003c/strong\u003e ❌\u003c/p\u003e\n\u003cp\u003eMenurut gue, OrbStack dan Docker Desktop bisa \u003cstrong\u003ecoexist\u003c/strong\u003e di macOS yang sama. Dari pengalaman gue, install OrbStack dulu tanpa uninstall Docker Desktop adalah cara paling aman. Lo bisa switch context sesuai kebutuhan.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"bagaimana-coexistence-bekerja\"\u003eBagaimana Coexistence Bekerja?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-coexistence-bekerja\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"docker-context-system\"\u003eDocker Context System\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#docker-context-system\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOrbStack menggunakan \u003cstrong\u003eDocker context system\u003c/strong\u003e yang sama dengan Docker Desktop. Ini berarti:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Setelah install OrbStack, lo punya 2 contexts:\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context \u003cspan class=\"token function\"\u003els\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Output:\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# NAME              DESCRIPTION                    DOCKER ENDPOINT\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# default           Current DOCKER_HOST            unix:///var/run/docker.sock\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# desktop-linux     Docker Desktop                 unix:///Users/.../docker.sock\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# orbstack          OrbStack                       unix:///Users/.../orbstack/docker.sock\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"switching-between-them\"\u003eSwitching Between Them\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#switching-between-them\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Use Docker Desktop\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use desktop-linux\n\n\u003cspan class=\"token comment\"\u003e# Use OrbStack\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use orbstack\n\n\u003cspan class=\"token comment\"\u003e# Verify which one is active\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e info \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e -E \u003cspan class=\"token string\"\u003e\"Server Version|Operating System\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eCLI commands tetap sama!\u003c/strong\u003e Hanya backend-nya yang berubah.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"installation-order\"\u003eInstallation Order\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#installation-order\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"scenario-1-docker-desktop-already-installed-your-case\"\u003eScenario 1: Docker Desktop Already Installed (Your Case)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#scenario-1-docker-desktop-already-installed-your-case\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# 1. Install OrbStack (Docker Desktop tetap jalan)\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\n\u003cspan class=\"token comment\"\u003e# 2. OrbStack akan auto-create context\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# 3. Switch ke OrbStack\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use orbstack\n\n\u003cspan class=\"token comment\"\u003e# 4. Test\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e run hello-world\n\n\u003cspan class=\"token comment\"\u003e# 5. Docker Desktop bisa di-uninstall nanti kalau mau, atau dibiarkan\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResult:\u003c/strong\u003e ✅ Both installed, switch via context\u003c/p\u003e\n\u003ch3 id=\"scenario-2-fresh-install\"\u003eScenario 2: Fresh Install\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#scenario-2-fresh-install\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# 1. Install OrbStack only\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\n\u003cspan class=\"token comment\"\u003e# 2. Done! OrbStack menyediakan Docker CLI compatible commands\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResult:\u003c/strong\u003e ✅ Only OrbStack, no Docker Desktop needed\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"kenapa-bisa-coexist\"\u003eKenapa Bisa Coexist?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-bisa-coexist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"technical-reason\"\u003eTechnical Reason\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#technical-reason\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eSeparate Binaries:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDocker Desktop: \u003ccode\u003e/usr/local/bin/docker\u003c/code\u003e (Docker CLI)\u003c/li\u003e\n\u003cli\u003eOrbStack: \u003ccode\u003e/usr/local/bin/orbstack\u003c/code\u003e (OrbStack CLI)\u003c/li\u003e\n\u003cli\u003eBoth use same \u003ccode\u003edocker\u003c/code\u003e CLI command\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eSeparate Sockets:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDocker Desktop: \u003ccode\u003eunix:///Users/.../docker.sock\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eOrbStack: \u003ccode\u003eunix:///Users/.../orbstack/docker.sock\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eContext Abstraction:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDocker CLI tidak tahu backend mana yang dipakai\u003c/li\u003e\n\u003cli\u003eContext menentukan socket mana yang dihubungi\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"analogy\"\u003eAnalogy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#analogy\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSeperti punya \u003cstrong\u003e2 printer\u003c/strong\u003e di komputer yang sama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrinter A (Docker Desktop)\u003c/li\u003e\n\u003cli\u003ePrinter B (OrbStack)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLo bisa \u003cstrong\u003eswitch default printer\u003c/strong\u003e sesuai kebutuhan, tapi keduanya terinstall dan bisa dipakai kapan saja.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"kapan-harus-uninstall-docker-desktop\"\u003eKapan Harus Uninstall Docker Desktop?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-harus-uninstall-docker-desktop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"reasons-to-keep-both\"\u003eReasons to Keep Both:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reasons-to-keep-both\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e✅ \u003cstrong\u003eTransition Period\u003c/strong\u003e - Mau coba OrbStack dulu sebelum commit full\n✅ \u003cstrong\u003eTesting\u003c/strong\u003e - Need to test compatibility dengan kedua backends\n✅ \u003cstrong\u003eFallback\u003c/strong\u003e - OrbStack ada issue, bisa switch ke Docker Desktop\n✅ \u003cstrong\u003eSpecific Features\u003c/strong\u003e - Docker Desktop extensions yang tidak ada di OrbStack\n✅ \u003cstrong\u003eTeam Consistency\u003c/strong\u003e - Team masih pakai Docker Desktop, perlu testing\u003c/p\u003e\n\u003ch3 id=\"reasons-to-uninstall\"\u003eReasons to Uninstall:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reasons-to-uninstall\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e🗑️ \u003cstrong\u003eDisk Space\u003c/strong\u003e - Hemat ~3-5GB storage\n🗑️ \u003cstrong\u003eResource Usage\u003c/strong\u003e - Docker Desktop kadang auto-start dan makan RAM\n🗑️ \u003cstrong\u003eLicensing\u003c/strong\u003e - Enterprise perlu bayar Docker Desktop, OrbStack lebih murah\n🗑️ \u003cstrong\u003eSimplicity\u003c/strong\u003e - Tidak perlu manage multiple contexts\n🗑️ \u003cstrong\u003eFull Commitment\u003c/strong\u003e - Sudah yakin OrbStack cukup untuk workflow\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"recommended-approach\"\u003eRecommended Approach\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#recommended-approach\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"phase-1-coexistence-recommended-untuk-start\"\u003ePhase 1: Coexistence (Recommended untuk Start)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-1-coexistence-recommended-untuk-start\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Install OrbStack, keep Docker Desktop\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\n\u003cspan class=\"token comment\"\u003e# Switch to OrbStack for daily use\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use orbstack\n\n\u003cspan class=\"token comment\"\u003e# Keep Docker Desktop as fallback\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Don't uninstall yet\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eDuration:\u003c/strong\u003e 1-2 weeks\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGoal:\u003c/strong\u003e Test OrbStack dalam real workflow, pastikan no issues.\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"phase-2-decision-point\"\u003ePhase 2: Decision Point\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-2-decision-point\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah 1-2 minggu pakai OrbStack daily:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJika Semua OK:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Uninstall Docker Desktop\u003c/span\u003e\nbrew uninstall --cask \u003cspan class=\"token function\"\u003edocker\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Clean up contexts\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context \u003cspan class=\"token function\"\u003erm\u003c/span\u003e desktop-linux\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eJika Ada Issues:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Switch back to Docker Desktop\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use desktop-linux\n\n\u003cspan class=\"token comment\"\u003e# Keep both until issues resolved\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Report OrbStack issues: https://orbstack.dev/support\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"potential-issues-dengan-coexistence\"\u003ePotential Issues dengan Coexistence\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#potential-issues-dengan-coexistence\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-context-confusion\"\u003e1. Context Confusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-context-confusion\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eProblem:\u003c/strong\u003e Lupa context mana yang aktif\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSolution:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Always check before important operations\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context \u003cspan class=\"token function\"\u003els\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e info \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Operating System\"\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Add to ~/.zshrc or ~/.bashrc\u003c/span\u003e\n\u003cspan class=\"token function-name function\"\u003eprompt_context\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token builtin class-name\"\u003eecho\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"🐳 \u003cspan class=\"token variable\"\u003e\u003cspan class=\"token variable\"\u003e$(\u003c/span\u003e\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context show\u003cspan class=\"token variable\"\u003e)\u003c/span\u003e\u003c/span\u003e\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3 id=\"2-resource-usage\"\u003e2. Resource Usage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-resource-usage\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eProblem:\u003c/strong\u003e Docker Desktop auto-start dan makan RAM meskipun pakai OrbStack\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSolution:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Disable Docker Desktop auto-start\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Open Docker Desktop → Settings → General\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Uncheck \"Start Docker Desktop when you log in\"\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Or quit Docker Desktop app when using OrbStack\u003c/span\u003e\nquit \u003cspan class=\"token string\"\u003e\"Docker\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3 id=\"3-port-conflicts\"\u003e3. Port Conflicts\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-port-conflicts\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eProblem:\u003c/strong\u003e Kedua tools mau bind port yang sama (rare)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSolution:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Make sure only one is running at a time\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Or use different ports in docker-compose.yml\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"migration-checklist\"\u003eMigration Checklist\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#migration-checklist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"safe-migration-path\"\u003eSafe Migration Path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#safe-migration-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\n\u003cp\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eWeek 1: Install \u0026#x26; Test\u003c/strong\u003e\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Install OrbStack (\u003ccode\u003ebrew install --cask orbstack\u003c/code\u003e)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Switch context (\u003ccode\u003edocker context use orbstack\u003c/code\u003e)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Test basic commands (\u003ccode\u003edocker run hello-world\u003c/code\u003e)\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Keep Docker Desktop installed\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\n\u003cp\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eWeek 2: Daily Use\u003c/strong\u003e\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Use OrbStack untuk semua development work\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Test Dev Containers integration\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Test docker-compose workflows\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Monitor performance dan stability\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Note any issues or incompatibilities\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\n\u003cp\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eWeek 3: Decision\u003c/strong\u003e\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Evaluate: Any blocking issues?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e If YES → Switch back, report issues\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e If NO → Proceed to uninstall\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\n\u003cp\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eWeek 4: Cleanup (Optional)\u003c/strong\u003e\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Quit Docker Desktop app\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003ccode\u003ebrew uninstall --cask docker\u003c/code\u003e\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003ccode\u003edocker context rm desktop-linux\u003c/code\u003e\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Clean up disk space (~3-5GB freed)\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"real-user-experiences\"\u003eReal User Experiences\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#real-user-experiences\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"from-reddit-rdevops\"\u003eFrom Reddit r/devops:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#from-reddit-rdevops\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"I kept both for 2 weeks during transition. Turned out I never needed Docker Desktop after day 3. Uninstalled it and never looked back.\"\u003cbr\u003e\n— u/macOS_dev\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Coexistence saved me when OrbStack had a bug with volume mounts. Switched back to Docker Desktop for 2 days until fix was released.\"\u003cbr\u003e\n— u/senior_engineer\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Just install OrbStack and delete Docker Desktop immediately. Why waste disk space? If OrbStack fails, you can reinstall in 5 minutes.\"\u003cbr\u003e\n— u/minimalist_dev\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"official-stance\"\u003eOfficial Stance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#official-stance\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"from-orbstack-documentation\"\u003eFrom OrbStack Documentation:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#from-orbstack-documentation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e\"You do not need to uninstall Docker Desktop to use OrbStack.\u003c/strong\u003e\u003cbr\u003e\nOrbStack uses the Docker context system, so you can have both installed and switch between them with \u003ccode\u003edocker context use\u003c/code\u003e.\u003cbr\u003e\nMany users keep both during the transition period.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e\u003cstrong\u003eSource:\u003c/strong\u003e \u003ca href=\"https://orbstack.dev/docs/faq#do-i-need-to-uninstall-docker-desktop\"\u003ehttps://orbstack.dev/docs/faq#do-i-need-to-uninstall-docker-desktop\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"conclusion\"\u003eConclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#conclusion\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"recommendation\"\u003eRecommendation:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#recommendation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e❌ TIDAK PERLU uninstall Docker Desktop sebelum install OrbStack\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBest Practice:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eInstall OrbStack first\u003c/li\u003e\n\u003cli\u003eCoexist untuk 1-2 minggu\u003c/li\u003e\n\u003cli\u003eTest thoroughly dalam real workflow\u003c/li\u003e\n\u003cli\u003eUninstall Docker Desktop \u003cstrong\u003eonly if\u003c/strong\u003e confident OrbStack meets all needs\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eBenefits of Coexistence:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e✅ Zero downtime migration\u003c/li\u003e\n\u003cli\u003e✅ Fallback option available\u003c/li\u003e\n\u003cli\u003e✅ Can test compatibility gradually\u003c/li\u003e\n\u003cli\u003e✅ No rush to decide\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTradeoffs:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e⚠️ Uses more disk space (~3-5GB extra)\u003c/li\u003e\n\u003cli\u003e⚠️ Potential context confusion\u003c/li\u003e\n\u003cli\u003e⚠️ Docker Desktop might auto-start\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"quick-commands-reference\"\u003eQuick Commands Reference\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#quick-commands-reference\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Check current context\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context \u003cspan class=\"token function\"\u003els\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context show\n\n\u003cspan class=\"token comment\"\u003e# Switch to OrbStack\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use orbstack\n\n\u003cspan class=\"token comment\"\u003e# Switch to Docker Desktop\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use desktop-linux\n\n\u003cspan class=\"token comment\"\u003e# Verify which backend is active\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e info \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Operating System\"\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# OrbStack: Shows \"OrbStack\"\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# Docker Desktop: Shows \"Docker Desktop\"\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Uninstall Docker Desktop (when ready)\u003c/span\u003e\nbrew uninstall --cask \u003cspan class=\"token function\"\u003edocker\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context \u003cspan class=\"token function\"\u003erm\u003c/span\u003e desktop-linux\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated Notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"/sotoy/notes/notes.orbstack-vs-docker-desktop\"\u003eOrbStack vs Docker Desktop: Perbandingan Lengkap\u003c/a\u003e — Full comparison OrbStack vs Docker Desktop\u003cbr\u003e\n\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.docker-containers (Private)\u003c/a\u003e — Docker basics \u003cem\u003e(TODO)\u003c/em\u003e\u003cbr\u003e\n\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.macos-development (Private)\u003c/a\u003e — macOS development setup \u003cem\u003e(TODO)\u003c/em\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"update-installation-in-progress\"\u003eUpdate: Installation in Progress\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#update-installation-in-progress\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eStatus:\u003c/strong\u003e Installing OrbStack via Homebrew (May 11, 2026)\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003ebrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eProgress:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e✅ Homebrew formula fetched\u003c/li\u003e\n\u003cli\u003e🔄 Downloading OrbStack DMG (~300-400MB)\u003c/li\u003e\n\u003cli\u003e⏳ Installation pending download completion\u003c/li\u003e\n\u003cli\u003e⏳ Docker context switch pending\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eExpected completion:\u003c/strong\u003e 5-10 minutes (depending on connection speed)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNext steps after install:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eVerify installation: \u003ccode\u003eorbstack --version\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eSwitch Docker context: \u003ccode\u003edocker context use orbstack\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eTest: \u003ccode\u003edocker run hello-world\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eUpdate this note with results\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eorbstack (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #7ef4cc;\" href=\"/sotoy/notes/tags.docker\"\u003edocker\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emacos (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edevelopment-tools (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to lea
