an-non-linear","line":85,"column":0,"depth":2},"batasan-cpe":{"type":"header","text":"Batasan CPE","value":"batasan-cpe","line":93,"column":0,"depth":2},"1-bobot-entity-tetap-subjektif":{"type":"header","text":"1. Bobot entity tetap subjektif","value":"1-bobot-entity-tetap-subjektif","line":96,"column":0,"depth":3},"2-edge-amplifier-masih-sederhana":{"type":"header","text":"2. Edge amplifier masih sederhana","value":"2-edge-amplifier-masih-sederhana","line":99,"column":0,"depth":3},"3-nilai-spesifik-entity-tidak-dihitung":{"type":"header","text":"3. Nilai spesifik entity tidak dihitung","value":"3-nilai-spesifik-entity-tidak-dihitung","line":102,"column":0,"depth":3},"4-implicit-inference-belum-tertangkap":{"type":"header","text":"4. Implicit inference belum tertangkap","value":"4-implicit-inference-belum-tertangkap","line":105,"column":0,"depth":3},"5-threshold-masih-knob-manual":{"type":"header","text":"5. Threshold masih knob manual","value":"5-threshold-masih-knob-manual","line":108,"column":0,"depth":3},"kenapa-cpe-masih-penting":{"type":"header","text":"Kenapa CPE masih penting","value":"kenapa-cpe-masih-penting","line":111,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":118,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture.camp","data":{}},"body":"\u003ch1 id=\"cpe-mengukur-risiko-pii-sebagai-akumulasi-session-bukan-message\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cpe-mengukur-risiko-pii-sebagai-akumulasi-session-bukan-message\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-penjelasan\"\u003eInti penjelasan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-penjelasan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePertanyaan kedua dari paper CAMP adalah: apa yang baru dari CPE?\u003c/p\u003e\n\u003cp\u003eJawaban pendeknya: CPE memindahkan privacy risk dari level single message ke level session. Dalam agentic conversation, bukan cuma satu pesan yang penting; yang penting adalah akumulasi dan kombinasi entitas PII sepanjang percakapan.\u003c/p\u003e\n\u003ch2 id=\"unit-analisis-yang-berubah\"\u003eUnit analisis yang berubah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#unit-analisis-yang-berubah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePer-turn masker bertanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Apakah pesan ini mengandung PII?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCPE bertanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Setelah semua pesan sejauh ini digabung, apakah percakapan ini sudah membentuk profil yang bisa mengidentifikasi user?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu adalah perubahan cara pandang utama.\u003c/p\u003e\n\u003ch2 id=\"struktur-cpe\"\u003eStruktur CPE\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#struktur-cpe\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCPE digarap dengan tiga komponen utama.\u003c/p\u003e\n\u003ch3 id=\"1-entity-type\"\u003e1. Entity type\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-entity-type\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePertama, sistem mengkategorikan PII berdasarkan jenisnya: Person, Location, Organization, Email, Phone, DOB, SSN, Medical Condition, Salary, dan seterusnya.\u003c/p\u003e\n\u003ch3 id=\"2-base-sensitivity-weight\"\u003e2. Base sensitivity weight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-base-sensitivity-weight\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKedua, setiap entity type diberi bobot sensitivitas dasar. Contoh bobot dalam paper:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSSN / credit card: 1.0\u003c/li\u003e\n\u003cli\u003eDOB: 0.9\u003c/li\u003e\n\u003cli\u003eMedical condition: 0.85\u003c/li\u003e\n\u003cli\u003eEmail: 0.8\u003c/li\u003e\n\u003cli\u003ePhone: 0.75\u003c/li\u003e\n\u003cli\u003ePerson / Salary: 0.6\u003c/li\u003e\n\u003cli\u003eLocation / IP: 0.5\u003c/li\u003e\n\u003cli\u003eOrganization: 0.3\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBobot ini menjawab: \"seberapa sensitif entity ini ketika berdiri sendiri?\"\u003c/p\u003e\n\u003ch3 id=\"3-co-occurrence-graph\"\u003e3. Co-occurrence graph\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-co-occurrence-graph\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKetiga, CPE membangun graph dari entity types yang muncul bersama dalam session.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enode = tipe entity\u003c/li\u003e\n\u003cli\u003eedge = dua tipe entity muncul bersama dalam session\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGraph ini memungkinkan CPE menangkap kombinasi risiko.\nEntity yang muncul sendirian memiliki degree rendah. Entity yang muncul bersama banyak entity lain punya degree tinggi, sehingga kontribusinya meningkat.\u003c/p\u003e\n\u003ch2 id=\"bagaimana-amplifier-bekerja\"\u003eBagaimana amplifier bekerja\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-amplifier-bekerja\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper memakai amplifier berbasis degree node:\u003c/p\u003e\n\u003cp\u003ef(v) = 1 + α × deg(v)\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ef(v)\u003c/code\u003e adalah faktor peningkat untuk node \u003ccode\u003ev\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edeg(v)\u003c/code\u003e adalah jumlah koneksi node itu di graph\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eα\u003c/code\u003e adalah parameter yang mengatur seberapa agresif kombinasi menaikkan risiko\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau \u003ccode\u003eα = 0.3\u003c/code\u003e dan sebuah node punya degree 3, amplifier-nya menjadi 1.9. Dengan kata lain, entity itu hampir dua kali lipat lebih berbahaya karena ia muncul dalam kombinasi yang kaya.\u003c/p\u003e\n\u003ch2 id=\"cpe-sebagai-skor\"\u003eCPE sebagai skor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cpe-sebagai-skor\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCPE dihitung sebagai total bobot entity setelah diamplifikasi:\u003c/p\u003e\n\u003cp\u003eCPE(t) = Σ_v w(v) × (1 + α × deg(v))\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ew(v)\u003c/code\u003e = base sensitivity weight entity \u003ccode\u003ev\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edeg(v)\u003c/code\u003e = seberapa banyak entity \u003ccode\u003ev\u003c/code\u003e terkoneksi dengan entity lain\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eCPE(t)\u003c/code\u003e = skor cumulative exposure pada turn ke-\u003ccode\u003et\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mengapa-ini-bukan-sekadar-daftar-pii\"\u003eMengapa ini bukan sekadar \"daftar PII\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-ini-bukan-sekadar-daftar-pii\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau sistem hanya mencatat jenis entity, ia hanya punya daftar. CPE lebih dari itu karena ia memberi skor pada akumulasi dan kombinasi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBase weight menjawab \"bagaimana sensitif entity ini sendirian?\"\u003c/li\u003e\n\u003cli\u003eCo-occurrence graph menjawab \"bagaimana entity ini jadi lebih berbahaya ketika digabung dengan entity lain?\"\u003c/li\u003e\n\u003cli\u003eCPE menggabungkan keduanya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"contoh-kenaikan-non-linear\"\u003eContoh kenaikan non-linear\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-kenaikan-non-linear\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBayangkan percakapan bertahap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTurn 1: Person saja -\u003e CPE rendah\u003c/li\u003e\n\u003cli\u003eTurn 2: tambah Location -\u003e CPE tumbuh lebih dari jumlah sederhana\u003c/li\u003e\n\u003cli\u003eTurn 3: tambah Organization -\u003e CPE tumbuh lagi karena semua node sekarang punya degree lebih tinggi\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting: CPE tidak bertambah linear seperti penjumlahan bobot; ia bisa tumbuh superlinear karena kombinasi antar entity.\u003c/p\u003e\n\u003ch2 id=\"batasan-cpe\"\u003eBatasan CPE\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batasan-cpe\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCPE terlihat matematis, tetapi banyak komponennya masih heuristic.\u003c/p\u003e\n\u003ch3 id=\"1-bobot-entity-tetap-subjektif\"\u003e1. Bobot entity tetap subjektif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-bobot-entity-tetap-subjektif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eNilai sensitivitas entity seperti Person = 0.6 atau Organization = 0.3 adalah keputusan desain, bukan hasil eksperimen teruji panjang.\u003c/p\u003e\n\u003ch3 id=\"2-edge-amplifier-masih-sederhana\"\u003e2. Edge amplifier masih sederhana\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-edge-amplifier-masih-sederhana\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDegree-based amplifier memperlakukan semua co-occurrence sebagai sama. Padahal tidak semua kombinasi entity sama bahayanya.\u003c/p\u003e\n\u003ch3 id=\"3-nilai-spesifik-entity-tidak-dihitung\"\u003e3. Nilai spesifik entity tidak dihitung\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-nilai-spesifik-entity-tidak-dihitung\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCPE paper fokus pada tipe entity, bukan uniqueness atau rarity dari nilai actual. \"Location=Jakarta\" dan \"Location=Dusun kecil X\" diperlakukan sama di level tipe.\u003c/p\u003e\n\u003ch3 id=\"4-implicit-inference-belum-tertangkap\"\u003e4. Implicit inference belum tertangkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-implicit-inference-belum-tertangkap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCPE naik hanya jika extractor mendeteksi PII. Kalau user memberikan clue implisit—misalnya \"kantor super-app ijo\"—ekstraktor mungkin tidak menangkapnya, tapi model/adversary masih bisa menebak.\u003c/p\u003e\n\u003ch3 id=\"5-threshold-masih-knob-manual\"\u003e5. Threshold masih knob manual\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-threshold-masih-knob-manual\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePaper mencoba τ = 1.5, 2.0, 2.5, tetapi belum memberi cara sistematis untuk memilih threshold yang valid di domain nyata.\u003c/p\u003e\n\u003ch2 id=\"kenapa-cpe-masih-penting\"\u003eKenapa CPE masih penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-cpe-masih-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMeski belum sempurna, CPE punya nilai sebagai engineering pattern. Ia membawa perhatian ke dua hal yang sering dilupakan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprivacy risk adalah properti session, bukan message,\u003c/li\u003e\n\u003cli\u003ekombinasi entitas dapat menaikkan risiko lebih besar daripada jumlah entitas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara ini, CPE memperkenalkan mekanisme trigger policy untuk retroactive intervention, bukan sekadar detection.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecamp (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emeasurement (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these lin
