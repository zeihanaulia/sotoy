2},"implementation-details":{"type":"header","text":"Implementation details","value":"implementation-details","line":55,"column":0,"depth":2},"empirical-evaluation":{"type":"header","text":"Empirical evaluation","value":"empirical-evaluation","line":64,"column":0,"depth":2},"key-insight":{"type":"header","text":"Key insight","value":"key-insight","line":100,"column":0,"depth":2},"practical-lessons":{"type":"header","text":"Practical lessons","value":"practical-lessons","line":106,"column":0,"depth":2},"kritik--catatan":{"type":"header","text":"Kritik / catatan","value":"kritik--catatan","line":113,"column":0,"depth":2},"relevance":{"type":"header","text":"Relevance","value":"relevance","line":120,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"hardening-x402-pii-safe-agentic-payments\"\u003eHardening x402: PII-Safe Agentic Payments\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hardening-x402-pii-safe-agentic-payments\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"problem\"\u003eProblem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHardening x402 menyoroti masalah sangat spesifik: AI agent yang melakukan pembayaran otomatis lewat protokol x402 tidak hanya mengirim uang, tapi juga metadata pembayaran. Dalam field \u003ccode\u003eresource_url\u003c/code\u003e, \u003ccode\u003edescription\u003c/code\u003e, dan \u003ccode\u003ereason\u003c/code\u003e, server bisa menyelipkan PII seperti email, nama, SSN, IBAN, nomor kartu, atau nomor telepon.\u003c/p\u003e\n\u003cp\u003eMasalahnya bukan settlement on-chain. Metadata ini bisa bocor ke payment server dan facilitator API sebelum transaksi benar-benar diselesaikan. Dalam skenario agentic, bocoran ini terjadi otomatis karena agent mengikuti alur x402 tanpa review manusia.\u003c/p\u003e\n\u003cp\u003eInti problem paper:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ex402 adalah HTTP-native micropayment;\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e402 Payment Required\u003c/code\u003e memaksa agent membuat token pembayaran;\u003c/li\u003e\n\u003cli\u003etoken itu membawa metadata yang sering kali ditulis sendiri oleh server;\u003c/li\u003e\n\u003cli\u003emetadata itu bisa mengandung data pribadi yang sebenarnya tidak perlu untuk settlement;\u003c/li\u003e\n\u003cli\u003ekalau metadata dikirim apa adanya, PII terkirim sebelum pembayaran diselesaikan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"scope\"\u003eScope\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#scope\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini bukan tentang kriptografi x402 ataupun blockchain settlement. Ini tentang \u003cstrong\u003esecurity middleware dan compliance engineering\u003c/strong\u003e untuk agentic payment.\u003c/p\u003e\n\u003cp\u003eIni artinya fokusnya pada lapisan sebelum token ditandatangani dan dikirim, bukan pada algoritma konsensus atau wallet key management.\u003c/p\u003e\n\u003ch2 id=\"threat-model\"\u003eThreat model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#threat-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper mendefinisikan beberapa ancaman utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePII exfiltration via payment metadata\u003c/strong\u003e: server bisa memaksa agent mengirim data pribadi di \u003ccode\u003eresource_url\u003c/code\u003e, \u003ccode\u003edescription\u003c/code\u003e, atau \u003ccode\u003ereason\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWallet drain\u003c/strong\u003e: server bisa menetapkan harga tinggi atau loop pembayaran berulang.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReplay token\u003c/strong\u003e: token x402 bisa menjadi bearer credential jika bocor.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003ePaper secara eksplisit mengesampingkan threat yang lebih luas seperti bug konsensus on-chain, private key compromise, dan insider facilitator. Fokusnya adalah proteksi pre-execution di sisi agent.\u003c/p\u003e\n\u003ch2 id=\"solution\"\u003eSolution\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#solution\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper mengusulkan \u003ccode\u003eHardenedX402Client\u003c/code\u003e, wrapper middleware untuk x402 client standar.\u003c/p\u003e\n\u003cp\u003ePipeline-nya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePII filter\u003c/strong\u003e: scan \u003ccode\u003eresource_url\u003c/code\u003e, \u003ccode\u003edescription\u003c/code\u003e, dan \u003ccode\u003ereason\u003c/code\u003e dengan regex/NLP;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePolicy engine\u003c/strong\u003e: cek batas pengeluaran per-call, per-day, per-endpoint;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReplay guard\u003c/strong\u003e: fingerprint token dengan HMAC-SHA256 dan dedup store;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAudit log\u003c/strong\u003e: catat semua keputusan dengan JSON-L, HMAC chain, dan evidence.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePrinsip desainnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efail-safe over fail-open;\u003c/li\u003e\n\u003cli\u003ezero-trust metadata;\u003c/li\u003e\n\u003cli\u003eobservable by default.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"implementation-details\"\u003eImplementation details\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implementation-details\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMiddleware ini berdiri di depan x402 client:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejika PII ditemukan, request bisa diredaksi atau ditolak;\u003c/li\u003e\n\u003cli\u003ejika policy dilanggar, request ditolak;\u003c/li\u003e\n\u003cli\u003ejika fingerprint sudah pernah muncul, request dianggap replay;\u003c/li\u003e\n\u003cli\u003ejika semua lolos, token dilanjutkan ke payment server.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaper menyediakan implementasi drop-in untuk x402 client, plus versi Redis-backed replay guard untuk deployment terdistribusi.\u003c/p\u003e\n\u003ch2 id=\"empirical-evaluation\"\u003eEmpirical evaluation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#empirical-evaluation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper membuat synthetic corpus 2.000 x402 metadata triple dari tujuh use case:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI inference\u003c/li\u003e\n\u003cli\u003edata access\u003c/li\u003e\n\u003cli\u003emedical\u003c/li\u003e\n\u003cli\u003ecompute\u003c/li\u003e\n\u003cli\u003emedia\u003c/li\u003e\n\u003cli\u003efinancial\u003c/li\u003e\n\u003cli\u003egeneric\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDari 2.000 sample, 722 mengandung PII dan total 875 label entity.\nEntity yang diuji: \u003ccode\u003eEMAIL_ADDRESS\u003c/code\u003e, \u003ccode\u003ePERSON\u003c/code\u003e, \u003ccode\u003ePHONE_NUMBER\u003c/code\u003e, \u003ccode\u003eUS_SSN\u003c/code\u003e, \u003ccode\u003eCREDIT_CARD\u003c/code\u003e, \u003ccode\u003eIBAN_CODE\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eDistribusi label:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePERSON 36.7%\u003c/li\u003e\n\u003cli\u003eEMAIL 35.8%\u003c/li\u003e\n\u003cli\u003eIBAN 11.0%\u003c/li\u003e\n\u003cli\u003eSSN 9.7%\u003c/li\u003e\n\u003cli\u003ePHONE 3.7%\u003c/li\u003e\n\u003cli\u003eCREDIT_CARD 3.2%\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKonfigurasi yang diuji: 42 total.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eregex-only: 7 konfigurasi\u003c/li\u003e\n\u003cli\u003eNLP with threshold 0.3–0.7: 35 konfigurasi\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRekomendasi paper:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emode=nlp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emin_score=0.4\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eall entities\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHasil rekomendasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprecision 0.972\u003c/li\u003e\n\u003cli\u003erecall 0.827\u003c/li\u003e\n\u003cli\u003emicro-F1 0.894\u003c/li\u003e\n\u003cli\u003ep99 latency 5.73 ms\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"key-insight\"\u003eKey insight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#key-insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian terkuat paper ini adalah temuan bahwa regex cukup untuk entity terstruktur seperti email, IBAN, SSN, credit card.\nTapi untuk \u003ccode\u003ePERSON\u003c/code\u003e di metadata URL atau slug, regex gagal total (F1 = 0). NLP membantu, tetapi recall PERSON hanya sekitar 0.55 karena nama sering muncul sebagai path/slug tanpa konteks bahasa natural.\u003c/p\u003e\n\u003cp\u003eItu membuat argumen paper menarik: \u003cstrong\u003emetadata x402 bukan teks biasa, dan PII detection di situ membutuhkan pendekatan khusus.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"practical-lessons\"\u003ePractical lessons\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-lessons\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ejangan anggap bidang \u003ccode\u003ereason\u003c/code\u003e di payment token tidak berbahaya;\u003c/li\u003e\n\u003cli\u003eagent-payment middleware wajib menyaring metadata sebelum eksekusi;\u003c/li\u003e\n\u003cli\u003ePII detector harus diuji pada URL-structured metadata, bukan hanya natural text;\u003c/li\u003e\n\u003cli\u003efalse positive lebih aman daripada false negative untuk PII filter;\u003c/li\u003e\n\u003cli\u003elatency NLP 5-6 ms masih feasible untuk pre-execution guard.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kritik--catatan\"\u003eKritik / catatan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kritik--catatan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003edataset sintetis, belum diuji traffic nyata;\u003c/li\u003e\n\u003cli\u003eEnglish-only dan slug-heavy format mungkin tidak mewakili global use case;\u003c/li\u003e\n\u003cli\u003ebelum ada evaluasi adversarial obfuscation;\u003c/li\u003e\n\u003cli\u003eredaction bisa memutus business logic resource lookup jika terlalu agresif;\u003c/li\u003e\n\u003cli\u003ereplay guard in-memory perlu Redis untuk distribusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relevance\"\u003eRelevance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevance\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHardening x402 mengingatkan bahwa agentic payment security adalah tentang \u003cstrong\u003econtrol surface\u003c/strong\u003e, bukan hanya model atau chain.\u003c/p\u003e\n\u003cp\u003eAnaloginya cocok untuk agent platform lain: sebelum agent eksekusi cara berbahaya, perlu middleware pre-execution yang memfilter metadata, enforce policy, dan audit keputusan.\u003c/p\u003e\n\u003cp\u003eInsight ini juga menyambung ke zettel: \u003ca href=\"/sotoy/notes/zettel.1777881761976\"\u003ePre-execution metadata filtering is essential for agentic x402 payments\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eOriginal paper: \u003ca href=\"https://arxiv.org/abs/2604.11430\"\u003ehttps://arxiv.org/abs/2604.11430\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epayment (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777881761976\"\u003ePre-execution metadata filtering is essential for agentic x402 payments\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.agent-boundary-pii-filtering\"\u003ePII guardrail antar-agent: dari x402 ke brainstorming + coding agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"F
