type":"header","text":"Operations","value":"operations","line":69,"column":0,"depth":2},"supporting-articles":{"type":"header","text":"Supporting articles","value":"supporting-articles","line":79,"column":0,"depth":2},"denserai--from-rag-to-llm-wiki":{"type":"header","text":"Denser.ai — From RAG to LLM Wiki","value":"denserai--from-rag-to-llm-wiki","line":81,"column":0,"depth":3},"dairai-academy--llm-knowledge-bases":{"type":"header","text":"DAIR.AI Academy — LLM Knowledge Bases","value":"dairai-academy--llm-knowledge-bases","line":87,"column":0,"depth":3},"anthem-création--karpathys-llm-wiki-with-claude-and-obsidian":{"type":"header","text":"Anthem Création — Karpathy’s LLM Wiki with Claude and Obsidian","value":"anthem-création--karpathys-llm-wiki-with-claude-and-obsidian","line":93,"column":0,"depth":3},"why-this-matters-untuk-agentic-engineering":{"type":"header","text":"Why this matters untuk agentic engineering","value":"why-this-matters-untuk-agentic-engineering","line":99,"column":0,"depth":2},"practical-note":{"type":"header","text":"Practical note","value":"practical-note","line":106,"column":0,"depth":2},"sources":{"type":"header","text":"Sources","value":"sources","line":116,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":123,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"karpathy-llm-wiki-compiled-knowledge-base-vs-rag\"\u003eKarpathy LLM Wiki: compiled knowledge base vs RAG\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#karpathy-llm-wiki-compiled-knowledge-base-vs-rag\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"why-this-note\"\u003eWhy this note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-this-note\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue butuh catatan ini karena Karpathy nggak cuma bicara tentang vibe coding. Awal April 2026 dia publikasi GitHub Gist \u003ccode\u003ellm-wiki\u003c/code\u003e sebagai blueprint, bukan repo aplikasi besar. Itu penting: ini pola operasional, bukan produk jadi.\u003c/p\u003e\n\u003cp\u003eIntinya, ini bukan sekadar transcript. Ini sumber primer yang mendefinisikan bagaimana Karpathy memikirkan LLM knowledge base sebagai:\u003c/p\u003e\n\u003cp\u003eraw source → LLM compile → structured markdown wiki → query/lint/update → wiki makin matang.\u003c/p\u003e\n\u003cp\u003eNote ini gue tulis untuk menangkap perbedaan kunci, arsitektur, dan ekosistem implementasi yang muncul setelahnya.\u003c/p\u003e\n\u003ch2 id=\"core-idea\"\u003eCore idea\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-idea\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari gist itu, gue tangkap satu kontras jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emayoritas LLM+dokumen hari ini kayak RAG: upload file, ambil chunk sesuai query, jawab ulang dari awal setiap kali.\u003c/li\u003e\n\u003cli\u003eLLM Wiki bukan begitu. Model membangun wiki markdown persisten yang terus dirawat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi ketika sumber baru masuk, LLM tidak cuma mengindeks. Ia membaca, mengekstrak, mengintegrasikan ke halaman yang sudah ada, memperbarui cross-link, dan menandai kontradiksi.\u003c/p\u003e\n\u003cp\u003eQuote penting dari gist:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"The key difference: the wiki is a persistent, compounding artifact. The cross-references are already there. The contradictions have already been flagged. The synthesis already reflects everything you've read.\"\u003c/li\u003e\n\u003cli\u003e\"You never (or rarely) write the wiki yourself — the LLM writes and maintains all of it. You're in charge of sourcing, exploration, and asking the right questions.\"\u003c/li\u003e\n\u003cli\u003e\"Obsidian is the IDE; the LLM is the programmer; the wiki is the codebase.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"why-the-gist-matters\"\u003eWhy the gist matters\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-the-gist-matters\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat dua hal penting dari gist ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni bukan repo produk launch. Ini idea file yang bisa kamu copy-paste ke agen kamu.\u003c/li\u003e\n\u003cli\u003eIa menegaskan bahwa wiki harus jadi lapisan terpisah yang dimiliki LLM, sementara sumber mentah tetap immutable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan kata lain: \u003ccode\u003ellm-wiki\u003c/code\u003e adalah pola operasional, bukan justifikasinya untuk bikin chat widget.\u003c/p\u003e\n\u003ch2 id=\"what-makes-it-different-from-rag\"\u003eWhat makes it different from RAG\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#what-makes-it-different-from-rag\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eRAG membaca ulang setiap kali. LLM Wiki menyimpan hasil kompilasi.\u003c/li\u003e\n\u003cli\u003eRAG stateless. LLM Wiki stateful dan kembangnya bersifat kumulatif.\u003c/li\u003e\n\u003cli\u003eRAG bekerja langsung pada sumber mentah. LLM Wiki menyelipkan lapisan wiki antara sumber dan query.\u003c/li\u003e\n\u003cli\u003eRAG fokus jawaban cepat. LLM Wiki fokus pemahaman yang bisa dibaca, diperiksa, dan dikembangkan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDenser.ai menyebutnya pergeseran dari \"cooking a meal from scratch every time\" ke \"compiled knowledge layer\".\u003c/p\u003e\n\u003ch2 id=\"architecture\"\u003eArchitecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#architecture\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenurut gist, ada tiga lapisan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRaw sources: sumber mentah yang tetap immutable. File aslinya tetap ada di sini.\u003c/li\u003e\n\u003cli\u003eWiki: markdown yang dihasilkan LLM. Halaman konsep, entitas, ringkasan, perbandingan, sintesis.\u003c/li\u003e\n\u003cli\u003eSchema: file seperti \u003ccode\u003eCLAUDE.md\u003c/code\u003e atau \u003ccode\u003eAGENTS.md\u003c/code\u003e yang memberi aturan struktur, format halaman, dan workflow.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTanpa schema, LLM cuma ngobrol. Dengan schema, ia jadi wiki maintainer.\u003c/p\u003e\n\u003ch2 id=\"operations\"\u003eOperations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#operations\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGist menulis tiga operasi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIngest: tambahkan sumber baru. LLM baca, ringkas, update halaman, perbarui index/log, dan jaga cross-link.\u003c/li\u003e\n\u003cli\u003eQuery: tanya langsung ke wiki. Jawabannya bisa jadi halaman markdown, tabel, slide deck, atau grafik. Yang bagus bisa difileback ke wiki.\u003c/li\u003e\n\u003cli\u003eLint: minta LLM cek kontradiksi, orphan page, klaim usang, gap konsep, dan broken link.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDAIR.AI merangkum ini sebagai fase: ingest → compile → query/enhance → lint/maintain.\u003c/p\u003e\n\u003ch2 id=\"supporting-articles\"\u003eSupporting articles\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#supporting-articles\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"denserai--from-rag-to-llm-wiki\"\u003eDenser.ai — From RAG to LLM Wiki\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#denserai--from-rag-to-llm-wiki\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGist Karpathy muncul 4 April 2026 sebagai \"idea file\", bukan product launch.\u003c/li\u003e\n\u003cli\u003eArtikelnya menegaskan bahwa ini bukan menggantikan RAG, melainkan menambahkan layer compiled knowledge di atasnya.\u003c/li\u003e\n\u003cli\u003ePrinsip pentingnya: compile once, query many; knowledge should compound; provenance non-negotiable; human-readable markdown lebih tahan lama daripada vector store.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"dairai-academy--llm-knowledge-bases\"\u003eDAIR.AI Academy — LLM Knowledge Bases\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dairai-academy--llm-knowledge-bases\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eMereka menyebut LLM sebagai compiler yang baca raw source dan menghasilkan wiki terstruktur.\u003c/li\u003e\n\u003cli\u003ePendekatan ini bisa jalan tanpa embeddings atau vector search pada skala personal.\u003c/li\u003e\n\u003cli\u003eSetiap query seharusnya bisa menambah basis pengetahuan jika outputnya difileback jadi halaman baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"anthem-création--karpathys-llm-wiki-with-claude-and-obsidian\"\u003eAnthem Création — Karpathy’s LLM Wiki with Claude and Obsidian\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#anthem-création--karpathys-llm-wiki-with-claude-and-obsidian\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eWorkflow praktis: copy gist ke LLM, buka folder di Obsidian, simpan sumber di folder \u003ccode\u003esources/\u003c/code\u003e, lalu biarkan LLM membangun wiki.\u003c/li\u003e\n\u003cli\u003eAnalogi utama: wiki itu executable; raw source itu source code; jangan recompile setiap kali.\u003c/li\u003e\n\u003cli\u003eKarpathy disebut mengelola wiki pribadi lebih dari 100 artikel dan 400.000 kata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"why-this-matters-untuk-agentic-engineering\"\u003eWhy this matters untuk agentic engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-this-matters-untuk-agentic-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eIni memperluas pola agentic workflow dari \"AI nulis kode\" ke \"AI nulis dan memelihara pengetahuan\".\u003c/li\u003e\n\u003cli\u003eDalam Software 3.0, LLM jadi bukan hanya interpreter kode; ia juga compiler pengetahuan.\u003c/li\u003e\n\u003cli\u003eUntuk Zettelkasten/second brain, LLM Wiki lebih mirip pra-prosesor yang mengorganisir dokumen mentah sebelum gue memilih insight atomik.\u003c/li\u003e\n\u003cli\u003ePenting dicatat: manusia masih harus memilih sumber, merancang schema, review wiki, dan memutuskan apa yang benar-benar nyantol.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"practical-note\"\u003ePractical note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-note\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue mau coba cepat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003episahkan folder \u003ccode\u003eraw/\u003c/code\u003e dan \u003ccode\u003ewiki/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ebikin schema file (\u003ccode\u003eCLAUDE.md\u003c/code\u003e atau \u003ccode\u003eAGENTS.md\u003c/code\u003e) yang ngasih aturan page type, style, dan link.\u003c/li\u003e\n\u003cli\u003eingest sumber satu per satu, lalu review setiap perubahan wiki.\u003c/li\u003e\n\u003cli\u003ejangan anggap query sebagai akhir. fileback hasil analisis ke wiki.\u003c/li\u003e\n\u003cli\u003ejadikan \u003ccode\u003eindex.md\u003c/code\u003e dan \u003ccode\u003elog.md\u003c/code\u003e sebagai kontrak sistem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sources\"\u003eSources\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sources\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\"\u003ehttps://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://denser.ai/blog/llm-wiki-karpathy-knowledge-base/\"\u003ehttps://denser.ai/blog/llm-wiki-karpathy-knowledge-base/\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://academy.dair.ai/blog/llm-knowledge-bases-karpathy\"\u003ehttps://academy.dair.ai/blog/llm-knowledge-bases-karpathy\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://anthemcreation.com/en/artifici
