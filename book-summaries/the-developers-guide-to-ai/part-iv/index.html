aseline dulu: ini salah satu prinsip terbaik di bab ini","value":"2-baseline-dulu-ini-salah-satu-prinsip-terbaik-di-bab-ini","line":284,"column":0,"depth":3},"3-fine-tuning-classifier-jalur-yang-paling-rapi":{"type":"header","text":"3) Fine-tuning classifier: jalur yang paling rapi","value":"3-fine-tuning-classifier-jalur-yang-paling-rapi","line":311,"column":0,"depth":3},"4-fine-tuning-llm-jangan-langsung-skip-prompt-engineering":{"type":"header","text":"4) Fine-tuning LLM: jangan langsung skip prompt engineering","value":"4-fine-tuning-llm-jangan-langsung-skip-prompt-engineering","line":332,"column":0,"depth":3},"5-peft--lora-teknik-lahir-dari-constraint":{"type":"header","text":"5) PEFT / LoRA: teknik lahir dari constraint","value":"5-peft--lora-teknik-lahir-dari-constraint","line":347,"column":0,"depth":3},"6-dataset-llm-bukan-dataset-classifier-biasa":{"type":"header","text":"6) Dataset LLM bukan dataset classifier biasa","value":"6-dataset-llm-bukan-dataset-classifier-biasa","line":369,"column":0,"depth":3},"7-hasilnya-qwen-naik-dari-58-ke-9302":{"type":"header","text":"7) Hasilnya: Qwen naik dari 58% ke 93.02%","value":"7-hasilnya-qwen-naik-dari-58-ke-9302","line":392,"column":0,"depth":3},"8-sintesis-besar-chapter-11":{"type":"header","text":"8) Sintesis besar Chapter 11","value":"8-sintesis-besar-chapter-11","line":404,"column":0,"depth":3},"9-hubungan-chapter-11-dengan-9-dan-10":{"type":"header","text":"9) Hubungan Chapter 11 dengan 9 dan 10","value":"9-hubungan-chapter-11-dengan-9-dan-10","line":422,"column":0,"depth":3}},"children":[],"parent":"book-summaries.the-developers-guide-to-ai","data":{}},"body":"\u003ch1 id=\"the-developers-guide-to-ai--part-iv-adapting-models-to-real-world-tasks\"\u003eThe Developer’s Guide to AI — Part IV: Adapting Models to Real-World Tasks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-developers-guide-to-ai--part-iv-adapting-models-to-real-world-tasks\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"part-iv-adapting-models-to-real-world-tasks\"\u003ePart IV: Adapting Models to Real-World Tasks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-iv-adapting-models-to-real-world-tasks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"problem-statement\"\u003eProblem statement\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem-statement\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart IV berdiri di titik ketika task sudah terlalu spesifik buat pendekatan generik. Prompt sudah dioptimalkan, retrieval sudah jalan, tapi model masih sering salah di taxonomy internal, format output, dan gaya domain. Intinya: tugasnya adalah memutuskan kapan kita memerlukan perubahan pada model itu sendiri.\u003c/p\u003e\n\u003cp\u003eBagian ini bukannya langsung suruh fine-tune. Dia malah buka dengan sakit yang jelas: inbox perusahaan yang kebanjiran email campur aduk. Di situ gue ngerasa gue lagi mendorong kita untuk mengenali peralihan fokus, dari \"bikin model ngerti dokumen\" ke \"bikin model ngerti niat pesan\".\u003c/p\u003e\n\u003cp\u003eYang bikin bagian pembuka ini nendang adalah satu kutipan ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Although the agent could handle the content of some emails, the bigger problem was not answering them. It was understanding what they were.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat itu memisahkan dua mesin yang sering kita samakan: jawaban generatif versus klasifikasi intent. Untuk inbox, jawaban cuma setengah dari masalah. Sebelum model boleh dijadikan pahlawan auto-reply, dia harus mampu jadi petugas triase. Sales inquiry, press request, support ticket, spam—semua itu butuh label dan routing dulu. Kalau salah taruh, urusannya jadi tidak hanya salah jawab, tapi salah proses.\u003c/p\u003e\n\u003cp\u003eGue suka cara buku ini nggak menjadikan RAG sebagai jawaban universal. Ia membangun pola yang konsisten: prompt engineering sukses, lalu RAG sukses, lalu muncul bottleneck baru. Setelah RAG mengurus knowledge retrieval, tiba saatnya berkata, \"ini masalahnya bukan lagi kurang konteks, ini masalahnya kurang insting task-spesifik.\"\u003c/p\u003e\n\u003cp\u003eDari pembuka Part IV, yang terasa jelas adalah batas RAG. RAG kuat untuk memberi model akses ke fakta produk atau dokumen dukungan. Tapi tugas inbox ini lebih ke: apakah model bisa membedakan pola pitch sales versus support, atau mengenali urgency versus general inquiry. Itu bukan sekadar kata yang relevan, itu adalah taxonomy internal dan kebiasaan operasional yang perlu dipelajari.\u003c/p\u003e\n\u003cp\u003ePertanyaan krusialnya bukan \"bisa promptnya diatur lagi?\" Melainkan \"apakah model bisa diajari perbedaan halus yang berulang di data nyata kita?\" Itu yang membuat fine-tuning terasa earned, bukan default. Fine-tuning di sini mulai masuk ketika task sudah cukup sempit, berulang, dan membutuhkan konsistensi di luar konteks sekadar dokumen.\u003c/p\u003e\n\u003cp\u003eDan buku ini juga memberi satu pengingat yang sangat bagus: fine-tuning membutuhkan data. Bukan cuma data banyak, tapi data yang merefleksikan dunia sebenarnya—email nyata perusahaan dengan label yang benar. Synthetic email bisa membantu, tapi kalau model dilatih terlalu banyak pada email sintetis, bisa jadi performanya mengecewakan di email asli. Intinya: dataset nyata sering kali lebih bernilai daripada contoh yang gampang dibikin.\u003c/p\u003e\n\u003cp\u003eJadi buat gue, pembuka Part IV ini menegaskan satu hal: Phase pertama adalah ngasih model konteks. Phase kedua adalah ngajarin model kebiasaan khusus task. Kalau sebelumnya kita ngobrol tentang prompt dan RAG, sekarang kita diarahkan ke adaptasi model sebagai langkah logis berikutnya ketika workflow bisnis mulai butuh routing, klasifikasi, dan keputusan yang konsisten.\u003c/p\u003e\n\u003ch2 id=\"chapter-9-why-and-when-to-customize-a-model\"\u003eChapter 9: Why and When to Customize a Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-9-why-and-when-to-customize-a-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 9 terasa seperti gerbang keputusan. Sampai titik ini, buku sudah ngajarin beberapa level intervensi: panggil model apa adanya, perbaiki prompt, kasih context lewat RAG, dan bangun retrieval pipeline. Bab ini yang kemudian menjelaskan kapan semua itu masih cukup, dan kapan lo harus mulai mengubah modelnya sendiri.\u003c/p\u003e\n\u003cp\u003eDari tiga kutipan yang mereka sorot, gue sebenarnya sedang membangun decision tree yang penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“For most generic tasks, building a new model isn’t necessary...\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“When you need the LLM to answer questions or generate content based on information that was not in its original training data... RAG is the ideal approach.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“When faced with a situation such as this... you have two ways forward: Build a new model from scratch. Fine-tune a pretrained model.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDari situ, logic bab ini jelas: jangan fine-tune terlalu cepat. Ini bukan bab “ayo fine-tune.” Ini bab “bikin hierarchy intervensi.” Kalau masalahnya masih generic, prompt engineering sering cukup. Kalau masalahnya berhubungan dengan data eksternal atau privat, RAG adalah jawaban yang lebih tepat. Baru kalau masalahnya deep specialization atau task-specific behavior, kita mulai mempertimbangkan customization.\u003c/p\u003e\n\u003cp\u003eBagian awal Chapter 9 menguatkan baseline itu dengan sangat baik. Mereka mulai dengan satu kebenaran yang sehat: penggunaan model via Ollama, Hugging Face, ChatGPT, atau Gemini berarti kita sedang memakai pretrained model. Ini bukan malu. Ini justru nilai besar modern AI. Pretrained model menyelamatkan kita dari kerja raksasa membangun fondasi dari nol.\u003c/p\u003e\n\u003cp\u003eItu kenapa kalimatnya terasa penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“These kinds of pretrained generic models save time and effort because we don’t have to build foundational models from scratch.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat ini seakan bilang: value terbesar AI sekarang adalah bukan pada kemampuan model sendiri, tapi pada kemampuan kita untuk memanfaatkannya.\u003c/p\u003e\n\u003cp\u003eLalu bab ini memberi tiga lapisan keputusan yang rapi. Kalau task masih berada di domain umum model, pakai prompt. Kalau problemnya adalah model tidak tahu data terbaru atau privat, pakai RAG. Kalau yang diperlukan bukan sekadar fakta, tapi kebiasaan format, jargon internal, atau output yang sangat spesifik, maka customization mulai relevan.\u003c/p\u003e\n\u003cp\u003eManufacturing report jadi contoh yang menarik karena dia memetakan batas prompt dan RAG. Model bisa diberi fakta lewat RAG, tapi itu tidak otomatis memberinya kebiasaan yang konsisten dalam format dan jargon proprietary. Di situ kita baru bisa merasakan perbedaan antara masalah knowledge dan masalah behavior. RAG bagus untuk factual grounding. Fine-tuning bagus untuk consistent specialized behavior.\u003c/p\u003e\n\u003cp\u003eGue kemudian menempatkan dua opsi depan muka: build a new model from scratch atau fine-tune a pretrained model. Ini bukan statement dogmatis. Ini soal trade-off. Build from scratch tawarkan kontrol penuh, tapi butuh data, compute, dan expertise yang sangat besar. Fine-tuning memanfaatkan knowledge yang sudah ada, jadi jauh lebih realistis untuk mayoritas developer dan tim.\u003c/p\u003e\n\u003cp\u003eSatu insight yang menurut gue penting adalah ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“At times, a fine-tuned model with lower parameters can outperform a generic model with billions of parameters.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni bukan sekadar puitis. Ini mengingatkan kita bahwa fit spesifik sering lebih berharga daripada kekuatan umum yang besar tapi tidak fokus. Untuk use case yang sempit, model kecil yang sudah diadaptasi kadang lebih baik, lebih murah, dan lebih mudah dideploy.\u003c/p\u003e\n\u003cp\u003eChapter 9 juga membuat pembedaan yang sangat berguna antara strategi fine-tuning dan metode eksekusinya. Strategi yang mereka sebut adalah self-supervised, supervised, dan reinforcement learning. Metode yang dibahas adalah jalur no-code versus technical. Itu penting karena banyak orang mencampur-adukkan “fine-tuning” menjadi satu hal tunggal.\u003c/p\u003e\n\u003cp\u003eSelf-supervised itu seperti model menebak kata berikutnya dari data mentah—cocok kalau yang kita butuhkan adalah style atau pattern tanpa label eksplisit. Supervised adalah flashcard input-output, dan ini sangat relevan untuk task seperti classification atau template generation. RL fine-tuning masuk ketika “jawaban bagus” tidak bisa direpresentasikan hanya sebagai label, tapi sebagai preferensi atau reward.\u003c/p\u003e\n\u003cp\u003eDi sisi lain, no-code tools seperti Hugging Face AutoTrain diposisikan sebagai jalan masuk yang lebih ringan. Mereka memperlihatkan bahwa fine-tuning tidak harus langsung identik dengan script GPU neraka. Tapi gue juga tetap bilang: no-code sering menjadi black box. Kalau lo mau kontrol dan pemahaman lebih, jalan technical tetap perlu dilalui.\u003c/p\u003e\n\u003cp\u003eAkhirnya, bab ini menutup dengan struktur yang deceptively simple:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Prepare the data. Fine-tune the model. Test the new model.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat ini sederhana, tapi itu kekuatannya. Fine-tuning jadi workflow yang bisa dikelola, bukan misteri. Dan kalau mau jujur, biasanya bottleneck terbesar ada di data dan evaluasi, bukan di training loop-nya sendiri.\u003c/p\u003e\n\u003cp\u003eJadi buat gue, Chapter 9 bukan cuma ngajarin teknik adaptation. Dia ngajarin cara memilih jalur. Ini adalah bab yang memastikan kita tahu kapan masalah kita masih bisa diselesaikan dengan prompt/RAG, dan kapan kita harus mulai mengubah modelnya secara sadar.\u003c/p\u003e\n\u003ch2 id=\"chapter-10-preparing-data-for-fine-tuning\"\u003eChapter 10: Preparing Data for Fine-Tuning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-10-preparing-data-for-fine-tuning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau Chapter 9 adalah bab keputusan, Chapter 10 adalah bab persiapan bahan mentah. Di sini fokusnya bergeser dari strategi besar ke satu hal yang sering diremehkan: data.\u003c/p\u003e\n\u003cp\u003eKalimat pembukanya baik, tapi bukan sekadar textbook:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“A well-prepared dataset is crucial for the success of any ML model, as it directly influences the model’s ability to learn and generalize.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu terasa seperti thesis bab ini. Fine-tuning yang bagus sering kalah atau menang di data, bukan di training code.\u003c/p\u003e\n\u003cp\u003eChapter 10 membuat dua prinsip itu jelas:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003emodel belajar dari data,\u003c/li\u003e\n\u003cli\u003emodel gagal karena data.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDari situ, bab ini nggak lagi ngomong model atau GPU. Dia ngomong tentang cara membuat task jadi bisa dipelajari secara benar oleh model.\u003c/p\u003e\n\u003ch3 id=\"1-chapter-ini-sebenarnya-tentang-apa\"\u003e1) Chapter ini sebenarnya tentang apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-chapter-ini-sebenarnya-tentang-apa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini membuka dengan roadmap bab: curate relevant data, select and label email, convert textual labels into numerical format, dan organize into training, validation, and testing sets.\u003c/p\u003e\n\u003cp\u003eKalau gue gambar struktur babnya, bentuknya seperti pipeline:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Raw emails] --\u003e B[Select relevant samples]\n    B --\u003e C[Assign labels]\n    C --\u003e D[Encode labels]\n    D --\u003e E[Split into train / validation / test]\n    E --\u003e F[Save as reusable dataset]\n\u003c/div\u003e\n\u003cp\u003eItu penting karena bab ini sedang menunjukkan bahwa dataset building itu pipeline, bukan sekadar file collection.\u003c/p\u003e\n\u003ch3 id=\"2-theres-no-need-to-look-beyond-your-own-inbox\"\u003e2) “There’s no need to look beyond your own inbox.”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-theres-no-need-to-look-beyond-your-own-inbox\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni kutipan yang sederhana tapi kuat.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“To prepare the dataset, there’s no need to look beyond your own inbox.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni melawan insting umum orang saat bicara ML: cari benchmark publik, cari dataset besar, cari data generik yang “resmi”. Untuk task spesifik seperti email classification, data terbaik biasanya adalah data nyata dari task lo sendiri.\u003c/p\u003e\n\u003cp\u003eItu prinsip yang digarisbawahi bab ini: task-specific model adaptation harus dimulai dari task-specific data reality.\u003c/p\u003e\n\u003ch3 id=\"3-manual-labeling-itu-gak-glamor-tapi-inti-kualitas\"\u003e3) Manual labeling itu gak glamor, tapi inti kualitas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-manual-labeling-itu-gak-glamor-tapi-inti-kualitas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sini ditegaskan bahwa jika email belum terkategori, lo harus meluangkan waktu untuk memilih sampel representatif dan memberi label yang simpel tapi konsisten.\u003c/p\u003e\n\u003cp\u003eKata kuncinya adalah representative sample, bukan jumlah besar semata. Dataset kecil tapi representatif sering lebih kuat daripada dataset besar tapi bermasalah distribusinya.\u003c/p\u003e\n\u003cp\u003eIni juga bukan sekadar administratif. Ini proses mengubah realitas bisnis menjadi bentuk yang bisa dipelajari model.\u003c/p\u003e\n\u003ch3 id=\"4-label-example-yang-dipakai-buku-itu-sengaja-spesifik\"\u003e4) Label example yang dipakai buku itu sengaja spesifik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-label-example-yang-dipakai-buku-itu-sengaja-spesifik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBuku pakai label \u003ccode\u003eIN_Bank\u003c/code\u003e, \u003ccode\u003eIN_School\u003c/code\u003e, \u003ccode\u003eUS_Bank\u003c/code\u003e, \u003ccode\u003eUS_School\u003c/code\u003e. Pilihan ini bagus karena menunjukkan bahwa fine-tuning cocok untuk narrow distinctions yang meaningful untuk satu konteks.\u003c/p\u003e\n\u003cp\u003eContoh ini tidak dimaksudkan untuk ditiru mentah-mentah. Pesan pentingnya adalah: label lo harus datang dari task lo sendiri, dan bisa jadi jauh lebih sempit / kontekstual daripada kategori umum.\u003c/p\u003e\n\u003ch3 id=\"5-structuring-the-raw-data-text--label\"\u003e5) Structuring the raw data: text + label\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-structuring-the-raw-data-text--label\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFormat dataset yang dipakai buku itu sederhana tapi fundamental: dua kolom \u003ccode\u003etext\u003c/code\u003e dan \u003ccode\u003elabel\u003c/code\u003e. Dalam supervised classification, basic form ini memang yang paling esensial.\u003c/p\u003e\n\u003cp\u003eYang menarik adalah keputusan desain yang muncul di sini: apakah inputnya full email atau summary? Full email memberi detail lebih banyak, tapi juga lebih noisy. Summary ringkas, tapi bisa kehilangan nuance. Ini menunjukkan bahwa dataset prep sudah memuat keputusan desain sebelum training dimulai.\u003c/p\u003e\n\u003ch3 id=\"6-encoding-labels-kenapa-label-harus-jadi-angka\"\u003e6) Encoding labels: kenapa label harus jadi angka?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-encoding-labels-kenapa-label-harus-jadi-angka\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGue menjelaskan bahwa ML model memproses numerik, jadi label kategorikal perlu diubah ke ID angka.\u003c/p\u003e\n\u003cp\u003eIni bukan sekadar kebutuhan teknis. Ini juga soal memastikan mapping label konsisten dan mudah diterjemahkan kembali ke label manusia.\u003c/p\u003e\n\u003cp\u003eAngka kategori di sini bukan ordinal; dia murni ID. Itu penting untuk dipahami.\u003c/p\u003e\n\u003ch3 id=\"7-splitting-the-data-ini-bukan-formalitas\"\u003e7) Splitting the data: ini bukan formalitas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-splitting-the-data-ini-bukan-formalitas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian splitting adalah salah satu bagian paling penting. Bab ini menekankan train/validation/test sekalian shuffle supaya model tidak belajar pola dari urutan data.\u003c/p\u003e\n\u003cp\u003eTrain untuk belajar, validation untuk memantau dan tune, test untuk evaluasi final. Ini soal epistemic honesty dalam eksperimen ML.\u003c/p\u003e\n\u003ch3 id=\"8-dari-12-file-ke-3-file-membangun-dataset-global\"\u003e8) Dari 12 file ke 3 file: membangun dataset global\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-dari-12-file-ke-3-file-membangun-dataset-global\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMereka mulai dengan empat kategori yang masing-masing di-split, lalu menggabungkannya kembali menjadi satu train file, satu validation file, satu test file. Ini menunjukkan bahwa model seharusnya belajar satu problem multi-class classification, bukan empat classifier terpisah.\u003c/p\u003e\n\u003ch3 id=\"9-hugging-face-datasets-dataset-sebagai-objek-self-describing\"\u003e9) Hugging Face Datasets: dataset sebagai objek self-describing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-hugging-face-datasets-dataset-sebagai-objek-self-describing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBuku ini tidak berhenti pada CSV mentah. Mereka memperkenalkan Hugging Face Datasets karena dataset yang baik harus membawa skema dan metadata, bukan cuma file mentah.\u003c/p\u003e\n\u003cp\u003eDataset yang self-describing membuat pipeline downstream lebih aman dan reproducible.\u003c/p\u003e\n\u003ch3 id=\"10-feature-dan-schema-detail-kecil-tapi-penting\"\u003e10) “Feature” dan schema: detail kecil tapi penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-feature-dan-schema-detail-kecil-tapi-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSaat mereka mendefinisikan feature \u003ccode\u003etext\u003c/code\u003e dan \u003ccode\u003elabel\u003c/code\u003e, itu bukan sekadar teknis. Itu sedang memperkenalkan data contract yang jelas.\u003c/p\u003e\n\u003cp\u003eJika schema longgar, error bisa masuk diam-diam.\u003c/p\u003e\n\u003ch3 id=\"11-casting-label-jadi-classlabel\"\u003e11) Casting label jadi \u003ccode\u003eClassLabel\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-casting-label-jadi-classlabel\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni langkah yang keliatan kecil, tapi sangat penting.\u003c/p\u003e\n\u003cp\u003eDengan meng-cast label ke \u003ccode\u003eClassLabel\u003c/code\u003e, data jadi lebih tegas. Label bukan string arbitrer lagi, tapi kategori terdefinisi dengan domain nilai terbatas.\u003c/p\u003e\n\u003cp\u003eIni adalah bentuk schema hardening yang membuat pipeline lebih aman.\u003c/p\u003e\n\u003ch3 id=\"12-youve-completed-the-heavy-lifting-of-data-engineering\"\u003e12) “You’ve completed the heavy lifting of data engineering.”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-youve-completed-the-heavy-lifting-of-data-engineering\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalimat ini jujur dan penting. Banyak orang menganggap data prep sebelah mata, padahal bab ini bilang justru itulah pekerjaan beratnya.\u003c/p\u003e\n\u003cp\u003eTraining code bisa ringkas, tapi dataset yang rapi dan representatif adalah pekerjaan yang memakan waktu.\u003c/p\u003e\n\u003ch3 id=\"13-hubungan-chapter-10-dengan-chapter-9\"\u003e13) Hubungan Chapter 10 dengan Chapter 9\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-hubungan-chapter-10-dengan-chapter-9\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 9 = memutuskan apakah fine-tuning dibutuhkan.\nChapter 10 = menyiapkan bahan belajar untuk fine-tuning.\u003c/p\u003e\n\u003cp\u003eTanpa Chapter 10, fine-tuning terasa magis. Dengan Chapter 10, fine-tuning jadi proses belajar yang sangat bergantung pada kualitas materi.\u003c/p\u003e\n\u003ch3 id=\"14-kutipan-paling-penting-dari-chapter-10\"\u003e14) Kutipan paling penting dari Chapter 10\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-kutipan-paling-penting-dari-chapter-10\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“A well-prepared dataset is crucial...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“there’s no need to look beyond your own inbox.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Aim for at least 50 to 100 emails for each category...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“the classification labels ... need to be in a numerical format”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“If we did [use all data for training], the model might memorize the data instead of learning general patterns...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Libraries like Hugging Face’s Datasets library solve this problem...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Congratulations! You’ve successfully created your first properly formatted dataset for fine-tuning.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"15-sintesis-besar-chapter-10\"\u003e15) Sintesis besar Chapter 10\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-sintesis-besar-chapter-10\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 10 mengajarkan bahwa fine-tuning dimulai bukan dari model, tapi dari dataset yang representatif, konsisten, dan bisa dievaluasi dengan jujur. Gue menunjukkan bagaimana memilih email nyata dari inbox sendiri, memberi label yang relevan, mengubah label menjadi ID numerik, lalu membagi data ke train/validation/test agar model tidak sekadar menghafal. Setelah itu, dataset mentah ditingkatkan menjadi objek yang lebih kokoh dengan Hugging Face Datasets.\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 10 mengubah contoh-contoh email acak menjadi kurikulum pembelajaran yang bisa dipahami model.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi sebenarnya yang sedang terjadi di Chapter 10 ini apa?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGue sedang memindahkan task bisnis ke bentuk pedagogis yang bisa dipelajari mesin.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDan itu esensi dari data preparation:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erealitas bisnis → contoh,\u003c/li\u003e\n\u003cli\u003econtoh → label,\u003c/li\u003e\n\u003cli\u003elabel → schema,\u003c/li\u003e\n\u003cli\u003eschema → dataset,\u003c/li\u003e\n\u003cli\u003edataset → bahan belajar model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e★ Insight ─────────────────────────────────────\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eData preparation bukan tahap administratif, tapi tahap desain pembelajaran model.\u003c/li\u003e\n\u003cli\u003eFine-tuning yang bagus sangat bergantung pada kualitas kategori, representativitas sampel, dan split evaluasi.\u003c/li\u003e\n\u003cli\u003eHugging Face Datasets memperkenalkan dataset sebagai objek yang membawa makna, tipe, dan kontrak penggunaan.\u003c/li\u003e\n\u003cli\u003eMenyiapkan data berarti lebih dari kumpulkan file—itu termasuk schema, mapping, dan pipeline reproducibility.\u003c/li\u003e\n\u003cli\u003eSetelah bab ini, fine-tuning seharusnya tidak lagi terlihat seperti proses magis, tapi seperti proses belajar terstruktur.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"chapter-11-fine-tuning-models-in-practice\"\u003eChapter 11: Fine-Tuning Models in Practice\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-11-fine-tuning-models-in-practice\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau Chapter 9 itu bab keputusan, dan Chapter 10 itu bab menyiapkan bahan ajar, maka Chapter 11 adalah bab ketika semuanya benar-benar dijalankan. Ini titik di mana buku berhenti bicara “kenapa fine-tuning penting” dan mulai bilang: ini workflow riilnya kalau lo benar-benar mau melatih model untuk task lo.\u003c/p\u003e\n\u003cp\u003eAda dua baris pembuka yang langsung bikin ekspektasi lo turun ke bumi:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Now it’s time for your first hands-on fine-tuning experience.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Fine-tuning is a time-consuming process.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDua quote ini penting. Mereka menegaskan bahwa Chapter 11 bukan magic show. Ini proses yang butuh waktu, compute, dan disiplin eksperimen.\u003c/p\u003e\n\u003ch3 id=\"1-bab-ini-dibuka-dengan-dua-model-sekaligus\"\u003e1) Bab ini dibuka dengan dua model sekaligus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-bab-ini-dibuka-dengan-dua-model-sekaligus\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePilihan dua model ini menurut gue cerdas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003edistilbert/distilbert-base-uncased\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eQwen/Qwen2.5-0.5B-Instruct\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDua model ini menunjukkan bahwa “fine-tuning” bukan satu jalan tunggal. Ada jalur model klasifikasi biasa dan ada jalur LLM kecil. Itu membuat bab ini terasa lebih realistis dan lebih berguna.\u003c/p\u003e\n\u003ch4 id=\"a-distilbert\"\u003ea. DistilBERT\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-distilbert\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni model klasifikasi yang lebih klasik. Jadi pas buat menjelaskan workflow yang paling rapi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etokenization,\u003c/li\u003e\n\u003cli\u003eTrainer API,\u003c/li\u003e\n\u003cli\u003eevaluasi akurasi,\u003c/li\u003e\n\u003cli\u003eperubahan performa yang gampang dimengerti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"b-qwen-05b-instruct\"\u003eb. Qwen 0.5B Instruct\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-qwen-05b-instruct\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni LLM kecil. Jadi dia cocok buat nunjukin:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003echat/prompt template,\u003c/li\u003e\n\u003cli\u003eformat instruction,\u003c/li\u003e\n\u003cli\u003ePEFT/LoRA,\u003c/li\u003e\n\u003cli\u003ekenapa fine-tuning LLM beda dari fine-tuning classifier biasa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi bab ini ingin lo lihat satu hal penting: \u003cstrong\u003efine-tuning itu family of workflows, bukan satu script universal.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"2-baseline-dulu-ini-salah-satu-prinsip-terbaik-di-bab-ini\"\u003e2) Baseline dulu: ini salah satu prinsip terbaik di bab ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-baseline-dulu-ini-salah-satu-prinsip-terbaik-di-bab-ini\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini sehat banget karena mulai dari baseline. Sebelum training, mereka ukur dulu performa model yang dipilih dalam zero-shot classification. Tanpa baseline, angka setelah fine-tuning gampang kehilangan konteks.\u003c/p\u003e\n\u003cp\u003eHasil baseline yang mereka tunjukin:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGoogle Gemini: \u003cstrong\u003e100%\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eDistilBERT: \u003cstrong\u003e69%\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eQwen 0.5B Instruct: \u003cstrong\u003e58%\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHasil ini penting karena menunjukkan dua hal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel besar yang kuat memang bisa sangat bagus tanpa fine-tuning,\u003c/li\u003e\n\u003cli\u003emodel kecil punya gap performa yang bisa ditutup dengan fine-tuning.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan kata lain, fine-tuning di sini bukan eksperimen akademik. Ini pertanyaan ekonomis: bisa nggak model yang lebih murah dan lebih mudah dijalankan didekatkan ke model besar pada task sempit?\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Task: email classification] --\u003e B[Measure zero-shot baseline]\n    B --\u003e C1[Gemini: 100%]\n    B --\u003e C2[DistilBERT: 69%]\n    B --\u003e C3[Qwen 0.5B: 58%]\n    C2 --\u003e D[Need improvement via fine-tuning]\n    C3 --\u003e D\n\u003c/div\u003e\n\u003ch3 id=\"3-fine-tuning-classifier-jalur-yang-paling-rapi\"\u003e3) Fine-tuning classifier: jalur yang paling rapi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-fine-tuning-classifier-jalur-yang-paling-rapi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDistilBERT jadi babak pertama karena dia paling “direct”. Task-nya jelas: input teks, output label. Ini menunjukkan bentuk fine-tuning yang paling bersih dan paling gampang dipahami.\u003c/p\u003e\n\u003cp\u003ePipeline dasarnya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Load labeled dataset] --\u003e B[Tokenizer]\n    B --\u003e C[Tokenized dataset]\n    C --\u003e D[Data collator]\n    D --\u003e E[Load pretrained classification model]\n    E --\u003e F[Set training arguments]\n    F --\u003e G[Trainer]\n    G --\u003e H[Train]\n    H --\u003e I[Evaluate]\n    I --\u003e J[Save model]\n\u003c/div\u003e\n\u003cp\u003eBagian ini penting karena modelnya didesain untuk task itu. Jadi hasil fine-tuning 69% → 100% bukan sekadar angka impresif, tapi pernyataan bahwa untuk task klasifikasi sempit dan terlabel jelas, model kecil bisa jadi sangat efektif.\u003c/p\u003e\n\u003ch3 id=\"4-fine-tuning-llm-jangan-langsung-skip-prompt-engineering\"\u003e4) Fine-tuning LLM: jangan langsung skip prompt engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-fine-tuning-llm-jangan-langsung-skip-prompt-engineering\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah classifier, bab ini naik ke LLM. Dan yang gue suka adalah mereka nggak langsung bilang fine-tuning itu solusi otomatis. Mereka malah tanya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Why Not Prompt Engineering?”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu pertanyaan sehat banget. Di banyak workflow nyata, prompt engineering masih jadi baseline terbaik untuk biaya dan kecepatan. Fine-tuning baru relevan saat lo butuh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eperforma lebih tinggi,\u003c/li\u003e\n\u003cli\u003eadaptasi domain lebih dalam,\u003c/li\u003e\n\u003cli\u003eperilaku lebih konsisten,\u003c/li\u003e\n\u003cli\u003egeneralisasi di niche task.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukan karena modelnya keren, tapi karena masalahnya memang sudah melewati batas yang bisa diselesaikan cuma dengan prompt.\u003c/p\u003e\n\u003ch3 id=\"5-peft--lora-teknik-lahir-dari-constraint\"\u003e5) PEFT / LoRA: teknik lahir dari constraint\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-peft--lora-teknik-lahir-dari-constraint\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini nggak ngebahas LoRA karena dia lagi tren. LoRA dibahas sebagai respons terhadap realitas biaya dan hardware.\u003c/p\u003e\n\u003cp\u003eYang penting di sini adalah intinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efull fine-tuning mahal,\u003c/li\u003e\n\u003cli\u003ebutuh banyak compute,\u003c/li\u003e\n\u003cli\u003eberisiko overfitting dan catastrophic forgetting,\u003c/li\u003e\n\u003cli\u003esementara LoRA memungkinkan hanya sebagian kecil parameter yang dilatih.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLoRA kerjanya seperti pasang adapter kecil di model yang dibekukan. Jadi bukan remodel total, tapi update terarah pada bagian penting.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Pretrained base model weights] --\u003e B[Frozen]\n    C[Small LoRA adapter layers] --\u003e D[Trainable]\n    B --\u003e E[PEFT model]\n    D --\u003e E\n    E --\u003e F[Task-adapted behavior with fewer trainable params]\n\u003c/div\u003e\n\u003ch3 id=\"6-dataset-llm-bukan-dataset-classifier-biasa\"\u003e6) Dataset LLM bukan dataset classifier biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-dataset-llm-bukan-dataset-classifier-biasa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni salah satu pergeseran mental terbesar di chapter ini.\u003c/p\u003e\n\u003cp\u003eUntuk classifier, datasetnya text + label. Untuk LLM, datasetnya harus menjadi chat-style example:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esystem\u003c/li\u003e\n\u003cli\u003euser\u003c/li\u003e\n\u003cli\u003eassistant\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi lo nggak cuma ngajarin model untuk memetakan input ke class ID. Lo mengajarinya pola percakapan: format, role, instruction, jawaban.\u003c/p\u003e\n\u003cp\u003eItu penting karena kalau formatnya salah, model bisa bingung, output bisa berantakan, dan kualitas fine-tuning turun.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Chapter 10 labeled dataset\ntext + numeric label] --\u003e B[Convert to chat-style training examples]\n    B --\u003e C[system / user / assistant messages]\n    C --\u003e D[apply_chat_template]\n    D --\u003e E[LLM fine-tuning dataset]\n\u003c/div\u003e\n\u003ch3 id=\"7-hasilnya-qwen-naik-dari-58-ke-9302\"\u003e7) Hasilnya: Qwen naik dari 58% ke 93.02%\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-hasilnya-qwen-naik-dari-58-ke-9302\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni angka yang menarik. Qwen fine-tuned 93.02% tidak setara langsung dengan DistilBERT 100%. Itu karena kedua model punya objective yang berbeda.\u003c/p\u003e\n\u003cp\u003eDistilBERT adalah classifier khusus; outputnya sempit dan langsung. Qwen adalah LLM generatif yang dipaksa belajar classification dari pola percakapan. Jadi 93% sudah menunjukkan bahwa LoRA + dataset yang tepat bisa mendorong model kecil cukup jauh tanpa biaya full fine-tuning.\u003c/p\u003e\n\u003cp\u003eDari sini pelajaran pentingnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel khusus bisa lebih efisien untuk task klasifikasi murni,\u003c/li\u003e\n\u003cli\u003etapi LLM fine-tuned memberi fleksibilitas lebih besar untuk task instruction/chat,\u003c/li\u003e\n\u003cli\u003edan pilihan model harus didasarkan pada bentuk task, bukan hanya karena LLM lagi hype.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"8-sintesis-besar-chapter-11\"\u003e8) Sintesis besar Chapter 11\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-sintesis-besar-chapter-11\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas, Chapter 11 sedang membangun pola pikir eksekusi yang disiplin:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emulai dari baseline,\u003c/li\u003e\n\u003cli\u003epilih model sesuai bentuk task,\u003c/li\u003e\n\u003cli\u003efine-tuning adalah pipeline lengkap,\u003c/li\u003e\n\u003cli\u003eteknik efisien seperti PEFT/LoRA penting,\u003c/li\u003e\n\u003cli\u003edan evaluasi setelah training adalah keharusan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan begitu, bab ini bukan hanya tutorial code. Dia menanamkan workflow eksperimen: data prep, tokenization/template, config, trainer, evaluasi.\u003c/p\u003e\n\u003cp\u003eKalimat yang paling kena buat gue di chapter ini adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Now it’s time for your first hands-on fine-tuning experience.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIt menandai transisi dari konsep ke eksekusi. Dan itu tepat: Chapter 11 adalah saat kita akhirnya benar-benar menjalankan apa yang sudah dibangun di Chapter 9 dan 10.\u003c/p\u003e\n\u003ch3 id=\"9-hubungan-chapter-11-dengan-9-dan-10\"\u003e9) Hubungan Chapter 11 dengan 9 dan 10\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-hubungan-chapter-11-dengan-9-dan-10\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 9 memutuskan apakah fine-tuning perlu.\nChapter 10 menyiapkan dataset.\nChapter 11 menjalankan proses itu.\u003c/p\u003e\n\u003cp\u003eTanpa Chapter 11, fine-tuning tetap terasa abstrak. Dengan Chapter 11, fine-tuning menjadi workflow yang bisa diukur dan dievaluasi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 11 membuktikan bahwa model kecil, yang dilatih dengan data yang tepat dan teknik efisien, bisa berubah dari “lumayan” menjadi sangat berguna untuk task nyata.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-developers-guide-to-ai\"\u003eThe Developer's Guide to AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.
