alue":"level-2-integration-ish-dengan-mock-channel","line":168,"column":0,"depth":4},"level-3-real-behavior-proof":{"type":"header","text":"Level 3: Real behavior proof","value":"level-3-real-behavior-proof","line":186,"column":0,"depth":4},"arsitektur-yang-bisa-ditiru":{"type":"header","text":"Arsitektur yang bisa ditiru","value":"arsitektur-yang-bisa-ditiru","line":215,"column":0,"depth":2},"insight-terakhir":{"type":"header","text":"Insight terakhir","value":"insight-terakhir","line":272,"column":0,"depth":2}},"children":[],"parent":"gql1okgkws4w6zsv0ixl8cp","data":{}},"body":"\u003ch1 id=\"telegram-behavior-proof\"\u003eTelegram Behavior Proof\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#telegram-behavior-proof\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi sini \"project\" yang gue lihat adalah workflow QA evidence di OpenClaw: OpenClaw app, Telegram extension, Crabbox, Codex/GitHub workflow, dan bukti perilaku nyata.\u003c/p\u003e\n\u003cp\u003eBukan seluruh OpenClaw produk. Fokusnya: bagaimana PR ini jadi paket audit kecil, bukan cuma patch kode.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePR ini nggak hanya menjelaskan bug dan fix.\u003c/li\u003e\n\u003cli\u003ePR ini juga membawa: runtime path, environment, before/after, evidence scope, dan area yang belum dites.\u003c/li\u003e\n\u003cli\u003eCrabbox di sini bukan sekadar screen recorder. Ia adalah agent workspace control plane: prepare box, sync checkout, run remote command, collect evidence, release.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-pertanyaan-kunci\"\u003e6 pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-sebenernya-openclaw-lagi-ngetes-apa\"\u003e1. Sebenernya OpenClaw lagi ngetes apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-sebenernya-openclaw-lagi-ngetes-apa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePR ini kecil, tapi karena konteksnya Telegram formatter, bug-nya bisa berdampak besar.\u003c/p\u003e\n\u003cp\u003eBug: output Telegram hilang blank line antara bullet block dan numbered section.\u003c/p\u003e\n\u003cp\u003eSebelum fix:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003ereport/draft.\\n3. Cognee\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSesudah fix:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003ereport/draft.\\n\\n3. Cognee\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi chat interface, blank line bukan sekadar estetika. Dia adalah pembatas semantik.\u003c/p\u003e\n\u003cp\u003eAtomic idea: \u003cstrong\u003ebug kecil formatting dapat merusak struktur pesan di channel chat\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"2-pipeline-teknisnya-kira-kira-gimana\"\u003e2. Pipeline teknisnya kira-kira gimana?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-pipeline-teknisnya-kira-kira-gimana\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDari PR dan bot review, alurnya bisa dipetakan seperti ini:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIssue masuk\n  ↓\nBug direproduksi dari input nyata\n  ↓\nPatch dibuat di Telegram formatter\n  ↓\nUnit/regression test ditambah\n  ↓\nBot review mengecek correctness + security + changelog\n  ↓\nCrabbox menjalankan real Telegram Desktop proof\n  ↓\nBefore/after GIF dipublish ke PR\n  ↓\nLabel berubah jadi proof: supplied\n  ↓\nPR di-merge\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYang penting bukan satu tool sakti. Ini adalah \u003cstrong\u003erantai kerja\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOpenClaw: system under test\u003c/li\u003e\n\u003cli\u003eTelegram extension: area bug\u003c/li\u003e\n\u003cli\u003eFormatter: kode yang diubah\u003c/li\u003e\n\u003cli\u003eCodex/GitHub workflow: proses patch dan before/after\u003c/li\u003e\n\u003cli\u003eCrabbox: environment, execution, evidence\u003c/li\u003e\n\u003cli\u003eBot review: gating, label, boundary\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-kenapa-bot-review-nya-penting\"\u003e3. Kenapa bot review-nya penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-kenapa-bot-review-nya-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi PR ini ada bot yang menolak merge karena temuan teknis bukan sekadar test fail.\u003c/p\u003e\n\u003cp\u003eTemuan bot:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enormalizer baru hanya melacak fenced code block\u003c/li\u003e\n\u003cli\u003eMarkdown juga punya indented code block\u003c/li\u003e\n\u003cli\u003enormalizer bekerja sebelum parser paham struktur\u003c/li\u003e\n\u003cli\u003eini bisa membuat blank line masuk ke literal code block\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea: \u003cstrong\u003esemakin awal normalizer bekerja, semakin tinggi risikonya mengubah syntax yang belum dipahami\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eBot tidak cuma mengatakan \"error\". Bot menelusuri boundary dan meminta regression guard untuk kasus indented code block.\u003c/p\u003e\n\u003ch3 id=\"4-apa-peran-crabbox-di-sini\"\u003e4. Apa peran Crabbox di sini?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-apa-peran-crabbox-di-sini\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCrabbox bukan hanya recorder. Dia adalah control plane agent workspace.\u003c/p\u003e\n\u003cp\u003eDari publiknya, Crabbox bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esewa/siapkan environment\u003c/li\u003e\n\u003cli\u003esync checkout lokal ke remote\u003c/li\u003e\n\u003cli\u003ejalankan command jarak jauh\u003c/li\u003e\n\u003cli\u003estream output\u003c/li\u003e\n\u003cli\u003ecollect evidence\u003c/li\u003e\n\u003cli\u003erelease box\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDalam PR ini evidence-nya lebih dari sekadar GIF:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebefore GIF\u003c/li\u003e\n\u003cli\u003eafter GIF\u003c/li\u003e\n\u003cli\u003ereal Telegram Desktop session\u003c/li\u003e\n\u003cli\u003ereal Telegram user\u003c/li\u003e\n\u003cli\u003eshared group\u003c/li\u003e\n\u003cli\u003emodel response deterministic\u003c/li\u003e\n\u003cli\u003eSUT bot reply via OpenClaw Telegram\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-mengapa-model-response-harus-deterministic\"\u003e5. Mengapa model response harus deterministic?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-mengapa-model-response-harus-deterministic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena tujuan proof adalah mengisolasi perubahan formatter.\u003c/p\u003e\n\u003cp\u003eJika model response berubah, before/after jadi lemah.\u003c/p\u003e\n\u003cp\u003ePrinsipnya mirip eksperimen yang benar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekontrol prompt sama\u003c/li\u003e\n\u003cli\u003ekontrol mock response sama\u003c/li\u003e\n\u003cli\u003ekontrol channel sama\u003c/li\u003e\n\u003cli\u003ekontrol UI sama\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang diuji hanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eformatter main vs formatter PR\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea: \u003cstrong\u003ereal behavior proof tetap butuh controlled experiment\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"6-kalau-mau-direproduce-levelnya-ada-berapa\"\u003e6. Kalau mau direproduce, levelnya ada berapa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-kalau-mau-direproduce-levelnya-ada-berapa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJangan langsung lompat ke full Crabbox + Telegram real.\u003c/p\u003e\n\u003cp\u003eBagi jadi tiga level.\u003c/p\u003e\n\u003ch4 id=\"level-1-lokal-minimal\"\u003eLevel 1: Lokal minimal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-1-lokal-minimal\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eTujuannya: buktikan formatter bug.\u003c/p\u003e\n\u003cp\u003eYang dibutuhkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erepo OpenClaw\u003c/li\u003e\n\u003cli\u003eNode/pnpm sesuai repo\u003c/li\u003e\n\u003cli\u003efile Telegram formatter\u003c/li\u003e\n\u003cli\u003etest file Telegram formatter\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh perintah:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e extensions/telegram/src/format.test.ts\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003eexec\u003c/span\u003e oxfmt --check --threads\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token number\"\u003e1\u003c/span\u003e extensions/telegram/src/format.ts extensions/telegram/src/format.test.ts CHANGELOG.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch4 id=\"level-2-integration-ish-dengan-mock-channel\"\u003eLevel 2: Integration-ish dengan mock channel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-2-integration-ish-dengan-mock-channel\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eTujuannya: buktikan output path benar.\u003c/p\u003e\n\u003cp\u003eAlur:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003emock model response\n  ↓\nOpenClaw Telegram formatter\n  ↓\nrender ke Telegram HTML/chunks\n  ↓\nassert pemisah benar\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKhususnya: cek normal reply rendering dan chunked reply rendering.\u003c/p\u003e\n\u003ch4 id=\"level-3-real-behavior-proof\"\u003eLevel 3: Real behavior proof\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-3-real-behavior-proof\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eBaru ini mirip PR sebenarnya.\u003c/p\u003e\n\u003cp\u003eAlur ideal:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003egit checkout main\nrun OpenClaw Telegram bot test\nkirim prompt via Telegram user ke group\nmock model deterministic\nrecord Telegram Desktop: main-before\ncheckout PR branch\nulang prompt sama\nrecord Telegram Desktop: pr-after\npublish GIF/video + notes ke PR\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKontrol penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt sama\u003c/li\u003e\n\u003cli\u003emock response sama\u003c/li\u003e\n\u003cli\u003eTelegram account/session sama\u003c/li\u003e\n\u003cli\u003echat/group sama\u003c/li\u003e\n\u003cli\u003escreen size sama\u003c/li\u003e\n\u003cli\u003efont/UI scale sama\u003c/li\u003e\n\u003cli\u003ecommit SHA jelas\u003c/li\u003e\n\u003cli\u003erecording timestamp jelas\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"arsitektur-yang-bisa-ditiru\"\u003eArsitektur yang bisa ditiru\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arsitektur-yang-bisa-ditiru\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian paling penting bukan recorder. Yang paling penting adalah \u003cstrong\u003eevidence schema\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eMinimal architecture:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eGitHub PR\n  ↓\nCI / GH Workflow\n  ↓\nCrabbox / Runner\n  ↓\nReal Channel\n  ↓\nEvidence Pack\n  ↓\nPR Comment\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh evidence schema:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Real behavior proof\u003c/span\u003e\n\nBehavior addressed:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [jelaskan bug yang diperbaiki]\n\nEnvironment:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e app:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e channel:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e OS:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e commit before:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e commit after:\n\nScenario:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [siapa mengirim apa ke mana]\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [response mock/model apa]\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [expected visual behavior apa]\n\nEvidence:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e before:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e after:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e logs:\n\nObserved before:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e ...\n\nObserved after:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e ...\n\nWhat was not tested:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e ...\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eGIF/video tanpa konteks itu lemah. GIF + commit + scenario + expected result + scope not-tested yang membuatnya menjadi audit evidence.\u003c/p\u003e\n\u003ch2 id=\"insight-terakhir\"\u003eInsight terakhir\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-terakhir\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProject ini paling menarik bukan karena \"mereka bikin GIF before/after\".\u003c/p\u003e\n\u003cp\u003eSebab yang lebih penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emereka sedang membangun workflow di mana perubahan kode harus membawa bukti perilaku nyata\u003c/li\u003e\n\u003cli\u003ePR jadi paket audit kecil, bukan sekadar patch\u003c/li\u003e\n\u003cli\u003eevidence harus terstruktur agar tidak overclaim\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau mau mulai di project sendiri:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003epilih flow yang susah dipercaya hanya dari diff\u003c/li\u003e\n\u003cli\u003ebuat deterministic fixture input\u003c/li\u003e\n\u003cli\u003ejalankan main vs patch\u003c/li\u003e\n\u003cli\u003erecord behavior dengan alat yang ada\u003c/li\u003e\n\u003cli\u003eattach artifact + context\u003c/li\u003e\n\u003cli\u003etulis batasan apa yang tidak dites\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eVideo proof bukan test utama. Dia adalah \u003cstrong\u003elapisan trust di atas test\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eqa (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eevidence (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eopenclaw (Private)\u003c
