ext":"9. Trimming history: memori selalu bertarung dengan token budget","value":"9-trimming-history-memori-selalu-bertarung-dengan-token-budget","line":399,"column":0,"depth":3},"10-summarizing-history-kompres-konteks-sebelum-dibuang":{"type":"header","text":"10. Summarizing history: kompres konteks sebelum dibuang","value":"10-summarizing-history-kompres-konteks-sebelum-dibuang","line":409,"column":0,"depth":3},"sintesis-chapter-6":{"type":"header","text":"Sintesis Chapter 6","value":"sintesis-chapter-6","line":421,"column":0,"depth":3}},"children":[],"parent":"book-summaries.the-developers-guide-to-ai","data":{}},"body":"\u003ch1 id=\"the-developers-guide-to-ai--part-ii-prompt-engineering\"\u003eThe Developer’s Guide to AI — Part II: Prompt Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-developers-guide-to-ai--part-ii-prompt-engineering\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"part-ii-prompt-engineering\"\u003ePart II: Prompt Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-ii-prompt-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"problem-statement\"\u003eProblem statement\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem-statement\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart II menjawab masalah yang muncul setelah kita bisa memanggil model: output kadang ngawur, konsistensi hilang, dan model merespons seperti orang asing. Di bagian ini, tugasnya adalah membuat AI bekerja dengan cara yang lebih bisa dikendalikan: lewat instruksi, contoh, format, dan struktur prompt.\u003c/p\u003e\n\u003cp\u003eFontnya bukan lagi teks acak, tapi antarmuka yang bisa dikoreksi, diuji, dan dipelihara.\u003c/p\u003e\n\u003ch2 id=\"chapter-4-fundamentals-of-prompt-engineering\"\u003eChapter 4: Fundamentals of Prompt Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-4-fundamentals-of-prompt-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian ini salah satu yang krusial. Setelah Part I membangun jalur integrasi dan Part II mulai membangun kontrol sistem, Part IV langsung menegaskan bahwa prompt engineering adalah lapisan kontrol pertama yang harus dikuasai.\u003c/p\u003e\n\u003ch3 id=\"1-prompt-adalah-alat-kontrol-bukan-mantra-ajaib\"\u003e1. Prompt adalah alat kontrol, bukan mantra ajaib\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-prompt-adalah-alat-kontrol-bukan-mantra-ajaib\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDua kalimat pembuka yang paling penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“LLMs are not magic. They simply predict a sequence of tokens based on your prompt.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Prompt engineering is all about trying to steer an LLM toward the right predictions.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu intinya. Prompt bukan sekadar cara ngomong ke AI. Prompt adalah mekanisme untuk mengarahkan distribusi kemungkinan output model.\u003c/p\u003e\n\u003cp\u003eDari sini kita harus berpindah mindset:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edari “AI harusnya ngerti maksud gue”\u003c/li\u003e\n\u003cli\u003eke “gue harus mengekspresikan maksud gue dalam bentuk token yang model lihat.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-model-tidak-mengerti-model-hanya-melihat-token\"\u003e2. Model tidak mengerti; model hanya melihat token\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-model-tidak-mengerti-model-hanya-melihat-token\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKutipan penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“At the end of the day, an LLM does not understand you. It doesn’t know what you mean. It knows only what you type.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni adalah koreksi mental model yang paling sehat. Banyak kekecewaan muncul karena orang menganggap model punya maksud tersembunyi. Padahal tidak.\u003c/p\u003e\n\u003cp\u003ePrompt engineering adalah usaha menjembatani dua domain:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eniat manusia\u003c/li\u003e\n\u003cli\u003eapa yang model benar-benar lihat\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Your intent] --\u003e B[Design explicit prompt]\n    B --\u003e C[Token sequence seen by LLM]\n    C --\u003e D[Predicted output distribution]\n\u003c/div\u003e\n\u003ch3 id=\"3-software-deterministic-vs-prompt-probabilistic\"\u003e3. Software deterministic vs prompt probabilistic\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-software-deterministic-vs-prompt-probabilistic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePerbedaan mendasar antara function biasa dan prompt:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    subgraph Traditional Programming\n        A1[Typed input] --\u003e B1[Explicit rules]\n        B1 --\u003e C1[Deterministic output]\n    end\n\n    subgraph Prompting an LLM\n        A2[Free-form prompt] --\u003e B2[Probabilistic model]\n        B2 --\u003e C2[Flexible but variable output]\n    end\n\u003c/div\u003e\n\u003cp\u003eFunction tradisional sempit dan tegas. LLM lebih fleksibel tapi juga lebih variabel.\u003c/p\u003e\n\u003cp\u003eBukan berarti salah pakai LLM. Tapi ini mengajarkan kita memilih tool yang cocok untuk task: deterministic task untuk code, fuzzy language task untuk LLM.\u003c/p\u003e\n\u003ch3 id=\"4-prompt-bagus-bukan-panjang-tapi-jelas\"\u003e4. Prompt bagus bukan panjang, tapi jelas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-prompt-bagus-bukan-panjang-tapi-jelas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePrompt yang terlalu vague memberi model ruang interpretasi terlalu lebar. Prompt yang terlalu panjang bisa menambah noise, biaya, dan konteks yang tidak fokus.\u003c/p\u003e\n\u003cp\u003eInti prompt engineering adalah memperkecil ruang kemungkinan output ke arah yang kita inginkan.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Vague prompt] --\u003e B[Wide set of likely continuations]\n    B --\u003e C[High variability]\n\n    D[Specific prompt] --\u003e E[Narrower response space]\n    E --\u003e F[Better alignment]\n\u003c/div\u003e\n\u003cp\u003eJadi panjang prompt bukan tujuan. Tujuannya adalah kejelasan, detail yang relevan, dan keseimbangan.\u003c/p\u003e\n\u003ch3 id=\"5-kerangka-lima-elemen-prompt\"\u003e5. Kerangka lima elemen prompt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-kerangka-lima-elemen-prompt\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSalah satu framework paling berguna di bab ini adalah melihat prompt sebagai komposisi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInstruction\u003c/li\u003e\n\u003cli\u003eContext\u003c/li\u003e\n\u003cli\u003eExamples\u003c/li\u003e\n\u003cli\u003eQuery\u003c/li\u003e\n\u003cli\u003eOutput format\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    P[Prompt] --\u003e I[Instruction]\n    P --\u003e C[Context]\n    P --\u003e E[Examples]\n    P --\u003e Q[Query]\n    P --\u003e O[Output format]\n\u003c/div\u003e\n\u003cp\u003eIni bukan cuma teori. Ini membuat prompt bisa didiagnosis. Kalau output jelek, kita bisa cek: apakah instruksinya kabur? context-nya kurang? contoh tidak relevan? query ambigu? format belum jelas?\u003c/p\u003e\n\u003ch3 id=\"6-prompt-engineering-dan-knowledge-creation\"\u003e6. Prompt engineering dan knowledge creation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-prompt-engineering-dan-knowledge-creation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini juga menunjukkan bahwa LLM bisa dipakai bukan hanya untuk menjawab, tapi juga untuk membersihkan knowledge. Contoh: menulis ulang email support jadi artikel how-to.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    E[Support email chains] --\u003e L[LLM]\n    L --\u003e A[Draft how-to article]\n    A --\u003e H[Human review]\n    H --\u003e KB[Knowledge base]\n\u003c/div\u003e\n\u003cp\u003eIni menunjukkan bahwa prompt engineering juga masuk ke workflow internal, bukan hanya ke UI akhir.\u003c/p\u003e\n\u003ch3 id=\"7-context-window-dan-prompt-capacity\"\u003e7. Context window dan prompt capacity\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-context-window-dan-prompt-capacity\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePrompt tidak hidup di udara. Ia terbatas oleh context window dan token.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eflowchart LR\n    A[All available knowledge] --\u003e B{Dump all into prompt?}\n    B -- Yes --\u003e C[Hit limits / high cost / slower / less reliable]\n    B -- No --\u003e D[Curate relevant context]\n    D --\u003e E[Smaller, clearer, cheaper prompt]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKarena itu prompt engineering juga harus memikirkan pemilihan informasi, bukan sekadar menambahkan informasi.\u003c/p\u003e\n\u003ch3 id=\"8-tokenization--budget\"\u003e8. Tokenization = budget\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-tokenization--budget\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini menjelaskan bahwa kata bukan selalu token. Prompt adalah sejumlah token; token adalah biaya dan kapasitas.\u003c/p\u003e\n\u003cp\u003ePrompt engineering menjadi bagian biaya sistem:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[input tokens] --\u003e C[request cost]\n    B[output tokens] --\u003e C\n    C --\u003e D[monthly bill]\n\u003c/div\u003e\n\u003cp\u003eInput panjang dan output verbose sama-sama menaikkan biaya. Ini membuat prompt bukan hanya masalah bahasa, tapi juga masalah ekonomis.\u003c/p\u003e\n\u003ch3 id=\"9-lost-in-the-middle-effect\"\u003e9. Lost-in-the-middle effect\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-lost-in-the-middle-effect\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAda warning penting: informasi di tengah prompt bisa kurang dipakai dibanding informasi di depan atau belakang.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Long prompt start] --\u003e M[LLM]\n    B[Long prompt middle] --\u003e M\n    C[Long prompt end] --\u003e M\n    M --\u003e R[Model uses start/end better than middle]\n\u003c/div\u003e\n\u003cp\u003eJadi hanya karena prompt muat dalam window tidak berarti prompt itu optimal.\u003c/p\u003e\n\u003ch3 id=\"10-model-choice-tetap-relevan\"\u003e10. Model choice tetap relevan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-model-choice-tetap-relevan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePrompt engineering bukan pengganti model choice. Bab ini tetap menekankan bahwa kualitas hasil juga tergantung pada model, training data, dan konfigurasi.\u003c/p\u003e\n\u003cp\u003eUji prompt di beberapa model adalah praktik yang sehat.\u003c/p\u003e\n\u003ch3 id=\"11-prompt-adalah-artefak-desain-sistem\"\u003e11. Prompt adalah artefak desain sistem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-prompt-adalah-artefak-desain-sistem\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau disederhanakan, bab ini sedang mengatakan:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eprompt adalah artefak desain yang menghubungkan kebutuhan bisnis dan mesin probabilistik.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBukan seni merayu, bukan mantra rahasia. Ini proses engineering.\u003c/p\u003e\n\u003ch3 id=\"12-diagram-besar-chapter-4\"\u003e12. Diagram besar Chapter 4\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-diagram-besar-chapter-4\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Business task] --\u003e B{Traditional code or LLM}\n    B -- Deterministic --\u003e C[Use code]\n    B -- Language task --\u003e D[Use LLM]\n    D --\u003e E[Design prompt]\n    E --\u003e I[Instruction]\n    E --\u003e Cxt[Context]\n    E --\u003e Ex[Examples]\n    E --\u003e Q[Query]\n    E --\u003e O[Output format]\n    E --\u003e T[Tokenized prompt]\n    T --\u003e W[Context window / cost constraints]\n    W --\u003e R[Need clarity + relevance + brevity]\n    R --\u003e S[Better alignment]\n\u003c/div\u003e\n\u003ch3 id=\"13-quotes-beban-berat\"\u003e13. Quotes beban berat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-quotes-beban-berat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa kutipan paling penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Prompt engineering is all about trying to steer an LLM toward the right predictions.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It doesn’t know what you mean. It knows only what you type.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The more open-ended the prompt ... the more the LLM will ‘guess’ what information you want.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Detailed, clear, and concise instructions are the most important considerations...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Instead of dumping everything into the prompt, we have to deliberately curate and shape the input...”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“All the words you send are converted to tokens, which costs both time and money.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"14-sintesis-besar\"\u003e14. Sintesis besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-sintesis-besar\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 4 mengajarkan bahwa prompt engineering adalah disiplin desain input untuk sistem probabilistik. Prompt yang baik menjelaskan tugas, struktur konteks, contoh, query, dan format output. Ia juga harus mempertimbangkan batas token, context window, biaya, dan relevansi.\u003c/p\u003e\n\u003ch3 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003ePrompt engineering bukan soal finding magic words; ini soal mengontrol probabilistic output.\u003c/li\u003e\n\u003cli\u003eLima elemen prompt memberi framework diagnosis yang lebih tajam.\u003c/li\u003e\n\u003cli\u003eTokenisasi memberi prompt dimensi ekonomi.\u003c/li\u003e\n\u003cli\u003eLost-in-the-middle effect memperlihatkan bahwa ”cukup muat” belum berarti ”cukup baik.”\u003c/li\u003e\n\u003cli\u003ePrompt engineering adalah lapisan kontrol pertama dan termurah yang punya porsi besar dalam sistem AI.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"chapter-5-prompt-engineering-techniques\"\u003eChapter 5: Prompt Engineering Techniques\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-5-prompt-engineering-techniques\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 5 mengangkat prompt engineering dari fondasi mental ke toolbox teknik. Bab ini menegaskan sejak awal bahwa ini masih area riset terbuka, jadi bab ini bukan daftar hukum tetap, melainkan kumpulan pattern kerja yang harus diuji di setiap model dan use case.\u003c/p\u003e\n\u003ch3 id=\"1-instruction-prompting\"\u003e1. Instruction prompting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-instruction-prompting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni bentuk paling dasar, tapi tetap krusial. Kalimat inti bab ini adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“LLMs are only as good as the instructions we give them.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePrompt yang jelas saja sudah bisa membuat model melakukan tugas berbeda: data extraction, PII redaction, dan synthetic data generation. Untuk extraction, prompt terbaik kadang bukan hanya “ambil field ini,” tetapi juga menambahkan rule seperti \"jika tidak ada, tulis null\" dan \"jangan infer.\" Untuk redaction, LLM tidak menggantikan regex, tetapi bisa melengkapi semantik edge case. Untuk synthetic data, penting menjelaskan kontrak output: jumlah baris, header, kolom, dan format.\u003c/p\u003e\n\u003ch3 id=\"2-persona-prompting\"\u003e2. Persona prompting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-persona-prompting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePersona bukan sekadar tone. Ini teknik untuk memberi model identitas fiksi yang mengunci framing dan asumsi konteks.\u003c/p\u003e\n\u003cp\u003eContoh yang kuat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“You are a software developer”\u003c/li\u003e\n\u003cli\u003e“You are a Google help desk representative”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKedua persona bisa menanggapi pertanyaan yang sama secara berbeda karena mereka mengubah konteks, depth, dan sudut pandang. Persona berfungsi sebagai compression mechanism: beberapa constraint implisit dibungkus dalam satu role. Kelebihannya adalah prompt bisa lebih pendek dan konsisten; risikonya adalah jika role terlalu umum, model bisa menebak detail yang tidak diinginkan.\u003c/p\u003e\n\u003ch3 id=\"3-zero-shot-one-shot-few-shot\"\u003e3. Zero-shot, one-shot, few-shot\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-zero-shot-one-shot-few-shot\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni inti in-context learning. Perbedaan dasarnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ezero-shot = instruksi saja,\u003c/li\u003e\n\u003cli\u003eone-shot = instruksi + satu contoh,\u003c/li\u003e\n\u003cli\u003efew-shot = instruksi + beberapa contoh.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBanyak task domain-specific tidak perlu fine-tune. Dengan contoh-contoh yang tepat, model bisa mulai mempelajari pola internal tanpa pelatihan ulang. Trade-offnya jelas: zero-shot murah tapi rawan variasi; one-shot lebih terarah tetapi bisa overfit ke pola sempit; few-shot lebih stabil tetapi mengonsumsi token dan context window.\u003c/p\u003e\n\u003ch3 id=\"4-delimiters\"\u003e4. Delimiters\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-delimiters\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDelimiters membantu struktur prompt yang jelas. Bagian seperti \u003ccode\u003e\u0026#x3C;instructions\u003e\u003c/code\u003e, \u003ccode\u003e\u0026#x3C;examples\u003e\u003c/code\u003e, \u003ccode\u003e\u0026#x3C;context\u003e\u003c/code\u003e, dan \u003ccode\u003e\u0026#x3C;query\u003e\u003c/code\u003e membuat model lebih mudah membedakan peran setiap bagian. Ini sebenarnya information architecture untuk prompt.\u003c/p\u003e\n\u003ch3 id=\"5-chain-of-thought\"\u003e5. Chain-of-thought\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-chain-of-thought\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCoT mendorong model untuk tidak langsung melompat ke jawaban ketika task butuh banyak langkah. Dengan meminta reasoning step-by-step, model bisa menghasilkan jalur internal yang kemudian membantu jawaban akhirnya.\u003c/p\u003e\n\u003cp\u003eTapi trade-off-nya nyata: response jadi lebih panjang, biaya naik, latency naik, dan ada risiko leaking reasoning yang tidak cocok untuk UX production. CoT cocok untuk task reasoning multi-step, bukan untuk semua prompt.\u003c/p\u003e\n\u003ch3 id=\"6-prompt-chaining\"\u003e6. Prompt chaining\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-prompt-chaining\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePrompt chaining memecah masalah kompleks menjadi pipeline prompt kecil, misalnya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eextract key facts,\u003c/li\u003e\n\u003cli\u003eclassify / reason,\u003c/li\u003e\n\u003cli\u003eformat / finalize.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni memberi scoped subtasks, explicit I/O contracts, debugging lebih mudah, reuse komponen, dan token load yang biasanya lebih rendah. Prompt chaining adalah bentuk komposisi prompting yang paling dekat dengan software engineering.\u003c/p\u003e\n\u003ch3 id=\"7-best-practices\"\u003e7. Best practices\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-best-practices\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian penutupnya berisi beberapa prinsip developer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egunakan instruksi positif, bukan larangan negatif,\u003c/li\u003e\n\u003cli\u003etreat prompts like code: versioning, testing, iterasi,\u003c/li\u003e\n\u003cli\u003ecollaboration with the model boleh dilakukan, tapi hasil tetap harus diuji,\u003c/li\u003e\n\u003cli\u003eexperiment dengan variasi prompt dan gunakan evaluasi A/B, review manual, cross-model, dan regression baseline.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"sintesis-chapter-5\"\u003eSintesis Chapter 5\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-chapter-5\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 5 memberitahu kita bahwa prompt engineering yang matang bukan mencari satu prompt sakti, tapi menyusun kombinasi teknik yang tepat untuk task, model, dan trade-off. Ia memperkenalkan prompting sebagai pattern language: instruction prompting, persona, in-context examples, delimiters, reasoning aid, dan chaining. Satu hal penting adalah bahwa teknik-teknik ini saling melengkapi, bukan saling menggantikan.\u003c/p\u003e\n\u003ch2 id=\"chapter-6-prompt-engineering-in-code\"\u003eChapter 6: Prompt Engineering in Code\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-6-prompt-engineering-in-code\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 6 adalah titik di mana prompt berhenti jadi eksperimen manual dan mulai diperlakukan sebagai bagian nyata dari sistem software. Pembukaannya sudah jelas:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Writing a great prompt is only half the battle.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The moment you drop that prompt into real code, where latency matters, tokens cost money, and users never read the docs, you enter a different arena.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu inti bab ini. Selama ini kita ngomong prompt seolah-olah hanya hidup di playground atau chat box. Di production, prompt hidup di dunia yang jauh lebih keras: latency, token cost, state, user input aneh, downstream code butuh format stabil, dan maintenance jangka panjang.\u003c/p\u003e\n\u003ch3 id=\"1-memilih-library-sebagai-keputusan-arsitektural\"\u003e1. Memilih library sebagai keputusan arsitektural\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-memilih-library-sebagai-keputusan-arsitektural\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini membuka dengan pilihan integrasi yang jelas: direct REST API, low-level SDK, lightweight wrapper, atau high-level framework. Bukan sekadar “pakai X”, tetapi mengajak kita mikir:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah bottleneck utama kita kontrol dan debuggability?\u003c/li\u003e\n\u003cli\u003eapakah kita butuh delivery cepat dan shared conventions?\u003c/li\u003e\n\u003cli\u003eapakah kita siap menukar fleksibilitas dengan abstraksi?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKutipan kuncinya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Higher abstraction buys speed of delivery and shared conventions. Lower abstraction buys performance, debuggability, and long-term freedom.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni bukan filosofi kosong. Ini mengubah library choice jadi keputusan situasional yang boleh berubah seiring tim dan kebutuhan.\u003c/p\u003e\n\u003ch3 id=\"2-hosted-api--gampang-tapi-security-tetap-harus-disiplin\"\u003e2. Hosted API = gampang, tapi security tetap harus disiplin\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-hosted-api--gampang-tapi-security-tetap-harus-disiplin\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSelanjutnya bab ini masuk ke hosted API. Di sini kita masuk ke software engineering reality: API key, environment variables, secret hygiene, billing, dan config management.\u003c/p\u003e\n\u003cp\u003eWarning-nya sederhana tapi penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Keep your API keys private!”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eBanyak demo AI gagal di produksi karena kebocoran credential, commit key, atau logs yang menampung secret. Bab ini mengingatkan bahwa AI integration tetap tunduk pada prinsip keamanan ops biasa.\u003c/p\u003e\n\u003ch3 id=\"3-output-configuration-sekarang-kita-pegang-tombol-model\"\u003e3. Output configuration: sekarang kita pegang tombol model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-output-configuration-sekarang-kita-pegang-tombol-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sinilah prompt mulai kehilangan ilusi bahwa semua kontrol ada di prompt. Kualitas output juga ditentukan oleh knob konfigurasi.\u003c/p\u003e\n\u003cp\u003eDua keluarga besar yang dibahas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoutput length (\u003ccode\u003emax tokens\u003c/code\u003e, \u003ccode\u003enum_predict\u003c/code\u003e, \u003ccode\u003estop sequences\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003esampling controls (\u003ccode\u003etemperature\u003c/code\u003e, \u003ccode\u003etop_p\u003c/code\u003e, \u003ccode\u003etop_k\u003c/code\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"3a-output-length\"\u003e3a. Output length\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3a-output-length\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eKalau task-nya sempit—misalnya classification—lo tidak butuh paragraf. Lo butuh label. Maka \u003ccode\u003enum_predict: 1\u003c/code\u003e dan stop sequences bukan optimasi kecil; itu pola pikir production yang memaksa model tidak babbling.\u003c/p\u003e\n\u003ch4 id=\"3b-sampling-controls\"\u003e3b. Sampling controls\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3b-sampling-controls\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eTemperature rendah berarti jalur output lebih stabil. Temperature tinggi berarti output lebih kreatif. Top P dan Top K menambah batas atas kandidat token.\u003c/p\u003e\n\u003cp\u003eYang penting: \u003ccode\u003etemperature=0\u003c/code\u003e tidak berarti deterministik absolut. Ini hanya membuat output lebih predictable, bukan menghilangkan semua variasi.\u003c/p\u003e\n\u003ch3 id=\"4-prompt-templates-dari-string-liar-ke-artefak-yang-bisa-dipelihara\"\u003e4. Prompt templates: dari string liar ke artefak yang bisa dipelihara\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-prompt-templates-dari-string-liar-ke-artefak-yang-bisa-dipelihara\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini kuat ketika memperkenalkan prompt templates. Prompt bukan lagi string concat ad-hoc di code. Ia harus dipisah menjadi template yang berisi bagian tetap dan slot dinamis.\u003c/p\u003e\n\u003cp\u003eJinja dipakai sebagai contoh yang pas karena ia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoriented ke plain text,\u003c/li\u003e\n\u003cli\u003emendukung placeholder,\u003c/li\u003e\n\u003cli\u003ebisa loop dan condition,\u003c/li\u003e\n\u003cli\u003enetral untuk prompt.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTemplate memberi reusability, maintainability, safer interpolation, dan tempat untuk menaruh guardrail default seperti fallback response.\u003c/p\u003e\n\u003ch3 id=\"5-memisahkan-prompt-dari-code\"\u003e5. Memisahkan prompt dari code\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-memisahkan-prompt-dari-code\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eEpisode ini melanjutkan ke rekomendasi penting: simpan template di file eksternal. Itu membuat prompt menjadi aset yang bisa dibandingkan, direview, dan diubah tanpa merombak logic bisnis.\u003c/p\u003e\n\u003cp\u003eKalau prompt bercampur dengan code, repo cepat jadi berantakan. Kalau prompt disimpan terpisah, kode jadi bersih, prompt review jadi mungkin, dan non-dev bisa kontribusi lebih mudah.\u003c/p\u003e\n\u003ch3 id=\"6-dynamic-templates-and-context-assembly\"\u003e6. Dynamic templates and context assembly\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-dynamic-templates-and-context-assembly\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini juga menunjukkan bahwa template bisa dinamis: loop artikel, delimiters per sumber, dan assembly context dari banyak teks.\u003c/p\u003e\n\u003cp\u003eIni adalah jembatan ke RAG. Prompt bukan lagi satu string saja; ia adalah hasil render dari beberapa sumber data yang diambil, dibatasi, dan dipisah rapi.\u003c/p\u003e\n\u003ch3 id=\"7-messages-dan-roles-prompt-berubah-jadi-percakapan-terstruktur\"\u003e7. Messages dan roles: prompt berubah jadi percakapan terstruktur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-messages-dan-roles-prompt-berubah-jadi-percakapan-terstruktur\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian berikutnya menurut gue besar: LLM chat-style bukan lagi satu blob teks; ia adalah ordered list of messages dengan roles:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esystem\u003c/li\u003e\n\u003cli\u003euser\u003c/li\u003e\n\u003cli\u003eassistant\u003c/li\u003e\n\u003cli\u003etool\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSystem message dipandang sebagai kernel prompt: global instructions, persona, policy, guardrail. User message adalah request yang berubah-ubah. Assistant message adalah history. Tool message adalah hasil eksternal.\u003c/p\u003e\n\u003cp\u003eIni adalah transisi mental model: prompt = not just text, but conversation protocol.\u003c/p\u003e\n\u003ch3 id=\"8-conversation-history-memori-itu-ilusi-aplikasi\"\u003e8. Conversation history: memori itu ilusi aplikasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-conversation-history-memori-itu-ilusi-aplikasi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sini ada koreksi penting: LLM itu stateless. Aplikasi yang mengirim ulang history menciptakan ilusi memory.\u003c/p\u003e\n\u003cp\u003eBab ini memberi pattern class \u003ccode\u003eConversationHistory\u003c/code\u003e untuk mengelola system message, messages list, dan rendering request. Ini mengajarkan bahwa yang “inget” bukan model, tapi aplikasi.\u003c/p\u003e\n\u003ch3 id=\"9-trimming-history-memori-selalu-bertarung-dengan-token-budget\"\u003e9. Trimming history: memori selalu bertarung dengan token budget\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-trimming-history-memori-selalu-bertarung-dengan-token-budget\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSeiring percakapan bertambah panjang, token budget cepat habis. Solusi sederhana yang dijelaskan adalah remove oldest user/assistant pair ketika limit terlampaui.\u003c/p\u003e\n\u003cp\u003eIni menunjukkan prinsip penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ememori tidak gratis,\u003c/li\u003e\n\u003cli\u003esetiap turn yang disimpan ada biaya token,\u003c/li\u003e\n\u003cli\u003erelevansi harus dibayar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"10-summarizing-history-kompres-konteks-sebelum-dibuang\"\u003e10. Summarizing history: kompres konteks sebelum dibuang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-summarizing-history-kompres-konteks-sebelum-dibuang\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian paling menarik adalah penggunaan LLM untuk membantu mengelola dirinya sendiri. Daripada membuang seluruh history, kita bisa membuat ringkasan dan menggantikan history lama dengan summary singkat.\u003c/p\u003e\n\u003cp\u003eIni bukan hanya fitur internal. Ini pattern orchestration:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt utama untuk chat,\u003c/li\u003e\n\u003cli\u003ehelper prompt untuk summarization,\u003c/li\u003e\n\u003cli\u003emaintenance prompt untuk memory compression.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan itu sudah menempatkan prompt engineering sebagai bagian arsitektur sistem.\u003c/p\u003e\n\u003ch3 id=\"sintesis-chapter-6\"\u003eSintesis Chapter 6\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-chapter-6\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 6 mengangkat prompt dari level “isi request” ke level “infrastruktur perilaku” dalam aplikasi. Di sini kita belajar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epilih abstraction layer yang cocok,\u003c/li\u003e\n\u003cli\u003eatur output dengan config knobs,\u003c/li\u003e\n\u003cli\u003esusun prompt dengan templates,\u003c/li\u003e\n\u003cli\u003episahkan prompt dari code,\u003c/li\u003e\n\u003cli\u003erangkai context dinamis,\u003c/li\u003e\n\u003cli\u003egunakan roles untuk chat,\u003c/li\u003e\n\u003cli\u003ekelola history aplikasi,\u003c/li\u003e\n\u003cli\u003etrim atau summarize agar token budget tetap masuk akal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi production, prompt bukan lagi sekadar teks untuk model. Dia adalah kontrak, state, resource, dan artefak yang harus dikelola seperti komponen software lainnya.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-developers-guide-to-ai\"\u003eThe Developer's Guide to AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyncMode":"noCommit","enableAutoFoldFrontmatter":false,"enableEditorDecorations":true,"maxPreviewsCached":10,"maxNoteLength":204800,"seeds":{"dendron.templates":{}},"enableFullHierarchyNoteTitle":false},"preview":{"enableFMTitle":true,"enableNoteTitleForLink":true,"enableFrontmatterTags":true,"enableHashesForFMTags":false,"enablePrettyRefs":true,"enableKatex":true,"automaticallyShowPreview":false},"publishing":{"enableFMTitle":true,"enableNoteTitleForLink":true,"enablePrettyRefs":true,"enableKatex":true,"copyAssets":true,"siteHierarchies":["root"],"writeStubs":true,"siteRootDir":"docs","seo":{"title":"Sotoy","description":"Personal knowledge space about anything I learn. Notes, knowledge, and ideas from me.","author":"Zeihan Aulia","twitter":"zeihanaulia","image":{"url":"https://pbs.twimg.com/profile_images/502375255256485888/1UYtt7PT_400x400.jpeg","alt":"Software Engineer, "}},"github":{"enableEditLink":true,"editLinkText":"Edit this page on GitHub","editBranch":"main","editViewMode":"tree"},"enableSiteLastModified":true,"enableFrontmatterTags":true,"enableHashesForFMTags":false,"enableRandomlyColoredTags":true,"enableTaskNotes":true,"enablePrettyLinks":true,"searchMode":"lookup","assetsPrefix":"/sotoy","siteUrl":"https://zeihanaulia.github.io","duplicateNoteBehavior":{"action":"useVault","payload":["vault-private","vault","dendron.templates"]},"siteFaviconPath":"favicon.ico","siteIndex":"root"}}},"__N_SSG":true},"page":"/[...slug]","query":{"slug":["book-summaries","the-developers-guide-to-ai","part-ii"]},"buildId":"cT3NnriOvhWrkduFGFbv3","assetPrefix":"/sotoy","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
