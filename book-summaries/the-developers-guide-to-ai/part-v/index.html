nar hidup","value":"14-claude-desktop-integration-demo-bahwa-tool-benar-benar-hidup","line":1427,"column":0,"depth":3},"15-stdio-vs-http-perbedaan-deployment-topology":{"type":"header","text":"15) stdio vs HTTP: perbedaan deployment topology","value":"15-stdio-vs-http-perbedaan-deployment-topology","line":1433,"column":0,"depth":3},"16-complex-schemas-dengan-pydantic-dari-demo-ke-dunia-nyata":{"type":"header","text":"16) Complex schemas dengan Pydantic: dari demo ke dunia nyata","value":"16-complex-schemas-dengan-pydantic-dari-demo-ke-dunia-nyata","line":1440,"column":0,"depth":3},"17-jadi-sebenarnya-bab-ini-sedang-membangun-apa":{"type":"header","text":"17) Jadi sebenarnya bab ini sedang membangun apa?","value":"17-jadi-sebenarnya-bab-ini-sedang-membangun-apa","line":1450,"column":0,"depth":3},"18-kutipan-paling-penting-dari-chapter-14":{"type":"header","text":"18) Kutipan paling penting dari Chapter 14","value":"18-kutipan-paling-penting-dari-chapter-14","line":1460,"column":0,"depth":3},"19-sintesis-besar-chapter-14":{"type":"header","text":"19) Sintesis besar Chapter 14","value":"19-sintesis-besar-chapter-14","line":1470,"column":0,"depth":3}},"children":[],"parent":"book-summaries.the-developers-guide-to-ai","data":{}},"body":"\u003ch1 id=\"the-developers-guide-to-ai--part-v-building-agentic-systems\"\u003eThe Developer’s Guide to AI — Part V: Building Agentic Systems\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-developers-guide-to-ai--part-v-building-agentic-systems\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"part-v-building-agentic-systems\"\u003ePart V: Building Agentic Systems\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-v-building-agentic-systems\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"problem-statement\"\u003eProblem statement\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem-statement\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart V datang ketika pekerjaan AI tidak lagi cukup hanya menjawab atau memberi label. Masalahnya sekarang adalah bagaimana AI bisa menjalankan rangkaian kerja, memilih tools, dan menyelesaikan goal yang utuh. Ini bukan lagi soal output, tapi tentang sistem yang bisa bertindak.\u003c/p\u003e\n\u003cp\u003eBagian ini terasa seperti transisi paling besar di seluruh buku. Sampai Part IV, semua yang dibangun masih berada di pola: manusia kasih tugas, model bantu satu langkah, lalu manusia lanjut lagi. Part V mulai bertanya sesuatu yang jauh lebih berani:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The question shifted dramatically from ‘Can the AI understand and label this email?’ to ‘Can the AI act on this email?’”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu bukan sekadar pertanyaan baru. Itu perubahan paradigma.\u003c/p\u003e\n\u003ch3 id=\"1-dari-mesin-jawaban-ke-mesin-workflow\"\u003e1) Dari mesin jawaban ke mesin workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-dari-mesin-jawaban-ke-mesin-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelumnya fokusnya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eclassify,\u003c/li\u003e\n\u003cli\u003eretrieve,\u003c/li\u003e\n\u003cli\u003egenerate,\u003c/li\u003e\n\u003cli\u003esummarize,\u003c/li\u003e\n\u003cli\u003eanswer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSekarang fokusnya melompat ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eplan,\u003c/li\u003e\n\u003cli\u003echoose tools,\u003c/li\u003e\n\u003cli\u003eexecute steps,\u003c/li\u003e\n\u003cli\u003emove state forward,\u003c/li\u003e\n\u003cli\u003einteract with systems outside itself.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan yang paling penting, Part V tidak hanya mengangkat agent sebagai fitur keren. Dia menyajikannya sebagai jawaban atas masalah nyata: inbox sudah rapi, tapi bottleneck pindah downstream.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The chaotic inbox had transformed into an organized system.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The avalanche was tamed.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat-kalimat ini penting karena mereka mengatakan satu hal sederhana: masalah pertama sudah diselesaikan, tetapi masalah berikutnya muncul di layer selanjutnya. Classification itu sering cuma pintu masuk, bukan penyelesaian end-to-end.\u003c/p\u003e\n\u003ch3 id=\"2-bottleneck-pindah-downstream\"\u003e2) Bottleneck pindah downstream\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-bottleneck-pindah-downstream\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini memperjelas bahwa ketika satu tahap dioptimalkan, constraint sistem tidak hilang. Ia pindah ke tahap berikutnya.\u003c/p\u003e\n\u003cp\u003eSebelumnya bottleneck adalah triage inbox. Setelah fine-tuning, masalahnya adalah follow-up workflow. Email yang sudah terlabel rapi masih membutuhkan rangkaian aksi nyata:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eresearch perusahaan,\u003c/li\u003e\n\u003cli\u003ecari kontak,\u003c/li\u003e\n\u003cli\u003edraft outreach,\u003c/li\u003e\n\u003cli\u003eupdate CRM,\u003c/li\u003e\n\u003cli\u003esusun jawaban support,\u003c/li\u003e\n\u003cli\u003ejadwalkan meeting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan kata lain, problemnya berubah dari “apa kategori email ini?” menjadi “apa rangkaian aksi yang perlu dilakukan setelah kategori itu diketahui?”\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Unsorted inbox] --\u003e B[Email classification solved]\n    B --\u003e C[Sorted folders]\n    C --\u003e D[Manual follow-up work remains]\n    D --\u003e E[New bottleneck downstream]\n\u003c/div\u003e\n\u003ch3 id=\"3-ini-bukan-text-generation-sederhana\"\u003e3) Ini bukan text-generation sederhana\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-ini-bukan-text-generation-sederhana\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“These weren’t simple text-generation tasks either.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat ini penting karena Part V sedang membedakan dua kelas kerja:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekerja generatif sederhana seperti menulis email, merangkum, menjawab satu pertanyaan,\u003c/li\u003e\n\u003cli\u003ekerja workflow nyata yang melibatkan banyak langkah, banyak tool, dan keputusan antar langkah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAgentic system lahir karena satu prompt atau satu panggilan model tidak lagi cukup.\u003c/p\u003e\n\u003ch3 id=\"4-definisi-kasar-agentic-workflow\"\u003e4) Definisi kasar agentic workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-definisi-kasar-agentic-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sini kita mulai melihat bahwa “pekerjaan AI” berubah dari sekadar memahami ke sekadar bertindak.\u003c/p\u003e\n\u003cp\u003eDari kutipan ini, agentic workflow bisa diringkas sebagai sistem yang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ememiliki goal,\u003c/li\u003e\n\u003cli\u003ememecah goal jadi beberapa langkah,\u003c/li\u003e\n\u003cli\u003emenggunakan tool berbeda untuk tiap langkah,\u003c/li\u003e\n\u003cli\u003emembuat keputusan di tengah jalan,\u003c/li\u003e\n\u003cli\u003emengubah status dunia,\u003c/li\u003e\n\u003cli\u003emenyesuaikan langkah berikutnya sesuai hasil.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalimat-kalimat yang menegaskan ini termasuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“navigating different software”\u003c/li\u003e\n\u003cli\u003e“accessing external websites”\u003c/li\u003e\n\u003cli\u003e“performing searches”\u003c/li\u003e\n\u003cli\u003e“making small decisions”\u003c/li\u003e\n\u003cli\u003e“orchestrating multiple steps”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-pertanyaan-pivot-part-v\"\u003e5) Pertanyaan pivot Part V\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pertanyaan-pivot-part-v\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePertanyaan sentralnya adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Can the AI act on this email?”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDi sini muncul dua mode AI system:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMode A — cognitive support: AI membantu memahami informasi.\u003c/li\u003e\n\u003cli\u003eMode B — delegated workflow execution: AI membantu menyelesaikan rangkaian kerja.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePart V jelas masuk ke Mode B.\u003c/p\u003e\n\u003cp\u003eKalimat berikut ini sudah mengandung semua komponen utama agent:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Can it take the classified lead, figure out all the steps needed to follow up ... identify the right tools ... and then execute that plan autonomously?”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau gue ringkas, bentuk minimumnya jadi seperti ini:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Classified email] --\u003e B[Agent]\n    B --\u003e C[Plan next steps]\n    C --\u003e D[Choose tool]\n    D --\u003e E[Execute action]\n    E --\u003e F[Observe result]\n    F --\u003e G{Goal achieved?}\n    G -- No --\u003e C\n    G -- Yes --\u003e H[Workflow complete]\n\u003c/div\u003e\n\u003ch3 id=\"6-kenapa-ini-disebut-agentic\"\u003e6) Kenapa ini disebut “agentic”?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-kenapa-ini-disebut-agentic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePembuka ini belum mendefinisikan agen secara formal, tapi elemen-elemennya sudah jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ereason,\u003c/li\u003e\n\u003cli\u003eplan,\u003c/li\u003e\n\u003cli\u003euse tools,\u003c/li\u003e\n\u003cli\u003einteract with digital world,\u003c/li\u003e\n\u003cli\u003epursue a goal across multiple steps.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu membuat sesuatu terasa agentic bukan karena ada model, tapi karena ada aksi yang terstruktur dan goal-directed.\u003c/p\u003e\n\u003ch3 id=\"7-implikasi-risiko-tool-use\"\u003e7) Implikasi risiko tool use\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-implikasi-risiko-tool-use\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eWalaupun belum dibahas detail, bagian ini sudah menyinggung risiko baru. Begitu AI mulai berinteraksi dengan tool eksternal dan sistem lain, failure mode-nya berubah drastis.\u003c/p\u003e\n\u003cp\u003eSalah output teks mungkin akan membuat jawaban keliru. Salah aksi bisa membuat email salah dikirim, CRM salah diupdate, atau meeting salah dijadwalkan.\u003c/p\u003e\n\u003cp\u003eItu artinya agentic system selalu butuh lapisan tambahan seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eguardrails,\u003c/li\u003e\n\u003cli\u003epermission boundaries,\u003c/li\u003e\n\u003cli\u003everification,\u003c/li\u003e\n\u003cli\u003eobservability,\u003c/li\u003e\n\u003cli\u003erecovery.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"8-struktur-logika-pembuka-part-v\"\u003e8) Struktur logika pembuka Part V\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-struktur-logika-pembuka-part-v\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGaris narasinya terasa rapi:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003einbox chaos berhasil diatasi,\u003c/li\u003e\n\u003cli\u003eemail sekarang terlabel,\u003c/li\u003e\n\u003cli\u003emanusia masih terjebak pekerjaan follow-up,\u003c/li\u003e\n\u003cli\u003epekerjaan follow-up adalah workflow multi-step,\u003c/li\u003e\n\u003cli\u003emasalah berubah dari labeling ke acting,\u003c/li\u003e\n\u003cli\u003emaka dibutuhkan agent.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau digambar secara utuh, ini bukan lompatan random. Ini logika sistem.\u003c/p\u003e\n\u003ch3 id=\"9-hubungan-part-v-dengan-semua-part-sebelumnya\"\u003e9) Hubungan Part V dengan semua part sebelumnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-hubungan-part-v-dengan-semua-part-sebelumnya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart V bukan topik baru yang lepas. Dia adalah sintesis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePart I: ngerti LLM dan cara memanggilnya,\u003c/li\u003e\n\u003cli\u003ePart II: ngatur output dengan prompt,\u003c/li\u003e\n\u003cli\u003ePart III: ngasih context lewat retrieval,\u003c/li\u003e\n\u003cli\u003ePart IV: adaptasi model untuk task spesifik,\u003c/li\u003e\n\u003cli\u003ePart V: orkestrasi aksi dengan agent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi agent di sini bukan shortcut yang melompati fondasi. Agent adalah komposisi dari fondasi-fondasi sebelumnya.\u003c/p\u003e\n\u003ch3 id=\"10-kutipan-yang-paling-load-bearing\"\u003e10) Kutipan yang paling load-bearing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-kutipan-yang-paling-load-bearing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa quote kunci dari opener yang paling ngerangkum:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“But sorting, while critical, was only the first step.”\u003c/li\u003e\n\u003cli\u003e“The bottleneck had simply moved downstream.”\u003c/li\u003e\n\u003cli\u003e“These weren’t simple text-generation tasks either.”\u003c/li\u003e\n\u003cli\u003e“Can the AI act on this email?”\u003c/li\u003e\n\u003cli\u003e“The team needed something that could not only think but also act.”\u003c/li\u003e\n\u003cli\u003e“Enter AI agents.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"11-sintesis-pembuka-part-v\"\u003e11) Sintesis pembuka Part V\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-sintesis-pembuka-part-v\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePembuka Part V menunjukkan bahwa setelah startup berhasil mengklasifikasikan email dan menertibkan inbox, mereka menemukan bottleneck baru di tahap lanjutan: follow-up kerja nyata. Masalah ini tidak bisa diselesaikan hanya dengan satu label atau satu jawaban. Ia membutuhkan sistem yang bisa memahami tujuan, merencanakan langkah, memilih tool yang tepat, dan mengeksekusi aksi di dunia digital. Dari sinilah agentic systems muncul.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePart V dimulai ketika AI berhenti menjadi mesin jawaban dan mulai diposisikan sebagai mesin pelaksana workflow.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi yang sedang terjadi di pembuka Part V ini bukan sekadar pengembangan topik. Ini adalah perubahan paradigma dari AI sebagai analis ke AI sebagai pelaksana.\u003c/p\u003e\n\u003ch2 id=\"chapter-12-from-workflows-to-autonomous-agents\"\u003eChapter 12: From Workflows to Autonomous Agents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-12-from-workflows-to-autonomous-agents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau pembuka Part V menjelaskan kenapa agent dibutuhkan, Chapter 12 mulai menjelaskan apa sebenarnya agent itu dan bedanya agentic workflow dengan workflow biasa. Topik “agent” sering kabur, dan bab ini berfungsi sebagai taksonomi.\u003c/p\u003e\n\u003cp\u003eAda tiga kutipan yang menurut gue jadi tulang punggung bab ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“our interactions have been purely reactive, confined to chat windows or one-off scripts. That changes now.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“We need to give these LLMs a level of agency.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“An AI agent is a system that uses an LLM as its ‘brain’ to autonomously plan, reason, and execute a series of steps to achieve a specific goal.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDari tiga kutipan itu kita bisa langsung melihat arah bab:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edari reactive ke active,\u003c/li\u003e\n\u003cli\u003edari responding ke agency,\u003c/li\u003e\n\u003cli\u003edari single turn ke multi-step goal pursuit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"1-our-interactions-have-been-purely-reactive\"\u003e1) “our interactions have been purely reactive”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-our-interactions-have-been-purely-reactive\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni kutipan penting karena dia merangkum semua yang sudah kita lakukan sampai sekarang. Sampai Chapter 11, pola dominannya masih reactive: user input → model response → selesai. Itu termasuk prompt engineering, RAG, fine-tuning, classifier, atau LLM yang sudah diadaptasi.\u003c/p\u003e\n\u003cp\u003eReactive artinya sistem tidak punya proses hidup sendiri. Dia tidak memecah goal, tidak memilih langkah sendiri, tidak memutuskan tool berikutnya, tidak mengiterasi sampai goal selesai. Dia menunggu instruksi lalu merespons.\u003c/p\u003e\n\u003cp\u003eJadi kalimat ini menegaskan bahwa agentic system bukan peningkatan kecil dari chatbot. Dia perubahan mode operasi.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[User prompt] --\u003e B[LLM / AI system]\n    B --\u003e C[One response]\n\u003c/div\u003e\n\u003cp\u003eSekarang bab ini mau pindah ke sesuatu seperti:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[High-level goal] --\u003e B[Agent]\n    B --\u003e C[Plan]\n    C --\u003e D[Choose tool / action]\n    D --\u003e E[Execute]\n    E --\u003e F[Observe result]\n    F --\u003e G{Goal achieved?}\n    G -- No --\u003e C\n    G -- Yes --\u003e H[Done]\n\u003c/div\u003e\n\u003ch3 id=\"2-we-need-to-give-these-llms-a-level-of-agency\"\u003e2) “We need to give these LLMs a level of agency.”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-we-need-to-give-these-llms-a-level-of-agency\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgency bukan kesadaran. Bukan AI punya kehendak sendiri. Penulis membicarakan derajat otonomi operasional: sistem yang punya ruang memilih langkah, bisa mengejar tujuan, bisa bertindak lewat tools, dan tidak harus menunggu instruksi mikro untuk tiap langkah.\u003c/p\u003e\n\u003cp\u003eAnaloginya: chatbot biasa itu orang yang hanya menjawab saat ditanya. Agent lebih seperti asisten yang diberi tujuan lalu berkata, “oke, gue akan cari tahu langkahnya, jalanin, dan balik kalau sudah beres atau kalau mentok.”\u003c/p\u003e\n\u003ch3 id=\"3-definisi-agent-ini-kalimat-paling-penting\"\u003e3) Definisi agent: ini kalimat paling penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-definisi-agent-ini-kalimat-paling-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDefinisinya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“An AI agent is a system that uses an LLM as its ‘brain’ to autonomously plan, reason, and execute a series of steps to achieve a specific goal.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePecahannya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“system” = agent bukan cuma model. Ada state, tools, control loop, memory/context, environment interaction, dan stopping condition.\u003c/li\u003e\n\u003cli\u003e“LLM as its brain” = LLM pusat reasoning/planning, bukan seluruh agen.\u003c/li\u003e\n\u003cli\u003e“autonomously plan, reason, and execute” = agent menyusun langkah, menilai situasi, dan menjalankan aksi.\u003c/li\u003e\n\u003cli\u003e“a series of steps” = bukan single-shot completion.\u003c/li\u003e\n\u003cli\u003e“to achieve a specific goal” = goal-oriented.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau digambarkan:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Specific goal] --\u003e B[Agent system]\n    B --\u003e C[LLM as reasoning/planning brain]\n    B --\u003e D[Tools / environment interaction]\n    C --\u003e E[Plan steps]\n    E --\u003e F[Execute series of actions]\n    F --\u003e G[Observe results]\n    G --\u003e H{Goal reached?}\n    H -- No --\u003e E\n    H -- Yes --\u003e I[Task complete]\n\u003c/div\u003e\n\u003cp\u003eInilah diagram definisi agent yang paling penting buat dibawa ke chapter berikutnya.\u003c/p\u003e\n\u003cp\u003e★ Insight ─────────────────────────────────────\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePenekanan pada “system” mengubah agent dari model saja menjadi sistem yang lengkap.\u003c/li\u003e\n\u003cli\u003eLLM sebagai “brain” berarti agent bukan LLM murni; dia adalah LLM plus control loop dan tools.\u003c/li\u003e\n\u003cli\u003e“Autonomously” dalam engineering berarti sistem punya koridor tindakan sendiri, bukan kebebasan tanpa batas.\u003c/li\u003e\n\u003cli\u003e“Series of steps” menandai bahwa agent bekerja lewat trajectory, bukan satu output.\u003c/li\u003e\n\u003cli\u003eUntuk menilai agent, tanyakan: apakah dia mengejar goal lewat beberapa langkah dengan sebagian keputusan diambil sistem itu sendiri?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"4-contoh-restoran-vegan-bedanya-jelas\"\u003e4) Contoh restoran vegan: bedanya jelas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-contoh-restoran-vegan-bedanya-jelas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh restoran ini bagus karena dia menampilkan perbedaan antara informasi dan outcome.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChat model: “What are the best vegan restaurants in my area?” → jawab list.\u003c/li\u003e\n\u003cli\u003eAgent: “Find a highly rated vegan restaurant with a patio that is open this Saturday, and make a reservation for two.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eChat model memberi informasi. Agent mengejar outcome.\u003c/p\u003e\n\u003cp\u003eOutcome ini butuh beberapa langkah: cari restoran, filter rating, cek patio, cek open Sabtu, booking. Itu menunjukkan bahwa agentic behavior muncul ketika ada constraint bertingkat, tool dependency, action in the world, dan kemungkinan gagal/ retry.\u003c/p\u003e\n\u003ch3 id=\"5-tiga-kemampuan-inti-agent\"\u003e5) Tiga kemampuan inti agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-tiga-kemampuan-inti-agent\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini memecah agent ke tiga komponen utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePlanning\u003c/li\u003e\n\u003cli\u003eTool use\u003c/li\u003e\n\u003cli\u003eReasoning\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePlanning = menentukan langkah untuk mencapai goal.\nTool use = menggunakan antarmuka eksternal untuk bertindak.\nReasoning = menafsirkan hasil aksi sebelumnya dan memutuskan langkah berikutnya.\u003c/p\u003e\n\u003cp\u003eLoop agentic-nya kira-kira seperti:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Goal] --\u003e B[Planning]\n    B --\u003e C[Choose next step]\n    C --\u003e D[Tool use / execution]\n    D --\u003e E[Observe output]\n    E --\u003e F[Reasoning over result]\n    F --\u003e G{Need another step?}\n    G -- Yes --\u003e C\n    G -- No --\u003e H[Goal achieved]\n\u003c/div\u003e\n\u003ch3 id=\"6-in-essence-an-ai-agent-transforms-a-passive-llm-into-an-active-goal-oriented-problem-solver\"\u003e6) “In essence, an AI agent transforms a passive LLM into an active, goal-oriented problem solver...”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-in-essence-an-ai-agent-transforms-a-passive-llm-into-an-active-goal-oriented-problem-solver\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalimat ini penting karena ia menjembatani semua pembahasan sebelumnya. Passive LLM = tunggu input, output, selesai. Active agent = punya target, melakukan langkah, memanggil tools, menyesuaikan terhadap hasil.\u003c/p\u003e\n\u003cp\u003e“Problem solver” di sini bukan jaminan sempurna. Maksudnya agent punya mekanisme mencoba menyelesaikan goal lewat beberapa langkah.\u003c/p\u003e\n\u003ch3 id=\"7-why-do-we-need-agents\"\u003e7) “Why Do We Need Agents?”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-why-do-we-need-agents\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini menjawab dengan klasifikasi workflow yang sehat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTraditional workflows,\u003c/li\u003e\n\u003cli\u003eAI workflows,\u003c/li\u003e\n\u003cli\u003eAgentic workflows.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting karena agen tidak dilihat sebagai sesuatu yang selalu unggul. Dia dilihat sebagai salah satu kategori arsitektur.\u003c/p\u003e\n\u003ch3 id=\"8-traditional-workflow\"\u003e8) Traditional workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-traditional-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTraditional workflow ditandai oleh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esequence tasks predefined,\u003c/li\u003e\n\u003cli\u003erule-based,\u003c/li\u003e\n\u003cli\u003edeterministic,\u003c/li\u003e\n\u003cli\u003eexplicit logic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bukan sekadar anti-AI. Ini valid untuk pekerjaan predictable dan repetitif.\u003c/p\u003e\n\u003ch3 id=\"9-ai-workflow\"\u003e9) AI workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-ai-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAI workflow adalah alur terstruktur yang menerapkan AI tools dalam urutan yang sudah ditentukan. Di sini ada AI, tapi sequence-nya masih fixed.\u003c/p\u003e\n\u003cp\u003eBanyak sistem yang disebut agent sebenarnya hanya AI workflow. Dan bab ini membantu membedakan itu.\u003c/p\u003e\n\u003cp\u003e★ Insight ─────────────────────────────────────\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKeberadaan LLM tidak otomatis membuat sistem agentic.\u003c/li\u003e\n\u003cli\u003eAI workflow tetap lebih prediktabel dan lebih mudah diaudit.\u003c/li\u003e\n\u003cli\u003ePengenalaan agent sebagai spektrum otonomi membantu pilihan arsitektur.\u003c/li\u003e\n\u003cli\u003eSemakin tinggi otonomi, semakin penting observability dan guardrails.\u003c/li\u003e\n\u003cli\u003eAgentic system adalah pilihan untuk masalah tertentu, bukan jawaban universal.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"10-agentic-workflow\"\u003e10) Agentic workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-agentic-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgentic workflow memiliki fleksibilitas memilih tool dan langkah, serta nondeterminism. Jalur tidak sepenuhnya fixed karena bergantung pada hasil intermediate, tool output, dan keputusan agent.\u003c/p\u003e\n\u003cp\u003eNondeterminism adalah pembeda utama. Agentic workflow lebih adaptif, tapi juga lebih sulit dikontrol.\u003c/p\u003e\n\u003ch3 id=\"11-spektrum-workflow\"\u003e11) Spektrum workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-spektrum-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBab ini menyajikan spektrum otonomi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTraditional workflow: no AI, fixed rules.\u003c/li\u003e\n\u003cli\u003eAI workflow: AI in predetermined steps.\u003c/li\u003e\n\u003cli\u003eAgentic workflow: goal-driven, adaptive, nondeterministic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan spektrum ini, kita bisa bertanya lebih tajam kalau ada yang menyebut “ini agent.”\u003c/p\u003e\n\u003ch3 id=\"12-kapan-kita-butuh-agen\"\u003e12) Kapan kita butuh agen?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-kapan-kita-butuh-agen\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent dibutuhkan ketika task kompleks, tidak cukup satu step, butuh tool eksternal, perlu adaptasi ke hasil intermediate, dan manusia tidak ingin mengarahkan micro-step satu per satu.\u003c/p\u003e\n\u003cp\u003eBukan semua task butuh agent. Untuk task sederhana dan predictable, traditional atau AI workflow bisa jadi pilihan yang lebih baik.\u003c/p\u003e\n\u003ch3 id=\"13-kutipan-paling-penting-dari-chapter-12\"\u003e13) Kutipan paling penting dari Chapter 12\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-kutipan-paling-penting-dari-chapter-12\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e“our interactions have been purely reactive... That changes now.”\u003c/li\u003e\n\u003cli\u003e“We need to give these LLMs a level of agency.”\u003c/li\u003e\n\u003cli\u003e“An AI agent is a system that uses an LLM as its ‘brain’...”\u003c/li\u003e\n\u003cli\u003e“Unlike a traditional chat-based model ... an agent is given a high-level task and then independently figures out how to accomplish it.”\u003c/li\u003e\n\u003cli\u003e“Planning ... Tool use ... Reasoning ...”\u003c/li\u003e\n\u003cli\u003e“AI workflows are deterministic...”\u003c/li\u003e\n\u003cli\u003e“Agentic workflows ... introduce a degree of nondeterminism...”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"14-sintesis-besar-chapter-12\"\u003e14) Sintesis besar Chapter 12\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-sintesis-besar-chapter-12\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 12 menggeser fokus dari AI yang reaktif ke AI yang goal-driven. Penulis mendefinisikan AI agent sebagai sistem yang memakai LLM sebagai pusat reasoning untuk merencanakan, memilih tool, dan mengeksekusi serangkaian langkah demi mencapai tujuan. Untuk membuat batas konsepnya jelas, bab ini membedakan tiga jenis workflow: traditional workflows yang rule-based, AI workflows yang memakai AI tetapi tetap mengikuti urutan langkah yang telah ditentukan, dan agentic workflows yang memberi sistem fleksibilitas memilih langkah serta tool secara adaptif, sehingga memperkenalkan nondeterminism. Dengan begitu, agent diposisikan bukan sebagai chatbot yang lebih canggih, melainkan sebagai bentuk workflow otonom yang lebih cocok untuk tugas kompleks dan dinamis.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan jadi satu kalimat:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 12 adalah bab yang mengubah agent dari buzzword menjadi kategori arsitektur yang bisa dibedakan dari workflow biasa.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi yang sedang terjadi di Chapter 12 ini?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePenulis sedang membersihkan peta wilayah sebelum kita masuk ke implementasi agent. Dia memastikan kita ngerti apa itu agent, kenapa agent dibutuhkan, dan kapan sistem benar-benar layak disebut agentic.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"chapter-13-building-an-autonomous-agent\"\u003eChapter 13: Building an Autonomous Agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-13-building-an-autonomous-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau Chapter 12 itu bab definisi dan boundary—membersihkan arti agent, workflow, dan agentic workflow—maka Chapter 13 ini adalah bab ketika buku bilang: cukup teori, sekarang bikin agent beneran.\u003c/p\u003e\n\u003cp\u003eTapi yang menarik, penulis nggak langsung lompat ke agent yang megah dan rumit. Mereka sengaja mulai dari sesuatu yang sangat sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esatu goal,\u003c/li\u003e\n\u003cli\u003esatu agent,\u003c/li\u003e\n\u003cli\u003emodel reasoning,\u003c/li\u003e\n\u003cli\u003ebeberapa base tools,\u003c/li\u003e\n\u003cli\u003edan satu tugas yang cukup realistis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMenurut gue ini keputusan pedagogis yang bagus banget. Kenapa? Karena agent itu topik yang gampang bikin orang mabuk kompleksitas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etools banyak,\u003c/li\u003e\n\u003cli\u003eplanning loop,\u003c/li\u003e\n\u003cli\u003eretries,\u003c/li\u003e\n\u003cli\u003econtext,\u003c/li\u003e\n\u003cli\u003eweb,\u003c/li\u003e\n\u003cli\u003eformatting,\u003c/li\u003e\n\u003cli\u003emax steps,\u003c/li\u003e\n\u003cli\u003esafety.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePenulis justru menahan semuanya dan memulai dari skeleton paling inti.\u003c/p\u003e\n\u003cp\u003eAda beberapa kutipan yang jadi tulang punggung bab ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This chapter covers how to build them.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“We’ll focus on a customizable, code-based approach... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“understanding the underlying mechanics and having the ability to customize your agents is crucial for developers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eNah, tiga kutipan ini sudah cukup menjelaskan arah bab:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekita bukan lagi membahas “apa itu agent,”\u003c/li\u003e\n\u003cli\u003ekita sedang membangun agent,\u003c/li\u003e\n\u003cli\u003edan cara yang dipilih bukan black box no-code, tapi pendekatan yang bikin developer ngerti mekaniknya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"1-kenapa-penulis-tidak-mulai-dari-crewai-browser-use-atau-platform-lain\"\u003e1) Kenapa penulis tidak mulai dari CrewAI, Browser Use, atau platform lain?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-kenapa-penulis-tidak-mulai-dari-crewai-browser-use-atau-platform-lain\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi awal bab, penulis menyebut tools/platform seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCrewAI\u003c/li\u003e\n\u003cli\u003eBrowser Use\u003c/li\u003e\n\u003cli\u003eAgent.ai\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTapi lalu mereka bilang fokus buku ini adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“the foundational principles of building agents”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003edan\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“understanding the underlying mechanics and having the ability to customize your agents is crucial for developers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMenurut gue ini penting banget. Karena ini memperlihatkan posisi epistemik buku ini:\n\u003cstrong\u003eframework itu berguna, tapi developer perlu ngerti mekaniknya dulu.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIni pola yang konsisten dari awal buku:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan cuma pakai LLM API, pahami mental model LLM\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai prompt, pahami struktur prompt\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai RAG library, pahami ingestion dan retrieval\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai fine-tuning tool, pahami dataset dan adaptation\u003c/li\u003e\n\u003cli\u003esekarang: jangan cuma pakai agent framework, pahami anatomy agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi bab ini bukan anti-framework.\nTapi buku ingin fondasi pikirnya dibangun dulu sebelum lo bergantung pada abstraction yang lebih tinggi.\u003c/p\u003e\n\u003ch3 id=\"kenapa-ini-penting-buat-developer\"\u003eKenapa ini penting buat developer?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-developer\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena kalau agent gagal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esalah pilih tool,\u003c/li\u003e\n\u003cli\u003ehalu saat web search,\u003c/li\u003e\n\u003cli\u003elooping terlalu lama,\u003c/li\u003e\n\u003cli\u003estop terlalu cepat,\u003c/li\u003e\n\u003cli\u003eoutput kacau,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003elo butuh mental model internalnya untuk debug.\nKalau cuma tahu cara klik framework, lo akan kesulitan.\u003c/p\u003e\n\u003ch3 id=\"2-use-case-yang-dipilih-cari-revenue-q4-2024-perusahaan\"\u003e2) Use case yang dipilih: cari revenue Q4 2024 perusahaan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-use-case-yang-dipilih-cari-revenue-q4-2024-perusahaan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis memilih contoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einvestor\u003c/li\u003e\n\u003cli\u003eingin tahu pendapatan perusahaan pada Q4 2024\u003c/li\u003e\n\u003cli\u003eperlu cari earnings report\u003c/li\u003e\n\u003cli\u003etemukan link yang benar\u003c/li\u003e\n\u003cli\u003ebuka report\u003c/li\u003e\n\u003cli\u003ecari section revenue\u003c/li\u003e\n\u003cli\u003ejawab angka yang diminta\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMenurut gue ini contoh yang sangat bagus. Kenapa?\u003c/p\u003e\n\u003cp\u003eKarena ini cukup sederhana untuk dipahami, tapi cukup “agentic” untuk menunjukkan kebutuhan multi-step.\u003c/p\u003e\n\u003ch4 id=\"kenapa-gak-bisa-diselesaikan-dengan-prompt-biasa\"\u003eKenapa gak bisa diselesaikan dengan prompt biasa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-gak-bisa-diselesaikan-dengan-prompt-biasa\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eKarena model dasar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egak selalu punya angka terbaru / spesifik,\u003c/li\u003e\n\u003cli\u003egak selalu tahu dokumen mana yang benar,\u003c/li\u003e\n\u003cli\u003eperlu akses ke web,\u003c/li\u003e\n\u003cli\u003eperlu mencari dan membaca sumber.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi task ini pas sekali untuk menunjukkan:\n\u003cstrong\u003eagent diperlukan saat jawaban butuh interaksi dengan dunia luar, bukan cuma recall dari model.\u003c/strong\u003e\u003c/p\u003e\n\u003ch4 id=\"intuisi-task-nya\"\u003eIntuisi task-nya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#intuisi-task-nya\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eGoal user kelihatannya sederhana:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“berapa revenue Amazon Q4 2024?”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eTapi rantai kerjanya bisa begini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ecari earnings report Amazon\u003c/li\u003e\n\u003cli\u003epastikan itu benar Q4 2024\u003c/li\u003e\n\u003cli\u003ebuka dan baca sumber\u003c/li\u003e\n\u003cli\u003ecari angka revenue\u003c/li\u003e\n\u003cli\u003ekembalikan ke user\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eNah, ini perbedaan besar antara:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epertanyaan yang terlihat sederhana di permukaan\u003c/li\u003e\n\u003cli\u003eproses penyelesaiannya yang sebenarnya berlapis\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[User goal: revenue Q4 2024] --\u003e B[Search company earnings report]\n    B --\u003e C[Find correct Q4 2024 source]\n    C --\u003e D[Open / inspect report]\n    D --\u003e E[Locate revenue figure]\n    E --\u003e F[Return answer]\n\u003c/div\u003e\n\u003cp\u003eIni adalah bentuk dasar task agentic yang dipilih penulis.\u003c/p\u003e\n\u003ch3 id=\"3-the-steps-arent-always-the-same--ini-inti-kenapa-agent-dibutuhkan\"\u003e3) “The steps aren’t always the same” — ini inti kenapa agent dibutuhkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-the-steps-arent-always-the-same--ini-inti-kenapa-agent-dibutuhkan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“In these kinds of tasks, where the steps aren’t always the same, AI agents really shine.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eNah, menurut gue ini salah satu kalimat paling penting di bab ini.\u003c/p\u003e\n\u003cp\u003eKarena ini menjelaskan \u003cstrong\u003eboundary penggunaan agent\u003c/strong\u003e dengan sangat singkat.\u003c/p\u003e\n\u003cp\u003eKalau langkah-langkahnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eselalu sama,\u003c/li\u003e\n\u003cli\u003ejalurnya bisa di-hardcode,\u003c/li\u003e\n\u003cli\u003eexception sedikit,\u003c/li\u003e\n\u003cli\u003ekeputusan nyaris nol,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka workflow biasa sering cukup.\u003c/p\u003e\n\u003cp\u003eTapi kalau:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esumber berbeda-beda,\u003c/li\u003e\n\u003cli\u003eformat dokumen beda,\u003c/li\u003e\n\u003cli\u003eurutan pencarian bisa berubah,\u003c/li\u003e\n\u003cli\u003estrategi cari info harus menyesuaikan,\u003c/li\u003e\n\u003cli\u003elangkah optimal tidak selalu identik,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka agent mulai masuk akal.\u003c/p\u003e\n\u003ch4 id=\"ini-nyambung-langsung-ke-chapter-12\"\u003eIni nyambung langsung ke Chapter 12\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ini-nyambung-langsung-ke-chapter-12\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eDi sana agentic workflow dibedakan oleh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egoal orientation\u003c/li\u003e\n\u003cli\u003enondeterminism\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan bab ini memberi contoh konkret nondeterminism itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAmazon, Apple, Google bisa punya format earnings report berbeda\u003c/li\u003e\n\u003cli\u003elokasi angka revenue bisa beda\u003c/li\u003e\n\u003cli\u003ehasil search bisa beda\u003c/li\u003e\n\u003cli\u003elangkah agent bisa sedikit berubah\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi kalimat ini sangat load-bearing:\n\u003cstrong\u003eagent dibutuhkan saat path ke solusi tidak bisa ditulis secara fixed dengan nyaman.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"4-setup-environment-ini-kelihatannya-remeh-tapi-sebenarnya-bagian-dari-filosofi-bab\"\u003e4) Setup environment: ini kelihatannya remeh, tapi sebenarnya bagian dari filosofi bab\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-setup-environment-ini-kelihatannya-remeh-tapi-sebenarnya-bagian-dari-filosofi-bab\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis menjelaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuat Python environment terpisah\u003c/li\u003e\n\u003cli\u003einstall \u003ccode\u003esmolagents==1.22.0\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003epakai integrasi LiteLLM\u003c/li\u003e\n\u003cli\u003eset \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSecara permukaan, ini cuma setup. Tapi di balik itu ada beberapa ide penting.\u003c/p\u003e\n\u003ch4 id=\"a-agent-adalah-software-system-sungguhan\"\u003ea) Agent adalah software system sungguhan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-agent-adalah-software-system-sungguhan\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eBukan sekadar prompt playground. Jadi dia hidup dalam environment, dependency, API key, versioning.\u003c/p\u003e\n\u003ch4 id=\"b-provider-model-dipisahkan-dari-framework-agent\"\u003eb) Provider model dipisahkan dari framework agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-provider-model-dipisahkan-dari-framework-agent\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eMereka pakai \u003ccode\u003esmolagents\u003c/code\u003e + \u003ccode\u003eLiteLLMModel\u003c/code\u003e + Gemini. Artinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eframework agent tidak identik dengan satu provider model\u003c/li\u003e\n\u003cli\u003ereasoning layer dan model backend bisa dipisah\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting banget secara arsitektural.\u003c/p\u003e\n\u003ch4 id=\"c-isolasi-environment-tetap-penting\"\u003ec) Isolasi environment tetap penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-isolasi-environment-tetap-penting\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni konsisten dengan software engineering normal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edependency conflict itu nyata\u003c/li\u003e\n\u003cli\u003eagent stack bisa cepat kompleks\u003c/li\u003e\n\u003cli\u003eproyek agent layak diperlakukan seperti proyek software lain\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi walaupun setup ini terlihat biasa, ia menegaskan bahwa:\n\u003cstrong\u003eagent engineering itu masih software engineering.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"5-agent-pertama-mereka-sangat-sederhana-dan-itu-bagus\"\u003e5) Agent pertama mereka: sangat sederhana, dan itu bagus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-agent-pertama-mereka-sangat-sederhana-dan-itu-bagus\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKode yang dipakai inti-inti begini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCodeAgent\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLiteLLMModel\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etools = []\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003everbosity_level=1\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emax_steps=5\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMenurut gue, pilihan desain contoh ini bagus banget karena memperlihatkan anatomy agent dengan sangat jelas.\u003c/p\u003e\n\u003ch4 id=\"a-model--litellmmodel\"\u003ea) \u003ccode\u003emodel = LiteLLMModel(...)\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-model--litellmmodel\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni menunjukkan bahwa agent tetap butuh model sebagai reasoning engine.\u003c/p\u003e\n\u003ch4 id=\"b-tools--\"\u003eb) \u003ccode\u003etools = []\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-tools--\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eMenarik karena mereka tidak langsung memberi custom tools. Artinya mereka mau menunjukkan bahwa bahkan agent minimal pun bisa jalan dengan base tools saja.\u003c/p\u003e\n\u003ch4 id=\"c-add_base_toolstrue\"\u003ec) \u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-add_base_toolstrue\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eNah, ini penting. Karena agent pertama ini diberi tool bawaan, termasuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eweb search (DuckDuckGo)\u003c/li\u003e\n\u003cli\u003ePython code interpreter\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan ini adalah titik ketika agent benar-benar berbeda dari LLM biasa:\n\u003cstrong\u003edia tidak hanya punya model, tapi juga kemampuan bertindak lewat tools.\u003c/strong\u003e\u003c/p\u003e\n\u003ch4 id=\"d-verbosity_level1\"\u003ed) \u003ccode\u003everbosity_level=1\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d-verbosity_level1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni penting untuk pembelajaran/debugging. Karena agent yang sepenuhnya diam akan terasa magis dan susah dipahami.\u003c/p\u003e\n\u003ch4 id=\"e-max_steps5\"\u003ee) \u003ccode\u003emax_steps=5\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#e-max_steps5\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni salah satu parameter paling penting secara engineering. Karena dia memperlihatkan bahwa agent loop itu perlu guardrail.\u003c/p\u003e\n\u003cp\u003eKalau gue gambar struktur agent minimumnya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[User task] --\u003e B[CodeAgent]\n    B --\u003e C[LLM reasoning model]\n    B --\u003e D[Base tools]\n    B --\u003e E[max_steps guardrail]\n    C --\u003e F[Plan next action]\n    F --\u003e D\n    D --\u003e G[Tool result]\n    G --\u003e C\n    C --\u003e H[Final answer]\n\u003c/div\u003e\n\u003cp\u003eIni menurut gue diagram inti Chapter 13.\u003c/p\u003e\n\u003cp\u003e★ Insight ─────────────────────────────────────\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAgent minimal di bab ini memperlihatkan bahwa agent pada dasarnya adalah loop: model berpikir, tools bertindak, hasil tool balik lagi ke model.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emax_steps\u003c/code\u003e itu sangat penting karena menandai bahwa otonomi agent selalu butuh batas. Ini bukan detail kecil, tapi guardrail inti.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eadd_base_tools=True\u003c/code\u003e menunjukkan bahwa yang membuat agent agentic bukan sekadar prompt panjang, tapi adanya kemampuan observasi/aksi ke luar model.\u003c/li\u003e\n\u003cli\u003ePendekatan minimal ini bagus karena memisahkan “anatomy agent” dari “kompleksitas tool custom.” Jadi fondasinya kelihatan dulu.\u003c/li\u003e\n\u003cli\u003eBuat developer, ini mengajarkan bahwa sebelum mikirin multi-agent atau framework kompleks, lo harus paham loop paling dasar ini.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"6-bagian-paling-penting-agent-bisa-jawab-karena-dia-diberi-tool-bukan-karena-model-tahu-segalanya\"\u003e6) Bagian paling penting: agent bisa jawab karena dia diberi tool, bukan karena model tahu segalanya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-bagian-paling-penting-agent-bisa-jawab-karena-dia-diberi-tool-bukan-karena-model-tahu-segalanya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It’s important to recognize that an LLM, in its foundational state, does not possess real-time knowledge of such specific, external data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kalimat yang sangat penting, dan sangat konsisten dengan seluruh buku.\u003c/p\u003e\n\u003cp\u003eJadi lagi-lagi, buku ini tidak mengajarkan fantasy bahwa model agentic tiba-tiba tahu segalanya. Yang terjadi adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel tetap terbatas,\u003c/li\u003e\n\u003cli\u003etapi agent diberi tool untuk mencari informasi yang dia butuhkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLalu penulis menambahkan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The agent requires the capability to search and retrieve the data from the internet.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003edan\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This allowed the agent to perform a web query to find the requested financial data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eNah, ini inti agent di bab ini.\u003c/p\u003e\n\u003cp\u003eBukan “agent = model yang lebih pintar.”\u003c/p\u003e\n\u003cp\u003eTapi:\n\u003cstrong\u003eagent = model yang bisa menggunakan tool untuk menutupi keterbatasan knowledge-nya.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau gue gambar alurnya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[User asks revenue question] --\u003e B[Agent / LLM]\n    B --\u003e C{Knows answer already?}\n    C -- No --\u003e D[Use web search tool]\n    D --\u003e E[Retrieve relevant info]\n    E --\u003e B\n    B --\u003e F[Compose final answer]\n\u003c/div\u003e\n\u003cp\u003eIni sederhana, tapi sangat penting untuk membangun intuisi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent tidak harus omniscient,\u003c/li\u003e\n\u003cli\u003edia harus cukup pintar untuk tahu kapan harus mencari.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"7-eksperimen-kecil-yang-sangat-edukatif-hapus-add_base_toolstrue\"\u003e7) Eksperimen kecil yang sangat edukatif: hapus \u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-eksperimen-kecil-yang-sangat-edukatif-hapus-add_base_toolstrue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenurut gue ini salah satu bagian paling bagus secara pedagogi.\u003c/p\u003e\n\u003cp\u003ePenulis menyuruh pembaca:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecoba remove \u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ejalankan lagi\u003c/li\u003e\n\u003cli\u003elihat perilakunya\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bagus banget karena mengajarkan bukan lewat teori, tapi lewat contrast.\u003c/p\u003e\n\u003ch4 id=\"apa-yang-ingin-ditunjukkan\"\u003eApa yang ingin ditunjukkan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-ingin-ditunjukkan\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eBahwa keberhasilan agent tadi \u003cstrong\u003ebergantung\u003c/strong\u003e pada tool availability.\u003c/p\u003e\n\u003cp\u003eKalau tool dicabut:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent mungkin hanya menebak,\u003c/li\u003e\n\u003cli\u003eatau gagal,\u003c/li\u003e\n\u003cli\u003eatau memberi jawaban yang tidak grounded.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni eksperimen kecil, tapi insight-nya besar:\n\u003cstrong\u003eagent behavior is constrained by tool affordances.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eArtinya agent tidak melampaui tool yang diberikan.\nDan itu sangat penting untuk desain sistem.\u003c/p\u003e\n\u003cp\u003eKalau lo ingin agent bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecari web,\u003c/li\u003e\n\u003cli\u003ekirim email,\u003c/li\u003e\n\u003cli\u003eupdate CRM,\u003c/li\u003e\n\u003cli\u003ebaca kalender,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka kemampuan itu harus benar-benar diberikan sebagai tool.\nBukan diasumsikan model akan “mengerti sendiri.”\u003c/p\u003e\n\u003ch3 id=\"8-agents-and-prompt-engineering--ini-bagian-yang-menurut-gue-sangat-penting\"\u003e8) “Agents and Prompt Engineering” — ini bagian yang menurut gue sangat penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-agents-and-prompt-engineering--ini-bagian-yang-menurut-gue-sangat-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBanyak orang salah paham bahwa begitu kita masuk ke agent, prompt engineering tidak terlalu penting lagi.\u003c/p\u003e\n\u003cp\u003ePenulis secara eksplisit membantah itu:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The art and science of prompt engineering cannot be ignored.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting banget. Karena agent bukan pengganti prompt.\nAgent justru memperbesar kebutuhan prompt yang baik.\u003c/p\u003e\n\u003cp\u003eKenapa? Karena sekarang prompt agent memengaruhi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebagaimana task dibaca,\u003c/li\u003e\n\u003cli\u003eformat output,\u003c/li\u003e\n\u003cli\u003ecara tool dipakai,\u003c/li\u003e\n\u003cli\u003ekapan berhenti,\u003c/li\u003e\n\u003cli\u003ebagaimana jawaban akhir disusun.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLalu penulis memberi contoh yang sangat bagus.\u003c/p\u003e\n\u003ch4 id=\"prompt-1\"\u003ePrompt 1\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prompt-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Show me the Q4 2024 revenue for Amazon, Google, and Apple”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eOutputnya jawaban list biasa.\u003c/p\u003e\n\u003ch4 id=\"prompt-2\"\u003ePrompt 2\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prompt-2\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Show me the Q4 2024 revenue for Amazon, Google and Apple and compare them in a table”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eOutputnya jadi tabel.\u003c/p\u003e\n\u003cp\u003eNah, ini menunjukkan bahwa bahkan dalam sistem agentic:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt tetap membentuk deliverable,\u003c/li\u003e\n\u003cli\u003eprompt tetap memengaruhi struktur hasil,\u003c/li\u003e\n\u003cli\u003eprompt tetap bagian dari control surface.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi agent tidak menghapus pentingnya prompt.\nDia justru membuat prompt menjadi instruksi \u003cstrong\u003etentang goal dan bentuk deliverable\u003c/strong\u003e, bukan hanya isi jawaban.\u003c/p\u003e\n\u003ch4 id=\"diagram-perbedaan-ini\"\u003eDiagram perbedaan ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#diagram-perbedaan-ini\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Same agent + same tools] --\u003e B[Different task phrasing]\n    B --\u003e C1[Prompt asks for list]\n    B --\u003e C2[Prompt asks for comparison table]\n    C1 --\u003e D1[List-style output]\n    C2 --\u003e D2[Structured table output]\n\u003c/div\u003e\n\u003cp\u003eIni sangat penting, karena membuktikan bahwa:\n\u003cstrong\u003etooling dan planning saja tidak cukup; output contract tetap banyak dibentuk oleh prompt.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"9-jadi-apa-yang-sebenarnya-diajarkan-bab-ini\"\u003e9) Jadi apa yang sebenarnya diajarkan bab ini?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-jadi-apa-yang-sebenarnya-diajarkan-bab-ini\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue tarik benang dari awal sampai akhir, Chapter 13 sebenarnya mengajarkan empat ide inti:\u003c/p\u003e\n\u003ch4 id=\"pertama\"\u003ePertama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertama\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eAgent pertama lo bisa sangat sederhana.\nLo gak perlu mulai dari multi-agent, orchestration graph, atau 15 tools custom.\u003c/p\u003e\n\u003ch4 id=\"kedua\"\u003eKedua\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kedua\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eAgent hidup dari kombinasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel reasoning\u003c/li\u003e\n\u003cli\u003etools\u003c/li\u003e\n\u003cli\u003econtrol loop\u003c/li\u003e\n\u003cli\u003eguardrails (\u003ccode\u003emax_steps\u003c/code\u003e)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"ketiga\"\u003eKetiga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ketiga\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eAgent tidak magically tahu data real-time.\nDia berhasil karena diberi kemampuan mencari/bertindak.\u003c/p\u003e\n\u003ch4 id=\"keempat\"\u003eKeempat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#keempat\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003ePrompt engineering tetap relevan.\nBahkan agent yang tool-using pun masih sangat dipengaruhi oleh bagaimana tujuan diminta dan bagaimana output diinginkan.\u003c/p\u003e\n\u003cp\u003eJadi chapter ini bukan “cara bikin super-agent.”\nIni lebih seperti:\n\u003cstrong\u003ecara bikin skeleton agent yang benar-benar hidup.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"10-apa-yang-bab-ini-belum-lakukan-dan-kenapa-itu-penting\"\u003e10) Apa yang bab ini belum lakukan, dan kenapa itu penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-apa-yang-bab-ini-belum-lakukan-dan-kenapa-itu-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenurut gue justru penting juga untuk jujur bahwa Chapter 13 ini masih \u003cstrong\u003eintroductory build chapter\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDia belum terlalu masuk ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etool custom design yang banyak\u003c/li\u003e\n\u003cli\u003ememory/state kompleks\u003c/li\u003e\n\u003cli\u003emulti-agent coordination\u003c/li\u003e\n\u003cli\u003erecovery loop lebih dalam\u003c/li\u003e\n\u003cli\u003epermission model\u003c/li\u003e\n\u003cli\u003ehuman approval gates\u003c/li\u003e\n\u003cli\u003eobservability\u003c/li\u003e\n\u003cli\u003eeval agents secara serius\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan itu bagus. Kenapa?\nKarena kalau semua itu dimasukkan sekaligus, pembaca akan kehilangan bentuk paling dasarnya.\u003c/p\u003e\n\u003cp\u003eJadi bab ini sengaja menjaga scope:\n\u003cstrong\u003eagent minimal yang bisa dipahami end-to-end.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDan itu keputusan yang sangat tepat secara pedagogi.\u003c/p\u003e\n\u003ch3 id=\"11-kutipan-paling-penting-dari-chapter-13\"\u003e11) Kutipan paling penting dari Chapter 13\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-kutipan-paling-penting-dari-chapter-13\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue pilih beberapa yang paling load-bearing:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This chapter covers how to build them.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni jelas: kita masuk mode implementasi.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“understanding the underlying mechanics ... is crucial for developers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menjelaskan kenapa pendekatannya code-based, bukan sekadar pakai platform.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“In these kinds of tasks, where the steps aren’t always the same, AI agents really shine.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni boundary penggunaan agent yang paling penting.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“an LLM, in its foundational state, does not possess real-time knowledge... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menjaga kita tetap grounded tentang keterbatasan model.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This allowed the agent to perform a web query... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menjelaskan kenapa tools adalah inti.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The art and science of prompt engineering cannot be ignored.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menyelamatkan kita dari salah kaprah “agent \u003e prompt.”\u003c/p\u003e\n\u003ch3 id=\"12-sintesis-besar-chapter-13\"\u003e12) Sintesis besar Chapter 13\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-sintesis-besar-chapter-13\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas dalam satu paragraf:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 13 menunjukkan bagaimana membangun agent pertama secara code-based dengan fokus pada fondasi, bukan kemewahan framework. Penulis memakai use case pencarian revenue Q4 2024 untuk memperlihatkan bahwa agent berguna ketika langkah-langkah penyelesaian tidak bisa ditulis secara fixed dan membutuhkan akses ke dunia luar, seperti web search. Dengan menggunakan model reasoning, base tools, dan guardrails seperti max_steps, agent pertama ini memperlihatkan loop dasar agentic behavior: menerima goal, merencanakan langkah, memakai tool, lalu mengembalikan hasil. Bab ini juga menekankan bahwa keberhasilan agent bukan karena model mengetahui segalanya, melainkan karena ia diberi tool yang tepat. Dan meskipun sudah agentic, prompt engineering tetap penting karena cara user menyatakan goal masih sangat memengaruhi bentuk deliverable akhir.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan jadi satu kalimat:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 13 adalah bab yang mengubah definisi agent dari konsep abstrak menjadi loop kerja minimal yang bisa lo bangun, lihat, dan uji.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi sebenarnya yang sedang terjadi di Chapter 13 ini?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePenulis sedang menunjukkan bahwa agent pertama bukanlah monster kompleks, melainkan kombinasi sederhana antara model, tools, batas langkah, dan goal yang ditulis dengan baik.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDan begitu kombinasi itu jalan, lo mulai bisa melihat kenapa agent berbeda dari chatbot atau workflow AI biasa.\u003c/p\u003e\n\u003cp\u003eTapi yang menarik, penulis nggak langsung lompat ke agent yang megah dan rumit. Mereka sengaja mulai dari sesuatu yang sangat sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esatu goal,\u003c/li\u003e\n\u003cli\u003esatu agent,\u003c/li\u003e\n\u003cli\u003emodel reasoning,\u003c/li\u003e\n\u003cli\u003ebeberapa base tools,\u003c/li\u003e\n\u003cli\u003edan satu tugas yang cukup realistis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu keputusan pedagogis yang bagus. Agent itu topik yang gampang bikin orang mabuk kompleksitas: tools banyak, planning loop, retries, context, web, formatting, max steps, safety. Penulis menahan semuanya dan memulai dari skeleton paling inti.\u003c/p\u003e\n\u003cp\u003eAda tiga kutipan yang jadi tulang punggung bab ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This chapter covers how to build them.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“We’ll focus on a customizable, code-based approach... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“understanding the underlying mechanics and having the ability to customize your agents is crucial for developers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eTiga kutipan ini sudah cukup menjelaskan arah bab:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekita bukan lagi membahas “apa itu agent,”\u003c/li\u003e\n\u003cli\u003ekita sedang membangun agent,\u003c/li\u003e\n\u003cli\u003edan cara yang dipilih bukan black box no-code, tapi pendekatan yang bikin developer ngerti mekaniknya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"1-kenapa-penulis-tidak-mulai-dari-crewai-browser-use-atau-platform-lain-1\"\u003e1) Kenapa penulis tidak mulai dari CrewAI, Browser Use, atau platform lain?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-kenapa-penulis-tidak-mulai-dari-crewai-browser-use-atau-platform-lain-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi awal bab, penulis menyebut tools/platform seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCrewAI\u003c/li\u003e\n\u003cli\u003eBrowser Use\u003c/li\u003e\n\u003cli\u003eAgent.ai\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTapi lalu mereka bilang fokus buku ini adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“the foundational principles of building agents”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003edan\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“understanding the underlying mechanics and having the ability to customize your agents is crucial for developers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting karena memperlihatkan posisi epistemik buku ini: framework itu berguna, tapi developer perlu ngerti mekaniknya dulu.\u003c/p\u003e\n\u003cp\u003eIni pola yang konsisten dari awal buku:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan cuma pakai LLM API, pahami mental model LLM\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai prompt, pahami struktur prompt\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai RAG library, pahami ingestion dan retrieval\u003c/li\u003e\n\u003cli\u003ejangan cuma pakai fine-tuning tool, pahami dataset dan adaptation\u003c/li\u003e\n\u003cli\u003esekarang: jangan cuma pakai agent framework, pahami anatomy agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi bab ini bukan anti-framework. Buku ingin fondasi pikirnya dibangun dulu sebelum lo bergantung pada abstraction yang lebih tinggi.\u003c/p\u003e\n\u003ch3 id=\"2-use-case-yang-dipilih-cari-revenue-q4-2024-perusahaan-1\"\u003e2) Use case yang dipilih: cari revenue Q4 2024 perusahaan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-use-case-yang-dipilih-cari-revenue-q4-2024-perusahaan-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis memilih contoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einvestor\u003c/li\u003e\n\u003cli\u003eingin tahu pendapatan perusahaan pada Q4 2024\u003c/li\u003e\n\u003cli\u003eperlu cari earnings report\u003c/li\u003e\n\u003cli\u003etemukan link yang benar\u003c/li\u003e\n\u003cli\u003ebuka report\u003c/li\u003e\n\u003cli\u003ecari section revenue\u003c/li\u003e\n\u003cli\u003ejawab angka yang diminta\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni contoh yang bagus karena cukup sederhana untuk dipahami, tapi cukup agentic untuk menunjukkan kebutuhan multi-step.\u003c/p\u003e\n\u003cp\u003eKenapa gak bisa diselesaikan dengan prompt biasa? Karena model dasar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egak selalu punya angka terbaru / spesifik,\u003c/li\u003e\n\u003cli\u003egak selalu tahu dokumen mana yang benar,\u003c/li\u003e\n\u003cli\u003eperlu akses ke web,\u003c/li\u003e\n\u003cli\u003eperlu mencari dan membaca sumber.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi task ini pas sekali untuk menunjukkan: agent diperlukan saat jawaban butuh interaksi dengan dunia luar, bukan cuma recall dari model.\u003c/p\u003e\n\u003cp\u003eIntuisi task-nya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“berapa revenue Amazon Q4 2024?”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eTapi rantai kerjanya bisa begini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ecari earnings report Amazon\u003c/li\u003e\n\u003cli\u003epastikan itu benar Q4 2024\u003c/li\u003e\n\u003cli\u003ebuka dan baca sumber\u003c/li\u003e\n\u003cli\u003ecari angka revenue\u003c/li\u003e\n\u003cli\u003ekembalikan ke user\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni perbedaan besar antara pertanyaan yang terlihat sederhana di permukaan dan proses penyelesaiannya yang sebenarnya berlapis.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[User goal: revenue Q4 2024] --\u003e B[Search company earnings report]\n    B --\u003e C[Find correct Q4 2024 source]\n    C --\u003e D[Open / inspect report]\n    D --\u003e E[Locate revenue figure]\n    E --\u003e F[Return answer]\n\u003c/div\u003e\n\u003ch3 id=\"3-the-steps-arent-always-the-same--ini-inti-kenapa-agent-dibutuhkan-1\"\u003e3) “The steps aren’t always the same” — ini inti kenapa agent dibutuhkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-the-steps-arent-always-the-same--ini-inti-kenapa-agent-dibutuhkan-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“In these kinds of tasks, where the steps aren’t always the same, AI agents really shine.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kalimat paling penting di bab ini karena dia menjelaskan boundary penggunaan agent dengan sangat singkat.\u003c/p\u003e\n\u003cp\u003eKalau langkah-langkahnya selalu sama, jalurnya bisa di-hardcode, exception sedikit, keputusan nyaris nol, maka workflow biasa sering cukup. Tapi kalau sumber berbeda-beda, format dokumen beda, urutan pencarian bisa berubah, strategi cari info harus menyesuaikan, maka agent mulai masuk akal.\u003c/p\u003e\n\u003cp\u003eIni nyambung langsung ke Chapter 12. Di sana agentic workflow dibedakan oleh goal orientation dan nondeterminism. Bab ini memberi contoh konkret nondeterminism itu: Amazon, Apple, Google bisa punya format earnings report berbeda, lokasi angka revenue bisa beda, hasil search bisa beda, langkah agent bisa sedikit berubah.\u003c/p\u003e\n\u003cp\u003eJadi kalimat ini sangat load-bearing: agent dibutuhkan saat path ke solusi tidak bisa ditulis secara fixed dengan nyaman.\u003c/p\u003e\n\u003ch3 id=\"4-setup-environment-ini-kelihatannya-remeh-tapi-sebenarnya-bagian-dari-filosofi-bab-1\"\u003e4) Setup environment: ini kelihatannya remeh, tapi sebenarnya bagian dari filosofi bab\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-setup-environment-ini-kelihatannya-remeh-tapi-sebenarnya-bagian-dari-filosofi-bab-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis menjelaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuat Python environment terpisah\u003c/li\u003e\n\u003cli\u003einstall \u003ccode\u003esmolagents==1.22.0\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003epakai integrasi LiteLLM\u003c/li\u003e\n\u003cli\u003eset \u003ccode\u003eGEMINI_API_KEY\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSecara permukaan, ini setup. Tapi di balik itu ada beberapa ide penting.\u003c/p\u003e\n\u003ch4 id=\"a-agent-adalah-software-system-sungguhan-1\"\u003ea) Agent adalah software system sungguhan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-agent-adalah-software-system-sungguhan-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eBukan sekadar prompt playground. Dia hidup dalam environment, dependency, API key, versioning.\u003c/p\u003e\n\u003ch4 id=\"b-provider-model-dipisahkan-dari-framework-agent-1\"\u003eb) Provider model dipisahkan dari framework agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-provider-model-dipisahkan-dari-framework-agent-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eMereka pakai \u003ccode\u003esmolagents\u003c/code\u003e + \u003ccode\u003eLiteLLMModel\u003c/code\u003e + Gemini. Artinya reasoning layer dan model backend bisa dipisah. Ini penting secara arsitektural.\u003c/p\u003e\n\u003ch4 id=\"c-isolasi-environment-tetap-penting-1\"\u003ec) Isolasi environment tetap penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-isolasi-environment-tetap-penting-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eDependency conflict itu nyata. Agent stack bisa cepat kompleks. Proyek agent layak diperlakukan seperti proyek software lain.\u003c/p\u003e\n\u003cp\u003eJadi setup ini menegaskan bahwa agent engineering itu masih software engineering.\u003c/p\u003e\n\u003ch3 id=\"5-agent-pertama-mereka-sangat-sederhana-dan-itu-bagus-1\"\u003e5) Agent pertama mereka: sangat sederhana, dan itu bagus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-agent-pertama-mereka-sangat-sederhana-dan-itu-bagus-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKode inti yang dipakai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCodeAgent\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLiteLLMModel\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etools = []\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003everbosity_level=1\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emax_steps=5\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePilihan ini bagus karena memperlihatkan anatomy agent dengan jelas.\u003c/p\u003e\n\u003ch4 id=\"a-model--litellmmodel-1\"\u003ea) \u003ccode\u003emodel = LiteLLMModel(...)\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-model--litellmmodel-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni menunjukkan agent tetap butuh model sebagai reasoning engine.\u003c/p\u003e\n\u003ch4 id=\"b-tools---1\"\u003eb) \u003ccode\u003etools = []\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-tools---1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eMenarik karena mereka tidak langsung memberi custom tools. Artinya mereka mau menunjukkan bahwa bahkan agent minimal pun bisa jalan dengan base tools saja.\u003c/p\u003e\n\u003ch4 id=\"c-add_base_toolstrue-1\"\u003ec) \u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-add_base_toolstrue-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni penting: agent pertama ini diberi tool bawaan, termasuk web search dan Python interpreter. Ini titik ketika agent berbeda dari LLM biasa: dia tidak hanya punya model, tapi juga kemampuan bertindak lewat tools.\u003c/p\u003e\n\u003ch4 id=\"d-verbosity_level1-1\"\u003ed) \u003ccode\u003everbosity_level=1\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d-verbosity_level1-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni penting untuk pembelajaran/debugging. Agent yang sepenuhnya diam akan terasa magis dan susah dipahami.\u003c/p\u003e\n\u003ch4 id=\"e-max_steps5-1\"\u003ee) \u003ccode\u003emax_steps=5\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#e-max_steps5-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni parameter penting secara engineering. Dia memperlihatkan bahwa agent loop perlu guardrail. Ini bukan detail kecil, tapi inti.\u003c/p\u003e\n\u003cp\u003eKalau digambarkan:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[User task] --\u003e B[CodeAgent]\n    B --\u003e C[LLM reasoning model]\n    B --\u003e D[Base tools]\n    B --\u003e E[max_steps guardrail]\n    C --\u003e F[Plan next action]\n    F --\u003e D\n    D --\u003e G[Tool result]\n    G --\u003e C\n    C --\u003e H[Final answer]\n\u003c/div\u003e\n\u003ch3 id=\"6-bagian-paling-penting-agent-bisa-jawab-karena-dia-diberi-tool-bukan-karena-model-tahu-segalanya-1\"\u003e6) Bagian paling penting: agent bisa jawab karena dia diberi tool, bukan karena model tahu segalanya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-bagian-paling-penting-agent-bisa-jawab-karena-dia-diberi-tool-bukan-karena-model-tahu-segalanya-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It’s important to recognize that an LLM, in its foundational state, does not possess real-time knowledge of such specific, external data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kalimat sangat penting. Buku sekali lagi tidak mengajarkan fantasy bahwa model agentic tiba-tiba tahu segalanya. Yang terjadi adalah model tetap terbatas, tetapi agent diberi tool untuk mencari informasi yang dia butuhkan.\u003c/p\u003e\n\u003cp\u003eLalu penulis menambahkan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The agent requires the capability to search and retrieve the data from the internet.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This allowed the agent to perform a web query to find the requested financial data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni inti agent di bab ini. Bukan “agent = model yang lebih pintar.” Tapi: agent = model yang bisa menggunakan tool untuk menutupi keterbatasan knowledge-nya.\u003c/p\u003e\n\u003cp\u003eKalau digambarkan:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[User asks revenue question] --\u003e B[Agent / LLM]\n    B --\u003e C{Knows answer already?}\n    C -- No --\u003e D[Use web search tool]\n    D --\u003e E[Retrieve relevant info]\n    E --\u003e B\n    B --\u003e F[Compose final answer]\n\u003c/div\u003e\n\u003ch3 id=\"7-eksperimen-kecil-hapus-add_base_toolstrue\"\u003e7) Eksperimen kecil: hapus \u003ccode\u003eadd_base_tools=True\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-eksperimen-kecil-hapus-add_base_toolstrue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni salah satu bagian paling bagus secara pedagogi. Penulis menyuruh pembaca mencoba remove \u003ccode\u003eadd_base_tools=True\u003c/code\u003e, jalankan lagi, dan lihat perilakunya.\u003c/p\u003e\n\u003cp\u003eApa yang ingin ditunjukkan? Bahwa keberhasilan agent tadi bergantung pada tool availability. Kalau tool dicabut, agent mungkin hanya menebak, atau gagal, atau memberi jawaban yang tidak grounded.\u003c/p\u003e\n\u003cp\u003eIni eksperimen kecil, tapi insight-nya besar: agent behavior is constrained by tool affordances.\u003c/p\u003e\n\u003ch3 id=\"8-agents-and-prompt-engineering\"\u003e8) “Agents and Prompt Engineering”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-agents-and-prompt-engineering\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBanyak orang salah paham bahwa begitu kita masuk ke agent, prompt engineering tidak terlalu penting lagi. Penulis menegaskan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The art and science of prompt engineering cannot be ignored.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAgent bukan pengganti prompt. Agent justru memperbesar kebutuhan prompt yang baik.\u003c/p\u003e\n\u003cp\u003eKenapa? Karena sekarang prompt agent memengaruhi bagaimana task dibaca, format output, cara tool dipakai, kapan berhenti, d
