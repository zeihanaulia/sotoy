ext":"Hardening install script","value":"hardening-install-script","line":59,"column":0,"depth":2},"escape-hatch-yang-terkontrol":{"type":"header","text":"Escape hatch yang terkontrol","value":"escape-hatch-yang-terkontrol","line":77,"column":0,"depth":2},"ringkasan-flow":{"type":"header","text":"Ringkasan flow","value":"ringkasan-flow","line":90,"column":0,"depth":2},"trade-off":{"type":"header","text":"Trade-off","value":"trade-off","line":99,"column":0,"depth":2},"kenapa-ini-penting":{"type":"header","text":"Kenapa ini penting","value":"kenapa-ini-penting","line":105,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":117,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"npm-supply-chain-cooldown-policy\"\u003eNPM supply-chain cooldown policy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#npm-supply-chain-cooldown-policy\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread Kunchenguid membahas satu cara praktis untuk memperketat instalasi dependency npm tanpa memindahkan registry atau memaksa scan semua paket. Fokusnya adalah mencegah project mengambil versi baru yang baru saja dirilis, karena itulah jendela waktu serangan supply-chain paling efektif.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"https://x.com/kunchenguid/status/2054600854553206992\"\u003ehttps://x.com/kunchenguid/status/2054600854553206992\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"guardrail-utama\"\u003eGuardrail utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#guardrail-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKun menyarankan policy:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAge: 10080\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAgeStrict: true\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu berarti pnpm tidak boleh memilih versi yang usia rilisnya kurang dari 7 hari. Policy ini berlaku pada level versi, bukan nama package.\u003c/p\u003e\n\u003ch3 id=\"kenapa-versi-bukan-package\"\u003eKenapa versi, bukan package\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-versi-bukan-package\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePoin pentingnya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epackage bisa trusted tapi versi barunya belum.\u003c/li\u003e\n\u003cli\u003epackage populer seperti \u003ccode\u003echalk\u003c/code\u003e, \u003ccode\u003edebug\u003c/code\u003e, \u003ccode\u003eeslint\u003c/code\u003e, atau dependency build tool bisa tetap diteror oleh versi baru yang dirilis setelah akun maintainer disusupi.\u003c/li\u003e\n\u003cli\u003ejadi trust harus melekat pada \u003ccode\u003epackage@version\u003c/code\u003e dan tanggal rilisnya, bukan sekadar nama paket atau reputasi historis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mengapa-pnpm\"\u003eMengapa pnpm?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-pnpm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBukan karena registry yang berbeda. Kun tetap menggunakan npm registry. Perbedaan utama adalah pnpm menjadi enforcement layer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eregistry tetap menyimpan semua versi\u003c/li\u003e\n\u003cli\u003epnpm menolak versi yang terlalu baru saat resolving\u003c/li\u003e\n\u003cli\u003eini membuat policy cooldown jadi bagian dari dependency manager, bukan sistem registry\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003ccode\u003enpm ci\u003c/code\u003e bagus untuk menegakkan lockfile existing, tetapi tidak cukup saat install package baru atau upgrade dependency lama.\u003c/p\u003e\n\u003ch2 id=\"peran-ci\"\u003ePeran CI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peran-ci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi CI, Kun menambahkan aturan kedua:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --frozen-lockfile\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu memastikan CI tidak resolve versi baru dengan sendirinya. CI hanya boleh menginstal apa yang sudah terkunci di lockfile. Ini penting untuk membuat build reproducible dan mencegah pipeline mengambil dependency baru secara spontan.\u003c/p\u003e\n\u003ch2 id=\"hardening-install-script\"\u003eHardening install script\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hardening-install-script\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDependency install sering lebih dari sekadar mengunduh file. Banyak package menjalankan lifecycle script seperti \u003ccode\u003epostinstall\u003c/code\u003e, \u003ccode\u003eprepare\u003c/code\u003e, atau build step lain.\u003c/p\u003e\n\u003cp\u003eKun menegaskan bahwa hanya dependency tertentu yang harus diberi izin menjalankan skrip build.\u003c/p\u003e\n\u003cp\u003eContoh config:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eonlyBuiltDependencies\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e esbuild\n\n\u003cspan class=\"token key atrule\"\u003eallowBuilds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eesbuild\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean important\"\u003etrue\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni membatasi area serangan di mana package bisa mengeksekusi kode selama install.\u003c/p\u003e\n\u003ch2 id=\"escape-hatch-yang-terkontrol\"\u003eEscape hatch yang terkontrol\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#escape-hatch-yang-terkontrol\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePolicy cooldown harus punya pengecualian untuk package internal atau paket yang benar-benar kita kendalikan.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eminimumReleaseAgeExclude\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e my\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eown\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003epackage\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi hati-hati: kalau exception list terlalu panjang, guardrail ini kehilangan fungsi utama.\u003c/p\u003e\n\u003ch2 id=\"ringkasan-flow\"\u003eRingkasan flow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-flow\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003edeveloper atau maintainer request update dependency\u003c/li\u003e\n\u003cli\u003epnpm resolve dengan \u003ccode\u003eminimumReleaseAge\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003elockfile berubah hanya untuk versi yang sudah cukup tua\u003c/li\u003e\n\u003cli\u003ePR review dan merge\u003c/li\u003e\n\u003cli\u003eCI install dengan \u003ccode\u003e--frozen-lockfile\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003einstall script hanya jalan untuk dependency yang di-allowlist\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"trade-off\"\u003eTrade-off\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ekeuntungan: memotong jendela waktu serangan earliest-stage\u003c/li\u003e\n\u003cli\u003ekerugian: update legitimate patch baru bisa tertunda\u003c/li\u003e\n\u003cli\u003emitigasi: gunakan exception/escape hatch untuk kasus darurat, tapi tetap dokumentasikan dan review\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePolicynya memindahkan default behavior dari:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"ambil versi terbaru kecuali terbukti jahat\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"tahan versi baru sampai cukup umur kecuali ada alasan eksplisit\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu adalah shift dari reactive security ke friction-based security.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.trusted-publishing-checklist\"\u003eTrusted publishing: kritik argumen dan checklist operasional\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.tanstack-postmortem\"\u003eTanStack npm supply-chain compromise — postmortem notes\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.security.cooldown-is-delay-gate-not-freeze\"\u003eCoolingdown package baru itu delay gate, bukan freeze dependency update\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u
