ps":{"note":{"id":"daily.journal.2026.05.04","title":"2026-05-04","desc":"","tags":["daily","browser-automation","stealth","agent","knowledge-graph","code-review","research"],"created":1777870258819,"updated":1777986566185,"traitIds":["journalNote"],"custom":{},"fname":"daily.journal.2026.05.04","type":"note","vault":{"fsPath":"vault"},"contentHash":"2601c048a3edbd68f83f6faaa726d295","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.browser-automation","alias":"browser-automation","xvault":false,"to":{"fname":"tags.browser-automation"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.stealth","alias":"stealth","xvault":false,"to":{"fname":"tags.stealth"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.agent","alias":"agent","xvault":false,"to":{"fname":"tags.agent"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.knowledge-graph","alias":"knowledge-graph","xvault":false,"to":{"fname":"tags.knowledge-graph"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.code-review","alias":"code-review","xvault":false,"to":{"fname":"tags.code-review"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"tags.research","alias":"research","xvault":false,"to":{"fname":"tags.research"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"zettel.1777866407372","position":{"start":{"line":38,"column":111,"offset":2920},"end":{"line":38,"column":135,"offset":2944},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.1777866407372"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"zettel.1777866581063","position":{"start":{"line":40,"column":94,"offset":3071},"end":{"line":40,"column":118,"offset":3095},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.1777866581063"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"zettel.1777866581064","position":{"start":{"line":41,"column":101,"offset":3198},"end":{"line":41,"column":125,"offset":3222},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.1777866581064"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.04","id":"daily.journal.2026.05.04","vaultName":"vault"},"value":"zettel.1777866581065","position":{"start":{"line":42,"column":93,"offset":3317},"end":{"line":42,"column":117,"offset":3341},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.1777866581065"}}],"anchors":{},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-04\"\u003e2026-05-04\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-04\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/h4ckf0r0day/obscura\"\u003eObscura oleh h4ckf0r0day\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePost LinkedIn Eric Vyacheslav ngasih framing Obscura sebagai headless browser engine open-source buat web scraping dan AI automation.\u003c/li\u003e\n\u003cli\u003eKlaim utamanya: binary kecil (~70MB), startup cepat, load page 85ms, RAM ~30MB, serta mode stealth buat mengurangi deteksi bot.\u003c/li\u003e\n\u003cli\u003eInti pesan yang gue tangkap: ini bukan cuma tools baru, tapi pitch “lebih ringan, lebih cepat, dan lebih susah dideteksi” dibanding stack browser automation biasa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e4 pertanyaan kunci buat ngecek hype ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSebenarnya post ini lagi ngomongin apa?\n\u003cul\u003e\n\u003cli\u003eObscura diposisikan sebagai alternatif \u003ca href=\"https://github.com/puppeteer/puppeteer\"\u003ePuppeteer\u003c/a\u003e/\u003ca href=\"https://github.com/microsoft/playwright\"\u003ePlaywright\u003c/a\u003e dengan footprint kecil dan kemampuan stealth yang diperkuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKenapa Obscura dianggap menarik?\n\u003cul\u003e\n\u003cli\u003eKarena menargetkan dua bottleneck sekaligus: biaya resource dan deteksi anti-bot.\u003c/li\u003e\n\u003cli\u003eKalau benar ringan, cepat, dan kompatibel, ini bisa beda buat scraping skala besar dan agent automation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKlaim mana yang kuat, dan mana yang kebanyakan hype?\n\u003cul\u003e\n\u003cli\u003eMasuk akal: binary kecil, boot cepat, footprint rendah, Rust + V8 + CDP, upaya masking fingerprint.\u003c/li\u003e\n\u003cli\u003ePerlu ditahan: claim \"no detector can catch it\" dan \"drop-in replacement\" tanpa bukti kompatibilitas penuh.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eImplikasi praktis dan risikonya apa?\n\u003cul\u003e\n\u003cli\u003ePraktis: cocok untuk scraping terkontrol, AI agent ringan, internal automation, dan testing tertentu.\u003c/li\u003e\n\u003cli\u003eRisiko: berada di wilayah dual-use, bisa dipakai untuk abuse, dan deteksi bot sebenarnya lebih dari sekadar browser fingerprint.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eWhy the stealth claim feels sensitif:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDeteksi bot modern nggak cuma lihat \u003ccode\u003enavigator.webdriver\u003c/code\u003e atau user agent.\u003c/li\u003e\n\u003cli\u003eMereka lihat timing, interaksi, network, reputasi IP, session flow, dan pola perilaku.\u003c/li\u003e\n\u003cli\u003eJadi browser stealth bisa membantu, tapi bukan solusi tunggal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eInsight personal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYang menarik bukan klaim \"chrome kalah\", tapi bahwa Obscura bisa jadi contoh specialized runtime yang efisien untuk subset use case.\u003c/li\u003e\n\u003cli\u003eIni mirip trade-off antara full browser dan specialized runtime: kompatibilitas luas vs efisiensi fokus.\u003c/li\u003e\n\u003cli\u003eHype seringnya terjadi ketika \"lebih cepat\" dicampur dengan \"lebih stealth\" tanpa memasukkan realitas operasional dan hukum.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKesimpulan ringkas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eObscura menarik sebagai eksperimen dan proof-of-concept untuk runtime web automation yang lebih ringan.\u003c/li\u003e\n\u003cli\u003eNarasi stealth besar-besaran harus dilihat skeptis.\u003c/li\u003e\n\u003cli\u003eNilai riilnya mungkin ada di scope sempit: scraping/automation tertentu, bukan sebagai pengganti Chrome di semua kasus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eFollow-up jika mau lanjut:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBedah konsep headless browser, CDP, Puppeteer, Playwright, dan di mana Obscura coba masuk.\u003c/li\u003e\n\u003cli\u003eTinjau komentar teknis di post untuk melihat area mana yang valid dan mana yang overclaim.\u003c/li\u003e\n\u003cli\u003eKembangkan insight ini jadi zettel kecil tentang batasan stealth dalam browser automation. (Sudah dibuat: \u003ca href=\"/sotoy/notes/zettel.1777866407372\"\u003eBatasan stealth dalam browser automation\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eBuat zettel tambahan untuk:\n\u003cul\u003e\n\u003cli\u003eruntime web automation khusus yang menukar kompatibilitas luas dengan efisiensi fokus (\u003ca href=\"/sotoy/notes/zettel.1777866581063\"\u003eRuntime web automation khusus menukar kompatibilitas luas dengan efisiensi fokus\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003epersistent knowledge graph + blast radius untuk mengurangi context waste di code review agen (\u003ca href=\"/sotoy/notes/zettel.1777866581064\"\u003eKnowledge graph + blast radius mengurangi context waste dalam agent code review\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003ebottleneck agen coding yang sering ada pada pemilihan konteks, bukan kapasitas model (\u003ca href=\"/sotoy/notes/zettel.1777866581065\"\u003eBottleneck agen coding sering ada pada pemilihan konteks, bukan kapasitas model\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eExplore lebih lanjut Obscura dengan use case:\n\u003cul\u003e\n\u003cli\u003escraping artikel yang pakai heavy JS, untuk lihat apakah runtime-nya benar-benar eksekusi halaman modern.\u003c/li\u003e\n\u003cli\u003eautomation internal yang butuh banyak sesi singkat, untuk lihat dampak startup/memory.\u003c/li\u003e\n\u003cli\u003eskenario stealth minim, seperti fetch data dari halaman yang sudah pakai anti-bot dasar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eProcess yang bisa dicoba:\n\u003cul\u003e\n\u003cli\u003eclone repo, build/binary check, jalankan sample script, cek apakah page JS heavy berjalan.\u003c/li\u003e\n\u003cli\u003ebandingkan hasil render/response dengan Puppeteer/Playwright pada target halaman yang sama.\u003c/li\u003e\n\u003cli\u003etes deteksi sederhana dengan script yang mengecek \u003ccode\u003enavigator.webdriver\u003c/code\u003e, canvas fingerprint, dan network request.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/tirth8205/code-review-graph\"\u003ecode-review-graph oleh tirth8205\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRepo ini muncul di post LinkedIn Youssef Hosni sebagai contoh persistent knowledge graph untuk codebase, supaya coding agent gak harus baca semua file.\u003c/li\u003e\n\u003cli\u003eInti masalah yang diserang: \u003cstrong\u003econtext waste\u003c/strong\u003e. Agent sering dikasih task kecil tetapi malah membaca terlalu banyak file yang tidak relevan, jadi token terbuang dan reasoning model jadi noisy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eMekanisme yang kemungkinan dipakai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRepo diparse dengan \u003ca href=\"https://github.com/tree-sitter/tree-sitter\"\u003eTree-sitter\u003c/a\u003e untuk ekstraksi struktur: function, class, import, dependency, dan relasi antar file.\u003c/li\u003e\n\u003cli\u003eHasil parsing itu disimpan di \u003ca href=\"https://github.com/sqlite/sqlite\"\u003eSQLite\u003c/a\u003e sebagai graph persisten, bukan dibangun ulang tiap kali.\u003c/li\u003e\n\u003cli\u003eSaat file berubah, sistem update incremental hanya bagian yang berubah.\u003c/li\u003e\n\u003cli\u003eBlast radius dihitung: caller, callee, dependent, related test, dan file yang terdampak.\u003c/li\u003e\n\u003cli\u003eAgent baru dikasih subset file relevan, bukan seluruh repo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKenapa pendekatan knowledge graph + blast radius menarik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDia memisahkan pekerjaan finding context dari pekerjaan reasoning.\u003c/li\u003e\n\u003cli\u003eModel LLM tidak lagi dibebani untuk jadi parser, navigator repo, dan impact analyzer sekaligus.\u003c/li\u003e\n\u003cli\u003eIni mirip prinsip: komponen murah precompute struktur, komponen mahal fokus berpikir.\u003c/li\u003e\n\u003cli\u003eHasilnya bisa jadi lebih fokus dan lebih murah, terutama di repo besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKapan ini berguna dan kapan overkill:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBerguna untuk repo besar, PR kecil dengan dampak tersebar, code review, change impact analysis, test suggestion, dan monorepo/polyglot.\u003c/li\u003e\n\u003cli\u003eOverkill untuk repo kecil, task greenfield/desain API baru, atau codebase yang terlalu dinamis dan runtime-heavy.\u003c/li\u003e\n\u003cli\u003eJuga perlu hati-hati kalau dukungan \u003ca href=\"https://github.com/tree-sitter/tree-sitter\"\u003eTree-sitter\u003c/a\u003e untuk bahasa tertentu belum cukup mendalam.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKlaim yang kuat versus yang perlu hati-hati:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKuat: context waste adalah problem nyata; persistent graph + incremental update logis; blast radius buat review masuk akal.\u003c/li\u003e\n\u003cli\u003eHati-hati: angka 6.8x / 49x mungkin cuma valid di benchmark tertentu; \"support 23 languages\" tidak selalu berarti analisis semantik lengkap untuk semua bahasa; istilah \"knowledge graph\" bisa kedengaran lebih fancy daripada implementasi praktisnya.\u003c/li\u003e\n\u003cli\u003eExplore lebih lanjut code-review-graph dengan use case:\n\u003cul\u003e\n\u003cli\u003eevaluasi repo besar yang sering PR kecil, untuk lihat apakah blast radius bisa memangkas file relevan.\u003c/li\u003e\n\u003cli\u003eproyek yang banyak dependency antar modul, untuk lihat apakah graph membantu hitung impact lebih cepat.\u003c/li\u003e\n\u003cli\u003eintegrasi agent review, untuk lihat apakah token context berkurang dan hasil review lebih fokus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eProcess yang bisa dicoba:\n\u003cul\u003e\n\u003cli\u003eclone repo, jalankan indexing pada satu repo besar, lalu inspeksi SQLite graph yang dihasilkan.\u003c/li\u003e\n\u003cli\u003eubah satu fungsi kecil di repo target, lihat file mana yang dihitung terdampak dan apakah daftar itu relevan.\u003c/li\u003e\n\u003cli\u003ebandingkan alur “agent baca semua file” dengan “agent baca subset dari blast radius” di satu PR nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eInsight tambahan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni bukan hanya tool buat Claude Code. Ini lebih ke gagasan bahwa bottleneck coding agent sering ada di pemilihan konteks, bukan di modelnya.\u003c/li\u003e\n\u003cli\u003eKalau agen adalah analis pintar, project ini bikin \"petugas arsip\" yang nyaring dokumen relevan sebelum model diminta berpikir.\u003c/li\u003e\n\u003cli\u003eJadi nilai utamanya adalah \u003cstrong\u003efokus\u003c/strong\u003e, bukan sekadar hemat token.\u003c/li\u003e\n\u003cli\u003eTujuan utama bukan menyembunyikan bot secara absolut, tapi mereduksi jejak fingerprint dan sinyal yang sering dipakai situs untuk mendeteksi automation.\u003c/li\u003e\n\u003cli\u003ePost itu menyebut:\n\u003cul\u003e\n\u003cli\u003erandomisasi fingerprint per session untuk GPU, canvas, audio, battery\u003c/li\u003e\n\u003cli\u003emasking \u003ccode\u003enavigator.webdriver\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003epatch native functions\u003c/li\u003e\n\u003cli\u003eblocking ribuan tracker domains\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eLapisan teknis stealth yang kemungkinan dimainkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProperty masking: override getter di \u003ccode\u003enavigator\u003c/code\u003e, \u003ccode\u003escreen\u003c/code\u003e, \u003ccode\u003eplugins\u003c/code\u003e, \u003ccode\u003elanguages\u003c/code\u003e, WebGL, battery, device memory, dsb.\u003c/li\u003e\n\u003cli\u003ePer-session randomization: sesi bot dibuat tidak identik, tapi harus tetap konsisten sebagai fingerprint perangkat nyata.\u003c/li\u003e\n\u003cli\u003eNative function patching: bukan hanya output yang harus normal, tapi juga tampilan fungsi saat diinspeksi.\u003c/li\u003e\n\u003cli\u003eTracker/anti-bot suppression: mengurangi observasi pihak ketiga, tapi bisa juga jadi sinyal jika pola request jadi terlalu bersih.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKenapa fitur ini bisa efektif, tapi tidak pernah jaminan?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBrowser-level stealth itu cuma satu lapisan deteksi. Situs modern mengevaluasi banyak sinyal lain seperti IP reputation, timing request, pola klik/scroll, durasi sesi, cookie reuse, dan kontinuitas navigasi.\u003c/li\u003e\n\u003cli\u003eJadi \u003ccode\u003enavigator.webdriver\u003c/code\u003e lolos saja belum cukup.\u003c/li\u003e\n\u003cli\u003eDi use case AI agent internal, stealth bisa kurang penting; di scraping situs pihak ketiga yang serius, stealth hanya titik awal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eBatasan / failure mode:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInconsistency: patch satu API tapi lupa API lain, jadi terjadi kontradiksi antar sinyal.\u003c/li\u003e\n\u003cli\u003eUnrealistic randomness: fingerprint terlalu acak sampai jadi nggak masuk akal.\u003c/li\u003e\n\u003cli\u003eBehavioral detection: fingerprint lolos, tapi klik/scroll masih mekanis.\u003c/li\u003e\n\u003cli\u003eNetwork layer kalah: IP/proxy jelek atau TLS fingerprint tidak wajar.\u003c/li\u003e\n\u003cli\u003eCompatibility gap: stealth oke, tapi rendering/runtime tidak cocok untuk halaman web modern.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRingkasannya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eStealth mode Obscura paling tepat dilihat sebagai risk reduction pada permukaan browser fingerprint.\u003c/li\u003e\n\u003cli\u003eBukan jubah gaib; lebih mirip make-up forensics yang bantu browser bot lolos pintu depan.\u003c/li\u003e\n\u003cli\u003eEfektif di satu permukaan, tapi tidak menghapus semua bukti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebrowser-automation (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003estealth (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eknowledge-graph (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecode-review (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eresearch (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"ena
