l":{"type":"header","text":"Mental model","value":"mental-model","line":569,"column":0,"depth":2},"strategi-spread-dan-biaya-masuk-keluar":{"type":"header","text":"Strategi spread dan biaya masuk-keluar","value":"strategi-spread-dan-biaya-masuk-keluar","line":594,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":620,"column":0,"depth":2},"starting-plan":{"type":"header","text":"Starting plan","value":"starting-plan","line":628,"column":0,"depth":2},"kesimpulan":{"type":"header","text":"Kesimpulan","value":"kesimpulan","line":636,"column":0,"depth":2}},"children":[],"parent":"achkm6n7yh8iyogw6yghkwx","data":{}},"body":"\u003ch1 id=\"core-satellite-defensive-allocation-untuk-hedge-rupiah\"\u003eCore-satellite defensive allocation untuk hedge rupiah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-satellite-defensive-allocation-untuk-hedge-rupiah\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti\"\u003eInti\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue melihat sekarang bukan waktunya ngirit terus di IDR atau nekat all-in valas. Yang dibutuhkan adalah framework portfolio yang jelas: \u003cstrong\u003ecore-satellite defensive allocation\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eTujuannya: saldo nggak 100% kena risiko rupiah, tetapi juga nggak panik masuk valas di titik mahal.\u003c/p\u003e\n\u003ch2 id=\"konsep-core-satellite\"\u003eKonsep core-satellite\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konsep-core-satellite\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"core-6070\"\u003eCore 60–70%\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-6070\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCore adalah uang aman dan likuid.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRp25–35 juta tetap di IDR likuid untuk emergency dan kebutuhan 3–6 bulan.\u003c/li\u003e\n\u003cli\u003eRp25–35 juta masuk instrumen IDR rendah risiko: RDPU, deposito pendek, atau SBN seri yang cocok.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bukan dana untuk profit besar. Ini safety first.\u003c/p\u003e\n\u003ch3 id=\"satellite-3040\"\u003eSatellite 30–40%\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#satellite-3040\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSatellite adalah hedge dan growth.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRp20–30 juta valas: USD/SGD.\u003c/li\u003e\n\u003cli\u003eRp5–10 juta emas.\u003c/li\u003e\n\u003cli\u003eRp0–10 juta aset growth jika horizon lo panjang dan mental siap volatilitas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKenapa nggak semua valas? Karena kebutuhan hidup lo tetap di IDR. Kalau semua masuk USD/SGD, saat lo butuh cash dan kurs lagi turun, lo bisa terpaksa jual rugi. Jadi valas di sini adalah \u003cstrong\u003easuransi nilai tukar\u003c/strong\u003e, bukan pengganti dana darurat.\u003c/p\u003e\n\u003ch2 id=\"eksekusi-dua-fase\"\u003eEksekusi dua fase\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#eksekusi-dua-fase\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"fase-pertama-initial-rebalance\"\u003eFase pertama: initial rebalance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#fase-pertama-initial-rebalance\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTarget awal: \u003cstrong\u003evalas sekitar 25%\u003c/strong\u003e dari total uang idle. Untuk Rp100 juta, berarti sekitar Rp25 juta.\u003c/p\u003e\n\u003cp\u003eEksekusinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRp8 juta sekarang\u003c/li\u003e\n\u003cli\u003eRp8 juta dua minggu lagi\u003c/li\u003e\n\u003cli\u003eRp9 juta bulan depan\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan terlalu lama, tapi juga jangan sekaligus. Kalau tujuan lo hedge, nunggu 12 bulan malah terlalu pelan.\u003c/p\u003e\n\u003ch3 id=\"fase-kedua-monthly-contribution\"\u003eFase kedua: monthly contribution\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#fase-kedua-monthly-contribution\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah komposisi awal selesai, baru masuk ke pola gajian.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAmbil 10–20% dari sisa gaji bersih setelah kebutuhan pokok.\u003c/li\u003e\n\u003cli\u003eKalau bulan itu cashflow sempit, skip atau kecilkan.\u003c/li\u003e\n\u003cli\u003eYang penting: sistemnya konsisten.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bikin hedge jadi kebiasaan, bukan reaksi panik.\u003c/p\u003e\n\u003ch2 id=\"usd-vs-sgd\"\u003eUSD vs SGD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#usd-vs-sgd\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo pakai dua mata uang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUSD\u003c/strong\u003e untuk global exposure: server, SaaS, AI tools, investasi global, emergency internasional.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSGD\u003c/strong\u003e untuk regional exposure: Singapura, stabilitas Asia, kemungkinan travel/relokasi dekat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSplit awal yang masuk akal: \u003cstrong\u003e60% USD / 40% SGD\u003c/strong\u003e. Kalau lo lebih percaya pada stabilitas kawasan, putar ke \u003cstrong\u003e40% USD / 60% SGD\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"monitoring-yang-simpel\"\u003eMonitoring yang simpel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#monitoring-yang-simpel\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue cukup pakai lima angka saja. Jangan kebanyakan indikator.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eNet worth IDR\u003c/strong\u003e — total semua aset jika dirupiahkan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNet worth USD equivalent\u003c/strong\u003e — total aset dibagi kurs USD/IDR.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCash runway\u003c/strong\u003e — uang likuid IDR ÷ pengeluaran bulanan. Target minimal 3–6 bulan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCurrency exposure\u003c/strong\u003e — persentase aset di IDR, USD, SGD, emas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReal return vs inflation\u003c/strong\u003e — bandingkan return IDR dengan inflasi, dan bandingkan pelemahan rupiah dengan bunga IDR.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"target-komposisi-bukan-target-kurs\"\u003eTarget komposisi, bukan target kurs\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#target-komposisi-bukan-target-kurs\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTarget di sini artinya \u003cstrong\u003ekomposisi aset ideal\u003c/strong\u003e yang lo mau capai, supaya risiko tidak numpuk di rupiah. Ini bukan angka sakral; ini cuma “kompas” agar keputusan lo tidak emosional.\u003c/p\u003e\n\u003cp\u003eContoh awal untuk Rp100 juta:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash darurat: 30%\nIDR yield asset: 35%\nValas USD/SGD: 25%\nEmas: 10%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eArtinya:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eRp35 juta: cash IDR untuk hidup/emergency\nRp35 juta: RDPU / deposito pendek / SBN\nRp25 juta: USD/SGD\nRp5 juta: emas\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau kondisi aktual berbeda, lo tinggal bandingkan nilai sekarang vs target. Kalau rupiah lagi rusuh, lo tidak langsung all-in USD. Kalau USD turun, lo tidak langsung panik jual. Itu yang membuat strategi lo lebih disiplin.\u003c/p\u003e\n\u003ch2 id=\"simulasi-kasus-target-awal-3535255\"\u003eSimulasi kasus: target awal 35/35/25/5\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#simulasi-kasus-target-awal-3535255\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAnggap lo punya dana idle Rp100 juta dan mayoritas masih IDR. Target awal 3 bulan lo adalah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash darurat: Rp35 juta = 35%\nIDR yield asset: Rp35 juta = 35%\nValas USD/SGD: Rp25 juta = 25%\nEmas: Rp5 juta = 5%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKeputusan pertama nggak usah langsung ubah semua. Keputusan pertama cukup satu batch dan tercatat jelas.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eKeputusan:\nConvert sebagian IDR ke valas.\n\nNominal:\nRp8.000.000.\n\nTujuan:\nMulai hedge dari risiko pelemahan rupiah. Ini bukan trading kurs dan bukan cari profit cepat. Tujuannya supaya aset tidak 100% terekspos ke IDR.\n\nRisiko:\n1. Rupiah bisa menguat setelah beli USD/SGD, sehingga nilai valas dalam rupiah turun.\n2. Ada spread beli-jual dari bank/money changer.\n3. Kalau butuh uang cepat, bisa terpaksa jual valas di kurs yang tidak ideal.\n4. Kalau terlalu sering transaksi, spread akan makan hasil.\n\nBiaya/spread:\nMisal kurs beli USD dari bank: Rp17.550.\nMisal kurs jual USD ke bank: Rp17.350.\nKurs tengah kira-kira: Rp17.450.\nSpread round-trip: Rp200.\nSpread %: 200 / 17.450 = 1,15%.\n\nArtinya, kalau beli lalu langsung jual, secara kasar lo bisa rugi sekitar 1,15% hanya dari spread.\n\nKapan dievaluasi:\nSebulan sekali, saat update dashboard aset.\n\nKapan harus stop:\n1. Stop beli valas kalau porsi valas sudah 25–30% dari total aset.\n2. Stop transaksi kalau spread lagi terlalu lebar.\n3. Stop kalau IDR cash darurat belum cukup 3–6 bulan biaya hidup.\n4. Stop kalau keputusan mulai didorong panik, bukan target alokasi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHitung hasil batch pertama:\u003c/p\u003e\n\u003cp\u003eMisal lo convert Rp8 juta ke USD di kurs bank Rp17.550.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD didapat = Rp8.000.000 / 17.550 = USD 455,84\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetelah transaksi, portofolio lo kira-kira jadi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash/tabungan: Rp92.000.000\nUSD: USD 455,84 ≈ Rp8.000.000\nTotal: Rp100.000.000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKomposisi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR: 92%\nValas: 8%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTarget valas lo 25%. Aktual baru 8%. Artinya masih jauh di bawah target, tapi sudah mulai ada progress.\u003c/p\u003e\n\u003cp\u003eCatatan penting: batch pertama Rp8 juta bukan berarti lo harus terus-terusan convert Rp8 juta sampai Rp25 juta tercapai tanpa jeda. Ini hanya langkah awal. Lo akan lihat hasilnya, evaluasi lagi, lalu putuskan apakah batch kedua atau ketiga perlu dijalankan.\u003c/p\u003e\n\u003cp\u003eKalau setelah batch pertama porsi valas masih jauh dari target, itu wajar. Tujuan pertama adalah mulai membangun posisi valas, bukan langsung menutup target.\u003c/p\u003e\n\u003cp\u003eKeputusan berikutnya bukan “beli lagi besok karena panik”, tapi tunggu jadwal batch berikutnya.\u003c/p\u003e\n\u003ch2 id=\"keputusan-batch-berikutnya\"\u003eKeputusan batch berikutnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#keputusan-batch-berikutnya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDua minggu atau sebulan kemudian, lo bisa lakukan batch kedua.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eKeputusan:\nConvert batch kedua ke valas.\n\nNominal:\nRp8.000.000.\n\nTujuan:\nMenaikkan porsi valas dari 8% menuju target 25%, tetap secara bertahap agar tidak all-in di satu kurs.\n\nRisiko:\nSama seperti batch pertama. Risiko tambahan: kalau kurs sudah naik jauh, harga beli valas makin mahal.\n\nBiaya/spread:\nCek lagi kurs bank/money changer saat eksekusi. Jangan pakai asumsi lama.\n\nKapan dievaluasi:\nUpdate dashboard setelah transaksi.\n\nKapan harus stop:\nKalau setelah transaksi porsi valas mendekati 20–25%, batch berikutnya bisa dikecilkan.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMisal kurs saat batch kedua Rp17.800/USD:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD didapat = Rp8.000.000 / 17.800 = USD 449,44\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTotal USD lo:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD 455,84 + USD 449,44 = USD 905,28\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTotal modal IDR yang sudah masuk valas:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eRp16.000.000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau dihitung dengan kurs saat itu Rp17.800:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eNilai USD = 905,28 x 17.800 = Rp16.114.000\nTotal aset ≈ Rp100.114.000\nPorsi valas ≈ 16,1%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eProgress:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eTarget valas: 25%\nAktual valas: 16,1%\nGap: 8,9 percentage points\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMasih boleh lanjut batch berikutnya, tapi tidak harus besar.\u003c/p\u003e\n\u003ch2 id=\"batch-ketiga\"\u003eBatch ketiga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batch-ketiga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBulan berikutnya, lo bisa eksekusi batch ketiga dengan nominal lebih kecil.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eKeputusan:\nConvert batch ketiga.\n\nNominal:\nRp6.000.000.\n\nTujuan:\nMendekatkan porsi valas ke target 25%, tapi tidak melebihi batas atas 30%.\n\nRisiko:\nKalau rupiah menguat setelah ini, nilai valas turun. Tapi karena porsi masih dalam target, ini tetap dianggap hedge, bukan kesalahan.\n\nBiaya/spread:\nCek kurs beli dan jual. Jangan eksekusi kalau spread sedang abnormal.\n\nKapan dievaluasi:\nAkhir bulan.\n\nKapan harus stop:\nSetelah porsi valas sudah sekitar 22–25%, hentikan pembelian agresif. Berikutnya cukup dari gajian kecil-kecil.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMisal kurs batch ketiga Rp17.600/USD:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD didapat = Rp6.000.000 / 17.600 = USD 340,91\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTotal USD:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD 905,28 + USD 340,91 = USD 1.246,19\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTotal modal masuk valas:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eRp22.000.000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau kurs sekarang Rp17.600:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eNilai USD = 1.246,19 x 17.600 = Rp21.932.944\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePortofolio:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR sisa: Rp78.000.000\nValas: Rp21.932.944\nTotal aset: Rp99.932.944\nPorsi valas: 21,95%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSekarang lo sudah dari 0% valas menjadi sekitar 22%. Ini sudah jauh lebih sehat daripada 100% IDR.\u003c/p\u003e\n\u003cp\u003eDi titik ini keputusan berikutnya bukan otomatis beli lagi. Lo lihat target:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eTarget valas: 25%\nAktual valas: 22%\nBatas bawah: 20%\nBatas atas: 30%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKarena aktual sudah masuk range 20–30%, lo bisa stop dulu. Kalau bulan depan ada gaji, cukup tambah kecil misalnya Rp2–3 juta, atau arahkan uang baru ke RDPU/SBN kalau IDR yield asset masih kosong.\u003c/p\u003e\n\u003ch2 id=\"contoh-lain-pindahkan-idle-cash-ke-rdpu--sbn\"\u003eContoh lain: pindahkan idle cash ke RDPU / SBN\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-lain-pindahkan-idle-cash-ke-rdpu--sbn\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo pilih langkah konservatif, ini bisa jadi keputusan kedua selain valas.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eKeputusan:\nPindahkan sebagian IDR tabungan ke RDPU atau SBN/deposito pendek.\n\nNominal:\nRp20.000.000.\n\nTujuan:\nMengurangi idle cash yang tidak menghasilkan return berarti, tapi tetap menjaga risiko rendah dan likuiditas relatif baik.\n\nRisiko:\n1. RDPU tetap punya risiko walau rendah.\n2. SBN bisa kurang likuid jika belum jatuh tempo, tergantung jenisnya.\n3. Deposito punya penalti kalau dicairkan sebelum jatuh tempo.\n4. Return bisa kalah dari pelemahan rupiah kalau IDR melemah tajam.\n\nBiaya/spread:\nCek biaya pembelian/penjualan, pajak kupon kalau SBN, biaya platform, dan likuiditas pencairan.\n\nKapan dievaluasi:\nBulanan untuk RDPU.\nSaat jatuh tempo/kupon untuk SBN/deposito.\n\nKapan harus stop:\n1. Stop kalau dana darurat IDR belum aman.\n2. Stop kalau instrumen tidak bisa dicairkan sesuai kebutuhan.\n3. Stop kalau bunga deposito melebihi batas penjaminan LPS dan lo tidak paham risikonya.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetelah lo lakukan ini:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash/tabungan: Rp58 juta\nIDR yield asset: Rp20 juta\nValas: Rp22 juta\nTotal: Rp100 juta\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKomposisi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash: 58%\nIDR yield asset: 20%\nValas: 22%\nEmas: 0%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDibanding target:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash target: 35%     aktual: 58%  → masih terlalu besar\nIDR yield target: 35%    aktual: 20%  → masih kurang\nValas target: 25%        aktual: 22%  → sudah cukup dekat\nEmas target: 5%          aktual: 0%   → belum ada\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAction berikutnya jadi jelas:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eJangan tambah valas besar dulu.\nKurangi IDR cash pelan-pelan.\nTambah IDR yield asset.\nPertimbangkan emas kecil kalau memang mau hedge tambahan.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"template-keputusan-kecil\"\u003eTemplate keputusan kecil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#template-keputusan-kecil\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetiap keputusan uang harus punya format kecil:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eKeputusan:\n[Contoh: beli USD batch pertama / beli SGD / masuk RDPU / beli SBN / beli emas]\n\nNominal:\nRp[...]\n\nTujuan:\n[Hedge kurs / dana darurat / yield rendah risiko / diversifikasi / kebutuhan masa depan]\n\nRisiko:\n[Harga turun / spread / likuiditas / salah timing / pajak / biaya platform]\n\nBiaya/spread:\n[Kurs beli, kurs jual, spread %, biaya admin, pajak kalau ada]\n\nKapan dievaluasi:\n[Mingguan hanya lihat data, bulanan update dashboard, kuartalan rebalancing]\n\nKapan harus stop:\n[Kalau porsi target tercapai / spread terlalu mahal / cash runway kurang / keputusan didorong panik]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJangan lanjut ke strategi ini kalau semua masih terlihat seperti “pasar lagi buruk”. Yang penting adalah membangun struktur portofolio secara bertahap.\u003c/p\u003e\n\u003ch2 id=\"contoh-target-rp100-juta-dan-drift\"\u003eContoh target Rp100 juta dan drift\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-target-rp100-juta-dan-drift\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBayangin lo mulai dari portofolio Rp100 juta dengan komposisi target di atas. Lo beli valas senilai Rp25 juta di kurs USD/IDR 17.500, jadi USD lo kira-kira:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eRp25.000.000 / 17.500 = USD 1.428,57\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAwalannya:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash:        Rp30.000.000 = 30%\nIDR yield asset: Rp35.000.000 = 35%\nValas:           USD 1.428,57 = Rp25.000.000 = 25%\nEmas:            Rp10.000.000 = 10%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTiga bulan kemudian rupiah melemah dan USD/IDR naik ke 19.000. Lo nggak beli apa-apa. Valas kamu tetap USD 1.428,57, tapi nilai rupiahnya jadi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD 1.428,57 x 19.000 = Rp27.142.830\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTotal portofolio baru kira-kira:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eIDR cash:        Rp30.000.000\nIDR yield asset: Rp35.000.000\nValas:           Rp27.142.830\nEmas:            Rp10.000.000\nTotal:           Rp102.142.830\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePersentase valas:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eRp27.142.830 / Rp102.142.830 = 26,6%\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDrift:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e26,6% - 25% = +1,6 poin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni belum perlu rebalancing. Cukup catat dan tahan posisi.\u003c/p\u003e\n\u003cp\u003eKalau harga rupiah terus turun sampai USD/IDR 22.000, nilai valas lo naik ke:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD 1.428,57 x 22.000 = Rp31.428.540\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePersentase valas jadi sekitar 29,5%, drift +4,5 poin. Masih dekat batas ±5 poin, jadi masih masuk zona waspada.\u003c/p\u003e\n\u003cp\u003eKalau USD/IDR naik ke 23.000, valas lo jadi Rp32.857.110 dan persen valas mendekati 30,5%.\u003c/p\u003e\n\u003cp\u003eDrift:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e30,5% - 25% = +5,5 poin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBaru di titik inilah rebalancing layak dipikirkan. Bukan jual semua USD, tapi jual sebagian sampai valas kembali mendekati target 25%.\u003c/p\u003e\n\u003cp\u003eSebaliknya, kalau rupiah menguat ke 15.500, valas lo jadi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eUSD 1.428,57 x 15.500 = Rp22.142.835\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePersentase valas turun menjadi 22,8%, drift -2,2 poin. Masih tahan.\u003c/p\u003e\n\u003cp\u003eKalau rupiah terus menguat ke 14.000, nilai valas turun ke Rp18.571.410 dan persentase valas jadi 19,8%, drift -5,2 poin. Itu baru masuk area yang layak dibeli lagi untuk mengembalikan porsi mendekati target.\u003c/p\u003e\n\u003cp\u003eIntinya: lo boleh tahan selama drift masih kecil. Rebalancing masuk saat portofolio sudah melenceng cukup jauh — misalnya sekitar ±5 poin — bukan setiap kali USD berubah.\u003c/p\u003e\n\u003ch2 id=\"monitoring-asset-allocation--drift\"\u003eMonitoring asset allocation + drift\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#monitoring-asset-allocation--drift\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePakai tracker bulanan sederhana, cukup Google Sheet / Excel / Notion table. Jangan mulai dari tool rumit.\u003c/p\u003e\n\u003cp\u003eKolom penting:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eTanggal\nIDR cash\nRDPU / deposito / SBN\nUSD\nSGD\nEmas\nTotal aset dalam IDR\nTotal aset dalam USD equivalent\nIDR cash %\nIDR yield asset %\nValas %\nEmas %\nCash runway\nUSD/IDR\nSGD/IDR\nSpread USD\nSpread SGD\nCatatan keputusan\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRumus intinya:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eTotal aset IDR =\nIDR cash + RDPU/SBN/deposito + (USD x kurs USD/IDR) + (SGD x kurs SGD/IDR) + nilai emas\n\nPorsi valas % =\n((USD x kurs USD/IDR) + (SGD x kurs SGD/IDR)) / total aset\n\nPorsi IDR cash % =\nIDR cash / total aset\n\nCash runway =\nIDR cash / pengeluaran bulanan\n\nTotal aset USD equivalent =\ntotal aset IDR / USD/IDR\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYang perlu lo lihat bukan cuma “saldo rupiah naik/turun”, tapi dua angka ini:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1. Total aset dalam IDR\n2. Total aset dalam USD equivalent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau total aset lo dalam rupiah naik tapi dalam USD turun, itu artinya secara global kekayaan lo melemah. Itu persis concern awal lo.\u003c/p\u003e\n\u003ch2 id=\"rules-monitoring\"\u003eRules monitoring\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rules-monitoring\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKalau \u003cstrong\u003eIDR cash \u003e 40% dari total aset\u003c/strong\u003e dan runway sudah \u003e 6 bulan, alihkan sebagian ke RDPU/SBN/valas bertahap.\u003c/li\u003e\n\u003cli\u003eKalau \u003cstrong\u003evalas \u0026#x3C; 20%\u003c/strong\u003e dan lo masih khawatir rupiah, tambah valas dari gajian atau idle cash.\u003c/li\u003e\n\u003cli\u003eKalau \u003cstrong\u003evalas \u003e 40–50%\u003c/strong\u003e, berhenti dulu kecuali lo memang punya kebutuhan USD/SGD jelas.\u003c/li\u003e\n\u003cli\u003eKalau \u003cstrong\u003erupiah melemah tajam\u003c/strong\u003e, jangan all-in valas. Tetap batch.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eData 6 bulan terakhir menunjukkan USD/IDR naik sekitar 3,89%, dengan puncak sekitar Rp17.400 pada 5 Mei 2026. Itu contoh kenapa beli sekaligus bisa salah timing.\u003c/p\u003e\n\u003ch2 id=\"pitfall-suku-bunga-dan-penjaminan\"\u003ePitfall suku bunga dan penjaminan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pitfall-suku-bunga-dan-penjaminan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau ada deposito atau tabungan berbunga tinggi, cek dulu batas penjaminan LPS. Bunga tinggi nggak selalu lebih baik jika tidak masuk penjaminan.\u003c/p\u003e\n\u003cp\u003eLPS masih menetapkan TBP rupiah 4,00% dan valas 2,25% untuk periode 1 Juni–30 September 2025. Jadi jangan cuma lihat angka bunga; lihat juga apakah deposito itu aman.\u003c/p\u003e\n\u003ch2 id=\"mental-model\"\u003eMental model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mental-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling penting buat gue ubah adalah cara mikir tentang cash. \u003cstrong\u003eDiam di IDR itu bukan netral.\u003c/strong\u003e Selama ini terasa aman karena nominalnya nggak bergerak. Padahal secara ekonomi lo sedang \u003cstrong\u003elong IDR, short USD/SGD/emas/global purchasing power\u003c/strong\u003e. Jadi “nggak ngapa-ngapain” bukan berarti bebas risiko. Risikonya cuma nggak kelihatan di aplikasi bank.\u003c/p\u003e\n\u003cp\u003eModel lama: “Kalau gue investasi, gue bisa rugi.”\nModel baru: “Kalau gue tidak mengelola aset, gue tetap bisa rugi lewat inflasi, pelemahan kurs, dan opportunity cost.”\u003c/p\u003e\n\u003cp\u003eDi sisi lain, jangan balik jadi “berarti harus agresif.” Uang bukan arena pembuktian pintar; uang adalah sistem pertahanan hidup. Itu yang gue tangkap dari \u003cem\u003eThe Psychology of Money\u003c/em\u003e — finansial lebih banyak soal perilaku daripada kecerdasan teknis. Keputusan uang muncul dari emosi, takut, ego, harapan, dan pengalaman, bukan hanya spreadsheet. Nilai terbesar uang adalah kontrol atas waktu dan hidup, bukan angka return. Itu penting supaya strategi lo tetap realistis dan nggak berlebihan.\u003c/p\u003e\n\u003cp\u003eMental model utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCash bukan netral, tapi aset likuid.\u003c/strong\u003e Cash IDR penting untuk 3–6 bulan biaya hidup. Di luar itu, cash terlalu banyak jadi beban. Jadi jangan benci cash, tapi beri tugas yang benar: cash untuk “bulan depan bisa hidup tenang.” RDPU/deposito/SBN untuk “uang rendah risiko yang tidak langsung dipakai.” Valas untuk “lindung nilai kurs.” Emas untuk “hedge sistemik.” Saham/global index nanti kalau mental dan horizon sudah siap.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTujuan awal bukan kaya dulu, tapi tidak rapuh.\u003c/strong\u003e Karena gue lagi dari posisi takut dan avoidance, langkah awalnya bukan masuk saham/crypto/trading. Mulai dari anti-fragile pribadi: dana darurat, asuransi relevan, minim utang konsumtif, sebagian aset berbunga, sebagian valas, sebagian emas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLiterasi keuangan itu bukan hafal istilah.\u003c/strong\u003e OJK bilang literasi finansial adalah pengetahuan, keterampilan, dan keyakinan yang memengaruhi sikap dan keputusan. Jadi yang harus gue latih adalah bertanya: “risikonya apa, biayanya apa, kapan gue bisa keluar, apa hak gue?” bukan cuma “apa itu ETF?”\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReasonable beats optimal.\u003c/strong\u003e Strategi yang paling optimal bukan yang paling canggih, tapi yang bisa gue jalankan tanpa panik. Vanguard juga bilang: punya tujuan jelas, alokasi terdiversifikasi, minimalkan biaya, dan disiplin menjaga rencana. Biaya, alokasi, dan disiplin bisa dikontrol. Banyak hal lain nggak bisa.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJangan belajar finansial dari rasa terancam saja.\u003c/strong\u003e Kalau trigger-nya cuma “rupiah mengerikan”, otak masuk mode survival dan cepat-cepat cari solusi instan. Supaya prosesnya sehat, ritual harus kecil dan berulang: seminggu sekali baca satu konsep, sebulan sekali update dashboard, tiga bulan sekali rebalancing. Jangan tiap hari buka kurs lalu bikin keputusan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDalam praktiknya, ini berarti: bulan pertama tugasnya bikin peta, bukan ngejar return. Catat aset, pengeluaran, cash runway, dan komposisi. Bulan kedua eksekusi kecil: convert valas batch kecil, alihkan idle cash ke RDPU/deposito/SBN, beli emas kecil kalau mau hedge. Bulan ketiga monitor: lihat aktual vs target, tambah valas pelan kalau masih jauh, stop kalau sudah pas, tunda batch besar kalau spread buruk.\u003c/p\u003e\n\u003cp\u003eKalimat kunci yang gue pegang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eTujuan gue bukan menang melawan market. Tujuan gue membangun sistem yang bikin hidup gue tidak rapuh.\u003c/strong\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau ini yang lo pakai, finansial jadi hygiene hidup, bukan perjudian. Nggak menarik setiap hari, tapi ketika krisis datang lo nggak telanjang.\u003c/p\u003e\n\u003ch2 id=\"strategi-spread-dan-biaya-masuk-keluar\"\u003eStrategi spread dan biaya masuk-keluar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#strategi-spread-dan-biaya-masuk-keluar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue mulai lihat \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil.national-finance.spread-beli-jual (Private)\u003c/a\u003e valas sebagai biaya pintu masuk-keluar. Kalau lo beli USD/SGD, bank atau broker biasanya jual ke lo di harga ask. Kalau lo langsung jual lagi, mereka beli balik di lo di harga bid yang lebih rendah. Selisih ini adalah friction cost, dan itu membuat hedge valas lebih mirip “simpan untuk jangka menengah” daripada trading jangka pendek.\u003c/p\u003e\n\u003cp\u003ePrinsip praktisnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eJangan terlalu sering bolak-balik IDR ⇄ valas.\u003c/strong\u003e Kalau lo beli sekarang lalu jual sebulan kemudian karena panik, spread bisa makan sebagian besar keuntungan atau membuat posisi impas lebih sulit.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eBandingkan biaya round-trip antar channel.\u003c/strong\u003e Mobile banking, e-rate, money changer, bank counter, dan broker bisa punya spread berbeda. Yang dihitung bukan hanya kurs beli USD, tapi biaya total masuk-keluar.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eHitung round-trip spread.\u003c/strong\u003e Rumusnya:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e(kurs jual bank - kurs beli bank) / kurs tengah\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eMisal bank jual USD ke lo 17.550 dan bank beli dari lo 17.350. Mid kira-kira 17.450. Spread round-trip ≈ 200 / 17.450 = 1,15%.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eBuat threshold sederhana.\u003c/strong\u003e Kalau spread USD/IDR di suatu channel \u003e 1%, jangan transaksi besar. Kalau spread SGD/IDR di atas 1–1,5%, kecilkan nominal atau tunggu likuiditas lebih baik.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eBatching lebih penting daripada \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil.national-finance.dca-dollar-cost-averaging (Private)\u003c/a\u003e terlalu kecil.\u003c/strong\u003e Kalau tiap bulan lo konversi Rp500 ribu, biaya spread dan friction bisa relatif terlalu tinggi. Lebih baik kumpulkan dulu, lalu convert batch Rp5–10 juta yang masuk akal untuk kebutuhan lo.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePisahkan tujuan valas.\u003c/strong\u003e Untuk \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil.national-finance.hedge-adalah-perlindungan-nilai (Private)\u003c/a\u003e jangka 1–3 tahun, spread satu kali masuk lebih bisa diterima. Untuk dana yang mungkin dipakai 1–3 bulan, spread sering jadi terlalu mahal; lebih baik tetap di IDR likuid atau RDPU.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eTarget alokasi, bukan target kurs.\u003c/strong\u003e Misalnya target 65% IDR, 25% valas, 10% emas. Beli sampai porsi valas tercapai, lalu stop. Kalau kurs bergerak dan porsi valas naik ke 35–40%, tidak perlu tambah lagi kecuali ada kebutuhan alokasi ulang.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRule of thumb:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSpread kecil + tujuan jangka menengah/panjang = eksekusi batch.\u003c/li\u003e\n\u003cli\u003eSpread besar + kebutuhan dana dekat = jangan paksakan convert.\u003c/li\u003e\n\u003cli\u003eValas adalah hedge, bukan tempat parkir semua uang.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSpread membuat rebalancing terlalu sering jadi mahal, jadi review cukup bulanan dan action cukup kuartalan kecuali ada kebutuhan besar atau perubahan strategi yang jelas.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.national-finance.dca-dollar-cost-averaging\"\u003eDCA adalah strategi rata-rata biaya masuk\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.national-finance.spread-beli-jual\"\u003eSpread beli-jual adalah biaya transaksi di forex dan valas\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.national-finance.hedge-adalah-perlindungan-nilai\"\u003eHedge adalah perlindungan nilai, bukan cari untung utama\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.national-finance.rebalancing-alokasi-drift\"\u003eRebalancing adalah koreksi alokasi ketika drift terlalu besar\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.national-finance.rupiah-defensive-stabilization-2026\"\u003eRupiah: Tekanan Global, Respons BI, dan Strategi Hedge Bertahap\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"starting-plan\"\u003eStarting plan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#starting-plan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBulan ini: buka valas, convert Rp8–10 juta ke USD/SGD.\u003c/li\u003e\n\u003cli\u003eDua minggu / satu bulan lagi: convert lagi Rp8–10 juta.\u003c/li\u003e\n\u003cli\u003eBulan berikutnya: tambah Rp5–10 juta sampai valas ~25–30%.\u003c/li\u003e\n\u003cli\u003eSisa IDR yang bukan dana darurat pindahkan dari tabungan biasa ke RDPU/deposito/SBN sesuai likuiditas.\u003c/li\u003e\n\u003cli\u003eSetiap gajian: alokasikan 10–20% dari sisa cashflow ke valas sampai target tercapai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFramework lo bukan \"beli dolar karena takut\". Framework lo adalah: punya target komposisi, jadwal masuk, angka monitoring, dan batas kapan stop.\u003c/p\u003e\n\u003cp\u003eKalau kondisi rupiah terus negatif-defensif, pendekatan ini lebih sehat daripada sepenuhnya spekulatif atau sepenuhnya pasif.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enational-finance (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehedge (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eallocation (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point f
