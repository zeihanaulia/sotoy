 bisa menghapus kebutuhan atas skill lama: kalau lo cuma jago di pekerjaan manual yang bisa diotomasi, maka otomatisasi itu sendiri bisa membuat skill lo tidak dibutuhkan lagi.\u003c/p\u003e\n\u003ch2 id=\"supporting-quotes\"\u003eSupporting quotes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#supporting-quotes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This got repetitive and boring really fast. So what does any good programmer do? Automate.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The business teams could now update the entire intranet website on their own.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The company no longer had a need for their skillset because their jobs had been automated.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“If you are going to make it in this field, you need to stay current with technology. Otherwise, you may be the one automated out of a job.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eInti pelajaran karier yang gue tangkap bukanlah \"jangan bikin otomasi.\" Justru sebaliknya: kalau lo bikin otomasi, lo harus siap pindah ke lapisan skill yang lebih baru — yang membangun, mengarahkan, dan beradaptasi dengan sistem baru. Itu yang bikin preface ini terasa relevan bukan cuma untuk AI, tapi untuk semua gelombang otomasi di software engineering.\u003c/p\u003e\n\u003ch2 id=\"sumber\"\u003eSumber\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sumber\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePart I / Preface\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.the-developers-guide-to-ai\"\u003eThe Developer's Guide to
