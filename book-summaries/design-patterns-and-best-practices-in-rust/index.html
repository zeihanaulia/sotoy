ps":{"note":{"id":"book-summaries.design-patterns-and-best-practices-in-rust","title":"Design Patterns and Best Practices in Rust","desc":"Ringkasan buku tentang cara berpikir ulang design pattern klasik untuk idiom Rust.","updated":1778806126299,"created":1778769830967,"tags":["book-summary","rust","design-patterns"],"custom":{},"fname":"book-summaries.design-patterns-and-best-practices-in-rust","type":"note","vault":{"fsPath":"vault"},"contentHash":"4d6a56b6467485231c8de08876b6843d","links":[{"type":"frontmatterTag","from":{"fname":"book-summaries.design-patterns-and-best-practices-in-rust","id":"book-summaries.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.book-summary","alias":"book-summary","xvault":false,"to":{"fname":"tags.book-summary"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.design-patterns-and-best-practices-in-rust","id":"book-summaries.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.rust","alias":"rust","xvault":false,"to":{"fname":"tags.rust"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.design-patterns-and-best-practices-in-rust","id":"book-summaries.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.design-patterns","alias":"design-patterns","xvault":false,"to":{"fname":"tags.design-patterns"}}],"anchors":{"preface-frame-baca-buku":{"type":"header","text":"Preface: frame baca buku","value":"preface-frame-baca-buku","line":16,"column":0,"depth":2},"kenapa-ini-bukan-buku-pattern-biasa":{"type":"header","text":"Kenapa ini bukan buku pattern biasa","value":"kenapa-ini-bukan-buku-pattern-biasa","line":103,"column":0,"depth":2},"apa-yang-paling-nempel-dari-setiap-part":{"type":"header","text":"Apa yang paling nempel dari setiap part","value":"apa-yang-paling-nempel-dari-setiap-part","line":111,"column":0,"depth":2},"part-1-thinking-in-rust":{"type":"header","text":"Part 1: Thinking in Rust","value":"part-1-thinking-in-rust","line":113,"column":0,"depth":3},"part-2-replacing-traditional-design-patterns":{"type":"header","text":"Part 2: Replacing Traditional Design Patterns","value":"part-2-replacing-traditional-design-patterns","line":120,"column":0,"depth":3},"part-3-new-patterns-for-rust":{"type":"header","text":"Part 3: New Patterns for Rust","value":"part-3-new-patterns-for-rust","line":128,"column":0,"depth":3},"takeaway-inti":{"type":"header","text":"Takeaway inti","value":"takeaway-inti","line":139,"column":0,"depth":2},"pertanyaan-baca-yang-bagus":{"type":"header","text":"Pertanyaan baca yang bagus","value":"pertanyaan-baca-yang-bagus","line":171,"column":0,"depth":2},"roadmap-belajar":{"type":"header","text":"Roadmap belajar","value":"roadmap-belajar","line":181,"column":0,"depth":2},"dari-oop-ke-rust-native":{"type":"header","text":"Dari OOP ke Rust Native","value":"dari-oop-ke-rust-native","line":208,"column":0,"depth":2}},"children":[],"parent":"book-summaries","data":{}},"body":"\u003ch1 id=\"design-patterns-and-best-practices-in-rust\"\u003eDesign Patterns and Best Practices in Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#design-patterns-and-best-practices-in-rust\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eDari daftar isi yang gue baca, buku ini bukan sekadar \"buku design pattern versi Rust\". Logika besarnya lebih tajam: buku ini ngajarin cara berhenti membawa kebiasaan OOP dan pattern tradisional mentah-mentah ke Rust, lalu pelan-pelan mengganti cara mikir lo dengan cara Rust.\u003c/p\u003e\n\u003ch2 id=\"preface-frame-baca-buku\"\u003ePreface: frame baca buku\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#preface-frame-baca-buku\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePreface bukan ngajarin syntax Rust. Dia lagi menyetel frame baca: buku ini tentang transformasi cara desain software di Rust. Kalimat pentingnya adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Truly effective Rust development requires a transformation in how you approach software design itself.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya, menguasai \u003ccode\u003estruct\u003c/code\u003e, \u003ccode\u003etrait\u003c/code\u003e, \u003ccode\u003eenum\u003c/code\u003e, \u003ccode\u003ematch\u003c/code\u003e, \u003ccode\u003eResult\u003c/code\u003e, ownership, borrowing, dan lifetime secara dasar belum cukup. Buku ini mau membongkar cara lo mendesain relasi antar komponen, bukan cuma gimana bikin kode Rust compile.\u003c/p\u003e\n\u003cp\u003ePreface memberi beberapa sinyal penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni bukan basa-basi; ini adalah kontrak pembelajaran buku.\u003c/li\u003e\n\u003cli\u003eProblem utama bukan \"Rust sulit\", tapi developer sering membawa desain dari bahasa lain ke Rust.\u003c/li\u003e\n\u003cli\u003eRust memaksa desain kelihatan. Ownership kabur, dependency berantakan, atau mutability terlalu bebas akan segera memberi sinyal compile-time.\u003c/li\u003e\n\u003cli\u003eCompiler Rust adalah reviewer desain, bukan sekadar penjaga syntax.\u003c/li\u003e\n\u003cli\u003eBuku ini ingin menggeser kita dari \"memaksa Rust mengikuti desain lama\" menjadi \"membiarkan constraint Rust membentuk desain baru\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBuku ini membuka dengan dua sisi pengalaman Rust: janji safety, concurrency, zero-cost abstraction, dan reputasi \"kalau compile, biasanya jalan\", lalu frustrasi ketika borrow checker menolak desain yang \"seemingly reasonable\" dari bahasa lain. Itu bukan tanda Rust jelek — itu tanda desain lama tidak cocok.\u003c/p\u003e\n\u003cp\u003ePreface juga menegaskan dua escape hatch yang sering muncul saat developer frustrasi: \u003ccode\u003eclone()\u003c/code\u003e dan \u003ccode\u003eRc\u0026#x3C;RefCell\u0026#x3C;T\u003e\u003e\u003c/code\u003e. Keduanya bukan dosa, tapi jika dipakai untuk menghindari berpikir tentang ownership, mereka berubah jadi anti-pattern.\u003c/p\u003e\n\u003cp\u003eBagian berikutnya adalah thesis utama Preface:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Internalizing Rust's philosophy and allowing it to shape your thinking matters more than any individual pattern or technique.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kuat. Penulis sedang bilang: jangan baca buku ini sebagai katalog pattern. Jangan mikir, “oh di Rust Factory Pattern begini, Strategy Pattern begini, Observer Pattern begini.” Yang lebih penting adalah filosofi Rust membentuk cara lo memilih pattern.\u003c/p\u003e\n\u003cp\u003eDi OOP klasik, lo mungkin bertanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eClass apa yang perlu dibuat?\u003c/li\u003e\n\u003cli\u003eInterface-nya apa?\u003c/li\u003e\n\u003cli\u003eInheritance tree-nya gimana?\u003c/li\u003e\n\u003cli\u003eObject mana yang punya method apa?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi Rust, pertanyaannya berubah menjadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eData ini dimiliki siapa?\u003c/li\u003e\n\u003cli\u003eMutation terjadi di boundary mana?\u003c/li\u003e\n\u003cli\u003eBehavior ini lebih cocok trait, enum, generic, atau closure?\u003c/li\u003e\n\u003cli\u003eState ilegal bisa dicegah lewat type system gak?\u003c/li\u003e\n\u003cli\u003eApakah polymorphism perlu runtime atau cukup compile time?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni pergeseran besar. Preface menaruh ini di depan supaya lo tidak salah cara baca bab berikutnya.\u003c/p\u003e\n\u003cp\u003eKalau lo baca bab creational/structural/behavioral pattern dengan mindset OOP, lo akan cuma cari padanan. Tapi kalau lo baca dengan mindset Rust, lo akan cari problem desain di balik pattern, lalu bertanya: “Rust punya cara lebih natural gak?”\u003c/p\u003e\n\u003cp\u003eBuku ini menggunakan tiga project sebagai jalur pedagogis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Calculator: sengaja dibuat buruk. Fungsinya bukan menghasilkan app bagus, tapi menjadi \"cermin kesalahan\". Kita akan lihat apa yang terjadi kalau desain Java/C++ dipaksa masuk Rust.\u003c/li\u003e\n\u003cli\u003eCorrect Calculator: versi rebuilding untuk Chapter 5–8. Problem yang sama dibangun ulang dengan pattern yang lebih cocok dengan ownership model dan type system Rust.\u003c/li\u003e\n\u003cli\u003eSamsa microservice: publish/subscribe microservice untuk Chapter 9–12. Ini naik level dari calculator ke arsitektur aplikasi. Di sini pattern Rust-native mulai muncul: type system untuk compile-time safety, functional idioms, architectural advantage dari ownership, dan sebagainya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau dibuat sebagai progression:\u003c/p\u003e\n\u003cp\u003eBad Calculator\n↓\nBelajar melihat anti-pattern\u003c/p\u003e\n\u003cp\u003eCorrect Calculator\n↓\nBelajar menerjemahkan pattern klasik ke Rust\u003c/p\u003e\n\u003cp\u003eSamsa microservice\n↓\nBelajar memakai pattern yang lahir dari Rust sendiri\u003c/p\u003e\n\u003cp\u003eIni urutan pedagogis yang bagus. Buku ini tidak langsung memberi \"best practice\". Dia mulai dari desain yang salah dulu, karena di Rust, memahami failure mode itu penting.\u003c/p\u003e\n\u003cp\u003eKenapa? Karena banyak kesalahan Rust bukan kesalahan syntax, tapi kesalahan mental model.\u003c/p\u003e\n\u003cp\u003e★ Insight\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Calculator adalah alat diagnosis. Lo diajak melihat bau desain sebelum melihat solusi.\u003c/li\u003e\n\u003cli\u003eCorrect Calculator adalah alat translasi. Pattern lama tidak dibuang semua, tapi diadaptasi.\u003c/li\u003e\n\u003cli\u003eSamsa adalah alat sintesis. Setelah mental model berubah, baru lo bisa melihat pattern Rust-native di aplikasi lebih realistis.\u003c/li\u003e\n\u003cli\u003eUrutan ini bagus karena belajar Rust design tidak bisa hanya dari contoh final yang bersih.\u003c/li\u003e\n\u003cli\u003eLo perlu melihat \"kenapa desain tertentu gagal\" supaya tahu kapan solusi tertentu masuk akal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan scope buku ini jelas: bukan buku lengkap tentang testing, benchmarking, CI/CD, deployment, atau async runtime. Fokusnya adalah design pattern, architectural decision, dan idiomatic Rust.\u003c/p\u003e\n\u003cp\u003eBuku ini ditujukan untuk pembaca yang sudah mengerti dasar Rust, tapi belum tentu sudah paham design pattern. Itu membuatnya cocok sebagai bahan transformasi cara berpikir.\u003c/p\u003e\n\u003cp\u003eBuku ini terbagi dalam tiga gerakan besar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePart 1: Thinking in Rust. Ini fondasi mental. Sebelum belajar pattern, lo dipaksa ngerti dulu kenapa Rust beda.\u003c/li\u003e\n\u003cli\u003ePart 2: Replacing Traditional Design Patterns. Ini bagian transisi. Pattern klasik seperti creational, structural, behavioral dibahas bukan untuk ditiru mentah-mentah, tapi untuk dilihat ulang dari sudut pandang Rust.\u003c/li\u003e\n\u003cli\u003ePart 3: New Patterns for Rust. Ini bagian naik level. Setelah lo tidak lagi melawan Rust, baru muncul pattern yang benar-benar lahir dari ownership, borrowing, traits, enum, pattern matching, dan type system kuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-bukan-buku-pattern-biasa\"\u003eKenapa ini bukan buku pattern biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-bukan-buku-pattern-biasa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue menangkap bahwa buku ini tidak mulai dari \"Factory Pattern\", \"Strategy Pattern\", atau \"Observer Pattern\". Rust bukan bahasa OOP klasik, sehingga pattern yang sama bisa jadi salah kalau mental model-nya salah.\u003c/p\u003e\n\u003cp\u003ePart 1 bekerja sebagai unlearning layer: lo diminta melepas kebiasaan Java/C#/Python OOP. Part 2 adalah translation layer: pattern lama diterjemahkan ke idiom Rust. Part 3 adalah native layer: pattern yang muncul karena Rust punya fitur sendiri.\u003c/p\u003e\n\u003cp\u003eIntuisi paling penting: di banyak bahasa, design pattern muncul karena bahasa itu punya keterbatasan. Tapi Rust punya alat desain yang berbeda: ownership, borrowing, lifetimes, traits, enums, generics, pattern matching, dan compile-time guarantees. Di Rust, problem desain seringkali bisa diselesaikan dengan ownership, borrowing, lifetimes, traits, enums, generics, dan compile-time guarantees. Jadi kalau lo datang ke Rust dengan mindset \"gue mau bikin class hierarchy yang rapi\", lo bakal cepat frustasi.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-paling-nempel-dari-setiap-part\"\u003eApa yang paling nempel dari setiap part\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-paling-nempel-dari-setiap-part\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"part-1-thinking-in-rust\"\u003ePart 1: Thinking in Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-1-thinking-in-rust\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eRust bukan cuma syntax beda. Model desainnya beda.\u003c/li\u003e\n\u003cli\u003eMemory safety, ownership, dan type system bukan sekadar fitur teknis; mereka memengaruhi cara lo membagi tanggung jawab antar komponen.\u003c/li\u003e\n\u003cli\u003eAnti-pattern umum: mendesain untuk object orientation, menggunakan \u003ccode\u003eClone\u003c/code\u003e dan \u003ccode\u003eRc\u003c/code\u003e sebagai jalan pintas, dan melawan borrow checker.\u003c/li\u003e\n\u003cli\u003eBorrow checker lebih tepat dilihat sebagai sistem feedback desain: kalau dia nolak, sering kali itu karena aliran kepemilikan data lo belum jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"part-2-replacing-traditional-design-patterns\"\u003ePart 2: Replacing Traditional Design Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-2-replacing-traditional-design-patterns\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCreational Patterns: buku ini kemungkinan membahas cara membuat object/data tanpa mengikuti kreasi OOP secara literal. Builder masih relevan untuk struct dengan banyak field optional, tetapi Singleton harus dipikirkan ulang karena global mutable state bukan natural di Rust. Rust mendorong desain yang eksplisit soal ownership dan initialization.\u003c/li\u003e\n\u003cli\u003eStructural Patterns: bukan lagi \"class A extends class B\". Di Rust, struktur komponen muncul lewat traits, generics, newtype pattern, composition, enum dispatch, atau trait objects. Ini lebih ke \"type ini mengimplementasikan behavior tertentu\" atau \"struct ini membungkus dependency tertentu\".\u003c/li\u003e\n\u003cli\u003eBehavioral Patterns: karena luas, bab ini mungkin dibagi dua. Rust sering memindahkan behavioral pattern ke function, closure, enum, trait, iterator, channel, atau state yang di-encode di tipe. Kemungkinan ada bab untuk \"Taking Action\" dan bab lain untuk \"Keeping Track\".\u003c/li\u003e\n\u003cli\u003eIntinya: Part 2 bukan ngajarin pattern klasik masih sama dengan syntax Rust. Value-nya ada di proses translasi: pattern klasik dipreteli, problem aslinya dicari, lalu solusi Rust-native dipilih.\u003c/li\u003e\n\u003cli\u003eTrade-off penting: trait object lebih fleksibel runtime, generics lebih kuat compile-time tetapi bisa bikin binary lebih besar dan API lebih kompleks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"part-3-new-patterns-for-rust\"\u003ePart 3: New Patterns for Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-3-new-patterns-for-rust\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eBab ini fokus ke pattern yang lahir dari Rust sendiri: arsitektur, type-driven design, functional idiom, dan core feature Rust.\u003c/li\u003e\n\u003cli\u003eChapter 9: Architectural Patterns. Ini kemungkinan membahas desain sistem yang lebih besar, terutama boundary antar module, ownership antar layer, error handling, concurrency, dan dependency flow. Rust sering dipakai untuk backend service, CLI, embedded, infra tools, blockchain, runtime, dan sistem high-performance, jadi arsitektur di Rust harus memperjelas boundary lebih dari sekadar memilih pattern.\u003c/li\u003e\n\u003cli\u003eChapter 10: Patterns That Leverage the Type System. Rust type system bisa dipakai untuk mengunci invariant dengan lebih kuat. State valid vs invalid bisa dibedakan oleh type, bukan dicek manual pakai boolean. Ini adalah type-driven design: jangan biarkan object masuk state ilegal sejak awal.\u003c/li\u003e\n\u003cli\u003eChapter 11: Patterns from Functional Programming. Ini kemungkinan membahas function, closure, iterator, combinator, \u003ccode\u003eOption\u003c/code\u003e, \u003ccode\u003eResult\u003c/code\u003e, immutability, dan composition. Rust bukan bahasa functional murni, tapi banyak idiomnya dekat dengan functional programming.\u003c/li\u003e\n\u003cli\u003eChapter 12: Patterns Emerging from Rust’s Core Features. Pattern yang muncul dari fitur inti Rust seperti ownership, borrowing, lifetimes, RAII, \u003ccode\u003eDrop\u003c/code\u003e, smart pointers, pattern matching, mungkin typestate, dan zero-cost abstractions.\u003c/li\u003e\n\u003cli\u003eChapter 13: Leaning into Rust. Ini penutup konseptual: jangan melawan Rust, tapi gunakan constraint Rust sebagai alat desain.\u003c/li\u003e\n\u003cli\u003eLogika Part 3: setelah lo paham kenapa Rust beda dan bisa menerjemahkan pola lama, barulah lo siap memikirkan Rust sebagai bahasa yang punya pattern sendiri.\u003c/li\u003e\n\u003cli\u003eSemakin Rust-native desain lo, semakin sedikit lo merasa borrow checker sebagai musuh.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway-inti\"\u003eTakeaway inti\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway-inti\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuku ini ngajarin bahwa design pattern di Rust bukan soal menghafal pola lama, tapi soal membentuk desain yang selaras dengan ownership, type system, dan compile-time guarantees.\u003c/p\u003e\n\u003cp\u003eKalau kita ambil logic path buku ini, urutannya kira-kira begini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eRust berbeda\n↓\u003c/li\u003e\n\u003cli\u003eKarena berbeda, kebiasaan OOP bisa jadi anti-pattern\n↓\u003c/li\u003e\n\u003cli\u003eJalan pintas seperti \u003ccode\u003eClone\u003c/code\u003e/\u003ccode\u003eRc\u003c/code\u003e sering menutupi desain ownership yang kabur\n↓\u003c/li\u003e\n\u003cli\u003eBorrow checker harus dibaca sebagai feedback desain\n↓\u003c/li\u003e\n\u003cli\u003eSetelah mental model benar, pattern klasik bisa diterjemahkan ulang\n↓\u003c/li\u003e\n\u003cli\u003ePattern creational/structural/behavioral punya bentuk Rust-native\n↓\u003c/li\u003e\n\u003cli\u003eSetelah itu baru masuk ke pattern yang lahir dari Rust sendiri\n↓\u003c/li\u003e\n\u003cli\u003eType system, FP style, ownership, dan core features menjadi fondasi desain\n↓\u003c/li\u003e\n\u003cli\u003eAkhirnya lo “lean into Rust”, bukan memaksa Rust jadi bahasa lain\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau lo baca buku ini, cara bacanya jangan seperti katalog pattern. Jangan masuk dengan pertanyaan: “Factory pattern di Rust gimana?” Lebih bagus pakai pertanyaan seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“Problem desain apa yang pattern ini coba selesaikan?”\u003c/li\u003e\n\u003cli\u003e“Di Rust, constraint apa yang bikin solusi lamanya kurang cocok?”\u003c/li\u003e\n\u003cli\u003e“Fitur Rust mana yang bisa menyelesaikan problem itu lebih natural?”\u003c/li\u003e\n\u003cli\u003e“Apakah solusi ini memperjelas ownership, atau malah menyamarkannya?”\u003c/li\u003e\n\u003cli\u003e“Apakah invariants bisa dipindahkan dari runtime check ke type system?”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"pertanyaan-baca-yang-bagus\"\u003ePertanyaan baca yang bagus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-baca-yang-bagus\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSaat baca buku ini, lebih bagus pakai pertanyaan seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem desain apa yang pattern ini coba selesaikan?\u003c/li\u003e\n\u003cli\u003eDi Rust, constraint apa yang bikin solusi lamanya kurang cocok?\u003c/li\u003e\n\u003cli\u003eFitur Rust mana yang bisa menyelesaikan problem itu lebih natural?\u003c/li\u003e\n\u003cli\u003eApakah solusi ini memperjelas ownership, atau malah menyamarkannya?\u003c/li\u003e\n\u003cli\u003eApakah invariants bisa dipindahkan dari runtime check ke type system?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"roadmap-belajar\"\u003eRoadmap belajar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#roadmap-belajar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBaca Part 1 pelan-pelan. Ini paling penting karena akan menentukan cara baca bab berikutnya.\u003c/li\u003e\n\u003cli\u003eCari atomic idea dari setiap chapter, misalnya “ownership as design boundary”, “borrow checker as design feedback”, “clone as hidden cost”, dan “Rc as shared ownership trade-off”.\u003c/li\u003e\n\u003cli\u003eSaat masuk Part 2, jangan cuma rangkum pattern. Buat mapping:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTraditional Pattern → Problem yang diselesaikan → Rust-native alternative → Trade-off\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFactory\n→ problem: membuat object tanpa expose detail konstruksi\n→ Rust alternative: associated function, builder, trait-based constructor\n→ trade-off: simple constructor vs flexible builder\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eStrategy\n→ problem: mengganti behavior\n→ Rust alternative: trait, generic parameter, closure, enum dispatch\n→ trade-off: runtime flexibility vs compile-time optimization\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eState\n→ problem: object berubah behavior berdasarkan state\n→ Rust alternative: enum state machine atau typestate pattern\n→ trade-off: mudah dibaca vs lebih strict secara type-level\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"4\"\u003e\n\u003cli\u003eDi Part 3, ambil ide yang bisa dipakai ke proyek nyata. Contoh: untuk produk SaaS atau agent architecture, refleksikan pola yang relevan untuk agent runtime, scheduler, parser, atau CLI.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"dari-oop-ke-rust-native\"\u003eDari OOP ke Rust Native\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dari-oop-ke-rust-native\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuku ini sebenarnya membantu perjalanan dari \"Thinking like an OOP developer writing Rust\" menuju \"Thinking like a Rust developer designing software\". Yang pertama biasanya menghasilkan kode yang berhasil compile setelah dilawan. Yang kedua menghasilkan kode yang desainnya memang cocok dengan constraint Rust dari awal.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003erust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edesign-patterns (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"
