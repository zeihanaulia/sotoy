ath--proof--loop","line":82,"column":0,"depth":2},"kriteria-pain-point-yang-layak-dikejar":{"type":"header","text":"Kriteria Pain Point yang Layak Dikejar","value":"kriteria-pain-point-yang-layak-dikejar","line":105,"column":0,"depth":2},"dari-feature-backlog-ke-service-backlog":{"type":"header","text":"Dari Feature Backlog ke Service Backlog","value":"dari-feature-backlog-ke-service-backlog","line":121,"column":0,"depth":2},"contoh-service-flow-yang-smooth":{"type":"header","text":"Contoh Service Flow yang Smooth","value":"contoh-service-flow-yang-smooth","line":144,"column":0,"depth":2},"kenapa-lo-susah-menemukan-pain-point":{"type":"header","text":"Kenapa Lo Susah Menemukan Pain Point","value":"kenapa-lo-susah-menemukan-pain-point","line":167,"column":0,"depth":2},"latihan-pain-point-template":{"type":"header","text":"Latihan: Pain Point Template","value":"latihan-pain-point-template","line":181,"column":0,"depth":2},"tiga-ritual-sebagai-tulang-belakang":{"type":"header","text":"Tiga Ritual sebagai Tulang Belakang","value":"tiga-ritual-sebagai-tulang-belakang","line":196,"column":0,"depth":2},"insight-kunci":{"type":"header","text":"Insight Kunci","value":"insight-kunci","line":208,"column":0,"depth":2},"one-prompt-test":{"type":"header","text":"One-Prompt Test","value":"one-prompt-test","line":224,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":234,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat Juga","value":"lihat-juga","line":239,"column":0,"depth":2}},"children":[],"parent":"5ydz1g1et6md22h3x69kuv8","data":{}},"body":"\u003ch1 id=\"service-sense-dan-journey-thinking-dari-fitur-tempel-ke-pengalaman-yang-mengalir\"\u003eService Sense dan Journey Thinking: Dari Fitur Tempel ke Pengalaman yang Mengalir\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#service-sense-dan-journey-thinking-dari-fitur-tempel-ke-pengalaman-yang-mengalir\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"masalah-utama\"\u003eMasalah Utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#masalah-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSelama lo mikirnya \"fitur apa aja yang harus ada\", otak akan cenderung bikin \u003cstrong\u003edaftar komponen\u003c/strong\u003e. Hasilnya produk terasa kayak tempelan: ada tombol, ada form, ada modul, ada dashboard, tapi pengalaman pakainya gak mengalir.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eInventory thinking\u003c/strong\u003e bertanya: \"fitur apa yang belum ada?\"\n\u003cstrong\u003eJourney thinking\u003c/strong\u003e bertanya: \"orang ini sedang mencoba menyelesaikan apa, dalam kondisi apa, dan hambatannya di mana?\"\u003c/p\u003e\n\u003cp\u003eService sense lahir dari journey thinking, bukan dari feature checklist. Makanya produk yang fiturnya sedikit bisa terasa smooth kalau alurnya mengikuti niat user. Sebaliknya, produk yang fiturnya banyak bisa terasa berat kalau tiap fitur berdiri sendiri tanpa cerita penggunaan.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"5-lapis-pertanyaan-untuk-menumbuhkan-service-sense\"\u003e5 Lapis Pertanyaan untuk Menumbuhkan Service Sense\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-lapis-pertanyaan-untuk-menumbuhkan-service-sense\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni cara paksa otak pindah dari \"fitur\" ke \"pengalaman\".\u003c/p\u003e\n\u003ch3 id=\"lapis-1--situasi-user\"\u003eLapis 1 — Situasi User\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapis-1--situasi-user\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJangan mulai dari \"user butuh dashboard.\" Mulai dari: \u003cstrong\u003e\"dia lagi di kondisi apa?\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eContoh produk SaaS: PO habis meeting dengan stakeholder, catatan masih berantakan, deadline PRD besok, dev team butuh task yang jelas, dan dia takut requirement salah nangkep.\u003c/p\u003e\n\u003cp\u003eDari sini kelihatan bahwa pain-nya bukan \"belum ada generator PRD.\" Pain-nya adalah \u003cstrong\u003eketidakpastian berubah jadi dokumen yang bisa dipercaya\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"lapis-2--momen-pertama-value\"\u003eLapis 2 — Momen Pertama Value\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapis-2--momen-pertama-value\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTanya: \u003cstrong\u003e\"dalam 5–10 menit pertama, apa yang harus user rasakan supaya dia bilang: oh, ini berguna?\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBisa jadi momen value pertama bukan full PRD sempurna, tapi: \"catatan meeting gue dirapikan jadi struktur problem, scope, user story, open questions.\" Itu sudah bikin user merasa dibantu.\u003c/p\u003e\n\u003ch3 id=\"lapis-3--friction-map\"\u003eLapis 3 — Friction Map\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapis-3--friction-map\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTanya: \u003cstrong\u003e\"bagian mana yang bikin user berhenti?\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eContoh titik friction:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLogin / setup workspace\u003c/li\u003e\n\u003cli\u003eUpload file / bingung pilih template\u003c/li\u003e\n\u003cli\u003eOutput terlalu panjang atau tidak relevan\u003c/li\u003e\n\u003cli\u003eHarus copy-paste manual\u003c/li\u003e\n\u003cli\u003eTidak tahu status proses\u003c/li\u003e\n\u003cli\u003eTidak tahu output bisa dipercaya atau enggak\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eService sense tumbuh waktu lo mulai sensitif terhadap titik-titik kecil ini.\u003c/p\u003e\n\u003ch3 id=\"lapis-4--trust-loop\"\u003eLapis 4 — Trust Loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapis-4--trust-loop\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTanya: \u003cstrong\u003e\"apa yang bikin user percaya hasilnya?\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eUntuk AI product ini krusial. Output bagus belum cukup. User perlu tahu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esumbernya dari mana\u003c/li\u003e\n\u003cli\u003easumsi apa yang dipakai\u003c/li\u003e\n\u003cli\u003ebagian mana yang masih perlu review\u003c/li\u003e\n\u003cli\u003eapa confidence-nya\u003c/li\u003e\n\u003cli\u003ebisa edit dengan mudah atau enggak\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"lapis-5--return-path\"\u003eLapis 5 — Return Path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapis-5--return-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTanya: \u003cstrong\u003e\"kenapa user balik lagi besok?\"\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBanyak MVP gagal karena cuma mikir first use. Service yang baik mikir ritual: setiap sprint planning, setiap grooming, setiap meeting, setiap PR review, setiap incident — user punya alasan balik.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"framework-moment--promise--path--proof--loop\"\u003eFramework: Moment → Promise → Path → Proof → Loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#framework-moment--promise--path--proof--loop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePakai ini setiap kali mau desain service dari awal.\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eKomponen\u003c/th\u003e\u003cth\u003ePertanyaan\u003c/th\u003e\u003cth\u003eContoh (produk SaaS)\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eMoment\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eUser sedang di momen apa?\u003c/td\u003e\u003ctd\u003ePO baru selesai meeting, catatan berantakan\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003ePromise\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eService lo menjanjikan perubahan apa?\u003c/td\u003e\u003ctd\u003eDalam 5 menit, catatan mentah jadi draft requirement yang bisa direview\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003ePath\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eLangkah minimal dari masuk sampai value?\u003c/td\u003e\u003ctd\u003ePaste note → pilih artifact → generate → review missing info → export\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eProof\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eApa bukti bahwa output bisa dipercaya?\u003c/td\u003e\u003ctd\u003eTrace ke source note, highlight assumption, confidence, open questions\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eLoop\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eApa alasan user balik?\u003c/td\u003e\u003ctd\u003eSetiap meeting baru, setiap sprint planning, setiap change request\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eKalau lo desain dari framework ini, fitur akan muncul natural:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePaste note muncul karena \u003cstrong\u003eMoment\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eGenerate draft muncul karena \u003cstrong\u003ePromise\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eReview missing info muncul karena \u003cstrong\u003eProof\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eHistory dan template muncul karena \u003cstrong\u003eLoop\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eExport muncul karena \u003cstrong\u003ePath\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFitur bukan ditempel. Fitur lahir dari kebutuhan perjalanan.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"kriteria-pain-point-yang-layak-dikejar\"\u003eKriteria Pain Point yang Layak Dikejar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kriteria-pain-point-yang-layak-dikejar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePain point yang bagus biasanya punya minimal salah satu dari ini:\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eKriteria\u003c/th\u003e\u003cth\u003ePertanyaan\u003c/th\u003e\u003cth\u003eContoh\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFrequent\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eTerjadi seberapa sering?\u003c/td\u003e\u003ctd\u003ePO setiap minggu harus merapikan requirement meeting\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eExpensive\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eKalau salah, biayanya mahal?\u003c/td\u003e\u003ctd\u003eRequirement salah bikin sprint kebuang\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eUrgent\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eOrang butuh selesai sekarang?\u003c/td\u003e\u003ctd\u003eProposal harus dikirim besok\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eAnnoying\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eKecil tapi nyebelin terus-menerus?\u003c/td\u003e\u003ctd\u003eCopy-paste dari meeting notes ke Jira task\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eStatus-related\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eBikin orang terlihat bodoh/lambat/tidak siap?\u003c/td\u003e\u003ctd\u003ePO ditanya dev \"acceptance criteria-nya mana?\" dan belum siap\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eKalau pain tidak punya salah satu dari ini, biasanya produknya susah \"ketarik\" pasar.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"dari-feature-backlog-ke-service-backlog\"\u003eDari Feature Backlog ke Service Backlog\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dari-feature-backlog-ke-service-backlog\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eFeature-only thinking\u003c/strong\u003e menghasilkan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003egenerate PRD, generate FSD, generate TSD,\nJira integration, GitLab integration, Confluence export\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eService thinking\u003c/strong\u003e menghasilkan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edari meeting note mentah\n→ jadi draft PRD pertama dalam 5 menit\n→ highlight missing info\n→ minta user jawab 3 pertanyaan\n→ generate task Jira\n→ simpan traceability\n→ user bisa lihat kenapa task itu muncul\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYang kedua punya aliran. Ada cerita. Ada progress. Ada trust.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"contoh-service-flow-yang-smooth\"\u003eContoh Service Flow yang Smooth\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-service-flow-yang-smooth\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUser masuk bukan disambut dashboard kosong, tapi ditanya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Lo mau mulai dari meeting notes, existing PRD, Jira issue, atau repo?\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau pilih meeting notes → user paste text.\u003c/p\u003e\n\u003cp\u003eSistem tidak langsung \"generate semua dokumen\". Dia lebih dulu membuat \u003cstrong\u003eRequirement Brief\u003c/strong\u003e: problem, actors, scope, ambiguity, suggested next questions.\u003c/p\u003e\n\u003cp\u003eLalu sistem menawarkan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Gue butuh 3 jawaban untuk bikin PRD ini lebih solid.\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSetelah user jawab → generate PRD. Setelah PRD jadi, sistem tidak berhenti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Breakdown ke user stories?\"\u003c/li\u003e\n\u003cli\u003e\"Push ke Jira?\"\u003c/li\u003e\n\u003cli\u003e\"Bikin technical implications?\"\u003c/li\u003e\n\u003cli\u003e\"Cek missing non-functional requirements?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eProduct-only\u003c/strong\u003e: \u003cem\u003e\"Ini fitur generate PRD.\"\u003c/em\u003e\n\u003cstrong\u003eService\u003c/strong\u003e: \u003cem\u003e\"Gue bantu lo dari catatan mentah sampai siap masuk backlog.\"\u003c/em\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"kenapa-lo-susah-menemukan-pain-point\"\u003eKenapa Lo Susah Menemukan Pain Point\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-lo-susah-menemukan-pain-point\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKemungkinan penyebabnya:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBuilder brain dominan\u003c/strong\u003e — cepat bertanya \"bisa dibuat gak?\" padahal harus tanya \"siapa yang cukup peduli sampai mau berubah kebiasaan?\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDomain terlalu luas\u003c/strong\u003e — \"SDLC\" terlalu besar. \"Software team butuh produktif\" terlalu besar. Tapi \"PO kesulitan mengubah meeting note jadi Jira-ready user stories\" cukup tajam.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKurang mengamati workaround\u003c/strong\u003e — pain point sering muncul bukan dari orang bilang \"gue butuh produk X\", tapi dari orang bikin workaround jelek: spreadsheet aneh, copy-paste manual, template Notion, screenshot bolak-balik, reminder di chat, meeting tambahan.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCari pain yang terlalu besar\u003c/strong\u003e — produk cepat sering mulai dari pain kecil tapi sering. Tiny recurring pain bisa jadi bisnis kalau cukup banyak orang mengalaminya dan solusinya smooth.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"latihan-pain-point-template\"\u003eLatihan: Pain Point Template\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#latihan-pain-point-template\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFormat kalimat untuk mendeskripsikan pain point:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Ketika \u003cstrong\u003e[persona]\u003c/strong\u003e sedang \u003cstrong\u003e[situasi]\u003c/strong\u003e, dia harus \u003cstrong\u003e[aksi menyebalkan]\u003c/strong\u003e supaya bisa \u003cstrong\u003e[tujuan]\u003c/strong\u003e. Masalahnya \u003cstrong\u003e[biaya/friction/risiko]\u003c/strong\u003e.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Ketika PO selesai meeting requirement, dia harus membaca ulang chat dan notes supaya bisa bikin Jira ticket. Masalahnya banyak ambiguity tidak terlihat sampai dev mulai tanya di sprint planning.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDari satu kalimat ini saja, lo bisa bikin 5 ide fitur — dan karena dimulai dari momen, fiturnya lebih kohesif.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLatihan seminggu\u003c/strong\u003e: catat 10 momen kerja yang bikin orang melakukan copy-paste, reformat, menunggu approval, mencari ulang info, atau bertanya hal yang sama berulang kali. Jangan tulis solusi. Tulis momen sakitnya.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tiga-ritual-sebagai-tulang-belakang\"\u003eTiga Ritual sebagai Tulang Belakang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tiga-ritual-sebagai-tulang-belakang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk produk SaaS, sense service bisa mulai dari 3 ritual utama, bukan dari 30 fitur:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSetelah requirement meeting\u003c/strong\u003e — meeting note → structured requirement\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSebelum sprint planning\u003c/strong\u003e — requirement → task breakdown + review\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSaat dev mulai implementasi\u003c/strong\u003e — butuh konteks + acceptance criteria jelas\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau tiga ritual ini smooth, produk terasa punya tulang belakang. Setelah itu baru tambah fitur.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"insight-kunci\"\u003eInsight Kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eService sense itu sering muncul dari satu pertanyaan sederhana: \u003cstrong\u003e\"habis ini user ngapain?\"\u003c/strong\u003e\nFitur tempelan biasanya gagal menjawab pertanyaan itu.\u003c/p\u003e\n\u003cp\u003eSmoothness bukan berarti UI cantik. Smoothness berarti \u003cstrong\u003eniat user mengalir tanpa harus mikir terlalu keras\u003c/strong\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eMaker cepat biasanya bukan karena mereka mengerjakan lebih banyak fitur.\nMereka cepat karena mereka \u003cstrong\u003ememotong ruang masalah\u003c/strong\u003e dengan agresif: satu pain kecil, satu persona jelas, satu output bernilai, satu distribusi awal.\u003c/p\u003e\n\u003cp\u003eScope kecil harus dipilih dari pain yang tajam. Kalau scope kecil tapi pain-nya lemah → toy. Kalau pain tajam tapi scope terlalu besar → tidak pernah launch.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAgent/LLM bukan produknya. Produk sebenarnya adalah \u003cstrong\u003eworkflow yang dibantu AI sampai selesai\u003c/strong\u003e.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"one-prompt-test\"\u003eOne-Prompt Test\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#one-prompt-test\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk setiap ide produk, tanya satu pertanyaan ini dulu:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Dalam 10 menit pertama, user dari kondisi buruk apa berubah ke kondisi lebih baik apa?\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau tidak bisa dijawab dengan konkret, idenya belum jadi service.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePieter Levels, \u003ca href=\"https://levels.io/tag/12-startups-in-12-months/\"\u003e12 Startups in 12 Months\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eWIRED, \u003ca href=\"https://www.wired.com/2014/08/12-startups-in-12-months\"\u003eThis Guy Is Launching 12 Startups in 12 Months\u003c/a\u003e (2014)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat Juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.from-feature-to-service-design\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003c/a\u003e — learning path buku untuk keluar dari build trap\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — konteks penerapan di produk SaaS\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct-thinking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eservice-design (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_b
