ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#anders-hejlsberg-interview-transcript-notes\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"sumber\"\u003eSumber\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sumber\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVideo: \u003ca href=\"https://www.youtube.com/watch?v=K-Xv8D8NjTk\"\u003ehttps://www.youtube.com/watch?v=K-Xv8D8NjTk\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eCatatan ini berdasarkan transcript yang tersedia hingga sekitar menit 54:03. Setelah itu hanya ada timestamp dan ringkasan di halaman.\u003c/p\u003e\n\u003ch2 id=\"pertanyaan-eksplisit-gergely-dan-jawaban-anders\"\u003ePertanyaan eksplisit Gergely dan jawaban Anders\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-eksplisit-gergely-dan-jawaban-anders\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-how-did-you-get-into-programming--menit-156248\"\u003e1. “How did you get into programming?” — menit 1:56–2:48\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-how-did-you-get-into-programming--menit-156248\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders mulai programming di Copenhagen akhir 1970-an lewat akses ke komputer HP 2100 dengan 32K ferrite core memory, paper tape reader, dan hard drive 1MB. Dari awal dia tertarik karena bisa \"membuat mesin melakukan sesuatu\".\u003c/p\u003e\n\u003cp\u003eAtomic idea: pengalaman awal Anders adalah transparansi mesin. Dia bisa melihat sampai dasar hardware. Kariernya nanti justru membangun layer agar orang lain tidak perlu melihat hardware sedalam itu.\u003c/p\u003e\n\u003ch3 id=\"2-as-a-kid-what-did-you-start-to-program-on-it--menit-313420\"\u003e2. “As a kid, what did you start to program on it?” — menit 3:13–4:20\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-as-a-kid-what-did-you-start-to-program-on-it--menit-313420\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders menjelaskan bahwa mesin itu punya Fortran, interpreter BASIC yang lambat, dan Algol versi HP. Mereka membuat game seperti lunar lander. Dia juga belajar bahwa bahasa dipengaruhi oleh constraint mesin; Algol pada mesin itu tidak mendukung recursion karena cara call instruction menyimpan return address.\u003c/p\u003e\n\u003cp\u003eAtomic idea: programming language selalu dibentuk oleh constraint mesin dan tooling di bawahnya.\u003c/p\u003e\n\u003ch3 id=\"3-how-did-you-go-from-building-games-to-building-your-first-compiler--menit-443650\"\u003e3. “How did you go from building games to building your first compiler?” — menit 4:43–6:50\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-how-did-you-go-from-building-games-to-building-your-first-compiler--menit-443650\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTransisi Anders dari game ke compiler terjadi di Danish Technical University sekitar 1979. Dia beli kit komputer Z80 NASCOM, belajar assembly, dan ingin bahasa serius seperti Algol atau Pascal karena ROM BASIC lambat. Dia menulis compiler kecil yang muat di 12K ROM untuk subset Pascal.\u003c/p\u003e\n\u003cp\u003eAtomic idea: Turbo Pascal berakar pada friksi praktis terhadap BASIC yang lambat dan terbatas, bukan ambisi akademik semata.\u003c/p\u003e\n\u003ch3 id=\"4-at-borland-you-created-turbo-pascal-the-language-and-ide-right--menit-650745\"\u003e4. “At Borland you created Turbo Pascal, the language and IDE, right?” — menit 6:50–7:45\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-at-borland-you-created-turbo-pascal-the-language-and-ide-right--menit-650745\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders menegaskan bahwa Turbo Pascal bukan tiba-tiba muncul di Borland. Sebelum itu dia sudah membuat implementasi Pascal penuh untuk CP/M-80. Turbo Pascal 1983 adalah evolusi dari compiler kecil tersebut, dikemas beserta distribusi komersial yang tepat.\u003c/p\u003e\n\u003cp\u003eAtomic idea: produk besar sering lahir dari tool kecil yang sudah dipakai dan dipoles.\u003c/p\u003e\n\u003ch3 id=\"5-why-was-it-called-turbo-pascal--menit-745808\"\u003e5. “Why was it called Turbo Pascal?” — menit 7:45–8:08\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-why-was-it-called-turbo-pascal--menit-745808\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eNama \"Turbo\" menekankan kecepatan. Di era itu \"Turbo\" berarti cepat. Turbo Pascal memang cepat dan interaktif.\u003c/p\u003e\n\u003cp\u003eAtomic idea: positioning developer tool harus menyentuh pain point utama dengan langsung.\u003c/p\u003e\n\u003ch3 id=\"6-was-turbo-pascal-popular-because-of-compiler-or-also-because-of-ide--menit-808857\"\u003e6. “Was Turbo Pascal popular because of compiler, or also because of IDE?” — menit 8:08–8:57\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-was-turbo-pascal-popular-because-of-compiler-or-also-because-of-ide--menit-808857\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders: dari awal ini bukan cuma compiler. Ini adalah experience. Developer melakukan edit, run, debug, dan memakai runtime library. Semua komponen harus terhubung.\u003c/p\u003e\n\u003cp\u003eAtomic idea: produktivitas developer datang dari memperpendek feedback loop.\u003c/p\u003e\n\u003ch3 id=\"7-saat-bikin-compiler-apakah-sudah-mikir-ide-features-seperti-editingdebugging--menit-9041014\"\u003e7. “Saat bikin compiler, apakah sudah mikir IDE features seperti editing/debugging?” — menit 9:04–10:14\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-saat-bikin-compiler-apakah-sudah-mikir-ide-features-seperti-editingdebugging--menit-9041014\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders menjawab bahwa compiler dan IDE dipikirkan bersamaan. Versi awal Turbo Pascal menggunakan trik runtime error dengan mencetak program counter dan compiler punya mode khusus untuk menebak source line error.\u003c/p\u003e\n\u003cp\u003eAtomic idea: constraint membuat tooling kreatif. Compiler dapat dipakai ulang sebagai bagian debugging experience.\u003c/p\u003e\n\u003ch3 id=\"8-why-do-you-think-turbo-pascal-was-so-popular--menit-10141123\"\u003e8. “Why do you think Turbo Pascal was so popular?” — menit 10:14–11:23\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-why-do-you-think-turbo-pascal-was-so-popular--menit-10141123\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena kombinasi: lebih cepat, lebih kecil, lebih interaktif, dan lebih murah. Harga $49.95 versus compiler lain sekitar $500. Pengalaman dan economics turun bersama.\u003c/p\u003e\n\u003cp\u003eAtomic idea: developer tool menang ketika friction ekonomi dan friction teknis turun bersamaan.\u003c/p\u003e\n\u003ch3 id=\"9-how-did-ideas-evolve-from-turbo-pascal-to-delphi--menit-11231356\"\u003e9. “How did ideas evolve from Turbo Pascal to Delphi?” — menit 11:23–13:56\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-how-did-ideas-evolve-from-turbo-pascal-to-delphi--menit-11231356\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePerubahan besar adalah GUI dan enterprise client-server. Delphi mengambil konsep Turbo Pascal dan mengadaptasinya untuk Windows rapid application development: interaktif visual, compiler, classes, object orientation, dan target enterprise apps.\u003c/p\u003e\n\u003cp\u003eAtomic idea: Delphi adalah Turbo Pascal yang diadaptasi untuk era GUI dan enterprise.\u003c/p\u003e\n\u003ch3 id=\"10-you-joined-microsoft-in-1996-what-was-the-programming-environment-like--menit-13561603\"\u003e10. “You joined Microsoft in 1996… what was the programming environment like?” — menit 13:56–16:03\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-you-joined-microsoft-in-1996-what-was-the-programming-environment-like--menit-13561603\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSaat Anders masuk Microsoft, browser, JavaScript, dan Java sedang naik. Java tampak seperti masa depan universal, JavaScript masih dipandang scripting kecil di browser.\u003c/p\u003e\n\u003cp\u003eAtomic idea: pada pertengahan 1990-an, platform reach adalah faktor kunci, bukan desain bahasa semata.\u003c/p\u003e\n\u003ch3 id=\"11-how-did-j-development-go-and-how-did-it-lead-to-doing-something-else--menit-16031847\"\u003e11. “How did J++ development go, and how did it lead to doing something else?” — menit 16:03–18:47\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-how-did-j-development-go-and-how-did-it-lead-to-doing-something-else--menit-16031847\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJ++ berjalan, tetapi lawsuit Sun vs Microsoft membuat Microsoft tidak bisa bertaruh pada teknologi milik kompetitor. Dari konvergensi antara Visual Basic dan C++ muncul kebutuhan akan bahasa sendiri: C#.\u003c/p\u003e\n\u003cp\u003eAtomic idea: bahasa bisa lahir dari tekanan legal dan platform strategy, bukan hanya keputusan teknis.\u003c/p\u003e\n\u003ch3 id=\"12-which-came-first-net-or-c--menit-17551847\"\u003e12. “Which came first: .NET or C#?” — menit 17:55–18:47\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-which-came-first-net-or-c--menit-17551847\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders: keduanya co-design. Mereka butuh runtime language-independent dan bahasa baru yang menarik bagi user VB dan C++.\u003c/p\u003e\n\u003cp\u003eAtomic idea: C# dan .NET dirancang sebagai satu paket platform.\u003c/p\u003e\n\u003ch3 id=\"13-what-were-your-design-goals-for-c--menit-18472022\"\u003e13. “What were your design goals for C#?” — menit 18:47–20:22\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-what-were-your-design-goals-for-c--menit-18472022\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTujuannya adalah power C++ plus ease of use Visual Basic. Managed code, garbage collection, exception handling, unified object model, reflection, properties, events sebagai first-class, dan standar terbuka.\u003c/p\u003e\n\u003cp\u003eAtomic idea: C# mencari titik tengah antara produktivitas VB, power C++, dan managed runtime modern.\u003c/p\u003e\n\u003ch3 id=\"14-what-did-it-take-to-build-a-language-like-c--menit-20382345\"\u003e14. “What did it take to build a language like C#?” — menit 20:38–23:45\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-what-did-it-take-to-build-a-language-like-c--menit-20382345\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTim C# kecil sekitar 6–7 orang berpengalaman. Mereka meeting tiga kali seminggu, melakukan kritik tajam atas ide, dan menulis language spec paralel dengan design. Ide harus tahan serangan.\u003c/p\u003e\n\u003cp\u003eAtomic idea: language design memerlukan small expert group dengan shared context dan adversarial review.\u003c/p\u003e\n\u003ch3 id=\"15-roslyn-meaning-the-compiler-is-in-c-right--menit-23382446\"\u003e15. “Roslyn meaning the compiler is in C#, right?” — menit 23:38–24:46\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-roslyn-meaning-the-compiler-is-in-c-right--menit-23382446\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRoslyn adalah self-hosted C# compiler. Lebih pentingnya, ia menyatukan batch compiler dan interactive language service untuk IDE.\u003c/p\u003e\n\u003cp\u003eAtomic idea: compiler modern adalah service interaktif, bukan hanya batch compiler.\u003c/p\u003e\n\u003ch3 id=\"16-how-did-you-get-feedback-when-building-a-language--menit-27152817\"\u003e16. “How did you get feedback when building a language?” — menit 27:15–28:17\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-how-did-you-get-feedback-when-building-a-language--menit-27152817\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders menjawab bahwa mereka menggunakan dogfooding internal dan beta copies untuk user nyata. Feedback nyata dari internal client sangat krusial.\u003c/p\u003e\n\u003cp\u003eAtomic idea: bahasa perlu dogfooding nyata, bukan hanya whiteboard design.\u003c/p\u003e\n\u003ch3 id=\"17-asyncawait-what-did-you-get-right-and-why-was-it-copied--menit-28173244\"\u003e17. “Async/await: what did you get right, and why was it copied?” — menit 28:17–32:44\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-asyncawait-what-did-you-get-right-and-why-was-it-copied--menit-28173244\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAsync/await menang karena compiler bisa menulis state machine yang manusia tidak mau tulis sendiri. Ini memindahkan mekanisme kompleks dari manusia ke compiler.\u003c/p\u003e\n\u003cp\u003eAtomic idea: async/await memindahkan kompleksitas implementasi dari manusia ke tool.\u003c/p\u003e\n\u003ch3 id=\"18-how-did-javascript-explode-in-popularity--menit-32443411\"\u003e18. “How did JavaScript explode in popularity?” — menit 32:44–34:11\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#18-how-did-javascript-explode-in-popularity--menit-32443411\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJavaScript menang karena runtime distribution universal: browser di mana-mana, HTML5, V8, dan device mobile.\u003c/p\u003e\n\u003cp\u003eAtomic idea: platform reach kadang lebih penting daripada bahasa purity.\u003c/p\u003e\n\u003ch3 id=\"19-outlookcom-asked-for-scriptsharp-how-did-that-become-typescript--menit-34113657\"\u003e19. “Outlook.com asked for ScriptSharp; how did that become TypeScript?” — menit 34:11–36:57\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#19-outlookcom-asked-for-scriptsharp-how-did-that-become-typescript--menit-34113657\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders menolak membuat \"C# to JS\". TypeScript lahir untuk memperbaiki JavaScript dari dalam, bukan menggantinya.\u003c/p\u003e\n\u003cp\u003eAtomic idea: TypeScript menang karena kompatibel secara budaya dengan ekosistem JavaScript.\u003c/p\u003e\n\u003ch3 id=\"20-why-open-source-typescript--menit-36573924\"\u003e20. “Why open source TypeScript?” — menit 36:57–39:24\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#20-why-open-source-typescript--menit-36573924\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTypeScript perlu open source dan open development agar ekosistem JS mau mengadopsinya. Pindah ke GitHub pada 2014 menjadi momen penting.\u003c/p\u003e\n\u003cp\u003eAtomic idea: open source tanpa open development belum cukup.\u003c/p\u003e\n\u003ch3 id=\"21-outside-the-type-system-what-made-typescript-this-popular--menit-39244159\"\u003e21. “Outside the type system, what made TypeScript this popular?” — menit 39:24–41:59\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#21-outside-the-type-system-what-made-typescript-this-popular--menit-39244159\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTooling adalah faktor utama. Erasable type system memberi autocomplete, navigation, refactor, diagnostics, dan confidence.\u003c/p\u003e\n\u003cp\u003eAtomic idea: type system value paling nyata adalah tooling experience.\u003c/p\u003e\n\u003ch3 id=\"22-how-does-the-typescript-compiler-pipeline-work--menit-41594658\"\u003e22. “How does the TypeScript compiler pipeline work?” — menit 41:59–46:58\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#22-how-does-the-typescript-compiler-pipeline-work--menit-41594658\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePipeline: lexer → parser → binder → type checker → emitter. Compiler juga harus berfungsi sebagai service interaktif untuk IDE, dengan lazy incremental work dan AST cache.\u003c/p\u003e\n\u003cp\u003eAtomic idea: compiler modern adalah search engine semantik interaktif atas codebase.\u003c/p\u003e\n\u003ch3 id=\"23-what-would-you-add-to-javascript-if-you-could--menit-47194907\"\u003e23. “What would you add to JavaScript if you could?” — menit 47:19–49:07\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#23-what-would-you-add-to-javascript-if-you-could--menit-47194907\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders suka functional programming dan ingin JavaScript punya lebih banyak expression-oriented constructs. TypeScript tetap harus hidup di atas JS sebagai superset, tidak sebagai fork.\u003c/p\u003e\n\u003cp\u003eAtomic idea: TypeScript terikat oleh JavaScript runtime semantics.\u003c/p\u003e\n\u003ch3 id=\"24-what-are-javascripts-strengths-and-weaknesses--menit-49075114\"\u003e24. “What are JavaScript’s strengths and weaknesses?” — menit 49:07–51:14\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#24-what-are-javascripts-strengths-and-weaknesses--menit-49075114\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJS kecil dan cukup bagus, tapi ambiguous tanpa typing. TypeScript menawarkan pragmatic bug filtering dan tooling, bukan proof system sempurna.\u003c/p\u003e\n\u003cp\u003eAtomic idea: TypeScript type system adalah pragmatic bug filter dan tooling engine.\u003c/p\u003e\n\u003ch3 id=\"25-what-kinds-of-ai-tools-are-you-using--menit-51145322\"\u003e25. “What kinds of AI tools are you using?” — menit 51:14–53:22\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#25-what-kinds-of-ai-tools-are-you-using--menit-51145322\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTim TypeScript menggunakan AI untuk code review PR, simple issue fixes, dan pekerjaan toil, tetapi AI belum menggantikan pemahaman mendalam.\u003c/p\u003e\n\u003cp\u003eAtomic idea: AI bagus untuk toil, tapi manusia masih perlu architectural understanding.\u003c/p\u003e\n\u003ch3 id=\"26-given-you-build-languages-doesnt-someone-need-deep-understanding--menit-53225403\"\u003e26. “Given you build languages, doesn’t someone need deep understanding?” — menit 53:22–54:03\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#26-given-you-build-languages-doesnt-someone-need-deep-understanding--menit-53225403\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnders setuju. Programming language development membutuhkan orang yang memahami fundamental. AI berisiko stochastic dan indeterminate; bahasa tetap diperlukan untuk determinisme.\u003c/p\u003e\n\u003cp\u003eAtomic idea: AI memerlukan programming language karena software production tetap butuh determinisme.\u003c/p\u003e\n\u003ch2 id=\"catatan-tambahan\"\u003eCatatan tambahan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-tambahan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTranscript tersedia hanya sampai sekitar menit 54:03. Sisa episode sampai 1:15:09 hanya tersedia dalam bentuk timestamp dan ringkasan.\u003c/p\u003e\n\u003ch2 id=\"pola-besar-yang-muncul\"\u003ePola besar yang muncul\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pola-besar-yang-muncul\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAnders melihat bahasa sebagai bagian dari developer experience loop.\u003c/li\u003e\n\u003cli\u003eBahasa yang sukses bukan hanya syntax; ia berhubungan dengan compiler, IDE, runtime, type system, ecosystem, dan sekarang AI.\u003c/li\u003e\n\u003cli\u003eBahasa besar sering menang karena kompromi timing dan kompatibilitas, bukan karena murni teori.\u003c/li\u003e\n\u003cli\u003eTypeScript adalah layer guardrail di atas JavaScript, bukan pengganti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relevansi-terhadap-tema-lain\"\u003eRelevansi terhadap tema lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevansi-terhadap-tema-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThread Gergely sebelumnya: TypeScript bukan C# untuk JS.\u003c/li\u003e\n\u003cli\u003eUnmesh Joshi: code bukan sekadar instruksi, tapi model konseptual yang dibaca manusia dan LLM.\u003c/li\u003e\n\u003cli\u003eWorkflow AI: TypeScript membantu AI dengan sinyal lebih eksplisit; JS murni lebih ambiguous.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eyoutube (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprogramming-languages (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003einterview (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming
