-problem-yang-sama":{"type":"header","text":"Dua agent dan satu problem yang sama","value":"dua-agent-dan-satu-problem-yang-sama","line":19,"column":0,"depth":2},"mapping-dari-x402-ke-agent-case":{"type":"header","text":"Mapping dari x402 ke agent case","value":"mapping-dari-x402-ke-agent-case","line":36,"column":0,"depth":2},"privacy-boundary-yang-harus-gue-bangun":{"type":"header","text":"Privacy boundary yang harus gue bangun","value":"privacy-boundary-yang-harus-gue-bangun","line":62,"column":0,"depth":2},"policy-per-agent-menurut-gue":{"type":"header","text":"Policy per agent menurut gue","value":"policy-per-agent-menurut-gue","line":84,"column":0,"depth":2},"kenapa-ini-penting-buat-gue":{"type":"header","text":"Kenapa ini penting buat gue","value":"kenapa-ini-penting-buat-gue","line":96,"column":0,"depth":2},"implementasi-teknis-yang-gue-anggap-logis":{"type":"header","text":"Implementasi teknis yang gue anggap logis","value":"implementasi-teknis-yang-gue-anggap-logis","line":104,"column":0,"depth":2},"prinsip-yang-gue-pegang":{"type":"header","text":"Prinsip yang gue pegang","value":"prinsip-yang-gue-pegang","line":116,"column":0,"depth":2},"link":{"type":"header","text":"Link","value":"link","line":124,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"pii-guardrail-antar-agent-dari-x402-ke-brainstorming--coding-agent\"\u003ePII guardrail antar-agent: dari x402 ke brainstorming + coding agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pii-guardrail-antar-agent-dari-x402-ke-brainstorming--coding-agent\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eWaktu gue baca \u003ccode\u003eHardening x402\u003c/code\u003e, yang nyantol bukan blockchain-nya. Yang nyantol adalah pola arsitekturnya: data harus dicegat sebelum berpindah boundary, lalu disaring sebelum dia diproses lebih lanjut.\u003c/p\u003e\n\u003cp\u003eItu yang bikin paper ini relevan buat sistem dua-agent gue/elo.\u003c/p\u003e\n\u003ch2 id=\"dua-agent-dan-satu-problem-yang-sama\"\u003eDua agent dan satu problem yang sama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dua-agent-dan-satu-problem-yang-sama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi sistem gue ada dua peran yang jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBrainstorming Agent\u003c/strong\u003e: dia yang baca requirement, dokumen bisnis, meeting notes, screenshot, atau input user. Dia bikin PRD, Jira task, breakdown, atau desain solusi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCoding Agent\u003c/strong\u003e: dia yang baca artifact dari brainstorming agent plus context repo, lalu output-nya jadi code, patch, test, review, atau implementasi teknis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau gue tidak pasang proteksi boundary, PII bisa turun dari user input ke artifact engineering lalu ke generated code / repo / trace.\u003c/p\u003e\n\u003cp\u003eContoh yang gue lihat bisa bocor:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt LLM berisi screenshot atau dokumen dengan NIK / nomor rekening,\u003c/li\u003e\n\u003cli\u003evector DB index malah menyimpan teks asli,\u003c/li\u003e\n\u003cli\u003eJira issue atau Confluence page berisi detail pribadi,\u003c/li\u003e\n\u003cli\u003ecoding agent nulis unit test pakai data nyata,\u003c/li\u003e\n\u003cli\u003etrace Langfuse mencatat tool args berisi email atau nomor telepon.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mapping-dari-x402-ke-agent-case\"\u003eMapping dari x402 ke agent case\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mapping-dari-x402-ke-agent-case\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi paper, fokusnya bukan payment value atau settlement. Fokusnya adalah tiga field metadata x402 yang ikut melekat pada request dan bisa mengandung PII:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eresource_url\u003c/code\u003e: alamat atau identifier resource yang dibayar. Di situ bisa ada path/user id/slug yang membawa informasi sensitif.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edescription\u003c/code\u003e: teks penjelasan transaksi. Ini sering jadi tempat “alasan bisnis”, dan bisa memuat nama, email, rekening, atau nomor invoice.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereason\u003c/code\u003e: rationale pembayaran. Ini bisa berisi komentar bebas dari server yang sebenarnya tidak perlu diketahui payment facilitator.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBuat gue, inti paper ini adalah: metadata itu sendiri adalah vektor. Kalau request dikirim tanpa menyaring metadata, agent sudah mengirim PII sebelum action final dieksekusi.\u003c/p\u003e\n\u003cp\u003eKalau saya terjemahkan ke sistem dua-agent, analoginya bukan lagi tiga nama field literal. Yang setara adalah semua konten yang bergerak dari satu agent ke boundary lain. Di workflow kita, bentuknya bisa muncul sebagai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003euser_message\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euploaded_document_text\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eretrieved_context\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etool_call_args\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eagent_scratchpad\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egenerated_artifact\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ejira_description\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econfluence_body\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit_commit_message\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etest_fixture\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etrace_payload\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi yang gue tarik dari paper ini adalah: bukan hanya \u003ccode\u003eresource_url\u003c/code\u003e/\u003ccode\u003edescription\u003c/code\u003e/\u003ccode\u003ereason\u003c/code\u003e yang harus disaring. Prinsipnya adalah \u003ccode\u003emetadata transport\u003c/code\u003e — semua konten yang keluar dari boundary agent harus dicek dulu.\u003c/p\u003e\n\u003ch2 id=\"privacy-boundary-yang-harus-gue-bangun\"\u003ePrivacy boundary yang harus gue bangun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#privacy-boundary-yang-harus-gue-bangun\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAdaptasi x402 buat sistem ini jadi layer berikut:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eIngestion / Input Guard\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003escan semua input awal untuk PII\u003c/li\u003e\n\u003cli\u003ejangan langsung teruskan raw text ke agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eContext Sanitization Gateway\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emask / redact / pseudonymize / synthesize\u003c/li\u003e\n\u003cli\u003episahkan versi raw dengan versi aman\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eArtifact Guard\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esebelum Brainstorming Agent output jadi input Coding Agent, scan ulang\u003c/li\u003e\n\u003cli\u003epastikan artifact yang dipindahkan tidak mengandung raw PII\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eOutput Guard\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003escan semua output sebelum disimpan atau dikirim ke Jira/Confluence/Git/trace\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eAudit Log\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecatat keputusan masking/filtering tanpa menyimpan raw PII\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"policy-per-agent-menurut-gue\"\u003ePolicy per agent menurut gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#policy-per-agent-menurut-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBrainstorming Agent:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eboleh menerima context yang sudah \u003ccode\u003epseudonymized\u003c/code\u003e atau \u003ccode\u003eredacted\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eboleh menjaga konsistensi entitas dengan token stabil (\u003ccode\u003ePERSON_001\u003c/code\u003e, \u003ccode\u003eACCOUNT_001\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003etidak boleh menerima raw NIK, nomor rekening, email, telepon, atau data reguler sensitif\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCoding Agent:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eharus bisa bekerja dengan \u003ccode\u003esynthetic\u003c/code\u003e atau \u003ccode\u003eplaceholder\u003c/code\u003e examples\u003c/li\u003e\n\u003cli\u003etidak butuh PII asli untuk bikin schema, validation, atau test\u003c/li\u003e\n\u003cli\u003eraw PII tidak boleh masuk prompt, generated code, atau fixture\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting-buat-gue\"\u003eKenapa ini penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalimat yang gue pakai kalau mau jelasin ke CISO:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Hardening x402 menjelaskan prinsip kontrol sebelum request dieksekusi. Di platform kita, prinsip yang sama berlaku ke semua agent boundary: data hanya boleh bergerak antar-agent setelah melewati PII gateway, bukan langsung dari brain dump ke prompt atau artifact.\" \u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eYang penting bagi gue adalah bahwa ini bukan soal satu sanitizer. Ini soal menjadikan \u003ccode\u003eagent boundary\u003c/code\u003e sebagai bagian dari security architecture.\u003c/p\u003e\n\u003ch2 id=\"implementasi-teknis-yang-gue-anggap-logis\"\u003eImplementasi teknis yang gue anggap logis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implementasi-teknis-yang-gue-anggap-logis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomponen minimal yang gue butuh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epii_detector\u003c/code\u003e (NER + regex + schema-aware rules)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epii_transformer\u003c/code\u003e (mask / redact / pseudonymize / synthesize)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epolicy_engine\u003c/code\u003e (destination-aware: brainstorming/coding/LLM/trace/storage)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprivacy_gateway\u003c/code\u003e (middleware sebelum agent dan sebelum artifact persist)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eaudit_logger\u003c/code\u003e (keputusan, entitas, action)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esafe_context_store\u003c/code\u003e (versi sanitized)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eraw_vault\u003c/code\u003e (raw data terpisah, akses dibatasi)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"prinsip-yang-gue-pegang\"\u003ePrinsip yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eJangan anggap kalau agent sudah pakai LLM internal berarti data aman.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eJangan hanya filter sekali; scan lagi saat data keluar boundary.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eJangan letakkan raw data dan sanitized data di tempat yang sama.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePseudonymization sering lebih berguna daripada redaksi kasar untuk Brainstorming Agent.\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eUntuk Coding Agent, synthetic data sering lebih aman dan lebih berguna.\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"link\"\u003eLink\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#link\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.hardening-x402\"\u003eHardening x402: PII-Safe Agentic Payments\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeih
