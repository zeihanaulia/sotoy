ps":{"note":{"id":"notes.rust.design-patterns-and-best-practices-in-rust","title":"Design Patterns and Best Practices in Rust","desc":"Catatan teknis tentang bagaimana pola desain tradisional diterjemahkan ke idiom Rust.","updated":1778806126294,"created":1778769849772,"tags":["notes","rust","design-patterns"],"custom":{},"fname":"notes.rust.design-patterns-and-best-practices-in-rust","type":"note","vault":{"fsPath":"vault"},"contentHash":"0a7b49b8103a39d5de3efa864b0594d1","links":[{"type":"frontmatterTag","from":{"fname":"notes.rust.design-patterns-and-best-practices-in-rust","id":"notes.rust.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.rust.design-patterns-and-best-practices-in-rust","id":"notes.rust.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.rust","alias":"rust","xvault":false,"to":{"fname":"tags.rust"}},{"type":"frontmatterTag","from":{"fname":"notes.rust.design-patterns-and-best-practices-in-rust","id":"notes.rust.design-patterns-and-best-practices-in-rust","vaultName":"vault"},"value":"tags.design-patterns","alias":"design-patterns","xvault":false,"to":{"fname":"tags.design-patterns"}}],"anchors":{"ringkasan-pendek":{"type":"header","text":"Ringkasan pendek","value":"ringkasan-pendek","line":14,"column":0,"depth":2},"preface-frame-baca-buku":{"type":"header","text":"Preface: frame baca buku","value":"preface-frame-baca-buku","line":18,"column":0,"depth":2},"layer-desain-yang-gue-lihat":{"type":"header","text":"Layer desain yang gue lihat","value":"layer-desain-yang-gue-lihat","line":98,"column":0,"depth":2},"part-1-thinking-in-rust":{"type":"header","text":"Part 1: Thinking in Rust","value":"part-1-thinking-in-rust","line":115,"column":0,"depth":2},"part-2-replacing-traditional-design-patterns":{"type":"header","text":"Part 2: Replacing Traditional Design Patterns","value":"part-2-replacing-traditional-design-patterns","line":125,"column":0,"depth":2},"part-3-new-patterns-for-rust":{"type":"header","text":"Part 3: New Patterns for Rust","value":"part-3-new-patterns-for-rust","line":133,"column":0,"depth":2},"logic-path-buku-ini":{"type":"header","text":"Logic path buku ini","value":"logic-path-buku-ini","line":142,"column":0,"depth":2},"cara-baca-buku-ini":{"type":"header","text":"Cara baca buku ini","value":"cara-baca-buku-ini","line":162,"column":0,"depth":2},"roadmap-belajar":{"type":"header","text":"Roadmap belajar","value":"roadmap-belajar","line":170,"column":0,"depth":2},"mapping-tradisional--rust-native":{"type":"header","text":"Mapping tradisional → Rust-native","value":"mapping-tradisional--rust-native","line":197,"column":0,"depth":2},"trade-off-penting":{"type":"header","text":"Trade-off penting","value":"trade-off-penting","line":224,"column":0,"depth":2},"design-tool-di-rust":{"type":"header","text":"Design tool di Rust","value":"design-tool-di-rust","line":231,"column":0,"depth":2},"ide-yang-mau-gue-susun-lagi-nanti":{"type":"header","text":"Ide yang mau gue susun lagi nanti","value":"ide-yang-mau-gue-susun-lagi-nanti","line":242,"column":0,"depth":2}},"children":[],"parent":"c0qwq9rj3g2r8lfv48t41il","data":{}},"body":"\u003ch1 id=\"design-patterns-and-best-practices-in-rust\"\u003eDesign Patterns and Best Practices in Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#design-patterns-and-best-practices-in-rust\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ringkasan-pendek\"\u003eRingkasan pendek\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-pendek\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuku ini kelihatan menempatkan Rust sebagai bahasa dengan mental model sendiri: bukan kelas yang dikaitkan ke OOP, tapi ownership, borrowing, tipe, dan flow data. Pattern lama dipakai bukan sebagai aturan baku, melainkan sebagai contoh problem yang harus diterjemahkan ulang.\u003c/p\u003e\n\u003ch2 id=\"preface-frame-baca-buku\"\u003ePreface: frame baca buku\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#preface-frame-baca-buku\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePreface tidak lagi bicara tentang cara nulis syntax Rust. Ini tentang transformasi filosofi desain software di Rust. Kalimat pentingnya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Truly effective Rust development requires a transformation in how you approach software design itself.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu berarti menguasai \u003ccode\u003estruct\u003c/code\u003e, \u003ccode\u003etrait\u003c/code\u003e, \u003ccode\u003eenum\u003c/code\u003e, \u003ccode\u003ematch\u003c/code\u003e, \u003ccode\u003eResult\u003c/code\u003e, ownership, borrowing, dan lifetime belum cukup. Yang mau dibongkar buku ini adalah bagaimana kita mendesain relasi antar komponen.\u003c/p\u003e\n\u003cp\u003eBeberapa hal penting dari Preface:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni adalah kontrak pembelajaran buku.\u003c/li\u003e\n\u003cli\u003eProblem utama yang diangkat bukan \"Rust sulit\", tapi developer sering membawa desain dari bahasa lain ke Rust.\u003c/li\u003e\n\u003cli\u003eRust memaksa desain kelihatan: ownership kabur, dependency berantakan, atau mutability terlalu bebas akan muncul sebagai compile error.\u003c/li\u003e\n\u003cli\u003eCompiler Rust bertindak sebagai reviewer desain.\u003c/li\u003e\n\u003cli\u003eTransformasi yang dituju: dari memaksa Rust mengikuti desain lama menjadi membiarkan constraint Rust membentuk desain baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePreface juga mengidentifikasi dua escape hatch yang sering muncul saat frustrasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eclone()\u003c/code\u003e bertebaran untuk mengatasi ownership sulit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRc\u0026#x3C;RefCell\u0026#x3C;T\u003e\u003e\u003c/code\u003e dipakai untuk mengembalikan shared mutable state.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKeduanya bisa valid, tapi jika dipakai sebagai pelarian dari desain ownership, mereka berubah jadi anti-pattern.\u003c/p\u003e\n\u003cp\u003eBagian berikutnya adalah thesis utama Preface:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Internalizing Rust's philosophy and allowing it to shape your thinking matters more than any individual pattern or technique.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIntinya: jangan baca buku ini sebagai katalog pattern. Jangan mikir, “oh di Rust Factory Pattern begini, Strategy Pattern begini, Observer Pattern begini.” Yang penting adalah filosofi Rust yang membentuk cara lo memilih pattern.\u003c/p\u003e\n\u003cp\u003eDi OOP klasik, lo mungkin bertanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eClass apa yang perlu dibuat?\u003c/li\u003e\n\u003cli\u003eInterface-nya apa?\u003c/li\u003e\n\u003cli\u003eInheritance tree-nya gimana?\u003c/li\u003e\n\u003cli\u003eObject mana yang punya method apa?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi Rust, pertanyaannya berubah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eData ini dimiliki siapa?\u003c/li\u003e\n\u003cli\u003eMutation terjadi di boundary mana?\u003c/li\u003e\n\u003cli\u003eBehavior ini lebih cocok trait, enum, generic, atau closure?\u003c/li\u003e\n\u003cli\u003eState ilegal bisa dicegah lewat type system gak?\u003c/li\u003e\n\u003cli\u003eApakah polymorphism perlu runtime atau cukup compile time?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo baca bab creational/structural/behavioral pattern dengan mindset OOP, lo akan cuma cari padanan. Kalau lo baca dengan mindset Rust, lo akan cari problem desain di balik pattern, dan bertanya: “Rust punya cara lebih natural gak?”\u003c/p\u003e\n\u003cp\u003eBuku ini pakai tiga project sebagai progression:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Calculator: sengaja dibuat buruk untuk Chapter 1–4. Ini adalah cermin kesalahan, bukan app yang bagus. Tujuannya adalah melihat apa yang terjadi kalau desain Java/C++ dipaksa masuk Rust.\u003c/li\u003e\n\u003cli\u003eCorrect Calculator: untuk Chapter 5–8. Ini versi rebuilding. Problem yang sama dibangun ulang dengan pattern yang lebih cocok dengan ownership model dan type system Rust.\u003c/li\u003e\n\u003cli\u003eSamsa microservice: untuk Chapter 9–12. Ini naik level dari calculator ke arsitektur aplikasi. Di sini pattern Rust-native mulai muncul: type system untuk compile-time safety, functional idioms, dan architectural advantage dari ownership.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eProgressionnya seperti ini:\u003c/p\u003e\n\u003cp\u003eBad Calculator\n↓\nBelajar melihat anti-pattern\u003c/p\u003e\n\u003cp\u003eCorrect Calculator\n↓\nBelajar menerjemahkan pattern klasik ke Rust\u003c/p\u003e\n\u003cp\u003eSamsa microservice\n↓\nBelajar memakai pattern yang lahir dari Rust sendiri\u003c/p\u003e\n\u003cp\u003eIni urutan pedagogis yang bagus. Buku ini tidak langsung memberi \"best practice\". Dia mulai dari desain yang salah dulu, karena di Rust, memahami failure mode itu penting.\u003c/p\u003e\n\u003cp\u003eKenapa? Karena banyak kesalahan Rust bukan kesalahan syntax, tapi kesalahan mental model.\u003c/p\u003e\n\u003cp\u003e★ Insight\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Calculator adalah alat diagnosis. Lo diajak melihat bau desain sebelum melihat solusi.\u003c/li\u003e\n\u003cli\u003eCorrect Calculator adalah alat translasi. Pattern lama tidak dibuang semua, tapi diadaptasi.\u003c/li\u003e\n\u003cli\u003eSamsa adalah alat sintesis. Setelah mental model berubah, baru lo bisa melihat pattern Rust-native di aplikasi lebih realistis.\u003c/li\u003e\n\u003cli\u003eUrutan ini bagus karena belajar Rust design tidak bisa hanya dari contoh final yang bersih.\u003c/li\u003e\n\u003cli\u003eLo perlu melihat \"kenapa desain tertentu gagal\" supaya tahu kapan solusi tertentu masuk akal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScope buku ini juga jelas: fokus pada design pattern, architecture decision, dan idiomatic Rust, bukan testing, benchmarking, CI/CD, deployment, atau async runtime.\u003c/p\u003e\n\u003ch2 id=\"layer-desain-yang-gue-lihat\"\u003eLayer desain yang gue lihat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#layer-desain-yang-gue-lihat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003eThinking in Rust\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFokus ke ownership clarity.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eClone\u003c/code\u003e dan \u003ccode\u003eRc\u003c/code\u003e bukan solusi utama; mereka bisa jadi indikator desain yang belum jelas.\u003c/li\u003e\n\u003cli\u003eBorrow checker sebagai feedback desain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eReplacing traditional patterns\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCreational: associated function, builder, dan explicit initialization menggantikan Factory/Prototype.\u003c/li\u003e\n\u003cli\u003eStructural: trait, newtype, enum dispatch, dan composition menggantikan inheritance.\u003c/li\u003e\n\u003cli\u003eBehavioral: closure, enum state machine, iterator, trait, dan channel menggantikan Strategy/Observer/State/Command.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eNew Rust-native patterns\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eType-driven design: encode state valid/invalid di level tipe.\u003c/li\u003e\n\u003cli\u003eFunctional idioms: \u003ccode\u003eOption\u003c/code\u003e, \u003ccode\u003eResult\u003c/code\u003e, iterator, combinator.\u003c/li\u003e\n\u003cli\u003eCore Rust features: RAII, lifetimes, pattern matching, typestate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"part-1-thinking-in-rust\"\u003ePart 1: Thinking in Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-1-thinking-in-rust\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDi banyak bahasa, design pattern lahir karena keterbatasan bahasa itu sendiri: object, inheritance, interface, mutability, lifecycle, dependency, dan runtime polymorphism. Tapi Rust punya alat desain yang berbeda: ownership, borrowing, lifetimes, traits, enums, generics, pattern matching, dan compile-time guarantees.\u003c/li\u003e\n\u003cli\u003eKalau lo datang ke Rust dengan mindset \"gue mau bikin class hierarchy yang rapi\", lo akan cepat frustasi.\u003c/li\u003e\n\u003cli\u003eBorrow checker kelihatan seperti musuh. \u003ccode\u003eclone()\u003c/code\u003e dan \u003ccode\u003eRc\u003c/code\u003e terasa seperti jalan pintas. Masalahnya bukan borrow checker, melainkan desain lo yang memaksa Rust jadi Java.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eWhy Is Rust Different?\u003c/code\u003e seharusnya bukan sekadar menjelaskan syntax. Ini tentang model desain: memory safety, ownership, dan type system memengaruhi cara lo membagi tanggung jawab antar komponen.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAnti-Pattern: Designing for Object Orientation\u003c/code\u003e menyorot bahwa OOP bukan selalu salah, tapi desain yang terlalu memaksa inheritance, mutable shared state, dan class-like abstraction bisa bikin kode kaku di Rust.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAnti-Pattern: Using Clone and Rc Everywhere\u003c/code\u003e adalah alarm: kalau borrow checker marah, jangan langsung \u003ccode\u003eclone()\u003c/code\u003e atau \u003ccode\u003eRc\u003c/code\u003e-in. Itu sering menutupi desain ownership yang kabur.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDon’t Fight the Borrow Checker\u003c/code\u003e merangkum Part 1: borrow checker adalah feedback dan indikator bahwa aliran kepemilikan data belum jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"part-2-replacing-traditional-design-patterns\"\u003ePart 2: Replacing Traditional Design Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-2-replacing-traditional-design-patterns\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChapter 5: Creational Patterns. Di OOP kita kenal Factory, Builder, Singleton, Prototype. Di Rust, beberapa pattern berubah bentuk. Builder relevan untuk struct dengan banyak field optional. Singleton harus dipikir ulang karena global mutable state bukan natural. Rust mendorong ownership dan initialization yang eksplisit.\u003c/li\u003e\n\u003cli\u003eChapter 6: Structural Patterns. Di OOP ada Adapter, Decorator, Facade, Composite, Proxy. Di Rust, itu bisa muncul lewat traits, generics, newtype, composition, enum dispatch, atau trait objects. Bukan \"class A extends class B\", tapi \"type ini mengimplementasikan behavior tertentu\" atau \"struct ini membungkus dependency tertentu.\" \u003c/li\u003e\n\u003cli\u003eChapter 7 \u0026#x26; 8: Behavioral Patterns. Karena luas, mungkin dibagi menjadi \"Taking Action\" dan \"Keeping Track.\" Rust sering menggeser behavioral pattern ke function, closure, enum, trait, iterator, channel, atau state yang di-encode di tipe.\u003c/li\u003e\n\u003cli\u003eValue Part 2: bukan sekadar syntax translation. Pattern klasik dipreteli dulu, problem aslinya ditemukan, kemudian dipilih bentuk Rust-native yang sesuai.\u003c/li\u003e\n\u003cli\u003eTrade-off penting: trait object memberi runtime fleksibilitas, generic lebih kuat di compile-time tapi bisa membuat binary membesar dan API lebih kompleks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"part-3-new-patterns-for-rust\"\u003ePart 3: New Patterns for Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-3-new-patterns-for-rust\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eChapter 9: Architectural Patterns. Fokusnya ke desain sistem yang lebih besar dan boundary. Di Rust, arsitektur bukan cuma soal pattern микро, tapi juga ownership boundary antar module, error boundary, concurrency boundary, dan dependency flow.\u003c/li\u003e\n\u003cli\u003eChapter 10: Patterns That Leverage the Type System. Type system Rust bisa mengunci invariant dan memisahkan state valid/invalid pada level tipe, bukan boolean runtime check.\u003c/li\u003e\n\u003cli\u003eChapter 11: Patterns from Functional Programming. Ini bisa melibatkan function, closure, iterator, combinator, \u003ccode\u003eOption\u003c/code\u003e, \u003ccode\u003eResult\u003c/code\u003e, immutability, dan composition.\u003c/li\u003e\n\u003cli\u003eChapter 12: Patterns Emerging from Rust’s Core Features. Pattern native dari Rust seperti ownership, borrowing, lifetimes, RAII, \u003ccode\u003eDrop\u003c/code\u003e, smart pointers, pattern matching, typestate, dan zero-cost abstractions.\u003c/li\u003e\n\u003cli\u003eChapter 13: Leaning into Rust. Jangan melawan Rust; gunakan constraint Rust sebagai alat desain.\u003c/li\u003e\n\u003cli\u003eIde penting: setelah mental model dan terjemahan pattern lama, Part 3 memperkenalkan pola yang memang lahir dari Rust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"logic-path-buku-ini\"\u003eLogic path buku ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#logic-path-buku-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eRust berbeda\n↓\u003c/li\u003e\n\u003cli\u003eKarena berbeda, kebiasaan OOP bisa jadi anti-pattern\n↓\u003c/li\u003e\n\u003cli\u003eJalan pintas seperti \u003ccode\u003eClone\u003c/code\u003e/\u003ccode\u003eRc\u003c/code\u003e sering menutupi desain ownership yang kabur\n↓\u003c/li\u003e\n\u003cli\u003eBorrow checker harus dibaca sebagai feedback desain\n↓\u003c/li\u003e\n\u003cli\u003eSetelah mental model benar, pattern klasik bisa diterjemahkan ulang\n↓\u003c/li\u003e\n\u003cli\u003ePattern creational/structural/behavioral punya bentuk Rust-native\n↓\u003c/li\u003e\n\u003cli\u003eSetelah itu baru masuk ke pattern yang lahir dari Rust sendiri\n↓\u003c/li\u003e\n\u003cli\u003eType system, FP style, ownership, dan core features menjadi fondasi desain\n↓\u003c/li\u003e\n\u003cli\u003eAkhirnya lo “lean into Rust”, bukan memaksa Rust jadi bahasa lain\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"cara-baca-buku-ini\"\u003eCara baca buku ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cara-baca-buku-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCara baca buku pattern yang benar adalah mulai dari problem, bukan nama pattern.\u003c/li\u003e\n\u003cli\u003eNama pattern itu label belakangan. Intinya adalah gaya menyelesaikan tension desain.\u003c/li\u003e\n\u003cli\u003eDi Rust, tension paling utama biasanya: ownership, mutability, lifetime, abstraction boundary, dan error handling.\u003c/li\u003e\n\u003cli\u003eKalau lo cuma hafal “Factory, Adapter, Strategy”, lo akan mengulang pola lama.\u003c/li\u003e\n\u003cli\u003eKalau lo paham “kenapa pattern itu ada”, lo bisa menemukan bentuk Rust-native-nya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"roadmap-belajar\"\u003eRoadmap belajar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#roadmap-belajar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBaca Part 1 pelan-pelan terlebih dahulu. Ini paling penting karena menentukan cara baca bab berikutnya.\u003c/li\u003e\n\u003cli\u003eCari atomic idea dari tiap chapter, seperti “ownership as design boundary”, “borrow checker as design feedback”, “clone as hidden cost”, dan “Rc as shared ownership trade-off”.\u003c/li\u003e\n\u003cli\u003eSaat masuk Part 2, jangan cuma rangkum pattern. Buat mapping:\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTraditional Pattern → Problem yang diselesaikan → Rust-native alternative → Trade-off\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFactory\n→ problem: membuat object tanpa expose detail konstruksi\n→ Rust alternative: associated function, builder, trait-based constructor\n→ trade-off: simple constructor vs flexible builder\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eStrategy\n→ problem: mengganti behavior\n→ Rust alternative: trait, generic parameter, closure, enum dispatch\n→ trade-off: runtime flexibility vs compile-time optimization\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eState\n→ problem: object berubah behavior berdasarkan state\n→ Rust alternative: enum state machine atau typestate pattern\n→ trade-off: mudah dibaca vs lebih strict secara type-level\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"4\"\u003e\n\u003cli\u003eDi Part 3, ambil ide yang bisa dipakai ke proyek nyata. Contoh: produk SaaS internal atau agent architecture, refleksikan apakah pattern ini relevan untuk agent runtime, scheduler, parser, atau CLI.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"mapping-tradisional--rust-native\"\u003eMapping tradisional → Rust-native\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mapping-tradisional--rust-native\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003eFactory\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem: membuat objek tanpa expose detail konstruksi.\u003c/li\u003e\n\u003cli\u003eRust: associated function, \u003ccode\u003enew\u003c/code\u003e, builder.\u003c/li\u003e\n\u003cli\u003eTrade-off: simple constructor vs konfigurasi eksplisit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eSingleton\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem: global shared instance.\u003c/li\u003e\n\u003cli\u003eRust: hindari global mutable state, gunakan dependency injection dan scope ownership.\u003c/li\u003e\n\u003cli\u003eTrade-off: global mudah tapi menutup batasan ownership.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eAdapter / Facade\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem: menyamakan interface atau menyederhanakan subsistem.\u003c/li\u003e\n\u003cli\u003eRust: wrapper type, newtype, atau trait implementation.\u003c/li\u003e\n\u003cli\u003eTrade-off: fleksibilitas runtime vs compile-time clarity.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eStrategy\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem: mengganti behavior.\u003c/li\u003e\n\u003cli\u003eRust: trait/generic parameter, closure, enum dispatch.\u003c/li\u003e\n\u003cli\u003eTrade-off: runtime fleksibel vs compile-time optimasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eState\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem: objek berubah perilaku berdasarkan state.\u003c/li\u003e\n\u003cli\u003eRust: enum state machine, typestate.\u003c/li\u003e\n\u003cli\u003eTrade-off: kode lebih ketat tapi lebih aman dibanding flag mutable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"trade-off-penting\"\u003eTrade-off penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTrait object (\u003ccode\u003edyn Trait\u003c/code\u003e) memberi runtime polymorphism, tapi kehilangan beberapa cek compile-time.\u003c/li\u003e\n\u003cli\u003eGeneric lebih kuat di compile-time dan sering lebih efisien, tapi bisa bikin API lebih kompleks dan compile time lebih lama.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRc\u003c/code\u003e/\u003ccode\u003eArc\u003c/code\u003e cocok untuk shared ownership, tapi bisa memblur ownership boundary.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eClone\u003c/code\u003e cocok untuk value yang murah disalin, namun bisa menyimpan biaya tersembunyi ketika dipakai sebagai shortcut.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"design-tool-di-rust\"\u003eDesign tool di Rust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#design-tool-di-rust\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecargo fmt\u003c/code\u003e / \u003ccode\u003erustfmt\u003c/code\u003e: menjaga format konsisten sehingga desain API dan boundary lebih mudah dibaca.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo clippy\u003c/code\u003e: cek idiomatik Rust dan biasanya memberi rekomendasi desain yang lebih \"Rusty\".\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo check\u003c/code\u003e: validasi ownership/lifetime tanpa build penuh, berguna untuk iterasi desain tipe.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo audit\u003c/code\u003e / \u003ccode\u003ecargo deny\u003c/code\u003e: deteksi dependency insecure atau license issue sebelum desain dilepas.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erust-analyzer\u003c/code\u003e: bantu refactor trait, enum, dan lifetime; bagus kalau lo lagi ubah desain ownership.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo tree\u003c/code\u003e: visualisasi dependency graph untuk lihat boundary dan coupling.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo expand\u003c/code\u003e: lihat macro-expanded code, berguna untuk memastikan abstraction tidak menyembunyikan terlalu banyak complexity.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emiri\u003c/code\u003e: debug undefined behavior dan interpreter-level ownership bug di desain unsafe.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"ide-yang-mau-gue-susun-lagi-nanti\"\u003eIde yang mau gue susun lagi nanti\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ide-yang-mau-gue-susun-lagi-nanti\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eApa artinya \"lean into Rust\" dalam kode nyata? Bukan hanya mematok fitur Rust, tapi memformalisasi invariant dan ownership boundary.\u003c/li\u003e\n\u003cli\u003eBagaimana pattern arsitektural di Rust berbeda ketika konteksnya sistem backend, CLI, atau runtime agent?\u003c/li\u003e\n\u003cli\u003eKapan type system lebih baik dibanding runtime check di codebase Rust intensif performa?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003erust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edesign-patterns (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVau
