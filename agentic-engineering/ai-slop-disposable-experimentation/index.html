 matang","value":"ringkasan-boundary-yang-lebih-matang","line":136,"column":0,"depth":2},"related":{"type":"header","text":"Related","value":"related","line":145,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"ai-slop-dan-batas-disposable-experimentation\"\u003eAI Slop dan Batas Disposable Experimentation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ai-slop-dan-batas-disposable-experimentation\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread Mitchell Hashimoto di \u003ca href=\"https://x.com/mitchellh/status/2052397933522506079\"\u003ehttps://x.com/mitchellh/status/2052397933522506079\u003c/a\u003e sebagai defensif terhadap satu ide: kode AI kasar tidak selalu buruk, asal jelas fungsinya sebagai eksperimen disposable, bukan fondasi yang dipaksakan ke user.\u003c/p\u003e\n\u003cp\u003eDi thread ini gue baca istilah \"yapping\" sebagai \"lagi ngomong panjang soal poin besarnya\" — bukan sekadar nge-omel tanpa isi. Itu penting karena konteksnya bukan kritik general terhadap AI, tapi diskusi spesifik tentang kapan output AI boleh dianggap temporary.\u003c/p\u003e\n\u003cp\u003eIstilah yang gue pakai di note ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"ngeslop\" = bikin output AI kasar/mentah untuk eksplorasi.\u003c/li\u003e\n\u003cli\u003e\"ngevibing code\" = vibe coding: AI-assisted fast iterative drafting, bukan langsung jadi permanen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-dia-maksud-dengan-ai-slop\"\u003eApa yang dia maksud dengan “AI slop”?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-dia-maksud-dengan-ai-slop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMitchell pakai \"slop\" untuk kode atau produk yang fungsinya bukan final. Ini kasar, mungkin jelek, tapi cukup untuk ngetes apakah desain, alur, atau ekosistem yang kita incar bisa jalan. Slop di sini adalah eksperimen cepat, bukan kualitas akhir yang akan dishare ke customer tanpa review.\u003c/p\u003e\n\u003ch3 id=\"ngeslop-vs-vibe-coding\"\u003eNgeslop vs vibe coding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ngeslop-vs-vibe-coding\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eNgeslop adalah output kasar untuk eksplorasi. Vibe coding adalah workflow cepat dengan AI yang mengandalkan iterasi, bukan desain semua detail dari awal. Keduanya bisa sah, selama outputnya tidak langsung dianggap final.\u003c/p\u003e\n\u003ch3 id=\"good-enough-to-learn\"\u003eGood enough to learn\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#good-enough-to-learn\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSlop yang valid tidak perlu sempurna. Dia cukup baik untuk menghasilkan insight — bukan cukup baik untuk langsung di-ship. Itu yang komentar sebut sebagai \"good enough to learn.\"\u003c/p\u003e\n\u003ch2 id=\"kenapa-slop-bisa-bagus\"\u003eKenapa slop bisa bagus?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-slop-bisa-bagus\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena slop menurunkan biaya eksperimen. Dulu mau bikin 50 plugin atau 100 provider itu mahal dan lambat. Sekarang agent AI bisa generate banyak variasi cepat, jadi kita bisa menguji apakah model ecosystem masuk akal sebelum invest lebih jauh.\u003c/p\u003e\n\u003cp\u003eSederhananya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI slop membuat eksperimen paralel murah.\u003c/li\u003e\n\u003cli\u003eeksperimen paralel membuat validasi desain sistem jauh lebih cepat.\u003c/li\u003e\n\u003cli\u003evalidasi cepat membantu kita tahu apakah arsitektur besar layak dilanjutkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"batas-aman-slop-itu-di-mana\"\u003eBatas aman slop itu di mana?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batas-aman-slop-itu-di-mana\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBatasnya bukan soal apakah kode enak dibaca, tapi soal area risiko.\u003c/p\u003e\n\u003cp\u003eBoleh slop kalau itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ealpha atau internal,\u003c/li\u003e\n\u003cli\u003edisposable dan mudah diganti,\u003c/li\u003e\n\u003cli\u003ehanya untuk ngetes flow, UX, atau integrasi kasar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHarus bersih kalau itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003econtract boundary,\u003c/li\u003e\n\u003cli\u003edata schema,\u003c/li\u003e\n\u003cli\u003epersistence,\u003c/li\u003e\n\u003cli\u003esecurity,\u003c/li\u003e\n\u003cli\u003eidempotency,\u003c/li\u003e\n\u003cli\u003emigration,\u003c/li\u003e\n\u003cli\u003eAPI shape.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePrinsip praktisnya: frontend atau demo flow boleh lebih kasar di awal; core workflow seperti auth, billing, permission model, state machine, dan data contract tidak boleh divibe-kan sembarangan.\u003c/p\u003e\n\u003ch3 id=\"standar-release-customer-facing\"\u003eStandar release customer-facing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#standar-release-customer-facing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum output AI masuk ke customer-facing release, minimal harus melalui:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebehavior yang sesuai kebutuhan user,\u003c/li\u003e\n\u003cli\u003eerror case yang terkelola,\u003c/li\u003e\n\u003cli\u003edata integrity dan rollback,\u003c/li\u003e\n\u003cli\u003esecurity boundary yang aman,\u003c/li\u003e\n\u003cli\u003eobservability cukup,\u003c/li\u003e\n\u003cli\u003etim yang paham bagian pentingnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau cuma \"dicoba dan keliatan jalan,\" itu masih terlalu lemah.\u003c/p\u003e\n\u003cp\u003eMitchell menekankan: bagian paling penting bukan \"slop is good.\" Poinnya adalah etiket dan skill untuk tahu di mana slop ada, seberapa banyak harus dibersihkan, dan bagaimana proses cleanup-nya.\u003c/p\u003e\n\u003ch2 id=\"kapan-slop-berubah-jadi-bahaya\"\u003eKapan slop berubah jadi bahaya?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-slop-berubah-jadi-bahaya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSlop jadi bahaya ketika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edilepas ke customer tanpa review,\u003c/li\u003e\n\u003cli\u003edipasang ke project lain tanpa transparansi,\u003c/li\u003e\n\u003cli\u003edianggap final padahal sebenarnya eksperimen,\u003c/li\u003e\n\u003cli\u003emenyentuh state/data/security kritikal,\u003c/li\u003e\n\u003cli\u003emasuk ke arsitektur sebagai fondasi tanpa cleanup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBahaya muncul saat tim kehilangan batas antara \"coba cepat\" dan \"bertahan lama.\" Itu bukan lagi soal kode jelek; itu soal kepercayaan, data integrity, dan arsitektur.\u003c/p\u003e\n\u003ch2 id=\"hubungan-dengan-agentic-coding-dan-software-engineering-sekarang\"\u003eHubungan dengan agentic coding dan software engineering sekarang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan-dengan-agentic-coding-dan-software-engineering-sekarang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSkill baru di era AI bukan cuma generate kode cepat. Skill-nya adalah boundary discipline:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejaga core internals tetap berkualitas,\u003c/li\u003e\n\u003cli\u003ebiarkan pinggiran eksperimen kasar,\u003c/li\u003e\n\u003cli\u003ecetak kontrak bersih di boundary,\u003c/li\u003e\n\u003cli\u003ereview hasil slop dengan transparansi,\u003c/li\u003e\n\u003cli\u003ecleanup setelah insight didapat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"vibe-coding-sebagai-draft-bukan-kebenaran\"\u003eVibe coding sebagai draft, bukan kebenaran\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vibe-coding-sebagai-draft-bukan-kebenaran\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVibe coding boleh dipakai untuk nge-draft dengan cepat, tapi tidak boleh membuat developer menyerahkan semua kebenaran ke AI. Mode ini berdasar pada speed dan flow, bukan pada asumsi bahwa output sudah tepat.\u003c/p\u003e\n\u003cp\u003eKalau developer bilang \"jalan di laptop gue, berarti selesai,\" itu tanda vibe coding yang tidak sehat. Versi sehatnya adalah: AI mempercepat gerak, tapi judgement tetap di manusia dan quality gate tetap ada.\u003c/p\u003e\n\u003cp\u003eMitchell pakai contoh Terraform 0.1: dulu mereka cuma bisa ship sekitar 3 provider karena bikin provider lambat dan mahal. Kalau hari ini, dia bilang mungkin bisa generate 100 provider untuk membuktikan desain ekosistem lebih cepat — bukan sebagai kualitas final, tapi sebagai eksperimen.\u003c/p\u003e\n\u003ch2 id=\"insight-utama\"\u003eInsight utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAI slop bukan normalisasi kualitas buruk. Dia normalisasi disposable experimentation.\u003c/p\u003e\n\u003cp\u003eIndikator pahamnya adalah: bukan lagi bertanya \"boleh atau nggak?\", tapi \"mana bagian sistem yang boleh rusak, diganti, atau diregenerate ulang tanpa merusak trust, data, atau arsitektur?\"\u003c/p\u003e\n\u003ch2 id=\"social-boundary-dan-distribusi-beban\"\u003eSocial boundary dan distribusi beban\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#social-boundary-dan-distribusi-beban\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBeberapa komentar penting di thread memperjelas bahwa slop bukan cuma properti teknis dari kode. Slop juga punya distribusi biaya sosial.\u003c/p\u003e\n\u003cp\u003eKalau lo generate rough code untuk diri sendiri, biaya rusaknya lo tanggung sendiri. Kalau lo PR generated mess ke tim lain, reviewer harus nebak intent, cek edge case, dan mastiin kode itu bukan cuma \"jalan di demo.\" Devin Stein menyebut bahwa slop adalah alat pribadi yang sering jadi beban orang lain ketika ia dipindah tanpa konteks.\u003c/p\u003e\n\u003cp\u003eIni membuat boundary Mitchell lebih kaya: bukan hanya boundary teknis antara core dan pinggiran, tapi juga boundary sosial antara siapa yang eksperimen dan siapa yang harus membersihkan sisaannya.\u003c/p\u003e\n\u003ch2 id=\"slop-sebagai-riset-murah\"\u003eSlop sebagai riset murah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#slop-sebagai-riset-murah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar Manoj menggeser definisi slop dari \"produk gagal\" menjadi \"instrumen riset murah.\" Generate 20 integrasi, 18 sampah, 2 valid — nilai sejatinya ada di sinyal bahwa dua arah itu layak dikembangkan.\u003c/p\u003e\n\u003cp\u003eItu beda dengan sekadar menghasilkan kode yang jalan. Slop di sini adalah eksplorasi paralel: kita mengorbankan kualitas awal untuk menemukan arah yang benar lebih cepat. Tapi itu hanya valid jika ada fase seleksi dan cleanup setelahnya.\u003c/p\u003e\n\u003ch2 id=\"slop-debt-dan-time-boundary\"\u003eSlop debt dan time boundary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#slop-debt-dan-time-boundary\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eClément Miao membahas slop sebagai bentuk debt. Ini membuat slop lebih mudah dibaca lewat lensa ekonomi engineering: debt sehat harus dicatat, dibatasi, dan dibayar.\u003c/p\u003e\n\u003cp\u003ePerbedaan penting terhadap technical debt biasa adalah bahwa slop debt kadang muncul tanpa kesadaran tim. Tim bisa melihat AI generate banyak file dan mengira itu progress, padahal mereka mungkin cuma menumpuk potensi utang.\u003c/p\u003e\n\u003cp\u003eHanzi menambahkan: yang paling bahaya bukan ketika slop terlihat jelek, tapi ketika slop mulai berguna. Friday prototype yang bertahan enam bulan bisa berubah dari eksperimen menjadi arsitektur tanpa disadari.\u003c/p\u003e\n\u003ch2 id=\"modularity-sebagai-containment-strategy\"\u003eModularity sebagai containment strategy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#modularity-sebagai-containment-strategy\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBanyak komentar menekankan modularitas. Misael bilang modularity akan tetap penting di era AI. Felipe menegaskan bahwa slop liar di monolith 500 ribu baris sangat berbahaya.\u003c/p\u003e\n\u003cp\u003eModularitas membuat slop lebih aman karena kerusakannya bisa dikurung di satu plugin, satu provider, satu adapter, satu UI screen. Kalau salah, bagian itu bisa dihapus, diregenerate, atau diganti tanpa ngerusak keseluruhan sistem.\u003c/p\u003e\n\u003cp\u003eKalau slop masuk ke codebase monolitik non-modular, efeknya berbeda. Ia bisa nambah coupling, bikin review susah, dan mengacaukan mental model tim.\u003c/p\u003e\n\u003ch2 id=\"counter-argument-yang-kuat\"\u003eCounter argument yang kuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#counter-argument-yang-kuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda juga counter argument yang valid: \"There’s never time to do it right, but somehow there’s always time to do it over.\" Ini mengingatkan bahwa budaya ship cepat dulu sering jadi jebakan loop pengulangan dan rework.\u003c/p\u003e\n\u003cp\u003ePosisi paling adil adalah: Mitchell benar untuk eksplorasi, counter ini benar untuk komitmen. Masalah muncul ketika tim menyamaratakan kondisi itu — pura-pura masih eksperimen padahal sistemnya sudah dipakai sebagai production path.\u003c/p\u003e\n\u003ch2 id=\"ringkasan-boundary-yang-lebih-matang\"\u003eRingkasan boundary yang lebih matang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-boundary-yang-lebih-matang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari thread dan komentar yang terbaca, pagar yang diperlukan adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epersonal boundary: siapa yang eksperimen dan siapa yang menanggung biaya,\u003c/li\u003e\n\u003cli\u003emodular boundary: apakah slop dikurung di komponen yang mudah diganti,\u003c/li\u003e\n\u003cli\u003eproduction boundary: apakah kode itu masih alpha/internal atau sudah disalurkan ke user,\u003c/li\u003e\n\u003cli\u003etime boundary: apakah ada rencana bayar utang dan cleanup sebelum eksperimen jadi struktur.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau empat pagar itu jelas, slop bisa jadi research. Kalau pager itu kabur, slop jadi debt dan externalized cost.\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100900\"\u003eVibe coding is exploration flow, not quality discipline\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508142459\"\u003eAI slop is research if bounded; it becomes architecture if it survives too long\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508150000\"\u003eAI-generated draft output is acceptable as research only if it is treated as raw material, not product\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eboundary-discipline (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508142459\"\u003eAI slop is research if bounded; it becomes architecture if it survives too long\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508150000\"\u003eAI-generated draft output is acceptable as research only if it is treated as raw material, not product\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.08\"\u003e2026-05-08\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"template
