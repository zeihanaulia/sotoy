"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"next-wave-cloud-agents-dan-autonomous-orchestration\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#next-wave-cloud-agents-dan-autonomous-orchestration\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca konsep \"next wave\" sebagai pergeseran dari agent CLI lokal/interaktif ke cloud agents plus autonomous orchestration. Faktor utamanya bukan model AI yang lebih pintar lagi, tapi kerja software diperlakukan sebagai sistem agentic yang bisa berjalan paralel, di cloud sandbox, dan divalidasi sebelum sampai ke manusia.\u003c/p\u003e\n\u003ch2 id=\"apa-bedanya-agent-cli-dengan-cloud-agents\"\u003eApa bedanya agent CLI dengan cloud agents?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-bedanya-agent-cli-dengan-cloud-agents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent CLI itu biasanya hidup di terminal lokal lo. Elo yang buka session, agent membaca repo, mengedit file, lalu elo menunggu output atau error. Masih ada intensitas kehadiran manusia.\u003c/p\u003e\n\u003cp\u003eCloud agent memindahkan kerja itu ke environment cloud terisolasi. Ia bisa jalan di background, bisa paralel, bikin PR sendiri, memanggil tool, menjalankan test, dan mengulang sampai memenuhi gate tertentu. Itu lebih dekat ke delegasi daripada interaksi.\u003c/p\u003e\n\u003cp\u003eIntinya: agent CLI adalah interaksi; cloud agent adalah delegasi.\u003c/p\u003e\n\u003ch2 id=\"kenapa-cloud-agents-jadi-gelombang-berikutnya\"\u003eKenapa cloud agents jadi gelombang berikutnya?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-cloud-agents-jadi-gelombang-berikutnya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena bottlenecknya bergeser lagi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFase awal: bisa AI bantu nulis kode atau tidak?\u003c/li\u003e\n\u003cli\u003eFase kedua: bisa AI kerja di repo nyata atau tidak?\u003c/li\u003e\n\u003cli\u003eFase ketiga: bisakah banyak agent bekerja aman, paralel, dan terverifikasi tanpa membanjiri manusia?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCloud agents adalah gelombang berikutnya karena mereka bukan soal satu sesi chat/terminal, melainkan soal sistem terkoordinasi yang mengatur banyak agent, data, dan feedback loop.\u003c/p\u003e\n\u003ch2 id=\"bentuk-autonomous-orchestration-yang-realistis\"\u003eBentuk autonomous orchestration yang realistis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bentuk-autonomous-orchestration-yang-realistis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBentuk sederhana yang realistis:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eHuman membuat issue atau task.\u003c/li\u003e\n\u003cli\u003ePlanner agent baca issue, repo, dokumen, AGENTS.md, skill files, lalu buat plan.\u003c/li\u003e\n\u003cli\u003eImplementer agent kerjakan plan, buat branch, edit kode, jalankan test.\u003c/li\u003e\n\u003cli\u003eReviewer agent periksa correctness, maintainability, security, performa.\u003c/li\u003e\n\u003cli\u003eValidator agent jalankan lint, type check, browser automation, observability check.\u003c/li\u003e\n\u003cli\u003eFixer agent perbaiki failure.\u003c/li\u003e\n\u003cli\u003eHuman approver masuk hanya untuk judgement domain, security-sensitive change, database migration, atau arsitektur.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni bukan satu agent yang jawab prompt. Ini workflow dengan peran, input/output, gate, dan eskalasi.\u003c/p\u003e\n\u003ch2 id=\"kenapa-cloud-environment-penting\"\u003eKenapa cloud environment penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-cloud-environment-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSemakin autonomous seorang agent, semakin penting sandbox yang reproducible.\u003c/p\u003e\n\u003cp\u003eKalau agent masih jalan di laptop lo, environment biasanya implicit: package sudah terinstall, env var ada, service lokal hidup. Itu berbahaya kalau mau scale.\u003c/p\u003e\n\u003cp\u003eCloud agent perlu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003econtainer atau VM template yang jelas,\u003c/li\u003e\n\u003cli\u003epackage dan dependency yang terdefinisi,\u003c/li\u003e\n\u003cli\u003enetwork rule dan secret policy,\u003c/li\u003e\n\u003cli\u003emounted files dan permission yang terbatas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTanpa ini, agent bisa salah akses data, salah command, atau malah mengubah hal di luar scope.\u003c/p\u003e\n\u003ch2 id=\"hubungannya-dengan-harness-engineering\"\u003eHubungannya dengan harness engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungannya-dengan-harness-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni yang ngerjain safety system.\u003c/p\u003e\n\u003cp\u003eCloud agents tanpa harness cuma jadi vibe coding at scale.\u003c/p\u003e\n\u003cp\u003eHarness adalah semua hal di sekitar model:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etools,\u003c/li\u003e\n\u003cli\u003epermissions,\u003c/li\u003e\n\u003cli\u003esandbox,\u003c/li\u003e\n\u003cli\u003econtext,\u003c/li\u003e\n\u003cli\u003eskills,\u003c/li\u003e\n\u003cli\u003eAGENTS.md,\u003c/li\u003e\n\u003cli\u003etest,\u003c/li\u003e\n\u003cli\u003elinter,\u003c/li\u003e\n\u003cli\u003eobservability,\u003c/li\u003e\n\u003cli\u003ebrowser automation,\u003c/li\u003e\n\u003cli\u003efeedback loop.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTujuannya: buat output agent lebih mungkin benar sejak awal, dan sediakan sensor agar agent bisa self-correct sebelum hasilnya sampai manusia.\u003c/p\u003e\n\u003ch2 id=\"contoh-implementasi-secara-bertahap\"\u003eContoh implementasi secara bertahap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-implementasi-secara-bertahap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSupaya tidak chaos, jalanin ini secara bertahap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLevel 1: single cloud task.\n\u003cul\u003e\n\u003cli\u003eSatu issue kecil.\u003c/li\u003e\n\u003cli\u003eAgent bikin branch, perbaiki, jalankan verify command, buka PR.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLevel 2: agent PR reviewer.\n\u003cul\u003e\n\u003cli\u003eAgent review PR dengan struktur: finding, evidence, risk, fix, confidence, human needed.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLevel 3: multi-agent loop.\n\u003cul\u003e\n\u003cli\u003ePlanner, implementer, reviewer, fixer, validator, reporter.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLevel 4: autonomous workflow with gates.\n\u003cul\u003e\n\u003cli\u003eAgent bisa ambil task low-risk, bikin PR, validasi overlay, tapi merge hanya lewat gate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAutonomy harus naik bertahap: task → review → loop → gated workflow.\u003c/p\u003e\n\u003ch2 id=\"implementasi-untuk-engineeringsecurity-review\"\u003eImplementasi untuk engineering/security review\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implementasi-untuk-engineeringsecurity-review\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo bikin sistem security review agent, desain minimalnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e menjelaskan stack, command test, command security scan, dan policy output.\u003c/li\u003e\n\u003cli\u003eskill files untuk security triage, dependency review, SQL injection, secrets review, auth review, migration safety.\u003c/li\u003e\n\u003cli\u003esensors: Semgrep, OSV, gitleaks, npm audit, unit test, type check, SBOM, CI status.\u003c/li\u003e\n\u003cli\u003eorchestrated workflow: planner, static scanner, reasoning agent, exploitability agent, fixer, triage agent, reporter.\u003c/li\u003e\n\u003cli\u003eoutput harus evidence-backed: file/line, reachable path, impact, tool signal, verification, confidence.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSecurity agent yang bagus bukan yang paling banyak alert tapi yang paling cepat ubah alert jadi decision yang bisa ditindaklanjuti.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-perlu-disiapkan-sebelum-cloud-orchestration\"\u003eApa yang perlu disiapkan sebelum cloud orchestration?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-perlu-disiapkan-sebelum-cloud-orchestration\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDefinition of done yang bisa dibaca agent.\n\u003cul\u003e\n\u003cli\u003egoal, context, constraints, done when, escalate when.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e pendek, skill files detail, docs referensi panjang.\u003c/li\u003e\n\u003cli\u003eEnvironment reproducible: Dockerfile/devcontainer, setup script, test command, seed data, mock service, network policy, secret policy.\u003c/li\u003e\n\u003cli\u003ePermission ketat: approval mode, sandbox mode, token terbatas, default read-only.\u003c/li\u003e\n\u003cli\u003eObservability agent-readable: logs, metrics, traces, screenshot, DOM snapshot.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.references\"\u003eCloud Agent Hands-on References\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight-penting\"\u003eInsight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGelombang berikutnya bukan AI nulis kode lebih bagus. Ini soal agent bekerja paralel di cloud dengan gate dan verifikasi otomatis.\u003c/li\u003e\n\u003cli\u003eCloud agents boleh lebih cepat, tapi tanpa harness mereka cuma mempercepat PR yang bikin reviewer tenggelam.\u003c/li\u003e\n\u003cli\u003eIndikator kesiapan: test dipercaya, CI jelas, permission model, AGENTS.md pendek, skill files, artifact report, eskalasi manusia.\u003c/li\u003e\n\u003cli\u003eKalau belum punya itu, cloud agents cuma mempercepat chaos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://developers.openai.com/codex/cloud\"\u003ehttps://developers.openai.com/codex/cloud\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://platform.claude.com/docs/en/managed-agents/overview\"\u003ehttps://platform.claude.com/docs/en/managed-agents/overview\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://martinfowler.com/articles/harness-engineering.html\"\u003ehttps://martinfowler.com/articles/harness-engineering.html\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://openai.com/index/harness-engineering/\"\u003ehttps://openai.com/index/harness-engineering/\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://developers.openai.com/codex/learn/best-practices\"\u003ehttps://developers.openai.com/codex/learn/best-practices\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecloud-agents (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eharness (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102700\"\u003eAgent can become social-operational representation for people and organizations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.how-i-use-ai-to-code\"\u003eHow I Use AI to Code — literature note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, c
