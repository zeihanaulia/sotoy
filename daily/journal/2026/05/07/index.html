37,"column":31,"offset":3589},"indent":[]},"value":"daily.journal.2026.05.07"}],"anchors":{"youtube":{"type":"header","text":"YouTube","value":"youtube","line":15,"column":0,"depth":2},"context":{"type":"header","text":"Context","value":"context","line":19,"column":0,"depth":3},"what-i-learned":{"type":"header","text":"What I learned","value":"what-i-learned","line":24,"column":0,"depth":3},"action":{"type":"header","text":"Action","value":"action","line":31,"column":0,"depth":3}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-07\"\u003e2026-05-07\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-07\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"youtube\"\u003eYouTube\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#youtube\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHari ini gue merangkum talk Andrej Karpathy “From Vibe Coding to Agentic Engineering” ke daily note. Fokusnya bukan lagi ke transkrip menit demi menit, tapi ke takeaway utama dan link ke note detail.\u003c/p\u003e\n\u003ch3 id=\"context\"\u003eContext\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#context\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGue baca talk ini dengan framing: \u003cstrong\u003eagentic engineering\u003c/strong\u003e adalah praktik engineering menggunakan agent AI, tapi tetap menjaga kualitas profesional lewat spec, verifikasi, oversight, dan desain sistem. Bukan sekadar “pakai AI buat coding cepat.”\u003c/p\u003e\n\u003cp\u003ePembacaan ini juga penting karena talk April 2026 merefleksikan fase shift yang Karpathy lihat di akhir \u003cstrong\u003eDesember 2025\u003c/strong\u003e. Business Insider dan sumber lain menguatkan bahwa perasaan “behind as a programmer” serta pergeseran workflow ini muncul sebelum talk, bukan cuma sebagai framing di video.\u003c/p\u003e\n\u003ch3 id=\"what-i-learned\"\u003eWhat I learned\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#what-i-learned\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eVibe coding menaikkan floor: banyak orang bisa build software lebih cepat.\u003c/li\u003e\n\u003cli\u003eAgentic engineering menjaga ceiling: pekerjaan profesional tetap harus secure, maintainable, testable, dan diawasi.\u003c/li\u003e\n\u003cli\u003eSoftware 3.0 memindahkan programming dari menulis logika eksplisit ke mendesain prompt dan context yang dikonsumsi agent.\u003c/li\u003e\n\u003cli\u003eVerifiability dan RL distribution menentukan di mana model paling kuat.\u003c/li\u003e\n\u003cli\u003eManusia masih jadi bottleneck understanding: kita masih harus tahu apa yang mau dibangun, kenapa, dan bagaimana mengarahkan agent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"action\"\u003eAction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#action\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDetailnya gue pindah ke note terpisah: \u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ekarpathy (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli
