","text":"Minimum Viable Reading List","value":"minimum-viable-reading-list","line":131,"column":0,"depth":2},"rencana-praktis-30-hari":{"type":"header","text":"Rencana Praktis 30 Hari","value":"rencana-praktis-30-hari","line":147,"column":0,"depth":2},"prinsip-di-balik-urutan-ini":{"type":"header","text":"Prinsip di Balik Urutan Ini","value":"prinsip-di-balik-urutan-ini","line":167,"column":0,"depth":2},"resource-pelengkap":{"type":"header","text":"Resource Pelengkap","value":"resource-pelengkap","line":177,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat Juga","value":"lihat-juga","line":185,"column":0,"depth":2}},"children":[],"parent":"5ydz1g1et6md22h3x69kuv8","data":{}},"body":"\u003ch1 id=\"learning-path-dari-feature-checklist-ke-service-design-thinking\"\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#learning-path-dari-feature-checklist-ke-service-design-thinking\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProblem yang mau diselesaikan learning path ini ada 3 lapis:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKeluar dari \u003cstrong\u003efeature checklist thinking\u003c/strong\u003e — ukuran sukses bukan lagi \"fitur jadi\", tapi \"problem customer terselesaikan\"\u003c/li\u003e\n\u003cli\u003eBisa nemu \u003cstrong\u003epain point yang tajam\u003c/strong\u003e — bukan asumsi builder, tapi perilaku nyata customer\u003c/li\u003e\n\u003cli\u003eBisa ngebentuk \u003cstrong\u003eservice experience\u003c/strong\u003e yang smooth — bukan sekadar produk yang \"secara fungsi jalan\"\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003eKalau langsung belajar \"UX\" atau \"startup\" secara umum, bisa terlalu melebar.\nMasalah ini lebih spesifik: perlu membangun otot untuk melihat \u003cstrong\u003emomen sakit → opportunity → service journey → MVP kecil\u003c/strong\u003e.\nJadi urutan belajarnya harus dari anti-build-trap dulu, baru customer discovery, baru service design, baru product operating model.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"urutan-prioritas-baca\"\u003eUrutan Prioritas Baca\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#urutan-prioritas-baca\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-escaping-the-build-trap--melissa-perri\"\u003e1. Escaping the Build Trap — Melissa Perri\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-escaping-the-build-trap--melissa-perri\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePaling kena untuk kondisi \"selama ini gue fokus ke fitur apa aja.\" Buku ini membahas jebakan organisasi yang \u003cem\u003ecranking out features\u003c/em\u003e tapi tidak membangun value customer. Perusahaan yang hidup-mati dari output sering jatuh ke \"build trap\" — terus mengirim fitur sesuai jadwal alih-alih kebutuhan customer. (\u003ca href=\"https://books.google.com/books/about/Escaping_the_Build_Trap.html?id=PQ8dMQAACAAJ\"\u003eGoogle Books\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003eAda chapter \"Projects Versus Products Versus Services\" yang nyambung langsung ke diskusi product vs service. (\u003ca href=\"https://www.oreilly.com/library/view/escaping-the-build/9781491973783/\"\u003eO'Reilly\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKalau cuma satu buku dulu, mulai dari ini.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"2-the-mom-test--rob-fitzpatrick\"\u003e2. The Mom Test — Rob Fitzpatrick\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-the-mom-test--rob-fitzpatrick\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk masalah \"susah nemu pain point.\" Fokus ke cara ngobrol dengan customer tanpa ketipu validasi palsu. Handbook untuk mendapat learning dari customer conversation, bahkan ketika orang \"berbohong\" atau terlalu sopan. (\u003ca href=\"https://www.momtestbook.com/\"\u003eThe Mom Test\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003eBanyak founder gagal bukan karena gak nanya customer, tapi karena nanyanya salah. Misal: \u003cem\u003e\"menurut lo ide gue bagus gak?\"\u003c/em\u003e — itu hampir pasti bias. Yang benar: gali perilaku masa lalu, bukan opini terhadap ide.\u003c/p\u003e\n\u003cp\u003eContoh pertanyaan yang benar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Terakhir kali lo bikin PRD dari meeting note, prosesnya gimana? Bagian mana yang paling makan waktu? Workaround lo apa?\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKecil, praktis, sangat cocok untuk engineer yang mau belajar discovery tanpa jadi PM formal.\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"3-continuous-discovery-habits--teresa-torres\"\u003e3. Continuous Discovery Habits — Teresa Torres\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-continuous-discovery-habits--teresa-torres\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau The Mom Test ngajarin \u003cstrong\u003ecara ngobrol\u003c/strong\u003e, buku ini ngajarin \u003cstrong\u003ecara menjadikan discovery sebagai kebiasaan sistematis\u003c/strong\u003e. Structured and sustainable approach agar tim bisa menemukan produk yang customer mau sekaligus memberi hasil bisnis. (\u003ca href=\"https://books.apple.com/us/book/continuous-discovery-habits/id1567317892\"\u003eApple Books\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003eYang paling penting: \u003cstrong\u003eOpportunity Solution Tree\u003c/strong\u003e — berhenti lompat dari \"pain\" langsung ke \"fitur\".\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eBusiness Outcome\n       |\nUser Opportunity / Pain\n       |\nPossible Solutions\n       |\nAssumption Tests\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh untuk produk SaaS:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eOutcome:\nReduce time from meeting note to sprint-ready backlog\n\nOpportunity:\nPO takut requirement ambigu dan dev banyak tanya ulang\n\nSolutions:\nAI brief generator\nMissing-question detector\nJira user story exporter\n\nTests:\nKasih 5 PO sample meeting notes\nLihat apakah mereka merasa output-nya bisa dipakai dalam planning\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bikin fitur lahir dari opportunity, bukan dari imajinasi builder.\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"4-good-services--lou-downe\"\u003e4. Good Services — Lou Downe\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-good-services--lou-downe\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRingkas dan tajam untuk prinsip service yang bagus. Lou Downe adalah eks Director of Design di UK Government. (\u003ca href=\"https://good.services/about\"\u003eGood Services\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003eCocok dipakai sebagai checklist evaluasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eApakah user tahu langkah berikutnya?\u003c/li\u003e\n\u003cli\u003eApakah service membantu user menyelesaikan tujuan?\u003c/li\u003e\n\u003cli\u003eApakah ada dead-end?\u003c/li\u003e\n\u003cli\u003eApakah bahasa sistem jelas?\u003c/li\u003e\n\u003cli\u003eApakah transisi antar step smooth?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch3 id=\"5-this-is-service-design-doing--marc-stickdorn-dkk\"\u003e5. This is Service Design Doing — Marc Stickdorn dkk.\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-this-is-service-design-doing--marc-stickdorn-dkk\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eToolkit lengkap: 33 case studies, 96 co-authors, 205 contributors, library 54 metode service design. (\u003ca href=\"https://www.thisisservicedesigndoing.com/\"\u003eThis is Service Design Doing\u003c/a\u003e) (\u003ca href=\"https://openlibrary.org/books/OL27227533M/This_is_service_design_doing\"\u003eOpen Library\u003c/a\u003e)\u003c/p\u003e\n\u003cp\u003eNgajarin melihat service sebagai sistem interaksi, bukan layar aplikasi. Jadi mulai sensitif ke onboarding, handoff, backstage process, failure recovery, support, dan momen sebelum/sesudah user memakai software.\u003c/p\u003e\n\u003cp\u003eKalau sering merasa \"fiturnya ada tapi feel-nya gak smooth\" — ini yang melatih mata lo.\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"6-the-lean-product-playbook--dan-olsen\"\u003e6. The Lean Product Playbook — Dan Olsen\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-the-lean-product-playbook--dan-olsen\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagus kalau butuh proses runtut untuk product-market fit. Lebih terasa sebagai playbook dibanding \u003cem\u003eInspired\u003c/em\u003e. Cocok setelah lo sudah punya daftar pain/opportunity dan ingin mengubahnya jadi MVP, value proposition, dan testable product.\u003c/p\u003e\n\u003chr\u003e\n\u003ch3 id=\"7-inspired--marty-cagan\"\u003e7. Inspired — Marty Cagan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-inspired--marty-cagan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagus untuk product culture dan cara product team yang kuat bekerja. Tapi ditaruh di urutan akhir karena: kalau belum punya otot pain discovery, terasa terlalu high-level. Baca setelah fondasi dari Perri, Fitzpatrick, dan Torres sudah ada.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"minimum-viable-reading-list\"\u003eMinimum Viable Reading List\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#minimum-viable-reading-list\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau waktu terbatas, kombinasi paling minimum:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEscaping the Build Trap + The Mom Test + Continuous Discovery Habits\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTiga itu cukup untuk mengubah pertanyaan dari:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Fitur apa yang harus gue bikin?\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003emenjadi:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cem\u003e\"Momen sakit apa yang cukup sering, cukup mahal, dan bisa gue kurangi dengan service kecil yang jelas?\"\u003c/em\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"rencana-praktis-30-hari\"\u003eRencana Praktis 30 Hari\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rencana-praktis-30-hari\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eMinggu 1\u003c/strong\u003e — baca \u003cem\u003eEscaping the Build Trap\u003c/em\u003e.\nTarget bukan tamat doang. Tiap hari tulis: \"di produk gue, fitur mana yang cuma output, bukan outcome?\"\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMinggu 2\u003c/strong\u003e — baca \u003cem\u003eThe Mom Test\u003c/em\u003e.\nLangsung praktik: interview 5 orang. Jangan pitching produk. Tanya proses kerja terakhir mereka:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emeeting requirement terakhir → gimana?\u003c/li\u003e\n\u003cli\u003ebikin Jira terakhir → gimana?\u003c/li\u003e\n\u003cli\u003ereview PRD terakhir → gimana?\u003c/li\u003e\n\u003cli\u003esprint planning terakhir → gimana?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eMinggu 3\u003c/strong\u003e — baca bagian inti \u003cem\u003eContinuous Discovery Habits\u003c/em\u003e, terutama Opportunity Solution Tree.\nAmbil hasil interview, kelompokkan jadi opportunity. Jangan bikin fitur dulu.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMinggu 4\u003c/strong\u003e — baca \u003cem\u003eGood Services\u003c/em\u003e atau pilih beberapa metode dari \u003cem\u003eThis is Service Design Doing\u003c/em\u003e.\nGambar service journey dari satu use case: \u003cem\u003e\"meeting notes → sprint-ready backlog.\"\u003c/em\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"prinsip-di-balik-urutan-ini\"\u003ePrinsip di Balik Urutan Ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-di-balik-urutan-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eUrutan ini sengaja mulai dari \"menghentikan kebiasaan build fitur\", lalu baru \"belajar mendengar pain\", lalu \"memetakan opportunity\", lalu \"mendesain service journey\".\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau langsung service design tanpa discovery → mendesain journey dari asumsi\u003c/li\u003e\n\u003cli\u003eKalau langsung interview tanpa anti-build-trap → semua jawaban tetap diterjemahkan jadi fitur\u003c/li\u003e\n\u003cli\u003eKalau langsung MVP tanpa opportunity mapping → cepat launch tapi bisa launch hal yang salah\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"resource-pelengkap\"\u003eResource Pelengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#resource-pelengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSelain buku, kebiasaan yang perlu dibangun: baca \u003cstrong\u003epost-mortem/build log indie maker\u003c/strong\u003e. Pieter Levels dengan \"12 startups in 12 months\" adalah contoh yang sering disebut.\u003c/p\u003e\n\u003cp\u003eTapi jangan tiru permukaannya: \"cepat bikin banyak produk.\" Yang perlu ditiru adalah polanya: pilih pain kecil, scope kecil, launch cepat, ukur reaksi nyata.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat Juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — perbedaan product vs service untuk HRIS dan CRM serta produk SaaS internal\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e — ringkasan bacaan dan insight utama dari Melissa Perri\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.service-sense-and-journey-thinking\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eService Sense dan Journey Thinking: Dari Fitur Tempel ke Pengalaman yang Mengalir\u003c/a\u003e — framework 5 lapis + Moment→Promise→Path→Proof→Loop untuk membangun service sense\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct-thinking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eservice-design (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003elearning-path (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecustomer-discovery (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebuild-trap (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.service-sense-and-journey-thinking\"\u003 ics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyncMode":"noCommit","enableAutoFoldFrontmatter":false,"enableEd
