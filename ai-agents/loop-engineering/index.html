03c/span\u003e\u003c/span\u003e Memory] \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Hasil \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Manusia (Review akhir).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"komponen-utama-sistem-loop\"\u003eKomponen Utama Sistem Loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#komponen-utama-sistem-loop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk membangun loop yang efektif, dibutuhkan beberapa komponen kunci:\u003c/p\u003e\n\u003ch3 id=\"1-automations-the-heartbeat\"\u003e1. Automations (The Heartbeat)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-automations-the-heartbeat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePemicu yang membuat loop berjalan tanpa intervensi manusia. Bisa berupa cron job, webhook dari CI, atau event-based trigger. Tanpa automation, sistem ini hanyalah script sekali jalan, bukan sebuah loop.\u003c/p\u003e\n\u003ch3 id=\"2-worktrees-isolation\"\u003e2. Worktrees (Isolation)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-worktrees-isolation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenggunaan \u003ccode\u003egit worktree\u003c/code\u003e untuk memberikan setiap agent direktori kerja terpisah. Ini mencegah \u003cem\u003ecollision\u003c/em\u003e saat beberapa agent bekerja secara paralel pada repo yang sama.\u003c/p\u003e\n\u003ch3 id=\"3-skills-project-knowledge\"\u003e3. Skills (Project Knowledge)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-skills-project-knowledge\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eArtefak pengetahuan (seperti \u003ccode\u003eSKILL.md\u003c/code\u003e) yang menyimpan konvensi coding, aturan arsitektur, dan konteks proyek. Ini mencegah agent mengalami \"amnesia\" di setiap session baru dan mengurangi \u003cem\u003eintent debt\u003c/em\u003e.\u003c/p\u003e\n\u003ch3 id=\"4-connectors-mcp\"\u003e4. Connectors (MCP)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-connectors-mcp\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIntegrasi dengan tool eksternal (Issue tracker, CI, Slack) melalui Model Context Protocol (MCP). Ini mengubah agent dari sekadar penulis kode menjadi operator workflow.\u003c/p\u003e\n\u003ch3 id=\"5-sub-agents-separation-of-concerns\"\u003e5. Sub-agents (Separation of Concerns)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-sub-agents-separation-of-concerns\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePemisahan peran antara agent yang menulis kode (\u003cem\u003eImplementer\u003c/em\u003e) dan agent yang memeriksa kode (\u003cem\u003eVerifier\u003c/em\u003e). Hal ini krusial untuk menghindari bias \"self-grading\" di mana model terlalu ramah terhadap hasilnya sendiri.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVerification Strategy\u003c/strong\u003e: Verifikasi tidak boleh hanya mengandalkan model judge. Strategi verifikasi yang sehat harus bertingkat:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDeterministic Checks\u003c/strong\u003e: Menggunakan JSON schema, menjalankan test, atau validasi contract (OpenAPI). Ini adalah layer termurah dan paling reliable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModel Judge\u003c/strong\u003e: Digunakan hanya untuk penilaian semantik yang tidak bisa dicek mesin.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"6-memory-state-management\"\u003e6. Memory (State Management)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-memory-state-management\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenyimpanan state di luar context window (misal: file markdown, database, atau task list). Memory bukan sekadar fitur tambahan, melainkan fondasi utama agar loop memiliki kontinuitas lintas waktu. Tanpa memory, setiap run adalah \"one-shot\" yang tidak belajar dari kegagalan sebelumnya.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBoring State\u003c/strong\u003e: Loop yang bisa dipercaya harus mencatat \"boring state\": apa yang sudah dicoba, apa yang gagal, apa yang berubah, dan kapan manusia harus intervensi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePlumbing vs Assets\u003c/strong\u003e: Loop adalah \u003cem\u003eplumbing\u003c/em\u003e (infrastruktur eksekusi), sedangkan \u003cem\u003eskills\u003c/em\u003e adalah aset utamanya. Loop tanpa reusable skills hanya akan mengulang proses perkenalan proyek di setiap iterasi. Loop yang memanggil library skill yang teruji adalah sistem yang mampu melakukan \u003cem\u003ecompounding\u003c/em\u003e pengetahuan.\u003c/p\u003e\n\u003ch2 id=\"definisi-dan-spektrum-loop\"\u003eDefinisi dan Spektrum Loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#definisi-dan-spektrum-loop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIstilah \"loop\" sering digunakan secara ambigu. Secara operasional, loop adalah program kecil yang mem-prompt coding agent, membaca hasilnya, memutuskan apakah sudah selesai, dan melakukan prompt ulang jika belum.\u003c/p\u003e\n\u003cp\u003eLoop bukan sekadar cron job (penjadwalan), melainkan \"cron plus a decision-maker\". Nilai utamanya terletak pada kemampuan model untuk membaca state, memilih langkah berikutnya, dan memproses feedback.\u003c/p\u003e\n\u003ch3 id=\"spektrum-evolusi-loop\"\u003eSpektrum Evolusi Loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#spektrum-evolusi-loop\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLoop berkembang melalui beberapa level abstraksi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eReAct\u003c/strong\u003e: Loop akademik dasar (Reason + Act).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGoal Loops (e.g., AutoGPT)\u003c/strong\u003e: Berjalan hingga tujuan akhir tercapai.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRalph Loops\u003c/strong\u003e: Mengulang prompt dengan context anchor yang tetap.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/goal\u003c/code\u003e\u003c/strong\u003e: Loop dengan stopping condition yang eksplisit dan terverifikasi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOrchestration Loops\u003c/strong\u003e: Mengawasi dan mengoordinasikan banyak agent atau thread secara paralel.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"risiko-dan-tantangan\"\u003eRisiko dan Tantangan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-dan-tantangan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMeskipun meningkatkan leverage, Loop Engineering membawa risiko baru:\u003c/p\u003e\n\u003ch3 id=\"comprehension-debt\"\u003eComprehension Debt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#comprehension-debt\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKesenjangan antara kecepatan produksi kode oleh AI dan kecepatan pemahaman manusia terhadap kode tersebut. Jika kode dikirim lebih cepat daripada yang bisa dipahami oleh engineer, tim akan kehilangan ownership atas codebase mereka.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMitigasi\u003c/strong\u003e: Untuk mencegah hal ini, diperlukan \"comprehension engineering\", seperti ritual review yang didesain, audit architectural diff berkala, dan dokumentasi learning notes dari setiap run.\u003c/p\u003e\n\u003ch3 id=\"cognitive-surrender\"\u003eCognitive Surrender\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cognitive-surrender\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKecenderungan manusia untuk berhenti memberikan penilaian kritis dan menerima hasil AI hanya karena prosesnya terlihat otomatis dan rapi.\u003c/p\u003e\n\u003ch3 id=\"security-attack-surface\"\u003eSecurity Attack Surface\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#security-attack-surface\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLoop yang membaca input eksternal (web, issue tracker) mewarisi attack surface manusia. Setiap input adalah potensi \u003cem\u003einjection point\u003c/em\u003e. Loop yang aman membutuhkan permission minimal, sandbox, dan approval boundary untuk aksi berbahaya.\u003c/p\u003e\n\u003ch3 id=\"economics-of-loop-management\"\u003eEconomics of Loop Management\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#economics-of-loop-management\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAI menurunkan biaya produksi kode, tetapi menaikkan biaya kontrol produksi. Biaya mahal dalam Loop Engineering bukan lagi pada penulisan kode, melainkan pada:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eVerification\u003c/strong\u003e: Menjalankan test, lint, dan model judge.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGuardrails\u003c/strong\u003e: Deteksi \u003cem\u003eno-progress\u003c/em\u003e dan \u003cem\u003einfinite loop\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBudgeting\u003c/strong\u003e: Pengaturan token cap dan dollar ceiling.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCleanup\u003c/strong\u003e: Membersihkan artifact atau worktree yang gagal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eFailure Mode\u003c/strong\u003e: Loop yang tidak memiliki \u003cem\u003ehard stop\u003c/em\u003e (max iterations, budget cap) berisiko menyebabkan \u003cem\u003ebilling surprise\u003c/em\u003e dan produksi \u003cem\u003eslop\u003c/em\u003e secara masif.\u003c/p\u003e\n\u003ch2 id=\"kesimpulan-build-the-loop-stay-the-engineer\"\u003eKesimpulan: Build the Loop, Stay the Engineer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan-build-the-loop-stay-the-engineer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLoop Engineering memindahkan titik leverage dari \"kemampuan menulis prompt\" ke \"kemampuan mendesain sistem\". Namun, tanggung jawab verifikasi dan kualitas tetap berada pada manusia. Engineer harus tetap menjadi pengawal kualitas (\u003cem\u003equality gate\u003c/em\u003e) agar loop tidak menjadi mesin pembuat \u003cem\u003eslop\u003c/em\u003e (kode berkualitas rendah yang terlihat benar).\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/addyosmani/status/2064127981161959567\"\u003ehttps://x.com/addyosmani/status/2064127981161959567\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca
