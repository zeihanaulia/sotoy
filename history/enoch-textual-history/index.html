complete-book-of-enoch","id":"book-summaries.the-complete-book-of-enoch","vaultName":"vault"},"type":"backlink","position":{"start":{"line":810,"column":23,"offset":63033},"end":{"line":810,"column":62,"offset":63072},"indent":[]},"value":"notes.history.enoch-textual-history"},{"from":{"fname":"zettel.20260527122957","id":"zettel.20260527122957","vaultName":"vault"},"type":"backlink","position":{"start":{"line":9,"column":3,"offset":923},"end":{"line":9,"column":42,"offset":962},"indent":[]},"value":"notes.history.enoch-textual-history"},{"from":{"fname":"zettel.20260527123406","id":"zettel.20260527123406","vaultName":"vault"},"type":"backlink","position":{"start":{"line":8,"column":3,"offset":514},"end":{"line":8,"column":42,"offset":553},"indent":[]},"value":"notes.history.enoch-textual-history"},{"from":{"fname":"daily.journal.2026.05.27","id":"daily.journal.2026.05.27","vaultName":"vault"},"type":"backlink","position":{"start":{"line":51,"column":3,"offset":4731},"end":{"line":51,"column":42,"offset":4770},"indent":[]},"value":"notes.history.enoch-textual-history"}],"anchors":{"lapisan-teks-enoch-yang-harus-dipisah":{"type":"header","text":"Lapisan teks Enoch yang harus dipisah","value":"lapisan-teks-enoch-yang-harus-dipisah","line":19,"column":0,"depth":2},"posisi-aman-yang-gue-pegang":{"type":"header","text":"Posisi aman yang gue pegang","value":"posisi-aman-yang-gue-pegang","line":27,"column":0,"depth":2},"distorsi-dan-lapisan-kepercayaan":{"type":"header","text":"Distorsi dan lapisan kepercayaan","value":"distorsi-dan-lapisan-kepercayaan","line":31,"column":0,"depth":2},"about-the-book-of-enoch-sebagai-pengantar-editorial":{"type":"header","text":"About the Book of Enoch sebagai pengantar editorial","value":"about-the-book-of-enoch-sebagai-pengantar-editorial","line":35,"column":0,"depth":2},"lapisan-kepercayaan":{"type":"header","text":"Lapisan kepercayaan","value":"lapisan-kepercayaan","line":51,"column":0,"depth":2},"manuskrip-utama-yang-gue-catat":{"type":"header","text":"Manuskrip utama yang gue catat","value":"manuskrip-utama-yang-gue-catat","line":61,"column":0,"depth":2},"yang-paling-penting-buat-gue":{"type":"header","text":"Yang paling penting buat gue","value":"yang-paling-penting-buat-gue","line":77,"column":0,"depth":2},"kenapa-ini-penting-buat-baca-enoch":{"type":"header","text":"Kenapa ini penting buat baca Enoch","value":"kenapa-ini-penting-buat-baca-enoch","line":84,"column":0,"depth":2}},"children":[],"parent":"jrhfmtz8h28gr40vj06cxnn","data":{}},"body":"\u003ch1 id=\"enoch-textual-history-manuskrip-dan-tradisi\"\u003eEnoch textual history: manuskrip dan tradisi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#enoch-textual-history-manuskrip-dan-tradisi\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eGue nulis ini karena baca \u003cem\u003eThe Complete Book of Enoch\u003c/em\u003e oleh Jay Winter dan langsung kepikiran: jangan anggap buku itu sebagai naskah asli tunggal. Ada tiga lapisan penting yang harus gue ingat ketika bicara tentang Enoch.\u003c/p\u003e\n\u003ch2 id=\"lapisan-teks-enoch-yang-harus-dipisah\"\u003eLapisan teks Enoch yang harus dipisah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapisan-teks-enoch-yang-harus-dipisah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eBuku yang gue pegang\u003c/strong\u003e: edisi modern, terjemahan Inggris, sudah diedit sesuai pembaca kontemporer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTeks Enoch sebagai tradisi kuno\u003c/strong\u003e: kumpulan literatur Enochic yang beredar di Yudea/Syria dari abad kedua SM sampai abad pertama M.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNaskah sumber/manuskrip\u003c/strong\u003e: material fisik yang sekarang tersedia, biasanya berupa fragmen.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau lo langsung gabung ketiganya, bahasanya jadi salah. Ini mirip begini: lo punya kode yang dibuild ulang, commit yang disalin ulang, dan fork yang ditulis ulang. Yang paling tua belum tentu paling lengkap.\u003c/p\u003e\n\u003ch2 id=\"posisi-aman-yang-gue-pegang\"\u003ePosisi aman yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#posisi-aman-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling aman adalah bilang: teks modern Enoch bukan ciptaan penemu atau editor baru dari nol, tetapi juga bukan salinan 1:1 dari naskah asli pertama. Kita tidak punya autograph asli. Yang ada adalah saksi-saksi teks: fragmen Aramaic Dead Sea Scrolls, potongan Greek/Latin, dan versi lengkap dalam Ethiopic/Ge'ez. Di tengahnya ada keputusan editorial, mulai dari memilih bacaan, menyusun bagian, hingga memberi judul modern.\u003c/p\u003e\n\u003ch2 id=\"distorsi-dan-lapisan-kepercayaan\"\u003eDistorsi dan lapisan kepercayaan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#distorsi-dan-lapisan-kepercayaan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBukan semua distorsi sama. Ada pergeseran makna karena penyalinan, ada perubahan karena penerjemahan, ada pembacaan ulang yang sifatnya komunitas, dan ada framing modern yang sifatnya editorial. Larry Hurtado menaruh 1 Enoch dalam kategori composite text: beberapa bagian ditulis dalam Aramaic/Hebrew selama beberapa abad, lalu diterjemahkan ke Greek, lalu ke Ethiopic/Ge'ez antara abad ke-4 sampai ke-7 M. Itu membuat pola yang paling sehat adalah menghitung tingkat kepastian untuk setiap bagian, bukan memutuskan keseluruhan teks itu benar atau salah.\u003c/p\u003e\n\u003ch2 id=\"about-the-book-of-enoch-sebagai-pengantar-editorial\"\u003eAbout the Book of Enoch sebagai pengantar editorial\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#about-the-book-of-enoch-sebagai-pengantar-editorial\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian \"About the Book of Enoch\" dalam edisi modern ini bukan teks Enoch kuno. Ini adalah pengantar editorial yang membangun framing: Enoch sebagai kitab yang pernah dihargai, lalu ditolak, lalu ditemukan kembali. Karena itu statusnya berbeda dari Book 1: Watchers.\u003c/p\u003e\n\u003cp\u003ePenulis menaruh 1 Enoch dalam konteks \"Ethiopian Enoch\" dan membedakannya dari 2 Enoch dan 3 Enoch. Itu penting supaya kita tidak melebar ke tradisi Slavonic atau Merkavah yang berbeda.\u003c/p\u003e\n\u003cp\u003eIstilah \"apocrypha\" di sini juga bukan label teknis netral. Ia adalah alat klasifikasi otoritas. Protestant dan Catholic menggunakannya secara berbeda, dan Book of Enoch tidak otomatis masuk Deuterokanonika Katolik.\u003c/p\u003e\n\u003cp\u003eRetorika seperti \"denounced, banned, cursed, no doubt burned and shredded\" perlu dibaca hati-hati. Hilangnya Enoch di Barat bisa lebih jelas dijelaskan oleh berhentinya komunitas penyalin Barat, sementara Gereja Ethiopia tetap menyimpannya. Dari perspektif Ethiopia, Enoch tidak hilang seperti yang digambarkan Barat.\u003c/p\u003e\n\u003cp\u003eEropa \"menemukan ulang\" Enoch lewat James Bruce (1773) dan Richard Laurence (1821). Jadi ini bukan penemuan absolut, tetapi perpindahan pusat perhatian dari tradisi Ethiopia ke studi akademik Barat.\u003c/p\u003e\n\u003cp\u003ePengantar juga mengaitkan Enoch dengan Dead Sea Scrolls. Itu kuat: 4Q Enoch 150–50 BCE memberi bukti pra-Kristen untuk tradisi Enoch. Namun klaim bahwa \"Christ approved the Book of Enoch\" harus diperlakukan sebagai klaim teologis, bukan bukti historis otomatis. Jude 14–15 yang mengutip Enoch penting, tetapi itu tidak langsung menjadikan seluruh kitab sebagai kanon.\u003c/p\u003e\n\u003cp\u003eBagian akhir yang mengaitkan Enoch dengan Revelation dan dua saksi adalah spekulasi eskatologis. Baca itu sebagai interpretasi modern, bukan data manuskrip.\u003c/p\u003e\n\u003ch2 id=\"lapisan-kepercayaan\"\u003eLapisan kepercayaan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapisan-kepercayaan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue sekarang pakai empat lapisan kepercayaan saat baca Enoch:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCore ancient tradition\u003c/strong\u003e — bagian yang bisa didukung oleh saksi teks kuno seperti Qumran/Aramaic.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEthiopic preservation\u003c/strong\u003e — versi lengkap yang bertahan dalam Ge'ez, yang kita hormati sebagai tradisi pelestarian.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModern English rendering\u003c/strong\u003e — terjemahan Bahasa Inggris yang bisa membawa nuansa teologis dan kategori baru.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEditorial/popular framing\u003c/strong\u003e — judul, pembagian bab, dan susunan logis yang mungkin ditambahkan supaya teks terasa rapi untuk pembaca modern.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDengan model ini, kita bisa lebih jelas bedakan mana yang sangat kuat, mana yang masih layak dibaca sebagai tradisi, dan mana yang hanya perlu dibaca dengan skeptis.\u003c/p\u003e\n\u003ch2 id=\"manuskrip-utama-yang-gue-catat\"\u003eManuskrip utama yang gue catat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#manuskrip-utama-yang-gue-catat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEthiopic/Ge'ez\u003c/strong\u003e: versi paling lengkap yang bertahan. Ini bukan manuskrip asli, tapi versi liturgis Ethiopia yang mewariskan teks 1 Enoch secara hampir utuh.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFragmen Aramaic Qumran\u003c/strong\u003e: 4Q204, 4Q201, 4Q211. Ini bukti paling tua yang bisa kita lihat online. Mereka memberikan potongan kata, ungkapan, dan struktur yang mendekati sumber Semitik awal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBook of Giants\u003c/strong\u003e: ada fragmen seperti 4Q203, 4Q530, 4Q531. Ini bukan bagian inti standar 1 Enoch, tapi jelas bagian dari tradisi Enochic yang lebih luas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSumber online yang gue simpan sebagai referensi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q204-1\"\u003e4Q204-1, Dead Sea Scrolls\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q201-1\"\u003e4Q201-1, Dead Sea Scrolls\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q203-1\"\u003e4Q203-1 Book of Giants, Dead Sea Scrolls\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.ccel.org/c/charles/otpseudepig/enoch/ENOCH_1.HTM\"\u003eR. H. Charles, CCEL\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://archive.org/download/ethiopicversiono00charuoft/ethiopicversiono00charuoft.pdf\"\u003eR. H. Charles, Ethiopic version PDF\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://larryhurtado.wordpress.com/2019/10/06/1-enoch-an-update-on-manuscripts-and-cautionary-notes-on-usage/?utm_source=chatgpt.com\"\u003eLarry Hurtado: 1 Enoch manuscripts and cautionary notes\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.philipharland.com/Courses/Readings/4819/P%201%20Enoch%20%28password%29.pdf\"\u003eE. Isaac on 1 Enoch\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"yang-paling-penting-buat-gue\"\u003eYang paling penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yang-paling-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e\"Asli\" jarang berarti lengkap\u003c/strong\u003e. Yang paling tua biasanya fragmen; yang paling lengkap biasanya versi yang lebih muda.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKesinambungan teks itu rantai transmisi\u003c/strong\u003e: Aramaic → Greek/Latin → Ge'ez/Ethiopic → terjemahan modern.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCompleteness versus antiquity\u003c/strong\u003e adalah trade-off utama. Manuskrip paling tua memberi kedekatan sumber, tapi bisa fragmentaris. Manuskrip paling lengkap memberi alur narasi, tapi sudah melewati editorial dan tradisi liturgis.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEdisi populer sering punya framing editorial\u003c/strong\u003e. Contoh: judul book Winter seperti \u003cem\u003eKingdom of Heaven\u003c/em\u003e mungkin nggak ada di struktur akademik langsung, tapi berfungsi memberi pembaca modern tema yang mudah dicerna.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting-buat-baca-enoch\"\u003eKenapa ini penting buat baca Enoch\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-baca-enoch\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJika tujuan lo adalah memahami isi, versi populer seperti Winter bisa jadi entry point yang layak. Kalau tujuan lo adalah melacak asal-usul teks, versi populer cuma titik awal.\u003c/p\u003e\n\u003cp\u003eItu juga alasan kenapa malasku sama gagasan \"ini naskah asli\". Bukan karena teksnya salah, tapi karena kita harus hati-hati menentukan: ini versi peta modern, versi tradisi Ethiopia, atau fragmen kuno yang paling dekat dengan sumber.\u003c/p\u003e\n\u003cp\u003eUntuk itu, gue taruh catatan ini sebagai landasan sebelum masuk ke pembacaan lebih detail di \u003ca href=\"/sotoy/notes/book-summaries.the-complete-book-of-enoch\"\u003eThe Complete Book of Enoch\u003c/a\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehistory (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eenoch (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etextual-history (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-complete-book-of-enoch\"\u003eThe Complete Book of Enoch\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527122957\"\u003eBaca Book of Enoch sebagai arsip berlapis, bukan teks tunggal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527123406\"\u003eAbout the Book of Enoch adalah pengantar editorial, bukan teks inti\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.27\"\u003e2026-05-27\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWel
