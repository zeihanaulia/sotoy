/strong\u003e: Berubah menjadi \u003cem\u003egrandiosity\u003c/em\u003e. Merasa semua orang harus mengikuti ritmenya, menganggap kritik sebagai penghambat, dan mengaitkan semua keberhasilan hanya pada dirinya sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"risk--mitigation\"\u003eRisk \u0026#x26; Mitigation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risk--mitigation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRisiko\u003c/strong\u003e: Fantasi superioritas yang terlalu besar dibanding kapasitas nyata.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObat Sosial\u003c/strong\u003e: Membutuhkan \u003cem\u003ereality check\u003c/em\u003e, akuntabilitas, data, dan feedback yang jujur.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Agentik = energi ekspansi diri. Sehat kalau dikawal realitas; rusak kalau berubah jadi fantasi superioritas.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.trifurcated-model-narcissism\"\u003eTrifurcated Model of Narcissism\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enpd (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003
