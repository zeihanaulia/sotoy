h-konkret-query-database-di-loop","line":98,"column":0,"depth":2},"related":{"type":"header","text":"Related","value":"related","line":122,"column":0,"depth":2},"ubah-jadi-harness":{"type":"header","text":"Ubah jadi harness","value":"ubah-jadi-harness","line":129,"column":0,"depth":3},"contoh-lain-authz-migration-dependency":{"type":"header","text":"Contoh lain: authz, migration, dependency","value":"contoh-lain-authz-migration-dependency","line":233,"column":0,"depth":2},"authz":{"type":"header","text":"Authz","value":"authz","line":235,"column":0,"depth":3},"migration":{"type":"header","text":"Migration","value":"migration","line":256,"column":0,"depth":3},"dependency":{"type":"header","text":"Dependency","value":"dependency","line":277,"column":0,"depth":3},"batasannya":{"type":"header","text":"Batasannya","value":"batasannya","line":297,"column":0,"depth":2},"workflow-senior-yang-berubah":{"type":"header","text":"Workflow senior yang berubah","value":"workflow-senior-yang-berubah","line":312,"column":0,"depth":2},"insight":{"type":"header","text":"Insight","value":"insight","line":328,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":335,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"senior-judgement-yang-dipindahkan-ke-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#senior-judgement-yang-dipindahkan-ke-harness\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue pakai \"judgement\" di sini sebagai keputusan teknis berbasis pengalaman: kapan query dianggap berbahaya, kapan desain dianggap rapuh, kapan perubahan butuh test, kapan perlu eskalasi manusia.\u003c/p\u003e\n\u003cp\u003eSenior engineer yang bagus bukan cuma komentar \"ini salah, benerin.\" Dia tanya: kenapa agent bisa mengulang kesalahan ini, dan bagian mana dari sistem yang harus diubah agar kesalahan ini tidak muncul lagi?\u003c/p\u003e\n\u003ch2 id=\"apa-itu-judgement-senior\"\u003eApa itu judgement senior?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-judgement-senior\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJudgement senior biasanya muncul dalam komentar review singkat seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Ini bakal N+1 query.\"\u003c/li\u003e\n\u003cli\u003e\"Jangan taruh business logic di controller.\"\u003c/li\u003e\n\u003cli\u003e\"Migration ini riskan, rollback-nya mana?\"\u003c/li\u003e\n\u003cli\u003e\"Ini harus idempotent.\"\u003c/li\u003e\n\u003cli\u003e\"Authz check-nya hilang.\"\u003c/li\u003e\n\u003cli\u003e\"Jangan catch error lalu diam.\"\u003c/li\u003e\n\u003cli\u003e\"Ini perlu test regresi.\"\u003c/li\u003e\n\u003cli\u003e\"Ini akan lambat kalau datanya 1 juta row.\"\u003c/li\u003e\n\u003cli\u003e\"Nama function ini nyembunyiin intent.\"\u003c/li\u003e\n\u003cli\u003e\"Ini coupling-nya bikin susah diubah.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKomentar itu singkat, tapi isinya judgement yang lahir dari pengalaman incident, latency spike, data corruption, security bug, atau maintainability buruk.\u003c/p\u003e\n\u003cp\u003eKalau judgement itu tetap tinggal di review comment, agent dan junior akan mengulang. Reviewer jadi bottleneck. Maka kita perlu turunkan judgement ini menjadi sistem.\u003c/p\u003e\n\u003ch2 id=\"review-comment-yang-berulang--sinyal-harness-belum-lengkap\"\u003eReview comment yang berulang = sinyal harness belum lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#review-comment-yang-berulang--sinyal-harness-belum-lengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAtomic idea: review comment yang berulang adalah sinyal bahwa ada rule/harness yang belum dibuat.\u003c/p\u003e\n\u003cp\u003eTransformasi dasarnya:\u003c/p\u003e\n\u003cp\u003eReview comment → prinsip → rule → contoh → check → feedback loop.\u003c/p\u003e\n\u003cp\u003eContoh singkat:\u003c/p\u003e\n\u003cp\u003eReview comment:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Jangan query database di dalam loop.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePrinsip:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003equery di loop bisa menyebabkan N+1, latency linear, dan beban database.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRule:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejika memproses koleksi entity, jangan panggil repository/database per item. Gunakan bulk query, join, eager loading, batching, atau prefetch.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebad: \u003ccode\u003efor each user: query orders\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003egood: \u003ccode\u003equery orders dengan WHERE IN(...) lalu group di memory\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCheck:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etest jumlah query.\u003c/li\u003e\n\u003cli\u003estatic analysis cari repository call di dalam loop.\u003c/li\u003e\n\u003cli\u003eagent review scan pola N+1.\u003c/li\u003e\n\u003cli\u003eCI gagal jika query count \u003e threshold.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFeedback loop:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau agent masih salah, update skill file dengan kasus nyata baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kapan-pakai-rule-skill-linter-test-gate\"\u003eKapan pakai rule, skill, linter, test, gate?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-pakai-rule-skill-linter-test-gate\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni penting biar harness tidak berantakan.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecocok untuk aturan pendek, universal, selalu relevan.\u003c/li\u003e\n\u003cli\u003econtoh: \"Do not introduce database calls inside loops. Prefer bulk fetch, batching, eager loading, or query joins.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eskill file\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecocok untuk aturan yang butuh penjelasan, contoh, dan prosedur.\u003c/li\u003e\n\u003cli\u003econtoh: \u003ccode\u003eskills/database-performance.md\u003c/code\u003e berisi apa itu N+1, kapan muncul, contoh baik/buruk, cara deteksi, checklist PR.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003elinter / static analysis\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecocok untuk pola mekanis yang bisa dikenali oleh mesin.\u003c/li\u003e\n\u003cli\u003econtoh: repository call dalam \u003ccode\u003efor\u003c/code\u003e, \u003ccode\u003emap\u003c/code\u003e, \u003ccode\u003eforEach\u003c/code\u003e; raw SQL interpolation; endpoint tanpa auth middleware.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003etest\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecocok untuk behavior yang perlu dibuktikan.\u003c/li\u003e\n\u003cli\u003econtoh: query count maksimal 2 untuk endpoint list, API tetap cepat untuk 1.000 record, migration rollback, authz failure.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eCI gate\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecocok untuk aturan yang tidak boleh dilanggar sebelum merge.\u003c/li\u003e\n\u003cli\u003econtoh: typecheck, lint, security scan, critical vulnerability, migration validation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea: rule jelaskan niat; skill ajarkan cara; linter tangkap pola; test buktikan behavior; CI paksa disiplin.\u003c/p\u003e\n\u003ch2 id=\"contoh-konkret-query-database-di-loop\"\u003eContoh konkret: query database di loop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-konkret-query-database-di-loop\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent sering bikin kode seperti ini:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUsersWithOrders\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estring\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e result \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003efor\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e userId \u003cspan class=\"token keyword\"\u003eof\u003c/span\u003e userIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e user \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e userRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindById\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserId\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e orders \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e orderRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserId\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n    result\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epush\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n      user\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      orders\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003ereturn\u003c/span\u003e result\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau ada 500 user, ini bisa jadi 1.000 query. Di dev kecil aman, di produksi bisa jadi lambat parah.\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.gitlab-mr-comment-formatting\"\u003eCloud Agent Hands-on: MR Comment Formatting\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"ubah-jadi-harness\"\u003eUbah jadi harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ubah-jadi-harness\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Database performance rules\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Never perform database or repository calls inside loops over collections.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Prefer bulk queries, joins, eager loading, batching, or prefetching.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e If a looped query is unavoidable, explain why and add a regression test for query count or performance.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill file: \u003ccode\u003eskills/database-performance.md\u003c/code\u003e\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Database Performance Skill\u003c/span\u003e\n\nUse this skill when changing repository, ORM, query, serializer, list endpoint, or data-loading code.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Core rule\u003c/span\u003e\n\nAvoid N+1 queries. A code path that handles N items should not execute O(N) database queries unless explicitly justified.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Bad pattern\u003c/span\u003e\n\nCalling repository/database methods inside:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e for / while loops\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e map / forEach callbacks\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e serializers\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e template rendering loops\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e GraphQL field resolvers without batching\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Better patterns\u003c/span\u003e\n\nPrefer:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e bulk fetch with WHERE IN\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e joins\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e eager loading\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e dataloader/batching\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e precomputed lookup maps\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e pagination\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e query-level aggregation\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Before completing the task\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e1.\u003c/span\u003e Search changed files for database calls inside loops.\n\u003cspan class=\"token list punctuation\"\u003e2.\u003c/span\u003e Check list endpoints and serializers.\n\u003cspan class=\"token list punctuation\"\u003e3.\u003c/span\u003e Add or update a test that protects query count when possible.\n\u003cspan class=\"token list punctuation\"\u003e4.\u003c/span\u003e Report expected number of queries for the main path.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePerbaikan kode:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUsersWithOrders\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estring\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e users \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e userRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e orders \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e orderRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e ordersByUserId \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword\"\u003enew\u003c/span\u003e \u003cspan class=\"token class-name\"\u003e\u003cspan class=\"token known-class-name class-name\"\u003eMap\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u0026#x3C;\u003c/span\u003e\u003cspan class=\"token builtin\"\u003estring\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token maybe-class-name\"\u003eOrder\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003efor\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e order \u003cspan class=\"token keyword\"\u003eof\u003c/span\u003e orders\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e existing \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e ordersByUserId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eorder\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003euserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n    existing\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epush\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eorder\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    ordersByUserId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eset\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eorder\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003euserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e existing\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003ereturn\u003c/span\u003e users\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003emap\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    user\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    orders\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e ordersByUserId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-ac  punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUsersWithOrders\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003egetSeededUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token function\"\u003eexpect\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003equeryCounter\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003ecount\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003etoBeLessThanOrEqual\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token number\"\u003e3\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eStatic check sensor:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSemgrep rule untuk repository call dalam loop\u003c/li\u003e\n\u003cli\u003equery count regression test\u003c/li\u003e\n\u003cli\u003eCI yang menjalankan scan + test\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePR template:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Database impact\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [ ] This change does not introduce database calls inside loops\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [ ] Query count is bounded for list/bulk paths\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [ ] Bulk loading, batching, or eager loading is used where needed\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e [ ] If an exception exists, it is explained below\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"contoh-lain-authz-migration-dependency\"\u003eContoh lain: authz, migration, dependency\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-lain-authz-migration-dependency\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"authz\"\u003eAuthz\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#authz\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eReview comment:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Endpoint ini cuma cek authentication, belum cek authorization.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHarness:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003eAll write endpoints must check both authentication and authorization. Authentication alone is not sufficient.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill: \u003ccode\u003eskills/authz-review.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eTest:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003euser A tidak boleh update resource milik user B.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCI:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eauthz tests wajib jalan untuk semua write endpoint.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"migration\"\u003eMigration\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#migration\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eReview comment:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Migration ini tidak aman untuk table besar.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHarness:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003eDatabase migrations on large tables must be backward-compatible, non-blocking, and have rollback strategy.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill: \u003ccode\u003eskills/safe-migration.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eCheck:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emigration dry-run\u003c/li\u003e\n\u003cli\u003erollback test\u003c/li\u003e\n\u003cli\u003eno table lock check\u003c/li\u003e\n\u003cli\u003ehuman approval for destructive migration\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"dependency\"\u003eDependency\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dependency\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eReview comment:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Kenapa nambah library baru untuk fungsi kecil?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHarness:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003eDo not add new runtime dependencies without justification. Prefer existing utilities or standard library for small tasks.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill: \u003ccode\u003eskills/dependency-review.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eCI:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOSV scanner\u003c/li\u003e\n\u003cli\u003elicense checker\u003c/li\u003e\n\u003cli\u003ebundle size check\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"batasannya\"\u003eBatasannya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batasannya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTidak semua judgement bisa diautomasi.\u003c/p\u003e\n\u003cp\u003eYang tetap manusia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etrade-off performa vs complexity untuk bisnis ini\u003c/li\u003e\n\u003cli\u003eapakah perubahan domain model sesuai strategi produk\u003c/li\u003e\n\u003cli\u003eapakah breaking change bisa diterima pelanggan\u003c/li\u003e\n\u003cli\u003eapakah data retention policy cocok dengan regulasi\u003c/li\u003e\n\u003cli\u003eapakah desain ini terlalu kompleks untuk ukuran tim\u003c/li\u003e\n\u003cli\u003eapakah risiko security ini acceptable atau harus stop release\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHarness membantu menyiapkan evidence, tetapi keputusan akhir tetap manusia.\u003c/p\u003e\n\u003ch2 id=\"workflow-senior-yang-berubah\"\u003eWorkflow senior yang berubah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workflow-senior-yang-berubah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDulu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esenior review PR\u003c/li\u003e\n\u003cli\u003esenior komentar sama berkali-kali\u003c/li\u003e\n\u003cli\u003esenior jadi bottleneck\u003c/li\u003e\n\u003cli\u003eknowledge tetap di kepala senior\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSekarang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esenior lihat pola kesalahan\u003c/li\u003e\n\u003cli\u003esenior putuskan rule skill test gate mana yang dibutuhkan\u003c/li\u003e\n\u003cli\u003esenior perbaiki harness\u003c/li\u003e\n\u003cli\u003eagent/junior belajar dari harness\u003c/li\u003e\n\u003cli\u003ereview berikutnya lebih ringan\u003c/li\u003e\n\u003cli\u003eknowledge jadi reusable\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003
