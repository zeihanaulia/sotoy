"type":"header","text":"Greenfield","value":"greenfield","line":56,"column":0,"depth":3},"brownfield":{"type":"header","text":"Brownfield","value":"brownfield","line":62,"column":0,"depth":3},"risiko-over-my-skis":{"type":"header","text":"Risiko \"over my skis\"","value":"risiko-over-my-skis","line":75,"column":0,"depth":2},"testing-sebagai-rem":{"type":"header","text":"Testing sebagai rem","value":"testing-sebagai-rem","line":87,"column":0,"depth":2},"sosial-solo-vs-team":{"type":"header","text":"Sosial: solo vs team","value":"sosial-solo-vs-team","line":95,"column":0,"depth":2},"hubungan-dengan-martin-fowler":{"type":"header","text":"Hubungan dengan Martin Fowler","value":"hubungan-dengan-martin-fowler","line":110,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":119,"column":0,"depth":2}},"children":[],"parent":"notes.prompt-engineering","data":{}},"body":"\u003ch1 id=\"harper-reed-llm-codegen-workflow\"\u003eHarper Reed: LLM codegen workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#harper-reed-llm-codegen-workflow\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"workflow-utama\"\u003eWorkflow utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workflow-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHarper Reed menggambarkan workflow LLM codegen sebagai rangkaian eksplisit: brainstorming → spec → plan → execution → test/iterate. Ini bukan sekadar \"chatbot bikin kode sekali jadi\"; ini disiplin engineering yang membuat AI bekerja di rel kecil.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"https://harper.blog/2025/02/16/my-llm-codegen-workflow-atm/\"\u003ehttps://harper.blog/2025/02/16/my-llm-codegen-workflow-atm/\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eSecara praktis, tahapannya adalah:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ebrainstorm/spec: LLM bertanya satu per satu sampai requirement matang.\u003c/li\u003e\n\u003cli\u003ecompile spec: hasil percakapan dirapikan menjadi \u003ccode\u003espec.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eplanning: spec diberi ke reasoning model untuk membuat blueprint dan \u003ccode\u003eprompt_plan.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003etodo/checklist: progress disimpan agar state tidak hilang.\u003c/li\u003e\n\u003cli\u003eexecution: codegen dijalankan di tool seperti Claude, Aider, Cursor.\u003c/li\u003e\n\u003cli\u003etest/iterate: hasil diuji dan diperbaiki sebelum lanjut.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kenapa-mulai-dari-brainstormingspec\"\u003eKenapa mulai dari brainstorming/spec?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-mulai-dari-brainstormingspec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena ide mentah biasanya tidak cukup tajam untuk dieksekusi. Jika hanya bilang \"buatkan app habit tracker\", LLM akan mengisi banyak asumsi sembarangan.\u003c/p\u003e\n\u003cp\u003eHarper menghindari itu dengan meminta LLM menanyakan detail secara bertahap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah habit harian atau fleksibel?\u003c/li\u003e\n\u003cli\u003eapakah user membutuhkan streak?\u003c/li\u003e\n\u003cli\u003edata disimpan lokal atau cloud?\u003c/li\u003e\n\u003cli\u003ekapan fitur reminder diperlukan?\u003c/li\u003e\n\u003cli\u003ebagaimana perilaku skip hari?\u003c/li\u003e\n\u003cli\u003eseperti apa UI/UX yang diharapkan?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSpec menjadi alat untuk mengurangi tebakan, bukan dokumen administratif.\u003c/p\u003e\n\u003ch2 id=\"mengapa-planning-dipisah-dari-execution\"\u003eMengapa planning dipisah dari execution?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-planning-dipisah-dari-execution\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHarper menekankan bahwa task besar harus dipecah menjadi chunk kecil yang aman untuk dieksekusi dan diuji.\u003c/p\u003e\n\u003cp\u003eIa meminta model untuk membuat blueprint yang rinci, lalu membagi blueprint tersebut menjadi langkah-langkah kecil. Dengan cara ini, LLM tidak lagi diminta mengubah banyak file sekaligus tanpa kontrol.\u003c/p\u003e\n\u003cp\u003eIni mencegah kegagalan mode \"build the whole app\" di mana sebuah prompt besar menghasilkan perubahan luas yang sulit diaudit.\u003c/p\u003e\n\u003ch2 id=\"greenfield-vs-brownfield\"\u003eGreenfield vs brownfield\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#greenfield-vs-brownfield\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"greenfield\"\u003eGreenfield\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#greenfield\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk proyek baru, workflow Harper sangat planning-heavy. Ia mulai dari ide, lalu buat spec, plan, todo, dan eksekusi incremental.\u003c/p\u003e\n\u003cp\u003eSpec juga bisa dipakai untuk hal lain: white paper, business model, atau riset lebih dalam. Ini menunjukkan bahwa spec adalah artefak pusat.\u003c/p\u003e\n\u003ch3 id=\"brownfield\"\u003eBrownfield\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#brownfield\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk codebase yang sudah ada, fokusnya bergeser ke context extraction per task.\u003c/p\u003e\n\u003cp\u003eHarper menggunakan repomix untuk membuat bundle \u003ccode\u003eoutput.txt\u003c/code\u003e dari repo, lalu memberikannya ke LLM. Ia menghindari mindset \"LLM refactor seluruh repo\" dan lebih memilih improvement kecil:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egenerate code review,\u003c/li\u003e\n\u003cli\u003etemukan missing tests,\u003c/li\u003e\n\u003cli\u003ebuat GitHub issue,\u003c/li\u003e\n\u003cli\u003eimplementasi satu issue kecil,\u003c/li\u003e\n\u003cli\u003ejalankan tests,\u003c/li\u003e\n\u003cli\u003eulangi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"risiko-over-my-skis\"\u003eRisiko \"over my skis\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-over-my-skis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHarper menulis bahwa AI coding bisa membuat kita bergerak terlalu cepat sampai kehilangan kontrol:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekode dibuat terus,\u003c/li\u003e\n\u003cli\u003epemahaman manusia tertinggal,\u003c/li\u003e\n\u003cli\u003etiba-tiba ada file yang tidak jelas asalnya,\u003c/li\u003e\n\u003cli\u003earchitecture berubah tanpa disadari,\u003c/li\u003e\n\u003cli\u003edependency ditambah tanpa alasan yang kuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSolusinya bukan menghindari LLM, melainkan memberi rem engineering: step kecil, dokumentasi, testing, dan review yang disiplin.\u003c/p\u003e\n\u003ch2 id=\"testing-sebagai-rem\"\u003eTesting sebagai rem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#testing-sebagai-rem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTesting di workflow ini bukan aksesori. Ia adalah kontrol objektif.\u003c/p\u003e\n\u003cp\u003eHarper meminta setiap step cukup kecil untuk diimplementasikan dengan testing yang kuat. Ini mencegah \"perasaan sudah maju\" ketika sebenarnya bug menumpuk.\u003c/p\u003e\n\u003cp\u003eTanpa testing, AI coding bisa terasa cepat tetapi mudah menghasilkan utang teknis besar.\u003c/p\u003e\n\u003ch2 id=\"sosial-solo-vs-team\"\u003eSosial: solo vs team\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sosial-solo-vs-team\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHarper mengkritik bahwa workflow AI coding saat ini masih banyak bersifat solo. Antarmuka dan prosesnya cenderung single-player.\u003c/p\u003e\n\u003cp\u003eDalam tim, masalahnya muncul di:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebot yang bertabrakan,\u003c/li\u003e\n\u003cli\u003ekonflik merge,\u003c/li\u003e\n\u003cli\u003ekonteks yang berbeda antar orang,\u003c/li\u003e\n\u003cli\u003ehistory decision tersebar di chat,\u003c/li\u003e\n\u003cli\u003ereviewer tidak tahu alasan perubahan,\u003c/li\u003e\n\u003cli\u003eprompt dan issue tidak terhubung ke PR.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAI coding efektif bukan hanya soal model. Ini soal collaboration protocol: bagaimana tim menyimpan spec, prompt, todo, review, dan test agar bisa dimainkan bersama.\u003c/p\u003e\n\u003ch2 id=\"hubungan-dengan-martin-fowler\"\u003eHubungan dengan Martin Fowler\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan-dengan-martin-fowler\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHarper adalah implementasi praktis dari gagasan Fowler tentang Interrogatory LLM.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFowler: LLM sebagai pewawancara untuk menggali konteks.\u003c/li\u003e\n\u003cli\u003eHarper: gunakan konteks itu untuk membuat \u003ccode\u003espec.md\u003c/code\u003e, \u003ccode\u003eprompt_plan.md\u003c/code\u003e, dan \u003ccode\u003etodo.md\u003c/code\u003e, lalu eksekusi incremental.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara ini, proses codegen menjadi pipeline artefak yang dapat diwariskan antar tahap dan bukan sekadar prompt sekali tembak.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering\"\u003ePrompt Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.ai.interrogatory-llm-context-elicitation\"\u003eInterrogatory LLM adalah cara membuat prompt lewat wawancara konteks\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=
