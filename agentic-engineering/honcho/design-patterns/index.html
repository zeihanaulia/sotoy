ue":"13-observe_me-kapan-dimatikan","line":585,"column":0,"depth":2},"14-kapan-observe_me-tetap-aktif":{"type":"header","text":"14. Kapan observe_me tetap aktif?","value":"14-kapan-observe_me-tetap-aktif","line":626,"column":0,"depth":2},"15-observe_others-kapan-dipakai":{"type":"header","text":"15. observe_others: kapan dipakai?","value":"15-observe_others-kapan-dipakai","line":645,"column":0,"depth":2},"16-jangan-nyalakan-observe_others-sembarangan":{"type":"header","text":"16. Jangan nyalakan observe_others sembarangan","value":"16-jangan-nyalakan-observe_others-sembarangan","line":677,"column":0,"depth":2},"17-common-mistakes-bedah-satu-satu":{"type":"header","text":"17. Common mistakes: bedah satu-satu","value":"17-common-mistakes-bedah-satu-satu","line":709,"column":0,"depth":2},"mistake-1-splitting-one-identity-across-peer-ids":{"type":"header","text":"Mistake 1: Splitting one identity across peer IDs","value":"mistake-1-splitting-one-identity-across-peer-ids","line":711,"column":0,"depth":3},"mistake-2-too-many-tiny-sessions":{"type":"header","text":"Mistake 2: Too many tiny sessions","value":"mistake-2-too-many-tiny-sessions","line":733,"column":0,"depth":3},"mistake-3-separating-agents-that-should-collaborate":{"type":"header","text":"Mistake 3: Separating agents that should collaborate","value":"mistake-3-separating-agents-that-should-collaborate","line":754,"column":0,"depth":3},"mistake-4-leaving-observe_me-on-for-assistants":{"type":"header","text":"Mistake 4: Leaving observe_me on for assistants","value":"mistake-4-leaving-observe_me-on-for-assistants","line":775,"column":0,"depth":3},"mistake-5-turning-on-observe_others-everywhere":{"type":"header","text":"Mistake 5: Turning on observe_others everywhere","value":"mistake-5-turning-on-observe_others-everywhere","line":791,"column":0,"depth":3},"mistake-6-forgetting-peer_target":{"type":"header","text":"Mistake 6: Forgetting peer_target","value":"mistake-6-forgetting-peer_target","line":807,"column":0,"depth":3}},"children":[],"parent":"r970j7o3cwojzrfs80avkt5","data":{}},"body":"\u003ch1 id=\"honcho-design-patterns\"\u003eHoncho Design Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#honcho-design-patterns\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eArti yang gue pakai: \u003cstrong\u003e“design pattern” di page ini = pola desain praktis untuk memetakan aplikasi nyata ke struktur Honcho: workspace, peer, session, observe_me, observe_others, dan cross-session context\u003c/strong\u003e. Bukan design pattern klasik software seperti Factory, Observer, Strategy.\u003c/p\u003e\n\u003cp\u003eIstilah yang perlu dikunci dulu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“Workspace” = batas isolasi keras. Kalau beda workspace, memory tidak saling campur.\u003c/li\u003e\n\u003cli\u003e“Peer” = entitas persisten yang ingin diberi identitas dan bisa direasoning: user, agent, customer, student, NPC.\u003c/li\u003e\n\u003cli\u003e“Session” = konteks interaksi aktif: chat thread, channel, support ticket, project, import batch.\u003c/li\u003e\n\u003cli\u003e“observe_me” = Honcho membangun representation tentang peer itu sendiri.\u003c/li\u003e\n\u003cli\u003e“observe_others” = peer membangun representation tentang peer lain berdasarkan interaksi yang ia saksikan.\u003c/li\u003e\n\u003cli\u003e“peer_target” = cara membuat \u003ccode\u003esession.context()\u003c/code\u003e memasukkan memory lintas sesi dari peer tertentu, bukan cuma konteks session lokal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"1-pertanyaan-kunci\"\u003e1. Pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda 7 pertanyaan inti dari page ini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKapan bikin workspace baru?\u003c/li\u003e\n\u003cli\u003eKapan beberapa agent harus berbagi workspace?\u003c/li\u003e\n\u003cli\u003eSiapa yang harus dijadikan peer?\u003c/li\u003e\n\u003cli\u003eBagaimana memilih peer ID yang benar?\u003c/li\u003e\n\u003cli\u003eSession harus diskop berdasarkan apa?\u003c/li\u003e\n\u003cli\u003eKapan pakai \u003ccode\u003eobserve_me\u003c/code\u003e dan \u003ccode\u003eobserve_others\u003c/code\u003e?\u003c/li\u003e\n\u003cli\u003eApa kesalahan desain paling sering?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nPage ini sebenarnya ngajarin satu prinsip besar: \u003cstrong\u003ememory yang bagus bukan dimulai dari retrieval, tapi dari boundary design\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKalau boundary workspace salah, memory bocor atau terfragmentasi.\nKalau peer ID salah, identitas pecah.\nKalau session terlalu kecil, reasoning tidak jalan efektif.\nKalau observation salah, agent bisa jadi terlalu tahu atau reasoning compute kebuang.\u003c/p\u003e\n\u003cp\u003eJadi “design pattern” Honcho bukan kosmetik. Ini fondasi supaya memory agent tidak jadi lumpur konteks.\n───────────────────────────────────\u003c/p\u003e\n\u003ch2 id=\"2-quick-reference-satu-kalimat-inti\"\u003e2. Quick reference: satu kalimat inti\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-quick-reference-satu-kalimat-inti\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage-nya memberi ringkasan yang sangat padat:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Workspaces isolate, peers persist, and sessions scope the active context.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kalimat paling penting di seluruh page.\u003c/p\u003e\n\u003cp\u003ePecahannya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace = memisahkan dunia\nPeer = menjaga identitas lintas waktu\nSession = membatasi konteks aktif\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau elo salah memahami tiga ini, semua desain memory jadi kacau.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace:\n\"aplikasi/customer/environment mana?\"\n\nPeer:\n\"siapa/apa entitas yang sama dari waktu ke waktu?\"\n\nSession:\n\"interaksi ini episode apa?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi sebelum mikir retrieval, embedding, atau LLM, pertanyaan desain pertama adalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eApa boundary-nya?\nApa identity-nya?\nApa episode-nya?\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"3-workspace-design-kapan-harus-dipisah\"\u003e3. Workspace design: kapan harus dipisah?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-workspace-design-kapan-harus-dipisah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWorkspace adalah \u003cstrong\u003ehard isolation boundary\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“A workspace is a hard isolation boundary.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya kalau dua hal harus benar-benar tidak saling melihat memory, pisahkan workspace.\u003c/p\u003e\n\u003cp\u003ePattern default-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSatu workspace per application.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePisah workspace hanya kalau ada boundary nyata:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebeda produk\u003c/li\u003e\n\u003cli\u003ebeda customer/tenant\u003c/li\u003e\n\u003cli\u003ebeda environment: dev/staging/prod\u003c/li\u003e\n\u003cli\u003ebeda compliance/privacy boundary\u003c/li\u003e\n\u003cli\u003ebeda agent yang memang tidak boleh saling memengaruhi memory\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh bagus:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_prod_customer_A\nworkspace_prod_customer_B\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eatau:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_my_ai_coding_app_prod\nworkspace_my_ai_coding_app_dev\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKesalahan umum: terlalu cepat memisahkan workspace.\u003c/p\u003e\n\u003cp\u003eMisalnya elo punya coding agent, writing agent, dan research agent yang semuanya membantu user yang sama dalam project yang sama. Kalau mereka dipisah workspace, mereka tidak bisa berbagi konteks.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Agents that collaborate over the same product, user, or game state belong in the same workspace so each can retrieve what the others produced.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAtomic idea-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePisahkan workspace untuk isolasi.\nSatukan workspace untuk kolaborasi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJangan kebalik.\u003c/p\u003e\n\u003ch2 id=\"4-workspace-dalam-multi-agent\"\u003e4. Workspace dalam multi-agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-workspace-dalam-multi-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau beberapa agent bekerja pada hal yang sama, mereka sebaiknya satu workspace.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace: project_alpha\n\nPeers:\n- user_raka\n- planner_agent\n- coder_agent\n- reviewer_agent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa satu workspace?\u003c/p\u003e\n\u003cp\u003eKarena planner agent bisa membuat keputusan, coder agent mengeksekusi, reviewer agent mengecek. Mereka butuh shared memory.\u003c/p\u003e\n\u003cp\u003eKalau dipisah workspace:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eplanner_agent tidak tahu keputusan coder_agent\nreviewer_agent tidak tahu konteks planner_agent\nuser harus mengulang semua konteks\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi kalau agent tidak boleh saling memengaruhi, pisahkan.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_customer_A_support\nworkspace_customer_B_support\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCustomer A tidak boleh melihat atau dipengaruhi memory Customer B.\u003c/p\u003e\n\u003cp\u003eJadi rule-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eShared state → same workspace\nHard isolation → separate workspace\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"5-peer-design-siapa-yang-harus-jadi-peer\"\u003e5. Peer design: siapa yang harus jadi peer?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-peer-design-siapa-yang-harus-jadi-peer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Any persistent participant whose messages should be attributed or reasoned about.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi peer adalah entitas yang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epunya identitas berkelanjutan\u003c/li\u003e\n\u003cli\u003emuncul di banyak interaksi\u003c/li\u003e\n\u003cli\u003emessage-nya perlu diatribusikan\u003c/li\u003e\n\u003cli\u003eperilaku/preferensinya perlu dipahami\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh peer:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eusers\nagents\nassistants\nNPCs\nstudents\ncustomers\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBisa juga entitas non-manusia kalau memang persisten:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eproject_alpha\nrepository_backend\ngame_world_state\nsupport_customer_123\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi hati-hati: jangan semua hal dijadikan peer. Kalau entitas tidak perlu dimodelkan, cukup simpan sebagai metadata atau message content.\u003c/p\u003e\n\u003cp\u003eAtomic distinction:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePeer = entitas yang ingin dipahami lintas waktu.\nMetadata = atribut pendukung.\nMessage = event/data yang terjadi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh salah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePeer:\n- button_click\n- page_view\n- notification_01\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu lebih cocok jadi message/event, bukan peer.\u003c/p\u003e\n\u003cp\u003eContoh benar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePeer:\n- user_123\n- support_agent\n- customer_account_456\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"6-peer-id-satu-entitas-satu-id-stabil\"\u003e6. Peer ID: satu entitas, satu ID stabil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-peer-id-satu-entitas-satu-id-stabil\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni salah satu poin paling praktis.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Give each real-world entity one stable peer ID and reuse it everywhere.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKenapa? Karena peer ID adalah jangkar representation.\u003c/p\u003e\n\u003cp\u003eKalau satu orang dibuat dengan banyak ID:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ealice\nalice-discord\nalice-slack\nalice-web\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho akan membangun tiga atau empat representation berbeda.\u003c/p\u003e\n\u003cp\u003eAkibatnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ememory Alice di Discord tidak nyambung ke Alice di web\nagent melihat Alice sebagai beberapa orang berbeda\ncross-session continuity rusak\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage menyebut ini sebagai common mistake:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Splitting one identity across peer IDs.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePattern yang sehat:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePeer ID utama:\nuser_12345\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLalu channel source disimpan sebagai metadata atau alias:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e{\n  \"aliases\": [\"alice\", \"alice_discord\", \"alice_slack\"],\n  \"discord_id\": \"491827364\",\n  \"slack_id\": \"U123\"\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau app multi-channel, page menyarankan prefix ID by source, misalnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ediscord_491827364\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi ini perlu dibaca hati-hati. Prefix by source bagus kalau identitas memang hanya pasti di level source. Kalau elo sudah tahu Discord user dan Slack user itu orang yang sama, lebih baik satukan ke satu stable canonical ID, lalu simpan source ID sebagai alias.\u003c/p\u003e\n\u003cp\u003eAtomic rule:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eKalau mau unified memory, satu entitas harus punya satu canonical peer ID.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"7-peer-card-dan-alias\"\u003e7. Peer card dan alias\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-peer-card-dan-alias\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut kalau peer punya banyak nama, simpan alias di peer card dengan \u003ccode\u003eset_card()\u003c/code\u003e / \u003ccode\u003esetCard()\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eIni penting karena nama manusia tidak stabil:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRaka\nraka.dev\n@raka_ai\nraka@gmail.com\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau semua jadi peer ID terpisah, memory pecah.\u003c/p\u003e\n\u003cp\u003eLebih baik:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epeer_id: user_raka_001\n\npeer_card:\nname: Raka\naliases:\n- raka.dev\n- @raka_ai\n- raka@gmail.com\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan begitu representation tetap satu, tapi Honcho tetap tahu variasi identitasnya.\u003c/p\u003e\n\u003ch2 id=\"8-session-design-session-harus-diskop-berdasarkan-apa\"\u003e8. Session design: session harus diskop berdasarkan apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-session-design-session-harus-diskop-berdasarkan-apa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSession adalah temporal boundary. Page bilang session memengaruhi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- bagaimana summaries dibuat\n- bagaimana context diambil\n- kapan reasoning fires\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi session bukan sekadar “chat id”. Session adalah keputusan desain: konteks lokal ini harus terus nyambung atau reset?\u003c/p\u003e\n\u003cp\u003ePage memberi beberapa pattern umum.\u003c/p\u003e\n\u003ch3 id=\"pattern-1-per-conversation\"\u003ePattern 1: Per-conversation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-1-per-conversation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession = setiap chat thread baru.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eChatGPT-style UI\nClaude Code thread\nsatu percakapan = satu session\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCocok kalau setiap thread punya konteks berbeda dan wajar direset.\u003c/p\u003e\n\u003ch3 id=\"pattern-2-per-channel\"\u003ePattern 2: Per-channel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-2-per-channel\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession = channel/room persistent.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDiscord channel\nSlack thread\ngroup room\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCocok kalau konteks channel memang terus akumulatif.\u003c/p\u003e\n\u003cp\u003eMisalnya channel \u003ccode\u003e#project-alpha\u003c/code\u003e berisi diskusi ongoing. Jangan bikin session baru tiap pesan, karena konteksnya harus mengalir.\u003c/p\u003e\n\u003ch3 id=\"pattern-3-per-interaction\"\u003ePattern 3: Per-interaction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-3-per-interaction\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession = satu task atau encounter yang bounded.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esupport ticket\ngame encounter\nappointment\nsales call\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCocok kalau ada awal dan akhir yang jelas.\u003c/p\u003e\n\u003ch3 id=\"pattern-4-per-project\"\u003ePattern 4: Per-project\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-4-per-project\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession = work area persisten.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecoding agent memory untuk satu repository\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCocok untuk agent coding. Satu repo bisa punya memory berkelanjutan: keputusan arsitektur, bug, test, convention, setup.\u003c/p\u003e\n\u003ch3 id=\"pattern-5-per-import\"\u003ePattern 5: Per-import\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-5-per-import\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession = batch external data.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport email\nimport dokumen\nimport meeting transcripts\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCocok kalau elo mau mengaitkan data eksternal ke peer tertentu tanpa menjadikannya chat normal.\u003c/p\u003e\n\u003ch2 id=\"9-kapan-bikin-session-baru-vs-reuse-session\"\u003e9. Kapan bikin session baru vs reuse session?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-kapan-bikin-session-baru-vs-reuse-session\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage memberi rule:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Create a new session when context resets ... reuse one when context should keep accumulating.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eTerjemahan praktis:\u003c/p\u003e\n\u003cp\u003eBikin session baru kalau:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- percakapan baru\n- topik baru\n- hari baru, kalau konteks harian penting\n- support ticket baru\n- task run baru\n- konteks lama tidak perlu dibawa secara lokal\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReuse session kalau:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- channel ongoing\n- persistent thread\n- project/repo yang sama\n- konteks lokal harus terus bertambah\n- low-volume input yang kalau dipecah terlalu kecil\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bukan sekadar rapi. Ini memengaruhi reasoning.\u003c/p\u003e\n\u003ch2 id=\"10-jangan-bikin-session-terlalu-tipis\"\u003e10. Jangan bikin session terlalu tipis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-jangan-bikin-session-terlalu-tipis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage memberi warning penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Don’t scope sessions too thin.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAlasannya: Honcho baru melakukan reasoning atas peer setelah akumulasi kira-kira \u003cstrong\u003e~1.000 token dalam satu session\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKalau elo bikin banyak session kecil:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esession_1: 80 token\nsession_2: 120 token\nsession_3: 50 token\nsession_4: 90 token\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoning bisa tertunda karena masing-masing tidak melewati threshold.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Many tiny sessions each stall below that threshold.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya data tidak hilang, tapi reasoning menunggu. Efeknya: representation lambat update.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession terlalu kecil = konteks lokal pecah + reasoning bisa stall.\nSession terlalu besar = konteks bisa terlalu campur.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi pilih boundary yang natural.\u003c/p\u003e\n\u003cp\u003eUntuk trickle inputs, misalnya user action log kecil-kecil, lebih baik append ke ongoing session daripada bikin session baru tiap event.\u003c/p\u003e\n\u003ch2 id=\"11-cross-session-reasoning-session-memory-vs-peer-memory\"\u003e11. Cross-session reasoning: session memory vs peer memory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-cross-session-reasoning-session-memory-vs-peer-memory\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bagian yang sering bikin salah paham.\u003c/p\u003e\n\u003cp\u003ePage menjelaskan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession memory = lokal ke satu interaction.\nPeer memory / representation = akumulasi lintas semua session yang melibatkan peer.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi ada dua level memory:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession-level:\n\"apa yang terjadi di episode ini?\"\n\nPeer-level:\n\"apa yang kita pahami tentang entitas ini dari semua episode?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession A:\nUser bahas sandboxing.\n\nSession B:\nUser bahas Honcho memory.\n\nSession C:\nUser bahas ekonomi Indonesia.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSession memory masing-masing tetap lokal. Tapi peer representation bisa menangkap pola lintas semuanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser likes deep structured analysis, compares systems via trade-offs, and cares about reliability.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"12-sessioncontext-dan-peer_target\"\u003e12. \u003ccode\u003esession.context()\u003c/code\u003e dan \u003ccode\u003epeer_target\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-sessioncontext-dan-peer_target\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut common mistake:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Forgetting peer_target on session context.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni krusial.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003esession.context()\u003c/code\u003e secara default mengembalikan konteks session aktif:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esummary session ini\nrecent messages session ini\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi kalau elo ingin cross-session memory, perlu menambahkan \u003ccode\u003epeer_target\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It becomes cross-session only through adding a peer_target which includes the peer representation.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eTanpa peer_target:\nambil konteks lokal session ini saja.\n\nDengan peer_target:\nambil konteks session ini + representation lintas sesi dari peer target.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser: \"lanjut yang kemarin\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau agent hanya pakai session context lokal, bisa bingung.\u003c/p\u003e\n\u003cp\u003eKalau agent pakai \u003ccode\u003epeer_target=user_raka\u003c/code\u003e, Honcho bisa memasukkan long-term representation user itu.\u003c/p\u003e\n\u003cp\u003eAtomic rule:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMau memory lintas sesi? Jangan cuma panggil session.context().\nTambahkan peer_target.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"13-observe_me-kapan-dimatikan\"\u003e13. \u003ccode\u003eobserve_me\u003c/code\u003e: kapan dimatikan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-observe_me-kapan-dimatikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Should I set observe_me: false? Yes, for deterministic peers Honcho does not need to model, like bots or tool agents.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDefault-nya \u003ccode\u003eobserve_me\u003c/code\u003e aktif. Artinya Honcho membangun representation tentang peer itu.\u003c/p\u003e\n\u003cp\u003eTapi untuk peer deterministic, sering tidak perlu.\u003c/p\u003e\n\u003cp\u003eContoh peer yang bisa \u003ccode\u003eobserve_me: false\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecalculator_tool\nweather_bot\nretrieval_bot\nstatic_assistant\nscripted_agent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa dimatikan?\u003c/p\u003e\n\u003cp\u003eKarena Honcho tidak perlu membangun model tentang sesuatu yang perilakunya sudah dikontrol dan tidak berevolusi.\u003c/p\u003e\n\u003cp\u003eKalau dibiarkan aktif:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- reasoning compute terbuang\n- representation noise bertambah\n- biaya naik\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi message dari peer itu tetap bisa disimpan agar peer lain punya session context.\u003c/p\u003e\n\u003cp\u003eIni nuance penting:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eobserve_me false ≠ jangan simpan message.\nobserve_me false = jangan reason about peer itu sebagai entitas.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"14-kapan-observe_me-tetap-aktif\"\u003e14. Kapan \u003ccode\u003eobserve_me\u003c/code\u003e tetap aktif?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-kapan-observe_me-tetap-aktif\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk peer yang berubah atau perlu dipahami.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003euser\nstudent\ncustomer\nevolving agent\ncreative assistant\nNPC dengan karakter berkembang\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau user adalah peer utama, biasanya \u003ccode\u003eobserve_me\u003c/code\u003e harus aktif.\u003c/p\u003e\n\u003cp\u003eKarena tujuan Honcho adalah membangun representation tentang user dari waktu ke waktu.\u003c/p\u003e\n\u003ch2 id=\"15-observe_others-kapan-dipakai\"\u003e15. \u003ccode\u003eobserve_others\u003c/code\u003e: kapan dipakai?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-observe_others-kapan-dipakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Do I need observe_others? Only when a peer needs its own perspective on another participant.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni tidak perlu dinyalakan semua tempat.\u003c/p\u003e\n\u003cp\u003eGunakan \u003ccode\u003eobserve_others\u003c/code\u003e kalau butuh perspektif relatif.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003egames\nmulti-agent systems\nparent/subagent workflows\ngroup chat simulation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMisalnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eBob hanya tahu Alice dari session 1 dan 2.\nCharlie hanya tahu Alice dari session 3.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMaka Bob’s representation of Alice dan Charlie’s representation of Alice harus beda.\u003c/p\u003e\n\u003cp\u003eIni penting untuk simulation realism dan trust.\u003c/p\u003e\n\u003cp\u003eKalau semua peer tahu semua hal, agent jadi omniscient.\u003c/p\u003e\n\u003ch2 id=\"16-jangan-nyalakan-observe_others-sembarangan\"\u003e16. Jangan nyalakan \u003ccode\u003eobserve_others\u003c/code\u003e sembarangan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-jangan-nyalakan-observe_others-sembarangan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCommon mistake dari page:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Turning on observe_others everywhere.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKenapa salah?\u003c/p\u003e\n\u003cp\u003eKarena directional representations kuat, tapi kompleks.\u003c/p\u003e\n\u003cp\u003eKalau setiap peer mengamati setiap peer lain, jumlah representation bisa meledak.\u003c/p\u003e\n\u003cp\u003eContoh session dengan 10 peer:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSetiap peer bisa punya representation tentang 9 peer lain.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu menambah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- compute\n- storage\n- retrieval complexity\n- risiko perspective leakage\n- maintenance cost\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi gunakan hanya kalau memang perlu “siapa tahu apa tentang siapa”.\u003c/p\u003e\n\u003cp\u003eUntuk banyak aplikasi biasa, cukup model user sebagai peer, tidak perlu setiap agent membangun representation tentang agent lain.\u003c/p\u003e\n\u003ch2 id=\"17-common-mistakes-bedah-satu-satu\"\u003e17. Common mistakes: bedah satu-satu\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-common-mistakes-bedah-satu-satu\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"mistake-1-splitting-one-identity-across-peer-ids\"\u003eMistake 1: Splitting one identity across peer IDs\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-1-splitting-one-identity-across-peer-ids\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni bikin memory pecah.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ealice\nalice-discord\nalice-cursor\nalice-web\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003euser_alice_001\naliases: alice, alice-discord, alice-cursor, alice-web\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau memang ingin unified memory, satu entitas harus satu peer.\u003c/p\u003e\n\u003ch3 id=\"mistake-2-too-many-tiny-sessions\"\u003eMistake 2: Too many tiny sessions\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-2-too-many-tiny-sessions\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni bikin local context fragmented dan reasoning bisa stall di bawah ~1.000 token.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esession per message\nsession per small event\nsession per tiny import row\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esession per ongoing channel\nsession per support ticket\nsession per project\nsession per import batch\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"mistake-3-separating-agents-that-should-collaborate\"\u003eMistake 3: Separating agents that should collaborate\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-3-separating-agents-that-should-collaborate\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau agent perlu shared product/customer/team context, taruh di workspace sama.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eplanner_workspace\ncoder_workspace\nreviewer_workspace\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003epadahal ketiganya kerja di project sama.\u003c/p\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_project_alpha\npeers: planner, coder, reviewer\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"mistake-4-leaving-observe_me-on-for-assistants\"\u003eMistake 4: Leaving observe_me on for assistants\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-4-leaving-observe_me-on-for-assistants\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau assistant deterministic dan elo tidak perlu modelnya, matikan.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eobserve_me aktif untuk calculator_bot\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eobserve_me false untuk deterministic tool agent\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"mistake-5-turning-on-observe_others-everywhere\"\u003eMistake 5: Turning on observe_others everywhere\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-5-turning-on-observe_others-everywhere\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGunakan hanya kalau butuh perspective-taking.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esemua peer mengamati semua peer lain\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ehanya peer yang butuh perspektif stateful terhadap peer lain\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"mistake-6-forgetting-peer_target\"\u003eMistake 6: Forgetting peer_target\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mistake-6-forgetting-peer_target\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau mau cross-session context tapi tidak pakai \u003ccode\u003epeer_target\u003c/code\u003e, agent cuma dapat session-local context.\u003c/p\u003e\n\u003cp\u003eSalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esession.context()\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBenar:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esession.context(peer_target=user_id)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode\u003eKonsepnya, bukan syntax presisi.\n\n### Mistake 7: Blocking on processing\n\nPage bilang messages diproses async.\n\nJangan polling atau menunggu reasoning selesai sebelum app lanjut.\n\nSalah:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003esave message\nwait until reasoning done\nthen respond\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nBenar:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003esave message\ncontinue app flow\nlet reasoning update in background\nuse available context opportunistically\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nTrade-off-nya: context terbaru mungkin belum langsung tersedia. Tapi app tetap responsif.\n\n## 18. Pattern untuk use case nyata\n\n### Use case: personal AI across tools\n\nMisalnya elo pakai Claude Code, Cursor, OpenCode, dan app sendiri.\n\nPattern:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace:\nshared_personal_workspace\u003c/p\u003e\n\u003cp\u003ePeer:\nsame user peer ID everywhere\u003c/p\u003e\n\u003cp\u003eSessions:\nper repo / per conversation / per task\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nTujuannya: unified memory.\n\nKalau tiap plugin pakai workspace dan peer ID berbeda, memory pecah.\n\n### Use case: coding agent per repository\n\nPattern:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace:\ncoding_assistant\u003c/p\u003e\n\u003cp\u003ePeers:\nuser\ncoding_agent\nrepo_project_alpha\u003c/p\u003e\n\u003cp\u003eSessions:\nper-project atau per-repo\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nKalau repo butuh memory panjang, pakai session per-project/repo. Kalau tiap task dibuat session kecil, keputusan arsitektur bisa terfragmentasi.\n\n### Use case: customer support SaaS\n\nPattern:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace:\nper tenant/customer org jika butuh isolasi keras\u003c/p\u003e\n\u003cp\u003ePeers:\ncustomer_user\nsupport_agent\nbilling_agent\u003c/p\u003e\n\u003cp\u003eSessions:\nper support ticket\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nKenapa per-ticket? Karena ticket punya boundary natural.\n\nPeer representation customer tetap lintas ticket.\n\n### Use case: Discord bot komunitas\n\nPattern:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace:\ncommunity_server\u003c/p\u003e\n\u003cp\u003ePeers:\ndiscord_user_id untuk tiap member\nbot_agent\u003c/p\u003e\n\u003cp\u003eSessions:\nper-channel atau per-thread\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nKalau channel ongoing, reuse session. Kalau thread topic-specific, session per-thread.\n\n### Use case: game / NPC\n\nPattern:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace:\ngame_world\u003c/p\u003e\n\u003cp\u003ePeers:\nplayer\nNPC_A\nNPC_B\u003c/p\u003e\n\u003cp\u003eSessions:\nper encounter / per location / per scene\u003c/p\u003e\n\u003cp\u003eobserve_others:\naktif untuk NPC yang perlu punya perspektif berbeda terhadap player\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nIni salah satu kasus di mana `observe_others` masuk akal.\n\nNPC A boleh tahu sejarah dengan player. NPC B tidak boleh tahu kalau belum pernah bertemu.\n\n## 19. Linking: bagaimana design pattern nyambung ke architecture, reasoning, representation\n\nKita sambungkan semua:\n\nArchitecture memberi bentuk:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace → Peer → Session → Message\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nReasoning memproses message:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMessage → reasoning → conclusions/summaries/peer cards\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nRepresentation menyimpan hasil belajar:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eConclusions + summaries + peer cards → peer representation\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nDesign patterns memastikan input ke sistem ini tidak rusak.\n\nKalau workspace salah, isolation salah.\n\nKalau peer ID salah, representation pecah.\n\nKalau session salah, summary dan batching salah.\n\nKalau observation salah, perspective salah.\n\nKalau lupa peer_target, context retrieval salah.\n\nJadi design pattern adalah lapisan “information architecture” untuk memory.\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBad design pattern → bad memory\nBad memory → bad context\nBad context → bad agent behavior\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\n## 20. Insight penutup\n\n★ Insight ─────────────────────────\nKesalahan umum orang waktu pakai memory system adalah langsung mikir “cara retrieve-nya gimana?”\n\nDi Honcho, pertanyaan pertama harusnya:\n“Gue mau memisahkan dunia apa?” → workspace\n“Gue mau memodelkan siapa?” → peer\n“Episode interaksinya apa?” → session\n“Siapa boleh tahu apa tentang siapa?” → observation\n“Context lokal atau lintas sesi?” → peer_target\n\nKalau lima keputusan ini benar, reasoning punya bahan yang bersih. Kalau salah, model sebagus apa pun cuma akan mengolah kekacauan.\n───────────────────────────────────\n\n## 21. Korelasi dengan konsep lain\n\nKonsep pertama: **domain-driven design**.\n\nDi DDD, lo harus menentukan bounded context dan identity. Honcho mirip:\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWorkspace = bounded context / isolation boundary\nPeer = entity dengan identity\nSession = interaction aggregate / episode\nMessage = event\nRepresentation = projection/state hasil reasoning\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\nBedanya: DDD biasanya deterministic business logic. Honcho memakai reasoning model untuk membangun state interpretatif.\n\nKonsep kedua: **database schema design**.\n\nKalau schema salah, query jadi buruk. Di Honcho, kalau workspace/peer/session salah, memory retrieval juga buruk.\n\nBedanya: schema database biasanya tentang tabel dan relasi. Design pattern Honcho tentang identitas, konteks, dan perspektif.\n\nKonsep ketiga: **Zettelkasten**.\n\nZettelkasten menuntut atomic notes dan linking yang benar. Honcho menuntut atomic identity dan context boundary yang benar.\n\nBedanya: Zettelkasten idea-centric. Honcho peer-centric.\n\nKesimpulan pendeknya: **Design Patterns Honcho adalah panduan supaya memory agent tidak bocor, tidak pecah, tidak terlalu kecil, dan tidak terlalu omniscient. Prinsipnya: workspace untuk isolasi, peer untuk identitas jangka panjang, session untuk konteks aktif, observation untuk perspektif, dan peer_target untuk memory lintas sesi.**\n\n## Related documents\n\n- [[notes.agentic-engineering.honcho.architecture]]\n- [[notes.agentic-engineering.honcho.peer-representations]]\n- [[notes.agentic-engineering.honcho.reasoning]]\n- [[notes.agentic-engineering.honcho.stateful-memory]]\n\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\"
