"column":0,"depth":2},"install-orbstack":{"type":"header","text":"Install OrbStack","value":"install-orbstack","line":310,"column":0,"depth":3},"configure":{"type":"header","text":"Configure","value":"configure","line":315,"column":0,"depth":3},"test":{"type":"header","text":"Test","value":"test","line":321,"column":0,"depth":3},"references":{"type":"header","text":"References","value":"references","line":329,"column":0,"depth":2}},"children":[],"parent":"notes","data":{}},"body":"\u003ch1 id=\"orbstack-vs-docker-desktop-perbandingan-lengkap\"\u003eOrbStack vs Docker Desktop: Perbandingan Lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#orbstack-vs-docker-desktop-perbandingan-lengkap\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"orbstack-vs-docker-desktop\"\u003eOrbStack vs Docker Desktop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#orbstack-vs-docker-desktop\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eLast Updated:\u003c/strong\u003e May 11, 2026\u003cbr\u003e\n\u003cstrong\u003eIni note gue buat developer macOS yang ingin performa Docker lebih baik.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"apa-itu-orbstack\"\u003eApa itu OrbStack?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-orbstack\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOrbStack adalah alternatif modern untuk Docker Desktop, khusus dirancang untuk \u003cstrong\u003emacOS\u003c/strong\u003e. Menggunakan virtualisasi native macOS (Apple Hypervisor.framework) alih-alih Linux VM tradisional.\u003c/p\u003e\n\u003cp\u003eDari perspektif gue, ini perbandingan yang masuk akal buat lo kalau lagi mempertimbangkan migrasi dari Docker Desktop.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKey Features:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e🚀 10x lebih cepat dari Docker Desktop\u003c/li\u003e\n\u003cli\u003e💾 10x lebih hemat RAM (~500MB vs ~5GB)\u003c/li\u003e\n\u003cli\u003e⚡ Startup \u0026#x3C;1 detik\u003c/li\u003e\n\u003cli\u003e🔗 Native networking (no port forwarding)\u003c/li\u003e\n\u003cli\u003e💰 Free untuk personal use, $9/month commercial\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"perbandingan-head-to-head\"\u003ePerbandingan Head-to-Head\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#perbandingan-head-to-head\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"performance\"\u003ePerformance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#performance\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMetric\u003c/th\u003e\u003cth\u003eDocker Desktop\u003c/th\u003e\u003cth\u003eOrbStack\u003c/th\u003e\u003cth\u003eWinner\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eStartup Time\u003c/td\u003e\u003ctd\u003e30-60s\u003c/td\u003e\u003ctd\u003e\u0026#x3C;1s\u003c/td\u003e\u003ctd\u003e🏆 OrbStack (60x)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRAM Usage (idle)\u003c/td\u003e\u003ctd\u003e2-5GB\u003c/td\u003e\u003ctd\u003e200-500MB\u003c/td\u003e\u003ctd\u003e🏆 OrbStack (10x)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCPU Overhead\u003c/td\u003e\u003ctd\u003eSignifikan\u003c/td\u003e\u003ctd\u003eMinimal\u003c/td\u003e\u003ctd\u003e🏆 OrbStack\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDisk I/O\u003c/td\u003e\u003ctd\u003eSlow (virtiofs)\u003c/td\u003e\u003ctd\u003eFast (native)\u003c/td\u003e\u003ctd\u003e🏆 OrbStack (2-3x)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNetwork Latency\u003c/td\u003e\u003ctd\u003eHigher (NAT)\u003c/td\u003e\u003ctd\u003eNative\u003c/td\u003e\u003ctd\u003e🏆 OrbStack\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContainer Start\u003c/td\u003e\u003ctd\u003e2-5s\u003c/td\u003e\u003ctd\u003e\u0026#x3C;0.5s\u003c/td\u003e\u003ctd\u003e🏆 OrbStack\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eReal-world benchmarks:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Starting PostgreSQL container\u003c/span\u003e\nDocker Desktop:  \u003cspan class=\"token number\"\u003e3\u003c/span\u003e.2s\nOrbStack:        \u003cspan class=\"token number\"\u003e0\u003c/span\u003e.4s   \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e8x faster\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# npm install (large project)\u003c/span\u003e\nDocker Desktop:  45s\nOrbStack:        18s    \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token number\"\u003e2\u003c/span\u003e.5x faster\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# Dev Container boot\u003c/span\u003e\nDocker Desktop:  25s\nOrbStack:        3s     \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e8x faster\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3 id=\"architecture\"\u003eArchitecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#architecture\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003ch4 id=\"docker-desktop\"\u003eDocker Desktop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#docker-desktop\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre\u003e\u003ccode\u003e┌─────────────────┐\n│   Docker CLI    │\n└────────┬────────┘\n         │\n┌────────▼────────┐\n│  Hyperkit VM    │ ← Full Linux VM (heavyweight)\n│  (2-5GB RAM)    │\n│  ┌───────────┐  │\n│  │ Docker    │  │\n│  │ Daemon    │  │\n│  └───────────┘  │\n└─────────────────┘\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eIssues:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFull Linux VM = overhead besar\u003c/li\u003e\n\u003cli\u003eVirtualized networking = port forwarding kompleks\u003c/li\u003e\n\u003cli\u003eFile sharing via virtiofs = slow I/O\u003c/li\u003e\n\u003cli\u003eMemory pre-allocation = waste RAM\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"orbstack\"\u003eOrbStack\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#orbstack\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre\u003e\u003ccode\u003e┌─────────────────┐\n│   OrbStack CLI  │\n└────────┬────────┘\n         │\n┌────────▼────────┐\n│ Apple Hypervisor│ ← Native macOS virtualization\n│ (lightweight)   │\n│ ┌───────────┐   │\n│ │ Container │   │\n│ │ Runtime   │   │\n│ └───────────┘   │\n└────────┬────────┘\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eAdvantages:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUses Apple's Hypervisor.framework\u003c/li\u003e\n\u003cli\u003eNo full VM overhead\u003c/li\u003e\n\u003cli\u003eNative networking (no NAT)\u003c/li\u003e\n\u003cli\u003eDynamic memory allocation\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch3 id=\"features-comparison\"\u003eFeatures Comparison\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#features-comparison\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eFeature\u003c/th\u003e\u003cth\u003eDocker Desktop\u003c/th\u003e\u003cth\u003eOrbStack\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eDocker API Compatible\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDocker Compose\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKubernetes\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDev Containers\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMulti-arch Support\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVolume Mounts\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅ (faster)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDashboard UI\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003ctd\u003e✅\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExtensions\u003c/td\u003e\u003ctd\u003e✅ Many\u003c/td\u003e\u003ctd\u003e⚠️ Limited\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCommercial License\u003c/td\u003e\u003ctd\u003e$9-29/month\u003c/td\u003e\u003ctd\u003e$9/month\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePlatform\u003c/td\u003e\u003ctd\u003emacOS, Windows, Linux\u003c/td\u003e\u003ctd\u003e\u003cstrong\u003emacOS only\u003c/strong\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003chr\u003e\n\u003ch3 id=\"pricing\"\u003ePricing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pricing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eDocker Desktop:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePersonal (small companies \u0026#x3C;25 employees): FREE\u003c/li\u003e\n\u003cli\u003eProfessional: $9/month\u003c/li\u003e\n\u003cli\u003eTeam: $24/month\u003c/li\u003e\n\u003cli\u003eBusiness: $29/month\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eOrbStack:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePersonal Use: \u003cstrong\u003eFREE\u003c/strong\u003e (unlimited)\u003c/li\u003e\n\u003cli\u003eCommercial: $9/month or $90/year\u003c/li\u003e\n\u003cli\u003eStudent/OS: FREE (with verification)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCost Analysis (10-person team):\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDocker Desktop Team: $24 × 10 × 12 = $2,880/year\nOrbStack Commercial: $90 × 10 = $900/year\nSavings: $1,980/year (69% cheaper)\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3 id=\"developer-experience\"\u003eDeveloper Experience\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#developer-experience\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003ch4 id=\"installation\"\u003eInstallation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#installation\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# Docker Desktop\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask \u003cspan class=\"token function\"\u003edocker\u003c/span\u003e\n\u003cspan class=\"token comment\"\u003e# ~5 minutes\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# OrbStack\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\u003cspan class=\"token comment\"\u003e# ~30 seconds\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch4 id=\"daily-usage\"\u003eDaily Usage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#daily-usage\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003e\u003cstrong\u003eBoth use identical commands:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003edocker-compose\u003c/span\u003e up -d\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e run -it postgres:15\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e build -t myapp \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eNo difference in CLI usage!\u003c/strong\u003e OrbStack adalah drop-in replacement.\u003c/p\u003e\n\u003ch4 id=\"vs-code-dev-containers\"\u003eVS Code Dev Containers\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vs-code-dev-containers\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eBoth work identically. VS Code tidak bisa membedakan backend mana yang dipakai.\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"name\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"My Dev Container\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"image\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"node:18\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch3 id=\"networking\"\u003eNetworking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#networking\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003ch4 id=\"docker-desktop-1\"\u003eDocker Desktop\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#docker-desktop-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre\u003e\u003ccode\u003eContainer (172.17.0.2) \n    ↓ NAT\nVM Network (192.168.65.1)\n    ↓ Port Forwarding\nmacOS Host (localhost:8080)\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch4 id=\"orbstack-1\"\u003eOrbStack\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#orbstack-1\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre\u003e\u003ccode\u003eContainer (native IP)\n    ↓ Direct routing\nmacOS Host (localhost:8080)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eOrbStack advantages:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNo port forwarding needed\u003c/li\u003e\n\u003cli\u003eContainers get real IPs\u003c/li\u003e\n\u003cli\u003eLower latency\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elocalhost\u003c/code\u003e works as expected\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch3 id=\"file-system-performance\"\u003eFile System Performance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#file-system-performance\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eBenchmark: \u003ccode\u003enpm install\u003c/code\u003e in mounted volume\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDocker Desktop:  45 seconds\nOrbStack:        12 seconds  (3.75x faster)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eWhy?\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDocker Desktop: virtiofs (slow translation layer)\u003c/li\u003e\n\u003cli\u003eOrbStack: native macOS file system access\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"when-to-choose-each\"\u003eWhen to Choose Each\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#when-to-choose-each\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"choose-orbstack-jika\"\u003eChoose \u003cstrong\u003eOrbStack\u003c/strong\u003e jika:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#choose-orbstack-jika\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e✅ Developer di \u003cstrong\u003emacOS\u003c/strong\u003e (especially Apple Silicon)\u003c/li\u003e\n\u003cli\u003e✅ Want better performance dan lower resource usage\u003c/li\u003e\n\u003cli\u003e✅ Mostly local development\u003c/li\u003e\n\u003cli\u003e✅ Use Dev Containers extensively\u003c/li\u003e\n\u003cli\u003e✅ Frustrated dengan Docker Desktop lambat\u003c/li\u003e\n\u003cli\u003e✅ Want simpler pricing\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"choose-docker-desktop-jika\"\u003eChoose \u003cstrong\u003eDocker Desktop\u003c/strong\u003e jika:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#choose-docker-desktop-jika\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e✅ Need Docker Extensions ecosystem\u003c/li\u003e\n\u003cli\u003e✅ Working in enterprise dengan compliance requirements\u003c/li\u003e\n\u003cli\u003e✅ Using \u003cstrong\u003eWindows atau Linux\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e✅ Need multi-node Kubernetes locally\u003c/li\u003e\n\u003cli\u003e✅ Require official enterprise support\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"migration-path\"\u003eMigration Path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#migration-path\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"from-docker-desktop-to-orbstack\"\u003eFrom Docker Desktop to OrbStack\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#from-docker-desktop-to-orbstack\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token comment\"\u003e# 1. Install OrbStack\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --cask orbstack\n\n\u003cspan class=\"token comment\"\u003e# 2. Switch context\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e context use orbstack\n\n\u003cspan class=\"token comment\"\u003e# 3. Verify\u003c/span\u003e\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e info \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"OrbStack\"\u003c/span\u003e\n\n\u003cspan class=\"token comment\"\u003e# 4. (Optional) Uninstall Docker Desktop\u003c/span\u003e\nbrew uninstall --cask \u003cspan class=\"token function\"\u003edocker\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eMigration Time:\u003c/strong\u003e \u0026#x3C;5 minutes\u003cbr\u003e\n\u003cstrong\u003eData Loss:\u003c/strong\u003e None\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"limitations-to-know\"\u003eLimitations to Know\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#limitations-to-know\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"orbstack-limitations\"\u003eOrbStack Limitations:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#orbstack-limitations\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003emacOS Only\u003c/strong\u003e - Tidak ada Windows/Linux version\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNewer Project\u003c/strong\u003e - Less battle-tested (4 years vs 8+ years)\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFewer Extensions\u003c/strong\u003e - Ecosystem masih berkembang\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCommercial License\u003c/strong\u003e - $9/month untuk business use\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"docker-desktop-limitations\"\u003eDocker Desktop Limitations:\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#docker-desktop-limitations\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eHeavy Resource Usage\u003c/strong\u003e - Especially on macOS\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSlow Startup\u003c/strong\u003e - VM boot time\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComplex Licensing\u003c/strong\u003e - Confusing free/paid tiers\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePerformance Issues\u003c/strong\u003e - File I/O, networking overhead\u003c/li\u00
