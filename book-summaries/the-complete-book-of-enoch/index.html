ng memisahkan roh berdasarkan moralitas.\u003c/li\u003e\n\u003cli\u003eKematian bukan akhir; ada phase antara mati dan judgement final.\u003c/li\u003e\n\u003cli\u003eRaphael konsisten sebagai penjaga roh manusia dan penjelas afterlife.\u003c/li\u003e\n\u003cli\u003eAbel menjadi contoh bahwa korban kekerasan terus menuntut keadilan setelah mati.\u003c/li\u003e\n\u003cli\u003eEven after death, the order of Enoch still distinguishes righteous, sinners, and victims.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"chapter-7-the-holy-angels--bagian-3-ayat-2841\"\u003eChapter 7: The Holy Angels — Bagian 3 (ayat 28–41)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-7-the-holy-angels--bagian-3-ayat-2841\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah melihat afterlife yang dipisahkan, Enoch dibawa ke arah barat ujung bumi. Di situ ia melihat api yang berlari tanpa berhenti secara teratur — bukan api liar, tetapi api yang berjalan dalam course kosmik.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"And I saw a burning fire which ran without resting, and paused not from its course day or night but regularly.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eRaguel menjelaskan bahwa api barat ini adalah api yang \"persecutes all the luminaries of heaven.\" Ini mengaitkan api tersebut dengan benda langit dan menguatkan peran Raguel sebagai malaikat yang menjaga tatanan luminaries.\u003c/p\u003e\n\u003cp\u003eDari situ Enoch dibawa ke mountain range of fire yang menyala siang dan malam, lalu melihat tujuh gunung megah yang berbeda-beda. Gunung ketujuh berdiri di tengah dan menyerupai throne; di sekelilingnya ada fragrant trees yang menandai suasana yang lebih hidup dan mulia.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"And amongst them was a tree such as I had never yet smelt... it had a fragrance beyond all fragrance, and its leaves and blooms and wood wither not for ever...\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eEnoch terpikat oleh satu pohon khusus yang harum dan tidak pernah layu. Michael muncul untuk menjelaskan bahwa gunung itu adalah takhta Tuhan yang akan datang ke bumi dengan goodness, dan pohon harum itu tidak boleh disentuh mortal sebelum great judgement.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"It shall then be given to the righteous and holy. Its fruit shall be for food to the elect... it shall be transplanted to the holy place, to the temple of the Lord, the Eternal King.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePohon itu bukan sekadar objek estetika. Ia menjadi simbol inheritance yang ditunda untuk orang benar, dengan makanan bagi elect, aroma yang masuk sampai ke tulang, hidup panjang di bumi, dan kehidupan tanpa sorrow, plague, torment, atau calamity.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Then blessed I the God of Glory, the Eternal King, who hath prepared such things for the righteous, and hath created them and promised to give to them.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eBagian 3 ini menutup unit dengan pujian. Enoch tidak hanya melihat hukuman dan penahanan; ia juga melihat gambaran reward yang dijanjikan bagi righteous setelah judgement.\u003c/p\u003e\n\u003ch3 id=\"insight-dari-chapter-7-bagian-3\"\u003eInsight dari Chapter 7 Bagian 3\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-dari-chapter-7-bagian-3\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eAyat 28–41 memperkenalkan reward yang ditunda untuk righteous melalui simbol pohon harum dan tujuh gunung.\u003c/li\u003e\n\u003cli\u003eApi barat tetap bagian dari tatanan kosmik; majunya api itu adalah bukti bahwa segala sesuatu bergerak teratur.\u003c/li\u003e\n\u003cli\u003eMichael muncul sebagai interpreter reward, menyeimbangkan peran Raphael di afterlife dan Uriel di prison.\u003c/li\u003e\n\u003cli\u003ePohon harum melambangkan kehidupan yang tidak layu, makanan bagi elect, dan restoration bumi.\u003c/li\u003e\n\u003cli\u003eEnoch melihat bahwa afterlife Enoch tidak hanya soal hukuman; ia juga soal restoration dan inheritance setelah justice selesai.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kenapa-judul-judul-ini-penting\"\u003eKenapa judul-judul ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-judul-judul-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam catatan gue, dua hal harus dibaca bareng:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edaftar isi sebagai arsitektur ide,\u003c/li\u003e\n\u003cli\u003emanuskrip sebagai indikator kedekatan ke sumber lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk sumber yang lebih dekat ke asal, gue pakai beberapa referensi online:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://en.wikipedia.org/wiki/Book_of_Enoch\"\u003eWikipedia: Book of Enoch\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q204-1\"\u003eDead Sea Scrolls 4Q204-1, Qumran\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q201-1\"\u003eDead Sea Scrolls 4Q201-1, Qumran\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.ccel.org/c/charles/otpseudepig/enoch/ENOCH_1.HTM\"\u003eCCEL: R. H. Charles, Book of Enoch\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://archive.org/download/ethiopicversiono00charuoft/ethiopicversiono00charuoft.pdf\"\u003eInternet Archive: Charles Ethiopic version\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.philipharland.com/Courses/Readings/4819/P%201%20Enoch%20%28password%29.pdf\"\u003ePhilip Harland / E. Isaac on 1 Enoch\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://larryhurtado.wordpress.com/2019/10/06/1-enoch-an-update-on-manuscripts-and-cautionary-notes-on-usage/?utm_source=chatgpt.com\"\u003eLarry Hurtado: 1 Enoch manuscripts and cautionary notes\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://www.deadseascrolls.org.il/explore-the-archive/manuscript/4Q203-1\"\u003eDead Sea Scrolls Book of Giants 4Q203-1\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-gue-tangkap-sejauh-ini\"\u003eApa yang gue tangkap sejauh ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-tangkap-sejauh-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eWinter adalah entry point, bukan authority tunggal.\u003c/strong\u003e Dia membantu gue masuk ke tema besar Enoch, tetapi klaim terjemahan dari Ethiopic plus organisasi logis membuatnya tetap versi modern.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSumber paling tua yang bisa kita lihat online adalah fragmen Aramaic Qumran.\u003c/strong\u003e Itu material paling dekat ke tradisi semitik awal, tapi bukan teks lengkap.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVersi paling lengkap adalah Ethiopic/Ge'ez, bukan yang paling tua.\u003c/strong\u003e Itu trade-off filologi yang krusial karena completeness versus antiquity.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEnglish modern sudah dua atau tiga lapis dari sumber.\u003c/strong\u003e Aramaic/Greek/Ge'ez → editor/translator → modern English.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSection Extras perlu dibaca hati-hati.\u003c/strong\u003e \u003cem\u003eBook of Giants\u003c/em\u003e punya hubungan Enochic kuat; \u003cem\u003eTestament of Solomon\u003c/em\u003e dan \u003cem\u003eEvidence of Giants\u003c/em\u003e bisa jadi tradisi lanjutan atau legendari, bukan bagian inti 1 Enoch standar.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"bagaimana-gue-akan-lanjut\"\u003eBagaimana gue akan lanjut\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-gue-akan-lanjut\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk sesi selanjutnya, gue akan membaca masing-masing buku dengan filter ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah bagian itu masih dalam tradisi Book of Watchers / Parables / Astronomical / Dream Visions / Epistle,\u003c/li\u003e\n\u003cli\u003eatau apakah itu framing tambahan dari editor modern,\u003c/li\u003e\n\u003cli\u003edan apakah ada bagian yang jelas-celah dari Book of Giants atau tradisi Enochic lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue juga akan gunakan \u003ca href=\"/sotoy/notes/notes.history.enoch-textual-history\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eEnoch textual history: manuskrip dan tradisi\u003c/a\u003e sebagai landasan supaya tiap detail tidak langsung dianggap sebagai \"asli\".\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eenoch (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etext-history (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527122957\"\u003eBaca Book of Enoch sebagai arsip berlapis, bukan teks tunggal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527123406\"\u003eAbout the Book of Enoch adalah pengantar editorial, bukan teks inti\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527124243\"\u003eAwal Enoch membangun horizon akhir sebelum menyelidiki penyebab kerusakan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527125005\"\u003eKorupsi dunia di Enoch berakar pada pelanggaran batas surgawi\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527125750\"\u003eSurga di Enoch berfungsi sebagai pengadilan terhadap korupsi Watchers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527130310\"\u003eDalam Enoch, perbedaan antara Watchers jatuh dan malaikat suci ditentukan oleh otoritas moral\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527140321\"\u003eBook of Enoch menampilkan model tanggung jawab ganda antara Watchers dan manusia\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527140354\"\u003eDalam Enoch, hukuman Watchers dibentuk sesuai pelanggaran ontologis mereka\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527140642\"\u003eEnoch dipilih karena dia manusia yang masih righteous sekaligus punya akses ke surga\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528094606\"\u003eDalam 1 Enoch, alam taat pada tugas kosmik sedangkan manusia dan Watchers memiliki pilihan moral\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528095116\"\u003eDaftar holy angels di 1 Enoch berfungsi sebagai peta peran kosmik\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528095349\"\u003e1 Enoch membangun peta afterlife yang memisahkan roh berdasarkan moralitas\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528096022\"\u003eDalam 1 Enoch, reward bagi righteous ditunda sampai judgement selesai\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.enoch.moral-patterns\"\u003eEnoch dan pola moral modern: mulut yang mencemari dan hati yang keras\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.history.enoch-textual-history\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eEnoch textual history: manuskrip dan tradisi\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.the-complete-book-of-enoch-chapter-6\"\u003eThe Complete Book of Enoch Chapter 6 sebagai literature note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.the-complete-book-of-enoch-chapter-7\"\u003eThe Complete Book of Enoch Chapter 7 sebagai literature note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.27\"\u003e2026-05-27\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"t
