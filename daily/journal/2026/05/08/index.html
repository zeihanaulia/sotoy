ps":{"note":{"id":"daily.journal.2026.05.08","title":"2026-05-08","desc":"Refleksi Mitchell Hashimoto tentang AI slop, eksperimen disposable, dan batas antara eksperimen dan production-ready dalam agentic coding.","updated":1778206055333,"created":1778204211499,"tags":["daily","agentic-engineering","ai-coding","mitchell-hashimoto"],"custom":{},"fname":"daily.journal.2026.05.08","type":"note","vault":{"fsPath":"vault"},"contentHash":"49e1863d43609345dd0629ab150133b4","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"tags.agentic-engineering","alias":"agentic-engineering","xvault":false,"to":{"fname":"tags.agentic-engineering"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"tags.ai-coding","alias":"ai-coding","xvault":false,"to":{"fname":"tags.ai-coding"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"tags.mitchell-hashimoto","alias":"mitchell-hashimoto","xvault":false,"to":{"fname":"tags.mitchell-hashimoto"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"notes.agentic-engineering.ai-slop-disposable-experimentation","position":{"start":{"line":3,"column":53,"offset":94},"end":{"line":3,"column":117,"offset":158},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.ai-slop-disposable-experimentation"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.08","id":"daily.journal.2026.05.08","vaultName":"vault"},"value":"notes.agentic-engineering.heavyskill-heavy-thinking-as-inner-skill","position":{"start":{"line":17,"column":7,"offset":1401},"end":{"line":17,"column":77,"offset":1471},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.heavyskill-heavy-thinking-as-inner-skill"}}],"anchors":{"ai-slop-sebagai-eksperimen-disposable":{"type":"header","text":"AI slop sebagai eksperimen disposable","value":"ai-slop-sebagai-eksperimen-disposable","line":15,"column":0,"depth":2},"ringkasannya":{"type":"header","text":"Ringkasannya","value":"ringkasannya","line":18,"column":0,"depth":3},"heavyskill-paper":{"type":"header","text":"HeavySkill paper","value":"heavyskill-paper","line":27,"column":0,"depth":2},"4-pertanyaan-kunci":{"type":"header","text":"4 pertanyaan kunci","value":"4-pertanyaan-kunci","line":32,"column":0,"depth":3},"kenapa-ini-penting":{"type":"header","text":"Kenapa ini penting","value":"kenapa-ini-penting","line":42,"column":0,"depth":3},"pertanyaan-lanjutan":{"type":"header","text":"Pertanyaan lanjutan","value":"pertanyaan-lanjutan","line":50,"column":0,"depth":3},"komentar-penting-yang-nambah-batasan":{"type":"header","text":"Komentar penting yang nambah batasan","value":"komentar-penting-yang-nambah-batasan","line":57,"column":0,"depth":3},"pertanyaan-penting":{"type":"header","text":"Pertanyaan penting","value":"pertanyaan-penting","line":65,"column":0,"depth":3}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-08\"\u003e2026-05-08\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-08\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ai-slop-sebagai-eksperimen-disposable\"\u003eAI slop sebagai eksperimen disposable\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ai-slop-sebagai-eksperimen-disposable\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue tulis note baru dari thread Mitchell Hashimoto: \u003ca href=\"/sotoy/notes/notes.agentic-engineering.ai-slop-disposable-experimentation\"\u003eAI Slop dan Batas Disposable Experimentation\u003c/a\u003e. Intinya, \"AI slop\" dia pakai untuk output kasar yang berguna sebagai eksperimen, bukan sebagai kode final yang masuk ke customer.\u003c/p\u003e\n\u003ch3 id=\"ringkasannya\"\u003eRingkasannya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasannya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eNgeslop dan ngevibing code tidak otomatis bermasalah selama posisinya jelas sebagai eksplorasi atau prototype.\u003c/li\u003e\n\u003cli\u003eSlop bagus kalau buat eksperimen cepat dan paralel, terutama kalau fungsinya menghasilkan insight, bukan jadi produk final.\u003c/li\u003e\n\u003cli\u003eSlop berbahaya kalau jadi fondasi, customer-facing, atau menyentuh boundary kritikal.\u003c/li\u003e\n\u003cli\u003eSkill baru AI coding adalah tahu mana yang boleh disposable dan mana yang harus bersih.\u003c/li\u003e\n\u003cli\u003eFrontend bisa dikasih slop dulu; core workflow, auth, billing, data contract, dan security tidak boleh dianggap aman hanya karena berjalan di demo.\u003c/li\u003e\n\u003cli\u003eQuality gate customer-facing harus lebih dari sekali manual test: behavior, error handling, data, security, observability, rollback, dan tim paham.\u003c/li\u003e\n\u003cli\u003eAnalogi yang gue pakai: slop itu scaffolding atau triplek sementara di lokasi konstruksi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"heavyskill-paper\"\u003eHeavySkill paper\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#heavyskill-paper\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue juga catat paper baru arXiv 2605.02396v1: \"HeavySkill: Heavy Thinking as the Inner Skill in Agentic Harness.\" Intinya, pola agentic yang kuat bukan cuma framework rumit, melainkan \"parallel reasoning → deliberation\" yang dipaketkan sebagai skill file.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.agentic-engineering.heavyskill-heavy-thinking-as-inner-skill\"\u003eHeavySkill: Heavy Thinking as Inner Skill in Agentic Harness\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"4-pertanyaan-kunci\"\u003e4 pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eKalau input-nya satu pertanyaan, kenapa sistem bikin banyak jawaban dulu?\n\u003cul\u003e\n\u003cli\u003eKarena satu reasoning path rapuh dan mudah terjebak asumsi awal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eApa bedanya parallel reasoning dengan tanya model berkali-kali biasa?\n\u003cul\u003e\n\u003cli\u003eParallel reasoning membuat jawaban independen. Bukan sekadar ulangi model yang sama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eApa yang terjadi di tahap sequential deliberation?\n\u003cul\u003e\n\u003cli\u003eModel reviewer membaca semua trajectory, membandingkan reasoning, mencari error, lalu synthesize jawaban final.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKenapa hasil akhirnya bisa lebih baik daripada jawaban tunggal?\n\u003cul\u003e\n\u003cli\u003eKarena reviewer punya banyak hipotesis dan evidence, jadi bisa memilih minoritas benar atau menggabungkan insight.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eWorkflow Heavy Thinking bukan \"AI mikir panjang.\" Itu adalah process desain inferensi.\u003c/li\u003e\n\u003cli\u003eIni lebih mirip mini review board: banyak solusi independen, satu reviewer menyimpulkan yang terbaik.\u003c/li\u003e\n\u003cli\u003eKunci success-nya: thinker harus setidaknya berbeda, bukan sekadar keluaran model yang sama 8 kali.\u003c/li\u003e\n\u003cli\u003eKunci kedua: reviewer bias tidak hanya soal posisi; reviewer juga LLM yang bisa pilih jawaban fasih atau mayoritas.\u003c/li\u003e\n\u003cli\u003ePaper ini sadar bias itu, tapi solusinya masih parsial: sampling, shuffling cache, pruning, dan prompt-style review.\u003c/li\u003e\n\u003cli\u003eSerialized memory cache di paper ini adalah memory eksternal workflow, bukan internal KV-cache model. Bayangin itu sebagai notulen sementara bagi reviewer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"pertanyaan-lanjutan\"\u003ePertanyaan lanjutan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-lanjutan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003etask mana di workflow kita yang cocok buat heavy thinking?\u003c/li\u003e\n\u003cli\u003eapakah kita punya skill file yang bisa merepresentasikan deliberation pattern?\u003c/li\u003e\n\u003cli\u003eapakah kita cukup modular untuk menggunakan beberapa trajectory tanpa menumpuk noise?\u003c/li\u003e\n\u003cli\u003eapakah kita perlu membedakan role reasoner vs deliberator dalam workflow?\u003c/li\u003e\n\u003cli\u003eapa yang jadi evidence utama agar deliberator nggak cuma ikut mayoritas?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"komentar-penting-yang-nambah-batasan\"\u003eKomentar penting yang nambah batasan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#komentar-penting-yang-nambah-batasan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDevin Stein: slop bisa jadi alat personal, tapi review dari orang lain bisa jadi beban. Itu berarti boundary-nya bukan cuma teknis, tapi juga sosial.\u003c/li\u003e\n\u003cli\u003eManoj: slop sering kali bukan produk gagal; dia adalah riset murah. Kalau 18 dari 20 eksperimen gagal, 18 itu masih punya nilai sebagai cara menemukan 2 arah yang benar.\u003c/li\u003e\n\u003cli\u003eClément Miao: slop debt bisa berguna kalau dicatat, dibatasi, dan dibayar. Kalau tidak, itu berubah jadi tech debt tersembunyi.\u003c/li\u003e\n\u003cli\u003eHanzi: bahaya terbesar muncul ketika Friday prototype bertahan lama dan tegangannya berubah jadi arsitektur.\u003c/li\u003e\n\u003cli\u003eMisael \u0026#x26; Felipe: modularity adalah containment strategy. Slop lebih aman kalau sistem modular; lebih berbahaya di monolith besar.\u003c/li\u003e\n\u003cli\u003eWiscJohnson / Yaroslav: banyak orang akan abaikan aturan boundary. Argumen Mitchell bergantung pada maturity dan disiplin developer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"pertanyaan-penting\"\u003ePertanyaan penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSekarang gue mau tanya ke diri sendiri:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emana area sistem ini yang bisa kita generate kasar dulu?\u003c/li\u003e\n\u003cli\u003emana boundary yang harus tetap rapi dari awal?\u003c/li\u003e\n\u003cli\u003esiapa yang akan menanggung biaya kalau ini jadi PR tim?\u003c/li\u003e\n\u003cli\u003eapa rencana kita untuk bayar utang slop sebelum ia jadi arsitektur?\u003c/li\u003e\n\u003cli\u003eapakah sistem kita modular cukup untuk mengurung slop?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKonteks tambahan: gue baca istilah \"yapping\" di thread ini sebagai \"lagi ngomong panjang soal poin utama,\" bukan sekadar ngoceh tanpa isi.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"pr
