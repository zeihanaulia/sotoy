offset":526},"indent":[]},"value":"zettel.literature.the-complete-book-of-enoch-chapter-7"}],"anchors":{"pertanyaan-yang-dibuka":{"type":"header","text":"Pertanyaan yang dibuka","value":"pertanyaan-yang-dibuka","line":15,"column":0,"depth":2},"ringkasan-literatur":{"type":"header","text":"Ringkasan literatur","value":"ringkasan-literatur","line":21,"column":0,"depth":2},"ide-penting":{"type":"header","text":"Ide penting","value":"ide-penting","line":31,"column":0,"depth":2},"relevansi":{"type":"header","text":"Relevansi","value":"relevansi","line":40,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"the-complete-book-of-enoch-chapter-7-sebagai-literature-note\"\u003eThe Complete Book of Enoch Chapter 7 sebagai literature note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-complete-book-of-enoch-chapter-7-sebagai-literature-note\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"pertanyaan-yang-dibuka\"\u003ePertanyaan yang dibuka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-yang-dibuka\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eMengapa Chapter 7 menempatkan daftar holy angels sebelum memperlihatkan tempat penjara?\u003c/li\u003e\n\u003cli\u003eBagaimana fungsi masing-masing holy angel mencerminkan aturan kosmik dan peran yang berbeda dalam tatanan surgawi?\u003c/li\u003e\n\u003cli\u003eApa makna tujuh bintang yang diikat di tempat chaos dan hukuman sepuluh ribu tahun bagi mereka?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"ringkasan-literatur\"\u003eRingkasan literatur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-literatur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 7 Bagian 1 buka dengan daftar malaikat suci yang mengawasi manusia dari posisi yang benar. Nama-nama itu bukan sekadar label; masing-masing dihubungkan dengan domain tertentu seperti dunia, Tartarus, roh manusia, luminaries, chaos, roh yang berdosa, Paradise, serpents, Cherubim, dan kebangkitan.\u003c/p\u003e\n\u003cp\u003eSetelah daftar itu, Enoch dibawa ke tempat yang berantakan dan mengerikan, di mana tidak ada heaven di atas, tidak ada earth yang kokoh di bawah, dan ada tujuh bintang surgawi yang terikat dan terbakar. Uriel menjelaskan bahwa mereka melanggar perintah Tuhan dan akan diikat sampai masa hukuman mereka selesai. Kemudian Enoch melihat tempat api besar yang menjadi penjara malaikat, dan rasa takutnya ditegaskan oleh visualisasi \"spectacle of the pain.\"\u003c/p\u003e\n\u003cp\u003eChapter 7 Bagian 2 beralih ke gunung batu keras dan empat rongga di dalamnya, yang dibuat agar roh orang mati dapat berkumpul sampai hari judgement. Raphael menjelaskan bahwa ini adalah ruang tunggu for the spirits of the dead, dengan pembagian yang memisahkan righteous, sinners, dan korban yang mengajukan gugatan.\u003c/p\u003e\n\u003cp\u003eRoh Abel menjadi contoh penting karena darah korban tetap bersuara dan terus membuat suit sampai keadilan ditegakkan. Pembagian itu menyiratkan bahwa afterlife Enoch bukanlah ruang campur tanpa perbedaan; bahkan setelah mati, status moral tetap menentukan kondisi penantian.\u003c/p\u003e\n\u003ch2 id=\"ide-penting\"\u003eIde penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ide-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDaftar holy angels berfungsi sebagai peta administratif kosmik; tugas mereka adalah kunci untuk memahami order dan penegakan hukuman.\u003c/li\u003e\n\u003cli\u003eEnoch membedakan dua jenis \"watching\": pengawasan yang benar dari holy angels versus pengawasan yang rusak dari Watchers yang jatuh.\u003c/li\u003e\n\u003cli\u003eBintang surgawi yang disegel menunjukkan bahwa transgression tidak eksklusif pada manusia atau Watchers; langit pun memiliki hukum.\u003c/li\u003e\n\u003cli\u003ePerbandingan antara domain malaikat suci dan penjara transgressors menggarisbawahi bahwa struktur kosmik dalam Enoch bersifat etis, bukan hanya fungsional.\u003c/li\u003e\n\u003cli\u003eAfterlife di ayat 18–27 menunjukkan bahwa roh manusia dibedakan oleh moralitas dan ditunggu dalam ruang tertentu sampai judgement.\u003c/li\u003e\n\u003cli\u003eAyat 28–41 menambah dimensi reward: righteous bukan hanya diselamatkan, tapi juga dijanjikan inheritance yang ditunda sampai judgement selesai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relevansi\"\u003eRelevansi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevansi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-complete-book-of-enoch\"\u003eThe Complete Book of Enoch\u003c/a\u003e — konteks pembacaan umum dan struktur Book 1.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260527141711\"\u003eChapter 6 Enoch: kosmos terungkap sebagai arsitektur yang punya jalur dan tempat untuk setiap elemen\u003c/a\u003e — ide terkait kosmos sebagai arsitektur yang punya jalur dan tempat.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528095349\"\u003e1 Enoch membangun peta afterlife yang memisahkan roh berdasarkan moralitas\u003c/a\u003e — ide tentang afterlife yang dibagi berdasarkan moralitas.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260528096022\"\u003eDalam 1 Enoch, reward bagi righteous ditunda sampai judgement selesai\u003c/a\u003e — ide reward righteous yang ditunda sampai judgement selesai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eenoch (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wi
