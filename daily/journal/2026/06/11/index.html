alue":"loop-engineering-bukan-cuma-otomasi-tapi-manajemen-kekacauan","line":74,"column":0,"depth":3},"1-verifikasi-itu-harus-bertingkat-gaurav-albal--gaurav-singh":{"type":"header","text":"1. Verifikasi itu Harus Bertingkat (Gaurav Albal \u0026 Gaurav Singh)","value":"1-verifikasi-itu-harus-bertingkat-gaurav-albal--gaurav-singh","line":82,"column":0,"depth":4},"2-memory-adalah-fondasi-bukan-fitur-infomly--jalkarna":{"type":"header","text":"2. Memory adalah Fondasi, Bukan Fitur (Infomly \u0026 Jalkarna)","value":"2-memory-adalah-fondasi-bukan-fitur-infomly--jalkarna","line":88,"column":0,"depth":4},"3-bahaya-comprehension-debt-kv":{"type":"header","text":"3. Bahaya \"Comprehension Debt\" (KV)","value":"3-bahaya-comprehension-debt-kv","line":92,"column":0,"depth":4},"4-security-loop-mewarisi-attack-surface-manusia-abhijoy-sarkar":{"type":"header","text":"4. Security: Loop Mewarisi Attack Surface Manusia (Abhijoy Sarkar)","value":"4-security-loop-mewarisi-attack-surface-manusia-abhijoy-sarkar","line":96,"column":0,"depth":4},"5-pragmatisme-loop-bisa-jadi-overengineering-sead--ashley":{"type":"header","text":"5. Pragmatisme: Loop Bisa Jadi Overengineering (Sead \u0026 Ashley)","value":"5-pragmatisme-loop-bisa-jadi-overengineering-sead--ashley","line":99,"column":0,"depth":4},"loop-dari-mana-istilah-ini-datang-dan-kenapa-semua-orang-ribut":{"type":"header","text":"Loop: Dari Mana Istilah Ini Datang dan Kenapa Semua Orang Ribut?","value":"loop-dari-mana-istilah-ini-datang-dan-kenapa-semua-orang-ribut","line":106,"column":0,"depth":2},"siapa-yang-pegang-kendali-evolusi-siklus-kerja-ai":{"type":"header","text":"Siapa yang Pegang Kendali? Evolusi Siklus Kerja AI","value":"siapa-yang-pegang-kendali-evolusi-siklus-kerja-ai","line":132,"column":0,"depth":2},"ai-as-engineering-accelerator-not-replacement-allen-holubs-approach":{"type":"header","text":"AI as Engineering Accelerator, Not Replacement: Allen Holub's Approach","value":"ai-as-engineering-accelerator-not-replacement-allen-holubs-approach","line":152,"column":0,"depth":2},"loop-driven-development-ldd-the-oracle-problem":{"type":"header","text":"Loop Driven Development (LDD): The Oracle Problem","value":"loop-driven-development-ldd-the-oracle-problem","line":168,"column":0,"depth":2},"practical-loop-setup-from-theory-to-claude-code":{"type":"header","text":"Practical Loop Setup: From Theory to Claude Code","value":"practical-loop-setup-from-theory-to-claude-code","line":183,"column":0,"depth":2}},"children":[],"parent":"1iir2mksc725vt194vy9yyh","data":{}},"body":"\u003ch1 id=\"daily-journal-2026-06-11\"\u003eDaily Journal: 2026-06-11\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#daily-journal-2026-06-11\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ai-model-reliability-antirez-on-claude-fable-vs-gpt-55\"\u003eAI Model Reliability: Antirez on Claude (Fable) vs GPT 5.5\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ai-model-reliability-antirez-on-claude-fable-vs-gpt-55\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baru aja baca thread dari antirez di X soal perbandingannya antara GPT 5.5 dan Claude (khususnya model \"Fable\" yang lagi dia uji). Menarik banget karena dia nggak bahas benchmark, tapi bahas \u003cem\u003ereliability\u003c/em\u003e sebagai partner kerja.\u003c/p\u003e\n\u003cp\u003eYang gue tangkap, antirez tadinya udah \"sold\" banget sama GPT 5.5, tapi Fable bikin dia balik lagi ke Claude. Poin utamanya bukan cuma soal \"jawabannya bener\", tapi soal \u003cstrong\u003eproses kerja\u003c/strong\u003e. Fable menurut dia lebih terstruktur, punya langkah-langkah yang rapi, dan pemahaman masalah yang lebih dalam.\u003c/p\u003e\n\u003cp\u003eAda satu trade-off yang dia highlight: \u003cstrong\u003eSpeed vs Depth\u003c/strong\u003e. Fable itu lambat, bahkan bisa 5-10x lebih lambat dari GPT 5.5. Tapi buat antirez, lambat itu nggak masalah asal hasilnya bermakna. Dia lebih milih nunggu lama daripada dapet \"nonsense loop\"—kondisi di mana AI kelihatan produktif tapi sebenarnya cuma muter-muter nggak nyelesain masalah.\u003c/p\u003e\n\u003cp\u003eSatu hal yang gue suka dari sikap dia adalah pragmatismenya. Dia nggak mau \"menikah\" sama satu provider AI. Prinsipnya jelas: pakai model terbaik yang ada saat ini, jangan sampai terkunci (\u003cem\u003evendor lock-in\u003c/em\u003e).\u003c/p\u003e\n\u003cp\u003eIntinya, kriteria \"model terbaik\" buat gue sekarang bergeser. Bukan lagi soal siapa yang paling cepat atau paling pintar di benchmark, tapi siapa yang paling bisa dipercaya proses berpikirnya untuk kerjaan kompleks.\u003c/p\u003e\n\u003cp\u003eReferensi: \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/antirez/status/2064448256113873281\"\u003ehttps://x.com/antirez/status/2064448256113873281\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"antirez-on-fable--ai-governance\"\u003eAntirez on Fable \u0026#x26; AI Governance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#antirez-on-fable--ai-governance\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLanjutan thread antirez soal \"Fable\" (model Claude/Anthropic baru). Intinya, dia lagi ngelakuin koreksi posisi. Dia mengakui secara teknis Fable itu impresif banget—rapi, punya deep understanding, dan stabil buat reasoning (thinking workhorse)—tapi dia menolak keras arah governance Anthropic.\u003c/p\u003e\n\u003cp\u003eAda beberapa poin yang nyantol banget buat gue:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCapability vs Governance\u003c/strong\u003e: Antirez misahin antara \"seberapa jago modelnya\" dan \"siapa yang kontrol\". Dia bakal pake inovasi apa pun yang berguna, tapi dia nggak setuju kalau aksesnya di-gate terlalu ketat (paternalistik), bahkan buat riset LLM yang harmless atau pertanyaan medis.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReciprocity dalam Training\u003c/strong\u003e: Ini argumen paling tajam. Dia bilang nggak masalah AI dilatih pake public data (bukan copying), ASALKAN hasilnya nggak dipake buat melawan kultur terbuka yang memungkinkan teknologi itu lahir. Analogi \"minum dari sumur publik, terus setelah punya pabrik air, sumurnya dipagar\" itu kena banget.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe \"Escape\"\u003c/strong\u003e: Dia ngeliat open-weights models dari China sebagai jalan keluar dari duopoly/triopoly lab tertutup di Barat. Tapi dia juga ngingetin kalau kapasitas China itu sebenernya berdiri di atas struktur open science yang dulu dibangun Barat.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKrisis Kapasitas Industri\u003c/strong\u003e: Dia nyentil Eropa/Barat yang kayaknya kehilangan \"industrial ethics\"—terlalu nyaman jadi konsumen dan nerima narasi kalau mereka \"direbus pelan-pelan\" daripada berani bangun infrastruktur terbuka sendiri.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eSintesis gue:\u003c/strong\u003e\nSemakin bagus modelnya, semakin besar masalah kalau aksesnya tertutup. Kalau modelnya biasa aja, filter itu cuma gangguan. Tapi kalau model itu bener-bener bisa ningkatin kapasitas programmer/researcher, maka gating berubah jadi masalah distribusi kekuasaan.\u003c/p\u003e\n\u003cp\u003eAntirez nggak benci Anthropic, dia cuma bilang: \"Fable justru membuktikan betapa pentingnya akses terbuka.\"\u003c/p\u003e\n\u003cp\u003eReferensi: \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/antirez/status/2064766429887352971\"\u003ehttps://x.com/antirez/status/2064766429887352971\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"loop-engineering-berhenti-jadi-tukang-prompt-mulai-jadi-sistem-designer\"\u003eLoop Engineering: Berhenti Jadi \"Tukang Prompt\", Mulai Jadi \"Sistem Designer\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-engineering-berhenti-jadi-tukang-prompt-mulai-jadi-sistem-designer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSelanjutnya gue baca tulisan Addy Osmani soal \"Loop Engineering\", dan jujur ini ngerubah cara gue ngelihat coding agent kayak Claude Code atau Codex. \u003c/p\u003e\n\u003cp\u003eSelama ini gue (dan mungkin banyak orang) pakai AI coding agent itu polanya masih manual: gue prompt, gue baca hasilnya, gue koreksi, prompt lagi. Capek juga kalau harus megangin AI-nya tiap detik. Nah, Addy bilang kita udah masuk ke fase baru: \u003cstrong\u003eLoop Engineering\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eIntinya, loop engineering itu bukan lagi soal \"gimana nulis prompt yang bagus\", tapi \"gimana mendesain sistem yang bikin AI kerja, ngecek dirinya sendiri, nyimpen progress, dan jalan terus sampai goal-nya tercapai tanpa gue harus standby di depan layar.\"\u003c/p\u003e\n\u003cp\u003eAnalogi yang paling nempel buat gue: dulu gue nyetir AI kayak motor manual, sekarang gue mulai desain jalur, rambu, checkpoint, dan mekanik otomatisnya. Gue nggak lagi jadi operator, tapi jadi insinyur sistemnya.\u003c/p\u003e\n\u003cp\u003eAda beberapa komponen yang bikin loop ini jalan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eAutomations\u003c/strong\u003e: Detak jantungnya. Biar agent nggak nunggu gue buat mulai (misal: jalan tiap pagi cek CI failure).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWorktrees\u003c/strong\u003e: Biar kalau ada banyak agent jalan paralel, mereka nggak saling tabrak file. Masing-masing punya \"meja kerja\" sendiri.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkills\u003c/strong\u003e: Biar agent nggak kayak ikan mas yang lupa konteks tiap session baru. Pengetahuan proyek ditulis jadi artefak (SKILL.md) yang bisa dibaca agent.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConnectors (MCP)\u003c/strong\u003e: Biar agent nggak cuma bisa baca file, tapi bisa interaksi sama Linear, Slack, atau database.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSub-agents\u003c/strong\u003e: Ini yang paling krusial. Pisahin yang \u003cem\u003enulis\u003c/em\u003e kode sama yang \u003cem\u003engecek\u003c/em\u003e kode. Jangan biarkan AI menilai PR-nya sendiri karena dia pasti bakal terlalu \"baik\".\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTapi ada peringatan keras dari Addy yang bikin gue mikir: \u003cstrong\u003eComprehension Debt\u003c/strong\u003e. \u003c/p\u003e\n\u003cp\u003eKalau loop ini jalan terlalu kencang dan gue cuma asal merge karena test-nya hijau, gue bakal kehilangan pemahaman soal codebase gue sendiri. Kodenya ada, tapi pemahaman gue tertinggal. Ini bahaya banget karena gue bisa terjebak dalam \u003cem\u003ecognitive surrender\u003c/em\u003e—berhenti punya opini dan cuma terima apa pun yang dikasih AI.\u003c/p\u003e\n\u003cp\u003eKesimpulan gue: Loop engineering itu leverage besar, tapi tanggung jawab verifikasinya tetap di gue. Gue harus tetap jadi engineer yang paham arsitektur, bukan cuma orang yang pencet tombol \"Go\".\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/addyosmani/status/2064127981161959567\"\u003ehttps://x.com/addyosmani/status/2064127981161959567\u003c/a\u003e\u003c/p\u003e\n\u003ch3 id=\"loop-engineering-bukan-cuma-otomasi-tapi-manajemen-kekacauan\"\u003eLoop Engineering: Bukan Cuma Otomasi, tapi Manajemen Kekacauan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-engineering-bukan-cuma-otomasi-tapi-manajemen-kekacauan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGue baru aja baca reply-reply di bawah artikel Addy Osmani soal Loop Engineering, dan ternyata diskusinya jauh lebih \"berdarah\" dan praktis daripada artikel aslinya. Kalau Addy kasih framing besarnya, orang-orang di reply ini kasih \"operating manual\"-nya.\u003c/p\u003e\n\u003cp\u003eSatu hal yang paling ngena buat gue: loop engineering itu kuat, tapi kalau nggak ada \u003cem\u003everification, memory, security boundary,\u003c/em\u003e dan \u003cem\u003ehuman judgment\u003c/em\u003e, dia cuma memindahkan kekacauan satu layer lebih jauh dari manusia.\u003c/p\u003e\n\u003cp\u003eAda beberapa poin tajam dari para reply yang bikin gue mikir:\u003c/p\u003e\n\u003ch4 id=\"1-verifikasi-itu-harus-bertingkat-gaurav-albal--gaurav-singh\"\u003e1. Verifikasi itu Harus Bertingkat (Gaurav Albal \u0026#x26; Gaurav Singh)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-verifikasi-itu-harus-bertingkat-gaurav-albal--gaurav-singh\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eGue tadinya mikir verifikasi itu cukup pakai \"AI Reviewer\". Tapi Gaurav Albal ngingetin kalau \u003cem\u003emaker/checker subagent split\u003c/em\u003e itu layer paling mahal. Verifikasi yang sehat itu harus deterministik dulu sebelum pakai model judge.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDeterministic Check\u003c/strong\u003e: Pakai JSON schema, jalankan test, cek \u003ccode\u003egit diff\u003c/code\u003e, atau validasi OpenAPI spec. Ini murah dan pasti.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eModel Judge\u003c/strong\u003e: Dipakai terakhir untuk hal yang butuh judgment semantik.\nIntinya: jangan tanya AI \"apakah JSON ini valid?\", tapi pakai validator JSON.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"2-memory-adalah-fondasi-bukan-fitur-infomly--jalkarna\"\u003e2. Memory adalah Fondasi, Bukan Fitur (Infomly \u0026#x26; Jalkarna)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-memory-adalah-fondasi-bukan-fitur-infomly--jalkarna\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eAddy naruh memory di urutan keenam, tapi Infomly bilang memory itu harusnya nomor satu. Tanpa memory, loop itu cuma \"one-shot mewah\" yang diulang-ulang.\nJalkarna juga nekenin pentingnya \u003cem\u003ememory on disk\u003c/em\u003e (kayak \u003ccode\u003eAGENTS.md\u003c/code\u003e atau Linear board) daripada cuma ngandelin context window. Prompt mengarahkan satu run, tapi memory mengarahkan sistem lintas waktu.\u003c/p\u003e\n\u003ch4 id=\"3-bahaya-comprehension-debt-kv\"\u003e3. Bahaya \"Comprehension Debt\" (KV)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-bahaya-comprehension-debt-kv\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni yang paling nakutin. Kalau loop makin halus, output kode makin banyak, tapi pemahaman gue terhadap kode itu nggak otomatis naik. Gue bisa terjebak dalam \u003cem\u003ecognitive surrender\u003c/em\u003e—asal merge karena test hijau, padahal gue nggak paham apa yang terjadi.\nSolusinya? Harus ada \"comprehension engineering\": ritual review yang didesain, audit architectural diff mingguan, dan learning notes dari setiap run.\u003c/p\u003e\n\u003ch4 id=\"4-security-loop-mewarisi-attack-surface-manusia-abhijoy-sarkar\"\u003e4. Security: Loop Mewarisi Attack Surface Manusia (Abhijoy Sarkar)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-security-loop-mewarisi-attack-surface-manusia-abhijoy-sarkar\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eIni poin security yang brutal. Kalau loop baca issue eksternal atau web, setiap input itu potensi \u003cem\u003einjection point\u003c/em\u003e. Kalau prompter diganti loop, maka loop harus punya filter yang lebih ketat dari manusia. Loop yang aman butuh permission minimal, sandbox, dan approval boundary untuk aksi berbahaya.\u003c/p\u003e\n\u003ch4 id=\"5-pragmatisme-loop-bisa-jadi-overengineering-sead--ashley\"\u003e5. Pragmatisme: Loop Bisa Jadi Overengineering (Sead \u0026#x26; Ashley)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pragmatisme-loop-bisa-jadi-overengineering-sead--ashley\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eNggak semua kerjaan butuh loop kompleks. Untuk solo dev atau task kecil, prompt manual + skill engineer jauh lebih efisien. Loop punya \u003cem\u003eminimum viable scale\u003c/em\u003e. Di bawah itu, loop cuma jadi ritual mahal yang bakar token dan bikin tumpukan sampah yang harus dibersihkan.\u003c/p\u003e\n\u003cp\u003eKesimpulan gue: Loop engineering itu bukan soal \"berapa banyak agent yang bisa gue jalanin paralel\", tapi \"state apa yang harus disimpan, gate apa yang harus dilewati, dan kapan gue sebagai manusia wajib intervensi\".\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/addyosmani/status/2064127981161959567\"\u003ehttps://x.com/addyosmani/status/2064127981161959567\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"loop-dari-mana-istilah-ini-datang-dan-kenapa-semua-orang-ribut\"\u003eLoop: Dari Mana Istilah Ini Datang dan Kenapa Semua Orang Ribut?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-dari-mana-istilah-ini-datang-dan-kenapa-semua-orang-ribut\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah baca artikel Addy Osmani soal \"Loop Engineering\", gue lanjut baca tulisan Matt Van Horn yang judulnya \"WTF Is a Loop?\". Kalau artikel Addy itu kayak \"manual engineering\" (gimana cara bangunnya), artikel Matt ini lebih ke \"sejarah dan definisi medan perang\" (apa itu sebenarnya dan kenapa orang debat).\u003c/p\u003e\n\u003cp\u003eYang gue tangkap, banyak orang salah paham soal \"loop\" karena istilah ini dipakai buat banyak hal sekaligus. Matt ngejelasin spektrum evolusinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAda loop akademik kayak \u003cstrong\u003eReAct\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eAda goal loop kayak \u003cstrong\u003eAutoGPT\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eAda \u003cstrong\u003eralph loop\u003c/strong\u003e yang ngulang prompt dengan context anchor tetap.\u003c/li\u003e\n\u003cli\u003eAda \u003cstrong\u003e\u003ccode\u003e/goal\u003c/code\u003e\u003c/strong\u003e yang jalan sampai kondisi terpenuhi.\u003c/li\u003e\n\u003cli\u003eSampai ke \u003cstrong\u003eorchestration loop\u003c/strong\u003e yang ngawasin banyak agent/thread sekaligus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi pas gue baca reply-reply di thread Addy kemarin, gue baru sadar kenapa mereka debat. Mereka sebenarnya nggak selalu ngomongin level loop yang sama. Ada yang ngomongin cron job sederhana, ada yang ngomongin sistem orchestrator kompleks.\u003c/p\u003e\n\u003cp\u003eSatu poin yang paling ngena buat gue: loop itu bukan cuma cron job. Matt bilang loop itu kayak \"cron plus a decision-maker in the body\". Kalau cuma schedule, itu belum menarik. Yang baru adalah ada model di dalam jadwal itu yang bisa baca state, milih langkah berikutnya, bertindak, lalu ngecek feedback.\u003c/p\u003e\n\u003cp\u003eIni juga memperkuat bahasan Addy soal \u003cem\u003eskills\u003c/em\u003e. Matt bilang loop itu cuma \"plumbing\" (pipa), tapi aset aslinya adalah \u003cem\u003eskill\u003c/em\u003e yang dipanggil. Loop tanpa reusable skill itu cuma \u003ccode\u003ewhile true\u003c/code\u003e di sekitar \"orang asing\". Tapi loop dengan named skills bisa \u003cem\u003ecompound\u003c/em\u003e—pengetahuannya numpuk dan makin tajam.\u003c/p\u003e\n\u003cp\u003eTerakhir, Matt juga nyentuh soal biaya. Biaya mahalnya sekarang bukan lagi di nulis kodenya, tapi di mengelola agent loop-nya. Ini sinkron banget sama keluhan soal token burn dan cleanup work yang gue baca di reply-reply Addy.\u003c/p\u003e\n\u003cp\u003eIntinya, prompt manual sekarang lagi turun level jadi bagian kecil dari sistem. Yang naik nilainya adalah desain loop: \u003cem\u003estopping condition, feedback, state, budget cap, skill library,\u003c/em\u003e dan \u003cem\u003eorchestration\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eReferensi: \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/mattvanhorn/status/2064127981161959567\"\u003ehttps://x.com/mattvanhorn/status/2064127981161959567\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://x.com/mvanhorn/status/2063865685558903149\"\u003ehttps://x.com/mvanhorn/status/2063865685558903149\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"siapa-yang-pegang-kendali-evolusi-siklus-kerja-ai\"\u003eSiapa yang Pegang Kendali? Evolusi Siklus Kerja AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#siapa-yang-pegang-kendali-evolusi-siklus-kerja-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baru aja bedah materi soal evolusi coding agent, dan satu hal yang paling nempel buat gue: evolusinya itu bukan soal \"modelnya makin pinter\", tapi soal \u003cstrong\u003esiapa yang mengendalikan siklus kerja\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eArah geraknya jelas banget: dari LLM yang cuma menjawab -\u003e bertindak -\u003e bekerja berulang -\u003e diverifikasi -\u003e sampai akhirnya dikoordinasikan sebagai sistem kerja.\u003c/p\u003e\n\u003cp\u003eGue coba petakan perjalanannya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eReAct (Reason + Act)\u003c/strong\u003e: Ini fondasi awal. Model nggak cuma mikir di kepala, tapi disuruh cek dunia luar (tool call). Polanya: \u003cem\u003eThought -\u003e Action -\u003e Observation\u003c/em\u003e. Ini nyelesain masalah halusinasi, tapi masih butuh pengawasan manusia tiap detik.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAutoGPT\u003c/strong\u003e: Di sini agent mulai dikasih goal besar dan mencoba ngatur dirinya sendiri. Masalahnya, autonomy tanpa disiplin itu bahaya. Agent sering merasa sibuk (bikin 40 to-do list) tapi nggak produktif, bahkan sering muter-muter (\u003cem\u003estuck in loops\u003c/em\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRalph Loop\u003c/strong\u003e: Solusinya adalah disiplin. Jangan percaya chat history sebagai otak utama, tapi pakai repo/filesystem sebagai memory. Agent jalan berulang dengan anchor file yang sama. Lebih stabil, tapi masih \"bodoh\" soal kapan harus berhenti.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e/goal\u003c/code\u003e\u003c/strong\u003e: Di tahap ini, loop dikasih validator atau \u003cem\u003estopping condition\u003c/em\u003e yang eksplisit. Agent nggak berhenti karena \"merasa\" selesai, tapi karena validator (test, diff, atau model lain) bilang \"DONE\".\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMulti-agent Orchestration\u003c/strong\u003e: Level tertinggi saat ini. Bukan cuma satu agent, tapi ada \u003cem\u003eorchestrator\u003c/em\u003e yang bagi tugas ke banyak worker, reviewer, dan security checker. Ini udah kayak mini engineering team.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eInsight paling tajam buat gue: tiap tahap itu sebenarnya respons terhadap \u003cem\u003efailure mode\u003c/em\u003e sebelumnya. ReAct lawan halusinasi, AutoGPT lawan micromanagement, Ralph lawan chaos autonomy, \u003ccode\u003e/goal\u003c/code\u003e lawan loop abadi, dan Orchestration lawan keterbatasan satu agent.\u003c/p\u003e\n\u003cp\u003eTapi gue juga sadar, makin tinggi levelnya, makin mahal biayanya dan makin besar risiko \u003cem\u003ecomprehension debt\u003c/em\u003e-nya. Kalau kita cuma jadi \"tukang approve\" tanpa paham apa yang dikerjakan orchestrator, kita sebenarnya lagi numpuk hutang pemahaman.\u003c/p\u003e\n\u003cp\u003eReferensi: Artikel Matt Van Horn \u0026#x26; Diskusi Loop Engineering.\u003c/p\u003e\n\u003ch2 id=\"ai-as-engineering-accelerator-not-replacement-allen-holubs-approach\"\u003eAI as Engineering Accelerator, Not Replacement: Allen Holub's Approach\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ai-as-engineering-accelerator-not-replacement-allen-holubs-approach\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTerakhir, gue baca thread dari Allen Holub yang jadi \u003cem\u003ecounterweight\u003c/em\u003e banget buat hype \"loop engineering\". Kalau Addy dan Matt bahas sistem dan orkestrasi, Allen balik lagi ke disiplin engineering dasar.\u003c/p\u003e\n\u003cp\u003eIntinya, Allen ngelawan kultur \"AI = 20x output kode\". Buat dia, AI bukan mesin buat muntahin fitur sebanyak mungkin, tapi alat bantu yang harus dikurung sama arsitektur, test, dan judgment manusia.\u003c/p\u003e\n\u003cp\u003eBeberapa poin yang bikin gue klik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eIncremental \u0026#x26; Small Batches\u003c/strong\u003e: Jangan kasih prompt raksasa. Pecah jadi vertical slice kecil yang bisa dites sebagai black box.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHuman-Led Architecture\u003c/strong\u003e: AI boleh bantu implementasi, tapi arah arsitektur, API, dan boundary tetap di tangan engineer. Jangan biarkan AI jadi arsitek utama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTests as Human Contract\u003c/strong\u003e: Ini yang paling keras. Allen nggak biarkan AI nulis test. Kenapa? Karena AI cenderung bikin test yang \"membenarkan\" kode salahnya sendiri (\u003cem\u003eself-justification\u003c/em\u003e). Test harus ditulis manusia dulu (TDD), baru AI diminta bikin kode yang bisa pass test itu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProductivity \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo mathvariant=\"normal\"\u003e≠\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\neq\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e\u003cspan class=\"mrel\"\u003e\u003cspan class=\"mord vbox\"\u003e\u003cspan class=\"thinbox\"\u003e\u003cspan class=\"rlap\"\u003e\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"\u003e\u003c/span\u003e\u003cspan class=\"inner\"\u003e\u003cspan class=\"mord\"\u003e\u003cspan class=\"mrel\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"fix\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e=\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Volume\u003c/strong\u003e: Produktivitas itu soal \u003cem\u003etime to complete a story\u003c/em\u003e dengan kualitas tinggi, bukan berapa banyak baris kode yang di-generate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSintesis gue: Loop engineering itu leverage besar, tapi syarat mutlaknya adalah disiplin engineering kayak yang ditekankan Allen. Loop boleh jalan, tapi arsitektur tetap dipegang manusia, komponen harus kecil, dan verifikasi (test) nggak boleh diserahkan ke pembuat kode.\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/allenholub/status/2064743466693751082\"\u003ehttps://x.com/allenholub/status/2064743466693751082\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"loop-driven-development-ldd-the-oracle-problem\"\u003eLoop Driven Development (LDD): The Oracle Problem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-driven-development-ldd-the-oracle-problem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah baca Allen, gue nemu tulisan Nuno Campos soal \u003cstrong\u003eLoop Driven Development (LDD)\u003c/strong\u003e. Kalau Allen bilang \"jangan biarkan AI nulis test\", Nuno ngasih teori formalnya: masalah utamanya adalah \u003cstrong\u003eThe Oracle Problem\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eIntinya, di era agent, nulis kode dan scaffolding test itu udah \"gratis\" (murah banget). Yang mahal adalah \u003cstrong\u003emengetahui jawaban yang benar\u003c/strong\u003e (Oracle). Kalau feedback-nya salah, agent cuma bakal looping lebih cepat menuju arah yang salah.\u003c/p\u003e\n\u003cp\u003ePoin-poin yang paling ngena buat gue:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBehavior Coverage vs Code Coverage\u003c/strong\u003e: Coverage 100% nggak berarti sistem benar. Itu cuma berarti semua baris pernah dilewati. Yang penting adalah \u003cem\u003ebehavior coverage\u003c/em\u003e—apakah skenario domain yang krusial sudah dipin dalam test?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRanking Feedback\u003c/strong\u003e: Nuno nge-rank sumber feedback dari yang paling lemah (self-review) sampai yang paling kuat (\u003cstrong\u003eOracle to Mimic\u003c/strong\u003e—sistem nyata yang mau ditiru, deterministic, dan queryable).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLDD Workflow\u003c/strong\u003e: Bukan sekadar \"loop sampai pass\", tapi desain sumber feedback dulu \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e freeze jawaban oracle jadi test \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e biarkan agent looping implementasi sampai pass.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSintesis akhir gue: Loop engineering (Addy/Matt) adalah mesinnya, disiplin engineering (Allen) adalah remnya, dan LDD (Nuno) adalah kompasnya (sumber kebenaran).\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/nfcampos/status/2064746971944956299\"\u003ehttps://x.com/nfcampos/status/2064746971944956299\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"practical-loop-setup-from-theory-to-claude-code\"\u003ePractical Loop Setup: From Theory to Claude Code\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-loop-setup-from-theory-to-claude-code\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTerakhir, gue baca thread dari \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003e@0x_rody (Private)\u003c/a\u003e yang membumikan semua teori loop engineering ini jadi setup praktis di Claude Code. Kalau Addy/Matt bahas sistem besar, Rody kasih \"resep\" 3 file supaya Claude nggak jadi \"sekali tulis lalu kabur\".\u003c/p\u003e\n\u003cp\u003eIntinya, Rody mengubah definisi \u003cstrong\u003eDone\u003c/strong\u003e. Done bukan berarti \"kode sudah ditulis\", tapi \u003cstrong\u003e\"kode sudah diverifikasi\"\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eSetup 3 filenya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eCLAUDE.md\u003c/code\u003e (Protocol)\u003c/strong\u003e: Aturan main. Wajib run checks, max 5 retry, dan dilarang keras melemahkan test supaya terlihat pass.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e.claude/settings.json\u003c/code\u003e (Enforcement)\u003c/strong\u003e: Menggunakan hooks (\u003ccode\u003ePostToolUse\u003c/code\u003e dan \u003ccode\u003eStop\u003c/code\u003e) untuk memaksa typecheck dan test jalan otomatis. Jadi feedback masuk ke session tanpa perlu gue paste manual.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003e.claude/agents/fixer.md\u003c/code\u003e (Escalation)\u003c/strong\u003e: Sub-agent khusus diagnosis kalau loop utama stuck (error yang sama muncul 2x). Fresh context buat cari root cause tanpa baggage dari percobaan gagal.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSintesis final gue hari ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAddy/Matt\u003c/strong\u003e: Loop Engineering (Sistem/Infrastruktur).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAllen\u003c/strong\u003e: Engineering Discipline (Guardrail/Rem).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNuno\u003c/strong\u003e: LDD (Oracle/Kompas).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRody\u003c/strong\u003e: Practical Implementation (Enforcement/Eksekusi).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSiklus lengkap: Desain Oracle \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Pasang Guardrail \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Bangun Loop \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Paksa Verifikasi.\u003c/p\u003e\n\u003cp\u003eReferensi: \u003ca href=\"https://x.com/0x_rody/status/2064728139314389073\"\u003ehttps://x.com/0x_rody/status/2064728139314389073\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ejournal (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"roo
