ps":{"note":{"id":"notes.prompt-engineering.markdown-vs-html-llm","title":"Markdown vs HTML untuk kerja LLM dan kolaborasi manusia","desc":"Memetakan perbedaan tujuan antara artifact yang optimal untuk model dan artifact yang optimal untuk pembaca manusia.","updated":1778468084891,"created":1778464216583,"tags":["notes","prompt-engineering","llm","markdown","html","x","twitter"],"custom":{},"fname":"notes.prompt-engineering.markdown-vs-html-llm","type":"note","vault":{"fsPath":"vault"},"contentHash":"1694d6ce00928c8f9db74a3c149e8777","links":[{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.prompt-engineering","alias":"prompt-engineering","xvault":false,"to":{"fname":"tags.prompt-engineering"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.llm","alias":"llm","xvault":false,"to":{"fname":"tags.llm"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.markdown","alias":"markdown","xvault":false,"to":{"fname":"tags.markdown"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.html","alias":"html","xvault":false,"to":{"fname":"tags.html"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"notes.prompt-engineering.markdown-vs-html-llm","id":"notes.prompt-engineering.markdown-vs-html-llm","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}},{"from":{"fname":"zettel.20260511124516","id":"zettel.20260511124516","vaultName":"vault"},"type":"backlink","position":{"start":{"line":8,"column":12,"offset":417},"end":{"line":8,"column":61,"offset":466},"indent":[]},"value":"notes.prompt-engineering.markdown-vs-html-llm"},{"from":{"fname":"zettel.20260511124517","id":"zettel.20260511124517","vaultName":"vault"},"type":"backlink","position":{"start":{"line":10,"column":12,"offset":442},"end":{"line":10,"column":61,"offset":491},"indent":[]},"value":"notes.prompt-engineering.markdown-vs-html-llm"},{"from":{"fname":"daily.journal.2026.05.11","id":"daily.journal.2026.05.11","vaultName":"vault"},"type":"backlink","position":{"start":{"line":32,"column":25,"offset":2359},"end":{"line":32,"column":74,"offset":2408},"indent":[]},"value":"notes.prompt-engineering.markdown-vs-html-llm"}],"anchors":{"konteks":{"type":"header","text":"Konteks","value":"konteks","line":18,"column":0,"depth":2},"inti-perdebatan":{"type":"header","text":"Inti perdebatan","value":"inti-perdebatan","line":25,"column":0,"depth":2},"kenapa-argumen-thariq-masuk-akal":{"type":"header","text":"Kenapa argumen Thariq masuk akal","value":"kenapa-argumen-thariq-masuk-akal","line":37,"column":0,"depth":2},"reply-thread-apa-yang-benar-benar-nambah-insight":{"type":"header","text":"Reply thread: apa yang benar-benar nambah insight?","value":"reply-thread-apa-yang-benar-benar-nambah-insight","line":50,"column":0,"depth":2},"counter-paling-kuat-ke-posisi-html-lebih-efektif":{"type":"header","text":"Counter paling kuat ke posisi \"HTML lebih efektif\"","value":"counter-paling-kuat-ke-posisi-html-lebih-efektif","line":59,"column":0,"depth":2},"reply-thread-arah-diskusi":{"type":"header","text":"Reply thread: arah diskusi","value":"reply-thread-arah-diskusi","line":69,"column":0,"depth":2},"kenapa-antirez-menolak":{"type":"header","text":"Kenapa antirez menolak","value":"kenapa-antirez-menolak","line":81,"column":0,"depth":2},"counter-paling-kuat-dari-thread":{"type":"header","text":"Counter paling kuat dari thread","value":"counter-paling-kuat-dari-thread","line":92,"column":0,"depth":2},"sintesis-praktis":{"type":"header","text":"Sintesis praktis","value":"sintesis-praktis","line":101,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":110,"column":0,"depth":2}},"children":[],"parent":"notes.prompt-engineering","data":{}},"body":"\u003ch1 id=\"markdown-vs-html-untuk-kerja-llm-dan-kolaborasi-manusia\"\u003eMarkdown vs HTML untuk kerja LLM dan kolaborasi manusia\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#markdown-vs-html-untuk-kerja-llm-dan-kolaborasi-manusia\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenurut gue, thread ini bukan cuma soal artikel Thariq \u003ccode\u003eHTML \u003e Markdown\u003c/code\u003e. Thread antirez itu lebih tepat dibaca sebagai reply-reply yang mengarah ke kerja nyata.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArtikel Thariq: \u003ca href=\"https://x.com/trq212/status/2052809885763747935\"\u003ehttps://x.com/trq212/status/2052809885763747935\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eThread antirez: \u003ca href=\"https://x.com/antirez/status/2053113951123054963\"\u003ehttps://x.com/antirez/status/2053113951123054963\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"inti-perdebatan\"\u003eInti perdebatan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-perdebatan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue nangkep bahwa ini bukan lagi sekadar \"Markdown vs HTML\". Ini soal \u003cstrong\u003eoptimisasi target\u003c/strong\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThariq sedang ngomong soal artifact yang harus dibaca, dinavigasi, dan digunakan manusia dalam alur kerja agent.\u003c/li\u003e\n\u003cli\u003eAntirez sedang ngomong soal representasi yang harus dibaca LLM dengan token economy dan semantic density.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi menurut gue:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eThariq:\u003c/strong\u003e artifact = interface kerja.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eantirez:\u003c/strong\u003e artifact = semantic carrier.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-argumen-thariq-masuk-akal\"\u003eKenapa argumen Thariq masuk akal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-argumen-thariq-masuk-akal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue setuju kalau antitesisnya bukan sekadar visual bagus atau buruk. Thariq menunjukkan masalah konkret: output agent yang nggak dibaca manusia itu gagal, sekalipun logikanya oke.\u003c/p\u003e\n\u003cp\u003eHTML dia anggap lebih baik di konteks:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evisual yang lebih kaya,\u003c/li\u003e\n\u003cli\u003enavigasi dan hierarchy yang lebih jelas,\u003c/li\u003e\n\u003cli\u003epreview atau prototype yang lebih bisa dipakai,\u003c/li\u003e\n\u003cli\u003ereview/report yang lebih mudah dipahaminya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi di mata gue, klaim Thariq bukan bahwa HTML selalu lebih baik secara teknis. Dia bilang HTML lebih efektif di ranah \"human-in-the-loop usability.\"\u003c/p\u003e\n\u003ch2 id=\"reply-thread-apa-yang-benar-benar-nambah-insight\"\u003eReply thread: apa yang benar-benar nambah insight?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reply-thread-apa-yang-benar-benar-nambah-insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread ini tidak hanya penuh dukungan dan sarkasme. Ada beberapa kategori penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eReaksi sosial / humor\u003c/strong\u003e: komentar seperti \"bad time for a twitter bug\" atau \"long markdown x post\" lebih menunjukkan konteks percakapan daripada nambah argumen teknis.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDukungan umum\u003c/strong\u003e: \"great post\" atau \"agreed\" adalah validasi sosial, tapi bukan memperjelas scope argumentasi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCounter moderat\u003c/strong\u003e: ini yang paling berguna. Beberapa reply menyokong HTML untuk prototype, preview, atau UI-heavy artifact, sementara tetap mengakui Markdown lebih cocok untuk text-focused content dan standard workflow.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePosisi maksimalis Thariq\u003c/strong\u003e: dia kadang bergerak dari \"HTML efektif untuk banyak artifact\" ke \"HTML strictly better\". Itu menurut gue titik lemah karena mengabaikan biaya diff, editing, dan portability.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"counter-paling-kuat-ke-posisi-html-lebih-efektif\"\u003eCounter paling kuat ke posisi \"HTML lebih efektif\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#counter-paling-kuat-ke-posisi-html-lebih-efektif\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTiga kontra yang paling berpengaruh:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eKnowledge vs presentation\u003c/strong\u003e: Markdown sebagai canonical source, HTML sebagai rendered/operational surface. Ini menyelamatkan kedua format dari perang agama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown unggul untuk text-focused artifact\u003c/strong\u003e: plans, docs, notes, prompt packs, reasoning memo. HTML bisa melakukannya, tapi sering jadi overkill.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBiaya operasional HTML\u003c/strong\u003e: noisy diffs, fitur presentasi yang berbeda-beda, dan risiko format jadi terlalu dekoratif.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDiskusi thread ini mempersempit klaim artikel agar lebih pragmatis. Artikel Thariq kuat sebagai argumen bahwa HTML bisa jadi lebih efektif untuk human-facing agent artifacts, tetapi klaim \"HTML lebih baik untuk semua\" harus diuji ulang.\u003c/p\u003e\n\u003ch2 id=\"reply-thread-arah-diskusi\"\u003eReply thread: arah diskusi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reply-thread-arah-diskusi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari reply yang gue baca, diskusi nggak mengarah ke kemenangan antirez penuh, dan juga nggak membela HTML murni ala Thariq.\nBanyak reply menggeser framing dari \"format mana yang lebih baik\" menjadi \"format mana dipakai di layer mana\".\u003c/p\u003e\n\u003cp\u003eBeberapa reply yang paling menentukan arah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown untuk source / agent-facing context\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHTML untuk rendered output / human-facing surface\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHybrid, bukan replacement\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePipeline terpisah\u003c/strong\u003e: core reasoning tetap padat, HTML diproduksi sebagai layer final bila perlu\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-antirez-menolak\"\u003eKenapa antirez menolak\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-antirez-menolak\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue nangkep posisi antirez sebagai argumen dari layer yang berbeda. Dia bilang HTML bisa jadi overkill untuk LLM karena:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHTML biasanya lebih verbose,\u003c/li\u003e\n\u003cli\u003estruktur presentasi sering menambah token tanpa menambah makna inti,\u003c/li\u003e\n\u003cli\u003eLLM nggak membaca DOM secara formal seperti parser deterministik,\u003c/li\u003e\n\u003cli\u003emakin banyak wrapper berarti attention budget model dipakai untuk noise.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi, kalau dilihat dari sudut itu, antirez nggak bilang \"HTML buruk\" secara mutlak. Dia mempertanyakan apakah HTML adalah format optimal untuk reasoning-model.\u003c/p\u003e\n\u003ch2 id=\"counter-paling-kuat-dari-thread\"\u003eCounter paling kuat dari thread\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#counter-paling-kuat-dari-thread\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread memberikan counter yang cukup spesifik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown vs HTML bukan peperangan format\u003c/strong\u003e — ini tentang fungsi artifact.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown kuat untuk knowledge storage, versioning, diffs, and agent comms.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHTML kuat untuk legibility, interactive review, and human-facing presentation.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGenerate HTML terpisah dari source\u003c/strong\u003e lebih masuk akal daripada menjadikannya canonical representation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sintesis-praktis\"\u003eSintesis praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau disimpulin, menurut gue sintesisnya begini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epakai \u003cstrong\u003eMarkdown / format padat\u003c/strong\u003e untuk prompt, catatan, agent context, reasoning, dan storage;\u003c/li\u003e\n\u003cli\u003epakai \u003cstrong\u003eHTML\u003c/strong\u003e bila kamu butuh output yang dibaca manusia, direview, atau dioperasikan;\u003c/li\u003e\n\u003cli\u003ejangan pakai HTML sebagai source utama kalau goal-nya adalah reasoning model;\u003c/li\u003e\n\u003cli\u003epipeline terbaik mungkin adalah: reasoning padat dulu, lalu render ke HTML untuk presentasi jika perlu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDebat ini paling sehat kalau kita berhenti bertanya \"format mana paling bagus\" dan mulai bertanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esiapa pembacanya?\u003c/li\u003e\n\u003cli\u003eapa fungsi artefak ini?\u003c/li\u003e\n\u003cli\u003eapakah ini medium reasoning atau interface kerja?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan begitu, kita tidak lagi mengulangi perdebatan agama Markdown vs HTML, tetapi memikirkan desain workflow yang sebenarnya.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprompt-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ellm (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emarkdown (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehtml (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124516\"\u003eMarkdown sebagai source of truth, HTML sebagai human-facing surface\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124517\"\u003eThread Markdown vs HTML mengarah ke desain pipeline, bukan victory lap format\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.11\"\u003e2026-05-11\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity ti
