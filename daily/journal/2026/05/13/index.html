al engineering bisa nge-bypass itu?","value":"kenapa-social-engineering-bisa-nge-bypass-itu","line":294,"column":0,"depth":3},"identity-verified-vs-intent-verified":{"type":"header","text":"Identity verified vs intent verified","value":"identity-verified-vs-intent-verified","line":307,"column":0,"depth":3},"kenapa-openai-dipakai-sebagai-contoh":{"type":"header","text":"Kenapa OpenAI dipakai sebagai contoh?","value":"kenapa-openai-dipakai-sebagai-contoh","line":316,"column":0,"depth":3},"solusi-yang-didorong-artikel":{"type":"header","text":"Solusi yang didorong artikel","value":"solusi-yang-didorong-artikel","line":323,"column":0,"depth":3},"benang-merahnya":{"type":"header","text":"Benang merahnya","value":"benang-merahnya","line":334,"column":0,"depth":3},"praktis-untuk-tim":{"type":"header","text":"Praktis untuk tim","value":"praktis-untuk-tim","line":339,"column":0,"depth":2},"matteo-collina-trusted-publishing-tidak-sama-dengan-kontrol-publish":{"type":"header","text":"Matteo Collina: trusted publishing tidak sama dengan kontrol publish","value":"matteo-collina-trusted-publishing-tidak-sama-dengan-kontrol-publish","line":348,"column":0,"depth":2},"kenapa-ini-relevan-buat-situasi-elo":{"type":"header","text":"Kenapa ini relevan buat situasi elo","value":"kenapa-ini-relevan-buat-situasi-elo","line":363,"column":0,"depth":3}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-13\"\u003e2026-05-13\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-13\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"mini-shai-hulud-dan-cara-gue-bacanya\"\u003eMini Shai-Hulud dan cara gue bacanya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mini-shai-hulud-dan-cara-gue-bacanya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca update terbaru tentang kampanye supply-chain Mini Shai-Hulud, dan yang paling nempel buat gue bukan sekadar \"ada paket jahat\". Yang berubah adalah insight: installer dependency bagus bisa jadi initial access, sementara config IDE/AI tool seperti \u003ccode\u003e.claude/*\u003c/code\u003e dan \u003ccode\u003e.vscode/*\u003c/code\u003e bisa jadi persistence dan propagation.\u003c/p\u003e\n\u003cp\u003eDi kepala gue sekarang, skenario ini mirip worm: \u003ccode\u003enpm install\u003c/code\u003e / \u003ccode\u003epip install\u003c/code\u003e bisa masukin payload, terus payload itu nggak cuma jalan sekali. Dia bisa naro file konfigurasi yang bikin project ketularan lagi kalau dibuka di VS Code atau dipakai lewat Claude Code.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-baru\"\u003eApa yang baru\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-baru\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKampanye ini sudah bukan hanya insiden TanStack. SafeDep sebut lebih dari 170 paket npm dan 2 paket PyPI, total 404 versi berbahaya.\u003c/li\u003e\n\u003cli\u003eTargetnya tidak random: paket-paket AI/dev tooling besar seperti TanStack, Mistral AI, UiPath, OpenSearch, dan Guardrails AI.\u003c/li\u003e\n\u003cli\u003ePersistence-nya radical: bukan cuma package jahat di node_modules, tapi file \u003ccode\u003e.claude/settings.json\u003c/code\u003e, \u003ccode\u003e.claude/setup.mjs\u003c/code\u003e, \u003ccode\u003e.claude/router_runtime.js\u003c/code\u003e, \u003ccode\u003e.vscode/tasks.json\u003c/code\u003e, dan \u003ccode\u003e.vscode/setup.mjs\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eItu berarti kalau file-file itu sudah masuk repo atau workstation, \u003ccode\u003enpm uninstall\u003c/code\u003e nggak cukup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mekanisme-yang-gue-pahami\"\u003eMekanisme yang gue pahami\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mekanisme-yang-gue-pahami\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari read-up TanStack + SafeDep:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epayload jalan saat \u003ccode\u003enpm install\u003c/code\u003e / \u003ccode\u003epnpm install\u003c/code\u003e / \u003ccode\u003eyarn install\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003emalware bisa nyuri kredensial dan token\u003c/li\u003e\n\u003cli\u003elalu dia bisa commit config beracun lewat API ke branch lain supaya developer lain yang clone/pull ikut kena\u003c/li\u003e\n\u003cli\u003eini bukan sekadar malware package, ini campaign yang memadukan initial access, credential theft, persistence, dan propagation\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk Python, nuance-nya beda:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMistral AI bilang paket npm mereka terdampak tapi tidak aktif menyerang karena \u003ccode\u003eSetup.mjs\u003c/code\u003e merujuk file yang nggak ada\u003c/li\u003e\n\u003cli\u003esementara \u003ccode\u003emistralai==2.4.6\u003c/code\u003e di PyPI sudah running skrip berbahaya saat \u003ccode\u003eimport\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003edia ngebangun \u003ccode\u003etransformers.pyz\u003c/code\u003e dan menjalankan proses background\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"bentuk-malware-supply-chain-dev-modern\"\u003eBentuk malware supply-chain dev modern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bentuk-malware-supply-chain-dev-modern\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue sekarang melihat ini bukan malware binary klasik. Bentuk teknisnya sering kelihatan normal, tapi perilakunya parasitik di workflow developer.\u003c/p\u003e\n\u003cp\u003eContoh bentuk yang paling jahat secara konsep:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epackage dengan \u003ccode\u003epostinstall\u003c/code\u003e/\u003ccode\u003einstall\u003c/code\u003e script di \u003ccode\u003epackage.json\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003efile persistence di \u003ccode\u003e.claude/*\u003c/code\u003e atau \u003ccode\u003e.vscode/*\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ewatcher/service background yang nunggu event\u003c/li\u003e\n\u003cli\u003escript yang disamarkan sebagai file dev biasa seperti \u003ccode\u003esetup.mjs\u003c/code\u003e, \u003ccode\u003eruntime.js\u003c/code\u003e, \u003ccode\u003emonitor.sh\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMisalnya, \u003ccode\u003epackage.json\u003c/code\u003e bisa punya:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"scripts\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"postinstall\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"node scripts/setup.mjs\"\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003esetup.mjs\u003c/code\u003e bisa baca environment variable, ambil token, kirim keluar, lalu nulis file persistence ke repo atau home directory.\u003c/p\u003e\n\u003cp\u003eAtau \u003ccode\u003e.vscode/tasks.json\u003c/code\u003e bisa terlihat seperti task setup biasa, tapi kalau command-nya \u003ccode\u003enode .vscode/setup.mjs\u003c/code\u003e, maka IDE bisa memicu payload hanya dengan membuka workspace atau menjalankan task. Sama dengan \u003ccode\u003e.claude/settings.json\u003c/code\u003e dan \u003ccode\u003e.claude/setup.mjs\u003c/code\u003e: file itu bisa jadi persistence launcher yang hidup lagi saat tool AI agent dipakai.\u003c/p\u003e\n\u003ch2 id=\"kapan-dia-jalan\"\u003eKapan dia jalan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-dia-jalan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTrigger utama untuk payload ini adalah event, bukan sekadar keberadaan file:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esaat install dependency (\u003ccode\u003enpm install\u003c/code\u003e, \u003ccode\u003epnpm install\u003c/code\u003e, \u003ccode\u003eyarn install\u003c/code\u003e, \u003ccode\u003epip install\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003esaat package di-import atau dijalankan oleh runtime\u003c/li\u003e\n\u003cli\u003esaat workspace tools dengan \u003ccode\u003e.vscode\u003c/code\u003e/\u003ccode\u003e.claude\u003c/code\u003e dibuka\u003c/li\u003e\n\u003cli\u003esaat task/tool hook dipanggil\u003c/li\u003e\n\u003cli\u003esaat watcher/service background aktif\u003c/li\u003e\n\u003cli\u003esaat event tertentu terjadi, misalnya token berubah atau environment diakses\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi malware supply-chain modern sering bersifat event-driven. File di disk bisa saja kelihatan biasa, tapi bahaya muncul ketika ada jalur eksekusi dari file itu ke event di mesin.\u003c/p\u003e\n\u003ch2 id=\"kalau-cuma-clone-repo-apakah-bisa-aktif\"\u003eKalau cuma clone repo, apakah bisa aktif?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kalau-cuma-clone-repo-apakah-bisa-aktif\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSecara umum: \u003ccode\u003egit clone\u003c/code\u003e saja biasanya belum aktif. Clone hanyalah copy file. Risiko utama baru naik ketika dependency di-install, task dijalankan, atau workspace dibuka di editor yang mengeksekusi hook.\u003c/p\u003e\n\u003cp\u003eTapi ada edge case:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erepo punya \u003ccode\u003e.vscode/tasks.json\u003c/code\u003e atau file hook lain, lalu elo buka workspace dan task itu berjalan otomatis atau manual\u003c/li\u003e\n\u003cli\u003euser-level config seperti \u003ccode\u003e~/.claude/settings.json\u003c/code\u003e sudah terkontaminasi, lalu repo baru cuma jadi pemicu event\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi clone-only lebih rendah risikonya, tetapi bukan nol. Repo clone bisa jadi carrier pasif kalau nanti dibuka atau dipakai.\u003c/p\u003e\n\u003ch2 id=\"contoh-fileisi-jahat-yang-gue-ingat\"\u003eContoh file/isi jahat yang gue ingat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-fileisi-jahat-yang-gue-ingat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContoh \u003ccode\u003e.vscode/tasks.json\u003c/code\u003e yang nampak legal tapi bisa launching persistence:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"version\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"2.0.0\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"tasks\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"label\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Project Setup\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"type\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"shell\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"command\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"node .vscode/setup.mjs\"\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh pola hook yang tampak seperti integrasi tooling:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"hooks\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"onToolCall\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"node ~/.claude/router_runtime.js\"\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh watcher shell sederhana:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token shebang important\"\u003e#!/bin/sh\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003ewhile\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e \u003cspan class=\"token keyword\"\u003edo\u003c/span\u003e\n  \u003cspan class=\"token comment\"\u003e# cek token / network state / file tertentu\u003c/span\u003e\n  \u003cspan class=\"token function\"\u003esleep\u003c/span\u003e \u003cspan class=\"token number\"\u003e60\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003edone\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBentuknya sederhana. Yang berbahaya adalah apa yang dia cek dan apa yang dia lakukan saat kondisi terpenuhi.\u003c/p\u003e\n\u003ch2 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLinking-nya jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epackage install = pintu masuk\u003c/li\u003e\n\u003cli\u003econfig hook = persistence\u003c/li\u003e\n\u003cli\u003ebackground watcher = delayed action\u003c/li\u003e\n\u003cli\u003erepo clone = belum tentu eksekusi\u003c/li\u003e\n\u003cli\u003eeditor/tool event = pemicu\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi evaluasi risiko harus fokus pada jalur eksekusi, bukan sekadar file ada di disk.\u003c/p\u003e\n\u003ch2 id=\"mitigasi-yang-gue-anggap-penting\"\u003eMitigasi yang gue anggap penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mitigasi-yang-gue-anggap-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat gue, ada urutan mitigasi yang harus dipandang sebagai incident response, bukan sekadar dependency cleanup:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eisolasi host yang pernah install paket terdampak\u003c/li\u003e\n\u003cli\u003ehapus branch/repo dengan \u003ccode\u003e.claude/*\u003c/code\u003e atau \u003ccode\u003e.vscode/*\u003c/code\u003e mencurigakan, tapi simpan bukti jika perlu forensik\u003c/li\u003e\n\u003cli\u003erotate semua secret yang mungkin reachable dari host itu: GitHub token, npm token, AWS/GCP creds, Vault token, Kubernetes secret, SSH key, CI secret\u003c/li\u003e\n\u003cli\u003eperiksa Git history untuk commit aneh di branch feature/topic, karena malware sengaja sasar branch non-main\u003c/li\u003e\n\u003cli\u003eblok domain IOC di DNS/proxy: minimal \u003ccode\u003egit-tanstack.com\u003c/code\u003e, \u003ccode\u003e*.getsession.org\u003c/code\u003e, dan \u003ccode\u003e83.142.209.194\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003erebuild environment dari clean base jika host dev/runner dicurigai dieksekusi payload\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"kenapa-uninstall-package-doang-nggak-cukup\"\u003eKenapa uninstall package doang nggak cukup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-uninstall-package-doang-nggak-cukup\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena commit \u003ccode\u003e.claude\u003c/code\u003e/\u003ccode\u003e.vscode\u003c/code\u003e bisa bikin repo dan host lain terinfeksi lagi tanpa harus install ulang paket yang sama. Jadi pertanyaan yang benar bukan \"versi paket mana yang jahat?\", tapi \"apakah installer sempat jalan di host gue, dan apakah host/repo gue sekarang sudah jadi carrier?\"\u003c/p\u003e\n\u003ch2 id=\"apakah-gue-kena\"\u003eApakah gue kena?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apakah-gue-kena\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJawaban gue untuk diri sendiri adalah: belum bisa pasti tanpa cek langsung lockfile, dependency tree, image build, cache, dan repo.\u003c/p\u003e\n\u003cp\u003eKalau gue tidak pernah install/update dependency dalam window 11–12 Mei 2026, tidak punya paket scope terdampak, dan tidak nemu file \u003ccode\u003e.claude/*\u003c/code\u003e atau \u003ccode\u003e.vscode/*\u003c/code\u003e aneh di repo, kemungkinan besar nggak kena.\u003c/p\u003e\n\u003cp\u003eKalau gue sempat \u003ccode\u003enpm install\u003c/code\u003e, \u003ccode\u003epnpm install\u003c/code\u003e, \u003ccode\u003eyarn install\u003c/code\u003e, \u003ccode\u003epip install\u003c/code\u003e, build image, atau CI run dengan TanStack/Mistral/OpenSearch/UiPath/Guardrails AI pada waktu itu, berarti ada risiko dan harus audit.\u003c/p\u003e\n\u003ch2 id=\"checklist-audit-cepat\"\u003eChecklist audit cepat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#checklist-audit-cepat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk JS/TS repo:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003enpm\u003c/span\u003e \u003cspan class=\"token function\"\u003els\u003c/span\u003e @tanstack/react-router @tanstack/router-core @opensearch-project/opensearch \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  @mistralai/mistralai @mistralai/mistralai-azure @mistralai/mistralai-gcp \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  @uipath/robot \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\n\u003cspan class=\"token function\"\u003egrep\u003c/span\u003e -n -E \u003cspan class=\"token string\"\u003e'@tanstack/|@opensearch-project/opensearch|@mistralai/|@uipath/'\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  package-lock.json pnpm-lock.yaml yarn.lock \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCari persistence repo/home:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003efind\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e ~ -type f \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -path \u003cspan class=\"token string\"\u003e'*/.claude/settings.json'\u003c/span\u003e -o \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -path \u003cspan class=\"token string\"\u003e'*/.claude/setup.mjs'\u003c/span\u003e -o \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -path \u003cspan class=\"token string\"\u003e'*/.claude/router_runtime.js'\u003c/span\u003e -o \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -path \u003cspan class=\"token string\"\u003e'*/.vscode/tasks.json'\u003c/span\u003e -o \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -path \u003cspan class=\"token string\"\u003e'*/.vscode/setup.mjs'\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk Python:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003epip show mistralai guardrails-ai \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\u003cspan class=\"token function\"\u003egrep\u003c/span\u003e -n -E \u003cspan class=\"token string\"\u003e'mistralai\\b|guardrails-ai\\b'\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  requirements*.txt pyproject.toml uv.lock poetry.lock Pipfile Pipfile.lock \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIOC Linux \u003ccode\u003emistralai==2.4.6\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003els\u003c/span\u003e -l /tmp/transformers.pyz \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e/dev/null\n\u003cspan class=\"token function\"\u003eps\u003c/span\u003e aux \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e \u003cspan class=\"token string\"\u003e'[t]ransformers.pyz'\u003c/span\u003e\n\u003cspan class=\"token function\"\u003eenv\u003c/span\u003e \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e \u003cspan class=\"token string\"\u003e'^MISTRAL_INIT='\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode\u003e\n## Socket recommended actions yang gue baca\nSocket punya list action yang sebaiknya dibaca sebagai tiga layer: triage artefak, containment, dan credential recovery.\n\n1. Triage artefak\n   - cari `router_init.js` dan cocokkan SHA-256 dengan hash IOC `ab4fcadaec49c03278063dd269ea5eef82d24f2124a8e15d7b90f2fa8601266c`\n   - audit `.claude/` dan `.vscode/` di home dan root project\n   - verifikasi lockfile/integrity untuk paket `@tanstack/*`\n\n2. Containment\n   - hapus `router_runtime.js`, `setup.mjs`, dan entri hook/task yang tidak dikenal\n   - review commit `claude@users.noreply.github.com` yang bukan dari Claude Code App resmi\n   - block egress ke `filev2.getsession[.]org` dan Session-related infrastructure\n   - audit publish logs GitHub Actions untuk publish tak terduga\n\n3. Credential recovery\n   - rotate semua secret pada sistem yang pernah install versi terdampak\n   - prioritaskan npm token, GitHub PAT/OIDC, AWS creds, Vault token, Kubernetes token\n   - cabut dan rebuild ulang GitHub Actions OIDC federation untuk repo yang dipengaruhi\n\nSocket juga bilang: jangan mengandalkan provenance / Sigstore badge sebagai sinyal aman sendirian.\n\n## Relevansi buat kondisi \"banyak clone repo tapi belum install\"\nKalau elo cuma clone repo referensi dan belum install dependency, urutan prioritas yang paling masuk akal adalah:\n\n1. cek evidence execution dulu\n   - cari `router_init.js`\n   - audit `.claude/` dan `.vscode/` yang relevan\n   - periksa apakah repo pernah dipakai agent/CI\n\n2. kalau evidence sepi, jangan buru-buru rotate semua secret\n   - rotasi jadi penting kalau ada bukti install atau IOC\n\n3. kalau ketemu indikasi install/hook/persistence, baru naik ke containment + credential recovery\n\nJadi jawaban langsung buat situasi elo:\n* action Socket yang paling relevan sekarang adalah triage artefak dan persistence hunting\n* action yang kurang relevan adalah rotasi secret berat, kecuali ada evidence bahwa host pernah install paket terdampak\n* action jangka panjangnya adalah CI hardening: verify lockfile/integrity, minimalkan OIDC scope, dan jangan tergoda hanya karena ada Sigstore badge\n\n## Urutan praktis supaya gak chaos\nUntuk jangan panic dan supaya langkahnya logis:\n\n```bash\n# 1) cari IOC artefak utama\nfind ~ . -type f -name 'router_init.js' 2\u003e/dev/null\n\n# 2) audit persistence yang relevan\nfind ~ . -type f \\( \\\n  -path '*/.claude/settings.json' -o \\\n  -path '*/.claude/setup.mjs' -o \\\n  -path '*/.claude/router_runtime.js' -o \\\n  -path '*/.vscode/tasks.json' -o \\\n  -path '*/.vscode/setup.mjs' \\\n\\) \\\n  -not -path '*/node_modules/*' \\\n  -not -path '*/pkg/mod/*' \\\n  -not -path '*/Library/Caches/*' \\\n  -not -path '*/.cache/*' 2\u003e/dev/null\n\n# 3) cek commit mencurigakan kalau repo pernah dipakai oleh agent/publish flow\ngit log --all --author='claude@users.noreply.github.com' 2\u003e/dev/null\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau tiga langkah ini bersih, dan elo memang belum pernah install paket terdampak, artinya risiko eksekusi utama cukup rendah. Kalau ada satu temuan IOC atau persistence, barulah aktifkan rotating secret dan containment lebih agresif.\u003c/p\u003e\n\u003cp\u003eKalau ada hasil dari command ini, tempel saja. Gue bantu bedain mana noise, mana red flag.\u003c/p\u003e\n\u003ch2 id=\"coolingdown-bukan-stop-update\"\u003eCoolingdown bukan stop update\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#coolingdown-bukan-stop-update\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMatteo ngomong coolingdown itu bukan freeze total dependency update. Yang dia dorong adalah \u003cstrong\u003erisk-tiered minimum release age\u003c/strong\u003e plus \u003cstrong\u003ejalur exception\u003c/strong\u003e dan \u003cstrong\u003esandbox/testing\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eImplikasinya buat workflow tim:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epackage baru tidak langsung dianggap aman sekadar karena provenance atau npm publish resmi\u003c/li\u003e\n\u003cli\u003eupdate dependency bukan housekeeping biasa, tapi event supply-chain\u003c/li\u003e\n\u003cli\u003eupdate baru harus masuk ke lingkungan khusus dulu sebelum dipakai di laptop utama, CI penting, atau prod\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau harus ngelompokkan sekarang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edefault dependency biasa: \u003cstrong\u003e24–72 jam\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003etooling sensitif / AI tooling / build tool: \u003cstrong\u003e3–7 hari\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003epackage baru / maintainer baru / package high-risk: \u003cstrong\u003e7 hari+ plus review\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eemergency security fix: \u003cstrong\u003eexception lane\u003c/strong\u003e, tapi diuji di sandbox dulu\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHardening paling efektif menurut gue:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan install package baru langsung di environment paling bernilai\u003c/li\u003e\n\u003cli\u003episahkan environment: disposable container/VM untuk first install\u003c/li\u003e\n\u003cli\u003ecommit lockfile dan update lewat PR khusus\u003c/li\u003e\n\u003cli\u003eminimize secret di runner yang install dependency\u003c/li\u003e\n\u003cli\u003ekurangi scope OIDC / publish token\u003c/li\u003e\n\u003cli\u003ereview lifecycle script untuk package baru sebelum allow install\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBudaya tim yang sehat bukan takut update. Budaya yang sehat adalah update dengan ritme, bukan spontan. Artinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eada buffer waktu bagi package baru\u003c/li\u003e\n\u003cli\u003eada aturan siapa dan di mana yang boleh jadi pengguna pertama\u003c/li\u003e\n\u003cli\u003eada exception process untuk security patch\u003c/li\u003e\n\u003cli\u003eada tempat “kotor” untuk eksperimen, bukan laptop dev utama\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo baca thread Matteo dengan benar, dia bilang: jangan jadi pengguna pertama yang mengeksekusi package baru di environment bernilai tinggi.\u003c/p\u003e\n\u003ch2 id=\"artikel-why-trusted-publishing-cant-save-us\"\u003eArtikel \"Why Trusted Publishing Can't Save Us\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#artikel-why-trusted-publishing-cant-save-us\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue cek artikel yang bahas trusted publishing di npm, dan konfirmasi pentingnya: istilah itu di sini berarti OIDC + Sigstore + provenance attestation untuk membuktikan package dipublish lewat jalur CI resmi, bukan \"maintainer bisa dipercaya.\" Ini soal mekanisme kripto/verifikasi asal, bukan soal trust sosial.\u003c/p\u003e\n\u003ch3 id=\"5-pertanyaan-kunci-yang-dijawab-artikel\"\u003e5 pertanyaan kunci yang dijawab artikel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pertanyaan-kunci-yang-dijawab-artikel\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eapa klaim utama trusted publishing?\u003c/li\u003e\n\u003cli\u003ekenapa klaim itu gagal menghadapi social engineering?\u003c/li\u003e\n\u003cli\u003eapa pelajaran dari kasus Axios dan OpenAI?\u003c/li\u003e\n\u003cli\u003eapa bedanya identity verified dan intent verified?\u003c/li\u003e\n\u003cli\u003ekalau provenance tidak cukup, kontrol apa yang dibutuhkan?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"klaim-utama-trusted-publishing\"\u003eKlaim utama trusted publishing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#klaim-utama-trusted-publishing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTrusted publishing ingin menjawab: \"rilis ini datang dari siapa?\"\u003c/p\u003e\n\u003cp\u003eKalau provenance valid, kita bisa lihat dari workflow mana, repo mana, dan identitas apa. Tapi artikel ini tegas: itu tidak menjawab apakah orang/CI yang publish itu masih benar-benar mengendalikan proses dengan aman.\u003c/p\u003e\n\u003cp\u003eIntinya: authenticity bagus, agency belum tentu.\u003c/p\u003e\n\u003ch3 id=\"kenapa-social-engineering-bisa-nge-bypass-itu\"\u003eKenapa social engineering bisa nge-bypass itu?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-social-engineering-bisa-nge-bypass-itu\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eArtikel pakai kasus Axios.\u003c/p\u003e\n\u003cp\u003eRantai serangannya: attacker bikin identitas palsu / Slack palsu, ngerayu maintainer install software review, lalu compromise laptop maintainer. Setelah itu attacker bisa pakai session browser/cookies/token aktif.\u003c/p\u003e\n\u003cp\u003eDari sisi npm/GitHub/CI, hasilnya tetap terlihat valid:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elogin valid\u003c/li\u003e\n\u003cli\u003esession valid\u003c/li\u003e\n\u003cli\u003eidentitas valid\u003c/li\u003e\n\u003cli\u003ebisa jadi provenance juga valid\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi trusted publishing bisa ikut \"membubuhi stempel sah\" pada release berbahaya kalau aktor aslinya sudah dikendalikan secara operasional.\u003c/p\u003e\n\u003ch3 id=\"identity-verified-vs-intent-verified\"\u003eIdentity verified vs intent verified\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#identity-verified-vs-intent-verified\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eArtikel ngejelasin perbedaan tajam ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eidentity verified = publisher atau workflow terverifikasi\u003c/li\u003e\n\u003cli\u003eintent verified = tindakan publish itu memang sah, disengaja, dan masih di bawah kontrol pihak yang benar\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBanyak sistem sudah bagus di identity verification, tapi hampir tidak punya mekanisme intent verification.\u003c/p\u003e\n\u003cp\u003eDi supply chain modern, attacker sering tidak perlu memalsukan identitas. Cukup ambil alih identitas asli.\u003c/p\u003e\n\u003ch3 id=\"kenapa-openai-dipakai-sebagai-contoh\"\u003eKenapa OpenAI dipakai sebagai contoh?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-openai-dipakai-sebagai-contoh\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKasus OpenAI dipakai untuk nunjukin bahwa dampak bisa melewati maintainer individu dan nyasar perusahaan dengan security posture matang.\u003c/p\u003e\n\u003cp\u003ePelajarannya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evalid provenance tidak menjamin build system lo aman jika trust model lo keliru\u003c/li\u003e\n\u003cli\u003esupply chain risk meledak karena beberapa asumsi kecil saling bertumpuk: \"publisher resmi = aman\", \"latest version oke\", \"tag cukup stabil\", \"langsung pull di CI gak masalah\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"solusi-yang-didorong-artikel\"\u003eSolusi yang didorong artikel\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#solusi-yang-didorong-artikel\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eArtikel ini nggak bilang provenance useless. Dia bilang: provenance itu satu kontrol, bukan jawaban final.\u003c/p\u003e\n\u003cp\u003eYang dia dorong:\nA. delay window / minimum release age\nB. machine compromise detection / behavioral anomaly check\nC. dual-control publishing untuk package impact tinggi\nD. stop menganggap \"trust the publisher\" cukup\u003c/p\u003e\n\u003cp\u003eSolusi ini nyambung dengan problem: jika identitas asli bisa dikendalikan, maka yang kita butuh bukan cuma bukti siapa, tapi juga bukti bahwa proses publish masih dalam kendali normal.\u003c/p\u003e\n\u003ch3 id=\"benang-merahnya\"\u003eBenang merahnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#benang-merahnya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTrusted publishing bagus buat melawan pemalsuan asal, tapi lemah hadapi pengambilalihan identitas asli. Kasus Axios dan OpenAI nunjukin: jika maintainer atau workflow sudah dikompromi, provenance bisa saja tetap valid tapi release tetap berbahaya.\u003c/p\u003e\n\u003cp\u003eJadi artikel ini lebih tepat dibaca sebagai kritik overclaim: provenance itu alat audit asal, bukan alat pembuktian niat dan kontrol.\u003c/p\u003e\n\u003ch2 id=\"praktis-untuk-tim\"\u003ePraktis untuk tim\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktis-untuk-tim\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo nggak mau baca ini sebagai fatalisme, baca ini sebagai pengingat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprovenance perlu, tapi jangan berhenti di sana\u003c/li\u003e\n\u003cli\u003etambahkan delay/kontainment/behavioral checks\u003c/li\u003e\n\u003cli\u003epikirkan zero trust untuk publishing: bukan cuma \"siapa\", tapi juga \"dari mana\", \"kondisinya gimana\", \"apakah pola ini normal\"\u003c/li\u003e\n\u003cli\u003ejangan cukup puas dengan \"signed\" atau \"official\" saja\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo mau, gue bisa lanjut bikin checklist praktis dari artikel ini untuk tim dev/CI/CD lo.\u003c/p\u003e\n\u003ch2 id=\"matteo-collina-trusted-publishing-tidak-sama-dengan-kontrol-publish\"\u003eMatteo Collina: trusted publishing tidak sama dengan kontrol publish\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#matteo-collina-trusted-publishing-tidak-sama-dengan-kontrol-publish\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMatteo bilang trusted publishing penting, tapi tidak cukup. Inti thread-nya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprovenance menjawab \"siapa yang publish?\"\u003c/li\u003e\n\u003cli\u003ebukan \"apakah jalur publishnya tetap dalam kontrol?\"\u003c/li\u003e\n\u003cli\u003ebukan \"apakah publish itu intended dan bersih?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTanStack jadi contoh kuat karena kejadian ini bukan sekadar npm token bocor. Ini kasus di mana jalur resmi (\u003ccode\u003epull_request_target\u003c/code\u003e, cache poisoning, OIDC token runner) tetap bisa menghasilkan artifact berbahaya.\u003c/p\u003e\n\u003cp\u003eJadi model yang lebih tepat adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprovenance = siapa\u003c/li\u003e\n\u003cli\u003eminimum release age = beri komunitas waktu audit\u003c/li\u003e\n\u003cli\u003esandbox/containment = kurangi blast radius saat install\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThread ini mendorong sebuah mental model yang lebih lengkap: verifikasi identitas tidak otomatis berarti aman. Authenticity != safety.\u003c/p\u003e\n\u003ch3 id=\"kenapa-ini-relevan-buat-situasi-elo\"\u003eKenapa ini relevan buat situasi elo\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-relevan-buat-situasi-elo\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk elo yang cuma clone repo dan belum install, bagian paling berguna dari thread ini adalah: jangan hanya berharap badge provenance. Kalau ada jalur eksekusi, package bisa saja legit secara identity tapi tetap berbahaya.\u003c/p\u003e\n\u003cp\u003eSolusi yang dia dorong:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epakai minimum release age agar paket jahat bisa ketahuan sebelum dipakai\u003c/li\u003e\n\u003cli\u003ejangan menganggap publish official sama dengan publish safe\u003c/li\u003e\n\u003cli\u003etambahkan lapisan pengamanan lain seperti sandbox atau dependency minimization\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eReply thread ngarah ke dua arah utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eruntime containment / sandbox (npm diperlakukan seperti JS dari web random)\u003c/li\u003e\n\u003cli\u003ekritik ekosistem yang lebih radikal, tapi itu lebih berupa provokasi daripada solusi operasional langsung.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKesan pentingnya adalah: build beberapa lapis kontrol, bukan cari satu silver bullet.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esupply-chain (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-tooling (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working
