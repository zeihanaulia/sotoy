de-to-ai"},{"from":{"fname":"zettel.1777362905431","id":"zettel.1777362905431","vaultName":"vault"},"type":"backlink","position":{"start":{"line":44,"column":3,"offset":2176},"end":{"line":44,"column":51,"offset":2224},"indent":[]},"value":"zettel.literature.the-developers-guide-to-ai"},{"from":{"fname":"zettel.moc.the-developers-guide-to-ai","id":"zettel.moc.the-developers-guide-to-ai","vaultName":"vault"},"type":"backlink","position":{"start":{"line":60,"column":3,"offset":4284},"end":{"line":60,"column":51,"offset":4332},"indent":[]},"value":"zettel.literature.the-developers-guide-to-ai"}],"anchors":{"pertanyaan-yang-dibuka":{"type":"header","text":"Pertanyaan yang dibuka","value":"pertanyaan-yang-dibuka","line":14,"column":0,"depth":2},"ringkasan-literatur":{"type":"header","text":"Ringkasan literatur","value":"ringkasan-literatur","line":20,"column":0,"depth":2},"ide-penting":{"type":"header","text":"Ide penting","value":"ide-penting","line":26,"column":0,"depth":2},"interpretasi":{"type":"header","text":"Interpretasi","value":"interpretasi","line":32,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat juga","value":"lihat-juga","line":36,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"the-developers-guide-to-ai-sebagai-literature-note\"\u003eThe Developer's Guide to AI sebagai literature note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-developers-guide-to-ai-sebagai-literature-note\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"pertanyaan-yang-dibuka\"\u003ePertanyaan yang dibuka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-yang-dibuka\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBagaimana struktur buku ini mencerminkan urutan kerja developer AI?\u003c/li\u003e\n\u003cli\u003eApa batasan level buku ini dibandingkan dengan buku ML akademik?\u003c/li\u003e\n\u003cli\u003eKapan teknik seperti prompt, RAG, fine-tuning, dan agent menjadi relevan menurut urutan buku ini?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"ringkasan-literatur\"\u003eRingkasan literatur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-literatur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuku ini tidak disusun sebagai silabus akademik AI. Struktur utamanya bergerak dari pengenalan LLM dan pembuatan aplikasi, lalu memasuki prompt engineering, memberi konteks lewat retrieval-augmented generation, menimbang fine-tuning, dan akhirnya mengorkestrasi agent.\u003c/p\u003e\n\u003cp\u003eLogika penyusunan buku ini adalah layering: setiap bagian muncul untuk menjawab keterbatasan bagian sebelumnya. Prompt engineering hadir sebelum RAG karena instruksi model adalah kontrol dasar. RAG hadir sebelum fine-tuning karena memberi konteks eksternal seringkali lebih murah dan lebih stabil. Fine-tuning muncul setelah karena model customization dianggap sebagai intervensi yang lebih mahal. Agent muncul paling akhir sebagai sintesis, bukan sebagai fondasi.\u003c/p\u003e\n\u003ch2 id=\"ide-penting\"\u003eIde penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ide-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBuku ini lebih cocok dibaca sebagai applied AI engineering roadmap daripada referensi riset ML.\u003c/li\u003e\n\u003cli\u003eFokus utama adalah developer workflow: mengenali model, mengendalikan model, menambahkan konteks, menyesuaikan model, lalu membangun orkestrasi agent.\u003c/li\u003e\n\u003cli\u003eLevel buku ini berada di rentang beginner sampai early-intermediate untuk developer, bukan total beginner atau ML researcher advanced.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"interpretasi\"\u003eInterpretasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#interpretasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari struktur bagian-bagiannya, yang paling penting bukan isi detailnya, tapi pesan bahwa sistem AI modern harus dibangun secara berlapis. Ini buku untuk developer yang butuh peta dan urutan yang waras, bukan untuk orang yang butuh matematika atau teori training model.\u003c/p\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.ai-native\"\u003eMOC AI-native engineering\u003c/a\u003e — MOC AI-native engineering\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-developers-guide-to-ai\"\u003eThe Developer's Guide to AI\u003c/a\u003e — overview struktur dan level buku sebagai peta praktis AI engineering untuk developer\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eliterature (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-native (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449631\"\u003eOtomasi menggeser nilai kerja dari eksekusi manual ke desain dan adaptasi sistem\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449632\"\u003eAPI dan SDK membuat AI jadi komponen software, bukan domain riset terpisah\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449633\"\u003eAI jadi berguna ketika model digabung dengan database dan retrieval\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449634\"\u003eBuku ini mengunci perspektif developer-first untuk AI integration, bukan research-first model building\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449635\"\u003eDeveloper AI sebaiknya fokus pada composition, bukan membangun foundational model sendiri\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449636\"\u003eAI recipes pentingnya lebih besar daripada model tunggal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449637\"\u003eDeveloper perlu mental model produk lebih dari model AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449638\"\u003eTraction tanpa leverage operasional bisa berubah jadi krisis\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449639\"\u003ePekerjaan repetitif adalah kandidat AI alami\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449640\"\u003eAPI call adalah pintu masuk developer ke AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449641\"\u003eLLM membutuhkan grounding untuk bisa berguna\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449642\"\u003eLLM kuat bahasa tapi lemah truth domain privat\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449643\"\u003eLLM adalah model pretrained, bukan sihir\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449644\"\u003eOutput LLM dibangun lewat next-token prediction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449645\"\u003eInference dan training adalah dua tahap berbeda\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449646\"\u003eLLM probabilistik; kode tradisional deterministik\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449647\"\u003eHallucination adalah konsekuensi arsitektural LLM\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449648\"\u003ePrompt engineering adalah intervensi pertama termurah\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449649\"\u003eContext engineering melebihi sekadar wording prompt\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449650\"\u003eAplikasi AI pertama adalah plumbing request-model-response\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449651\"\u003eLocal model membantu belajar integrasi tanpa vendor noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449652\"\u003eStreaming token dapat diubah jadi UX responsif\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449653\"\u003eReadableStream membuat browser ikut memproses respons LLM secara progresif\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449654\"\u003ePython dipilih AI karena ekosistem, bukan syntax\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449655\"\u003eUlangi contoh di bahasa lain untuk isolasi konsep\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449656\"\u003eTyped boundaries penting dalam layanan AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272449657\"\u003eGenerator Python cocok untuk streaming response LLM\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812605\"\u003ePrompt engineering lahir ketika “kasih semua context” mulai gagal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812606\"\u003eData ada tetapi harus disusun sebagai konteks berguna\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812607\"\u003ePrompt besar tanpa struktur mentok di limit dan kebingungan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812608\"\u003ePrompt engineering adalah mekanisme steering, bukan mantra\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812609\"\u003eLLM tidak mengerti maksud; LLM hanya tahu teks yang dikirim\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812610\"\u003ePrompt yang vague memaksa model menebak\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812611\"\u003ePrompt terbaik dibangun dari komponen fungsional\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812612\"\u003eContext window adalah constraint resource, bukan sekadar konteks\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812613\"\u003eToken adalah unit biaya dan kapasitas\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812614\"\u003eLebih banyak konteks tidak otomatis lebih baik\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812615\"\u003eInstruction prompting adalah baseline dasar\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812616\"\u003ePersona adalah compression mechanism untuk framing\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812617\"\u003eIn-context examples mengajari pola tanpa mengubah weights\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812618\"\u003eDelimiters adalah information architecture untuk prompt\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812619\"\u003eChain-of-thought memberi struktur reasoning intermediate\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812620\"\u003ePrompt chaining memecah masalah kompleks jadi workflow prompt\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812621\"\u003ePrompt harus diperlakukan seperti code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812622\"\u003ePrompt bagus di playground belum tentu cukup di produksi\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812623\"\u003eAbstraction library adalah keputusan arsitektural\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812624\"\u003eOutput configuration adalah bagian dari control surface\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812625\"\u003ePrompt template memisahkan logic dari prompt assembly\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812626\"\u003eSystem messages dan roles membuat prompt jadi protocol\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812627\"\u003eChat memory adalah ilusi aplikasi, bukan kemampuan model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812628\"\u003eHistory bertarung dengan token budget\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777272812629\"\u003eSummarization mengompres history tanpa kehilangan konteks\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777281650097\"\u003eFrekuensi tinggi membuat support AI jadi masalah operasional utama\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777281760000\"\u003eOpportunity cost support adalah alasan utama untuk AI dalam tim produk\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777282133922\"\u003eAI adoption kadang lahir dari constraint ekonomi, bukan teknologi keren\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777282388177\"\u003eReframing operasional support ke sistematisasi itu kunci, bukan langsung training model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777282527277\"\u003eAI support agent sering diposisikan sebagai garis pertahanan pertama, bukan pengganti manusia\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777349193467\"\u003eNilai model dibatasi oleh distribusi data latihnya\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777362905431\"\u003eGrounding adalah menyuplai konteks yang hilang saat inference tanpa mengubah model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.the-developers-guide-to-ai\"\u003eMOC The Developer's Guide to AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked
