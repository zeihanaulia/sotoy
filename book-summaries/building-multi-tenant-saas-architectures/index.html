ps":{"note":{"id":"book-summaries.building-multi-tenant-saas-architectures","title":"Building Multi-Tenant SaaS Architectures","desc":"Ringkasan struktur dan logika utama buku SaaS multi-tenant karya Tod Golding.","updated":1778453920932,"created":1778383609847,"published":true,"tags":["saas","multi-tenancy","architecture"],"custom":{"published":true},"fname":"book-summaries.building-multi-tenant-saas-architectures","type":"note","vault":{"fsPath":"vault"},"contentHash":"db385c02b90e6b3d76104decff1141b9","links":[{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"tags.saas","alias":"saas","xvault":false,"to":{"fname":"tags.saas"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"tags.multi-tenancy","alias":"multi-tenancy","xvault":false,"to":{"fname":"tags.multi-tenancy"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"tags.architecture","alias":"architecture","xvault":false,"to":{"fname":"tags.architecture"}},{"type":"wiki","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"book-summaries.building-multi-tenant-saas-architectures.preface","position":{"start":{"line":37,"column":98,"offset":3835},"end":{"line":37,"column":165,"offset":3902},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.building-multi-tenant-saas-architectures.preface"}},{"type":"wiki","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"book-summaries.building-multi-tenant-saas-architectures.chapter-1","position":{"start":{"line":39,"column":60,"offset":3964},"end":{"line":39,"column":129,"offset":4033},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.building-multi-tenant-saas-architectures.chapter-1"}},{"type":"wiki","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading","position":{"start":{"line":41,"column":44,"offset":4079},"end":{"line":41,"column":127,"offset":4162},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading"}},{"type":"wiki","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"value":"notes.saas.multi-tenant-saas-reading-roadmap","position":{"start":{"line":45,"column":156,"offset":4472},"end":{"line":45,"column":204,"offset":4520},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.saas.multi-tenant-saas-reading-roadmap"}},{"from":{"fname":"zettel.moc.multi-tenant-saas","id":"zettel.moc.multi-tenant-saas","vaultName":"vault"},"type":"backlink","position":{"start":{"line":8,"column":3,"offset":397},"end":{"line":8,"column":62,"offset":456},"indent":[]},"value":"book-summaries.building-multi-tenant-saas-architectures"},{"from":{"fname":"daily.journal.2026.05.10","id":"daily.journal.2026.05.10","vaultName":"vault"},"type":"backlink","position":{"start":{"line":23,"column":15,"offset":1983},"end":{"line":23,"column":74,"offset":2042},"indent":[]},"value":"book-summaries.building-multi-tenant-saas-architectures"}],"anchors":{},"children":["book-summaries.building-multi-tenant-saas-architectures.chapter-1","book-summaries.building-multi-tenant-saas-architectures.preface"],"parent":"book-summaries","data":{}},"body":"\u003ch1 id=\"building-multi-tenant-saas-architectures\"\u003eBuilding Multi-Tenant SaaS Architectures\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#building-multi-tenant-saas-architectures\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eYang paling kena dari halaman O’Reilly dan daftar isi buku ini adalah: ini bukan buku tentang \"bikin web app lalu kasih login\". Ini buku yang mencoba ngajarin cara pikir arsitek SaaS yang perlu melayani banyak customer dalam satu produk, lengkap dengan trade-off isolation, operasi, dan bisnis.\u003c/p\u003e\n\u003cp\u003eMenurut gue, struktur buku ini dibangun sebagai perjalanan desain sistem SaaS:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003emindset dan fondasi,\u003c/li\u003e\n\u003cli\u003epilihan arsitektur,\u003c/li\u003e\n\u003cli\u003emekanik implementasi,\u003c/li\u003e\n\u003cli\u003edampak operasional,\u003c/li\u003e\n\u003cli\u003eekstensi strategis.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi bukan sekadar kumpulan topik acak. Logika besarnya adalah: keputusan awal soal data, identity, dan deployment akan ngunci cara kamu operasi, monetize, dan scale platform.\u003c/p\u003e\n\u003cp\u003eDari daftar isi, buku ini terbaca sebagai enam blok besar.\u003c/p\u003e\n\u003cp\u003ePertama, blok pembuka diisi oleh mindset SaaS, fundamental multi-tenant, dan deployment model. Itu penting karena kalau lo belum paham apa unit problem-nya — siapa tenant, apa artinya sharing, bagaimana model ekonomi SaaS bekerja — maka pembahasan deployment cuma akan jadi soal topologi infra tanpa pemahaman konteks.\u003c/p\u003e\n\u003cp\u003eKedua, blok lifecycle tenant. Di sini buku menempatkan onboarding, tenant management, auth, dan routing sebagai layer kontrol awal. Ini bukan soal logika bisnis core, tapi soal bagaimana platform tahu request ini milik tenant siapa, apa entitlement-nya, dan pengalaman apa yang harus dipakai. Menurut gue, ini bagian yang sering kelewat. Banyak tim cuma mikir \"nanti taruh tenant_id di request\", padahal real problem-nya lebih besar: subdomain, IdP, entitlements, mapping policy, region, dan context resolution.\u003c/p\u003e\n\u003cp\u003eKetiga, blok mechanics multi-tenancy: service design, data partitioning, dan tenant isolation. Urutannya logis: pertama bangun layanan yang tenant-aware, lalu tentukan bagaimana data disimpan, lalu pikirkan level isolasi yang dibutuhkan. Itu membuat tiga hal ini terasa seperti tiga wajah dari satu masalah yang sama: bagaimana lo menjaga tenant tetap dipisah tapi masih efisien.\u003c/p\u003e\n\u003cp\u003eKeempat, buku baru turun ke dua gaya implementasi besar: Kubernetes SaaS dan Serverless SaaS. Menurut gue ini keputusan editorial yang bagus. Karena artinya penulis nggak mulai dari tooling. Dia mulai dari prinsip, lalu nunjukin dua kendaraan yang berbeda. Sehingga pembaca bisa lihat bahwa multi-tenancy itu problem arsitektur, bukan problem Kubernetes.\u003c/p\u003e\n\u003cp\u003eKelima, ada blok operasi dan evolusi bisnis: tenant-aware operations, migration strategy, tiering, dan SaaS anywhere. Ini adalah bagian yang bikin buku terasa nyata. Banyak sistem bisa dibangun, tapi banyak juga yang patah ketika harus dipelihara, diukur, dimigrasi, atau disegmentasi menjadi tier. Tiering khususnya menarik karena itu titik temu antara arsitektur dan monetisasi — plan customer bisa menentukan isolation model, feature gating, dan model deployment.\u003c/p\u003e\n\u003cp\u003eTerakhir, penutup dengan GenAI dan guiding principles. Ini memberi tahu gue bahwa buku ini cenderung lengkap, karena dia nggak berhenti di arsitektur klasik. Dia mau ngaitkan multi-tenancy dengan konteks modern seperti AI, governance, dan prinsip pengambilan keputusan.\u003c/p\u003e\n\u003cp\u003eTakeaway utama yang gue ambil dari overview ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMulti-tenant SaaS adalah soal \"single product, many customers, controlled variation.\"\u003c/li\u003e\n\u003cli\u003eProblem paling awal adalah context resolution: platform harus tahu tenant siapa sebelum bisa melakukan auth, routing, billing, atau observability.\u003c/li\u003e\n\u003cli\u003eKeputusan data partitioning ngaruh ke isolation, operasi, dan cost.\u003c/li\u003e\n\u003cli\u003eDeployment model adalah konsekuensi, bukan permulaan; prinsip yang sama bisa diterapkan di Kubernetes atau serverless.\u003c/li\u003e\n\u003cli\u003eOperasional tenant-aware adalah bagian yang paling sering bikin sistem SaaS gagal, bukan hanya desain awal.\u003c/li\u003e\n\u003cli\u003eMenggabungkan arsitektur dan bisnis itu wajib dalam SaaS; tiering adalah contoh nyata dari hubungan itu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau mau lihat kontrak intelektual buku ini, gue juga sudah ringkas Preface di file tersendiri: \u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.preface\"\u003ePreface\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eKalau mau langsung ke Chapter 1, ada juga ringkasannya di: \u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.chapter-1\"\u003eChapter 1 — The SaaS Mindset\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eUntuk bedah close reading Chapter 1, baca: \u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading\"\u003eChapter 1 Close Reading — The SaaS Mindset\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eCatatan kecil buat lanjut baca: cara paling enak adalah masuk dulu ke Chapter 1 \"The SaaS Mindset\" karena itu fondasi dari semua keputusan berikutnya.\u003c/p\u003e\n\u003cp\u003eKalau mau baca buku lanjutan sesuai fungsi chapter, gue juga sudah mencatat roadmap baca yang mengaitkan Golding dengan buku-buku pendamping per komponen: \u003ca href=\"/sotoy/notes/notes.saas.multi-tenant-saas-reading-roadmap\"\u003eRoadmap Baca Multi-Tenant SaaS\u003c/a\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\
