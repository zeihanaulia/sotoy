value":"15-linking-satu-peta-utuh","line":758,"column":0,"depth":2},"16-insight-penutup":{"type":"header","text":"16. Insight penutup","value":"16-insight-penutup","line":797,"column":0,"depth":2},"17-korelasi-dengan-konsep-lain":{"type":"header","text":"17. Korelasi dengan konsep lain","value":"17-korelasi-dengan-konsep-lain","line":816,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":842,"column":0,"depth":2}},"children":[],"parent":"r970j7o3cwojzrfs80avkt5","data":{}},"body":"\u003ch1 id=\"architecture\"\u003eArchitecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#architecture\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://honcho.dev/docs/v3/documentation/core-concepts/architecture\"\u003ehttps://honcho.dev/docs/v3/documentation/core-concepts/architecture\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\"arsitektur Honcho\" = cara Honcho menyusun data, memproses message, menjalankan reasoning, lalu menghasilkan context yang bisa dipakai agent. Ini bukan sekadar diagram teknis, tapi juga peta konseptual untuk memahami bagaimana Honcho membangun stateful memory agent yang bisa terus belajar dari interaksi.\u003c/p\u003e\n\u003cp\u003eIstilah yang perlu dipahami,\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Peer\" = entitas yang dimodelkan Honcho. Bisa user, AI agent, customer, student, NPC, object, atau entity lain.\u003c/li\u003e\n\u003cli\u003e\"Representation\" = model/representasi tentang peer, dibangun dari message lintas session.\u003c/li\u003e\n\u003cli\u003e\"Session\" = konteks interaksi dengan batas waktu, misalnya chat, support ticket, meeting, learning session.\u003c/li\u003e\n\u003cli\u003e\"Message\" = unit data yang masuk ke Honcho. Tidak harus chat; bisa email, dokumen, action log, system notification.\u003c/li\u003e\n\u003cli\u003e\"Reasoning\" = proses background yang mengolah message menjadi logic, summary, insight, conclusion, lalu memperbarui representation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"1-pertanyaan-kunci\"\u003e1. Pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk ngerti arsitektur Honcho, ada 6 pertanyaan inti:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eUnit data Honcho apa saja?\u003c/li\u003e\n\u003cli\u003eKenapa peer jadi pusat arsitekturnya?\u003c/li\u003e\n\u003cli\u003eBagaimana session membatasi konteks?\u003c/li\u003e\n\u003cli\u003eBagaimana message masuk lalu diproses?\u003c/li\u003e\n\u003cli\u003eDi mana reasoning terjadi?\u003c/li\u003e\n\u003cli\u003eBagaimana hasil reasoning dipakai balik oleh agent?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nArsitektur Honcho itu bisa dibaca sebagai event-sourcing untuk memory agent, tapi dengan reasoning di tengahnya.\u003c/p\u003e\n\u003cp\u003eEvent-sourcing biasa: event masuk → state diperbarui.\u003c/p\u003e\n\u003cp\u003eHoncho: message masuk → reasoning jalan → representation peer diperbarui → agent bisa mengambil context yang lebih kaya.\u003c/p\u003e\n\u003cp\u003eJadi yang disimpan bukan cuma \"riwayat percakapan\", tapi juga \"state hasil penalaran tentang entitas\".\n───────────────────────────────────\u003c/p\u003e\n\u003ch2 id=\"2-model-data-workspace--peer--session--message\"\u003e2. Model data: Workspace → Peer / Session → Message\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-model-data-workspace--peer--session--message\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage-nya bilang Honcho punya hierarchical data model. Relasinya kira-kira begini:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace\n├── Peers\n├── Sessions\n└── Messages live inside Sessions, attributed to Peers\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi relasinya bukan sekadar pohon biasa.\u003c/p\u003e\n\u003cp\u003eLebih tepat:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace has many Peers\nWorkspace has many Sessions\n\nPeer can join many Sessions\nSession can contain many Peers\n\nMessage belongs to a Session\nMessage is authored/attributed to a Peer\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi ada relasi many-to-many antara Peers dan Sessions.\u003c/p\u003e\n\u003cp\u003eIni penting karena satu user bisa muncul di banyak session, dan satu session bisa melibatkan banyak peer.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace: \"Customer Support App\"\n\nPeer:\n- user_123\n- support_agent_ai\n- billing_agent_ai\n\nSession:\n- ticket_001\n- ticket_002\n- refund_discussion\n\nMessages:\n- user_123: \"Tagihan gue dobel.\"\n- billing_agent_ai: \"Gue cek invoice-nya.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDari message-message itu, Honcho bisa membangun representation tentang \u003ccode\u003euser_123\u003c/code\u003e, \u003ccode\u003ebilling_agent_ai\u003c/code\u003e, atau bahkan relasi antar peer.\u003c/p\u003e\n\u003ch2 id=\"3-workspace-batas-isolasi-paling-atas\"\u003e3. Workspace: batas isolasi paling atas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-workspace-batas-isolasi-paling-atas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWorkspace adalah container paling atas.\u003c/p\u003e\n\u003cp\u003ePage menjelaskan workspace sebagai:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"top-level containers\"\n\"complete isolation between different applications or environments\"\n\"namespace to keep different workloads separate\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya workspace dipakai untuk memisahkan data.\u003c/p\u003e\n\u003cp\u003eMisalnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_dev\nworkspace_staging\nworkspace_production\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau untuk SaaS multi-tenant:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace_customer_A\nworkspace_customer_B\nworkspace_customer_C\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtomic idea-nya:\u003c/p\u003e\n\u003cp\u003eWorkspace menjawab pertanyaan: \u003cstrong\u003ememory ini hidup di dunia yang mana?\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eTanpa workspace, memory mudah bocor antar aplikasi, customer, atau environment.\u003c/p\u003e\n\u003cp\u003eJadi workspace bukan cuma folder. Ia juga boundary untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edata isolation\u003c/li\u003e\n\u003cli\u003eauthentication\u003c/li\u003e\n\u003cli\u003eworkspace-wide configuration\u003c/li\u003e\n\u003cli\u003emulti-tenant separation\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau elo bikin app AI untuk banyak customer, workspace bisa jadi cara menjaga agar memory customer A tidak nyampur ke customer B.\u003c/p\u003e\n\u003ch2 id=\"4-peer-pusat-dari-seluruh-arsitektur\"\u003e4. Peer: pusat dari seluruh arsitektur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-peer-pusat-dari-seluruh-arsitektur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage-nya bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Peers are the most important entity in Honcho—everything revolves around building and maintaining their representations.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi arsitektur Honcho itu \u003cstrong\u003epeer-centric\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eBukan document-centric.\nBukan conversation-centric.\nBukan user-only-centric.\u003c/p\u003e\n\u003cp\u003eTapi peer-centric.\u003c/p\u003e\n\u003cp\u003ePeer adalah entitas yang bisa berubah dari waktu ke waktu dan perlu direpresentasikan.\u003c/p\u003e\n\u003cp\u003eContoh peer:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eHuman:\n- user_raka\n- customer_392\n- student_17\n\nAgent:\n- coding_agent\n- writing_agent\n- support_agent\n\nOther entity:\n- project_alpha\n- backend_team\n- npc_blacksmith\n- product_checkout_flow\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa ini desain yang kuat?\u003c/p\u003e\n\u003cp\u003eKarena memory agent sering salah kalau cuma disusun sebagai chat history. User bisa ngobrol di banyak session. Agent bisa muncul di banyak context. Project bisa berkembang lintas percakapan.\u003c/p\u003e\n\u003cp\u003ePeer membuat Honcho bisa bilang:\u003c/p\u003e\n\u003cp\u003e“Semua interaksi tentang entitas ini, walau tersebar di banyak session, tetap bisa menyumbang ke representation entitas itu.”\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession 1:\nUser bilang suka jawaban praktis.\n\nSession 2:\nUser menolak jawaban yang terlalu normatif.\n\nSession 3:\nUser meminta breakdown teknis.\n\nRepresentation user:\nUser prefers practical, direct, technically grounded explanations.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu lintas session. Kuncinya ada di peer.\u003c/p\u003e\n\u003ch2 id=\"5-session-batas-temporal-untuk-interaksi\"\u003e5. Session: batas temporal untuk interaksi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-session-batas-temporal-untuk-interaksi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSession adalah thread atau konteks interaksi.\u003c/p\u003e\n\u003cp\u003ePage-nya bilang session memberi:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“temporal boundaries for when a set of interactions starts and ends”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi session menjawab: \u003cstrong\u003einteraksi ini terjadi dalam episode apa?\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eContoh session:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esupport_ticket_778\nmeeting_transcript_2026_06_03\nlearning_session_math_01\nchat_about_architecture\nincident_review_payment_api\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa session penting?\u003c/p\u003e\n\u003cp\u003eKarena message yang sama bisa punya makna berbeda tergantung konteks.\u003c/p\u003e\n\u003cp\u003eContoh kalimat:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Jangan deploy dulu.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi session incident, itu bisa berarti ada risiko produksi.\nDi session planning, itu bisa berarti requirement belum siap.\nDi session experiment, itu bisa berarti tunggu benchmark.\u003c/p\u003e\n\u003cp\u003eSession menjaga konteks lokal. Tapi peer menjaga kontinuitas global.\u003c/p\u003e\n\u003cp\u003eJadi relasinya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession = konteks episode\nPeer = identitas lintas episode\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni link penting.\u003c/p\u003e\n\u003cp\u003eKalau cuma ada session, agent ingat episode tapi tidak punya identitas jangka panjang.\u003c/p\u003e\n\u003cp\u003eKalau cuma ada peer tanpa session, semua event tercampur tanpa konteks temporal.\u003c/p\u003e\n\u003cp\u003eHoncho pakai dua-duanya.\u003c/p\u003e\n\u003ch2 id=\"6-message-unit-atomik-yang-memicu-reasoning\"\u003e6. Message: unit atomik yang memicu reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-message-unit-atomik-yang-memicu-reasoning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMessage adalah unit data paling dasar.\u003c/p\u003e\n\u003cp\u003ePage-nya bilang message bisa berupa:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“emails, documents, files, user actions, system notifications, or rich media content.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi message di Honcho bukan hanya chat bubble.\u003c/p\u003e\n\u003cp\u003eIni penting karena Honcho bisa dipakai sebagai ingestion layer untuk banyak data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eChat:\nUser: \"Gue lebih suka jawaban step-by-step.\"\n\nEmail:\nSubject: \"Project deadline moved to Friday.\"\n\nAction log:\nUser clicked \"cancel subscription.\"\n\nDocument:\nMeeting notes about product roadmap.\n\nSystem notification:\nPayment failed twice.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetiap message punya dua properti penting:\u003c/p\u003e\n\u003cp\u003ePertama, ia \u003cstrong\u003ediatribusikan ke peer tertentu\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKedua, ia \u003cstrong\u003ediurutkan secara kronologis dalam session\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eJadi Honcho tahu:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esiapa mengatakan/melakukan apa\n\ndi session mana\n\ndalam urutan waktu apa\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBegitu message dibuat, ia memicu background reasoning.\u003c/p\u003e\n\u003cp\u003eIni inti flow arsitektur.\u003c/p\u003e\n\u003ch2 id=\"7-data-flow-dari-message-ke-representation\"\u003e7. Data flow: dari message ke representation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-data-flow-dari-message-ke-representation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArsitektur runtime Honcho bisa dipahami dalam dua jalur:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWrite path: data masuk.\u003c/li\u003e\n\u003cli\u003eRead path: context keluar.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"write-path\"\u003eWrite path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#write-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSaat elo membuat message:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessage created\n→ written immediately to PostgreSQL\n→ reasoning task masuk background queue\n→ background worker memproses\n→ logic / summaries / insights dibuat\n→ conclusions disimpan\n→ peer representation diperbarui\n→ vector collection diisi untuk retrieval\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage-nya bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“When you create messages, they’re immediately written to PostgreSQL and reasoning tasks are added to background queues.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menunjukkan desain \u003cstrong\u003easync by default\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKenapa async?\u003c/p\u003e\n\u003cp\u003eSupaya write cepat. Agent/app tidak perlu menunggu semua reasoning selesai hanya untuk menyimpan message.\u003c/p\u003e\n\u003cp\u003eMisalnya user baru mengirim chat. Sistem langsung simpan dulu. Reasoning yang lebih berat jalan di belakang.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePostgreSQL = source of raw interaction data\nBackground queue = buffer untuk kerja berat\nWorkers = mesin reasoning\nVector collections = tempat hasil reasoning dicari ulang\nRepresentations = state tentang peer\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"read-path\"\u003eRead path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#read-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSaat agent butuh context:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAgent calls Chat endpoint / Get Context endpoint\n→ Honcho retrieves relevant conclusions from vector storage\n→ Honcho also pulls recent messages\n→ Honcho assembles coherent context\n→ context injected into agent prompt\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage-nya bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Honcho retrieves relevant conclusions from vector storage along with recent messages, then assembles everything into coherent context ready to inject into agent prompts.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting.\u003c/p\u003e\n\u003cp\u003eHoncho tidak cuma mengembalikan memory mentah. Ia menggabungkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erecent messages\u003c/li\u003e\n\u003cli\u003erelevant conclusions\u003c/li\u003e\n\u003cli\u003epeer representation\u003c/li\u003e\n\u003cli\u003econtext yang sudah dirakit\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi output-nya bukan sekadar search result, tapi context package untuk agent.\u003c/p\u003e\n\u003ch2 id=\"8-dua-jenis-data-regular-data-vs-reasoned-over-data\"\u003e8. Dua jenis data: regular data vs reasoned-over data\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-dua-jenis-data-regular-data-vs-reasoned-over-data\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi diagram page, dijelaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eblack arrows = read/write regular data\u003c/li\u003e\n\u003cli\u003ered arrows = read/write reasoned-over data\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTerjemahan gampangnya:\u003c/p\u003e\n\u003cp\u003eRegular data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessages\nsessions\npeers\nworkspace records\nraw storage\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoned-over data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elogic\nsummaries\ninsights\nconclusions\npeer representations\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni pemisahan penting.\u003c/p\u003e\n\u003cp\u003eKarena Honcho memisahkan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eapa yang benar-benar terjadi\nvs\napa yang disimpulkan dari yang terjadi\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eRegular data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser said: \"Gue gak suka jawaban yang muter-muter.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoned-over data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser values directness and dislikes hedging.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKeduanya beda.\u003c/p\u003e\n\u003cp\u003eYang pertama bukti.\nYang kedua interpretasi.\u003c/p\u003e\n\u003cp\u003eArsitektur yang sehat harus menjaga dua lapis ini terpisah, karena interpretasi bisa salah dan perlu diperbarui.\u003c/p\u003e\n\u003ch2 id=\"9-configuration-cascade-dari-workspace-ke-peer-ke-session\"\u003e9. Configuration: cascade dari workspace ke peer ke session\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-configuration-cascade-dari-workspace-ke-peer-ke-session\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang setting Honcho:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“cascade hierarchically from workspace to peer to session”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya konfigurasi bisa punya default di atas, lalu dioverride di bawah.\u003c/p\u003e\n\u003cp\u003eStrukturnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace config\n  ↓\nPeer config override\n  ↓\nSession config override\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace:\nreasoning enabled by default\n\nPeer: support_agent_ai\nreasoning depth = medium\n\nSession: urgent_ticket_999\nperspective tracking disabled\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni penting karena tidak semua konteks butuh reasoning yang sama.\u003c/p\u003e\n\u003cp\u003eMisalnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eproduction support ticket butuh detail tinggi\u003c/li\u003e\n\u003cli\u003ecasual chat tidak perlu reasoning berat\u003c/li\u003e\n\u003cli\u003eagent tertentu boleh dimodelkan\u003c/li\u003e\n\u003cli\u003eagent lain tidak perlu dimodelkan\u003c/li\u003e\n\u003cli\u003esession tertentu butuh perspective-taking\u003c/li\u003e\n\u003cli\u003esession lain cukup raw recall\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cp\u003eKonfigurasi Honcho mengikuti prinsip \u003cstrong\u003edefault global, override lokal\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"10-extensibility-bawa-llm-sendiri-metadata-sendiri\"\u003e10. Extensibility: bawa LLM sendiri, metadata sendiri\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-extensibility-bawa-llm-sendiri-metadata-sendiri\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut Honcho bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epakai OpenAI\u003c/li\u003e\n\u003cli\u003epakai Anthropic\u003c/li\u003e\n\u003cli\u003epakai custom endpoints\u003c/li\u003e\n\u003cli\u003ememakai metadata JSON\u003c/li\u003e\n\u003cli\u003ebatch create sampai 100 messages per API call\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArtinya arsitekturnya tidak dikunci ke satu model provider.\u003c/p\u003e\n\u003cp\u003eIni penting untuk dua alasan:\u003c/p\u003e\n\u003cp\u003ePertama, cost control. Elo bisa pilih model reasoning yang lebih murah atau lebih kuat.\u003c/p\u003e\n\u003cp\u003eKedua, compliance/control. Company mungkin butuh endpoint sendiri.\u003c/p\u003e\n\u003cp\u003eJSON metadata juga penting. Karena use case memory tidak selalu sama.\u003c/p\u003e\n\u003cp\u003eContoh metadata:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e{\n  \"source\": \"gmail\",\n  \"thread_id\": \"abc123\",\n  \"importance\": \"high\",\n  \"document_type\": \"meeting_notes\"\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e{\n  \"source\": \"app_event\",\n  \"event_type\": \"subscription_cancelled\",\n  \"plan\": \"pro\"\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan JSONB-style metadata, message tidak cuma teks; dia bisa membawa struktur.\u003c/p\u003e\n\u003ch2 id=\"11-design-principles-honcho\"\u003e11. Design principles Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-design-principles-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut beberapa prinsip desain. Kita bedah satu-satu.\u003c/p\u003e\n\u003ch3 id=\"peer-centric\"\u003ePeer-centric\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peer-centric\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSemua berputar pada representation peer.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ememory bukan disusun berdasarkan file atau chat,\ntapi berdasarkan entitas yang perlu dipahami.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni cocok untuk agent yang harus memahami manusia, agent lain, grup, project, atau customer.\u003c/p\u003e\n\u003ch3 id=\"reasoning-first\"\u003eReasoning-first\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reasoning-first\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePage bilang memory bukan cuma storage, tapi continual learning.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edata masuk bukan hanya disimpan,\ntapi diproses untuk memperbaiki representation.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni beda dari database biasa.\u003c/p\u003e\n\u003ch3 id=\"async-by-default\"\u003eAsync by default\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#async-by-default\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLong-lived operation jalan di background.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003euser interaction tetap cepat,\nreasoning berat tidak memblokir request utama.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTrade-off-nya: representation mungkin tidak langsung update sempurna saat itu juga.\u003c/p\u003e\n\u003ch3 id=\"provider-agnostic\"\u003eProvider-agnostic\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#provider-agnostic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBisa pakai berbagai LLM provider.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eHoncho tidak sepenuhnya bergantung pada satu vendor model.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"multi-tenant\"\u003eMulti-tenant\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#multi-tenant\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDibangun untuk isolasi dan scalability.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eworkspace bisa memisahkan customer/app/environment.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"unified-paradigm\"\u003eUnified paradigm\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#unified-paradigm\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUser dan agent sama-sama peer.\u003c/p\u003e\n\u003cp\u003eMaknanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eHoncho tidak memakai model kaku \"user vs assistant\",\ntapi semua entitas diperlakukan sebagai peer.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni membuka skenario multi-agent dan group interaction.\u003c/p\u003e\n\u003ch2 id=\"12-contoh-arsitektur-dalam-kasus-nyata\"\u003e12. Contoh arsitektur dalam kasus nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-contoh-arsitektur-dalam-kasus-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMisal elo bikin coding assistant jangka panjang.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace:\npersonal_dev_assistant\n\nPeers:\n- user_raka\n- coding_agent\n- project_codex_sandbox\n\nSessions:\n- session_debug_sandbox_exec\n- session_review_security\n- session_setup_codex\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMessage masuk:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003euser_raka:\n\"Sandbox macOS bisa block file access tapi env variable tetap kebaca.\"\n\ncoding_agent:\n\"Workaround-nya bersihkan environment sebelum menjalankan proses.\"\n\nuser_raka:\n\"Setup codex harus global atau per repo?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho menyimpan messages ke PostgreSQL.\u003c/p\u003e\n\u003cp\u003eLalu background reasoning bisa menyimpulkan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRepresentation user_raka:\n- cares about sandbox boundaries\n- concerned with secret leakage\n- prefers practical setup guidance\n- is comparing per-project vs global config\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation project_codex_sandbox:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- focus: macOS sandbox-exec profiles\n- unresolved concern: env secret isolation\n- next likely need: repo-level config strategy\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSaat session baru dimulai seminggu kemudian dan user nanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"lanjut yang sandbox kemarin\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent bisa query Honcho, lalu mendapat context bahwa “sandbox kemarin” terkait file access boundary, env secret leak, dan Codex setup.\u003c/p\u003e\n\u003cp\u003eIni yang dimaksud stateful.\u003c/p\u003e\n\u003ch2 id=\"13-perbandingan-dengan-rag-biasa\"\u003e13. Perbandingan dengan RAG biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-perbandingan-dengan-rag-biasa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRAG biasa:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDocuments\n→ chunks\n→ embeddings\n→ vector search\n→ retrieved text\n→ prompt injection\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessages\n→ peer/session attribution\n→ PostgreSQL storage\n→ background reasoning\n→ conclusions/insights\n→ vector retrieval\n→ peer representation\n→ coherent context\n→ prompt injection\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBedanya bukan cuma ada vector search. Honcho tetap pakai vector collections, tapi vector search-nya dipakai atas \u003cstrong\u003ehasil reasoning\u003c/strong\u003e, bukan cuma raw chunks.\u003c/p\u003e\n\u003cp\u003eAtomic distinction:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRAG retrieves evidence.\nHoncho maintains state.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau lebih tajam:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRAG menjawab: \"bagian mana yang relevan?\"\nHoncho menjawab: \"apa yang sekarang kita pahami tentang peer ini?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"14-trade-off-arsitektur-honcho\"\u003e14. Trade-off arsitektur Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-trade-off-arsitektur-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArsitektur ini kuat, tapi punya konsekuensi.\u003c/p\u003e\n\u003ch3 id=\"trade-off-1-async-berarti-eventual-consistency\"\u003eTrade-off 1: Async berarti eventual consistency\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-1-async-berarti-eventual-consistency\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena reasoning jalan di background, representation bisa tertinggal sedikit dari message terbaru.\u003c/p\u003e\n\u003cp\u003eKalau user baru saja menyampaikan preferensi penting, belum tentu representation langsung berubah pada detik itu juga.\u003c/p\u003e\n\u003ch3 id=\"trade-off-2-reasoned-data-bisa-salah\"\u003eTrade-off 2: Reasoned data bisa salah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-2-reasoned-data-bisa-salah\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRaw message lebih objektif. Conclusion lebih berguna, tapi interpretatif.\u003c/p\u003e\n\u003cp\u003eKesalahan bisa terjadi di tahap:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessage interpretation\nsummary generation\nlogic extraction\ninsight creation\nrepresentation update\nretrieval\ncontext assembly\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi developer perlu mekanisme audit, correction, atau feedback.\u003c/p\u003e\n\u003ch3 id=\"trade-off-3-peer-centric-bagus-untuk-entity-modelling-tapi-butuh-desain-id-yang-rapi\"\u003eTrade-off 3: Peer-centric bagus untuk entity modelling, tapi butuh desain ID yang rapi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-3-peer-centric-bagus-untuk-entity-modelling-tapi-butuh-desain-id-yang-rapi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau peer ID berantakan, memory juga berantakan.\u003c/p\u003e\n\u003cp\u003eMisalnya user yang sama dibuat sebagai:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eraka\nuser_raka\nraka_123\nraka@gmail.com\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho bisa membangun representation terpisah padahal entitasnya sama.\u003c/p\u003e\n\u003cp\u003eJadi identity management penting.\u003c/p\u003e\n\u003ch3 id=\"trade-off-4-workspace-isolation-bagus-tapi-bisa-bikin-memory-fragmented\"\u003eTrade-off 4: Workspace isolation bagus, tapi bisa bikin memory fragmented\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-4-workspace-isolation-bagus-tapi-bisa-bikin-memory-fragmented\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau terlalu banyak workspace, memory yang seharusnya saling membantu bisa terpisah.\u003c/p\u003e\n\u003cp\u003eKalau terlalu sedikit workspace, risiko data campur.\u003c/p\u003e\n\u003cp\u003eJadi boundary workspace harus dirancang matang.\u003c/p\u003e\n\u003ch2 id=\"15-linking-satu-peta-utuh\"\u003e15. Linking: satu peta utuh\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-linking-satu-peta-utuh\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang kita sambungkan semua.\u003c/p\u003e\n\u003cp\u003eWorkspace memberi batas dunia.\u003c/p\u003e\n\u003cp\u003eDi dalamnya ada peer, yaitu entitas yang mau dipahami.\u003c/p\u003e\n\u003cp\u003ePeer masuk ke banyak session, karena entitas yang sama bisa muncul di banyak episode.\u003c/p\u003e\n\u003cp\u003eDi setiap session, peer mengirim message.\u003c/p\u003e\n\u003cp\u003eMessage disimpan sebagai raw data di PostgreSQL.\u003c/p\u003e\n\u003cp\u003eMessage juga memicu background reasoning.\u003c/p\u003e\n\u003cp\u003eReasoning menghasilkan logic, summary, insight, conclusion.\u003c/p\u003e\n\u003cp\u003eHasil ini masuk ke vector collections dan memperbarui representation peer.\u003c/p\u003e\n\u003cp\u003eSaat agent butuh menjawab, agent mengambil context dari Chat/Get Context endpoint.\u003c/p\u003e\n\u003cp\u003eHoncho menggabungkan recent messages + relevant conclusions + representation menjadi context yang siap disuntikkan ke prompt.\u003c/p\u003e\n\u003cp\u003eJadi loop besarnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003einteraction\n→ message\n→ reasoning\n→ representation\n→ context\n→ better interaction\n→ more message\n→ refined representation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItulah kenapa Honcho disebut continual learning system.\u003c/p\u003e\n\u003ch2 id=\"16-insight-penutup\"\u003e16. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nKesalahan umum memahami arsitektur Honcho adalah mengira “message disimpan, lalu nanti dicari lagi”.\u003c/p\u003e\n\u003cp\u003eItu cuma separuh cerita.\u003c/p\u003e\n\u003cp\u003eArsitektur Honcho sebenarnya membuat message menjadi bahan baku untuk membangun \u003cstrong\u003estate tentang peer\u003c/strong\u003e. Jadi unit paling penting bukan message, tapi representation yang terus diperbarui.\u003c/p\u003e\n\u003cp\u003eElo sudah paham arsitektur Honcho kalau bisa membedakan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eraw interaction: message\u003c/li\u003e\n\u003cli\u003etemporal boundary: session\u003c/li\u003e\n\u003cli\u003eidentity boundary: peer\u003c/li\u003e\n\u003cli\u003eisolation boundary: workspace\u003c/li\u003e\n\u003cli\u003elearned state: representation\u003c/li\u003e\n\u003cli\u003eruntime output: context untuk agent\n───────────────────────────────────\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"17-korelasi-dengan-konsep-lain\"\u003e17. Korelasi dengan konsep lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-korelasi-dengan-konsep-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling dekat: \u003cstrong\u003eevent sourcing\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKesamaannya: state dibangun dari event.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eEvent sourcing:\nevents → projection/state\n\nHoncho:\nmessages → reasoning → peer representation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBedanya: event sourcing biasanya deterministik. Honcho memakai reasoning model, jadi state-nya interpretatif.\u003c/p\u003e\n\u003cp\u003eKorelasi kedua: \u003cstrong\u003eCRM\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eCRM menyimpan customer history dan membantu manusia memahami customer. Honcho melakukan hal mirip untuk agent, tapi lebih generik: bukan cuma customer, semua peer bisa dimodelkan.\u003c/p\u003e\n\u003cp\u003eKorelasi ketiga: \u003cstrong\u003eZettelkasten\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eZettelkasten membangun pemahaman dari relasi antar catatan. Honcho membangun pemahaman dari relasi antar message, session, dan peer. Bedanya, Zettelkasten biasanya note-centric; Honcho peer-centric.\u003c/p\u003e\n\u003cp\u003eKesimpulan singkatnya: \u003cstrong\u003earsitektur Honcho adalah sistem memory berbasis peer, session, message, dan background reasoning untuk membangun representation yang bisa dipakai agent sebagai context lintas sesi.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.reasoning\"\u003eReasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.peer-representations\"\u003ePeer Representations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.design-patterns\"\u003eHoncho Design Patterns\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfy
