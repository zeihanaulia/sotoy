u003esimpan output-nya di cache,\u003c/li\u003e\n\u003cli\u003eserialize cache jadi prompt,\u003c/li\u003e\n\u003cli\u003ereviewer membaca cache dan bikin jawaban final.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: ini bukan soal melatih model. Ini soal merasakan bentuk mekanisme agent/workflow.\u003c/p\u003e\n\u003ch2 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi paper, \u003ccode\u003eserialized memory cache\u003c/code\u003e sering dimaknai salah. Ini bukan memori internal model (KV-cache). Ini adalah artefak eksternal yang dibuat oleh orchestrator.\u003c/p\u003e\n\u003cp\u003eKalau lo bisa bikin script kecil yang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ememanggil model beberapa kali,\u003c/li\u003e\n\u003cli\u003emenyimpan output tiap panggilan,\u003c/li\u003e\n\u003cli\u003emengubah output itu jadi string prompt,\u003c/li\u003e\n\u003cli\u003elalu memanggil model lagi sebagai reviewer,\nmaka lo sudah reproduce konsep utamanya.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"setup-minimal\"\u003eSetup minimal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#setup-minimal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang lo butuhkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePython 3.11+\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epip install openai\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eOllama lokal atau endpoint OpenAI-compatible lain\u003c/li\u003e\n\u003cli\u003emodel lokal atau remote yang bisa dipanggil via OpenAI API\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau pake Ollama lokal, jalankan:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003eollama run qwen3:8b\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau pake OpenAI remote, tinggal ganti endpoint/nama model sesuai provider.\u003c/p\u003e\n\u003ch2 id=\"contoh-script-reproduksi\"\u003eContoh script reproduksi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-script-reproduksi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eScript ini sengaja sederhana. Lo bisa copy-paste dan jalanin.\u003c/p\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003e\u003cspan class=\"token keyword\"\u003eimport\u003c/span\u003e json\n\u003cspan class=\"token keyword\"\u003eimport\u003c/span\u003e random\n\u003cspan class=\"token keyword\"\u003efrom\u003c/span\u003e openai \u003cspan class=\"token keyword\"\u003eimport\u003c/span\u003e OpenAI\n\nclient \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e OpenAI\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\n    base_url\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"http://localhost:11434/v1\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    api_key\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"ollama\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\nMODEL \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"qwen3:8b\"\u003c/span\u003e\nQUESTION \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token triple-quoted-string string\"\u003e\"\"\"\nAPI checkout kadang double charge ketika user refresh halaman setelah pembayaran.\nApa root cause paling mungkin dan fix paling tepat?\n\"\"\"\u003c/span\u003e\n\nTHINKER_PROMPTS \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Analisis masalah ini dari sudut backend/API design. Fokus pada idempotency, retry, dan boundary transaksi.\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Analisis masalah ini dari sudut frontend/user interaction. Fokus pada refresh, double submit, dan race condition UI.\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Analisis masalah ini dari sudut payment integration/webhook. Fokus pada duplicate webhook, retry provider, dan reconciliation.\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Analisis masalah ini dari sudut reliability engineering. Fokus pada failure mode, observability, dan cara verifikasi root cause.\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\n\n\u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003ecall_model\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003esystem_prompt\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e user_prompt\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e-\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    resp \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e client\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003echat\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003ecompletions\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003ecreate\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\n        model\u003cspan class=\"toke
