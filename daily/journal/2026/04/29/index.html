ps":{"note":{"id":"daily.journal.2026.04.29","title":"2026-04-29","desc":"","updated":1779859715965,"created":1777451693240,"tags":["daily","x","twitter"],"traitIds":["journalNote"],"custom":{},"fname":"daily.journal.2026.04.29","type":"note","vault":{"fsPath":"vault"},"contentHash":"c1fd2f9e5ab08603cf43247e2bb1ac0c","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.04.29","id":"daily.journal.2026.04.29","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.04.29","id":"daily.journal.2026.04.29","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.04.29","id":"daily.journal.2026.04.29","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{},"children":[],"parent":"0roal8ct0henz4hp2pgwq76","data":{}},"body":"\u003ch1 id=\"2026-04-29\"\u003e2026-04-29\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-04-29\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://github.blog/security/securing-the-git-push-pipeline-responding-to-a-critical-remote-code-execution-vulnerability/\"\u003eGitHub RCE di pipeline \u003ccode\u003egit push\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYang gue tangkap: ini bukan RCE di repo lo, ini RCE di pipeline internal GitHub yang memproses \u003ccode\u003egit push\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit push\u003c/code\u003e di sini adalah kendaraan. Yang bocor adalah cara GitHub menerjemahkan \u003ccode\u003epush option\u003c/code\u003e user ke header internal dan service backend mereka.\n\u003cul\u003e\n\u003cli\u003eBugnya bukan pada konsep \u003ccode\u003egit push\u003c/code\u003e umum.\u003c/li\u003e\n\u003cli\u003eBugnya pada implementasi GitHub yang meneruskan user-supplied push option ke internal header tanpa sanitasi benar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIni jadi contoh klasik: interface shared (Git) nggak berarti vulnerability shared ke semua Git hosting.\n\u003cul\u003e\n\u003cli\u003eGitHub.com/GHES kena karena cara mereka memproses metadata internalnya.\u003c/li\u003e\n\u003cli\u003eBitbucket/GitLab tidak otomatis kena hanya karena mereka juga menerima \u003ccode\u003egit push\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eYang serupa bisa muncul di platform lain jika mereka punya jalur parsing metadata/push option yang rentan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTitik bahaya utama: push option user masuk ke internal service header \u003ccode\u003eX-Stat\u003c/code\u003e dan bisa mem-bypass boundary jika karakter spesial tidak dineutralisasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e[Skala impact dan siapa yang harus gerak]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGitHub sendiri bilang mitigasi sudah dipasang di GitHub.com dan tidak menemukan eksploitasi aktif.\u003c/li\u003e\n\u003cli\u003eGHES self-hosted lebih berisiko: admin harus patch ke versi yang sudah diperbaiki.\u003c/li\u003e\n\u003cli\u003eJadi panic level-nya bukan sama buat semua pengguna.\n\u003cul\u003e\n\u003cli\u003ePengguna GitHub.com biasa: pantau, tapi server-side sudah diperbaiki.\u003c/li\u003e\n\u003cli\u003eGHES admin: patch now.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e[Insight security mindset]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYang penting bukan cuma label \"RCE\". Yang penting adalah boundary mana yang jebol.\u003c/li\u003e\n\u003cli\u003eDi kasus ini, attacker perlu akses push dan bisa menyelipkan push option berbahaya.\u003c/li\u003e\n\u003cli\u003eKalau lo cuma dengar \"git push\" banyak orang salah paham: \u003ccode\u003egit push\u003c/code\u003e itu normal, yang bahaya adalah cara backend platform menambal metadata itu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e[Analogi yang pas]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni mirip bug di parser HTTP: semua server nerima HTTP, tapi bug di Nginx nggak otomatis berarti bug serupa ada di Apache.\u003c/li\u003e\n\u003cli\u003eSemua Git hosting menerima \u003ccode\u003egit push\u003c/code\u003e, tapi exploit ini menarget implementasi spesifik GitHub.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e[Follow-up jika mau lanjut]\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBisa lanjut dengan breakdown mekanisme exploit detail.\u003c/li\u003e\n\u003cli\u003eBisa juga bikin checklist audit platform lain: bagaimana mereka memetakan push metadata ke internal service.\u003c/li\u003e\n\u003cli\u003eUntuk saat ini, kesimpulan utamanya: ini RCE di pipeline \u003ccode\u003egit push\u003c/code\u003e GitHub, bukan remote code execution di setiap repo Git.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://www.warp.dev/blog/warp-is-now-open-source\"\u003eWarp open source: fokus bukan cuma client, tapi orchestration \u0026#x26; agent platform\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArti yang gue pilih: mereka buka client codebase, tapi nilai bisnis utama mereka sekarang lebih ke Oz/orchestration, cloud agents, credits/usage, dan enterprise controls.\u003c/li\u003e\n\u003cli\u003eIni bukan sinyal “ADE gampang, jadi kami menyerah”. Ini lebih ke reposisi: client open source untuk distribusi, sedangkan proprietary value ada di platform agentic dan enterprise layer.\u003c/li\u003e\n\u003cli\u003eYang eksplisit dari artikel:\n\u003cul\u003e\n\u003cli\u003eWarp client open-source.\u003c/li\u003e\n\u003cli\u003eworkflow dikelola oleh Oz, cloud agent orchestration platform.\u003c/li\u003e\n\u003cli\u003eorchestration, memory, handoff adalah core to our business.\u003c/li\u003e\n\u003cli\u003eopen-sourcing coming from desire to build a successful business.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eYang inferensi dari pricing/product layer:\n\u003cul\u003e\n\u003cli\u003ebilling / usage-based credits.\u003c/li\u003e\n\u003cli\u003eenterprise controls dan team/admin features.\u003c/li\u003e\n\u003cli\u003emulti-model / multi-harness hub sebagai value layer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eMereka paham lapisan client UI makin mudah dikejar, jadi mereka memindahkan moat ke hal yang lebih susah disalin.\n\u003cul\u003e\n\u003cli\u003eopen source client = distribusi + komunitas + feedback.\u003c/li\u003e\n\u003cli\u003epaid layer = orchestration, compute, model access, team/admin controls.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eStruktur bisnisnya sekarang terasa seperti open-core modern:\n\u003cul\u003e\n\u003cli\u003eopen-source client untuk adoption.\u003c/li\u003e\n\u003cli\u003epaid cloud agent / model usage untuk monetisasi.\u003c/li\u003e\n\u003cli\u003eseat/team/enterprise untuk upsell.\u003c/li\u003e\n\u003cli\u003eBYOK / governance untuk enterprise trust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eYang menarik: open source dilihat sebagai “mesin produksi software” agentic.\n\u003cul\u003e\n\u003cli\u003ebukan hanya buka kode, tapi buka workflow: issue → readiness → implementasi → presubmit.\u003c/li\u003e\n\u003cli\u003eini juga terlihat dari \u003ccode\u003e.agents/\u003c/code\u003e, \u003ccode\u003e.mcp.json\u003c/code\u003e, dan workflow yang mereka pamerkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eInsight: yang memahami langkah ini nggak lagi bertanya “lalu uangnya dari mana?”, tapi “lapisan mana yang tetap proprietary setelah client dibuka?”.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/warpdotdev/warp\"\u003eWarp client open source jadi model bisnis agentic\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArti yang gue pilih: ini bukan berarti semua Warp dibuka. yang dibuka adalah client codebase, sedangkan cloud/orchestration masih bagian dari model bisnis mereka.\u003c/li\u003e\n\u003cli\u003eYang paling menarik: mereka pake open source sebagai mesin pengembangan produk, bukan sekadar gesture open source.\n\u003cul\u003e\n\u003cli\u003ekomunitas bantu arahkan, agent ngerjain heavy lifting, maintainer verifikasi dan orkestrasi.\u003c/li\u003e\n\u003cli\u003erepo bilang jelas: “Warp's client codebase is open source”, bukan semua komponen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eAlasan bisnisnya: mereka butuh melawan pemain closed-source dengan cara memperbesar kapasitas product development lewat kontribusi publik.\n\u003cul\u003e\n\u003cli\u003eopen source di sini dipandang sebagai leverage, bukan idealisme semata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eYang bikin beda: mereka lagi coba model open source yang agent-first.\n\u003cul\u003e\n\u003cli\u003eada \u003ccode\u003e.agents/\u003c/code\u003e, \u003ccode\u003e.mcp.json\u003c/code\u003e, workflow issue → readiness → implementasi → presubmit.\u003c/li\u003e\n\u003cli\u003eini lebih mirip sistem koordinasi manusia + agent daripada repo open source biasa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLisensinya campuran: beberapa crate MIT, sebagian besar AGPL v3.\n\u003cul\u003e\n\u003cli\u003eartinya ini bukan open source serba permisif, tetapi tetap ingin menjaga reciprocity di bagian inti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eIntinya: open source bukan cuma soal visibility code, melainkan soal “mekanisme produksi software” yang terbuka.\u003c/li\u003e\n\u003cli\u003eInsight: yang paham bukan cuma dengar “open source”, tapi langsung tanya “apa yang dibuka, dan gimana workflownya diarahkan?”.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://trufflesecurity.com/blog/google-api-keys-werent-secrets-but-then-gemini-changed-the-rules\"\u003eGoogle API key publik dan Gemini: bocornya credential + privilege expansion\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTIL: Parthi case adalah billing abuse Gemini yang dipicu oleh key Google lama/public-ish yang tiba-tiba effective access ke Gemini setelah API di-enable di project yang sama.\u003c/li\u003e\n\u003cli\u003eTruffle di sini bertindak sebagai peneliti yang audit banyak key publik, bukan pihak yang “memilih satu key untuk semua” di project mereka sendiri.\u003c/li\u003e\n\u003cli\u003eYang berubah bukan string \u003ccode\u003eAIza...\u003c/code\u003e, tapi hak akses efektifnya di backend Google setelah Gemini API diaktifkan.\u003c/li\u003e\n\u003cli\u003eKronologi singkat:\n\u003cul\u003e\n\u003cli\u003efase 1: docs Firebase lama memposisikan beberapa API key sebagai public-ish, bukan secret keras.\u003c/li\u003e\n\u003cli\u003efase 2: Gemini/Generative Language API diaktifkan di project yang sama.\u003c/li\u003e\n\u003cli\u003efase 3: existing keys bisa silently gain access ke Gemini endpoints.\u003c/li\u003e\n\u003cli\u003efase 4: attacker scrape key publik dan mengeksekusi request billing-heavy.\u003c/li\u003e\n\u003cli\u003efase 5: Parthi jadi contoh kasus billing abuse yang mencuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eAkar masalah:\n\u003cul\u003e\n\u003cli\u003edesain Google: satu keluarga key dipakai lintas trust boundary, default restriction lemah, dan privilege expansion terjadi retroactively.\u003c/li\u003e\n\u003cli\u003ehygiene user: key lama tidak diaudit, tidak dipisah project, dan tidak direstrict cukup ketat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTakeaways penting:\n\u003cul\u003e\n\u003cli\u003ejangan campur key frontend/public dengan project Gemini.\u003c/li\u003e\n\u003cli\u003eanggap semua key lama suspect setelah Gemini aktif.\u003c/li\u003e\n\u003cli\u003eunrestricted key itu insecure.\u003c/li\u003e\n\u003cli\u003eGemini key bukan Firebase browser key; jangan expose ke client.\u003c/li\u003e\n\u003cli\u003ebilling guardrails adalah kontrol security.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eChecklist cepat:\n\u003cul\u003e\n\u003cli\u003ecek project mana yang aktifkan Generative Language API.\u003c/li\u003e\n\u003cli\u003eaudit semua API key di project tersebut.\u003c/li\u003e\n\u003cli\u003escan exposure pada JS bundle/repo/web.\u003c/li\u003e\n\u003cli\u003episahkan project frontend/public dan AI/backend.\u003c/li\u003e\n\u003cli\u003epasang API/application restrictions.\u003c/li\u003e\n\u003cli\u003erotate key lama dan hapus yang suspect.\u003c/li\u003e\n\u003cli\u003esudahkah ada budget/alert untuk anomaly usage?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eInsight: ini bukan hanya “frontend key ceroboh,” tapi “credential publik berubah makna ketika layanan baru diaktifkan di project yang sama.”\u003c/li\u003e\n\u003cli\u003eSupport posture: Google bisa bilang “customer responsible,” tapi itu tidak otomatis membuktikan akar masalahnya 100% ada di tim customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"https://x.com/derekmeegan/status/2049218109807198331\"\u003eBrowser trace: agent observability, bukan sekadar klik-klik\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArti yang gue pilih: \u003ccode\u003ebrowser-trace\u003c/code\u003e memberi agent observability ke browser runtime — network, DOM, screenshots, dan CDP logs — bukan cuma kemampuan klik otomatis.\u003c/li\u003e\n\u003cli\u003eJadi kalau lo nanya “bisa dipake untuk download content?” jawabnya: iya, tapi sifatnya lebih ke \u003cstrong\u003econtent extraction\u003c/strong\u003e dan \u003cstrong\u003escraping berjejak\u003c/strong\u003e, bukan automatic download manager.\u003c/li\u003e\n\u003cli\u003eUntuk file nyata (PDF/CSV/image/ZIP), trace bisa bantu dengan menemukan request yang menghasilkan file, URL final, header response, dan urutan klik yang memicu unduhan.\u003c/li\u003e\n\u003cli\u003eUntuk isi halaman, ini sangat natural: agent bisa ambil DOM, response API, render text, dan perubahan state setelah JS jalan.\u003c/li\u003e\n\u003cli\u003eUntuk scraping/archiving otomatis, ini malah kuat: agent bisa menyimpan DOM + screenshot + network payload sebagai evidence, lalu bandingkan perubahan konten.\u003c/li\u003e\n\u003cli\u003eBatasannya:\n\u003cul\u003e\n\u003cli\u003etidak otomatis jadi downloader rapi.\u003c/li\u003e\n\u003cli\u003eobservability banyak data, perlu filter agar agent tidak tenggelam.\u003c/li\u003e\n\u003cli\u003eraw trace bisa memuat data sensitif, jadi perlu sanitization dan access control.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eInsight: nilai utamanya adalah membuat agent tahu \u003cstrong\u003edari mana konten muncul dan kenapa proses browser-nya gagal\u003c/strong\u003e, bukan sekadar menekan tombol download.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null
