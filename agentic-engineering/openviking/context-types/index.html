der","text":"5.8 skills","value":"58-skills","line":154,"column":0,"depth":3},"6-skill-kemampuan-yang-bisa-dipanggil-agent":{"type":"header","text":"6. Skill: kemampuan yang bisa dipanggil agent","value":"6-skill-kemampuan-yang-bisa-dipanggil-agent","line":160,"column":0,"depth":2},"7-resource-vs-memory-vs-skill-secara-tajam":{"type":"header","text":"7. Resource vs Memory vs Skill secara tajam","value":"7-resource-vs-memory-vs-skill-secara-tajam","line":172,"column":0,"depth":2},"8-unified-search-kenapa-penting":{"type":"header","text":"8. Unified search: kenapa penting?","value":"8-unified-search-kenapa-penting","line":184,"column":0,"depth":2},"9-insight-penutup":{"type":"header","text":"9. Insight penutup","value":"9-insight-penutup","line":196,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":200,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"openviking-context-types\"\u003eOpenViking context types\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-context-types\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003econtext types\u003c/strong\u003e di OpenViking bukan \"context window\" LLM dan bukan prompt context biasa. Di OpenViking, context berarti semua bahan yang bisa dipakai agent untuk tahu, mengingat, dan bertindak.\u003c/p\u003e\n\u003ch2 id=\"1-pertanyaan-kunci-yang-gue-pegang\"\u003e1. Pertanyaan kunci yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda enam pertanyaan inti yang bikin konsep ini jelas buat gue:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKenapa OpenViking membagi context jadi 3 tipe?\u003c/li\u003e\n\u003cli\u003eApa itu Resource?\u003c/li\u003e\n\u003cli\u003eApa itu Memory?\u003c/li\u003e\n\u003cli\u003eApa itu Skill?\u003c/li\u003e\n\u003cli\u003eKenapa Memory dibagi jadi 8 kategori?\u003c/li\u003e\n\u003cli\u003eApa gunanya unified search lintas tiga tipe ini?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"2-kenapa-harus-dibagi-jadi-resource-memory-skill\"\u003e2. Kenapa harus dibagi jadi Resource, Memory, Skill?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-harus-dibagi-jadi-resource-memory-skill\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking memisahkan konteks berdasarkan fungsi kognitif agent. Ini bukan sekadar taxonomy folder, tapi desain untuk mencegah agent mencampur \"pengetahuan\", \"pengalaman\", dan \"kemampuan\" ke satu tumpukan RAG yang kabur.\u003c/p\u003e\n\u003cp\u003eKalau semua data masuk satu vector DB flat, agent bisa salah anggap antara:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edokumen referensi,\u003c/li\u003e\n\u003cli\u003epreferensi user,\u003c/li\u003e\n\u003cli\u003epengalaman historis,\u003c/li\u003e\n\u003cli\u003edefinisi kemampuan,\u003c/li\u003e\n\u003cli\u003eaturan resmi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOpenViking memilih:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eResource\u003c/strong\u003e = referensi,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMemory\u003c/strong\u003e = pembelajaran,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkill\u003c/strong\u003e = aksi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni mirip dengan cara manusia bekerja:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuku/manual untuk tahu,\u003c/li\u003e\n\u003cli\u003epengalaman pribadi untuk ingat,\u003c/li\u003e\n\u003cli\u003eketerampilan untuk bertindak.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-resource-pengetahuan-dan-aturan\"\u003e3. Resource: pengetahuan dan aturan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-resource-pengetahuan-dan-aturan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eResource adalah external knowledge yang relatif statis. Ini sumber yang user atau developer masukkan supaya agent punya basis pengetahuan.\u003c/p\u003e\n\u003cp\u003eKarakteristik Resource:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUser-driven\u003c/strong\u003e: biasanya ditambahkan oleh user.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStatic content\u003c/strong\u003e: tidak berubah otomatis setiap session.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStructured storage\u003c/strong\u003e: disimpan dalam hierarchy seperti \u003ccode\u003eviking://resources/...\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh Resource:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAPI docs,\u003c/li\u003e\n\u003cli\u003eproduct manual,\u003c/li\u003e\n\u003cli\u003eFAQ,\u003c/li\u003e\n\u003cli\u003ecode repo,\u003c/li\u003e\n\u003cli\u003eresearch paper,\u003c/li\u003e\n\u003cli\u003etechnical spec.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi Resource itu bukan memori agent. Ini adalah knowledge base yang agent baca.\u003c/p\u003e\n\u003ch2 id=\"4-memory-kognisi-yang-dipelajari-agent\"\u003e4. Memory: kognisi yang dipelajari agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-memory-kognisi-yang-dipelajari-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMemory adalah konteks yang dihasilkan dari interaksi. Ini bukan hanya preferensi user; ini juga pengalaman agent sendiri.\u003c/p\u003e\n\u003cp\u003eKarakteristik Memory:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAgent-driven\u003c/strong\u003e: diekstrak atau dicatat oleh agent.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDynamic updates\u003c/strong\u003e: berubah seiring waktu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePersonalized\u003c/strong\u003e: bisa spesifik ke user atau agent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh user memory:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUser prefers structured explanations.\u003c/li\u003e\n\u003cli\u003eUser works on project Alpha.\u003c/li\u003e\n\u003cli\u003eUser dislikes vague answers.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh agent memory:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWhen debugging sandbox issues, check env variables first.\u003c/li\u003e\n\u003cli\u003eFor this repo, tests often fail due to fixture paths.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau dibedakan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUser memory\u003c/strong\u003e = agent belajar tentang user.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAgent memory\u003c/strong\u003e = agent belajar dari pekerjaannya sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-delapan-kategori-memory\"\u003e5. Delapan kategori Memory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-delapan-kategori-memory\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue catat bahwa page ini memakai versi 8 kategori memory. Ini lebih rinci daripada overview 6 kategori.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eprofile\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003epreferences\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eentities\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eevents\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ecases\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003epatterns\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etools\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eskills\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"51-profile\"\u003e5.1 profile\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#51-profile\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003euser/memories/profile.md\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eProfile adalah kartu identitas ringkas. Informasi dasar user digabung, bukan dipecah-pecah.\u003c/p\u003e\n\u003ch3 id=\"52-preferences\"\u003e5.2 preferences\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#52-preferences\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003euser/memories/preferences/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003ePreferences adalah preferensi topikal yang appendable.\u003c/p\u003e\n\u003ch3 id=\"53-entities\"\u003e5.3 entities\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#53-entities\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003euser/memories/entities/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eEntities adalah memory tentang orang, project, organisasi, produk.\u003c/p\u003e\n\u003ch3 id=\"54-events\"\u003e5.4 events\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#54-events\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003euser/memories/events/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eEvents adalah record historis. Biasanya tidak diperbarui.\u003c/p\u003e\n\u003ch3 id=\"55-cases\"\u003e5.5 cases\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#55-cases\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003eagent/memories/cases/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eCases adalah pengalaman task konkret. Sifatnya immutable.\u003c/p\u003e\n\u003ch3 id=\"56-patterns\"\u003e5.6 patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#56-patterns\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003eagent/memories/patterns/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003ePatterns adalah generalisasi dari cases. Sifatnya mergeable.\u003c/p\u003e\n\u003ch3 id=\"57-tools\"\u003e5.7 tools\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#57-tools\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003eagent/memories/tools/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eTools adalah memory tentang penggunaan tools dan best practice.\u003c/p\u003e\n\u003ch3 id=\"58-skills\"\u003e5.8 skills\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#58-skills\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLokasi: \u003ccode\u003eagent/memories/skills/\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eSkills memory adalah pengalaman/strategi menjalankan skill, bukan definisi skill itu sendiri.\u003c/p\u003e\n\u003ch2 id=\"6-skill-kemampuan-yang-bisa-dipanggil-agent\"\u003e6. Skill: kemampuan yang bisa dipanggil agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-skill-kemampuan-yang-bisa-dipanggil-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSkill adalah capability yang dapat diinvoke. Definisi skill relatif statis, tapi memory tentang skill dapat berubah.\u003c/p\u003e\n\u003cp\u003eSkill memiliki sifat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDefined capability\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRelatively static\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCallable\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni berbeda dengan skill memory, yang adalah pengalaman menjalankan skill.\u003c/p\u003e\n\u003ch2 id=\"7-resource-vs-memory-vs-skill-secara-tajam\"\u003e7. Resource vs Memory vs Skill secara tajam\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-resource-vs-memory-vs-skill-secara-tajam\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContoh satu task:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eResource = dokumen dan kode yang dibaca.\u003c/li\u003e\n\u003cli\u003eMemory = pengalaman historis dan preferensi.\u003c/li\u003e\n\u003cli\u003eSkill = prosedur atau tool yang dipanggil.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eResource menjawab \"agent tahu apa?\"\nMemory menjawab \"agent belajar apa dari pengalaman?\"\nSkill menjawab \"agent bisa melakukan apa?\"\u003c/p\u003e\n\u003ch2 id=\"8-unified-search-kenapa-penting\"\u003e8. Unified search: kenapa penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-unified-search-kenapa-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUnified search adalah pencarian lintas Resource, Memory, dan Skill dalam satu sistem.\u003c/p\u003e\n\u003cp\u003eSatu query bisa menghasilkan tiga jenis jawaban sekaligus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eresource relevan,\u003c/li\u003e\n\u003cli\u003ememory relevan,\u003c/li\u003e\n\u003cli\u003eskill relevan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni membuat agent bisa memutuskan bukan hanya berdasarkan dokumen, tapi juga berdasarkan pengalaman dan kemampuan.\u003c/p\u003e\n\u003ch2 id=\"9-insight-penutup\"\u003e9. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKesan terbesar gue: OpenViking membagi context bukan supaya lebih rumit, tapi supaya agent tidak salah kaprah. Resource, Memory, Skill adalah tiga mode kognitif yang berbeda. Agent yang matang harus tahu bedanya antara apa yang dia tahu, apa yang dia ingat, dan apa yang dia bisa lakukan.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault/daily.journal.2026.06.03 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eopenviking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003econtext-types (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extracti
