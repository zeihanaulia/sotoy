column":0,"depth":2},"reply-dan-arah-diskusi":{"type":"header","text":"Reply dan arah diskusi","value":"reply-dan-arah-diskusi","line":146,"column":0,"depth":2},"kesimpulan-praktis":{"type":"header","text":"Kesimpulan praktis","value":"kesimpulan-praktis","line":160,"column":0,"depth":2}},"children":[],"parent":"notes.prompt-engineering","data":{}},"body":"\u003ch1 id=\"lee-robinson-signal-first-hiring-advice-untuk-engineer\"\u003eLee Robinson: signal-first hiring advice untuk engineer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lee-robinson-signal-first-hiring-advice-untuk-engineer\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLee Robinson lagi bahas cara bikin application engineering yang mudah terbaca oleh reviewer. Ini bukan soal bikin CV cantik atau cerita hidup lengkap. Menurut gue, ini soal \u003cstrong\u003esignal extraction\u003c/strong\u003e: bikin sinyal kompetensi, taste, dan relevansi lo muncul cepat di batch aplikasi yang seabrek.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThread: \u003ca href=\"https://x.com/leerob/status/2053287286226166254\"\u003ehttps://x.com/leerob/status/2053287286226166254\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"aplikasi-sebagai-paket-sinyal\"\u003eAplikasi sebagai paket sinyal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#aplikasi-sebagai-paket-sinyal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenurut gue, Lee nggak bicara cuma soal CV. Dia bicara soal paket aplikasi engineering yang cepat kebaca:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCV = ringkasan sinyal,\u003c/li\u003e\n\u003cli\u003eLinkedIn = canonical reference yang rapi,\u003c/li\u003e\n\u003cli\u003eGitHub = bukti teknis,\u003c/li\u003e\n\u003cli\u003epersonal website = pembeda,\u003c/li\u003e\n\u003cli\u003eproject = bukti taste + depth.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi mata Lee, yang bagus bukan aplikasi yang paling indah, tapi aplikasi yang membuat reviewer cepat nangkap kompetensi dan relevansi.\u003c/p\u003e\n\u003ch2 id=\"1-cv-seperti-apa-yang-bagus\"\u003e1. CV seperti apa yang bagus?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-cv-seperti-apa-yang-bagus\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue kompres dari thread, CV yang bagus punya sifat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e1 halaman\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003elangsung nunjukin \u003cstrong\u003esiapa lo + apa yang lo bisa\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003epengalaman ditulis \u003cstrong\u003esingkat tapi tajam\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eproject dipilih \u003cstrong\u003esedikit tapi kuat\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eada bukti bahwa lo paham \u003cstrong\u003eAI / agents / tooling modern\u003c/strong\u003e kalau relevan\u003c/li\u003e\n\u003cli\u003egak kebanyakan bullet\u003c/li\u003e\n\u003cli\u003egak ada foto\u003c/li\u003e\n\u003cli\u003egak dump semua yang pernah lo kerjakan\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFormat mentalnya: header, summary singkat, experience 2–4 item, selected projects 2–3 item, skills secukupnya, link ke website/GitHub/LinkedIn.\u003c/p\u003e\n\u003cp\u003eCV bagus menurut frame Lee adalah CV yang \u003cstrong\u003eketat, bukan padat\u003c/strong\u003e. Reviewernya mau sinyal, bukan autobiografi.\u003c/p\u003e\n\u003ch2 id=\"2-linkedin-seperti-apa-yang-cukup-serius\"\u003e2. LinkedIn seperti apa yang cukup \"serius\"?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-linkedin-seperti-apa-yang-cukup-serius\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLee jelas banget: LinkedIn gak harus jadi akun influencer, tapi harus \u003cstrong\u003eupdated dan accurate\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eLinkedIn yang bagus itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eheadline jelas,\u003c/li\u003e\n\u003cli\u003ecurrent role akurat,\u003c/li\u003e\n\u003cli\u003eabout section singkat,\u003c/li\u003e\n\u003cli\u003eexperience sinkron dengan CV,\u003c/li\u003e\n\u003cli\u003efeatured section ada link ke website/GitHub,\u003c/li\u003e\n\u003cli\u003efoto profile wajar/rapi,\u003c/li\u003e\n\u003cli\u003egak kosong,\u003c/li\u003e\n\u003cli\u003egak outdated.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi yang dianggap serius bukan LinkedIn yang rajin posting, tapi LinkedIn yang bisa jadi referensi institusional cepat.\u003c/p\u003e\n\u003ch2 id=\"3-githubprofile-seperti-apa-yang-bagus\"\u003e3. GitHub/profile seperti apa yang bagus?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-githubprofile-seperti-apa-yang-bagus\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLee spesifik: dia mau lihat \u003cstrong\u003ecode dan ide\u003c/strong\u003e, bukan profil yang penuh badge atau dekorasi.\u003c/p\u003e\n\u003cp\u003eGitHub yang bagus menurut dia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eclean,\u003c/li\u003e\n\u003cli\u003epinned repo sedikit tapi kuat,\u003c/li\u003e\n\u003cli\u003eprofil README minimal kalau ada,\u003c/li\u003e\n\u003cli\u003egak penuh badge/gif/animasi,\u003c/li\u003e\n\u003cli\u003erepo yang ditonjolkan punya README jelas,\u003c/li\u003e\n\u003cli\u003ecommit history wajar,\u003c/li\u003e\n\u003cli\u003eproject mencerminkan taste/arah lo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya, GitHub bagus kalau dia mempermudah reviewer fokus ke kemampuan teknis lo tanpa buat mereka terganggu oleh noise.\u003c/p\u003e\n\u003ch2 id=\"4-paket-keseluruhannya-harus-terasa-seperti-apa\"\u003e4. Paket keseluruhannya harus terasa seperti apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-paket-keseluruhannya-harus-terasa-seperti-apa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaket idealnya terasa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eringkas\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erapi\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eakurasi tinggi\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003epunya taste\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003epunya bukti\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etidak AI-slop\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etidak overdecorated\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erelevan dengan role\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukan satu artefak harus sempurna. Tapi semua permukaan publik lo saling konsisten dan cepat dibaca.\u003c/p\u003e\n\u003cp\u003eKalau salah satunya jelek, paket sinyal lo turun:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCV bagus tapi LinkedIn outdated → ragu,\u003c/li\u003e\n\u003cli\u003eLinkedIn rapi tapi GitHub slop → trust turun,\u003c/li\u003e\n\u003cli\u003eGitHub bagus tapi CV ramai → sinyal utama tenggelam,\u003c/li\u003e\n\u003cli\u003ewebsite ada tapi kosong → gak jadi pembeda.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"inti-yang-paling-penting\"\u003eInti yang paling penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-yang-paling-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari isi thread gue ringkas ke beberapa poin utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eResume itu teaser, bukan autobiografi\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esatu halaman, sedikit bullet, dan fokus ke sinyal yang paling relevan.\u003c/li\u003e\n\u003cli\u003ekalau resume penuh project atau noise, reviewer mungkin nggak sampai ke titik terbaik lo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePublic proof sekarang bagian dari aplikasi\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epersonal website profesional,\u003c/li\u003e\n\u003cli\u003eGitHub yang rapi,\u003c/li\u003e\n\u003cli\u003eX yang dikurasi,\u003c/li\u003e\n\u003cli\u003eLinkedIn yang gampang dicek.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eRelevansi lebih penting daripada kelengkapan\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecustom ke company target,\u003c/li\u003e\n\u003cli\u003ejangan pamer daftar kampus atau kursus kalau nggak relevan,\u003c/li\u003e\n\u003cli\u003etampilkan project dan skill yang resonan sama role yang dilamar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eAI/agents masuk jadi ekspektasi, bukan bonus\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epoin ini paling tajam buat role modern: kalau gak ada sinyal AI sama sekali, aplikasi bisa terasa ketinggalan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eAI-generated text bisa jadi sinyal buruk\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLee bilang AI boleh dipakai untuk brainstorming, tapi harus tetap jaga suara asli.\u003c/li\u003e\n\u003cli\u003ekalau resume atau cover letter terlalu terasa generik, itu justru merusak trust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003e3 project bagus \u003e 27 project slop\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekualitas lebih penting daripada kuantitas.\u003c/li\u003e\n\u003cli\u003eproject yang jelas dan berisi jauh lebih bernilai daripada daftar panjang yang nggak jelas kontribusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"asumsi-tersembunyi\"\u003eAsumsi tersembunyi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#asumsi-tersembunyi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari thread ini gue tarik beberapa asumsi yang penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ereviewer punya waktu sedikit dan butuh scan cepat.\u003c/li\u003e\n\u003cli\u003ecandidate diharapkan punya footprint publik minimal.\u003c/li\u003e\n\u003cli\u003eini advice yang paling cocok untuk startup / product engineering / AI-aware companies.\u003c/li\u003e\n\u003cli\u003etaste dan interests bisa jadi signal kultur, bukan sekadar hiasan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"reply-dan-arah-diskusi\"\u003eReply dan arah diskusi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reply-dan-arah-diskusi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eReply yang muncul di thread lebih banyak support daripada debat. Tapi ada beberapa nuance:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eorang menegaskan kembali bahwa \u003cstrong\u003eLinkedIn masih penting\u003c/strong\u003e sebagai canonical reference internal.\u003c/li\u003e\n\u003cli\u003eada friksi kecil antara profesional readability dan ekspresi personal di GitHub profile.\u003c/li\u003e\n\u003cli\u003esebagian besar reply nggak ngelawan substansi, mereka lebih ke \"yes, this is practical\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi arah diskusi yang muncul itu bukan \"Lee salah\" atau \"Lee benar\". Arahnya lebih ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eaplikasi engineering modern itu paket sinyal,\u003c/li\u003e\n\u003cli\u003ebukan hanya resume PDF,\u003c/li\u003e\n\u003cli\u003etetapi juga website, GitHub, LinkedIn, dan jejak sosial.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesimpulan-praktis\"\u003eKesimpulan praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau menurut gue, thread ini paling baik dipakai sebagai checklist audit aplikasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eresume ringkas dan signal-first,\u003c/li\u003e\n\u003cli\u003eGitHub yang menunjukkan output kode nyata,\u003c/li\u003e\n\u003cli\u003epersonal website dan LinkedIn yang mudah dicek,\u003c/li\u003e\n\u003cli\u003eX yang tidak bikin red flag,\u003c/li\u003e\n\u003cli\u003ehighlight AI/agent-related skill jika relevan,\u003c/li\u003e\n\u003cli\u003ejangan outsource voice ke AI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bukan resep universal, tapi heuristik kuat buat engineer yang apply ke perusahaan modern dan internet-native.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprompt-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehiring (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eresume (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124518\"\u003eAplikasi engineering terbaik adalah paket sinyal, bukan dokumen tunggal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.11\"\u003e2026-05-11\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyncMode":"noCommit","enableAutoFoldFrontmatter":false,"enableEditorDecorations":true,"maxPreviewsCached":10,"maxNoteLength":204800,"seeds":{"dendron.templates":{}},"enableFullHierarchyNoteTitle":false},"preview":{"enableFMTitle":true,"enableNoteTitleForLink":true,"enableFrontmatterTags":true,"enableHashesForFMTags":false,"enablePrettyRefs":true,"enableKatex":true,"automaticallyShowPreview":false},"publishing":{"enableFMTitle":true,
