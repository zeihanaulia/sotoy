fname":"notes.psychology.neurotic-narcissism"}},{"type":"wiki","from":{"fname":"notes.psychology.vulnerable-narcissism-vs-growth","id":"notes.psychology.vulnerable-narcissism-vs-growth","vaultName":"vault"},"value":"notes.psychology.boundary-vs-reality-check","position":{"start":{"line":26,"column":53,"offset":1759},"end":{"line":26,"column":99,"offset":1805},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.psychology.boundary-vs-reality-check"}},{"from":{"fname":"handbook.growth.exposure-ladder","id":"handbook.growth.exposure-ladder","vaultName":"vault"},"type":"backlink","position":{"start":{"line":47,"column":11,"offset":2920},"end":{"line":47,"column":63,"offset":2972},"indent":[]},"value":"notes.psychology.vulnerable-narcissism-vs-growth"}],"anchors":{"vulnerable-narcissism-vs-growth-patterns":{"type":"header","text":"Vulnerable Narcissism vs Growth Patterns","value":"vulnerable-narcissism-vs-growth-patterns","line":16,"column":0,"depth":1},"the-label-trap":{"type":"header","text":"The Label Trap","value":"the-label-trap","line":18,"column":0,"depth":2},"the-core-conflict-recognition-vs-risk":{"type":"header","text":"The Core Conflict: Recognition vs Risk","value":"the-core-conflict-recognition-vs-risk","line":23,"column":0,"depth":2},"growth-vs-stagnation-the-direction-of-energy":{"type":"header","text":"Growth vs Stagnation (The Direction of Energy)","value":"growth-vs-stagnation-the-direction-of-energy","line":29,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"vulnerable-narcissism-vs-growth-patterns\"\u003eVulnerable Narcissism vs Growth Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vulnerable-narcissism-vs-growth-patterns\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"vulnerable-narcissism-vs-growth-patterns-1\"\u003eVulnerable Narcissism vs Growth Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vulnerable-narcissism-vs-growth-patterns-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"the-label-trap\"\u003eThe Label Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-label-trap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSangat mudah untuk melakukan \u003cem\u003eovercorrection\u003c/em\u003e setelah mengetahui tentang \u003cem\u003evulnerable narcissism\u003c/em\u003e: \"Saya merasa insecure, berarti saya narsistik.\" Ini adalah jebakan label. Insecure bisa berasal dari banyak sumber: trauma, social anxiety, perfeksionisme, atau kurangnya validasi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFraming yang Sehat\u003c/strong\u003e: Alih-alih melabel diri sebagai \"NPD Neurotik\", gunakan deskripsi perilaku yang \u003cem\u003eactionable\u003c/em\u003e: \"Saya memiliki pola malu, takut tampil, sensitif terhadap kredit, dan belum konsisten bergerak memperbaiki diri.\"\u003c/p\u003e\n\u003ch2 id=\"the-core-conflict-recognition-vs-risk\"\u003eThe Core Conflict: Recognition vs Risk\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-core-conflict-recognition-vs-risk\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalah utamanya seringkali bukan keinginan untuk tampil, melainkan keinginan untuk \u003cstrong\u003ediakui tanpa harus mengambil risiko terlihat gagal\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMode Aman (Tongkrongan Kecil)\u003c/strong\u003e: Risiko rendah \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Ide mengalir, percaya diri muncul.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMode Terancam (Forum Besar)\u003c/strong\u003e: Risiko tinggi (dinilai, dipatahkan) \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Diri menghilang/menarik diri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"growth-vs-stagnation-the-direction-of-energy\"\u003eGrowth vs Stagnation (The Direction of Energy)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#growth-vs-stagnation-the-direction-of-energy\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePerbedaan antara pola narsistik neurotik dan orang yang sedang tumbuh bukan terletak pada rasa sakitnya, melainkan pada \u003cstrong\u003earah energi setelah rasa sakit itu muncul\u003c/strong\u003e.\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth align=\"left\"\u003ePola Narsistik Neurotik (Stagnan)\u003c/th\u003e\u003cth align=\"left\"\u003ePola Pertumbuhan (Growth)\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003eBerhenti pada narasi korban (\"Dunia tidak adil\", \"Ide saya dicuri\").\u003c/td\u003e\u003ctd align=\"left\"\u003eMengakui rasa sakit, tapi mencari bagian yang bisa dilatih.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003eMenggunakan luka sebagai alasan untuk tidak bergerak.\u003c/td\u003e\u003ctd align=\"left\"\u003eMengubah luka menjadi sistem (dokumentasi, latihan bicara).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003eIdentitas dibangun di atas \"ketidakberdayaan\".\u003c/td\u003e\u003ctd align=\"left\"\u003eIdentitas dibangun di atas \"proses perbaikan\".\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Pertumbuhan dimulai ketika luka diubah menjadi struktur.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.neurotic-narcissism\"\u003eNeurotic Narcissism (Narcissistic Neuroticism)\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.boundary-vs-reality-check\"\u003eBoundary vs Reality Check\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003egrowth-mindset (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enpd (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" t
