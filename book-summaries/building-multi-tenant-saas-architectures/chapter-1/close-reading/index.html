er 1 Close Reading — The SaaS Mindset\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-1-close-reading--the-saas-mindset\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eChapter 1 ini bukan sekadar bab pengantar bagi gue. Ini bagian yang bikin gue ngecek ulang apakah cara gue memikirkan SaaS sudah nyambung dengan yang dimaksud penulis.\u003c/p\u003e\n\u003ch2 id=\"tujuan-close-reading\"\u003eTujuan close reading\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tujuan-close-reading\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue bikin close reading ini untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emelihat alur pikir penulis per paragraf,\u003c/li\u003e\n\u003cli\u003eambil quotes yang paling berat,\u003c/li\u003e\n\u003cli\u003ecari takeaway desain yang bisa gue pakai di sistem nyata,\u003c/li\u003e\n\u003cli\u003edan bikin sketsa logika visual supaya nggak cuma lepas di kepala.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau gue baca buku arsitektur serius, bukan cuma soal \"apa isinya\", tapi \"kenapa susunan paragrafnya begini\".\u003c/p\u003e\n\u003ch2 id=\"sketsa-model-visual\"\u003eSketsa model visual\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sketsa-model-visual\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"figure-1-1--installed-software-model\"\u003eFigure 1-1 — Installed software model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-1--installed-software-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e                 +----------------------+\n                 |         ISV          |\n                 |  builds the product  |\n                 +----------+-----------+\n                            |\n          +-----------------+-----------------+\n          |                                   |\n   +------+-----+                       +-----+------+\n   | Professional|                      | Operations |\n   |  Services   |                      |  Teams     |\n   +------+-----+                       +-----+------+\n          |                                   |\n   -------+-----------------------------------+------------------\n\n   +-------------------+   +-------------------+   +-------------------+\n   | Customer 1 Env    |   | Customer 2 Env    |   | Customer N Env    |\n   | Version A         |   | Version B         |   | Version X         |\n   | Customization 1   |   | Customization 2   |   | Customization ?   |\n   | Own infra / setup |   | Own infra / setup |   | Own infra / setup |\n   +-------------------+   +-------------------+   +-------------------+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni gambaran yang paling ngejelasin buat gue: satu vendor, banyak pulau environment customer, masing-masing versi dan custom beda. Ini mengunci argumentasinya di awal: cuma karena ada label \"SaaS\", bukan berarti semua orang lagi ngomongin platform bersama.\u003c/p\u003e\n\u003ch3 id=\"figure-1-2--shared-infrastructure-saas-model\"\u003eFigure 1-2 — Shared infrastructure SaaS model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-2--shared-infrastructure-saas-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e                +--------------------------------------+\n                |   Management / Ops / Deployment      |\n                +------------------+-------------------+\n                                   |\n                     +-------------v-------------+\n                     |   Unified SaaS Platform   |\n                     | shared app + shared infra |\n                     +------+------+------+------+\n                            |      |      |\n                         Tenant1 Tenant2 TenantN\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni model tradisional SaaS yang langsung kebayang kalau denger multi-tenancy: satu gedung besar, satu deployment, satu update untuk semua tenant.\u003c/p\u003e\n\u003ch3 id=\"figure-1-3--cross-cutting-saas-capabilities\"\u003eFigure 1-3 — Cross-cutting SaaS capabilities\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-3--cross-cutting-saas-capabilities\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e                +----------------------+\n                | Onboarding / Identity|\n                +----------+-----------+\n                           |\n   +-----------------------v------------------------+\n   |                                                |\n   |             SaaS Application Core              |\n   |         (business features / app logic)        |\n   |                                                |\n   +-----------+------------------------+-----------+\n               |                        |\n   +-----------v---------+   +----------v----------+\n   | Deploy / Management |   | Billing / Metering  |\n   |                     |   | Metrics / Analytics |\n   +---------------------+   +---------------------+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eGambar ini penting buat gue karena ngejelasin satu hal yang gue sering lupa: core app itu bukan sendirian. Onboarding, identity, deploy, billing, metering, metrics adalah bagian dari SaaS, bukan pelengkap.\u003c/p\u003e\n\u003ch3 id=\"figure-1-4--sample-multi-tenant-environment\"\u003eFigure 1-4 — Sample multi-tenant environment\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-4--sample-multi-tenant-environment\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e      +------------------------------------------------------+   \n      | Shared SaaS Services                                 |\n      | onboarding | identity | deploy | manage | billing   |\n      +--------------------------+---------------------------+\n                                 |\n               +-----------------v-----------------+\n               | Shared App Microservices           |\n               | product | order | fulfillment ... |\n               | shared compute + shared storage    |\n               +-----------------+-----------------+\n                                 |\n                        +--------+--------+\n                        | tenants 1..N    |\n                        +-----------------+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni versi paling mudah dicerna: shared app plus shared surrounding services. Jadi kalau lo ingin model klasik SaaS, ini prototype-nya.\u003c/p\u003e\n\u003ch3 id=\"figure-1-5--shared-and-dedicated-mixed-model\"\u003eFigure 1-5 — Shared and dedicated mixed model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-5--shared-and-dedicated-mixed-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e   +--------------------------------------------------------------+\n   | Shared control plane: onboarding / management / operations   |\n   +------------------------+-------------------------------------+\n                            |\n         +------------------+------------------+------------------+\n         |                                     |                  |\n   +-----v------+                       +------v------+    +------v------+\n   | Product MS |                       | Order MS    |    | Fulfillment |\n   | compute: S |                       | compute: S  |    | compute: D  |\n   | storage: S |                       | storage: D  |    | storage: S  |\n   +------------+                       +------+------+    +------+------+ \n                                               |                  |\n                                          Tenant DBs         Tenant runtimes\n\nLegend:\nS = shared\nD = dedicated\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eModel hybrid ini bikin gue ngeh bahwa SaaS bisa campur-campur. Sharedness nggak mesti seragam di semua layer.\u003c/p\u003e\n\u003ch3 id=\"figure-1-6--fully-dedicated-resources-still-saas\"\u003eFigure 1-6 — Fully dedicated resources, still SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-6--fully-dedicated-resources-still-saas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e      +------------------------------------------------------+\n      | Shared SaaS control plane                            |\n      | onboarding | deploy | management | operations        |\n      +-----------------------------+------------------------+\n                                    |\n      +-----------+-----------------+-----------------+-----------+\n      |           |                                   |           |\n+-----v----+ +----v-----+                       +-----v----+ +----v-----+\n|Tenant 1  | |Tenant 2  |         ...           |Tenant N  | | ...      |\n|compute D | |compute D |                       |compute D | |          |\n|store D   | |store D   |                       |store D   | |          |\n+----------+ +----------+                       +----------+ +----------+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni yang menurut gue paling radikal: dedicated infra tetap bisa jadi bagian dari SaaS kalau control plane dan experience-nya masih satu.\u003c/p\u003e\n\u003ch3 id=\"figure-1-7--msp-model\"\u003eFigure 1-7 — MSP model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#figure-1-7--msp-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e                 +----------------------+\n                 |   Software Vendor    |\n                 +----------+-----------+\n                            |\n                     +------v------+\n                     |     MSP     |\n                     | centralized |\n                     | operations  |\n                     +------+------+ \n                            |\n      +---------------------+-----------------------+\n      |                     |                       |\n+-----v----+          +-----v----+            +-----v----+\n|Cust Env 1|          |Cust Env 2|            |Cust Env N|\n|Version A |          |Version B |            |Version X |\n|Custom 1  |          |Custom 2  |            |Custom ?  |\n+----------+          +----------+            +----------+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMSP ini bikin gue sadar: operasi terpusat saja belum menjadikan sesuatu SaaS. Kalau versi dan environment customer masih beda-beda, itu masih punya banyak problem model lama.\u003c/p\u003e\n\u003ch2 id=\"close-reading-per-paragraf\"\u003eClose reading per paragraf\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#close-reading-per-paragraf\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"a-opening-argument\"\u003eA. Opening argument\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-opening-argument\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf pertama ngejelasin pengalaman penulis yang sering ketemu definisi SaaS beda-beda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: visi \"SaaS\" bisa sangat bervariasi.\u003c/li\u003e\n\u003cli\u003eQuote: “they tend to start out with what seems like a reasonable, high-level view of what it means to be SaaS… I often discover significant variations in their vision.”\u003c/li\u003e\n\u003cli\u003eTakeaway: kalau orang bilang \"mau bikin SaaS\", belum tentu itu arti yang sama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedua bilang SaaS bukan sekadar teknis; itu mindset.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: SaaS melampaui technical scope.\u003c/li\u003e\n\u003cli\u003eQuote: “The scope of SaaS goes well beyond the technical. It is, in many respects, a mindset…”\u003c/li\u003e\n\u003cli\u003eTakeaway: kalau gue masih melihat SaaS sebagai stack, gue sudah terlalu sempit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf ketiga punya tujuan jelas: bangun mental model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: chapter ini harus jadi dasar.\u003c/li\u003e\n\u003cli\u003eQuote: “The goal in this chapter is to build a foundational mental model…”\u003c/li\u003e\n\u003cli\u003eTakeaway: ini bukan intro filler. Ini kalibrasi istilah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf keempat mengikat: SaaS bukan technology-first mindset.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: business goals dan technical model harus sejalan.\u003c/li\u003e\n\u003cli\u003eQuote: “It’s essential for SaaS architects to understand that SaaS is not a technology-first mindset.”\u003c/li\u003e\n\u003cli\u003eTakeaway: arsitek SaaS harus mulai dari apa bisnis butuh, bukan dari komponen infra apa yang keren.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kelima: ini bisa jadi chapter terpenting.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: jangan skip.\u003c/li\u003e\n\u003cli\u003eQuote: “it may be one of the most important chapters in the book.”\u003c/li\u003e\n\u003cli\u003eTakeaway: ini bab yang nentuin apakah kita bakal paham pola pikirnya atau cuma ambil jargon.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"b-where-we-started\"\u003eB. Where We Started\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-where-we-started\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf keenam memperkenalkan model installed software.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: delivery lama modelnya customer install sendiri.\u003c/li\u003e\n\u003cli\u003eQuote: “pre-SaaS systems were typically delivered in an ‘installed software’ model”\u003c/li\u003e\n\u003cli\u003eTakeaway: sebelum kita bicara SaaS, kita harus paham lawan yang dia garap.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf ketujuh: dev dan ops terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: dev jauh dari run.\u003c/li\u003e\n\u003cli\u003eTakeaway: itu budaya lama yang bikin banyak operational friction.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedelapan siapin visual Figure 1-1.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: sekarang lihat gambarnya.\u003c/li\u003e\n\u003cli\u003eTakeaway: visual bikin lensa tadi langsung lebih jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kesembilan ngejelasin environment customer terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: setiap customer punya versi dan custom sendiri.\u003c/li\u003e\n\u003cli\u003eQuote: “Each of these customers is running specific versions… required one-off customizations…”\u003c/li\u003e\n\u003cli\u003eTakeaway: masalahnya bukan infra saja, tapi variasi per customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kesepuluh: skala model ini butuh banyak support/ops.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: growth menaikkan overhead.\u003c/li\u003e\n\u003cli\u003eTakeaway: scaling model lama berarti nambah tim, bukan nambah efisiensi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kesebelas: model ini sales-driven.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: deal dulu, teknologi ikut.\u003c/li\u003e\n\u003cli\u003eQuote: “landing a deal can take precedence over the need for agility, scale, and operational efficiency.”\u003c/li\u003e\n\u003cli\u003eTakeaway: banyak technical debt SaaS lahir dari keputusan ini.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedua belas: release cadence makin lambat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: multiple versions bikin update rumit.\u003c/li\u003e\n\u003cli\u003eTakeaway: variasi mengganggu kecepatan delivery.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf ketiga belas bilang model lama masih valid di domain tertentu.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: bukan semua model lama salah.\u003c/li\u003e\n\u003cli\u003eTakeaway: ini penulis yang fair, bukan dogmatis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf keempat belas: tapi buat banyak bisnis, model ini problematik.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: one-off kills scale.\u003c/li\u003e\n\u003cli\u003eTakeaway: bila bisnis mau tumbuh, model lama bisa jadi jebakan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kelima belas: validitas tergantung skala.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: kalau customer sedikit, model ini masih oke.\u003c/li\u003e\n\u003cli\u003eTakeaway: pilihan model harus cocok dengan ambition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf keenam belas: cost dan inefficiency.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: setiap customer baru berarti overhead baru.\u003c/li\u003e\n\u003cli\u003eQuote: “Each new customer could require more support teams, more infrastructure…”\u003c/li\u003e\n\u003cli\u003eTakeaway: growth idealnya tidak nambah overhead proporsional per customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf ketujuh belas: operational burden bisa bikin perusahaan sengaja slow growth.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: infrastructure model bisa hambat strategy.\u003c/li\u003e\n\u003cli\u003eTakeaway: ini warning nyata untuk tim SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedelapan belas: masalah lebih besar dari cost—agility.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “this model is anything but nimble.”\u003c/li\u003e\n\u003cli\u003eTakeaway: SaaS bukan sekadar cost play, ini agility play.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kesembilan belas: time-to-feature lambat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: release yang lambat membuat produk mudah ketinggalan.\u003c/li\u003e\n\u003cli\u003eTakeaway: lambat berarti kehilangan relevansi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedua puluh: customer sekarang lebih peduli low-friction value.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: preferensi customer berubah.\u003c/li\u003e\n\u003cli\u003eTakeaway: customer sekarang lebih sudi pindah ke model yang lebih mudah diakses.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedua puluh satu: pricing berubah ke subscription.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: payment model ikut mendukung SaaS.\u003c/li\u003e\n\u003cli\u003eTakeaway: model delivery dan pricing saling menguatkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf kedua puluh dua: cloud mempercepat transisi, tapi cloud bukan SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: cloud membantu, bukan mendefinisikan.\u003c/li\u003e\n\u003cli\u003eTakeaway: lo jangan samakan cloud dengan SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"c-the-move-to-a-unified-model\"\u003eC. The Move to a Unified Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-the-move-to-a-unified-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf dua puluh tiga: unified/shared model sebagai jawaban.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: model per-customer tidak scale.\u003c/li\u003e\n\u003cli\u003eTakeaway: unified model muncul sebagai response ekonomi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh empat: shared infra sebagai alat efisiensi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: sharedness adalah opsi, bukan dogma.\u003c/li\u003e\n\u003cli\u003eTakeaway: shared infra dipilih karena memastikan manageability.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh lima: pengantar Figure 1-2.\u003c/p\u003e\n\u003cp\u003eParagraf dua puluh enam: tenant = environment bersama.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: tenant adalah penghuni common platform.\u003c/li\u003e\n\u003cli\u003eQuote: “one set of resources that is shared and occupied by one or more consumers”\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi tenant menggeser perspektif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh tujuh: shared infra menghapus downside model terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: satu deployment, satu version.\u003c/li\u003e\n\u003cli\u003eQuote: “Gone is the idea of separately deployed, versioned, managed, and operated customer environments.”\u003c/li\u003e\n\u003cli\u003eTakeaway: unified deployment adalah klaim terkuat SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh delapan: shared infra memperbaiki telemetry, DevOps, onboarding.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: ini bukan tweak. Ini perbaikan operasi.\u003c/li\u003e\n\u003cli\u003eTakeaway: shared infra merapikan seluruh machine operasional.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh sembilan: shared model membawa agility+cost+growth.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: kombinasi nilai.\u003c/li\u003e\n\u003cli\u003eTakeaway: SaaS bisa jadi nilai ganda.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh: tantangan baru muncul.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: shared model juga punya pain.\u003c/li\u003e\n\u003cli\u003eTakeaway: kita tukar one set of problems dengan yang lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh satu: same-version sebagai litmus test.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: semua tenant jalan di versi yang sama.\u003c/li\u003e\n\u003cli\u003eQuote: “This notion of having all tenants running the same version of your offering represents a common litmus test for SaaS environments.”\u003c/li\u003e\n\u003cli\u003eTakeaway: same-version adalah discipline penting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh dua: SaaS butuh control-plane capabilities.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: app core must sit inside a wider system.\u003c/li\u003e\n\u003cli\u003eTakeaway: ini kenapa onboarding/identity/billing nggak boleh dianggap secondary.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh tiga: pengantar Figure 1-3.\u003c/p\u003e\n\u003cp\u003eParagraf tiga puluh empat: surrounding capabilities.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: app core dikelilingi support capabilities.\u003c/li\u003e\n\u003cli\u003eTakeaway: core app bukan sendirian.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh lima: people underestimate these capabilities.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: itu anti-pattern.\u003c/li\u003e\n\u003cli\u003eTakeaway: banyak tim keliru menunda komponen ini.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh enam: these components must be front and center.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “these components… must be put front and center”\u003c/li\u003e\n\u003cli\u003eTakeaway: operational capabilities adalah fundamental.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh tujuh: efisiensi SaaS multi-dimensi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: bukan hanya shared infra.\u003c/li\u003e\n\u003cli\u003eTakeaway: efisiensi datang dari beberapa arah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"d-redefining-multi-tenancy\"\u003eD. Redefining Multi-Tenancy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d-redefining-multi-tenancy\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf tiga puluh delapan: istilah multi-tenancy punya baggage.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: istilah perlu ditunda.\u003c/li\u003e\n\u003cli\u003eTakeaway: istilah populer bisa bikin kita ngikutin jalan lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh sembilan: definisi lama valid tapi tidak cukup.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: shared infrastructure itu bagian, bukan semua.\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi lama perlu diperluas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh: definisi lama wajar dibawa.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: ini bukan salah.\u003c/li\u003e\n\u003cli\u003eTakeaway: kita perlu bahasa baru, bukan buang bahasa lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh satu: pengantar Figure 1-4.\u003c/p\u003e\n\u003cp\u003eParagraf empat puluh dua: shared app model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: ini kasus klasik.\u003c/li\u003e\n\u003cli\u003eTakeaway: masih mudah dipahami.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh tiga: SaaS bisa hybrid.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: real world lebih kompleks.\u003c/li\u003e\n\u003cli\u003eTakeaway: shared infra bukan satu-satunya konfigurasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh empat: pengantar Figure 1-5.\u003c/p\u003e\n\u003cp\u003eParagraf empat puluh lima: contoh hybrid.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: compute/storage bisa beda-beda.\u003c/li\u003e\n\u003cli\u003eTakeaway: multi-tenancy adalah kombinasi trade-off.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh enam: definisi klasik goyah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: kita butuh vocabulary lebih presisi.\u003c/li\u003e\n\u003cli\u003eTakeaway: ini alasan pentingnya redefine.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh tujuh: architecture memilih kombinasi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “you’re picking the combinations… that best align with the business and technical requirements”\u003c/li\u003e\n\u003cli\u003eTakeaway: design decision = trade-off.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh delapan: benefit dari unified operational model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: value SaaS lebih dari resource sharing.\u003c/li\u003e\n\u003cli\u003eTakeaway: shared service model juga sumber nilai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh sembilan: pengantar Figure 1-6.\u003c/p\u003e\n\u003cp\u003eParagraf lima puluh: dedicated all-in, still SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: dedicated infra tetap bisa SaaS.\u003c/li\u003e\n\u003cli\u003eTakeaway: control plane unified is key.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh satu: shared capabilities tetap penting.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “they continue to be onboarded, managed, and operated through the same set of shared capabilities”\u003c/li\u003e\n\u003cli\u003eTakeaway: operation unified is the line.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh dua: dedicated bisa valid karena compliance/migration.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: ini bukan teori aneh.\u003c/li\u003e\n\u003cli\u003eTakeaway: real world sering butuh dedicated.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh tiga: definisi harus dievolusi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: definisi praktis lebih berguna.\u003c/li\u003e\n\u003cli\u003eTakeaway: filosofi harus fleksibel.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh empat: definisi baru multi-tenant.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “multi-tenant will refer to any environment that onboards, deploys, manages, and operates tenants through a single, unified experience.”\u003c/li\u003e\n\u003cli\u003eQuote: “The sharedness of any infrastructure will have no correlation to the term ‘multi-tenancy.’”\u003c/li\u003e\n\u003cli\u003eTakeaway: shift dari infra-centric ke operating-model-centric.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh lima: terminology tambahan.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: kita butuh presisi istilah.\u003c/li\u003e\n\u003cli\u003eTakeaway: hybrid model butuh kata-kata yang pas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"e-avoiding-the-single-tenant-term\"\u003eE. Avoiding the “Single-Tenant” Term\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#e-avoiding-the-single-tenant-term\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf lima puluh enam: lawan multi-tenant.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: istilah single-tenant jebakan.\u003c/li\u003e\n\u003cli\u003eTakeaway: kata bisa merusak pola pikir.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh tujuh: istilah ini tidak cocok.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Labeling this a single-tenant environment would undermine…”\u003c/li\u003e\n\u003cli\u003eTakeaway: istilah itu menarik diskusi kembali ke definisi lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh delapan: stop using it.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: fokus ke mode sharing.\u003c/li\u003e\n\u003cli\u003eTakeaway: langsung ke bagaimana resource digunakan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh sembilan: vocabulary alignment.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: istilah dicari karena berguna.\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi adalah alat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"f-where-are-the-boundaries-of-saas\"\u003eF. Where Are the Boundaries of SaaS?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#f-where-are-the-boundaries-of-saas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf enam puluh: nuance dependency eksternal.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: boundary SaaS harus realistis.\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi jangan terlalu ketat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh satu: distributed footprint.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: bukan soal satu lokasi.\u003c/li\u003e\n\u003cli\u003eTakeaway: boundary bisa lintas lokasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh dua: hidden dependency masih SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “If their presence is entirely hidden from your tenants… this is still SaaS to me.”\u003c/li\u003e\n\u003cli\u003eTakeaway: hidden complexity is acceptable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh tiga: exposed dependency memecah SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: tenant harus tetap melihat permukaan.\u003c/li\u003e\n\u003cli\u003eTakeaway: exposed complexity kills the boundary.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh empat: rule of thumb.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “our tenants’ view is limited to the surface of our service.”\u003c/li\u003e\n\u003cli\u003eTakeaway: tenant only sees the service surface.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"g-the-managed-service-provider-model\"\u003eG. The Managed Service Provider Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#g-the-managed-service-provider-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf enam puluh lima: MSP sebagai wrinkle.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: SaaS dan MSP mirip namun berbeda.\u003c/li\u003e\n\u003cli\u003eTakeaway: ada gap meski permukaan serupa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh enam: pengantar Figure 1-7.\u003c/p\u003e\n\u003cp\u003eParagraf enam puluh tujuh: MSP masih punya environment terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: version/customer variation remains.\u003c/li\u003e\n\u003cli\u003eTakeaway: MSP bukan unified app.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh delapan: operasi terpusat, versi beda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: still one-off variation.\u003c/li\u003e\n\u003cli\u003eTakeaway: operasi terpusat tidak otomatis SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh sembilan: vendor + MSP.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: MSP bisa jadi layer operasional.\u003c/li\u003e\n\u003cli\u003eTakeaway: MSP bukan product creator.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh: gap SaaS vs MSP.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: same-version penting.\u003c/li\u003e\n\u003cli\u003eQuote: “customers are being allowed to run separate versions.”\u003c/li\u003e\n\u003cli\u003eTakeaway: same-version is a key separator.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh dua: MSP valid tapi bukan SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: efficiency, yes; unified SaaS, no.\u003c/li\u003e\n\u003cli\u003eTakeaway: recognize the difference.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh tiga: tim SaaS beda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: team topology matters.\u003c/li\u003e\n\u003cli\u003eTakeaway: org design ikut berpengaruh.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh empat: pulse runtime.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: observability is business.\u003c/li\u003e\n\u003cli\u003eTakeaway: ops awareness is not just ops.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh lima: MSP bisa stepping stone.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: don’t throw it away.\u003c/li\u003e\n\u003cli\u003eTakeaway: MSP is transitional, not final.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"h-at-its-core-saas-is-a-business-model\"\u003eH. At Its Core, SaaS Is a Business Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#h-at-its-core-saas-is-a-business-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf tujuh puluh enam: SaaS is business model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “you should really be viewing SaaS more as a business model.”\u003c/li\u003e\n\u003cli\u003eTakeaway: SaaS is not just deployment.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh tujuh: semua fungsi berubah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: this is business transformation.\u003c/li\u003e\n\u003cli\u003eTakeaway: not just engineering.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh delapan: responsiveness ke pasar.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: model must support fast adaptation.\u003c/li\u003e\n\u003cli\u003eTakeaway: SaaS = adaptive operation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh sembilan: needs of the many.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “the needs of the many should always outweigh the needs of the few.”\u003c/li\u003e\n\u003cli\u003eTakeaway: collective needs trump one-offs.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh: backlog butuh operational attributes.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: feature list tidak cukup.\u003c/li\u003e\n\u003cli\u003eTakeaway: service attributes must be visible.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh satu: engineer/QA ikut experience.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: everyone owns experience.\u003c/li\u003e\n\u003cli\u003eTakeaway: accountability broadens.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh dua: marketing/pricing/support berubah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: SaaS blurs functional boundaries.\u003c/li\u003e\n\u003cli\u003eTakeaway: collaboration is required.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh tiga: business principles.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: now we move to values.\u003c/li\u003e\n\u003cli\u003eTakeaway: principles shape choices.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh empat: agility.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “A multi-tenant offering that reduced costs without realizing agility would certainly miss the broader value proposition of SaaS.”\u003c/li\u003e\n\u003cli\u003eTakeaway: cost without agility is incomplete.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh lima: operational efficiency.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: what if 1,000 customers show up?\u003c/li\u003e\n\u003cli\u003eTakeaway: design for scale.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh enam: innovation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: good operations enable experiments.\u003c/li\u003e\n\u003cli\u003eTakeaway: operations fuel innovation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh tujuh: frictionless onboarding.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: onboarding is growth engine.\u003c/li\u003e\n\u003cli\u003eTakeaway: onboarding is strategic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh delapan: growth as design assumption.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: SaaS assumes growth.\u003c/li\u003e\n\u003cli\u003eTakeaway: architecture should accommodate it.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh sembilan: leadership alignment.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: top-down matters.\u003c/li\u003e\n\u003cli\u003eTakeaway: leadership must own it.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh: architecture is business-shaped.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Almost every dimension of your SaaS architecture and strategy is going to be derived from your business vision.”\u003c/li\u003e\n\u003cli\u003eTakeaway: technical design should flow from vision.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh satu: tanpa bisnis jelas, desain goyah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: misalignment kills.\u003c/li\u003e\n\u003cli\u003eTakeaway: business clarity is foundation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"i-building-a-servicenot-a-product\"\u003eI. Building a Service—Not a Product\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#i-building-a-servicenot-a-product\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf sembilan puluh dua: product mindset status quo.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: product thinking is static.\u003c/li\u003e\n\u003cli\u003eTakeaway: product mindset can miss experience.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh tiga: product-focused on fitur.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: feature gap closings.\u003c/li\u003e\n\u003cli\u003eTakeaway: feature list alone is insufficient.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh empat: shift to service.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “with SaaS, we shift from creating a product to creating a service.”\u003c/li\u003e\n\u003cli\u003eTakeaway: this is a real mindset shift.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh lima: service also needs functionality, but experience is broader.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: service = fitur + experience.\u003c/li\u003e\n\u003cli\u003eTakeaway: experience is part of the deliverable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh enam: restoran analogy.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: good output doesn't guarantee good service.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh tujuh: tenant expectations.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Having a great product won’t matter if the overall experience for customers does not meet their expectations.”\u003c/li\u003e\n\u003cli\u003eTakeaway: experience can swamp product quality.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh delapan: tenants see surface only.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: internal complexity is invisible.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh sembilan: rapid innovation advantage.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: agility compounds.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus: incumbents kalah karena lambat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: speed beats depth sometimes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus satu: service mindset must be measured.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: if you don't measure it, it stays slogan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"j-the-b2b-and-b2c-saas-story\"\u003eJ. The B2B and B2C SaaS Story\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#j-the-b2b-and-b2c-saas-story\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus dua: B2B vs B2C differences.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: scope matters.\u003c/li\u003e\n\u003cli\u003eTakeaway: don't overgeneralize.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus tiga: principle overlap, divergence in implementation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: principle can cross segments.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus empat: this book leans B2B.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: center of gravity is enterprise SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"k-defining-saas\"\u003eK. Defining SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#k-defining-saas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus lima: definisi eksplisit.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “SaaS is a business and software delivery model that enables organizations to offer their solutions in a low-friction, service-centric model that maximizes value for customers and providers. It relies on agility and operational efficiency as pillars of a business strategy that promotes growth, reach, and innovation.”\u003c/li\u003e\n\u003cli\u003eTakeaway: definition is goal-rich and tool-light.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus enam: architect choice is pattern choice.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: architecture is consequence, not definition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"l-conclusion\"\u003eL. Conclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#l-conclusion\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus tujuh: recap foundational mindset.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS answers model-lama pain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus delapan: a good app alone isn't enough.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: operation and experience are just as important.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sembilan: tenant, shared infra, unified experience.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: unified experience is the red thread.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sepuluh: vocabulary matters.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: terms are design tools.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sebelas: service vs product, MSP vs SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: focus is on organizational thinking.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus dua belas: this chapter cleans the reader's lens.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: later chapters will land better.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"quotes-yang-paling-load-bearing\"\u003eQuotes yang paling load-bearing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#quotes-yang-paling-load-bearing\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e“It’s essential for SaaS architects to understand that SaaS is not a technology-first mindset.”\u003c/li\u003e\n\u003cli\u003e“The scope of SaaS goes well beyond the technical. It is, in many respects, a mindset…”\u003c/li\u003e\n\u003cli\u003e“This notion of having all tenants running the same version of your offering represents a common litmus test for SaaS environments.”\u003c/li\u003e\n\u003cli\u003e“multi-tenant will refer to any environment that onboards, deploys, manages, and operates tenants through a single, unified experience.”\u003c/li\u003e\n\u003cli\u003e“The sharedness of any infrastructure will have no correlation to the term ‘multi-tenancy.’”\u003c/li\u003e\n\u003cli\u003e“the needs of the many should always outweigh the needs of the few.”\u003c/li\u003e\n\u003cli\u003e“you should really be viewing SaaS more as a business model.”\u003c/li\u003e\n\u003cli\u003e“with SaaS, we shift from creating a product to creating a service.”\u003c/li\u003e\n\u003cli\u003e“Having a great product won’t matter if the overall experience for customers does not meet their expectations.”\u003c/li\u003e\n\u003cli\u003e“SaaS is a business and software delivery model…”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway-desain-saas-nyata\"\u003eTakeaway desain SaaS nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway-desain-saas-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eSaaS harus dimulai dengan business goals, bukan infra first.\u003c/li\u003e\n\u003cli\u003eMulti-tenancy bukan lagi hanya soal shared infra; ia adalah soal unified operational experience.\u003c/li\u003e\n\u003cli\u003eSurrounding service capabilities adalah tulang punggung, bukan pernak-pernik.\u003c/li\u003e\n\u003cli\u003eAkurasi terminology penting untuk diskusi arsitektur hybrid dan dedicated.\u003c/li\u003e\n\u003cli\u003eSame-version discipline itu penting.\u003c/li\u003e\n\u003cli\u003eService mindset memindahkan fokus dari “fitur” ke “experience.”\u003c/li\u003e\n\u003cli\u003eB2B/B2C beda implementasi; prinsip bisa overlap.\u003c/li\u003e\n\u003cli\u003eSaaS adalah business model; leadership alignment penting.\u003c/li\u003e\n\u003cli\u003eOne-off variation harus diwaspadai.\u003c/li\u003e\n\u003cli\u003eHidden complexity boleh ada; exposed complexity harus dikurangi.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"insight-terbesar\"\u003eInsight terbesar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-terbesar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 1 menurut gue bukan hanya bab definisi. Dia bekerja seperti pembersih lensa:\u003c/p\u003e\n\u003cp\u003edi awal, dia membersihkan kabut istilah; di tengah, dia mendefinisikan ulang multi-tenancy; di akhir, dia menempatkan SaaS sebagai business/service model.\u003c/p\u003e\n\u003cp\u003eKalau gue bisa baca chapter ini sebagai rangkaian argumen, bukan sekadar kumpulan poin, gue akan lebih siap mengelola trade-off arsitektur dan operasi di chapter-chapter berikutnya.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: sistem lama modelnya customer-installed.\u003c/li\u003e\n\u003cli\u003eQuote: “pre-SaaS systems were typically delivered in an ‘installed software’ model”\u003c/li\u003e\n\u003cli\u003eTakeaway: untuk memahami SaaS, kita harus paham apa yang dia lawan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh: pembagian tanggung jawab antara development dan operations.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: dev jauh dari run.\u003c/li\u003e\n\u003cli\u003eTakeaway: pemisahan build/run ketat adalah ciri model lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan: pengantar visual Figure 1-1.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: saatnya lihat gambarnya.\u003c/li\u003e\n\u003cli\u003eTakeaway: visual mengunci imej model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan: interpretasi customer environment terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: setiap customer punya versi/custom berbeda.\u003c/li\u003e\n\u003cli\u003eQuote: “Each of these customers is running specific versions… required one-off customizations…”\u003c/li\u003e\n\u003cli\u003eTakeaway: problem utama adalah variasi per customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sepuluh: scaling model ini berarti menambah support/ops.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: biaya growth naik terus.\u003c/li\u003e\n\u003cli\u003eTakeaway: growth bikin overhead linear atau lebih buruk.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sebelas: model ini sales-driven.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: deal dulu, teknologi ngikut.\u003c/li\u003e\n\u003cli\u003eQuote: “landing a deal can take precedence over the need for agility, scale, and operational efficiency.”\u003c/li\u003e\n\u003cli\u003eTakeaway: ini sumber technical debt SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua belas: release cadence lambat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: versi customer beda membuat update rumit.\u003c/li\u003e\n\u003cli\u003eTakeaway: variasi mengganggu kecepatan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga belas: model lama valid di domain tertentu.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: bukan dogma.\u003c/li\u003e\n\u003cli\u003eTakeaway: ada konteks di mana installed model lebih cocok.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat belas: buat bisnis skala besar, model lama problematik.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: one-off kills scale.\u003c/li\u003e\n\u003cli\u003eTakeaway: salah satu korbannya adalah growth.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima belas: validitas tergantung skala.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: model lama masih bisa jika customer sedikit.\u003c/li\u003e\n\u003cli\u003eTakeaway: pilihan model tergantung ambition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam belas: cost dan inefficiency.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInti: setiap customer baru bermakna overhead baru.\u003c/li\u003e\n\u003cli\u003eQuote: “Each new customer could require more support teams, more infrastructure…”\u003c/li\u003e\n\u003cli\u003eTakeaway: growth idealnya tidak menambah overhead proporsional.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh belas: operational burden bisa membuat perusahaan sengaja memperlambat growth.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: arsitektur delivery bisa menghambat strategi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan belas: masalah lebih besar dari cost, yakni agility.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “this model is anything but nimble.”\u003c/li\u003e\n\u003cli\u003eTakeaway: agility adalah pilar bisnis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan belas: time-to-feature jadi lambat.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: keterlambatan berarti kehilangan relevansi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh: customer prefer low-friction value, bukan kontrol environment.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: preferensi customer berubah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh satu: pricing shift ke subscription.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: model delivery dan pricing saling menguatkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh dua: cloud mempercepat pergeseran, tapi bukan definisi SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: cloud adalah aksen, bukan tujuan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"c-the-move-to-a-unified-model-1\"\u003eC. The Move to a Unified Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-the-move-to-a-unified-model-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf dua puluh tiga: unified/shared model sebagai jawaban ekonomi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: model terpisah tidak sustainable di skala.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh empat: shared infra sebagai alat efisiensi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: sharedness adalah opsi, bukan dogma.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh lima: pengantar Figure 1-2.\u003c/p\u003e\n\u003cp\u003eParagraf dua puluh enam: tenant = penghuni environment bersama.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “one set of resources that is shared and occupied by one or more consumers”\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi tenant meneguhkan pergeseran paradigm.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh tujuh: shared infra menghapus downside model terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Gone is the idea of separately deployed, versioned, managed, and operated customer environments.”\u003c/li\u003e\n\u003cli\u003eTakeaway: unified deployment adalah claim utama SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh delapan: manfaat shared infra meluas ke telemetry, DevOps, onboarding.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: shared infra merapikan operational machine.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf dua puluh sembilan: shared model memberikan agility + cost + growth.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS memadukan beberapa nilai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh: shared infra membawa tantangan baru.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: switching pain, bukan menghilangkan pain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh satu: same-version sebagai litmus test.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “This notion of having all tenants running the same version of your offering represents a common litmus test for SaaS environments.”\u003c/li\u003e\n\u003cli\u003eTakeaway: same-version adalah prinsip praktis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh dua: cross-cutting components tetap penting.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: app core plus control plane = SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh tiga: pengantar Figure 1-3.\u003c/p\u003e\n\u003cp\u003eParagraf tiga puluh empat: surround capabilities.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: core app bukan sendirian.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh lima: kapabilitas pendukung sering dianggap secondary.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: itu anti-pattern.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh enam: sukses SaaS bergantung pada surrounding capabilities.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “these components… must be put front and center”\u003c/li\u003e\n\u003cli\u003eTakeaway: mulai dari operational capabilities.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh tujuh: efisiensi SaaS datang dari shared services plus app architecture.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: efisiensi multi-dimensi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"d-redefining-multi-tenancy-1\"\u003eD. Redefining Multi-Tenancy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d-redefining-multi-tenancy-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf tiga puluh delapan: istilah multi-tenancy punya baggage.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: istilah perlu ditunda sampai konteks jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tiga puluh sembilan: definisi lama valid, tapi tidak cukup.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: tidak perlu membuang sejarah istilah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh: definisi lama wajar dibawa ke SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: problemnya bukan invalid, tapi sempit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh satu: pengantar Figure 1-4.\u003c/p\u003e\n\u003cp\u003eParagraf empat puluh dua: model shared everything.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: ini kasus paling mudah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh tiga: SaaS real bisa hybrid.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: definisi klasik tidak mewakili kompleksitas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh empat: pengantar Figure 1-5.\u003c/p\u003e\n\u003cp\u003eParagraf empat puluh lima: contoh hybrid shared/dedicated.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS hybrid itu nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh enam: definisi klasik jadi goyah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: perlu vocabulary baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh tujuh: architecture adalah kombinasi trade-off.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “you’re picking the combinations… that best align with the business and technical requirements”\u003c/li\u003e\n\u003cli\u003eTakeaway: multi-tenancy adalah permainan trade-off.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh delapan: benefit berasal dari unified service model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: infra shared bukan satu-satunya sumber nilai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf empat puluh sembilan: pengantar Figure 1-6.\u003c/p\u003e\n\u003cp\u003eParagraf lima puluh: semua dedicated tapi tetap SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: dedicated infra tidak otomatis keluar dari SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh satu: shared control plane tetap penting.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “they continue to be onboarded, managed, and operated through the same set of shared capabilities”\u003c/li\u003e\n\u003cli\u003eTakeaway: operation unified adalah definisi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh dua: skenario dedicated bisa valid karena compliance/migration.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: reality sering mengharuskan dedicated resources.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh tiga: definisi harus dievolusi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: definisi praktis lebih berguna.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh empat: definisi baru multi-tenant.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “multi-tenant will refer to any environment that onboards, deploys, manages, and operates tenants through a single, unified experience.”\u003c/li\u003e\n\u003cli\u003eQuote: “The sharedness of any infrastructure will have no correlation to the term ‘multi-tenancy.’”\u003c/li\u003e\n\u003cli\u003eTakeaway: shift dari infra ke service/operating-model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh lima: terminology tambahan akan membantu.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: perlu bahasa presisi untuk hybrid models.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"e-avoiding-the-single-tenant-term-1\"\u003eE. Avoiding the “Single-Tenant” Term\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#e-avoiding-the-single-tenant-term-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf lima puluh enam: lawan multi-tenant yaitu single-tenant.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: jebakan kata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh tujuh: istilah single-tenant tidak cocok untuk model SaaS ini.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Labeling this a single-tenant environment would undermine…”\u003c/li\u003e\n\u003cli\u003eTakeaway: istilah itu mengembalikan diskusi ke definisi lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh delapan: istilah single-tenant dihentikan.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: diskusi sekarang fokus pada mode sharing, bukan label lawan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf lima puluh sembilan: ini soal vocabulary alignment.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: istilah dipilih karena berguna buat diskusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"f-where-are-the-boundaries-of-saas-1\"\u003eF. Where Are the Boundaries of SaaS?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#f-where-are-the-boundaries-of-saas-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf enam puluh: nuance dependency eksternal.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: jangan membuat definisi SaaS terlalu sempit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh satu: pertanyaan tentang distributed footprint.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: boundary bukan soal lokasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh dua: jika dependency tersembunyi, itu tetap SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “If their presence is entirely hidden from your tenants… this is still SaaS to me.”\u003c/li\u003e\n\u003cli\u003eTakeaway: hidden complexity is acceptable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh tiga: exposed external dependency memecah SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: exposed complexity ruins the service boundary.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh empat: rule of thumb.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “our tenants’ view is limited to the surface of our service.”\u003c/li\u003e\n\u003cli\u003eTakeaway: tenant should see the surface, not the kitchen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"g-the-managed-service-provider-model-1\"\u003eG. The Managed Service Provider Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#g-the-managed-service-provider-model-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf enam puluh lima: MSP bisa dilihat sebagai wrinkle.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS vs MSP perlu dibedakan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh enam: pengantar Figure 1-7.\u003c/p\u003e\n\u003cp\u003eParagraf enam puluh tujuh: MSP masih punya environment terpisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: MSP bukan unified application model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh delapan: operasi terpusat, tapi versi masih berbeda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: MSP belum menghapus one-off variation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf enam puluh sembilan: vendor bisa bermitra dengan MSP.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: MSP adalah lapisan operasional, bukan software creation model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh: gap SaaS vs MSP besar meski permukaan mirip.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: similar surface does not mean same structure.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh satu: same-version property penting sebagai pembeda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “customers are being allowed to run separate versions.”\u003c/li\u003e\n\u003cli\u003eTakeaway: same-version adalah pembeda inti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh dua: MSP memberi efisiensi tapi tetap warisi variation pain.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: MSP valid, tetapi bukan SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh tiga: budaya tim berbeda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: team topology matters.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh empat: tim SaaS harus punya pulse runtime.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: observability dan operational awareness adalah business concerns.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh lima: MSP bisa stepping stone.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: bedakan, tapi jangan remehkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"h-at-its-core-saas-is-a-business-model-1\"\u003eH. At Its Core, SaaS Is a Business Model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#h-at-its-core-saas-is-a-business-model-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf tujuh puluh enam: SaaS adalah business model.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “you should really be viewing SaaS more as a business model.”\u003c/li\u003e\n\u003cli\u003eTakeaway: SaaS bukan sekadar deployment. Ini model bisnis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh tujuh: semua fungsi organisasi berubah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: transformasi SaaS lebih dari engineering.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh delapan: SaaS harus fokus pada responsiveness ke pasar.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: model harus mendukung adaptasi cepat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf tujuh puluh sembilan: the needs of the many.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “the needs of the many should always outweigh the needs of the few.”\u003c/li\u003e\n\u003cli\u003eTakeaway: trade-offs harus dibuat untuk kolektif tenant.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh: backlog SaaS butuh operational attributes.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: product backlog bukan cukup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh satu: engineer/QA juga harus memikirkan experience.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: tanggung jawab experience tersebar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh dua: marketing/pricing/support ikut berubah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS mengaburkan batas fungsi organisasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh tiga: ia mulai ajukan business principles.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: sekarang masuk ke nilai inti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh empat: agility.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “A multi-tenant offering that reduced costs without realizing agility would certainly miss the broader value proposition of SaaS.”\u003c/li\u003e\n\u003cli\u003eTakeaway: cost reduction tanpa agility bukan win.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh lima: operational efficiency.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: ask yourself what happens if 1,000 customers show up.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh enam: innovation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: operational model yang baik memicu eksperimen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh tujuh: frictionless onboarding.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: onboarding bukan admin task. Ini growth engine.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh delapan: growth as design assumption.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS membangun footprint yang life-ready.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf delapan puluh sembilan: leadership alignment.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS is top-down too.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh: architecture is business-shaped.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Almost every dimension of your SaaS architecture and strategy is going to be derived from your business vision.”\u003c/li\u003e\n\u003cli\u003eTakeaway: desain teknis harus muncul dari visi bisnis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh satu: tanpa bisnis jelas, desain SaaS goyah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: misalignment business-architecture is root cause.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"i-building-a-servicenot-a-product-1\"\u003eI. Building a Service—Not a Product\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#i-building-a-servicenot-a-product-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf sembilan puluh dua: product mindset sebagai status quo.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: product mindset lebih statis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh tiga: product-thinking berfokus pada fitur.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: feature-oriented thinking tidak cukup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh empat: shift to service.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “with SaaS, we shift from creating a product to creating a service.”\u003c/li\u003e\n\u003cli\u003eTakeaway: ini jauh lebih dari istilah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh lima: service tetap perlu fungsionalitas, tapi experience lebih luas.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: service = fitur + end-to-end experience.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh enam: restoran analogy.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: output bagus tidak menjamin service bagus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh tujuh: tenant expectations for service.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “Having a great product won’t matter if the overall experience for customers does not meet their expectations.”\u003c/li\u003e\n\u003cli\u003eTakeaway: service expectations can swamp product quality.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh delapan: tenant melihat surface service.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: internal complexity doesn’t matter to customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf sembilan puluh sembilan: rapid innovation as service advantage.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: agility = competitive edge.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus: incumbents kalah karena lambat, bukan karena fitur kurang.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: speed can beat depth.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus satu: service mindset harus diukur.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: jika tidak diukur, ini gampang jadi jargon.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"j-the-b2b-and-b2c-saas-story-1\"\u003eJ. The B2B and B2C SaaS Story\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#j-the-b2b-and-b2c-saas-story-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus dua: B2B vs B2C differences.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: jangan generalisasi tanpa konteks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus tiga: overlap principles, divergen implementation.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: prinsip bisa lintas segmen, implementasi tergantung market.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus empat: scope buku lebih dekat B2B.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: ini buku bergravitasi ke enterprise SaaS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"k-defining-saas-1\"\u003eK. Defining SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#k-defining-saas-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus lima: definisi eksplisit.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuote: “SaaS is a business and software delivery model that enables organizations to offer their solutions in a low-friction, service-centric model that maximizes value for customers and providers. It relies on agility and operational efficiency as pillars of a business strategy that promotes growth, reach, and innovation.”\u003c/li\u003e\n\u003cli\u003eTakeaway: definisi ini miskin tool, kaya tujuannya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus enam: responsibility arsitek memilih pattern yang mendukung tujuan.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: tool/architecture adalah konsekuensi, bukan definisi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"l-conclusion-1\"\u003eL. Conclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#l-conclusion-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParagraf seratus tujuh: rekap fundamental mindset.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: SaaS menjawab problem model lama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus delapan: aplikasi bagus saja belum cukup.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: operation/experience sama pentingnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sembilan: tenant, shared infra, unified experience.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: unified experience adalah benang merah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sepuluh: pentingnya vocabulary.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: istilah adalah alat desain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus sebelas: service vs product, MSP vs SaaS.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: fokus adalah bagaimana organisasi berpikir.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParagraf seratus dua belas: chapter ini membersihkan kacamatanya pembaca.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTakeaway: bab lanjut bisa dibaca dengan frame yang lebih tajam.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"quotes-yang-paling-load-bearing-1\"\u003eQuotes yang paling load-bearing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#quotes-yang-paling-load-bearing-1\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e“It’s essential for SaaS architects to understand that SaaS is not a technology-first mindset.”\u003c/li\u003e\n\u003cli\u003e“The scope of SaaS goes well beyond the technical. It is, in many respects, a mindset…”\u003c/li\u003e\n\u003cli\u003e“This notion of having all tenants running the same version of your offering represents a common litmus test for SaaS environments.”\u003c/li\u003e\n\u003cli\u003e“multi-tenant will refer to any environment that onboards, deploys, manages, and operates tenants through a single, unified experience.”\u003c/li\u003e\n\u003cli\u003e“The sharedness of any infrastructure will have no correlation to the term ‘multi-tenancy.’”\u003c/li\u003e\n\u003cli\u003e“the needs of the many should always outweigh the needs of the few.”\u003c/li\u003e\n\u003cli\u003e“you should really be viewing SaaS more as a business model.”\u003c/li\u003e\n\u003cli\u003e“with SaaS, we shift from creating a product to creating a service.”\u003c/li\u003e\n\u003cli\u003e“Having a great product won’t matter if the overall experience for customers does not meet their expectations.”\u003c/li\u003e\n\u003cli\u003e“SaaS is a business and software delivery model…”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway-desain-saas-nyata-1\"\u003eTakeaway desain SaaS nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway-desain-saas-nyata-1\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eSaaS harus dimulai dengan business goals, bukan infra first.\u003c/li\u003e\n\u003cli\u003eMulti-tenancy bukan lagi hanya soal shared infra; ia adalah soal unified operational experience.\u003c/li\u003e\n\u003cli\u003eSurrounding service capabilities adalah tulang punggung, bukan pernak-pernik.\u003c/li\u003e\n\u003cli\u003eAkurasi terminology penting untuk diskusi arsitektur hybrid dan dedicated.\u003c/li\u003e\n\u003cli\u003eSaaS mengandalkan same-version discipline untuk menjaga agility dan simplicity.\u003c/li\u003e\n\u003cli\u003eService mindset memindahkan fokus dari \"fitur\" ke \"experience.\" \u003c/li\u003e\n\u003cli\u003eB2B/B2C beda implementasi; prinsip bisa overlap.\u003c/li\u003e\n\u003cli\u003eSaaS adalah business model; leadership alignment penting.\u003c/li\u003e\n\u003cli\u003eOne-off variation harus diwaspadai; kebutuhan kolektif tenant lebih penting.\u003c/li\u003e\n\u003cli\u003eHidden complexity boleh ada; exposed complexity harus dikurangi.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"insight-terbesar-1\"\u003eInsight terbesar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-terbesar-1\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 1 bukan hanya membahas definisi SaaS. Dia bekerja seperti pembersih lensa:\u003c/p\u003e\n\u003cp\u003edi awal, dia menghapus kabut istilah; di tengah, dia mengganti definisi multi-tenancy; di akhir, dia menempatkan SaaS sebagai business/service model.\u003c/p\u003e\n\u003cp\u003eDengan kata lain: chapter ini menggeser cara berpikir dari \"apa yang harus kita bangun\" menjadi \"bagaimana experience dan ekonomi model itu harus berfungsi.\" \u003c/p\u003e\n\u003cp\u003eKalau lo bisa membaca chapter ini sebagai rangkaian argumen, bukan sekadar kumpulan poin, lo akan lebih siap mengelola trade-off arsitektur dan operasi pada chapter berikutnya.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esaas (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eclose-reading (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003earchitecture (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eservice (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures\"\u003eBuilding Multi-Tenant SaaS Architectures\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124501\"\u003eSaaS bukan technology-first mindset\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124502\"\u003eSaaS adalah business and delivery model\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124503\"\u003eInstalled software pain adalah customer variation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124504\"\u003ePain terbesar model lama adalah hilangnya agility\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124505\"\u003eUnified model adalah jawaban terhadap fragmentasi\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124506\"\u003eSame-version sebagai litmus test SaaS\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124507\"\u003eCross-cuttin
