agentic-coding-permission-boundary"},{"from":{"fname":"notes.security.overtrust.workflow-detail","id":"notes.security.overtrust.workflow-detail","vaultName":"vault"},"type":"backlink","position":{"start":{"line":196,"column":3,"offset":7848},"end":{"line":196,"column":56,"offset":7901},"indent":[]},"value":"notes.security.agentic-coding-permission-boundary"}],"anchors":{"overview":{"type":"header","text":"Overview","value":"overview","line":15,"column":0,"depth":2},"1-risiko-utama-dari-agentic-coding-tools":{"type":"header","text":"1. Risiko utama dari agentic coding tools","value":"1-risiko-utama-dari-agentic-coding-tools","line":18,"column":0,"depth":2},"2-kenapa-filesystem-access-sensitif":{"type":"header","text":"2. Kenapa filesystem access sensitif","value":"2-kenapa-filesystem-access-sensitif","line":24,"column":0,"depth":2},"3-data-apa-saja-yang-bisa-kebaca-atau-ikut-terkirim":{"type":"header","text":"3. Data apa saja yang bisa kebaca atau ikut terkirim?","value":"3-data-apa-saja-yang-bisa-kebaca-atau-ikut-terkirim","line":37,"column":0,"depth":2},"4-korelasi-dengan-deepsec":{"type":"header","text":"4. Korelasi dengan Deepsec","value":"4-korelasi-dengan-deepsec","line":43,"column":0,"depth":2},"5-mitigasi-realistis":{"type":"header","text":"5. Mitigasi realistis","value":"5-mitigasi-realistis","line":49,"column":0,"depth":2},"practical-takeaway":{"type":"header","text":"Practical takeaway","value":"practical-takeaway","line":59,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":65,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"agentic-coding-permission-boundary-dan-risiko-filesystem-lokal\"\u003eAgentic coding permission boundary dan risiko filesystem lokal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agentic-coding-permission-boundary-dan-risiko-filesystem-lokal\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread \u003ccode\u003echeese_cakee_9/status/2050938657545310628\u003c/code\u003e dan yang keliatan jelas adalah kalau agentic coding sekarang bukan cuma soal prompt. Ini soal izin lokal: file yang bisa dibaca, command yang bisa dijalanin, dan data apa yang bisa keluar.\u003c/p\u003e\n\u003ch2 id=\"1-risiko-utama-dari-agentic-coding-tools\"\u003e1. Risiko utama dari agentic coding tools\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-risiko-utama-dari-agentic-coding-tools\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eagentic coding bukan cuma \"AI yang nulis kode\".\u003c/li\u003e\n\u003cli\u003etool bisa baca file, cari file, jalankan command, dan akses environment.\u003c/li\u003e\n\u003cli\u003erisiko utamanya adalah transformasi dari autocomplete jadi process yang punya permission.\u003c/li\u003e\n\u003cli\u003epertanyaan penting: dia bisa baca apa? dia bisa jalanin apa? dia bisa kirim apa?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-kenapa-filesystem-access-sensitif\"\u003e2. Kenapa filesystem access sensitif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-filesystem-access-sensitif\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eworkstation dev menyimpan lebih dari source code.\u003c/li\u003e\n\u003cli\u003efile sensitif umum:\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e.env\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e~/.ssh\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e~/.aws/credentials\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e~/.kube/config\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003eshell history,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e~/.docker/config.json\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003enpm/pnpm/yarn credential,\u003c/li\u003e\n\u003cli\u003eVS Code extension/session state.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekalau agent punya akses folder, bahaya nyata kalau dia bisa naik ke parent atau home directory.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-data-apa-saja-yang-bisa-kebaca-atau-ikut-terkirim\"\u003e3. Data apa saja yang bisa kebaca atau ikut terkirim?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-data-apa-saja-yang-bisa-kebaca-atau-ikut-terkirim\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003elangsung: source code, config, secret file.\u003c/li\u003e\n\u003cli\u003etersembunyi: terminal output, git history, environment variables, prompt history, file README/jadi source injection.\u003c/li\u003e\n\u003cli\u003ekalau agent punya network egress, data ini gampang beroled keluar.\u003c/li\u003e\n\u003cli\u003epenting: data nggak harus dilatih oleh model. Cukup muncul di request, log, atau artifact.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-korelasi-dengan-deepsec\"\u003e4. Korelasi dengan Deepsec\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-korelasi-dengan-deepsec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec butuh akses kode buat nemuin vuln.\u003c/li\u003e\n\u003cli\u003ethread cheesecake nunjukin bahwa akses itu sendiri bisa jadi risk.\u003c/li\u003e\n\u003cli\u003emenurut gue, security harness yang bagus harus ngatur agent dan batas akses agent.\u003c/li\u003e\n\u003cli\u003etanpa boundary, agen pencari bug bisa jadi agen baca secret.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-mitigasi-realistis\"\u003e5. Mitigasi realistis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-mitigasi-realistis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003episahkan environment agent dari environment utama: sandbox, devcontainer, VM, atau folder bersih.\u003c/li\u003e\n\u003cli\u003ejangan jalankan agent dari \u003ccode\u003e$HOME\u003c/code\u003e yang penuh credential.\u003c/li\u003e\n\u003cli\u003ehindari secret production di laptop.\u003c/li\u003e\n\u003cli\u003eaudit file sensitif: \u003ccode\u003e.env\u003c/code\u003e, \u003ccode\u003e.npmrc\u003c/code\u003e, \u003ccode\u003e.pypirc\u003c/code\u003e, \u003ccode\u003e.docker/config.json\u003c/code\u003e, \u003ccode\u003e~/.aws/credentials\u003c/code\u003e, \u003ccode\u003e~/.kube/config\u003c/code\u003e, \u003ccode\u003e~/.ssh\u003c/code\u003e, shell history.\u003c/li\u003e\n\u003cli\u003ebatasi network egress untuk agent kalau bisa.\u003c/li\u003e\n\u003cli\u003ejangan biarkan agent langsung jalanin perintah dari repo asing.\u003c/li\u003e\n\u003cli\u003etreat repo eksternal sebagai data, bukan instruksi otomatis.\u003c/li\u003e\n\u003cli\u003epakai allowlist/denylist jika tool mendukung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"practical-takeaway\"\u003ePractical takeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread cheesecake jadi counterpoint yang sehat buat hype agentic coding.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau developer nganggep tool ini cuma autocomplete, itu berbahaya.\u003c/li\u003e\n\u003cli\u003eagentic coding nggak aman secara default.\u003c/li\u003e\n\u003cli\u003eini harus diperlakukan seperti process lokal dengan potensi exfiltration.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179967\"\u003eAgentic coding tools adalah process dengan permission, bukan autocomplete\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179968\"\u003eWorkstation trust boundary adalah attack surface utama di era AI-native engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179972\"\u003eSecret exposure bisa terjadi tanpa commit Git\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179979\"\u003eBiaya, sandbox, dan egress adalah concern arsitektur keamanan first-class\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epermission-boundary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777995556481\"\u003eAudit trust b
