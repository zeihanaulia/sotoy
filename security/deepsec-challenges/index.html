"1. Orchestration bukan hanya \"spawn banyak agent\"","value":"1-orchestration-bukan-hanya-spawn-banyak-agent","line":18,"column":0,"depth":2},"2-prompt-loop-vs-actual-orchestration":{"type":"header","text":"2. Prompt loop vs actual orchestration","value":"2-prompt-loop-vs-actual-orchestration","line":24,"column":0,"depth":2},"3-false-positive-dan-alert-fatigue":{"type":"header","text":"3. False positive dan alert fatigue","value":"3-false-positive-dan-alert-fatigue","line":29,"column":0,"depth":2},"4-batas-scope-bukan-pentest-penuh":{"type":"header","text":"4. Batas scope: bukan pentest penuh","value":"4-batas-scope-bukan-pentest-penuh","line":35,"column":0,"depth":2},"5-cost-untuk-solo-dev-dan-tim-kecil":{"type":"header","text":"5. Cost untuk solo dev dan tim kecil","value":"5-cost-untuk-solo-dev-dan-tim-kecil","line":41,"column":0,"depth":2},"6-model-choice-dan-backend-replaceable":{"type":"header","text":"6. Model choice dan backend replaceable","value":"6-model-choice-dan-backend-replaceable","line":46,"column":0,"depth":2},"7-apakah-ini-cuma-sast-lagi":{"type":"header","text":"7. Apakah ini cuma SAST lagi?","value":"7-apakah-ini-cuma-sast-lagi","line":51,"column":0,"depth":2},"8-handoff-dan-dashboard-fatigue":{"type":"header","text":"8. Handoff dan dashboard fatigue","value":"8-handoff-dan-dashboard-fatigue","line":56,"column":0,"depth":2},"9-strategi-default-security-layer":{"type":"header","text":"9. Strategi default security layer","value":"9-strategi-default-security-layer","line":61,"column":0,"depth":2},"core-pattern-dari-counter-argument":{"type":"header","text":"Core pattern dari counter-argument","value":"core-pattern-dari-counter-argument","line":66,"column":0,"depth":2},"practical-takeaway":{"type":"header","text":"Practical takeaway","value":"practical-takeaway","line":76,"column":0,"depth":2},"referensi-internal":{"type":"header","text":"Referensi internal","value":"referensi-internal","line":82,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":87,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"deepsec-challenge-orchestration-false-positives-cost-dan-workflow\"\u003eDeepsec challenge: orchestration, false positives, cost, dan workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#deepsec-challenge-orchestration-false-positives-cost-dan-workflow\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread \u003ccode\u003erauchg/status/2051386798899888539\u003c/code\u003e dan yang paling menarik buat gue bukan sekadar \"AI bisa nemu bug\". Yang paling penting adalah apakah hasilnya bisa dipercaya dan masuk ke workflow tanpa nambah chaos.\u003c/p\u003e\n\u003ch2 id=\"1-orchestration-bukan-hanya-spawn-banyak-agent\"\u003e1. Orchestration bukan hanya \"spawn banyak agent\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-orchestration-bukan-hanya-spawn-banyak-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eribuan agent paralel keren di teori; sulitnya adalah bikin outputnya konsisten.\u003c/li\u003e\n\u003cli\u003epertanyaan yang gue lihat penting: siapa yang ngatur, bagaimana state-nya konsisten, dan gimana hasil satu agent dipakai sama agent lain?\u003c/li\u003e\n\u003cli\u003eDeepsec punya \u003ccode\u003edata/\u003c/code\u003e, \u003ccode\u003eFileRecord\u003c/code\u003e, \u003ccode\u003eruns/\u003c/code\u003e, \u003ccode\u003eanalysisHistory\u003c/code\u003e, dan \u003ccode\u003erevalidate\u003c/code\u003e. Ini jawaban awal yang cukup bagus.\u003c/li\u003e\n\u003cli\u003etapi kritiknya valid: kalau cuma banyak prompt loop, itu belum orchestration nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-prompt-loop-vs-actual-orchestration\"\u003e2. Prompt loop vs actual orchestration\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-prompt-loop-vs-actual-orchestration\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eLeo Tavares menekankan bahwa banyak demo agent cuma stateless loop.\u003c/li\u003e\n\u003cli\u003ereal orchestration butuh state yang persisted, recoverable, dan auditable.\u003c/li\u003e\n\u003cli\u003ekalau Deepsec mau disebut orchestrator, dia harus buktikan run bisa diulang tanpa hilang konteks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-false-positive-dan-alert-fatigue\"\u003e3. False positive dan alert fatigue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-false-positive-dan-alert-fatigue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ediskusi buat gue jelas: lebih banyak finding belum tentu membantu.\u003c/li\u003e\n\u003cli\u003esecurity team nggak butuh alarm lagi; mereka butuh signal yang valid.\u003c/li\u003e\n\u003cli\u003eGlitch Truth minta benchmark nyata, bukan klaim internal.\u003c/li\u003e\n\u003cli\u003epertanyaan penting: deepsec nemuin apa yang scanner lain nggak? berapa false positive setelah revalidate? apakah hasilnya actionable?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-batas-scope-bukan-pentest-penuh\"\u003e4. Batas scope: bukan pentest penuh\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-batas-scope-bukan-pentest-penuh\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eJono mengingatkan: \"lebih murah dari pentest\" nggak sama dengan pengganti pentest.\u003c/li\u003e\n\u003cli\u003eDeepsec fokus ke codebase review, bukan runtime cloud atau bisnis logic full.\u003c/li\u003e\n\u003cli\u003epentest manusia masih lebih kuat di: runtime behavior, prod misconfig, chain attack, browser/auth flow, rate limit, IAM.\u003c/li\u003e\n\u003cli\u003emenurut gue, ini perlu dinyatakan jelas supaya ekspektasi nggak meleset.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-cost-untuk-solo-dev-dan-tim-kecil\"\u003e5. Cost untuk solo dev dan tim kecil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-cost-untuk-solo-dev-dan-tim-kecil\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebeberapa reply nanya apakah this cocok buat solo dev.\u003c/li\u003e\n\u003cli\u003ejawabannya: bisa, tapi harus pakai lokal, \u003ccode\u003e--limit 50\u003c/code\u003e, dan target area yang jelas.\u003c/li\u003e\n\u003cli\u003ekalau dipakai full monorepo tanpa kalibrasi, bisa jadi mahal dan noisy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-model-choice-dan-backend-replaceable\"\u003e6. Model choice dan backend replaceable\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-model-choice-dan-backend-replaceable\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ereply lain fokus ke model: apakah bisa ganti backend, apakah Codex/GPT-5.5 atau Opus lebih baik.\u003c/li\u003e\n\u003cli\u003eini bukan cuma konfigurasi. ini tantangan buat klaim kualitas.\u003c/li\u003e\n\u003cli\u003emenurut gue, value Deepsec harus ada di harness dan workflow, bukan di model X hari ini.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"7-apakah-ini-cuma-sast-lagi\"\u003e7. Apakah ini cuma SAST lagi?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-apakah-ini-cuma-sast-lagi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ekritik Snyk/Semgrep menunjukkan bahwa Deepsec harus beda secara nyata.\u003c/li\u003e\n\u003cli\u003ekalau hanya nemu injection dan pattern obvious, nilai tambahnya nggak besar.\u003c/li\u003e\n\u003cli\u003eDeepsec harus bisa nunjukin kelebihan di auth edge case, tenant isolation, multi-file flow, dan business logic misuse.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"8-handoff-dan-dashboard-fatigue\"\u003e8. Handoff dan dashboard fatigue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-handoff-dan-dashboard-fatigue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBob Corbin bilang: tool cuma berguna kalau ngurangin handoff.\u003c/li\u003e\n\u003cli\u003efinding harus punya owner, evidence, dan status yang jelas.\u003c/li\u003e\n\u003cli\u003etanpa itu, Deepsec cuma jadi satu tempat lagi yang mesti dicek.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"9-strategi-default-security-layer\"\u003e9. Strategi default security layer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-strategi-default-security-layer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ekalau Deepsec benar bisa nemu bug cepat, kapan ini jadi layer default?\u003c/li\u003e\n\u003cli\u003emenurut gue, butuh governance: incremental PR scan, cron full audit, revalidate HIGH+, ticket export, metrics, budget, policy.\u003c/li\u003e\n\u003cli\u003esekarang Deepsec lebih cocok jadi audit tool, bukan security default layer langsung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"core-pattern-dari-counter-argument\"\u003eCore pattern dari counter-argument\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-pattern-dari-counter-argument\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat semuanya nyambung ke pola ini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003evolume naik karena parallel agents,\u003c/li\u003e\n\u003cli\u003evolume butuh state dan deduplikasi,\u003c/li\u003e\n\u003cli\u003eagent findings butuh false positive control,\u003c/li\u003e\n\u003cli\u003efalse positive butuh triage,\u003c/li\u003e\n\u003cli\u003etriage butuh workflow dan ownership,\u003c/li\u003e\n\u003cli\u003eworkflow butuh integrasi dan evidence,\u003c/li\u003e\n\u003cli\u003esemua ini dibatasi biaya dan quality model.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"practical-takeaway\"\u003ePractical takeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003echallenge terbesar bukan \"AI bisa nemu bug\".\u003c/li\u003e\n\u003cli\u003echallenge terbesar adalah bikin outputnya masuk proses engineering tanpa nambah kekacauan.\u003c/li\u003e\n\u003cli\u003eDeepsec baru berguna kalau orchestration nyata: state, revalidation, ownership, export, dan plugin workflow.\u003c/li\u003e\n\u003cli\u003ekalau tooling cuma ngasih 1.000 opini tanpa coherence, itu bukan security benefit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi-internal\"\u003eReferensi internal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-internal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-harness\"\u003eDeepsec: security harness untuk codebase besar\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-docs\"\u003eDeepsec docs: workflow harness, bukan scanner sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179918\"\u003eDeepsec docs menegaskan AI security review sebagai workspace orchestrator\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179970\"\u003eRevalidation dan ownership adalah kunci agar output agent tidak menjadi noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179973\"\u003eParallel agents hanya berguna jika hasilnya didedup dan dikonsolidasikan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179974\"\u003eTooling keamanan gagal jika hanya menambah dashboard dan handoff\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179976\"\u003eContext AI harus ringkas dan spesifik untuk menjaga signal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179978\"\u003eCI security gate butuh threshold dan baseline, bukan fail-on-any-finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179982\"\u003eOwnership adalah bagian dari penyelesaian security finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179981\"\u003eFinding keamanan butuh bukti yang actionable kapan pun bisa\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edeepsec (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-security (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179967\"\u003eAgentic coding tools adalah process dengan permission, bukan autocomplete\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179970\"\u003eRevalidation dan ownership adalah kunci agar output agent tidak menjadi noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179973\"\u003eParallel agents hanya berguna jika hasilnya didedup dan dikonsolidasikan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179974\"\u003eTooling keamanan gagal jika hanya menambah dashboard dan handoff\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179981\"\u003eFinding keamanan butuh bukti yang actionable kapan pun bisa\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179982\"\u003eOwnership adalah bagian dari penyelesaian security finding\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}
