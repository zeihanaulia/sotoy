er","text":"Sumber","value":"sumber","line":45,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat juga","value":"lihat-juga","line":49,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"bmad-preventing-agent-conflicts-sebagai-literature-note\"\u003eBMAD Preventing Agent Conflicts sebagai literature note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bmad-preventing-agent-conflicts-sebagai-literature-note\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"pertanyaan-yang-dibuka\"\u003ePertanyaan yang dibuka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-yang-dibuka\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eMengapa BMAD menempatkan shared standards di pusat pencegahan konflik agent?\u003c/li\u003e\n\u003cli\u003eApa contoh konflik praktis yang sering muncul di environment multi-agent?\u003c/li\u003e\n\u003cli\u003eBagaimana architecture documentation berfungsi sebagai shared context dalam BMAD?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"ringkasan-literatur\"\u003eRingkasan literatur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-literatur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHalaman BMAD Preventing Agent Conflicts menyoroti bahwa konflik agent bukan karena agent bodoh, tetapi karena kurangnya shared context teknis.\u003c/p\u003e\n\u003cp\u003eAgent bisa membuat keputusan lokal yang logis, tetapi saat mereka bekerja pada bagian berbeda dari sistem tanpa standar bersama, hasilnya bisa terfragmentasi.\u003c/p\u003e\n\u003cp\u003eContoh konflik yang diangkat mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAPI Style: REST vs GraphQL\u003c/li\u003e\n\u003cli\u003eNaming: snake_case vs camelCase\u003c/li\u003e\n\u003cli\u003eState management: Redux vs React Context\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBMAD menyarankan solusi praktis melalui explicit ADRs, FR/NFR-specific guidance, dan conventions yang dapat dibaca semua agent.\u003c/p\u003e\n\u003ch2 id=\"ide-penting\"\u003eIde penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ide-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eShared standards, bukan sosok architect, adalah kunci konsistensi agent.\u003c/li\u003e\n\u003cli\u003eDecision teknis yang eksplisit harus diwariskan ke banyak executor.\u003c/li\u003e\n\u003cli\u003eKonvensi sehari-hari sama pentingnya dengan keputusan besar.\u003c/li\u003e\n\u003cli\u003eArchitecture documentation adalah medium koordinasi, bukan hanya catatan pasif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"interpretasi\"\u003eInterpretasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#interpretasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCatatan ini menegaskan bahwa dalam AI-native engineering, context engineering harus mencakup berbagai conflict-prone choices. Tanpa itu, banyak agent dapat menghasilkan sistem yang secara lokal masuk akal tapi secara global tidak koheren.\u003c/p\u003e\n\u003ch2 id=\"sumber\"\u003eSumber\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sumber\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://docs.bmad-method.org/explanation/preventing-agent-conflicts/\"\u003ehttps://docs.bmad-method.org/explanation/preventing-agent-conflicts/\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260421183954\"\u003ePreventing Agent Conflicts membangun shared context, bukan mengandalkan agent tunggal\u003c/a\u003e — Preventing Agent Conflicts membangun shared context, bukan mengandalkan agent tunggal\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Pri
