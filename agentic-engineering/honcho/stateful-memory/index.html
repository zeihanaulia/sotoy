55,"offset":3032},"indent":[]},"value":"notes.agentic-engineering.honcho.stateful-memory"}],"anchors":{"masalah-yang-honcho-pecahkan":{"type":"header","text":"Masalah yang Honcho pecahkan","value":"masalah-yang-honcho-pecahkan","line":15,"column":0,"depth":2},"kenapa-rag-biasa-dianggap-kurang-cukup":{"type":"header","text":"Kenapa RAG biasa dianggap kurang cukup?","value":"kenapa-rag-biasa-dianggap-kurang-cukup","line":40,"column":0,"depth":2},"model-data-honcho":{"type":"header","text":"Model data Honcho","value":"model-data-honcho","line":78,"column":0,"depth":2},"workspace":{"type":"header","text":"Workspace","value":"workspace","line":82,"column":0,"depth":3},"peer":{"type":"header","text":"Peer","value":"peer","line":101,"column":0,"depth":3},"kenapa-konsep-peer-kuat":{"type":"header","text":"Kenapa konsep peer kuat?","value":"kenapa-konsep-peer-kuat","line":140,"column":0,"depth":2},"session":{"type":"header","text":"Session","value":"session","line":172,"column":0,"depth":3},"message":{"type":"header","text":"Message","value":"message","line":197,"column":0,"depth":3},"peer-sebagai-kunci":{"type":"header","text":"Peer sebagai kunci","value":"peer-sebagai-kunci","line":231,"column":0,"depth":2},"dari-messages-ke-representations":{"type":"header","text":"Dari messages ke representations","value":"dari-messages-ke-representations","line":239,"column":0,"depth":2},"memory-system-that-reasons":{"type":"header","text":"Memory system that reasons","value":"memory-system-that-reasons","line":278,"column":0,"depth":2},"apa-bedanya-honcho-dengan-memory-biasa":{"type":"header","text":"Apa bedanya Honcho dengan memory biasa?","value":"apa-bedanya-honcho-dengan-memory-biasa","line":310,"column":0,"depth":2},"apa-kelebihan-honcho-dibanding-provider-lain":{"type":"header","text":"Apa kelebihan Honcho dibanding provider lain?","value":"apa-kelebihan-honcho-dibanding-provider-lain","line":340,"column":0,"depth":2},"trade-off-dan-risiko-honcho":{"type":"header","text":"Trade-off dan risiko Honcho","value":"trade-off-dan-risiko-honcho","line":363,"column":0,"depth":2},"risiko-1-salah-menyimpulkan":{"type":"header","text":"Risiko 1: Salah menyimpulkan","value":"risiko-1-salah-menyimpulkan","line":367,"column":0,"depth":3},"risiko-2-memory-jadi-terlalu-otoritatif":{"type":"header","text":"Risiko 2: Memory jadi terlalu otoritatif","value":"risiko-2-memory-jadi-terlalu-otoritatif","line":381,"column":0,"depth":3},"risiko-3-privacy-dan-data-moat":{"type":"header","text":"Risiko 3: Privacy dan data moat","value":"risiko-3-privacy-dan-data-moat","line":393,"column":0,"depth":3},"risiko-4-latency-dan-cost":{"type":"header","text":"Risiko 4: Latency dan cost","value":"risiko-4-latency-dan-cost","line":409,"column":0,"depth":3},"kapan-honcho-cocok":{"type":"header","text":"Kapan Honcho cocok","value":"kapan-honcho-cocok","line":427,"column":0,"depth":2},"kapan-honcho-mungkin-overkill":{"type":"header","text":"Kapan Honcho mungkin overkill?","value":"kapan-honcho-mungkin-overkill","line":461,"column":0,"depth":2},"linking-hubungan-antar-ide":{"type":"header","text":"Linking: hubungan antar ide","value":"linking-hubungan-antar-ide","line":481,"column":0,"depth":2},"insight-yang-penting-buat-gue":{"type":"header","text":"Insight yang penting buat gue","value":"insight-yang-penting-buat-gue","line":509,"column":0,"depth":2},"korelasi-dengan-konsep-lain":{"type":"header","text":"Korelasi dengan konsep lain","value":"korelasi-dengan-konsep-lain","line":535,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":557,"column":0,"depth":2}},"children":[],"parent":"r970j7o3cwojzrfs80avkt5","data":{}},"body":"\u003ch1 id=\"stateful-memory\"\u003eStateful Memory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#stateful-memory\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eYang gue pegang dari dokumentasi Honcho adalah satu hal sederhana: ini bukan cuma \"database chat\". Honcho adalah usaha membuat agent bisa punya state panjang dengan model yang mengerti entitas berubah dari waktu ke waktu.\u003c/p\u003e\n\u003ch2 id=\"masalah-yang-honcho-pecahkan\"\u003eMasalah yang Honcho pecahkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#masalah-yang-honcho-pecahkan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalah dasarnya: AI agent sering tidak punya kontinuitas. Agent bisa pintar dalam satu sesi, tapi begitu sesi berubah, dia sering kehilangan konteks. User harus mengulang preferensi, histori keputusan, gaya kerja, batasan, relasi project, dan perubahan dari waktu ke waktu.\u003c/p\u003e\n\u003cp\u003ePage-nya bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Honcho is an open source memory library with a managed service for building stateful agents.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKata pentingnya adalah stateful agents. Agent stateless itu seperti kasir yang tiap hari lupa elo siapa. Agent stateful itu seperti partner kerja yang ingat konteks, tapi juga tahu bahwa konteks bisa berubah.\u003c/p\u003e\n\u003cp\u003eHoncho ingin agent bisa mempertahankan state tentang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003euser\u003c/li\u003e\n\u003cli\u003eagent lain\u003c/li\u003e\n\u003cli\u003egrup\u003c/li\u003e\n\u003cli\u003eide\u003c/li\u003e\n\u003cli\u003eobjek\u003c/li\u003e\n\u003cli\u003eentitas apa pun yang berubah dari waktu ke waktu\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePage-nya eksplisit:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It enables agents to build and maintain state about any entity—users, agents, groups, ideas, and more.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi unit utamanya bukan “dokumen”, tapi entitas.\u003c/p\u003e\n\u003ch2 id=\"kenapa-rag-biasa-dianggap-kurang-cukup\"\u003eKenapa RAG biasa dianggap kurang cukup?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-rag-biasa-dianggap-kurang-cukup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho mengkritik siklus umum ketika orang membangun agent. Awalnya agent oke. Lalu user mulai komplain: agent lupa, kontradiktif, kehilangan konteks. Developer lalu bikin RAG. Masalah membaik sedikit, tapi muncul masalah baru: chunking, embedding, retrieval strategy, eval, rerank, dan seterusnya.\u003c/p\u003e\n\u003cp\u003ePage-nya menyimpulkan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Eventually you realize the issue isn’t engineering—it’s that you’re not extracting all the latent information from your data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu inti argumen Honcho.\u003c/p\u003e\n\u003cp\u003eMereka bilang problemnya bukan cuma retrieval pipeline kurang rapi. Problemnya adalah data mengandung latent information: informasi tersembunyi yang tidak tertulis eksplisit, tapi bisa disimpulkan.\u003c/p\u003e\n\u003cp\u003eContoh sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“Gue lebih suka solusi yang langsung bisa dicoba.”\u003c/li\u003e\n\u003cli\u003e“Jangan terlalu banyak teori dulu.”\u003c/li\u003e\n\u003cli\u003e“Bikin step-by-step aja.”\u003c/li\u003e\n\u003cli\u003e“Kalau bisa pakai contoh real.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRAG biasa mungkin mengambil kalimat-kalimat itu kalau query-nya cocok. Tapi Honcho ingin menyimpulkan:\u003c/p\u003e\n\u003cp\u003e“User prefers practical, stepwise explanations with concrete examples over abstract theory.”\u003c/p\u003e\n\u003cp\u003eItu bukan kutipan langsung. Itu representasi hasil reasoning.\u003c/p\u003e\n\u003cp\u003eAtomic idea-nya:\u003c/p\u003e\n\u003cp\u003eRAG mencari yang pernah dikatakan.\u003c/p\u003e\n\u003cp\u003eHoncho mencoba membangun apa artinya dari waktu ke waktu.\u003c/p\u003e\n\u003cp\u003eKalau ada dua cara melihatnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRAG tradisional fokus ke dokumen dan retrieval.\u003c/li\u003e\n\u003cli\u003eHoncho fokus ke entitas dan reasoning.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu perbedaan yang bikin gue sadar Honcho bukan alternatif RAG biasa. Honcho mau jadi mesin model sosial/historis, bukan sekadar lemari arsip.\u003c/p\u003e\n\u003ch2 id=\"model-data-honcho\"\u003eModel data Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#model-data-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menjelaskan empat storage primitives: \u003ccode\u003eworkspace\u003c/code\u003e, \u003ccode\u003epeer\u003c/code\u003e, \u003ccode\u003esession\u003c/code\u003e, dan \u003ccode\u003emessage\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"workspace\"\u003eWorkspace\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workspace\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eWorkspace adalah container paling atas.\u003c/p\u003e\n\u003cp\u003ePage menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Workspaces - Top-level containers that isolate different applications or environments”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya workspace memisahkan environment. Misalnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eworkspace untuk app customer support\u003c/li\u003e\n\u003cli\u003eworkspace untuk personal assistant\u003c/li\u003e\n\u003cli\u003eworkspace untuk coding agent\u003c/li\u003e\n\u003cli\u003eworkspace untuk organisasi tertentu\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAnalogi: workspace itu gedung. Di dalamnya ada orang, ruangan, percakapan, dan arsip.\u003c/p\u003e\n\u003cp\u003eKenapa penting? Karena memory harus punya boundary. Tanpa boundary, konteks bisa bocor. Agent untuk project A bisa mengambil memory project B. Workspace mencegah campur-aduk level tertinggi.\u003c/p\u003e\n\u003ch3 id=\"peer\"\u003ePeer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peer\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePeer adalah entitas yang punya kontinuitas tapi bisa berubah.\u003c/p\u003e\n\u003cp\u003ePage menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Peers - Any entity that persists but changes over time (users, agents, objects, and more)”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni konsep paling penting di Honcho.\u003c/p\u003e\n\u003cp\u003ePeer bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003euser\u003c/li\u003e\n\u003cli\u003eAI agent\u003c/li\u003e\n\u003cli\u003etim\u003c/li\u003e\n\u003cli\u003eorganisasi\u003c/li\u003e\n\u003cli\u003ekonsep\u003c/li\u003e\n\u003cli\u003eproduk\u003c/li\u003e\n\u003cli\u003eproject\u003c/li\u003e\n\u003cli\u003ebahkan ide\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKenapa namanya peer, bukan user? Karena Honcho tidak menganggap hanya manusia yang perlu dimodelkan. Agent juga bisa punya identitas. Grup juga bisa punya state. Ide juga bisa berubah.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUser peer: “Raka”\u003c/li\u003e\n\u003cli\u003eAgent peer: “Hermes coder”\u003c/li\u003e\n\u003cli\u003eProject peer: “payment migration”\u003c/li\u003e\n\u003cli\u003eTeam peer: “backend team”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMasing-masing bisa punya representation sendiri.\u003c/p\u003e\n\u003cp\u003eIni desain yang kuat untuk multi-agent system. Karena dalam multi-agent, memory bukan cuma “apa yang user suka”, tapi juga:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent A tahu apa tentang user\u003c/li\u003e\n\u003cli\u003eagent B punya konteks berbeda\u003c/li\u003e\n\u003cli\u003eproject X punya histori keputusan sendiri\u003c/li\u003e\n\u003cli\u003egrup Y punya pola kerja sendiri\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-konsep-peer-kuat\"\u003eKenapa konsep peer kuat?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-konsep-peer-kuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonsep peer membuat memory lebih simetris.\u003c/p\u003e\n\u003cp\u003eBanyak sistem memory memperlakukan user sebagai satu-satunya objek yang dimodelkan. Honcho lebih luas: semua entitas bisa dimodelkan sebagai peer.\u003c/p\u003e\n\u003cp\u003eIni penting untuk multi-agent.\u003c/p\u003e\n\u003cp\u003eMisalnya elo punya tiga agent:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecoder agent\u003c/li\u003e\n\u003cli\u003ewriter agent\u003c/li\u003e\n\u003cli\u003eresearch agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUser-nya sama, tapi tiap agent punya hubungan berbeda dengan user.\u003c/p\u003e\n\u003cp\u003eCoder agent mungkin tahu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“User sering minta security boundary dan sandboxing.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWriter agent mungkin tahu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“User suka gaya gue-elo, tajam, dan Zettelkasten.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eResearch agent mungkin tahu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“User suka verifikasi sumber dan curiga terhadap klaim tanpa sitasi.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau semua agent memakai satu memory datar, konteks bisa tercampur. Dengan peer, masing-masing agent bisa punya representation sendiri terhadap user, sambil tetap berbagi workspace.\u003c/p\u003e\n\u003cp\u003eIni yang di page Hermes disebut sebagai multi-peer setup: satu user peer, satu AI peer per profile, semua dalam workspace yang sama.\u003c/p\u003e\n\u003ch3 id=\"session\"\u003eSession\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#session\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession adalah thread interaksi dengan batas temporal.\u003c/p\u003e\n\u003cp\u003ePage menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Sessions - Interaction threads between peers with temporal boundaries”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSession itu percakapan atau episode.\u003c/p\u003e\n\u003cp\u003eMisalnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esesi diskusi bug hari Senin\u003c/li\u003e\n\u003cli\u003esesi planning sprint\u003c/li\u003e\n\u003cli\u003esesi debugging production incident\u003c/li\u003e\n\u003cli\u003esesi review dokumen\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSession penting karena memory butuh waktu dan konteks. Kalimat yang sama bisa punya arti berbeda tergantung sesi.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003e“Ini jangan dipakai dulu.”\u003c/p\u003e\n\u003cp\u003eKalau di sesi debugging, artinya fitur tertentu berisiko. Kalau di sesi design, artinya ide belum matang. Session membantu Honcho menempatkan pesan ke konteks waktunya.\u003c/p\u003e\n\u003ch3 id=\"message\"\u003eMessage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#message\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMessage adalah unit data yang memicu reasoning.\u003c/p\u003e\n\u003cp\u003ePage menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Messages - Units of data that trigger reasoning (conversations, events, activity, documents, and more)”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni juga penting: message tidak harus chat.\u003c/p\u003e\n\u003cp\u003eMessage bisa berupa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epercakapan\u003c/li\u003e\n\u003cli\u003eevent\u003c/li\u003e\n\u003cli\u003eactivity log\u003c/li\u003e\n\u003cli\u003edokumen\u003c/li\u003e\n\u003cli\u003eupdate project\u003c/li\u003e\n\u003cli\u003ecatatan meeting\u003c/li\u003e\n\u003cli\u003eperubahan status\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi Honcho bisa menerima data lebih luas dari chat log.\u003c/p\u003e\n\u003cp\u003eAtomic idea-nya:\u003c/p\u003e\n\u003cp\u003eWorkspace memberi batas.\u003c/p\u003e\n\u003cp\u003ePeer memberi identitas.\u003c/p\u003e\n\u003cp\u003eSession memberi konteks waktu.\u003c/p\u003e\n\u003cp\u003eMessage memberi bahan mentah.\u003c/p\u003e\n\u003cp\u003eRepresentation adalah hasil olahannya.\u003c/p\u003e\n\u003ch2 id=\"peer-sebagai-kunci\"\u003ePeer sebagai kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peer-sebagai-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho menyebut semua entitas itu \"peer\" karena mereka diperlakukan setara: semua bisa dimodelkan, semua bisa berubah, semua bisa punya representation sendiri.\u003c/p\u003e\n\u003cp\u003eGue suka konsep ini karena dia pas untuk multi-agent. Dalam sistem dengan banyak agent, user bukan satu-satunya pihak yang butuh state. Agent juga perlu model terhadap user, terhadap agent lain, terhadap project, bahkan terhadap ide.\u003c/p\u003e\n\u003cp\u003eJadi memory-nya jadi lebih simetris dan bukan cuma \"user-centric\".\u003c/p\u003e\n\u003ch2 id=\"dari-messages-ke-representations\"\u003eDari messages ke representations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dari-messages-ke-representations\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow dasarnya begini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAgent menulis messages ke Honcho.\u003c/li\u003e\n\u003cli\u003eHoncho menyimpan messages.\u003c/li\u003e\n\u003cli\u003eBackground process memproses messages itu.\u003c/li\u003e\n\u003cli\u003eReasoning model menghasilkan conclusions tentang peer.\u003c/li\u003e\n\u003cli\u003eConclusions disimpan sebagai representations.\u003c/li\u003e\n\u003cli\u003eDeveloper atau agent bisa query representation itu untuk memberi konteks ke respons berikutnya.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003ePage-nya bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“When you write messages to Honcho, they’re stored and processed in the background.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eLalu:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Custom reasoning models perform formal logical reasoning to generate conclusions about each peer.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eDan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“These conclusions are stored as representations that you can query to provide rich context for your agents.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni berarti Honcho memisahkan data mentah dan hasil interpretasi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMessage = bukti mentah.\u003c/li\u003e\n\u003cli\u003eConclusion = hasil penalaran.\u003c/li\u003e\n\u003cli\u003eRepresentation = model yang bisa dipakai ulang.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAnalogi:\u003c/p\u003e\n\u003cp\u003eKalau elo punya transcript meeting, itu message.\u003c/p\u003e\n\u003cp\u003eKalau dari transcript itu disimpulkan “client tidak nyaman dengan deadline Q2”, itu conclusion.\u003c/p\u003e\n\u003cp\u003eKalau semua conclusion tentang client digabung jadi profil “client ini sensitif terhadap risiko deadline dan butuh komunikasi proaktif”, itu representation.\u003c/p\u003e\n\u003cp\u003eIni lebih maju daripada cuma menyimpan transcript dan melakukan semantic search.\u003c/p\u003e\n\u003ch2 id=\"memory-system-that-reasons\"\u003eMemory system that reasons\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#memory-system-that-reasons\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKlaim Honcho adalah: \"Honcho is a memory system that reasons.\"\u003c/p\u003e\n\u003cp\u003eMaksudnya: Honcho tidak hanya menyimpan dan mengambil. Ia juga memproses data untuk menemukan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epola\u003c/li\u003e\n\u003cli\u003ekontradiksi\u003c/li\u003e\n\u003cli\u003eperubahan preferensi\u003c/li\u003e\n\u003cli\u003erelasi antar entitas\u003c/li\u003e\n\u003cli\u003ekesimpulan implisit\u003c/li\u003e\n\u003cli\u003eprediksi di bawah ketidakpastian\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi bagian \"Why Reasoning?\", page bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"Traditional RAG systems retrieve what was explicitly said, but they miss what matters most—the insights only accessible by rigorously thinking about your data.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting. Honcho mengasumsikan bahwa banyak memory penting tidak pernah muncul sebagai satu kalimat eksplisit. Ia tersebar di banyak interaksi.\u003c/p\u003e\n\u003cp\u003eContoh yang bikin gue klik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSesi 1: user minta jawaban ringkas.\u003c/li\u003e\n\u003cli\u003eSesi 2: user mengeluh \"ini terlalu textbook.\"\u003c/li\u003e\n\u003cli\u003eSesi 3: user menyukai analogi konkret.\u003c/li\u003e\n\u003cli\u003eSesi 4: user meminta struktur step-by-step.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDari situ, sistem bisa menyimpulkan gaya komunikasi user.\u003c/p\u003e\n\u003cp\u003eRAG bisa retrieve potongan-potongan itu. Tapi reasoning mencoba membuat satu model preferensi yang ringkas.\u003c/p\u003e\n\u003cp\u003eJadi \"reasoning\" di sini adalah upaya mengubah banyak event kecil menjadi state yang lebih bermakna.\u003c/p\u003e\n\u003ch2 id=\"apa-bedanya-honcho-dengan-memory-biasa\"\u003eApa bedanya Honcho dengan memory biasa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-bedanya-honcho-dengan-memory-biasa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMemory biasa sering berbentuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“User likes dark mode.”\u003c/li\u003e\n\u003cli\u003e“User uses Python.”\u003c/li\u003e\n\u003cli\u003e“User works on project X.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu fact memory.\u003c/p\u003e\n\u003cp\u003eHoncho tampaknya ingin naik satu level:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“User tends to prefer practical explanations, tolerates technical depth, but rejects vague middle-ground answers.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bukan satu fakta. Ini pola.\u003c/p\u003e\n\u003cp\u003eMemory biasa menjawab: “Apa yang pernah disimpan?”\u003c/p\u003e\n\u003cp\u003eHoncho menjawab: “Apa model terbaik tentang entitas ini berdasarkan semua bukti?”\u003c/p\u003e\n\u003cp\u003eItulah kenapa di Hermes page sebelumnya Honcho disebut punya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003euser representation\u003c/li\u003e\n\u003cli\u003epeer cards\u003c/li\u003e\n\u003cli\u003esession-scoped context\u003c/li\u003e\n\u003cli\u003edialectic reasoning\u003c/li\u003e\n\u003cli\u003econclusions\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDalam integrasi Hermes, Honcho bukan cuma provider pencarian memory. Ia menjadi sistem modelling user-agent.\u003c/p\u003e\n\u003ch2 id=\"apa-kelebihan-honcho-dibanding-provider-lain\"\u003eApa kelebihan Honcho dibanding provider lain?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-kelebihan-honcho-dibanding-provider-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari page Hermes dan page Honcho, Honcho paling kuat di tiga hal:\u003c/p\u003e\n\u003cp\u003ePertama, entity-centric memory.\u003c/p\u003e\n\u003cp\u003eFokusnya bukan dokumen, tapi entitas yang berubah.\u003c/p\u003e\n\u003cp\u003eKedua, reasoned representation.\u003c/p\u003e\n\u003cp\u003eBukan cuma retrieve memory, tapi membangun kesimpulan.\u003c/p\u003e\n\u003cp\u003eKetiga, cross-session continuity.\u003c/p\u003e\n\u003cp\u003eIa memang didesain untuk agent yang perlu ingat lintas sesi dan tetap coherent.\u003c/p\u003e\n\u003cp\u003eJadi Honcho cocok kalau masalah elo adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“Agent gue sering lupa gue siapa.”\u003c/li\u003e\n\u003cli\u003e“Agent gue tidak paham perubahan konteks dari waktu ke waktu.”\u003c/li\u003e\n\u003cli\u003e“Agent gue punya banyak sesi dan banyak profile.”\u003c/li\u003e\n\u003cli\u003e“Gue butuh agent yang bukan cuma cari fakta, tapi membangun pemahaman tentang user/project.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"trade-off-dan-risiko-honcho\"\u003eTrade-off dan risiko Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trade-off-dan-risiko-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bagian penting. Sistem seperti Honcho powerful, tapi tidak gratis secara desain.\u003c/p\u003e\n\u003ch3 id=\"risiko-1-salah-menyimpulkan\"\u003eRisiko 1: Salah menyimpulkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-1-salah-menyimpulkan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau reasoning model menyimpulkan hal yang keliru, agent bisa membawa asumsi salah ke banyak sesi berikutnya.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eUser sekali bilang “gue males teori panjang.”\u003c/p\u003e\n\u003cp\u003eHoncho bisa salah menyimpulkan “user tidak suka teori.”\u003c/p\u003e\n\u003cp\u003ePadahal konteksnya mungkin cuma saat itu user sedang buru-buru.\u003c/p\u003e\n\u003cp\u003eIni masalah utama memory berbasis reasoning: ia bisa membuat generalisasi terlalu cepat.\u003c/p\u003e\n\u003ch3 id=\"risiko-2-memory-jadi-terlalu-otoritatif\"\u003eRisiko 2: Memory jadi terlalu otoritatif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-2-memory-jadi-terlalu-otoritatif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau representation disuntikkan ke context, model bisa terlalu percaya pada memory.\u003c/p\u003e\n\u003cp\u003eMisalnya representation bilang:\u003c/p\u003e\n\u003cp\u003e“User prefers concise answers.”\u003c/p\u003e\n\u003cp\u003eLalu saat user minta dive deep, agent tetap menjawab pendek karena memory lama terlalu dominan.\u003c/p\u003e\n\u003cp\u003eMemory harus membantu, bukan mengunci user dalam profil lama.\u003c/p\u003e\n\u003ch3 id=\"risiko-3-privacy-dan-data-moat\"\u003eRisiko 3: Privacy dan data moat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-3-privacy-dan-data-moat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePage Honcho menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“help you build data moats”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSecara bisnis ini menarik. Tapi dari sisi user, ini berarti memory menjadi aset data yang sangat berharga dan sensitif.\u003c/p\u003e\n\u003cp\u003eKalau Honcho dipakai cloud, data user dan interaction history bisa menjadi bagian dari infrastruktur eksternal. Jadi perlu jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edata apa yang dikirim\u003c/li\u003e\n\u003cli\u003ebagaimana disimpan\u003c/li\u003e\n\u003cli\u003ebisa dihapus atau tidak\u003c/li\u003e\n\u003cli\u003ebagaimana isolasi workspace\u003c/li\u003e\n\u003cli\u003esiapa yang punya akses\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"risiko-4-latency-dan-cost\"\u003eRisiko 4: Latency dan cost\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-4-latency-dan-cost\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eReasoning lebih mahal daripada retrieval biasa. Honcho page memang menyebut developer diberi kontrol atas:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“token usage, latency, and reasoning depth.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya sistem ini sadar bahwa reasoning punya biaya.\u003c/p\u003e\n\u003cp\u003eDi Hermes, ini muncul sebagai knob seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003econtextCadence\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edialecticCadence\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edialecticDepth\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSemakin sering dan dalam reasoning, semakin kaya konteksnya, tapi semakin mahal/lambat.\u003c/p\u003e\n\u003cp\u003eIni juga alasan kenapa Honcho terasa lebih mahal dan lebih berisiko daripada sekadar pipeline retrieval. Jika model reasoning salah, kesimpulan yang disimpan bisa jadi bias dan ditarik ulang ke banyak sesi berikutnya.\u003c/p\u003e\n\u003ch2 id=\"kapan-honcho-cocok\"\u003eKapan Honcho cocok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-honcho-cocok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho cocok kalau elo membangun:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePersonal assistant jangka panjang.\u003c/li\u003e\n\u003cli\u003eMulti-agent system.\u003c/li\u003e\n\u003cli\u003eAgent dengan banyak profile.\u003c/li\u003e\n\u003cli\u003eCustomer support agent yang perlu memahami user history.\u003c/li\u003e\n\u003cli\u003eCoaching/tutoring agent yang perlu melacak perkembangan learner.\u003c/li\u003e\n\u003cli\u003eCoding agent yang perlu ingat keputusan project lintas sesi.\u003c/li\u003e\n\u003cli\u003eResearch assistant yang perlu membangun model tentang ide, bukan cuma dokumen.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eContoh konkret:\u003c/p\u003e\n\u003cp\u003eElo punya Hermes profile:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehermes.coder\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehermes.writer\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehermes.researcher\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan Honcho, tiap profile bisa punya AI peer berbeda. Mereka melihat user yang sama, tapi membangun representation berbeda.\u003c/p\u003e\n\u003cp\u003eIni masuk akal karena konteks “gue sebagai programmer” beda dari “gue sebagai penulis” atau “gue sebagai researcher.”\u003c/p\u003e\n\u003cp\u003eMenurut gue, Honcho paling pas kalau masalahnya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent yang harus mengingat lintas sesi,\u003c/li\u003e\n\u003cli\u003euser atau entitas yang berubah seiring waktu,\u003c/li\u003e\n\u003cli\u003emulti-agent dengan berbagai profile,\u003c/li\u003e\n\u003cli\u003ekebutuhan untuk membangun model preferensi, nilai, atau relasi,\u003c/li\u003e\n\u003cli\u003ekonteks yang tidak bisa diselesaikan hanya dengan dokumen dan search.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo cuma perlu satu fakta sederhana, atau hanya ingin search dokumen, Honcho terasa terlalu besar.\u003c/p\u003e\n\u003ch2 id=\"kapan-honcho-mungkin-overkill\"\u003eKapan Honcho mungkin overkill?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-honcho-mungkin-overkill\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho bisa terlalu berat kalau kebutuhan elo cuma:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emenyimpan beberapa fakta sederhana\u003c/li\u003e\n\u003cli\u003emencari dokumen\u003c/li\u003e\n\u003cli\u003elocal-only memory sederhana\u003c/li\u003e\n\u003cli\u003etidak butuh user modeling\u003c/li\u003e\n\u003cli\u003etidak butuh multi-agent\u003c/li\u003e\n\u003cli\u003etidak mau data ke cloud\u003c/li\u003e\n\u003cli\u003etidak mau konfigurasi reasoning/cadence/depth\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau cuma mau memory lokal sederhana, Holographic atau ByteRover bisa lebih masuk.\u003c/p\u003e\n\u003cp\u003eKalau cuma mau semantic recall cloud yang otomatis, Mem0 atau Supermemory bisa lebih simpel.\u003c/p\u003e\n\u003cp\u003eKalau mau knowledge base structured, OpenViking atau Hindsight mungkin lebih natural.\u003c/p\u003e\n\u003cp\u003eHoncho paling masuk kalau masalah elo adalah statefulness + evolving entities + reasoning over time.\u003c/p\u003e\n\u003ch2 id=\"linking-hubungan-antar-ide\"\u003eLinking: hubungan antar ide\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#linking-hubungan-antar-ide\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang kita sambungkan.\u003c/p\u003e\n\u003cp\u003eHoncho mulai dari masalah agent stateless.\u003c/p\u003e\n\u003cp\u003eUntuk membuat agent stateful, ia butuh model data. Model data itu adalah Workspace → Peer → Session → Message.\u003c/p\u003e\n\u003cp\u003eMessage adalah input. Tapi Honcho tidak berhenti di penyimpanan message. Ia melakukan reasoning untuk menghasilkan conclusions. Conclusions itu menjadi representations. Representations lalu dipakai untuk memberi konteks ke agent.\u003c/p\u003e\n\u003cp\u003eJadi chain-nya:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003einteraksi → message → reasoning → conclusion → representation → context injection → respons agent lebih stateful\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDi sinilah Honcho berbeda dari RAG.\u003c/p\u003e\n\u003cp\u003eRAG chain-nya biasanya:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003edokumen → chunk → embedding → retrieve → context injection\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eRAG kuat untuk menemukan teks relevan. Honcho mencoba membangun state yang lebih abstrak.\u003c/p\u003e\n\u003cp\u003eMaka pola besarnya:\u003c/p\u003e\n\u003cp\u003eRAG = memory sebagai pencarian.\u003c/p\u003e\n\u003cp\u003eHoncho = memory sebagai penalaran berkelanjutan.\u003c/p\u003e\n\u003ch2 id=\"insight-yang-penting-buat-gue\"\u003eInsight yang penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-yang-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nKesalahan umum memahami Honcho adalah mengira ia “RAG yang lebih bagus”.\u003c/p\u003e\n\u003cp\u003eLebih tepat: Honcho adalah usaha mengubah memory dari \u003cstrong\u003earsip pasif\u003c/strong\u003e menjadi \u003cstrong\u003emodel aktif tentang entitas\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eOrang sudah mulai paham Honcho kalau ia bisa membedakan tiga lapis ini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eMessage: apa yang terjadi.\u003c/li\u003e\n\u003cli\u003eConclusion: apa yang bisa disimpulkan.\u003c/li\u003e\n\u003cli\u003eRepresentation: model stabil yang dipakai agent ke depan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau tiga lapis ini belum kebedakan, Honcho akan terlihat seperti database memory biasa.\n───────────────────────────────────\u003c/p\u003e\n\u003cp\u003eHoncho bukan \"RAG yang lebih canggih.\" Honcho adalah sistem yang mencoba mengubah memory dari arsip pasif menjadi model aktif tentang entitas.\u003c/p\u003e\n\u003cp\u003eKalau gue belum bisa membedakan tiga lapis ini, maka Honcho akan terasa sama seperti memory biasa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emessage = apa yang terjadi,\u003c/li\u003e\n\u003cli\u003econclusion = apa yang bisa disimpulkan,\u003c/li\u003e\n\u003cli\u003erepresentation = apa yang agent ingat dan pakai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu yang bikin Honcho relevan untuk agent yang harus hidup lebih dari satu sesi.\u003c/p\u003e\n\u003ch2 id=\"korelasi-dengan-konsep-lain\"\u003eKorelasi dengan konsep lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#korelasi-dengan-konsep-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonsep paling dekat pertama: CRM.\u003c/p\u003e\n\u003cp\u003eKenapa? CRM menyimpan interaksi customer, history, preferensi, status, dan peluang. Honcho mirip CRM untuk agent, tapi lebih fleksibel karena entitasnya bukan cuma customer. Bisa user, agent, ide, project, grup.\u003c/p\u003e\n\u003cp\u003eBedanya: CRM biasanya manusia yang membaca dan menyimpulkan. Honcho mencoba membuat reasoning backend menyimpulkan otomatis.\u003c/p\u003e\n\u003cp\u003eKonsep kedua: Zettelkasten.\u003c/p\u003e\n\u003cp\u003eZettelkasten bukan cuma catatan, tapi jaringan ide. Honcho mirip dalam hal ia tidak puas dengan raw note. Ia ingin hubungan, pola, dan representasi.\u003c/p\u003e\n\u003cp\u003eBedanya: Zettelkasten biasanya ide-centric. Honcho entity-centric. Pusatnya bukan cuma “ide apa terhubung ke ide apa”, tapi “entitas ini berkembang menjadi apa dari waktu ke waktu.”\u003c/p\u003e\n\u003cp\u003eKonsep ketiga: event sourcing.\u003c/p\u003e\n\u003cp\u003eDalam event sourcing, state aplikasi dibangun dari rangkaian event. Honcho juga mirip: representation adalah state yang dibangun dari messages/events.\u003c/p\u003e\n\u003cp\u003eBedanya: event sourcing deterministik. Kalau event-nya sama, state-nya sama. Honcho memakai reasoning model, jadi hasilnya probabilistik dan interpretatif.\u003c/p\u003e\n\u003cp\u003eKesimpulan pendeknya: Honcho adalah memory layer untuk agent yang ingin punya kontinuitas, bukan cuma retrieval. Ia cocok ketika “mengingat” berarti memahami perubahan entitas dari waktu ke waktu.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.hermes-agent.memory-providers\"\u003eMemory Providers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.reasoning\"\u003eReasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.peer-representations\"\u003ePeer Representations\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.hermes-agent.memory-providers\"\u003eMemory Providers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u
