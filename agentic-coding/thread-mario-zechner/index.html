":67,"column":0,"depth":2},"tema-ketiga-organisasi-tetap-pilih-kecepatan":{"type":"header","text":"Tema ketiga: organisasi tetap pilih kecepatan","value":"tema-ketiga-organisasi-tetap-pilih-kecepatan","line":87,"column":0,"depth":2},"mario-membalas-dengan-operasional-reality":{"type":"header","text":"Mario membalas dengan operasional reality","value":"mario-membalas-dengan-operasional-reality","line":101,"column":0,"depth":2},"counter-yang-terlihat":{"type":"header","text":"Counter yang terlihat","value":"counter-yang-terlihat","line":119,"column":0,"depth":2},"sinyal-tambahan-slowing-down-as-discipline":{"type":"header","text":"Sinyal tambahan: slowing down as discipline","value":"sinyal-tambahan-slowing-down-as-discipline","line":127,"column":0,"depth":2},"relasi-ide-dalam-thread":{"type":"header","text":"Relasi ide dalam thread","value":"relasi-ide-dalam-thread","line":138,"column":0,"depth":2},"insight-tambahan":{"type":"header","text":"Insight tambahan","value":"insight-tambahan","line":152,"column":0,"depth":2},"kesimpulan":{"type":"header","text":"Kesimpulan","value":"kesimpulan","line":160,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat juga","value":"lihat-juga","line":174,"column":0,"depth":2}},"children":["notes.agentic-coding.thread-mario-zechner.mapping"],"parent":"5oh5fgtw5iyb4mv5j72n02i","data":{}},"body":"\u003ch1 id=\"thread-mario-zechner-agentic-coding-sebagai-compression-test\"\u003eThread Mario Zechner: Agentic Coding sebagai Compression Test\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#thread-mario-zechner-agentic-coding-sebagai-compression-test\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"context\"\u003eContext\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#context\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread ini adalah reaction/reply di post Mario Zechner tentang artikel Lars Faye, bukan diskusi langsung artikel original. Kalau artikel Lars adalah tesis panjang, thread ini berfungsi sebagai \u003cstrong\u003ecompression test\u003c/strong\u003e: orang-orang menerjemahkan argumennya ke pengalaman nyata.\u003c/p\u003e\n\u003ch2 id=\"5-pertanyaan-kunci-dari-thread\"\u003e5 Pertanyaan Kunci dari Thread\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pertanyaan-kunci-dari-thread\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBagian mana dari artikel Lars yang paling kena ke orang-orang?\u003c/li\u003e\n\u003cli\u003eApakah reply-reply ini mostly setuju, atau ada counter?\u003c/li\u003e\n\u003cli\u003eApa tema baru yang muncul di thread dan tidak terlalu eksplisit di artikel?\u003c/li\u003e\n\u003cli\u003eApa tension utama antara “belajar dengan friction” vs “tekanan organisasi untuk cepat”?\u003c/li\u003e\n\u003cli\u003eDiskusi ini mengarah ke apa tentang agentic coding di praktik nyata?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"mario-zechner-pain-avoidance-sebagai-lensa\"\u003eMario Zechner: pain avoidance sebagai lensa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mario-zechner-pain-avoidance-sebagai-lensa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMario nulis:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"i really like the pain avoidance angle. slots into my ‘pain/friction is when you learn’ angle. when combined \u003e cognitive debt.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting karena dia menajamkan argumen dari Lars: bukan hanya soal skill atrophy pasif, tapi ada pola aktif yang membuat manusia menghindari discomfort yang sebenarnya sumber belajar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e:\u003c/p\u003e\n\u003cp\u003ePain bukan glorifikasi suffering. Pain adalah resistance yang memaksa otak membangun model tentang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emengapa bug muncul,\u003c/li\u003e\n\u003cli\u003emengapa boundary API bocor,\u003c/li\u003e\n\u003cli\u003emengapa abstraction gagal,\u003c/li\u003e\n\u003cli\u003emengapa refactor memicu regression.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau semua itu terlalu cepat dilewati lewat AI output, yang terkumpul bukan mastery — tapi cognitive debt.\u003c/p\u003e\n\u003ch2 id=\"tema-dominan-solusi-kelihatan-dapat-tapi-skill-tidak-ikut-terbentuk\"\u003eTema dominan: solusi kelihatan dapat, tapi skill tidak ikut terbentuk\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tema-dominan-solusi-kelihatan-dapat-tapi-skill-tidak-ikut-terbentuk\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eReply André Barbosa paling representatif di sini. Pesannya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003ekalau lo tidak benar-benar menyelesaikan problemnya sendiri, lo tidak memperoleh skill untuk menyelesaikan problem serupa.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni mudah dibumikan ke pengalaman umum:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoutput ada,\u003c/li\u003e\n\u003cli\u003ecode jalan,\u003c/li\u003e\n\u003cli\u003etetapi developer belum naik level.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e:\u003c/p\u003e\n\u003cp\u003eAI bisa memberi closure tanpa competence.\u003c/p\u003e\n\u003cp\u003eThread ini menguatkan bahwa bahaya agentic coding bukan hanya soal hasil jangka pendek, tapi gap antara output dan pemahaman yang dimiliki.\u003c/p\u003e\n\u003ch2 id=\"tema-kedua-comprehension-debt--mental-model-debt\"\u003eTema kedua: comprehension debt / mental model debt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tema-kedua-comprehension-debt--mental-model-debt\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBeberapa reply mulai memberi nama berbeda pada masalah yang sama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecognitive debt,\u003c/li\u003e\n\u003cli\u003ecomprehension debt,\u003c/li\u003e\n\u003cli\u003emental model corruption,\u003c/li\u003e\n\u003cli\u003earchitectural debt yang tak terlihat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya, thread ini mengkristal ke satu keluarga konsep: debt tidak hanya di codebase, tetapi juga di kepala.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e:\u003c/p\u003e\n\u003cp\u003eDebt ini lebih berbahaya karena invisible. Tidak seperti duplication atau bad abstraction yang bisa dilihat di kode, comprehension debt menumpuk di developer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emakin sulit reason tentang sistem,\u003c/li\u003e\n\u003cli\u003emakin susah tahu apa yang aman diubah,\u003c/li\u003e\n\u003cli\u003emakin lemah intuisi debugging,\u003c/li\u003e\n\u003cli\u003emakin tergantung ke loop \"tanya model lagi\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"tema-ketiga-organisasi-tetap-pilih-kecepatan\"\u003eTema ketiga: organisasi tetap pilih kecepatan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tema-ketiga-organisasi-tetap-pilih-kecepatan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eReply paling penting datang dari Mike Mehanig.\u003c/p\u003e\n\u003cp\u003eIntinya: argumen Lars resonate, tapi susah dijual di organisasi. Pertanyaan praktisnya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003ekenapa lo butuh 5 hari untuk deliver sesuatu yang orang lain bisa prompt dalam 1 hari?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni bukan counter teoretis. Ini menempatkan diskusi pada level governance dan insentif.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e:\u003c/p\u003e\n\u003cp\u003eBahkan jika argumen teknis benar, organisasi cenderung memilih speed jangka pendek. Itu membuat perdebatan ini bukan soal mindset individu saja, tetapi soal siapa yang mau bayar biaya jangka pendek untuk menjaga kemampuan jangka panjang.\u003c/p\u003e\n\u003ch2 id=\"mario-membalas-dengan-operasional-reality\"\u003eMario membalas dengan operasional reality\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mario-membalas-dengan-operasional-reality\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBalasan Mario yang penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"because we don't want to get alarmes at 2am ... and neither us nor the agents have any idea anymore how anything works nor how to fix it\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menggeser diskusi dari learning ke incident response.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e:\u003c/p\u003e\n\u003cp\u003eKecepatan hari ini bisa dibayar dengan ketidakmampuan saat sistem rusak nanti.\u003c/p\u003e\n\u003cp\u003eHubungan penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecognitive debt → 2am pager risk\u003c/li\u003e\n\u003cli\u003epain avoidance → operational fragility\u003c/li\u003e\n\u003cli\u003eagentic overuse → weaker incident readiness\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"counter-yang-terlihat\"\u003eCounter yang terlihat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#counter-yang-terlihat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda potongan dari David Petrou:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"well written, but i'm on the other side of a lot of it\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSayangnya konteks penuh tidak terlihat. Dari potongan yang ada, terlihat bahwa thread bukan echo chamber total: ada ruang kontra. Tapi dominasi narasi tetap afirmatif.\u003c/p\u003e\n\u003ch2 id=\"sinyal-tambahan-slowing-down-as-discipline\"\u003eSinyal tambahan: slowing down as discipline\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sinyal-tambahan-slowing-down-as-discipline\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBeberapa reply non-substantif juga penting secara konteks sosial:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"How do you have time to read so much?\"\u003c/li\u003e\n\u003cli\u003e\"I would spend all day only reading your recommendations if I had no life\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMario jawab dia pakai waktu sendiri untuk baca dan refleksi.\u003c/p\u003e\n\u003cp\u003eIni memberi sinyal halus bahwa endorsment-nya datang dari pola literasi dan perlambatan. Itu konsisten dengan tema thread tentang berhenti dan berpikir lagi.\u003c/p\u003e\n\u003ch2 id=\"relasi-ide-dalam-thread\"\u003eRelasi ide dalam thread\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relasi-ide-dalam-thread\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eNode A: Mario menangkap pain avoidance.\nNode B: reply lain bilang AI bisa memberi solusi tanpa skill.\nNode C: istilah debt mulai muncul (cognitive/comprehension/mental model).\nNode D: Mike mengingatkan realita organisasi.\nNode E: Mario membalas dengan bahasa operational incident.\u003c/p\u003e\n\u003cp\u003eAlurnya:\u003c/p\u003e\n\u003cp\u003epain avoidance → shallow learning → mental model erosion → comprehension debt → faster delivery → weaker incident response\u003c/p\u003e\n\u003cp\u003eIni memperlihatkan bahwa thread tidak sekadar mengamini Lars. Ia memperluas narasi ke operasi nyata dan insentif organisasi.\u003c/p\u003e\n\u003ch2 id=\"insight-tambahan\"\u003eInsight tambahan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-tambahan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda tiga insight yang lebih tajam dari thread:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eFriction bukan hanya pedagogi; friction adalah resilience training.\u003c/li\u003e\n\u003cli\u003eLawan utama dari pendekatan sehat bukan teknologi, tapi metrik organisasi.\u003c/li\u003e\n\u003cli\u003eMasalah ini cukup sering dirasakan sampai orang mulai butuh vocabulary baru.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread ini mengarah ke kesimpulan yang lebih tajam daripada sekadar \"AI bisa salah\":\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI bisa terlihat benar lebih sering daripada tidak,\u003c/li\u003e\n\u003cli\u003etapi ia bisa menggerus kedalaman keterlibatan manusia dengan sistem,\u003c/li\u003e\n\u003cli\u003edan itu mengurangi kapasitas tim untuk bertahan saat sistem mulai retak.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukan berarti harus stop pakai AI. Lebih tepatnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI tetap berguna,\u003c/li\u003e\n\u003cli\u003etetapi workflow yang terlalu menjauhkan engineer dari artifact berisiko merusak mental model,\u003c/li\u003e\n\u003cli\u003ekerusakan itu biasanya tak terlihat sampai terjadi incident, scaling, atau maintenance.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding-is-a-trap\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eAgentic Coding Is a Trap\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault2/daily.journal.2026.05.12 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding.thread-mario-zechner.mapping\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eMapping per komentar di thread Mario Zechner tentang agentic coding\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"tags\"\u003eTags\u0
