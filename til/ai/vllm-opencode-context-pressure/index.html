ps":{"note":{"id":"til.ai.vllm-opencode-context-pressure","title":"OpenCode + vLLM failure sering karena context pressure, bukan param kecil","desc":"Catatan singkat bahwa bug OpenCode/vLLM biasanya muncul dari context/KV cache pressure dan LiteLLM masking error asli.","updated":1778605081234,"created":1778590304474,"tags":["til","ai","vllm","opencode","debugging"],"custom":{},"fname":"til.ai.vllm-opencode-context-pressure","type":"note","vault":{"fsPath":"vault"},"contentHash":"5ebf64f11f8c10fb0b01b1c761c5354b","links":[{"type":"frontmatterTag","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"tags.til","alias":"til","xvault":false,"to":{"fname":"tags.til"}},{"type":"frontmatterTag","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"tags.ai","alias":"ai","xvault":false,"to":{"fname":"tags.ai"}},{"type":"frontmatterTag","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"tags.vllm","alias":"vllm","xvault":false,"to":{"fname":"tags.vllm"}},{"type":"frontmatterTag","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"tags.opencode","alias":"opencode","xvault":false,"to":{"fname":"tags.opencode"}},{"type":"frontmatterTag","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"tags.debugging","alias":"debugging","xvault":false,"to":{"fname":"tags.debugging"}},{"type":"wiki","from":{"fname":"til.ai.vllm-opencode-context-pressure","id":"til.ai.vllm-opencode-context-pressure","vaultName":"vault"},"value":"notes.ai.vllm-qwen3-gpu-capacity","position":{"start":{"line":47,"column":45,"offset":4055},"end":{"line":47,"column":81,"offset":4091},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.ai.vllm-qwen3-gpu-capacity"}}],"anchors":{"serving-capacity-and-admission-control":{"type":"header","text":"Serving capacity and admission control","value":"serving-capacity-and-admission-control","line":50,"column":0,"depth":2},"praktik-admission-control":{"type":"header","text":"Praktik admission control","value":"praktik-admission-control","line":63,"column":0,"depth":3},"contoh-konfigurasi-konservatif":{"type":"header","text":"Contoh konfigurasi konservatif","value":"contoh-konfigurasi-konservatif","line":95,"column":0,"depth":3},"hosted-provider-vs-self-host-mental-model":{"type":"header","text":"Hosted provider vs self-host mental model","value":"hosted-provider-vs-self-host-mental-model","line":124,"column":0,"depth":2},"minimal-architecture-target-untuk-self-host":{"type":"header","text":"Minimal architecture target untuk self-host","value":"minimal-architecture-target-untuk-self-host","line":163,"column":0,"depth":3},"production-sizing-mental-model":{"type":"header","text":"Production sizing mental model","value":"production-sizing-mental-model","line":202,"column":0,"depth":2},"root-cause-simulation":{"type":"header","text":"Root-cause simulation","value":"root-cause-simulation","line":335,"column":0,"depth":2},"eksperimen-mental-untuk-membedakan-root-cause":{"type":"header","text":"Eksperimen mental untuk membedakan root cause","value":"eksperimen-mental-untuk-membedakan-root-cause","line":394,"column":0,"depth":3},"admission-control-rule-of-thumb":{"type":"header","text":"Admission-control rule of thumb","value":"admission-control-rule-of-thumb","line":409,"column":0,"depth":3},"bypass-test":{"type":"header","text":"Bypass test","value":"bypass-test","line":433,"column":0,"depth":3},"hypothesis-ranking-update":{"type":"header","text":"Hypothesis ranking update","value":"hypothesis-ranking-update","line":442,"column":0,"depth":2},"hypothesis-ranking-update-1":{"type":"header","text":"Hypothesis ranking update","value":"hypothesis-ranking-update-1","line":466,"column":0,"depth":3},"most-valuable-isolation-tests":{"type":"header","text":"Most valuable isolation tests","value":"most-valuable-isolation-tests","line":476,"column":0,"depth":3},"runtimestack-action-items":{"type":"header","text":"Runtime/stack action items","value":"runtimestack-action-items","line":494,"column":0,"depth":3},"prioritas-action-items":{"type":"header","text":"Prioritas action items","value":"prioritas-action-items","line":540,"column":0,"depth":2}},"children":[],"parent":"azn7os7xe5ows2nshntsymu","data":{}},"body":"\u003ch1 id=\"opencode--vllm-failure-sering-karena-context-pressure-bukan-param-kecil\"\u003eOpenCode + vLLM failure sering karena context pressure, bukan param kecil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#opencode--vllm-failure-sering-karena-context-pressure-bukan-param-kecil\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eYang gue pelajari dari kasus ini: ketika OpenCode + LiteLLM + vLLM ngelempar error seperti \u003ccode\u003elitellm.ServiceUnavailableError\u003c/code\u003e, \u003ccode\u003elitellm.MidStreamFallbackError\u003c/code\u003e, atau \u003ccode\u003eAPIConnectionError: Hosted_vllmException - 'id'\u003c/code\u003e, kemungkinan besar bukan sekadar parameter kecil yang salah.\u003c/p\u003e\n\u003cp\u003eSignal yang paling kuat: habis \u003ccode\u003eESC\u003c/code\u003e lalu \u003ccode\u003e/compact\u003c/code\u003e langsung normal lagi. Itu bukan kebetulan. Itu clue bahwa masalahnya ada di context state / KV cache / stream state, bukan jaringan.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode\u003c/code\u003e bisa gagal mendeteksi overflow dari \u003ccode\u003evLLM\u003c/code\u003e karena error signature-nya beda dari OpenAI/Anthropic.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLiteLLM\u003c/code\u003e sering nge-wrap root cause asli jadi \u003ccode\u003eMidStreamFallbackError\u003c/code\u003e / \u003ccode\u003eServiceUnavailableError\u003c/code\u003e / \u003ccode\u003eAPIConnectionError\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003evLLM\u003c/code\u003e punya behavior yang rentan: streaming stall, preemption, KV cache exhaustion, malformed chunk ketika context panjang.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003elimit.context = 111616\u003c/code\u003e bisa jadi cuma metadata UI/config OpenCode. Belum tentu LiteLLM atau vLLM enforce secara nyata, atau tokenizer sinkron. Runtime KV bisa jebol meski angka metadata terlihat aman.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ereasoning: true\u003c/code\u003e pada Qwen reasoning model sangat suspicious. Hidden reasoning tokens / internal CoT sering membuat real KV usage jauh lebih besar daripada visible tokens.\u003c/li\u003e\n\u003cli\u003eOutput 16384 untuk agent coding + long context bukan sekadar \"besar\"; itu monster. Decode panjang memperbesar chance stream interruption, scheduler preemption, malformed SSE chunk, atau timeout.\u003c/li\u003e\n\u003cli\u003ePrefix caching + chunked prefill di vLLM bisa menambah instabilitas untuk agent workflows dengan reasoning, long context, streaming, dan tool calls.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKarena itu, pendekatan paling masuk akal adalah:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eTurunkan effective context hard limit (misal 48k–60k) walau model support 128k/200k.\u003c/li\u003e\n\u003cli\u003eTrigger compact lebih agresif, jangan tunggu 85–90%; mulai di 55–65%.\u003c/li\u003e\n\u003cli\u003eBatasi \u003ccode\u003emax_tokens\u003c/code\u003e output (coba 4k–8k dulu).\u003c/li\u003e\n\u003cli\u003eDisable parallel requests sementara supaya KV cache / stream competition berkurang.\u003c/li\u003e\n\u003cli\u003ePeriksa log \u003ccode\u003evLLM\u003c/code\u003e langsung, bukan cuma LiteLLM log.\u003c/li\u003e\n\u003cli\u003ePerhatikan compatibility OpenCode ↔ LiteLLM ↔ vLLM versi.\u003c/li\u003e\n\u003cli\u003eIngat: coding agents meng-inflate context dengan diff, tool output, repo context, dan reasoning trace.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCatatan praktisnya: jika \u003ccode\u003e/compact\u003c/code\u003e langsung memperbaiki masalah, hampir pasti root cause-nya adalah \"context state unhealthy\". Ini bukan bug acak, ini masalah pressure / overflow yang tertutup oleh wrapper error.\u003c/p\u003e\n\u003cp\u003eHal spesifik yang perlu dicek:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah vLLM dijalankan dengan \u003ccode\u003e--enable-prefix-caching\u003c/code\u003e atau \u003ccode\u003e--enable-chunked-prefill\u003c/code\u003e; jika iya, jejalkan disable sementara.\u003c/li\u003e\n\u003cli\u003eapakah log vLLM menunjukkan \u003ccode\u003epreempted\u003c/code\u003e, \u003ccode\u003eKV cache eviction\u003c/code\u003e, \u003ccode\u003erecompute\u003c/code\u003e, atau \u003ccode\u003eaborted sequence\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eapakah \u003ccode\u003ereasoning: true\u003c/code\u003e aktif pada Qwen; ini sering memicu hidden KV growth yang tidak terlihat.\u003c/li\u003e\n\u003cli\u003eapakah output size masih 16384; untuk agent coding, coba turunkan ke 4096 dulu.\u003c/li\u003e\n\u003cli\u003eapakah OpenCode/LiteLLM/tokenizer accounting mismatch membuat visible context 85k padahal runtime mungkin 105k+.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau error hilang setelah langkah-langkah ini, kemungkinan besar masalahnya bukan hard overflow, tapi runtime instability / KV cache pressure / mismatch detection.\u003c/p\u003e\n\u003ch2 id=\"serving-capacity-and-admission-control\"\u003eServing capacity and admission control\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#serving-capacity-and-admission-control\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang diagnosisnya lebih jelas: bukan model atau konteks limit per request, tapi \u003cstrong\u003eserving capacity\u003c/strong\u003e. Jam sepi aman dan jam sibuk error itu textbook pertanda bahwa beberapa request panjang sedang masuk bersamaan, masing-masing butuh KV cache besar, lalu vLLM mulai preempt/recompute/queue dan LiteLLM menerima stream terputus/malformed.\u003c/p\u003e\n\u003cp\u003ePenting diubah secara mental:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emax_model_len = 111k\u003c/code\u003e bukan berarti aman untuk banyak user concurrent.\u003c/li\u003e\n\u003cli\u003eItu lebih mirip batas maksimum per request.\u003c/li\u003e\n\u003cli\u003eKapasitas effective concurrency jauh lebih kecil karena KV cache tumbuh linear terhadap jumlah request aktif × panjang context × output tokens.\u003c/li\u003e\n\u003cli\u003evLLM metrics seperti \u003ccode\u003evllm:kv_cache_usage_perc\u003c/code\u003e, \u003ccode\u003evllm:num_requests_running\u003c/code\u003e, \u003ccode\u003evllm:num_requests_waiting\u003c/code\u003e, \u003ccode\u003evllm:request_prompt_tokens\u003c/code\u003e, dan \u003ccode\u003evllm:request_generation_tokens\u003c/code\u003e adalah indikasi tekanan scheduler/KV cache, bukan hanya GPU utilization.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk angka kapasitas GPU nyata, lihat juga \u003ca href=\"/sotoy/notes/notes.ai.vllm-qwen3-gpu-capacity\"\u003eQwen3.5-397B-A17B-FP8 di vLLM: kebutuhan H100 dan kapasitas runtime\u003c/a\u003e dan sumber eksternal \u003ca href=\"https://www.spheron.network/blog/deploy-qwen-3-5-gpu-cloud/\"\u003eSpheron Blog: Deploy Qwen 3.5 on GPU Cloud\u003c/a\u003e — di situ gue catat bahwa Qwen3.5-397B-A17B-FP8 butuh sekitar 8×H100 dan menyisakan sekitar 100–119 GB untuk KV cache.\u003c/p\u003e\n\u003ch3 id=\"praktik-admission-control\"\u003ePraktik admission control\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktik-admission-control\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSolusi praktisnya mulai dari depan vLLM:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eLimit concurrency keras.\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emax concurrent generations = 1–2\u003c/code\u003e per model instance untuk long-context coding workloads.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePisahkan \u003ccode\u003ecoding model\u003c/code\u003e dari \u003ccode\u003echat model\u003c/code\u003e.\n\u003cul\u003e\n\u003cli\u003esmall model untuk chat ringan;\u003c/li\u003e\n\u003cli\u003ebig model hanya untuk coding/deep reasoning.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eHard cap session lifetime.\n\u003cul\u003e\n\u003cli\u003eauto compact tiap 30–50 turn;\u003c/li\u003e\n\u003cli\u003erestart session setelah task besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eReduce output tokens drastis.\n\u003cul\u003e\n\u003cli\u003e16384 terlalu agresif untuk jam ramai;\u003c/li\u003e\n\u003cli\u003eproduction sering clamp di 2k–4k.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSet \u003ccode\u003egpu_memory_utilization\u003c/code\u003e lebih tinggi.\n\u003cul\u003e\n\u003cli\u003evLLM rekomendasi bisa membantu preemption issue.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDisable prefix caching sementara.\n\u003cul\u003e\n\u003cli\u003eprefix caching bagus untuk throughput, tapi bisa memperparah KV fragmentation / concurrency weirdness.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eMonitor KV cache usage live.\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ekv_cache_usage_perc \u003e 0.85\u003c/code\u003e atau \u003ccode\u003e0.95\u003c/code\u003e adalah alert.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eJangan pakai streaming untuk internal agent tasks.\n\u003cul\u003e\n\u003cli\u003estreaming cocok UX, tapi internal tool/summarization lebih stabil non-streaming.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eScale horizontally.\n\u003cul\u003e\n\u003cli\u003ebeberapa replica dengan concurrency kecil lebih stabil daripada satu replica besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSeparate inference pools.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003epool kecil untuk chat, pool besar untuk coding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"11\"\u003e\n\u003cli\u003eLiteLLM workaround.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003edisable mid-stream fallback atau bypass LiteLLM untuk coding path.\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"12\"\u003e\n\u003cli\u003eTemporary operational workaround.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003econcurrency rendah, compact agresif, output ≤4096, reasoning off, streaming off untuk internal tasks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"contoh-konfigurasi-konservatif\"\u003eContoh konfigurasi konservatif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-konfigurasi-konservatif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003evllm serve /path/to/model \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --tensor-parallel-size \u003cspan class=\"token number\"\u003e8\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-model-len \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-num-seqs \u003cspan class=\"token number\"\u003e2\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-num-batched-tokens \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --gpu-memory-utilization \u003cspan class=\"token number\"\u003e0.92\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --enable-prefix-caching\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJika masih error:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e--max-num-seqs \u003cspan class=\"token number\"\u003e1\u003c/span\u003e\n--max-model-len \u003cspan class=\"token number\"\u003e49152\u003c/span\u003e\n--max-num-batched-tokens \u003cspan class=\"token number\"\u003e49152\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi OpenCode client, batasi juga:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003elimit\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  context\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  output\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e4096\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"hosted-provider-vs-self-host-mental-model\"\u003eHosted provider vs self-host mental model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hosted-provider-vs-self-host-mental-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePenting untuk ingat: OpenRouter tidak menjalankan satu instance vLLM polos yang menerima semua request mentah. Mereka stabil karena banyak lapisan proteksi di atas inference engine.\u003c/p\u003e\n\u003cp\u003eIntinya bukan “GPU mereka kuat lalu semua request masuk”. Ini lebih mirip sistem produksi dengan antrian dan routing.\u003c/p\u003e\n\u003cp\u003eOpenRouter mendokumentasikan bahwa mereka melakukan provider routing dan load balancing ke beberapa provider, dengan fallback provider aktif secara default. Jadi ketika satu provider lambat/down/throttled, request bisa diarahkan ke provider lain, bukan dipaksa masuk ke satu runtime yang sedang penuh. Mereka juga punya rate limit dan upstream throttle untuk peak usage; traffic tidak dibiarkan masuk tanpa kontrol.\u003c/p\u003e\n\u003cp\u003eBandingkan setup lo:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eLo:\nOpenCode -\u003e LiteLLM -\u003e 1/self-host vLLM pool -\u003e model besar\n\nHosted provider:\nClient -\u003e gateway -\u003e rate limiter -\u003e router -\u003e queue -\u003e many replicas/providers -\u003e health checker -\u003e fallback -\u003e response\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eStabilitas mereka datang dari beberapa hal:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAdmission control\n\u003cul\u003e\n\u003cli\u003erequest tidak langsung masuk GPU saat sistem penuh.\u003c/li\u003e\n\u003cli\u003ebisa di-queue, di-throttle, di-429, atau diroute ke provider lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLoad balancing dan fallback\n\u003cul\u003e\n\u003cli\u003etidak hanya satu server model.\u003c/li\u003e\n\u003cli\u003ejika satu replica saturated, request bisa diarahkan lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePool isolation\n\u003cul\u003e\n\u003cli\u003erequest pendek, request panjang, free-tier, paid-tier, priority tidak selalu ke resource sama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eHorizontal scaling\n\u003cul\u003e\n\u003cli\u003ebanyak replica dengan concurrency kecil lebih stabil daripada satu replica besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eScheduler policy matang\n\u003cul\u003e\n\u003cli\u003erequest 2k token dan 100k token tidak sama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eParameter clamping\n\u003cul\u003e\n\u003cli\u003egateway bisa membatasi parameter agar tidak merusak pool.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eRetry aman\n\u003cul\u003e\n\u003cli\u003eretry biasanya sebelum streaming dimulai atau ke provider lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi jawaban pendeknya: OpenRouter stabil bukan karena “satu server kuat”, tapi karena distributed serving dan admission control.\u003c/p\u003e\n\u003ch3 id=\"minimal-architecture-target-untuk-self-host\"\u003eMinimal architecture target untuk self-host\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#minimal-architecture-target-untuk-self-host\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eOpenCode\n  -\u003e Gateway / LiteLLM Router\n  -\u003e Admission Control\n  -\u003e Queue\n  -\u003e Pool Router\n      -\u003e small-chat pool\n      -\u003e coding-agent pool\n      -\u003e summarizer pool\n  -\u003e vLLM replicas\n  -\u003e Metrics + autoscale / manual scale\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk coding agent pool, mulai dengan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1 replica:\n  max_num_seqs = 1 atau 2\n  max_output_tokens = 4096\n  context target = 48k–64k\n  queue request lain\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLebih stabil daripada:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1 replica x max_num_seqs=8\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDan request ringan jangan masuk pool sama:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003echat biasa       -\u003e model kecil / pool cepat\nsummarization    -\u003e model kecil / non-streaming\ncoding long-run  -\u003e model besar / queue ketat\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"production-sizing-mental-model\"\u003eProduction sizing mental model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#production-sizing-mental-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk model kelas Qwen3-Coder-480B-A35B FP8, jawabannya bukan “berapa kuat GPU”, tetapi “berapa concurrent long-agent session yang mau lo support dengan latency stabil”.\u003c/p\u003e\n\u003cp\u003eModel ini bukan 1–2 GPU kecil. vLLM resmi menyarankan setup kelas \u003cstrong\u003e8×H200 atau 8×H20 141GB\u003c/strong\u003e untuk Qwen3-Coder-480B-A35B, dan bahkan dengan context asli 262k, satu node tetap bisa tidak cukup. Hugging Face model card juga menyebut model ini total \u003cstrong\u003e480B parameters\u003c/strong\u003e, \u003cstrong\u003e35B activated\u003c/strong\u003e, dan native long context \u003cstrong\u003e256K tokens\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eJadi mental model dasarnya:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1 replica = 1 vLLM deployment model besar\n1 replica kemungkinan = 8 GPU high-memory\n1 long OpenCode session = bisa makan kapasitas besar\nproduction stability = replicas × admission control × queue\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEstimasi realistis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eInternal dev / POC stabil\u003c/strong\u003e (1–2 user aktif):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e1 replica = 8×H100 80GB / 8×H200 141GB / 8×MI300X 192GB\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emax_num_seqs = 1–2\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtext target = 48k–64k\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eoutput = 2k–4k\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eSmall production\u003c/strong\u003e (3–5 concurrent long-agent sessions):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e3–5 replicas = sekitar 24–40 GPU high-end\u003c/li\u003e\n\u003cli\u003e1 replica hanya menerima 1 long-agent request aktif, lainnya queue\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eSerious SaaS / enterprise\u003c/strong\u003e (10–20 concurrent long-agent sessions):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e10–20 replicas = sekitar 80–160 GPU high-end\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo paksa:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1 replica × max_num_seqs=5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ekemungkinan besar balik lagi ke error yang sama: KV cache pressure, preemption, stream stall, LiteLLM error.\u003c/p\u003e\n\u003cp\u003eUntuk produksi yang lebih sehat:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003echat ringan          -\u003e model 7B/14B/32B\nsummarization        -\u003e model kecil, non-streaming\nrepo search/RAG      -\u003e retrieval + reranker\ncoding simple edit   -\u003e 32B/72B coder\nhard coding agent    -\u003e Qwen 480B-A35B pool\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRekomendasi awal:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eProduction baseline awal:\n2 replicas Qwen besar = 16 GPU high-memory\n\nReplica A:\n  active long agent request = 1\n  standby/overflow = queue\n\nReplica B:\n  active long agent request = 1\n  standby/overflow = queue/fallback\n\nPlus:\n1–2 smaller model pools untuk summarizer/chat/planner\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa minimal 2 replica? Karena 1 replica itu POC, bukan production. Kalau satu replica lagi prefill panjang atau restart, semua kena. Dua replica memberi failover dasar.\u003c/p\u003e\n\u003cp\u003eSetting awal yang lebih aman:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003evllm serve Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --tensor-parallel-size \u003cspan class=\"token number\"\u003e8\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-model-len \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-num-seqs \u003cspan class=\"token number\"\u003e1\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --max-num-batched-tokens \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --gpu-memory-utilization \u003cspan class=\"token number\"\u003e0.92\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOpenCode/client:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003elimit\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  context\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e65536\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  output\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e4096\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNaikkan perlahan jika stabil:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003emax_num_seqs: 1 -\u003e 2\ncontext: 64k -\u003e 96k\noutput: 4k -\u003e 8k\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRule sizing kasar:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003erequired_replicas = ceil(concurrent_long_agent_sessions / safe_long_sessions_per_replica)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan model ini:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003esafe_long_sessions_per_replica = 1\naggressive = 2\nrisky = 3+\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e2 concurrent OpenCode users  -\u003e 2 replicas -\u003e 16 GPU\n5 concurrent OpenCode users  -\u003e 5 replicas -\u003e 40 GPU\n10 concurrent OpenCode users -\u003e 10 replicas -\u003e 80 GPU\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau budget tidak masuk, desain lo harus berubah: pakai Qwen besar hanya untuk task sulit, dan mayoritas agent loop dialihkan ke model 32B/72B + retrieval + tool execution.\u003c/p\u003e\n\u003cp\u003eAnalogi:\nOpenRouter itu seperti bandara dengan gate, antrian, prioritas, reroute, dan fallback. Self-host lo sekarang lebih mirip semua orang disuruh masuk satu pintu pesawat.\u003c/p\u003e\n\u003cp\u003eRoot cause yang mau dibuktikan tetap sama: self-host lo belum punya admission control dan pool isolation yang cukup untuk long-context concurrent agent workload.\u003c/p\u003e\n\u003cp\u003eRule of thumb:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ekv_cache_usage_perc \u003e 0.85\u003c/code\u003e selama beberapa menit → mulai queue/throttle\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ekv_cache_usage_perc \u003e 0.95\u003c/code\u003e → reject/429 long request\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enum_requests_waiting\u003c/code\u003e naik terus → kapasitas kurang\u003c/li\u003e\n\u003cli\u003eTTFT naik tajam meski request sedikit → long prefill / HOL blocking\u003c/li\u003e\n\u003cli\u003epreemption count naik → kurangi concurrency/context\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"root-cause-simulation\"\u003eRoot-cause simulation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#root-cause-simulation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMisal config lo:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003econtext limit: 111,616 token\noutput limit: 16,384 token\nmodel: besar, FP8\ntraffic: beberapa agent OpenCode concurrent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSatu request panjang agent coding tidak cuma prompt awal. Total active sequence length-nya adalah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eactive_tokens ≈ prompt_tokens + generated_tokens_so_far\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003erequest A: prompt = 80k, max output = 16k, active max ≈ 96k\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSaat sendiri pagi hari:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003erunning requests = 1\nactive KV pressure ≈ 96k\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSaat ramai:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003erequest A = 96k\nrequest B = 68k\nrequest C = 48k\nrequest D = 24k\n\ntotal active pressure ≈ 236k\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMasing-masing masih di bawah \u003ccode\u003emax_model_len\u003c/code\u003e, tapi gabungannya bisa melampaui kapasitas KV cache efektif. Ini yang menipu: \u003ccode\u003emax_model_len\u003c/code\u003e adalah batas per request, bukan kapasitas concurrent.\u003c/p\u003e\n\u003cp\u003eTimeline failure yang paling relevan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eT0: request A masuk, prompt panjang.\nT1: request B/C/D ikut masuk.\nT2: KV cache usage naik 70% → 85% → 95%.\nT3: request A sedang decode output panjang sementara B prefill.\nT4: vLLM mulai preemption/recompute karena KV tidak cukup.\nT5: stream A makin lambat, inter-token latency naik.\nT6: salah satu stream timeout/malformed/aborted.\nT7: LiteLLM bongkar stream kotor jadi MidStreamFallbackError / APIConnectionError / 'id'.\nT8: lo tekan ESC + /compact, request jadi jauh lebih pendek, KV pressure turun, semuanya normal lagi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi \u003ccode\u003e/compact\u003c/code\u003e tidak membuktikan bug LiteLLM saja. Ia menurunkan request size dan menghindari kondisi runtime buruk di vLLM/LiteLLM.\u003c/p\u003e\n\u003ch3 id=\"eksperimen-mental-untuk-membedakan-root-cause\"\u003eEksperimen mental untuk membedakan root cause\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#eksperimen-mental-untuk-membedakan-root-cause\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eSingle request vs concurrent request\n\u003cul\u003e\n\u003cli\u003eJika satu request panjang stabil tetapi beberapa request panjang bersamaan gagal, root cause adalah capacity contention, bukan context overflow per request.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eOutput 16k vs 4k\n\u003cul\u003e\n\u003cli\u003eJika 16k error tetapi 4k stabil, long decode / scheduler occupancy adalah masalah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eBypass LiteLLM\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode → vLLM langsung\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eJika bypass stabil, LiteLLM streaming layer bermasalah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTurunkan \u003ccode\u003emax_num_seqs\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003eJika \u003ccode\u003emax_num_seqs=1\u003c/code\u003e stabil, concurrency/vLLM contention jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCari preemption log\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eSequence group ... is preempted ... because there is not enough KV cache space\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eItu smoking gun runtime.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"admission-control-rule-of-thumb\"\u003eAdmission-control rule of thumb\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#admission-control-rule-of-thumb\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGunakan estimated cost, bukan request count:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003eestimatedCost \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e promptTokens \u003cspan class=\"token operator\"\u003e+\u003c/span\u003e maxOutputTokens\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJangan admit request jika:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003ecurrentInflightTokens + estimatedCost \u003e SAFE_INFLIGHT_BUDGET\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk long coding request, \u003ccode\u003eSAFE_INFLIGHT_BUDGET\u003c/code\u003e sering jauh di bawah total model limit.\u003c/p\u003e\n\u003cp\u003eRule alert:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ekv_cache_usage_perc \u003e 0.85\u003c/code\u003e selama beberapa menit → queue/throttle\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ekv_cache_usage_perc \u003e 0.95\u003c/code\u003e → reject/429 long request\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enum_requests_waiting\u003c/code\u003e naik terus → kapasitas kurang\u003c/li\u003e\n\u003cli\u003eTTFT naik tajam dengan sedikit request → long prefill / HOL blocking\u003c/li\u003e\n\u003cli\u003epreemption count naik → kurangi concurrency/context\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"bypass-test\"\u003eBypass test\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bypass-test\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCoba jalankan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode → LiteLLM → vLLM\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode → vLLM langsung\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecurl/openai-sdk → vLLM langsung\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau bypass LiteLLM stabil, berarti layer streaming/proxy LiteLLM bermasalah. Kalau tetap error, berarti vLLM/runtime.\u003c/p\u003e\n\u003ch2 id=\"hypothesis-ranking-update\"\u003eHypothesis ranking update\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hypothesis-ranking-update\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSignal yang sangat penting: kalau model, workflow, dan OpenCode sama, tapi OpenRouter stabil sementara self-host vLLM/LiteLLM bermasalah, probabilitasnya sekarang lebih tinggi ke:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eLiteLLM\u003c/code\u003e streaming incompatibility / parser issue.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003evLLM\u003c/code\u003e long-stream runtime instability.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode\u003c/code\u003e auto-compact mismatch dengan vLLM error signature.\u003c/li\u003e\n\u003cli\u003eActual context overflow.\u003c/li\u003e\n\u003cli\u003eModel issue itself (kemungkinan kecil sekarang).\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eItu masuk akal karena hosted provider seperti OpenRouter biasanya punya layer tambahan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagresif guard request size (truncate/compact/reject),\u003c/li\u003e\n\u003cli\u003eretry/recovery layer untuk malformed chunk, fallback, dan timeout,\u003c/li\u003e\n\u003cli\u003elebih ketat mengendalikan reasoning/hidden CoT,\u003c/li\u003e\n\u003cli\u003escheduler/backpressure yang lebih mature.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau OpenRouter stabil tapi self-host vLLM/LiteLLM bermasalah, itu sangat besar mengarah ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eruntime implementation / serving stack,\u003c/li\u003e\n\u003cli\u003ebukan modelnya sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKarena vLLM/LiteLLM direct lebih raw: request pathological bisa masuk sampai runtime kepanasan. OpenRouter kemungkinan mem-filter, retry, dan recover sebelum sampai ke sana.\u003c/p\u003e\n\u003ch3 id=\"hypothesis-ranking-update-1\"\u003eHypothesis ranking update\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hypothesis-ranking-update-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUrutan kemungkinan sekarang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eLiteLLM\u003c/code\u003e streaming incompatibility / parser issue.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003evLLM\u003c/code\u003e long-stream runtime instability.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOpenCode\u003c/code\u003e auto-compact mismatch dengan vLLM error signature.\u003c/li\u003e\n\u003cli\u003eActual context overflow.\u003c/li\u003e\n\u003cli\u003eModel issue itself (kemungkinan kecil sekarang).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"most-valuable-isolation-tests\"\u003eMost valuable isolation tests\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#most-valuable-isolation-tests\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eBypass LiteLLM.\n\u003cul\u003e\n\u003cli\u003eTest: \u003ccode\u003eOpenCode → vLLM langsung\u003c/code\u003e tanpa LiteLLM.\u003c/li\u003e\n\u003cli\u003eJika hilang: artinya problem utamanya ada di LiteLLM streaming layer.\u003c/li\u003e\n\u003cli\u003eJika tetap ada: artinya vLLM/runtime lebih mungkin.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDisable streaming sementara.\n\u003cul\u003e\n\u003cli\u003eKalau non-streaming stabil, hampir pasti isu pada SSE chunking/parser/timeout, bukan model inference.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCompare exact provider response schema.\n\u003cul\u003e\n\u003cli\u003eBandingkan OpenRouter vs vLLM response format, khususnya \u003ccode\u003eid\u003c/code\u003e, \u003ccode\u003efinish_reason\u003c/code\u003e, dan chunk fields.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eUpgrade/downgrade LiteLLM.\n\u003cul\u003e\n\u003cli\u003eStreaming regression sering versi-spesifik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTest provider lain selain vLLM.\n\u003cul\u003e\n\u003cli\u003eCoba SGLang/TGI/Ollama atau server lain.\u003c/li\u003e\n\u003cli\u003eJika stabil di provider lain, vLLM stack jadi tersangka utama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCek vLLM OpenAI compatibility mode.\n\u003cul\u003e\n\u003cli\u003ePastikan \u003ccode\u003e/v1/chat/completions\u003c/code\u003e dan schema OpenAI-compatible, bukan custom route.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"runtimestack-action-items\"\u003eRuntime/stack action items\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#runtimestack-action-items\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eLimit concurrency keras.\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emax concurrent generations = 1–2\u003c/code\u003e per model instance.\u003c/li\u003e\n\u003cli\u003e397B FP8 + long context adalah monster KV cache consumer.\u003c/li\u003e\n\u003cli\u003eBottleneck sering bukan GPU utilization, tapi KV cache / scheduler / preemption.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePisahkan \"coding model\" dari \"chat model\".\n\u003cul\u003e\n\u003cli\u003eSmall model untuk chat ringan.\u003c/li\u003e\n\u003cli\u003eBig model hanya untuk coding/deep reasoning.\u003c/li\u003e\n\u003cli\u003eJangan biarkan autocomplete/summarize/healthcheck/planner ikut masuk ke model besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eHard cap session lifetime.\n\u003cul\u003e\n\u003cli\u003eAuto compact setiap 30–50 turns.\u003c/li\u003e\n\u003cli\u003eRestart session setelah task besar.\u003c/li\u003e\n\u003cli\u003eLong-running session bikin KV fragmentation / preemption / recompute naik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eReduce output tokens drastis.\n\u003cul\u003e\n\u003cli\u003e16384 terlalu agresif untuk concurrent streaming.\u003c/li\u003e\n\u003cli\u003eBanyak infra production clamp di 2k atau 4k, bahkan untuk coding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSet \u003ccode\u003egpu_memory_utilization\u003c/code\u003e lebih tinggi.\n\u003cul\u003e\n\u003cli\u003evLLM merekomendasikan ini ketika preemption muncul.\u003c/li\u003e\n\u003cli\u003eMisal naik dari 0.90 ke 0.95 / 0.97, dengan hati-hati agar tidak OOM.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDisable prefix caching sementara.\n\u003cul\u003e\n\u003cli\u003ePrefix caching bagus untuk throughput, tapi bisa bikin KV fragmentation/concurrency weirdness lebih parah di long-running agent workflows.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eMonitor KV cache usage live.\n\u003cul\u003e\n\u003cli\u003eCari grafik seperti \u003ccode\u003eGPU KV cache usage: 99%\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eJika error selalu muncul saat \u003e90%, itu smoking gun.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eJangan pakai streaming untuk internal agent tasks.\n\u003cul\u003e\n\u003cli\u003eStreaming bagus untuk UX manusia, tapi untuk internal tool calls/batch coding/summarization lebih stabil non-streaming.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eScale horizontally.\n\u003cul\u003e\n\u003cli\u003eMultiple vLLM workers, load balancing, sticky sessions.\u003c/li\u003e\n\u003cli\u003evLLM scheduler under high concurrency bisa saling preempt request.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSeparate inference pools.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003ePool A untuk short chat.\u003c/li\u003e\n\u003cli\u003ePool B untuk long coding sessions.\u003c/li\u003e\n\u003cli\u003eKalau dicampur, chat ringan kena starvation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"11\"\u003e\n\u003cli\u003eLiteLLM workaround.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003eDisable mid-stream fallback.\u003c/li\u003e\n\u003cli\u003eAtau bypass LiteLLM untuk coding path.\u003c/li\u003e\n\u003c/ul\u003e\n\u003col start=\"12\"\u003e\n\u003cli\u003eTemporary operational workaround tercepat.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003eConcurrency limit rendah.\u003c/li\u003e\n\u003cli\u003eCompact lebih agresif.\u003c/li\u003e\n\u003cli\u003eOutput ≤ 4096.\u003c/li\u003e\n\u003cli\u003eReasoning OFF untuk coding default.\u003c/li\u003e\n\u003cli\u003eStreaming OFF untuk internal tasks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau error muncul hanya saat jam sibuk, itu textbook KV contention + scheduler preemption.\u003c/p\u003e\n\u003ch2 id=\"prioritas-action-items\"\u003ePrioritas action items\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prioritas-action-items\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePriority paling efektif:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eTurunkan \u003ccode\u003emax_output_tokens\u003c/code\u003e dulu.\n\u003cul\u003e\n\u003cli\u003eDari \u003ccode\u003eoutput: 16384\u003c/code\u003e jadi \u003ccode\u003eoutput: 4096\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eKalau masih error, turun lagi ke \u003ccode\u003eoutput: 2048\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eLong decode streaming sering jadi sumber stalled stream, malformed SSE, vLLM preemption, dan LiteLLM MidStreamFallbackError.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCompact lebih agresif.\n\u003cul\u003e\n\u003cli\u003eSet threshold di 50–60%.\u003c/li\u003e\n\u003cli\u003eJangan tunggu 80% ke atas.\u003c/li\u003e\n\u003cli\u003eKarena usable context bisa jauh lebih kecil dari advertised limit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDisable reasoning sementara untuk isolasi.\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ereasoning: false\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eKalau stabil tiba-tiba, hidden reasoning/KV growth adalah pemicunya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCek log vLLM langsung.\n\u003cul\u003e\n\u003cli\u003eCari \u003ccode\u003epreempted\u003c/code\u003e, \u003ccode\u003eKV cache\u003c/code\u003e, \u003ccode\u003erecompute\u003c/code\u003e, \u003ccode\u003eaborted\u003c/code\u003e, \u003ccode\u003eOOM\u003c/code\u003e, \u003ccode\u003escheduler warning\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eKhususnya: \u003ccode\u003epreempted due to KV cache pressure\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDisable vLLM optimizations sementara.\n\u003cul\u003e\n\u003cli\u003eJika startup ada \u003ccode\u003e--enable-prefix-caching\u003c/code\u003e atau \u003ccode\u003e--enable-chunked-prefill\u003c/code\u003e, matikan buat test.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePastikan concurrency = 1.\n\u003cul\u003e\n\u003cli\u003eSingle request only.\u003c/li\u003e\n\u003cli\u003eTidak ada parallel workers, parallel requests, atau background summarizer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTest model lebih kecil.\n\u003cul\u003e\n\u003cli\u003eCoba Qwen 72B atau 32B dengan workflow sama.\u003c/li\u003e\n\u003cli\u003eKalau stabil, itu artinya problemnya runtime pressure 397B, bukan OpenCode.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTambahkan observability token/context.\n\u003cul\u003e\n\u003cli\u003eLog estimated input tokens, output tokens, context sebelum compact, request duration, streaming duration.\u003c/li\u003e\n\u003cli\u003eSupaya bisa lihat apakah error muncul setelah X token / Y menit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eCek apakah OpenCode salah detect overflow dari vLLM.\n\u003cul\u003e\n\u003cli\u003eOpenAI provider bisa decent, tapi vLLM OpenAI-compatible sering punya signature beda.\u003c/li\u003e\n\u003cli\u003eJika terbukti, fix bisa lewat custom error mapping atau patch provider adapter.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTemporary operational workaround.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cul\u003e\n\u003cli\u003eManual compact lebih sering.\u003c/li\u003e\n\u003cli\u003eJangan biarkan session terlalu panjang.\u003c/li\u003e\n\u003cli\u003eSplit task besar.\u003c/li\u003e\n\u003cli\u003eRestart session tiap major task.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUrutan paling efektif:\u003c/p\u003e\n\u003cp\u003ePhase 1 — isolasi cepat\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoutput → 4096\u003c/li\u003e\n\u003cli\u003ereasoning → false\u003c/li\u003e\n\u003cli\u003econcurrency → 1\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau langsung stabil: root cause hampir pasti runtime/KV pressure.\u003c/p\u003e\n\u003cp\u003ePhase 2 — observability\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einspect vLLM logs\u003c/li\u003e\n\u003cli\u003eadd token metrics\u003c/li\u003e\n\u003cli\u003emonitor preemption\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePhase 3 — optimization\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecompact threshold 50–60%\u003c/li\u003e\n\u003cli\u003edisable prefix caching/chunked prefill\u003c/li\u003e\n\u003cli\u003epatch overflow detection di OpenCode kalau perlu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eReferensi: issue OpenCode/vLLM context overflow, vLLM KV cache preemption, dan LiteLLM mid-stream parsing mismatch.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evllm (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eopencode (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edebugging (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyncMode":"noCommit","enableAutoFoldFrontmatter":false,"enableEditorDecorations":true,"maxPreviewsCached":10,"maxNoteLength":204800,"seeds":{"dendron.templates":{}},"enableFullHierarchyNoteTitle":f
