ion dan token","value":"permission-dan-token","line":141,"column":0,"depth":2},"data-yang-worker-butuh":{"type":"header","text":"Data yang worker butuh","value":"data-yang-worker-butuh","line":152,"column":0,"depth":2},"comment-vs-discussion":{"type":"header","text":"Comment vs discussion","value":"comment-vs-discussion","line":172,"column":0,"depth":2},"contoh-review-output-yang-gue-inginkan":{"type":"header","text":"Contoh review output yang gue inginkan","value":"contoh-review-output-yang-gue-inginkan","line":178,"column":0,"depth":2},"minimal-implementation-yang-gue-pikirkan":{"type":"header","text":"Minimal implementation yang gue pikirkan","value":"minimal-implementation-yang-gue-pikirkan","line":218,"column":0,"depth":2},"serverts":{"type":"header","text":"server.ts","value":"serverts","line":220,"column":0,"depth":3},"workerts":{"type":"header","text":"worker.ts","value":"workerts","line":224,"column":0,"depth":3},"gitlabts":{"type":"header","text":"gitlab.ts","value":"gitlabts","line":228,"column":0,"depth":3},"clone-repo-atau-diff-only-review":{"type":"header","text":"Clone repo atau diff-only review?","value":"clone-repo-atau-diff-only-review","line":232,"column":0,"depth":2},"instruction-file-di-repo":{"type":"header","text":"Instruction file di repo","value":"instruction-file-di-repo","line":249,"column":0,"depth":2},"safety-guardrail":{"type":"header","text":"Safety guardrail","value":"safety-guardrail","line":274,"column":0,"depth":2},"before-after-workflow":{"type":"header","text":"Before-after workflow","value":"before-after-workflow","line":287,"column":0,"depth":2},"roadmap":{"type":"header","text":"Roadmap","value":"roadmap","line":306,"column":0,"depth":2},"kesimpulan":{"type":"header","text":"Kesimpulan","value":"kesimpulan","line":315,"column":0,"depth":2},"related":{"type":"header","text":"Related","value":"related","line":329,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"gitlab-mr-review-agent-di-coolify\"\u003eGitLab MR Review Agent di Coolify\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#gitlab-mr-review-agent-di-coolify\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUse case gue adalah GitLab Merge Request review agent yang gue deploy di Coolify.\u003c/p\u003e\n\u003cp\u003eYang gue mau bukan semua MR otomatis direview. Triggernya harus dari comment di MR, misalnya \u003ccode\u003e/agent review security\u003c/code\u003e atau \u003ccode\u003e/agent review\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eIni bukan agent coding bebas. Ini lebih pas disebut \u003cstrong\u003eMR review bot dengan worker agent di belakangnya\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"terminologi-penting\"\u003eTerminologi penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#terminologi-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMention\u003c/strong\u003e = komentar di MR seperti \u003ccode\u003e/agent review\u003c/code\u003e. Di GitLab ini masuk kategori Comment event / Note event.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePost comment balik\u003c/strong\u003e = pakai Notes API atau Discussions API untuk balas comment di MR.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCoolify deployment\u003c/strong\u003e = deploy container via Dockerfile atau Docker Compose, dengan env vars, volumes, dan domain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"flow-yang-gue-rekomendasikan\"\u003eFlow yang gue rekomendasikan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#flow-yang-gue-rekomendasikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eGitLab MR comment\n  \"/agent review\"\n        ↓\nGitLab Note Event Webhook\n        ↓\nCoolify app: webhook API\n        ↓\nValidate secret token + parse payload\n        ↓\nCheck command mention\n        ↓\nQueue review job\n        ↓\nWorker clone repo + checkout MR source branch\n        ↓\nFetch MR diff + existing discussions + project instructions\n        ↓\nRun agent review\n        ↓\nGenerate structured review report\n        ↓\nPost comment to GitLab MR\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePenting: \u003cstrong\u003ejangan jalankan agent langsung di HTTP request\u003c/strong\u003e. Webhook harus cepat balas \u003ccode\u003e200 OK\u003c/code\u003e, lalu kerja berat dijalankan di queue/worker.\u003c/p\u003e\n\u003ch2 id=\"arsitektur-coolify-yang-gue-pakai\"\u003eArsitektur Coolify yang gue pakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arsitektur-coolify-yang-gue-pakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue pisahkan API dan worker.\u003c/p\u003e\n\u003cp\u003eContoh konfigurasi Docker Compose minimal:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eservices\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eapi\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003ebuild\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e .\n    \u003cspan class=\"token key atrule\"\u003ecommand\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e node dist/server.js\n    \u003cspan class=\"token key atrule\"\u003eports\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"3000:3000\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eenvironment\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITLAB_BASE_URL=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITLAB_BASE_URL\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITLAB_TOKEN=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITLAB_TOKEN\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITLAB_WEBHOOK_SECRET=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITLAB_WEBHOOK_SECRET\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e AGENT_PROVIDER=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eAGENT_PROVIDER\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eopenai\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e OPENAI_API_KEY=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eOPENAI_API_KEY\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e ANTHROPIC_API_KEY=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eANTHROPIC_API_KEY\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e REDIS_URL=redis\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e//redis\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token number\"\u003e6379\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e WORKSPACE_DIR=/workspaces\n    \u003cspan class=\"token key atrule\"\u003evolumes\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e agent\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eworkspaces\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e/workspaces\n    \u003cspan class=\"token key atrule\"\u003edepends_on\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e redis\n\n  \u003cspan class=\"token key atrule\"\u003eworker\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003ebuild\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e .\n    \u003cspan class=\"token key atrule\"\u003ecommand\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e node dist/worker.js\n    \u003cspan class=\"token key atrule\"\u003eenvironment\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITLAB_BASE_URL=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITLAB_BASE_URL\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITLAB_TOKEN=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITLAB_TOKEN\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e OPENAI_API_KEY=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eOPENAI_API_KEY\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e ANTHROPIC_API_KEY=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eANTHROPIC_API_KEY\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e REDIS_URL=redis\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e//redis\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\u003cspan class=\"token number\"\u003e6379\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e WORKSPACE_DIR=/workspaces\n    \u003cspan class=\"token key atrule\"\u003evolumes\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e agent\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eworkspaces\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e/workspaces\n    \u003cspan class=\"token key atrule\"\u003edepends_on\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e redis\n\n  \u003cspan class=\"token key atrule\"\u003eredis\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eimage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e redis\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e7\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ealpine\n    \u003cspan class=\"token key atrule\"\u003evolumes\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e redis\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003edata\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e/data\n\n\u003cspan class=\"token key atrule\"\u003evolumes\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eagent-workspaces\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eredis-data\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"gitlab-setup-yang-gue-sarankan\"\u003eGitLab setup yang gue sarankan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#gitlab-setup-yang-gue-sarankan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi project GitLab:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSettings → Webhooks\u003c/li\u003e\n\u003cli\u003eURL: \u003ccode\u003ehttps://agent-domain-elo.com/webhooks/gitlab\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eEvent: Comments / Note events\u003c/li\u003e\n\u003cli\u003eSecret token: random secret\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi app, validasi header \u003ccode\u003eX-Gitlab-Token\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"trigger-command\"\u003eTrigger command\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trigger-command\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGunakan command eksplisit, jangan cuma \u003ccode\u003e@agent\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e/agent review\n/agent review security\n/agent review performance\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRule trigger yang gue pake:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eevent adalah \u003ccode\u003eNote Hook\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enoteable_type\u003c/code\u003e adalah \u003ccode\u003eMergeRequest\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ebody dimulai dengan \u003ccode\u003e/agent review\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eauthor bukan bot sendiri\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"permission-dan-token\"\u003ePermission dan token\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#permission-dan-token\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat bot user dengan token scope minimal.\u003c/p\u003e\n\u003cp\u003eUntuk review-only, token cukup dengan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread_repository\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapi\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan pakai token personal utama.\u003c/p\u003e\n\u003ch2 id=\"data-yang-worker-butuh\"\u003eData yang worker butuh\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#data-yang-worker-butuh\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWorker harus ambil:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProject ID\u003c/li\u003e\n\u003cli\u003eMR IID\u003c/li\u003e\n\u003cli\u003eSource branch\u003c/li\u003e\n\u003cli\u003eTarget branch\u003c/li\u003e\n\u003cli\u003eMR diff\u003c/li\u003e\n\u003cli\u003eMR title/description\u003c/li\u003e\n\u003cli\u003eExisting discussions jika perlu\u003c/li\u003e\n\u003cli\u003eRepository instructions seperti \u003ccode\u003eAGENTS.md\u003c/code\u003e atau \u003ccode\u003e.agent-review.md\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEndpoint GitLab yang relevan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eGET /projects/:id/merge_requests/:merge_request_iid\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eGET /projects/:id/merge_requests/:merge_request_iid/diffs\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eGET /projects/:id/merge_requests/:merge_request_iid/discussions\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePOST /projects/:id/merge_requests/:merge_request_iid/notes\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"comment-vs-discussion\"\u003eComment vs discussion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#comment-vs-discussion\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk MVP, gue pilih general comment dulu lewat Notes API.\u003c/p\u003e\n\u003cp\u003eDiscussion API bagus untuk thread atau diff comment, tapi itu bikin implementasi awal lebih rumit.\u003c/p\u003e\n\u003ch2 id=\"contoh-review-output-yang-gue-inginkan\"\u003eContoh review output yang gue inginkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-review-output-yang-gue-inginkan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent comment harus terstruktur, evidence-based, dan bukan opini dangkal.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Agent Code Review\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Summary\u003c/span\u003e\n\nFound 2 issues.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e####\u003c/span\u003e 1. Missing authorization check\u003c/span\u003e\nSeverity: High\nFile: \u003cspan class=\"token code-snippet code keyword\"\u003e`src/projects/project.controller.ts`\u003c/span\u003e\nEvidence: \u003cspan class=\"token code-snippet code keyword\"\u003e`PATCH /projects/:id/settings`\u003c/span\u003e checks authentication but does not check ownership.\nSuggested fix: call \u003cspan class=\"token code-snippet code keyword\"\u003e`requireProjectAdmin(user.id, project.id)`\u003c/span\u003e before update.\nConfidence: High\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e####\u003c/span\u003e 2. Possible N+1 query\u003c/span\u003e\nSeverity: Medium\nFile: \u003cspan class=\"token code-snippet code keyword\"\u003e`src/reports/billing.ts`\u003c/span\u003e\nEvidence: repository call inside loop over customers.\nSuggested fix: bulk fetch invoices by customer IDs.\nConfidence: Medium\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Verification\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Static review: completed\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Tests run: not run\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Security scan: not run\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Human review needed\u003c/span\u003e\n\nYes. Authorization logic should be checked by project owner.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"minimal-implementation-yang-gue-pikirkan\"\u003eMinimal implementation yang gue pikirkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#minimal-implementation-yang-gue-pikirkan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"serverts\"\u003e\u003ccode\u003eserver.ts\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#serverts\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenerima webhook, validasi token, parse payload, queue job.\u003c/p\u003e\n\u003ch3 id=\"workerts\"\u003e\u003ccode\u003eworker.ts\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workerts\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAmbil job, fetch MR info/diff/discussions, run review, post comment.\u003c/p\u003e\n\u003ch3 id=\"gitlabts\"\u003e\u003ccode\u003egitlab.ts\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#gitlabts\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eWrapper GitLab API untuk MR, diffs, discussions, notes.\u003c/p\u003e\n\u003ch2 id=\"clone-repo-atau-diff-only-review\"\u003eClone repo atau diff-only review?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#clone-repo-atau-diff-only-review\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk MVP, gue mulai dengan diff-only review dulu. Clone full repo bisa ditambahkan setelah komentar awal stabil.\u003c/p\u003e\n\u003cp\u003eFlow clone repo:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e1. Ambil MR metadata.\n2. Clone repo ke workspace.\n3. Checkout source branch.\n4. Baca `AGENTS.md` / `.agent-review.md`.\n5. Ambil diff.\n6. Jalankan review.\n7. Post comment.\n8. Hapus workspace atau simpan untuk audit.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"instruction-file-di-repo\"\u003eInstruction file di repo\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#instruction-file-di-repo\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContoh \u003ccode\u003e.agent-review.md\u003c/code\u003e yang gue taruh di repo:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Agent MR Review Instructions\u003c/span\u003e\n\nReview priorities:\n\u003cspan class=\"token list punctuation\"\u003e1.\u003c/span\u003e Security\n\u003cspan class=\"token list punctuation\"\u003e2.\u003c/span\u003e Correctness\n\u003cspan class=\"token list punctuation\"\u003e3.\u003c/span\u003e Data integrity\n\u003cspan class=\"token list punctuation\"\u003e4.\u003c/span\u003e Performance risks\n\u003cspan class=\"token list punctuation\"\u003e5.\u003c/span\u003e Maintainability\n\nDo not comment on style unless it affects readability or correctness.\n\nFor each finding, include:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e severity\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e file path\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e evidence from diff\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e why it matters\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e suggested fix\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e confidence\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"safety-guardrail\"\u003eSafety guardrail\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#safety-guardrail\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang gue tanam di awal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evalidasi webhook secret\u003c/li\u003e\n\u003cli\u003eallowlist project\u003c/li\u003e\n\u003cli\u003eallowlist trigger users\u003c/li\u003e\n\u003cli\u003eanti self-trigger\u003c/li\u003e\n\u003cli\u003eidempotency \u003ccode\u003eprojectId:mrIid:noteId\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003econcurrency limit\u003c/li\u003e\n\u003cli\u003etimeout\u003c/li\u003e\n\u003cli\u003ejangan auto-approve/merge\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"before-after-workflow\"\u003eBefore-after workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-after-workflow\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSebelum:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eDeveloper mention human senior.\nSenior buka MR, baca diff, komentar manual.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetelah MVP:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eDeveloper comment `/agent review security`.\nWorker ambil MR diff.\nAgent review.\nPost comment.\nSenior cek only high-risk findings.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"roadmap\"\u003eRoadmap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#roadmap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ewebhook + comment balik\u003c/li\u003e\n\u003cli\u003ediff-only LLM review\u003c/li\u003e\n\u003cli\u003einstructions file support\u003c/li\u003e\n\u003cli\u003eclone repo dan workspace\u003c/li\u003e\n\u003cli\u003escanner integration\u003c/li\u003e\n\u003cli\u003eoptional discussion thread\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenurut gue, MVP ini feasible di Coolify.\u003c/p\u003e\n\u003cp\u003eTarget pertama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapi service\u003c/li\u003e\n\u003cli\u003eworker service\u003c/li\u003e\n\u003cli\u003eredis\u003c/li\u003e\n\u003cli\u003eGitLab Note event trigger\u003c/li\u003e\n\u003cli\u003ereview-only comment response\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan mulai dari push/code-fix. Mulai dari review-only dulu.\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.gitlab-mr-comment-formatting\"\u003eCloud Agent Hands-on: MR Comment Formatting\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.references\"\u003eCloud Agent Hands-on References\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003egitlab (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecoolify (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emr-review (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.how-i-use-ai-to-code\"\u003eHow I Use AI to Code — literature note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.gitlab-mr-comment-forma
