s.agentic-engineering.cloud-agent.handson.reference.martin-fowler-harness-engineering","position":{"start":{"line":53,"column":3,"offset":3218},"end":{"line":53,"column":96,"offset":3311},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.cloud-agent.handson.reference.martin-fowler-harness-engineering"}},{"type":"wiki","from":{"fname":"zettel.1778001021442","id":"zettel.1778001021442","vaultName":"vault"},"value":"notes.agentic-engineering.cloud-agent.handson.reference.google-small-cls","position":{"start":{"line":54,"column":3,"offset":3314},"end":{"line":54,"column":79,"offset":3390},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.cloud-agent.handson.reference.google-small-cls"}},{"type":"wiki","from":{"fname":"zettel.1778001021442","id":"zettel.1778001021442","vaultName":"vault"},"value":"notes.agentic-engineering.cloud-agent.handson.reference.karpathy-keep-ai-on-the-leash","position":{"start":{"line":55,"column":3,"offset":3393},"end":{"line":55,"column":92,"offset":3482},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.cloud-agent.handson.reference.karpathy-keep-ai-on-the-leash"}},{"type":"wiki","from":{"fname":"zettel.1778001021442","id":"zettel.1778001021442","vaultName":"vault"},"value":"zettel.moc.agentic-engineering","position":{"start":{"line":56,"column":3,"offset":3485},"end":{"line":56,"column":37,"offset":3519},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.moc.agentic-engineering"}},{"from":{"fname":"zettel.literature.how-i-use-ai-to-code","id":"zettel.literature.how-i-use-ai-to-code","vaultName":"vault"},"type":"backlink","position":{"start":{"line":50,"column":3,"offset":2591},"end":{"line":50,"column":27,"offset":2615},"indent":[]},"value":"zettel.1778001021442"},{"from":{"fname":"zettel.moc.agentic-engineering","id":"zettel.moc.agentic-engineering","vaultName":"vault"},"type":"backlink","position":{"start":{"line":51,"column":3,"offset":3095},"end":{"line":51,"column":27,"offset":3119},"indent":[]},"value":"zettel.1778001021442"},{"from":{"fname":"notes.agentic-engineering.reference.karpathy-software-is-changing-again","id":"notes.agentic-engineering.reference.karpathy-software-is-changing-again","vaultName":"vault"},"type":"backlink","position":{"start":{"line":24,"column":3,"offset":1350},"end":{"line":24,"column":27,"offset":1374},"indent":[]},"value":"zettel.1778001021442"},{"from":{"fname":"daily.journal.2026.05.06","id":"daily.journal.2026.05.06","vaultName":"vault"},"type":"backlink","position":{"start":{"line":11,"column":14,"offset":600},"end":{"line":11,"column":41,"offset":627},"indent":[]},"value":"zettel.1778001021442"}],"anchors":{},"children":[],"parent":"zettel","data":{}},"body":"\u003ch1 id=\"agentic-engineering-differs-from-vibe-coding\"\u003eAgentic engineering differs from vibe coding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agentic-engineering-differs-from-vibe-coding\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eAI coding matang bukan sekadar menyuruh model menulis kode dan berharap benar.\nItu adalah vibe coding: output yang muncul cepat, tampak berhasil, dan dilanjutkan tanpa bukti.\u003c/p\u003e\n\u003cp\u003eAgentic engineering berbeda. Di sini AI boleh menghasilkan kode, tetapi setiap siklus kerja harus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekecil dan bounded,\u003c/li\u003e\n\u003cli\u003epunya satu tujuan jelas,\u003c/li\u003e\n\u003cli\u003epunya satu cara verifikasi jelas,\u003c/li\u003e\n\u003cli\u003etidak mencampur banyak keputusan sekaligus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e“Perubahan kecil” bukan berarti sedikit baris kode. Bisa saja 200 baris jika scope-nya masih satu konsep dengan satu risiko utama.\nYang kecil adalah ruang keputusan dan risiko, bukan jumlah baris.\u003c/p\u003e\n\u003cp\u003eSiklus kecil berarti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eplan kecil → implement kecil → verify → review → lanjut.\u003c/li\u003e\n\u003cli\u003ebukan: satu prompt besar lalu agent mengubah separuh repo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEvidence:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMartin Fowler: \"A well-built outer harness serves two goals: it increases the probability that the agent gets it right in the first place, and it provides a feedback loop that self-corrects as many issues as possible before they even reach human eyes.\"\u003c/li\u003e\n\u003cli\u003eMartin Fowler: \"Separately, you get either an agent that keeps repeating the same mistakes (feedback-only) or an agent that encodes rules but never finds out whether they worked (feed-forward-only).\"\u003c/li\u003e\n\u003cli\u003eGoogle Small CLs: \"In general, the right size for a CL is one self-contained change.\"\u003c/li\u003e\n\u003cli\u003eKarpathy: \"we're now kind of like cooperating with AIs and usually they are doing the generation and we as humans are doing the verification it is in our interest to make this loop go as fast as possible.\"\u003c/li\u003e\n\u003cli\u003eKarpathy: \"we have to keep the AI on the leash.\"\u003c/li\u003e\n\u003cli\u003eKarpathy: \"it's not useful to me to get a diff of 10,000 lines of code to my repo ... I'm still the bottleneck right even though that 10,000 lines come out instantly I have to make sure that this thing is not introducing bugs.\"\u003c/li\u003e\n\u003cli\u003eKarpathy: \"I'm always scared to get way too big diffs i always go in small incremental chunks i want to make sure that everything is good i want to spin this loop very very fast and I sort of work on small chunks of single concrete thing.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTerminology:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLeash = batas kontrol terhadap AI agar output tetap bisa diaudit.\u003c/li\u003e\n\u003cli\u003eSmall incremental chunks = unit kerja kecil dengan scope jelas, verification jelas, dan diff yang bisa ditelusuri.\u003c/li\u003e\n\u003cli\u003eGeneration-verification loop = AI generate → verify → lanjut.\u003c/li\u003e\n\u003cli\u003ePartial autonomy = autonomy slider yang disesuaikan dengan kompleksitas dan risiko task.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePertanyaan kunci:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKecil itu ukurannya apa?\n\u003cul\u003e\n\u003cli\u003esatu tujuan, satu risiko utama, satu cara verifikasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKenapa perubahan besar berbahaya?\n\u003cul\u003e\n\u003cli\u003ereview surface membesar, causal chain kabur, verification melemah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSimulasi vibe coding vs agentic engineering?\n\u003cul\u003e\n\u003cli\u003evibe coding memberi agent scope besar; agentic engineering memecah fitur menjadi langkah-langkah kecil dengan boundary eksplisit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eBagaimana membagi fitur besar?\n\u003cul\u003e\n\u003cli\u003edata/model → core logic → API boundary → verify → UI → edge cases → cleanup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eApa hubungan perubahan kecil dengan verification?\n\u003cul\u003e\n\u003cli\u003eperubahan kecil membuat verifikasi lebih murah, lebih spesifik, dan lebih bisa ditelusuri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The game is not ‘how fast can we build’ any more. It is ‘how fast can we tell whether this is right’.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eRelated: \u003ca href=\"/sotoy/notes/zettel.literature.how-i-use-ai-to-code\"\u003eHow I Use AI to Code — literature note\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.martin-fowler-harness-engineering\"\u003eMartin Fowler - Harness Engineering for Coding Agent Users\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003c
