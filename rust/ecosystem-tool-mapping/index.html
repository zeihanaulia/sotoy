sangat umum\u003c/strong\u003e di domain Rust backend. Ini fondasi hampir semua aplikasi async/networked Rust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"axum-cratesiocratesaxum\"\u003eAxum (\u003ca href=\"https://crates.io/crates/axum\"\u003ecrates.io/crates/axum\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#axum-cratesiocratesaxum\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: HTTP request routing / service framework yang fokus ergonomics dan modularity.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat populer\u003c/strong\u003e sekarang. Termasuk arus utama modern di komunitas Rust backend.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"actix-web-actixrs\"\u003eActix Web (\u003ca href=\"https://actix.rs/\"\u003eactix.rs\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#actix-web-actixrs\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: web framework yang sangat cepat dengan model actor/async.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003emasih relevan dan populer\u003c/strong\u003e, meski posisi momentum-nya sedikit di bawah Axum saat ini.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"sqlx-cratesiocratessqlx\"\u003eSQLx (\u003ca href=\"https://crates.io/crates/sqlx\"\u003ecrates.io/crates/sqlx\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sqlx-cratesiocratessqlx\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: async SQL crate dengan compile-time checked queries tanpa DSL berat.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat umum\u003c/strong\u003e di Rust async backend. Ini sering muncul di microservice async modern.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"diesel-dieselrs\"\u003eDiesel (\u003ca href=\"https://diesel.rs/\"\u003ediesel.rs\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#diesel-dieselrs\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: ORM/query builder tipe-safe dan composable.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003epenting\u003c/strong\u003e, tapi bukan satu-satunya default. Lebih cocok untuk tim yang ingin query builder/ORM kuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: untuk backend Rust modern, stack yang paling sering diasosiasikan adalah \u003cstrong\u003eTokio + Axum + SQLx\u003c/strong\u003e. Actix tetap besar; Diesel masih penting di niche ORM/query builder.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"frontend-web--browser-apps\"\u003eFrontend web / browser apps\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#frontend-web--browser-apps\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"webassembly-webassemblyorg\"\u003eWebAssembly (\u003ca href=\"https://webassembly.org/\"\u003ewebassembly.org\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#webassembly-webassemblyorg\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: target/teknologi runtime untuk menjalankan kode non-JS di browser.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003ebukan tool pengembang frontend umum\u003c/strong\u003e. Ini adalah jalur teknis untuk Rust di browser, tapi bukan mainstream frontend industry.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"yew-yewrs\"\u003eYew (\u003ca href=\"https://yew.rs/\"\u003eyew.rs\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yew-yewrs\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: framework frontend komponen untuk aplikasi Rust via WebAssembly.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003evalid dan dicintai komunitas Rust/WASM\u003c/strong\u003e, tapi \u003cstrong\u003eniche\u003c/strong\u003e dibanding JS/TS framework.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: Yew adalah opsi Rust/WASM yang sah untuk web frontend, tetapi bukan tool paling umum di dunia frontend luas.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"desktop-apps\"\u003eDesktop apps\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#desktop-apps\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"tauri-v2tauriapp\"\u003eTauri (\u003ca href=\"https://v2.tauri.app/\"\u003ev2.tauri.app\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tauri-v2tauriapp\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: toolkit cross-platform untuk desktop app dengan frontend webview dan backend Rust.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat penting di komunitas desktop Rust\u003c/strong\u003e. Namun secara industri luas, bukan pesaing langsung Electron/Qt/native SDK dominan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"egui-eguirs\"\u003eegui (\u003ca href=\"https://egui.rs/\"\u003eegui.rs\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#egui-eguirs\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: immediate-mode GUI murni Rust, cocok untuk tools dan internal UI.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003ecukup populer di komunitas Rust\u003c/strong\u003e, terutama untuk tooling, internal app, dan visualisasi. Tapi masih \u003cstrong\u003eniche\u003c/strong\u003e dibanding framework desktop global.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: Tauri dan egui adalah jalur desktop yang masuk akal untuk Rust, tapi kategori mereka lebih ke Rust-native desktop daripada mainstream desktop development.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"game-development--graphics--gpu\"\u003eGame development / graphics / GPU\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#game-development--graphics--gpu\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"bevy-bevyorg\"\u003eBevy (\u003ca href=\"https://bevy.org/\"\u003ebevy.org\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bevy-bevyorg\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: game engine Rust data-driven.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat menonjol di dunia Rust gamedev\u003c/strong\u003e. Namun dalam industri game global, masih jauh dari Unity/Unreal/Godot.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"wgpu-githubcomgfx-rswgpu\"\u003ewgpu (\u003ca href=\"https://github.com/gfx-rs/wgpu\"\u003egithub.com/gfx-rs/wgpu\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#wgpu-githubcomgfx-rswgpu\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: graphics API/library portable Rust berbasis WebGPU untuk rendering dan compute.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003epenting di ekosistem Rust graphics\u003c/strong\u003e dan digunakan sebagai fondasi oleh banyak proyek. Tapi ini lebih domain-specific.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: Bevy dan wgpu kuat di gamedev Rust/graphics Rust, tapi bukan dominasi industri game umum.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"embedded--firmware--kernel--systems\"\u003eEmbedded / firmware / kernel / systems\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#embedded--firmware--kernel--systems\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"embedded-rust-docsrust-embeddedorgbook\"\u003eEmbedded Rust (\u003ca href=\"https://docs.rust-embedded.org/book/\"\u003edocs.rust-embedded.org/book\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#embedded-rust-docsrust-embeddedorgbook\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: domain/tooling komunitas untuk Rust di bare-metal, microcontroller, dan IoT.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat penting di embedded Rust\u003c/strong\u003e, tapi jelas \u003cstrong\u003edomain khusus\u003c/strong\u003e dibanding developer umum.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"rust-for-linux-rust-for-linuxcom\"\u003eRust for Linux (\u003ca href=\"https://rust-for-linux.com/\"\u003erust-for-linux.com\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rust-for-linux-rust-for-linuxcom\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: proyek resmi untuk mendukung penulisan modul kernel Linux dengan Rust.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003estrategis penting\u003c/strong\u003e, tapi bukan tool harian kebanyakan developer. Ini lebih ke bukti penetrasi Rust di systems programming.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: keduanya penting secara strategis, tetapi kategori ini adalah domain spesialis, bukan opsi default bagi mayoritas developer.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"data-processing--analytics\"\u003eData processing / analytics\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#data-processing--analytics\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"polars-polars\"\u003ePolars (\u003ca href=\"https://pola.rs/\"\u003epola.rs\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#polars-polars\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: DataFrame/query engine Rust modern yang memakai Apache Arrow memory format.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003ecukup menonjol di data/analytics Rust modern\u003c/strong\u003e. Bukan tool harian semua engineer, tapi penting di domainnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apache-arrow-arrowapacheorg\"\u003eApache Arrow (\u003ca href=\"https://arrow.apache.org/\"\u003earrow.apache.org\u003c/a\u003e)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apache-arrow-arrowapacheorg\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eApa: format columnar memory lintas bahasa untuk analitik cepat dan interoperabilitas.\u003c/li\u003e\n\u003cli\u003eSeberapa umum: \u003cstrong\u003esangat penting sebagai fondasi\u003c/strong\u003e. Sering dipakai secara tidak langsung oleh tool lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003eRingkas: Polars sangat bernilai untuk data engineering di Rust. Arrow adalah substrate yang penting, tetapi lebih sering tersembunyi di bawah tool lain.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"bagaimana-membaca-post-ini\"\u003eBagaimana membaca post ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-membaca-post-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePost itu lebih tepat dibaca sebagai \u003cstrong\u003epeta jangkauan ekosistem Rust\u003c/strong\u003e, bukan daftar \"tool default semua developer\".\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAda jalur yang memang banyak dipakai di domain Rust tertentu.\u003c/li\u003e\n\u003cli\u003eAda juga item yang lebih populer di komunitas Rust, tapi tidak mainstream di industri luas.\u003c/li\u003e\n\u003cli\u003eItem-item domain-specific valid, tapi jangan disamakan dengan dominance global.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"level-yang-perlu-dibedakan\"\u003eLevel yang perlu dibedakan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-yang-perlu-dibedakan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eAda jalurnya\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePopuler di komunitas Rust\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMainstream di industri luas\u003c/strong\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTokio: mendekati level 2-3 di Rust backend.\u003c/li\u003e\n\u003cli\u003eAxum: kuat di level 2, sedang tumbuh.\u003c/li\u003e\n\u003cli\u003eYew / egui / Bevy: level 1-2.\u003c/li\u003e\n\u003cli\u003eEmbedded Rust / Rust for Linux: level 1 (strategis, domain-specific).\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"jika-ingin-lebih-lanjut\"\u003eJika ingin lebih lanjut\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#jika-ingin-lebih-lanjut\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau ingin, saya bisa buat peta rekomendasi stack Rust per domain:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eweb/API: apa yang dipilih sekarang,\u003c/li\u003e\n\u003cli\u003edesktop: pilihan Tauri vs egui,\u003c/li\u003e\n\u003cli\u003edata: pilihan Polars vs stack lain,\u003c/li\u003e\n\u003cli\u003eembedded/system: apa yang layak dipakai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003erust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eecosystem (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etools (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"priva ojects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinitio
