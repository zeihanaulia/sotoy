an bagaimana jawaban akhir disusun.\u003c/p\u003e\n\u003cp\u003eContoh yang bagus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePrompt 1: “Show me the Q4 2024 revenue for Amazon, Google, and Apple” → list.\u003c/li\u003e\n\u003cli\u003ePrompt 2: “Show me the Q4 2024 revenue for Amazon, Google and Apple and compare them in a table” → tabel.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni menunjukkan bahwa bahkan dalam sistem agentic, prompt tetap membentuk deliverable.\u003c/p\u003e\n\u003ch3 id=\"9-jadi-apa-yang-sebenarnya-diajarkan-bab-ini-1\"\u003e9) Jadi apa yang sebenarnya diajarkan bab ini?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-jadi-apa-yang-sebenarnya-diajarkan-bab-ini-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 13 mengajarkan empat ide inti:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAgent pertama lo bisa sangat sederhana.\u003c/li\u003e\n\u003cli\u003eAgent hidup dari kombinasi model reasoning, tools, control loop, dan guardrails.\u003c/li\u003e\n\u003cli\u003eAgent tidak magically tahu data real-time; dia berhasil karena diberi kemampuan mencari/bertindak.\u003c/li\u003e\n\u003cli\u003ePrompt engineering tetap relevan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi bab ini bukan “cara bikin super-agent.” Ini lebih seperti: cara bikin skeleton agent yang benar-benar hidup.\u003c/p\u003e\n\u003ch3 id=\"10-apa-yang-bab-ini-belum-lakukan-dan-kenapa-itu-penting-1\"\u003e10) Apa yang bab ini belum lakukan, dan kenapa itu penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-apa-yang-bab-ini-belum-lakukan-dan-kenapa-itu-penting-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 13 masih intro build chapter. Dia belum terlalu masuk ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etool custom design yang banyak\u003c/li\u003e\n\u003cli\u003ememory/state kompleks\u003c/li\u003e\n\u003cli\u003emulti-agent coordination\u003c/li\u003e\n\u003cli\u003erecovery loop lebih dalam\u003c/li\u003e\n\u003cli\u003epermission model\u003c/li\u003e\n\u003cli\u003ehuman approval gates\u003c/li\u003e\n\u003cli\u003eobservability\u003c/li\u003e\n\u003cli\u003eeval agents secara serius\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan itu bagus. Kalau semua itu dimasukkan sekaligus, pembaca akan kehilangan bentuk paling dasarnya.\u003c/p\u003e\n\u003cp\u003eJadi bab ini menjaga scope: agent minimal yang bisa dipahami end-to-end.\u003c/p\u003e\n\u003ch3 id=\"11-kutipan-paling-penting-dari-chapter-13-1\"\u003e11) Kutipan paling penting dari Chapter 13\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-kutipan-paling-penting-dari-chapter-13-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e“This chapter covers how to build them.”\u003c/li\u003e\n\u003cli\u003e“understanding the underlying mechanics ... is crucial for developers.”\u003c/li\u003e\n\u003cli\u003e“In these kinds of tasks, where the steps aren’t always the same, AI agents really shine.”\u003c/li\u003e\n\u003cli\u003e“an LLM, in its foundational state, does not possess real-time knowledge...”\u003c/li\u003e\n\u003cli\u003e“This allowed the agent to perform a web query...”\u003c/li\u003e\n\u003cli\u003e“The art and science of prompt engineering cannot be ignored.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"12-sintesis-besar-chapter-13-1\"\u003e12) Sintesis besar Chapter 13\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-sintesis-besar-chapter-13-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 13 menunjukkan bagaimana membangun agent pertama secara code-based dengan fokus pada fondasi, bukan kemewahan framework. Penulis memakai use case pencarian revenue Q4 2024 untuk memperlihatkan bahwa agent berguna ketika langkah-langkah penyelesaian tidak bisa ditulis secara fixed dan membutuhkan akses ke dunia luar, seperti web search. Dengan menggunakan model reasoning, base tools, dan guardrails seperti max_steps, agent pertama ini memperlihatkan loop dasar agentic behavior: menerima goal, merencanakan langkah, memakai tool, lalu mengembalikan hasil. Bab ini juga menekankan bahwa keberhasilan agent bukan karena model mengetahui segalanya, melainkan karena ia diberi tool yang tepat. Dan meskipun sudah agentic, prompt engineering tetap penting karena cara user menyatakan goal masih sangat memengaruhi bentuk deliverable akhir.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan jadi satu kalimat:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 13 adalah bab yang mengubah definisi agent dari konsep abstrak menjadi loop kerja minimal yang bisa lo bangun, lihat, dan uji.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi yang sedang terjadi di Chapter 13 ini?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePenulis sedang menunjukkan bahwa agent pertama bukanlah monster kompleks, melainkan kombinasi sederhana antara model, tools, batas langkah, dan goal yang ditulis dengan baik.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDan begitu kombinasi itu jalan, lo mulai bisa melihat kenapa agent berbeda dari chatbot atau workflow AI biasa.\u003c/p\u003e\n\u003ch2 id=\"chapter-14-extending-agents-with-tools\"\u003eChapter 14: Extending Agents with Tools\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-14-extending-agents-with-tools\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau Chapter 13 itu membangun agent pertama yang masih relatif “aman” karena hidup dari base tools bawaan, maka Chapter 14 adalah titik ketika buku bilang:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eagent baru benar-benar menarik kalau dia bisa menyentuh dunia yang tidak bisa disentuh LLM secara native.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eItu inti bab ini.\u003c/p\u003e\n\u003cp\u003eAda satu kutipan pembuka yang menurut gue paling berat maknanya:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“True agency requires the ability to interact with resources an LLM typically cannot access directly, such as a locally hosted database containing private data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat ini memotong satu ilusi besar: orang sering mengira agent itu sudah “agentic” hanya karena bisa browsing web. Padahal browsing web itu baru memperluas chat ke internet publik. Itu belum otomatis berarti agent bisa masuk ke:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edatabase internal,\u003c/li\u003e\n\u003cli\u003efilesystem,\u003c/li\u003e\n\u003cli\u003eCRM,\u003c/li\u003e\n\u003cli\u003eobservability stack,\u003c/li\u003e\n\u003cli\u003esistem pembayaran,\u003c/li\u003e\n\u003cli\u003einventory,\u003c/li\u003e\n\u003cli\u003eAWS billing,\u003c/li\u003e\n\u003cli\u003eexpense manager,\u003c/li\u003e\n\u003cli\u003eatau tool privat lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi bab ini sebenarnya sedang menggeser kita dari:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eagent as internet-aware assistant\u003c/strong\u003e\nmenjadi\n\u003cstrong\u003eagent as system-integrated operator\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"1-search-the-internet-itu-belum-cukup\"\u003e1) “search the internet” itu belum cukup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-search-the-internet-itu-belum-cukup\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis membuka dengan posisi yang sangat bagus:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“We’ve made progress by enabling the AI to search the internet... However, this still keeps the AI tethered to publicly available information... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting banget.\u003c/p\u003e\n\u003cp\u003eKarena di chapter sebelumnya agent sudah bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esearch,\u003c/li\u003e\n\u003cli\u003ecari report,\u003c/li\u003e\n\u003cli\u003eambil angka revenue,\u003c/li\u003e\n\u003cli\u003ejawab user.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKelihatannya sudah hebat. Tapi penulis bilang: tunggu dulu, itu masih \u003cstrong\u003epublic-data agent\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"2-tools--jalan-resmi-bagi-llm-untuk-bertindak\"\u003e2) Tools = jalan resmi bagi LLM untuk bertindak\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-tools--jalan-resmi-bagi-llm-untuk-bertindak\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis lalu bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“These frameworks enable developers to construct custom tools that act as secure pathways... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKata yang paling penting di sini adalah \u003cstrong\u003esecure pathways\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eTools bukan cuma fungsi Python yang bisa dipanggil. Tools adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekontrak kemampuan,\u003c/li\u003e\n\u003cli\u003ebatas akses,\u003c/li\u003e\n\u003cli\u003ebentuk aksi yang diperbolehkan,\u003c/li\u003e\n\u003cli\u003ejembatan antara LLM dan sistem luar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi tool itu bukan sekadar convenience API. Dia adalah \u003cstrong\u003egoverned interface\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"3-contoh-pertama-simpan-stock-price-ke-file\"\u003e3) Contoh pertama: simpan stock price ke file\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-contoh-pertama-simpan-stock-price-ke-file\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis memberi contoh sederhana tapi tepat:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Find the latest stock price for Apple, Google and Amazon. Convert that into a table and save it to a file.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting karena dia menggabungkan dua hal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eambil data publik\u003c/li\u003e\n\u003cli\u003elakukan aksi lokal nonpublik, yaitu simpan ke file\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDan penulis langsung bilang bahwa agent secara inheren gak punya kemampuan menyimpan file.\u003c/p\u003e\n\u003cp\u003eItu mengingatkan kita bahwa perbedaan antara:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003emenghasilkan teks yang tampak seperti isi file\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003edan\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ebenar-benar menyimpan file\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eitu besar sekali.\u003c/p\u003e\n\u003ch3 id=\"4-tool-itu-sederhana-tapi-konsepnya-besar\"\u003e4) \u003ccode\u003e@tool\u003c/code\u003e itu sederhana, tapi konsepnya besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-tool-itu-sederhana-tapi-konsepnya-besar\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh \u003ccode\u003e@tool\u003c/code\u003e terlihat sederhana, tapi konsep di baliknya sangat penting.\u003c/p\u003e\n\u003cp\u003eDengan \u003ccode\u003e@tool\u003c/code\u003e, fungsi Python biasa berubah menjadi sesuatu yang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebisa “dilihat” agent,\u003c/li\u003e\n\u003cli\u003ebisa “dipahami” agent,\u003c/li\u003e\n\u003cli\u003ebisa “dipanggil” agent,\u003c/li\u003e\n\u003cli\u003edan punya signature yang jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi decorator ini bukan cuma sintaks manis. Dia mengangkat fungsi lokal menjadi \u003cstrong\u003ecapability surface untuk model\u003c/strong\u003e.\u003c/p\u003e\n\u003ch3 id=\"5-nama-fungsi-type-hints-docstring--ini-bukan-detail-kosmetik\"\u003e5) Nama fungsi, type hints, docstring — ini bukan detail kosmetik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-nama-fungsi-type-hints-docstring--ini-bukan-detail-kosmetik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni salah satu bagian paling penting di bab ini.\u003c/p\u003e\n\u003cp\u003ePenulis menekankan bahwa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enama fungsi harus deskriptif,\u003c/li\u003e\n\u003cli\u003etype hints harus lengkap,\u003c/li\u003e\n\u003cli\u003edocstring harus jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi konteks agent, ini bukan hanya dokumen untuk manusia. Ini adalah \u003cstrong\u003einstruction manual untuk LLM\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eTool definition jadi prompt engineering juga. Jika nama atau docstring tool buruk, model bisa salah memilih atau salah menggunakan tool.\u003c/p\u003e\n\u003ch3 id=\"6-lalu-muncul-masalah-berikutnya-reusability\"\u003e6) Lalu muncul masalah berikutnya: reusability\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-lalu-muncul-masalah-berikutnya-reusability\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKetika tool custom banyak, masalahnya cepat berubah menjadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egovernance,\u003c/li\u003e\n\u003cli\u003ereuse,\u003c/li\u003e\n\u003cli\u003estandardization,\u003c/li\u003e\n\u003cli\u003emaintainability.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi sinilah bab ini memperkenalkan MCP.\u003c/p\u003e\n\u003ch3 id=\"7-mcp-kenapa-ini-penting-banget\"\u003e7) MCP: kenapa ini penting banget?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-mcp-kenapa-ini-penting-banget\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This is precisely the problem that the MCP is designed to solve.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMCP bukan hanya tentang tool. MCP adalah protokol standar untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagent/client,\u003c/li\u003e\n\u003cli\u003etool/server,\u003c/li\u003e\n\u003cli\u003eresources,\u003c/li\u003e\n\u003cli\u003eprompts.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDia seperti USB-C atau HTTP untuk dunia agent-tool integration.\u003c/p\u003e\n\u003ch3 id=\"8-mcp-itu-bukan-cuma-tools\"\u003e8) MCP itu bukan cuma tools\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-mcp-itu-bukan-cuma-tools\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMCP memungkinkan tiga komponen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTools,\u003c/li\u003e\n\u003cli\u003eResources,\u003c/li\u003e\n\u003cli\u003ePrompts.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting karena artinya MCP bukan hanya remote function calling, tapi juga:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eexpose data,\u003c/li\u003e\n\u003cli\u003eexpose context,\u003c/li\u003e\n\u003cli\u003eexpose workflow templates.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"9-client-server-model-mcp-ini-cara-mikir-arsitektur\"\u003e9) Client-server model MCP: ini cara mikir arsitektur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-client-server-model-mcp-ini-cara-mikir-arsitektur\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMCP berjalan dengan model client-server:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehost application,\u003c/li\u003e\n\u003cli\u003eMCP client,\u003c/li\u003e\n\u003cli\u003eMCP server.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni menunjukkan bahwa agent bukan monolit. Ada layer yang jelas, dan debugging bisa dilakukan per layer.\u003c/p\u003e\n\u003ch3 id=\"10-special-calculator-kenapa-contoh-ini-sengaja-konyol\"\u003e10) Special Calculator: kenapa contoh ini sengaja konyol?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-special-calculator-kenapa-contoh-ini-sengaja-konyol\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh kalkulator aneh ini cerdas. Jika tool memberikan hasil yang salah secara matematis, lalu agent tetap benar, berarti agent benar-benar memanggil tool. Itu membuat mekanisme lebih transparan.\u003c/p\u003e\n\u003ch3 id=\"11-nama-server-dan-instruction-server-juga-penting\"\u003e11) Nama server dan instruction server juga penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-nama-server-dan-instruction-server-juga-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eServer name dan instructions tidak hanya buat developer. Mereka juga menjadi “onboarding prompt” untuk agent.\u003c/p\u003e\n\u003cp\u003eIni menegaskan lagi bahwa deskripsi interface adalah bagian dari intelligence surface.\u003c/p\u003e\n\u003ch3 id=\"12-mcptool--type-hints--schema-generation\"\u003e12) \u003ccode\u003e@mcp.tool\u003c/code\u003e + type hints = schema generation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-mcptool--type-hints--schema-generation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eType hints di sini bukan cuma untuk IDE. Mereka jadi dasar JSON schema yang dipakai client/LLM untuk memahami parameter tool.\u003c/p\u003e\n\u003cp\u003eIni membuat tool contract menjadi bagian dari runtime.\u003c/p\u003e\n\u003ch3 id=\"13-postman-testing-pola-engineering-yang-sehat\"\u003e13) Postman testing: pola engineering yang sehat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-postman-testing-pola-engineering-yang-sehat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum integrasi ke Claude Desktop, MCP server dites dulu dengan Postman.\u003c/p\u003e\n\u003cp\u003eIni menunjukkan praktik yang matang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ebuild deterministic layer,\u003c/li\u003e\n\u003cli\u003euji kontrak,\u003c/li\u003e\n\u003cli\u003ebaru integrasi ke nondeterministic layer.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"14-claude-desktop-integration-demo-bahwa-tool-benar-benar-hidup\"\u003e14) Claude Desktop integration: demo bahwa tool benar-benar hidup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-claude-desktop-integration-demo-bahwa-tool-benar-benar-hidup\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni bukan soal Claude. Ini soal membuktikan bahwa kemampuan tool yang lo bangun bisa muncul di AI client sebenarnya.\u003c/p\u003e\n\u003cp\u003eKetika AI client bisa menemukan tool, memanggil server, dan memakai hasilnya, maka MCP berhasil.\u003c/p\u003e\n\u003ch3 id=\"15-stdio-vs-http-perbedaan-deployment-topology\"\u003e15) stdio vs HTTP: perbedaan deployment topology\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-stdio-vs-http-perbedaan-deployment-topology\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDengan transport stdio, MCP cocok untuk lokal dan development.\nDengan HTTP, MCP bisa jadi shared capability server untuk banyak client.\u003c/p\u003e\n\u003cp\u003eItu penting, karena sekarang MCP bisa dipikirkan sebagai infrastruktur, bukan sekadar script lokal.\u003c/p\u003e\n\u003ch3 id=\"16-complex-schemas-dengan-pydantic-dari-demo-ke-dunia-nyata\"\u003e16) Complex schemas dengan Pydantic: dari demo ke dunia nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-complex-schemas-dengan-pydantic-dari-demo-ke-dunia-nyata\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePenulis menunjukkan bahwa tool nyata sering butuh input/output terstruktur. Pydantic dipakai untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evalidasi input,\u003c/li\u003e\n\u003cli\u003egenerate schema,\u003c/li\u003e\n\u003cli\u003emempertegas contract.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni mendorong tool dari proof-of-concept ke real integration.\u003c/p\u003e\n\u003ch3 id=\"17-jadi-sebenarnya-bab-ini-sedang-membangun-apa\"\u003e17) Jadi sebenarnya bab ini sedang membangun apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-jadi-sebenarnya-bab-ini-sedang-membangun-apa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 14 sedang membangun tiga level kedewasaan tooling:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003elocal tool\u003c/li\u003e\n\u003cli\u003ereusable protocol\u003c/li\u003e\n\u003cli\u003eproduction-ish integration\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eBukan cuma “nambah tool,” tapi “ubah kemampuan software biasa menjadi capability agentic yang bisa dipakai lintas client.”\u003c/p\u003e\n\u003ch3 id=\"18-kutipan-paling-penting-dari-chapter-14\"\u003e18) Kutipan paling penting dari Chapter 14\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#18-kutipan-paling-penting-dari-chapter-14\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e“True agency requires the ability to interact with resources an LLM typically cannot access directly... ”\u003c/li\u003e\n\u003cli\u003e“custom tools ... act as secure pathways... ”\u003c/li\u003e\n\u003cli\u003e“The \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003e@tool (Private)\u003c/a\u003e decorator ... turn one of your functions into a tool that the agent’s LLM can understand and use.”\u003c/li\u003e\n\u003cli\u003e“The docstring ... [is] the primary instruction manual for the agent’s LLM...”\u003c/li\u003e\n\u003cli\u003e“This is precisely the problem that the MCP is designed to solve.”\u003c/li\u003e\n\u003cli\u003e“MCP proposes a standard set of rules and a common language... ”\u003c/li\u003e\n\u003cli\u003e“Users can interact with complex systems without needing to fully understand their underlying mechanisms.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"19-sintesis-besar-chapter-14\"\u003e19) Sintesis besar Chapter 14\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#19-sintesis-besar-chapter-14\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau gue ringkas dalam satu paragraf:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 14 menunjukkan bahwa agent baru benar-benar memiliki agency ketika ia dapat menggunakan tool untuk mengakses data privat dan melakukan aksi nyata di luar kemampuan native LLM. Bab ini mulai dari level paling dasar—membungkus fungsi Python biasa menjadi tool dengan decorator, type hints, dan docstring—lalu naik ke persoalan yang lebih besar: bagaimana tool-tool itu bisa reusable dan standar lintas agent. Di titik itu, MCP diperkenalkan sebagai protokol bersama yang memungkinkan AI clients dan tool servers berkomunikasi dengan bahasa yang sama. Dengan membangun MCP server sederhana, mengujinya lewat Postman, lalu menghubungkannya ke Claude Desktop, bab ini menunjukkan bagaimana kemampuan software biasa bisa diubah menjadi kapabilitas yang benar-benar hidup di dalam AI client.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau dipadatkan jadi satu kalimat:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChapter 14 adalah bab yang mengubah agent dari pengguna web menjadi operator sistem.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eJadi sebenarnya yang sedang terjadi di Chapter 14 ini?\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePenulis sedang membuka pintu antara AI dan dunia software nyata.\u003c/strong\u003e\nBukan dengan memberi akses liar ke semuanya, tapi dengan membangun antarmuka yang tegas, reusable, dan bisa diaudit: tools dan MCP.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-developers-guide-to-ai\"\u003eThe Developer's Guide to AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands
