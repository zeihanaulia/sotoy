nya dengan secret scanner biasa","value":"apa-bedanya-dengan-secret-scanner-biasa","line":36,"column":0,"depth":3},"bentuk-idealnya":{"type":"header","text":"Bentuk idealnya","value":"bentuk-idealnya","line":40,"column":0,"depth":3},"atomic-idea-lain":{"type":"header","text":"Atomic idea lain","value":"atomic-idea-lain","line":47,"column":0,"depth":3},"hubungkan-ide-ini-dengan":{"type":"header","text":"Hubungkan ide ini dengan","value":"hubungkan-ide-ini-dengan","line":54,"column":0,"depth":3},"sumber":{"type":"header","text":"Sumber","value":"sumber","line":73,"column":0,"depth":2}},"children":[],"parent":"zettel","data":{}},"body":"\u003ch1 id=\"audit-trust-boundary-lokal-sebagai-ide-keamanan-developer\"\u003eAudit trust boundary lokal sebagai ide keamanan developer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#audit-trust-boundary-lokal-sebagai-ide-keamanan-developer\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eGue tangkep satu atomic idea penting: \u003c/p\u003e\n\u003cp\u003eAudit keamanan developer harus memperlakukan workstation sebagai trust boundary.\nItu berarti fokus bukan hanya pada \"apakah ada secret di repo\", tapi juga pada:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efile/manifest lokal yang bisa mengalirkan akses atau secret\u003c/li\u003e\n\u003cli\u003eproses yang jalan dengan privilege tinggi atau baca sensitive file\u003c/li\u003e\n\u003cli\u003etooling/extension yang punya izin runtime untuk mengeksekusi command atau akses auth\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau idea ini diambil murni, outputnya adalah sebuah preflight check lokal: sebuah indicator untuk menilai apakah environment dev terlalu terbuka sebelum kasih tool agentic akses.\u003c/p\u003e\n\u003ch3 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena di era agentic coding, risiko bukan hanya codebase. Workstation developer sendiri jadi channel attack surface.\u003c/p\u003e\n\u003ch3 id=\"apa-yang-harus-diaudit\"\u003eApa yang harus diaudit\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-harus-diaudit\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003efile credential dan config lokal, termasuk \u003ccode\u003e~/.aws\u003c/code\u003e, \u003ccode\u003e~/.kube\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, \u003ccode\u003e.npmrc\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003emanifest dan script yang bisa memicu \u003ccode\u003ecurl | bash\u003c/code\u003e, auth provider, atau extension execution\u003c/li\u003e\n\u003cli\u003eprocess dengan privilege tinggi atau sensitive FD\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apa-bedanya-dengan-secret-scanner-biasa\"\u003eApa bedanya dengan secret scanner biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-bedanya-dengan-secret-scanner-biasa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSecret scanner biasa cuma ngasih jawaban \"ada secret\" atau \"enggak\". Ide ini nambah konteks: \"siapa yang bisa akses secret itu sekarang?\" dan \"apa tool lokal yang bisa nge-trigger eksfiltrasi?\"\u003c/p\u003e\n\u003ch3 id=\"bentuk-idealnya\"\u003eBentuk idealnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bentuk-idealnya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003edeterministic, offline, lokal\u003c/li\u003e\n\u003cli\u003erule-based indicator, bukan verdict final\u003c/li\u003e\n\u003cli\u003eoutputnya bisa ditriage di workflow developer\u003c/li\u003e\n\u003cli\u003ebisa jadi preflight sebelum tool agentic dijalankan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"atomic-idea-lain\"\u003eAtomic idea lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#atomic-idea-lain\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ePreflight indicator, bukan verdict: audit lokal harus jadi sinyal awal untuk triage, bukan klaim serangan pasti.\u003c/li\u003e\n\u003cli\u003eGabungkan file + manifest + process sebagai satu sinyal: deteksi risiko lebih kuat ketika secret/file warning dikaitkan dengan process privilege dan script/manifest execution.\u003c/li\u003e\n\u003cli\u003eLocal audit harus deterministik/offline: jangan tambah trust dependency baru dengan mengirim data ke cloud.\u003c/li\u003e\n\u003cli\u003eRule-based hardcoded cukup untuk prototype, tapi bentuknya harus warning/indicator supaya blind spot tidak jadi penilaian final.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"hubungkan-ide-ini-dengan\"\u003eHubungkan ide ini dengan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungkan-ide-ini-dengan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust-evaluation\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.agentic-coding-permission-boundary\"\u003eAgentic coding permission boundary dan risiko filesystem lokal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-docs\"\u003eDeepsec docs: workflow harness, bukan scanner sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260421193301\"\u003eMethodology wajib ada supaya AI-assisted development tidak jadi chaos yang efisien\u003c/a\u003e — methodology AI-assisted untuk mencegah chaos agentic.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260421174123\"\u003eBMAD Quick Dev mengoptimalkan attention manusia, bukan sekadar kecepatan model\u003c/a\u003e — boundary cerdas sebelum model dibiarkan berjalan sendiri.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260419193541\"\u003ePlan AI bukan sekadar to-do list; ia adalah artefak governance operasional\u003c/a\u003e — plan sebagai artefak governance operasional untuk preflight dan eksekusi aman.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179967\"\u003eAgentic coding tools adalah process dengan permission, bukan autocomplete\u003c/a\u003e — agentic coding sebagai process dengan permission boundary.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179968\"\u003eWorkstation trust boundary adalah attack surface utama di era AI-native engineering\u003c/a\u003e — workstation trust boundary sebagai attack surface AI-native.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e — local deterministic scanner melengkapi AI scanner.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179972\"\u003eSecret exposure bisa terjadi tanpa commit Git\u003c/a\u003e — secret exposure bisa terjadi tanpa commit Git.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179946\"\u003eWorkstation trust boundary jadi serangan utama di era agentic coding\u003c/a\u003e — workstation trust boundary jadi serangan utama di era agentic coding.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e — sandbox dan boundary adalah persyaratan untuk tool agentic aman.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e — security harness lebih penting daripada single AI agent.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e — keamanan AI-native sebagai kebiasaan harian.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sumber\"\u003eSumber\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sumber\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/cheese-cakee/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.references/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust-evaluation\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #a03623;\" href=\"/sotoy/notes/tags.zettel\"\u003ezettel\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c
