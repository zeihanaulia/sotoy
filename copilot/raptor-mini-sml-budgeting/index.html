 yang berubah setelah Copilot pindah ke AI Credits?","value":"5-apa-yang-berubah-setelah-copilot-pindah-ke-ai-credits","line":114,"column":0,"depth":2},"6-temuan-riset-terbaru":{"type":"header","text":"6. Temuan riset terbaru","value":"6-temuan-riset-terbaru","line":126,"column":0,"depth":2},"61-arti-riset-ini-untuk-workflow-agent":{"type":"header","text":"6.1 Arti riset ini untuk workflow agent","value":"61-arti-riset-ini-untuk-workflow-agent","line":136,"column":0,"depth":3},"7-kenapa-thread-theo-penting":{"type":"header","text":"7. Kenapa thread Theo penting","value":"7-kenapa-thread-theo-penting","line":143,"column":0,"depth":2},"respons-penting-dari-thread":{"type":"header","text":"Respons penting dari thread","value":"respons-penting-dari-thread","line":153,"column":0,"depth":3},"71-subsidy-adoption-dan-data":{"type":"header","text":"7.1 Subsidy, adoption, dan data","value":"71-subsidy-adoption-dan-data","line":174,"column":0,"depth":3},"8-praktik-yang-masuk-akal-untuk-elo":{"type":"header","text":"8. Praktik yang masuk akal untuk elo","value":"8-praktik-yang-masuk-akal-untuk-elo","line":187,"column":0,"depth":2}},"children":[],"parent":"notes.copilot","data":{}},"body":"\u003ch1 id=\"raptor-mini-sml-dan-billing-copilot-yang-pindah-ke-token\"\u003eRaptor mini, SML, dan billing Copilot yang pindah ke token\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#raptor-mini-sml-dan-billing-copilot-yang-pindah-ke-token\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eIstilah yang gue pakai: SML = Small Language Model, model lokal yang masih realistis jalan di mesin pribadi. Bukan Standard ML.\u003c/p\u003e\n\u003cp\u003eGue nulis ini untuk ngetrack apa yang masih realistis buat agent coding lokal, dan apa saja yang berubah setelah Copilot billing pindah ke token.\u003c/p\u003e\n\u003cp\u003eMenurut gue, untuk konteks, \"model kecil\" bukan cuma 1B–3B. Yang masuk akal buat coding agent pribadi adalah model kira-kira 7B, 14B, 16B MoE, sampai 30B quantized. 1B–3B biasanya terlalu lemah buat rebranding lintas repo.\u003c/p\u003e\n\u003cp\u003eUntuk rekomendasi model/token murah yang lebih fokus ke agent coding, ada catatan terpisah: \u003ca href=\"/sotoy/notes/notes.copilot.token-cheap-coding-agent-providers\"\u003eToken murah untuk coding agent\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eIntinya: bisa, tapi jangan harap SML bikin workflow otomatis setara Raptor/Copilot agent. Yang bikin Raptor terasa powerful bukan cuma modelnya. Ada tiga lapis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel coding yang cukup kuat,\u003c/li\u003e\n\u003cli\u003eagent harness yang jelas,\u003c/li\u003e\n\u003cli\u003econtext engineering yang rapi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau elo pakai SML lokal, yang ingin dicontoh bukan hanya modelnya, tapi struktur kerjanya.\u003c/p\u003e\n\u003ch2 id=\"bukti-dan-referensi\"\u003eBukti dan referensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bukti-dan-referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGitHub Blog: artikel Copilot agent workflow \u003ca href=\"https://github.blog/ai-and-ml/github-copilot/how-to-build-reliable-ai-workflows-with-agentic-primitives-and-context-engineering/\"\u003eHow to build reliable AI workflows with agentic primitives and context engineering\u003c/a\u003e menekankan bahwa Copilot CLI menggabungkan model dengan agent primitives dan context engineering, bukan sekadar inferensi model lokal.\u003c/li\u003e\n\u003cli\u003eLangChain: artikel \u003ca href=\"https://www.langchain.com/blog/the-anatomy-of-an-agent-harness\"\u003eThe Anatomy of an Agent Harness\u003c/a\u003e menyatakan secara eksplisit bahwa \u003ccode\u003eAgent = Model + Harness\u003c/code\u003e dan bahwa model sendiri tidak bisa menjalankan tools, menyimpan state, atau mengakses realtime knowledge tanpa harness.\u003c/li\u003e\n\u003cli\u003eRaptor Mini: artikel DEV \u003ca href=\"https://dev.to/koolkamalkishor/raptor-mini-github-copilots-new-code-first-ai-model-that-developers-shouldnt-ignore-44a4\"\u003eRaptor Mini: GitHub Copilot’s New Code-First AI Model That Developers Shouldn’t Ignore\u003c/a\u003e menjelaskan bahwa Raptor Mini dirancang untuk tool calling, multi-file editing, dan code-aware agents, jadi keunggulannya bukan cuma ukuran model kecil.\u003c/li\u003e\n\u003cli\u003eGitHub Copilot local agent docs / commentary: dokumentasi \u003ca href=\"https://code.visualstudio.com/docs/copilot/agents/local-agents\"\u003eLocal agents in Visual Studio Code\u003c/a\u003e menjelaskan bahwa local Copilot agents di VS Code berjalan langsung di VS Code dengan full access ke workspace tools, MCP servers, extensions, dan BYOK model support. Ini menegaskan bahwa local model hanya bisa “works” kalau dipasangkan dengan agent/tooling yang benar.\u003c/li\u003e\n\u003cli\u003eDHH: artikel \u003ca href=\"https://world.hey.com/dhh/local-llms-are-how-nerds-now-justify-a-big-computer-they-don-t-need-af2fcb7b\"\u003eLocal LLMs are how nerds now justify a big computer they don't need\u003c/a\u003e menegaskan bahwa local LLMs masih jauh di belakang frontier models dan untuk sebagian besar developer lebih cocok sebagai curiosity daripada daily driver.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"1-apakah-ada-model-kecil-yang-cocok\"\u003e1. Apakah ada model kecil yang cocok?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-apakah-ada-model-kecil-yang-cocok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk kebutuhan personal coding agent, bottleneck-nya bukan hanya \"bisa run model lokal atau enggak\", tapi kombinasi model size + context length + speed. Local agent GitHub Copilot di VS Code mendukung BYOK model secara eksplisit, jadi model lokal bisa dipakai asalkan harness dan toolingnya juga fit.\u003c/p\u003e\n\u003ch3 id=\"11-mac-m1-16gb-target-realistis\"\u003e1.1 Mac M1 16GB: target realistis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-mac-m1-16gb-target-realistis\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk Mac M1 16GB, target lo adalah model lokal yang cukup kuat tapi tidak memaksa swap. Model paling baru belum tentu cocok: yang penting adalah model yang bisa patuh pada workflow agent dan berjalan stabil.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebaseline paling masuk akal: \u003ccode\u003eqwen2.5-coder:7b\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ecomparator instruction-following: \u003ccode\u003eqwen3:8b\u003c/code\u003e bisa dicoba sebagai planner/inventory model.\u003c/li\u003e\n\u003cli\u003eheavier experiment: \u003ccode\u003edeepseek-coder-v2:lite\u003c/code\u003e jika lo butuh reasoning coding lebih berat.\u003c/li\u003e\n\u003cli\u003ebenchmark pendek saja: \u003ccode\u003eqwen2.5-coder:14b\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ejangan jadikan \u003ccode\u003eqwen3-coder:30b\u003c/code\u003e daily driver di M1 16GB.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePerlu dicatat: kalau \u003ccode\u003eqwen2.5-coder:7b\u003c/code\u003e terasa stuck atau lambat lewat GitHub Copilot, kemungkinan besar bukan karena modelnya mati. Lebih mungkin karena Copilot mengirim packaging agent yang berat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esystem prompt / tool schema besar,\u003c/li\u003e\n\u003cli\u003erepo context besar dan chat history,\u003c/li\u003e\n\u003cli\u003eagent protocol / tool-call format,\u003c/li\u003e\n\u003cli\u003emetadata file / domain rules.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi Mac M1 16GB, Qwen 7B masih bisa cepat untuk chat kecil. Tapi ketika ia dibungkus oleh Copilot agent, ia bisa ter-overload dan terlihat stuck.\u003c/p\u003e\n\u003cp\u003eDari pengamatan saat nge-debug alur Copilot, pola yang muncul cukup jelas: untuk input sekecil “hi”, Copilot masih mengirim sekitar 12k token ke model. Latensi model lokal bisa melonjak jadi 124–302 detik. Jadi masalahnya bukan hanya “hi” yang berat—itu adalah 12k token boilerplate + system prompt/tool prompt/context.\u003c/p\u003e\n\u003cp\u003eMasalah ini semakin parah kalau sistem sudah swap. Kalau RAM lo sudah di angka 14.7GB dan swap 6.8GB, model inference lokal bisa lambat sekali. macOS unified memory, Metal, cache, dan memory pressure yang kuning/oranye biasanya berarti sebagian kerja sudah didorong ke disk.\u003c/p\u003e\n\u003cp\u003eUntuk rekomendasi hardware local LLM, pindah ke note terpisah: \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.copilot.local-llm-hardware-upgrade (Private)\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"2-kenapa-model-kecil-bisa-cukup\"\u003e2. Kenapa model kecil bisa cukup?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-model-kecil-bisa-cukup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena pekerjaan elo sempit: rebranding project, rename string/symbol, update config, baca error, repair test. Tidak perlu model besar yang bisa ngerespon semua hal.\u003c/p\u003e\n\u003cp\u003eQuality sering datang dari workflow, bukan ukuran model. Kalau alurnya jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einventaris occurrence,\u003c/li\u003e\n\u003cli\u003eklasifikasi safe vs ambiguous,\u003c/li\u003e\n\u003cli\u003ereplacement mekanis untuk yang jelas,\u003c/li\u003e\n\u003cli\u003ereview dan test,\u003c/li\u003e\n\u003cli\u003erepair error,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka model kecil bisa tampil jauh lebih pinter.\u003c/p\u003e\n\u003cp\u003eItu bukan argumen bahwa local LLM otomatis bisa menggantikan semua agentic coding flow. \u003ca href=\"https://world.hey.com/dhh/local-llms-are-how-nerds-now-justify-a-big-computer-they-don-t-need-af2fcb7b\"\u003eDHH\u003c/a\u003e benar bahwa local LLMs masih jauh di belakang frontier models untuk sebagian besar use case, tapi itu juga bukan kegagalan kalau konteksnya sempit dan tool/harnessnya tepat.\u003c/p\u003e\n\u003cp\u003eSementara model besar pun bisa boros kalau diberi prompt \"rebrand semua\" tanpa guardrail.\u003c/p\u003e\n\u003ch2 id=\"3-apa-yang-harus-dibangun-supaya-model-kecil-terasa-seperti-raptor\"\u003e3. Apa yang harus dibangun supaya model kecil terasa seperti Raptor?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-apa-yang-harus-dibangun-supaya-model-kecil-terasa-seperti-raptor\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang penting bukan fine-tuning. Yang penting adalah agent harness pribadi.\u003c/p\u003e\n\u003cp\u003eMinimal komponennya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etool access: \u003ccode\u003egrep\u003c/code\u003e, \u003ccode\u003eread_file\u003c/code\u003e, \u003ccode\u003ereplace_in_file\u003c/code\u003e, \u003ccode\u003erun_tests\u003c/code\u003e, \u003ccode\u003egit diff\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003estate file: \u003ccode\u003erebrand-plan.md\u003c/code\u003e atau \u003ccode\u003eagent-state.json\u003c/code\u003e untuk daftar occurrence, keputusan, file yang sudah disentuh, dan error terakhir.\u003c/li\u003e\n\u003cli\u003econtext pack: \u003ccode\u003ePROJECT_CONTEXT.md\u003c/code\u003e, \u003ccode\u003eREBRAND_RULES.md\u003c/code\u003e, \u003ccode\u003eNAMING_MAP.md\u003c/code\u003e, \u003ccode\u003eDO_NOT_TOUCH.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ebudget rule: jangan scan repo berkali-kali; mulai dari inventory lalu kerjakan dari inventory itu.\u003c/li\u003e\n\u003cli\u003edeterministic edits first: gunakan script untuk replace yang jelas, gunakan LLM hanya untuk kasus ambigu dan repair.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni yang sering terlewatkan. Model besar tidak akan membantu kalau memory kerja eksternal dan workflow state-nya kosong.\u003c/p\u003e\n\u003ch2 id=\"4-perlukah-fine-tuning\"\u003e4. Perlukah fine-tuning?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-perlukah-fine-tuning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk tahap awal: belum perlu.\u003c/p\u003e\n\u003cp\u003eFine-tuning berguna hanya jika elo punya banyak contoh internal dan pola task yang stabil. Untuk 1 user pribadi, lebih masuk akal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elevel 1: local model + prompt/context pack,\u003c/li\u003e\n\u003cli\u003elevel 2: local model + tools + state file,\u003c/li\u003e\n\u003cli\u003elevel 3: local model + retrieval dari repo docs/ADR/pattern lama,\u003c/li\u003e\n\u003cli\u003elevel 4: fine-tuning/LoRA kecil kalau polanya sudah matang.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eElo sekarang paling mungkin ada di level 2–3. Jadi jangan lompat ke fine-tuning dulu.\u003c/p\u003e\n\u003ch2 id=\"5-apa-yang-berubah-setelah-copilot-pindah-ke-ai-credits\"\u003e5. Apa yang berubah setelah Copilot pindah ke AI Credits?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-apa-yang-berubah-setelah-copilot-pindah-ke-ai-credits\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDulu Raptor mini 0x bisa terasa gratis karena nggak mengurangi jatah premium di UI lama. Sekarang framing-nya berubah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRaptor mini masih murah per token,\u003c/li\u003e\n\u003cli\u003etapi long-running task tetap dihitung berdasarkan total token input/output/cached,\u003c/li\u003e\n\u003cli\u003ejadi rasa \"free\" hilang meski biayanya tetap jauh lebih rendah dibanding model premium.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh kasar: task panjang dengan 6 juta input token dan 500k output token bisa jadi sekitar 250 AI Credits dengan Raptor/GPT-5 mini pricing, tapi sekitar 2.550 AI Credits dengan Claude Sonnet 4.6.\u003c/p\u003e\n\u003cp\u003eJadi bedanya bukan tipis. Raptor membuat task yang \"cukup mahal\" jadi masih masuk akal, tapi satu task besar bisa tetap makan seperempat jatah Copilot Pro $10/bulan.\u003c/p\u003e\n\u003ch2 id=\"6-temuan-riset-terbaru\"\u003e6. Temuan riset terbaru\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-temuan-riset-terbaru\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepInfra sekarang menunjukkan Qwen3 30B A3B pada harga sekitar $0.08 input / $0.29 output per 1M token, dengan DeepInfra sebagai cheapest provider.\u003c/li\u003e\n\u003cli\u003eVarian Qwen3 Coder 30B A3B Instruct yang lebih khusus coding berada di sekitar $0.07 input / $0.26 output per 1M token, dengan HuggingFace sebagai cheapest provider.\u003c/li\u003e\n\u003cli\u003eContoh MoE Qwen3 235B A22B jadi pelengkap penting: cheapest provider OpenRouter di sekitar $0.071 input / $0.10 output per 1M token.\u003c/li\u003e\n\u003cli\u003eItu artinya total parameter besar tidak otomatis membuat model lebih mahal; active params per token dan arsitektur inference lebih penting.\u003c/li\u003e\n\u003cli\u003eTemuan ini bikin thesis gue lebih kuat: harga token murah untuk agent coding bisa datang dari model 30B atau MoE, tidak harus dari model kecil 7B.\u003c/li\u003e\n\u003cli\u003eUntuk local hybrid, setup Qwen3.5 lokal + Claude Code di localhost jadi opsi paling menarik sekarang: zero per-token cloud cost, dan tetap bisa pakai UX agent dari Claude.\u003c/li\u003e\n\u003cli\u003eDiskusi Reddit r/LocalLLaMA juga memberi sinyal penting: model bisa terlihat “malas” kalau tool-calling dan workflow agent-nya tidak diprioritaskan, bahkan kalau modelnya aman dan harga murah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"61-arti-riset-ini-untuk-workflow-agent\"\u003e6.1 Arti riset ini untuk workflow agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#61-arti-riset-ini-untuk-workflow-agent\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eModel murah bukan jaminan berhasil kalau agentnya tidak tahu kapan memanggil tool.\u003c/li\u003e\n\u003cli\u003eUntuk coding agent, patuh terhadap tool schema, konsistensi state, dan minim loop yang tidak perlu lebih penting daripada hanya mencari model termurah.\u003c/li\u003e\n\u003cli\u003eIni sejalan dengan billing Copilot baru: kalau task agent panjang dan loop banyak, token count benar-benar jadi cost driver.\u003c/li\u003e\n\u003cli\u003eTidak ada bukti langsung dari riset ini bahwa GitHub memberi model murah untuk melatih dari kode pengguna. Lebih tepat melihatnya sebagai strategi subsidi/adopsi dan ekonomi token.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"7-kenapa-thread-theo-penting\"\u003e7. Kenapa thread Theo penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-kenapa-thread-theo-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread Theo menunjuk ke masalah inti: pricing GitHub Copilot lama masih flat/message-based, sedangkan agent coding sebenarnya telah berubah jadi long-running compute job.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edia menunjukkan 15 messages yang terkait dengan sekitar $221 inference cost backend.\u003c/li\u003e\n\u003cli\u003ebreakdown biaya menunjukkan uncached input, cached input, dan output token masing-masing besar.\u003c/li\u003e\n\u003cli\u003epola ini bukan chat biasa; ini agent loop yang berkali-kali membawa konteks besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: one human message bisa berubah jadi ribuan atau jutaan token internal. Itu yang membuat unit \"per message\" jadi tidak layak.\u003c/p\u003e\n\u003ch3 id=\"respons-penting-dari-thread\"\u003eRespons penting dari thread\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#respons-penting-dari-thread\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eJaid: fixed per-task billing bisa terlalu murah untuk task yang memicu ribuan dolar backend. Fixed task pricing cocok untuk task kecil, tapi rusak untuk agent task yang bisa jalan puluhan jam. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/JaidCodes/status/2051399596530602330 (Private)\u003c/a\u003e\n\u003cul\u003e\n\u003cli\u003eini lebih tepat disebut pricing exploit/economic arbitrage, bukan hacking. Dia memakai fitur sebagaimana disediakan, tapi tasknya dibiarkan sangat panjang sehingga cost nyata jauh melebihi harga fixed.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eabdinajib/Cursor: problem ini bukan unik GitHub; tools agent lain yang memberi unlimited/flat access juga mengalami tekanan ekonomi yang sama.\u003c/li\u003e\n\u003cli\u003eByteCrafter: satu agent loop bisa setara 100 autocompletes, jadi cap 1.500-message flat tidak akan bertahan untuk agentic flows.\u003c/li\u003e\n\u003cli\u003eDerped: yang bermasalah bukan sekadar kata \"credit\", tapi credit/allowance yang tidak cukup granular terhadap actual inference cost.\u003c/li\u003e\n\u003cli\u003eSanchit/Vignesh: perubahan ini dilihat banyak orang sebagai normalisasi ekonomi, bukan downgrade produktif; itu wajar dan mungkin inevitable.\u003c/li\u003e\n\u003cli\u003eCheaty: contoh giant task dengan satu request besar menunjukkan bahwa single request dalam agentic coding adalah ilusi karena di belakangnya ada banyak compute.\u003c/li\u003e\n\u003cli\u003eHarish: enterprise juga bisa underestimate cost; agent coding di organisasi besar bisa jadi masalah operasional, bukan hanya pricing annoyance. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/iamharishvasu/status/2051389463444836412 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eUber story: laporan publik menyebut internal AI coding budget bisa habis dalam empat bulan dan biaya per engineer bisa mencapai $500–$2.000/bulan. Ini menunjukkan bahwa saat agentic coding diadopsi luas, billing menjadi compute budget, bukan lagi seat budget.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThread Theo dan responsnya mempertegas pola yang sama dengan kasus elo: agentic coding tidak bisa lagi dihitung hanya dari jumlah pesan manusia. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/theo/status/2051395816410210604 (Private)\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eThread Theo, Jaid, dan cerita Uber sama-sama menunjukkan pola yang sama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebilling lama: 1 message/task = 1 unit usage,\u003c/li\u003e\n\u003cli\u003ebilling baru: 1 message/task bisa punya banyak model call, loop, dan token.\u003c/li\u003e\n\u003cli\u003edi level enterprise, limitnya bukan lagi seat count, tapi total compute/token usage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk kasus elo: Raptor mini tetap biaya rendah, tapi baik thread Theo maupun agent debug panel elo menunjukkan bahwa long-running agent harus mulai dipikir sebagai compute job, bukan sekadar chat interaction.\u003c/p\u003e\n\u003ch3 id=\"71-subsidy-adoption-dan-data\"\u003e7.1 Subsidy, adoption, dan data\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#71-subsidy-adoption-dan-data\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIstilah \"yayasan GitHub peduli\" lebih tepat dibaca sebagai cross-subsidy atau subsidi produk, bukan charity. GitHub mungkin memberikan model murah/0x sebagai strategi adoption dan validasi produk, bukan karena mereka ingin memberi tanpa batas. Ketika usage agentic meluas, subsidi itu menjadi lubang biaya.\u003c/p\u003e\n\u003cp\u003eYang masih perlu dibedakan adalah dua kemungkinan terkait data:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekemungkinan pertama: GitHub memakai telemetry/usage signal untuk memperbaiki sistem seperti model routing, prompt templates, dan agent behavior. Itu masuk akal.\u003c/li\u003e\n\u003cli\u003ekemungkinan kedua: GitHub melatih Raptor mini langsung dari sesi kode pengguna. Dari konteks thread dan docs yang kita lihat, tidak ada bukti langsung untuk klaim itu. Jadi statement yang lebih aman adalah: mungkin ada learning dari pola penggunaan, tapi tidak ada dasar yang cukup untuk mengatakan model dilatih langsung dari kode pengguna.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRaptor mini 0x lebih kemungkinan merupakan strategi produk: model default yang murah untuk 80% task, dengan model premium disimpan untuk 20% kasus sulit. Itu memberi pressure valve agar heavy agentic usage tetap lebih terkendali daripada jika semua user lompat ke Sonnet/Opus/GPT-5.4.\u003c/p\u003e\n\u003cp\u003eBukan \"GitHub peduli bagi token\". Lebih tepat: GitHub memberi subsidi adoption sambil mencari kurva harga yang benar. Dan sekarang kurva lama jebol ketika agentic coding dipakai serius.\u003c/p\u003e\n\u003ch2 id=\"8-praktik-yang-masuk-akal-untuk-elo\"\u003e8. Praktik yang masuk akal untuk elo\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-praktik-yang-masuk-akal-untuk-elo\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eStrategi paling rasional tetap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epakai Raptor mini sebagai default untuk rebranding, migration kecil, rename, cleanup, dan refactor mekanis,\u003c/li\u003e\n\u003cli\u003ejangan biarkan agent eksplor repo tanpa batas,\u003c/li\u003e\n\u003cli\u003epecah task jadi inventory → scripted replace → review diff → fix test,\u003c/li\u003e\n\u003cli\u003egunakan model premium hanya untuk kasus ambiguous, reasoning berat, atau high-impact decision.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIndikator workflow sehat: agent mulai dari inventory, membuat patch/plan, review diff, dan melaporkan hasil secara ringkas — bukan keliling repo dan membawa semua konteks terus-terusan.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u00
