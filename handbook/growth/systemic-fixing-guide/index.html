u003cp\u003eMemperbaiki pola batin (seperti \"takut tampil\" atau \"sulit peduli\") tidak bisa dilakukan hanya dengan \"sadar\". Perlu ada perbaikan ekosistem di seluruh layer.\u003c/p\u003e\n\u003ch2 id=\"the-systemic-checklist\"\u003eThe Systemic Checklist\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-systemic-checklist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-biological-reset-stabilkan-tubuh\"\u003e1. Biological Reset (Stabilkan Tubuh)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-biological-reset-stabilkan-tubuh\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum mencoba latihan psikologis, pastikan sistem saraf tidak dalam kondisi \u003cem\u003eover-inflamed\u003c/em\u003e.\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eTidur\u003c/strong\u003e: Stabilkan jam tidur.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eGerak\u003c/strong\u003e: Aktivitas fisik rutin untuk mengurangi stres kronik.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eDigital Detox\u003c/strong\u003e: Kurangi \u003cem\u003edoomscrolling\u003c/em\u003e dan overstimulasi gadget.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eGizi\u003c/strong\u003e: Perbaiki pola makan untuk mendukung fungsi otak.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-psychological-mapping-petakan-luka\"\u003e2. Psychological Mapping (Petakan Luka)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-psychological-mapping-petakan-luka\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJangan hanya melabeli diri, tapi cari sumber dan template-nya.\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eIdentify Trigger\u003c/strong\u003e: Apa event yang memicu respons defensif?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eTrace Root\u003c/strong\u003e: Dari mana template ini datang? (Misal: pengalaman masa kecil).\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eCreate New Learning\u003c/strong\u003e: Buat prinsip baru (misal: \"Gue bisa peduli dengan batas\").\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-social-calibration-pilih-lingkungan\"\u003e3. Social Calibration (Pilih Lingkungan)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-social-calibration-pilih-lingkungan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCari lingkungan yang membantu ego bertumbuh, bukan yang mengamini luka.\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eAudit Circle\u003c/strong\u003e: Apakah teman-teman gue hanya memvalidasi sinisme gue?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eSeek Feedback\u003c/strong\u003e: Cari orang yang berani memberi koreksi sehat.\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eSafe Practice\u003c/strong\u003e: Cari ruang kecil untuk latihan peran baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-cultural-audit-uji-mitos\"\u003e4. Cultural Audit (Uji Mitos)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-cultural-audit-uji-mitos\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIdentifikasi \"software\" budaya yang menghambat.\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eChallenge Norms\u003c/strong\u003e: Apakah \"diam itu rendah hati\" sebenarnya adalah rasa malu yang terbungkus norma?\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eRedefine Values\u003c/strong\u003e: Ubah definisi \"peduli\" dari \"mengorbankan diri\" menjadi \"berkontribusi sehat\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-spiritual-alignment-tentukan-gawang\"\u003e5. Spiritual Alignment (Tentukan Gawang)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-spiritual-alignment-tentukan-gawang\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGunakan nilai hidup sebagai rem saat ego mulai membenarkan diri.\u003c/p\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eValue Check\u003c/strong\u003e: Saat muncul pikiran \"gue gak perlu peduli\", tanya: \"Apakah ini nilai yang ingin gue bawa dalam hidup?\"\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e \u003cstrong\u003eResponsibility\u003c/strong\u003e: Fokus pada tanggung jawab atas dampak diri, bukan hanya hak untuk diakui.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"summary-of-action\"\u003eSummary of Action\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#summary-of-action\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eSadar \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003c
