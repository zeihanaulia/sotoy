ps":{"note":{"id":"notes.testing.oracle","title":"Oracle dalam software testing","desc":"Penjelasan konsep test oracle sebagai sumber kebenaran independen untuk menilai hasil program.","updated":1778468084908,"created":1778467692668,"tags":["notes","testing","software-testing","oracle","validation","rust","bun"],"custom":{},"fname":"notes.testing.oracle","type":"note","vault":{"fsPath":"vault"},"contentHash":"44ef154334a3be6782dc8f46462c1db5","links":[{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.testing","alias":"testing","xvault":false,"to":{"fname":"tags.testing"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.software-testing","alias":"software-testing","xvault":false,"to":{"fname":"tags.software-testing"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.oracle","alias":"oracle","xvault":false,"to":{"fname":"tags.oracle"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.validation","alias":"validation","xvault":false,"to":{"fname":"tags.validation"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.rust","alias":"rust","xvault":false,"to":{"fname":"tags.rust"}},{"type":"frontmatterTag","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"tags.bun","alias":"bun","xvault":false,"to":{"fname":"tags.bun"}},{"type":"wiki","from":{"fname":"notes.testing.oracle","id":"notes.testing.oracle","vaultName":"vault"},"value":"notes.software-architechture.bun-rewrite-oracle","position":{"start":{"line":129,"column":3,"offset":3237},"end":{"line":129,"column":54,"offset":3288},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.software-architechture.bun-rewrite-oracle"}}],"anchors":{"apa-itu-oracle":{"type":"header","text":"Apa itu oracle?","value":"apa-itu-oracle","line":18,"column":0,"depth":2},"asal-kata-oracle":{"type":"header","text":"Asal kata oracle","value":"asal-kata-oracle","line":35,"column":0,"depth":2},"makna-oracle-dalam-konteks-testing":{"type":"header","text":"Makna oracle dalam konteks testing","value":"makna-oracle-dalam-konteks-testing","line":43,"column":0,"depth":2},"beda-oracle-dengan-test":{"type":"header","text":"Beda oracle dengan test","value":"beda-oracle-dengan-test","line":59,"column":0,"depth":2},"contoh-oracle":{"type":"header","text":"Contoh oracle","value":"contoh-oracle","line":73,"column":0,"depth":2},"kenapa-oracle-penting-di-rewrite-bun":{"type":"header","text":"Kenapa oracle penting di rewrite Bun?","value":"kenapa-oracle-penting-di-rewrite-bun","line":111,"column":0,"depth":2},"ketika-oracle-bisa-jelek":{"type":"header","text":"Ketika oracle bisa jelek","value":"ketika-oracle-bisa-jelek","line":125,"column":0,"depth":2},"ringkasnya":{"type":"header","text":"Ringkasnya","value":"ringkasnya","line":138,"column":0,"depth":2},"kaitan":{"type":"header","text":"Kaitan","value":"kaitan","line":143,"column":0,"depth":2}},"children":[],"parent":"6h4d9mzf7xtnsod7z8zwfxv","data":{}},"body":"\u003ch1 id=\"oracle-dalam-software-testing\"\u003eOracle dalam software testing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#oracle-dalam-software-testing\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"apa-itu-oracle\"\u003eApa itu oracle?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-oracle\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi konteks thread ini, \"oracle\" bukan Oracle perusahaan atau database.\nOracle adalah sumber kebenaran yang dipakai test untuk memutuskan apakah hasil program benar atau salah.\u003c/p\u003e\n\u003cp\u003eKalau lo punya fungsi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003einput -\u003e program -\u003e output\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eoracle adalah mekanisme yang ngecek:\u003c/p\u003e\n\u003cp\u003e\"untuk input ini, output yang benar harusnya apa?\"\u003c/p\u003e\n\u003cp\u003eKalau inputnya \u003ccode\u003e2 + 2\u003c/code\u003e, oracle-nya bisa berupa \u003ccode\u003e4\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"asal-kata-oracle\"\u003eAsal kata oracle\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#asal-kata-oracle\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSecara harafiah, \"oracle\" berasal dari pengertian lama tentang sumber jawaban yang dipercaya.\nDi mitologi, oracle adalah orang atau tempat yang dianggap memberi nasihat bijak, ramalan, atau keputusan dari kekuatan lebih tinggi.\u003c/p\u003e\n\u003cp\u003eJadi bukan karena bulan, bukan karena perusahaan Oracle.\nIstilah ini dipakai karena fungsinya mirip: memberikan jawaban atau keputusan yang dianggap sahih.\u003c/p\u003e\n\u003ch2 id=\"makna-oracle-dalam-konteks-testing\"\u003eMakna oracle dalam konteks testing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#makna-oracle-dalam-konteks-testing\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam software testing, istilah itu dipakai sebagai metafora.\nOracle bukan pelaksana program; dia adalah otoritas yang menjawab apakah output sudah sesuai.\u003c/p\u003e\n\u003cp\u003eDengan kata lain:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edi dunia nyata, oracle = penasehat atau lembaga yang mengeluarkan keputusan benar/salah\u003c/li\u003e\n\u003cli\u003edi testing, oracle = sumber yang menentukan kebenaran hasil program\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi di konteks thread Rhys:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eimplementasi baru itu eksekutor\u003c/li\u003e\n\u003cli\u003etest itu prosedur pemeriksaan\u003c/li\u003e\n\u003cli\u003eoracle itu yang bilang \"ini lulus\" atau \"ini gagal\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"beda-oracle-dengan-test\"\u003eBeda oracle dengan test\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#beda-oracle-dengan-test\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSering kedengerannya sama, padahal beda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etest = prosedur yang menjalankan pengecekan\u003c/li\u003e\n\u003cli\u003eoracle = sumber kebenaran yang dipakai test untuk menilai hasil\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAnalogi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etest = guru yang ngasih soal dan ngecek jawaban\u003c/li\u003e\n\u003cli\u003eoracle = kunci jawaban\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi test tanpa oracle cuma jalanin program, tapi belum bisa bilang benar atau salah.\u003c/p\u003e\n\u003ch2 id=\"contoh-oracle\"\u003eContoh oracle\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-oracle\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eA. Expected value langsung\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003einput: add(2, 3)\nexpected: 5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOracle-nya: \u003ccode\u003e5\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eB. Golden file / snapshot\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003einput: transpile(file.js)\nexpected: output cocok dengan file snapshot\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOracle-nya: snapshot/golden output.\u003c/p\u003e\n\u003cp\u003eC. Behavior-level oracle\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003erequest HTTP tertentu\nexpected: status 200 + body tertentu\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOracle-nya: kontrak API.\u003c/p\u003e\n\u003cp\u003eD. Differential oracle\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003ejalankan implementasi lama dan baru\nhasil harus sama\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOracle-nya: implementasi lama yang dipercaya.\u003c/p\u003e\n\u003ch2 id=\"kenapa-oracle-penting-di-rewrite-bun\"\u003eKenapa oracle penting di rewrite Bun?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-oracle-penting-di-rewrite-bun\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena rewrite besar berarti implementasi berubah total.\nPertanyaannya jadi:\u003c/p\u003e\n\u003cp\u003e\"gimana kita tahu hasil baru masih benar?\"\u003c/p\u003e\n\u003cp\u003eJawabannya: karena ada oracle yang tidak ikut ditulis ulang bareng implementasinya.\u003c/p\u003e\n\u003cp\u003eKalau implementasi dan oracle ditulis ulang dalam \"bahasa mental\" yang sama, verifikasi jadi rentan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukan verifikasi yang independen\u003c/li\u003e\n\u003cli\u003etapi dua bug yang saling setuju\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"ketika-oracle-bisa-jelek\"\u003eKetika oracle bisa jelek\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ketika-oracle-bisa-jelek\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOracle juga bisa salah atau terlalu lemah.\nContoh oracle jelek:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etest cuma cek program tidak crash\u003c/li\u003e\n\u003cli\u003esnapshot gampang di-update tanpa dipahami\u003c/li\u003e\n\u003cli\u003emock berlebihan sampai behavior asli tidak diuji\u003c/li\u003e\n\u003cli\u003etest terlalu nempel ke struktur internal, bukan behavior\u003c/li\u003e\n\u003cli\u003eoracle ikut diubah supaya test hijau\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi kasus rewrite, inilah yang mau dihindari.\u003c/p\u003e\n\u003ch2 id=\"ringkasnya\"\u003eRingkasnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasnya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOracle adalah sumber kebenaran yang dipakai test untuk menilai apakah software berperilaku benar.\nKalau lo lagi rewrite besar, kualitas oracle sering lebih penting daripada kecepatan nulis implementasi baru.\u003c/p\u003e\n\u003ch2 id=\"kaitan\"\u003eKaitan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kaitan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.software-architechture.bun-rewrite-oracle\"\u003eBun rewrite Zig → Rust: oracle test dan validasi independen\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etesting (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esoftware-testing (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eoracle (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evalidation (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_bl
