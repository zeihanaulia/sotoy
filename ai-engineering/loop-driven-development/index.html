ps":{"note":{"id":"notes.ai-engineering.loop-driven-development","title":"Loop Driven Development (LDD): Solving the Oracle Problem","description":"Pendekatan membangun software di era agent dengan fokus pada desain sumber feedback (Oracle) yang independen, deterministic, dan queryable.","tags":["ai-coding","ldd","testing","oracle-problem"],"custom":{"description":"Pendekatan membangun software di era agent dengan fokus pada desain sumber feedback (Oracle) yang independen, deterministic, dan queryable."},"fname":"notes.ai-engineering.loop-driven-development","type":"note","vault":{"fsPath":"vault"},"contentHash":"b76f2ca93fa51fcb75917c71f364cbbe","updated":1782198658471,"created":1782198658471,"desc":"","links":[{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.loop-driven-development","id":"notes.ai-engineering.loop-driven-development","vaultName":"vault"},"value":"tags.ai-coding","alias":"ai-coding","xvault":false,"to":{"fname":"tags.ai-coding"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.loop-driven-development","id":"notes.ai-engineering.loop-driven-development","vaultName":"vault"},"value":"tags.ldd","alias":"ldd","xvault":false,"to":{"fname":"tags.ldd"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.loop-driven-development","id":"notes.ai-engineering.loop-driven-development","vaultName":"vault"},"value":"tags.testing","alias":"testing","xvault":false,"to":{"fname":"tags.testing"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.loop-driven-development","id":"notes.ai-engineering.loop-driven-development","vaultName":"vault"},"value":"tags.oracle-problem","alias":"oracle-problem","xvault":false,"to":{"fname":"tags.oracle-problem"}},{"from":{"fname":"zettel.ai.behavior-coverage-vs-code-coverage","id":"zettel.ai.behavior-coverage-vs-code-coverage","vaultName":"vault"},"type":"backlink","position":{"start":{"line":20,"column":3,"offset":1215},"end":{"line":20,"column":51,"offset":1263},"indent":[]},"value":"notes.ai-engineering.loop-driven-development"},{"from":{"fname":"zettel.ai.the-oracle-problem","id":"zettel.ai.the-oracle-problem","vaultName":"vault"},"type":"backlink","position":{"start":{"line":19,"column":3,"offset":1143},"end":{"line":19,"column":51,"offset":1191},"indent":[]},"value":"notes.ai-engineering.loop-driven-development"}],"anchors":{"inti-pemikiran":{"type":"header","text":"Inti Pemikiran","value":"inti-pemikiran","line":16,"column":0,"depth":2},"the-oracle-problem--feedback-quality":{"type":"header","text":"The Oracle Problem \u0026 Feedback Quality","value":"the-oracle-problem--feedback-quality","line":22,"column":0,"depth":2},"ranking-sumber-feedback-terlemah-rightarrow-terkuat":{"type":"header","text":"Ranking Sumber Feedback (Terlemah $\\rightarrow$ Terkuat)","value":"ranking-sumber-feedback-terlemah-rightarrow-terkuat","line":26,"column":0,"depth":3},"behavior-coverage-vs-code-coverage":{"type":"header","text":"Behavior Coverage vs Code Coverage","value":"behavior-coverage-vs-code-coverage","line":34,"column":0,"depth":2},"teknik-praktis-ldd":{"type":"header","text":"Teknik Praktis LDD","value":"teknik-praktis-ldd","line":40,"column":0,"depth":2},"1-mining-high-quality-open-source-test-suites":{"type":"header","text":"1. Mining High-Quality Open-Source Test Suites","value":"1-mining-high-quality-open-source-test-suites","line":42,"column":0,"depth":3},"2-programmatic-oracle-querying":{"type":"header","text":"2. Programmatic Oracle Querying","value":"2-programmatic-oracle-querying","line":46,"column":0,"depth":3},"peran-manusia-dalam-ldd":{"type":"header","text":"Peran Manusia dalam LDD","value":"peran-manusia-dalam-ldd","line":51,"column":0,"depth":2},"sintesis-dengan-paradigma-lain":{"type":"header","text":"Sintesis dengan Paradigma Lain","value":"sintesis-dengan-paradigma-lain","line":59,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":67,"column":0,"depth":2}},"children":[],"parent":"ru1khbyefapm8m391gs1waw","data":{}},"body":"\u003ch1 id=\"loop-driven-development-ldd-solving-the-oracle-problem\"\u003eLoop Driven Development (LDD): Solving the Oracle Problem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-driven-development-ldd-solving-the-oracle-problem\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-pemikiran\"\u003eInti Pemikiran\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-pemikiran\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam era coding agent, biaya untuk menulis kode implementasi dan scaffolding test sudah menjadi sangat murah (hampir gratis). Namun, muncul bottleneck baru yang disebut \u003cstrong\u003eThe Oracle Problem\u003c/strong\u003e: mengetahui apa jawaban yang benar untuk input tertentu.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLoop Driven Development (LDD)\u003c/strong\u003e adalah paradigma di mana fokus utama engineer bergeser dari \"menulis kode\" menjadi \"mendesain sumber feedback (Oracle)\" yang berkualitas tinggi, sehingga agent bisa melakukan looping perbaikan implementasi secara mandiri dan akurat.\u003c/p\u003e\n\u003ch2 id=\"the-oracle-problem--feedback-quality\"\u003eThe Oracle Problem \u0026#x26; Feedback Quality\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-oracle-problem--feedback-quality\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKualitas sebuah loop ditentukan oleh kualitas sumber feedback-nya. Nuno Campos membagi kualitas feedback berdasarkan dua dimensi: \u003cstrong\u003eIndependence\u003c/strong\u003e (independen dari kode yang diuji) dan \u003cstrong\u003eQueryability\u003c/strong\u003e (bisa ditanya untuk input baru).\u003c/p\u003e\n\u003ch3 id=\"ranking-sumber-feedback-terlemah-rightarrow-terkuat\"\u003eRanking Sumber Feedback (Terlemah \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Terkuat)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ranking-sumber-feedback-terlemah-rightarrow-terkuat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eIn-thread Review (Self-Review)\u003c/strong\u003e: Agent menilai kodenya sendiri. Sangat lemah karena cenderung terjadi \u003cem\u003eself-justification\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStandards/RFC Text\u003c/strong\u003e: Independen tapi statis. Terlalu banyak interpretasi, tidak bisa menjawab edge case spesifik secara otomatis.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOff-thread Review\u003c/strong\u003e: Evaluator agent yang berbeda. Lebih baik, tapi tetap berupa opini/judgment, bukan pengukuran objektif.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHigh-quality Test Suites\u003c/strong\u003e: Independen dan executable, tapi statis. Hanya bisa menjawab apa yang sudah ditulis dalam test.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOracle to Mimic (The Gold Standard)\u003c/strong\u003e: Sistem nyata yang sudah ada (misal: real Excel untuk membuat Excel-compatible engine). Independen, deterministic, dan queryable.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"behavior-coverage-vs-code-coverage\"\u003eBehavior Coverage vs Code Coverage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#behavior-coverage-vs-code-coverage\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLDD menekankan perbedaan antara dua jenis coverage:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCode Coverage\u003c/strong\u003e: Menjawab \"apakah baris ini pernah dieksekusi?\". Bisa 100% tapi sistem tetap salah.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBehavior Coverage\u003c/strong\u003e: Menjawab \"apakah skenario domain yang penting sudah dipin dalam test?\". Inilah yang menentukan kebenaran sistem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"teknik-praktis-ldd\"\u003eTeknik Praktis LDD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#teknik-praktis-ldd\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-mining-high-quality-open-source-test-suites\"\u003e1. Mining High-Quality Open-Source Test Suites\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-mining-high-quality-open-source-test-suites\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenggunakan test suite dari project open-source lain sebagai spesifikasi behavior. Agent digunakan untuk mem-port atau mengadaptasi test tersebut ke implementasi kita.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePrinsip\u003c/strong\u003e: Test harus mem-pin behavior (output), bukan detail implementasi (internal).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-programmatic-oracle-querying\"\u003e2. Programmatic Oracle Querying\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-programmatic-oracle-querying\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMembangun pipeline untuk mengambil jawaban dari oracle nyata secara otomatis:\n\u003ccode\u003eLive Oracle\u003c/code\u003e \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003ccode\u003eCapture Output\u003c/code\u003e \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003ccode\u003eFreeze as Snapshot\u003c/code\u003e \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003ccode\u003eCI Assert against Snapshot\u003c/code\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eKeuntungan\u003c/strong\u003e: CI tetap cepat karena menggunakan snapshot beku, sementara developer bisa me-refresh snapshot dari oracle asli.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"peran-manusia-dalam-ldd\"\u003ePeran Manusia dalam LDD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peran-manusia-dalam-ldd\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKreativitas engineer berpindah ke empat area keputusan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eWhich Oracle\u003c/strong\u003e: Memilih sumber kebenaran yang tepat.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWhich Properties to Pin\u003c/strong\u003e: Menentukan output mana yang harus divalidasi (menghindari \u003cem\u003ebrittle tests\u003c/em\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eShape of Comparison\u003c/strong\u003e: Menentukan metode perbandingan (Equality, Distance, Tolerance).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDefinition of Done\u003c/strong\u003e: Menentukan kapan loop berhenti (behavior dimension tercakup, snapshot reproducible).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"sintesis-dengan-paradigma-lain\"\u003eSintesis dengan Paradigma Lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-dengan-paradigma-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eParadigma\u003c/th\u003e\u003cth\u003eFokus Utama\u003c/th\u003e\u003cth\u003eKontribusi terhadap Loop\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eLoop Engineering\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eOrkestrasi \u0026#x26; Sistem\u003c/td\u003e\u003ctd\u003eMenyediakan \"mesin\" looping dan infrastruktur.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eEngineering Discipline\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eArsitektur \u0026#x26; Boundary\u003c/td\u003e\u003ctd\u003eMenyediakan \"rem\" dan struktur agar loop tidak chaos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eLDD\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eFeedback \u0026#x26; Oracle\u003c/td\u003e\u003ctd\u003eMenyediakan \"kompas\" (sumber kebenaran) agar loop terarah.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThread X: \u003ca href=\"https://x.com/nfcampos/status/2064746971944956299\"\u003ehttps://x.com/nfcampos/status/2064746971944956299\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eldd (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etesting (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eoracle-problem (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.ai.behavior-coverage-vs-code-coverage\"\u003eBehavior Coverage vs Code Coverage\u003c/a\u
