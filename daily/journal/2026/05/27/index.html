ps":{"note":{"id":"daily.journal.2026.05.27","title":"2026-05-27","desc":"Refleksi baca The Complete Book of Enoch dan cara memisahkan buku, tradisi, serta manuskrip sumber.","updated":1779935953056,"created":1779859554487,"custom":{},"fname":"daily.journal.2026.05.27","type":"note","vault":{"fsPath":"vault"},"contentHash":"f51e2d8ecf29d5edc502ace9c56c08d4","links":[{"type":"wiki","from":{"fname":"daily.journal.2026.05.27","id":"daily.journal.2026.05.27","vaultName":"vault"},"value":"book-summaries.the-complete-book-of-enoch","position":{"start":{"line":50,"column":3,"offset":4683},"end":{"line":50,"column":48,"offset":4728},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.the-complete-book-of-enoch"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.27","id":"daily.journal.2026.05.27","vaultName":"vault"},"value":"notes.history.enoch-textual-history","position":{"start":{"line":51,"column":3,"offset":4731},"end":{"line":51,"column":42,"offset":4770},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.history.enoch-textual-history"}}],"anchors":{"apa-yang-gue-catat":{"type":"header","text":"Apa yang gue catat","value":"apa-yang-gue-catat","line":12,"column":0,"depth":2},"lapisan-yang-gue-pakai-hari-ini":{"type":"header","text":"Lapisan yang gue pakai hari ini","value":"lapisan-yang-gue-pakai-hari-ini","line":22,"column":0,"depth":2},"cara-baca-yang-gue-pakai":{"type":"header","text":"Cara baca yang gue pakai","value":"cara-baca-yang-gue-pakai","line":30,"column":0,"depth":2},"insight-penting-hari-ini":{"type":"header","text":"Insight penting hari ini","value":"insight-penting-hari-ini","line":34,"column":0,"depth":2},"kenapa-ini-penting-buat-gue":{"type":"header","text":"Kenapa ini penting buat gue","value":"kenapa-ini-penting-buat-gue","line":42,"column":0,"depth":2},"rencana-selanjutnya":{"type":"header","text":"Rencana selanjutnya","value":"rencana-selanjutnya","line":49,"column":0,"depth":2},"link-internal":{"type":"header","text":"Link internal","value":"link-internal","line":56,"column":0,"depth":3}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-27\"\u003e2026-05-27\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-27\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eHari ini gue baca \u003cem\u003eThe Complete Book of Enoch: Standard English Version\u003c/em\u003e oleh Dr. Jay Winter. Sebelum masuk isi, gue sengaja memisahkan tiga lapisan: 1) buku yang gue punya, 2) teks Enoch sebagai tradisi kuno, dan 3) naskah sumber yang jadi basis terjemahan.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-gue-catat\"\u003eApa yang gue catat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-catat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue langsung nyadar bahwa daftar isi Jay Winter bukan otomatis struktur asli 1 Enoch. Di halaman awal dia bilang \"Translated from the original Ethiopic manuscript and logically organized.\" Jadi buat gue ini lebih mirip peta populer yang sudah diedit supaya enak dibaca, bukan transkripsi literal urutan bab akademik 1–108.\u003c/p\u003e\n\u003cp\u003eGue juga tarik pelan bahwa untuk teks kuno, \"asli\" jarang berarti satu file utuh. Biasanya kita punya rantai transmisi: fragmen Aramaic dari Qumran → fragmen Greek/Latin → versi Ge'ez/Ethiopic yang lebih lengkap → terjemahan modern. Itu bikin cara baca gue berubah dari \"ini benar atau salah\" jadi \"lapisan mana yang sedang gue baca.\"\u003c/p\u003e\n\u003cp\u003eIntinya: \u003cem\u003ebukan murni tulisan asli Enoch dalam arti autograph/asal langsung, tapi juga bukan sekadar interpretasi penemu modern.\u003c/em\u003e Yang beredar sekarang adalah rekonstruksi dan terjemahan dari tradisi manuskrip kuno. Itulah mengapa gue merasa posisi paling aman adalah menyebut teks modern ini sebagai hasil \u003cem\u003etextual transmission\u003c/em\u003e dengan elemen editorial.\u003c/p\u003e\n\u003cp\u003eDari halaman Dead Sea Scrolls yang gue buka, 4Q Enoch diperkirakan 150–50 BCE pada era Hasmonean dan ditulis dalam Aramaic. Itu memberi anchor kuno untuk cerita Watchers/fallen angels, tapi fragmennya tidak lengkap untuk verifikasi setiap kalimat versi lengkap.\u003c/p\u003e\n\u003ch2 id=\"lapisan-yang-gue-pakai-hari-ini\"\u003eLapisan yang gue pakai hari ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapisan-yang-gue-pakai-hari-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eBuku yang gue pegang\u003c/strong\u003e: edisi Jay Winter. Ini entry point populer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTradisi Enoch kuno\u003c/strong\u003e: struktur lima buku yang umum di 1 Enoch, tapi dengan judul dan framing editorial yang bisa beda.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eManuskrip sumber\u003c/strong\u003e: fragmen Aramaic Dead Sea Scrolls yang paling tua, plus versi Ethiopic yang paling lengkap.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau bacanya campur, gue bisa keliru. Misalnya, bagian \"Book 4 - Kingdom of Heaven\" di Jay Winter terasa lebih teologis dan nge-blend beberapa materi yang dalam literatur akademik dipisah jadi Astronomical Book, Dream Visions, dan Heavenly Tablets.\u003c/p\u003e\n\u003ch2 id=\"cara-baca-yang-gue-pakai\"\u003eCara baca yang gue pakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cara-baca-yang-gue-pakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang gue lebih suka baca Book of Enoch sebagai arsip berlapis, bukan sebagai teks tunggal yang sekali jalan. Pertama, cek mana yang punya core kuno (dukungan Qumran/Aramaic). Kedua, sigap apakah bagian itu datang lewat tradisi Ethiopic/Ge'ez. Ketiga, waspada kalau bahasa Inggris modern sudah menambahkan kategori teologis seperti \"Elect One,\" \"Son of Man,\" atau \"Kingdom of Heaven.\" Keempat, catat framing editorial: judul, pembagian bab, dan susunan logis bisa dibuat supaya terasa rapi untuk pembaca modern.\u003c/p\u003e\n\u003ch2 id=\"insight-penting-hari-ini\"\u003eInsight penting hari ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting-hari-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDaftar isi Winter cocok secara garis besar dengan lima bagian besar 1 Enoch, tapi judulnya editorial. \u003ca href=\"https://en.wikipedia.org/wiki/Book_of_Enoch\"\u003eWikipedia\u003c/a\u003e mendeskripsikan bagian-bagian standar sebagai Watchers, Parables, Astronomical Book, Dream Visions, dan Epistle.\u003c/li\u003e\n\u003cli\u003eSumber paling tua yang bisa kita lihat online bukan buku lengkap, tapi fragmen Aramaic Qumran seperti 4Q204, 4Q201, 4Q211, plus Book of Giants 4Q203/4Q530/4Q531. Ini bukan otoritas final, tapi closest thing to original.\u003c/li\u003e\n\u003cli\u003eVersi paling lengkap adalah Ethiopic/Ge'ez. Itu trade-off klasik filologi: completeness versus antiquity.\u003c/li\u003e\n\u003cli\u003eEnglish modern seperti Winter sebenarnya sudah dua-tiga lapis dari sumber: Aramaic/Greek/Ge'ez → editor/translator → ingliss.\u003c/li\u003e\n\u003cli\u003eBagian Extras di buku ini harus dibaca hati-hati. \u003cem\u003eBook of Giants\u003c/em\u003e memang punya hubungan Enochic, tapi \u003cem\u003eTestament of Solomon\u003c/em\u003e atau \u003cem\u003eEvidence of Giants\u003c/em\u003e bukan bagian inti 1 Enoch standar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting-buat-gue\"\u003eKenapa ini penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang gue bisa baca buku ini dengan dua mode sekaligus: sebagai \u003cem\u003epeta populer\u003c/em\u003e dan sebagai \u003cem\u003edokumen yang perlu dicek ulang\u003c/em\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau tujuan gue cuma ngerti cerita dan tema besar, Winter sudah cukup sebagai entry point.\u003c/li\u003e\n\u003cli\u003eKalau tujuan gue ngecek asal-usul teks, Winter harus diperlakukan sebagai versi populer/editorial, bukan authority tunggal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"rencana-selanjutnya\"\u003eRencana selanjutnya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rencana-selanjutnya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBaca lagi Book 1 sampai Book 5 dengan filter itu: struktur editorial versus struktur akademik.\u003c/li\u003e\n\u003cli\u003eBandingkan bagian-bagian penting dengan terjemahan R. H. Charles di \u003ca href=\"https://www.ccel.org/c/charles/otpseudepig/enoch/ENOCH_1.HTM\"\u003eCCEL\u003c/a\u003e dan dengan work yang lebih tekstual di \u003ca href=\"https://archive.org/download/ethiopicversiono00charuoft/ethiopicversiono00charuoft.pdf\"\u003eInternet Archive\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eTandai bagian yang kemungkinan merangkum Astronomical Book, Dream Visions, dan Heavenly Tablets supaya bisa dipisah di catatan selanjutnya.\u003c/li\u003e\n\u003cli\u003eHati-hati dengan judul teologis/populer seperti \"Kingdom of Heaven\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"link-internal\"\u003eLink internal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#link-internal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-complete-book-of-enoch\"\u003eThe Complete Book of Enoch\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.history.enoch-textual-history\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eEnoch textual history: manuskrip dan tradisi\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"cu
