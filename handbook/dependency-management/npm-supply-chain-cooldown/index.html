ckage-internal-dan-darurat","line":59,"column":0,"depth":2},"build-script-allowlist":{"type":"header","text":"Build script allowlist","value":"build-script-allowlist","line":74,"column":0,"depth":2},"proses-operasional-yang-disarankan":{"type":"header","text":"Proses operasional yang disarankan","value":"proses-operasional-yang-disarankan","line":90,"column":0,"depth":2},"kelemahan-dan-trade-off":{"type":"header","text":"Kelemahan dan trade-off","value":"kelemahan-dan-trade-off","line":99,"column":0,"depth":2},"integrasi-dengan-supply-chain-defense":{"type":"header","text":"Integrasi dengan supply-chain defense","value":"integrasi-dengan-supply-chain-defense","line":106,"column":0,"depth":2},"catatan-penting":{"type":"header","text":"Catatan penting","value":"catatan-penting","line":115,"column":0,"depth":2},"related-resources":{"type":"header","text":"Related resources","value":"related-resources","line":125,"column":0,"depth":2}},"children":[],"parent":"ijpz6he1wpv1jrwe0s2ltp5","data":{}},"body":"\u003ch1 id=\"hardening-npm-dependency-installs-dengan-cooldown-policy\"\u003eHardening npm dependency installs dengan cooldown policy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hardening-npm-dependency-installs-dengan-cooldown-policy\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"kenapa-pakai-cooldown-policy\"\u003eKenapa pakai cooldown policy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-pakai-cooldown-policy\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSerangan supply-chain npm sering menang di \"jendela waktu pertama\": versi baru dipublish, lalu project atau pipeline secara otomatis menginstal versi itu sebelum komunitas atau tooling sempat mendeteksi malicious release.\u003c/p\u003e\n\u003cp\u003eCooldown policy mengubah default behavior dependency manager dari \"ambil versi terbaru\" menjadi \"tahan dulu versi baru sampai cukup umur\".\u003c/p\u003e\n\u003ch2 id=\"kapan-policy-ini-cocok\"\u003eKapan policy ini cocok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-policy-ini-cocok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGunakan ketika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erepo punya jalur rilis sensitif atau produksi yang tidak boleh berubah otomatis\u003c/li\u003e\n\u003cli\u003eproject memakai agentic tooling, automation, atau workflow CI/CD yang sering install dependency\u003c/li\u003e\n\u003cli\u003etim perlu batasan update dependency baru tanpa memindahkan registry\u003c/li\u003e\n\u003cli\u003ekamu ingin mencegah versi baru melewati pipeline hanya karena package manager default\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"basic-setup-dengan-pnpm\"\u003eBasic setup dengan pnpm\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#basic-setup-dengan-pnpm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi \u003ccode\u003e.pnpmrc\u003c/code\u003e atau \u003ccode\u003epnpm-workspace.yaml\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eminimumReleaseAge\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e10080\u003c/span\u003e\n\u003cspan class=\"token key atrule\"\u003eminimumReleaseAgeStrict\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean important\"\u003etrue\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePenjelasan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAge: 10080\u003c/code\u003e = versi package harus berumur minimal 7 hari sebelum pnpm boleh resolve.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAgeStrict: true\u003c/code\u003e = policy ditegakkan keras; versi yang terlalu baru tidak akan dipilih.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"lapisan-ci\"\u003eLapisan CI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lapisan-ci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi pipeline CI, pakai:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e --frozen-lockfile\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTujuan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCI tidak resolve dependency baru sendiri\u003c/li\u003e\n\u003cli\u003ebuild hanya menginstal apa yang sudah ada di lockfile\u003c/li\u003e\n\u003cli\u003edependency update harus masuk lewat PR terkontrol, bukan pipeline spontan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"tangani-package-internal-dan-darurat\"\u003eTangani package internal dan darurat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tangani-package-internal-dan-darurat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJika kamu punya package internal yang harus langsung dipakai, gunakan exception list:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eminimumReleaseAgeExclude\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e nama\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003epackage\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003einternal\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eelo\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAturan praktis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehanya exclude package yang kamu kendalikan secara penuh\u003c/li\u003e\n\u003cli\u003ehindari daftar panjang exception\u003c/li\u003e\n\u003cli\u003edokumentasikan setiap pengecualian dan review periodik\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"build-script-allowlist\"\u003eBuild script allowlist\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#build-script-allowlist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eInstall dependency npm bisa menjalankan kode melalui lifecycle script.\u003c/p\u003e\n\u003cp\u003eContoh policy ketat:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eonlyBuiltDependencies\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e esbuild\n\n\u003cspan class=\"token key atrule\"\u003eallowBuilds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eesbuild\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean important\"\u003etrue\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni cocok jika kamu ingin memastikan hanya dependency tertentu yang boleh menjalankan script build saat install.\u003c/p\u003e\n\u003ch2 id=\"proses-operasional-yang-disarankan\"\u003eProses operasional yang disarankan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#proses-operasional-yang-disarankan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ereview dependency update lewat PR khusus\u003c/li\u003e\n\u003cli\u003epastikan versi baru memenuhi \u003ccode\u003eminimumReleaseAge\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ecommit lockfile setelah resolusi selesai\u003c/li\u003e\n\u003cli\u003eCI install dengan \u003ccode\u003e--frozen-lockfile\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ejika perlu package baru sebelum 7 hari, gunakan exception yang diaudit\u003c/li\u003e\n\u003cli\u003ebatasi build script kepada dependency terverifikasi\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kelemahan-dan-trade-off\"\u003eKelemahan dan trade-off\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kelemahan-dan-trade-off\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAge\u003c/code\u003e bisa menunda security patch baru; policy ini bukan freeze, tapi delay gate.\u003c/li\u003e\n\u003cli\u003eexception list membuka celah kalau tidak dikelola.\u003c/li\u003e\n\u003cli\u003etoolchain lain mungkin tidak mendukung policy yang sama; ini praktis untuk pnpm.\u003c/li\u003e\n\u003cli\u003ebutuh budaya dependency update yang lebih sadar, bukan hanya \u003ccode\u003epnpm install\u003c/code\u003e terus jalan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"integrasi-dengan-supply-chain-defense\"\u003eIntegrasi dengan supply-chain defense\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#integrasi-dengan-supply-chain-defense\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCooldown policy ini efektif ketika digabungkan dengan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elockfile discipline (\u003ccode\u003ecommit lockfile\u003c/code\u003e, \u003ccode\u003efrozen lockfile\u003c/code\u003e di CI)\u003c/li\u003e\n\u003cli\u003ereview update dependency lewat PR\u003c/li\u003e\n\u003cli\u003erisk tiering package berdasarkan blast radius\u003c/li\u003e\n\u003cli\u003eexplicit build script allowlist\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"catatan-penting\"\u003eCatatan penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePolicy ini bukan solusi yang menghilangkan semua risiko npm. Ia menambah lapisan yang murah dan mudah diterapkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emencegah versi baru yang terlalu muda masuk otomatis\u003c/li\u003e\n\u003cli\u003emembuat dependency update lebih sengaja\u003c/li\u003e\n\u003cli\u003ememastikan CI hanya menjalankan dependency yang sudah dikunci\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni lebih ke \"friction-based security\" daripada \"security scan\".\u003c/p\u003e\n\u003ch2 id=\"related-resources\"\u003eRelated resources\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-resources\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.npm-supply-chain-cooldown-policy\"\u003eNPM supply-chain cooldown policy\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.trusted-publishing-checklist\"\u003eTrusted publishing: kritik argumen dan checklist operasional\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.tanstack-postmortem\"\u003eTanStack npm supply-chain compromise — postmortem notes\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehandbook (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edependency-management (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esupply-chain (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epnpm (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"
