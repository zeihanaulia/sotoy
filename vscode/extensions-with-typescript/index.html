manual-struktur-folder-yang-perlu-ada":{"type":"header","text":"Versi manual: struktur folder yang perlu ada","value":"versi-manual-struktur-folder-yang-perlu-ada","line":28,"column":0,"depth":3},"step-by-step-tulis-kode-minimal":{"type":"header","text":"Step-by-step: tulis kode minimal","value":"step-by-step-tulis-kode-minimal","line":59,"column":0,"depth":3},"versi-cepat-pakai-yo-code":{"type":"header","text":"Versi cepat: pakai yo code","value":"versi-cepat-pakai-yo-code","line":145,"column":0,"depth":3},"pilihan-di-prompt-yo-code":{"type":"header","text":"Pilihan di prompt yo code","value":"pilihan-di-prompt-yo-code","line":154,"column":0,"depth":4},"ngetes-hello-world-di-extension-development-host":{"type":"header","text":"Ngetes Hello World di Extension Development Host","value":"ngetes-hello-world-di-extension-development-host","line":333,"column":0,"depth":2},"coba-use-case-sederhana-extension-note-helper":{"type":"header","text":"Coba use case sederhana: extension note helper","value":"coba-use-case-sederhana-extension-note-helper","line":345,"column":0,"depth":2},"pelajaran-dari-dendron-vs-vanilla":{"type":"header","text":"Pelajaran dari Dendron vs vanilla","value":"pelajaran-dari-dendron-vs-vanilla","line":364,"column":0,"depth":2},"kekuatan-extension-vs-code-di-dendron":{"type":"header","text":"Kekuatan extension VS Code di Dendron","value":"kekuatan-extension-vs-code-di-dendron","line":374,"column":0,"depth":2},"batasan-praktis":{"type":"header","text":"Batasan praktis","value":"batasan-praktis","line":384,"column":0,"depth":2},"link-referensi-langsung":{"type":"header","text":"Link referensi langsung","value":"link-referensi-langsung","line":393,"column":0,"depth":2},"referensi-yang-gue-temuin-di-repo-dendron":{"type":"header","text":"Referensi yang gue temuin di repo Dendron","value":"referensi-yang-gue-temuin-di-repo-dendron","line":401,"column":0,"depth":2}},"children":[],"parent":"dfkbwdiovv8tm0u37ev27dz","data":{}},"body":"\u003ch1 id=\"vs-code-extension-dengan-typescript\"\u003eVS Code Extension dengan TypeScript\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vs-code-extension-dengan-typescript\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"kapan-pakai-ini\"\u003eKapan pakai ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-pakai-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue nulis ini karena gue lagi nyoba pakai Dendron, tapi extension VS Code-nya sudah lama gak di-maintain. Sepertinya \u003ccode\u003eplugin-core\u003c/code\u003e udah lama nggak di-maintain secara aktif, jadi gue pakai note ini untuk mencatat: kalau mau bikin extension dari nol, apa saja yang mesti dipahami dan dicobain.\u003c/p\u003e\n\u003ch2 id=\"kenapa-dendron-bikin-penasaran\"\u003eKenapa Dendron bikin penasaran\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-dendron-bikin-penasaran\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDendron di workspace gue udah kayak aplikasi sendiri: ada sidebar \u003ccode\u003eDendron\u003c/code\u003e, ada backlinks panel, ada graph panel, ada command untuk reload index. Tapi di belakangnya, extension ini bukan cuma request-response sederhana. Ada engine Dendron, ada file watcher, ada language feature, ada webview.\u003c/p\u003e\n\u003cp\u003eKarena belum pernah bikin extension VS Code sendiri, gue ingin tahu apakah semua itu benar-benar butuh begitu banyak layer. Lebih penting lagi, kenapa beberapa hal di Dendron masih terasa kurang mulus, misalnya: file baru kadang nggak langsung muncul di tree view, \u003ccode\u003eReload Index\u003c/code\u003e kadang lambat, dan webview-nya berat saat initial load.\u003c/p\u003e\n\u003ch2 id=\"mulai-dari-nol-vanilla-extension\"\u003eMulai dari nol: vanilla extension\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mulai-dari-nol-vanilla-extension\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSebelum nyerocos ke Dendron, gue mulai dengan versi paling kecil.\u003c/p\u003e\n\u003ch3 id=\"versi-manual-struktur-folder-yang-perlu-ada\"\u003eVersi manual: struktur folder yang perlu ada\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#versi-manual-struktur-folder-yang-perlu-ada\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau mau bikin extension tanpa generator, struktur dasar yang perlu dipahami adalah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003emy-extension/\n├── package.json\n├── tsconfig.build.json\n├── src/\n│   └── extension.ts\n├── out/\n│   └── extension.js\n└── .vscode/\n    └── launch.json\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epackage.json\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003emanifest extension. Menentukan nama, versi, \u003ccode\u003eengines.vscode\u003c/code\u003e, \u003ccode\u003eactivationEvents\u003c/code\u003e, \u003ccode\u003econtributes.commands\u003c/code\u003e, dan output JS.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/extension.ts\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003eentry point runtime.\u003c/li\u003e\n\u003cli\u003edi sini implementasi \u003ccode\u003eactivate(context)\u003c/code\u003e hidup.\u003c/li\u003e\n\u003cli\u003ebiasanya register command pakai \u003ccode\u003evscode.commands.registerCommand\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtext.subscriptions.push(...)\u003c/code\u003e wajib supaya cleanup kerja.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etsconfig.build.json\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003euntuk compile TypeScript ke \u003ccode\u003eout/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eumum pakai \u003ccode\u003emodule: commonjs\u003c/code\u003e, \u003ccode\u003eoutDir: ./out\u003c/code\u003e, dan \u003ccode\u003eexclude: [\"node_modules\", \".vscode-test\"]\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eout/\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003ehasil compile JS yang dijalankan VS Code.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eoptional: \u003ccode\u003e.vscode/launch.json\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003ekalau mau debug extension di Extension Development Host.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"step-by-step-tulis-kode-minimal\"\u003eStep-by-step: tulis kode minimal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#step-by-step-tulis-kode-minimal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah struktur siap, ini flow yang gue pakai buat bikin extension kecil:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003epackage.json\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003edefinisikan \u003ccode\u003ename\u003c/code\u003e, \u003ccode\u003edisplayName\u003c/code\u003e, \u003ccode\u003epublisher\u003c/code\u003e, \u003ccode\u003eversion\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003epastikan \u003ccode\u003emain\u003c/code\u003e mengarah ke \u003ccode\u003e./out/extension.js\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003etambahkan \u003ccode\u003eactivationEvents\u003c/code\u003e seperti \u003ccode\u003eonCommand:myExtension.helloWorld\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003edi \u003ccode\u003econtributes.commands\u003c/code\u003e, daftar command ID dan judulnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/extension.ts\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003eexport \u003ccode\u003eactivate(context: vscode.ExtensionContext)\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eregister command \u003ccode\u003evscode.commands.registerCommand(\"myExtension.helloWorld\", () =\u003e { ... })\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003epush disposables ke \u003ccode\u003econtext.subscriptions\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etsconfig.build.json\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003ecompile ke \u003ccode\u003eout/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eset \u003ccode\u003emodule: \"commonjs\"\u003c/code\u003e, \u003ccode\u003etarget: \"es2020\"\u003c/code\u003e, \u003ccode\u003eoutDir: \"out\"\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003einclude: [\"src\"]\u003c/code\u003e, \u003ccode\u003eexclude: [\"node_modules\", \".vscode-test\"]\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ebuild dan jalankan\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpm install\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm run compile\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ebuka folder extension di VS Code\u003c/li\u003e\n\u003cli\u003etekan \u003ccode\u003eF5\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ejalankan command Hello World di Extension Development Host\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eContoh minimal:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"name\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"my-extension\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"displayName\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"My Extension\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"publisher\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"me\"\u003c/span\u003e\u003cspan class=\"token punc ken punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    vscode\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003ewindow\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eshowInformationMessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e'Hello from my extension!'\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n  context\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003esubscriptions\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epush\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003edisposable\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\n\u003cspan class=\"token keyword module\"\u003eexport\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003edeactivate\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\u003cspan class=\"token punctuation\"\u n property\"\u003e\"skipLibCheck\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"include\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"src\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"exclude\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"node_modules\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\".vscode-test\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"versi-cepat-pakai-yo-code\"\u003eVersi cepat: pakai \u003ccode\u003eyo code\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#versi-cepat-pakai-yo-code\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau tidak mau ribet bikin semua file manual, \u003ccode\u003eyo code\u003c/code\u003e bisa jadi shortcut yang bagus.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eyo code\u003c/code\u003e akan scaffold manifest dan file \u003ccode\u003esrc/extension.ts\u003c/code\u003e otomatis.\u003c/li\u003e\n\u003cli\u003ehasil scaffold biasanya sudah punya \u003ccode\u003epackage.json\u003c/code\u003e, \u003ccode\u003etsconfig.json\u003c/code\u003e, \u003ccode\u003esrc/extension.ts\u003c/code\u003e, dan konfigurasi debug.\u003c/li\u003e\n\u003cli\u003esetelah itu tinggal fokus ke logic \u003ccode\u003eactivate()\u003c/code\u003e dan command saja.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eyo code\u003c/code\u003e sebenarnya adalah Yeoman generator yang menjalankan paket \u003ccode\u003egenerator-code\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4 id=\"pilihan-di-prompt-yo-code\"\u003ePilihan di prompt \u003ccode\u003eyo code\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pilihan-di-prompt-yo-code\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e➜  \u003cspan class=\"token number\"\u003e1\u003c/span\u003e-hello-world git:\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003emain\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e ✗ nix develop -c yo code\n\n     _-----_     ╭──────────────────────────╮\n    \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e       \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e    │   Welcome to the Visual  │\n    \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e--\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eo\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e--\u003cspan class=\"token operator\"\u003e|\u003c/span\u003e    │   Studio Code Extension  │\n   \u003cspan class=\"token variable\"\u003e\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e---------´   │        generator\u003cspan class=\"token operator\"\u003e!\u003c/span\u003e        │\n    \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e _´U\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e\u003c/span\u003e_ \u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e    ╰──────────────────────────╯\n    /___A___\u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e   /\n     \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e  ~  \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e     \n   __\u003cspan class=\"token string\"\u003e'.___.'\u003c/span\u003e__   \n ´   \u003cspan class=\"token variable\"\u003e\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e  \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e° ´ Y \u003cspan class=\"token variable\"\u003e`\u003c/span\u003e\u003c/span\u003e \n\n\u003cspan class=\"token variable\"\u003e\u003cspan class=\"token variable\"\u003e`\u003c/span\u003elist\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e\u003c/span\u003e prompt is deprecated. Use \u003cspan class=\"token variable\"\u003e\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e\u003cspan class=\"token keyword\"\u003eselect\u003c/span\u003e\u003cspan class=\"token variable\"\u003e`\u003c/span\u003e\u003c/span\u003e prompt instead.\n? What \u003cspan class=\"token builtin class-name\"\u003etype\u003c/span\u003e of extension \u003cspan class=\"token keyword\"\u003edo\u003c/span\u003e you want to create?\n❯ New Extension \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eTypeScript\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  New Extension \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eJavaScript\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  New Color Theme\n  New Language Support\n  New Code Snippets\n  New Keymap\n  New Extension Pack\n  New Language Pack \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eLocalization\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  New Web Extension \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eTypeScript\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  New Notebook Renderer \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eTypeScript\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSaat menjalankan \u003ccode\u003eyo code\u003c/code\u003e, generator biasanya menanyakan jenis extension yang ingin dibuat. Ini artinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eNew Extension (TypeScript)\u003c/code\u003e — buat extension VS Code dengan TypeScript. Ini pilihan paling umum jika mau mulai dari extension standar dan pakai TS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Extension (JavaScript)\u003c/code\u003e — versi tanpa TypeScript. Cocok kalau cuma mau coba cepat tanpa setup TS.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Color Theme\u003c/code\u003e — bikin extension tema warna saja. Hasilnya akan menghasilkan skema warna dan konfigurasi tema VS Code.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Language Support\u003c/code\u003e — untuk bikin extension bahasa baru dengan syntax highlighting, snippets, dan grammar. Pilihan ini cocok kalau ingin menambahkan dukungan bahasa di editor.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Code Snippets\u003c/code\u003e — buat extension berisi potongan kode (\u003ccode\u003esnippets\u003c/code\u003e) yang bisa dipanggil lewat Intellisense. Cocok untuk paket tooling atau snippet library.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Keymap\u003c/code\u003e — extension yang mengubah keybinding atau menyalin layout keybindings dari editor lain.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Extension Pack\u003c/code\u003e — kumpulan extension lain dalam satu paket. Biasanya dipakai untuk bundling extension yang saling terkait.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Language Pack (Localization)\u003c/code\u003e — extension terjemahan untuk UI VS Code. Bukan extension fungsional, tapi menambahkan dukungan bahasa ke VS Code.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Web Extension (TypeScript)\u003c/code\u003e — versi extension yang bisa berjalan di environment web, bukan hanya desktop VS Code. Penting jika ingin extension kompatibel dengan \u003ccode\u003evscode.dev\u003c/code\u003e atau browser-based VS Code.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNew Notebook Renderer (TypeScript)\u003c/code\u003e — untuk bikin renderer custom pada notebook cell VS Code. Ini lebih spesifik dan berguna kalau butuh tampilan notebook yang berbeda.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSetelah memilih jenis extension, generator akan menanyakan nama extension, identifier, deskripsi, dan beberapa opsi lain. Setelah itu, semua file yang diperlukan akan otomatis dibuat.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\n     _-----_     ╭──────────────────────────╮\n    |       |    │   Welcome to the Visual  │\n    |--(o)--|    │   Studio Code Extension  │\n   `---------´   │        generator!        │\n    ( _´U`_ )    ╰──────────────────────────╯\n    /___A___\\   /\n     |  ~  |     \n   __'.___.'__   \n ´   `  |° ´ Y ` \n\n`list` prompt is deprecated. Use `select` prompt instead.\n✔ What type of extension do you want to create? New Extension (TypeScript)\n✔ What's the name of your extension? hello-world\n✔ What's the identifier of your extension? poc-hello-world\n✔ What's the description of your extension? first extentions vscode\n✔ Initialize a git repository? Yes\n`list` prompt is deprecated. Use `select` prompt instead.\n? Which bundler to use?\n❯ unbundled\n  webpack\n  esbuild\n? Which package manager to use?\n  npm\n  yarn\n❯ pnpm\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eyo code\u003c/code\u003e juga nanya package manager. Pilihannya biasanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpm\u003c/code\u003e — paling aman dan paling umum, cocok kalau pengen nge-minimal toolchain.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eyarn\u003c/code\u003e — enak kalau pengen lockfile lebih stabil dan workflow yang lebih rapi, tapi ada dua generasi (Classic vs Berry) jadi perlu tahu versi yang dipakai.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epnpm\u003c/code\u003e — paling cepat install dan paling hemat disk, karena dia pakai store global dan symlink. Biasa jadi pilihan bagus untuk proyek besar atau monorepo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk extension kecil, \u003ccode\u003enpm\u003c/code\u003e sudah cukup. Kalau pengen upgrade experience di repo yang lebih besar, \u003ccode\u003epnpm\u003c/code\u003e biasanya paling menarik, asalkan semua orang di tim nyaman ikut pakai.\u003c/p\u003e\n\u003cp\u003eApa itu \u003ccode\u003ebundler\u003c/code\u003e? Itu opsi untuk memilih apakah ingin menggunakan bundler seperti Webpack atau esbuild untuk mengemas extension. Biasanya, untuk extension sederhana, \u003ccode\u003eunbundled\u003c/code\u003e sudah cukup. Bundler lebih berguna jika ada banyak dependensi atau ingin optimasi ukuran extension.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUnbundled: extension akan tetap dalam format file terpisah. Cocok untuk proyek kecil atau jika ingin kontrol penuh atas struktur file.\u003c/li\u003e\n\u003cli\u003eWebpack: menggunakan Webpack untuk mengemas semua file dan dependensi menjadi satu bundle.js. Ini bisa mempercepat load extension, tapi setup-nya lebih kompleks.\u003c/li\u003e\n\u003cli\u003eesbuild: alternatif bundler yang lebih cepat daripada Webpack. Cocok jika ingin bundling cepat dengan konfigurasi minimal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePerbedaan utama antara bundler dan unbundled adalah pada performa dan target deployment. VS Code docs menyarankan bundling ketika extension ingin mendukung Web (github.dev/vscode.dev) karena browser hanya bisa memuat satu bundled file saja.\u003c/p\u003e\n\u003cp\u003eTabel perbandingan:\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOpsi Bundler\u003c/th\u003e\u003cth\u003eKelebihan\u003c/th\u003e\u003cth\u003eKekurangan\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eUnbundled\u003c/td\u003e\u003ctd\u003eSetup sederhana, kontrol penuh\u003c/td\u003e\u003ctd\u003eLoad lebih lambat jika banyak file\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWebpack\u003c/td\u003e\u003ctd\u003eLoad lebih cepat, optimasi ukuran\u003c/td\u003e\u003ctd\u003eSetup kompleks, waktu build lebih lama\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eesbuild\u003c/td\u003e\u003ctd\u003eLoad cepat, setup minimal\u003c/td\u003e\u003ctd\u003eKurang fleksibel dibanding Webpack\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eKenapa gak pake Bun?\u003c/p\u003e\n\u003cp\u003eGue pernah mikir sama: Bun sekarang punya bundler dan klaim benchmark super cepat, jadi kenapa gak langsung pakai Bun untuk extension VS Code juga?\u003c/p\u003e\n\u003cp\u003eJawabannya: buat VS Code extension, dokumentasi resmi masih fokus ke bundler yang jelas-support \u003ccode\u003evscode\u003c/code\u003e runtime seperti Webpack dan esbuild. Bun bilang dia bisa bundling 10.000 React component dalam 269.1ms, lebih cepat dari esbuild di benchmarknya, tetapi itu benchmark umum bundling, bukan khusus \u003ccode\u003evscode\u003c/code\u003e extension. Sementara VS Code butuh bundling yang nge-exclude \u003ccode\u003evscode\u003c/code\u003e runtime module dan bisa cocok untuk web extension.\u003c/p\u003e\n\u003cp\u003eFakta tambahan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eVS Code docs \u003ccode\u003eBundling Extensions\u003c/code\u003e menyebutkan bundling penting untuk \u003ccode\u003evscode.dev\u003c/code\u003e/\u003ccode\u003egithub.dev\u003c/code\u003e karena browser hanya bisa memuat satu file untuk extension code. (\u003ca href=\"https://code.visualstudio.com/api/working-with-extensions/bundling-extension\"\u003esource\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eesbuild klaim dapat melakukan bundle production untuk 10 copy tiga.js dari scratch dalam ~0.39 detik, sedangkan webpack 5 butuh ~41.21 detik di benchmark default. Itu berarti esbuild bisa 100x lebih cepat dalam skenario bundling sederhana. (\u003ca href=\"https://esbuild.github.io/faq/#benchmark-details\"\u003esource\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eBun klaim bundle 10.000 React components dalam 269.1ms, lebih cepat dari esbuild 571.9ms dan webpack 41.21s di benchmark Bun. (\u003ca href=\"https://bun.sh/\"\u003esource\u003c/a\u003e)\u003c/li\u003e\n\u003cli\u003eUntuk extension kecil tanpa banyak dependensi, \u003ccode\u003eunbundled\u003c/code\u003e tetap valid dan lebih mudah karena tidak perlu konfigurasi bundler.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau butuh referensi \u003ccode\u003eyo code\u003c/code\u003e lebih lengkap, lihat TIL \u003ca href=\"/sotoy/notes/til.vscode.yo-code\"\u003eYo Code untuk Extension VS Code\u003c/a\u003e di repo ini — ini catatan internal, bukan link Dendron.\u003c/p\u003e\n\u003cp\u003eDari Dendron, yang paling mirip adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/package.json\u003c/code\u003e untuk manifest besar\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/src/_extension.ts\u003c/code\u003e sebagai entry point\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau yang simple, cukup: \u003ccode\u003eactivationEvents\u003c/code\u003e pakai \u003ccode\u003eonCommand:myExtension.helloWorld\u003c/code\u003e, lalu register satu command. Itu sudah cukup buat start.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e✔ Which package manager to use? pnpm\n\nWriting in /Users/zeihanaulia/Programming/research/vscode/1-hello-world/poc-hello-world...\n   create poc-hello-world/.vscode/extensions.json\n   create poc-hello-world/.vscode/launch.json\n   create poc-hello-world/.vscode/settings.json\n   create poc-hello-world/.vscode/tasks.json\n   create poc-hello-world/package.json\n   create poc-hello-world/tsconfig.json\n   create poc-hello-world/.vscodeignore\n   create poc-hello-world/vsc-extension-quickstart.md\n   create poc-hello-world/.gitignore\n   create poc-hello-world/README.md\n   create poc-hello-world/CHANGELOG.md\n   create poc-hello-world/src/extension.ts\n   create poc-hello-world/src/test/extension.test.ts\n   create poc-hello-world/.vscode-test.mjs\n   create poc-hello-world/eslint.config.mjs\n   create poc-hello-world/.npmrc\n\nChanges to package.json were detected.\n\nRunning pnpm install for you to install the required dependencies.\n WARN  1 deprecated subdependencies found: glob@10.5.0\nPackages: +229\n+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++\nProgress: resolved 229, reused 229, downloaded 0, added 229, done\n\ndevDependencies:\n+ @types/mocha 10.0.10\n+ @types/node 22.19.17 (25.6.0 is available)\n+ @types/vscode 1.118.0\n+ @vscode/test-cli 0.0.12\n+ @vscode/test-electron 2.5.2\n+ eslint 9.39.4 (10.3.0 is available)\n+ typescript 5.9.3 (6.0.3 is available)\n+ typescript-eslint 8.59.2\n\nDone in 3.3s using pnpm v10.23.0\n\nYour extension poc-hello-world has been created!\n\nTo start editing with Visual Studio Code, use the following commands:\n\n     code poc-hello-world\n\nOpen vsc-extension-quickstart.md inside the new extension for further instructions\non how to modify, test and publish your extension.\n\nFor more information, also visit http://code.visualstudio.com and follow us @code.\n\n\n`list` prompt is deprecated. Use `select` prompt instead.\n✔ Do you want to open the new folder with Visual Studio Code? Open with `code`\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eoke, extension sudah siap. Sekarang tinggal buka folder \u003ccode\u003epoc-hello-world\u003c/code\u003e di VS Code, lalu ikuti instruksi di \u003ccode\u003evsc-extension-quickstart.md\u003c/code\u003e untuk mulai testing dan modifikasi.\u003c/p\u003e\n\u003ch2 id=\"ngetes-hello-world-di-extension-development-host\"\u003eNgetes Hello World di Extension Development Host\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ngetes-hello-world-di-extension-development-host\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni penting: \u003ccode\u003enpm run compile\u003c/code\u003e hanya mengubah TypeScript jadi JavaScript di folder \u003ccode\u003eout/\u003c/code\u003e. Itu bukan action yang langsung aktif di VS Code biasa atau di macOS. Kalau belum dijalankan lewat \u003ccode\u003eF5\u003c/code\u003e, tidak akan ada efek yang terasa. Kalau sudah muncul \u003ccode\u003eout/extension.js\u003c/code\u003e, berarti build TypeScript-nya sukses.\nKalau notifikasi muncul di Extension Development Host, berarti basic flownya juga sudah benar.\u003c/p\u003e\n\u003cp\u003eSetelah scaffold, langkah testing-nya begini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpm install\u003c/code\u003e atau \u003ccode\u003epnpm install\u003c/code\u003e kalau pakai pnpm\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm run compile\u003c/code\u003e atau \u003ccode\u003epnpm run compile\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003etekan cmd + shift + P, lalu pilih \u003ccode\u003eDebug: Start Debugging\u003c/code\u003e atau tekan \u003ccode\u003eF5\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eSetelah muncul window baru (Extension Development Host), tekan cmd + shift + P lagi, lalu cari command \u003ccode\u003eHello World\u003c/code\u003e yang sudah didaftarkan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"coba-use-case-sederhana-extension-note-helper\"\u003eCoba use case sederhana: extension note helper\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#coba-use-case-sederhana-extension-note-helper\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBiar nggak cuma Hello World, gue cari use case simpel yang masih relevan dengan Dendron: bikin extension yang bantu cari dan buka note.\u003c/p\u003e\n\u003cp\u003eUse case yang gue bayangkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecommand \u003ccode\u003eOpen Note by ID\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003einput prompt \u003ccode\u003eNote ID\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eextension cari file Markdown di workspace\u003c/li\u003e\n\u003cli\u003elalu buka file tersebut di editor\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKenapa ini menarik?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehampir semua extension VS Code butuh command + input + workspace file access\u003c/li\u003e\n\u003cli\u003edari sini ketahuan apakah \u003ccode\u003evscode.workspace.findFiles\u003c/code\u003e dan \u003ccode\u003evscode.window.showQuickPick\u003c/code\u003e cukup\u003c/li\u003e\n\u003cli\u003edan bisa dibandingkan dengan Dendron yang sudah punya note lookup built-in\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau ini jalan, berarti basic extension flow sudah cukup untuk implementasi fitur note/navigation.\u003c/p\u003e\n\u003ch2 id=\"pelajaran-dari-dendron-vs-vanilla\"\u003ePelajaran dari Dendron vs vanilla\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pelajaran-dari-dendron-vs-vanilla\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBeberapa hal yang sekarang gue anggap penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eactivationEvents: [\"*\"]\u003c/code\u003e di Dendron membuat extension aktif sangat dini. Itu ngebantu kalau extension punya banyak panel, tapi juga berarti startup lebih berat.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtributes.commands\u003c/code\u003e di \u003ccode\u003epackage.json\u003c/code\u003e itu cuma daftar. Logic aslinya ada di TypeScript.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ewebview\u003c/code\u003e besar dan terisolasi. Kalau butuh UI custom, harus siap kirim pesan bolak-balik.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eFileSystemWatcher\u003c/code\u003e itu penting, tapi gampang bikin out-of-sync kalau pattern-nya nggak benar.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eReload Index\u003c/code\u003e di Dendron bukan sekedar reload VS Code; itu rebuild engine dan parse note, jadi terasa lebih lambat daripada \u003ccode\u003eworkbench.action.reloadWindow\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kekuatan-extension-vs-code-di-dendron\"\u003eKekuatan extension VS Code di Dendron\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kekuatan-extension-vs-code-di-dendron\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari repo ini, gue lihat extension bisa dipakai untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebikin UI Dendron langsung di VS Code lewat tree view dan webview\u003c/li\u003e\n\u003cli\u003eexpose command custom untuk workflow note-taking dan engine control\u003c/li\u003e\n\u003cli\u003etambah language intelligence Markdown / frontmatter\u003c/li\u003e\n\u003cli\u003emonitor file dan workspace event\u003c/li\u003e\n\u003cli\u003ehandle workspace trust, shell support, dan telemetry\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"batasan-praktis\"\u003eBatasan praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batasan-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTapi ada batasan yang perlu diingat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eextension cuma bisa pakai API resmi VS Code. Kalau nggak ada kontribusi resmi, nggak bisa nyuntik langsung ke editor core.\u003c/li\u003e\n\u003cli\u003ewebview harus komunikasi via \u003ccode\u003epostMessage\u003c/code\u003e; nggak bisa panggil fungsi JS extension langsung.\u003c/li\u003e\n\u003cli\u003edi mode web extension, beberapa API Node/shell mungkin nggak tersedia.\u003c/li\u003e\n\u003cli\u003efitur berat seperti reload engine bisa terasa lambat, dan itu biasanya bukan salah VS Code tapi domain logic yang sudah kompleks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"link-referensi-langsung\"\u003eLink referensi langsung\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#link-referensi-langsung\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOfficial VS Code tutorial: \u003ca href=\"https://code.visualstudio.com/api/get-started/your-first-extension\"\u003ehttps://code.visualstudio.com/api/get-started/your-first-extension\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eSample repo Hello World: \u003ca href=\"https://github.com/microsoft/vscode-extension-samples/tree/main/helloworld-sample\"\u003ehttps://github.com/microsoft/vscode-extension-samples/tree/main/helloworld-sample\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArtikel step-by-step TS extension: \u003ca href=\"https://dev.to/fabrikapp/how-to-make-a-vs-code-extension-using-typescript-a-step-by-step-guide-1hp6\"\u003ehttps://dev.to/fabrikapp/how-to-make-a-vs-code-extension-using-typescript-a-step-by-step-guide-1hp6\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArtikel komprehensif TypeScript: \u003ca href=\"https://www.blog.brightcoding.dev/2024/04/29/building-a-vs-code-extension-with-typescript-a-comprehensive-guide/\"\u003ehttps://www.blog.brightcoding.dev/2024/04/29/building-a-vs-code-extension-with-typescript-a-comprehensive-guide/\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eArtikel pengembang lanjut: \u003ca href=\"https://hemaks.org/posts/developing-extensions-for-visual-studio-code-with-typescript/\"\u003ehttps://hemaks.org/posts/developing-extensions-for-visual-studio-code-with-typescript/\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi-yang-gue-temuin-di-repo-dendron\"\u003eReferensi yang gue temuin di repo Dendron\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-yang-gue-temuin-di-repo-dendron\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/vsc-extension-quickstart.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/.vscode/launch.json\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/package.json\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epackages/plugin-core/src/_extension.ts\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evscode (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etypescript (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"ena
