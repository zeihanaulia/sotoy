tainer-oss":{"type":"header","text":"Maintainer OSS","value":"maintainer-oss","line":74,"column":0,"depth":3},"batasan-dan-risiko":{"type":"header","text":"Batasan dan risiko","value":"batasan-dan-risiko","line":78,"column":0,"depth":2},"implementasi-sehat-buat-dunia-nyata":{"type":"header","text":"Implementasi sehat buat dunia nyata","value":"implementasi-sehat-buat-dunia-nyata","line":86,"column":0,"depth":2},"korelasi-konsep-lain":{"type":"header","text":"Korelasi konsep lain","value":"korelasi-konsep-lain","line":95,"column":0,"depth":2},"insight-penting":{"type":"header","text":"Insight penting","value":"insight-penting","line":101,"column":0,"depth":2},"referensi-terkait":{"type":"header","text":"Referensi terkait","value":"referensi-terkait","line":110,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":113,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"deepsec-security-harness-untuk-codebase-besar\"\u003eDeepsec: security harness untuk codebase besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#deepsec-security-harness-untuk-codebase-besar\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue sekarang nangkep Deepsec bukan sebagai scanner biasa. Menurut gue dia lebih kayak \"security harness\" yang ngatur agent, bukan cuma ngasih AI buat ngecek kode.\u003c/p\u003e\n\u003ch2 id=\"masalah-fundamental-yang-diselesaikan-deepsec\"\u003eMasalah fundamental yang diselesaikan Deepsec\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#masalah-fundamental-yang-diselesaikan-deepsec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003erepo modern terlalu besar buat direview manual.\u003c/li\u003e\n\u003cli\u003ebug keamanan sering muncul dari relasi antar file, bukan pattern tunggal.\u003c/li\u003e\n\u003cli\u003escanner tradisional jago rule, tapi lemah kalau konteksnya kompleks.\u003c/li\u003e\n\u003cli\u003eproblem nyata biasanya ada di flow: auth, permission, webhook, server action, dan boundary data.\u003c/li\u003e\n\u003cli\u003eDeepsec berusaha menemukan area sensitif dulu, kemudian ngerjain investigasi yang lebih dalam.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-itu-security-harness\"\u003eApa itu \"security harness\"?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-security-harness\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebuat gue, harness itu sistem yang ngatur proses, bukan cuma model.\u003c/li\u003e\n\u003cli\u003edia merangkum: menentukan scope, ngejalain agent, validasi, ngasih severity, dan nempelkan owner.\u003c/li\u003e\n\u003cli\u003eini bedanya Deepsec sama scanner yang output-nya cuma \"ada issue\" tanpa bukti.\u003c/li\u003e\n\u003cli\u003ekalau cuma scanner, outputnya mentah. kalau harness, outputnya mesti bisa ditindaklanjuti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"workflow-deepsec\"\u003eWorkflow Deepsec\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workflow-deepsec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-scan\"\u003e1. Scan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-scan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec mulai dari regex-only scan ke seluruh file.\u003c/li\u003e\n\u003cli\u003emenurut gue ini langkah bagus: LLM mahal, jadi pakai dulu cara murah untuk cari hotspot.\u003c/li\u003e\n\u003cli\u003eini mirip cara kerja security engineer: jangan baca semua file, cari yang berisiko dulu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-investigate\"\u003e2. Investigate\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-investigate\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003esetelah kandidat ketemu, baru agent masuk.\u003c/li\u003e\n\u003cli\u003eagent ini nggak cuma cari pattern. dia nonton flow, cek mitigasi, lihat reachable path, dan nilai impact.\u003c/li\u003e\n\u003cli\u003eintinya: bukan sekadar \"ada input user\". yang penting adalah \"apakah kontrolnya cukup?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-revalidate\"\u003e3. Revalidate\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-revalidate\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eini yang penting buat gue.\u003c/li\u003e\n\u003cli\u003eDeepsec nggak berhenti di satu pass. ada run kedua buat ngecek hasil pertama.\u003c/li\u003e\n\u003cli\u003erevalidate berfungsi buat nurunin false positive dan ngoreksi severity.\u003c/li\u003e\n\u003cli\u003ekalau agent cuma sekali, hasilnya sering overclaim.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-enrich\"\u003e4. Enrich\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-enrich\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec nggak cuma kasih issue, tapi coba nempelkan metadata dan owner.\u003c/li\u003e\n\u003cli\u003eini penting karena kalau issue nggak punya pemilik, dia bakal mati di dashboard.\u003c/li\u003e\n\u003cli\u003etemuan security harus bisa ditangani engineering, bukan cuma dicatat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-export\"\u003e5. Export\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-export\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ehasilnya bisa diekspor jadi instruksi, ticket, atau prompt agent lain.\u003c/li\u003e\n\u003cli\u003emenurut gue ini poin kritis: output harus bisa langsung dipakai, bukan cuma \"ada masalah\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"use-case-realistis\"\u003eUse case realistis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#use-case-realistis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"audit-repo-besar-sebelum-release\"\u003eAudit repo besar sebelum release\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#audit-repo-besar-sebelum-release\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec paling masuk akal buat app yang kompleks: multi-tenant, admin API, billing, webhook.\u003c/li\u003e\n\u003cli\u003enggak semua commit perlu diskip. lebih cocok sebelum major release atau audit domain berisiko.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"scheduled-audit-area-berisiko\"\u003eScheduled audit area berisiko\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#scheduled-audit-area-berisiko\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003emenurut gue, lebih sehat jalankan berkala di repo penting.\u003c/li\u003e\n\u003cli\u003ehasilnya masuk backlog security, lalu ditriage sebelum sprint.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"fokus-area-sensitif\"\u003eFokus area sensitif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#fokus-area-sensitif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eyang worth: auth/session, RBAC/ABAC, tenant isolation, payment, webhook, upload, fetch, secret management.\u003c/li\u003e\n\u003cli\u003eini bikin Deepsec nggak jadi \"satpam semua file\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"custom-matcher\"\u003eCustom matcher\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#custom-matcher\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003etemuan awal nggak cukup. yang paling berguna adalah jika temuan itu jadi matcher baru.\u003c/li\u003e\n\u003cli\u003econtoh: kalau satu endpoint admin ilang permission check, bikin matcher buat cari pola serupa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"maintainer-oss\"\u003eMaintainer OSS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#maintainer-oss\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec juga bisa bantu OSS maintainer yang butuh laporan actionable.\u003c/li\u003e\n\u003cli\u003etapi disclosure harus hati-hati.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"batasan-dan-risiko\"\u003eBatasan dan risiko\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batasan-dan-risiko\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003efalse positive masih ada.\u003c/li\u003e\n\u003cli\u003eDeepsec bukan oracle. output tetap perlu triage manusia.\u003c/li\u003e\n\u003cli\u003ekualitas sangat bergantung model, prompt, dan budget.\u003c/li\u003e\n\u003cli\u003ebiaya bisa besar kalau scan full repo tanpa prioritas.\u003c/li\u003e\n\u003cli\u003ekalau codebase dieksekusi lewat cloud, kontrol source code masih penting.\u003c/li\u003e\n\u003cli\u003efinding yang nggak actionable malah jadi beban.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"implementasi-sehat-buat-dunia-nyata\"\u003eImplementasi sehat buat dunia nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implementasi-sehat-buat-dunia-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ejangan langsung scan semua repo.\u003c/li\u003e\n\u003cli\u003emulai dari satu repo penting dan satu domain risiko.\u003c/li\u003e\n\u003cli\u003ebikin rubric triage: validitas, reachable, impact, auth/public, confidence.\u003c/li\u003e\n\u003cli\u003eekspor langsung ke ticket dengan owner dan bukti.\u003c/li\u003e\n\u003cli\u003ebuat custom matcher dari temuan valid.\u003c/li\u003e\n\u003cli\u003escan manual dulu sebelum release besar, baru scale.\u003c/li\u003e\n\u003cli\u003eCI gate cuma di area tertentu jika SNR-nya sudah bagus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"korelasi-konsep-lain\"\u003eKorelasi konsep lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#korelasi-konsep-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eSAST: Deepsec pakai rule awal, tapi nambah reasoning kontekstual.\u003c/li\u003e\n\u003cli\u003efuzzing: keduanya eksploratif. fuzzing punya oracle crash; Deepsec butuh verifikasi semantik.\u003c/li\u003e\n\u003cli\u003epentest: Deepsec agak mirip pola pikir pentester, tapi manusia masih lebih kuat di konteks bisnis dan exploit kompleks.\u003c/li\u003e\n\u003cli\u003eSecure SDLC: Deepsec bisa jadi lapisan baru di antara SAST dan pentest manusia.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight-penting\"\u003eInsight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec bukan cuma agent. dia sistem kerja.\u003c/li\u003e\n\u003cli\u003etanpa scan awal, agent keborosan.\u003c/li\u003e\n\u003cli\u003etanpa investigation, scan cuma pattern matcher.\u003c/li\u003e\n\u003cli\u003etanpa revalidate, output rentan noisy.\u003c/li\u003e\n\u003cli\u003etanpa enrich, temuan bisa hilang.\u003c/li\u003e\n\u003cli\u003etanpa export, hasil nggak masuk workflow.\u003c/li\u003e\n\u003cli\u003eyang penting bukan \"pakai model apa\", tapi \"bagaimana temuan diverifikasi dan dikonversi jadi patch\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi-terkait\"\u003eReferensi terkait\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-terkait\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179908\"\u003eAI security review perlu harness dan triage, bukan hanya agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179970\"\u003eRevalidation dan ownership adalah kunci agar output agent tidak menjadi noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179973\"\u003eParallel agents hanya berguna jika hasilnya didedup dan dikonsolidasikan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179975\"\u003eRule-based checks tetap penting di era AI-native security\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179977\"\u003eCustom matcher mengubah temuan menjadi aturan yang bisa dipakai ulang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179979\"\u003eBiaya, sandbox, dan egress adalah concern arsitektur keamanan first-class\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179981\"\u003eFinding keamanan butuh bukti yang actionable kapan pun bisa\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179982\"\u003eOwnership adalah bagian dari penyelesaian security finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-security (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edeepsec (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179967\"\u003eAgentic coding tools adalah process dengan permission, bukan autocomplete\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179973\"\u003eParallel agents hanya berguna jika hasilnya didedup dan dikonsolidasikan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179977\"\u003eCustom matcher mengubah temuan menjadi aturan yang bisa dipakai ulang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179981\"\u003eFinding keamanan butuh bukti yang actionable kapan pun bisa\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179982\"\u003eOwnership adalah bagian dari penyelesaian security finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-challenges\"\u003eDeepsec challenge: orchestration, false positives, cost, dan workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust-evaluation\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized
