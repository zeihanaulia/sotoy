sight utama","value":"insight-utama","line":67,"column":0,"depth":2},"referensi-utama":{"type":"header","text":"Referensi utama","value":"referensi-utama","line":80,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":93,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"deepsec-docs-workflow-harness-bukan-scanner-sekali-jalan\"\u003eDeepsec docs: workflow harness, bukan scanner sekali jalan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#deepsec-docs-workflow-harness-bukan-scanner-sekali-jalan\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca docs \u003ccode\u003evercel-labs/deepsec\u003c/code\u003e dan yang paling nyangkut buat gue adalah: Deepsec itu bukan lagi tool yang cuma jalan sekali lalu selesai. Dia dibuat sebagai workspace security review yang ngatur seluruh proses.\u003c/p\u003e\n\u003ch2 id=\"1-instalasi-dan-workspace-terpisah\"\u003e1. Instalasi dan workspace terpisah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-instalasi-dan-workspace-terpisah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpx deepsec init\u003c/code\u003e bikin folder \u003ccode\u003e.deepsec/\u003c/code\u003e di repo.\u003c/li\u003e\n\u003cli\u003eini penting karena konfigurasi dan data scan disimpen terpisah dari kode aplikasi.\u003c/li\u003e\n\u003cli\u003eoutput scan dan state (\u003ccode\u003edata/\u0026#x3C;id\u003e/files/\u003c/code\u003e, \u003ccode\u003eruns/\u003c/code\u003e, \u003ccode\u003eproject.json\u003c/code\u003e) digitignore.\u003c/li\u003e\n\u003cli\u003emenurut gue ini langkah yang bener: workspace terpisah bikin lingkungan scan lebih jelas.\u003c/li\u003e\n\u003cli\u003eidempotency juga penting: kalau job gagal, bisa dilanjutkan bukan mulai dari nol.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-bagaimana-deepsec-memilih-file-untuk-agent\"\u003e2. Bagaimana deepsec memilih file untuk agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-bagaimana-deepsec-memilih-file-untuk-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epnpm deepsec scan\u003c/code\u003e jalan duluan, tanpa AI.\u003c/li\u003e\n\u003cli\u003escan ngejalanin ~110 regex matcher dan bikin JSON file per source file yang match.\u003c/li\u003e\n\u003cli\u003eini mirip radar murah untuk nemuin candidate site.\u003c/li\u003e\n\u003cli\u003emenurut gue, ini desain yang realistis: jangan suruh AI baca semua file.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-context-project-lewat-infomd\"\u003e3. Context project lewat INFO.md\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-context-project-lewat-infomd\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eINFO.md\u003c/code\u003e diwacanakan sebagai konteks yang disuntik ke agent.\u003c/li\u003e\n\u003cli\u003eidealnya singkat: 50–100 baris, fokus ke threat model, auth shape, false-positive, konvensi internal.\u003c/li\u003e\n\u003cli\u003ekalau konteks terlalu panjang, agent malah bisa kabur.\u003c/li\u003e\n\u003cli\u003emenurut gue, ini pelajaran penting: konteks bukan berarti lebih banyak, tapi lebih relevan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-bagaimana-hasil-disimpan-dan-divalidasi\"\u003e4. Bagaimana hasil disimpan dan divalidasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-bagaimana-hasil-disimpan-dan-divalidasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003edata/\u003c/code\u003e itu state Deepsec: project.json, config.json, INFO.md, files/, runs/, reports/.\u003c/li\u003e\n\u003cli\u003etiap \u003ccode\u003eFileRecord\u003c/code\u003e nyimpen candidate, hash, git info, findings, history, dan status.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epnpm deepsec process\u003c/code\u003e ngejalanin agent. defaultnya Claude Opus dengan 25 file in flight.\u003c/li\u003e\n\u003cli\u003ebiaya diperkirakan: 100 file ≈ $25–60, 500 file ≈ $130–300, 2.000 file ≈ $500–1.200.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epnpm deepsec triage\u003c/code\u003e murah, \u003ccode\u003erevalidate\u003c/code\u003e lebih mahal tapi ngurangin false positive.\u003c/li\u003e\n\u003cli\u003emenurut gue, itu step yang saya suka: ada mekanisme audit dan verification.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-workflow-nyata\"\u003e5. Workflow nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-workflow-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003elokal dulu: init, isi INFO.md, scan, process --limit 50, revalidate --min-severity HIGH, export.\u003c/li\u003e\n\u003cli\u003ejangan langsung full monorepo.\u003c/li\u003e\n\u003cli\u003earea target terbaik: auth/session, RBAC, tenant isolation, billing, webhook, file upload, server-side fetch.\u003c/li\u003e\n\u003cli\u003eplugin ownership dan notifier bikin hasil bisa masuk workflow tim.\u003c/li\u003e\n\u003cli\u003esandbox relevan kalau repo besar atau kalau butuh isolasi.\u003c/li\u003e\n\u003cli\u003ekalau cuma mau coba, lokal dulu. sandbox nggak wajib.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-gue-pelajari-dari-docs\"\u003eApa yang gue pelajari dari docs\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-pelajari-dari-docs\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec bukan cuma agent. dia adalah workflow platform kecil.\u003c/li\u003e\n\u003cli\u003eAI hanya salah satu bagian. Ada scan awal, context injection, revalidate, state, dan export.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eINFO.md\u003c/code\u003e bikin agent lebih tajam.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erevalidate\u003c/code\u003e jelas menunjukkan bahwa developer harus curiga sama output awal.\u003c/li\u003e\n\u003cli\u003eownership/notifier bikin temuan lebih mungkin ditindaklanjuti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"batasan-operasional\"\u003eBatasan operasional\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batasan-operasional\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDeepsec cocok untuk audit burst, bukan scan setiap PR terus-menerus.\u003c/li\u003e\n\u003cli\u003ebiaya bisa nyata, jadi butuh budget dan pengaturan area.\u003c/li\u003e\n\u003cli\u003edefault matcher nggak menangkap semua pola org-specific.\u003c/li\u003e\n\u003cli\u003ejika pakai remote sandbox/gateway, perlu atur security source code sendiri.\u003c/li\u003e\n\u003cli\u003eoutput banyak belum cukup; harus ditriage dan diekspor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight-utama\"\u003eInsight utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDocs ini bikin gue sadar bahwa keamanan AI-native bukan cuma soal model. Ini soal cara kerja.\u003c/p\u003e\n\u003cp\u003ePola yang gue tangkep:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003escan murah dulu,\u003c/li\u003e\n\u003cli\u003econtext spesifik lewat INFO.md,\u003c/li\u003e\n\u003cli\u003eagent proses candidate,\u003c/li\u003e\n\u003cli\u003etriage dan revalidate sebelum percaya,\u003c/li\u003e\n\u003cli\u003esimpan state di data/,\u003c/li\u003e\n\u003cli\u003ehubungkan hasil ke workflow.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau elo ngerti docs-nya, pertanyaannya bukan \"model apa?\" lagi, tapi \"bagaimana ini diintegrasikan ke workflow kita?\"\u003c/p\u003e\n\u003ch2 id=\"referensi-utama\"\u003eReferensi utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eREADME.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/getting-started.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/writing-matchers.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/configuration.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/plugins.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/models.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/vercel-setup.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/architecture.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/data-layout.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/faq.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esamples/webapp/deepsec.config.ts\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179970\"\u003eRevalidation dan ownership adalah kunci agar output agent tidak menjadi noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179975\"\u003eRule-based checks tetap penting di era AI-native security\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179976\"\u003eContext AI harus ringkas dan spesifik untuk menjaga signal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179977\"\u003eCustom matcher mengubah temuan menjadi aturan yang bisa dipakai ulang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179978\"\u003eCI security gate butuh threshold dan baseline, bukan fail-on-any-finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179979\"\u003eBiaya, sandbox, dan egress adalah concern arsitektur keamanan first-class\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edeepsec (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-security (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777995556481\"\u003eAudit trust boundary lokal sebagai ide keamanan developer\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179970\"\u003eRevalidation dan ownership adalah kunci agar output agent tidak menjadi noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179974\"\u003eTooling keamanan gagal jika hanya menambah dashboard dan handoff\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179975\"\u003eRule-based checks tetap penting di era AI-native security\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179976\"\u003eContext AI harus ringkas dan spesifik untuk menjaga signal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179977\"\u003eCustom matcher mengubah temuan menjadi aturan yang bisa dipakai ulang\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179978\"\u003eCI security gate butuh threshold dan baseline, bukan fail-on-any-finding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179979\"\u003eBiaya, sandbox, dan egress adalah concern arsitektur keamanan first-class\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-challenges\"\u003eDeepsec challenge: orchestration, false positives, cost, dan workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust-evaluation\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" a
