ader","text":"Kenapa pakai paradigma filesystem?","value":"kenapa-pakai-paradigma-filesystem","line":54,"column":0,"depth":2},"resource-memory-skill-tiga-jenis-konteks-yang-harus-dibedakan":{"type":"header","text":"Resource, Memory, Skill: tiga jenis konteks yang harus dibedakan","value":"resource-memory-skill-tiga-jenis-konteks-yang-harus-dibedakan","line":66,"column":0,"depth":2},"l0l1l2-cara-mereka-ngehindarin-context-stuffing":{"type":"header","text":"L0/L1/L2: cara mereka ngehindarin context stuffing","value":"l0l1l2-cara-mereka-ngehindarin-context-stuffing","line":76,"column":0,"depth":2},"directory-recursive-retrieval":{"type":"header","text":"Directory recursive retrieval","value":"directory-recursive-retrieval","line":92,"column":0,"depth":2},"kenapa-retrieval-trace-penting":{"type":"header","text":"Kenapa retrieval trace penting","value":"kenapa-retrieval-trace-penting","line":108,"column":0,"depth":2},"memory-self-iteration-dan-agent-yang-belajar-dari-use":{"type":"header","text":"Memory self-iteration dan agent yang belajar dari use","value":"memory-self-iteration-dan-agent-yang-belajar-dari-use","line":116,"column":0,"depth":2},"openviking-vs-honcho":{"type":"header","text":"OpenViking vs Honcho","value":"openviking-vs-honcho","line":128,"column":0,"depth":2},"kapan-openviking-cocok":{"type":"header","text":"Kapan OpenViking cocok?","value":"kapan-openviking-cocok","line":137,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":150,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"context-database\"\u003eContext Database\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#context-database\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eHari ini gue baca page OpenViking, dan yang paling ngena buat gue adalah saat mereka tidak cuma menyebutnya sebagai produk memory. Di catatan gue, OpenViking itu adalah \u003cstrong\u003econtext database\u003c/strong\u003e: database yang nggak cuma nyimpan data, tapi menyusun data supaya agent bisa ambil konteks yang tepat saat bekerja.\u003c/p\u003e\n\u003ch2 id=\"pertanyaan-kunci-yang-gue-pegang\"\u003ePertanyaan kunci yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-kunci-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda tujuh pertanyaan inti yang bikin gue bisa bedain OpenViking dari memory provider biasa:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eOpenViking sebenarnya menyelesaikan masalah apa?\u003c/li\u003e\n\u003cli\u003eKenapa dia pakai paradigma file system?\u003c/li\u003e\n\u003cli\u003eApa bedanya Resource, Memory, dan Skill?\u003c/li\u003e\n\u003cli\u003eGimana sistem L0/L1/L2 bekerja?\u003c/li\u003e\n\u003cli\u003eApa itu directory recursive retrieval?\u003c/li\u003e\n\u003cli\u003eKenapa retrieval trace penting?\u003c/li\u003e\n\u003cli\u003eGimana OpenViking bikin agent \"smarter with use\"?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"istilah-yang-gue-kunci\"\u003eIstilah yang gue kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#istilah-yang-gue-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue pakai makna ini ketika baca page OpenViking:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eContext database\u003c/strong\u003e = database yang bukan cuma nyimpen data, tapi menyusun data supaya agent bisa mengambil konteks yang tepat.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eResource\u003c/strong\u003e = pengetahuan relatif statis seperti docs, repo code, FAQ, atau halaman web.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMemory\u003c/strong\u003e = cognition agent/user: preferensi, pengalaman task, keputusan, dan pola yang berubah.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkill\u003c/strong\u003e = capability yang bisa dipanggil agent: tools, MCP, instruksi, atau workflow.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eviking:// URI\u003c/strong\u003e = alamat unik untuk menemukan context di virtual filesystem OpenViking.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eL0/L1/L2\u003c/strong\u003e = layer konteks bertingkat: abstract, overview, detail.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"masalah-yang-openviking-ingin-selesaikan\"\u003eMasalah yang OpenViking ingin selesaikan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#masalah-yang-openviking-ingin-selesaikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking nggak datang sebagai solusi \"kami punya vector DB lebih bagus\". Ini lebih ke masalah manajemen konteks yang kacau: memory di satu tempat, resource di tempat lain, skill tersebar di plugin atau endpoint.\u003c/p\u003e\n\u003cp\u003eGue suka bahwa page-nya mendefinisikan problem secara jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eContext fragmentation\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext explosion\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePoor retrieval quality\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext opacity\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLimited memory iteration\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau dibandingin sama RAG tradisional, OpenViking ngeliat ini bukan sekadar potong dokumen jadi chunk. Context harus punya struktur, path, folder, level ringkasan, dan jejak retrieval.\u003c/p\u003e\n\u003ch2 id=\"kenapa-pakai-paradigma-filesystem\"\u003eKenapa pakai paradigma filesystem?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-pakai-paradigma-filesystem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking mendorong agent berpikir dalam bentuk file system, bukan tumpukan chunk.\u003c/p\u003e\n\u003cp\u003eBuat gue, tiga keuntungan utamanya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePath deterministik\u003c/strong\u003e: agent bisa refer ke \u003ccode\u003eviking://resources/my_project/docs/api.md\u003c/code\u003e, bukan cuma berharap similarity search nemu chunk yang tepat.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHierarki\u003c/strong\u003e: project, docs, memories, skills punya tempat masing-masing.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNavigasi\u003c/strong\u003e: agent bisa \u003ccode\u003els\u003c/code\u003e, \u003ccode\u003eread\u003c/code\u003e, \u003ccode\u003eabstract\u003c/code\u003e, \u003ccode\u003eoverview\u003c/code\u003e — mirip browsing folder.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni membuat OpenViking lebih ke sistem navigasi konteks. Vector DB menjawab \"chunk mana yang mirip?\". OpenViking menjawab \"lokasi konteksnya di mana, dan detail mana yang harus dibuka?\".\u003c/p\u003e\n\u003ch2 id=\"resource-memory-skill-tiga-jenis-konteks-yang-harus-dibedakan\"\u003eResource, Memory, Skill: tiga jenis konteks yang harus dibedakan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#resource-memory-skill-tiga-jenis-konteks-yang-harus-dibedakan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage ini bikin gue lebih jelas tentang batas-batasnya.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eResource\u003c/strong\u003e = pengetahuan statis. Project docs, code repo, FAQ, API docs. Kalau lo lagi ngebangun coding agent atau support agent, resource ini adalah basis pengetahuan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMemory\u003c/strong\u003e = learning yang dinamis. User preferences, pengalaman task, keputusan, pola. Ini mirip Honcho, tapi di OpenViking memory dipisahin sebagai konteks yang berubah seiring waktu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkill\u003c/strong\u003e = capability yang bisa dipanggil. Tool, MCP endpoint, instruksi, workflow. Bukan isi dokumen, tapi fungsi / kemampuan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue suka bahwa OpenViking menyatukan ketiganya ke satu filesystem, sebab itu bikin konteks agent nggak tercerai-berai.\u003c/p\u003e\n\u003ch2 id=\"l0l1l2-cara-mereka-ngehindarin-context-stuffing\"\u003eL0/L1/L2: cara mereka ngehindarin context stuffing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#l0l1l2-cara-mereka-ngehindarin-context-stuffing\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bagian yang paling masuk akal buat gue.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eL0 = Abstract\u003c/strong\u003e: ringkas banget, cukup untuk filtering awal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eL1 = Overview\u003c/strong\u003e: lebih panjang, sekitar 2.000 token, cukup untuk paham struktur dan bagian penting.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eL2 = Detail\u003c/strong\u003e: full content, dibuka kalau perlu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau agent bekerja, modelnya mirip manusia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elihat judul / abstrak dulu\u003c/li\u003e\n\u003cli\u003ebaca overview untuk tahu bagian mana yang penting\u003c/li\u003e\n\u003cli\u003ebaru baca detail kalau perlu\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara ini, OpenViking menghindari prompt stuffing dan membuat retrieval jadi bertahap.\u003c/p\u003e\n\u003ch2 id=\"directory-recursive-retrieval\"\u003eDirectory recursive retrieval\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#directory-recursive-retrieval\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue nangkep ini sebagai salah satu fitur paling khas mereka.\u003c/p\u003e\n\u003cp\u003eBukan cuma mencari chunk top-k. OpenViking pertama menempatkan query ke direktori relevan, lalu mengeksplorasi isi folder itu secara bertahap.\u003c/p\u003e\n\u003cp\u003eProsesnya kira-kira:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eanalisis intent\u003c/li\u003e\n\u003cli\u003ecari direktori kandidat\u003c/li\u003e\n\u003cli\u003eeksplorasi file dalam direktori\u003c/li\u003e\n\u003cli\u003eturunin ke subdirectory jika perlu\u003c/li\u003e\n\u003cli\u003eagregasi hasil\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi retrieval-nya mirip browsing rak buku, bukan ngacak-ngacak tumpukan fotokopi.\u003c/p\u003e\n\u003ch2 id=\"kenapa-retrieval-trace-penting\"\u003eKenapa retrieval trace penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-retrieval-trace-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni yang bikin OpenViking beda dari RAG biasa.\u003c/p\u003e\n\u003cp\u003eKalau retrieval gagal, lo bisa lihat: directory mana dibuka, file mana yang dipilih, kenapa kandidat itu muncul. Itu penting buat debug agent production.\u003c/p\u003e\n\u003cp\u003eTanpa trace, agent cuma kasih jawaban. Dengan trace, lo bisa audit kenapa jawaban itu muncul.\u003c/p\u003e\n\u003ch2 id=\"memory-self-iteration-dan-agent-yang-belajar-dari-use\"\u003eMemory self-iteration dan agent yang belajar dari use\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#memory-self-iteration-dan-agent-yang-belajar-dari-use\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking nggak cuma nyimpen memory user. Dia juga punya loop extraction untuk agent:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehasil task\u003c/li\u003e\n\u003cli\u003efeedback user\u003c/li\u003e\n\u003cli\u003eoutcome session\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLalu dia update memory directories secara async.\u003c/p\u003e\n\u003cp\u003eIni bikin agent bisa belajar dari kasus dan pola, bukan cuma ingat preferensi user.\u003c/p\u003e\n\u003ch2 id=\"openviking-vs-honcho\"\u003eOpenViking vs Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-vs-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena gue juga lagi baca Honcho, ini perbandingannya penting.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHoncho = \u003cstrong\u003epeer-centric\u003c/strong\u003e. Fokus ke siapa peer itu, apa representation-nya, gimana dia berubah.\u003c/li\u003e\n\u003cli\u003eOpenViking = \u003cstrong\u003econtext-filesystem-centric\u003c/strong\u003e. Fokus ke di mana konteksnya, jenisnya apa, level detail mana yang dibuka.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKeduanya bisa saling melengkapi, tapi filosofinya beda.\u003c/p\u003e\n\u003ch2 id=\"kapan-openviking-cocok\"\u003eKapan OpenViking cocok?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-openviking-cocok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking masuk akal kalau lo perlu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eself-hosted context database\u003c/li\u003e\n\u003cli\u003eknowledge base yang terstruktur\u003c/li\u003e\n\u003cli\u003eproject docs / repo besar\u003c/li\u003e\n\u003cli\u003eretrieval yang bisa diaudit\u003c/li\u003e\n\u003cli\u003ehierarchical context loading\u003c/li\u003e\n\u003cli\u003ememory user + memory agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau problem lo cuma preferensi user sederhana, mungkin ini bisa overkill.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.hermes-agent.memory-providers\"\u003eMemory Providers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault/daily.journal.2026.06.03 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eopenviking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003econtext-database (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyn
