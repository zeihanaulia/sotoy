"line":84,"column":0,"depth":3},"compressor":{"type":"header","text":"Compressor","value":"compressor","line":96,"column":0,"depth":3},"storage-layer-agfs--vector-index":{"type":"header","text":"Storage layer: AGFS + Vector Index","value":"storage-layer-agfs--vector-index","line":102,"column":0,"depth":2},"agfs":{"type":"header","text":"AGFS","value":"agfs","line":106,"column":0,"depth":3},"vector-index":{"type":"header","text":"Vector Index","value":"vector-index","line":112,"column":0,"depth":3},"data-flow-menambahkan-konteks":{"type":"header","text":"Data flow menambahkan konteks","value":"data-flow-menambahkan-konteks","line":120,"column":0,"depth":2},"data-flow-mengambil-konteks":{"type":"header","text":"Data flow mengambil konteks","value":"data-flow-mengambil-konteks","line":138,"column":0,"depth":2},"session-commit-dan-memory-lifecycle":{"type":"header","text":"Session commit dan memory lifecycle","value":"session-commit-dan-memory-lifecycle","line":148,"column":0,"depth":2},"mode-deployment-embedded-vs-http":{"type":"header","text":"Mode deployment: embedded vs HTTP","value":"mode-deployment-embedded-vs-http","line":158,"column":0,"depth":2},"insight-arsitektur-utama":{"type":"header","text":"Insight arsitektur utama","value":"insight-arsitektur-utama","line":167,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":176,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"openviking-architecture\"\u003eOpenViking architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-architecture\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://docs.openviking.ai/en/concepts/01-architecture\"\u003ehttps://docs.openviking.ai/en/concepts/01-architecture\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHari ini gue nulis ulang pemahaman gue tentang arsitektur OpenViking, bukan deployment cloud-nya. Yang gue catat adalah struktur internal: client, service layer, modul retrieve/session/parse/compressor, storage layer, dan data flow.\u003c/p\u003e\n\u003ch2 id=\"arsitektur-besar-openviking-menurut-gue\"\u003eArsitektur besar OpenViking menurut gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arsitektur-besar-openviking-menurut-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau digambarkan sederhana, OpenViking itu punya tiga wilayah utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eClient\u003c/strong\u003e sebagai pintu masuk.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eService Layer\u003c/strong\u003e sebagai business logic reusable.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCore Modules\u003c/strong\u003e sebagai mesin pencari, ingestion, session, dan kompresi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eStorage Layer\u003c/strong\u003e sebagai tempat konten dan indeks disimpan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi modelnya bukan \"SDK wrapper ke vector DB\". Dia lebih seperti sistem internal yang memisahkan ingestion, retrieval, session memory, compression, dan storage.\u003c/p\u003e\n\u003ch2 id=\"client--pintu-masuk-tunggal\"\u003eClient = pintu masuk tunggal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#client--pintu-masuk-tunggal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat OpenViking memposisikan Client sebagai unified entry. Dari luar, developer cukup interaksi lewat satu interface: \u003ccode\u003efind\u003c/code\u003e, \u003ccode\u003els\u003c/code\u003e, \u003ccode\u003eread\u003c/code\u003e, \u003ccode\u003eadd_resource\u003c/code\u003e, \u003ccode\u003ecommit session\u003c/code\u003e, dan lain-lain.\u003c/p\u003e\n\u003cp\u003eClient itu remote control. Dia nggak melakukan banyak logika sendiri. Dia menyalurkan perintah ke service layer.\u003c/p\u003e\n\u003ch2 id=\"service-layer--bisnis-logic-tanpa-nempel-ke-transport\"\u003eService Layer = bisnis logic tanpa nempel ke transport\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#service-layer--bisnis-logic-tanpa-nempel-ke-transport\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue suka konsep ini karena bikin logika intinya bisa dipakai di HTTP server, CLI, atau SDK lain tanpa rewrite.\u003c/p\u003e\n\u003cp\u003eDi page ini, service layer dipilah jadi beberapa service seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eFSService\u003c/code\u003e untuk operasi filesystem: \u003ccode\u003els\u003c/code\u003e, \u003ccode\u003eread\u003c/code\u003e, \u003ccode\u003eoverview\u003c/code\u003e, \u003ccode\u003eabstract\u003c/code\u003e, \u003ccode\u003eglob\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSearchService\u003c/code\u003e untuk semantic search: \u003ccode\u003esearch\u003c/code\u003e, \u003ccode\u003efind\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSessionService\u003c/code\u003e untuk manajemen session: \u003ccode\u003esession\u003c/code\u003e, \u003ccode\u003ecommit\u003c/code\u003e, \u003ccode\u003earchive\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eResourceService\u003c/code\u003e untuk import resource/skill.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRelationService\u003c/code\u003e untuk relasi konteks antar item.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePackService\u003c/code\u003e untuk import/export/backup.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDebugService\u003c/code\u003e untuk observability dan retrieval trace.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi intinya: transport layer itu bebas, logika intinya tetap di service layer.\u003c/p\u003e\n\u003ch2 id=\"core-modules--mesin-internal\"\u003eCore modules = mesin internal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-modules--mesin-internal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian paling penting buat gue adalah modul retrieve, parse, session, dan compressor.\u003c/p\u003e\n\u003ch3 id=\"retrieve\"\u003eRetrieve\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#retrieve\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRetrieve itu bukan cuma vector search. Dia modul pencarian konteks yang terdiri dari:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eintent analysis,\u003c/li\u003e\n\u003cli\u003ehierarchical retrieval,\u003c/li\u003e\n\u003cli\u003ererank.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk query kompleks, OpenViking tidak langsung ke top-k chunk. Dia dulu cari direktori relevan, eksplor hierarki, lalu rerank kandidat.\u003c/p\u003e\n\u003cp\u003eKalau gue rangkum:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eFSService\u003c/code\u003e tahu path yang sudah ada.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSearchService\u003c/code\u003e pakai makna untuk menemukan path.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRetrieve\u003c/code\u003e menjembatani keduanya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"parse\"\u003eParse\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#parse\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eParse adalah ingestion pipeline. Dia membaca dokumen, membuat struktur tree, lalu menyalin ke AGFS sebelum semantic generation.\u003c/p\u003e\n\u003cp\u003eYang penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eparsing dokumen itu dilakukan tanpa LLM,\u003c/li\u003e\n\u003cli\u003etree structuring dibuat dulu,\u003c/li\u003e\n\u003cli\u003esemantic generation (L0/L1/L2) berjalan async.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi input mentah pertama-tama menjadi context filesystem, bukan langsung vectorized.\u003c/p\u003e\n\u003ch3 id=\"session\"\u003eSession\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#session\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSession module yang bikin OpenViking terasa bukan sekadar store. Dia ngurus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emessage recording,\u003c/li\u003e\n\u003cli\u003ecompress history,\u003c/li\u003e\n\u003cli\u003earchive,\u003c/li\u003e\n\u003cli\u003ememory extraction,\u003c/li\u003e\n\u003cli\u003ecommit ke storage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSession commit adalah proses yang mengubah interaksi jadi memory yang bisa dicari kembali.\u003c/p\u003e\n\u003ch3 id=\"compressor\"\u003eCompressor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#compressor\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCompressor adalah penjaga quality memori. Dia bertugas kompresi dan deduplikasi agar memory jangka panjang tidak jadi noisy.\u003c/p\u003e\n\u003cp\u003eGue catat bahwa ini penting supaya preferensi dan pola agent tidak hanya menumpuk, tapi juga dirapikan.\u003c/p\u003e\n\u003ch2 id=\"storage-layer-agfs--vector-index\"\u003eStorage layer: AGFS + Vector Index\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#storage-layer-agfs--vector-index\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bagian yang paling bikin arsitektur OpenViking jelas bagi gue.\u003c/p\u003e\n\u003ch3 id=\"agfs\"\u003eAGFS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agfs\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAGFS adalah storage konten/file. Dia menyimpan isi sebenarnya: L0/L1/L2, multimedia, dan relations.\u003c/p\u003e\n\u003cp\u003eKalau agent butuh content, sumber kebenarannya adalah AGFS.\u003c/p\u003e\n\u003ch3 id=\"vector-index\"\u003eVector Index\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#vector-index\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eVector Index hanya menyimpan URI, vector, dan metadata. Bukan isi file penuh.\u003c/p\u003e\n\u003cp\u003eIni mirip katalog perpustakaan. Kalau vector index selesai, agent tahu lokasi konteks. Konten lengkapnya tetap di AGFS.\u003c/p\u003e\n\u003cp\u003eGue catat bahwa ini menjaga consistency: AGFS sebagai single source of truth, vector index sebagai peta semantic.\u003c/p\u003e\n\u003ch2 id=\"data-flow-menambahkan-konteks\"\u003eData flow menambahkan konteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#data-flow-menambahkan-konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow yang gue tangkap untuk adding context adalah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eInput → Parser → TreeBuilder → AGFS → SemanticQueue → Vector Index\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eProsesnya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003einput masuk,\u003c/li\u003e\n\u003cli\u003eparser membentuk struktur tree,\u003c/li\u003e\n\u003cli\u003etree disimpan ke AGFS,\u003c/li\u003e\n\u003cli\u003esemantic layer dibangun async,\u003c/li\u003e\n\u003cli\u003evector index dibuat dari URI + metadata.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni kebalikan dari pipeline RAG biasa yang biasanya: chunk → embed → vector DB.\u003c/p\u003e\n\u003ch2 id=\"data-flow-mengambil-konteks\"\u003eData flow mengambil konteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#data-flow-mengambil-konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow retrievalnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eQuery → Intent Analysis → Hierarchical Retrieval → Rerank → Results\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi OpenViking tidak sekadar cari chunk paling mirip. Dia menelusuri struktur direktori, lalu mengurutkan hasilnya.\u003c/p\u003e\n\u003ch2 id=\"session-commit-dan-memory-lifecycle\"\u003eSession commit dan memory lifecycle\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#session-commit-dan-memory-lifecycle\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah sesi selesai, OpenViking mengeksekusi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessages → Compress → Archive → Memory Extraction → Storage\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYang gue catat: session commit bukan cuma arsip chat. Dia mengubah history menjadi memory yang bisa dipanggil lagi.\u003c/p\u003e\n\u003ch2 id=\"mode-deployment-embedded-vs-http\"\u003eMode deployment: embedded vs HTTP\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mode-deployment-embedded-vs-http\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking mendukung dua mode:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEmbedded\u003c/strong\u003e: library lokal, cocok untuk prototipe dan lokal development.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHTTP\u003c/strong\u003e: service terpisah, cocok untuk tim, multi-client, dan production.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eEmbedded itu langsung dan murah. HTTP itu lebih fleksibel untuk banyak client.\u003c/p\u003e\n\u003ch2 id=\"insight-arsitektur-utama\"\u003eInsight arsitektur utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-arsitektur-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue narik dua dunia utama dari OpenViking:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003edunia deterministic: path, directory, file, URI, AGFS.\u003c/li\u003e\n\u003cli\u003edunia semantic: vector search, intent analysis, rerank, L0/L1/L2.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eOpenViking menggabungkan keduanya: filesystem yang bisa dicari secara semantic.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault/daily.journal.2026.06.03 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eopenviking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003earchitecture (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.06.03\"\u003e2026-06-03\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enable
