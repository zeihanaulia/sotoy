},"body":"\u003ch1 id=\"trusted-publishing-kritik-argumen-dan-checklist-operasional\"\u003eTrusted publishing: kritik argumen dan checklist operasional\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trusted-publishing-kritik-argumen-dan-checklist-operasional\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"tesis-utama\"\u003eTesis utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tesis-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTrusted publishing memverifikasi asal rilis paket lewat OIDC, Sigstore, dan provenance attestation. Itu menjawab \"siapa yang publish\" dan \"jalur CI mana\". Tapi itu tidak menjawab apakah pihak yang publish itu masih dalam kontrol yang aman atau apakah intent publish itu sah.\u003c/p\u003e\n\u003ch2 id=\"bagian-yang-kuat\"\u003eBagian yang kuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagian-yang-kuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePerbedaan authenticity vs agency\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eauthenticity = artefak datang dari jalur resmi\u003c/li\u003e\n\u003cli\u003eagency = identitas itu masih benar-benar mengendalikan proses\nArtikel kuat karena menunjukkan bahwa provenance valid tidak otomatis berarti kontrol publish tidak terkompromi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eFailure mode realistis\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emaintainer atau endpoint dikompromi lewat social engineering\u003c/li\u003e\n\u003cli\u003esession/token aktif diambil alih\u003c/li\u003e\n\u003cli\u003eprovenance dan identity checks tetap hijau\nIni bukan skenario teoretis; ini pola nyata yang menembus banyak supply chain incident.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eSolusi yang masuk akal\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eminimum release age sebagai delay gate\u003c/li\u003e\n\u003cli\u003eanomaly detection pada perilaku publish\u003c/li\u003e\n\u003cli\u003edual-control publishing untuk release high-impact\nSemua ini menambah lapisan selain provenance.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"bagian-yang-berisiko-misleading\"\u003eBagian yang berisiko misleading\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagian-yang-berisiko-misleading\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eArgumen \"provenance lebih buruk dari tidak berguna\"\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eitu terlalu retoris.\u003c/li\u003e\n\u003cli\u003eprovenance tetap berguna untuk audit asal, policy enforcement, dan investigasi.\u003c/li\u003e\n\u003cli\u003emasalahnya adalah provenance \u003cstrong\u003einsufficient as a standalone trust signal\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePotensi overemphasis pada social engineering saja\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esocial engineering adalah ancaman besar, tapi bukan satu-satunya.\u003c/li\u003e\n\u003cli\u003esupply chain juga butuh mitigasi untuk misconfiguration, dependency hijacking, dan runtime compromise.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eDual-control tanpa konteks operasional\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eideal secara prinsip, tapi bisa memberatkan project kecil dan memperlambat hotfix.\u003c/li\u003e\n\u003cli\u003eperlu risk-based penerapan, bukan aturan universal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kontrol-relevan-untuk-tim-software\"\u003eKontrol relevan untuk tim software\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kontrol-relevan-untuk-tim-software\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"maintainerreleaser\"\u003eMaintainer/releaser\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#maintainerreleaser\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ebatasi device dan browser profile untuk aktivitas release\u003c/li\u003e\n\u003cli\u003ejangan install software review/link DM/Slack tanpa verifikasi independen\u003c/li\u003e\n\u003cli\u003ereview sesi login aktif secara berkala\u003c/li\u003e\n\u003cli\u003edokumentasikan jalur publish resmi\u003c/li\u003e\n\u003cli\u003epertimbangkan dual approval untuk paket high-impact\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"repo--dependency-consumption\"\u003eRepo \u0026#x26; dependency consumption\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#repo--dependency-consumption\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003epin commit hash untuk GitHub Actions, base image, dan git-based dependency\u003c/li\u003e\n\u003cli\u003ecommit lockfile dan gunakan lockfile di CI\u003c/li\u003e\n\u003cli\u003ejangan auto-approve latest release untuk jalur sensitif\u003c/li\u003e\n\u003cli\u003ekasih buffer/cooling period untuk dependency baru\u003c/li\u003e\n\u003cli\u003eklasifikasikan dependency berdasarkan blast radius\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"cicd\"\u003eCI/CD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cicd\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003episahkan runner/job untuk publishing/signing dari pipeline umum\u003c/li\u003e\n\u003cli\u003eminimalkan secret scope dan egress di job sensitif\u003c/li\u003e\n\u003cli\u003ereview floating references dan install scripts\u003c/li\u003e\n\u003cli\u003egunakan provenance sebagai syarat minimum, bukan syarat cukup\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"organisasiprocess\"\u003eOrganisasi/Process\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#organisasiprocess\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eajarkan bahwa identity validation bukan safety guarantee\u003c/li\u003e\n\u003cli\u003eanggap compromise maintainer dan endpoint sebagai threat model nyata\u003c/li\u003e\n\u003cli\u003esiapkan prosedur freeze dependency updates saat upstream incident\u003c/li\u003e\n\u003cli\u003esimulasikan skenario maintainer compromise atau malicious upstream release\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kontrol-murah-impact-besar\"\u003eKontrol murah, impact besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kontrol-murah-impact-besar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eLockfile discipline\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecommit lockfile, pastikan CI pakai lockfile yang sama\u003c/li\u003e\n\u003cli\u003eini murah dan langsung memperkecil blast radius dependency drift\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePinning floating references\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehindari \u003ccode\u003elatest\u003c/code\u003e, floating action versions, dan git tags di jalur sensitif\u003c/li\u003e\n\u003cli\u003eini mencegah perubahan tak terduga di pipeline\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eReview dependency update route\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan biarkan update dependency masuk prod cuma karena versi baru keluar\u003c/li\u003e\n\u003cli\u003eini membantu memecah risiko update dari feature change\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eMinimum release age / cooldown\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edelay pakai package baru pada jalur sensitif selama 24–72 jam atau lebih untuk tooling sensitif\u003c/li\u003e\n\u003cli\u003eini murah karena mostly policy, tapi sangat efektif untuk serangan epoch awal\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eLeast privilege secret scope\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebatasi akses secret di hanya job yang perlu\u003c/li\u003e\n\u003cli\u003eini mencegah dependency compromise dari menjalar ke publish/signing path\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"checklist-operasional\"\u003eChecklist operasional\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#checklist-operasional\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"level-maintainer\"\u003eLevel maintainer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-maintainer\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Device/browsing terpadu untuk aktivitas release dipisah dari aktivitas umum\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Tidak install software review dari link DM/Slack/email tanpa verifikasi lain\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Publish terlokalisir melalui workflow resmi, bukan session browser random\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Sesi login aktif diperiksa secara berkala\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Paket high-impact punya dual approval atau gate tambahan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"level-repo\"\u003eLevel repo\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-repo\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Lockfile committed dan dipakai di CI\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e GitHub Actions dan git dependency dipin ke commit hash\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Floating tag/reference di release pipeline diminimalkan\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Update dependency sensitive lewat PR khusus dan review\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Buat kategori dependency berdasarkan risk/impact\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"level-cicd\"\u003eLevel CI/CD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-cicd\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Runner pipeline signing/release terpisah dari pipeline sehari-hari\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Secret hanya tersedia di job yang benar-benar perlu\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Egress low/no untuk job sensitif jika memungkinkan\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Release workflow punya approval step dan tidak langsung auto-publish\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Provenance/attestation diverifikasi, tapi tidak dijadikan satu-satunya syarat\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"level-organisasi\"\u003eLevel organisasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-organisasi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul class=\"contains-task-list\"\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Threat model memasukkan kompromi maintainer dan session hijack\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Ada policy cooling period untuk dependency baru di jalur sensitif\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Ada proses incident freeze untuk upstream malicious release\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Ada latihan tabletop supply chain compromise\u003c/li\u003e\n\u003cli class=\"task-list-item\"\u003e\u003cinput type=\"checkbox\" disabled\u003e Tim paham bahwa \"signed\" tidak otomatis berarti \"safe\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"level-penggunaan-checklist\"\u003eLevel penggunaan checklist\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-penggunaan-checklist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChecklist ini paling berguna di beberapa level sekaligus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003emaintainer\u003c/strong\u003e: kontrol endpoint dan publish behavior\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erepo\u003c/strong\u003e: dependency pinning, lockfile, update route\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCI/CD\u003c/strong\u003e: pipeline isolation, secret scope, approval gate\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eorganisasi\u003c/strong\u003e: threat model, policy, incident readiness\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk implementasi cepat, mulailah di layer repo/CI. Setelah itu, perluas ke maintainer hygiene dan organisasi policy.\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.tanstack-postmortem\"\u003eTanStack npm supply-chain compromise — postmortem notes\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"catatan-penting\"\u003eCatatan penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTrusted publishing tetap punya nilai. Nilainya adalah membantu memverifikasi asal dan membantu investigasi. Nilainya tidak sama dengan pembuktian bahwa publish itu aman.\u003c/p\u003e\n\u003cp\u003eJadi janganlah menyimpulkan dari artikel ini bahwa provenance tidak penting. Kesimpulan yang lebih tepat adalah: provenance itu \u003cstrong\u003esatu lapis\u003c/strong\u003e, bukan \u003cstrong\u003esatu-satunya lapis\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esupply-chain (Private)\u003c/a\u003e\u003c/li\u003e iments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"ena
