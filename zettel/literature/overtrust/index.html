h":2},"catatan":{"type":"header","text":"Catatan","value":"catatan","line":20,"column":0,"depth":2},"implikasi":{"type":"header","text":"Implikasi","value":"implikasi","line":28,"column":0,"depth":2},"hubungan":{"type":"header","text":"Hubungan","value":"hubungan","line":35,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"overtrust-sebagai-literature-note-audit-local-trust-boundary\"\u003eOvertrust sebagai literature note: audit local trust boundary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overtrust-sebagai-literature-note-audit-local-trust-boundary\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"klaim\"\u003eKlaim\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#klaim\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOvertrust bukan sekadar secret scanner; dia lebih menyerupai local audit untuk trust boundary developer workstation.\u003c/p\u003e\n\u003ch2 id=\"catatan\"\u003eCatatan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRepo Overtrust fokus pada scan offline yang menggabungkan file, manifest, dan process.\u003c/li\u003e\n\u003cli\u003eSource code utama menunjukkan workflow deterministik: filesystem walk, file classifier, manifest parser, secret detector, process scanner, lalu build report.\u003c/li\u003e\n\u003cli\u003eDeteksi secret memakai kombinasi keyword, regex, entropy, dan false-positive guard.\u003c/li\u003e\n\u003cli\u003eDeteksi risk process mencakup privilege tinggi, sensitive file descriptors, dan AI tool process identification.\u003c/li\u003e\n\u003cli\u003eOvertrust mempertimbangkan ekstensi editor, NPM/Docker manifest, shell history, kredensial lokal, dan run-time process sebagai bagian dari trust boundary.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"implikasi\"\u003eImplikasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implikasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAudit security agentic coding harus memperhitungkan environment lokal, bukan hanya repository atau pipeline.\u003c/li\u003e\n\u003cli\u003eLocal trust boundary check paling efektif sebagai preflight signal, bukan sebagai verdict final.\u003c/li\u003e\n\u003cli\u003eRule-based local scanner dapat berguna untuk deteksi awal tetapi perlu maintenance jika threat landscape berubah.\u003c/li\u003e\n\u003cli\u003eTool yang memeriksa workstation harus diintegrasikan dengan workflow triage, bukan hanya sebagai alert pada CI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"hubungan\"\u003eHubungan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust-evaluation\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179972\"\u003eSecret exposure bisa terjadi tanpa commit Git\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-l
