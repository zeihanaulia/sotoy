24,"column":0,"depth":2}},"children":[],"parent":"notes.youtube","data":{}},"body":"\u003ch1 id=\"andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://www.youtube.com/watch?v=96jN2OCOfLs\u0026#x26;t=1s\"\u003ehttps://www.youtube.com/watch?v=96jN2OCOfLs\u0026#x26;t=1s\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"summary\"\u003eSummary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#summary\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang gue tangkap dari talk ini adalah bahwa Karpathy enggak sekadar ngomong soal AI bikin coding lebih cepat. Dia sedang mencoba memberi kata lain untuk perubahan cara kerja programmer: \u003cstrong\u003evibe coding\u003c/strong\u003e untuk produktivitas dan eksperimen, lalu \u003cstrong\u003eagentic engineering\u003c/strong\u003e untuk menjaga standar kualitas profesional.\u003c/p\u003e\n\u003cp\u003eKalimat yang paling nempel buat gue adalah: \"You can outsource your thinking but you can’t outsource your understanding.\" Itu bukan sekadar soundbite. Itu menegaskan batas antara apa yang bisa diserahkan ke agent dan apa yang harus tetap ada dalam kepala manusia.\u003c/p\u003e\n\u003cp\u003eGue juga catet bahwa talk April 2026 merujuk pada fase shift yang Karpathy lihat di akhir \u003cstrong\u003eDesember 2025\u003c/strong\u003e. Business Insider dan sumber lain menguatkan bahwa perubahan workflow tersebut sudah terasa sebelum talk dan bukan sekadar framing pasca-event.\u003c/p\u003e\n\u003ch2 id=\"highlights\"\u003eHighlights\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#highlights\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eVibe coding\u003c/strong\u003e muncul ketika model mulai memberikan kode yang \"langsung benar\" cukup sering. Bukan karena AI sempurna, tapi karena trust threshold manusia terlewati. Awalnya agent bantu potongan kode, lalu berubah jadi workflow di mana manusia hanya mengalirkan intent.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSoftware 3.0\u003c/strong\u003e adalah perubahan paradigma komputasi. Karpathy membagi era software menjadi 1.0 (kode eksplisit), 2.0 (neural network dilatih), dan 3.0 (prompt + context window). Dalam era ini, context window menjadi instruksi operasional utama.\u003c/li\u003e\n\u003cli\u003eContoh praktisnya adalah Menugen, eksperimen Karpathy untuk bikin app foto menu restoran yang mengubah teks menu jadi gambar makanan. Versi lama pakai pipeline upload foto, OCR, generate gambar, render UI, deploy. Versi Software 3.0 cukup beri input foto ke model lalu minta overlay visual langsung. Kesimpulannya: beberapa app lama mungkin artefak paradigma lama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVerifiability\u003c/strong\u003e jadi kunci. Model kuat pada domain yang outputnya bisa diperiksa: math, code, tests, security, benchmark. Tapi ia masih \"jagged\": bisa refactor codebase besar, tapi bisa salah dalam reasoning sehari-hari.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLLM knowledge base\u003c/strong\u003e bukan sekadar RAG atau vector DB. Karpathy melihatnya sebagai cara agar LLM mengambil dokumen mentah dan mengompilasinya ulang menjadi struktur yang membantu pemahaman manusia—wiki, outline, Q\u0026#x26;A, dan reframing informasi—bukan hanya menyajikan potongan jawaban.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRL circuits matter.\u003c/strong\u003e Jika use case lo berada di area yang masuk training/RL loop, lo bisa \"fly.\" Kalau keluar dari distribusi itu, lo akan struggle dan perlu fine-tuning sendiri.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVibe coding menaikkan floor, agentic engineering menaikkan ceiling.\u003c/strong\u003e Vibe coding memudahkan banyak orang masuk ke software. Agentic engineering memastikan pekerjaan profesional tetap punya quality bar: secure, maintainable, testable, observability jelas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSkill manusia yang naik nilainya\u003c/strong\u003e adalah judgment, taste, spec, dan oversight. Agent bisa isi detail, tapi manusia harus menjaga invariants sistem, misalnya user identity harus persistent ID, bukan cocok-cocokan email.\u003c/li\u003e\n\u003cli\u003eKarpathy bilang detail API bisa dilupakan—detail \u003ccode\u003ekeepdims\u003c/code\u003e, \u003ccode\u003eaxis\u003c/code\u003e, \u003ccode\u003ereshape\u003c/code\u003e bisa ditangani agent—tapi \u003cstrong\u003efundamental\u003c/strong\u003e seperti tensor view, storage, memory copy, efisiensi tetap harus dipahami.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"atomic-ideas\"\u003eAtomic ideas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#atomic-ideas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eTrust threshold mengubah workflow coding: ketika output AI cukup sering benar, manusia mulai mengubah cara berpikir, bukan sekadar cara mengetik.\u003c/li\u003e\n\u003cli\u003eVibe coding adalah mode eksplorasi cepat yang berguna untuk prototyping, bukan pengganti disiplin quality assurance.\u003c/li\u003e\n\u003cli\u003eDalam Software 3.0, prompt dan context window menjadi source code sementara untuk interpreter LLM.\u003c/li\u003e\n\u003cli\u003eAgent bisa menggantikan sebagian scripting eksplisit dengan instruksi adaptif yang melihat environment dan debug sendiri.\u003c/li\u003e\n\u003cli\u003eLLM knowledge base bisa membuat dokumen mentah direcompile menjadi struktur pemahaman baru—wiki, outline, Q\u0026#x26;A, timeline—sehingga manusia dapat insight, bukan hanya jawaban.\u003c/li\u003e\n\u003cli\u003eDokumentasi operasi bisa berubah fungsi menjadi input executable-ish untuk agent.\u003c/li\u003e\n\u003cli\u003eBeberapa aplikasi lama bisa menjadi artefak paradigma lama, karena model sekarang dapat menelan pipeline yang sebelumnya diperlukan.\u003c/li\u003e\n\u003cli\u003ePeluang terbesar ada pada hal yang tidak mungkin dilakukan sebelumnya, bukan sekadar mempercepat workflow lama.\u003c/li\u003e\n\u003cli\u003eVerifikasi adalah bahan bakar otomasi LLM; capability model sering puncak di domain yang bisa diverifikasi.\u003c/li\u003e\n\u003cli\u003eLLM capability itu jagged, bukan merata, sehingga manusia harus tetap berada dalam loop dan menggunakan model sebagai alat.\u003c/li\u003e\n\u003cli\u003eAgentic engineering menjaga quality bar profesional sambil memanfaatkan kecepatan AI.\u003c/li\u003e\n\u003cli\u003eSkill manusia yang paling penting adalah taste, judgment, spec, oversight, dan maintenance of system invariants.\u003c/li\u003e\n\u003cli\u003eAI bisa mengambil alih hafalan detail API, tapi tidak bisa menggantikan pemahaman fundamental.\u003c/li\u003e\n\u003cli\u003eKode yang jalan tidak sama dengan kode yang baik: simplification dan taste masih butuh evaluasi manusia karena tidak selalu muncul dalam RL circuits.\u003c/li\u003e\n\u003cli\u003eLLM bukan animal intelligence; lebih tepat dipahami sebagai statistical simulation circuits plus RL.\u003c/li\u003e\n\u003cli\u003eInfrastruktur saat ini masih human-native; masa depan agent-native butuh docs, API, permissions, sensor, dan actuator yang legible untuk agent.\u003c/li\u003e\n\u003cli\u003eAgent bisa menjadi lapisan representasi sosial-operasional yang memungkinkan agen orang/organisasi berinteraksi.\u003c/li\u003e\n\u003cli\u003eUnderstanding adalah bottleneck terakhir: thinking bisa didelegasikan, understanding tidak.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"timeline-note\"\u003eTimeline note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#timeline-note\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"00470227\"\u003e00:47–02:27\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#00470227\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarpathy cerita transisinya dari merasa alat AI hanya bantu potongan kode, ke fase di mana model sering benar sehingga dia mulai nge-work dalam mode vibe coding. Ini asal-usul istilahnya.\u003c/p\u003e\n\u003ch3 id=\"02280450\"\u003e02:28–04:50\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#02280450\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarpathy jelasin era Software 1.0, 2.0, dan 3.0. Di era 3.0, programming berubah jadi menulis prompt dan context yang jadi leverage atas LLM sebagai interpreter.\u003c/p\u003e\n\u003cp\u003eDia memberi contoh OpenClaw: bukannya menulis shell script kompleks lintas platform, paradigma baru adalah menulis teks untuk dicopy-paste ke agent dan membiarkan agent melihat environment, mengecek, dan debugging sendiri.\u003c/p\u003e\n\u003ch3 id=\"04540736\"\u003e04:54–07:36\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#04540736\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh Menugen: eksperimen app foto menu restoran yang awalnya pakai pipeline upload foto, OCR, generate gambar, dan render ulang menu. Aplikasi lama ini bisa jadi spurious kalau model sekarang bisa langsung handle input mentah dan render output. Ini bukan cuma percepatan, tapi juga revisit eksistensi aplikasi.\u003c/p\u003e\n\u003ch3 id=\"09411336\"\u003e09:41–13:36\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#09411336\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eVerifiability jadi pembeda utama. Model kuat di domain yang bisa diverifikasi, kurang stabil di reasoning yang tidak jelas reward-nya. Karena frontier labs melatih model dengan RL reward, kemampuan model sering puncak di area verifiable dan stagnan di area non-verifiable.\u003c/p\u003e\n\u003cp\u003eKarpathy juga memberi contoh jaggedness: model bisa refactor 100.000 baris kode tapi masih menyarankan jalan kaki ke car wash 50 meter jauhnya. Itu menunjukkan pentingnya tetap berada di loop dan menganggap model sebagai alat.\u003c/p\u003e\n\u003ch3 id=\"13371509\"\u003e13:37–15:09\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13371509\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFounder advice: domain yang bisa diverifikasi tetap menarik meski lab besar sudah fokus di math dan coding. Jika lo bisa membangun RL environment atau dataset khusus sendiri, itu memberi leverage untuk fine-tuning dan custom automation.\u003c/p\u003e\n\u003ch3 id=\"15461718\"\u003e15:46–17:18\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15461718\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeda vibe coding dan agentic engineering: floor vs ceiling. Vibe coding menghasilkan karya cepat, agentic engineering menjamin kualitas profesional tetap hidup.\u003c/p\u003e\n\u003cp\u003eKarpathy menyebut agent sebagai entitas spiky, fable, stochastic: powerful tapi perlu dikordinasi dengan benar agar tidak menurunkan quality bar.\u003c/p\u003e\n\u003ch3 id=\"17191928\"\u003e17:19–19:28\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17191928\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAI-native engineer terlihat dari kemampuan memaksimalkan tool, setup sendiri, dan membangun proyek besar, bukan sekadar mengerjakan puzzle coding kecil. Karpathy menyarankan hiring process beralih ke proyek besar plus stress test dengan agent lain.\u003c/p\u003e\n\u003ch3 id=\"19292212\"\u003e19:29–22:12\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#19292212\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent masih butuh oversight. Contoh Menugen: agent nyoba cross-correlate user via email Stripe dan email Google. Ini terlihat logis, tapi melanggar invariant desain identitas user.\u003c/p\u003e\n\u003ch3 id=\"21022212\"\u003e21:02–22:12\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#21022212\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarpathy menjelaskan bahwa detail API bisa dilupakan—agent punya recall kuat—tapi fundamental seperti tensor view, storage, dan memory copy tetap harus dipahami. Ini membuat manusia lebih fokus pada desain, taste, dan sistem, bukan hafalan permukaan.\u003c/p\u003e\n\u003ch3 id=\"22142330\"\u003e22:14–23:30\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#22142330\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTaste dan judgment belum jadi reward utama. Model sering menghasilkan kode bloaty, copy-paste, awkward abstractions, dan sulit menyederhanakan kode karena simplification belum menjadi bagian dari RL circuits. Karpathy menyebutkan proyek microGPT sebagai contoh: minta model menyederhanakan kode, dan model terasa seperti luar dari RL circuits—perlu usaha tarik gigi.\u003c/p\u003e\n\u003ch3 id=\"23312515\"\u003e23:31–25:15\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#23312515\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLLM bukan animal intelligence. Karpathy menekankan mereka adalah statistical simulation circuits dengan pretraining plus RL bolted on. Mindset ini membantu kita tetap skeptis dan tidak memberi mereka motivasi manusiawi.\u003c/p\u003e\n\u003ch3 id=\"25182737\"\u003e25:18–27:37\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#25182737\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eInfrastruktur saat ini masih ditulis untuk manusia. Karpathy bilang masa depan harus agent-native: docs, API, dan workflow yang bisa langsung dimakan agent, bukan cuma manusia.\u003c/p\u003e\n\u003cp\u003eDia membayangkan dunia di mana agent memiliki representasi untuk orang/organisasi, lalu agen saling bicara untuk mengatur detail meeting atau tugas rutin.\u003c/p\u003e\n\u003ch2 id=\"takeaways\"\u003eTakeaways\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaways\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eTalk ini bukan argumen bahwa programming sudah mati. Ini tentang pergeseran peran: dari penulis detail ke desainer sistem kerja.\u003c/li\u003e\n\u003cli\u003eBiar agent bisa bantu, manusia harus tetap pegang understanding. Tanpa itu, output agent cuma sekilas \"jalan\" tapi bisa punya masalah serius.\u003c/li\u003e\n\u003cli\u003eIde AI production-ready bukan sekadar mempercepat coding, tapi menjaga spec, verifikasi, keamanan, dan observability.\u003c/li\u003e\n\u003cli\u003eUntuk startup: domain yang bisa diverifikasi dan punya feedback loop spesifik adalah area yang paling menjanjikan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.single-verification-entrypoint\"\u003eSingle verification entrypoint\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.karpathy-from-vibe-coding-to-agentic-engineering\"\u003eKarpathy — From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eyoutube (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ekarpathy (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esoftware-3-0 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100000\"\u003eAI execution cheapens but direction becomes expensive\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100300\"\u003eVerifiability is the fuel for LLM automation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100400\"\u003eLLM capability is jagged, so human-in-the-loop stays essential\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100500\"\u003eOperational docs are turning into agent-executable artifacts\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100600\"\u003eAgent-native infrastructure needs agent-legible sensors and actuators\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100700\"\u003eAI can handle API details, but humans must keep fundamental understanding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100800\"\u003eTrust threshold shifts AI workflow from assistant to production\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100900\"\u003eVibe coding is exploration flow, not quality discipline\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101000\"\u003eContext window is temporary source code for LLMs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101100\"\u003eAgent instructions replace deterministic scripting in variable environments\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101200\"\u003eLargest AI opportunities are new work formats, not faster old workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101300\"\u003eFuture agentic systems may be AI-hosted with classical tools as co-processors\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101400\"\u003eSpecification fuels classical software; verification fuels agentic AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101500\"\u003eLLM capability is a jagged map, not a smooth curve\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101600\"\u003eLLM can be genius at code but dumb at simple common-sense reasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101800\"\u003eAI moat can be a domain-specific verifier and RL environment\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102000\"\u003eAI may speed delivery, but engineering responsibility stays with humans\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102100\"\u003eAssess agentic engineers with system-building projects, not puzzles\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102200\"\u003eAgent can fill in details, but humans must maintain invariant system design\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102300\"\u003eAI handles API details, humans must understand fundamentals\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102400\"\u003eWorking code is not the same as good code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102500\"\u003eUnderstanding LLM as statistical simulation circuits, not animal intelligence\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102600\"\u003eAgent-native infrastructure needs agent-legible docs, APIs, and actuators\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102700\"\u003eAgent can become social-operational representation for people and organizations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102800\"\u003eUnderstanding is the last bottleneck in agentic systems\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.karpathy-from-vibe-coding-to-agentic-engineering\"\u003eKarpathy — From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.07\"\u003e2026-05-07\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":
