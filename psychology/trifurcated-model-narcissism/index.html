efinition","vaultName":"vault"},"type":"backlink","position":{"start":{"line":21,"column":11,"offset":1371},"end":{"line":21,"column":60,"offset":1420},"indent":[]},"value":"notes.psychology.trifurcated-model-narcissism"}],"anchors":{"trifurcated-model-of-narcissism":{"type":"header","text":"Trifurcated Model of Narcissism","value":"trifurcated-model-of-narcissism","line":15,"column":0,"depth":1},"overview":{"type":"header","text":"Overview","value":"overview","line":17,"column":0,"depth":2},"the-three-dimensions":{"type":"header","text":"The Three Dimensions","value":"the-three-dimensions","line":20,"column":0,"depth":2},"relationship-to-grandiose--vulnerable-narcissism":{"type":"header","text":"Relationship to Grandiose \u0026 Vulnerable Narcissism","value":"relationship-to-grandiose--vulnerable-narcissism","line":27,"column":0,"depth":2},"practical-application":{"type":"header","text":"Practical Application","value":"practical-application","line":34,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"trifurcated-model-of-narcissism\"\u003eTrifurcated Model of Narcissism\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trifurcated-model-of-narcissism\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"trifurcated-model-of-narcissism-1\"\u003eTrifurcated Model of Narcissism\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trifurcated-model-of-narcissism-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTrifurcated Model (atau Three-Factor Model) melihat narsisme bukan sebagai satu diagnosis tunggal, melainkan sebagai kombinasi dari tiga dimensi sifat yang bisa bercampur dalam satu individu. Model ini didasarkan pada penelitian seperti \u003cem\u003eFive-Factor Narcissism Inventory\u003c/em\u003e (FFNI) oleh Miller dkk. dan pengembangan oleh Crowe dkk.\u003c/p\u003e\n\u003ch2 id=\"the-three-dimensions\"\u003eThe Three Dimensions\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-three-dimensions\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eNarsisme digerakkan oleh tiga \"mesin\" utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eAgentic Extraversion (Agentik)\u003c/strong\u003e: Mesin untuk tampil dan menang. Berorientasi pada aksi, prestasi, dominasi sosial positif, dan kepercayaan diri.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-centered Antagonism (Antagonis)\u003c/strong\u003e: Mesin untuk menguasai dan merendahkan. Berorientasi pada \u003cem\u003eentitlement\u003c/em\u003e, arogansi, eksploitasi, dan kurangnya empati.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNarcissistic Neuroticism (Neurotik)\u003c/strong\u003e: Mesin yang merasa terluka dan butuh validasi. Berorientasi pada rasa malu (\u003cem\u003eshame\u003c/em\u003e), sensitivitas tinggi terhadap kritik, dan perasaan menjadi korban.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"relationship-to-grandiose--vulnerable-narcissism\"\u003eRelationship to Grandiose \u0026#x26; Vulnerable Narcissism\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relationship-to-grandiose--vulnerable-narcissism\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eModel ini memperjelas struktur dari dua tipe narsisme klasik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eGrandiose Narcissism\u003c/strong\u003e \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\approx\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.4831em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e≈\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Agentic Extraversion + Antagonism.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVulnerable Narcissism\u003c/strong\u003e \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e≈\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\approx\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.4831em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e≈\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Narcissistic Neuroticism + Antagonism.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eKey Insight\u003c/strong\u003e: Antagonisme adalah benang merah yang menghubungkan keduanya. Seseorang bisa tampak percaya diri (grandiose) atau rapuh (vulnerable), tetapi yang membuatnya berbahaya secara sosial adalah tingginya kadar \u003cstrong\u003eAntagonisme\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"practical-application\"\u003ePractical Application\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-application\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eModel ini digunakan untuk membaca pola, bukan melabel orang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAgentik tanpa Antagonis\u003c/strong\u003e: Pemimpin yang percaya diri dan produktif.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNeurotik tanpa Antagonis\u003c/strong\u003e: Orang rapuh yang membutuhkan dukungan emosional.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAntagonis Tinggi\u003c/strong\u003e: Risiko sosial tinggi; relasi menjadi medan kuasa dan eksploitasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.npd-definition\"\u003eNarcissistic Personality Disorder (NPD) as an Exploitation System\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.agentic-narcissism\"\u003eAgentic Narcissism (Agentic Extraversion)\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.antagonistic-narcissism\"\u003eAntagonistic Narcissism (Self-centered Antagonism)\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.neurotic-narcissism\"\u003eNeurotic Narcissism (Narcissistic Neuroticism)\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enpd (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epersonality-traits (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.psychology.agentic-narcissism\"\u003eAgentic Narcissism (Agentic Extraversion)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.psychology.antagonistic-narcissism\"\u003eAntagonistic Narcissism (Self-centered Antagonism)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e
