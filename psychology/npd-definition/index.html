}},{"from":{"fname":"notes.psychology.boundary-vs-reality-check","id":"notes.psychology.boundary-vs-reality-check","vaultName":"vault"},"type":"backlink","position":{"start":{"line":29,"column":11,"offset":1498},"end":{"line":29,"column":46,"offset":1533},"indent":[]},"value":"notes.psychology.npd-definition"},{"from":{"fname":"notes.psychology.trifurcated-model-narcissism","id":"notes.psychology.trifurcated-model-narcissism","vaultName":"vault"},"type":"backlink","position":{"start":{"line":27,"column":11,"offset":1801},"end":{"line":27,"column":46,"offset":1836},"indent":[]},"value":"notes.psychology.npd-definition"},{"from":{"fname":"zettel.psychology.npd-ecosystem","id":"zettel.psychology.npd-ecosystem","vaultName":"vault"},"type":"backlink","position":{"start":{"line":27,"column":3,"offset":1895},"end":{"line":27,"column":38,"offset":1930},"indent":[]},"value":"notes.psychology.npd-definition"}],"anchors":{"narcissistic-personality-disorder-npd-as-an-exploitation-system":{"type":"header","text":"Narcissistic Personality Disorder (NPD) as an Exploitation System","value":"narcissistic-personality-disorder-npd-as-an-exploitation-system","line":15,"column":0,"depth":1},"core-concept":{"type":"header","text":"Core Concept","value":"core-concept","line":17,"column":0,"depth":2},"layers-of-impact":{"type":"header","text":"Layers of Impact","value":"layers-of-impact","line":22,"column":0,"depth":2},"healthy-narcissism-vs-npd":{"type":"header","text":"Healthy Narcissism vs NPD","value":"healthy-narcissism-vs-npd","line":28,"column":0,"depth":2},"the-danger-of-social-labeling":{"type":"header","text":"The Danger of Social Labeling","value":"the-danger-of-social-labeling","line":36,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"narcissistic-personality-disorder-npd-as-an-exploitation-system\"\u003eNarcissistic Personality Disorder (NPD) as an Exploitation System\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#narcissistic-personality-disorder-npd-as-an-exploitation-system\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"narcissistic-personality-disorder-npd-as-an-exploitation-system-1\"\u003eNarcissistic Personality Disorder (NPD) as an Exploitation System\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#narcissistic-personality-disorder-npd-as-an-exploitation-system-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"core-concept\"\u003eCore Concept\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-concept\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eNPD bukan sekadar \"terlalu cinta diri sendiri\" atau ego yang besar. Inti dari gangguan ini adalah ketika kebutuhan akan pengakuan berubah menjadi \u003cstrong\u003esistem eksploitasi\u003c/strong\u003e.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: NPD adalah ego yang membuat orang lain membayar biaya psikologisnya.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"layers-of-impact\"\u003eLayers of Impact\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#layers-of-impact\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGangguan kepribadian ini tidak hanya berdampak secara internal, tapi merusak ekosistem sosial dalam tiga lapisan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eIndividu\u003c/strong\u003e: Masalah pada pola pikir, regulasi emosi, dan perilaku.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRelasi\u003c/strong\u003e: Dampak negatif pada keluarga, pasangan, teman, dan rekan kerja.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProduktivitas\u003c/strong\u003e: Mengganggu kinerja, stabilitas ekonomi, dan pertumbuhan manusia.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"healthy-narcissism-vs-npd\"\u003eHealthy Narcissism vs NPD\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#healthy-narcissism-vs-npd\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda perbedaan mendasar antara ciri narsistik yang sehat dengan gangguan NPD. Berdasarkan \u003cstrong\u003eTrifurcated Model of Narcissism\u003c/strong\u003e, narsisme terdiri dari tiga dimensi: Agentik, Antagonis, dan Neurotik.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eNarsisme Sehat\u003c/strong\u003e: Dominan pada sisi \u003cem\u003eAgentic Extraversion\u003c/em\u003e (ambisi, percaya diri) namun rendah pada \u003cem\u003eAntagonism\u003c/em\u003e. Seperti \"api kompor\" yang menggerakkan prestasi tanpa merusak orang lain.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNPD\u003c/strong\u003e: Terjadi ketika \u003cem\u003eAntagonism\u003c/em\u003e tinggi, terlepas dari apakah orang tersebut tampak percaya diri (Agentik) atau rapuh (Neurotik). Seperti \"api yang membakar rumah\" yang menghanguskan ekosistem sosial demi citra diri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.trifurcated-model-narcissism\"\u003eTrifurcated Model of Narcissism\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"the-danger-of-social-labeling\"\u003eThe Danger of Social Labeling\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-danger-of-social-labeling\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePenting untuk membedakan antara \"ciri kepribadian\" dan \"gangguan kepribadian\". Label klinis tanpa asesmen profesional berisiko menjadi \u003cstrong\u003esenjata moral\u003c/strong\u003e untuk menghakimi orang yang sekadar menyebalkan atau memiliki konflik komunikasi.\u003c/p\u003e\n\u003cp\u003eSee also: \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.psychology.boundary (Private)\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\
