e":false,"to":{"fname":"notes.psychology.trauma-learning-reparenting"}}],"anchors":{"psychological-layer-trauma-and-templates":{"type":"header","text":"Psychological Layer: Trauma and Templates","value":"psychological-layer-trauma-and-templates","line":13,"column":0,"depth":1},"trauma-as-a-reaction-template":{"type":"header","text":"Trauma as a Reaction Template","value":"trauma-as-a-reaction-template","line":15,"column":0,"depth":2},"post-traumatic-growth":{"type":"header","text":"Post-Traumatic Growth","value":"post-traumatic-growth","line":23,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"psychological-layer-trauma-and-templates\"\u003ePsychological Layer: Trauma and Templates\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#psychological-layer-trauma-and-templates\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"psychological-layer-trauma-and-templates-1\"\u003ePsychological Layer: Trauma and Templates\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#psychological-layer-trauma-and-templates-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"trauma-as-a-reaction-template\"\u003eTrauma as a Reaction Template\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#trauma-as-a-reaction-template\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTrauma bukan sekadar \"kejadian buruk\", melainkan pengalaman yang membentuk \u003cstrong\u003etemplate reaksi\u003c/strong\u003e otomatis di otak. Ketika trigger muncul di masa kini, otak menggunakan template lama untuk merespons.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContoh Template Reaksi:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePengalaman\u003c/strong\u003e: Kebutuhan tidak dipedulikan \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003cstrong\u003eTemplate\u003c/strong\u003e: \"Kebutuhan orang lain bukan urusan gue.\"\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePengalaman\u003c/strong\u003e: Peduli berujung dimanfaatkan \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003cstrong\u003eTemplate\u003c/strong\u003e: \"Peduli = Jebakan.\"\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePengalaman\u003c/strong\u003e: Tampil berujung dipermalukan \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e \u003cstrong\u003eTemplate\u003c/strong\u003e: \"Forum = Tempat diri gue dihancurkan.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"post-traumatic-growth\"\u003ePost-Traumatic Growth\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#post-traumatic-growth\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProses penyembuhan psikologis bukan sekadar memahami luka, tetapi mengubah cara otak merespons luka tersebut.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCoping Mechanism\u003c/strong\u003e: Belajar meregulasi emosi dan membedakan hal yang \u003cem\u003econtrollable\u003c/em\u003e vs \u003cem\u003euncontrollable\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eResilience\u003c/strong\u003e: Membangun kemampuan untuk bangkit dan belajar dari trauma (\u003cem\u003epost-traumatic growth\u003c/em\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Psikologis bukan cuma memahami luka; psikologis adalah mengubah cara otak merespons luka.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.biopsychosocial-cultural-spiritual-framework\"\u003eBiopsychosocial-Cultural-Spiritual Framework\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.trauma-learning-reparenting\"\u003eTrauma-Informed Learning and Reparenting\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" tar
