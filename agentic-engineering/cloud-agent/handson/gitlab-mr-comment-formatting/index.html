n","value":"referensi-yang-paling-relevan","line":307,"column":0,"depth":2},"apa-yang-belum-banyak-ada-di-referensi-lain":{"type":"header","text":"Apa yang belum banyak ada di referensi lain","value":"apa-yang-belum-banyak-ada-di-referensi-lain","line":318,"column":0,"depth":3},"saran-baca-bertahap":{"type":"header","text":"Saran baca bertahap","value":"saran-baca-bertahap","line":333,"column":0,"depth":3}},"children":[],"parent":"nxw4xobzvobigraxszxib8q","data":{}},"body":"\u003ch1 id=\"cloud-agent-hands-on-mr-comment-formatting\"\u003eCloud Agent Hands-on: MR Comment Formatting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cloud-agent-hands-on-mr-comment-formatting\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni lanjutan praktis dari \u003ca href=\"/sotoy/notes/notes.agentic-engineering.gitlab-mr-review-agent-coolify\"\u003eGitLab MR Review Agent di Coolify\u003c/a\u003e.\nFokusnya ke format MR comment yang bisa langsung diimplementasikan oleh review bot di cloud.\u003c/p\u003e\n\u003cp\u003eTujuannya: buat format yang bisa dipakai sebagai basis agent MR comment otomatis, tapi tetap mendukung review pedagogis dan traceability.\u003c/p\u003e\n\u003ch2 id=\"konteks-desain\"\u003eKonteks desain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks-desain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonteks yang gue pakai di sini bukan cuma implementasi MR comment.\nGue bedain tiga layer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAI code review bot\u003c/strong\u003e: service yang menerima webhook MR mention/comment, baca diff/context, lalu post komentar review ke GitLab.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCode review skill\u003c/strong\u003e: paket instruksi atau checklist untuk agent, belum tentu punya webhook atau GitLab integrasi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReview harness\u003c/strong\u003e: gabungan bot + skill + scanner + rule + CI + feedback loop. Ini yang bikin review jadi proses yang terus belajar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDesain elo yang menarik adalah menggabungkan layer bot dan teaching skill: review bukan cuma menemukan issue, tapi juga ngajarin reviewer/dev lewat before-after, proposed diff, rationale, dan counter-argument space.\u003c/p\u003e\n\u003cp\u003eLihat juga daftar referensi dan review satu-per-satu di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.references\"\u003eCloud Agent Hands-on References\u003c/a\u003e.\nLihat juga peta konten di \u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"prinsip-yang-gue-pakai\"\u003ePrinsip yang gue pakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-yang-gue-pakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue bedakan dua fungsi review:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eReview note\u003c/strong\u003e = catatan arsip lengkap.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMR comment\u003c/strong\u003e = komentar MR yang punya dua layer: ringkas untuk keputusan, panjang untuk pembelajaran.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi panjang tidak masalah, selama struktur informasinya jelas dan bisa di-scan.\u003c/p\u003e\n\u003ch2 id=\"langkah-hands-on\"\u003eLangkah hands-on\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#langkah-hands-on\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-standarisasi-status-review\"\u003e1. Standarisasi status review\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-standarisasi-status-review\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi review note, gunakan status operasional:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eapproved\napproved_with_notes\nchanges_requested\nblocked\nfailed\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBuat setiap status punya arti jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eapproved\u003c/code\u003e — review selesai dan tidak ada concern blocking; kode dianggap siap lanjut ke merge setelah verifikasi standar.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproved_with_notes\u003c/code\u003e — tidak ada issue blocking, tapi reviewer memberi catatan minor atau improvement yang sebaiknya ditindaklanjuti sebelum merge.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003echanges_requested\u003c/code\u003e — ada satu atau lebih issue yang harus diperbaiki sebelum merge; bisa berupa bug, logika, keamanan, atau kualitas yang relevan.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eblocked\u003c/code\u003e — ada issue kritis yang tidak boleh diabaikan, seperti keamanan bypass, data corruption, atau arsitektur yang harus diganti.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003efailed\u003c/code\u003e — review gagal dilakukan atau hasil review tidak valid; biasanya karena agent timeout, data kurang, atau review mode tidak mendukung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni langsung bisa dipakai oleh bot untuk keputusan merge.\u003c/p\u003e\n\u003cp\u003eBuat ini wajib di frontmatter setiap file review.\u003c/p\u003e\n\u003ch3 id=\"2-pakai-struktur-heading-konsisten\"\u003e2. Pakai struktur heading konsisten\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-pakai-struktur-heading-konsisten\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk review note, selalu pakai pola:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Code Review: \u0026#x3C;branch\u003e\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Decision\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Ready to merge?\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Summary\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Scope\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Changed files\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Blocking findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Non-blocking findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Strengths\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Verification\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Human review needed\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Recommendation\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Appendix\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau review note semua seragam, agent bisa parse field dengan lebih mudah.\u003c/p\u003e\n\u003ch3 id=\"3-bedakan-mr-comment-dan-archive-note\"\u003e3. Bedakan MR comment dan archive note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-bedakan-mr-comment-dan-archive-note\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk MR comment, gunakan dua layer dalam satu output:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDecision layer\u003c/strong\u003e: ringkas, answer key questions, cepat discan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLearning layer\u003c/strong\u003e: detail, before-after, rationale, counter-argument space.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh struktur MR comment:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Agent Code Review\u003c/span\u003e\n\n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eDecision:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e changes_requested  \n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eReady to merge?\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e no  \n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eBlocking findings:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e 2  \n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eNon-blocking notes:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e 1  \n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eReview mode:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e diff + context  \n\u003cspan class=\"token bold\"\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003cspan class=\"token content\"\u003eConfidence:\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e**\u003c/span\u003e\u003c/span\u003e medium\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Quick summary\u003c/span\u003e\n\nBranch ini mendekati target, tapi ada dua issue blocking:\n\u003cspan class=\"token list punctuation\"\u003e1.\u003c/span\u003e Missing authorization check pada project settings update.\n\u003cspan class=\"token list punctuation\"\u003e2.\u003c/span\u003e Potensi N+1 query pada billing report.\n\n\u003cspan class=\"token hr punctuation\"\u003e---\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Detailed findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e Finding 1 — Missing authorization check\u003c/span\u003e\n\n...detail...\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"4-terapkan-depth-berdasarkan-severity\"\u003e4. Terapkan depth berdasarkan severity\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-terapkan-depth-berdasarkan-severity\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAturan depth yang gue pakai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBlocking/high-risk\u003c/strong\u003e: before, after, diff direction, rationale, verification, counter-argument space.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMedium\u003c/strong\u003e: problem, evidence, suggested fix, rationale pendek.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMinor\u003c/strong\u003e: ringkas, satu-dua kalimat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi agent tidak memperlakukan typo kecil sama dengan authorization bypass.\u003c/p\u003e\n\u003ch3 id=\"5-pakai-schema-internal-dulu\"\u003e5. Pakai schema internal dulu\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pakai-schema-internal-dulu\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum render Markdown, agent harus bikin data terstruktur.\u003c/p\u003e\n\u003cp\u003eContoh schema:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"decision\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"changes_requested\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"scope\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"security\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"correctness\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"maintainability\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"confidence\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"medium\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"review_mode\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"diff_only\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"summary\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"...\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"findings\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"title\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Missing authorization check\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"severity\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"high\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"blocking\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"file\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"packages/app/src/...\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"evidence\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"...\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"risk\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"...\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"suggested_fix\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"...\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      \u003cspan class=\"token property\"\u003e\"confidence\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"high\"\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"verification\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"tests_run\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"static_scan_run\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"ready_to_merge\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"no\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan schema ini, lo bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esort severity,\u003c/li\u003e\n\u003cli\u003ededuplicate findings,\u003c/li\u003e\n\u003cli\u003efilter noise,\u003c/li\u003e\n\u003cli\u003egenerate MR comment,\u003c/li\u003e\n\u003cli\u003egenerate full report,\u003c/li\u003e\n\u003cli\u003etrack metrics,\u003c/li\u003e\n\u003cli\u003efail kalau output nggak sesuai schema.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTambahkan \u003ccode\u003eready_to_merge\u003c/code\u003e di schema dengan nilai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eno\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eyes\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eyes_with_fixes\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"6-update-review-notes-menjadi-learning-artifacts\"\u003e6. Update review notes menjadi learning artifacts\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-update-review-notes-menjadi-learning-artifacts\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi file \u003ccode\u003ereviews/*.md\u003c/code\u003e, tambahkan bagian yang jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem statement\u003c/li\u003e\n\u003cli\u003eEvidence\u003c/li\u003e\n\u003cli\u003eProposed fix\u003c/li\u003e\n\u003cli\u003eBefore/After\u003c/li\u003e\n\u003cli\u003eRationale\u003c/li\u003e\n\u003cli\u003eVerification suggestion\u003c/li\u003e\n\u003cli\u003eCounter-argument space\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bikin note berfungsi sebagai pedagogical artifact sekaligus audit log.\u003c/p\u003e\n\u003ch2 id=\"contoh-format-review-note-yang-cocok\"\u003eContoh format review note yang cocok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-format-review-note-yang-cocok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGunakan struktur seperti ini:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token front-matter-block\"\u003e\u003cspan class=\"token punctuation\"\u003e---\u003c/span\u003e\n\u003cspan class=\"token front-matter yaml language-yaml\"\u003estatus: changes_requested\nreview_mode: diff_plus_context\nreviewer: agent\nmr: !123\nbranch: feat-jira-oauth\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e---\u003c/span\u003e\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Code Review: feat-jira-oauth\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Decision\u003c/span\u003e\nchanges_requested\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Summary\u003c/span\u003e\n\nBranch menambahkan ...\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Scope\u003c/span\u003e\nsecurity, correctness, maintainability\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Changed files\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token code-snippet code keyword\"\u003e`packages/jira/src/auth.ts`\u003c/span\u003e\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token code-snippet code keyword\"\u003e`packages/jira/src/api.ts`\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Blocking findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e 1. Missing authorization check\u003c/span\u003e\n\n...full learning block...\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Non-blocking findings\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e###\u003c/span\u003e 1. Naming mismatch in config loader\u003c/span\u003e\n\n...short note...\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Strengths\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Good test coverage for happy path.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Clear logging for auth errors.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Verification\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e diff-only review\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e no tests run\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e no scanner run\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Human review needed\u003c/span\u003e\n\nYes\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Recommendation\u003c/span\u003e\n\nDo not merge until authorization issue fixed.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Appendix\u003c/span\u003e\n\n...additional notes...\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"kenapa-ini-cocok-untuk-hands-on\"\u003eKenapa ini cocok untuk hands-on?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-cocok-untuk-hands-on\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bukan soal memperpendek review semata.\u003c/p\u003e\n\u003cp\u003eIni soal membuat output agent jadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebisa dieksekusi oleh mesin,\u003c/li\u003e\n\u003cli\u003ebisa dibaca cepat oleh reviewer,\u003c/li\u003e\n\u003cli\u003etetap menyimpan penjelasan pedagis untuk dev,\u003c/li\u003e\n\u003cli\u003ebisa dikonversi jadi skill/AGENTS.md di harness.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"yang-harus-dilakukan-sekarang\"\u003eYang harus dilakukan sekarang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yang-harus-dilakukan-sekarang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eStandarisasi frontmatter status di semua review file.\u003c/li\u003e\n\u003cli\u003eTerapkan struktur heading yang seragam.\u003c/li\u003e\n\u003cli\u003eDefinisikan schema internal untuk agent.\u003c/li\u003e\n\u003cli\u003ePisahkan output singkat untuk MR comment dan output panjang untuk archive.\u003c/li\u003e\n\u003cli\u003eTambahkan \u003ccode\u003ereview_mode\u003c/code\u003e dan \u003ccode\u003ehuman review needed\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eGunakan severity-based depth untuk detail.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePanjang bukan masalah jika ia membawa reasoning.\u003c/p\u003e\n\u003cp\u003eReview yang baik tidak hanya memberi verdict, tetapi membuat klaimnya bisa diuji: di mana masalahnya, seperti apa before-after-nya, kenapa solusi itu masuk akal, dan kapan temuan itu bisa dibantah.\u003c/p\u003e\n\u003cp\u003eDisiplin utamanya bukan memendekkan review, tetapi membuatnya terstruktur, berbasis evidence, dan actionable.\u003c/p\u003e\n\u003ch2 id=\"referensi-yang-paling-relevan\"\u003eReferensi yang paling relevan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-yang-paling-relevan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonteks elo paling cocok dengan kombinasi referensi berikut:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eaparimeet/ai-code-review\u003c/code\u003e: arsitektur webhook + async worker + fetch diff + post comment. Ini model MVP untuk bot GitLab.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eantlss/gitlab-review-agent\u003c/code\u003e: lebih lengkap soal clone repo, context-aware review, historical conventions, dan feedback loop yang jadi repository best practices.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eKrotovM/gitlab-ai-mr-reviewer\u003c/code\u003e: contoh CI-triggered reviewer. Kalau belum mau webhook atau mau model post Markdown ke MR, ini referensi praktis.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eanthropics/claude-code/plugins/code-review\u003c/code\u003e: model multi-agent, confidence scoring, explicit guideline verification, dan update instructions dari pola review berulang.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAlex Ellis\u003c/code\u003e article tentang GitHub review bot: safety architecture, HMAC/webhook validation, sandboxing, prompt injection dari PR description.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egetsentry/skills\u003c/code\u003e, \u003ccode\u003eawesome-skills/code-review-skill\u003c/code\u003e, \u003ccode\u003esemgrep/skills\u003c/code\u003e, \u003ccode\u003egohypergiant/agent-skills\u003c/code\u003e, \u003ccode\u003emicrosoft/skills code-review.prompt.md\u003c/code\u003e: semua ini bagus untuk struktur skill modular dan rule-based review.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apa-yang-belum-banyak-ada-di-referensi-lain\"\u003eApa yang belum banyak ada di referensi lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-belum-banyak-ada-di-referensi-lain\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBanyak implementasi berhenti di “AI nemu issue”. Yang elo mau adalah teaching layer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003efinding\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eevidence\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebefore\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eafter\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eproposed diff\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erationale\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003everification\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecounter-argument space\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu bisa jadi diferensiasi desain elo.\u003c/p\u003e\n\u003ch3 id=\"saran-baca-bertahap\"\u003eSaran baca bertahap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#saran-baca-bertahap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eaparimeet/ai-code-review\u003c/code\u003e untuk arsitektur webhook + worker.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eantlss/gitlab-review-agent\u003c/code\u003e untuk review harness dan context-aware MR review.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAlex Ellis\u003c/code\u003e untuk safety dan prompt injection.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAnthropic code-review plugin\u003c/code\u003e untuk multi-agent + confidence scoring.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egetsentry/skills\u003c/code\u003e dan \u003ccode\u003esemgrep/skills\u003c/code\u003e untuk skill modular.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" targ
