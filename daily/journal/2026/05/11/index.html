rewrite-oracle"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.11","id":"daily.journal.2026.05.11","vaultName":"vault"},"value":"notes.prompt-engineering.hunk-terminal-diff-reviewer","position":{"start":{"line":14,"column":3,"offset":1089},"end":{"line":14,"column":59,"offset":1145},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.prompt-engineering.hunk-terminal-diff-reviewer"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.11","id":"daily.journal.2026.05.11","vaultName":"vault"},"value":"notes.prompt-engineering.markdown-vs-html-llm","position":{"start":{"line":32,"column":25,"offset":2359},"end":{"line":32,"column":74,"offset":2408},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.prompt-engineering.markdown-vs-html-llm"}}],"anchors":{"baca-dan-catat-hari-ini":{"type":"header","text":"Baca dan catat hari ini","value":"baca-dan-catat-hari-ini","line":17,"column":0,"depth":2},"apa-yang-dibuat":{"type":"header","text":"Apa yang dibuat","value":"apa-yang-dibuat","line":22,"column":0,"depth":2},"insight-penting":{"type":"header","text":"Insight penting","value":"insight-penting","line":31,"column":0,"depth":2},"thread-x--notes-baru":{"type":"header","text":"Thread X \u0026 notes baru","value":"thread-x--notes-baru","line":36,"column":0,"depth":2},"rencana-lanjut":{"type":"header","text":"Rencana lanjut","value":"rencana-lanjut","line":49,"column":0,"depth":2},"thread-x-markdown-vs-html-untuk-kerja-bareng-llm":{"type":"header","text":"Thread X: Markdown vs HTML untuk kerja bareng LLM","value":"thread-x-markdown-vs-html-untuk-kerja-bareng-llm","line":52,"column":0,"depth":2},"thread-x-dp-mindset-di-sistem-nyata":{"type":"header","text":"Thread X: DP mindset di sistem nyata","value":"thread-x-dp-mindset-di-sistem-nyata","line":73,"column":0,"depth":2}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-11\"\u003e2026-05-11\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-11\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"baca-dan-catat-hari-ini\"\u003eBaca dan catat hari ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-dan-catat-hari-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHari ini gue bikin note baru yang menjelaskan perbedaan product vs service di SaaS B2B dengan contoh HRIS, CRM, dan contoh produk SaaS internal.\u003c/p\u003e\n\u003cp\u003eIntinya: product adalah capability inti, service adalah experience berkelanjutan yang bikin tenant betah.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-dibuat\"\u003eApa yang dibuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-dibuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — contoh public untuk HRIS, CRM, dan produk SaaS internal.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.chapter-1\"\u003eChapter 1 — The SaaS Mindset\u003c/a\u003e — summary Chapter 1 tentang mindset SaaS.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading\"\u003eChapter 1 Close Reading — The SaaS Mindset\u003c/a\u003e — close reading Chapter 1 dengan paragraf, quotes, dan sketch.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.lee-robinson-hiring-signals\"\u003eLee Robinson: signal-first hiring advice untuk engineer\u003c/a\u003e — catatan thread Lee Robinson tentang paket aplikasi engineering signal-first.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.software-architechture.bun-rust-porting\"\u003eBun porting dari Zig ke Rust: masalah layering, crates, dan tagged pointer\u003c/a\u003e — catatan thread Jarred Sumner tentang port Bun ke Rust, layering, crates, dan tagged pointers.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.software-architechture.bun-rewrite-oracle\"\u003eBun rewrite Zig → Rust: oracle test dan validasi independen\u003c/a\u003e — catatan thread Rhys Sullivan tentang validasi rewrite Bun Zig→Rust dan oracle testing.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.hunk-terminal-diff-reviewer\"\u003eHunk: review-first terminal diff viewer untuk changeset\u003c/a\u003e — catatan tool Hunk untuk review-first terminal diff dan workflow Jujutsu (\u003ccode\u003ejj\u003c/code\u003e) integration.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight-penting\"\u003eInsight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDalam SaaS B2B, customer masuk karena capability, tapi churn karena service experience.\u003c/li\u003e\n\u003cli\u003eService experience meliputi onboarding, operability, support, reliability, trust, dan continuity of value.\u003c/li\u003e\n\u003cli\u003eProduct-only mindset bisa menghasilkan fitur bagus, tetapi service buruk yang membuat tenant capek.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"thread-x--notes-baru\"\u003eThread X \u0026#x26; notes baru\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#thread-x--notes-baru\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHari ini gue lihat kemungkinan kuat bahwa thread Markdown vs HTML untuk LLM ini berkaitan langsung dengan artikel Thariq.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThariq mengoptimalkan artifact yang harus dibaca manusia dalam workflow agent.\u003c/li\u003e\n\u003cli\u003eAntirez mengoptimalisasi representasi yang harus dibaca model, dengan fokus pada token economy dan semantic density.\u003c/li\u003e\n\u003cli\u003eReply terbaik tidak mematahkan keduanya secara frontal; mereka menggeser diskusi ke hybrid pipeline:\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMarkdown untuk source / agent-facing context\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHTML untuk rendered / human-facing surface\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGenerate HTML dari markdown / reasoning output, bukan pakai HTML sebagai source utama\u003c/strong\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eJadi arah diskusi yang mulai muncul bukan \"Markdown menang\" atau \"HTML menang\" — tapi \u003cstrong\u003ekeduanya punya tempat berbeda\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBuat referensi sendiri: \u003ca href=\"/sotoy/notes/notes.prompt-engineering.markdown-vs-html-llm\"\u003eMarkdown vs HTML untuk kerja LLM dan kolaborasi manusia\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"rencana-lanjut\"\u003eRencana lanjut\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rencana-lanjut\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLanjut ke Chapter 2: \u003cem\u003eMulti-Tenant Architecture Fundamentals\u003c/em\u003e untuk mulai mengurai bagaimana mindset ini bertransformasi ke pilihan arsitektur.\u003c/p\u003e\n\u003ch2 id=\"thread-x-markdown-vs-html-untuk-kerja-bareng-llm\"\u003eThread X: Markdown vs HTML untuk kerja bareng LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#thread-x-markdown-vs-html-untuk-kerja-bareng-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLink: \u003ca href=\"https://x.com/antirez/status/2053113951123054963\"\u003ehttps://x.com/antirez/status/2053113951123054963\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYang gue pilih dulu: diskusinya di thread itu tentang debat format untuk kerja sama dengan LLM, bukan debat web-dev rendering umum.\u003c/p\u003e\n\u003cp\u003eInti yang gue tangkap:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePertanyaannya bukan hanya format untuk manusia, tapi format untuk LLM.\u003c/li\u003e\n\u003cli\u003eAntirez bilang pindah dari Markdown ke HTML itu \"rugi\" karena HTML biasanya lebih verbose dan bikin makna tersebar ke banyak token.\u003c/li\u003e\n\u003cli\u003eHTML bisa lebih nyaman untuk struktur kompleks, tapi itu belum tentu optimal untuk model yang lebih baik baca teks dan pattern manusia.\u003c/li\u003e\n\u003cli\u003ePerbedaan \"semantically dense\" vs \"semantically sparse\" itu soal berapa banyak makna yang dibawa tiap token, bukan semata jumlah tag.\u003c/li\u003e\n\u003cli\u003eKesimpulan praktis: Markdown lebih cocok untuk reasoning, notes, dan prompt artifact yang perlu padat. HTML masih relevan untuk presentasi, UI spec, atau transformasi ke sistem lain.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eInsight penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIni bukan soal mana yang lebih bagus secara absolut. Ini soal representation cost untuk penerima utamanya.\u003c/li\u003e\n\u003cli\u003eHTML bisa berguna untuk browser/parser tradisional, tapi untuk LLM kadang wrapper tambahan justru menambah noise.\u003c/li\u003e\n\u003cli\u003eKalau kita pakai satu format untuk dua tujuan sekaligus — reasoning dan rendering — kita mungkin salah kaprah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue sensenya: thread ini paling sehat kalau dilihat sebagai panggilan untuk memisahkan \"working representation\" dan \"presentation representation\". Format yang optimal buat LLM belum tentu sama dengan yang optimal buat browser atau UI.\u003c/p\u003e\n\u003ch2 id=\"thread-x-dp-mindset-di-sistem-nyata\"\u003eThread X: DP mindset di sistem nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#thread-x-dp-mindset-di-sistem-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLink: \u003ca href=\"https://x.com/DevanshuXi/status/2053327490106466691\"\u003ehttps://x.com/DevanshuXi/status/2053327490106466691\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYang gue pilih dari thread ini: ini bukan thread tentang LeetCode atau definisi DP dari buku. Ini tentang kenapa pola pikir DP muncul di sistem nyata — compiler, database, scheduler, distributed systems — dan kenapa itu penting.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003eDP itu apa menurut thread?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDP adalah cara mereduksi ruang pencarian eksponensial jadi state kecil yang bisa dihitung ulang.\u003c/li\u003e\n\u003cli\u003eFokusnya bukan cuma recurrence atau tabel 2D, tapi: ada banyak kemungkinan, ada overlap, dan kita bisa pakai kembali hasil subproblem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eKenapa infrastruktur \"diam-diam bergantung\" pada ide ini?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBanyak sistem nyata sedang menjawab: \"untuk state X, keputusan terbaik apa?\"\u003c/li\u003e\n\u003cli\u003eKalau jawaban itu disimpan dan dibangun dari bagian kecil, aroma DP muncul.\u003c/li\u003e\n\u003cli\u003eIni bukan berarti semua sistem implementasi DP literal. Banyak yang sebenarnya pakai pola pikir serupa: state, cost, reuse, decomposition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eContoh optimizer database itu apa maksudnya?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuery optimizer klasik (Selinger-style) memang menyimpan plan termurah untuk setiap subset join.\u003c/li\u003e\n\u003cli\u003eItu benar-benar DP: state = subset tabel, value = cost terbaik, transition = gabung subplan.\u003c/li\u003e\n\u003cli\u003eJadi contoh ini bukan sekadar retorika; dia punya DNA DP yang nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eSemua contoh yang disebut apakah benar-benar DP?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBeberapa jelas: Viterbi, edit distance, sequence alignment, value iteration, query optimization subset-style.\u003c/li\u003e\n\u003cli\u003eBeberapa lain sering mengandung DP tapi tidak otomatis: compiler optimization, register allocation, scheduling, GPU tiling, cache policy.\u003c/li\u003e\n\u003cli\u003eSisanya lebih ke bau DP: TCP congestion, distributed systems thinking, heuristik cost-based.\u003c/li\u003e\n\u003cli\u003eJadi koreksinya: thread kuat sebagai framing mindset, tetapi sedikit overreach kalau semua contoh dibaca sebagai DP literal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eInsight penting yang gue ambil:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eYang paling berharga bukan daftar contoh, tapi cara nanya:\n\u003cul\u003e\n\u003cli\u003eapa state minimum yang penting?\u003c/li\u003e\n\u003cli\u003eapa informasi yang cukup untuk memutuskan masa depan?\u003c/li\u003e\n\u003cli\u003edimana overlap komputasi terjadi?\u003c/li\u003e\n\u003cli\u003eapakah local optimality bisa compose jadi global optimality?\u003c/li\u003e\n\u003cli\u003eapa dimensi search space yang harus dimodelkan?\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eItu adalah mental model DP yang bisa dipakai jauh di luar soal algorithmic DP.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCatatan penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDP bukan cuma memoization. Memoization tanpa recurrence dan optimal substructure belum tentu DP.\u003c/li\u003e\n\u003cli\u003eDP juga bukan greedy atau heuristic. Tapi pola pikir serumpun kadang membantu pilih antara DP literal dan heuristic engineer.\u003c/li\u003e\n\u003cli\u003eDalam engineering sehari-hari, yang sering kepake adalah pola pikir: cari state yang relevan, simpan hasil intermediate, dan bangun solusi besar dari bagian kecil.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau mau lanjut, next gue bisa bedah: \"beda DP literal, memoization biasa, greedy, dan heuristic optimizer.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esaas (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eservice (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"pr
