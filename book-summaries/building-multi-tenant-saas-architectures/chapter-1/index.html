vice-mindset-fokus-ke-bagaimana-value-dialami","line":37,"column":0,"depth":2},"3-product-bisa-statis-service-harus-terus-hidup":{"type":"header","text":"3) Product bisa statis, service harus terus hidup","value":"3-product-bisa-statis-service-harus-terus-hidup","line":51,"column":0,"depth":2},"4-service-mindset-berbeda-dari-product-mindset-secara-konseptual":{"type":"header","text":"4) Service mindset berbeda dari product mindset secara konseptual","value":"4-service-mindset-berbeda-dari-product-mindset-secara-konseptual","line":59,"column":0,"depth":2},"5-success-metric-berubah":{"type":"header","text":"5) Success metric berubah","value":"5-success-metric-berubah","line":74,"column":0,"depth":2},"6-organisasi-harus-berubah-juga":{"type":"header","text":"6) Organisasi harus berubah juga","value":"6-organisasi-harus-berubah-juga","line":96,"column":0,"depth":2},"7-ini-penting-karena-saas-menurut-golding-adalah-service-centric":{"type":"header","text":"7) Ini penting karena SaaS menurut Golding adalah service-centric","value":"7-ini-penting-karena-saas-menurut-golding-adalah-service-centric","line":106,"column":0,"depth":2},"synthesizing-product-vs-service-dalam-saas":{"type":"header","text":"Synthesizing: product vs service dalam SaaS","value":"synthesizing-product-vs-service-dalam-saas","line":124,"column":0,"depth":2},"bagaimana-chapter-ini-mendukung-keseluruhan-buku":{"type":"header","text":"Bagaimana chapter ini mendukung keseluruhan buku","value":"bagaimana-chapter-ini-mendukung-keseluruhan-buku","line":133,"column":0,"depth":2}},"children":["book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading"],"parent":"book-summaries.building-multi-tenant-saas-architectures","data":{}},"body":"\u003ch1 id=\"chapter-1--the-saas-mindset\"\u003eChapter 1 — The SaaS Mindset\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-1--the-saas-mindset\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eChapter 1 ini terasa seperti pergeseran cara pikir. Setelah Preface bilang kenapa buku ini perlu ada, di chapter ini Golding bikin kita sepakat dulu bahwa SaaS bukan sekadar teknologi atau deployment model.\u003c/p\u003e\n\u003cp\u003eYang paling gue ingat adalah dua kalimat ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It’s essential for SaaS architects to understand that SaaS is not a technology-first mindset.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“With SaaS, we shift from creating a product to creating a service.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu bukan jargon. Itu mengubah pusat perhatian dari \"apa yang dibangun\" jadi \"bagaimana value itu terus dialami.\" Kalau kamu masih nganggap SaaS cuma berarti cloud, Kubernetes, atau multi-tenant DB, kamu bakal gagal nangkap ruh chapter ini.\u003c/p\u003e\n\u003ch2 id=\"1-product-mindset-fokus-ke-apa-yang-dibangun\"\u003e1) Product mindset fokus ke apa yang dibangun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-product-mindset-fokus-ke-apa-yang-dibangun\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau kamu building product, yang biasanya kamu tanyakan adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efitur apa yang dibutuhkan?\u003c/li\u003e\n\u003cli\u003ecapability apa yang harus tersedia?\u003c/li\u003e\n\u003cli\u003egap mana yang bisa ditutup?\u003c/li\u003e\n\u003cli\u003eini bisa dijual nggak?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGolding bilang model product-centric biasanya masih cukup untuk software yang diinstall per-customer. Di situ, fokusnya adalah barangnya ada, lalu customer membeli.\u003c/p\u003e\n\u003ch2 id=\"2-service-mindset-fokus-ke-bagaimana-value-dialami\"\u003e2) Service mindset fokus ke bagaimana value dialami\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-service-mindset-fokus-ke-bagaimana-value-dialami\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBegitu masuk SaaS, pertanyaannya berubah jadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eonboarding semudah apa?\u003c/li\u003e\n\u003cli\u003etime to value cepat atau lama?\u003c/li\u003e\n\u003cli\u003eseberapa sering downtime terjadi?\u003c/li\u003e\n\u003cli\u003efeedback user masuk seberapa cepat?\u003c/li\u003e\n\u003cli\u003eupdate terasa sebagai improvement berkelanjutan atau gangguan?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAnalogi restorannya pas: makanan itu product. Salam di pintu, air minum, kecepatan waiter, itu service.\u003c/p\u003e\n\u003cp\u003eDi SaaS, aplikasi bisa fiturnya lengkap, tapi kalau pengalaman onboarding, reliability, dan support jelek, tenant akan tetap sakit hati.\u003c/p\u003e\n\u003ch2 id=\"3-product-bisa-statis-service-harus-terus-hidup\"\u003e3) Product bisa statis, service harus terus hidup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-product-bisa-statis-service-harus-terus-hidup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProduct mentality mudah jatuh pada pola \"kita bikin, lalu customer gunakan.\" Service mentality nggak bisa kayak gitu. Service itu selalu berjalan.\u003c/p\u003e\n\u003cp\u003eDalam model SaaS, tenant hanya melihat permukaan service. Mereka nggak peduli patch, konfigurasi infra, atau deployment pipeline. Mereka peduli apakah mereka terus dapat value.\u003c/p\u003e\n\u003cp\u003eJadi operation bukan urusan belakang layar saja. Uptime, deployment, dan onboarding adalah bagian dari experience yang dirasakan tenant.\u003c/p\u003e\n\u003ch2 id=\"4-service-mindset-berbeda-dari-product-mindset-secara-konseptual\"\u003e4) Service mindset berbeda dari product mindset secara konseptual\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-service-mindset-berbeda-dari-product-mindset-secara-konseptual\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eModel software lama sering sales-driven. Itu bisa membuat organisasi kejar one-off request demi menutup deal.\u003c/p\u003e\n\u003cp\u003eTapi Golding bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“the needs of the many should always outweigh the needs of the few.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting. Service mindset bilang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan korbankan kualitas sistem untuk satu customer besar,\u003c/li\u003e\n\u003cli\u003ejangan biarkan satu fitur khusus merusak agility dan operability untuk semua tenant.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKeputusan SaaS harus dilihat secara sistemik, bukan per deal.\u003c/p\u003e\n\u003ch2 id=\"5-success-metric-berubah\"\u003e5) Success metric berubah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-success-metric-berubah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi product mindset, metrik sukses biasanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efeature completeness,\u003c/li\u003e\n\u003cli\u003eroadmap delivery,\u003c/li\u003e\n\u003cli\u003ewin rate,\u003c/li\u003e\n\u003cli\u003ecustomer acquisition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi service mindset, metriknya melebar jadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eonboarding completion time,\u003c/li\u003e\n\u003cli\u003etime to value,\u003c/li\u003e\n\u003cli\u003eavailability / reliability,\u003c/li\u003e\n\u003cli\u003erelease frequency,\u003c/li\u003e\n\u003cli\u003esupport responsiveness,\u003c/li\u003e\n\u003cli\u003efeedback loop,\u003c/li\u003e\n\u003cli\u003eretention / churn,\u003c/li\u003e\n\u003cli\u003etenant satisfaction.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukan sekadar \"fitur selesai\", tapi \"apakah service experience membaik?\"\u003c/p\u003e\n\u003ch2 id=\"6-organisasi-harus-berubah-juga\"\u003e6) Organisasi harus berubah juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-organisasi-harus-berubah-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bukan cuma urusan PM atau arsitek. Semua peran terpengaruh.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProduct owner harus mikir onboarding dan operational attributes.\u003c/li\u003e\n\u003cli\u003eEngineer harus mikir apakah solusi mempercepat perubahan, meningkatkan reliabilitas, dan memudahkan operasi.\u003c/li\u003e\n\u003cli\u003eQA harus menjaga kualitas experience, bukan sekadar memvalidasi fitur.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau kamu masih building product, organisasi cenderung build lalu handoff. Kalau kamu building service, semua orang harus rapat karena semua orang ikut bentuk pengalaman tenant.\u003c/p\u003e\n\u003ch2 id=\"7-ini-penting-karena-saas-menurut-golding-adalah-service-centric\"\u003e7) Ini penting karena SaaS menurut Golding adalah service-centric\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-ini-penting-karena-saas-menurut-golding-adalah-service-centric\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDefinisi SaaS yang dia hadirkan adalah:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“a low-friction, service-centric model that maximizes value for customers and providers.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eFokusnya: low-friction dan service-centric. Jadi SaaS bukan cuma software yang bisa diakses lewat internet. SaaS adalah software yang dibungkus sebagai experience berkelanjutan dengan friction rendah.\u003c/p\u003e\n\u003cp\u003eKalau kamu masih tertarik pada product-only, kamu akan lupa friction seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edaftar yang susah,\u003c/li\u003e\n\u003cli\u003esetup lama,\u003c/li\u003e\n\u003cli\u003ebilling yang nggak jelas,\u003c/li\u003e\n\u003cli\u003esupport lambat,\u003c/li\u003e\n\u003cli\u003erollout yang mengganggu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSemua itu bukan \"fitur\", tapi mereka masih membunuh value.\u003c/p\u003e\n\u003ch2 id=\"synthesizing-product-vs-service-dalam-saas\"\u003eSynthesizing: product vs service dalam SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#synthesizing-product-vs-service-dalam-saas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue ringkas:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBuilding product\u003c/strong\u003e = optimalisasi pada apa yang dibuat.\n\u003cstrong\u003eBuilding service\u003c/strong\u003e = optimalisasi pada bagaimana value terus dialami.\u003c/p\u003e\n\u003cp\u003eDi SaaS, Golding jelas memihak yang kedua. Karena tenant nggak beli sekadar fitur. Mereka membeli pengalaman yang terus hidup.\u003c/p\u003e\n\u003ch2 id=\"bagaimana-chapter-ini-mendukung-keseluruhan-buku\"\u003eBagaimana chapter ini mendukung keseluruhan buku\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-chapter-ini-mendukung-keseluruhan-buku\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChapter 1 tidak hanya mengajarkan istilah baru. Dia memindahkan pusat cara mikir:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edari \"apa yang saya bangun\" ke \"bagaimana tenant merasakan value\"\u003c/li\u003e\n\u003cli\u003edari \"shared infra vs dedicated\" ke \"apakah service yang dirasakan tetap terpusat dan rapi\"\u003c/li\u003e\n\u003cli\u003edari \"kejar one-off deal\" ke \"jaga service kolektif\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu membuat bab selanjutnya bukan langsung soal teknis. Mereka jadi soal bagaimana pola teknis itu membantu tujuan layanan dan bisnis.\u003c/p\u003e\n\u003cp\u003eKalau lo mau, next kita bisa bikin \u003cstrong\u003e10 takeaways paling penting dari Chapter 1\u003c/strong\u003e atau langsung ke \u003cstrong\u003eChapter 2: Multi-Tenant Architecture Fundamentals\u003c/strong\u003e.\u003c/p\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures.chapter-1.close-reading\"\u003eChapter 1 Close Reading — The SaaS Mindset\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 i
