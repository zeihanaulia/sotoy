mn":0,"depth":2},"dasar":{"type":"header","text":"Dasar","value":"dasar","line":86,"column":0,"depth":3},"review-repo-git":{"type":"header","text":"Review repo Git","value":"review-repo-git","line":103,"column":0,"depth":3},"live-watch-mode":{"type":"header","text":"Live watch mode","value":"live-watch-mode","line":111,"column":0,"depth":3},"review-patch-dari-pipe":{"type":"header","text":"Review patch dari pipe","value":"review-patch-dari-pipe","line":118,"column":0,"depth":3},"integrasi-git-pager":{"type":"header","text":"Integrasi Git pager","value":"integrasi-git-pager","line":124,"column":0,"depth":3},"integrasi-jujutsu-jj":{"type":"header","text":"Integrasi Jujutsu (JJ)","value":"integrasi-jujutsu-jj","line":146,"column":0,"depth":3},"limitasi-dibanding-tool-diff-lain":{"type":"header","text":"Limitasi dibanding tool diff lain","value":"limitasi-dibanding-tool-diff-lain","line":164,"column":0,"depth":2},"kesimpulan":{"type":"header","text":"Kesimpulan","value":"kesimpulan","line":175,"column":0,"depth":2}},"children":[],"parent":"notes.prompt-engineering","data":{}},"body":"\u003ch1 id=\"hunk-review-first-terminal-diff-viewer-untuk-changeset\"\u003eHunk: review-first terminal diff viewer untuk changeset\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hunk-review-first-terminal-diff-viewer-untuk-changeset\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"apa-itu-hunk\"\u003eApa itu Hunk?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-hunk\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat Hunk sebagai terminal diff viewer yang bukan sekadar \u003ccode\u003egit diff\u003c/code\u003e berwarna.\nHunk lebih mirip \u003cstrong\u003elocal code review UI untuk changeset\u003c/strong\u003e, dengan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esidebar file navigation\u003c/li\u003e\n\u003cli\u003emulti-file review stream\u003c/li\u003e\n\u003cli\u003esplit/stack layout\u003c/li\u003e\n\u003cli\u003emouse + keyboard support\u003c/li\u003e\n\u003cli\u003eauto-reload/watch mode\u003c/li\u003e\n\u003cli\u003eagent/AI annotation workflow\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi dokumentasinya dia menyebut diri sebagai \"review-first terminal diff viewer for agent-authored changesets\". Itu kena banget: fokusnya bukan tampilan patch, tapi membuat diff terasa seperti sesi review.\u003c/p\u003e\n\u003ch2 id=\"kenapa-mitchell-mengganti-diff-viewer-lain\"\u003eKenapa Mitchell mengganti diff viewer lain?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-mitchell-mengganti-diff-viewer-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi thread Mitchell dia bilang beberapa hal penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elooks good\u003c/li\u003e\n\u003cli\u003espeedy\u003c/li\u003e\n\u003cli\u003egood keyboard shortcuts\u003c/li\u003e\n\u003cli\u003egood mouse support for fallback\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu bukan pujian default buat tool terminal.\nGue baca sebagai sinyal bahwa dia dapat pengalaman yang lebih mulus ketimbang viewer lain: navigasinya lebih enak, layout-nya tidak bikin kepala pusing, dan dia bisa pakai mouse kalau perlu.\u003c/p\u003e\n\u003cp\u003ePlus, Hunk memang menjanjikan workflow yang dekat dengan review hasil agent, bukan cuma comparing file.\u003c/p\u003e\n\u003ch2 id=\"apa-itu-jj--jujutsu-di-konteks-ini\"\u003eApa itu \u003ccode\u003ejj\u003c/code\u003e / Jujutsu di konteks ini?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-jj--jujutsu-di-konteks-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003ejj\u003c/code\u003e bukan alias diff tool. \u003ccode\u003ejj\u003c/code\u003e adalah Jujutsu: sebuah version control system yang punya command seperti \u003ccode\u003ejj diff\u003c/code\u003e, \u003ccode\u003ejj show\u003c/code\u003e, \u003ccode\u003ejj rebase\u003c/code\u003e, dan lain-lain.\u003c/p\u003e\n\u003cp\u003eJujutsu mencoba mengemas ulang UX VCS sambil tetap kompatibel dengan Git. \u003ccode\u003ejj diff\u003c/code\u003e dan \u003ccode\u003ejj show\u003c/code\u003e di thread Hunk artinya orang pengen Hunk bisa dipakai sebagai viewer untuk workflow Jujutsu, bukan cuma Git.\u003c/p\u003e\n\u003cp\u003eJadi bagian \u003ccode\u003eJJ\u003c/code\u003e di note ini bukan sekadar integrasi pager. Dia adalah integrasi antara:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eengine version control\u003c/strong\u003e (\u003ccode\u003ejj\u003c/code\u003e/Jujutsu)\u003c/li\u003e\n\u003cli\u003edan \u003cstrong\u003ereview UI diff\u003c/strong\u003e (Hunk)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu penting supaya lo ngerti kenapa thread Hunk ada banyak referensi ke \u003ccode\u003ejj\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"use-case-paling-cocok-buat-apa\"\u003eUse case paling cocok buat apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#use-case-paling-cocok-buat-apa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUse case Hunk yang paling pas menurut gue:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eReview changeset lokal di repo Git\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehunk diff\u003c/code\u003e untuk working tree\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehunk show\u003c/code\u003e untuk commit\u003c/li\u003e\n\u003cli\u003ecocok buat pre-commit review dan melihat perubahan multi-file\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eReview live saat coding\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehunk diff --watch\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eHunk auto-reload saat file berubah\u003c/li\u003e\n\u003cli\u003epas banget buat buka editor di satu terminal dan review di terminal lain\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eReview patch atau stdin diff\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003egit diff --no-color | hunk patch -\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ecocok buat skrip, patch generator, atau output tool lain\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eReview output agent / AI-generated changes\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHunk punya workflow agent notes\u003c/li\u003e\n\u003cli\u003ebisa pakai \u003ccode\u003ehunk diff\u003c/code\u003e sambil agent bantu anotasi\u003c/li\u003e\n\u003cli\u003eini sesuai positioning resmi mereka\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"cara-pakainya\"\u003eCara pakainya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cara-pakainya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"dasar\"\u003eDasar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dasar\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eInstall:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003enpm\u003c/span\u003e i -g hunkdiff\n\u003cspan class=\"token comment\"\u003e# atau\u003c/span\u003e\nbrew \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e modem-dev/tap/hunk\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJalankan:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003ehunk\nhunk --version\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"review-repo-git\"\u003eReview repo Git\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#review-repo-git\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003ehunk \u003cspan class=\"token function\"\u003ediff\u003c/span\u003e\nhunk show\nhunk show HEAD~1\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"live-watch-mode\"\u003eLive watch mode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#live-watch-mode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003ehunk \u003cspan class=\"token function\"\u003ediff\u003c/span\u003e --watch\nhunk \u003cspan class=\"token function\"\u003ediff\u003c/span\u003e before.ts after.ts --watch\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"review-patch-dari-pipe\"\u003eReview patch dari pipe\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#review-patch-dari-pipe\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003egit\u003c/span\u003e \u003cspan class=\"token function\"\u003ediff\u003c/span\u003e --no-color \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e hunk patch -\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"integrasi-git-pager\"\u003eIntegrasi Git pager\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#integrasi-git-pager\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau mau pakai Hunk sebagai pager Git:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003egit\u003c/span\u003e config --global core.pager \u003cspan class=\"token string\"\u003e\"hunk pager\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau alias opt-in:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003egit\u003c/span\u003e config --global alias.hdiff \u003cspan class=\"token string\"\u003e\"-c core.pager=\u003cspan class=\"token entity\" title=\"\\\u0026#x22;\"\u003e\\\"\u003c/span\u003ehunk pager\u003cspan class=\"token entity\" title=\"\\\u0026#x22;\"\u003e\\\"\u003c/span\u003e diff\"\u003c/span\u003e\n\u003cspan class=\"token function\"\u003egit\u003c/span\u003e config --global alias.hshow \u003cspan class=\"token string\"\u003e\"-c core.pager=\u003cspan class=\"token entity\" title=\"\\\u0026#x22;\"\u003e\\\"\u003c/span\u003ehunk pager\u003cspan class=\"token entity\" title=\"\\\u0026#x22;\"\u003e\\\"\u003c/span\u003e show\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLalu pakai:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003egit\u003c/span\u003e hdiff\n\u003cspan class=\"token function\"\u003egit\u003c/span\u003e hshow\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"integrasi-jujutsu-jj\"\u003eIntegrasi Jujutsu (JJ)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#integrasi-jujutsu-jj\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHunk bisa auto-detect JJ workspace dan support \u003ccode\u003ehunk diff [revset]\u003c/code\u003e / \u003ccode\u003ehunk show [revset]\u003c/code\u003e.\nKalau mau paksa VCS:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token comment\"\u003e# ~/.config/hunk/config.toml\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003evcs\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"jj\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk JJ pager:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eui\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003epager\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"hunk\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"pager\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ediff-formatter\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\":git\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"limitasi-dibanding-tool-diff-lain\"\u003eLimitasi dibanding tool diff lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#limitasi-dibanding-tool-diff-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHunk punya keunggulan di sisi review-first UI, tapi bukan pakar structural diff.\nKalau lo butuh AST-aware diff atau syntax-aware structural comparison, tool lain seperti \u003ccode\u003edifftastic\u003c/code\u003e masih lebih tepat.\u003c/p\u003e\n\u003cp\u003eBeberapa limitasi yang gue tangkap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ebukan structural diff tool\u003c/strong\u003e seperti difftastic\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUI review lebih penting daripada algoritma diff\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eintegrasi JJ dulu sempat agak kurang jelas, meski sekarang dokumentasinya sudah mendingan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHunk paling kuat kalau lo mau memposisikan changeset sebagai objek review, bukan cuma text patch.\nKalau workflow lo butuh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enavigasi file cepat,\u003c/li\u003e\n\u003cli\u003epreview diff multi-file,\u003c/li\u003e\n\u003cli\u003elive watch mode,\u003c/li\u003e\n\u003cli\u003ekeyboard + mouse terminal UI,\u003c/li\u003e\n\u003cli\u003edan review hasil AI/agent,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka Hunk bisa jadi tool yang benar-benar menggantikan \u003ccode\u003egit diff\u003c/code\u003e biasa.\u003c/p\u003e\n\u003cp\u003eKalau lo cuma butuh structural syntax diff, mungkin Hunk bukan tool utama.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprompt-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edevtools (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ediff (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eterminal (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ejj (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ejujutsu (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/l
