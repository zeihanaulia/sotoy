:2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"how-i-use-ai-to-code--literature-note\"\u003eHow I Use AI to Code — literature note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#how-i-use-ai-to-code--literature-note\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"summary\"\u003eSummary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#summary\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArtikel Chris Parsons menjelaskan bahwa kekuatan AI coding bukan berasal dari kecerdasan model saja, tapi dari sistem verifikasi dan harness di sekitarnya. Agent CLI memegang peran utama karena bisa membaca repo penuh, menjalankan command, mengulang loop perbaikan, dan menjaga konteks lebih baik daripada bantuan editor tradisional.\u003c/p\u003e\n\u003ch2 id=\"core-claims\"\u003eCore claims\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-claims\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAI coding berhasil karena loop verifikasi objektif, bukan karena model memahami software.\u003c/li\u003e\n\u003cli\u003eHarness adalah rangka kerja utama; prompt hanya bagian kecil dari sistem.\u003c/li\u003e\n\u003cli\u003eSenior engineer terbaik memindahkan judgement ke harness, bukan sekadar review diff.\u003c/li\u003e\n\u003cli\u003eInstruksi permanen seperti \u003ccode\u003eAGENTS.md\u003c/code\u003e / \u003ccode\u003eCLAUDE.md\u003c/code\u003e dan skill files menjaga konsistensi agent.\u003c/li\u003e\n\u003cli\u003eBottleneck sekarang adalah verification speed, bukan code speed.\u003c/li\u003e\n\u003cli\u003eSpesifikasi problem-first lebih kuat daripada spesifikasi solusi detail.\u003c/li\u003e\n\u003cli\u003eAgentic engineering berbeda dari vibe coding: output AI perlu disiplin engineering dan verifikasi, bukan sekadar kelihatan berhasil.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"quotes\"\u003eQuotes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#quotes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e“If you are still tied to your IDE, whether Cursor or Copilot, you are working a year behind. Coding turned out to be AI’s home territory.”\u003c/li\u003e\n\u003cli\u003e“Verified used to mean ‘read by you’. With modern agent throughput, it has to mean ‘checked by tests, by type checkers, by automated gates, or by you where your judgement matters’.”\u003c/li\u003e\n\u003cli\u003e“The reason is the harness, not the model.”\u003c/li\u003e\n\u003cli\u003e“When an agent gets stuck on something that should be trivial, treat it as a context failure, not a prompt failure.”\u003c/li\u003e\n\u003cli\u003e“Specify the problem, not the solution.”\u003c/li\u003e\n\u003cli\u003e“Output quality is a curve against context. Too little, and you get generic slop. Too much, and the model drowns in what it has been fed and the output gets vaguer and more confident at the same time.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"source\"\u003eSource\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#source\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://www.chrismdp.com/coding-with-ai/\"\u003ehttps://www.chrismdp.com/coding-with-ai/\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.gitlab-mr-review-agent-coolify\"\u003eGitLab MR Review Agent di Coolify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.gitlab-mr-comment-formatting\"\u003eCloud Agent Hands-on: MR Comment Formatting\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377281\"\u003eAI coding succeeds because verification replaces model certainty\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377282\"\u003eSoftware is good AI input because it is verifiable\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377283\"\u003eAgent CLI outperforms IDE assistants for repo-scale AI workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377284\"\u003eSenior engineers should train harnesses, not only review diffs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377285\"\u003eHarness matters more than prompt in AI coding workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377286\"\u003ePermanent repo instructions like AGENTS.md preserve agent behavior\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377287\"\u003eDomain-specific skill files turn guidance into reusable rules\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377288\"\u003ePortable markdown vaults make agent knowledge durable\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377289\"\u003eVerification speed is the bottleneck in AI coding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377290\"\u003eProblem-first specs outperform solution-detail specs for AI agents\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377291\"\u003eEffective agent context is a sweet spot, not maximum context\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778001021442\"\u003eAgentic engineering differs from vibe coding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377292\"\u003eFailure mode: vague AI output plus weak guardrails creates rework\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #a03623;\" href=\"/sotoy/notes/tags.zettel\"\u003ezettel\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eliterature (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003
