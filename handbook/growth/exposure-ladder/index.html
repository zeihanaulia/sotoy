e-regulation":{"type":"header","text":"Exposure Ladder for Shame Regulation","value":"exposure-ladder-for-shame-regulation","line":15,"column":0,"depth":1},"concept":{"type":"header","text":"Concept","value":"concept","line":17,"column":0,"depth":2},"the-ladder-step-by-step":{"type":"header","text":"The Ladder (Step-by-Step)","value":"the-ladder-step-by-step","line":20,"column":0,"depth":2},"communication-style-the-rough-observation":{"type":"header","text":"Communication Style: The \"Rough Observation\"","value":"communication-style-the-rough-observation","line":31,"column":0,"depth":3},"integration-with-maturity-theory":{"type":"header","text":"Integration with Maturity Theory","value":"integration-with-maturity-theory","line":37,"column":0,"depth":3},"breaking-recurring-patterns":{"type":"header","text":"Breaking Recurring Patterns","value":"breaking-recurring-patterns","line":44,"column":0,"depth":3},"shame-based-performance-correction":{"type":"header","text":"Shame-Based Performance Correction","value":"shame-based-performance-correction","line":51,"column":0,"depth":2},"practical-tips":{"type":"header","text":"Practical Tips","value":"practical-tips","line":56,"column":0,"depth":2}},"children":[],"parent":"p9p8pmhwbt20ewv1sznbfqe","data":{}},"body":"\u003ch1 id=\"exposure-ladder-for-shame-regulation\"\u003eExposure Ladder for Shame Regulation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#exposure-ladder-for-shame-regulation\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"exposure-ladder-for-shame-regulation-1\"\u003eExposure Ladder for Shame Regulation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#exposure-ladder-for-shame-regulation-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"concept\"\u003eConcept\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#concept\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTujuannya bukan untuk menjadi \"super percaya diri\", melainkan melatih sistem saraf agar belajar bahwa \u003cstrong\u003e\"saya bicara dan saya tetap aman\"\u003c/strong\u003e. Fokusnya adalah memindahkan ide dari ruang aman ke ruang berisiko tanpa membuat diri runtuh.\u003c/p\u003e\n\u003ch2 id=\"the-ladder-step-by-step\"\u003eThe Ladder (Step-by-Step)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-ladder-step-by-step\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLakukan secara bertahap. Jangan lompat ke tahap akhir sebelum tahap sebelumnya terasa \"biasa\".\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth align=\"left\"\u003eLevel\u003c/th\u003e\u003cth align=\"left\"\u003eAction\u003c/th\u003e\u003cth align=\"left\"\u003eGoal\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003e1. Low Risk\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eBicara 1 menit di tongkrongan kecil dengan struktur (Tesis \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Alasan A, B, C).\u003c/td\u003e\u003ctd align=\"left\"\u003eMelatih struktur berpikir saat santai.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003e2. Low-Mid Risk\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eMengajukan satu pertanyaan pendek di forum formal.\u003c/td\u003e\u003ctd align=\"left\"\u003eMemecah keheningan dan kehadiran diri.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003e3. Mid Risk\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eMemberikan satu komentar pendek/pendapat di forum.\u003c/td\u003e\u003ctd align=\"left\"\u003eMelatih penyampaian ide singkat.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003e4. Mid-High Risk\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eMempresentasikan satu ide selama 3 menit di forum.\u003c/td\u003e\u003ctd align=\"left\"\u003eMelatih ketahanan terhadap penilaian.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003e5. High Risk\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eMemimpin diskusi atau mempresentasikan tesis besar.\u003c/td\u003e\u003ctd align=\"left\"\u003eIntegrasi penuh antara ide dan ekspresi.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"communication-style-the-rough-observation\"\u003eCommunication Style: The \"Rough Observation\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#communication-style-the-rough-observation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk mengurangi beban mental saat tampil, gunakan gaya penyampaian yang tidak menuntut kesempurnaan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTesis Sederhana\u003c/strong\u003e: \u003cem\u003e\"Gue mau bawa satu poin dari obrolan kemarin, menurut gue masalahnya di X...\"\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eObservasi Kasar\u003c/strong\u003e: \u003cem\u003e\"Ini masih rough, tapi gue rasa penting dibawa ke forum karena...\"\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKlaim Kontribusi\u003c/strong\u003e: \u003cem\u003e\"Gue senang poin itu diangkat. Versi gue kemarin arahnya begini...\"\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"integration-with-maturity-theory\"\u003eIntegration with Maturity Theory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#integration-with-maturity-theory\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetiap langkah di atas adalah bentuk kecil dari:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSocial Investment\u003c/strong\u003e: Mengambil peran sebagai kontributor aktif.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSocial Emotional Stability\u003c/strong\u003e: Menahan rasa malu tanpa kabur.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAdaptive Learning\u003c/strong\u003e: Menjadikan kegagalan bicara sebagai data latihan, bukan bukti identitas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReality Check\u003c/strong\u003e: Membandingkan potensi isi kepala dengan output artikulasi nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"breaking-recurring-patterns\"\u003eBreaking Recurring Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#breaking-recurring-patterns\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGunakan ladder ini untuk memutus pola berulang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDeteksi\u003c/strong\u003e: Sadari saat pola \"diam di ruang besar\" muncul.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIntervensi\u003c/strong\u003e: Pilih satu level ladder yang paling rendah yang bisa dilakukan saat itu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDokumentasi\u003c/strong\u003e: Catat respon emosi dan pikiran setelah aksi (menggunakan framework pemetaan pola).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUpdate Learning\u003c/strong\u003e: Ubah narasi \"gue malu\" menjadi \"gue sedang melatih otot ekspresi\".\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"shame-based-performance-correction\"\u003eShame-Based Performance Correction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#shame-based-performance-correction\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJika muncul perasaan \"kalau saya salah, saya memalukan\", ubah mindset menjadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBukan\u003c/strong\u003e: \"Saya sedang diadili.\"\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTapi\u003c/strong\u003e: \"Saya sedang belajar bicara.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"practical-tips\"\u003ePractical Tips\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-tips\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSeparate Recognition from Admiration\u003c/strong\u003e: \"Saya boleh ingin kredit (diakui), tapi saya tidak perlu jadi pusat ruangan (dikagumi).\"\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAction over Identity\u003c/strong\u003e: Saat alarm \"saya paling tidak terlihat\" berbunyi, jangan debat identitas. Tanya: \u003cem\u003e\"Aksi 5 menit apa yang bisa saya lakukan sekarang?\"\u003c/em\u003e (Tulis ide, kirim poin, minta giliran bicara).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.vulnerable-narcissism-vs-growth\"\u003eVulnerable Narcissism vs Growth Patterns\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehandbook (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003egrowth (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eanxiety-management (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.psychology.agency-gap-pipeline\"\u003eAgency Gap and Public Contribution Pipeline\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron h
