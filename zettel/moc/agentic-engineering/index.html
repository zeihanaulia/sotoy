\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#moc-agentic-engineering\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKumpulan note dan zettel yang membahas agentic engineering, AI coding harness, cloud review agents, GitLab MR review bot, skill files, AGENTS.md/CLAUDE.md, dan verification-driven workflows.\u003c/p\u003e\n\u003ch2 id=\"core-literature\"\u003eCore literature\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-literature\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.how-i-use-ai-to-code\"\u003eHow I Use AI to Code — literature note\u003c/a\u003e — Chris Parsons article about AI coding harness, verification, and senior training.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"core-notes\"\u003eCore notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#core-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u0 -skill\"\u003eAwesome Skills Code Review Skill\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.getsentry-skills\"\u003eGetsentry Skills\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.semgrep-skills\"\u003eSemgrep Skills\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.gohypergiant-agent-skills\"\u003eGohypergiant Agent Skills\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.microsoft-skills-code-review-prompt\"\u003eMicrosoft Skills Code Review Prompt\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.martin-fowler-harness-engineering\"\u003eMartin Fowler - Harness Engineering for Coding Agent Users\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.google-small-cls\"\u003eGoogle Small CLs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.karpathy-keep-ai-on-the-leash\"\u003eKarpathy: Keep AI on the Leash\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377281\"\u003eAI coding succeeds because verification replaces model certainty\u003c/a\u003e — verification replaces model certainty\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377282\"\u003eSoftware is good AI input because it is verifiable\u003c/a\u003e — software is good AI input because it is verifiable\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377283\"\u003eAgent CLI outperforms IDE assistants for repo-scale AI workflows\u003c/a\u003e — agent CLI outperforms IDE assistants for repo-scale AI workflows\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377284\"\u003eSenior engineers should train harnesses, not only review diffs\u003c/a\u003e — senior engineers should train harnesses, not only review diffs\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377285\"\u003eHarness matters more than prompt in AI coding workflows\u003c/a\u003e — harness matters more than prompt in AI coding workflows\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377286\"\u003ePermanent repo instructions like AGENTS.md preserve agent behavior\u003c/a\u003e — permanent repo instructions like AGENTS.md preserve agent behavior\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377287\"\u003eDomain-specific skill files turn guidance into reusable rules\u003c/a\u003e — domain-specific skill files turn guidance into reusable rules\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377288\"\u003ePortable markdown vaults make agent knowledge durable\u003c/a\u003e — portable markdown vaults make agent knowledge durable\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377289\"\u003eVerification speed is the bottleneck in AI coding\u003c/a\u003e — verification speed is the bottleneck in AI coding\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377290\"\u003eProblem-first specs outperform solution-detail specs for AI agents\u003c/a\u003e — problem-first specs outperform solution-detail specs for AI agents\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377291\"\u003eEffective agent context is a sweet spot, not maximum context\u003c/a\u003e — effective agent context is a sweet spot, not maximum context\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778001021442\"\u003eAgentic engineering differs from vibe coding\u003c/a\u003e — agentic engineering differs from vibe coding\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377292\"\u003eFailure mode: vague AI output plus weak guardrails creates rework\u003c/a\u003e — vague AI output plus weak guardrails creates rework\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100800\"\u003eTrust threshold shifts AI workflow from assistant to production\u003c/a\u003e — trust threshold shifts AI workflow from assistant to production\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100900\"\u003eVibe coding is exploration flow, not quality discipline\u003c/a\u003e — vibe coding is exploration flow, not quality discipline\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101000\"\u003eContext window is temporary source code for LLMs\u003c/a\u003e — context window is temporary source code for LLMs\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101100\"\u003eAgent instructions replace deterministic scripting in variable environments\u003c/a\u003e — agent instructions replace deterministic scripting in variable environments\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101200\"\u003eLargest AI opportunities are new work formats, not faster old workflows\u003c/a\u003e — largest AI opportunities are new work formats, not faster old workflows\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101300\"\u003eFuture agentic systems may be AI-hosted with classical tools as co-processors\u003c/a\u003e — future agentic systems may be AI-hosted with classical tools as co-processors\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101400\"\u003eSpecification fuels classical software; verification fuels agentic AI\u003c/a\u003e — specification fuels classical software; verification fuels agentic AI\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101500\"\u003eLLM capability is a jagged map, not a smooth curve\u003c/a\u003e — LLM capability is a jagged map, not a smooth curve\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101600\"\u003eLLM can be genius at code but dumb at simple common-sense reasoning\u003c/a\u003e — LLM can be genius at code but dumb at simple common-sense reasoning\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101700\"\u003eHuman-in-the-loop is a response to jagged AI, not nostalgia\u003c/a\u003e — human-in-the-loop is a response to jagged AI, not nostalgia\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101800\"\u003eAI moat can be a domain-specific verifier and RL environment\u003c/a\u003e — AI moat can be a domain-specific verifier and RL environment\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101900\"\u003eAutomation frontier is defined by evaluator cost, not just model capability\u003c/a\u003e — automation frontier is defined by evaluator cost, not just model capability\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102000\"\u003eAI may speed delivery, but engineering responsibility stays with humans\u003c/a\u003e — AI may speed delivery, but engineering responsibility stays with humans\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102600\"\u003eAgent-native infrastructure needs agent-legible docs, APIs, and actuators\u003c/a\u003e — agent-native infrastructure needs agent-legible docs, APIs, and actuators\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102700\"\u003eAgent can become social-operational representation for people and organizations\u003c/a\u003e — agent can become social-operational representation for people and organizations\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102800\"\u003eUnderstanding is the last bottleneck in agentic systems\u003c/a\u003e — understanding is the last bottleneck in agentic systems\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"notes-on-relations\"\u003eNotes on relations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#notes-on-relations\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe cluster is about making AI code review and code generation work through harness, verification, and reusable skill files.\u003c/li\u003e\n\u003cli\u003eIt connects Chris Parsons' article to practical hands-on GitLab review agent design and cloud-agent orchestration.\u003c/li\u003e\n\u003cli\u003eIt also surfaces the difference between prompt engineering and harness engineering.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #a03623;\" href=\"/sotoy/notes/tags.zettel\"\u003ezettel\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #edc8ff;\" href=\"/sotoy/notes/tags.moc\"\u003emoc\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecloud-agent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eharness (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377281\"\u003eAI coding succeeds because verification replaces model certainty\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377282\"\u003eSoftware is good AI input because it is verifiable\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377283\"\u003eAgent CLI outperforms IDE assistants for repo-scale AI workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377284\"\u003eSenior engineers should train harnesses, not only review diffs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377285\"\u003eHarness matters more than prompt in AI coding workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377286\"\u003ePermanent repo instructions like AGENTS.md preserve agent behavior\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377287\"\u003eDomain-specific skill files turn guidance into reusable rules\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377288\"\u003ePortable markdown vaults make agent knowledge durable\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377289\"\u003eVerification speed is the bottleneck in AI coding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377290\"\u003eProblem-first specs outperform solution-detail specs for AI agents\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377291\"\u003eEffective agent context is a sweet spot, not maximum context\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778000377292\"\u003eFailure mode: vague AI output plus weak guardrails creates rework\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778001021442\"\u003eAgentic engineering differs from vibe coding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1780426406287\"\u003eStateful agent memory perlu workspace-peer-session-observation\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100800\"\u003eTrust threshold shifts AI workflow from assistant to production\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507100900\"\u003eVibe coding is exploration flow, not quality discipline\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101000\"\u003eContext window is temporary source code for LLMs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101100\"\u003eAgent instructions replace deterministic scripting in variable environments\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101200\"\u003eLargest AI opportunities are new work formats, not faster old workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101300\"\u003eFuture agentic systems may be AI-hosted with classical tools as co-processors\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101400\"\u003eSpecification fuels classical software; verification fuels agentic AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101600\"\u003eLLM can be genius at code but dumb at simple common-sense reasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101700\"\u003eHuman-in-the-loop is a response to jagged AI, not nostalgia\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101800\"\u003eAI moat can be a domain-specific verifier and RL environment\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101900\"\u003eAutomation frontier is defined by evaluator cost, not just model capability\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102000\"\u003eAI may speed delivery, but engineering responsibility stays with humans\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102600\"\u003eAgent-native infrastructure needs agent-legible docs, APIs, and actuators\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102700\"\u003eAgent can become social-operational representation for people and organizations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507102800\"\u003eUnderstanding is the last bottleneck in agentic systems\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.gitlab-mr-review-agent-coolify\"\u003eGitLab MR Review Agent di Coolify\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.self-hosted-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u
