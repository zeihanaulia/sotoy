hierarchical-memory--virtual-context-management":{"type":"header","text":"4. Hierarchical memory / virtual context management","value":"4-hierarchical-memory--virtual-context-management","line":86,"column":0,"depth":3},"5-policy-learned-memory-management":{"type":"header","text":"5. Policy-learned memory management","value":"5-policy-learned-memory-management","line":93,"column":0,"depth":3},"evaluasi-memory-agent-menurut-gue":{"type":"header","text":"Evaluasi memory agent menurut gue","value":"evaluasi-memory-agent-menurut-gue","line":104,"column":0,"depth":2},"aplikasi-yang-gue-lihat-relevan":{"type":"header","text":"Aplikasi yang gue lihat relevan","value":"aplikasi-yang-gue-lihat-relevan","line":122,"column":0,"depth":2},"engineering-reality-yang-sering-kelewat":{"type":"header","text":"Engineering reality yang sering kelewat","value":"engineering-reality-yang-sering-kelewat","line":130,"column":0,"depth":2},"write-path":{"type":"header","text":"Write path","value":"write-path","line":133,"column":0,"depth":3},"read-path":{"type":"header","text":"Read path","value":"read-path","line":151,"column":0,"depth":3},"staleness-contradiction-drift":{"type":"header","text":"Staleness, contradiction, drift","value":"staleness-contradiction-drift","line":158,"column":0,"depth":3},"latency--cost":{"type":"header","text":"Latency \u0026 cost","value":"latency--cost","line":165,"column":0,"depth":3},"privacy--compliance":{"type":"header","text":"Privacy \u0026 compliance","value":"privacy--compliance","line":169,"column":0,"depth":3},"observability--debugging":{"type":"header","text":"Observability \u0026 debugging","value":"observability--debugging","line":174,"column":0,"depth":3},"pattern-arsitektur-yang-gue-ingat":{"type":"header","text":"Pattern arsitektur yang gue ingat","value":"pattern-arsitektur-yang-gue-ingat","line":183,"column":0,"depth":2},"open-challenge-yang-gue-garis-bawahi":{"type":"header","text":"Open challenge yang gue garis bawahi","value":"open-challenge-yang-gue-garis-bawahi","line":190,"column":0,"depth":2},"takeaway-gue":{"type":"header","text":"Takeaway gue","value":"takeaway-gue","line":199,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"memory-for-autonomous-llm-agents-mechanisms-evaluation-and-emerging-frontiers\"\u003eMemory for Autonomous LLM Agents: Mechanisms, Evaluation, and Emerging Frontiers\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#memory-for-autonomous-llm-agents-mechanisms-evaluation-and-emerging-frontiers\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-yang-gue-tarik\"\u003eInti yang gue tarik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-yang-gue-tarik\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling nyantol buat gue dari paper ini adalah: memory agent bukan cuma soal chat history. Model bisa punya context panjang, tapi kalau dia nggak punya mekanisme baca/tulis memory yang jelas, dia cuma ngulang-ngulang apa yang lagi ada di prompt.\u003c/p\u003e\n\u003cp\u003eGue sekarang baca paper ini sebagai peta arsitektur: ada input sekarang, ada read path buat ambil memory relevan, ada action, lalu ada write path buat update memory. Kalau lo cuma pake long context window, itu cuma cache besar, bukan memory.\u003c/p\u003e\n\u003ch2 id=\"loop-memory-yang-gue-abadikan\"\u003eLoop memory yang gue abadikan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#loop-memory-yang-gue-abadikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue lihat ulang, loop-nya begini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAgent lihat input saat ini.\u003c/li\u003e\n\u003cli\u003eAgent decide apakah perlu retrieve memory.\u003c/li\u003e\n\u003cli\u003eAgent ambil action.\u003c/li\u003e\n\u003cli\u003eAgent mendapat observasi/feedback.\u003c/li\u003e\n\u003cli\u003eAgent update memory dari pengalaman itu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: memory agent dipengaruhi oleh input sekarang, hasil retrieval, dan goal aktif. Lalu memory itu harus diperbarui berdasarkan pengalaman, bukan cuma disalin begitu saja.\u003c/p\u003e\n\u003ch2 id=\"taxonomy-yang-gue-pakai\"\u003eTaxonomy yang gue pakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#taxonomy-yang-gue-pakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini ngelompokkan memory dalam tiga dimensi yang gue rasa berguna banget.\u003c/p\u003e\n\u003ch3 id=\"temporal-scope\"\u003eTemporal scope\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#temporal-scope\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eWorking memory: apa yang lagi ada di context sekarang. Contoh: instruksi sistem, pesan terbaru, output tool, scratchpad.\u003c/li\u003e\n\u003cli\u003eEpisodic memory: kejadian konkret, misalnya \"user minta format tanggal DD/MM/YYYY\" atau \"tool X gagal dengan parameter Y\".\u003c/li\u003e\n\u003cli\u003eSemantic memory: generalisasi yang muncul dari banyak episode, misalnya \"user lebih suka format tanggal DD/MM/YYYY\".\u003c/li\u003e\n\u003cli\u003eProcedural memory: skill atau prosedur yang bisa dipakai ulang, bukan cuma fakta. Ini contoh paling jelas kalau agent bisa nyimpen kode atau template.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau cuma episodic, agent ingat kejadian, tapi belum tentu bisa tarik pola. Kalau cuma semantic, agent punya aturan umum tapi mungkin lupa bukti. Kalau ada procedural, agent bisa ulangin skill tanpa mulai dari nol.\u003c/p\u003e\n\u003ch3 id=\"representational-substrate\"\u003eRepresentational substrate\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#representational-substrate\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGue suka penjelasan ini karena dia nyodorin bahwa nggak semua memory bisa disimpan dengan cara sama.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eContext-resident text: letakkan langsung di prompt sebagai ringkasan atau catatan.\u003c/li\u003e\n\u003cli\u003eVector-indexed store: embed memory dan simpan di vector DB.\u003c/li\u003e\n\u003cli\u003eStructured store: SQL, key-value, knowledge graph untuk query presisi.\u003c/li\u003e\n\u003cli\u003eExecutable repository: repo kode, tool definitions, plan template untuk procedural memory.\u003c/li\u003e\n\u003cli\u003eHybrid store: kombinasi beberapa jenis. Ini yang paling realistis buat production.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"control-policy\"\u003eControl policy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#control-policy\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau paper kuat di sini, karena memory bukan cuma storage, tapi decision.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHeuristic control: aturan manual, gampang debug tapi nggak adaptif.\u003c/li\u003e\n\u003cli\u003ePrompted self-control: LLM sendiri pilih kapan pakai memory tool.\u003c/li\u003e\n\u003cli\u003eLearned control: memory operation jadi part dari policy agent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue setuju: agent harus bisa memutuskan kapan menyimpan, kapan retrieve, kapan ringkas, kapan buang.\u003c/p\u003e\n\u003ch2 id=\"mekanisme-memory-yang-gue-catat\"\u003eMekanisme memory yang gue catat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mekanisme-memory-yang-gue-catat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper bagi mekanisme menjadi lima keluarga besar.\u003c/p\u003e\n\u003ch3 id=\"1-context-resident-memory--compression\"\u003e1. Context-resident memory + compression\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-context-resident-memory--compression\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePaling sederhana, tapi juga paling rentan.\nKalau riwayat terus diringkas, detail penting bisa hilang. Ada istilah summarization drift: setiap kali summary diringkas lagi, detail makin fade.\u003c/p\u003e\n\u003cp\u003eLong context juga bukan panacea: ada attentional dilution. Kalau prompt terlalu panjang, model sulit fokus ke fakta penting di tengah.\u003c/p\u003e\n\u003ch3 id=\"2-retrieval-augmented-memory-stores\"\u003e2. Retrieval-augmented memory stores\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-retrieval-augmented-memory-stores\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni mirip RAG, tapi isinya bukan dokumen statis. Isinya log interaksi agent, tool logs, feedback, plan, observasi.\u003c/p\u003e\n\u003cp\u003eTantangannya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGranularity indexing: kalau terlalu kecil, konteks hilang; kalau terlalu besar, noise ikut masuk.\u003c/li\u003e\n\u003cli\u003eQuery formulation: user bilang \"Kenapa itu crash?\" nggak selalu jadi query retrieval yang bagus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi agent perlu query rewriting, metadata filter, reranker, dan kadang decide: perlu retrieve atau nggak.\u003c/p\u003e\n\u003ch3 id=\"3-reflective--self-improving-memory\"\u003e3. Reflective / self-improving memory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-reflective--self-improving-memory\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent bikin refleksi setelah gagal atau selesai task, lalu pakai refleksi itu.\nIni keren karena memungkinkan learning tanpa fine-tuning.\u003c/p\u003e\n\u003cp\u003eTapi ada jebakannya: self-reinforcing error. Kalau refleksi keliru, agent bisa percaya pada kesimpulan yang salah.\nMakanya refleksi harus grounded ke bukti episodic, bukan sekadar feeling.\u003c/p\u003e\n\u003ch3 id=\"4-hierarchical-memory--virtual-context-management\"\u003e4. Hierarchical memory / virtual context management\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-hierarchical-memory--virtual-context-management\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAnaloginya OS memory: RAM, disk, archive.\u003c/p\u003e\n\u003cp\u003eMemGPT mencoba bikin agent yang kayak punya virtual memory. Context seperti RAM, recall storage seperti disk, archive seperti cold storage.\u003c/p\u003e\n\u003cp\u003eKelemahan utamanya bukan storage-nya, tapi orchestration. Kalau agent salah masukin memory ke context, token habis. Kalau agent nggak tahu harus retrieve dari archive, informasi ada tapi nggak kepake.\u003c/p\u003e\n\u003ch3 id=\"5-policy-learned-memory-management\"\u003e5. Policy-learned memory management\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-policy-learned-memory-management\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni frontier: store/retrieve/update/summarize/discard jadi action yang dilatih.\nContoh: AgeMem pakai RL.\u003c/p\u003e\n\u003cp\u003ePros:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebisa nemu strategi yang nggak obvious.\nCons:\u003c/li\u003e\n\u003cli\u003emahal,\u003c/li\u003e\n\u003cli\u003esusah di-interpret,\u003c/li\u003e\n\u003cli\u003eforgetting yang salah bisa ngilangin info safety-critical.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"evaluasi-memory-agent-menurut-gue\"\u003eEvaluasi memory agent menurut gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evaluasi-memory-agent-menurut-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper bener banget nggak puas sama metrik retrieval klasik.\nPrecision@k atau nDCG cuma jawab \"apakah dokumen yang benar diambil?\". Sementara yang penting adalah: apakah memory bikin agent lebih baik dalam task.\u003c/p\u003e\n\u003cp\u003eGue catat empat layer evaluasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTask effectiveness: success rate, correctness, completion.\u003c/li\u003e\n\u003cli\u003eMemory quality: retrieval precision/recall, contradiction, staleness, coverage.\u003c/li\u003e\n\u003cli\u003eEfficiency: latency, token overhead, retrieval calls, storage growth.\u003c/li\u003e\n\u003cli\u003eGovernance: privacy leakage, deletion compliance, access scope.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBenchmark yang disebut:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLoCoMo: long-term convo lintas sesi.\u003c/li\u003e\n\u003cli\u003eMemBench: factual vs reflective memory.\u003c/li\u003e\n\u003cli\u003eMemoryAgentBench: retrieval, test-time learning, long-range understanding, forgetting.\u003c/li\u003e\n\u003cli\u003eMemoryArena: agentic tasks di mana keputusan sekarang bergantung sesi lalu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: recall itu cuma \"gue nemu informasi lama\". Agentic memory itu \"gue nemu informasi lama, nilai relevansinya, lalu pakai buat action yang lebih baik.\" \u003c/p\u003e\n\u003ch2 id=\"aplikasi-yang-gue-lihat-relevan\"\u003eAplikasi yang gue lihat relevan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#aplikasi-yang-gue-lihat-relevan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePersonal assistant: preferensi user, kebiasaan, batas privasi.\u003c/li\u003e\n\u003cli\u003eSoftware engineering agent: keputusan arsitektur, bug history, API quirks, deployment constraint.\u003c/li\u003e\n\u003cli\u003eOpen-world game agent: skill reuse dan executable procedure.\u003c/li\u003e\n\u003cli\u003eScientific reasoning: hipotesis, eksperimen, evidence, confidence.\u003c/li\u003e\n\u003cli\u003eMulti-agent collaboration: governance shared vs private memory.\u003c/li\u003e\n\u003cli\u003eTool/API orchestration: schema, parameter yang berhasil, urutan call, versi API.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"engineering-reality-yang-sering-kelewat\"\u003eEngineering reality yang sering kelewat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#engineering-reality-yang-sering-kelewat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini paling tajam di bagian ini.\u003c/p\u003e\n\u003ch3 id=\"write-path\"\u003eWrite path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#write-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGue suka bahwa paper nggak cuma bilang \"taruh aja semua\".\nSistem idealnya punya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efiltering,\u003c/li\u003e\n\u003cli\u003ecanonicalization,\u003c/li\u003e\n\u003cli\u003ededuplication,\u003c/li\u003e\n\u003cli\u003epriority scoring,\u003c/li\u003e\n\u003cli\u003emetadata tagging.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMemory yang bagus bukan cuma \"user suka Go\". Harus jadi sesuatu seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esubject: user preference,\u003c/li\u003e\n\u003cli\u003econtent: user prefers Go for backend hands-on exercises,\u003c/li\u003e\n\u003cli\u003esource: direct user statement,\u003c/li\u003e\n\u003cli\u003etimestamp,\u003c/li\u003e\n\u003cli\u003econfidence,\u003c/li\u003e\n\u003cli\u003escope,\u003c/li\u003e\n\u003cli\u003eexpiry.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"read-path\"\u003eRead path\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#read-path\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eNggak semua request butuh retrieval.\nKalau user cuma minta \"jelasin ulang\", mungkin context sekarang sudah cukup.\nKalau user bilang \"lanjut dari minggu lalu\", retrieval penting.\u003c/p\u003e\n\u003cp\u003eJadi read path perlu gating, metadata filter, vector search/BM25, reranker, dan token budget.\u003c/p\u003e\n\u003ch3 id=\"staleness-contradiction-drift\"\u003eStaleness, contradiction, drift\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#staleness-contradiction-drift\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMemory lama bisa kedaluwarsa atau bentrok dengan fakta baru.\nUser statement lebih kuat dari inferensi agent, dan info terbaru biasanya lebih relevan.\nTapi ada fakta permanen juga.\u003c/p\u003e\n\u003cp\u003ePaper menekankan source attribution dan temporal versioning.\u003c/p\u003e\n\u003ch3 id=\"latency--cost\"\u003eLatency \u0026#x26; cost\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#latency--cost\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRetrieval bikin latency naik, reranking tambah latency, memory injection tambah token.\nJadi lebih baik ambil sedikit info yang benar-benar relevan ketimbang brute-force context panjang.\u003c/p\u003e\n\u003ch3 id=\"privacy--compliance\"\u003ePrivacy \u0026#x26; compliance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#privacy--compliance\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMemory lintas sesi bisa jadi gudang PII.\nButuh deletion, scoped access, retention policy, encryption, audit.\nKalau informasi sudah ketanam ke model weights, delete-nya jauh lebih rumit.\u003c/p\u003e\n\u003ch3 id=\"observability--debugging\"\u003eObservability \u0026#x26; debugging\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#observability--debugging\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau agent salah, bisa jadi karena:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enggak nulis memory,\u003c/li\u003e\n\u003cli\u003enulis tapi nggak retrieve,\u003c/li\u003e\n\u003cli\u003eretrieve tapi nggak dipakai,\u003c/li\u003e\n\u003cli\u003ememory stale.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaper rekomendasi logging semua memory op dan bahkan pakai \"memory diff\" untuk lihat perubahan antar turn.\u003c/p\u003e\n\u003ch2 id=\"pattern-arsitektur-yang-gue-ingat\"\u003ePattern arsitektur yang gue ingat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pattern-arsitektur-yang-gue-ingat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePattern A: monolithic context. Simpel, cocok untuk prototipe, tapi rapuh jangka panjang.\u003c/li\u003e\n\u003cli\u003ePattern B: context + retrieval store. Praktis dan realistis untuk production sekarang.\u003c/li\u003e\n\u003cli\u003ePattern C: tiered memory + learned control. Paling kuat, paling kompleks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRekomendasi praktisnya: mulai dari Pattern B, instrumentasi dulu, baru naik ke Pattern C kalau memang perlu.\u003c/p\u003e\n\u003ch2 id=\"open-challenge-yang-gue-garis-bawahi\"\u003eOpen challenge yang gue garis bawahi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#open-challenge-yang-gue-garis-bawahi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKapan episodic memory berubah jadi semantic memory?\u003c/li\u003e\n\u003cli\u003eRelevansi retrieval harusnya lebih sebab-akibat, bukan cuma similar text.\u003c/li\u003e\n\u003cli\u003eRefleksi harus punya evidence.\u003c/li\u003e\n\u003cli\u003eForgetting itu fitur, tapi susah.\u003c/li\u003e\n\u003cli\u003eAgent multimodal butuh memory visual/spatial/sensor.\u003c/li\u003e\n\u003cli\u003eMulti-agent butuh governance dan conflict resolution.\u003c/li\u003e\n\u003cli\u003eIdealnya ada model khusus untuk memory management, bukan hanya jawaban teks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway-gue\"\u003eTakeaway gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003edirangkum:\nLLM agent yang serius nggak bisa cuma andalkan prompt panjang. Minimal harus jawab lima pertanyaan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapa yang disimpan,\u003c/li\u003e\n\u003cli\u003edalam bentuk apa,\u003c/li\u003e\n\u003cli\u003ekapan disimpan,\u003c/li\u003e\n\u003cli\u003ekapan dan bagaimana diambil,\u003c/li\u003e\n\u003cli\u003ekapan diperbarui atau dilupakan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau nggak, agent bisa kelihatan pinter di demo singkat, tapi rapuh di deployment.\u003c/p\u003e\n\u003chr\u003e\n\u003cp\u003eOriginal paper: \u003ca href=\"https://arxiv.org/abs/2603.07670\"\u003ehttps://arxiv.org/abs/2603.07670\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ememory (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","
