ebih jelas dua lapis state yang sering keblurr di agentic workflow: backlog/ticket dan pipeline agent.\u003c/p\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArti \u003cstrong\u003estates\u003c/strong\u003e di sini adalah dua lapis state:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003estate backlog/ticket\u003c/strong\u003e: Epic → Task → To Do → In Progress → Done / On Hold\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003estate pipeline agent\u003c/strong\u003e: Intake → Canonicalize → Groom → Execute → Verify → Publish → Reconcile → Audit\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eSimulasi ini menunjukkan bahwa agent tidak langsung membaca task lalu ngoding. Agent lebih dulu mengubah niat manusia menjadi state yang bisa dikontrol: requirement jadi backlog item, backlog item jadi fix plan, fix plan jadi diff, diff jadi evidence, evidence jadi status Jira.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"skenario\"\u003eSkenario\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#skenario\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"epic\"\u003eEpic\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#epic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eEPIC-100\nTitle: Improve Account Security\nGoal: memperkuat keamanan akun user\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"task\"\u003eTask\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#task\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eSEC-123\nTitle: Add rate limiting to login endpoint\nStatus: To Do\nDescription: See Confluence page: Account Security Hardening v2\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"confluence-detail\"\u003eConfluence detail\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#confluence-detail\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eConfluence: Account Security Hardening v2\n\nRequirement:\n- Login endpoint harus punya rate limit 5 percobaan gagal per 10 menit per user/email.\n- Jika limit tercapai, API mengembalikan HTTP 429.\n- Event harus dicatat ke security log.\n- Existing successful login flow tidak boleh berubah.\n\nAcceptance Criteria:\n1. Failed login attempt dihitung per email normalized.\n2. Setelah 5 failed attempt dalam 10 menit, request berikutnya kena 429.\n3. Counter reset setelah successful login.\n4. Unit test mencakup normal login, failed login, lockout, dan reset.\n5. Tidak boleh menyimpan password/token di log.\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"state-0--epic-sebagai-konteks-besar\"\u003eState 0 — Epic sebagai konteks besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#state-0--epic-sebagai-konteks-besar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi awal, Epic hanya memberikan arah besar.\u003c/p\u003e\n\u003cp\u003eAgent belum boleh ngoding dari Epic langsung karena Epic terlalu luas dan ambigu.\u003c/p\u003e\n\u003ch3 id=\"tindakan-agent\"\u003eTindakan agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tindakan-agent\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eBaca Epic\n↓\nCari linked tasks\n↓\nCari linked Confluence page\n↓\nKlasifikasikan sebagai security hardening work\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"output-sementara\"\u003eOutput sementara\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#output-sementara\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eEpic detected:\n- Domain: account security\n- Scope: login flow\n- Linked task: SEC-123\n- Source doc: Confluence Account Security Hardening v2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: Epic memberi arah, bukan instruksi eksekusi.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"state-1--intake-membaca-task-dan-confluence\"\u003eState 1 — Intake: membaca task dan Confluence\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#state-1--intake-membaca-task-dan-confluence\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent mengambil detail dari Jira dan Confluence, lalu mengekstrak requirement ke field standar.\u003c/p\u003e\n\u003ch3 id=\"tindakan-agent-1\"\u003eTindakan agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tindakan-agent-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eSEC-123\n↓\nConfluence page\n↓\nStructured requirement extraction\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"hasil-intake\"\u003eHasil intake\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hasil-intake\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"source\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"confluence:Account Security Hardening v2\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"jira_key\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SEC-123\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"epic\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"EPIC-100\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"title\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Add rate limiting to login endpoint\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"requirement\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Limit failed login attempts to 5 per 10 minutes per normalized email\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"acceptance_criteria\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Failed login attempt counted per normalized email\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"6th failed attempt within 10 minutes returns HTTP 429\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Successful login resets failed-attempt counter\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Security event is logged without secrets\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token string\"\u003e\"Unit tests cover success, failure, lockout, reset\"\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"tags\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"security\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"auth\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"rate-limit\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"backend\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"owner\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"backend\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"priority\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"high\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"gate-intake\"\u003eGate intake\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#gate-intake\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent hanya boleh lanjut kalau:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAda Jira key\u003c/li\u003e\n\u003cli\u003eAda source reference\u003c/li\u003e\n\u003cli\u003eAda requirement jelas\u003c/li\u003e\n\u003cli\u003eAda acceptance criteria\u003c/li\u003e\n\u003cli\u003eAda owner\u003c/li\u003e\n\u003cli\u003eAda priority\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau Confluence kosong atau link mati, status masuk \u003ccode\u003eOn Hold / Needs Clarification\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: agent baru boleh bekerja kalau requirement sudah bisa diuji.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"state-2--canonicalization-cek-duplicate-dan-kecocokan\"\u003eState 2 — Canonicalization: cek duplicate dan kecocokan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#state-2--canonicalization-cek-duplicate-dan-kecocokan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent mengecek apakah task ini benar-benar baru atau sudah ada item serupa.\u003c/p\u003e\n\u003ch3 id=\"tindakan-agent-2\"\u003eTindakan agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tindakan-agent-2\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ebandingkan dengan canonical backlog\u003c/li\u003e\n\u003cli\u003ehitung similarity\u003c/li\u003e\n\u003cli\u003etentukan tier confidence\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"simulasi\"\u003eSimulasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#simulasi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eSEC-123 vs SEC-089 = 0.61\nSEC-123 vs SEC-101 = 0.55\nSEC-123 vs existing exact key = 1.00\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eConfidence tinggi karena Jira key jelas dan detail cocok.\u003c/p\u003e\n\u003ch3 id=\"output\"\u003eOutput\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#output\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"canonical_id\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"AUTO-SEC-LOGIN-RATE-LIMIT-001\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"jira_key\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SEC-123\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"confidence\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.91\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"decision\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"eligible_for_autonomous_grooming\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"related_items\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"SEC-089\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SEC-101\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"source_of_truth\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"canonical_backlog\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: duplicate dan overlap harus dibereskan sebelum agent menulis kode.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"state-3--grooming-requirement-jadi-fix-plan\"\u003eState 3 — Grooming: requirement jadi fix plan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#state-3--grooming-requirement-jadi-fix-plan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent tidak langsung memperbaiki kode. Dia membuat rencana kerja yang actionable.\u003c/p\u003e\n\u003ch3 id=\"tindakan-agent-3\"\u003eTindakan agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tindakan-agent-3\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eidentifikasi file relevan\u003c/li\u003e\n\u003cli\u003ebuat fix_strategy\u003c/li\u003e\n\u003cli\u003ebuat verification_plan\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"contoh-fix-plan\"\u003eContoh fix plan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-fix-plan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"ticket\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SEC-123\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"priority_score\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e94\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"priority_type\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"security_hardening\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"area\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"backend/auth\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"relevant_paths\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation erty\"\u003e\"verification\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"product\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"pass\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token property\"\u003e\"security\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"pass\"\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"completed_at\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"2026-05-12T...\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"fail-1\"\u003eFail\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#fail-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"canonical_id\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"AUTO-SEC-LOGIN-RATE-LIMIT-001\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"jira_key\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SEC-123\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"state\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"to_do\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"last_run_id\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"RUN-2026-05-12-001\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"failure_reason\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"reset counter test failed\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"next_action\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"regroom\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: state eksternal dan internal harus sinkron.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"state-9--audit-trail-evidence-chain-lengkap\"\u003eState 9 — Audit Trail: evidence chain lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#state-9--audit-trail-evidence-chain-lengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eEvidence folder per run menyimpan semua keputusan.\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eevidence/\n  RUN-2026-05-12-001/\n    input.json\n    source_refs.json\n    confluence_snapshot.md\n    jira_before.json\n    fix_plan.json\n    diff.patch\n    test_output.log\n    security_verifier.json\n    jira_receipt.json\n    final_status.json\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"jawaban-audit\"\u003eJawaban audit\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#jawaban-audit\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJika ditanya, \"Kenapa SEC-123 ditutup?\" jawaban harus berbasis evidence chain, bukan klaim model.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: trust datang dari evidence chain, bukan dari klaim model.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"batas-autonomy-yang-realistis\"\u003eBatas autonomy yang realistis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#batas-autonomy-yang-realistis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent hanya boleh lanjut jika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erequirement jelas\u003c/li\u003e\n\u003cli\u003eacceptance criteria testable\u003c/li\u003e\n\u003cli\u003efix plan sudah dikenal\u003c/li\u003e\n\u003cli\u003ediff size masih dalam batas\u003c/li\u003e\n\u003cli\u003everifier dapat membuktikan hasil\u003c/li\u003e\n\u003cli\u003etidak butuh keputusan arsitektural baru\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJika salah satu tidak terpenuhi, agent harus berhenti dan minta manusia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eOn Hold\u003c/code\u003e jika requirement tidak testable\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHuman review\u003c/code\u003e jika arsitektural judgment diperlukan\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"ringkasan-state-lengkap\"\u003eRingkasan state lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-state-lengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e[EPIC-100]\nImprove Account Security\n    ↓\n[SEC-123 - To Do]\nTask linked to Confluence requirement\n    ↓\n[S1 Intake]\nAgent baca Jira + Confluence\nExtract requirement + acceptance criteria\n    ↓\n[S2 Canonicalize]\nCek duplicate, mapping, confidence score\nconfidence 0.91\n    ↓\n[S3 Groom]\nBuat fix_plan + relevant_paths + verification_plan\nMasuk fix_queue\n    ↓\n[S4 Claim]\nJira: To Do → In Progress\nAgent worker dapat lock\n    ↓\n[S5 Execute]\nAgent apply patch di isolated worktree\nGenerate diff + evidence\n    ↓\n[S6 Verify]\nVerifier terpisah jalan:\ntests + lint + security + mutation check\n    ↓\n    ┌───────────────┬────────────────┐\n    │ PASS          │ FAIL           │\n    ↓               ↓\nJira: Done      Jira: To Do\nPublish result  Publish failure\nReconcile       Re-groom next cycle\n    ↓\n[S7 Audit]\nEvidence chain tersimpan\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling penting adalah transformasi ini:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003enarasi requirement → acceptance criteria → fix plan → diff → verifier result → Jira transition → audit evidence\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau salah satu rantai putus, sistem harus berhenti atau minta manusia. Di situlah bedanya workflow agentic yang aman dengan agent coding yang cuma agresif.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #ff9a8a;\" href=\"/sotoy/notes/tags.workflow\"\u003eworkflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ejira (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003econfluence (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebacklog (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find Mo
