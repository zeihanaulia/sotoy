g-language-sebagai-alat-berpikir","line":108,"column":0,"depth":2},"cognitive-debt-di-era-llm":{"type":"header","text":"Cognitive debt di era LLM","value":"cognitive-debt-di-era-llm","line":121,"column":0,"depth":2},"kenapa-codebase-yang-bagus-adalah-context-dan-harness-untuk-llm":{"type":"header","text":"Kenapa codebase yang bagus adalah context dan harness untuk LLM","value":"kenapa-codebase-yang-bagus-adalah-context-dan-harness-untuk-llm","line":131,"column":0,"depth":2},"hubungan-ke-artikel-lain":{"type":"header","text":"Hubungan ke artikel lain","value":"hubungan-ke-artikel-lain","line":146,"column":0,"depth":2},"pertanyaan-yang-gue-bawa-pulang":{"type":"header","text":"Pertanyaan yang gue bawa pulang","value":"pertanyaan-yang-gue-bawa-pulang","line":163,"column":0,"depth":2}},"children":[],"parent":"5oh5fgtw5iyb4mv5j72n02i","data":{}},"body":"\u003ch1 id=\"what-is-code--code-sebagai-vocabulary-dan-model-konsep\"\u003eWhat Is Code? — code sebagai vocabulary dan model konsep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#what-is-code--code-sebagai-vocabulary-dan-model-konsep\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"apa-yang-gue-tangkap-dari-what-is-code\"\u003eApa yang gue tangkap dari \"What Is Code?\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-tangkap-dari-what-is-code\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca artikel Unmesh Joshi di Martin Fowler: \u003ca href=\"https://martinfowler.com/articles/what-is-code.html\"\u003ehttps://martinfowler.com/articles/what-is-code.html\u003c/a\u003e. Dia ngajak gue mikir ulang apa makna code di era LLM.\u003c/p\u003e\n\u003cp\u003eUnmesh pakai definisi code dua lapis:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ecode sebagai instruksi mesin,\u003c/li\u003e\n\u003cli\u003ecode sebagai model konseptual domain.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"dua-aspek-utama-code\"\u003eDua aspek utama code\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dua-aspek-utama-code\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003ePertama, code sebagai instruksi mesin.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIni jawaban untuk \"mesin harus ngapain\". Code memberi tahu komputer apa yang harus dilakukan: menghitung, menyimpan data, memanggil API, mengubah status, mengirim response. Kalau instruksinya valid, program bisa jalan. Di era LLM, bagian ini makin dikomoditisasi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKedua, code sebagai model konseptual domain.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIni jawaban untuk \"sistem ini memahami dunia seperti apa\". Code tidak sekadar menyimpan logika. Dia juga membangun vocabulary dan boundary: \u003ccode\u003eCustomer\u003c/code\u003e, \u003ccode\u003eCart\u003c/code\u003e, \u003ccode\u003eOrder\u003c/code\u003e, \u003ccode\u003ePayment\u003c/code\u003e, \u003ccode\u003eShipment\u003c/code\u003e, \u003ccode\u003eRefund\u003c/code\u003e, \u003ccode\u003eInventory\u003c/code\u003e. Tidak sekadar nama bagus; setiap konsep membawa makna dan aturan lokal.\u003c/p\u003e\n\u003cp\u003eContoh konkret: \u003ccode\u003eCart\u003c/code\u003e bukan \u003ccode\u003eOrder\u003c/code\u003e, \u003ccode\u003ePaymentAuthorized\u003c/code\u003e bukan \u003ccode\u003ePaymentCaptured\u003c/code\u003e, \u003ccode\u003eShipment\u003c/code\u003e bukan \u003ccode\u003eDelivery\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eKalau kita cuma fokus ke lapis pertama, LLM sudah bisa bantu banyak. Syntax, boilerplate, endpoint, dan adapter bisa dihasilkan cepat. Tapi lapis kedua itulah yang paling menentukan apakah codebase masih bisa dipahami, dipelihara, dan dikembangkan.\u003c/p\u003e\n\u003ch2 id=\"kenapa-vocabulary-codebase-penting\"\u003eKenapa vocabulary codebase penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-vocabulary-codebase-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArtikel ini menekankan: codebase yang baik adalah representasi vocabulary tertentu.\u003c/p\u003e\n\u003cp\u003eVocabulary/domain language di sini bukan sekadar nama variabel enak dibaca. Ini adalah kumpulan istilah yang dipakai codebase untuk memodelkan domain.\u003c/p\u003e\n\u003cp\u003eKata seperti \u003ccode\u003eOrder\u003c/code\u003e, \u003ccode\u003eInvoice\u003c/code\u003e, \u003ccode\u003eSettlement\u003c/code\u003e, \u003ccode\u003eRefund\u003c/code\u003e, \u003ccode\u003eCatalog\u003c/code\u003e, \u003ccode\u003eSKU\u003c/code\u003e, \u003ccode\u003eCustomer\u003c/code\u003e, \u003ccode\u003eRepository\u003c/code\u003e, \u003ccode\u003eTransactionLog\u003c/code\u003e, \u003ccode\u003ePolicy\u003c/code\u003e, \u003ccode\u003eWorkflow\u003c/code\u003e membawa makna, aturan, boundary, dan ekspektasi perilaku.\u003c/p\u003e\n\u003cp\u003eVocabulary penting karena codebase bukan cuma kumpulan instruksi. Codebase adalah bahasa bersama.\u003c/p\u003e\n\u003cp\u003eKalau bahasanya jelas, manusia dan LLM bisa bekerja di atas model yang sama. Kalau bahasanya kacau, semua orang menebak — termasuk LLM.\u003c/p\u003e\n\u003cp\u003eContoh e-commerce yang nempel:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCart\u003c/code\u003e adalah niat membeli yang belum final.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOrder\u003c/code\u003e adalah komitmen pembelian.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eInvoice\u003c/code\u003e adalah dokumen/tagihan finansial.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau codebase pake semua itu sebagai \u003ccode\u003edata\u003c/code\u003e, \u003ccode\u003eitem\u003c/code\u003e, \u003ccode\u003erecord\u003c/code\u003e, atau \u003ccode\u003etransaction\u003c/code\u003e, domain-nya jadi kabur. Mesin mungkin tetap jalan, tapi manusia susah memahami apa yang sebenarnya terjadi.\u003c/p\u003e\n\u003cp\u003eVocabulary juga membuat makna domain jadi eksplisit.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ePaymentCaptured\u003c/code\u003e langsung memberitahu: uang sudah benar-benar ditangkap/settled.\n\u003ccode\u003ePaymentAuthorized\u003c/code\u003e memberitahu: uang belum tentu sudah masuk.\u003c/p\u003e\n\u003cp\u003eBandingkan dengan \u003ccode\u003epayment_status = \"success\"\u003c/code\u003e. \"Success\" itu apa? Authorized? Captured? Settled? Verified? Reconciled?\u003c/p\u003e\n\u003cp\u003eVocabulary juga menjaga boundary.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eCustomer\u003c/code\u003e di billing bisa berarti legal entity yang menerima invoice.\n\u003ccode\u003eCustomer\u003c/code\u003e di support bisa berarti orang yang membuka tiket.\n\u003ccode\u003eCustomer\u003c/code\u003e di e-commerce bisa berarti buyer account.\u003c/p\u003e\n\u003cp\u003eKalau semua dipaksa pakai satu model \u003ccode\u003eCustomer\u003c/code\u003e, codebase bisa jadi kacau. Domain language yang baik membantu kita sadar: ini harus dipisah bounded context-nya.\u003c/p\u003e\n\u003cp\u003eVocabulary menentukan kualitas abstraction. Contoh bagus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eRefundPolicy\u003c/code\u003e menunjukkan ada aturan refund yang bisa berubah dan diuji.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRefundRequest\u003c/code\u003e, \u003ccode\u003eRefundApproval\u003c/code\u003e, \u003ccode\u003eRefundSettlement\u003c/code\u003e menunjukkan lifecycle refund yang eksplisit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau hanya \u003ccode\u003eprocessRefund()\u003c/code\u003e, semua aturan bisa numpuk di satu tempat.\u003c/p\u003e\n\u003cp\u003eTapi hati-hati: terlalu banyak vocabulary palsu juga berbahaya. LLM kerap bikin istilah seperti \u003ccode\u003eManager\u003c/code\u003e, \u003ccode\u003eHandler\u003c/code\u003e, \u003ccode\u003eFactory\u003c/code\u003e, \u003ccode\u003eOrchestrator\u003c/code\u003e, \u003ccode\u003eCoordinator\u003c/code\u003e tanpa domain yang jelas. Kelihatan rapi, tapi maknanya kosong.\u003c/p\u003e\n\u003cp\u003eDi sinilah cognitive debt muncul: code punya banyak istilah, tapi tim tidak benar-benar paham artinya.\u003c/p\u003e\n\u003cp\u003eJadi vocabulary yang baik harus memenuhi dua syarat:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003emencerminkan domain nyata.\u003c/li\u003e\n\u003cli\u003edipahami bersama oleh tim.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau cuma terdengar keren tapi tidak dipahami, itu bukan domain language. Itu kabut.\u003c/p\u003e\n\u003cp\u003eContoh yang nempel di gue:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTransactionLog\u003c/code\u003e biasanya diasosiasikan dengan append-only, ordering, durability, replay.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eCache\u003c/code\u003e biasanya berarti data bisa stale dan harus diinvalidate.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRepository\u003c/code\u003e biasanya berarti abstraction terhadap persistence.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi vocabulary bukan kosmetik. Itu adalah medium diskusi antara manusia dan mesin.\u003c/p\u003e\n\u003ch2 id=\"bounded-context-dan-arti-lokal-kata\"\u003eBounded context dan arti lokal kata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bounded-context-dan-arti-lokal-kata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUnmesh kasih pelajaran bahwa satu kata bisa beda arti di konteks yang berbeda.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eCustomer\u003c/code\u003e di e-commerce beda dengan \u003ccode\u003eCustomer\u003c/code\u003e di CRM atau di support system. Karena itu bounded context penting: batasan di mana vocabulary tertentu valid.\u003c/p\u003e\n\u003cp\u003eKalau codebase tidak punya bounded context yang jelas, LLM akan mengandalkan asosiasi umum dari internet. Hasilnya bisa terlihat wajar, tapi tidak cocok dengan model lokal perusahaan.\u003c/p\u003e\n\u003ch2 id=\"programming-language-sebagai-alat-berpikir\"\u003eProgramming language sebagai alat berpikir\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#programming-language-sebagai-alat-berpikir\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArtikelnya juga nyanggah klaim \"natural language aja cukup\".\u003c/p\u003e\n\u003cp\u003eProgramming language bukan sekadar alat untuk merekam desain yang sudah jadi. Bahasa pemrograman ikut membentuk desain itu.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGo mendorong pola concurrency dan channel.\u003c/li\u003e\n\u003cli\u003eJava mendorong object model dan interface.\u003c/li\u003e\n\u003cli\u003eRust memaksa ownership dan boundary safety.\u003c/li\u003e\n\u003cli\u003eFP mendorong komposisi dan immutability.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi kalau kita cuma pakai LLM untuk generate code tanpa ikut berpikir lewat bahasa pemrograman, kita melewatkan proses discovery yang penting.\u003c/p\u003e\n\u003ch2 id=\"cognitive-debt-di-era-llm\"\u003eCognitive debt di era LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cognitive-debt-di-era-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni yang paling nyeremin.\u003c/p\u003e\n\u003cp\u003eUnmesh bilang code bisa compile dan tests bisa pass, tapi jika tim tidak paham model konseptual di belakang struktur itu, codebase menambah vocabulary tanpa shared understanding.\u003c/p\u003e\n\u003cp\u003eLLM bisa mempercepat pemasukan vocabulary baru: \u003ccode\u003eService\u003c/code\u003e, \u003ccode\u003eRepository\u003c/code\u003e, \u003ccode\u003eFactory\u003c/code\u003e, \u003ccode\u003eEventBus\u003c/code\u003e, \u003ccode\u003eCommandHandler\u003c/code\u003e, \u003ccode\u003eConsensusModule\u003c/code\u003e. Semua terdengar keren. Tapi apakah tim paham kenapa abstraction itu ada? Apakah namanya sesuai kebutuhan lokal? Apakah boundary-nya benar?\u003c/p\u003e\n\u003cp\u003eKalau tidak, hasilnya bukan technical debt biasa. Itu menjadi cognitive debt.\u003c/p\u003e\n\u003ch2 id=\"kenapa-codebase-yang-bagus-adalah-context-dan-harness-untuk-llm\"\u003eKenapa codebase yang bagus adalah context dan harness untuk LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-codebase-yang-bagus-adalah-context-dan-harness-untuk-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUnmesh menempatkan codebase sebagai konteks utama untuk LLM. Bukan hanya prompt, tetapi struktur code sendiri:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enama-nama yang konsisten,\u003c/li\u003e\n\u003cli\u003eabstraction yang jelas,\u003c/li\u003e\n\u003cli\u003etests yang mendefinisikan behavior,\u003c/li\u003e\n\u003cli\u003etypes yang membatasi kesalahan,\u003c/li\u003e\n\u003cli\u003einvariant yang eksplisit,\u003c/li\u003e\n\u003cli\u003eboundary yang bersih.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu adalah harness dan signal permanen buat LLM.\u003c/p\u003e\n\u003cp\u003eKalau codebase kacau, prompt apa pun cuma menambal sebentar.\u003c/p\u003e\n\u003ch2 id=\"hubungan-ke-artikel-lain\"\u003eHubungan ke artikel lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hubungan-ke-artikel-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArtikel ini nyambung ke apa yang gue baca sebelumnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.interrogatory-llm\"\u003eInterrogatory LLM: LLM sebagai pewawancara konteks\u003c/a\u003e — Fowler: LLM sebagai pewawancara konteks.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.harper-llm-codegen-workflow\"\u003eHarper Reed: LLM codegen workflow\u003c/a\u003e — Harper: konteks itu dijadikan spec, plan, dan eksekusi bertahap.\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.agentic-coding.is-a-trap (Private)\u003c/a\u003e — agentic coding bisa memicu cognitive debt kalau kita melewatkan proses berpikir sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDari ketiganya, gue nangkep rangkaian utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003egali konteks,\u003c/li\u003e\n\u003cli\u003ebentuk spec dan plan,\u003c/li\u003e\n\u003cli\u003eeksekusi incremental,\u003c/li\u003e\n\u003cli\u003ejaga vocabulary dan model konseptual.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau berhenti di \"kode jalan\", elo belum sampai ke inti engineering.\u003c/p\u003e\n\u003ch2 id=\"pertanyaan-yang-gue-bawa-pulang\"\u003ePertanyaan yang gue bawa pulang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-yang-gue-bawa-pulang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eApakah vocabulary baru yang LLM tambahkan di codebase benar-benar sesuai bounded context?\u003c/li\u003e\n\u003cli\u003eApakah tim paham model konseptual di balik abstraction itu?\u003c/li\u003e\n\u003cli\u003eApakah code ini memperjelas domain atau cuma menambah jargon?\u003c/li\u003e\n\u003cli\u003eApakah kita membuat codebase sebagai medium komunikasi, bukan sekadar container instruksi mesin?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evocabulary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecognitive-debt (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.ai.code-vocabulary-and-bounded-context\"\u003eDesign Code Vocabulary dan Bounded Context untuk AI-assisted Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUserTags":true,"enableHashTags":true,"workspaceVaultSyncMode":"noCommit","enableAutoFoldFrontmatter":false,"enableEditorDecorations":true,"maxPreviewsCached":10,"maxNoteLength":204800,"seeds":{"dendron.
