default":{"type":"header","text":"16. Verifikasi dan jangan pakai opsi berbahaya sebagai default","value":"16-verifikasi-dan-jangan-pakai-opsi-berbahaya-sebagai-default","line":299,"column":0,"depth":2},"17-global-vs-per-repoproject-config":{"type":"header","text":"17. Global vs per repo/project config","value":"17-global-vs-per-repoproject-config","line":326,"column":0,"depth":2},"18-kesimpulan-praktis":{"type":"header","text":"18. Kesimpulan praktis","value":"18-kesimpulan-praktis","line":394,"column":0,"depth":2},"13-inti-kepercayaan-yang-sehat":{"type":"header","text":"13. Inti kepercayaan yang sehat","value":"13-inti-kepercayaan-yang-sehat","line":406,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"codex-macos-sandboxing-dengan-seatbelt\"\u003eCodex macOS sandboxing dengan Seatbelt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#codex-macos-sandboxing-dengan-seatbelt\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ringkasan-utama\"\u003eRingkasan utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSandbox Codex lokal di macOS bukan container atau VM. Ia adalah permission boundary yang dijalankan oleh OS. Proses tetap jalan di mesin lokal, tapi aksesnya dikontrol oleh Seatbelt lewat \u003ccode\u003esandbox-exec\u003c/code\u003e dan sandbox profile.\u003c/p\u003e\n\u003ch2 id=\"1-proses-tetap-lokal-batasannya-yang-beda\"\u003e1. Proses tetap lokal, batasannya yang beda\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-proses-tetap-lokal-batasannya-yang-beda\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam eksperimen kita, Codex menjalankan command di mesin sendiri. Tidak ada mesin remote, tidak ada container Linux terpisah. Perbedaannya adalah command tersebut dibungkus dengan profile sandbox, lalu macOS Seatbelt mengecek setiap akses.\u003c/p\u003e\n\u003cp\u003eJadi alur dasarnya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCodex ingin menjalankan command.\u003c/li\u003e\n\u003cli\u003eCommand dijalankan melalui \u003ccode\u003esandbox-exec\u003c/code\u003e dengan profile tertentu.\u003c/li\u003e\n\u003cli\u003eSeatbelt memutuskan apakah akses diperbolehkan.\u003c/li\u003e\n\u003cli\u003eKalau tidak, muncul \u003ccode\u003eOperation not permitted\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArtinya sandbox lebih mirip pagar di sekitar proses, bukan ruang terpisah.\u003c/p\u003e\n\u003ch2 id=\"2-seatbelt-sebagai-layer-tambahan-di-atas-unix-permission\"\u003e2. Seatbelt sebagai layer tambahan di atas Unix permission\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-seatbelt-sebagai-layer-tambahan-di-atas-unix-permission\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSeatbelt bukanlah sistem file. Ia adalah mekanisme tambahan di OS yang mengevaluasi permintaan proses.\u003c/p\u003e\n\u003cp\u003eKalau dilihat dari perspektif akses:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUnix/macOS permission mengecek apakah user boleh mengakses file.\u003c/li\u003e\n\u003cli\u003eSeatbelt mengecek apakah proses dengan profile ini boleh mengakses file.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDalam eksperimen, proses yang sandboxed bisa ditolak membaca file yang sebenarnya bisa diakses oleh user normal. Itu contoh nyata batasan dua lapis.\u003c/p\u003e\n\u003ch2 id=\"3-sandbox-exec-dan-profile\"\u003e3. \u003ccode\u003esandbox-exec\u003c/code\u003e dan profile\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-sandbox-exec-dan-profile\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003esandbox-exec\u003c/code\u003e adalah wrapper CLI yang menjalankan command dengan profile sandbox. Format dasarnya:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003esandbox-exec -f profile.sb \u003cspan class=\"token builtin class-name\"\u003ecommand\u003c/span\u003e args\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau langsung lewat \u003ccode\u003e-p\u003c/code\u003e dengan profile inline. Contoh yang berhasil:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003esandbox-exec -p \u003cspan class=\"token string\"\u003e'(version 1) (allow default)'\u003c/span\u003e /bin/echo ok\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu menunjukkan sandbox aktif dan bisa menjalankan command sederhana.\u003c/p\u003e\n\u003ch2 id=\"4-codex-local-di-macos-generate-policy-runtime-bukan-nulis-sb\"\u003e4. Codex local di macOS generate policy runtime, bukan nulis \u003ccode\u003e.sb\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-codex-local-di-macos-generate-policy-runtime-bukan-nulis-sb\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang penting dipahami: Codex lokal biasanya tidak membuat file \u003ccode\u003e.sb\u003c/code\u003e permanen untuk user. Ia mengonversi config seperti \u003ccode\u003esandbox_mode\u003c/code\u003e, \u003ccode\u003ewritable_roots\u003c/code\u003e, \u003ccode\u003enetwork_access\u003c/code\u003e, dan \u003ccode\u003eshell_environment_policy\u003c/code\u003e menjadi model permission internal.\u003c/p\u003e\n\u003cp\u003eDi source Codex, \u003ccode\u003eseatbelt.rs\u003c/code\u003e include template SBPL bawaan seperti \u003ccode\u003eseatbelt_base_policy.sbpl\u003c/code\u003e dan \u003ccode\u003eseatbelt_network_policy.sbpl\u003c/code\u003e. Lalu runtime Codex menyusun \u003ccode\u003efull_policy\u003c/code\u003e sebagai string, dan memanggil \u003ccode\u003e/usr/bin/sandbox-exec -p \"...\" -- \u0026#x3C;command\u003e\u003c/code\u003e. Artinya aturan sandbox dikirim langsung lewat argumen \u003ccode\u003e-p\u003c/code\u003e, bukan disimpan sebagai file user-visible.\u003c/p\u003e\n\u003cp\u003eJadi \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e adalah tempat kita mengatur intent. \u003ccode\u003esandbox_mode\u003c/code\u003e dan \u003ccode\u003ewritable_roots\u003c/code\u003e menjadi rules yang di-render ke SBPL di memori, sementara user tidak perlu edit \u003ccode\u003e.sb\u003c/code\u003e langsung.\u003c/p\u003e\n\u003ch2 id=\"5-profile-menentukan-aturan-akses\"\u003e5. Profile menentukan aturan akses\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-profile-menentukan-aturan-akses\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProfile Seatbelt ditulis dengan S-expression. Contoh paling longgar:\u003c/p\u003e\n\u003cpre class=\"language-lisp\"\u003e\u003ccode class=\"language-lisp\"\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003eversion\u003c/span\u003e \u003cspan class=\"token number\"\u003e1\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003eallow\u003c/span\u003e default\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau kita tambahkan deny untuk folder tertentu, aturan berubah jadi:\u003c/p\u003e\n\u003cpre class=\"language-lisp\"\u003e\u003ccode class=\"language-lisp\"\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003eallow\u003c/span\u003e default\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003edeny\u003c/span\u003e file-read*\n  \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003esubpath\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"$HOME/codex-sandbox-lab/outside\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003edeny\u003c/span\u003e file-write*\n  \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token car\"\u003esubpath\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"$HOME/codex-sandbox-lab/outside\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan model blacklist seperti ini, semua boleh kecuali satu folder.\u003c/p\u003e\n\u003ch2 id=\"5-blacklist-vs-whitelist\"\u003e5. Blacklist vs whitelist\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-blacklist-vs-whitelist\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eModel blacklist mudah dipakai untuk eksperimen, tapi tetap longgar. Contohnya ketika profile hanya menolak \u003ccode\u003eoutside\u003c/code\u003e, shell masih bisa melihat isi \u003ccode\u003e$HOME\u003c/code\u003e karena \u003ccode\u003eallow default\u003c/code\u003e masih aktif.\u003c/p\u003e\n\u003cp\u003eModel whitelist yang lebih ketat adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edeny semua akses ke \u003ccode\u003e$HOME\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eallow baca/tulis workspace\u003c/li\u003e\n\u003cli\u003eallow baca folder script yang diperlukan\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan model ini, perintah \u003ccode\u003els \"$HOME\"\u003c/code\u003e gagal, tetapi \u003ccode\u003ecat workspace/app.txt\u003c/code\u003e berhasil.\u003c/p\u003e\n\u003cp\u003eItu lebih mendekati pola Codex \u003ccode\u003eworkspace-write\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"6-deny-default-terlalu-brutal-untuk-macos-modern\"\u003e6. \u003ccode\u003edeny default\u003c/code\u003e terlalu brutal untuk macOS modern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-deny-default-terlalu-brutal-untuk-macos-modern\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKita mencoba \u003ccode\u003edeny default\u003c/code\u003e lalu mengizinkan proses dan path penting. Hasilnya profile abort.\u003c/p\u003e\n\u003cp\u003eMaknanya: proses yang kelihatannya sederhana masih butuh banyak akses implisit seperti dynamic loader, metadata, locale, atau mach service. Jadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003edeny default\u003c/code\u003e lebih aman secara prinsip,\u003c/li\u003e\n\u003cli\u003etapi sulit stabil di praktik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePraktik yang lebih realistis adalah \u003ccode\u003eallow default + deny spesifik\u003c/code\u003e atau \u003ccode\u003edeny HOME + allow workspace\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"7-current-working-directory-perlu-diperhatikan\"\u003e7. Current working directory perlu diperhatikan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-current-working-directory-perlu-diperhatikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSandbox mempengaruhi \u003ccode\u003egetcwd()\u003c/code\u003e saat shell start. Kalau profile menutup \u003ccode\u003e$HOME\u003c/code\u003e sementara current directory berada di path yang tidak diizinkan, shell bisa gagal dengan pesan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eshell-init: error retrieving current directory: getcwd: cannot access parent directories: Operation not permitted\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSolusinya adalah menjalankan sandbox dari dalam workspace yang diizinkan.\u003c/p\u003e\n\u003ch2 id=\"8-batasan-utama-sandbox\"\u003e8. Batasan utama sandbox\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-batasan-utama-sandbox\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eEksperimen malicious script menunjukkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebaca workspace → berhasil\u003c/li\u003e\n\u003cli\u003ebaca outside secret → ditolak\u003c/li\u003e\n\u003cli\u003etulis workspace → berhasil\u003c/li\u003e\n\u003cli\u003etulis outside secret → ditolak\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu menegaskan bahwa sandbox bisa menahan akses keluar boundary. Tapi ia tidak membedakan apakah perubahan di dalam workspace baik atau jahat.\u003c/p\u003e\n\u003ch2 id=\"9-workspace-writable-bukan-berarti-aman\"\u003e9. Workspace writable bukan berarti aman\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-workspace-writable-bukan-berarti-aman\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau workspace diizinkan tulis, setiap skrip jahat yang ada di dalamnya bisa melakukan perubahan berbahaya seperti \u003ccode\u003erm -rf ./src\u003c/code\u003e atau menyisipkan backdoor ke \u003ccode\u003epackage.json\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eSandbox hanya menjawab pertanyaan “proses boleh ke mana?”, bukan “apakah proses ini niatnya baik?”.\u003c/p\u003e\n\u003cp\u003eJadi kontrol tambahan tetap perlu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003egit diff\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egit status\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ereview perubahan\u003c/li\u003e\n\u003cli\u003erollback jika perlu\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"10-network-deny-bisa-mengurangi-eksfiltrasi\"\u003e10. Network deny bisa mengurangi eksfiltrasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-network-deny-bisa-mengurangi-eksfiltrasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKita juga tes profile yang menolak \u003ccode\u003enetwork*\u003c/code\u003e. Hasilnya \u003ccode\u003ecurl\u003c/code\u003e jadi gagal resolve host.\u003c/p\u003e\n\u003cp\u003eItu efektif untuk menghalangi dependency jahat yang mencoba mengirim data keluar. Tapi efeknya hanya berlaku jika network memang diblokir oleh profile.\u003c/p\u003e\n\u003ch2 id=\"11-workaround-jangan-mulai-codex-dari-shell-yang-sudah-punya-secret\"\u003e11. Workaround: jangan mulai Codex dari shell yang sudah punya secret\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-workaround-jangan-mulai-codex-dari-shell-yang-sudah-punya-secret\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalahnya bukan Seatbelt menyensor env. Masalahnya secret sudah ikut naik ke proses dari parent shell. Sandbox membatasi file dan network, tapi environment variable itu seperti kertas yang sudah dikasih ke proses sejak lahir. Kalau proses sudah memegang kertas itu, Seatbelt tidak otomatis menariknya kembali.\u003c/p\u003e\n\u003cp\u003eWorkaround paling simpel adalah jalankan Codex dari environment bersih:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003eenv\u003c/span\u003e -i \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eHOME\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$HOME\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003ePATH\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eSHELL\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$SHELL\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eTERM\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$TERM\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  codex\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan \u003ccode\u003eenv -i\u003c/code\u003e, proses dimulai tanpa variabel environment dari shell lama. Hanya variabel yang kita set ulang yang akan ikut.\u003c/p\u003e\n\u003cp\u003eKalau mau masuk ke folder project dulu:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token builtin class-name\"\u003ecd\u003c/span\u003e /path/to/project\n\n\u003cspan class=\"token function\"\u003eenv\u003c/span\u003e -i \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eHOME\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$HOME\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003ePATH\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eSHELL\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$SHELL\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eTERM\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$TERM\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  codex\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni mencegah variabel seperti \u003ccode\u003eAWS_ACCESS_KEY_ID\u003c/code\u003e, \u003ccode\u003eAWS_SECRET_ACCESS_KEY\u003c/code\u003e, \u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e, \u003ccode\u003eGITHUB_TOKEN\u003c/code\u003e, \u003ccode\u003eNPM_TOKEN\u003c/code\u003e, atau \u003ccode\u003eDATABASE_URL\u003c/code\u003e ikut dibawa, kecuali sengaja dimasukkan lagi.\u003c/p\u003e\n\u003ch2 id=\"12-setup-codex-cli-lokal-di-codexconfigtoml\"\u003e12. Setup Codex CLI lokal di \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-setup-codex-cli-lokal-di-codexconfigtoml\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk membuat perilaku Codex mirip eksperimen \u003ccode\u003esandbox-exec\u003c/code\u003e, gue menyarankan konfigurasi user-level ini:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token comment\"\u003e# ~/.codex/config.toml\u003c/span\u003e\n\n\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"workspace-write\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"on-request\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapprovals_reviewer\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"user\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003esandbox_workspace_write\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003enetwork_access\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ewritable_roots\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude_tmpdir_env_var\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude_slash_tmp\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eshell_environment_policy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"core\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eignore_default_excludes\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*KEY*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*TOKEN*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*SECRET*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*PASSWORD*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*CREDENTIAL*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"AWS_*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"OPENAI_API_KEY\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GITHUB_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GH_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"NPM_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"DATABASE_URL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"PGPASSWORD\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einclude_only\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eset\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKonsepnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esandbox_mode = \"workspace-write\"\u003c/code\u003e berarti Codex boleh baca/tulis workspace, bukan filesystem bebas.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapproval_policy = \"on-request\"\u003c/code\u003e berarti kalau butuh network atau akses di luar boundary, Codex harus minta izin.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003einherit = \"core\"\u003c/code\u003e membuat Codex hanya membawa variabel inti yang normal, bukan secret shell.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eexclude\u003c/code\u003e menolak glob env sensitif supaya secret env tidak ikut ke proses yang spawn dari Codex.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"13-kalau-repo-asing-lebih-ketat-dengan-inherit--none\"\u003e13. Kalau repo asing, lebih ketat dengan \u003ccode\u003einherit = \"none\"\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-kalau-repo-asing-lebih-ketat-dengan-inherit--none\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk repo yang benar-benar tidak dipercaya, upgrade env policy menjadi lebih mirip \u003ccode\u003eenv -i\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eshell_environment_policy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"none\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eignore_default_excludes\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einclude_only\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"HOME\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"USER\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"LOGNAME\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"PATH\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"SHELL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"TERM\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"TMPDIR\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*KEY*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*TOKEN*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*SECRET*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*PASSWORD*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*CREDENTIAL*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"AWS_*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"OPENAI_API_KEY\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GITHUB_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GH_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"NPM_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"DATABASE_URL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"PGPASSWORD\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eset\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni akan memaksa Codex spawn process dengan env yang jauh lebih kecil, tapi bisa juga bikin beberapa tool dev gagal. Kalau perlu, tambahkan env spesifik satu per satu.\u003c/p\u003e\n\u003ch2 id=\"14-wrapper-codex-safe-tetap-berguna\"\u003e14. Wrapper \u003ccode\u003ecodex-safe\u003c/code\u003e tetap berguna\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-wrapper-codex-safe-tetap-berguna\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMeski sudah ada config, wrapper adalah pagar awal yang mencegah proses Codex sendiri lahir dari shell penuh secret.\u003c/p\u003e\n\u003cp\u003eDi \u003ccode\u003e~/.zshrc\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function-name function\"\u003ecodex-safe\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token function\"\u003eenv\u003c/span\u003e -i \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eHOME\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$HOME\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eUSER\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$USER\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eLOGNAME\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$LOGNAME\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003ePATH\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eSHELL\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e${\u003cspan class=\"token environment constant\"\u003eSHELL\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:-\u003c/span\u003e\u003cspan class=\"token operator\"\u003e/\u003c/span\u003ebin\u003cspan class=\"token operator\"\u003e/\u003c/span\u003ezsh}\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eTERM\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e${\u003cspan class=\"token environment constant\"\u003eTERM\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:-\u003c/span\u003exterm-256color}\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    \u003cspan class=\"token assign-left variable\"\u003eTMPDIR\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e${TMPDIR\u003cspan class=\"token operator\"\u003e:-\u003c/span\u003e\u003cspan class=\"token operator\"\u003e/\u003c/span\u003etmp}\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n    codex --sandbox workspace-write --ask-for-approval on-request \u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e$@\u003c/span\u003e\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni membuat dua layer:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecodex-safe\u003c/code\u003e: menghindari secret dari shell induk.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eshell_environment_policy\u003c/code\u003e: menghindari secret dari process yang Codex spawn.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"15-setup-per-project-hanya-untuk-root-tambahan-yang-benar-benar-perlu\"\u003e15. Setup per-project hanya untuk root tambahan yang benar-benar perlu\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-setup-per-project-hanya-untuk-root-tambahan-yang-benar-benar-perlu\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau repo perlu nulis ke sibling path, gunakan \u003ccode\u003e.codex/config.toml\u003c/code\u003e di project bukan \u003ccode\u003edanger-full-access\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eContohnya:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"workspace-write\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"on-request\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003esandbox_workspace_write\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003enetwork_access\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ewritable_roots\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"/Users/zeihanaulia/workspace/shared-lib\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCatatan penting: project \u003ccode\u003e.codex/config.toml\u003c/code\u003e hanya boleh dipercaya kalau repo itu memang dipercaya; kalau repo tidak dipercaya, Codex bisa skip project-scoped config.\u003c/p\u003e\n\u003ch2 id=\"16-verifikasi-dan-jangan-pakai-opsi-berbahaya-sebagai-default\"\u003e16. Verifikasi dan jangan pakai opsi berbahaya sebagai default\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-verifikasi-dan-jangan-pakai-opsi-berbahaya-sebagai-default\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah konfigurasi, tes dari dalam Codex:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003eenv\u003c/span\u003e \u003cspan class=\"token operator\"\u003e|\u003c/span\u003e \u003cspan class=\"token function\"\u003egrep\u003c/span\u003e -Ei \u003cspan class=\"token string\"\u003e'key|token|secret|password|credential|aws|openai|github|npm|database'\u003c/span\u003e\n\u003cspan class=\"token builtin class-name\"\u003epwd\u003c/span\u003e\n\u003cspan class=\"token function\"\u003els\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\u003cspan class=\"token function\"\u003els\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$HOME\u003c/span\u003e\"\u003c/span\u003e\n\u003cspan class=\"token function\"\u003ecurl\u003c/span\u003e -I https://example.com\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEkspektasinya: env sensitif hilang, workspace bisa diakses, akses \u003ccode\u003eHOME\u003c/code\u003e dibatasi, dan network gagal atau butuh approval.\u003c/p\u003e\n\u003cp\u003eHindari default berbahaya seperti:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"danger-full-access\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"never\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau env policy seperti:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"all\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eignore_default_excludes\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"17-global-vs-per-repoproject-config\"\u003e17. Global vs per repo/project config\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-global-vs-per-repoproject-config\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCodex lokal punya beberapa layer konfigurasi: global/user config, profile config, dan per-project config. Jangan anggap ini sebagai config yang sama; ini adalah hierarchy trust.\u003c/p\u003e\n\u003cp\u003eGlobal config di \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e harus jadi sabuk pengaman default: baseline aman untuk semua repo. Contoh yang aman:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"workspace-write\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"on-request\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapprovals_reviewer\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"user\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003esandbox_workspace_write\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003enetwork_access\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ewritable_roots\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eshell_environment_policy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"core\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eignore_default_excludes\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*KEY*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*TOKEN*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*SECRET*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*PASSWORD*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*CREDENTIAL*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"AWS_*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"OPENAI_API_KEY\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GITHUB_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GH_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"NPM_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"DATABASE_URL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"PGPASSWORD\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePer-project config di \u003ccode\u003e.codex/config.toml\u003c/code\u003e adalah izin kerja khusus untuk repo tertentu. Gunakan hanya ketika repo itu dipercaya dan butuh exception yang jelas, misalnya writable root tambahan:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"workspace-write\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"on-request\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003esandbox_workspace_write\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003enetwork_access\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ewritable_roots\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"/Users/zeihanaulia/workspace/shared-lib\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eProfile config di \u003ccode\u003e~/.codex/.config.toml\u003c/code\u003e atau \u003ccode\u003e~/.codex/paranoid.config.toml\u003c/code\u003e cocok untuk mode kerja yang berbeda tanpa memodifikasi setiap repo. Misalnya profile \u003ccode\u003eparanoid\u003c/code\u003e untuk repo asing:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"read-only\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"untrusted\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eshell_environment_policy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"none\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einclude_only\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"HOME\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"USER\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"LOGNAME\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"PATH\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"SHELL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"TERM\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"TMPDIR\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCLI flags paling tinggi prioritas. Pakai \u003ccode\u003e--sandbox\u003c/code\u003e, \u003ccode\u003e--ask-for-approval\u003c/code\u003e, atau \u003ccode\u003e-c\u003c/code\u003e untuk override sementara pada satu session.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eglobal = baseline aman\u003c/li\u003e\n\u003cli\u003eper-project = exception spesifik untuk repo yang dipercaya\u003c/li\u003e\n\u003cli\u003eprofile = mode kerja yang berbeda\u003c/li\u003e\n\u003cli\u003eCLI flag = override sekali jalan\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau global terlalu longgar, semua repo ikut longgar. Kalau per-project terlalu dipercaya, repo jahat bisa mencoba mengubah cara Codex bekerja. Itu kenapa project config harus ditaruh hanya untuk trusted repos dan kenapa Codex skip \u003ccode\u003e.codex/\u003c/code\u003e di project yang untrusted.\u003c/p\u003e\n\u003ch2 id=\"18-kesimpulan-praktis\"\u003e18. Kesimpulan praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#18-kesimpulan-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk Codex lokal di macOS, model aman yang masuk akal adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egunakan \u003ccode\u003eworkspace-write\u003c/code\u003e, bukan \u003ccode\u003edanger-full-access\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003epakai approval policy \u003ccode\u003eon-request\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ejangan izinkan network sembarangan\u003c/li\u003e\n\u003cli\u003ejangan jalankan dari shell yang penuh secret env\u003c/li\u003e\n\u003cli\u003eselalu cek \u003ccode\u003egit diff\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003euntuk repo asing atau mencurigakan, pakai container/VM/remote sandbox\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk repo cukup dipercaya, sandbox lokal bisa nyaman dan meminimalkan risiko akses luar workspace.\u003c/p\u003e\n\u003ch2 id=\"13-inti-kepercayaan-yang-sehat\"\u003e13. Inti kepercayaan yang sehat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-inti-kepercayaan-yang-sehat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling benar dipahami adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esandbox membatasi akses,\u003c/li\u003e\n\u003cli\u003eapproval membatasi eskalasi,\u003c/li\u003e\n\u003cli\u003egit diff membatasi perubahan diam-diam,\u003c/li\u003e\n\u003cli\u003eenv hygiene membatasi kebocoran token,\u003c/li\u003e\n\u003cli\u003econtainer/VM membatasi risiko untuk kode yang tidak dipercaya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSandbox adalah blast-radius reducer, bukan jaminan selesai.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecodex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esandboxing (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emacos (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u00
