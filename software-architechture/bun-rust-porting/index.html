0,"depth":2},"kenapa-layering-jadi-masalah-besar-di-rust-port":{"type":"header","text":"Kenapa layering jadi masalah besar di Rust port","value":"kenapa-layering-jadi-masalah-besar-di-rust-port","line":40,"column":0,"depth":2},"crates-compile-time-dan-cyclic-deps":{"type":"header","text":"Crates, compile time, dan cyclic deps","value":"crates-compile-time-dan-cyclic-deps","line":58,"column":0,"depth":2},"kenapa-tagged-pointers-zig-jadi-titik-friksi":{"type":"header","text":"Kenapa tagged pointers Zig jadi titik friksi?","value":"kenapa-tagged-pointers-zig-jadi-titik-friksi","line":76,"column":0,"depth":2},"arah-diskusi-reply-reply":{"type":"header","text":"Arah diskusi reply-reply","value":"arah-diskusi-reply-reply","line":94,"column":0,"depth":2},"cabang-kualitas-rewrite-measurable-better-dan-stability":{"type":"header","text":"Cabang kualitas rewrite: measurable better dan stability","value":"cabang-kualitas-rewrite-measurable-better-dan-stability","line":107,"column":0,"depth":2},"cabang-sejarah-dan-metodologi-port-besar":{"type":"header","text":"Cabang sejarah dan metodologi port besar","value":"cabang-sejarah-dan-metodologi-port-besar","line":137,"column":0,"depth":2},"insight-besar-buat-desain-software":{"type":"header","text":"Insight besar buat desain software","value":"insight-besar-buat-desain-software","line":172,"column":0,"depth":2},"yang-masih-menggantung":{"type":"header","text":"Yang masih menggantung","value":"yang-masih-menggantung","line":197,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":208,"column":0,"depth":2}},"children":[],"parent":"notes.software-architechture","data":{}},"body":"\u003ch1 id=\"bun-porting-dari-zig-ke-rust-masalah-layering-crates-dan-tagged-pointer\"\u003eBun porting dari Zig ke Rust: masalah layering, crates, dan tagged pointer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bun-porting-dari-zig-ke-rust-masalah-layering-crates-dan-tagged-pointer\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJared Sumner membahas port Bun yang awalnya tumbuh enak di Zig, tapi lalu ketemu batasan baru saat dibawa ke Rust.\nBukan diskusi \"Rust vs Zig\" tribal, tapi tentang bagaimana model modular Rust mengubah arsitektur runtime yang saling terhubung dalam Bun.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePost: \u003ca href=\"https://x.com/jarredsumner/status/2053368908372128055\"\u003ehttps://x.com/jarredsumner/status/2053368908372128055\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"problem-utama-jared\"\u003eProblem utama Jared\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem-utama-jared\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang dia ceritakan bukan cuma compile time atau sintaks.\nIni adalah problem dari transisi arsitektur:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBun sudah mulai tumbuh organik di Zig,\u003c/li\u003e\n\u003cli\u003eRust port memecahnya jadi banyak crate,\u003c/li\u003e\n\u003cli\u003ecrate bagus untuk compile time dan reuse,\u003c/li\u003e\n\u003cli\u003etapi Rust memaksa dependency graph jadi DAG,\u003c/li\u003e\n\u003cli\u003esementara banyak bagian Bun di Zig saling terhubung erat,\u003c/li\u003e\n\u003cli\u003etagged pointers di Zig dulu memudahkan interface heterogen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic problemnya:\n\u003cstrong\u003estruktur runtime yang nyaman dan interconnected di Zig tidak langsung punya padanan ergonomis di Rust crate-based modularity.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"kenapa-layering-jadi-masalah-besar-di-rust-port\"\u003eKenapa layering jadi masalah besar di Rust port\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-layering-jadi-masalah-besar-di-rust-port\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLayering di Rust bukan sekadar stylistic.\nIni memaksa keputusan desain baru:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esiapa boleh depend ke siapa,\u003c/li\u003e\n\u003cli\u003edi crate mana interface didefinisikan,\u003c/li\u003e\n\u003cli\u003edi crate mana type shared ditempatkan,\u003c/li\u003e\n\u003cli\u003edi crate mana implementasi behavior tinggal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTrade-offnya jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elebih sedikit crates = graph lebih longgar, tapi compile time dan reuse lebih buruk;\u003c/li\u003e\n\u003cli\u003elebih banyak crates = compile time incremental lebih bagus, tapi cycle dan boundary jadi tajam.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk Bun, banyak area seperti event loop, process callback, nonblocking I/O, task scheduler itu secara alami saling bersilang.\nRust memperlakukan itu sebagai masalah arsitektur, bukan sekadar masalah implementasi.\u003c/p\u003e\n\u003ch2 id=\"crates-compile-time-dan-cyclic-deps\"\u003eCrates, compile time, dan cyclic deps\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#crates-compile-time-dan-cyclic-deps\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRelasi yang Jared tunjukkan adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebanyak crates → compile unit lebih kecil → compile incremental lebih cepat\u003c/li\u003e\n\u003cli\u003etapi banyak crates → dependency graph harus DAG-ish\u003c/li\u003e\n\u003cli\u003edan DAG-ish → cyclic dependency langsung jadi error desain\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBeberapa reply teknis menanggapi dengan pola arsitektur:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ebun-core\u003c/code\u003e atau \u003ccode\u003e*_types\u003c/code\u003e crate sebagai dasar,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e*_impl\u003c/code\u003e crate untuk implementasi,\u003c/li\u003e\n\u003cli\u003episahkan data schema dari behavior,\u003c/li\u003e\n\u003cli\u003edispatch logic ditempatkan di layer yang lebih tinggi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu semua pada dasarnya adalah strategi memutus cycle di Rust.\nTapi strategi ini juga mengubah bentuk sistem: dari jaringan organik ke builder-style modular architecture.\u003c/p\u003e\n\u003ch2 id=\"kenapa-tagged-pointers-zig-jadi-titik-friksi\"\u003eKenapa tagged pointers Zig jadi titik friksi?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-tagged-pointers-zig-jadi-titik-friksi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTagged pointers memberikan fleksibilitas low-level yang sulit ditiru secara ergonomis di Rust.\nMereka memberi Zig:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eheterogeneity ringan,\u003c/li\u003e\n\u003cli\u003eobject layout kontrol manual,\u003c/li\u003e\n\u003cli\u003edispatch dan payload dalam satu representasi,\u003c/li\u003e\n\u003cli\u003eperforma tanpa overhead box/dyn.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi Rust, pilihan padanannya biasanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eBox\u0026#x3C;dyn Trait\u003e\u003c/code\u003e: ergonomis, tapi punya runtime dispatch / vtable / alloc cost,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eT: Trait\u003c/code\u003e generic: zero-cost, tapi tidak cocok untuk koleksi heterogen dinamis,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eenum\u003c/code\u003e of structs: static, no vtable, tapi harus dipusatkan dan bisa jadi besar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi friksi utama adalah: Zig bisa pakai tagged pointer sebagai building block runtime, sedangkan Rust mengharuskan kamu memilih antara runtime heterogeneity atau static modularity.\u003c/p\u003e\n\u003ch2 id=\"arah-diskusi-reply-reply\"\u003eArah diskusi reply-reply\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arah-diskusi-reply-reply\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDiskusinya tidak tampak ingin balik ke Zig sebagai jawaban utama.\nArah utama yang muncul adalah:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003etraits/types split\u003c/strong\u003e — taruh kontrak di core crate, implementasi di crate lain.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ecore trait crate / bun-core\u003c/strong\u003e — shared trait dan types jadi titik temu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eenum/\u003ccode\u003e*_types\u003c/code\u003e + \u003ccode\u003e*_impl\u003c/code\u003e split\u003c/strong\u003e — cara klasik memutus cycle.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003estatic generic vs dynamic trait\u003c/strong\u003e — pilih biaya runtime vs compile-time.\u003c/li\u003e\n\u003cli\u003eAda juga suara yang bilang: jika arsitektur Bun memang serupa Zig, mungkin Zig lebih cocok ketimbang paksa Rust.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi arah thread ini lebih ke negosiasi ulang arsitektur daripada adu fitur Rust/Zig.\u003c/p\u003e\n\u003ch2 id=\"cabang-kualitas-rewrite-measurable-better-dan-stability\"\u003eCabang kualitas rewrite: measurable better dan stability\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cabang-kualitas-rewrite-measurable-better-dan-stability\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread lanjutan Jared menggeser diskusi dari \"bagaimana cara port\" ke \"kapan port ini pantas di-merge\".\u003c/p\u003e\n\u003cp\u003eIntinya, dia menegaskan bahwa Rust port tidak akan diterima kecuali hasil akhirnya bisa dibuktikan secara terukur lebih baik dari Zig di aspek:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eperformance,\u003c/li\u003e\n\u003cli\u003ememory usage,\u003c/li\u003e\n\u003cli\u003estability.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi cabang ini, reply-reply berfokus pada kekhawatiran berikut:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003estability sulit divalidasi\u003c/strong\u003e — test suite besar bisa memukul known failures, tapi unknown bug class baru masih mungkin muncul di dunia nyata.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erewrite harus measurable\u003c/strong\u003e — bukan cukup \"works\" atau \"tests pass\"; harus ada benchmark dan evidence.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ebenchmark/hot path evidence\u003c/strong\u003e — publik mulai menunggu angka nyata, bukan sekadar arsitektur teori.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi, orang di cabang ini tidak menolak Rust port secara ide. Mereka menaikkan standar pembuktian. Rewrite dianggap hanya sah jika dia menang dalam metrik nyata, bukan sekadar menawarkan design-level safety.\u003c/p\u003e\n\u003cp\u003eDefinisi stability dalam cabang ini muncul dua level:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eDesign-level stability\u003c/strong\u003e — Rust mempersulit kelas crash tertentu seperti segfault dan memory safety bugs.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eField-level stability\u003c/strong\u003e — apakah sistem tetap kokoh di paparan penggunaan nyata dan edge case dunia nyata.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDiskusi kini beralih ke arah yang lebih dewasa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emenolak argumen \"Rust lebih aman\" tanpa bukti,\u003c/li\u003e\n\u003cli\u003emenerima motivasi Rust untuk mengurangi kelas crash tertentu,\u003c/li\u003e\n\u003cli\u003emenuntut benchmark dan test evidence,\u003c/li\u003e\n\u003cli\u003emenyadari bahwa stabilitas penuh baru bisa didekati lewat exposure lapangan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"cabang-sejarah-dan-metodologi-port-besar\"\u003eCabang sejarah dan metodologi port besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cabang-sejarah-dan-metodologi-port-besar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTweet Jared selanjutnya menyambung ke kisah asal Bun: port besar pertama kali dibuat dari Go ke Zig, pre-LLM, dan butuh pendekatan mental yang brutal.\u003c/p\u003e\n\u003cp\u003eYang dia jelaskan bukan lagi arsitektur target, tapi \u003cstrong\u003ecara berpikir saat melakukan hand-port besar\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDia memberi dua heuristik penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ebreadth-first\u003c/strong\u003e, bukan depth-first,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003etulis semua kode dulu\u003c/strong\u003e, jangan incremental-fix satu per satu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalimatnya sederhana, tapi ini penting:\nport bootstrap line-for-line bukan soal kesempurnaan. Ini soal membentuk kerangka sistem terlebih dahulu.\u003c/p\u003e\n\u003cp\u003eBeberapa insight dari cabang ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eport besar kadang lebih mirip pekerjaan mekanis daripada desain elegan.\u003c/li\u003e\n\u003cli\u003eLOC ported bisa jadi proxy progress awal ketika fitur belum sempurna.\u003c/li\u003e\n\u003cli\u003emenjaga source lama dekat dengan source baru membantu beban kognitif.\u003c/li\u003e\n\u003cli\u003efase awal port adalah bootstrap; fase berikutnya adalah fix; fase terakhir adalah redesign/optimization.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eReply yang paling berharga di cabang ini menegaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGlauber: port manual sering efektif kalau source lama tetap terlihat di samping source baru.\u003c/li\u003e\n\u003cli\u003eJason: port besar bisa berjalan bersamaan dengan re-architecture, tapi tidak selalu baik kalau langsung dicampur.\u003c/li\u003e\n\u003cli\u003eSomi: “sort of work” berarti port awal bisa lulus, tetapi belum benar-benar matang.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah diskusi cabang ini adalah ke model kerja port:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebootstrap dulu,\u003c/li\u003e\n\u003cli\u003ebaru kemudian hadapi mismatch arsitektur,\u003c/li\u003e\n\u003cli\u003elalu buktikan hasilnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu menambah konteks penting pada keseluruhan thread: Jarred ngomong tidak dari teori, tapi dari pengalaman port besar yang sebenarnya dia pernah jalani.\u003c/p\u003e\n\u003ch2 id=\"insight-besar-buat-desain-software\"\u003eInsight besar buat desain software\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-besar-buat-desain-software\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari thread ini gue ambil insight ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eport bahasa sistem bukan sekadar translasi fitur;\u003c/li\u003e\n\u003cli\u003eitu soal memetakan ulang \u003cstrong\u003eabstraction model\u003c/strong\u003e dan \u003cstrong\u003edependency model\u003c/strong\u003e;\u003c/li\u003e\n\u003cli\u003emodel yang nyaman di satu bahasa bisa jadi beban di bahasa lain;\u003c/li\u003e\n\u003cli\u003emodularity dengan banyak unit kompilasi adalah trade-off; bukan free lunch.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk sistem performa-sensitif dan interconnected, desain yang cocok di Zig bisa jadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elebih organik,\u003c/li\u003e\n\u003cli\u003erepresentasi heterogen dekat ke runtime,\u003c/li\u003e\n\u003cli\u003eboundary implicit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSementara desain yang cocok di Rust cenderung:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elebih eksplisit,\u003c/li\u003e\n\u003cli\u003eboundary lebih tegas,\u003c/li\u003e\n\u003cli\u003eshared contract di crate khusus,\u003c/li\u003e\n\u003cli\u003eheterogeneity dipaksa lewat trait object atau enum.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu bukan soal salah satu lebih hebat.\nIni soal: \u003cstrong\u003eapa model yang paling sesuai dengan sifat sistem yang kamu bawa?\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"yang-masih-menggantung\"\u003eYang masih menggantung\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yang-masih-menggantung\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBun thread Jared juga menunjukkan bahwa beberapa masalah belum beres:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eseberapa jauh \u003ccode\u003edyn\u003c/code\u003e trait bisa dipakai tanpa bikin runtime overhead tidak terkendali?\u003c/li\u003e\n\u003cli\u003ekapan \u003ccode\u003eenum\u003c/code\u003e jadi terlalu besar dan sulit dikembangkan?\u003c/li\u003e\n\u003cli\u003eapakah \u003ccode\u003etypes\u003c/code\u003e/\u003ccode\u003eimpl\u003c/code\u003e split membuat sistem terlalu verbose?\u003c/li\u003e\n\u003cli\u003eapakah batas crate yang diusulkan lebih banyak membuat kode jadi lebih keras dipahami?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni berarti thread ini berguna sebagai kasus arsitektur nyata, bukan sekadar diskusi bahasa.\u003c/p\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo punya sistem performa-sensitif, heavily interconnected, dan tumbuh organik, porting ke Rust berarti lo mungkin harus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epilih ulang batas modularitas,\u003c/li\u003e\n\u003cli\u003etaruh shared contract di crate dasar,\u003c/li\u003e\n\u003cli\u003etentukan mana runtime heterogeneity yang layak bayar dengan \u003ccode\u003edyn\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003edan siap menerima kode lebih verbose sebagai biaya desain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu lebih menarik daripada sekadar: \"Rust harus punya fitur Zig.\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #7a6a4f;\" href=\"/sotoy/notes/tags.software-architechture\"\u003esoftware-architechture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003erust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ezig (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebun (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124519\"\u003ePorting sistem Zig organik ke Rust modular sering butuh negosiasi ulang arsitektur\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124520\"\u003eRewrite sistem low-level hanya sah jika terukur lebih baik secara performa, memori, dan stabilitas\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124521\"\u003eHand-porting besar lebih efektif jika breadth-first dan tulis semua dulu\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.software-architechture.bun-rewrite-oracle\"\u003eBun rewrite Zig → Rust: oracle test dan validasi independen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.11\"\u003e2026-05-11\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionC
