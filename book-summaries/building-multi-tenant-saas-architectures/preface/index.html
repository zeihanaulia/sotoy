ps":{"note":{"id":"book-summaries.building-multi-tenant-saas-architectures.preface","title":"Preface","desc":"Analisis Preface Building Multi-Tenant SaaS Architectures: kontrak intelektual penulis dan kerangka berpikir yang dibangun.","updated":1778452613290,"created":1778384605534,"tags":["saas","multi-tenancy","architecture"],"custom":{},"fname":"book-summaries.building-multi-tenant-saas-architectures.preface","type":"note","vault":{"fsPath":"vault"},"contentHash":"cfcc478bf3440ba7e291c1489307cded","links":[{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures.preface","id":"book-summaries.building-multi-tenant-saas-architectures.preface","vaultName":"vault"},"value":"tags.saas","alias":"saas","xvault":false,"to":{"fname":"tags.saas"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures.preface","id":"book-summaries.building-multi-tenant-saas-architectures.preface","vaultName":"vault"},"value":"tags.multi-tenancy","alias":"multi-tenancy","xvault":false,"to":{"fname":"tags.multi-tenancy"}},{"type":"frontmatterTag","from":{"fname":"book-summaries.building-multi-tenant-saas-architectures.preface","id":"book-summaries.building-multi-tenant-saas-architectures.preface","vaultName":"vault"},"value":"tags.architecture","alias":"architecture","xvault":false,"to":{"fname":"tags.architecture"}},{"from":{"fname":"book-summaries.building-multi-tenant-saas-architectures","id":"book-summaries.building-multi-tenant-saas-architectures","vaultName":"vault"},"type":"backlink","position":{"start":{"line":37,"column":98,"offset":3835},"end":{"line":37,"column":165,"offset":3902},"indent":[]},"value":"book-summaries.building-multi-tenant-saas-architectures.preface"},{"from":{"fname":"zettel.20260510123819","id":"zettel.20260510123819","vaultName":"vault"},"type":"backlink","position":{"start":{"line":8,"column":12,"offset":493},"end":{"line":8,"column":79,"offset":560},"indent":[]},"value":"book-summaries.building-multi-tenant-saas-architectures.preface"},{"from":{"fname":"daily.journal.2026.05.10","id":"daily.journal.2026.05.10","vaultName":"vault"},"type":"backlink","position":{"start":{"line":19,"column":82,"offset":1769},"end":{"line":19,"column":149,"offset":1836},"indent":[]},"value":"book-summaries.building-multi-tenant-saas-architectures.preface"}],"anchors":{"saas-bukan-label-stabil":{"type":"header","text":"SaaS bukan label stabil","value":"saas-bukan-label-stabil","line":18,"column":0,"depth":2},"ini-buku-tentang-taxonomy-bukan-dogma":{"type":"header","text":"Ini buku tentang taxonomy, bukan dogma","value":"ini-buku-tentang-taxonomy-bukan-dogma","line":24,"column":0,"depth":2},"saas-itu-business-shaped-architecture":{"type":"header","text":"SaaS itu business-shaped architecture","value":"saas-itu-business-shaped-architecture","line":30,"column":0,"depth":2},"cloud-bukan-saas":{"type":"header","text":"Cloud bukan SaaS","value":"cloud-bukan-saas","line":38,"column":0,"depth":2},"bacanya-jangan-lompat":{"type":"header","text":"Bacanya jangan lompat","value":"bacanya-jangan-lompat","line":44,"column":0,"depth":2},"scope-nya":{"type":"header","text":"Scope-nya","value":"scope-nya","line":52,"column":0,"depth":2}},"children":[],"parent":"book-summaries.building-multi-tenant-saas-architectures","data":{}},"body":"\u003ch1 id=\"preface\"\u003ePreface\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#preface\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003ePreface ini bikin gue langsung ngeh bahwa buku ini nggak ditulis untuk orang yang mau cepat-cepat nyari recipe. Dari awal, gue merasa Tod Golding lagi bilang: \"Dunia SaaS sekarang penuh kabut, bukan peta.\" Itu penting. Ini bukan sekadar pembuka; ini adalah alasan kenapa buku ini harus ada.\u003c/p\u003e\n\u003cp\u003eYang gue ambil dari kalimat itu adalah: masalah SaaS bukan kekurangan tool. Masalahnya adalah istilahnya kabur, asumsi orang beda-beda, dan semua pake label yang sama. Kalau definisi dasar nggak jelas, semua keputusan berikutnya bisa jadi ngawur.\u003c/p\u003e\n\u003ch2 id=\"saas-bukan-label-stabil\"\u003eSaaS bukan label stabil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#saas-bukan-label-stabil\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi Preface, gue jadi sadar bahwa banyak orang pakai kata \"SaaS\" untuk banyak hal. Buat sebagian, itu cukup berarti aplikasi web yang di-host. Buat yang lain, cukup berarti subscription. Itu bikin banyak tim bilang mereka SaaS padahal model isolation, data, dan operasi mereka beda jauh.\u003c/p\u003e\n\u003cp\u003eYang gue suka dari sini adalah Golding nggak mau definisi SaaS cuma keren di slide deck. Dia pengin definisi yang bisa diterjemahkan jadi keputusan nyata: tenant isolation gimana, onboarding gimana, routing gimana, data partitioning gimana, dan operasi gimana.\u003c/p\u003e\n\u003ch2 id=\"ini-buku-tentang-taxonomy-bukan-dogma\"\u003eIni buku tentang taxonomy, bukan dogma\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ini-buku-tentang-taxonomy-bukan-dogma\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePoin ini bikin gue ngerasa adem. Dia bilang buku ini bukan \"bible\" SaaS. Jadi dia jelas ngebangun kerangka dan bahasa, bukan nyuruh kita ikut satu formula mutlak.\u003c/p\u003e\n\u003cp\u003eBuat gue, itu berarti pendekatannya lebih fleksibel. Dia pengin merapikan bahasa dan boundary dulu, bukan nyuruh orang langsung tulis kode atau desain infrastruktur.\u003c/p\u003e\n\u003ch2 id=\"saas-itu-business-shaped-architecture\"\u003eSaaS itu business-shaped architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#saas-itu-business-shaped-architecture\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni yang paling nancep buat gue: arsitektur SaaS bukan cuma masalah service atau database. Dia lahir dari target bisnis dan operating model.\u003c/p\u003e\n\u003cp\u003eJadi kalau bisnis lo butuh efisiensi buat banyak tenant kecil, mungkin lo condong ke shared infrastructure. Kalau lo target enterprise yang butuh compliance dan blast radius kecil, lo mungkin pilih isolation lebih dedicated.\u003c/p\u003e\n\u003cp\u003eBuat gue, kalimat ini ngejelasin: SaaS nggak cuma soal teknis. SaaS itu soal mana yang bisa ditolerir dari sisi cost, agility, support, dan risk.\u003c/p\u003e\n\u003ch2 id=\"cloud-bukan-saas\"\u003eCloud bukan SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cloud-bukan-saas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePunya cloud itu bagus, tapi nggak otomatis bikin lo SaaS. Preface ini ngejelasin bahwa cloud itu cuma lingkungan, sedangkan SaaS adalah model operasional dan arsitektur.\u003c/p\u003e\n\u003cp\u003eItu penting karena banyak org keblinger: deploy ke AWS terus merasa sudah SaaS. Menurut gue, di sini Golding lagi ngingetin kita untuk jangan terjebak dengan tool. Cari dulu prinsipnya.\u003c/p\u003e\n\u003ch2 id=\"bacanya-jangan-lompat\"\u003eBacanya jangan lompat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bacanya-jangan-lompat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePreface ini juga bilang dengan cukup jelas: kalau kamu skip bab awal, kamu bakal rugi.\u003c/p\u003e\n\u003cp\u003eBuku ini disusun dengan dependency antar konsep. Bab awal bukan filler; dia yang bikin kamu ngerti kenapa pola di bab selanjutnya dipilih.\u003c/p\u003e\n\u003cp\u003eKalau gue baca tanpa Preface, gue mungkin cuma bakal anggap ini buku tentang multi-tenant pattern. Tapi Preface nge-trek gue bahwa ini buku tentang cara kita ngobrol soal SaaS dulu.\u003c/p\u003e\n\u003ch2 id=\"scope-nya\"\u003eScope-nya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#scope-nya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSatu lagi yang gue tangkap: buku ini nggak ngaku bahas semua SaaS. Ini lebih ke konteks B2B / multi-tenant enterprise. Itu bikin saran-sarannya terasa lebih nyata dan nggak terlalu broad.\u003c/p\u003e\n\u003cp\u003eJadi buat gue, Preface ini semacam peta awal yang nentuin: kita bakal baca SaaS sebagai sistem arsitektur yang dibentuk oleh bisnis, bukan sekadar katalog teknologi.\u003c/p\u003e\n\u003cp\u003eKalau lo paham Preface ini, lo baca bab berikutnya dengan frame yang lebih tajam. Kalau lo belum paham, bab-bab selanjutnya bisa terasa kayak kumpulan fitur tanpa alasan yang jelas.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esaas (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003emulti-tenancy (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003earchitecture (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.building-multi-tenant-saas-architectures\"\u003eBuilding Multi-Tenant SaaS Architectures\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260510123819\"\u003eSaaS architecture is business-shaped architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.10\"\u003e2026-05-10\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"c
