.ai.verified-done","position":{"start":{"line":17,"column":3,"offset":1255},"end":{"line":17,"column":30,"offset":1282},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.ai.verified-done"}}],"anchors":{"konsep":{"type":"header","text":"Konsep","value":"konsep","line":15,"column":0,"depth":2},"bentuk-penegakan":{"type":"header","text":"Bentuk Penegakan","value":"bentuk-penegakan","line":18,"column":0,"depth":2},"anti-cheat-patterns":{"type":"header","text":"Anti-Cheat Patterns","value":"anti-cheat-patterns","line":23,"column":0,"depth":2},"relasi":{"type":"header","text":"Relasi","value":"relasi","line":28,"column":0,"depth":2}},"children":[],"parent":"5u5qgf55dk7a3bauxh68b69","data":{}},"body":"\u003ch1 id=\"mekanisme-penegakan-loop-loop-enforcement\"\u003eMekanisme Penegakan Loop (Loop Enforcement)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mekanisme-penegakan-loop-loop-enforcement\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konsep\"\u003eKonsep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konsep\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eInstruksi dalam prompt (misal: \"Tolong jalankan test sebelum selesai\") sering diabaikan oleh AI jika ia merasa sudah menemukan solusi atau ingin mengakhiri tugas dengan cepat. \u003cstrong\u003eLoop Enforcement\u003c/strong\u003e adalah penggunaan mekanisme teknis untuk memaksa agent melewati jalur verifikasi.\u003c/p\u003e\n\u003ch2 id=\"bentuk-penegakan\"\u003eBentuk Penegakan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bentuk-penegakan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePhysical Hooks\u003c/strong\u003e: Menggunakan event-driven hooks (seperti \u003ccode\u003ePostToolUse\u003c/code\u003e atau \u003ccode\u003eStop\u003c/code\u003e hooks) yang menyuntikkan output tool secara otomatis ke dalam context window agent.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eProtocol Files\u003c/strong\u003e: Menggunakan file seperti \u003ccode\u003eCLAUDE.md\u003c/code\u003e sebagai referensi permanen yang mendefinisikan state machine dari tugas (Write \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Check \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Fix \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Repeat).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEscalation Paths\u003c/strong\u003e: Menyediakan sub-agent dengan context fresh (misal: \u003ccode\u003e@fixer\u003c/code\u003e) untuk memutus loop stagnan (stuck in a loop).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"anti-cheat-patterns\"\u003eAnti-Cheat Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#anti-cheat-patterns\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk mencegah agent \"curang\" (misal: menghapus test agar pass), penegakan harus mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTest Integrity\u003c/strong\u003e: Larangan mengubah test suite selama loop implementasi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo-Progress Detection\u003c/strong\u003e: Deteksi jika error yang sama muncul berulang kali, yang memicu penghentian loop atau eskalasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relasi\"\u003eRelasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.ai-engineering.claude-code-loop-setup\"\u003ePractical Loop Setup in Claude Code: From Messenger to Reviewer\u003c/a\u003e: Contoh setup praktis menggunakan hooks dan protocol files.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.ai.verified-done\"\u003eDefinisi 'Done' sebagai 'Verified'\u003c/a\u003e: Tujuan akhir dari loop enforcement adalah mencapai status 'Verified Done'.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n
