e":50,"column":0,"depth":2},"teknik-praktis":{"type":"header","text":"Teknik praktis","value":"teknik-praktis","line":61,"column":0,"depth":3},"3-gunakan-code-sebagai-alat-discovery-bukan-cuma-hasil-prompt":{"type":"header","text":"3. Gunakan code sebagai alat discovery, bukan cuma hasil prompt","value":"3-gunakan-code-sebagai-alat-discovery-bukan-cuma-hasil-prompt","line":68,"column":0,"depth":2},"aman-dipakai":{"type":"header","text":"Aman dipakai","value":"aman-dipakai","line":79,"column":0,"depth":3},"4-kurangi-cognitive-debt-dengan-shared-understanding":{"type":"header","text":"4. Kurangi cognitive debt dengan shared understanding","value":"4-kurangi-cognitive-debt-dengan-shared-understanding","line":85,"column":0,"depth":2},"checklist-untuk-menghindari-cognitive-debt":{"type":"header","text":"Checklist untuk menghindari cognitive debt","value":"checklist-untuk-menghindari-cognitive-debt","line":91,"column":0,"depth":3},"5-jadikan-codebase-sendiri-context-untuk-llm":{"type":"header","text":"5. Jadikan codebase sendiri context untuk LLM","value":"5-jadikan-codebase-sendiri-context-untuk-llm","line":99,"column":0,"depth":2},"praktik-harness":{"type":"header","text":"Praktik harness","value":"praktik-harness","line":115,"column":0,"depth":3},"6-workflow-rekomendasi-untuk-ai-assisted-coding":{"type":"header","text":"6. Workflow rekomendasi untuk AI-assisted coding","value":"6-workflow-rekomendasi-untuk-ai-assisted-coding","line":123,"column":0,"depth":2},"7-hubungan-ke-artikel-lain":{"type":"header","text":"7. Hubungan ke artikel lain","value":"7-hubungan-ke-artikel-lain","line":132,"column":0,"depth":2},"ringkasannya":{"type":"header","text":"Ringkasannya","value":"ringkasannya","line":138,"column":0,"depth":2}},"children":[],"parent":"v8vcvx8qq0ha6rvthqocp2k","data":{}},"body":"\u003ch1 id=\"design-code-vocabulary-dan-bounded-context-untuk-ai-assisted-engineering\"\u003eDesign Code Vocabulary dan Bounded Context untuk AI-assisted Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#design-code-vocabulary-dan-bounded-context-untuk-ai-assisted-engineering\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"kenapa-ini-penting-di-era-llm\"\u003eKenapa ini penting di era LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-di-era-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau elo cuma lihat output AI coding dari sisi \"cepatnya bikin kode\", lo ketinggalan satu dimensi lebih penting.\u003c/p\u003e\n\u003cp\u003eCode bukan cuma instruksi mesin. Code juga adalah bahasa bersama untuk tim, domain expert, dan LLM. Kalau vocabulary codebase tidak jelas, AI bisa menghasilkan kode yang compile tapi membuat tim bingung.\u003c/p\u003e\n\u003cp\u003eArtikel Unmesh Joshi di Martin Fowler menjelaskan ini dengan bagus: \u003ca href=\"https://martinfowler.com/articles/what-is-code.html\"\u003ehttps://martinfowler.com/articles/what-is-code.html\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"fokus-utama-handbook-ini\"\u003eFokus utama handbook ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#fokus-utama-handbook-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003epastikan codebase punya vocabulary domain yang stabil,\u003c/li\u003e\n\u003cli\u003etetapkan bounded context dengan jelas,\u003c/li\u003e\n\u003cli\u003egunakan programming language sebagai alat discovery,\u003c/li\u003e\n\u003cli\u003ekurangi cognitive debt, bukan cuma technical debt,\u003c/li\u003e\n\u003cli\u003ejadikan codebase sendiri sebagai context dan harness untuk LLM.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"1-bangun-vocabulary-domain-sebelum-permintaan-kode-besar\"\u003e1. Bangun vocabulary domain sebelum permintaan kode besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-bangun-vocabulary-domain-sebelum-permintaan-kode-besar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSebelum minta LLM membuat feature, tanyakan dulu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapa istilah utama domain ini?\u003c/li\u003e\n\u003cli\u003eapa bedanya \u003ccode\u003eOrder\u003c/code\u003e vs \u003ccode\u003eCart\u003c/code\u003e vs \u003ccode\u003eShipment\u003c/code\u003e?\u003c/li\u003e\n\u003cli\u003eapa yang dimaksud \u003ccode\u003ePayment\u003c/code\u003e di sini: authorized, captured, settled?\u003c/li\u003e\n\u003cli\u003eapakah \u003ccode\u003eCustomer\u003c/code\u003e berarti individu, account, atau entitas legal?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau vocabulary belum jelas, jangan langsung minta LLM coding. Mulai dari definisi domain, bukan dari endpoint.\u003c/p\u003e\n\u003ch3 id=\"praktik-yang-masuk-akal\"\u003ePraktik yang masuk akal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktik-yang-masuk-akal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ebuat glossary singkat \u003ccode\u003e\u0026#x3C;domain\u003e/vocabulary.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003edefinisikan noun penting dan batas konteksnya\u003c/li\u003e\n\u003cli\u003ejangan biarkan istilah serupa dipakai bergantian tanpa alasan\u003c/li\u003e\n\u003cli\u003egunakan nama yang membawa konsekuensi desain\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-tetapkan-bounded-context-secara-eksplisit\"\u003e2. Tetapkan bounded context secara eksplisit\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-tetapkan-bounded-context-secara-eksplisit\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSatu kata bisa punya banyak arti di organisasi besar. Itulah odd word disease.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edi e-commerce, \u003ccode\u003eCustomer\u003c/code\u003e bisa berarti pembeli.\u003c/li\u003e\n\u003cli\u003edi CRM, \u003ccode\u003eCustomer\u003c/code\u003e bisa berarti account bisnis.\u003c/li\u003e\n\u003cli\u003edi support, \u003ccode\u003eCustomer\u003c/code\u003e bisa berarti user yang kontak helpdesk.\u003c/li\u003e\n\u003cli\u003edi billing, \u003ccode\u003eCustomer\u003c/code\u003e bisa berarti entitas yang ditagih.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSebelum menambahkan abstraction baru, tanyakan: apakah vocabulary ini valid di bounded context ini?\u003c/p\u003e\n\u003ch3 id=\"teknik-praktis\"\u003eTeknik praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#teknik-praktis\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003edokumentasikan context contract untuk modul besar,\u003c/li\u003e\n\u003cli\u003ecatat di mana model \u003ccode\u003eCustomer\u003c/code\u003e itu berlaku,\u003c/li\u003e\n\u003cli\u003episahkan model jika artinya berbeda,\u003c/li\u003e\n\u003cli\u003egunakan boundary names seperti \u003ccode\u003eorders\u003c/code\u003e, \u003ccode\u003ebilling\u003c/code\u003e, \u003ccode\u003esupport\u003c/code\u003e, \u003ccode\u003ecatalog\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-gunakan-code-sebagai-alat-discovery-bukan-cuma-hasil-prompt\"\u003e3. Gunakan code sebagai alat discovery, bukan cuma hasil prompt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-gunakan-code-sebagai-alat-discovery-bukan-cuma-hasil-prompt\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProgramming language membantu kita menemukan desain.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGo memaksa kita pikir tentang concurrency.\u003c/li\u003e\n\u003cli\u003eJava memaksa kita pikir tentang objek dan interface.\u003c/li\u003e\n\u003cli\u003eRust memaksa kita pikir tentang ownership.\u003c/li\u003e\n\u003cli\u003eFP memaksa kita pikir tentang transformasi data.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi jangan pasif. Bahkan jika LLM generate code, manusia harus aktif memilih language constructs dan memakainya sebagai medium berpikir.\u003c/p\u003e\n\u003ch3 id=\"aman-dipakai\"\u003eAman dipakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#aman-dipakai\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003egunakan pola bahasa untuk menegaskan batas: type, enum, interface, module,\u003c/li\u003e\n\u003cli\u003egunakan types dan invariants untuk membuat vocabulary konkret,\u003c/li\u003e\n\u003cli\u003ejangan biarkan LLM menumpuk abstraction tanpa alasan nyata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-kurangi-cognitive-debt-dengan-shared-understanding\"\u003e4. Kurangi cognitive debt dengan shared understanding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-kurangi-cognitive-debt-dengan-shared-understanding\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCognitive debt terjadi ketika codebase punya vocabulary namun tim tidak paham maknanya.\u003c/p\u003e\n\u003cp\u003eLLM bisa mempercepat vocabulary masuk ke codebase. Itu berbahaya kalau vocabulary itu tidak disepakati.\u003c/p\u003e\n\u003ch3 id=\"checklist-untuk-menghindari-cognitive-debt\"\u003eChecklist untuk menghindari cognitive debt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#checklist-untuk-menghindari-cognitive-debt\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003epastikan setiap abstraction punya alasan domain yang jelas,\u003c/li\u003e\n\u003cli\u003ejangan pakai pattern enterprise hanya karena terdengar profesional,\u003c/li\u003e\n\u003cli\u003etulis tests yang bukan cuma validate behavior, tapi juga dokumentasikan intent,\u003c/li\u003e\n\u003cli\u003ereview code bukan hanya untuk bug, tapi juga untuk model konseptual,\u003c/li\u003e\n\u003cli\u003etanyakan: apakah nama-nama ini sesuai dengan domain lokal?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-jadikan-codebase-sendiri-context-untuk-llm\"\u003e5. Jadikan codebase sendiri context untuk LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-jadikan-codebase-sendiri-context-untuk-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCodebase yang baik adalah context permanen.\u003c/p\u003e\n\u003cp\u003eKalau LLM bekerja di repo yang punya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enama-nama konsisten,\u003c/li\u003e\n\u003cli\u003eabstraction yang jelas,\u003c/li\u003e\n\u003cli\u003etests yang mewakili behavior,\u003c/li\u003e\n\u003cli\u003etypes yang mengekspresikan kontrak,\u003c/li\u003e\n\u003cli\u003eboundary yang bersih,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka output LLM akan lebih mudah diprediksi.\u003c/p\u003e\n\u003cp\u003eIni penting: prompt bagus saja tidak cukup jika repo itu sendiri tidak punya bahasa yang jelas.\u003c/p\u003e\n\u003ch3 id=\"praktik-harness\"\u003ePraktik harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktik-harness\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ejaga agar module naming dan domain naming selaras,\u003c/li\u003e\n\u003cli\u003epertahankan file struktur yang mencerminkan bounded context,\u003c/li\u003e\n\u003cli\u003elevelkan antarmuka publik dari internal detail,\u003c/li\u003e\n\u003cli\u003ebuat test suite yang memverifikasi intent, bukan hanya implementation,\u003c/li\u003e\n\u003cli\u003egunakan commit message dan PR description untuk menjelaskan vocabulary yang baru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-workflow-rekomendasi-untuk-ai-assisted-coding\"\u003e6. Workflow rekomendasi untuk AI-assisted coding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-workflow-rekomendasi-untuk-ai-assisted-coding\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003edesain vocabulary dan bounded context.\u003c/li\u003e\n\u003cli\u003etulis spec singkat yang mencakup domain language.\u003c/li\u003e\n\u003cli\u003ebuat plan kecil-kecil yang tetap memegang vocabulary.\u003c/li\u003e\n\u003cli\u003esuruh LLM generate kode di langkah-langkah terbatas.\u003c/li\u003e\n\u003cli\u003etes dan review tidak sekadar correctness, tapi juga vocabulary.\u003c/li\u003e\n\u003cli\u003eiterasi sampai codebase makin jelas, bukan makin kompleks.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"7-hubungan-ke-artikel-lain\"\u003e7. Hubungan ke artikel lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-hubungan-ke-artikel-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.interrogatory-llm\"\u003eInterrogatory LLM: LLM sebagai pewawancara konteks\u003c/a\u003e — konteks digali dari manusia.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.prompt-engineering.harper-llm-codegen-workflow\"\u003eHarper Reed: LLM codegen workflow\u003c/a\u003e — konteks itu dijadikan spec, plan, execution.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding.what-is-code\"\u003eWhat Is Code? — code sebagai vocabulary dan model konsep\u003c/a\u003e — code harus menjaga vocabulary supaya LLM tidak menambah cognitive debt.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"ringkasannya\"\u003eRingkasannya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasannya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLLM mungkin membuat instruksi mesin jadi murah. Nilai engineer tetap ada di:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ememilih vocabulary yang tepat,\u003c/li\u003e\n\u003cli\u003emenegaskan bounded context,\u003c/li\u003e\n\u003cli\u003emembangun shared understanding,\u003c/li\u003e\n\u003cli\u003emenjaga codebase tetap jadi context yang bisa digunakan lagi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan hanya tanya \"bikin kode ini\". Tanya juga \"bahasa apa yang kita pakai di sini?\" dan \"siapa yang akan paham model ini nanti?\".\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehandbook (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecode (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evocabulary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edomain-driven-design (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"cr
