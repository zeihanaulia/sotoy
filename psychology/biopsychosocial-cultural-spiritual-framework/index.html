sychology.biopsychosocial-cultural-spiritual-framework"},{"from":{"fname":"notes.psychology.layer-spiritual","id":"notes.psychology.layer-spiritual","vaultName":"vault"},"type":"backlink","position":{"start":{"line":24,"column":11,"offset":1156},"end":{"line":24,"column":76,"offset":1221},"indent":[]},"value":"notes.psychology.biopsychosocial-cultural-spiritual-framework"}],"anchors":{"biopsychosocial-cultural-spiritual-framework":{"type":"header","text":"Biopsychosocial-Cultural-Spiritual Framework","value":"biopsychosocial-cultural-spiritual-framework","line":14,"column":0,"depth":1},"overview":{"type":"header","text":"Overview","value":"overview","line":16,"column":0,"depth":2},"the-five-layers-of-the-system":{"type":"header","text":"The Five Layers of the System","value":"the-five-layers-of-the-system","line":19,"column":0,"depth":2},"1-biological-biologi":{"type":"header","text":"1. Biological (Biologi)","value":"1-biological-biologi","line":21,"column":0,"depth":3},"2-psychological-psikologi":{"type":"header","text":"2. Psychological (Psikologi)","value":"2-psychological-psikologi","line":26,"column":0,"depth":3},"3-social-sosial":{"type":"header","text":"3. Social (Sosial)","value":"3-social-sosial","line":31,"column":0,"depth":3},"4-cultural-kultural":{"type":"header","text":"4. Cultural (Kultural)","value":"4-cultural-kultural","line":36,"column":0,"depth":3},"5-spiritual-spiritualvalue":{"type":"header","text":"5. Spiritual (Spiritual/Value)","value":"5-spiritual-spiritualvalue","line":41,"column":0,"depth":3},"synthesis-the-systemic-view":{"type":"header","text":"Synthesis: The Systemic View","value":"synthesis-the-systemic-view","line":46,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"biopsychosocial-cultural-spiritual-framework\"\u003eBiopsychosocial-Cultural-Spiritual Framework\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#biopsychosocial-cultural-spiritual-framework\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"biopsychosocial-cultural-spiritual-framework-1\"\u003eBiopsychosocial-Cultural-Spiritual Framework\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#biopsychosocial-cultural-spiritual-framework-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKesehatan jiwa bukan sekadar masalah pikiran, melainkan hasil interaksi kompleks antara lima layer utama. Memperbaiki pola batin tidak bisa dilakukan hanya dari satu pintu; jika satu layer bocor, layer lainnya akan terasa lebih berat.\u003c/p\u003e\n\u003ch2 id=\"the-five-layers-of-the-system\"\u003eThe Five Layers of the System\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-five-layers-of-the-system\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-biological-biologi\"\u003e1. Biological (Biologi)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-biological-biologi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOtak adalah organ tubuh, bukan awan abstrak. Kondisi fisik menentukan kapasitas dasar sistem saraf untuk tidak reaktif.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFaktor Kunci\u003c/strong\u003e: Gizi, kualitas tidur, aktivitas fisik, kesehatan lingkungan (polusi), dan pola hidup (sedentary behavior).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDampak\u003c/strong\u003e: Tubuh yang lelah, kurang gerak, atau \u003cem\u003eover-stimulated\u003c/em\u003e (doomscrolling) membuat otak lebih mudah masuk mode defensif dan reaktif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-psychological-psikologi\"\u003e2. Psychological (Psikologi)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-psychological-psikologi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBerfokus pada template reaksi yang terbentuk dari pengalaman masa lalu.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFaktor Kunci\u003c/strong\u003e: \u003cem\u003eAdverse Childhood Events\u003c/em\u003e (ACEs), trauma yang belum diproses, dan mekanisme \u003cem\u003ecoping\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDampak\u003c/strong\u003e: Trauma yang tidak diproses menjadi template reaksi (misal: \"peduli = jebakan\").\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-social-sosial\"\u003e3. Social (Sosial)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-social-sosial\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLingkungan yang memberikan feedback terhadap perilaku kita.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFaktor Kunci\u003c/strong\u003e: Kualitas pertemanan, dukungan sosial, dan kehadiran mentor/teman yang memberikan feedback sehat (bukan sekadar \u003cem\u003etoxic positivity\u003c/em\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDampak\u003c/strong\u003e: Lingkungan yang hanya mengafirmasi luka akan mengunci individu dalam pola berulang.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-cultural-kultural\"\u003e4. Cultural (Kultural)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-cultural-kultural\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSoftware tak terlihat berupa norma, mitos, dan nilai budaya.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFaktor Kunci\u003c/strong\u003e: Norma gender, ekspektasi keluarga, dan mitos budaya (misal: \"sabar\" yang digunakan untuk membenarkan eksploitasi).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDampak\u003c/strong\u003e: Budaya bisa membuat pola sakit terlihat normal atau membuat perilaku sehat terlihat memalukan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-spiritual-spiritualvalue\"\u003e5. Spiritual (Spiritual/Value)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-spiritual-spiritualvalue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSistem nilai yang menjadi kompas dan rem saat ego mulai membenarkan diri.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFaktor Kunci\u003c/strong\u003e: Nilai hidup, integritas, dan tujuan eksistensial.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDampak\u003c/strong\u003e: Value yang kabur membuat ego mudah melakukan rasionalisasi atas perilaku buruk.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"synthesis-the-systemic-view\"\u003eSynthesis: The Systemic View\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#synthesis-the-systemic-view\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFixing diri adalah membangun ekosistem baru. Jika seseorang ingin memutus pola \"takut tampil\" atau \"dingin dalam relasi\", ia harus memeriksa kelima layer ini secara simultan.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Kita bukan sekadar label (misal: \"pemalu\" atau \"narsistik\"), melainkan sistem yang terdiri dari tubuh, luka, lingkungan, budaya, dan nilai.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.social-maturity-narcissism\"\u003eSocial Maturity and Narcissism Reduction\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.psychology.biological-social-pattern-fixing\"\u003eBiological and Social Factors in Pattern Fixing\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class
