:[]},"value":"notes.software-architechture.bun-rewrite-oracle"},{"from":{"fname":"daily.journal.2026.05.11","id":"daily.journal.2026.05.11","vaultName":"vault"},"type":"backlink","position":{"start":{"line":13,"column":3,"offset":946},"end":{"line":13,"column":54,"offset":997},"indent":[]},"value":"notes.software-architechture.bun-rewrite-oracle"}],"anchors":{"konteks":{"type":"header","text":"Konteks","value":"konteks","line":19,"column":0,"depth":2},"klaim-utama-rhys":{"type":"header","text":"Klaim utama Rhys","value":"klaim-utama-rhys","line":26,"column":0,"depth":2},"kenapa-ini-penting-buat-bun-port":{"type":"header","text":"Kenapa ini penting buat Bun port?","value":"kenapa-ini-penting-buat-bun-port","line":35,"column":0,"depth":2},"reply-yang-paling-penting":{"type":"header","text":"Reply yang paling penting","value":"reply-yang-paling-penting","line":47,"column":0,"depth":2},"david-fowler":{"type":"header","text":"David Fowler","value":"david-fowler","line":49,"column":0,"depth":3},"yeyito":{"type":"header","text":"Yeyito","value":"yeyito","line":54,"column":0,"depth":3},"lifcc":{"type":"header","text":"lifcc","value":"lifcc","line":61,"column":0,"depth":3},"nathan-oyler":{"type":"header","text":"Nathan Oyler","value":"nathan-oyler","line":65,"column":0,"depth":3},"debat-utama":{"type":"header","text":"Debat utama","value":"debat-utama","line":69,"column":0,"depth":2},"arah-diskusi":{"type":"header","text":"Arah diskusi","value":"arah-diskusi","line":83,"column":0,"depth":2},"insight-besar":{"type":"header","text":"Insight besar","value":"insight-besar","line":94,"column":0,"depth":2},"kaitan":{"type":"header","text":"Kaitan","value":"kaitan","line":103,"column":0,"depth":2}},"children":[],"parent":"notes.software-architechture","data":{}},"body":"\u003ch1 id=\"bun-rewrite-zig--rust-oracle-test-dan-validasi-independen\"\u003eBun rewrite Zig → Rust: oracle test dan validasi independen\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bun-rewrite-zig--rust-oracle-test-dan-validasi-independen\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread Rhys Sullivan ini masih sangat nyambung ke diskusi Bun rewrite.\nBukan lagi soal arsitektur porting, atau syarat merge, tetapi soal epistemologi rewrite: bagaimana kita tahu bahwa port itu benar?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTweet: \u003ca href=\"https://x.com/RhysSullivan/status/2053238350648406378\"\u003ehttps://x.com/RhysSullivan/status/2053238350648406378\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"klaim-utama-rhys\"\u003eKlaim utama Rhys\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#klaim-utama-rhys\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRhys menempatkan nilai tes sebagai sumber kebenaran yang lebih independen daripada implementasi.\nIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erewrite Zig → Rust harus divalidasi oleh tests yang tidak ikut ditulis ulang bersama implementasinya.\u003c/li\u003e\n\u003cli\u003eitu membuat tes berfungsi sebagai oracle eksternal.\u003c/li\u003e\n\u003cli\u003etanpa oracle itu, rewrite bisa terasa \"lulus\" hanya karena kode dan tes tumbuh bersama.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting-buat-bun-port\"\u003eKenapa ini penting buat Bun port?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-bun-port\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni langsung nyambung ke Bun karena portnya bukan refactor kecil. Kalau implementasi baru dan test sama-sama ikut berubah, kita tidak punya basis perbandingan yang kuat.\u003c/p\u003e\n\u003cp\u003eRhys memberi satu jawaban sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau test suite tetap, maka kita punya referensi behavior yang relatif lebih netral,\u003c/li\u003e\n\u003cli\u003ekalau test suite ikut berubah, kita hanya punya narasi internal implementasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu penting untuk cabang B sebelumnya: measurable better.\nTanpa oracle independen, \"lebih baik\" bisa jadi sekadar wishful thinking.\u003c/p\u003e\n\u003ch2 id=\"reply-yang-paling-penting\"\u003eReply yang paling penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reply-yang-paling-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"david-fowler\"\u003eDavid Fowler\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#david-fowler\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDia menambahkan bahwa test harus \"really good\".\nKalau tests dangkal, agent atau implementasi baru bisa membohongi kita.\nJadi bukan hanya \"tests terpisah\", tetapi \"tests terpisah yang susah digame\".\u003c/p\u003e\n\u003ch3 id=\"yeyito\"\u003eYeyito\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yeyito\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDia merumuskannya dengan tajam:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eif the agent rewrites implementation and the oracle in the same mental language, you don't get verification, you get a very confident pact between two bugs.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting karena dia menggarisbawahi risiko co-adaptation antara implementasi dan tes.\u003c/p\u003e\n\u003ch3 id=\"lifcc\"\u003elifcc\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lifcc\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenurutnya yang utama adalah behavior, bukan bahasa atau struktur internal.\nTests harus mengunci perilaku, bukan representasi implementasi.\u003c/p\u003e\n\u003ch3 id=\"nathan-oyler\"\u003eNathan Oyler\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#nathan-oyler\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDia menggarisbawahi nilai dari memiliki implementasi lama yang tetap bisa dijalankan sebagai baseline hidup.\nItu memberi dua jenis oracle: test suite dan runtime legacy.\u003c/p\u003e\n\u003ch2 id=\"debat-utama\"\u003eDebat utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#debat-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDebat sejatinya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah test harus ditulis di bahasa/metode yang berbeda? (heuristik Rhys)\u003c/li\u003e\n\u003cli\u003eatau yang lebih penting adalah apakah test mengunci \u003cstrong\u003ebehavior eksternal\u003c/strong\u003e?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDari thread, jawaban tertumpu ke arah kedua:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebahasa berbeda membantu,\u003c/li\u003e\n\u003cli\u003etetapi yang lebih kuat adalah tests yang menguji behavior, bukan internals.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau tests bergantung pada shape internal, mereka bisa rusak saat implementasi diganti.\u003c/p\u003e\n\u003ch2 id=\"arah-diskusi\"\u003eArah diskusi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arah-diskusi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDiskusinya mengarah ke epistemologi rewrite:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erewrite perlu oracle eksternal,\u003c/li\u003e\n\u003cli\u003eoracle itu bisa berupa test suite independen,\u003c/li\u003e\n\u003cli\u003etapi test harus berkualitas dan sulit dipuaskan oleh implementasi palsu,\u003c/li\u003e\n\u003cli\u003edan legacy implementation yang masih jalan bisa menjadi oracle tambahan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan kata lain, thread ini menempatkan testing bukan sebagai ritual, tetapi sebagai salah satu cara kita tahu bahwa port Bun benar-benar berhasil.\u003c/p\u003e\n\u003ch2 id=\"insight-besar\"\u003eInsight besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-besar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRhys mempertegas satu hal penting:\n\u003cstrong\u003erewrite besar harus dinilai bukan hanya dari apakah implementasi baru lulus tests, tetapi dari apakah tests itu tetap berfungsi sebagai guru eksternal.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eKalau implementasi dan tests sama-sama \"direwrite\", kita kehilangan sudut pandang verifikasi.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eIni bukan soal bahasa berbeda. Ini soal membedakan antara implementasi yang berubah dan oracle yang bertahan.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"kaitan\"\u003eKaitan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kaitan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.software-architechture.bun-rust-porting\"\u003eBun porting dari Zig ke Rust: masalah layering, crates, dan tagged pointer\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124520\"\u003eRewrite sistem low-level hanya sah jika terukur lebih baik secara performa, memori, dan stabilitas\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260511124521\"\u003eHand-porting besar lebih efektif jika breadth-first dan tulis semua dulu\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #7a6a4f;\" href=\"/sotoy/notes/tags.software-architechture\"\u003esoftware-architechture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"priv
