an-identitas-peer":{"type":"header","text":"Failure 1: Salah menyimpulkan identitas peer","value":"failure-1-salah-menyimpulkan-identitas-peer","line":731,"column":0,"depth":3},"failure-2-overfitting-ke-momen-sementara":{"type":"header","text":"Failure 2: Overfitting ke momen sementara","value":"failure-2-overfitting-ke-momen-sementara","line":751,"column":0,"depth":3},"failure-3-perspective-leakage":{"type":"header","text":"Failure 3: Perspective leakage","value":"failure-3-perspective-leakage","line":771,"column":0,"depth":3},"failure-4-memory-inertia":{"type":"header","text":"Failure 4: Memory inertia","value":"failure-4-memory-inertia","line":779,"column":0,"depth":3},"failure-5-bad-peer-identity-management":{"type":"header","text":"Failure 5: Bad peer identity management","value":"failure-5-bad-peer-identity-management","line":791,"column":0,"depth":3},"16-linking-hubungan-dengan-architecture-dan-reasoning":{"type":"header","text":"16. Linking: hubungan dengan architecture dan reasoning","value":"16-linking-hubungan-dengan-architecture-dan-reasoning","line":806,"column":0,"depth":2},"17-insight-penutup":{"type":"header","text":"17. Insight penutup","value":"17-insight-penutup","line":850,"column":0,"depth":2},"18-korelasi-dengan-konsep-lain":{"type":"header","text":"18. Korelasi dengan konsep lain","value":"18-korelasi-dengan-konsep-lain","line":868,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":906,"column":0,"depth":2}},"children":[],"parent":"r970j7o3cwojzrfs80avkt5","data":{}},"body":"\u003ch1 id=\"peer-representations\"\u003ePeer Representations\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#peer-representations\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://honcho.dev/docs/v3/documentation/core-concepts/representation\"\u003ehttps://honcho.dev/docs/v3/documentation/core-concepts/representation\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e“peer representations” di Honcho = kumpulan hasil reasoning Honcho tentang satu peer dari waktu ke waktu\u003c/strong\u003e. Bukan “representation” dalam arti embedding vektor doang, dan bukan juga “profile user” sederhana.\u003c/p\u003e\n\u003cp\u003eDi sini “peer” berarti entitas yang dimodelkan Honcho: bisa user, agent, customer, student, NPC, project, atau entitas lain. “Representation” berarti state pemahaman Honcho tentang peer itu: siapa dia, apa pola perilakunya, apa yang dia pedulikan, apa konteks historisnya, dan bagaimana pemahaman itu berubah ketika message baru masuk.\u003c/p\u003e\n\u003ch2 id=\"1-pertanyaan-kunci\"\u003e1. Pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda 7 pertanyaan penting:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eApa itu peer representation secara inti?\u003c/li\u003e\n\u003cli\u003eIsi representation itu apa saja?\u003c/li\u003e\n\u003cli\u003eKenapa representation bukan sekadar memory/fact list?\u003c/li\u003e\n\u003cli\u003eApa bedanya conclusion, summary, dan peer card?\u003c/li\u003e\n\u003cli\u003eApa itu observation dan perspective-taking?\u003c/li\u003e\n\u003cli\u003eKenapa representasi bisa berbeda tergantung siapa yang mengamati?\u003c/li\u003e\n\u003cli\u003eRisiko atau failure mode-nya apa?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nPeer representation adalah “model mental” Honcho tentang satu entitas.\u003c/p\u003e\n\u003cp\u003eKalau message adalah catatan mentah, representation adalah hasil pemahaman yang dibangun dari catatan itu. Mirip manusia: elo tidak mengingat semua kalimat teman elo secara literal, tapi elo punya model tentang “dia orangnya gimana, biasanya peduli apa, punya pola apa, dan history gue sama dia apa.”\u003c/p\u003e\n\u003cp\u003eBedanya: Honcho mencoba membuat model itu secara eksplisit lewat reasoning, bukan cuma lewat ingatan kabur.\n───────────────────────────────────\u003c/p\u003e\n\u003ch2 id=\"2-definisi-inti-apa-itu-peer-representation\"\u003e2. Definisi inti: apa itu peer representation?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-definisi-inti-apa-itu-peer-representation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage-nya mendefinisikan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“A representation is the collection of reasoning Honcho has done about a peer over time.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni kalimat kunci. Representation bukan raw chat log. Representation adalah \u003cstrong\u003ekoleksi hasil reasoning\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eLalu page lanjut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It’s the continual learning about a peer over every message that’s been written to it.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya setiap message baru bisa memperbarui representation. Jadi representation itu dinamis, bukan profil statis.\u003c/p\u003e\n\u003cp\u003eFormula sederhananya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessages about / from peer\n→ reasoning\n→ premises\n→ conclusions\n→ summaries\n→ peer card\n→ peer representation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau peer-nya adalah user, representation bisa berisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- user sering minta penjelasan tajam\n- user tidak suka jawaban netral yang mengaburkan posisi\n- user tertarik AI agent, memory system, sandboxing\n- user suka struktur ide kecil yang saling dihubungkan\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau peer-nya agent, representation bisa berisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- agent ini sering bertindak sebagai coding assistant\n- agent ini berinteraksi dengan user dalam konteks debugging\n- agent ini punya pola menjawab teknis dan prosedural\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau peer-nya project, representation bisa berisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- project ini terkait sandbox security\n- concern utama: file access, environment secrets, repo-level config\n- keputusan sebelumnya: perlu env sanitization\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtomic idea-nya:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePeer representation = state yang dipelajari tentang entitas.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"3-representation-bukan-database-fakta\"\u003e3. Representation bukan “database fakta”\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-representation-bukan-database-fakta\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni penting. Banyak memory system menyimpan fakta seperti:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser uses macOS.\nUser likes Python.\nUser works on project X.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu berguna, tapi dangkal.\u003c/p\u003e\n\u003cp\u003eHoncho representation lebih kaya karena berisi hasil reasoning seperti:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is likely concerned with practical security boundaries when using coding agents.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu bukan fakta mentah. Itu kesimpulan dari beberapa interaksi.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Think of it as Honcho’s understanding of who that peer is, what they care about, and how they behave, built through formal logic rather than simple storage.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eBagian pentingnya: \u003cstrong\u003ebuilt through formal logic rather than simple storage\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eJadi representation bukan cuma daftar memory. Ia adalah struktur pemahaman yang dibangun dari:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eapa yang eksplisit dikatakan\napa yang bisa disimpulkan\npola apa yang muncul\nkontradiksi apa yang perlu direkonsiliasi\nringkasan sesi apa yang relevan\ndata biografis dasar apa yang harus tetap stabil\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDengan kata lain:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMemory biasa:\n\"apa yang pernah disimpan?\"\n\nPeer representation:\n\"apa yang sekarang Honcho pahami tentang peer ini?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"4-isi-peer-representation-tiga-artifact-utama\"\u003e4. Isi peer representation: tiga artifact utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-isi-peer-representation-tiga-artifact-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut representation terdiri dari beberapa artifact:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eConclusions\u003c/li\u003e\n\u003cli\u003eSummaries\u003c/li\u003e\n\u003cli\u003ePeer cards\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKita pecah.\u003c/p\u003e\n\u003ch2 id=\"41-conclusions-insight-hasil-reasoning\"\u003e4.1 Conclusions: insight hasil reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#41-conclusions-insight-hasil-reasoning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eConclusions adalah insight yang diturunkan lewat formal logic.\u003c/p\u003e\n\u003cp\u003ePage membagi conclusion ke beberapa tipe:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDeductive conclusions\nInductive conclusions\nAbductive conclusions\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"deductive-conclusion\"\u003eDeductive conclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#deductive-conclusion\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDeductive conclusion adalah kesimpulan yang relatif pasti berdasarkan premis.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003ePremis:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser said they use macOS.\nsandbox-exec is a macOS sandboxing tool.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDeductive conclusion:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esandbox-exec advice is relevant to this user’s environment.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDeduksi idealnya ketat: kalau premis benar, kesimpulan harus mengikuti.\u003c/p\u003e\n\u003cp\u003eDalam representation, deduksi membantu agent tidak perlu mengulang inference sederhana setiap kali.\u003c/p\u003e\n\u003ch3 id=\"inductive-conclusion\"\u003eInductive conclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inductive-conclusion\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eInductive conclusion membaca pola dari banyak message.\u003c/p\u003e\n\u003cp\u003eContoh message lintas sesi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser often asks:\n- failure mode-nya apa?\n- trade-off-nya apa?\n- logical fallacy-nya apa?\n- jangan main tengah\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eInductive conclusion:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser evaluates topics by testing assumptions, trade-offs, and failure modes.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bukan dari satu pesan, tapi dari pola.\u003c/p\u003e\n\u003cp\u003ePage memberi contoh sejenis:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“if a user frequently mentions work deadlines and rarely mentions hobbies, Honcho might inductively conclude they’re time-constrained or career-focused.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni contoh bahwa Honcho mencoba mengambil pola perilaku dari banyak sinyal.\u003c/p\u003e\n\u003ch3 id=\"abductive-conclusion\"\u003eAbductive conclusion\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#abductive-conclusion\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAbductive conclusion mencari penjelasan paling sederhana untuk perilaku yang diamati.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eObservasi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser sering curiga dokumen tanpa sitasi.\nUser sering minta cek sumber.\nUser sering membedakan fakta, opini, dan framing.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAbductive conclusion:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is concerned with epistemic reliability and source quality.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAbduction ini kuat, tapi paling rawan salah. Karena dia menjelaskan “kemungkinan sebab”, bukan kebenaran pasti.\u003c/p\u003e\n\u003cp\u003eJadi di representation, abductive conclusion harus dipahami sebagai \u003cstrong\u003ehipotesis berguna\u003c/strong\u003e, bukan fakta keras.\u003c/p\u003e\n\u003ch2 id=\"42-summaries-kompresi-session\"\u003e4.2 Summaries: kompresi session\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#42-summaries-kompresi-session\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSummaries menangkap esensi session.\u003c/p\u003e\n\u003cp\u003ePage menyebut:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Short summaries are generated every 20 messages by default, and long summaries every 60 messages.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni menarik karena Honcho tidak hanya menyimpan conclusion tentang peer, tapi juga ringkasan percakapan.\u003c/p\u003e\n\u003cp\u003eKenapa summary penting?\u003c/p\u003e\n\u003cp\u003eKarena raw chat history bisa panjang dan mahal dimasukkan ke prompt. Summary mengompresnya menjadi konteks padat.\u003c/p\u003e\n\u003cp\u003eContoh session:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser and agent discussed macOS sandbox-exec. Main concern: sandbox blocks filesystem access but does not automatically sanitize environment variables. Suggested mitigation: launch agent with clean env and restrict secrets at shell/session level.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eItu lebih berguna daripada memasukkan 100 message mentah.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eConclusion = insight tentang peer\nSummary = kompresi episode/session\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKeduanya beda.\u003c/p\u003e\n\u003cp\u003eConclusion lebih seperti “apa yang dipelajari tentang entitas”.\u003c/p\u003e\n\u003cp\u003eSummary lebih seperti “apa yang terjadi dalam sesi ini”.\u003c/p\u003e\n\u003ch2 id=\"43-peer-cards-grounding-dasar-peer\"\u003e4.3 Peer cards: grounding dasar peer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#43-peer-cards-grounding-dasar-peer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePeer card berisi informasi biografis atau identitas dasar tentang peer.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Peer cards contain key biographical information.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eLalu:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“They essentially cache the most basic information about a peer (name, occupation, interests) to ensure the model never loses its grounding.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePeer card itu seperti kartu identitas ringkas.\u003c/p\u003e\n\u003cp\u003eContoh peer card untuk user:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eName: Raka\nInterests: AI agents, economics, software architecture, Indonesian politics\nCommunication preference: Indonesian casual style, structured explanation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh peer card untuk agent:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eName: coding_agent\nRole: helps debug software projects and explain architecture\nContext: often works with user on CLI tools and sandboxing\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePeer card penting karena agent bisa kehilangan grounding kalau konteks terlalu panjang atau session sudah lama. Peer card memastikan hal-hal dasar tetap ada.\u003c/p\u003e\n\u003cp\u003eTapi hati-hati: peer card yang salah bisa sangat merusak, karena ia menjadi “identitas dasar” yang sering dipakai.\u003c/p\u003e\n\u003ch2 id=\"5-continuous-improvement-representation-terus-berubah\"\u003e5. Continuous improvement: representation terus berubah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-continuous-improvement-representation-terus-berubah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Each new message refines conclusions, updates summaries, and keeps peer cards current.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eJadi peer representation bukan snapshot sekali jadi. Ia seperti model yang terus diperbarui.\u003c/p\u003e\n\u003cp\u003eContoh perubahan:\u003c/p\u003e\n\u003cp\u003eAwal:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers concise answers.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetelah beberapa sesi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers concise answers for simple topics, but asks for deep structured dives on technical systems.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetelah lebih banyak data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers atomic, linked explanations; depth is acceptable when the topic is architectural or conceptual.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni contoh representation yang makin nuanced.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003erepresentation yang baik bukan makin panjang,\ntapi makin akurat dan kontekstual.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau cuma menumpuk memory, hasilnya bising. Kalau reasoning-nya bagus, representation harus menggabungkan, memperbaiki, dan membatasi kesimpulan.\u003c/p\u003e\n\u003ch2 id=\"6-observation-siapa-yang-diamati\"\u003e6. Observation: siapa yang diamati?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-observation-siapa-yang-diamati\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian ini penting dan agak unik.\u003c/p\u003e\n\u003cp\u003eHoncho punya konsep observation dan perspective-taking.\u003c/p\u003e\n\u003cp\u003eAda dua mode utama:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eobserve_me\nobserve_others\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"61-observe_me\"\u003e6.1 observe_me\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#61-observe_me\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePage menjelaskan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Honcho observing peers (observe_me): When enabled (default), Honcho forms a representation of the peer based on all messages they’ve sent across all sessions.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya kalau \u003ccode\u003eobserve_me\u003c/code\u003e aktif, Honcho membangun representation tentang peer berdasarkan semua message yang peer itu kirim.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eAlice sebagai peer mengirim message di banyak session.\u003c/p\u003e\n\u003cp\u003eHoncho mengamati semua message Alice.\u003c/p\u003e\n\u003cp\u003eLalu Honcho membangun representation tentang Alice.\u003c/p\u003e\n\u003cp\u003eKalau \u003ccode\u003eobserve_me: false\u003c/code\u003e, Honcho tidak melakukan reasoning tentang peer itu.\u003c/p\u003e\n\u003cp\u003eIni berguna kalau ada entitas yang tidak ingin dimodelkan karena privacy, compliance, atau noise.\u003c/p\u003e\n\u003ch3 id=\"62-observe_others\"\u003e6.2 observe_others\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#62-observe_others\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePage menjelaskan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Peers observing others (observe_others): When enabled at the session level, a peer will form representations of other peers in that session based only on messages they’ve observed.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni lebih menarik.\u003c/p\u003e\n\u003cp\u003eArtinya satu peer bisa punya representation tentang peer lain, tapi hanya berdasarkan interaksi yang dia saksikan.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession 1 dan 2:\nAlice ngobrol dengan Bob.\n\nSession 3:\nAlice ngobrol dengan Charlie.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau Bob punya \u003ccode\u003eobserve_others: true\u003c/code\u003e, Bob membangun representation tentang Alice berdasarkan session 1 dan 2 saja.\u003c/p\u003e\n\u003cp\u003eKalau Charlie punya \u003ccode\u003eobserve_others: true\u003c/code\u003e, Charlie membangun representation tentang Alice berdasarkan session 3 saja.\u003c/p\u003e\n\u003cp\u003eMaka:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eBob's representation of Alice ≠ Charlie's representation of Alice\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKenapa? Karena pengalaman mereka terhadap Alice berbeda.\u003c/p\u003e\n\u003cp\u003eIni disebut perspective-taking.\u003c/p\u003e\n\u003ch2 id=\"7-perspective-taking-kenapa-penting\"\u003e7. Perspective-taking: kenapa penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-perspective-taking-kenapa-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Why would you want peers observing others? So you can simulate stateful perspectives.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni inti konsepnya.\u003c/p\u003e\n\u003cp\u003eTanpa perspective-taking, semua agent bisa jadi omniscient. Semua agent tahu semua hal tentang semua orang. Itu tidak realistis dan bisa merusak trust.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eBob pernah debat panjang dengan Alice di session 1 dan 2.\u003c/p\u003e\n\u003cp\u003eCharlie baru bertemu Alice di session 3.\u003c/p\u003e\n\u003cp\u003eKalau Charlie tiba-tiba tahu inside joke atau konflik lama Alice-Bob, simulasi jadi rusak. Charlie seperti punya pengetahuan yang tidak pernah ia alami.\u003c/p\u003e\n\u003cp\u003eHoncho mencoba mencegah itu dengan representasi berbasis perspektif.\u003c/p\u003e\n\u003cp\u003eAtomic distinction:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eGlobal representation:\nHoncho’s overall understanding of Alice.\n\nPerspective representation:\nBob’s understanding of Alice, based only on what Bob observed.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni kuat untuk:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emulti-agent simulation\ngroup chat\nrole-playing game\ncustomer support dengan banyak agent\neducation platform\nteam collaboration\nsocial agents\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"8-contoh-konkret-alice-bob-charlie\"\u003e8. Contoh konkret: Alice, Bob, Charlie\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-contoh-konkret-alice-bob-charlie\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMisalnya ada peer:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAlice = user\nBob = AI tutor\nCharlie = AI career coach\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSession:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession 1:\nAlice belajar matematika dengan Bob.\n\nSession 2:\nAlice curhat ke Bob bahwa dia takut ujian.\n\nSession 3:\nAlice ngobrol dengan Charlie soal kerja.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation global Alice oleh Honcho:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAlice is a student who is anxious about exams and is also exploring career planning.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBob’s representation of Alice:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAlice struggles with exam anxiety and benefits from patient explanations.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCharlie’s representation of Alice:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAlice is considering career options and wants practical guidance.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKetiganya benar, tapi berbeda scope.\u003c/p\u003e\n\u003cp\u003eIni seperti manusia. Teman kuliah, bos kerja, dan terapis bisa punya model berbeda tentang orang yang sama.\u003c/p\u003e\n\u003cp\u003eHoncho membuat perbedaan ini eksplisit.\u003c/p\u003e\n\u003ch2 id=\"9-kenapa-representations-work-menurut-honcho\"\u003e9. Kenapa representations “work” menurut Honcho?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-kenapa-representations-work-menurut-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Statefulness is simulated through reconstruction of the past.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni klaim filosofis yang penting.\u003c/p\u003e\n\u003cp\u003eAgent tidak benar-benar “punya masa lalu” seperti manusia. Agent mensimulasikan statefulness dengan cara merekonstruksi masa lalu yang relevan.\u003c/p\u003e\n\u003cp\u003eRAG biasa merekonstruksi masa lalu dengan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esearch facts\nretrieve similar chunks\nhope LLM connects the dots\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho ingin merekonstruksi masa lalu dengan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ereason over past data\nstore conclusions\nhandle contradictions\nsurface implicit insights\nassemble relevant context\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Honcho reconstructs through reasoning about the past exhaustively, leaving much less to chance.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya: jangan serahkan semua koneksi makna ke LLM saat inference. Sebagian koneksi sudah dibuat sebelumnya lewat reasoning background.\u003c/p\u003e\n\u003cp\u003eIni logis. Kalau agent baru “berpikir dari nol” setiap kali user bertanya, agent mudah lupa atau inconsistent. Kalau reasoning sudah dikompresi menjadi representation, agent punya state yang lebih stabil.\u003c/p\u003e\n\u003ch2 id=\"10-contoh-implicit-insight-dalam-representation\"\u003e10. Contoh implicit insight dalam representation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-contoh-implicit-insight-dalam-representation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage memberi contoh:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“If a user mentions they’re saving for a house in one session and complains about subscription costs in another, Honcho can conclude they’re budget-conscious without anyone saying it.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni contoh bagus.\u003c/p\u003e\n\u003cp\u003eRaw data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession A:\nUser is saving for a house.\n\nSession B:\nUser complains about subscription costs.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is likely budget-conscious.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni tidak eksplisit. Tapi berguna.\u003c/p\u003e\n\u003cp\u003eKalau agent nanti menyarankan tool SaaS, ia bisa mempertimbangkan harga.\u003c/p\u003e\n\u003cp\u003eMisalnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eInstead of recommending expensive enterprise software, suggest low-cost or open-source options first.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eInilah nilai representation: mengubah potongan masa lalu menjadi konteks tindakan.\u003c/p\u003e\n\u003ch2 id=\"11-contradiction-handling\"\u003e11. Contradiction handling\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-contradiction-handling\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage juga bilang reasoning bisa menangani kontradiksi:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“when new information conflicts with old conclusions, it reconciles them instead of just accumulating more data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting karena memory yang hanya menumpuk fakta bisa kacau.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eMemory lama:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers JavaScript.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMemory baru:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser now prefers TypeScript for production code.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSistem buruk akan menyimpan keduanya tanpa konteks.\u003c/p\u003e\n\u003cp\u003eRepresentation yang baik harus merekonsiliasi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser previously used JavaScript, but currently prefers TypeScript for production projects.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePreference depends on context: JavaScript for quick scripts, TypeScript for production.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni jauh lebih berguna daripada daftar fakta yang saling tabrakan.\u003c/p\u003e\n\u003ch2 id=\"12-prediction-under-uncertainty\"\u003e12. Prediction under uncertainty\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-prediction-under-uncertainty\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut reasoning memungkinkan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“prediction under uncertainty”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMaksudnya representation bisa membantu agent menebak hal yang mungkin relevan meski data tidak lengkap.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eRepresentation:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is budget-conscious.\nUser prefers open-source tools.\nUser dislikes vendor lock-in.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKetika user bertanya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Tool memory agent enaknya pakai apa?\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent bisa memprioritaskan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elocal-first / open-source / self-hosted options\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi ini harus hati-hati. Prediction under uncertainty bukan izin untuk sok tahu. Seharusnya dipakai sebagai soft bias, bukan asumsi keras.\u003c/p\u003e\n\u003cp\u003eKalimat sehatnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eGiven your prior preference for local-first setups, ByteRover or Holographic may fit better.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBukan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eYou definitely only want local tools.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"13-representation-vs-raw-memory-vs-summary-vs-profile\"\u003e13. Representation vs raw memory vs summary vs profile\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-representation-vs-raw-memory-vs-summary-vs-profile\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBiar bersih, bedakan empat hal ini.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRaw memory:\nMessage mentah yang pernah terjadi.\n\nSummary:\nRingkasan session atau percakapan.\n\nProfile / peer card:\nData dasar tentang peer.\n\nRepresentation:\nGabungan conclusions, summaries, peer cards, dan reasoning artifacts tentang peer.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eRaw memory:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser said: \"Jangan main tengah lah soal ginian.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSummary:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eThe user criticized vague neutrality and asked for a clearer judgment.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePeer card:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers direct, clear analysis.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser tends to value decisive reasoning, especially in political/economic analysis, and dislikes evasive neutrality when evidence supports a clear judgment.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation lebih kaya karena menghubungkan banyak artifact.\u003c/p\u003e\n\u003ch2 id=\"14-kenapa-ini-penting-untuk-ai-agent\"\u003e14. Kenapa ini penting untuk AI agent?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-kenapa-ini-penting-untuk-ai-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent yang tidak punya peer representation akan sering seperti ini:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser: Lanjut yang kemarin.\nAgent: Bisa jelaskan maksudnya?\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent dengan representation bisa lebih seperti:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser: Lanjut yang kemarin.\nAgent: Kemarin kita bahas sandbox-exec, boundary file access, dan risiko env secret leakage. Bagian yang belum selesai adalah setup Codex per repo vs global.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePerbedaannya bukan sekadar ingat keyword. Agent punya model konteks.\u003c/p\u003e\n\u003cp\u003eUntuk agent jangka panjang, representation membantu:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- mempertahankan preferensi user\n- mengingat keputusan project\n- memahami relasi antar peer\n- menjaga continuity antar session\n- menghindari pengulangan\n- memberi saran lebih sesuai konteks\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"15-failure-mode-peer-representation\"\u003e15. Failure mode peer representation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-failure-mode-peer-representation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSistem seperti ini kuat, tapi rawan beberapa masalah.\u003c/p\u003e\n\u003ch3 id=\"failure-1-salah-menyimpulkan-identitas-peer\"\u003eFailure 1: Salah menyimpulkan identitas peer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-1-salah-menyimpulkan-identitas-peer\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eUser sering baca artikel ekonomi.\u003c/p\u003e\n\u003cp\u003eKesimpulan salah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is an economist.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYang lebih aman:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser often analyzes economic and policy topics.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation harus membedakan “interest” dan “identity”.\u003c/p\u003e\n\u003ch3 id=\"failure-2-overfitting-ke-momen-sementara\"\u003eFailure 2: Overfitting ke momen sementara\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-2-overfitting-ke-momen-sementara\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUser bilang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Jawab pendek, gue lagi buru-buru.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation salah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser always prefers short answers.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation sehat:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser may prefer short answers in time-constrained situations.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"failure-3-perspective-leakage\"\u003eFailure 3: Perspective leakage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-3-perspective-leakage\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCharlie tidak pernah ikut session lama Alice-Bob, tapi tiba-tiba tahu konflik mereka.\u003c/p\u003e\n\u003cp\u003eIni melanggar perspective-taking.\u003c/p\u003e\n\u003cp\u003eDalam multi-agent, leakage semacam ini bikin user merasa sistem “aneh” atau terlalu tahu.\u003c/p\u003e\n\u003ch3 id=\"failure-4-memory-inertia\"\u003eFailure 4: Memory inertia\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-4-memory-inertia\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRepresentation lama tidak cepat berubah.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eDulu user beginner.\u003c/p\u003e\n\u003cp\u003eSekarang user advanced.\u003c/p\u003e\n\u003cp\u003eKalau representation masih menganggap user beginner, agent akan terus menjelaskan terlalu dasar.\u003c/p\u003e\n\u003ch3 id=\"failure-5-bad-peer-identity-management\"\u003eFailure 5: Bad peer identity management\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-5-bad-peer-identity-management\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau user yang sama dibuat jadi banyak peer ID:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eraka\nraka_1\nuser_raka\nraka@gmail.com\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRepresentation terpecah. Agent jadi tidak punya continuity penuh.\u003c/p\u003e\n\u003cp\u003eSebaliknya, kalau dua user berbeda memakai peer ID yang sama, representation tercampur. Ini lebih berbahaya.\u003c/p\u003e\n\u003ch2 id=\"16-linking-hubungan-dengan-architecture-dan-reasoning\"\u003e16. Linking: hubungan dengan architecture dan reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-linking-hubungan-dengan-architecture-dan-reasoning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSekarang kita hubungkan ke konsep sebelumnya.\u003c/p\u003e\n\u003cp\u003eDi arsitektur Honcho:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace → Peers → Sessions → Messages\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoning memproses messages.\u003c/p\u003e\n\u003cp\u003ePeer representation adalah hasil yang tersimpan.\u003c/p\u003e\n\u003cp\u003eFlow-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePeer mengirim message dalam session\n→ message disimpan\n→ reasoning berjalan\n→ conclusions / summaries / peer cards dibuat\n→ representation peer diperbarui\n→ agent mengambil context dari representation\n→ agent menjawab lebih stateful\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eArchitecture = bentuk sistem\nReasoning = mesin pengolah\nRepresentation = hasil belajar\nContext endpoint = cara hasil itu dipakai agent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau diibaratkan tubuh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessages = pengalaman\nReasoning = proses berpikir/refleksi\nRepresentation = ingatan terstruktur\nContext = apa yang diingat saat perlu bertindak\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"17-insight-penutup\"\u003e17. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#17-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nKesalahan umum memahami peer representation adalah mengira ini cuma “profil user otomatis”.\u003c/p\u003e\n\u003cp\u003eLebih tepat: peer representation adalah \u003cstrong\u003estate interpretatif\u003c/strong\u003e tentang entitas, dibangun dari semua message yang relevan, lalu terus diperbarui melalui reasoning.\u003c/p\u003e\n\u003cp\u003eElo sudah paham kalau bisa membedakan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ePeer = siapa/apa yang dimodelkan\u003c/li\u003e\n\u003cli\u003eMessage = bukti mentah\u003c/li\u003e\n\u003cli\u003eReasoning = proses menarik makna\u003c/li\u003e\n\u003cli\u003eConclusion = insight\u003c/li\u003e\n\u003cli\u003eSummary = kompresi session\u003c/li\u003e\n\u003cli\u003ePeer card = grounding dasar\u003c/li\u003e\n\u003cli\u003eRepresentation = gabungan state yang dipakai agent\n───────────────────────────────────\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"18-korelasi-dengan-konsep-lain\"\u003e18. Korelasi dengan konsep lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#18-korelasi-dengan-konsep-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonsep pertama: \u003cstrong\u003emental model\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eManusia punya mental model tentang orang lain. Elo tahu teman elo biasanya suka apa, sensitif soal apa, gaya komunikasinya bagaimana. Peer representation mencoba membuat mental model itu eksplisit untuk agent.\u003c/p\u003e\n\u003cp\u003eBedanya: mental model manusia sering kabur dan emosional. Honcho ingin membuatnya lebih terstruktur lewat reasoning artifacts.\u003c/p\u003e\n\u003cp\u003eKonsep kedua: \u003cstrong\u003eCRM customer profile\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eCRM menyimpan riwayat customer, preferensi, ticket, status, dan catatan. Peer representation mirip CRM untuk AI agent.\u003c/p\u003e\n\u003cp\u003eBedanya: CRM biasanya fact-based dan human-readable. Peer representation lebih aktif: ia bisa menyimpan conclusions, pola, dan perspektif antar peer.\u003c/p\u003e\n\u003cp\u003eKonsep ketiga: \u003cstrong\u003eevent-sourced projection\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eDalam event sourcing:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eevents → projection/state\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi Honcho:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessages → reasoning → peer representation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBedanya: event sourcing biasanya deterministik. Honcho interpretatif karena memakai reasoning model.\u003c/p\u003e\n\u003cp\u003eKonsep keempat: \u003cstrong\u003eZettelkasten\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eZettelkasten membangun pemahaman dari banyak catatan kecil yang saling terhubung. Peer representation juga begitu: message kecil menjadi premise, conclusion, summary, lalu membentuk state.\u003c/p\u003e\n\u003cp\u003eBedanya: Zettelkasten biasanya idea-centric. Peer representation entity-centric. Fokusnya bukan cuma “ide ini berhubungan dengan ide apa”, tapi “entitas ini sekarang dipahami sebagai apa berdasarkan sejarah interaksinya.”\u003c/p\u003e\n\u003cp\u003eKesimpulan pendeknya: \u003cstrong\u003epeer representation adalah pusat memory Honcho: bukan tempat menyimpan semua chat, tapi model yang terus diperbarui tentang peer, berisi conclusion, summary, dan peer card, termasuk perspektif berbeda tergantung siapa yang mengamati.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.reasoning\"\u003eReasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.design-patterns\"\u003eHoncho Design Patterns\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ememory (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.reasoning\"\u003eReasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.06.03\"\u003e2026-06-03\u003c/a\u003e\u003
