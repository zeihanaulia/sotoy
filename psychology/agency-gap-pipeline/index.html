ps":{"note":{"id":"notes.psychology.agency-gap-pipeline","title":"Agency Gap and Public Contribution Pipeline","description":"Mengatasi celah antara memiliki insight privat dan memberikan kontribusi publik.","tags":["psychology","agency","communication","productivity"],"custom":{"description":"Mengatasi celah antara memiliki insight privat dan memberikan kontribusi publik."},"fname":"notes.psychology.agency-gap-pipeline","type":"note","vault":{"fsPath":"vault"},"contentHash":"7aa08b685d9ed7cf6936a781fd5d5f45","updated":1782198658998,"created":1782198658998,"desc":"","links":[{"type":"frontmatterTag","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"tags.psychology","alias":"psychology","xvault":false,"to":{"fname":"tags.psychology"}},{"type":"frontmatterTag","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"tags.agency","alias":"agency","xvault":false,"to":{"fname":"tags.agency"}},{"type":"frontmatterTag","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"tags.communication","alias":"communication","xvault":false,"to":{"fname":"tags.communication"}},{"type":"frontmatterTag","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"tags.productivity","alias":"productivity","xvault":false,"to":{"fname":"tags.productivity"}},{"type":"wiki","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"notes.psychology.social-maturity-narcissism","position":{"start":{"line":29,"column":11,"offset":1728},"end":{"line":29,"column":58,"offset":1775},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.psychology.social-maturity-narcissism"}},{"type":"wiki","from":{"fname":"notes.psychology.agency-gap-pipeline","id":"notes.psychology.agency-gap-pipeline","vaultName":"vault"},"value":"handbook.growth.exposure-ladder","position":{"start":{"line":29,"column":60,"offset":1777},"end":{"line":29,"column":95,"offset":1812},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"handbook.growth.exposure-ladder"}}],"anchors":{"agency-gap-and-public-contribution-pipeline":{"type":"header","text":"Agency Gap and Public Contribution Pipeline","value":"agency-gap-and-public-contribution-pipeline","line":16,"column":0,"depth":1},"the-agency-gap":{"type":"header","text":"The Agency Gap","value":"the-agency-gap","line":18,"column":0,"depth":2},"regret-vs-antagonism":{"type":"header","text":"Regret vs. Antagonism","value":"regret-vs-antagonism","line":23,"column":0,"depth":2},"the-public-contribution-pipeline":{"type":"header","text":"The Public Contribution Pipeline","value":"the-public-contribution-pipeline","line":28,"column":0,"depth":2},"communication-styles-for-the-rough-phase":{"type":"header","text":"Communication Styles for the \"Rough\" Phase","value":"communication-styles-for-the-rough-phase","line":37,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"agency-gap-and-public-contribution-pipeline\"\u003eAgency Gap and Public Contribution Pipeline\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agency-gap-and-public-contribution-pipeline\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"agency-gap-and-public-contribution-pipeline-1\"\u003eAgency Gap and Public Contribution Pipeline\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agency-gap-and-public-contribution-pipeline-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"the-agency-gap\"\u003eThe Agency Gap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-agency-gap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003eAgency Gap\u003c/em\u003e terjadi ketika kapasitas berpikir (isi kepala) sudah siap, namun kapasitas untuk mengeksekusi atau tampil di konteks formal belum setara. \u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Ide butuh kendaraan. Kalau tidak kita yang membuat kendaraannya, orang lain bisa membawa versi mereka.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"regret-vs-antagonism\"\u003eRegret vs. Antagonism\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#regret-vs-antagonism\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenyadari bahwa orang lain membawa ide kita ke forum besar seringkali memicu rasa \"sayang\" (\u003cem\u003eregret/missed opportunity awareness\u003c/em\u003e), bukan serta-merta rasa iri atau dendam. \u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFokus Salah\u003c/strong\u003e: \"Dia mencuri ide gue.\" (Antagonisme).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFokus Benar\u003c/strong\u003e: \"Kenapa gue belum jadi orang yang bisa membawa gagasan gue sendiri ke ruang yang lebih besar?\" (Agency Gap).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"the-public-contribution-pipeline\"\u003eThe Public Contribution Pipeline\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-public-contribution-pipeline\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk memindahkan ide dari ruang aman (tongkrongan) ke ruang berisiko (forum), diperlukan pipeline sederhana:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eCapture\u003c/strong\u003e: Setelah diskusi kecil, tulis 3 kalimat inti ide tersebut.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSynthesize\u003c/strong\u003e: Ubah menjadi satu tesis sederhana. Contoh: \u003cem\u003e\"Menurut gue, masalahnya bukan X, tapi Y.\"\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConcrete Example\u003c/strong\u003e: Siapkan satu contoh nyata untuk mendukung tesis.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMicro-Slot\u003c/strong\u003e: Ambil slot kecil di forum untuk menyampaikan poin tersebut.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLow-Bar Target\u003c/strong\u003e: Targetkan untuk \"muncul\", bukan untuk tampil sempurna.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"communication-styles-for-the-rough-phase\"\u003eCommunication Styles for the \"Rough\" Phase\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#communication-styles-for-the-rough-phase\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTidak perlu tampil sebagai ahli final. Gunakan gaya \"observasi kasar\" untuk mengurangi tekanan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003e\"Gue mau bawa satu poin yang kemarin sempat kebahas di obrolan kecil. Menurut gue, inti masalahnya ada di X...\"\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cem\u003e\"Gue belum punya versi final, tapi ada satu pola yang gue lihat: ...\"\u003c/em\u003e\u003c/li\u003e\n\u003cli\u003e\u003cem\u003e\"Ini masih rough, tapi gue rasa penting dibawa ke forum karena bisa ngaruh ke keputusan kita.\"\u003c/em\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.social-maturity-narcissism\"\u003eSocial Maturity and Narcissism Reduction\u003c/a\u003e, \u003ca href=\"/sotoy/notes/handbook.growth.exposure-ladder\"\u003eExposure Ladder for Shame Regulation\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagency (Private)\u003c/a\u003e\u003c/li\u
