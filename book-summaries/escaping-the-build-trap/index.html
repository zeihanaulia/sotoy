Product Management Process","value":"part-iv-product-management-process","line":96,"column":0,"depth":3},"part-v-the-product-led-organization":{"type":"header","text":"Part V: The Product-Led Organization","value":"part-v-the-product-led-organization","line":129,"column":0,"depth":3},"kenapa-ini-penting":{"type":"header","text":"Kenapa ini penting","value":"kenapa-ini-penting","line":169,"column":0,"depth":3},"lihat-juga":{"type":"header","text":"Lihat Juga","value":"lihat-juga","line":181,"column":0,"depth":2}},"children":[],"parent":"book-summaries","data":{}},"body":"\u003ch1 id=\"escaping-the-build-trap\"\u003eEscaping the Build Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#escaping-the-build-trap\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eYang paling nempel dari \u003cem\u003eEscaping the Build Trap\u003c/em\u003e adalah satu kalimat sederhana: banyak organisasi merasa produktif karena terus shipping fitur, tapi mereka sebenarnya sedang sibuk membangun output, bukan menghasilkan outcome.\u003c/p\u003e\n\u003ch3 id=\"preface-build-trap-sebagai-masalah-organisasi\"\u003ePreface: Build Trap sebagai Masalah Organisasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#preface-build-trap-sebagai-masalah-organisasi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi preface gue merasa titik awalnya penting: build trap tidak bisa disederhanakan jadi “PM kurang jago”. Ini masalah sistem org. Michael Dell jadi pembuka dengan quote: “The point is, you can’t keep doing the same thing and expect it to keep working.”\u003c/p\u003e\n\u003cp\u003eMelissa Perri cerita kayak gue pernah: bikin requirement tebal, lempar ke developer, lalu ngerasa keren. Tapi kenyataannya, produk itu tidak dipakai. Dari momen itu gue ngerti bahwa aktivitas internal bisa terlihat benar, tapi hasilnya salah. Build trap bukan cuma soal tidak bisa membangun. Build trap bisa terjadi ketika tim sangat mahir membangun, tapi membangun hal yang tidak menghasilkan outcome.\u003c/p\u003e\n\u003cp\u003ePreface ini menarik karena dia mengubah fokus dari “buku untuk PM” jadi “buku tentang product-led organization.” Istilah pentingnya: skill individu tidak cukup kalau sistem insentif, struktur, dan budaya organisasi masih mendorong perilaku lama. Gue bisa belajar eksperimen dan customer research, tapi kalau bonus, manajemen, dan KPI tetap output-driven, gue bakal kejebak lagi.\u003c/p\u003e\n\u003cp\u003eDi sini juga istilah “product person” diperlebar. Bukan cuma PM. Ini buat siapa pun yang ikut menentukan produk: PM, engineer, founder, leader. Product bukan hanya departemen; product adalah cara organisasi mengambil keputusan.\u003c/p\u003e\n\u003ch3 id=\"diagnosis-build-trap\"\u003eDiagnosis: Build Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#diagnosis-build-trap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi Part I, gue diajak memahami build trap sebagai jebakan organisasi yang mengukur kemajuan dengan pertanyaan seperti “fitur apa yang sudah selesai?” bukannya “masalah customer apa yang berhasil kita selesaikan, dan apa dampaknya ke bisnis?”.\u003c/p\u003e\n\u003cp\u003eDari situ gue mulai melihat produk sebagai value exchange system. Customer memberi waktu, perhatian, uang, data, atau kepercayaan. Perusahaan memberi solusi, kemudahan, efisiensi, atau hasil yang lebih baik. Kalau pertukaran itu tidak sehat, fitur sebanyak apa pun tidak menyelamatkan produk.\u003c/p\u003e\n\u003cp\u003eDi situ gue juga melihat perbedaan antara project, product, dan service. Project punya awal-akhir: fokusnya selesaiin X. Product hidup lebih lama dan berubah berdasarkan masalah, usage, dan strategi. Service merangkum keseluruhan pengalaman customer — support, onboarding, billing, reliability, dan semua interaksi.\u003c/p\u003e\n\u003ch3 id=\"part-i-the-build-trap\"\u003ePart I: The Build Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-i-the-build-trap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart I terasa seperti dasar yang harus gue pahami dulu: apakah organisasi sedang bertukar value dengan sehat? Dalam bab-bab ini Melissa memetakan sistem value yang membuat produk layak dipakai. Customer memberi waktu, uang, perhatian, data, dan trust. Perusahaan memberi hasil yang lebih baik, proses lebih mudah, dan pengalaman yang lebih lancar. Kalau pertukaran itu timpang, fitur sebanyak apa pun tidak cukup.\u003c/p\u003e\n\u003cp\u003eBab-babnya disusun seperti urutan pemikiran:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe Value Exchange System\u003c/li\u003e\n\u003cli\u003eConstraints on the Value Exchange System\u003c/li\u003e\n\u003cli\u003eProjects Versus Products Versus Services\u003c/li\u003e\n\u003cli\u003eThe Product-Led Organization\u003c/li\u003e\n\u003cli\u003eWhat We Know and What We Don’t\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHal yang paling nancep buat gue adalah: bab ini bukan sekadar bilang produk bukan proyek. Bab ini mengajak gue membangun pola pikir. Sebelum ngomong role PM atau strategy, gue harus paham medan permainannya. Kalau mindset organisasi masih “proyek”, ukuran suksesnya cuma selesai. Kalau mindsetnya “produk”, ukuran suksesnya berubah jadi dampak. Kalau mindsetnya “service”, ukuran suksesnya adalah pengalaman end-to-end.\u003c/p\u003e\n\u003cp\u003eYang gue suka dari struktur ini adalah dia tidak langsung ngomongin “cara jadi product manager”. Dia mulai dari sistem value. Itu penting: product management tanpa pemahaman value gampang berubah jadi backlog management. Mirip engineering: sebelum optimasi kode, gue harus tahu dulu di mana bottleneck sistemnya.\u003c/p\u003e\n\u003ch3 id=\"part-ii-the-role-of-the-product-manager\"\u003ePart II: The Role of the Product Manager\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-ii-the-role-of-the-product-manager\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah gue paham build trap, buku masuk ke Part II untuk nanya: siapa yang harus bantu organisasi berpikir benar?\u003c/p\u003e\n\u003cp\u003eBab-babnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Product Manager Archetypes\u003c/li\u003e\n\u003cli\u003eA Great Product Manager\u003c/li\u003e\n\u003cli\u003eThe Product Manager Career Path\u003c/li\u003e\n\u003cli\u003eOrganizing Your Teams\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang gue tangkap adalah: PM bukan cuma tukang tulis requirement atau CEO mini. PM yang sehat bantu tim memahami problem, memvalidasi opportunity, menghubungkan customer need dengan business goal, lalu bantu tim membuat keputusan produk yang lebih baik.\u003c/p\u003e\n\u003cp\u003eDi situ gue lihat beberapa archetype PM yang jebakannya organisasi output-driven:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePM yang cuma jadi project manager\u003c/li\u003e\n\u003cli\u003ePM yang cuma jadi backlog secretary\u003c/li\u003e\n\u003cli\u003ePM yang cuma meneruskan request stakeholder\u003c/li\u003e\n\u003cli\u003ePM yang memonopoli keputusan sampai engineering dan design cuma eksekutor\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting: gue ngerasa ini tidak memuja role PM secara buta. PM bisa jadi bagian dari masalah kalau posisinya salah. Role PM masuk setelah build trap dijelaskan karena PM adalah respons terhadap masalah sistemik.\u003c/p\u003e\n\u003cp\u003eKalau organisasi masih output-driven, PM bakal dipaksa jadi penjaga backlog. Kalau organisasi outcome-driven, PM bisa jadi penghubung antara customer problem, business strategy, dan delivery team. Jadi kualitas PM tidak bisa dipisahkan dari struktur organisasi; role clarity bergantung pada operating model.\u003c/p\u003e\n\u003ch3 id=\"part-iii-strategy\"\u003ePart III: Strategy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-iii-strategy\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart III menurut gue adalah otak dari product thinking.\u003c/p\u003e\n\u003cp\u003eBab-babnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWhat Is Strategy?\u003c/li\u003e\n\u003cli\u003eStrategic Gaps\u003c/li\u003e\n\u003cli\u003eCreating a Good Strategic Framework\u003c/li\u003e\n\u003cli\u003eCompany-Level Vision and Strategic Intents\u003c/li\u003e\n\u003cli\u003eProduct Vision and Portfolio\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni bagian paling kena kalau lo sering merasa “gue punya banyak fitur, tapi produknya gak kerasa utuh.” Strategy di sini bukan slide cantik atau slogan. Strategy adalah sistem keputusan yang menjawab: kita mau menang di mana, dengan cara apa, untuk customer siapa, dan trade-off apa yang harus kita ambil?\u003c/p\u003e\n\u003cp\u003eTanpa strategy, tim gampang ke mode request-driven. Sales minta A, customer besar minta B, CEO minta C, competitor minta D, sampai roadmap jadi campuran tempelan. Dari luar terlihat aktif, tapi dari dalam gak punya arah.\u003c/p\u003e\n\u003cp\u003eStrategic gap muncul ketika visi besar nggak nyambung ke aktivitas harian. Banyak perusahaan punya visi tinggi seperti “menjadi platform terbaik untuk X”, tapi sprint team sehari-hari cuma ngurus tiket random. Strategy harus jadi jembatan antara visi dan pekerjaan tim.\u003c/p\u003e\n\u003cp\u003eProduct vision harus lebih spesifik daripada company vision. Product vision ngejelasin produk harus jadi apa supaya visi bisnis bisa tercapai. Portfolio penting kalau perusahaan punya banyak produk atau banyak area problem.\u003c/p\u003e\n\u003cp\u003ePolanya: vision → strategic intent → product vision → product initiatives → experiments/features. Fitur berada di ujung bawah. Fitur adalah konsekuensi, bukan titik awal.\u003c/p\u003e\n\u003ch3 id=\"part-iv-product-management-process\"\u003ePart IV: Product Management Process\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-iv-product-management-process\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart IV berisi bab praktis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe Product Kata\u003c/li\u003e\n\u003cli\u003eUnderstanding the Direction and Setting Success Metrics\u003c/li\u003e\n\u003cli\u003eProblem Exploration\u003c/li\u003e\n\u003cli\u003eSolution Exploration\u003c/li\u003e\n\u003cli\u003eBuilding and Optimizing Your Solution\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBagian ini terasa paling teknis, tapi juga paling penting untuk keluar dari build trap. “Product Kata” gue baca sebagai latihan berulang: pahami tujuan, pahami kondisi sekarang, identifikasi obstacle, eksperimen, belajar, ulangi.\u003c/p\u003e\n\u003cp\u003eUrutannya menarik karena dia nggak langsung ngajak “brainstorm solusi”. Dia mulai dari direction dan success metrics. Tanpa metrik sukses, kita nggak bisa tahu apakah solusi itu bekerja atau cuma terlihat bagus.\u003c/p\u003e\n\u003cp\u003eProblem exploration tanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emasalah apa yang benar-benar terjadi?\u003c/li\u003e\n\u003cli\u003esiapa yang mengalami?\u003c/li\u003e\n\u003cli\u003eseberapa sering?\u003c/li\u003e\n\u003cli\u003eseberapa mahal dampaknya?\u003c/li\u003e\n\u003cli\u003eapakah problem ini worth solving?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSolution exploration baru tanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esolusi apa yang mungkin?\u003c/li\u003e\n\u003cli\u003emana yang paling murah untuk divalidasi?\u003c/li\u003e\n\u003cli\u003emana yang paling mungkin menghasilkan outcome?\u003c/li\u003e\n\u003cli\u003ebagaimana kita tahu solusi ini bekerja?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eProses yang sehat memisahkan problem space dan solution space. Problem space adalah wilayah memahami realitas: pain, behavior, constraint, context. Solution space adalah wilayah desain: fitur, flow, automation, UI, API, pricing, onboarding.\u003c/p\u003e\n\u003cp\u003eKalau lo lompat ke solution space terlalu cepat, lo akan bangun fitur rapi yang mungkin nggak penting. Success metric harus muncul sebelum build karena metric adalah alat navigasi. Product Kata bukan sekali riset lalu build besar; ini siklus belajar kecil.\u003c/p\u003e\n\u003ch3 id=\"part-v-the-product-led-organization\"\u003ePart V: The Product-Led Organization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-v-the-product-led-organization\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart V nutup buku dengan organisasi yang membuat semua konsep sebelumnya bertahan. Bab-babnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOutcome-Focused Communication\u003c/li\u003e\n\u003cli\u003eRewards and Incentives\u003c/li\u003e\n\u003cli\u003eSafety and Learning\u003c/li\u003e\n\u003cli\u003eBudgeting\u003c/li\u003e\n\u003cli\u003eCustomer Centricity\u003c/li\u003e\n\u003cli\u003eMarquetly: The Product-Led Company\u003c/li\u003e\n\u003cli\u003eAfterword: Escaping the Build Trap to Become Product-Led\u003c/li\u003e\n\u003cli\u003eAppendix: Six Questions to Determine Whether a Company Is Product-Led\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi sini pertanyaannya adalah: gimana caranya satu perusahaan benar-benar hidup dengan prinsip ini?\u003c/p\u003e\n\u003cp\u003eBuild trap bukan cuma masalah individu. Dia muncul dari sistem insentif. Kalau orang dipuji karena “fitur selesai banyak”, mereka akan tetep ngejar fitur. Kalau budgeting masih project-based, tim bakal ngemas kerjaan jadi project besar. Kalau komunikasi stakeholder selalu pakai output, tim bakal laporin output. Kalau kegagalan eksperimen dihukum, orang bakal pura-pura yakin dan berhenti belajar.\u003c/p\u003e\n\u003cp\u003eMakanya bab tentang rewards, incentives, safety, learning, budgeting, dan customer centricity ada di akhir. Bukan sekadar tambahan. Ini kondisi lingkungan yang bikin product thinking bisa bertahan.\u003c/p\u003e\n\u003cp\u003eProduct-led organization bukan cuma organisasi yang “punya PM”. Product-led berarti keputusan bisnis dan delivery diarahkan oleh outcome customer dan impact bisnis. Kalau reward masih output-based, orang bakal tetap ngejar output walaupun ngomongnya outcome. Kalau budgeting masih project-based, product team susah ngelakuin discovery berkelanjutan. Kalau gak ada psychological safety, eksperimen bisa berubah jadi sandiwara validasi. Customer centricity bukan “nanya customer mau fitur apa”, tapi memahami masalah dan konteks customer.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n  A[\"BUILD TRAP\"]\n  B[\"Perusahaan terlalu fokus shipping fitur\"]\n  C[\"Harus paham value dulu\"]\n  D[\"PART I: The Build Trap\u0026#x3C;br\u003eValue exchange → constraint → project/product/service → product-led thinking\"]\n  E[\"Butuh role yang menjaga arah product thinking\"]\n  F[\"PART II: Role of Product Manager\u0026#x3C;br\u003eBad PM → great PM → career path → team organization\"]\n  G[\"Role saja tidak cukup, harus ada arah\"]\n  H[\"PART III: Strategy\u0026#x3C;br\u003eWhat Is Strategy? → Strategic Gaps → Framework → Company Vision → Product Vision\"]\n  I[\"Arah harus diterjemahkan jadi proses belajar\"]\n  J[\"PART IV: Product Management Process\u0026#x3C;br\u003eProduct Kata → metrics → problem exploration → solution exploration → build/optimize\"]\n  K[\"Proses tidak akan bertahan kalau organisasi tidak mendukung\"]\n  L[\"PART V: Product-Led Organization\u0026#x3C;br\u003eCommunication → incentives → safety → budgeting → customer centricity\"]\n  M[\"ESCAPING THE BUILD TRAP\"]\n\n  A --\u003e B --\u003e C --\u003e D --\u003e E --\u003e F --\u003e G --\u003e H --\u003e I --\u003e J --\u003e K --\u003e L --\u003e M\n\u003c/div\u003e\n\u003ch3 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk konteks SaaS atau produk B2B, pelajaran paling pentingnya bukan memulai dari daftar fitur. Pelajaran itu adalah mulai dari sistem value:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esiapa user utama?\u003c/li\u003e\n\u003cli\u003emoment apa yang menyakitkan?\u003c/li\u003e\n\u003cli\u003eoutcome apa yang mereka butuh?\u003c/li\u003e\n\u003cli\u003eperubahan perilaku apa yang jadi tanda produk berguna?\u003c/li\u003e\n\u003cli\u003efitur minimum apa yang bisa membuktikan perubahan itu?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang paling ngena bagi gue adalah bahwa product management bukan sekadar seni bikin roadmap. Ini disiplin menghubungkan problem customer, outcome bisnis, strategi, eksperimen, dan delivery supaya tim tidak cuma sibuk membangun, tapi benar-benar menciptakan value.\u003c/p\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat Juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.from-feature-to-service-design\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003c/a\u003e — learning path keluar dari build trap dan mulai dari pain point kecil\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — contoh perbedaan product vs service di SaaS\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.service-sense-and-journey-thinking\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eService Sense dan Journey Thinking: Dari Fitur Tempel ke Pengalaman yang Mengalir\u003c/a\u003e — service sense dan journey thinking untuk membuat alur produk lebih mengalir\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u0 er","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"da
