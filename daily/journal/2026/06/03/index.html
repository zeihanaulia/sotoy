art":{"line":45,"column":3,"offset":3136},"end":{"line":45,"column":60,"offset":3193},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.honcho.peer-representations"}},{"type":"wiki","from":{"fname":"daily.journal.2026.06.03","id":"daily.journal.2026.06.03","vaultName":"vault"},"value":"notes.agentic-engineering.honcho.design-patterns","position":{"start":{"line":46,"column":3,"offset":3196},"end":{"line":46,"column":55,"offset":3248},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.honcho.design-patterns"}}],"anchors":{"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":40,"column":0,"depth":2}},"children":[],"parent":"1iir2mksc725vt194vy9yyh","data":{}},"body":"\u003ch1 id=\"2026-06-03\"\u003e2026-06-03\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-06-03\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eHari ini gue baca dokumentasi Hermes Agent tentang memory provider. Yang menarik adalah perbedaan antara memori bawaan (\u003ccode\u003eMEMORY.md\u003c/code\u003e / \u003ccode\u003eUSER.md\u003c/code\u003e) dan provider eksternal. Built-in memory tetap aktif, dan provider eksternal berfungsi sebagai lapisan tambahan untuk persistent memory lintas sesi.\u003c/p\u003e\n\u003cp\u003eInti yang gue tangkap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eExternal provider bukan sekadar penyimpanan chat, tapi backend untuk retrieval dan context injection.\u003c/li\u003e\n\u003cli\u003eHanya satu provider eksternal yang bisa aktif sekaligus, supaya konflik sumber, biaya, latency, dan governance tetap terkendali.\u003c/li\u003e\n\u003cli\u003ePilihan provider adalah keputusan epistemik: agent bisa diatur untuk mengingat preferensi user, struktur knowledge project, atau relasi antar entitas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBeberapa provider yang dicatat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eHoncho\u003c/code\u003e: user modeling / cross-session context.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOpenViking\u003c/code\u003e: filesystem knowledge hierarchy.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eMem0\u003c/code\u003e: automatic memory extraction.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHindsight\u003c/code\u003e: knowledge graph + synthesis.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHolographic\u003c/code\u003e: local SQLite + trust scoring.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eRetainDB\u003c/code\u003e: hybrid cloud search + compression.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eByteRover\u003c/code\u003e: local-first CLI memory tree.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSupermemory\u003c/code\u003e: semantic memory + context fencing.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eMemori\u003c/code\u003e: structured long-term memory dengan tool-aware recall.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSekarang ada catatan terpisah tentang OpenViking sebagai context database di \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.agentic-engineering.openviking-context-database (Private)\u003c/a\u003e, arsitektur OpenViking di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e, storage architecture di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e, context extraction di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e, dan context layers OpenViking di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eKalau nanti mau nulis lebih panjang, ada \u003ccode\u003evault/notes.agentic-engineering.hermes-agent.memory-providers.md\u003c/code\u003e yang merangkum pilihan provider dan trade-off-nya. Ini membantu gue ingat bahwa pilihan provider Hermes Agent lebih dari sekadar \"storage\".\u003c/p\u003e\n\u003cp\u003eHari ini gue juga baca dokumentasi Honcho. Yang bikin beda menurut gue:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eHoncho bukan cuma menyimpan chat, tapi membangun state model tentang entitas yang berubah.\u003c/li\u003e\n\u003cli\u003eDia pakai konsep \u003ccode\u003epeer\u003c/code\u003e, bukan cuma \u003ccode\u003euser\u003c/code\u003e, sehingga bisa memodelkan manusia, agent, grup, ide, atau objek.\u003c/li\u003e\n\u003cli\u003eHoncho ingin reasoning, bukan sekadar retrieval. Pesan menjadi evidence, lalu disimpulkan menjadi representation.\u003c/li\u003e\n\u003cli\u003eIni paling cocok untuk agent stateful, multi-agent, atau use case yang perlu memahami perubahan konteks dari waktu ke waktu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi hari ini ada dua level pemahaman: Hermes memory provider sebagai peta arsitektur memory, dan Honcho sebagai model stateful agent dengan entity-centric reasoning.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.hermes-agent.memory-providers\"\u003eMemory Providers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.agentic-engineering.openviking-context-database (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.reasoning\"\u003eReasoning\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.peer-representations\"\u003ePeer Representations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.design-patterns\"\u003eHoncho Design Patterns\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use
