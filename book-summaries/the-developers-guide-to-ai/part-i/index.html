,"depth":3},"10-hubungan-antar-bagian":{"type":"header","text":"10. Hubungan antar bagian","value":"10-hubungan-antar-bagian","line":565,"column":0,"depth":3},"kutipan-penopang-1":{"type":"header","text":"Kutipan penopang","value":"kutipan-penopang-1","line":578,"column":0,"depth":3},"sintesis-besar-1":{"type":"header","text":"Sintesis besar","value":"sintesis-besar-1","line":592,"column":0,"depth":3},"insight":{"type":"header","text":"Insight","value":"insight","line":596,"column":0,"depth":3}},"children":[],"parent":"book-summaries.the-developers-guide-to-ai","data":{}},"body":"\u003ch1 id=\"the-developers-guide-to-ai--part-i-getting-started-with-ai\"\u003eThe Developer’s Guide to AI — Part I: Getting Started with AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-developers-guide-to-ai--part-i-getting-started-with-ai\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"part-i-getting-started-with-ai\"\u003ePart I: Getting Started with AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#part-i-getting-started-with-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"problem-statement\"\u003eProblem statement\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem-statement\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi Part I, masalahnya adalah menemukan titik masuk yang realistis buat developer: bagaimana caranya memakai LLM tanpa harus jadi peneliti ML, bagaimana mengemas model itu dalam aplikasi, dan bagaimana memahami batasan dasarnya sebelum masuk ke tooling yang lebih rumit.\u003c/p\u003e\n\u003cp\u003eDalam bahasa gue, ini tentang membangun fondasi yang cukup kuat supaya pendekatan AI terasa masuk akal, bukan sekadar demo hype.\u003c/p\u003e\n\u003ch2 id=\"chapter-1-understanding-large-language-models\"\u003eChapter 1: Understanding Large Language Models\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-1-understanding-large-language-models\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi sini gue sedang membangun model mental yang jadi dasar semua engineering AI selanjutnya. Kalau gue cuma menghafal istilah, nanti prompt, RAG, fine-tuning, dan agents bakal terasa seperti trik acak.\u003c/p\u003e\n\u003ch3 id=\"mental-model-utama\"\u003eMental model utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mental-model-utama\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKutipan inti yang seharusnya lo pegang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Large language models (LLMs) are very large, deep learning models that are pretrained on vast amounts of data.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The model predicts the word most likely to appear next in the sequence, over and over, until the response generation is complete.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Traditional programming is based on Boolean logic. It’s deterministic.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The results you get with any given input are probabilistic.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The model does not know facts that arose after the cutoff, nor does it know anything about your private data unless you provide that information in the prompt.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It’s always easiest (and the most cost-effective) to start with prompt engineering.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau digabung, intinya:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLLM adalah model pretrained besar yang menghasilkan teks token demi token secara probabilistik. Itu membuatnya fleksibel, tapi juga rawan salah, tidak otomatis tahu domain privat lo, dan perlu diarahkan lewat prompt, context, atau fine-tuning.\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"1-prompt--llm--response\"\u003e1. Prompt → LLM → response\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-prompt--llm--response\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni diagram paling dasar:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    U[User / App] --\u003e|Prompt| M[LLM]\n    M --\u003e|Response| U\n\u003c/div\u003e\n\u003cp\u003eIntuisi dasarnya: lo kirim prompt, model mengolah prompt, model balikin response. Prompt bukan cuma pertanyaan; prompt adalah konteks awal yang menentukan trajectory token.\u003c/p\u003e\n\u003ch3 id=\"2-training-data--pretrained-model\"\u003e2. Training data → pretrained model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-training-data--pretrained-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eModel jadi kuat karena belajar dari data besar:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Web pages] --\u003e T[Training process]\n    B[Books] --\u003e T\n    C[Articles] --\u003e T\n    D[Research papers] --\u003e T\n    E[Code] --\u003e T\n    F[Curated/licensed data] --\u003e T\n    T --\u003e M[Pretrained LLM]\n\u003c/div\u003e\n\u003cp\u003eDari situ muncul dua hal sekaligus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekenapa model bisa terdengar pintar,\u003c/li\u003e\n\u003cli\u003ekenapa model punya batas yang berasal dari data yang ia lihat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-token-demi-token\"\u003e3. Token demi token\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-token-demi-token\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMekanisme dasarnya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    C1[Context: Who are the Beatles?] --\u003e P1[Predict next token: The]\n    P1 --\u003e C2[Context: Who are the Beatles? The]\n    C2 --\u003e P2[Predict next token: Beatles]\n    P2 --\u003e C3[Context: Who are the Beatles? The Beatles]\n    C3 --\u003e P3[Predict next token: are a]\n    P3 --\u003e C4[Context: Who are the Beatles? The Beatles are a]\n    C4 --\u003e P4[Predict next token: rock]\n    P4 --\u003e C5[Context: Who are the Beatles? The Beatles are a rock]\n    C5 --\u003e P5[Predict next token: band]\n\u003c/div\u003e\n\u003cp\u003eIni penting karena keluaran dibangun langkah demi langkah. Model tidak menulis paragraf final sekaligus.\u003c/p\u003e\n\u003ch3 id=\"4-training-vs-inference\"\u003e4. Training vs inference\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-training-vs-inference\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBedanya ini penting:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TB\n    A[Training] --\u003e B[Model learns patterns from massive text]\n    B --\u003e C[Pretrained LLM]\n    C --\u003e D[Inference]\n    D --\u003e E[Prompt from user/app]\n    E --\u003e F[Token-by-token response generation]\n\u003c/div\u003e\n\u003cp\u003eTraining adalah saat model belajar pola umum. Inference adalah saat model memakai pola itu untuk input baru.\u003c/p\u003e\n\u003ch3 id=\"5-code-deterministik-vs-llm-probabilistik\"\u003e5. Code deterministik vs LLM probabilistik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-code-deterministik-vs-llm-probabilistik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePerbedaan mental modelnya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    subgraph Traditional Programming\n        I1[Input] --\u003e R1[Explicit rules/code]\n        R1 --\u003e O1[Deterministic output]\n    end\n\n    subgraph LLM Behavior\n        I2[Prompt/context] --\u003e R2[Probabilistic token prediction]\n        R2 --\u003e O2[Possible output variants]\n    end\n\u003c/div\u003e\n\u003cp\u003eKalau di code tradisional input sama, output harus sama. Di LLM, input sama, output bisa beda. Itu sifat dasarnya.\u003c/p\u003e\n\u003ch3 id=\"6-knowledge-limit--grounding\"\u003e6. Knowledge limit \u0026#x26; grounding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-knowledge-limit--grounding\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eModel punya batas pengetahuan:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TB\n    Q[User question] --\u003e M[LLM]\n    K[Training knowledge] --\u003e M\n    P[Private company data] -.not available.-\u003e M\n    R[Recent facts after cutoff] -.not available.-\u003e M\n    M --\u003e A[Potential generic/outdated response]\n\u003c/div\u003e\n\u003cp\u003eSolusinya adalah grounding:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    Q[User question] --\u003e AP[Augmented prompt]\n    KB[Docs / private data / fresh info] --\u003e AP\n    AP --\u003e M[LLM]\n    M --\u003e R[Grounded response]\n\u003c/div\u003e\n\u003cp\u003eKalau info domain lo tidak ada di training dan tidak masuk prompt, wajar model gak tahu.\u003c/p\u003e\n\u003ch3 id=\"7-hallucination-flow\"\u003e7. Hallucination flow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-hallucination-flow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau model tidak punya relevan knowledge, dia masih akan terus prediksi token:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TB\n    A[Question asked] --\u003e B{Relevant knowledge available?}\n    B -- Yes --\u003e C[Grounded answer]\n    B -- No --\u003e D[Predict likely tokens anyway]\n    D --\u003e E[Fluent but possibly fabricated response]\n    E --\u003e F[Hallucination]\n\u003c/div\u003e\n\u003cp\u003eKefasihan bahasa bukan jaminan kebenaran. Itu jebakan terbesar.\u003c/p\u003e\n\u003ch3 id=\"8-multi-step-reasoning-fragility\"\u003e8. Multi-step reasoning fragility\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-multi-step-reasoning-fragility\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau task butuh banyak langkah, satu kesalahan kecil bisa snowball:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Complex task] --\u003e B[LLM generates step 1]\n    B --\u003e C[If step 1 slightly wrong]\n    C --\u003e D[Step 2 built on wrong premise]\n    D --\u003e E[Step 3 drifts further]\n    E --\u003e F[Confident but flawed final answer]\n\u003c/div\u003e\n\u003cp\u003eItu kenapa teknik seperti decomposition, chain of thought, verification, dan tool use penting.\u003c/p\u003e\n\u003ch3 id=\"9-hierarki-intervensi\"\u003e9. Hierarki intervensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-hierarki-intervensi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena LLM punya batas, ada urutan intervensi yang sehat:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TB\n    Start[Need better LLM output] --\u003e P[Prompt engineering]\n    P --\u003e C{Good enough?}\n    C -- Yes --\u003e Done[Ship / iterate]\n    C -- No --\u003e X[Context engineering]\n    X --\u003e C2{Good enough?}\n    C2 -- Yes --\u003e Done\n    C2 -- No --\u003e FT[Fine-tuning]\n    FT --\u003e C3{Good enough?}\n    C3 -- Yes --\u003e Done\n    C3 -- No --\u003e CM[Custom model]\n\u003c/div\u003e\n\u003cp\u003eJadi bukan langsung lompat ke fine-tune. Mulai dari yang murah, baru naik ke yang lebih mahal.\u003c/p\u003e\n\u003ch3 id=\"10-dari-llm-ke-agentic-systems\"\u003e10. Dari LLM ke agentic systems\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-dari-llm-ke-agentic-systems\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent bukan makhluk baru. Agent adalah:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    U[User goal] --\u003e A[Agent system]\n    A --\u003e T1[Tool/API]\n    A --\u003e T2[Database/memory]\n    A --\u003e T3[External service]\n    T1 --\u003e A\n    T2 --\u003e A\n    T3 --\u003e A\n    A --\u003e R[Action/result]\n\u003c/div\u003e\n\u003cp\u003eAgent berarti LLM plus konteks, plus tools, plus loop keputusan. Fondasi yang dipakai tetap sama.\u003c/p\u003e\n\u003ch3 id=\"inti-utama\"\u003eInti utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-utama\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini sedang meluruskan intuisi: LLM itu dikuatkan oleh pretraining di data teks masif, menghasilkan respons token demi token secara probabilistik, fleksibel tapi punya batas. Tugas developer adalah memahami trade-off itu dan memilih intervensi yang tepat: prompt, context, fine-tuning, atau custom model.\u003c/p\u003e\n\u003ch2 id=\"chapter-2-building-your-first-llm-powered-application\"\u003eChapter 2: Building Your First LLM-Powered Application\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-2-building-your-first-llm-powered-application\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian ini memindahkan kita dari “paham LLM” ke “menyusun skeleton sistem.” Kalau bagian sebelumnya fokus ke model mental, sekarang fokusnya adalah aliran nyata: input user → prompt → service → model → response → user.\u003c/p\u003e\n\u003ch3 id=\"1-target-sederhana-tapi-strategis\"\u003e1. Target sederhana tapi strategis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-target-sederhana-tapi-strategis\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAkhirnya kita dapat tiga tujuan jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emenangkap input user dan bikin prompt,\u003c/li\u003e\n\u003cli\u003ekirim prompt ke LLM lewat API,\u003c/li\u003e\n\u003cli\u003estream response balik ke user.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu nampak gampang, tapi ini sudah memuat tiga layer sistem:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einput layer\u003c/li\u003e\n\u003cli\u003einference layer\u003c/li\u003e\n\u003cli\u003edelivery layer\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDiagram paling dasar dari bagian ini adalah:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    U[User] --\u003e I[Input / Prompt Builder]\n    I --\u003e S[REST Service]\n    S --\u003e M[LLM via API]\n    M --\u003e S\n    S --\u003e O[Response Stream]\n    O --\u003e U\n\u003c/div\u003e\n\u003cp\u003eDari sudut engineering, ini memberi bentuk minimum sistem: model jarang diakses langsung dari UI. Biasanya ada service layer di tengah yang menangani prompt, model selection, dan response delivery.\u003c/p\u003e\n\u003ch3 id=\"2-kenapa-mulai-dari-ollama-lokal\"\u003e2. Kenapa mulai dari Ollama lokal?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-mulai-dari-ollama-lokal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 2 sengaja memilih local model lewat Ollama sebagai entry point. Itu bukan hanya soal convenience. Ini decision pedagogis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esupaya lo bisa fokus pada arsitektur request/response,\u003c/li\u003e\n\u003cli\u003ebukan langsung terjebak billing, auth, atau vendor cloud,\u003c/li\u003e\n\u003cli\u003esupaya lo paham model bisa hidup lokal maupun di cloud.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eVisual yang disarankan di sini adalah:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    subgraph Cloud Pattern\n        CUI[ChatGPT UI] --\u003e CAPI[OpenAI API]\n        CAPI --\u003e CGPT[GPT Model]\n    end\n\n    subgraph Local Pattern\n        APP[Your REST Service] --\u003e OAPI[Ollama API]\n        OAPI --\u003e LLAMA[Llama 3.2 Local Model]\n    end\n\u003c/div\u003e\n\u003cp\u003eStrukturnya mirip: ada app, ada API layer, ada model di belakang. Yang beda cuma siapa yang meng-host.\u003c/p\u003e\n\u003ch3 id=\"3-hardware-constraint-sebagai-trade-off-awal\"\u003e3. Hardware constraint sebagai trade-off awal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-hardware-constraint-sebagai-trade-off-awal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini memberi reminder penting: model bukan cuma kode, tapi juga resource. Llama 3.2 3B butuh disk dan RAM tertentu, dan kalau berat bisa turun ke 1B.\u003c/p\u003e\n\u003cp\u003eArtinya pilihan model adalah soal kemampuan dan lingkungan sekaligus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emodel lebih besar → kemungkinan lebih capable,\u003c/li\u003e\n\u003cli\u003emodel lebih berat → butuh lebih banyak memory dan compute.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni sudah menanamkan kebiasaan sehat: jangan hanya bicara model, tapi bicara juga lingkungan tempat model itu dijalankan.\u003c/p\u003e\n\u003ch3 id=\"4-validasi-model-dulu-baru-service\"\u003e4. Validasi model dulu, baru service\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-validasi-model-dulu-baru-service\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum bikin server, bagian ini menyuruh lo tes model langsung via Ollama CLI, misalnya dengan “Who are the Beatles?”.\u003c/p\u003e\n\u003cp\u003eItu bukan trivia. Ini menekankan pola debugging yang sehat:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003epastikan model lokal dan Ollama berjalan,\u003c/li\u003e\n\u003cli\u003ebaru bangun service di atasnya.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni memisahkan dua layer yang sering bikin pemula bingung.\u003c/p\u003e\n\u003ch3 id=\"5-service-pertama-get-sederhana\"\u003e5. Service pertama: GET sederhana\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-service-pertama-get-sederhana\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLangkah pertama service adalah route GET yang memanggil \u003ccode\u003eollama.generate\u003c/code\u003e. Inti arsitekturnya adalah:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  sequenceDiagram\n    participant Browser\n    participant Service as REST Service\n    participant OllamaJS as ollama-js\n    participant Ollama as Ollama Server\n    participant Model as Llama 3.2\n\n    Browser-\u003e\u003eService: GET /\n    Service-\u003e\u003eOllamaJS: generate(prompt, model)\n    OllamaJS-\u003e\u003eOllama: API request\n    Ollama-\u003e\u003eModel: Run inference\n    Model--\u003e\u003eOllama: Full response\n    Ollama--\u003e\u003eOllamaJS: Response object\n    OllamaJS--\u003e\u003eService: modelResponse\n    Service--\u003e\u003eBrowser: text/plain response\n\u003c/div\u003e\n\u003cp\u003ePesan utamanya: aplikasi lo memanggil model sebagai dependency. Lo tidak perlu tahu internal transformer. Lo cuma perlu tahu bagaimana menginvokasinya dari service.\u003c/p\u003e\n\u003ch3 id=\"6-get--textplain--jalur-lurus-pertama\"\u003e6. GET + text/plain = jalur lurus pertama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-get--textplain--jalur-lurus-pertama\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePada awalnya response diset jadi \u003ccode\u003etext/plain\u003c/code\u003e dan prompt hardcoded. Ini sengaja untuk meminimalkan complexity: jalur lurus dulu, belum perlu fleksibel, belum perlu UI kompleks.\u003c/p\u003e\n\u003cp\u003eKalau jalur lurus belum hidup, menambah fleksibilitas cuma menambah area error.\u003c/p\u003e\n\u003ch3 id=\"7-streaming-sebagai-ux-dan-delivery-pattern\"\u003e7. Streaming sebagai UX dan delivery pattern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-streaming-sebagai-ux-dan-delivery-pattern\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi sini Chapter 2 mulai menunjukkan bahwa sifat token-by-token model bisa jadi kekuatan UX.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    Q[User question] --\u003e M[LLM]\n    M --\u003e C1[Chunk 1]\n    M --\u003e C2[Chunk 2]\n    M --\u003e C3[Chunk 3]\n    C1 --\u003e UI[UI renders progressively]\n    C2 --\u003e UI\n    C3 --\u003e UI\n\u003c/div\u003e\n\u003cp\u003eStreaming bukan sekadar efek visual. Ini cara mengubah keterbatasan output bertahap menjadi persepsi sistem yang hidup.\u003c/p\u003e\n\u003ch3 id=\"8-stream-true-mengubah-pola-interaksi\"\u003e8. \u003ccode\u003estream: true\u003c/code\u003e mengubah pola interaksi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-stream-true-mengubah-pola-interaksi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDengan \u003ccode\u003estream: true\u003c/code\u003e, \u003ccode\u003egenerate\u003c/code\u003e tidak lagi memberi satu response final. Ia menjadi iterator.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[Prompt sent] --\u003e B{Streaming?}\n    B -- No --\u003e C[Wait for full model response]\n    C --\u003e D[Send one complete response]\n    B -- Yes --\u003e E[Receive chunks iteratively]\n    E --\u003e F[Write chunk to HTTP response]\n    F --\u003e G[User sees progressive output]\n\u003c/div\u003e\n\u003cp\u003eIni pindah dari pola batch ke incremental delivery. Dan itu penting untuk chat UI, long-running call, dan feedback real-time.\u003c/p\u003e\n\u003ch3 id=\"9-dari-get-ke-post\"\u003e9. Dari GET ke POST\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-dari-get-ke-post\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah plumbing awal hidup, bagian ini naik level ke POST dengan JSON body:\u003c/p\u003e\n\u003cpre class=\"language-json\"\u003e\u003ccode class=\"language-json\"\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token property\"\u003e\"question\"\u003c/span\u003e\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Can you tell me about the Beatles in 500 words or less?\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni menandai transisi dari eksperimen ke service yang bisa reusable. Input kini dinamis, prompt dibangun dari payload, dan service mulai terasa seperti web API biasa.\u003c/p\u003e\n\u003ch3 id=\"10-real-world-detail-cors-dan-browser-boundary\"\u003e10. Real-world detail: CORS dan browser boundary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-real-world-detail-cors-dan-browser-boundary\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMiddleware seperti \u003ccode\u003ecors()\u003c/code\u003e dan \u003ccode\u003eexpress.json()\u003c/code\u003e menunjukkan satu hal kecil tapi penting: AI app tetap tunduk pada aturan web platform biasa. Begitu UI mulai memanggil service dari browser, masalah CORS, parsing JSON, dan network boundary muncul.\u003c/p\u003e\n\u003cp\u003eItu menguatkan pesan utama: AI engineering banyak bersinggungan dengan software engineering umum.\u003c/p\u003e\n\u003ch3 id=\"11-end-to-end-streaming-architecture\"\u003e11. End-to-end streaming architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-end-to-end-streaming-architecture\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDiagram paling pentingnya adalah arsitektur ujung-ke-ujung:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  sequenceDiagram\n    participant User\n    participant UI as Browser UI\n    participant API as Express REST Service\n    participant O as Ollama API\n    participant L as Llama 3.2\n\n    User-\u003e\u003eUI: Submit question\n    UI-\u003e\u003eAPI: POST / with JSON body\n    API-\u003e\u003eO: generate(stream=true)\n    O-\u003e\u003eL: Prompt model\n    loop For each generated chunk\n        L--\u003e\u003eO: Response chunk\n        O--\u003e\u003eAPI: Chunk\n        API--\u003e\u003eUI: response.write(chunk)\n        UI--\u003e\u003eUser: Render partial text\n    end\n\u003c/div\u003e\n\u003cp\u003eIni menunjukkan tiga ide sekaligus:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUI tidak bicara langsung ke model,\u003c/li\u003e\n\u003cli\u003eservice layer jadi jembatan,\u003c/li\u003e\n\u003cli\u003estreaming mengalir ujung-ke-ujung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight-besar\"\u003eInsight besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-besar\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini sebenarnya mengajarkan empat hal besar di bawah permukaan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003emodel diperlakukan sebagai dependency, bukan sihir,\u003c/li\u003e\n\u003cli\u003eservice layer itu penting,\u003c/li\u003e\n\u003cli\u003estreaming adalah respons terhadap sifat natural LLM,\u003c/li\u003e\n\u003cli\u003eAI app tetap software engineering biasa.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"kutipan-penopang\"\u003eKutipan penopang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kutipan-penopang\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa kutipan yang paling penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“This chapter will serve as your ‘Hello, World!’ to calling an LLM API from code and getting a response.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“You will do the same, but using a locally running Llama instance.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The cool typing effect you see in the responses from ChatGPT makes it feel responsive.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“OpenAI ingeniously transformed a drawback of LLMs, their text-generation speed, into a captivating UI effect.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The fetch function allows you to call your server and read its response as a ReadableStream.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"sintesis-besar\"\u003eSintesis besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-besar\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 2 mengajari lo membangun jalur paling dasar AI app: menerima input user, membuat prompt, mengirim ke model lewat backend service, dan mengembalikan respons lewat streaming. Model ditempatkan sebagai dependency dalam arsitektur web biasa, bukan sebagai teknologi yang berdiri sendiri.\u003c/p\u003e\n\u003ch2 id=\"chapter-3-python-on-ramp-for-ai-development\"\u003eChapter 3: Python on-ramp for AI development\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#chapter-3-python-on-ramp-for-ai-development\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian ini bukan soal debat bahasa. Ini soal ekosistem. Setelah lo paham pattern AI app di JavaScript, sekarang lo diajak pindah ke bahasa yang lebih kuat di dunia AI: Python.\u003c/p\u003e\n\u003ch3 id=\"1-mengapa-pindah-ke-python\"\u003e1. Mengapa pindah ke Python?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-mengapa-pindah-ke-python\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMotivasinya jelas:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“JavaScript can take you pretty far... But Python has the libraries and tools to do the heavy lifting.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni bukan merendahkan JavaScript. Ini menyampaikan realitas: dalam AI, bahasa sering dimenangkan oleh ekosistem — library, tooling, komunitas, dan infrastruktur riset.\u003c/p\u003e\n\u003cp\u003eLogika perpindahan yang disampaikan di sini adalah:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[JS example di Chapter 2] --\u003e B[Understand core integration pattern]\n    B --\u003e C[Need broader AI ecosystem]\n    C --\u003e D[Move to Python]\n    D --\u003e E[Use FastAPI + Ollama + Python AI libraries]\n\u003c/div\u003e\n\u003cp\u003ePeralihan ini bukan loncatan acak. Konsep sistem sama, yang berubah adalah stack yang lebih relevan untuk sisa perjalanan.\u003c/p\u003e\n\u003ch3 id=\"2-mencegah-mental-block-python\"\u003e2. Mencegah mental block Python\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-mencegah-mental-block-python\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini langsung menenangkan pembaca:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Don’t worry! If you are not a Python developer, we will ease you into it.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eArtinya: ini bukan kursus Python lengkap. Ini lebih ke survival kit Python untuk AI developer. Mereka tahu pembaca mungkin datang dari Java, JavaScript, atau backend lain.\u003c/p\u003e\n\u003cp\u003eJadi ada dua tujuan sekaligus:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eporting contoh AI app ke Python,\u003c/li\u003e\n\u003cli\u003emengenalkan idiom Python secukupnya agar lo bisa lanjut ke bab berikut.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"3-mengulang-contoh-yang-sama\"\u003e3. Mengulang contoh yang sama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-mengulang-contoh-yang-sama\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMetode pengajarannya sangat bagus: contoh yang sama dari Chapter 2 diulang dalam Python. Itu membuat satu-satunya variabel yang berubah adalah bahasa dan framework.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TB\n    subgraph JavaScript Version\n        J1[\"Express app\"]\n        J2[\"ollama.generate stream=true\"]\n        J3[\"POST / route\"]\n        J4[\"response.write chunk\"]\n    end\n\n    subgraph Python Version\n        P1[\"FastAPI app\"]\n        P2[\"client.generate stream=True\"]\n        P3[\"@app.post route\"]\n        P4[\"StreamingResponse + yield\"]\n    end\n\n    J1 --- P1\n    J2 --- P2\n    J3 --- P3\n    J4 --- P4\n\u003c/div\u003e\n\u003cp\u003eIni mengajarkan bahwa pattern AI app bersifat lintas bahasa; yang berubah hanyalah idiom implementasi.\u003c/p\u003e\n\u003ch3 id=\"4-fastapi-sebagai-pilihan-yang-cocok\"\u003e4. FastAPI sebagai pilihan yang cocok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-fastapi-sebagai-pilihan-yang-cocok\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTool Python yang dipilih adalah FastAPI dan Ollama SDK. Pilihan ini masuk akal karena FastAPI:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecepat bikin API,\u003c/li\u003e\n\u003cli\u003ejelas dengan type hints,\u003c/li\u003e\n\u003cli\u003epunya validasi input otomatis,\u003c/li\u003e\n\u003cli\u003ecocok untuk service AI sederhana.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArsitekturnya tetap sama seperti sebelumnya, hanya stack-nya bergeser.\u003c/p\u003e\n\u003ch3 id=\"5-pydantic-sebagai-boundary-typed-yang-penting\"\u003e5. Pydantic sebagai boundary typed yang penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pydantic-sebagai-boundary-typed-yang-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSalah satu momen paling krusial adalah pengenalan \u003ccode\u003eChatRequest(BaseModel)\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eItu terlihat sederhana, tapi nilainya besar. Dengan Pydantic, lo mulai mendefinisikan bentuk kontrak data pada boundary service. FastAPI lalu memvalidasi JSON otomatis.\u003c/p\u003e\n\u003cp\u003eDi AI app, ini penting karena membantu menjaga boundary data tetap disiplin saat sistem berkembang.\u003c/p\u003e\n\u003ch3 id=\"6-decorator-route-pythonic\"\u003e6. Decorator route Pythonic\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-decorator-route-pythonic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau di Express lo pakai \u003ccode\u003eapp.post('/', handler)\u003c/code\u003e, di FastAPI lo pakai \u003ccode\u003e@app.post('/')\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eSecara konsep sama. Secara gaya, Python jadi lebih deklaratif. Ini membantu pembaca melihat satu ide arsitektural yang sama muncul dalam budaya bahasa berbeda.\u003c/p\u003e\n\u003ch3 id=\"7-yield-dan-streaming-python\"\u003e7. \u003ccode\u003eyield\u003c/code\u003e dan streaming Python\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-yield-dan-streaming-python\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBagian ini menonjolkan generator \u003ccode\u003eyield\u003c/code\u003e sebagai cara Python untuk streaming response.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart TD\n    A[\"Request arrives\"] --\u003e B[\"generate_stream(question)\"]\n    B --\u003e C[\"client.generate stream=True\"]\n    C --\u003e D[\"Receive chunk\"]\n    D --\u003e E{\"chunk.response exists?\"}\n    E -- Yes --\u003e F[\"yield text chunk\"]\n    F --\u003e G[\"StreamingResponse sends chunk to client\"]\n    G --\u003e D\n    E -- No --\u003e D\n\u003c/div\u003e\n\u003cp\u003eIni menunjukkan bahwa Python punya idiom yang sangat natural untuk kasus AI streaming: output bertahap dari model bisa langsung diteruskan sebagai generator.\u003c/p\u003e\n\u003ch3 id=\"8-indentation-warning-bukan-cuma-syntax\"\u003e8. Indentation warning bukan cuma syntax\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-indentation-warning-bukan-cuma-syntax\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePeringatan soal indentasi Python bukan trivia. Ini soal cara membaca code. Di Python, whitespace adalah bagian struktur.\u003c/p\u003e\n\u003cp\u003eIni membantu pembaca non-Python menghindari frustrasi awal.\u003c/p\u003e\n\u003ch3 id=\"9-chapter-3-sebagai-boarding-pass\"\u003e9. Chapter 3 sebagai boarding pass\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-chapter-3-sebagai-boarding-pass\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAkhirnya, Chapter 3 memberi sinyal bahwa pembaca sekarang siap ikut sisa perjalanan.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“You used key Python libraries that will be used throughout the book: FastAPI and the Ollama SDK.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni bukan destinasi akhir. Ini boarding pass yang memastikan pembaca dapat melanjutkan ke Part II dengan lebih lancar.\u003c/p\u003e\n\u003ch3 id=\"10-hubungan-antar-bagian\"\u003e10. Hubungan antar bagian\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-hubungan-antar-bagian\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJika kita tarik progresinya:\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\n  flowchart LR\n    A[Chapter 1: Apa itu LLM?] --\u003e B[Chapter 2: Call LLM dari JS]\n    B --\u003e C[Chapter 3: Port example ke Python]\n    C --\u003e D[Part II: Prompt engineering di atas fondasi ini]\n\u003c/div\u003e\n\u003cp\u003eJadi Chapter 3 bukan cuma transisi bahasa. Ini menutup Part I dengan memastikan pembaca punya kendaraan Python untuk kelanjutan AI engineering.\u003c/p\u003e\n\u003ch3 id=\"kutipan-penopang-1\"\u003eKutipan penopang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kutipan-penopang-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa kutipan paling penting:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Python has the libraries and tools to do the heavy lifting.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“It is simply the language of choice for AI development.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“We’ll start by re-creating the example from Chapter 2 in Python.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“FastAPI will validate the JSON in any request... ”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The yield keyword in Python transforms a regular function into a generator function.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch3 id=\"sintesis-besar-1\"\u003eSintesis besar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-besar-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eChapter 3 adalah bab yang mengubah pembaca dari “orang yang pernah coba AI app di JS” menjadi “orang yang siap mengikuti stack AI Python.”\u003c/p\u003e\n\u003ch3 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eBab ini bukan promosi Python; ini pembelajaran ekosistem.\u003c/li\u003e\n\u003cli\u003eRepeating the same example menurunkan cognitive load.\u003c/li\u003e\n\u003cli\u003ePydantic + FastAPI + generator membentuk idiom Python modern yang cocok buat AI service.\u003c/li\u003e\n\u003cli\u003eIni adalah bab enabler; dia memastikan sisa perjalanan bisa dilanjut tanpa kegagapan tool/bahasa.\u003c/li\u003e\n\u003cli\u003eYang berubah di sini adalah kendaraan, bukan arah.\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook-summary (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.the-developers-guide-to-ai\"\u003eThe Developer's Guide to AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["
