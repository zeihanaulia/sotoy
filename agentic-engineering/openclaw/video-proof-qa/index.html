ps":{"note":{"id":"notes.agentic-engineering.openclaw-video-proof-qa","title":"Video Proof Qa","desc":"Insight dari thread X Peter Steinberger tentang bukti video QA sebagai artefak yang bisa diaudit untuk review dan agentic engineering.","updated":1780426699474,"created":1778671796390,"tags":["notes","til","ai","agentic-engineering","qa","evidence"],"source":"https://x.com/steipete/status/2053420175379046643","custom":{"source":"https://x.com/steipete/status/2053420175379046643"},"fname":"notes.agentic-engineering.openclaw.video-proof-qa","type":"note","vault":{"fsPath":"vault"},"contentHash":"6e7b07e8712ea1debb7f229bb0f9b5ae","links":[{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.til","alias":"til","xvault":false,"to":{"fname":"tags.til"}},{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.ai","alias":"ai","xvault":false,"to":{"fname":"tags.ai"}},{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.agentic-engineering","alias":"agentic-engineering","xvault":false,"to":{"fname":"tags.agentic-engineering"}},{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.qa","alias":"qa","xvault":false,"to":{"fname":"tags.qa"}},{"type":"frontmatterTag","from":{"fname":"notes.agentic-engineering.openclaw.video-proof-qa","id":"notes.agentic-engineering.openclaw-video-proof-qa","vaultName":"vault"},"value":"tags.evidence","alias":"evidence","xvault":false,"to":{"fname":"tags.evidence"}}],"anchors":{"overview":{"type":"header","text":"Overview","value":"overview","line":18,"column":0,"depth":2},"4-pertanyaan-kunci":{"type":"header","text":"4 pertanyaan kunci","value":"4-pertanyaan-kunci","line":30,"column":0,"depth":2},"1-sebenernya-peter-lagi-ngumumin-apa":{"type":"header","text":"1. Sebenernya Peter lagi ngumumin apa?","value":"1-sebenernya-peter-lagi-ngumumin-apa","line":32,"column":0,"depth":3},"2-kenapa-reply-reply-orang-ngerasa-ini-penting-banget":{"type":"header","text":"2. Kenapa reply-reply orang ngerasa ini penting banget?","value":"2-kenapa-reply-reply-orang-ngerasa-ini-penting-banget","line":47,"column":0,"depth":3},"3-apa-implikasi-praktisnya-buat-engineeringqa-workflow":{"type":"header","text":"3. Apa implikasi praktisnya buat engineering/QA workflow?","value":"3-apa-implikasi-praktisnya-buat-engineeringqa-workflow","line":60,"column":0,"depth":3},"4-di-balik-hype-nya-apa-batasan-dan-failure-mode-nya":{"type":"header","text":"4. Di balik hype-nya, apa batasan dan failure mode-nya?","value":"4-di-balik-hype-nya-apa-batasan-dan-failure-mode-nya","line":71,"column":0,"depth":3},"synthesis":{"type":"header","text":"Synthesis","value":"synthesis","line":81,"column":0,"depth":2},"kesimpulan":{"type":"header","text":"Kesimpulan","value":"kesimpulan","line":96,"column":0,"depth":2}},"children":[],"parent":"gql1okgkws4w6zsv0ixl8cp","data":{}},"body":"\u003ch1 id=\"video-proof-qa\"\u003eVideo Proof Qa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#video-proof-qa\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread ini bukan cuma soal \"ada video QA\". Ini soal mereka memindahkan bukti kualitas dari teks statis ke artefak visual yang bisa diaudit, lalu masuk ke workflow review.\u003c/p\u003e\n\u003cp\u003eDari konteks OpenClaw, inti pengumumannya adalah: mereka sekarang bisa generate \u003cstrong\u003evideo proof untuk issue\u003c/strong\u003e sebagai bagian dari QA automation. Komponennya mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eworkflow GitHub/Codex yang bikin \u003cstrong\u003ebefore/after\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ecrabbox\u003c/strong\u003e untuk screen recording\u003c/li\u003e\n\u003cli\u003eautomasi login Telegram nyata\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalimat ringkasnya: bukan sekadar test pass/fail, tapi artefak bukti yang bisa dilihat dan diverifikasi.\u003c/p\u003e\n\u003ch2 id=\"4-pertanyaan-kunci\"\u003e4 pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-sebenernya-peter-lagi-ngumumin-apa\"\u003e1. Sebenernya Peter lagi ngumumin apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-sebenernya-peter-lagi-ngumumin-apa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePeter ngasih sinyal bahwa OpenClaw sekarang bisa menghasilkan evidence video sekaligus automation. Yang dia garis bawahi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoutput QA bukan hanya hijau/merah\u003c/li\u003e\n\u003cli\u003eartefak bukti bukti kondisi sebelum dan sesudah\u003c/li\u003e\n\u003cli\u003einteraksi dengan UI nyata, termasuk login Telegram real\u003c/li\u003e\n\u003cli\u003ebukti dikemas untuk review, bukan cuma internal log\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi konsepnya adalah kombinasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eautomation runner\u003c/li\u003e\n\u003cli\u003eUI session recorder\u003c/li\u003e\n\u003cli\u003epackaging evidence ke PR/review flow\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-kenapa-reply-reply-orang-ngerasa-ini-penting-banget\"\u003e2. Kenapa reply-reply orang ngerasa ini penting banget?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-reply-reply-orang-ngerasa-ini-penting-banget\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eReply di thread ini konsisten menunjuk pada satu tema: \u003cstrong\u003etrust dan auditability\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eada yang langsung bilang ingin setup serupa untuk kerjaan mereka\u003c/li\u003e\n\u003cli\u003eada yang apresiasi karena ini open source dan bisa direplikasi\u003c/li\u003e\n\u003cli\u003eada yang ingatkan bahwa perubahan UI/behavior sulit divalidasi hanya dari diff\u003c/li\u003e\n\u003cli\u003eada yang bilang banyak repro steps itu fiction\u003c/li\u003e\n\u003cli\u003eada yang komentar screenshot sudah terasa jadul karena transition lebih bisa diperlihatkan dengan video\u003c/li\u003e\n\u003cli\u003eada yang sebut ini \"boring stuff\" yang membuat agent berguna untuk pekerjaan nyata\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: bukti visual bukan gimmick. Ini respond terhadap problem yang nyata di QA + review: manusia susah verifikasi perubahan hanya dari kode.\u003c/p\u003e\n\u003ch3 id=\"3-apa-implikasi-praktisnya-buat-engineeringqa-workflow\"\u003e3. Apa implikasi praktisnya buat engineering/QA workflow?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-apa-implikasi-praktisnya-buat-engineeringqa-workflow\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa implikasi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePR review bergeser dari code-only ke code + behavior evidence\u003c/li\u003e\n\u003cli\u003eQA automation jadi lebih komunikatif untuk engineer, PM, designer, QA, dan pemangku kepentingan non-teknis\u003c/li\u003e\n\u003cli\u003ecocok untuk sistem agentic: agent bisa buat perubahan, manusia butuh bukti eksternal\u003c/li\u003e\n\u003cli\u003ebisa jadi primitive baru untuk triage issue: reproduce, record before, apply fix, record after, attach ke issue/PR\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang penting: bukan hanya mempercepat review, tapi memperpendek gap antara perubahan kode dan efek nyata di UI/perilaku.\u003c/p\u003e\n\u003ch3 id=\"4-di-balik-hype-nya-apa-batasan-dan-failure-mode-nya\"\u003e4. Di balik hype-nya, apa batasan dan failure mode-nya?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-di-balik-hype-nya-apa-batasan-dan-failure-mode-nya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eVideo proof kuat, tapi bukan kebenaran mutlak.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evideo hanya menunjukkan permukaan, bukan semua layer sistem\u003c/li\u003e\n\u003cli\u003eia tidak menjamin data layer aman, side effect benar, performance stabil, atau accessibility beres\u003c/li\u003e\n\u003cli\u003edeterminism di UI rentan pada timing, network, animasi, external service, session\u003c/li\u003e\n\u003cli\u003einfra dan maintenance lebih mahal dibanding screenshot: recording, storage, trimming, diffing, attach ke PR, secret management, environment stabil\u003c/li\u003e\n\u003cli\u003eada risiko overtrust: bukti yang enak dilihat dianggap lengkap walau belum mengecek semua aspek\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"synthesis\"\u003eSynthesis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#synthesis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau disambung, benang merahnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epost utama bicara tentang otomasi bukti\u003c/li\u003e\n\u003cli\u003ereply menegaskan masalah ambiguity di review dan QA\u003c/li\u003e\n\u003cli\u003eimplikasi praktis menunjukkan agentic workflow perlu evidence pipeline\u003c/li\u003e\n\u003cli\u003ebatasan mengingatkan bahwa visual proof harus ditempatkan sebagai bagian dari sistem validasi yang lebih luas\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan kata lain:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eSemakin kuat agent/automasinya, semakin besar kebutuhan pada bukti yang mudah diaudit.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThread ini resonate karena ia tidak cuma memperkenalkan \"video\". Ia memperlihatkan bentuk trust infrastructure praktis untuk dunia yang makin cepat berubah.\u003c/p\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePoin yang paling penting bukan sekadar \"video QA baru\".\u003c/p\u003e\n\u003cp\u003ePoin pentingnya adalah: mereka sedang membangun mekanisme pembuktian untuk perubahan yang dibuat sistem otomatis. Video before/after adalah salah satu artefak yang membantu manusia percaya pada output agent.\u003c/p\u003e\n\u003cp\u003eKalau lo ingin lanjut, ada tiga lapisan berikutnya yang bisa ditulis:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003earsitektur teknis yang mungkin dipakai\u003c/li\u003e\n\u003cli\u003eimplikasi buat agent/codex workflow\u003c/li\u003e\n\u003cli\u003echecklist mereplikasi pola ini di project lo\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eqa (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eevidence (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading
