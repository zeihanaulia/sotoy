":"9. Reasoning output disimpan di mana?","value":"9-reasoning-output-disimpan-di-mana","line":430,"column":0,"depth":2},"10-apa-yang-sebenarnya-dipikirkan-oleh-honcho":{"type":"header","text":"10. Apa yang sebenarnya “dipikirkan” oleh Honcho?","value":"10-apa-yang-sebenarnya-dipikirkan-oleh-honcho","line":459,"column":0,"depth":2},"11-failure-mode-honcho-reasoning":{"type":"header","text":"11. Failure mode Honcho Reasoning","value":"11-failure-mode-honcho-reasoning","line":481,"column":0,"depth":2},"failure-1-overgeneralization":{"type":"header","text":"Failure 1: Overgeneralization","value":"failure-1-overgeneralization","line":485,"column":0,"depth":3},"failure-2-abduction-terlalu-spekulatif":{"type":"header","text":"Failure 2: Abduction terlalu spekulatif","value":"failure-2-abduction-terlalu-spekulatif","line":505,"column":0,"depth":3},"failure-3-contradiction-handling-gagal":{"type":"header","text":"Failure 3: Contradiction handling gagal","value":"failure-3-contradiction-handling-gagal","line":521,"column":0,"depth":3},"failure-4-memory-inertia":{"type":"header","text":"Failure 4: Memory inertia","value":"failure-4-memory-inertia","line":538,"column":0,"depth":3},"failure-5-hidden-bias-dari-reasoning-model":{"type":"header","text":"Failure 5: Hidden bias dari reasoning model","value":"failure-5-hidden-bias-dari-reasoning-model","line":544,"column":0,"depth":3},"12-kenapa-ini-beda-dari-ai-summary":{"type":"header","text":"12. Kenapa ini beda dari “AI summary”?","value":"12-kenapa-ini-beda-dari-ai-summary","line":550,"column":0,"depth":2},"13-linking-hubungan-reasoning-dengan-arsitektur-honcho":{"type":"header","text":"13. Linking: hubungan reasoning dengan arsitektur Honcho","value":"13-linking-hubungan-reasoning-dengan-arsitektur-honcho","line":571,"column":0,"depth":2},"14-insight-penutup":{"type":"header","text":"14. Insight penutup","value":"14-insight-penutup","line":603,"column":0,"depth":2},"15-korelasi-dengan-konsep-lain":{"type":"header","text":"15. Korelasi dengan konsep lain","value":"15-korelasi-dengan-konsep-lain","line":616,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":654,"column":0,"depth":2}},"children":[],"parent":"r970j7o3cwojzrfs80avkt5","data":{}},"body":"\u003ch1 id=\"reasoning\"\u003eReasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#reasoning\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eArti yang gue pakai: \u003cstrong\u003e“Honcho Reasoning” = mekanisme Honcho untuk mengolah message menjadi kesimpulan, pola, dan representasi peer\u003c/strong\u003e, bukan reasoning model umum seperti “chain-of-thought LLM”.\u003c/p\u003e\n\u003cp\u003eIstilah yang perlu dikunci:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e“Reasoning” di sini bukan sekadar model menjawab pertanyaan. Ini proses backend yang jalan setelah data/message masuk.\u003c/li\u003e\n\u003cli\u003e“Formal logic” di sini berarti Honcho mencoba mengubah data menjadi struktur seperti premis eksplisit dan kesimpulan deduktif.\u003c/li\u003e\n\u003cli\u003e“Latent information” berarti informasi yang tidak ditulis langsung, tapi bisa disimpulkan dari pola banyak interaksi.\u003c/li\u003e\n\u003cli\u003e“Peer representation” adalah hasil akhirnya: model tentang user/agent/entity yang bisa dipakai agent sebagai konteks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"1-pertanyaan-kunci\"\u003e1. Pertanyaan kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk ngerti Honcho Reasoning, ada 6 pertanyaan inti:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eKenapa Honcho butuh reasoning, bukan cukup RAG?\u003c/li\u003e\n\u003cli\u003eApa yang dimaksud “latent information”?\u003c/li\u003e\n\u003cli\u003eBagaimana formal logic dipakai?\u003c/li\u003e\n\u003cli\u003eJenis reasoning apa saja yang dilakukan?\u003c/li\u003e\n\u003cli\u003eBagaimana prosesnya berjalan secara teknis?\u003c/li\u003e\n\u003cli\u003eApa trade-off dari pendekatan ini?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nHoncho Reasoning adalah usaha mengubah memory dari \u003cstrong\u003earsip pasif\u003c/strong\u003e menjadi \u003cstrong\u003epemahaman aktif\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eRAG biasa bertanya: “Potongan teks mana yang mirip dengan query ini?”\u003c/p\u003e\n\u003cp\u003eHoncho Reasoning bertanya: “Dari semua data yang pernah masuk, apa yang bisa disimpulkan secara eksplisit, deduktif, pola, kontradiksi, dan penjelasan perilakunya?”\u003c/p\u003e\n\u003cp\u003eJadi memory-nya bukan cuma dicari. Memory-nya “dipikirkan”.\n───────────────────────────────────\u003c/p\u003e\n\u003ch2 id=\"2-kenapa-reasoning-diperlukan\"\u003e2. Kenapa reasoning diperlukan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-reasoning-diperlukan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage-nya mengkritik RAG tradisional:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Traditional RAG systems treat memory as static storage—they retrieve what was explicitly said when semantically similar queries appear.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eMaksudnya: RAG bagus untuk mengambil informasi yang pernah ditulis eksplisit. Tapi RAG sering gagal menangkap informasi yang tersebar di banyak tempat.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eDi session 1 elo bilang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Jawaban ini terlalu muter-muter.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi session 2 elo bilang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Langsung ke intinya aja.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi session 3 elo bilang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Kasih reasoning, tapi jangan normatif.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRAG bisa mengambil tiga kalimat itu kalau query cocok. Tapi Honcho ingin menyimpulkan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers direct explanations with reasoning, but dislikes vague hedging.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKesimpulan itu tidak pernah elo tulis persis. Tapi ia bisa ditarik dari pola.\u003c/p\u003e\n\u003cp\u003eInilah yang disebut \u003cstrong\u003elatent information\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"3-apa-itu-latent-information\"\u003e3. Apa itu latent information?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-apa-itu-latent-information\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLatent information adalah informasi tersembunyi di balik data mentah.\u003c/p\u003e\n\u003cp\u003eBukan tersembunyi secara mistis, tapi tersebar, implisit, atau perlu dirangkai.\u003c/p\u003e\n\u003cp\u003eContoh data mentah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser sering meminta:\n- contoh konkret\n- breakdown step-by-step\n- koreksi kalau asumsi salah\n- jangan main tengah\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLatent information-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser values precise reasoning, concrete examples, and clear judgment over vague neutrality.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bukan quote langsung. Ini hasil reasoning.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“we extract all latent information by reasoning about everything, so it’s there when you need it.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalimat ini penting karena menjelaskan ambisi Honcho: jangan tunggu query user cocok dengan memory. Proses dulu data menjadi kesimpulan, supaya nanti siap dipakai.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRaw messages = bahan mentah\nReasoning = proses ekstraksi makna\nRepresentation = hasil pemahaman yang bisa dipakai ulang\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"4-formal-logic-framework-premis-dan-kesimpulan\"\u003e4. Formal logic framework: premis dan kesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-formal-logic-framework-premis-dan-kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho bilang sistem reasoning-nya memakai \u003cstrong\u003eformal logical reasoning\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003ePage memberi contoh struktur data:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e{\n  \"explicit\": [\n    { \"content\": \"premise 1\" },\n    { \"content\": \"premise n\" }\n  ],\n  \"deductive\": [\n    {\n      \"premises\": [\"premise 1\", \"premise n\"],\n      \"conclusion\": \"conclusion 1\"\n    }\n  ]\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni penting karena Honcho tidak ingin output reasoning cuma paragraf bebas. Ia ingin reasoning yang terstruktur:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eApa premisnya?\nKesimpulan apa yang ditarik?\nKesimpulan itu berasal dari premis mana?\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh versi manusia:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e{\n  \"explicit\": [\n    { \"content\": \"User said: 'Langsung ke intinya aja.'\" },\n    { \"content\": \"User said: 'Jangan terlalu normatif.'\" }\n  ],\n  \"deductive\": [\n    {\n      \"premises\": [\n        \"User asked to get straight to the point.\",\n        \"User dislikes overly normative answers.\"\n      ],\n      \"conclusion\": \"User prefers direct, concrete analysis over vague general advice.\"\n    }\n  ]\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKuncinya: reasoning Honcho mencoba menjaga hubungan antara bukti dan kesimpulan.\u003c/p\u003e\n\u003cp\u003eIni bagus karena memory yang baik harus bisa diaudit. Kalau representation bilang “user suka X”, developer idealnya bisa melacak: dari message/premis mana kesimpulan itu muncul?\u003c/p\u003e\n\u003ch2 id=\"5-jenis-reasoning-yang-dilakukan-honcho\"\u003e5. Jenis reasoning yang dilakukan Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-jenis-reasoning-yang-dilakukan-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage menyebut beberapa jenis reasoning/scaffolding:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eExplicit extraction\u003c/li\u003e\n\u003cli\u003eDeductive conclusions\u003c/li\u003e\n\u003cli\u003ePeer cards\u003c/li\u003e\n\u003cli\u003eConsolidation\u003c/li\u003e\n\u003cli\u003eInduction\u003c/li\u003e\n\u003cli\u003eAbduction\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKita pecah satu-satu.\u003c/p\u003e\n\u003ch3 id=\"51-explicit-extraction\"\u003e5.1 Explicit extraction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#51-explicit-extraction\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni mengambil hal yang memang dinyatakan langsung.\u003c/p\u003e\n\u003cp\u003eContoh message:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Gue pakai macOS dan lagi belajar sandbox-exec.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eExplicit extraction:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser uses macOS.\nUser is learning sandbox-exec.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni level paling aman karena dekat dengan teks asli.\u003c/p\u003e\n\u003ch3 id=\"52-deductive-reasoning\"\u003e5.2 Deductive reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#52-deductive-reasoning\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDeduksi menarik kesimpulan yang secara logis mengikuti premis.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003ePremis:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser uses macOS.\nsandbox-exec is a macOS sandboxing tool.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKesimpulan deduktif:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esandbox-exec guidance is relevant to the user's environment.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDeduksi harus hati-hati. Kesimpulan harus mengikuti premis, bukan sekadar terdengar masuk akal.\u003c/p\u003e\n\u003ch3 id=\"53-peer-cards\"\u003e5.3 Peer cards\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#53-peer-cards\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePeer card adalah ringkasan identitas/biografi penting tentang peer.\u003c/p\u003e\n\u003cp\u003eKalau peer-nya user, peer card bisa berisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- uses Indonesian casual \"gue-elo\" style\n- interested in AI agents, memory systems, and sandboxing\n- prefers structured, sharp explanations\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau peer-nya agent, peer card bisa berisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- acts as coding assistant\n- specializes in repo analysis\n- often helps with CLI setup\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePeer card itu semacam kartu profil yang bisa disuntikkan ke agent supaya konteks dasarnya tidak hilang.\u003c/p\u003e\n\u003ch3 id=\"54-consolidation\"\u003e5.4 Consolidation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#54-consolidation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eConsolidation menggabungkan informasi yang redundant atau mendeteksi kontradiksi.\u003c/p\u003e\n\u003cp\u003eContoh redundant:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers concise answers.\nUser likes direct answers.\nUser dislikes rambling.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBisa dikonsolidasikan menjadi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers direct, concise answers.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eContoh kontradiksi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSession lama: User prefers short answers.\nSession baru: User asks for deep dives and detailed breakdowns.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eConsolidation harus bisa menandai bahwa preferensi mungkin berubah atau bergantung konteks.\u003c/p\u003e\n\u003cp\u003eIni penting karena memory yang terus bertambah tanpa konsolidasi akan jadi bising.\u003c/p\u003e\n\u003ch3 id=\"55-induction\"\u003e5.5 Induction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#55-induction\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eInduksi adalah pattern recognition dari banyak contoh.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eDalam banyak sesi, user sering menanyakan:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e- apa trade-off-nya?\n- failure mode-nya apa?\n- kenapa orang salah paham?\n- bandingkan dengan konsep lain\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eInductive conclusion:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser tends to evaluate technical concepts through failure modes, trade-offs, and conceptual comparisons.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bukan hasil satu message. Ini pola lintas banyak message.\u003c/p\u003e\n\u003ch3 id=\"56-abduction\"\u003e5.6 Abduction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#56-abduction\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAbduction adalah mencari penjelasan paling sederhana untuk perilaku yang diamati.\u003c/p\u003e\n\u003cp\u003eContoh observasi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser repeatedly asks for citations.\nUser questions unsourced claims.\nUser flags AI-generated-looking documents.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAbductive explanation:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is concerned with epistemic reliability and source quality.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAbduction ini kuat, tapi paling rawan salah. Karena ia menebak penjelasan terbaik, bukan membuktikan secara pasti.\u003c/p\u003e\n\u003cp\u003eJadi abduction harus dipakai sebagai hipotesis, bukan fakta keras.\u003c/p\u003e\n\u003ch2 id=\"6-cara-kerjanya-secara-teknis\"\u003e6. Cara kerjanya secara teknis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-cara-kerjanya-secara-teknis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow-nya kira-kira begini:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessages masuk\n→ disimpan langsung\n→ masuk queue background\n→ diproses dalam urutan session/peer\n→ reasoning model membuat explicit/deductive/pattern/summary\n→ hasil disimpan sebagai bagian dari peer representation\n→ di-index ke vector collections\n→ agent bisa query context saat butuh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“When you write messages to Honcho, they’re stored immediately and enqueued for background processing.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni berarti write cepat, reasoning belakangan.\u003c/p\u003e\n\u003cp\u003eLalu page bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“session-based queues maintain chronological consistency”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni penting. Reasoning perlu urutan waktu. Kalau pesan diproses acak, kesimpulan bisa kacau.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eMessage 1:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Gue dulu pakai Python.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMessage 2:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Sekarang gue pindah ke Rust.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau urutannya kebalik, representation bisa salah.\u003c/p\u003e\n\u003cp\u003eChronological consistency menjaga agar perubahan state dibaca sesuai waktu.\u003c/p\u003e\n\u003ch2 id=\"7-token-batching-kenapa-tidak-reasoning-tiap-message\"\u003e7. Token batching: kenapa tidak reasoning tiap message?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-token-batching-kenapa-tidak-reasoning-tiap-message\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHoncho tidak langsung menjalankan reasoning untuk setiap message kecil.\u003c/p\u003e\n\u003cp\u003ePage bilang Honcho menunggu sampai total token pending untuk peer representation melewati threshold sekitar \u003cstrong\u003e1.000 token\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eMaksudnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMessage pendek:\n\"yes\"\n\"ok\"\n\"sounds good\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTidak langsung diproses satu-satu. Mereka ditahan dulu di queue sampai cukup konteks.\u003c/p\u003e\n\u003cp\u003eKenapa?\u003c/p\u003e\n\u003cp\u003ePertama, biaya. Honcho charges based on reasoning passes, jadi terlalu sering reasoning mahal.\u003c/p\u003e\n\u003cp\u003eKedua, kualitas. Reasoning dari satu message pendek sering tidak bermakna.\u003c/p\u003e\n\u003cp\u003eKetiga, konteks. Batch 1.000 token memberi cukup bahan untuk menarik kesimpulan.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eReasoning butuh cukup konteks.\nTerlalu sedikit data = inference rapuh.\nTerlalu sering infer = mahal.\nBatching = kompromi cost dan kualitas.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTapi ada trade-off:\u003c/p\u003e\n\u003cp\u003eKarena batching, memory baru mungkin belum langsung masuk representation sampai threshold tercapai.\u003c/p\u003e\n\u003cp\u003eJadi ada delay epistemik: sistem sudah menyimpan message, tapi belum tentu sudah “memahami” message itu.\u003c/p\u003e\n\u003ch2 id=\"8-kenapa-pakai-custom-model\"\u003e8. Kenapa pakai custom model?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-kenapa-pakai-custom-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage bilang off-the-shelf LLM bisa melakukan formal reasoning, tapi tidak optimal.\u003c/p\u003e\n\u003cp\u003eHoncho memakai custom models yang dilatih untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elogical rigor\u003c/li\u003e\n\u003cli\u003estructured output\u003c/li\u003e\n\u003cli\u003eefficiency\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMaksudnya:\u003c/p\u003e\n\u003cp\u003eGeneral LLM cenderung menjawab dengan teks yang terdengar masuk akal. Tapi untuk memory system, output harus lebih disiplin:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epremis jelas\nkesimpulan jelas\nschema konsisten\nbiaya rendah\nlatency terkendali\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePage menyebut output-nya perlu JSON schema konsisten dengan premises dan conclusions.\u003c/p\u003e\n\u003cp\u003eIni masuk akal. Kalau output reasoning tidak konsisten, susah disimpan, dicari, digabung, dan diaudit.\u003c/p\u003e\n\u003ch2 id=\"9-reasoning-output-disimpan-di-mana\"\u003e9. Reasoning output disimpan di mana?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-reasoning-output-disimpan-di-mana\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOutput reasoning seperti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003econclusions\u003c/li\u003e\n\u003cli\u003esummaries\u003c/li\u003e\n\u003cli\u003epeer cards\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003edisimpan sebagai bagian dari \u003cstrong\u003epeer representations\u003c/strong\u003e dan di-index ke \u003cstrong\u003evector collections\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eIni berarti ketika agent nanti minta context, Honcho tidak hanya mencari raw message. Ia juga mencari hasil reasoning.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eRaw message:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Gue gak suka jawaban yang main tengah.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoned conclusion:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser prefers clear judgment and dislikes evasive neutrality.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNanti kalau agent mendapat situasi yang butuh memberi opini, retrieval bisa mengambil conclusion itu, walau query user tidak memakai kata “main tengah”.\u003c/p\u003e\n\u003cp\u003eIni manfaat retrieval atas conclusion, bukan cuma retrieval atas chat log.\u003c/p\u003e\n\u003ch2 id=\"10-apa-yang-sebenarnya-dipikirkan-oleh-honcho\"\u003e10. Apa yang sebenarnya “dipikirkan” oleh Honcho?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-apa-yang-sebenarnya-dipikirkan-oleh-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJangan bayangkan Honcho “sadar” atau “memahami” seperti manusia. Lebih tepat:\u003c/p\u003e\n\u003cp\u003eHoncho menjalankan pipeline inferensi untuk membuat struktur interpretatif.\u003c/p\u003e\n\u003cp\u003eIa mencoba menjawab:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eApa yang eksplisit?\nApa yang bisa disimpulkan?\nApa pola yang berulang?\nApa yang redundant?\nApa yang kontradiktif?\nApa penjelasan paling sederhana?\nApa profil peer yang berguna?\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHasilnya bukan kebenaran mutlak. Hasilnya adalah \u003cstrong\u003estate interpretatif\u003c/strong\u003e yang berguna untuk agent.\u003c/p\u003e\n\u003cp\u003eIni penting: reasoning menghasilkan useful context, bukan wahyu.\u003c/p\u003e\n\u003ch2 id=\"11-failure-mode-honcho-reasoning\"\u003e11. Failure mode Honcho Reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-failure-mode-honcho-reasoning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSistem ini powerful, tapi ada risiko.\u003c/p\u003e\n\u003ch3 id=\"failure-1-overgeneralization\"\u003eFailure 1: Overgeneralization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-1-overgeneralization\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDari satu dua message, sistem bisa menyimpulkan terlalu luas.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cp\u003eUser bilang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Jawab pendek aja, gue lagi buru-buru.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKesimpulan salah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser always prefers short answers.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePadahal konteksnya sementara.\u003c/p\u003e\n\u003ch3 id=\"failure-2-abduction-terlalu-spekulatif\"\u003eFailure 2: Abduction terlalu spekulatif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-2-abduction-terlalu-spekulatif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eObservasi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser sering tanya soal ekonomi Indonesia.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAbduksi salah:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eUser is an economist.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePadahal mungkin user cuma tertarik politik-ekonomi.\u003c/p\u003e\n\u003ch3 id=\"failure-3-contradiction-handling-gagal\"\u003eFailure 3: Contradiction handling gagal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-3-contradiction-handling-gagal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUser bisa berubah.\u003c/p\u003e\n\u003cp\u003eDulu:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Saya suka jawaban ringkas.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSekarang:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\"Dive deep satu-satu.\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSistem harus memahami bahwa preferensi tergantung konteks, bukan salah satu harus dihapus.\u003c/p\u003e\n\u003ch3 id=\"failure-4-memory-inertia\"\u003eFailure 4: Memory inertia\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-4-memory-inertia\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRepresentation lama bisa terlalu kuat dan menghambat update.\u003c/p\u003e\n\u003cp\u003eAgent jadi menjawab berdasarkan “profil lama” meski user sudah berubah.\u003c/p\u003e\n\u003ch3 id=\"failure-5-hidden-bias-dari-reasoning-model\"\u003eFailure 5: Hidden bias dari reasoning model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-5-hidden-bias-dari-reasoning-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena conclusion dibuat oleh model, ia bisa membawa bias model: menafsirkan perilaku user dengan asumsi yang tidak diminta.\u003c/p\u003e\n\u003cp\u003eJadi developer perlu audit, feedback, atau mekanisme correction.\u003c/p\u003e\n\u003ch2 id=\"12-kenapa-ini-beda-dari-ai-summary\"\u003e12. Kenapa ini beda dari “AI summary”?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-kenapa-ini-beda-dari-ai-summary\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSummary hanya merangkum.\u003c/p\u003e\n\u003cp\u003eHoncho Reasoning lebih ambisius:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esummary = apa isi data\nexplicit = apa yang dinyatakan\ndeductive = apa yang pasti mengikuti premis\ninduction = pola dari banyak data\nabduction = penjelasan paling sederhana\nconsolidation = gabung/hapus/konflik\npeer card = profil ringkas entitas\nrepresentation = state jangka panjang\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi summary cuma satu komponen kecil.\u003c/p\u003e\n\u003cp\u003eKalau summary seperti “catatan rapat”, reasoning seperti “analisis berkelanjutan tentang orang/proyek/tim”.\u003c/p\u003e\n\u003ch2 id=\"13-linking-hubungan-reasoning-dengan-arsitektur-honcho\"\u003e13. Linking: hubungan reasoning dengan arsitektur Honcho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-linking-hubungan-reasoning-dengan-arsitektur-honcho\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi arsitektur sebelumnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace → Peer → Session → Message\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eReasoning masuk setelah message.\u003c/p\u003e\n\u003cp\u003eRelasi lengkapnya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eWorkspace memberi batas\nPeer memberi identitas\nSession memberi konteks waktu\nMessage memberi bahan mentah\nReasoning memberi interpretasi\nRepresentation menyimpan state\nContext endpoint mengirim state ke agent\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eJadi reasoning adalah mesin transformasi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessage history → learned peer state\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTanpa reasoning, Honcho cuma jadi database message + vector search.\u003c/p\u003e\n\u003cp\u003eDengan reasoning, Honcho menjadi continual memory system.\u003c/p\u003e\n\u003ch2 id=\"14-insight-penutup\"\u003e14. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e★ Insight ─────────────────────────\nHoncho Reasoning paling gampang dipahami sebagai “lapisan penalaran di antara log dan memory”.\u003c/p\u003e\n\u003cp\u003eLog mencatat apa yang terjadi.\nReasoning menafsirkan apa artinya.\nRepresentation menyimpan pemahaman sementara.\nAgent memakai pemahaman itu untuk bertindak lebih konsisten.\u003c/p\u003e\n\u003cp\u003eKesalahan umum: mengira reasoning berarti agent “mengingat lebih banyak”. Bukan. Reasoning berarti agent mencoba \u003cstrong\u003emengingat dengan struktur makna\u003c/strong\u003e, bukan cuma menumpuk riwayat.\n───────────────────────────────────\u003c/p\u003e\n\u003ch2 id=\"15-korelasi-dengan-konsep-lain\"\u003e15. Korelasi dengan konsep lain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-korelasi-dengan-konsep-lain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKonsep pertama: \u003cstrong\u003eevent sourcing\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eEvent sourcing:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eevents → projections/state\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHoncho:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessages → reasoning → peer representations\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKesamaannya: state dibangun dari event/message.\u003c/p\u003e\n\u003cp\u003eBedanya: event sourcing deterministik, Honcho interpretatif.\u003c/p\u003e\n\u003cp\u003eKonsep kedua: \u003cstrong\u003eknowledge graph inference\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eKnowledge graph menyimpan entity dan relasi, lalu melakukan inference.\u003c/p\u003e\n\u003cp\u003eHoncho mirip karena ia membangun kesimpulan tentang peer. Tapi Honcho tidak hanya mengandalkan graph yang predefined. Ia memakai reasoning model untuk menarik kesimpulan dari message.\u003c/p\u003e\n\u003cp\u003eKonsep ketiga: \u003cstrong\u003eZettelkasten\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eZettelkasten membangun jaringan pemahaman dari catatan kecil. Honcho Reasoning mencoba otomatisasi sebagian proses itu:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emessage kecil → premise → conclusion → pattern → representation\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBedanya: Zettelkasten biasanya manusia yang menghubungkan ide. Honcho memakai model untuk menghubungkan bukti dan kesimpulan.\u003c/p\u003e\n\u003cp\u003eKesimpulan pendeknya: \u003cstrong\u003eHoncho Reasoning adalah pipeline background yang mengubah message menjadi kesimpulan terstruktur dan representation peer, supaya agent punya memory yang bukan cuma searchable, tapi bisa meniru statefulness.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.peer-representations\"\u003ePeer Representations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.design-patterns\"\u003eHoncho Design Patterns\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u00
