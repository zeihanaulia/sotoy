u003efokus ke talk Andrej Karpathy \"Software Is Changing (Again)\".\u003c/li\u003e\n\u003cli\u003etujuan: dukung ide zettel tentang small incremental chunks, tight leash, verification loop, dan partial autonomy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apa-yang-gue-kerjain\"\u003eApa yang gue kerjain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-gue-kerjain\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eupdate note \u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.karpathy-keep-ai-on-the-leash\"\u003eKarpathy: Keep AI on the Leash\u003c/a\u003e supaya langsung merujuk ke talk YC dan sumber non-paywall.\u003c/li\u003e\n\u003cli\u003etambahin timestamp penting dan framing istilah: leash, small incremental chunks, generation-verification loop, partial autonomy.\u003c/li\u003e\n\u003cli\u003esinkronkan \u003ca href=\"/sotoy/notes/zettel.1778001021442\"\u003eAgentic engineering differs from vibe coding\u003c/a\u003e supaya ada dukungan Karpathy yang lebih tepat dari talk asli.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight-singkat\"\u003eInsight singkat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-singkat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eKarpathy menegaskan: AI boleh generate cepat, tapi manusia tetap bottleneck untuk correctness, security, dan intent.\u003c/li\u003e\n\u003cli\u003eprinsipnya bukan \"AI off\" vs \"AI bebas\", melainkan autonomy slider yang disesuaikan dengan kompleksitas dan risiko tugas.\u003c/li\u003e\n\u003cli\u003eoutput AI besar bisa jadi bahaya, karena verifikasi manusia masih perlu berjalan.\u003c/li\u003e\n\u003cli\u003eperubahan kecil bukan sekadar size, tapi unit yang bisa diverifikasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"next-step\"\u003eNext step\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#next-step\"\u003e\u003c/a\u003e\u003c/h3\u003e
