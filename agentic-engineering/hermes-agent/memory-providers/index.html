icon-link\" href=\"#memory-providers\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eIni bukan cuma daftar plugin. Yang gue tangkap dari dokumentasi Hermes Agent adalah ini peta otak agent: built-in memory selalu ada, lalu provider eksternal menambahkan lapisan ingatan lintas sesi dengan gaya retrieval/recall tertentu.\u003c/p\u003e\n\u003ch2 id=\"apa-itu-memory-provider-di-hermes-agent\"\u003eApa itu Memory Provider di Hermes Agent?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-memory-provider-di-hermes-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMemory Provider di sini adalah backend eksternal untuk menyimpan, mencari, dan menyuntikkan konteks ke agent. Ini bukan memori komputer biasa, tapi plugin yang membuat Hermes punya persistent memory lintas sesi di luar \u003ccode\u003eMEMORY.md\u003c/code\u003e dan \u003ccode\u003eUSER.md\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eYang penting: built-in memory tetap aktif. Provider eksternal itu additive, bukan pengganti. Jadi agent tetap punya catatan lokal, lalu provider bisa menambahkan kemampuan seperti semantic search, graph reasoning, atau user modeling.\u003c/p\u003e\n\u003ch2 id=\"bagaimana-cara-kerjanya-saat-agent-berjalan\"\u003eBagaimana cara kerjanya saat agent berjalan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bagaimana-cara-kerjanya-saat-agent-berjalan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKetika provider aktif, Hermes melakukan beberapa hal otomatis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einject konteks provider ke system prompt;\u003c/li\u003e\n\u003cli\u003eprefetch memory relevan sebelum setiap turn (background, non-blocking);\u003c/li\u003e\n\u003cli\u003esimpan percakapan setelah respons;\u003c/li\u003e\n\u003cli\u003eekstrak memory sesi akhir jika provider mendukung;\u003c/li\u003e\n\u003cli\u003ecerminkan write ke built-in memory ke provider eksternal;\u003c/li\u003e\n\u003cli\u003eexpose tool khusus untuk search/store/manage memory.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya, saat elo tanya agent, dia tidak hanya pakai prompt sekarang. Dia juga ngecek \"ada gak ingatan lama yang relevan?\" sebelum menjawab. Itu buat pengalaman agent jadi lebih berkelanjutan, tapi sekaligus menaikkan risiko bias atau kontaminasi konteks jika memorinya salah.\u003c/p\u003e\n\u003ch2 id=\"kenapa-cuma-satu-external-provider-yang-aktif\"\u003eKenapa cuma satu external provider yang aktif?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-cuma-satu-external-provider-yang-aktif\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena satu provider eksternal udah cukup kompleks. Kalau dipakai banyak sekaligus, masalahnya jadi cepat menumpuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekonflik sumber (satu provider bilang A, satunya B),\u003c/li\u003e\n\u003cli\u003ebiaya API/LLM yang melambung,\u003c/li\u003e\n\u003cli\u003elatency per turn naik,\u003c/li\u003e\n\u003cli\u003egovernance lebih susah: tracking, retention, deletion, dan leakage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi desainnya: built-in memory selalu hidup, tapi external provider dipilih satu.\u003c/p\u003e\n\u003ch2 id=\"provider-yang-tersedia-dan-perbedaannya\"\u003eProvider yang tersedia dan perbedaannya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#provider-yang-tersedia-dan-perbedaannya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari page itu gue bisa bedakan provider jadi beberapa keluarga:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elocal/self-hosted: \u003ccode\u003eOpenViking\u003c/code\u003e, \u003ccode\u003eHolographic\u003c/code\u003e, \u003ccode\u003eByteRover\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ecloud semantic/user modeling: \u003ccode\u003eHoncho\u003c/code\u003e, \u003ccode\u003eMem0\u003c/code\u003e, \u003ccode\u003eRetainDB\u003c/code\u003e, \u003ccode\u003eSupermemory\u003c/code\u003e, \u003ccode\u003eMemori\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ehybrid / graph-heavy: \u003ccode\u003eHindsight\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"honcho\"\u003eHoncho\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#honcho\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHoncho kuat di user modeling dan cross-session context. Dia bukan sekadar nyimpan catatan, tapi bangun representasi user/agent sebagai peer. Cocok untuk personal agent atau multi-agent system yang butuh memahami peran user secara jangka panjang.\u003c/p\u003e\n\u003ch3 id=\"openviking\"\u003eOpenViking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOpenViking seperti filesystem knowledge. Kamu bisa browse struktur hierarki dan load konten secara tiered. Jadi ini bagus untuk knowledge management self-hosted yang terorganisir.\u003c/p\u003e\n\u003ch3 id=\"mem0\"\u003eMem0\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mem0\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMem0 fokus ke automatic extraction: server-side LLM ngekstrak fakta, semantic search, reranking, deduplication.\u003c/p\u003e\n\u003cp\u003eKalau lo mau memory yang otomatis tanpa mikir struktur, ini jalannya. Trade-off-nya: lebih cloud/paid dan kontrolnya tidak serinci lokal manual.\u003c/p\u003e\n\u003ch3 id=\"hindsight\"\u003eHindsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hindsight\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHindsight pakai knowledge graph dan multistrategy retrieval. Dia juga punya reflect synthesis untuk merangkum hubungan antar entitas. Ini menarik kalau lo pengin memory yang bisa reasoning lewat graph, bukan cuma keyword search.\u003c/p\u003e\n\u003ch3 id=\"holographic\"\u003eHolographic\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#holographic\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHolographic lokal, SQLite + FTS5, HRR algebra, trust scoring. Cocok kalau lo pengin sistem yang transparan dan privasi-first. Default auto extraction false, jadi lebih cocok untuk eksperimen dan kontrol manual.\u003c/p\u003e\n\u003ch3 id=\"retaindb\"\u003eRetainDB\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#retaindb\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRetainDB adalah cloud memory API dengan hybrid search dan delta compression. Dia pas buat tim yang sudah pakai infrastrukturnya, tapi ada biaya berkelanjutan.\u003c/p\u003e\n\u003ch3 id=\"byterover\"\u003eByteRover\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#byterover\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eByteRover local-first dengan knowledge tree dan optional cloud sync. Yang menarik adalah pre-compression extraction—dia nyoba menyimpan insight penting sebelum context window dikompres.\u003c/p\u003e\n\u003ch3 id=\"supermemory\"\u003eSupermemory\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#supermemory\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSupermemory sengaja bikin context fencing supaya memory lama tidak tersimpan ulang secara rekursif. Dia juga kuat di semantic recall, user profile, dan session graph ingest.\u003c/p\u003e\n\u003ch3 id=\"memori\"\u003eMemori\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#memori\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMemori fokus ke structured long-term memory dengan tool-aware context. Ini berguna kalau agent lo banyak memakai tool dan perlu ingatan yang paham konteks tool call.\u003c/p\u003e\n\u003ch2 id=\"pola-besar-dan-trade-off\"\u003ePola besar dan trade-off\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pola-besar-dan-trade-off\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang gue lihat, provider bukan cuma soal storage. Ini soal gaya ingatan agent:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau butuh privacy dan kontrol: pilih local-first (\u003ccode\u003eHolographic\u003c/code\u003e, \u003ccode\u003eByteRover\u003c/code\u003e, \u003ccode\u003eOpenViking\u003c/code\u003e);\u003c/li\u003e\n\u003cli\u003ekalau butuh otomatisasi dan semantic search: pilih cloud (\u003ccode\u003eMem0\u003c/code\u003e, \u003ccode\u003eSupermemory\u003c/code\u003e, \u003ccode\u003eHoncho\u003c/code\u003e, \u003ccode\u003eMemori\u003c/code\u003e);\u003c/li\u003e\n\u003cli\u003ekalau butuh reasoning relasional: \u003ccode\u003eHindsight\u003c/code\u003e atau \u003ccode\u003eHoncho\u003c/code\u003e lebih menarik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTrade-off umum:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elokal = murah + privat, tapi butuh setup/maintenance;\u003c/li\u003e\n\u003cli\u003ecloud = otomatis + pintar, tapi biaya + data keluar;\u003c/li\u003e\n\u003cli\u003esatu provider = lebih mudah governance, tapi kurang fleksibel dibanding multi-backend.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kapan-pakai-provider-tertentu\"\u003eKapan pakai provider tertentu?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-pakai-provider-tertentu\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ekalau lo pengin agent memahami preferensi user, pilih yang kuat di user modeling: \u003ccode\u003eHoncho\u003c/code\u003e, \u003ccode\u003eSupermemory\u003c/code\u003e, \u003ccode\u003eMem0\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ekalau lo pengin agent ingat knowledge project, pilih yang kuat di struktur: \u003ccode\u003eOpenViking\u003c/code\u003e, \u003ccode\u003eByteRover\u003c/code\u003e, \u003ccode\u003eHindsight\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ekalau lo pengin local-only dan transparan, pilih \u003ccode\u003eHolographic\u003c/code\u003e atau \u003ccode\u003eByteRover\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ekalau lo pengin reasoning lintas memori, \u003ccode\u003eHindsight\u003c/code\u003e dan \u003ccode\u003eHoncho\u003c/code\u003e lebih cocok.\u003c/li\u003e\n\u003cli\u003ekalau lo pengin setup mudah dan otomatis, \u003ccode\u003eMem0\u003c/code\u003e atau \u003ccode\u003eSupermemory\u003c/code\u003e lebih praktis.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesalahan-umum-memahami-page-ini\"\u003eKesalahan umum memahami page ini\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesalahan-umum-memahami-page-ini\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKesalahan terbesar adalah mengira provider cuma \"database chat\". Sebenarnya provider menentukan cara agent membangun identitas user, memilih konteks, menyimpan pelajaran, dan menetapkan apa yang dianggap relevan. Jadi memilih provider adalah keputusan epistemik, bukan sekadar pilihan teknis.\u003c/p\u003e\n\u003ch2 id=\"catatan-singkat-tentang-setup\"\u003eCatatan singkat tentang setup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-singkat-tentang-setup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePerintah utama yang dicatat:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003ehermes memory setup\nhermes memory status\nhermes memory off\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtau set langsung lewat config:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003ememory\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eprovider\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e openviking\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau mau ganti provider, cukup ubah \u003ccode\u003eprovider:\u003c/code\u003e dan tambahkan API key/endpoint bila perlu.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.architecture\"\u003eArchitecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.design-patterns\"\u003eHoncho Design Patterns\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.honcho.stateful-memory\"\u003eStateful Memory\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.06.03\"\u003e2026-06-03\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","al
