oding agent tool calling + reasoning","value":"ranking-modelprovider-untuk-coding-agent-tool-calling--reasoning","line":101,"column":0,"depth":2},"prinsip-ranking":{"type":"header","text":"Prinsip ranking","value":"prinsip-ranking","line":121,"column":0,"depth":2},"kenapa-tidak-hanya-lihat-harga-token":{"type":"header","text":"Kenapa tidak hanya lihat harga token","value":"kenapa-tidak-hanya-lihat-harga-token","line":131,"column":0,"depth":2},"evidence-links":{"type":"header","text":"Evidence links","value":"evidence-links","line":141,"column":0,"depth":2},"catatan-praktis":{"type":"header","text":"Catatan praktis","value":"catatan-praktis","line":155,"column":0,"depth":2}},"children":[],"parent":"notes.copilot","data":{}},"body":"\u003ch1 id=\"token-murah-untuk-coding-agent\"\u003eToken murah untuk coding agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#token-murah-untuk-coding-agent\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eDalam catatan ini, gue mendefinisikan \"token murah\" sebagai model yang bisa dipakai lewat LiteLLM/OpenAI-compatible endpoint untuk agent/harness, dengan biaya per 1M token rendah. Bukan sekadar paket chat murah atau subscription diskon.\u003c/p\u003e\n\u003cp\u003eIntinya: menurut gue, kalau goal lo adalah agent coding murah, jangan hanya cari model dengan tarif per token terendah. Cari kombinasi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emurah per token,\u003c/li\u003e\n\u003cli\u003ecukup kuat untuk coding,\u003c/li\u003e\n\u003cli\u003econtext panjang memadai,\u003c/li\u003e\n\u003cli\u003ekompatibel dengan agent/tool calling,\u003c/li\u003e\n\u003cli\u003etidak memaksa loop panjang karena kualitas rendah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue pakai daftar ini supaya lo nggak terjebak model murah yang ujung-ujungnya malah ngabisin token karena harus retry terus.\u003c/p\u003e\n\u003ch2 id=\"opsi-utama\"\u003eOpsi utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#opsi-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-openrouter--eksperimen-provider-agnostik-yang-paling-praktis\"\u003e1. OpenRouter — eksperimen provider-agnostik yang paling praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-openrouter--eksperimen-provider-agnostik-yang-paling-praktis\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOpenRouter adalah tempat paling cepat untuk membandingkan model dengan tool calling support tanpa bikin integrasi baru untuk setiap provider.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukti: OpenRouter docs \u003ccode\u003eTool \u0026#x26; Function Calling\u003c/code\u003e menjelaskan cara kerja tool calling secara generik dan cara filter model yang mendukung tools.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://openrouter.ai/docs/guides/features/tool-calling\"\u003ehttps://openrouter.ai/docs/guides/features/tool-calling\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://openrouter.ai/collections/tool-calling-models\"\u003ehttps://openrouter.ai/collections/tool-calling-models\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekenapa penting: ini berarti tool calling adalah fitur API, bukan hanya klaim marketing model tertentu.\u003c/li\u003e\n\u003cli\u003ekelebihan: bisa explore banyak model sekaligus, termasuk non-Qwen model, dan test apakah tool calling sebenarnya berjalan di provider tersebut.\u003c/li\u003e\n\u003cli\u003ekekurangan: harga dan reliability bisa berbeda antar provider, jadi harus dicek per model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRekomendasi pakai OpenRouter untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emembandingkan model tool calling\u003c/li\u003e\n\u003cli\u003ecek apakah model juga support function calling sekaligus\u003c/li\u003e\n\u003cli\u003emelihat provider yang punya interface OpenAPI/tool schema standar\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-groq--throughput-harga-prediktif-dan-compound-ai\"\u003e2. Groq — throughput, harga prediktif, dan compound AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-groq--throughput-harga-prediktif-dan-compound-ai\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGroq memperlihatkan bahwa ada jalan lain selain hanya harga per token: infrastruktur inference dan model mix matter.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukti: Groq pricing page mencantumkan model seperti GPT OSS 20B, Llama 4 Scout 17B 16E, Qwen3 32B, dan Llama 3.1 8B Instant.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://groq.com/pricing\"\u003eGroq pricing\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekenapa penting: model yang sama bisa dipakai dalam compound AI systems dengan built-in tools, yang lebih relevan untuk workflow agentic daripada sekadar model chat.\u003c/li\u003e\n\u003cli\u003ekelebihan: harga token terukur, latency tinggi, dan dukungan compound systems berarti provider memikirkan tool selection + multi-model orchestration.\u003c/li\u003e\n\u003cli\u003ekekurangan: tidak semua model open weight tersedia tanpa enterprise access, jadi perlu cek daftar model secara manual.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-deepseek--toolfunction-calling-eksplisit\"\u003e3. DeepSeek — tool/function calling eksplisit\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-deepseek--toolfunction-calling-eksplisit\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDeepSeek punya dokumentasi tool calls dan function calling sendiri, yang berarti provider ini memang dibangun untuk agentic workflows.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukti: DeepSeek API docs memiliki halaman \u003ccode\u003eTool Calls\u003c/code\u003e dan \u003ccode\u003eFunction Calling\u003c/code\u003e.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://api-docs.deepseek.com/guides/tool_calls\"\u003eDeepSeek Tool Calls\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://api-docs.deepseek.com/guides/function_calling\"\u003eDeepSeek Function Calling\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekenapa penting: provider ini tidak hanya menjual model murah; mereka juga menyediakan layer tool-calling sebagai fitur API.\u003c/li\u003e\n\u003cli\u003ekelebihan: cocok untuk coding agent yang butuh call external tools secara eksplisit.\u003c/li\u003e\n\u003cli\u003ekekurangan: bisa ada kekhawatiran reliability dan data route untuk use case sensitif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-deepinfra--qwen3--strong-reasoning-plus-agent-capability\"\u003e4. DeepInfra / Qwen3 — strong reasoning plus agent capability\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-deepinfra--qwen3--strong-reasoning-plus-agent-capability\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDeepInfra masih penting karena modelnya jelas menyebut agent capabilities, reasoning, instruction following, dan function calling.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebukti: halaman DeepInfra Qwen3-14B menulis bahwa Qwen3 menawarkan reasoning, instruction-following, agent capabilities, multilingual support, dan function calling support.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://deepinfra.com/Qwen/Qwen3-14B\"\u003eDeepInfra Qwen3-14B\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekenapa penting: ini menunjukkan bahwa Qwen3 bukan hanya model sekenanya, tapi diposisikan untuk use case agentic.\u003c/li\u003e\n\u003cli\u003ekelebihan: context panjang besar, tool/agent-oriented messaging, dan entrypoint ke model Qwen3/3.5.\u003c/li\u003e\n\u003cli\u003ekekurangan: masih Qwen-centric, jadi gunakan sebagai salah satu opsi, bukan satu-satunya opsi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-kimi--glm--minimax--frontier-open-weight-agent-models\"\u003e5. Kimi / GLM / MiniMax — frontier open-weight agent models\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-kimi--glm--minimax--frontier-open-weight-agent-models\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSekarang ada juga layer model frontier yang perlu dipertimbangkan, terutama kalau lo butuh model open-weight yang memang dibangun untuk agent/tool workflows.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKimi K2.5: model 1.04T parameter dengan klaim \u003ccode\u003eAgent Swarm\u003c/code\u003e, paralel agent orchestration, dan benchmark coding/ browsing yang kompetitif. Dokumentasi komunitas menyebutnya sebagai model open-weight dengan kualitas agentic.\n\u003cul\u003e\n\u003cli\u003ebukti: \u003ca href=\"https://huggingface.co/blog/kimi-k2.5\"\u003eHugging Face blog Kimi K2.5\u003c/a\u003e, Feb 23 2026.\u003c/li\u003e\n\u003cli\u003eklaim: \u003ccode\u003eAgent Swarm\u003c/code\u003e, open model, kodepen, dan benchmark yang menempatkannya di kelasnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eGLM-5: model open frontier yang explicitly didesain untuk function calling, large context 200K, dan agent-style reasoning. Banyak dokumentasi memperlihatkan dukungan function calling / tool calling, termasuk Milvus dan Z.ai.\n\u003cul\u003e\n\u003cli\u003ebukti: \u003ca href=\"https://z.ai/models/GLM-5-1.0\"\u003eZ.ai GLM-5 model page\u003c/a\u003e, \u003ca href=\"https://milvus.io/blog/what-is-glm-5\"\u003eMilvus \u003ccode\u003eWhat is GLM-5\u003c/code\u003e\u003c/a\u003e, dan \u003ca href=\"https://unsloth.dev/models/glm-5-1.0-gguf\"\u003eUnsloth GGUF deployment\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eMiniMax M2.5: model yang disebut dalam benchmark perbandingan Kimi/GLM dan membawa skor BrowseComp ~76.3%. Namun saat ini domain resmi minimax.ai terparkir, jadi bukti publik langsung terbatas.\n\u003cul\u003e\n\u003cli\u003ebukti: perbandingan benchmark pada artikel Kimi K2.5 yang mencantumkan MiniMax M2.5.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ekenapa penting: ini menambah opsi non-Qwen dengan fokus pada agent/tool workflows dan open-weight deployment.\u003c/li\u003e\n\u003cli\u003ekelebihan: alternatif model frontier yang bisa jadi lebih murah dibandingkan vendor besar dan tetap support function calling secara praktis.\u003c/li\u003e\n\u003cli\u003ekekurangan: bisa lebih sulit dipakai langsung lewat API karena provider/hosting spesifik belum sebanyak Qwen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"6-runpod--local-hybrid--saat-lo-butuh-kontrol-penuh\"\u003e6. RunPod / local hybrid — saat lo butuh kontrol penuh\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-runpod--local-hybrid--saat-lo-butuh-kontrol-penuh\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJika goal lo bukan cuma token murah tapi juga control + zero cloud token cost, RunPod dan local deployment masih masuk akal.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003econtoh harga: RTX 4090 di Secure Cloud ~$0.69/jam, Community Cloud ~$0.34/jam.\u003c/li\u003e\n\u003cli\u003ecatatan: ini bukan harga token API, melainkan harga compute; harus siap konfigurasi Ollama/vLLM/llama.cpp, endpoint, dan keamanan.\u003c/li\u003e\n\u003cli\u003ekelebihan: cocok buat benchmark model 14B/30B lokal tanpa investasi hardware.\u003c/li\u003e\n\u003cli\u003ekekurangan: setup lebih kompleks, dan cost-nya jadi compute/time, bukan token saja.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"ranking-modelprovider-untuk-coding-agent-tool-calling--reasoning\"\u003eRanking model/provider untuk coding agent tool calling + reasoning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ranking-modelprovider-untuk-coding-agent-tool-calling--reasoning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eOpenRouter\n\u003cul\u003e\n\u003cli\u003eterbaik untuk eksperimen dan dengan cepat benchmark tool calling across providers\u003c/li\u003e\n\u003cli\u003eevidence: generic tool calling docs dan model filter di OpenRouter\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eGroq\n\u003cul\u003e\n\u003cli\u003eterbaik untuk throughput + predictable pricing dan compound AI/tool orchestration\u003c/li\u003e\n\u003cli\u003eevidence: pricing page yang memuat model open source + compound systems\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDeepSeek\n\u003cul\u003e\n\u003cli\u003eterbaik untuk provider yang eksplisit memposisikan diri sebagai tool-calling API\u003c/li\u003e\n\u003cli\u003eevidence: DeepSeek tool calls / function calling docs\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eDeepInfra Qwen3 / Qwen3.5\n\u003cul\u003e\n\u003cli\u003eterbaik untuk agent-oriented model dengan reasoning capabilities dan function calling support\u003c/li\u003e\n\u003cli\u003eevidence: DeepInfra model page\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eKimi / GLM / MiniMax\n\u003cul\u003e\n\u003cli\u003eterbaik untuk frontier open-weight agent models dengan benchmark dan function/tool calling evidence\u003c/li\u003e\n\u003cli\u003eevidence: Hugging Face Kimi blog, Z.ai GLM-5 docs, Milvus GLM-5 article, Kimi article mention MiniMax M2.5\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eLocal fallback / RunPod\n\u003cul\u003e\n\u003cli\u003eterbaik untuk kontrol lokal / hybrid ketika cloud token cost ingin ditekan\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"prinsip-ranking\"\u003ePrinsip ranking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-ranking\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTerkadang model termurah tidak berguna kalau tool calling dan agent orchestration-nya jelek. Jadi urutan ini mengutamakan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edukungan tool calling atau function calling\u003c/li\u003e\n\u003cli\u003ekemampuan reasoning/agent-oriented workflows\u003c/li\u003e\n\u003cli\u003ekemudahan integrasi dengan agent harness\u003c/li\u003e\n\u003cli\u003eharga per token yang masuk akal untuk use case coding\u003c/li\u003e\n\u003cli\u003eketersediaan model selain Qwen, supaya tidak bias ke satu keluarga model\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-tidak-hanya-lihat-harga-token\"\u003eKenapa tidak hanya lihat harga token\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-tidak-hanya-lihat-harga-token\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eModel murah tapi tanpa tool calling atau tanpa workflow agent yang matang sering membuat biaya sebenarnya lebih besar.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eloop panjang + retry = cost driver utama\u003c/li\u003e\n\u003cli\u003eoutput token bisa lebih mahal daripada input\u003c/li\u003e\n\u003cli\u003ekalau model tidak paham tool schema, lo habisin token buat narik hasil yang sama\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi strategi terbaik tetap: pakai OpenRouter untuk validasi provider, lalu pilih Groq/DeepSeek/DeepInfra tergantung apakah lo butuh throughput, tool support, atau reasoning.\u003c/p\u003e\n\u003ch2 id=\"evidence-links\"\u003eEvidence links\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evidence-links\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://openrouter.ai/docs/guides/features/tool-calling\"\u003eOpenRouter tool calling docs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://openrouter.ai/collections/tool-calling-models\"\u003eOpenRouter tool-calling model collection\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://openrouter.ai/openrouter/free\"\u003eOpenRouter free router\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://api-docs.deepseek.com/guides/tool_calls\"\u003eDeepSeek tool calls docs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://api-docs.deepseek.com/guides/function_calling\"\u003eDeepSeek function calling docs\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://deepinfra.com/Qwen/Qwen3-14B\"\u003eDeepInfra Qwen3 agent/ reasoning page\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://huggingface.co/blog/kimi-k2.5\"\u003eKimi K2.5 open-weight agent blog\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://z.ai/models/GLM-5-1.0\"\u003eZ.ai GLM-5 model page\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://milvus.io/blog/what-is-glm-5\"\u003eMilvus \u003ccode\u003eWhat is GLM-5\u003c/code\u003e\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://unsloth.dev/models/glm-5-1.0-gguf\"\u003eUnsloth GLM-5 GGUF deployment\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://groq.com/pricing\"\u003eGroq pricing + compound AI\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"catatan-praktis\"\u003eCatatan praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003emulai dari OpenRouter untuk tahu model mana yang benar-benar support tool calling\u003c/li\u003e\n\u003cli\u003ekalau butuh predictable token cost dan model open source, cek Groq\u003c/li\u003e\n\u003cli\u003ekalau butuh API-first tool calling, cek DeepSeek\u003c/li\u003e\n\u003cli\u003ekalau butuh reasoning + agent capabilities, cek DeepInfra Qwen3 / Qwen3.5\u003c/li\u003e\n\u003cli\u003ekalau lo butuh local control, hitung RunPod compute cost daripada token cost semata\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecopilot (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epricing (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.copilot.raptor-mini-sml-budgeting\"\u003eRaptor mini, SML, dan billing Copilot yang pindah ke token\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.local-llm\"\u003eMOC Local LLM dan Copilot agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections
