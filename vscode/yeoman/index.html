amanya-jarang-terdengar":{"type":"header","text":"Kenapa sekarang namanya jarang terdengar?","value":"kenapa-sekarang-namanya-jarang-terdengar","line":71,"column":0,"depth":2},"warisan-idenya-ke-tooling-modern":{"type":"header","text":"Warisan idenya ke tooling modern","value":"warisan-idenya-ke-tooling-modern","line":88,"column":0,"depth":2},"kenapa-yeoman-bukan-framework":{"type":"header","text":"Kenapa Yeoman bukan framework?","value":"kenapa-yeoman-bukan-framework","line":112,"column":0,"depth":2},"insight":{"type":"header","text":"Insight","value":"insight","line":123,"column":0,"depth":2},"catatan-singkat":{"type":"header","text":"Catatan singkat","value":"catatan-singkat","line":131,"column":0,"depth":3}},"children":[],"parent":"dfkbwdiovv8tm0u37ev27dz","data":{}},"body":"\u003ch1 id=\"yeoman-scaffolding-engine-untuk-frontend-modern\"\u003eYeoman: scaffolding engine untuk frontend modern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yeoman-scaffolding-engine-untuk-frontend-modern\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"yeoman-itu-apa\"\u003eYeoman itu apa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yeoman-itu-apa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYeoman adalah scaffolding engine untuk project web, bukan runtime framework.\nDia muncul sebagai tool untuk membuat kerangka kerja awal: struktur folder, config build, dependency, testing setup, dan template file.\nInti ide Yeoman adalah: jangan mulai project web dari file kosong.\u003c/p\u003e\n\u003cp\u003eCatatan: artikel ini dirancang supaya bisa dibaca sendiri. Semua penjelasan di sini lengkap tanpa harus buka note lain.\u003c/p\u003e\n\u003cp\u003eYeoman bekerja lewat ecosystem generator. Setiap generator adalah plugin yang bisa dipakai untuk kickstart project baru atau menambah bagian tertentu ke project yang sudah ada.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eyo\u003c/code\u003e = command-line engine.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egenerator-*\u003c/code\u003e = template dan opini untuk jenis project tertentu.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprompt\u003c/code\u003e = interaksi konfigurasi saat scaffold berjalan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi: \u003cstrong\u003eYeoman = scaffolding engine\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"kenapa-yeoman-terasa-penting-banget-di-era-20122015\"\u003eKenapa Yeoman terasa penting banget di era 2012–2015?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-yeoman-terasa-penting-banget-di-era-20122015\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena waktu itu frontend sudah terlalu kompleks untuk lagi-lagi mulai dari nol.\nSebelum Yeoman, startup project sering berarti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecari library lewat GitHub atau StackOverflow,\u003c/li\u003e\n\u003cli\u003epilih antara Bower / npm / RequireJS / Browserify,\u003c/li\u003e\n\u003cli\u003etulis konfigurasi Grunt/Gulp manual,\u003c/li\u003e\n\u003cli\u003esiapkan testing dengan Karma/Jasmine/Mocha,\u003c/li\u003e\n\u003cli\u003ebungkus asset Sass/Less/Autoprefixer sendiri,\u003c/li\u003e\n\u003cli\u003eatur live reload dan production build sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYeoman hadir saat frontend sudah masuk fase industrialisasi.\nDia memberi satu cara untuk menjahit semua bagian itu jadi wizard awal, sehingga tim nggak lagi fokus ke setup tetapi ke domain aplikasi.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEra 2012–2015 cocok buat Yeoman\u003c/strong\u003e karena:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebelum ada pemenang tooling universal,\u003c/li\u003e\n\u003cli\u003ebanyak framework masih baru dan toolingnya tersebar,\u003c/li\u003e\n\u003cli\u003etim frontend butuh standar onboarding,\u003c/li\u003e\n\u003cli\u003edeveloper mulai merasa setup project lebih berbahaya daripada kode fitur.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"masalah-apa-yang-yeoman-coba-selesaikan\"\u003eMasalah apa yang Yeoman coba selesaikan?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#masalah-apa-yang-yeoman-coba-selesaikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalah inti Yeoman bukan sekadar \"generator file\".\nYeoman mencoba menyelesaikan tiga masalah sekaligus:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003efragmentasi tooling\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003enpm, Bower, Grunt, Gulp, RequireJS, Browserify, Karma, Jasmine, Sass, Less.\u003c/li\u003e\n\u003cli\u003eSemua punya API dan cara set up berbeda.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eboilerplate manual\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003estruktur folder, config, dan skrip build sering di-copy dari repo lama.\u003c/li\u003e\n\u003cli\u003ecopy-paste bikin project baru rawan salah.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eonboarding inconsistent\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003edeveloper baru harus tahu banyak tooling sekaligus.\u003c/li\u003e\n\u003cli\u003egenerator jadi satu titik input untuk menyesuaikan opsi project.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi Yeoman bukan hanya membuat file, tapi memformalkan workflow: generate + install dependency + siap kerja.\u003c/p\u003e\n\u003ch2 id=\"kenapa-sekarang-namanya-jarang-terdengar\"\u003eKenapa sekarang namanya jarang terdengar?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-sekarang-namanya-jarang-terdengar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena idenya menang, produknya harus mundur.\u003c/p\u003e\n\u003cp\u003eYeoman membuka kategori baru: scaffolding CLI untuk web app.\nSetelah kategori itu terbukti penting, banyak framework dan platform mulai membawa generator sendiri.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAngular punya \u003ccode\u003eng new\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eReact punya \u003ccode\u003ecreate-react-app\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eVue punya Vue CLI / Vite starter\u003c/li\u003e\n\u003cli\u003eNext.js punya \u003ccode\u003ecreate-next-app\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eNestJS punya \u003ccode\u003enest new\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eRails, Laravel, Spring Initializr punya generator masing-masing\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYeoman terlalu generik ketika ekosistem mulai memilih tooling yang terikat langsung ke framework.\nHasilnya, Yeoman tetap relevan sebagai konsep, tapi namanya tidak lagi jadi brand utama.\u003c/p\u003e\n\u003ch2 id=\"warisan-idenya-ke-tooling-modern\"\u003eWarisan idenya ke tooling modern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#warisan-idenya-ke-tooling-modern\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYeoman memberi dua warisan utama:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003ePembiasaan scaffolding\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emulai project lewat command khusus.\u003c/li\u003e\n\u003cli\u003epilih opsi awal lewat prompt.\u003c/li\u003e\n\u003cli\u003eotomatis pasang dependency dan setup file.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003cstrong\u003eGenerator sebagai extensible template\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003egenerator bisa dibuat untuk banyak jenis project.\u003c/li\u003e\n\u003cli\u003eini adalah cikal bakal pendekatan CLI yang bisa di-extend oleh komunitas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTooling modern mewarisi pola ini, tetapi dengan fokus yang lebih sempit:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpm create vite@latest\u003c/code\u003e = starter modern untuk dev server + bundler,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecreate-react-app\u003c/code\u003e = generator khusus React,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eng new\u003c/code\u003e = generator yang dikemas dalam framework Angular,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enx generate\u003c/code\u003e / \u003ccode\u003eturbo\u003c/code\u003e = generator yang berorientasi monorepo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYeoman bisa dipahami sebagai jembatan antara:\u003c/p\u003e\n\u003cp\u003eManual setup → boilerplate repo → Yeoman generator → framework CLI → meta-framework starter.\u003c/p\u003e\n\u003ch2 id=\"kenapa-yeoman-bukan-framework\"\u003eKenapa Yeoman bukan framework?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-yeoman-bukan-framework\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni penting.\nYeoman hanya bantu bikin struktur awal.\nDia tidak menentukan runtime aplikasi.\u003c/p\u003e\n\u003cp\u003eKalau lo pakai generator AngularJS 2014, Yeoman hanya bikin folder, file, dan config yang dibutuhkan. Setelah itu, aplikasi tetap jalan di AngularJS.\nKalau generatornya untuk Chrome extension, hasilnya tetap extension yang runtime-nya bukan Yeoman.\u003c/p\u003e\n\u003cp\u003eJadi salah kaprah terbesar adalah mengira Yeoman sebagai \"tool yang mengikat project\". Padahal Yeoman cuma \"mandor proyek\" yang bantu siapkan pondasi.\u003c/p\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYeoman adalah tanda bahwa frontend bukan lagi sekadar halaman HTML statis.\nDia menandai peralihan mental model: web app sekarang adalah project dengan lifecycle \u003ccode\u003ecreate -\u003e build -\u003e test -\u003e lint -\u003e deploy\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eKalau memahami Yeoman dengan benar, lo bukan cuma tahu command \u003ccode\u003eyo\u003c/code\u003e.\nLo tahu kenapa generator jadi penting, kenapa framework CLI berkembang, dan kenapa sekarang startup project modern biasanya dimulai dengan \u003ccode\u003enpm create\u003c/code\u003e atau \u003ccode\u003ecreate-...\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"catatan-singkat\"\u003eCatatan singkat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-singkat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eYeoman penting karena era 2012–2015 tooling frontend sudah broken, tetapi belum ada satu standar.\u003c/li\u003e\n\u003cli\u003eYeoman menyelesaikan fragmentation dan onboarding.\u003c/li\u003e\n\u003cli\u003eKini idenya hidup lagi di CLI framework modern, meski nama Yeoman jarang muncul.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eyo code\u003c/code\u003e adalah gambaran yang tepat: generator yang memotong boilerplate, bukan mengganti logika.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evscode (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eyeoman (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etooling (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehisto
