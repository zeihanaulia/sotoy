"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":90,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture.camp","data":{}},"body":"\u003ch1 id=\"camp-apa-yang-baru-dari-solusi-session-aware-pii-middleware\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#camp-apa-yang-baru-dari-solusi-session-aware-pii-middleware\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-jawaban\"\u003eInti jawaban\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-jawaban\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePertanyaan terakhir adalah: apa yang baru dari CAMP?\u003c/p\u003e\n\u003cp\u003eJawaban pendeknya: CAMP baru karena ia membuat PII protection menjadi stateful, session-aware, dan retroactive.\u003c/p\u003e\n\u003cp\u003eMasking biasa berhenti pada satu pesan. CAMP hidup sepanjang percakapan.\u003c/p\u003e\n\u003ch2 id=\"alur-mekanisme-camp\"\u003eAlur mekanisme CAMP\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#alur-mekanisme-camp\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCAMP menggabungkan urutan mekanisme berikut:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003edetect\u003c/strong\u003e – per-turn PII extraction dengan Presidio + custom recognizer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eremember\u003c/strong\u003e – simpan semua hasil deteksi di session registry.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003escore\u003c/strong\u003e – hitung CPE agar sistem tahu kapan akumulasi PII sudah berbahaya.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003erewrite history\u003c/strong\u003e – saat threshold tercapai, tulis ulang seluruh conversation history yang akan dikirim ke model.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003esend synthetic context\u003c/strong\u003e – kirim context synthetic, bukan asli, ke external LLM.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ede-mask response\u003c/strong\u003e – kembalikan jawaban ke nilai asli sebelum user melihatnya.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eIni yang membuat CAMP lebih dari sekadar mask-redact pipeline.\u003c/p\u003e\n\u003ch2 id=\"komponen-utama-yang-membedakan-camp\"\u003eKomponen utama yang membedakan CAMP\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#komponen-utama-yang-membedakan-camp\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-stateful-session-registry\"\u003e1. Stateful session registry\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-stateful-session-registry\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRegistry menyimpan Person, Location, Organization, Salary, Medical Condition, dan PII lain sepanjang sesi.\nTanpa registry, sistem kembali ke per-turn masking biasa.\u003c/p\u003e\n\u003ch3 id=\"2-cpe-scorer-sebagai-trigger\"\u003e2. CPE scorer sebagai trigger\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-cpe-scorer-sebagai-trigger\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCAMP tidak selalu agresif. Ia memonitor cumulative risk dan hanya intervensi setelah skor melewati threshold, kecuali hard-blocked identifiers.\u003c/p\u003e\n\u003ch3 id=\"3-retroactive-pseudonymization\"\u003e3. Retroactive pseudonymization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-retroactive-pseudonymization\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSaat threshold terlampaui, data lama juga ditulis ulang. Ini krusial untuk agentic LLM yang mengirim ulang history.\nTanpa langkah ini, history lama tetap bisa bocor.\u003c/p\u003e\n\u003ch3 id=\"4-synthetic-context--de-masking\"\u003e4. Synthetic context + de-masking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-synthetic-context--de-masking\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eExternal model melihat data palsu yang konsisten. User tetap menerima jawaban personal setelah de-masking.\u003c/p\u003e\n\u003ch3 id=\"5-hard-block-rules\"\u003e5. Hard block rules\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-hard-block-rules\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeberapa PII sangat sensitif untuk dikirim dalam bentuk apa pun: SSN, credit card, bank account. Ini langsung diblok, tidak menunggu threshold.\u003c/p\u003e\n\u003ch2 id=\"kenapa-ini-bukan-sekadar-masking-baru\"\u003eKenapa ini bukan sekadar \"masking baru\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-bukan-sekadar-masking-baru\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasking biasa menjawab: \"apakah pesan ini mengandung PII?\"\nCAMP menjawab: \"apakah percakapan ini, setelah semua pesan digabung, sudah berbahaya?\"\u003c/p\u003e\n\u003cp\u003eItu adalah pergeseran dari filter stateless ke middleware stateful.\u003c/p\u003e\n\u003ch2 id=\"kritik-yang-perlu-dinilai\"\u003eKritik yang perlu dinilai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kritik-yang-perlu-dinilai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"a-apakah-pseudonymization-menjaga-privacy-tanpa-merusak-task\"\u003eA. Apakah pseudonymization menjaga privacy tanpa merusak task?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#a-apakah-pseudonymization-menjaga-privacy-tanpa-merusak-task\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eNama dan email relatif aman diganti.\u003c/li\u003e\n\u003cli\u003eSalary, location, dan medical condition bisa merusak makna jika diganti sembarang.\u003c/li\u003e\n\u003cli\u003ePseudonymization harus preserve task-relevant semantics, bukan hanya string substitution.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"b-apakah-de-masking-reliable\"\u003eB. Apakah de-masking reliable?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#b-apakah-de-masking-reliable\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eLLM bisa memparafrase synthetic values.\u003c/li\u003e\n\u003cli\u003eDe-masking literal saja tidak cukup jika output variatif.\u003c/li\u003e\n\u003cli\u003eIni menuntut mekanisme post-processing lebih robust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"c-apakah-pre-threshold-exposure-tetap-jadi-masalah\"\u003eC. Apakah pre-threshold exposure tetap jadi masalah?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#c-apakah-pre-threshold-exposure-tetap-jadi-masalah\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCAMP melindungi future context setelah trigger.\u003c/li\u003e\n\u003cli\u003eData asli yang sudah pernah dikirim sebelum trigger mungkin tetap tercatat oleh adversary.\u003c/li\u003e\n\u003cli\u003eJadikan klaim privacy CAMP lebih presisi: ia mengurangi cumulative exposure ke model, bukan selalu mencegah semua PII asli keluar.\u003c/li\u003e\n\u003cli\u003eLihat juga \u003ca href=\"/sotoy/notes/zettel.1777881085671\"\u003eThreshold-based session privacy still leaves pre-trigger exposure\u003c/a\u003e untuk insight tentang pre-trigger exposure sebagai gap privacy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"d-apakah-camp-mencakup-agent-leakage-yang-lebih-luas\"\u003eD. Apakah CAMP mencakup agent leakage yang lebih luas?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#d-apakah-camp-mencakup-agent-leakage-yang-lebih-luas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCAMP fokus pada prompt/history ke external LLM.\u003c/li\u003e\n\u003cli\u003eAgent nyata punya leakage channel lain: tools, memory store, logs, sub-agent messages.\u003c/li\u003e\n\u003cli\u003eCAMP bagus sebagai privacy firewall context, tapi bukan full-stack privacy solution.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"positioning\"\u003ePositioning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#positioning\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eCAMP adalah arsitektur pipeline, bukan algoritma baru. Kontribusinya adalah desain middleware untuk conversation context di agentic LLM.\u003c/p\u003e\n\u003cp\u003eBila dilihat sebagai pattern, CAMP itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edetector + state tracker + risk scorer + rewriter + synthetic context + de-mask.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBila dilihat sebagai level proteksi, CAMP setara dengan \"session-aware context firewall\".\u003c/p\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u0 x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNote
