":"header","text":"Context sweet spot","value":"context-sweet-spot","line":117,"column":0,"depth":2},"failure-mode-yang-chris-sebut":{"type":"header","text":"Failure mode yang Chris sebut","value":"failure-mode-yang-chris-sebut","line":123,"column":0,"depth":2},"korelasi-dengan-agentic-engineering-dan-security-review":{"type":"header","text":"Korelasi dengan agentic engineering dan security review","value":"korelasi-dengan-agentic-engineering-dan-security-review","line":132,"column":0,"depth":2},"kenapa-ini-penting":{"type":"header","text":"Kenapa ini penting","value":"kenapa-ini-penting","line":144,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":155,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":159,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":164,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#how-i-use-ai-to-code\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca halaman aktif \"How I Use AI to Code\" dari Chris Parsons tanggal 22 April 2026 sebagai esai tentang bagaimana AI sekarang dipakai untuk kerja software, bukan sekadar autocomplete. Intinya: model AI itu bukan lagi soal siapa nulis kode, tapi siapa atau apa yang menjamin kode itu benar.\u003c/p\u003e\n\u003ch2 id=\"key-quotes\"\u003eKey quotes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#key-quotes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e“If you are still tied to your IDE, whether Cursor or Copilot, you are working a year behind. Coding turned out to be AI’s home territory.”\u003c/li\u003e\n\u003cli\u003e“Verified used to mean ‘read by you’. With modern agent throughput, it has to mean ‘checked by tests, by type checkers, by automated gates, or by you where your judgement matters’.”\u003c/li\u003e\n\u003cli\u003e“The reason is the harness, not the model.”\u003c/li\u003e\n\u003cli\u003e“When an agent gets stuck on something that should be trivial, treat it as a context failure, not a prompt failure.”\u003c/li\u003e\n\u003cli\u003e“Specify the problem, not the solution.”\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-coding-jadi-home-territory-ai\"\u003eKenapa coding jadi \"home territory\" AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-coding-jadi-home-territory-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChris menegaskan coding cocok banget untuk AI karena kode adalah teks yang padat informasi, presisi, dan bisa diverifikasi. Itu bedanya dengan AI yang nulis esai atau opini: kalau kode salah, kita bisa jalankan compiler, type checker, linter, unit test, integration test, atau runtime error.\u003c/p\u003e\n\u003cp\u003eBerarti AI coding sukses bukan karena AI tiba-tiba \"ngerti\" software secara manusia, tapi karena software punya feedback loop objektif. Tulis sedikit, verify, baca diff, perbaiki, ulangi. Loop kecil inilah yang bikin agent CLI bisa bekerja.\u003c/p\u003e\n\u003ch2 id=\"kenapa-toolchain-pindah-dari-ide-ke-cli\"\u003eKenapa toolchain pindah dari IDE ke CLI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-toolchain-pindah-dari-ide-ke-cli\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChris bilang kalau lo masih nempel ke IDE seperti Cursor atau Copilot, lo ketinggalan setahun. Bukan karena IDE itu jelek, tapi karena AI coding terkuat sekarang bukan lagi editor assistant. Ia adalah command-line agent yang bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebaca seluruh repo,\u003c/li\u003e\n\u003cli\u003eubah beberapa file sekaligus,\u003c/li\u003e\n\u003cli\u003ejalankan command test, lint, build,\u003c/li\u003e\n\u003cli\u003eperbaiki error dan terus iterasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan CLI, kerja AI bisa lintas file, lintas command, dan lintas siklus. Ini lebih cocok untuk agen yang perlu konteks repo penuh dan loop verifikasi.\u003c/p\u003e\n\u003ch2 id=\"senior-engineer-harus-jadi-trainer-bukan-reviewer\"\u003eSenior engineer harus jadi trainer, bukan reviewer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#senior-engineer-harus-jadi-trainer-bukan-reviewer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIde ini penting:\u003c/p\u003e\n\u003cp\u003eSenior tidak boleh terjebak jadi orang yang hanya baca diff dan approve. Kalau banyak komentar review yang berulang, itu tanda kegagalan sistem.\u003c/p\u003e\n\u003cp\u003eChris membedakan dua cara kerja AI coding:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eVibe coding\u003c/strong\u003e: cepat, output AI dibiarkan berjalan, dan yang penting tampak berhasil.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAgentic engineering\u003c/strong\u003e: AI boleh menghasilkan kode, tetapi perubahan tetap kecil, ada guardrail, dokumentasi, test, type checker, review surface, dan automated gate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePerubahan kecil di sini bukan soal berapa baris kode. Ini soal satu siklus kerja yang memiliki satu tujuan jelas, satu risiko utama, dan satu cara verifikasi jelas.\nSatu task agentic engineering harus small, bounded, dan tidak mencampur banyak keputusan sekaligus.\u003c/p\u003e\n\u003cp\u003eBukan berarti fitur harus kecil selamanya. Bisa saja 200 baris jika scope-nya satu konsep. Yang kecil adalah ruang keputusan dan risiko.\u003c/p\u003e\n\u003cp\u003eItu membuat perbedaan penting: bukan prompt yang utama, tapi apakah agen punya lingkungan kerja yang bisa memverifikasi hasilnya sendiri.\u003c/p\u003e\n\u003cp\u003eSenior terbaik menurut Chris adalah yang bisa memindahkan judgement itu ke harness. Kalau agent sering salah query database di loop, jangan terus komentar. Buat rule, skill, linter, atau test yang mencegahnya.\u003c/p\u003e\n\u003cp\u003eKalau agent lupa audit trail, jangan lagi cuma kasih komentar. Tambahkan skill dan gate yang memaksa audit trace.\u003c/p\u003e\n\u003ch2 id=\"harness-lebih-penting-daripada-prompt\"\u003eHarness lebih penting daripada prompt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#harness-lebih-penting-daripada-prompt\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalimat pentingnya: \"The reason is the harness, not the model.\" Dan juga: \"When an agent gets stuck on something that should be trivial, treat it as a context failure, not a prompt failure.\"\u003c/p\u003e\n\u003cp\u003eJadi nggak cukup sekadar memperbaiki prompt. Kalau agent salah, yang perlu dicek dulu adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah dia punya konteks repo yang benar?\u003c/li\u003e\n\u003cli\u003eapakah ada instruksi permanen seperti \u003ccode\u003eAGENTS.md\u003c/code\u003e atau \u003ccode\u003eCLAUDE.md\u003c/code\u003e?\u003c/li\u003e\n\u003cli\u003eapakah ada skill file untuk spesifik domain?\u003c/li\u003e\n\u003cli\u003eapakah loop verifikasi sudah otomatis?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePrompt hanya bagian kecil. Harness adalah rangka kerja yang menjaga agent tetap konsisten dan bisa diaudit.\u003c/p\u003e\n\u003ch2 id=\"apa-saja-komponen-harness-yang-chris-pakai\"\u003eApa saja komponen harness yang Chris pakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-saja-komponen-harness-yang-chris-pakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChris menekankan tiga layer praktis:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e / \u003ccode\u003eCLAUDE.md\u003c/code\u003e\n\u003cul\u003e\n\u003cli\u003efile instruksi permanen untuk perilaku agent.\u003c/li\u003e\n\u003cli\u003esingkat, spesifik, terus diperbaiki setelah tiap sesi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eSkill files\n\u003cul\u003e\n\u003cli\u003erules yang lebih detail untuk area khusus: security review, database migration, API convention, testing strategy, dsb.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePortable vault\n\u003cul\u003e\n\u003cli\u003ecatatan Markdown terpisah yang bisa dipakai ulang oleh agen lain.\u003c/li\u003e\n\u003cli\u003eini bikin knowledge durable, bukan terjebak di satu tool.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kenapa-bottleneck-baru-bukan-coding-tapi-feedback\"\u003eKenapa bottleneck baru bukan coding, tapi feedback\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-bottleneck-baru-bukan-coding-tapi-feedback\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKutipan penting dari artikel ini:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“The game is not ‘how fast can we build’ any more. It is ‘how fast can we tell whether this is right’.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIni pusat argumen: kecepatan generate tidak lagi jadi keunggulan utama. Keunggulan baru adalah kecepatan membuktikan bahwa sesuatu benar.\u003c/p\u003e\n\u003cp\u003eSekarang masalahnya bukan lagi \"siapa yang bisa nulis kode cepat.\" Masalahnya: \"seberapa cepat kita tahu kode itu benar?\"\u003c/p\u003e\n\u003cp\u003eChris bilang game-nya berubah dari build speed ke verification speed. Kalau tim nggak punya test dan CI kuat, AI cuma menambah PR dan rework.\u003c/p\u003e\n\u003cp\u003eDeveloper bisa merasa 20% lebih cepat karena kodenya jadi cepat jadi, tapi delivery terukur bisa jadi lebih lambat karena semua overhead verifikasi jadi dominan.\u003c/p\u003e\n\u003ch2 id=\"kenapa-spesifikasi-harus-problem-first\"\u003eKenapa spesifikasi harus problem-first\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-spesifikasi-harus-problem-first\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eChris mengkritik pendekatan yang salah: tulis spec solusi terlalu detail, lalu biarkan AI jadi stenografer.\u003c/p\u003e\n\u003cp\u003eYang lebih kuat adalah spesifikasi problem dengan constraint dan success criteria. Contoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eburuk: \"Buat tabel audit_log dengan delapan kolom dan index ini.\"\u003c/li\u003e\n\u003cli\u003elebih baik: \"Butuh audit log untuk setiap write, searchable by user, disimpan tujuh tahun, dan tidak boleh memperlambat hot path.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara itu, agent masih bisa usul desain yang masuk akal, sementara kita tetap memberi batasan yang benar.\u003c/p\u003e\n\u003ch2 id=\"context-sweet-spot\"\u003eContext sweet spot\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#context-sweet-spot\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKualitas output AI tergantung jumlah konteks yang tepat. Terlalu sedikit: output generic. Terlalu banyak: model kebanjiran noise.\u003c/p\u003e\n\u003cp\u003eSweet spot berarti cukup informasi untuk problem, tapi tidak overload. Kalau agent mulai refactor tak perlu, mengulang asumsi, atau terdengar yakin tapi nggak nyambung, itu tanda harus reset dan mulai lagi dengan chunk yang lebih bersih.\u003c/p\u003e\n\u003ch2 id=\"failure-mode-yang-chris-sebut\"\u003eFailure mode yang Chris sebut\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-mode-yang-chris-sebut\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBeberapa jebakan yang masih sering terjadi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eaccidental vibe coding: agent dipakai tanpa guardrail, lalu ship sebelum diverifikasi.\u003c/li\u003e\n\u003cli\u003ereview fatigue: senior kewalahan baca semua diff.\u003c/li\u003e\n\u003cli\u003einvisible dependencies: agen ngandelin kemampuan tersembunyi yang bisa hilang saat model berganti.\u003c/li\u003e\n\u003cli\u003epremature relief: tim merasa adaptasi selesai karena sudah pasang Claude Code atau Codex CLI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"korelasi-dengan-agentic-engineering-dan-security-review\"\u003eKorelasi dengan agentic engineering dan security review\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#korelasi-dengan-agentic-engineering-dan-security-review\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo bikin agent CLI untuk security, pendekatan vibe coding akan berhenti di \"scan repo, cari vuln, kasih rekomendasi.\" Itu raw dan sering noisy.\u003c/p\u003e\n\u003cp\u003eApproach Chris lebih agentic engineering:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eada \u003ccode\u003eAGENTS.md\u003c/code\u003e untuk prinsip security repo,\u003c/li\u003e\n\u003cli\u003eada skill file untuk review dependency, auth flow, SQL injection, dsb,\u003c/li\u003e\n\u003cli\u003eagent menjalankan tool nyata: Semgrep, OSV, npm audit, trufflehog, unit test, type check,\u003c/li\u003e\n\u003cli\u003etemuan harus punya evidence, severity, dan recommended fix,\u003c/li\u003e\n\u003cli\u003efalse positive dibalik jadi aturan supaya sesi berikutnya lebih presisi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting\"\u003eKenapa ini penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat gue, nilai utama artikel ini bukan sekadar \"Claude Code vs Copilot.\" Ini tentang pergeseran struktur kerja:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edari nulis kode ke membangun sistem yang menghasilkan kode benar,\u003c/li\u003e\n\u003cli\u003edari prompt ke harness,\u003c/li\u003e\n\u003cli\u003edari review manual ke feedback loop,\u003c/li\u003e\n\u003cli\u003edari senior sebagai coder utama ke senior sebagai trainer sistem,\u003c/li\u003e\n\u003cli\u003edari spec solusi ke framing problem,\u003c/li\u003e\n\u003cli\u003edari knowledge di kepala senior ke knowledge di Markdown + skill file + gate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://www.chrismdp.com/coding-with-ai/\"\u003ehttps://www.chrismdp.com/coding-with-ai/\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179969\"\u003eSecurity harness lebih penting daripada single AI agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179908\"\u003eAI security review perlu harness dan triage, bukan hanya agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.references\"\u003eCloud Agent Hands-on References\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u0
