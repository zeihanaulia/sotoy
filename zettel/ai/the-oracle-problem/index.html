"to":{"fname":"zettel.ai.separation-of-maker-and-checker"}},{"from":{"fname":"zettel.ai.behavior-coverage-vs-code-coverage","id":"zettel.ai.behavior-coverage-vs-code-coverage","vaultName":"vault"},"type":"backlink","position":{"start":{"line":21,"column":3,"offset":1327},"end":{"line":21,"column":35,"offset":1359},"indent":[]},"value":"zettel.ai.the-oracle-problem"}],"anchors":{"konsep":{"type":"header","text":"Konsep","value":"konsep","line":15,"column":0,"depth":2},"solusi-oracle-driven-feedback":{"type":"header","text":"Solusi: Oracle-Driven Feedback","value":"solusi-oracle-driven-feedback","line":20,"column":0,"depth":2},"bentuk-oracle":{"type":"header","text":"Bentuk Oracle","value":"bentuk-oracle","line":26,"column":0,"depth":2},"relasi":{"type":"header","text":"Relasi","value":"relasi","line":31,"column":0,"depth":2}},"children":[],"parent":"5u5qgf55dk7a3bauxh68b69","data":{}},"body":"\u003ch1 id=\"the-oracle-problem-dalam-ai-coding\"\u003eThe Oracle Problem dalam AI Coding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-oracle-problem-dalam-ai-coding\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konsep\"\u003eKonsep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konsep\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eThe Oracle Problem\u003c/strong\u003e muncul ketika kemampuan AI untuk menghasilkan implementasi dan test scaffolding melampaui kemampuan manusia (atau sistem) untuk menentukan apakah output tersebut benar-benar benar secara domain.\u003c/p\u003e\n\u003cp\u003eDalam TDD tradisional, manusia adalah oracle. Dalam AI-driven development, jika AI menulis kode sekaligus menulis test-nya, terjadi \u003cem\u003eself-justification\u003c/em\u003e (AI membuat test yang membenarkan kodenya sendiri).\u003c/p\u003e\n\u003ch2 id=\"solusi-oracle-driven-feedback\"\u003eSolusi: Oracle-Driven Feedback\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#solusi-oracle-driven-feedback\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk memecahkan masalah ini, feedback dalam loop AI harus berasal dari sumber yang:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eIndependen\u003c/strong\u003e: Tidak berasal dari agent yang menulis kode.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDeterministic\u003c/strong\u003e: Input yang sama selalu menghasilkan output yang sama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eQueryable\u003c/strong\u003e: Bisa ditanya untuk input baru secara spesifik.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"bentuk-oracle\"\u003eBentuk Oracle\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bentuk-oracle\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSistem Referensi (Mimicry)\u003c/strong\u003e: Menggunakan software yang sudah mapan sebagai sumber kebenaran (misal: menggunakan real Postgres untuk memvalidasi parser SQL baru).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConformance Suites\u003c/strong\u003e: Menggunakan kumpulan test standar industri (misal: Test262 untuk JS).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHuman-Defined Behavior\u003c/strong\u003e: Manusia menentukan output spesifik untuk edge case krusial.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relasi\"\u003eRelasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.ai-engineering.loop-driven-development\"\u003eLoop Driven Development (LDD): Solving the Oracle Problem\u003c/a\u003e: LDD adalah metodologi untuk mengelola oracle problem.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.ai.separation-of-maker-and-checker\"\u003ePemisahan Maker dan Checker dalam Verifikasi AI\u003c/a\u003e: Solusi fundamental untuk menghindari self-justification.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"
