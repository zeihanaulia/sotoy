:2},"contoh":{"type":"header","text":"Contoh","value":"contoh","line":170,"column":0,"depth":2},"implementasi":{"type":"header","text":"Implementasi","value":"implementasi","line":189,"column":0,"depth":2},"kapan-gunakan":{"type":"header","text":"Kapan gunakan","value":"kapan-gunakan","line":198,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related notes","value":"related-notes","line":204,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture.camp","data":{}},"body":"\u003ch1 id=\"indexed-masking-untuk-agentic-pii-protection\"\u003eIndexed masking untuk agentic PII protection\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#indexed-masking-untuk-agentic-pii-protection\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-ide\"\u003eInti ide\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-ide\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk agentic multi-turn, pseudonymization palsu bisa memancing model membuat asumsi atas dunia yang salah. Indexed masking atau tokenized pseudonymization lebih aman karena menjaga struktur dan referensi tanpa memasukkan fakta baru.\u003c/p\u003e\n\u003ch2 id=\"apa-bedanya-dengan-fake-pseudonymization\"\u003eApa bedanya dengan fake pseudonymization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-bedanya-dengan-fake-pseudonymization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFake pseudonymization mengganti data asli dengan nilai yang tampak natural:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Raka\" → \"Daniel\"\u003c/li\u003e\n\u003cli\u003e\"Tokopedia\" → \"Acme Corp\"\u003c/li\u003e\n\u003cli\u003e\"Bandung\" → \"Surabaya\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIndexed masking mengganti dengan placeholder terindeks:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Raka\" → \u003ccode\u003e[PERSON_001]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\"Tokopedia\" → \u003ccode\u003e[ORG_001]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\"Bandung\" → \u003ccode\u003e[LOCATION_001]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMapping asli disimpan lokal, tidak pernah dikirim ke external LLM.\u003c/p\u003e\n\u003ch2 id=\"kelebihan-indexed-masking\"\u003eKelebihan indexed masking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kelebihan-indexed-masking\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003etidak menambahkan fakta palsu yang bisa mengubah konteks,\u003c/li\u003e\n\u003cli\u003elebih transparan terhadap model,\u003c/li\u003e\n\u003cli\u003ekonsistensi referensi antar turn terjaga,\u003c/li\u003e\n\u003cli\u003ede-masking lebih deterministik,\u003c/li\u003e\n\u003cli\u003elebih mudah di-audit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kekurangan-indexed-masking\"\u003eKekurangan indexed masking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kekurangan-indexed-masking\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eteks menjadi lebih kaku,\u003c/li\u003e\n\u003cli\u003emodel kehilangan beberapa sinyal semantik,\u003c/li\u003e\n\u003cli\u003econtext-dependent entity seperti lokasi dan salary bisa jadi terlalu abstrak jika placeholder terlalu polos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"hybrid-yang-lebih-kuat\"\u003eHybrid yang lebih kuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hybrid-yang-lebih-kuat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk menjaga utility, indexed masking bisa ditambahkan metadata semantic ringkas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e[LOCATION_001: city in West Java, Indonesia]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[ORG_001: Indonesian e-commerce company]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[SALARY_001: monthly income 30–40M IDR]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDengan cara ini model tetap mendapat konteks yang relevan tanpa mengetahui value asli.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-perlu-ditulis-lebih-lengkap\"\u003eApa yang perlu ditulis lebih lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-perlu-ditulis-lebih-lengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eNote sebelumnya terlalu ringkas dan belum menangkap ruang lingkup desain ini.\nSekarang gue perlu menjelaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapa itu indexed masking secara teknis,\u003c/li\u003e\n\u003cli\u003ebagaimana dia berbeda dari fake pseudonymization dan redaction,\u003c/li\u003e\n\u003cli\u003estruktur mapping/local registry,\u003c/li\u003e\n\u003cli\u003ekapan pake placeholder polos vs placeholder berlabel semantics,\u003c/li\u003e\n\u003cli\u003erisiko semantic drift, utility loss, dan false sense of privacy,\u003c/li\u003e\n\u003cli\u003econtoh implementasi arsitektur,\u003c/li\u003e\n\u003cli\u003eliteratur yang benar-benar relevan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"indexed-masking--tokenized-pseudonymization\"\u003eIndexed masking / tokenized pseudonymization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#indexed-masking--tokenized-pseudonymization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIndexed masking adalah strategi anonymization di mana entity sensitif diganti dengan token terindeks yang konsisten di seluruh session.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eRaka\u003c/code\u003e → \u003ccode\u003e[PERSON_001]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eTokopedia\u003c/code\u003e → \u003ccode\u003e[ORG_001]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eBandung\u003c/code\u003e → \u003ccode\u003e[LOCATION_001]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e35 juta\u003c/code\u003e → \u003ccode\u003e[SALARY_001]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eToken ini hanyalah placeholder. Mapping asli disimpan secara lokal di middleware, tidak dikirim ke external LLM.\u003c/p\u003e\n\u003ch3 id=\"perbedaan-utama\"\u003ePerbedaan utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#perbedaan-utama\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTeknik\u003c/th\u003e\u003cth\u003eModel lihat\u003c/th\u003e\u003cth\u003eRisiko masuknya fakta palsu\u003c/th\u003e\u003cth\u003eCoherence\u003c/th\u003e\u003cth\u003eDe-masking\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eredaction kasar\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e[PERSON]\u003c/code\u003e, \u003ccode\u003e[ORG]\u003c/code\u003e\u003c/td\u003e\u003ctd\u003erendah\u003c/td\u003e\u003ctd\u003erendah\u003c/td\u003e\u003ctd\u003emudah\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003efake pseudonymization\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eDaniel\u003c/code\u003e, \u003ccode\u003eAcme Corp\u003c/code\u003e\u003c/td\u003e\u003ctd\u003etinggi\u003c/td\u003e\u003ctd\u003etinggi\u003c/td\u003e\u003ctd\u003erentan paraphrase\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eindexed masking\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e[PERSON_001]\u003c/code\u003e\u003c/td\u003e\u003ctd\u003erendah\u003c/td\u003e\u003ctd\u003esedang\u003c/td\u003e\u003ctd\u003emudah dan deterministic\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"kenapa-ini-lebih-aman-daripada-fake-pseudonymization\"\u003eKenapa ini lebih aman daripada fake pseudonymization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-lebih-aman-daripada-fake-pseudonymization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFake pseudonymization memasukkan detail palsu yang model bisa gunakan untuk reasoning.\nItu berbahaya karena konteks palsu bisa mengubah asumsi domain, hukum, budaya, dan task.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eTokopedia\u003c/code\u003e → \u003ccode\u003eAcme Corp\u003c/code\u003e membuat model berpikir konteks US/tech company\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eBandung\u003c/code\u003e → \u003ccode\u003eSurabaya\u003c/code\u003e bisa mengubah inferensi transportasi, regulasi, dan biaya hidup\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIndexed masking menghindari hal ini dengan tidak memberi model nilai dunia nyata yang salah.\u003c/p\u003e\n\u003ch2 id=\"kapan-placeholder-polos-cukup\"\u003eKapan placeholder polos cukup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-placeholder-polos-cukup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePlaceholder polos seperti \u003ccode\u003e[LOCATION_001]\u003c/code\u003e cocok ketika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eentity hanya berperan sebagai identifier,\u003c/li\u003e\n\u003cli\u003etask tidak membutuhkan informasi jenis, letak, atau nilai,\u003c/li\u003e\n\u003cli\u003ekita ingin maximal privacy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTapi kalau task membutuhkan semantik, placeholder polos bisa terlalu abstrak.\u003c/p\u003e\n\u003ch2 id=\"kapan-perlu-semantic-placeholders\"\u003eKapan perlu semantic placeholders\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-perlu-semantic-placeholders\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau entity punya makna task, tambahkan label ringkas.\nContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e[LOCATION_001: West Java city]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[ORG_001: Indonesian e-commerce company]\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[SALARY_001: monthly income 30–40M IDR]\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni masuk ke kategori semantic-preserving anonymization: data asli tidak terlihat, tetapi model masih punya sinyal penting.\u003c/p\u003e\n\u003ch2 id=\"arsitektur-implementasi\"\u003eArsitektur implementasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arsitektur-implementasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBagian utama yang harus ada:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePII extractor\u003c/strong\u003e — deteksi entity di setiap pesan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMapping generator\u003c/strong\u003e — buat token stabil untuk setiap entitas baru.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLocal registry\u003c/strong\u003e — simpan mapping asli ↔ token, metadata, jenis entity, dan timestamp.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContext rewriter\u003c/strong\u003e — ganti entity di prompt dengan token.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLLM inference\u003c/strong\u003e — kirim masked prompt ke external model.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eResponse de-masking\u003c/strong\u003e — ganti token kembali ke nilai asli bila aman.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePolicy enforcer\u003c/strong\u003e — putuskan apakah placeholder boleh dide-mask atau disimpan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"contoh-end-to-end\"\u003eContoh end-to-end\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-end-to-end\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOriginal history:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNama gue Raka.\nGue kerja di Tokopedia.\nGue tinggal di Bandung.\nGaji gue 35 juta.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMasked history:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNama gue [PERSON_001].\nGue kerja di [ORG_001].\nGue tinggal di [LOCATION_001].\nGaji gue [SALARY_001].\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLocal registry:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[PERSON_001] -\u003e Raka\n[ORG_001] -\u003e Tokopedia\n[LOCATION_001] -\u003e Bandung\n[SALARY_001] -\u003e 35 juta\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau model menjawab:\n\"[PERSON_001] should consider saving more from [SALARY_001]...\"\nDe-masking:\n\"Raka should consider saving more from 35 juta...\"\u003c/p\u003e\n\u003ch2 id=\"risiko-yang-harus-dicatat\"\u003eRisiko yang harus dicatat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#risiko-yang-harus-dicatat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUtility loss\u003c/strong\u003e: placeholder polos menghilangkan nilai task-relevant.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSemantic drift\u003c/strong\u003e: fake pseudonym bisa memasukkan konteks palsu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePre-trigger exposure\u003c/strong\u003e: kalau history asli sudah pernah dikirim, masternya tetap bocor.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMapping security\u003c/strong\u003e: registry lokal harus aman dan dihapus sesudah session.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePartial de-masking\u003c/strong\u003e: jika model membuat variasi nama token, backmapping harus robust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"literatur-yang-lebih-lengkap\"\u003eLiteratur yang lebih lengkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#literatur-yang-lebih-lengkap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bukan istilah khusus, tapi ide ini cocok dengan beberapa konsep literatur:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ereversible pseudonymization\u003c/strong\u003e atau \u003cstrong\u003esurrogate identifiers\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eentity masking with backmapping\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003econtextualized anonymization\u003c/strong\u003e,\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eprivacy gateway / prompt gateway\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePapers serta sumber relevan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNISTIR 8053 — de-identification/pseudonymization sebagai fondasi.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://nvlpubs.nist.gov/nistpubs/ir/2015/NIST.IR.8053.pdf\"\u003ehttps://nvlpubs.nist.gov/nistpubs/ir/2015/NIST.IR.8053.pdf\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ePortcullis — privacy gateway untuk LLM inference dengan input rewriting dan response reconstruction.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://ojs.aaai.org/index.php/AAAI/article/view/32088/34243\"\u003ehttps://ojs.aaai.org/index.php/AAAI/article/view/32088/34243\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eBalancing Privacy and Utility in Personal LLM Writing Tasks — evaluasi masking vs pseudonymization.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://arxiv.org/abs/2408.12345\"\u003ehttps://arxiv.org/abs/2408.12345\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eOperationalizing Data Minimization for Privacy-Preserving LLM Prompting — prinsip minimum data yang cukup.\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://openreview.net/forum?id=rpcnvW33EG\"\u003ehttps://openreview.net/forum?id=rpcnvW33EG\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"contoh\"\u003eContoh\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOriginal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Nama gue Raka.\"\u003c/li\u003e\n\u003cli\u003e\"Gue kerja di Tokopedia.\"\u003c/li\u003e\n\u003cli\u003e\"Gue tinggal di Bandung.\"\u003c/li\u003e\n\u003cli\u003e\"Gaji gue 35 juta.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIndexed masking:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Nama gue [PERSON_001].\"\u003c/li\u003e\n\u003cli\u003e\"Gue kerja di [ORG_001].\"\u003c/li\u003e\n\u003cli\u003e\"Gue tinggal di [LOCATION_001].\"\u003c/li\u003e\n\u003cli\u003e\"Gaji gue [SALARY_001].\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eHybrid indexed masking:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Nama gue [PERSON_001].\"\u003c/li\u003e\n\u003cli\u003e\"Gue kerja di [ORG_001: Indonesian e-commerce company].\"\u003c/li\u003e\n\u003cli\u003e\"Gue tinggal di [LOCATION_001: West Java city].\"\u003c/li\u003e\n\u003cli\u003e\"Gaji gue [SALARY_001: monthly income 30–40M IDR].\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"implementasi\"\u003eImplementasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implementasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eArsitektur ideal:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eextractor PII menemukan entity,\u003c/li\u003e\n\u003cli\u003emapper membuat token stabil dan typed,\u003c/li\u003e\n\u003cli\u003elocal registry menyimpan mapping asli,\u003c/li\u003e\n\u003cli\u003ewriter mengganti entity di context,\u003c/li\u003e\n\u003cli\u003emodel menerima masked context,\u003c/li\u003e\n\u003cli\u003eoutput de-mask ke user jika aman.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"kapan-gunakan\"\u003eKapan gunakan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-gunakan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eketika identity asli harus disembunyikan sepenuhnya,\u003c/li\u003e\n\u003cli\u003eketika fake pseudonym berisiko membuat dunia palsu,\u003c/li\u003e\n\u003cli\u003eketika kita butuh determinisme dan auditability,\u003c/li\u003e\n\u003cli\u003eketika task masih bisa dijalankan dengan metadata abstraction.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagent (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecamp (Private)\u003c/a\u003e\u003c/
