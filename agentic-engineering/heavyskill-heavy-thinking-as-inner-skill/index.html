","value":"321-thinker-adalah-trajectory-generator","line":75,"column":0,"depth":4},"33-apa-itu-trajectory":{"type":"header","text":"3.3 Apa itu trajectory?","value":"33-apa-itu-trajectory","line":82,"column":0,"depth":3},"34-apa-yang-terjadi-di-tahap-sequential-deliberation":{"type":"header","text":"3.4 Apa yang terjadi di tahap sequential deliberation?","value":"34-apa-yang-terjadi-di-tahap-sequential-deliberation","line":93,"column":0,"depth":3},"35-kenapa-hasil-akhirnya-bisa-lebih-baik-daripada-jawaban-tunggal":{"type":"header","text":"3.5 Kenapa hasil akhirnya bisa lebih baik daripada jawaban tunggal?","value":"35-kenapa-hasil-akhirnya-bisa-lebih-baik-daripada-jawaban-tunggal","line":109,"column":0,"depth":3},"4-fungsi-serialized-memory-cache":{"type":"header","text":"4. Fungsi serialized memory cache","value":"4-fungsi-serialized-memory-cache","line":117,"column":0,"depth":2},"41-apa-arti-serialize-di-sini":{"type":"header","text":"4.1 Apa arti \"serialize\" di sini?","value":"41-apa-arti-serialize-di-sini","line":122,"column":0,"depth":3},"42-kenapa-butuh-memory-cache":{"type":"header","text":"4.2 Kenapa butuh memory cache?","value":"42-kenapa-butuh-memory-cache","line":133,"column":0,"depth":3},"43-di-level-mana-cache-ini-hidup":{"type":"header","text":"4.3 Di level mana cache ini hidup?","value":"43-di-level-mana-cache-ini-hidup","line":143,"column":0,"depth":3},"44-apa-isi-cache-nya":{"type":"header","text":"4.4 Apa isi cache-nya?","value":"44-apa-isi-cache-nya","line":150,"column":0,"depth":3},"45-apa-bedanya-dengan-kv-cache-model":{"type":"header","text":"4.5 Apa bedanya dengan KV-cache model?","value":"45-apa-bedanya-dengan-kv-cache-model","line":165,"column":0,"depth":3},"46-kenapa-harus-di-prune-dan-di-shuffle":{"type":"header","text":"4.6 Kenapa harus di-prune dan di-shuffle?","value":"46-kenapa-harus-di-prune-dan-di-shuffle","line":173,"column":0,"depth":3},"47-bedanya-dengan-conversation-history-biasa":{"type":"header","text":"4.7 Bedanya dengan conversation history biasa","value":"47-bedanya-dengan-conversation-history-biasa","line":180,"column":0,"depth":3},"5-kenapa-deliberation-lebih-baik-dari-majority-voting":{"type":"header","text":"5. Kenapa deliberation lebih baik dari majority voting?","value":"5-kenapa-deliberation-lebih-baik-dari-majority-voting","line":187,"column":0,"depth":2},"6-di-benchmark-apa-metode-ini-berhasil-dan-di-mana-lemah":{"type":"header","text":"6. Di benchmark apa metode ini berhasil dan di mana lemah?","value":"6-di-benchmark-apa-metode-ini-berhasil-dan-di-mana-lemah","line":198,"column":0,"depth":2},"7-implikasi-untuk-agentic-coding-dan-ai-engineering":{"type":"header","text":"7. Implikasi untuk agentic coding dan AI engineering","value":"7-implikasi-untuk-agentic-coding-dan-ai-engineering","line":212,"column":0,"depth":2},"8-failure-mode-penting":{"type":"header","text":"8. Failure mode penting","value":"8-failure-mode-penting","line":225,"column":0,"depth":2},"9-analogi-praktis":{"type":"header","text":"9. Analogi praktis","value":"9-analogi-praktis","line":245,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":253,"column":0,"depth":2},"related":{"type":"header","text":"Related","value":"related","line":259,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"heavyskill-heavy-thinking-as-inner-skill-in-agentic-harness\"\u003eHeavySkill: Heavy Thinking as Inner Skill in Agentic Harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#heavyskill-heavy-thinking-as-inner-skill-in-agentic-harness\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"context-check\"\u003eContext check\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#context-check\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini punya istilah yang mudah disalahtafsirkan, jadi gue kunci dulu artinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"Heavy Thinking\" = pola inferensi test-time scaling dua tahap: banyak reasoning path dibuat paralel, lalu satu tahap deliberation yang menyintesis.\u003c/li\u003e\n\u003cli\u003e\"Skill\" = dokumen instruksi yang bisa dimuat agentic harness, berisi kapan dipakai, bagaimana dipakai, dan seperti apa outputnya.\u003c/li\u003e\n\u003cli\u003e\"Agentic harness\" = kerangka orkestrasi agent: model, subagent, memory, skill, tool, dan loop eksekusi.\u003c/li\u003e\n\u003cli\u003e\"Thinker\" = satu trajectory generator, bukan agent dengan pengetahuan berbeda. 8 thinker bisa saja model yang sama dengan sampling independen.\u003c/li\u003e\n\u003cli\u003e\"Bias reviewer/deliberator\" ada dua makna: bias posisi dalam prompt dan bias internal model. Paper ini lebih eksplisit soal bias posisi lewat shuffling cache, tetapi belum sepenuhnya menuntaskan bias internal model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaper ini bukan tentang \"AI mikir lama.\" Ini tentang:\n\u003cstrong\u003eAI membuat beberapa percobaan berpikir secara terpisah, lalu satu reviewer membaca semua percobaan itu dan mengambil keputusan final.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"1-masalah-yang-coba-diselesaikan\"\u003e1. Masalah yang coba diselesaikan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-masalah-yang-coba-diselesaikan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalah dasarnya: satu reasoning path itu rapuh.\u003c/p\u003e\n\u003cp\u003eKalau model cuma ikut satu lintasan awal, asumsi pertama bisa menuntun semua langkah berikutnya. Jika asumsi awal salah, jawaban akhir ikut bengkok.\u003c/p\u003e\n\u003cp\u003eContoh sederhana:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\"aplikasi lambat di repo besar\" bisa jadi karena RAM, indexing, extension, context retrieval, I/O, atau integrasi IDE.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaper menanyakan: apakah agentic harness yang terlihat rumit sebenarnya hanya melakukan dua tahap sederhana?\u003c/p\u003e\n\u003cp\u003eJawabannya: ya — parallel reasoning lalu sequential deliberation.\u003c/p\u003e\n\u003ch2 id=\"2-apa-itu-heavyskill\"\u003e2. Apa itu HeavySkill?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-apa-itu-heavyskill\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHeavySkill adalah pola kerja yang dipaketkan sebagai skill bagi agentic harness.\u003c/p\u003e\n\u003cp\u003eBukan model baru. Bukan framework baru. Bukan sekadar plugin.\u003c/p\u003e\n\u003cp\u003eIni adalah dokumen instruksi yang menjelaskan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekapan heavy thinking dipakai,\u003c/li\u003e\n\u003cli\u003ebagaimana spawn K thinker,\u003c/li\u003e\n\u003cli\u003ebagaimana reviewer mengevaluasi trajectory,\u003c/li\u003e\n\u003cli\u003eformat output final.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi HeavySkill adalah guardrail kognitif, bukan guardrail eksekusi.\u003c/p\u003e\n\u003ch2 id=\"3-workflow-heavy-thinking\"\u003e3. Workflow Heavy Thinking\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-workflow-heavy-thinking\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWorkflow Heavy Thinking adalah alur kerja inferensi dari input awal sampai jawaban final.\u003c/p\u003e\n\u003ch3 id=\"31-kalau-input-nya-satu-pertanyaan-kenapa-sistem-bikin-banyak-jawaban-dulu\"\u003e3.1 Kalau input-nya satu pertanyaan, kenapa sistem bikin banyak jawaban dulu?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#31-kalau-input-nya-satu-pertanyaan-kenapa-sistem-bikin-banyak-jawaban-dulu\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena satu jawaban tunggal rentan terjebak pada satu asumsi awal.\u003c/p\u003e\n\u003cp\u003eThinker 1 bisa fokus ke RAM.\nThinker 2 bisa fokus ke indexing.\nThinker 3 bisa fokus ke extension.\nThinker 4 bisa fokus ke context retrieval.\u003c/p\u003e\n\u003cp\u003eMembuat banyak jawaban dulu memperbanyak hipotesis awal sehingga sistem tidak terkunci pada satu lintasan.\u003c/p\u003e\n\u003cp\u003eAtomic idea: parallel reasoning = memperbanyak kemungkinan agar tidak semua bergantung pada asumsi pertama.\u003c/p\u003e\n\u003ch3 id=\"32-apa-bedanya-parallel-reasoning-dengan-tanya-model-berkali-kali-biasa\"\u003e3.2 Apa bedanya “parallel reasoning” dengan “tanya model berkali-kali” biasa?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#32-apa-bedanya-parallel-reasoning-dengan-tanya-model-berkali-kali-biasa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBeda utamanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eParallel reasoning minta K thinker independen.\u003c/li\u003e\n\u003cli\u003eTanya model berkali-kali biasa bisa menghasilkan jawaban yang saling bias.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJika thinker B membaca atau dipengaruhi oleh output thinker A, ia bisa meniru asumsi yang sama. Heavy Thinking idealnya membuat setiap trajectory dimulai dari nol.\u003c/p\u003e\n\u003cp\u003eJadi parallel reasoning bukan sekadar repetisi. Ia adalah eksplorasi independen.\u003c/p\u003e\n\u003ch4 id=\"321-thinker-adalah-trajectory-generator\"\u003e3.2.1 Thinker adalah trajectory generator\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#321-thinker-adalah-trajectory-generator\"\u003e\u003c/a\u003e\u003c/h4\u003e\n\u003cp\u003eThinker di sini bukan berarti ada 8 agent berbeda. Thinker berarti satu generator trajectory. Jadi 8 thinker bisa saja model yang sama, dengan sampling independen dan prompt yang memaksa variasi.\u003c/p\u003e\n\u003cp\u003eMasalah penting: kalau semua thinker berasal dari model yang sama dengan prior dan prompt mirip, diversity bisa palsu. 8 trajectory bisa berakhir sebagai 8 variasi jawaban yang sama.\u003c/p\u003e\n\u003cp\u003eAtomic idea: parallel reasoning hanya berguna kalau ia benar-benar membuka beberapa jalur hipotesis; bukan sekadar echo chamber yang lebih mahal.\u003c/p\u003e\n\u003ch3 id=\"33-apa-itu-trajectory\"\u003e3.3 Apa itu trajectory?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#33-apa-itu-trajectory\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTrajectory adalah jalur reasoning dari input sampai kandidat jawaban.\u003c/p\u003e\n\u003cp\u003eBukan cuma jawaban akhirnya. Trajectory berisi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003easumsi awal,\u003c/li\u003e\n\u003cli\u003elangkah berpikir,\u003c/li\u003e\n\u003cli\u003eevidence yang dipakai,\u003c/li\u003e\n\u003cli\u003ekesimpulan sementara.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTrajectory penting karena deliberator nanti akan menilai cara sampai ke jawaban, bukan hanya hasilnya.\u003c/p\u003e\n\u003ch3 id=\"34-apa-yang-terjadi-di-tahap-sequential-deliberation\"\u003e3.4 Apa yang terjadi di tahap sequential deliberation?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#34-apa-yang-terjadi-di-tahap-sequential-deliberation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTahap ini memakai reviewer model.\u003c/p\u003e\n\u003cp\u003eReviewer membaca semua trajectory.\nTugasnya bukan memilih yang paling populer.\nTugasnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emengevaluasi reasoning,\u003c/li\u003e\n\u003cli\u003emembandingkan evidence,\u003c/li\u003e\n\u003cli\u003emendeteksi error,\u003c/li\u003e\n\u003cli\u003emenggabungkan insight,\u003c/li\u003e\n\u003cli\u003emenulis final answer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDeliberation bukan ringkasan biasa. Ia adalah proses kritis.\u003c/p\u003e\n\u003cp\u003eContoh final answer yang bagus akan menggabungkan beberapa trajectory, bukan hanya memilih satu.\u003c/p\u003e\n\u003ch3 id=\"35-kenapa-hasil-akhirnya-bisa-lebih-baik-daripada-jawaban-tunggal\"\u003e3.5 Kenapa hasil akhirnya bisa lebih baik daripada jawaban tunggal?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#35-kenapa-hasil-akhirnya-bisa-lebih-baik-daripada-jawaban-tunggal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena deliberator punya bahan dari banyak sumber.\u003c/p\u003e\n\u003cp\u003eJika satu trajectory minoritas benar, reviewer bisa menemukan dan memilihnya.\nJika beberapa trajectory berbeda memberi bukti komplementer, reviewer bisa synthesize jawaban baru.\u003c/p\u003e\n\u003cp\u003eDengan satu jawaban tunggal, model hanya punya satu kesempatan. Dengan Heavy Thinking, model punya banyak hipotesis lalu satu kesempatan untuk memutuskan.\u003c/p\u003e\n\u003ch2 id=\"4-fungsi-serialized-memory-cache\"\u003e4. Fungsi serialized memory cache\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-fungsi-serialized-memory-cache\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSerialized memory cache adalah mekanisme agentic workflow untuk menyimpan hasil thinkernya sebagai konteks terstruktur bagi tahap deliberation berikutnya.\u003c/p\u003e\n\u003cp\u003eDi paper ini, \"serialized memory cache\" bukan memory internal model seperti KV-cache atau hidden state. Ini adalah memory eksternal: kumpulan trajectory yang dikumpulkan, dipangkas, diurutkan, lalu dirender sebagai prompt untuk reviewer.\u003c/p\u003e\n\u003ch3 id=\"41-apa-arti-serialize-di-sini\"\u003e4.1 Apa arti \"serialize\" di sini?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#41-apa-arti-serialize-di-sini\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\"Serialize\" artinya mengubah beberapa hasil reasoning yang terpisah menjadi satu representasi konteks terstruktur.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekumpulkan output T1–T4\u003c/li\u003e\n\u003cli\u003eekstrak hipotesis dan evidence penting\u003c/li\u003e\n\u003cli\u003elabel setiap thinker\u003c/li\u003e\n\u003cli\u003egabungkan menjadi satu paket prompt\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea: serialization = mengubah output terpisah menjadi konteks yang bisa dibaca ulang.\u003c/p\u003e\n\u003ch3 id=\"42-kenapa-butuh-memory-cache\"\u003e4.2 Kenapa butuh memory cache?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#42-kenapa-butuh-memory-cache\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena Heavy Thinking adalah workflow dua tahap.\u003c/p\u003e\n\u003cp\u003eTahap 1: parallel reasoning.\nTahap 2: sequential deliberation.\u003c/p\u003e\n\u003cp\u003eTanpa cache, reviewer tidak punya bahan. Memory cache berfungsi sebagai jembatan antar fase: catatan sementara yang menyimpan kandidat trajectory agar deliberator bisa membandingkan.\u003c/p\u003e\n\u003cp\u003eAnalogi: thinker = analis, memory cache = map berisi notulen mereka, deliberator = reviewer senior.\u003c/p\u003e\n\u003ch3 id=\"43-di-level-mana-cache-ini-hidup\"\u003e4.3 Di level mana cache ini hidup?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#43-di-level-mana-cache-ini-hidup\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCache ini hidup di level agent/workflow/harness, bukan di dalam model sebagai mekanisme native.\u003c/p\u003e\n\u003cp\u003eDi workflow mode, orchestrator eksternal memanggil model beberapa kali, menyimpan output, lalu menyusun prompt deliberation. Di skill mode, instruksi skill memandu orchestration ini, tetapi secara operasional cache tetap dibangun di luar parameter model.\u003c/p\u003e\n\u003cp\u003eAtomic idea: serialized memory cache adalah runtime artifact, bukan learned memory di weights.\u003c/p\u003e\n\u003ch3 id=\"44-apa-isi-cache-nya\"\u003e4.4 Apa isi cache-nya?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#44-apa-isi-cache-nya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCache berisi versi terstruktur dari trajectory, bukan dump mentah.\u003c/p\u003e\n\u003cp\u003eIsi yang ideal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehipotesis tiap thinker,\u003c/li\u003e\n\u003cli\u003eevidence kunci,\u003c/li\u003e\n\u003cli\u003ejawaban kandidat,\u003c/li\u003e\n\u003cli\u003eindikasi counter-evidence,\u003c/li\u003e\n\u003cli\u003elabel thinker,\u003c/li\u003e\n\u003cli\u003emetadata verification.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBentuknya bisa berupa teks terformat, JSON, markdown, atau blok prompt terstruktur.\u003c/p\u003e\n\u003cp\u003eAtomic idea: cache menyimpan bahan minimum yang cukup untuk dibandingkan.\u003c/p\u003e\n\u003ch3 id=\"45-apa-bedanya-dengan-kv-cache-model\"\u003e4.5 Apa bedanya dengan KV-cache model?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#45-apa-bedanya-dengan-kv-cache-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKV-cache transformer adalah cache internal untuk attention, dipakai model di dalam inference pipeline.\u003c/p\u003e\n\u003cp\u003eSerialized memory cache adalah cache eksternal untuk reasoning artifact yang dikelola agent/harness.\u003c/p\u003e\n\u003cp\u003eKV-cache = cache komputasi.\nSerialized memory cache = cache reasoning.\u003c/p\u003e\n\u003ch3 id=\"46-kenapa-harus-di-prune-dan-di-shuffle\"\u003e4.6 Kenapa harus di-prune dan di-shuffle?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#46-kenapa-harus-di-prune-dan-di-shuffle\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePruning diperlukan karena full trajectory terlalu panjang untuk prompt deliberator. Tanpa pruning, context window bisa meledak, evidence tenggelam, dan reviewer kewalahan.\u003c/p\u003e\n\u003cp\u003eShuffling diperlukan untuk mitigasi bias posisi: reviewer tidak selalu terpengaruh oleh jawaban awal atau akhir. Ini mengurangi bias prompt, tetapi bukan menghilangkan bias internal model.\u003c/p\u003e\n\u003cp\u003eAtomic idea: cache adalah mekanisme presentasi evidence, bukan sekadar penyimpanan.\u003c/p\u003e\n\u003ch3 id=\"47-bedanya-dengan-conversation-history-biasa\"\u003e4.7 Bedanya dengan conversation history biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#47-bedanya-dengan-conversation-history-biasa\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eConversation history adalah urutan pesan chat. Serialized memory cache adalah scratchpad terstruktur untuk satu task inferensi.\u003c/p\u003e\n\u003cp\u003eCache lebih spesifik: ia memuat hipotesis, evidence, dan struktur per thinker, bukan sekadar dialog user-assistant.\u003c/p\u003e\n\u003cp\u003eAtomic idea: serialized memory cache adalah working memory eksternal untuk workflow, bukan histori obrolan biasa.\u003c/p\u003e\n\u003ch2 id=\"5-kenapa-deliberation-lebih-baik-dari-majority-voting\"\u003e5. Kenapa deliberation lebih baik dari majority voting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-kenapa-deliberation-lebih-baik-dari-majority-voting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMajority voting hanya melihat apa yang paling sering muncul.\u003c/p\u003e\n\u003cp\u003eDeliberation menilai kualitas reasoning.\u003c/p\u003e\n\u003cp\u003ePerbedaan inti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eVoting: \"jawaban mana paling populer?\"\u003c/li\u003e\n\u003cli\u003eDeliberation: \"reasoning mana paling valid?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni krusial ketika jawaban benar adalah minoritas dan mayoritas sama-sama salah.\u003c/p\u003e\n\u003ch2 id=\"6-di-benchmark-apa-metode-ini-berhasil-dan-di-mana-lemah\"\u003e6. Di benchmark apa metode ini berhasil dan di mana lemah?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-di-benchmark-apa-metode-ini-berhasil-dan-di-mana-lemah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHeavySkill unggul di benchmark correctness-oriented:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAIME25,\u003c/li\u003e\n\u003cli\u003eBeyondAIME,\u003c/li\u003e\n\u003cli\u003eHMMT25-Feb,\u003c/li\u003e\n\u003cli\u003eGPQA-Diamond.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi tugas preference-oriented, gain bisa kecil atau negatif:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArena-Hard,\u003c/li\u003e\n\u003cli\u003eIMO Answer Bench,\u003c/li\u003e\n\u003cli\u003etugas gaya / opini.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya: HeavySkill bagus untuk pertanyaan yang punya sinyal benar-salah, kurang stabil untuk pertanyaan subjektif.\u003c/p\u003e\n\u003ch2 id=\"7-implikasi-untuk-agentic-coding-dan-ai-engineering\"\u003e7. Implikasi untuk agentic coding dan AI engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-implikasi-untuk-agentic-coding-dan-ai-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat agentic coding, takeaway utama adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003episahkan generating options dari evaluating options,\u003c/li\u003e\n\u003cli\u003egunakan tool feedback sebagai evidence,\u003c/li\u003e\n\u003cli\u003ejangan berharap single-pass jawaban cukup untuk masalah kompleks,\u003c/li\u003e\n\u003cli\u003ejangan biarkan agent \"reflect forever.\" Batasi iterasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWorkflow yang ideal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eparallel agents menghasilkan hipotesis,\u003c/li\u003e\n\u003cli\u003eserialized cache menyimpan evidence,\u003c/li\u003e\n\u003cli\u003edeliberator membandingkan dan menyintesis,\u003c/li\u003e\n\u003cli\u003efinal answer diverifikasi oleh test/tool.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"8-failure-mode-penting\"\u003e8. Failure mode penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-failure-mode-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHeavy Thinking gagal jika:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etrajectory tidak beragam,\u003c/li\u003e\n\u003cli\u003edeliberator hanya ikut mayoritas,\u003c/li\u003e\n\u003cli\u003ecache terlalu panjang atau terlalu dipangkas,\u003c/li\u003e\n\u003cli\u003etask terlalu subjektif,\u003c/li\u003e\n\u003cli\u003ereflection berlebihan tanpa evidence,\u003c/li\u003e\n\u003cli\u003etool feedback tidak dipakai.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKhususnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau semua thinker sama, parallel reasoning jadi echo chamber.\u003c/li\u003e\n\u003cli\u003ekalau reviewer bias, deliberation bisa memilih jawaban yang nyaman, bukan yang benar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMitigasi yang lebih kuat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edesain role-based thinker dengan lensa berbeda,\u003c/li\u003e\n\u003cli\u003estruktur cache jadi evidence+hypothesis, bukan narasi panjang,\u003c/li\u003e\n\u003cli\u003erandomize order dan anonymize thinker,\u003c/li\u003e\n\u003cli\u003eminta reviewer menilai bukti, kontra-evidence, dan kemungkinan kegagalan,\u003c/li\u003e\n\u003cli\u003epakai second-pass verification untuk task penting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"9-analogi-praktis\"\u003e9. Analogi praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-analogi-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHeavy Thinking mirip mini review board:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebeberapa orang beri solusi sendiri-sendiri,\u003c/li\u003e\n\u003cli\u003esatu moderator/reviewer baca semuanya,\u003c/li\u003e\n\u003cli\u003emoderator memilih atau menggabungkan solusi terbaik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBukan satu orang langsung menjawab.\u003c/p\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHeavy Thinking bukan \"AI mikir panjang.\" Lebih tepat:\n\u003cstrong\u003eAI membuat beberapa percobaan berpikir secara terpisah, lalu satu AI reviewer membaca semua percobaan itu dan membuat keputusan final.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIni adalah pattern kerja AI yang bisa dipakai di agentic harness.\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508142459\"\u003eAI slop is research if bounded; it becomes architecture if it survives too long\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508152050\"\u003eHeavySkill turns parallel reasoning plus deliberation into a reusable agentic skill\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-harness (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eheavy-thinking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260508152050\"\u003eHeavySkill turns pa
