-lane-ringkas":{"type":"header","text":"11. Lane ringkas","value":"11-lane-ringkas","line":265,"column":0,"depth":2},"12-insight":{"type":"header","text":"12. Insight","value":"12-insight","line":277,"column":0,"depth":2}},"children":[],"parent":"es4410hkah4zuiasco1f1q0","data":{}},"body":"\u003ch1 id=\"paper-arxiv-260405000v1-closed-loop-backlog-workflow\"\u003ePaper arXiv 2604.05000v1: Closed-loop backlog workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#paper-arxiv-260405000v1-closed-loop-backlog-workflow\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari gue, paper ini penting karena menjelaskan bagaimana workflow closed-loop seharusnya bekerja untuk perbaikan kode dan backlog. Ini bukan sekadar chatbot yang bilang \"generate fix\". Arti workflow di sini adalah alur kerja sistem dari backlog mentah sampai ticket selesai/diverifikasi, di mana AI hanyalah salah satu operator di dalam pabrik kecil itu.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003esource docs / Jira / scan finding → canonical backlog → grooming → fix queue → isolated code fix → verification → publish ke Jira → reconcile balik ke backlog → audit trail\u003c/code\u003e\u003c/p\u003e\n\u003ch2 id=\"5-pertanyaan-kunci\"\u003e5 Pertanyaan Kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDari mana kerjaan masuk?\u003c/li\u003e\n\u003cli\u003eBagaimana sistem memutuskan ticket mana yang aman dikerjakan?\u003c/li\u003e\n\u003cli\u003eKapan AI boleh mengubah kode?\u003c/li\u003e\n\u003cli\u003eSiapa yang mengecek hasilnya?\u003c/li\u003e\n\u003cli\u003eBagaimana hasilnya balik ke Jira dan backlog?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"1-intake-dari-mana-kerjaan-masuk\"\u003e1. Intake: dari mana kerjaan masuk?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-intake-dari-mana-kerjaan-masuk\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eInput datang dari banyak sumber, bukan cuma Jira. Paper ini menyebut setidaknya 13 dokumen terstruktur sebagai sumber:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eplanning document\u003c/li\u003e\n\u003cli\u003edesign spec\u003c/li\u003e\n\u003cli\u003earchitecture review\u003c/li\u003e\n\u003cli\u003esecurity assessment\u003c/li\u003e\n\u003cli\u003edeployment manifest\u003c/li\u003e\n\u003cli\u003erunbook\u003c/li\u003e\n\u003cli\u003eexisting Jira tickets\u003c/li\u003e\n\u003cli\u003ecodebase scan findings\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWorkflow Lane 1 adalah \u003ccode\u003eBacklog Sync \u0026#x26; Intake\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eTugasnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emembaca semua sumber,\u003c/li\u003e\n\u003cli\u003emembuat item backlog yang eksplisit,\u003c/li\u003e\n\u003cli\u003emenambahkan field minimal: identifier, title, description, source reference, tags, priority, owner.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: kerjaan harus dibuat eksplisit dulu sebelum bisa diotomasi. Kalau requirement masih cuma \"ada di dokumen\", agent belum boleh asal memperbaiki.\u003c/p\u003e\n\u003ch2 id=\"2-canonical-backlog-sumber-kebenaran-lokal\"\u003e2. Canonical backlog: sumber kebenaran lokal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-canonical-backlog-sumber-kebenaran-lokal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini tidak menjadikan Jira sebagai source of truth utama. Jira hanya public status surface. Source of truth yang otoritatif adalah \u003cstrong\u003ecanonical backlog lokal\u003c/strong\u003e yang versioned.\u003c/p\u003e\n\u003cp\u003eAnalogi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecanonical backlog = buku besar akuntansi\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eJira = papan pengumuman publik\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWorkflow-nya:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eRaw input\n  ↓\nCanonical backlog lokal\n  ↓\nJira disinkronkan sebagai representasi publik\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni penting, karena kalau Jira langsung dianggap kebenaran utama, agent bisa terjebak oleh status yang salah, duplicate ticket, atau komentar tidak lengkap.\u003c/p\u003e\n\u003ch2 id=\"3-canonicalization-dan-confidence-tiers\"\u003e3. Canonicalization dan confidence tiers\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-canonicalization-dan-confidence-tiers\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah item masuk backlog, sistem melakukan dedup dan matching.\u003c/p\u003e\n\u003cp\u003eStrateginya meliputi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eexact tag matching,\u003c/li\u003e\n\u003cli\u003ekey matching,\u003c/li\u003e\n\u003cli\u003esummary similarity,\u003c/li\u003e\n\u003cli\u003efuzzy text matching.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePaper memakai score similarity \u003ccode\u003es\u003c/code\u003e dengan tier:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003es \u003e= 0.83       → autonomous action\n0.50 \u0026#x3C;= s \u0026#x3C; 0.83 → human review\ns \u0026#x3C; 0.50        → halt / re-ingest\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: autonomy bukan boolean; autonomy adalah confidence tier.\u003c/p\u003e\n\u003cp\u003eSistem menanyakan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eseberapa yakin item ini cocok dengan task/fix plan yang sudah dikenal?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau sangat yakin, boleh lanjut. Kalau setengah yakin, manusia harus review. Kalau rendah, jangan diteruskan.\u003c/p\u003e\n\u003ch2 id=\"4-grooming-menyiapkan-strategi-fix\"\u003e4. Grooming: menyiapkan strategi fix\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-grooming-menyiapkan-strategi-fix\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLane 3 adalah \u003ccode\u003eBacklog Groomer\u003c/code\u003e.\nDia tidak langsung memperbaiki kode. Dia menyiapkan \u003ccode\u003efix_queue\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eIsi \u003ccode\u003efix_queue\u003c/code\u003e kira-kira:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eticket_id\u003c/li\u003e\n\u003cli\u003epriority_score\u003c/li\u003e\n\u003cli\u003epriority_type\u003c/li\u003e\n\u003cli\u003erelevant_paths\u003c/li\u003e\n\u003cli\u003earea\u003c/li\u003e\n\u003cli\u003econfidence\u003c/li\u003e\n\u003cli\u003efix_strategy\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLane 3 berperan seperti tech lead kecil: menyortir ticket, menentukan mana yang actionable, memilih area kode relevan, dan mengirim ke Lane 4.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: agent fixer tidak boleh memilih sendiri sesukanya. Dia cuma mengerjakan queue yang sudah digrooming.\u003c/p\u003e\n\u003ch2 id=\"5-claim-ticket-ownership-harus-terlihat\"\u003e5. Claim ticket: ownership harus terlihat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-claim-ticket-ownership-harus-terlihat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSebelum Lane 4 membaca kode, agent harus mengunci ticket di Jira dengan transisi:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eTo Do → In Progress\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFungsinya sebagai distributed lock.\nKalau gagal, berarti ticket sudah diklaim agent lain atau manusia, maka worker harus abandon dan ambil ticket lain.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: sebelum agent mengubah kode, ownership harus terlihat secara eksternal.\u003c/p\u003e\n\u003ch2 id=\"6-execution-isolated-worktree\"\u003e6. Execution: isolated worktree\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-execution-isolated-worktree\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLane 4 adalah AI Code Fixer.\nDia bekerja di isolated worktree, bukan on main working directory.\u003c/p\u003e\n\u003cp\u003eWorkflow:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eticket diklaim,\u003c/li\u003e\n\u003cli\u003ebuat isolated worktree,\u003c/li\u003e\n\u003cli\u003eAI/code fixer apply perubahan,\u003c/li\u003e\n\u003cli\u003egenerate diff,\u003c/li\u003e\n\u003cli\u003esimpan evidence.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAda time budget:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003estandard hourly run: 45 menit,\u003c/li\u003e\n\u003cli\u003enightly deep sweep: 120 menit,\u003c/li\u003e\n\u003cli\u003echeckpoint 10 menit,\u003c/li\u003e\n\u003cli\u003ekalau stuck → hard stop.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau gagal, worktree dibuang dan ticket kembali ke queue.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: agent boleh eksperimen, tapi eksperimennya terjadi di ruang isolasi.\u003c/p\u003e\n\u003ch2 id=\"7-verification-executor-tidak-boleh-jadi-auditor\"\u003e7. Verification: executor tidak boleh jadi auditor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-verification-executor-tidak-boleh-jadi-auditor\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni prinsip paling penting.\nSetelah Lane 4 membuat perubahan, Lane 6 menjalankan quality gate.\u003c/p\u003e\n\u003cp\u003eVerifikator meliputi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eproduct verifier: compile, unit test, integration constraint,\u003c/li\u003e\n\u003cli\u003esecurity verifier: npm audit, eslint/static analysis, security ticket verifier,\u003c/li\u003e\n\u003cli\u003emutation/state check.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWorkflow:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eDiff dari Lane 4\n  ↓\nLane 6: Quality Gate\n  ↓\nPass atau fail\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau pass:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eIn Progress → Done\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau fail:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eIn Progress → To Do\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFail kembali ke \u003ccode\u003eTo Do\u003c/code\u003e supaya harus melewati pipeline lagi dengan review baru.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: failure harus balik ke sistem keputusan, bukan dipaksa lanjut oleh agent yang sama.\u003c/p\u003e\n\u003ch2 id=\"8-publication-post-ke-jira-dengan-deduplication\"\u003e8. Publication: post ke Jira dengan deduplication\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-publication-post-ke-jira-dengan-deduplication\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah verification selesai, hasil dipublish ke Jira.\u003c/p\u003e\n\u003cp\u003eAda tiga lapis dedup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elocal receipt log,\u003c/li\u003e\n\u003cli\u003eJira comment history,\u003c/li\u003e\n\u003cli\u003eper-run cache.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOutput yang dipost harus mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erun ID,\u003c/li\u003e\n\u003cli\u003etimestamp,\u003c/li\u003e\n\u003cli\u003etransition ID,\u003c/li\u003e\n\u003cli\u003epermalink ke evidence log.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTujuannya agar manusia bisa menelusuri:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eticket ini berubah karena run mana,\u003c/li\u003e\n\u003cli\u003eapa input-nya,\u003c/li\u003e\n\u003cli\u003eapa diff-nya,\u003c/li\u003e\n\u003cli\u003everifier apa yang jalan,\u003c/li\u003e\n\u003cli\u003ehasilnya apa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"9-reconciliation-sinkronisasi-balik-ke-canonical-backlog\"\u003e9. Reconciliation: sinkronisasi balik ke canonical backlog\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-reconciliation-sinkronisasi-balik-ke-canonical-backlog\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah Jira diperbarui, sistem reconcile ke canonical backlog.\u003c/p\u003e\n\u003cp\u003eWorkflow:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eJira result\n  ↓\nReconciliation\n  ↓\nUpdate canonical backlog\n  ↓\nCommit/versioning dengan run ID + timestamp\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni yang membuat loop-nya closed. Bukan sekadar \u003ccode\u003eagent fix ticket → selesai\u003c/code\u003e, tapi \u003ccode\u003eagent fix ticket → verify → publish → reconcile → state sistem berubah.\u003c/code\u003e\u003c/p\u003e\n\u003ch2 id=\"10-ops-intelligence-dan-recovery\"\u003e10. Ops intelligence dan recovery\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-ops-intelligence-dan-recovery\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLane 5 adalah \u003ccode\u003eOps Intelligence\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eDia memantau:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elane health,\u003c/li\u003e\n\u003cli\u003eJira connectivity,\u003c/li\u003e\n\u003cli\u003estale lock,\u003c/li\u003e\n\u003cli\u003estale \u003ccode\u003eIn Progress\u003c/code\u003e ticket,\u003c/li\u003e\n\u003cli\u003eaging \u003ccode\u003eOn Hold\u003c/code\u003e ticket,\u003c/li\u003e\n\u003cli\u003equeue drain,\u003c/li\u003e\n\u003cli\u003edegraded mode.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau Jira down, sistem masuk degraded mode dan menyimpan intent lokal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejira_write_outbox.json,\u003c/li\u003e\n\u003cli\u003emcp_replay_needed.json,\u003c/li\u003e\n\u003cli\u003ejira_fallback_queue.md.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBegitu Jira hidup lagi, Lane 5 replay queued writes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic idea\u003c/strong\u003e: automation yang bergantung pada Jira tidak boleh langsung corrupt saat Jira bermasalah.\u003c/p\u003e\n\u003ch2 id=\"11-lane-ringkas\"\u003e11. Lane ringkas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-lane-ringkas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRingkasnya ada tujuh lane:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLane 1 = intake + backlog sync\u003c/li\u003e\n\u003cli\u003eLane 2 = codebase auditor read-only\u003c/li\u003e\n\u003cli\u003eLane 3 = grooming, dedup, scoring, fix queue\u003c/li\u003e\n\u003cli\u003eLane 4 = AI fixer apply perubahan\u003c/li\u003e\n\u003cli\u003eLane 5 = ops watchdog dan recovery\u003c/li\u003e\n\u003cli\u003eLane 6 = quality gate dan verifier\u003c/li\u003e\n\u003cli\u003eLane 7 = spec completeness auditor\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"12-insight\"\u003e12. Insight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWorkflow paper ini bukan \"AI baca ticket lalu langsung ngoding\".\u003c/p\u003e\n\u003cp\u003eDia lebih mirip pabrik kecil:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eintake,\u003c/li\u003e\n\u003cli\u003esortir,\u003c/li\u003e\n\u003cli\u003eeksekusi,\u003c/li\u003e\n\u003cli\u003equality control,\u003c/li\u003e\n\u003cli\u003epublikasi,\u003c/li\u003e\n\u003cli\u003eaudit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAI hanya satu operator di pabrik itu, bukan bos bebas.\u003c/p\u003e\n\u003cp\u003eKalau mau meniru, jangan mulai dari \"bikin 7 agent\". Mulai dari loop minimal:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ecanonical backlog,\u003c/li\u003e\n\u003cli\u003eclaim/lock mechanism,\u003c/li\u003e\n\u003cli\u003eexecutor,\u003c/li\u003e\n\u003cli\u003everifier terpisah,\u003c/li\u003e\n\u003cli\u003eevidence log,\u003c/li\u003e\n\u003cli\u003efailure kembali ke backlog.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKalau enam hal itu belum ada, nambah agent cuma bikin automation kelihatan canggih tapi state-nya rapuh.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epaper (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #ff9a8a;\" href=\"/sotoy/notes/tags.workflow\"\u003eworkflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebacklog (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"gra
