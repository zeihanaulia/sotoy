"type":"header","text":"Related","value":"related","line":731,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"before-after-senior-judgement-ke-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-after-senior-judgement-ke-harness\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni catatan gue tentang satu pola yang selalu gue temui: judgement senior sering berhenti di komentar PR, lalu hilang.\u003c/p\u003e\n\u003cp\u003eBukan cuma soal AI agent. Ini soal workflow engineering: review, test, rule, skill file, CI, dan feedback loop.\u003c/p\u003e\n\u003cp\u003eGue ambil satu skenario utama karena ini paling gampang nge-lock: agent sering bikin N+1 query / query database di dalam loop.\u003c/p\u003e\n\u003ch2 id=\"why-this-matters\"\u003eWhy this matters\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-this-matters\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat gue, ini bukan tentang \"sebelum AI vs sesudah AI\".\u003c/p\u003e\n\u003cp\u003eYang keganjilan adalah: banyak judgement senior selama ini cuma numpang lewat di komentar review.\u003c/p\u003e\n\u003cp\u003eKalimat kecil seperti \"ini rawan N+1\", \"authz-nya kurang\", \"jangan campur refactor dengan perubahan behavior\" itu tampaknya sepele. Padahal itu pengalaman panjang.\u003c/p\u003e\n\u003cp\u003eMasalahnya, kalau insight itu cuma berhenti di review, tim bakal mengulang kesalahan yang sama. Senior berubah jadi filter manual. Itu kerja yang nggak scalable.\u003c/p\u003e\n\u003cp\u003eJadi yang gue cari: judgement senior dipindahkan ke guardrail. Bukan supaya senior nggak berpikir. Justru supaya dia mikir di level sistem.\u003c/p\u003e\n\u003cp\u003eBefore: senior jadi filter manual.\nAfter: senior jadi desainer guardrail.\u003c/p\u003e\n\u003cp\u003eItu persis yang gue tulis di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.self-hosted-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003c/a\u003e dan \u003ca href=\"/sotoy/notes/til.ai.semgrep.guardrails\"\u003eSemgrep sebagai guardrail agentic engineering\u003c/a\u003e: jangan biarkan review comment kelar dengan kata-kata saja, jadikan itu rule/verify guardrail yang hidup di \u003ccode\u003e.ai/commands/verify.sh\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"skenario-user-activity-dashboard\"\u003eSkenario: User Activity Dashboard\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#skenario-user-activity-dashboard\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eProduct minta fitur baru:\u003c/p\u003e\n\u003cp\u003e\"Admin bisa melihat daftar user beserta jumlah order, last login, dan status subscription.\"\u003c/p\u003e\n\u003cp\u003eStack:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBackend: Node.js / TypeScript\u003c/li\u003e\n\u003cli\u003eDatabase: PostgreSQL\u003c/li\u003e\n\u003cli\u003eORM/repository layer\u003c/li\u003e\n\u003cli\u003eCI sudah ada, tapi belum punya performance/query-count test\u003c/li\u003e\n\u003cli\u003eTim mulai pakai agent coding CLI/cloud agent\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch1 id=\"before-senior-sebagai-reviewer-manual\"\u003eBEFORE: Senior sebagai reviewer manual\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-senior-sebagai-reviewer-manual\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch3 id=\"1-task-diberikan-ke-agent\"\u003e1. Task diberikan ke agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-task-diberikan-ke-agent\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDeveloper kasih prompt ke agent:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eBuild admin user activity dashboard API.\n\nReturn:\n- user id\n- email\n- total orders\n- last login\n- subscription status\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent baca codebase, lalu membuat endpoint baru.\u003c/p\u003e\n\u003ch3 id=\"2-agent-menghasilkan-kode\"\u003e2. Agent menghasilkan kode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-agent-menghasilkan-kode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKodenya kira-kira seperti ini:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUserActivityDashboard\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e users \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e userRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindAllActiveUsers\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e result \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003efor\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e user \u003cspan class=\"token keyword\"\u003eof\u003c/span\u003e users\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e orders \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e orderRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e lastLogin \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e loginRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindLastByUserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e subscription \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e subscriptionRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserId\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n    result\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epush\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n      id\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e user\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      email\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e user\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eemail\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      totalOrders\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e orders\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003elength\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      lastLoginAt\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e lastLogin\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003ecreatedAt \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token keyword null nil\"\u003enull\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n      subscriptionStatus\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e subscription\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003estatus \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"none\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003ereturn\u003c/span\u003e result\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi data dev cuma ada 10 user. Endpoint kelihatan jalan. Test basic pass.\u003c/p\u003e\n\u003ch3 id=\"3-pull-request-dibuka\"\u003e3. Pull request dibuka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-pull-request-dibuka\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePR summary dari agent:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eAdded admin user activity dashboard endpoint.\nIncludes unit tests for response shape.\nAll tests pass.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDeveloper merasa aman karena test hijau.\u003c/p\u003e\n\u003ch3 id=\"4-senior-review\"\u003e4. Senior review\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-senior-review\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSenior lihat kode dan langsung sadar:\u003c/p\u003e\n\u003cp\u003e\"Ini N+1 parah.\"\u003c/p\u003e\n\u003cp\u003eKalau ada 10.000 user, query-nya bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e1 query ambil users\u003c/li\u003e\n\u003cli\u003e10.000 query ambil orders\u003c/li\u003e\n\u003cli\u003e10.000 query ambil last login\u003c/li\u003e\n\u003cli\u003e10.000 query ambil subscription\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTotal: 30.001 query.\u003c/p\u003e\n\u003cp\u003eSenior komentar:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eThis introduces N+1 queries. Please bulk load orders, logins, and subscriptions instead of querying inside the loop.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent memperbaiki.\u003c/p\u003e\n\u003ch3 id=\"5-agent-memperbaiki-kode\"\u003e5. Agent memperbaiki kode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-agent-memperbaiki-kode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent ubah jadi:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUserActivityDashboard\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e users \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e userRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindAllActiveUsers\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e userIds \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e users\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003emap\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e user\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e orderCounts \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e orderRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003ecountByUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e lastLogins \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e loginRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindLastByUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e subscriptions \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e subscriptionRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euserIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003ereturn\u003c/span\u003e users\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003emap\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    id\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e user\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    email\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e user\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eemail\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    totalOrders\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e orderCounts\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token number\"\u003e0\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    lastLoginAt\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e lastLogins\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003ecreatedAt \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token keyword null nil\"\u003enull\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    subscriptionStatus\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e subscriptions\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003estatus \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"none\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSenior approve.\u003c/p\u003e\n\u003ch3 id=\"6-masalahnya-pengetahuan-tidak-berpindah\"\u003e6. Masalahnya: pengetahuan tidak berpindah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-masalahnya-pengetahuan-tidak-berpindah\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePR ini selesai, tapi pelajaran cuma ada di percakapan review.\u003c/p\u003e\n\u003cp\u003eBesok agent bikin endpoint lain: \"Export customer billing report.\"\nAgent lagi-lagi bikin query di loop.\nSenior komentar lagi: \"Same issue: avoid DB calls inside loops.\"\u003c/p\u003e\n\u003cp\u003eMinggu depan junior bikin serializer baru. Masalah sama muncul lagi.\u003c/p\u003e\n\u003cp\u003eSenior jadi bottleneck.\nAgent tidak benar-benar belajar.\nJunior tidak menyerap pattern secara sistemik.\nReview penuh komentar repetitif.\nTim merasa AI mempercepat coding, tapi memperlambat review.\u003c/p\u003e\n\u003ch3 id=\"before-dalam-satu-kalimat\"\u003eBefore dalam satu kalimat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-dalam-satu-kalimat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eKesalahan ditemukan setelah terjadi, oleh manusia, satu PR demi satu PR.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch1 id=\"after-senior-memindahkan-judgement-ke-harness\"\u003eAFTER: Senior memindahkan judgement ke harness\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#after-senior-memindahkan-judgement-ke-harness\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eSekarang tim memutuskan: komentar \"jangan query DB di loop\" tidak boleh cuma jadi komentar review. Ini harus masuk harness.\u003c/p\u003e\n\u003ch3 id=\"1-senior-mengubah-review-insight-menjadi-rule\"\u003e1. Senior mengubah review insight menjadi rule\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-senior-mengubah-review-insight-menjadi-rule\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi \u003ccode\u003eAGENTS.md\u003c/code\u003e, senior menambahkan rule pendek:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Database performance\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Do not perform database/repository calls inside loops over collections.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Prefer bulk queries, joins, batching, eager loading, or precomputed lookup maps.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e If a looped query is unavoidable, explain why in the PR and add a regression test.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRule ini dibaca agent di awal sesi.\u003c/p\u003e\n\u003ch3 id=\"2-senior-membuat-skill-file\"\u003e2. Senior membuat skill file\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-senior-membuat-skill-file\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKarena rule pendek belum cukup, senior bikin:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e.ai/skills/database-performance.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIsinya:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Database Performance Skill\u003c/span\u003e\n\nUse this skill when changing:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e repositories\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e ORM queries\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e list endpoints\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e serializers\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e dashboard/reporting APIs\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e GraphQL resolvers\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e code that processes collections of entities\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Main risk\u003c/span\u003e\n\nAvoid N+1 queries. A code path handling N items should not execute O(N) database queries.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Bad pattern\u003c/span\u003e\n\nDo not call repository/database methods inside:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e for loops\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e while loops\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e map/forEach callbacks\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e serializers\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e template rendering loops\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Better patterns\u003c/span\u003e\n\nPrefer:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e WHERE IN bulk fetch\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e joins\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e eager loading\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e batching\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e DataLoader pattern\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e aggregation queries\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e lookup maps in memory\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Before completion\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e1.\u003c/span\u003e Search changed files for DB calls inside loops.\n\u003cspan class=\"token list punctuation\"\u003e2.\u003c/span\u003e Estimate query count for the main path.\n\u003cspan class=\"token list punctuation\"\u003e3.\u003c/span\u003e Add or update a query-count/performance test when possible.\n\u003cspan class=\"token list punctuation\"\u003e4.\u003c/span\u003e Report the verification result.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni bukan cuma \"larangan\". Ini mengajarkan pattern berpikir.\u003c/p\u003e\n\u003ch3 id=\"3-senior-menambahkan-static-sensor\"\u003e3. Senior menambahkan static sensor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-senior-menambahkan-static-sensor\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTim bikin Semgrep rule sederhana:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003erules\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e db\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ecall\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003einside\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eloop\n    \u003cspan class=\"token key atrule\"\u003emessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Avoid database/repository calls inside loops. Use bulk fetch, batching, join, or eager loading.\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eseverity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e WARNING\n    \u003cspan class=\"token key atrule\"\u003elanguages\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e typescript\n    \u003cspan class=\"token key atrule\"\u003epatterns\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern-inside\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e|\u003c/span\u003e\u003cspan class=\"token scalar string\"\u003e\n          for (...) {\n            ...\n          }\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern-either\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n          \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e await $REPO.$METHOD(\u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e)\n          \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e await $DB.$METHOD(\u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRule ini tidak sempurna, tapi cukup jadi alarm.\u003c/p\u003e\n\u003ch3 id=\"4-senior-menambahkan-test-query-count\"\u003e4. Senior menambahkan test query count\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-senior-menambahkan-test-query-count\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk endpoint dashboard, tim membuat test:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token function\"\u003eit\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"does not use N+1 queries for user activity dashboard\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003eseedUsersWithActivity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token number\"\u003e100\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e queryCounter \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003estartQueryCounter\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003egetUserActivityDashboard\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token function\"\u003eexpect\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003equeryCounter\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003ecount\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003etoBeLessThanOrEqual\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token number\"\u003e5\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSekarang behavior penting dilindungi.\u003c/p\u003e\n\u003ch3 id=\"5-senior-menambahkan-verification-command\"\u003e5. Senior menambahkan verification command\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-senior-menambahkan-verification-command\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDi repo:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e./.ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIsinya:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token builtin class-name\"\u003eset\u003c/span\u003e -euo pipefail\n\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e lint\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e typecheck\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e\nsemgrep --config .semgrep/database.yml src/\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi \u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003eBefore declaring work complete, run:\n\n./.ai/commands/verify.sh\n\nIf it fails, fix the root cause or explain why the failure is unrelated.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"6-task-baru-diberikan-ke-agent\"\u003e6. Task baru diberikan ke agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-task-baru-diberikan-ke-agent\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSekarang product minta fitur baru: \"Export customer billing report.\"\u003c/p\u003e\n\u003cp\u003eDeveloper kasih prompt:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eBuild customer billing report export.\n\nUse existing reporting patterns.\nMake sure it works for large customer lists.\nRun verification before finishing.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent membaca \u003ccode\u003eAGENTS.md\u003c/code\u003e. Karena task menyentuh report/list/database, agent juga menarik skill \u003ccode\u003edatabase-performance.md\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"7-agent-membuat-plan-lebih-baik\"\u003e7. Agent membuat plan lebih baik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-agent-membuat-plan-lebih-baik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSebelum coding, agent menulis plan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003ePlan:\n1. Find existing reporting API patterns.\n2. Identify billing/customer repositories.\n3. Avoid per-customer DB calls.\n4. Bulk fetch invoices, payments, and subscriptions by customer IDs.\n5. Build lookup maps in memory.\n6. Add test for report output.\n7. Add query-count test for 100 customers.\n8. Run ./.ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePerhatikan bedanya: judgement senior sudah muncul di plan agent, sebelum kesalahan terjadi.\u003c/p\u003e\n\u003ch3 id=\"8-agent-menghasilkan-kode-yang-lebih-aman\"\u003e8. Agent menghasilkan kode yang lebih aman\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-agent-menghasilkan-kode-yang-lebih-aman\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent langsung menulis bulk pattern:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efunction\u003c/span\u003e \u003cspan class=\"token function\"\u003eexportCustomerBillingReport\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomerIds\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estring\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e customers \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e customerRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomerIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e invoices \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e invoiceRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByCustomerIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomerIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e payments \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e paymentRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByCustomerIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomerIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e subscriptions \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e subscriptionRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindByUserIds\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomerIds\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e invoicesByCustomerId \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003egroupBy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003einvoices\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"customerId\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e paymentsByCustomerId \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003egroupBy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003epayments\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"customerId\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e subscriptionByCustomerId \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token function\"\u003eindexBy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003esubscriptions\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"customerId\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003ereturn\u003c/span\u003e customers\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003emap\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomer\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n    customerId\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e customer\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    email\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e customer\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eemail\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    invoiceCount\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e invoicesByCustomerId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomer\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003elength \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token number\"\u003e0\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    totalPaid\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token function\"\u003esumPayments\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003epaymentsByCustomerId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomer\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n    subscriptionStatus\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e\n      subscriptionByCustomerId\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eget\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ecustomer\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token operator\"\u003e?.\u003c/span\u003estatus \u003cspan class=\"token operator\"\u003e??\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"none\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"9-agent-menjalankan-verification\"\u003e9. Agent menjalankan verification\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-agent-menjalankan-verification\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent menjalankan:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e./.ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eHasil:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003elint: pass\ntypecheck: pass\ntest: pass\nsemgrep database rules: pass\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent menulis PR summary:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eImplemented customer billing report export.\n\nDatabase performance:\n- Avoided per-customer queries.\n- Bulk loaded invoices, payments, and subscriptions.\n- Built lookup maps in memory.\n- Added query-count regression test for 100 customers.\n- Verification passed: lint, typecheck, test, Semgrep database rules.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"10-senior-review-jadi-lebih-ringan\"\u003e10. Senior review jadi lebih ringan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-senior-review-jadi-lebih-ringan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSenior tidak lagi perlu komentar \"jangan query di loop\".\nDia hanya cek hal yang lebih tinggi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eApakah aggregation logic benar?\u003c/li\u003e\n\u003cli\u003eApakah report sesuai kebutuhan finance?\u003c/li\u003e\n\u003cli\u003eApakah memory usage aman untuk jumlah customer besar?\u003c/li\u003e\n\u003cli\u003eApakah export perlu streaming?\u003c/li\u003e\n\u003cli\u003eApakah akses admin sudah benar?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi senior naik level: dari menangkap bug repetitif ke judgement arsitektural/domain.\u003c/p\u003e\n\u003ch3 id=\"after-dalam-satu-kalimat\"\u003eAfter dalam satu kalimat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#after-dalam-satu-kalimat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eKesalahan dicegah sebelum terjadi, oleh harness, lalu manusia fokus ke judgement yang lebih tinggi.\u003c/strong\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"before-vs-after-secara-tajam\"\u003eBefore vs After secara tajam\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-vs-after-secara-tajam\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBefore:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAgent menghasilkan kode.\u003c/li\u003e\n\u003cli\u003eKesalahan masuk PR.\u003c/li\u003e\n\u003cli\u003eSenior menemukan kesalahan.\u003c/li\u003e\n\u003cli\u003eSenior memberi komentar.\u003c/li\u003e\n\u003cli\u003eAgent memperbaiki.\u003c/li\u003e\n\u003cli\u003ePelajaran hilang di thread review.\u003c/li\u003e\n\u003cli\u003eKesalahan muncul lagi di PR berikutnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAfter:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSenior menemukan pola kesalahan.\u003c/li\u003e\n\u003cli\u003ePola diubah jadi:\n\u003cul\u003e\n\u003cli\u003erule pendek\u003c/li\u003e\n\u003cli\u003eskill file detail\u003c/li\u003e\n\u003cli\u003econtoh good/bad\u003c/li\u003e\n\u003cli\u003etest/linter/sensor\u003c/li\u003e\n\u003cli\u003eCI gate jika critical\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eAgent membaca sebelum kerja.\u003c/li\u003e\n\u003cli\u003eSensor menangkap saat salah.\u003c/li\u003e\n\u003cli\u003eReview manusia fokus ke judgement lebih tinggi.\u003c/li\u003e\n\u003cli\u003ePelajaran menetap di harness.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e★ Insight:\nBefore adalah sistem berbasis \"hero reviewer\".\nAfter adalah sistem berbasis \"institutionalized judgement\".\u003c/p\u003e\n\u003cp\u003eDi before, kualitas bergantung pada apakah senior sempat melihat PR.\nDi after, kualitas mulai melekat pada sistem kerja.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"skenario-kedua-security-bug-authorization\"\u003eSkenario kedua: security bug authorization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#skenario-kedua-security-bug-authorization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBiar kelihatan bukan cuma database performance.\u003c/p\u003e\n\u003ch3 id=\"before\"\u003eBEFORE\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eProduct minta:\u003c/p\u003e\n\u003cp\u003e\"Tambahkan endpoint update project setting.\"\u003c/p\u003e\n\u003cp\u003eAgent menulis:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003erouter\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epatch\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/projects/:id/settings\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e requireAuth\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ereq\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e res\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e project \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e projectRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003efindById\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003ereq\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eparams\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e projectRepository\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eupdateSettings\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eproject\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e req\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003ebody\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  res\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003ejson\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e success\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTest pass karena user login bisa update project.\u003c/p\u003e\n\u003cp\u003eSenior review:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eThis checks authentication but not authorization. A logged-in user could update another team's project.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent memperbaiki:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003erouter\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epatch\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/projects/:id/settings\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e requireAuth\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/s ccess\"\u003eupdateSettings\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eproject\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e req\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003ebody\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  res\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003ejson\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e success\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSelesai. Tapi pelajaran tetap cuma di PR.\u003c/p\u003e\n\u003ch3 id=\"after\"\u003eAFTER\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#after\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSenior menambahkan ke \u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Authorization\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Authentication is not authorization.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Every write endpoint must verify the caller is allowed to modify the target resource.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e For resource-scoped actions, check ownership, role, or explicit permission.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Add negative tests for unauthorized users.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill file:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e.ai/skills/authorization-review.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIsi ringkas:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Authorization Review Skill\u003c/span\u003e\n\nUse this skill when adding or changing:\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e API endpoints\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e mutations\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e write operations\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e admin actions\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e resource ownership logic\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Required checks\u003c/span\u003e\n\nFor every write operation:\n\u003cspan class=\"token list punctuation\"\u003e1.\u003c/span\u003e Identify the actor.\n\u003cspan class=\"token list punctuation\"\u003e2.\u003c/span\u003e Identify the target resource.\n\u003cspan class=\"token list punctuation\"\u003e3.\u003c/span\u003e Identify the permission required.\n\u003cspan class=\"token list punctuation\"\u003e4.\u003c/span\u003e Add a negative test where an authenticated but unauthorized user is denied.\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Common mistake\u003c/span\u003e\n\nrequireAuth only proves the user is logged in.\nIt does not prove the user can modify the resource.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTest template:\u003c/p\u003e\n\u003cpre class=\"language-ts\"\u003e\u003ccode class=\"language-ts\"\u003e\u003cspan class=\"token function\"\u003eit\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"rejects authenticated users without project admin permission\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token keyword\"\u003easync\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token arrow operator\"\u003e=\u003e\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e project \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003eseedProjectOwnedBy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"team-a\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e user \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003eseedUserInTeam\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"team-b\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token keyword\"\u003econst\u003c/span\u003e response \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token keyword control-flow\"\u003eawait\u003c/span\u003e \u003cspan class=\"token function\"\u003erequest\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eapp\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003epatch\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token template-string\"\u003e\u003cspan class=\"token template-punctuation string\"\u003e`\u003c/span\u003e\u003cspan class=\"token string\"\u003e/projects/\u003c/span\u003e\u003cspan class=\"token interpolation\"\u003e\u003cspan class=\"token interpolation-punctuation punctuation\"\u003e${\u003c/span\u003eproject\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003eid\u003c/span\u003e\u003cspan class=\"token interpolation-punctuation punctuation\"\u003e}\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token string\"\u003e/settings\u003c/span\u003e\u003cspan class=\"token template-punctuation string\"\u003e`\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003eset\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"Authorization\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token function\"\u003eauthTokenFor\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003euser\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n    \u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003esend\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e name\u003cspan class=\"token operator\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Hacked\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n  \u003cspan class=\"token function\"\u003eexpect\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eresponse\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token property-access\"\u003estatus\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token method function property-access\"\u003etoBe\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token number\"\u003e403\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCI gate:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e -- authorization\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNext time agent bikin endpoint write, plan-nya berubah:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eThis is a write endpoint.\nI need:\n- requireAuth\n- project-level authorization\n- negative test for unauthorized authenticated user\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSenior tidak perlu mengulang komentar \"authn bukan authz\".\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"skenario-ketiga-migration-berbahaya\"\u003eSkenario ketiga: migration berbahaya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#skenario-ketiga-migration-berbahaya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"before-1\"\u003eBEFORE\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgent diminta:\u003c/p\u003e\n\u003cp\u003e\"Rename column \u003ccode\u003estatus\u003c/code\u003e to \u003ccode\u003esubscription_status\u003c/code\u003e.\"\u003c/p\u003e\n\u003cp\u003eAgent membuat migration:\u003c/p\u003e\n\u003cpre class=\"language-sql\"\u003e\u003ccode class=\"language-sql\"\u003e\u003cspan class=\"token keyword\"\u003eALTER\u003c/span\u003e \u003cspan class=\"token keyword\"\u003eTABLE\u003c/span\u003e subscriptions \u003cspan class=\"token keyword\"\u003eRENAME\u003c/span\u003e \u003cspan class=\"token keyword\"\u003eCOLUMN\u003c/span\u003e \u003cspan class=\"token keyword\"\u003estatus\u003c/span\u003e \u003cspan class=\"token keyword\"\u003eTO\u003c/span\u003e subscription_status\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi dev aman.\u003c/p\u003e\n\u003cp\u003eSenior review:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eThis is not safe. Existing app version still reads status. Use expand-contract migration.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent memperbaiki. Tapi lagi-lagi, lesson hilang.\u003c/p\u003e\n\u003ch3 id=\"after-1\"\u003eAFTER\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#after-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRule di \u003ccode\u003eAGENTS.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Database migration safety\u003c/span\u003e\n\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Do not perform breaking schema changes in one step.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Use expand-contract for production tables.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Backward-compatible migration first, code rollout second, cleanup later.\n\u003cspan class=\"token list punctuation\"\u003e-\u003c/span\u003e Destructive changes require human approval.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSkill file:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003e# Safe Migration Skill\n\nUse this skill for schema changes.\n\n## Expand-contract pattern\n\n1. Add new nullable column.\n2. Write to both old and new columns.\n3. Backfill in batches.\n4. Switch reads to the new column after verification.\n5. Remove old column in a later deploy.\n\n## Never do without approval\n\n- Drop column\n- Rename column directly\n- Change type on large table\n- Add non-concurrent index on large table\n- Add non-null column without default/backfill plan\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAgent berikutnya akan membuat plan:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eThis rename should use expand-contract:\n1. Add subscription_status.\n2. Dual-write status and subscription_status.\n3. Backfill existing rows.\n4. Switch reads.\n5. Later cleanup migration.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSenior review pindah dari \"jangan rename langsung\" ke \"apakah rollout plan ini cocok dengan release cadence kita?\"\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"pola-before-after-yang-bisa-dipakai-sebagai-template\"\u003ePola before-after yang bisa dipakai sebagai template\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pola-before-after-yang-bisa-dipakai-sebagai-template\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetiap kali ada review comment berulang, pakai format ini:\u003c/p\u003e\n\u003ch3 id=\"before-2\"\u003eBefore\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#before-2\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eAgent/junior membuat kesalahan.\nSenior melihat.\nSenior komentar.\nKesalahan diperbaiki.\nPelajaran hilang.\nKesalahan muncul lagi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"after-2\"\u003eAfter\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#after-2\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eSenior melihat pola.\nPola diubah jadi:\n- rule pendek\n- skill file detail\n- contoh good/bad\n- test/linter/sensor\n- CI gate jika critical\nAgent membaca sebelum kerja.\nSensor menangkap saat salah.\nReview manusia fokus ke judgement lebih tinggi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"pertanyaan-konversinya\"\u003ePertanyaan konversinya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-konversinya\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk setiap komentar review, tanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eApakah ini sering muncul?\u003c/li\u003e\n\u003cli\u003eKalau iya, bisa jadi rule tidak?\u003c/li\u003e\n\u003cli\u003eButuh contoh panjang? Kalau iya, jadikan skill.\u003c/li\u003e\n\u003cli\u003eBisa dicek otomatis? Kalau iya, buat linter/static analysis.\u003c/li\u003e\n\u003cli\u003eBisa dibuktikan behavior-nya? Kalau iya, buat test.\u003c/li\u003e\n\u003cli\u003eRisikonya tinggi? Kalau iya, jadikan CI gate atau human approval rule.\u003c/li\u003e\n\u003cli\u003eButuh konteks keputusan? Kalau iya, buat ADR/concept note.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesimpulan\"\u003eKesimpulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau gue ringkas jadi lebih tegas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBefore: senior adalah \u003cstrong\u003emanual quality gate\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003eAfter: senior adalah \u003cstrong\u003eharness designer\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBefore, AI membuat output lebih banyak dan review burden makin berat.\nAfter, AI tetap bikin output banyak, tapi sistem juga mulai menjaga output itu.\u003c/p\u003e\n\u003cp\u003eYang gue suka dari model after adalah: kesalahan yang sama jadi lebih sulit muncul lagi, bukan hanya dikomentari ulang.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBefore: “Agent salah, senior koreksi.”\u003c/strong\u003e\n\u003cstrong\u003eAfter: “Agent salah sekali, senior ubah sistem agar kesalahan itu makin sulit terulang.”\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.self-hosted-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.ai.semgrep.guardrails\"\u003eSemgrep sebagai guardrail agentic engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.sast.semgrep\"\u003eSemgrep sebagai SAST / static analysis tool\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.reference.martin-fowler-harness-engineering\"\u003eMartin Fowler - Harness Engineering for Coding Agent Users\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eharness (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #ff9a8a;\" href=\"/sotoy/notes/tags.workflow\"\u003eworkflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enplusone (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1778003596758\"\u003eReview comments should be encoded as guardrails, not left in PR threads\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.heavyskill-heavy-thinking-as-inner-skill\"\u003eHeavySkill: Heavy Thinking as Inner Skill in Agentic Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.single-verification-entrypoint\"\u003eSingle verification entrypoint\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.how-i-use-ai-to-code\"\u003eHow I Use AI to Code — literature note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/daily.journal.2026.05.05\"\u003e2026-05-05\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomSpeed":1,"createStub":false},"enableAutoCreateOnDefinition":false,"enableXVaultWikiLink":false,"enableRemoteVaultInit":true,"enableUser
