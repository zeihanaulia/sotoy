","line":192,"column":0,"depth":2},"13-insight-penutup":{"type":"header","text":"13. Insight penutup","value":"13-insight-penutup","line":206,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":212,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"openviking-context-layers\"\u003eOpenViking context layers\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-context-layers\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eGue pakai arti ini: \u003cstrong\u003eContext Layers L0/L1/L2 di OpenViking adalah tiga tingkat representasi konteks untuk satu resource/memory/skill\u003c/strong\u003e. Ini bukan layer neural network, bukan level permission. Ini strategi loading supaya agent tidak langsung menelan semua isi dokumen ke prompt.\u003c/p\u003e\n\u003ch2 id=\"1-pertanyaan-kunci-yang-gue-pegang\"\u003e1. Pertanyaan kunci yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKenapa OpenViking butuh L0/L1/L2?\u003c/li\u003e\n\u003cli\u003eApa fungsi L0?\u003c/li\u003e\n\u003cli\u003eApa fungsi L1?\u003c/li\u003e\n\u003cli\u003eApa fungsi L2?\u003c/li\u003e\n\u003cli\u003eBagaimana L0/L1 dibuat?\u003c/li\u003e\n\u003cli\u003eBagaimana layer ini muncul dalam struktur folder?\u003c/li\u003e\n\u003cli\u003eKapan agent harus pakai L0, L1, atau L2?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"2-kenapa-harus-ada-l0l1l2\"\u003e2. Kenapa harus ada L0/L1/L2?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-harus-ada-l0l1l2\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMasalah utama agent adalah context budget. Kalaupun data banyak dan relevan, prompt tidak bisa menampung semua. Kalau lo langsung masukin:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edokumen panjang,\u003c/li\u003e\n\u003cli\u003echat history,\u003c/li\u003e\n\u003cli\u003ememory user,\u003c/li\u003e\n\u003cli\u003ecodebase,\u003c/li\u003e\n\u003cli\u003eskill docs,\u003c/li\u003e\n\u003cli\u003etool output,\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003emaka prompt jadi bengkak, mahal, noisy, dan rawan salah fokus.\u003c/p\u003e\n\u003cp\u003eOpenViking bilang: konteks harus dimuat bertahap.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eOpenViking uses a three-layer information model to balance retrieval efficiency and content completeness.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eL0\u003c/code\u003e untuk mencari cepat,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL1\u003c/code\u003e untuk memahami scope,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL2\u003c/code\u003e untuk baca detail.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-l0-abstract\"\u003e3. L0: Abstract\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-l0-abstract\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eL0 adalah representasi paling pendek.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNama: Abstract\u003c/li\u003e\n\u003cli\u003eFile: \u003ccode\u003e.abstract.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eToken: sekitar 100 token\u003c/li\u003e\n\u003cli\u003eTujuan: vector search, quick filtering\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eL0 dipakai untuk menjawab: “Apakah item ini relevan atau tidak?”\u003c/p\u003e\n\u003cp\u003eContoh L0:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAPI authentication guide covering OAuth 2.0, JWT tokens, and API keys for secure access.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eL0 bukan bukti detail. Dia lebih seperti label semantik.\u003c/p\u003e\n\u003cp\u003eAnalogi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eL0\u003c/code\u003e = judul + abstrak super pendek di kartu katalog perpustakaan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-l1-overview\"\u003e4. L1: Overview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-l1-overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eL1 adalah ringkasan menengah yang benar-benar membantu navigasi.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNama: Overview\u003c/li\u003e\n\u003cli\u003eFile: \u003ccode\u003e.overview.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eToken: sekitar 1–2 ribu token\u003c/li\u003e\n\u003cli\u003eTujuan: rerank, content navigation\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eL1 menjawab: “Isi area ini apa saja? Bagian mana relevan? File mana yang harus dibuka?”\u003c/p\u003e\n\u003cp\u003eContoh L1:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThis guide covers three authentication methods for the API:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eOAuth 2.0\u003c/strong\u003e (L2: oauth.md): Complete OAuth flow with code examples\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJWT Tokens\u003c/strong\u003e (L2: jwt.md): Token generation and validation\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAPI Keys\u003c/strong\u003e (L2: api-keys.md): Simple key-based authentication\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eL1 bukan sekadar ringkasan. L1 adalah peta navigasi.\u003c/p\u003e\n\u003cp\u003eIni yang membuat L1 biasanya cukup untuk membangun context LLM.\u003c/p\u003e\n\u003ch2 id=\"5-l2-detail\"\u003e5. L2: Detail\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-l2-detail\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eL2 adalah konten lengkap.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNama: Detail\u003c/li\u003e\n\u003cli\u003eFile: original files/subdirs\u003c/li\u003e\n\u003cli\u003eToken: unlimited/full content\u003c/li\u003e\n\u003cli\u003eTujuan: full content, on-demand loading\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eL2 menjawab: “Apa isi lengkapnya? Mana bukti/detail teknis?”\u003c/p\u003e\n\u003cp\u003eContoh L2:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eread(\"viking://resources/docs/auth/oauth.md\")\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eread(\"viking://resources/docs/auth/jwt.md\")\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTapi L2 tidak boleh dibuka otomatis. L2 hanya dibuka jika L0/L1 sudah menunjukkan bahwa detailnya memang perlu.\u003c/p\u003e\n\u003ch2 id=\"6-mekanisme-pembuatan-l0l1\"\u003e6. Mekanisme pembuatan L0/L1\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-mekanisme-pembuatan-l0l1\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eL0/L1 dibuat saat resource baru ditambahkan dan saat session history dikompresi.\u003c/p\u003e\n\u003cp\u003eFlow resource ingestion:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInput dokumen\u003c/li\u003e\n\u003cli\u003eParser membuat struktur file/directory\u003c/li\u003e\n\u003cli\u003eSemanticQueue generate L0/L1 async\u003c/li\u003e\n\u003cli\u003eVector Index dibangun dari URI + metadata\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFlow session archive:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eChat/session history lama\u003c/li\u003e\n\u003cli\u003eSessionCompressor\u003c/li\u003e\n\u003cli\u003eGenerate L0/L1 untuk history segment\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi L0/L1 bukan cuma untuk dokumen statis. History percakapan lama pun bisa dibangun menjadi layer yang bisa dicari.\u003c/p\u003e\n\u003ch2 id=\"7-bottom-up-generation\"\u003e7. Bottom-up generation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-bottom-up-generation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking membuat layer dari bawah ke atas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eleaf nodes → parent directories → root\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuat L0/L1 untuk \u003ccode\u003eoauth.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ebuat L0/L1 untuk \u003ccode\u003ejwt.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ebuat L0/L1 untuk \u003ccode\u003eapi-keys.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003egabungkan ringkasan child menjadi overview folder \u003ccode\u003eauth/\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eParent directory overview dibangun dari abstrak child-nya. Jadi folder tahu isi anak-anaknya.\u003c/p\u003e\n\u003ch2 id=\"8-struktur-folder-dan-file\"\u003e8. Struktur folder dan file\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-struktur-folder-dan-file\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetiap directory bisa punya struktur seperti:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eviking://resources/docs/auth/\n├── .abstract.md\n├── .overview.md\n├── .relations.json\n├── oauth.md\n├── jwt.md\n└── api-keys.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eL0 dan L1 adalah file nyata di folder. L2 adalah file asli atau subdirectory.\u003c/p\u003e\n\u003ch2 id=\"9-on-demand-loading\"\u003e9. On-demand loading\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-on-demand-loading\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOn-demand loading berarti L2 tidak dibaca otomatis. Agent harus sudah yakin relevan sebelum membuka detail penuh.\u003c/p\u003e\n\u003cp\u003ePattern ideal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLihat L0 dulu\u003c/li\u003e\n\u003cli\u003eBuka L1 untuk navigasi\u003c/li\u003e\n\u003cli\u003eKalau perlu, baca L2\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau langsung ke L2, konteks akan boros dan noisy.\u003c/p\u003e\n\u003ch2 id=\"10-kapan-pakai-l0-l1-l2\"\u003e10. Kapan pakai L0, L1, L2?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-kapan-pakai-l0-l1-l2\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eL0\u003c/code\u003e: quick relevance check.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL1\u003c/code\u003e: pahami content scope dan cari bagian penting.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL2\u003c/code\u003e: baca detail asli untuk bukti/gambar/konfigurasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk banyak jawaban, L1 biasanya sudah cukup. L2 dipakai kalau user minta kutipan, nilai teknis, atau detail lengkap.\u003c/p\u003e\n\u003ch2 id=\"11-kaitan-dengan-retrieval\"\u003e11. Kaitan dengan retrieval\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-kaitan-dengan-retrieval\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow retrieval ideal OpenViking:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuery → L0 candidate search\u003c/li\u003e\n\u003cli\u003eL1 navigation/rerank\u003c/li\u003e\n\u003cli\u003eSelect URI\u003c/li\u003e\n\u003cli\u003eL2 read if needed\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni berbeda dari RAG flat yang langsung pakai top-k chunks.\u003c/p\u003e\n\u003ch2 id=\"12-contoh-sederhana\"\u003e12. Contoh sederhana\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-contoh-sederhana\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eQuery: “Untuk user-facing app, auth method yang direkomendasikan apa?”\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eL0 auth: temukan folder auth\u003c/li\u003e\n\u003cli\u003eL1 auth: lihat rekomendasi OAuth 2.0\u003c/li\u003e\n\u003cli\u003eBisa jawab tanpa L2\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eQuery: “Flow OAuth step-by-step gimana?”\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eL0 auth: temukan folder auth\u003c/li\u003e\n\u003cli\u003eL1 auth: lihat bahwa oauth.md ada\u003c/li\u003e\n\u003cli\u003ebuka L2 oauth.md untuk detail\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"13-insight-penutup\"\u003e13. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContext Layers di OpenViking itu cara agent membaca: L0 = \"apa ini?\", L1 = \"bagian mana yang harus dibaca?\", L2 = \"baca lengkapnya\".\u003c/p\u003e\n\u003cp\u003eKalau agent ingin pintar, dia tidak langsung mengunyah semua konten. Dia triage dulu.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-extraction\"\u003eOpenViking context extraction\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault/daily.journal.2026.06.03 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"privat
