a":{}},"body":"\u003ch1 id=\"self-hosted-cloud-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#self-hosted-cloud-agent-runner\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang bakalan dibuat bukan OpenClaw lengkap. Yang realistis adalah agent worker di VM sendiri yang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emenerima task dari GitHub issue/PR/manual command,\u003c/li\u003e\n\u003cli\u003echeckout repo ke workspace terisolasi,\u003c/li\u003e\n\u003cli\u003ejalankan coding agent CLI,\u003c/li\u003e\n\u003cli\u003ejalankan verification command,\u003c/li\u003e\n\u003cli\u003ebuat branch + PR atau report,\u003c/li\u003e\n\u003cli\u003epunya akses minimal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"perbedaan-penting\"\u003ePerbedaan penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#perbedaan-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSelf-hosted agent runner\u003c/strong\u003e: agent coding berjalan di VM/container sendiri, task dijemput dari source, workspace terisolasi, verifikasi lokal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCodex cloud resmi\u003c/strong\u003e: agent berjalan di environment OpenAI, job bisa background/paralel, repo tetap di cloud environment mereka.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInti: kamu ingin versi sederhana sendiri di VM, bukan langsung platform agent total.\u003c/p\u003e\n\u003ch2 id=\"target-praktis-besok\"\u003eTarget praktis besok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#target-praktis-besok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBukan cloud agent sempurna.\nTargetnya:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eGitHub Issue / manual task\n        ↓\nVM agent runner\n        ↓\nclone repo ke workspace sementara\n        ↓\nagent CLI mengerjakan task\n        ↓\nverify.sh jalan\n        ↓\nbranch + PR / report\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDan mulainya harus manual trigger dulu.\u003c/p\u003e\n\u003ch2 id=\"minimal-architecture\"\u003eMinimal architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#minimal-architecture\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomponen paling kecil:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eVM\n├── Docker\n├── GitHub CLI\n├── Node.js / pnpm / stack repo lo\n├── Codex CLI atau Claude Code CLI\n├── agent-runner.sh\n├── workspaces/\n│   └── task-\u0026#x3C;id\u003e/\n└── repo dengan:\n    ├── AGENTS.md\n    └── .ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAtomic idea: cloud agent bukan cuma model; dia butuh workspace, permission, verification, dan output channel.\u003c/p\u003e\n\u003ch2 id=\"langkah-hands-on\"\u003eLangkah hands-on\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#langkah-hands-on\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-siapkan-vm\"\u003e1. Siapkan VM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-siapkan-vm\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eRekomendasi minimal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e2–4 vCPU\u003c/li\u003e\n\u003cli\u003e8–16 GB RAM\u003c/li\u003e\n\u003cli\u003e40–80 GB disk\u003c/li\u003e\n\u003cli\u003eDocker\u003c/li\u003e\n\u003cli\u003eNode.js LTS\u003c/li\u003e\n\u003cli\u003eGit\u003c/li\u003e\n\u003cli\u003eGitHub CLI\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInstall dasar:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003esudo\u003c/span\u003e \u003cspan class=\"token function\"\u003eapt\u003c/span\u003e update\n\u003cspan class=\"token function\"\u003esudo\u003c/span\u003e \u003cspan class=\"token function\"\u003eapt\u003c/span\u003e \u003cspan class=\"token function\"\u003einstall\u003c/span\u003e -y \u003cspan class=\"token function\"\u003egit\u003c/span\u003e \u003cspan class=\"token function\"\u003ecurl\u003c/span\u003e jq ca-certificates build-essential\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"2-buat-user-agent-khusus\"\u003e2. Buat user agent khusus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-buat-user-agent-khusus\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJangan jalankan agent sebagai root.\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003esudo\u003c/span\u003e adduser agent\n\u003cspan class=\"token function\"\u003esudo\u003c/span\u003e \u003cspan class=\"token function\"\u003eusermod\u003c/span\u003e -aG \u003cspan class=\"token function\"\u003edocker\u003c/span\u003e agent\n\u003cspan class=\"token function\"\u003esu\u003c/span\u003e - agent\n\u003cspan class=\"token function\"\u003emkdir\u003c/span\u003e -p ~/agent-runner/workspaces\n\u003cspan class=\"token function\"\u003emkdir\u003c/span\u003e -p ~/agent-runner/logs\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePenting: blast radius kecil.\u003c/p\u003e\n\u003ch3 id=\"3-install-agent-cli\"\u003e3. Install agent CLI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-install-agent-cli\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePilih satu dulu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enpm i -g @openai/codex\u003c/code\u003e untuk Codex CLI lokal,\u003c/li\u003e\n\u003cli\u003eatau Claude Code CLI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan campur dulu. Fokus ke satu worker.\u003c/p\u003e\n\u003ch3 id=\"4-siapkan-repo-dengan-agentsmd\"\u003e4. Siapkan repo dengan \u003ccode\u003eAGENTS.md\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-siapkan-repo-dengan-agentsmd\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh sederhana di root repo:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Agent Instructions\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Project commands\u003c/span\u003e\n\nInstall dependencies:\n```bash\npnpm install --frozen-lockfile\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRun verification:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e./.ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"rules\"\u003eRules\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rules\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep changes small.\u003c/li\u003e\n\u003cli\u003eDo not modify public APIs unless the task explicitly asks for it.\u003c/li\u003e\n\u003cli\u003eDo not add new runtime dependencies without justification.\u003c/li\u003e\n\u003cli\u003eDo not perform database or repository calls inside loops over collections.\u003c/li\u003e\n\u003cli\u003eAdd or update tests for behavior changes.\u003c/li\u003e\n\u003cli\u003eBefore declaring the task complete, run \u003ccode\u003e./.ai/commands/verify.sh\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eReport commands run, test results, changed files, and remaining risks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cpre\u003e\u003ccode\u003e\n### 5. Buat `verify.sh`\n\nIni bukan nama tool standar yang wajib ada. Ini konvensi internal: satu executable entrypoint untuk semua verifikasi minimal.\n\nDengan `./.ai/commands/verify.sh`, agent nggak perlu menebak apakah repo harus menjalankan `npm test`, `pnpm test`, `pytest`, `cargo test`, `semgrep`, atau scanner lain. Dia tinggal menjalankan satu command yang tim setujui sebagai definition of done.\n\nBuat file standar di repo:\n\n```bash\nmkdir -p .ai/commands\ncat \u003e .ai/commands/verify.sh \u0026#x3C;\u0026#x3C;'EOF'\n#!/usr/bin/env bash\nset -euo pipefail\n\npnpm lint\npnpm typecheck\npnpm test\nEOF\nchmod +x .ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau project belum ready lint/typecheck/test, sesuaikan command dengan kondisi nyata.\u003c/p\u003e\n\u003cp\u003eIni juga bukan keharusan bahwa pathnya harus \u003ccode\u003e./.ai/commands/verify.sh\u003c/code\u003e. Yang penting adalah satu stable verification entrypoint, misalnya \u003ccode\u003e./scripts/verify.sh\u003c/code\u003e, \u003ccode\u003emake verify\u003c/code\u003e, atau \u003ccode\u003enpm run verify\u003c/code\u003e.\u003c/p\u003e\n\u003ch3 id=\"6-buat-runner-manual\"\u003e6. Buat runner manual\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-buat-runner-manual\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eContoh script di VM:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003ecat\u003c/span\u003e \u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e ~/agent-runner/run-task.sh \u003cspan class=\"token operator\"\u003e\u0026#x3C;\u0026#x3C;\u003c/span\u003e\u003cspan class=\"token string\"\u003e'EOF'\n#!/usr/bin/env bash\nset -euo pipefail\n\nREPO_URL=\"${1:?Usage: run-task.sh \u0026#x3C;repo-url\u003e \u0026#x3C;branch-name\u003e \u0026#x3C;task-file\u003e}\"\nBRANCH_NAME=\"${2:?Usage: run-task.sh \u0026#x3C;repo-url\u003e \u0026#x3C;branch-name\u003e \u0026#x3C;task-file\u003e}\"\nTASK_FILE=\"${3:?Usage: run-task.sh \u0026#x3C;repo-url\u003e \u0026#x3C;branch-name\u003e \u0026#x3C;task-file\u003e}\"\n\nBASE_DIR=\"$HOME/agent-runner\"\nWORK_DIR=\"$BASE_DIR/workspaces/$BRANCH_NAME\"\n\nrm -rf \"$WORK_DIR\"\nmkdir -p \"$WORK_DIR\"\n\ngit clone \"$REPO_URL\" \"$WORK_DIR/repo\"\ncd \"$WORK_DIR/repo\"\n\ngit checkout -b \"$BRANCH_NAME\"\n\necho \"=== TASK ===\"\ncat \"$TASK_FILE\"\necho \"============\"\n\ncodex \"$(cat \"$TASK_FILE\")\"\n\necho \"=== VERIFY ===\"\n./.ai/commands/verify.sh\n\necho \"=== GIT DIFF ===\"\ngit status\ngit diff --stat\n\necho \"Task finished. Review changes in:\"\necho \"$WORK_DIR/repo\"\nEOF\u003c/span\u003e\n\u003cspan class=\"token function\"\u003echmod\u003c/span\u003e +x ~/agent-runner/run-task.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTask file example:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eFix the failing user service tests.\n\nConstraints:\n- Keep the change minimal.\n- Do not change public APIs.\n- Add a regression test if you find a bug.\n- Run ./.ai/commands/verify.sh before finishing.\n\nDone when:\n- lint passes\n- typecheck passes\n- tests pass\n- summary explains root cause and changed files\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRun:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e~/agent-runner/run-task.sh git@github.com:ORG/REPO.git agent/task-001 ~/agent-runner/task-001.txt\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"7-tambahkan-pr-creation\"\u003e7. Tambahkan PR creation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-tambahkan-pr-creation\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSetelah manual flow stabil, tambah commit/push/PR creation.\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003egit\u003c/span\u003e \u003cspan class=\"token function\"\u003eadd\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\u003cspan class=\"token function\"\u003egit\u003c/span\u003e commit -m \u003cspan class=\"token string\"\u003e\"Fix user service tests\"\u003c/span\u003e\n\u003cspan class=\"token function\"\u003egit\u003c/span\u003e push origin agent/task-001\ngh \u003cspan class=\"token function\"\u003epr\u003c/span\u003e create \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --title \u003cspan class=\"token string\"\u003e\"Fix user service tests\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --body \u003cspan class=\"token string\"\u003e\"Agent-generated PR. Verification command passed on VM runner.\"\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDi awal, PR creation bisa tetap manual.\u003c/p\u003e\n\u003ch3 id=\"8-tambahkan-docker-sandbox\"\u003e8. Tambahkan Docker sandbox\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-tambahkan-docker-sandbox\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk safety, jalankan task di container bukan langsung di host.\u003c/p\u003e\n\u003cp\u003eDockerfile minimal:\u003c/p\u003e\n\u003cpre class=\"language-dockerfile\"\u003e\u003ccode class=\"language-Dockerfile\"\u003e\u003cspan class=\"token instruction\"\u003e\u003cspan class=\"token keyword\"\u003eFROM\u003c/span\u003e node:22-bookworm\u003c/span\u003e\n\u003cspan class=\"token instruction\"\u003e\u003cspan class=\"token keyword\"\u003eRUN\u003c/span\u003e apt-get update \u0026#x26;\u0026#x26; apt-get install -y git curl jq build-essential ca-certificates \u0026#x26;\u0026#x26; rm -rf /var/lib/apt/lists/*\u003c/span\u003e\n\u003cspan class=\"token instruction\"\u003e\u003cspan class=\"token keyword\"\u003eWORKDIR\u003c/span\u003e /workspace\u003c/span\u003e\n\u003cspan class=\"token instruction\"\u003e\u003cspan class=\"token keyword\"\u003eRUN\u003c/span\u003e npm i -g @openai/codex\u003c/span\u003e\n\u003cspan class=\"token instruction\"\u003e\u003cspan class=\"token keyword\"\u003eCMD\u003c/span\u003e [\u003cspan class=\"token string\"\u003e\"/bin/bash\"\u003c/span\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eBuild dan run:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e build -t coding-agent-runner \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\n\u003cspan class=\"token function\"\u003edocker\u003c/span\u003e run --rm -it \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -v \u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e$WORK_DIR\u003c/span\u003e/repo:/workspace/repo\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -v \u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token variable\"\u003e$TASK_FILE\u003c/span\u003e:/workspace/task.txt:ro\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  -w /workspace/repo \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  --network none \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  coding-agent-runner \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token function\"\u003ebash\u003c/span\u003e -lc \u003cspan class=\"token string\"\u003e'codex \"$(cat /workspace/task.txt)\" \u0026#x26;\u0026#x26; ./.ai/commands/verify.sh'\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eTargetnya adalah permission explicit.\u003c/p\u003e\n\u003ch3 id=\"9-opsional-versi-coolify\"\u003e9. Opsional: versi Coolify\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-opsional-versi-coolify\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau kamu ingin menjalankan runner ini sebagai service yang lebih mudah di-deploy dan dikelola, Coolify bisa jadi next step. Intinya, alih-alih memanggil \u003ccode\u003erun-task.sh\u003c/code\u003e di VM langsung, kamu bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuat repository deploy Coolify di VM atau VPS,\u003c/li\u003e\n\u003cli\u003ebungkus \u003ccode\u003eagent-runner.sh\u003c/code\u003e dan workspace dengan Docker Compose atau Dockerfile,\u003c/li\u003e\n\u003cli\u003eset environment untuk GitHub token dan optional model key,\u003c/li\u003e\n\u003cli\u003eexpose endpoint manual / webhook untuk trigger task,\u003c/li\u003e\n\u003cli\u003etetap jalankan task di container terisolasi, dengan \u003ccode\u003everify.sh\u003c/code\u003e sebagai gate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh konsep:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003eversion\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e'3.8'\u003c/span\u003e\n\u003cspan class=\"token key atrule\"\u003eservices\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token key atrule\"\u003eagent-runner\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003ebuild\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e .\n    \u003cspan class=\"token key atrule\"\u003evolumes\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e ./workspaces\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e/workspaces\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e ./repo\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e/repo\n    \u003cspan class=\"token key atrule\"\u003eenvironment\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e GITHUB_TOKEN=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eGITHUB_TOKEN\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e AI_CLI_KEY=$\u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003eAI_CLI_KEY\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eentrypoint\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/bin/bash\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"/usr/local/bin/agent-runner.sh\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSecara ringkas, Coolify di sini bukan menggantikan ide self-hosted runner. Dia cuma mempermudah deployment dan lifecycle service while tetap menjaga workflow:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etrigger task manual atau via webhook,\u003c/li\u003e\n\u003cli\u003eagent bekerja di container Coolify,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003everify.sh\u003c/code\u003e jalan di dalam container,\u003c/li\u003e\n\u003cli\u003ehasil disimpan di workspace terisolasi,\u003c/li\u003e\n\u003cli\u003ePR creation bisa tetap manual atau otomatis setelah verifikasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau kamu sudah siap, bisa lanjut bikin satu \u003ccode\u003enotes.agentic-engineering.cloud-agent.handson.coolify-agent-runner.md\u003c/code\u003e untuk langkah deploy Coolify yang lebih spesifik.\u003c/p\u003e\n\u003ch3 id=\"10-tambahkan-agent-report\"\u003e10. Tambahkan agent report\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-tambahkan-agent-report\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMinta agent bikin summary akhir, bukan cuma diff.\u003c/p\u003e\n\u003cp\u003eContoh format:\u003c/p\u003e\n\u003cpre class=\"language-markdown\"\u003e\u003ccode class=\"language-markdown\"\u003e\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e#\u003c/span\u003e Agent Task Report\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Summary\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Files changed\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Verification\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Risks\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Human review needed\u003c/span\u003e\n\n\u003cspan class=\"token title important\"\u003e\u003cspan class=\"token punctuation\"\u003e##\u003c/span\u003e Follow-up\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"10-tambahkan-security-sensor\"\u003e10. Tambahkan security sensor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-tambahkan-security-sensor\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau mau lebih serius, tambahkan scans ke \u003ccode\u003everify.sh\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003ecommand\u003c/span\u003e -v gitleaks \u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e/dev/null \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e\u003cspan class=\"token file-descriptor important\"\u003e\u0026#x26;1\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e \u003cspan class=\"token keyword\"\u003ethen\u003c/span\u003e\n  gitleaks detect --source \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e --no-git\n\u003cspan class=\"token keyword\"\u003efi\u003c/span\u003e\n\n\u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003ecommand\u003c/span\u003e -v osv-scanner \u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e/dev/null \u003cspan class=\"token operator\"\u003e\u003cspan class=\"token file-descriptor important\"\u003e2\u003c/span\u003e\u003e\u003c/span\u003e\u003cspan class=\"token file-descriptor important\"\u003e\u0026#x26;1\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e;\u003c/span\u003e \u003cspan class=\"token keyword\"\u003ethen\u003c/span\u003e\n  osv-scanner --recursive \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\u003cspan class=\"token keyword\"\u003efi\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"jalur-belajar-besok\"\u003eJalur belajar besok\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#jalur-belajar-besok\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eBaca mental model Codex cloud dan Claude Code GitHub Actions.\u003c/li\u003e\n\u003cli\u003eSetup VM + install CLI + clone repo kecil.\u003c/li\u003e\n\u003cli\u003eBuat \u003ccode\u003eAGENTS.md\u003c/code\u003e dan \u003ccode\u003everify.sh\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eBuat \u003ccode\u003erun-task.sh\u003c/code\u003e dan jalankan task manual.\u003c/li\u003e\n\u003cli\u003eReview diff manual + PR.\u003c/li\u003e\n\u003cli\u003eUpgrade ke Docker sandbox / report template.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVersi pertama self-hosted agent runner tidak perlu UI, OpenClaw-style orchestration, atau multi-agent planner.\u003c/p\u003e\n\u003cp\u003eVersi pertama cukup menjawab:\u003c/p\u003e\n\u003cp\u003e\"Bisa nggak VM gue menerima satu task kecil, mengerjakannya di workspace terisolasi, menjalankan verification, lalu menghasilkan PR/report yang bisa gue review?\"\u003c/p\u003e\n\u003cp\u003eKalau iya: lanjut ke trigger GitHub, sandbox ketat, security scan, PR reviewer agent, dan orchestration.\u003c/p\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.cloud-agent.handson.gitlab-mr-comment-formatting\"\u003eCloud Agent Hands-on: MR Comment Formatting\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.agentic-engineering\"\u003eMOC Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecloud-agents (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eself-hosted (Private)\u003c
