d-publishing-membuktikan-origin-tapi-tidak-membuktikan-kontrol-publish\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eTIL: trusted publishing di konteks npm berarti OIDC + Sigstore + provenance attestation untuk memverifikasi identitas dan workflow CI saat publish. Itu jawaban untuk \"percaya siapa yang publish\", bukan \"percaya bahwa publish itu dilakukan dengan kontrol yang aman.\"\u003c/p\u003e\n\u003cp\u003eKasus Axios/OpenAI menunjukkan bahwa kalau attacker berhasil mengambil alih maintainer atau session, provenance bisa tetap valid sementara intent/kontrol sudah hilang.\u003c/p\u003e\n\u003cp\u003eIntinya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eauthenticity = rilis datang dari jalur resmi\u003c/li\u003e\n\u003cli\u003eagency = publisher masih mengendalikan proses secara sah\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eProvenance hanya kuat terhadap pemalsuan origin. Ia lemah terhadap kompromi identitas asli dan social engineering.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etil (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esupply-chain (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprovenance (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and
