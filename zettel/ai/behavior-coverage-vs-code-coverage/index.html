e":"vault"},"value":"zettel.ai.the-oracle-problem","position":{"start":{"line":21,"column":3,"offset":1327},"end":{"line":21,"column":35,"offset":1359},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"zettel.ai.the-oracle-problem"}}],"anchors":{"konsep":{"type":"header","text":"Konsep","value":"konsep","line":15,"column":0,"depth":2},"perbandingan":{"type":"header","text":"Perbandingan","value":"perbandingan","line":20,"column":0,"depth":2},"implikasi-dalam-ai-coding":{"type":"header","text":"Implikasi dalam AI Coding","value":"implikasi-dalam-ai-coding","line":29,"column":0,"depth":2},"relasi":{"type":"header","text":"Relasi","value":"relasi","line":32,"column":0,"depth":2}},"children":[],"parent":"5u5qgf55dk7a3bauxh68b69","data":{}},"body":"\u003ch1 id=\"behavior-coverage-vs-code-coverage\"\u003eBehavior Coverage vs Code Coverage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#behavior-coverage-vs-code-coverage\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konsep\"\u003eKonsep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konsep\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam pengembangan software, sering terjadi miskonsepsi bahwa \u003cstrong\u003eCode Coverage\u003c/strong\u003e yang tinggi (misal 100%) menjamin kualitas software. Namun, code coverage hanya mengukur \u003cem\u003eexecution path\u003c/em\u003e, bukan \u003cem\u003ecorrectness\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBehavior Coverage\u003c/strong\u003e mengukur sejauh mana skenario-skenario penting dalam domain bisnis/teknis telah dipin (fixed) dalam test suite.\u003c/p\u003e\n\u003ch2 id=\"perbandingan\"\u003ePerbandingan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#perbandingan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eDimensi\u003c/th\u003e\u003cth\u003eCode Coverage\u003c/th\u003e\u003cth\u003eBehavior Coverage\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003ePertanyaan Utama\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e\"Apakah baris ini pernah dijalankan?\"\u003c/td\u003e\u003ctd\u003e\"Apakah behavior X untuk input Y sudah benar?\"\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eMetrik\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003ePersentase baris/branch yang terlewati.\u003c/td\u003e\u003ctd\u003eDaftar skenario domain yang terverifikasi.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eKelemahan\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eBisa 100% tapi output salah (missing assertions).\u003c/td\u003e\u003ctd\u003eLebih sulit diukur secara otomatis (butuh domain knowledge).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eKonteks AI\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eAI bisa dengan mudah mencapai 100% coverage.\u003c/td\u003e\u003ctd\u003eAI butuh Oracle untuk tahu behavior apa yang harus dicover.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"implikasi-dalam-ai-coding\"\u003eImplikasi dalam AI Coding\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#implikasi-dalam-ai-coding\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAgent bisa menghasilkan ribuan test yang memberikan code coverage tinggi, tetapi test tersebut bisa jadi dangkal (tidak mengecek edge case domain). Oleh karena itu, fokus engineer harus bergeser dari mengejar angka coverage ke mendesain \u003cstrong\u003ebehavioral oracles\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"relasi\"\u003eRelasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relasi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.ai-engineering.loop-driven-development\"\u003eLoop Driven Development (LDD): Solving the Oracle Problem\u003c/a\u003e: LDD menggunakan behavior coverage sebagai indikator 'Done'.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.ai.the-oracle-problem\"\u003eThe Oracle Problem dalam AI Coding\u003c/a\u003e: Menentukan behavior coverage membutuhkan oracle yang valid.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etesting (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003equality-assurance (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"
