":{"type":"header","text":"Kenapa ini relevan buat gue","value":"kenapa-ini-relevan-buat-gue","line":149,"column":0,"depth":3},"insight-kunci":{"type":"header","text":"Insight kunci","value":"insight-kunci","line":160,"column":0,"depth":3}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-05\"\u003e2026-05-05\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-05\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"hari-ini-gue-baca-github-blog-github-copilot-is-moving-to-usage-based-billing\"\u003eHari ini gue baca \u003ca href=\"https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/\"\u003eGitHub Blog: GitHub Copilot is moving to usage-based billing\u003c/a\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hari-ini-gue-baca-github-blog-github-copilot-is-moving-to-usage-based-billing\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eartikel 27 April 2026, perubahan efektif 1 Juni 2026.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"yang-gue-tangkep\"\u003eYang gue tangkep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#yang-gue-tangkep\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCopilot Pro tidak naik harga $10/bulan, tapi unit pemakaian berubah dari \"premium request units\" ke \"GitHub AI Credits\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apa-yang-berubah-di-copilot-pro\"\u003eApa yang berubah di Copilot Pro\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-berubah-di-copilot-pro\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003esistem premium request units (PRU) dihapus.\u003c/li\u003e\n\u003cli\u003ediganti dengan GitHub AI Credits yang dipakai berdasarkan token.\u003c/li\u003e\n\u003cli\u003etoken yang dihitung meliputi input token (konteks/prompt), output token (jawaban/kode), dan cached token (konteks ulang pakai).\u003c/li\u003e\n\u003cli\u003eGitHub menyebut 1 AI Credit = $0.01, jadi $10 Copilot Pro = 1.000 AI Credits.\u003c/li\u003e\n\u003cli\u003emodel sekarang masih punya multiplier, tapi relevansinya berbeda:\n\u003cul\u003e\n\u003cli\u003euntuk annual Copilot Pro/Pro+ yang masih berada di sistem request-based sampai masa annual habis.\u003c/li\u003e\n\u003cli\u003euntuk usage-based billing baru, yang sekarang lebih granular: biaya = token × tarif model per jenis token.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003emodel murah tetap lebih hemat; model kuat tetap lebih mahal, tapi sekarang per-token pricing membuat perbedaan itu lebih presisi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"kenapa-ini-penting-buat-gue\"\u003eKenapa ini penting buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-gue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003emodel baru bikin billing Copilot lebih mirip layanan compute/AI API.\u003c/li\u003e\n\u003cli\u003erequest pendek cukup murah; sesi agentic panjang, baca banyak file, atau refactor repo besar bisa pakai kredit jauh lebih cepat.\u003c/li\u003e\n\u003cli\u003edulu satu request kecil dan satu sesi panjang bisa dihitung sama; sekarang biaya lebih dekat ke actual compute/token cost.\u003c/li\u003e\n\u003cli\u003ethread Theo menunjukkan anomali lama: sedikit message bisa memicu ratusan juta token backend dan biaya inference besar, padahal billing lama hanya hitung per message. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/theo/status/2051395816410210604 (Private)\u003c/a\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cblockquote class=\"twitter-tweet\"\u003e\u003cp lang=\"en\" dir=\"ltr\"\u003e- 15 messages\u003cbr\u003e- $221 of tokens\u003cbr\u003e- 1.6% of my $40 plan used\u003cbr\u003e\u003cbr\u003eIt's obvious that GitHub couldn't keep this model for billing on Copilot. \u003ca href=\"https://t.co/x2QGOCMnhw\"\u003ehttps://t.co/x2QGOCMnhw\u003c/a\u003e \u003ca href=\"https://t.co/XRXiwYjn8E\"\u003epic.twitter.com/XRXiwYjn8E\u003c/a\u003e\u003c/p\u003e— Theo - t3.gg (@theo) \u003ca href=\"https://twitter.com/theo/status/2051395816410210604?ref_src=twsrc%5Etfw\"\u003eMay 4, 2026\u003c/a\u003e\u003c/blockquote\u003e \u003cscript async src=\"https://platform.twitter.com/widgets.js\" charset=\"utf-8\"\u003e\u003c/script\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003erespons thread menguatkan bahwa ini bukan sekadar GitHub serakah: banyak user melihat agent coding telah merusak model harga subscription lama.\n\u003cul\u003e\n\u003cli\u003efixed/flat per-task pricing cocok untuk task kecil, tapi boncos saat task agent bisa berjalan puluhan jam.\u003c/li\u003e\n\u003cli\u003ebanyak orang setuju unlimited/flat agent pricing akan temui masalah economics yang sama di tools lain.\u003c/li\u003e\n\u003cli\u003ebilling harus mengikuti real token consumption, bukan sekadar jumlah interaksi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003ecerita Uber menambah dimensi enterprise: saat ratusan atau ribuan engineer mulai memakai agentic coding, budget bisa berubah dari seat budget menjadi compute/token budget. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/iamharishvasu/status/2051389463444836412 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003econtoh Jaid menguatkan isu pricing exploit pada fixed task pricing, bukan hack teknis. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://x.com/JaidCodes/status/2051399596530602330 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"apa-yang-tetap-termasuk\"\u003eApa yang tetap termasuk\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-tetap-termasuk\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eprice dasar Copilot Pro: tetap $10/bulan.\u003c/li\u003e\n\u003cli\u003ecode completions tetap termasuk.\u003c/li\u003e\n\u003cli\u003eNext Edit suggestions tetap termasuk.\u003c/li\u003e\n\u003cli\u003eakses Pro tetap ada, tapi sekarang ada \"potongan\" akses/budget token per bulan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"perubahan-annual-plan\"\u003ePerubahan annual plan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#perubahan-annual-plan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003epelanggan bulanan otomatis pindah ke usage-based billing 1 Juni 2026.\u003c/li\u003e\n\u003cli\u003epelanggan tahunan tetap di model premium request sampai masa annual habis.\u003c/li\u003e\n\u003cli\u003emultiplier lama masih relevan untuk annual plan yang belum berakhir, karena mereka tetap di sistem request-based sampai expiry.\u003c/li\u003e\n\u003cli\u003esetelah annual plan selesai, langganan akan pindah ke Copilot Free; bisa upgrade ke monthly dan sisa nilai annual dikonversi prorata ke kredit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"dampaknya-buat-gue--pemakaian-gue\"\u003eDampaknya buat gue / pemakaian gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#dampaknya-buat-gue--pemakaian-gue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ekalau gue cuma pakai Copilot buat task ringan, dampaknya kemungkinan kecil selama nggak pakai sesi agent panjang atau model premium secara berat.\u003c/li\u003e\n\u003cli\u003ekalau gue mulai pakai agentic workflow, kredit bisa habis lebih cepat karena sekarang biaya naik seiring panjang konteks dan model yang dipakai.\u003c/li\u003e\n\u003cli\u003ebuat gue yang pakai Raptor mini, posisi gue relatif lebih aman dibanding yang sering pakai Claude Sonnet/GPT-5.4/Opus.\u003c/li\u003e\n\u003cli\u003epenting dicatat: di UI lama, Raptor mini bisa terasa \"free\" karena 0x tidak mengurangi jatah premium/request secara kasat mata.\u003c/li\u003e\n\u003cli\u003edi sistem baru, Raptor mini tetap murah, tapi tidak benar-benar gratis—meter tokennya mulai kelihatan.\u003c/li\u003e\n\u003cli\u003ekasus Jaid Opus menguatkan ini: fixed price per task bisa disalahpakai untuk session long-running yang secara backend cost jauh lebih tinggi.\u003c/li\u003e\n\u003cli\u003eyang terjadi di skenario itu lebih tepat disebut economic arbitrage/pricing exploit, bukan hack.\u003c/li\u003e\n\u003cli\u003escreenshot token count seperti 59.726 tks kemungkinan menunjukkan konteks per langkah, bukan total biaya final.\n\u003cul\u003e\n\u003cli\u003ekalau setiap langkah membawa 40k–60k token dan agent jalan 20 kali, total input bisa mendekati 1 juta token.\u003c/li\u003e\n\u003cli\u003edengan pricing Raptor/GPT-5 mini, 1 juta input token kira-kira 25 AI Credits; tambahan 100k output token bisa jadi 20 AI Credits.\u003c/li\u003e\n\u003cli\u003esatu task panjang bisa menghabiskan 45–250 AI Credits tergantung berapa banyak step dan output yang dihasilkan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"transisi-ke-local-model\"\u003eTransisi ke local model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#transisi-ke-local-model\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003epergeseran Copilot ke billing token-based bikin gue semakin memperhitungkan opsi local/hybrid agents sebagai alternatif biaya.\u003c/li\u003e\n\u003cli\u003ekalau cloud token mulai tajam, small model lokal atau Qwen3/MoE 30B murah bisa jadi pertahanan ekonomi, bukan sekadar eksperimen. \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehttps://www.reddit.com/r/LocalLLaMA/ (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003ecatatan terkait: \u003ca href=\"/sotoy/notes/notes.copilot.raptor-mini-sml-budgeting\"\u003eRaptor mini, SML, dan billing Copilot yang pindah ke token\u003c/a\u003e, \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes.copilot.local-llm-hardware-upgrade (Private)\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.copilot.token-cheap-coding-agent-providers\"\u003eToken murah untuk coding agent\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"kesalahan-umum\"\u003eKesalahan umum\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesalahan-umum\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003esalah paham bahwa harga Copilot Pro naik. nggak; yang berubah adalah unit ekonominya: dari request-based ke token/credit-based.\u003c/li\u003e\n\u003cli\u003eini bukan kenaikan paket, tapi perubahan cara hitung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCopilot sekarang diposisikan sebagai layanan AI compute yang bisa jalan lama dan lintas file, bukan sekadar autocomplete/chat kecil.\u003c/li\u003e\n\u003cli\u003ebuat pemakaian singkat, biaya relatif kecil.\u003c/li\u003e\n\u003cli\u003ebuat penggunaan agentic panjang, ini bisa jadi sinyal supaya kontrol session, konteks, dan model jadi lebih penting.\u003c/li\u003e\n\u003cli\u003eoutput token jauh lebih mahal daripada input token, jadi prompt yang menghasilkan teks panjang atau banyak file akan meroket biaya.\u003c/li\u003e\n\u003cli\u003eistilah \"yayasan GitHub peduli\" lebih tepat dibaca sebagai cross-subsidy/produk subsidi, bukan charity.\u003c/li\u003e\n\u003cli\u003etidak ada bukti langsung bahwa model murah/0x sengaja diberikan agar GitHub bisa latih Raptor mini dari sesi pengguna.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"catatan-ringkas\"\u003eCatatan ringkas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-ringkas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCopilot Pro tetap $10/bulan, tapi budget $10 berubah jadi \"AI Credits\".\u003c/li\u003e\n\u003cli\u003eRaptor mini tercatat di docs sebagai model harga setara GPT-5 mini: murah per token.\u003c/li\u003e\n\u003cli\u003elong-running task masih butuh diperhitungkan berdasarkan total token yang dikonsumsi.\u003c/li\u003e\n\u003cli\u003ebilling baru akan membuat pemakaian panjang / model berat kelihatan lebih mahal.\u003c/li\u003e\n\u003cli\u003eperalihan annual plan penting untuk pengguna tahunan yang belum habis masa langganannya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"insight-lain-chris-parsons-how-i-use-ai-to-code\"\u003eInsight lain: Chris Parsons \"How I Use AI to Code\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-lain-chris-parsons-how-i-use-ai-to-code\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003egue catet artikel ini sebagai case study agentic engineering: bukan sekadar model, tapi harness, verification, dan feedback loop.\u003c/li\u003e\n\u003cli\u003einti argumennya: AI bikin produksi kode murah, tapi verifikasi dan judgement jadi makin mahal.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAGENTS.md\u003c/code\u003e, skill file, dan portable Markdown knowledge lebih penting daripada prompt yang panjang.\u003c/li\u003e\n\u003cli\u003esenior engineer idealnya jadi trainer harness, bukan reviewer diff manual.\u003c/li\u003e\n\u003cli\u003eartikel ini juga ngasih kontras antara vibe coding (terima output AI tanpa cukup cek) dan agentic engineering (AI dipakai agresif tapi dalam sistem guardrail dan test).\u003c/li\u003e\n\u003cli\u003ebuat detail lebih lengkap, gue pindahin ringkasan ke \u003ca href=\"/sotoy/notes/notes.agentic-engineering.how-i-use-ai-to-code\"\u003eHow I Use AI to Code\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota baru soal next wave: cloud agents + autonomous orchestration di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.next-wave-cloud-agents\"\u003eNext Wave: Cloud Agents dan Autonomous Orchestration\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota baru soal bagaimana judgement senior dipindahkan ke harness di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.senior-judgement-to-harness\"\u003eSenior Judgement yang Dipindahkan ke Harness\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota before-after workflow tim dan harness untuk N+1 query di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota tentang OpenClaw sebagai personal agent orchestration di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota hands-on self-hosted VM agent runner di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.self-hosted-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eada nota GitLab MR review agent di Coolify di \u003ca href=\"/sotoy/notes/notes.agentic-engineering.gitlab-mr-review-agent-coolify\"\u003eGitLab MR Review Agent di Coolify\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"thread-x-guillermo-rauch-deepsec\"\u003eThread X Guillermo Rauch: \u003ccode\u003edeepsec\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#thread-x-guillermo-rauch-deepsec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"konteks-1\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003egue lagi baca thread \u003ca href=\"https://x.com/rauchg/status/2051386798899888539\"\u003eGuillermo Rauch\u003c/a\u003e tentang \u003ccode\u003enpx deepsec\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote class=\"twitter-tweet\"\u003e\u003cp lang=\"en\" dir=\"ltr\"\u003e𝚗𝚙𝚡 𝚍𝚎𝚎𝚙𝚜𝚎𝚌\u003cbr\u003e\u003cbr\u003eWe're introducing an open-source agent orchestrator for deep security reviews.\u003cbr\u003e\u003cbr\u003eWe built it for internal use, and after running it against some major OSS projects, we gained conviction to share it with the world.\u003cbr\u003e\u003cbr\u003eCoding agents can now find critical… \u003ca href=\"https://t.co/pl8rPc2rNG\"\u003ehttps://t.co/pl8rPc2rNG\u003c/a\u003e\u003c/p\u003e— Guillermo Rauch (@rauchg) \u003ca href=\"https://twitter.com/rauchg/status/2051386798899888539?ref_src=twsrc%5Etfw\"\u003eMay 4, 2026\u003c/a\u003e\u003c/blockquote\u003e \u003cscript async src=\"https://platform.twitter.com/widgets.js\" charset=\"utf-8\"\u003e\u003c/script\u003e\n\u003ch3 id=\"apa-itu-deepsec\"\u003eApa itu \u003ccode\u003edeepsec\u003c/code\u003e?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-itu-deepsec\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eini adalah \"open-source agent orchestrator for deep security reviews\", bukan sekadar SAST atau vulnerability scanner.\u003c/li\u003e\n\u003cli\u003efokusnya di harness: CLI-first, sandbox-based scaling, pluggable coding agents, support repo besar, BYO model/subscription.\u003c/li\u003e\n\u003cli\u003eintinya \u003ccode\u003edeepsec\u003c/code\u003e lebih mirip kerangka kerja yang menjalankan banyak coding agent paralel, lalu mengumpulkan dan memfilter hasilnya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"kenapa-agent-orchestrator-penting\"\u003eKenapa \"agent orchestrator\" penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-agent-orchestrator-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eagent tunggal punya batasan context window, waktu, dan fokus eksplorasi.\u003c/li\u003e\n\u003cli\u003ekalau banyak agent jalan paralel, masing-masing bisa ngejar hipotesis berbeda: auth bypass, SSRF, deserialization, dependency misuse, dll.\u003c/li\u003e\n\u003cli\u003eorchestration menjawab masalah praktis: agent mana dijalankan, prompt apa, branch/commit mana, output disimpan di mana, duplicate bagaimana, dan bagaimana hasilnya diverifikasi.\u003c/li\u003e\n\u003cli\u003eini sejalan dengan komentar Dr. Nripanka Das di thread itu: yang berguna bukan agent, tapi harness-nya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"nilai-utama-agent-atau-harness\"\u003eNilai utama: agent atau harness?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#nilai-utama-agent-atau-harness\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eagent adalah headline: \"AI menemukan vulnerability.\" Tapi dia juga paling rawan hype dan halusinasi.\u003c/li\u003e\n\u003cli\u003eharness adalah yang bikin hasilnya bisa diulang, diukur, dan diaudit.\u003c/li\u003e\n\u003cli\u003etanpa harness, 100 finding dari agent cuma jadi tumpukan noise. dengan harness, lo bisa tahu run mana, prompt mana, model mana, environment mana, dan bukti apa yang mendukung.\u003c/li\u003e\n\u003cli\u003ethread ini lebih menunjukkan transisi ke review keamanan berbasis orkestrasi agent, bukan AI security scanner monolitik.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"mengapa-false-positive-triage-dan-signal-to-noise-langsung-muncul\"\u003eMengapa false positive, triage, dan signal-to-noise langsung muncul?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-false-positive-triage-dan-signal-to-noise-langsung-muncul\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003esecurity review yang bagus bukan cuma banyak menemukan issue, tapi juga membantu maintainer melakukan \u003ca href=\"/sotoy/til.security.triage\"\u003etriage\u003c/a\u003e: menyaring mana yang valid, mana yang false positive, mana yang paling berbahaya, dan mana yang harus ditangani dulu.\n\u003cul\u003e\n\u003cli\u003econtoh triage: dari 40 finding, 8 bisa valid critical/high, 12 valid medium/low, 10 false positive, dan 10 lainnya perlu investigasi lanjutan. Dengan begitu, tim tahu mana yang harus dikerjain sekarang dan mana yang bisa ditunda.\n\u003cul\u003e\n\u003cli\u003ekalau agent ngeluarin 40 finding dan 90% noise, maintainer malah kewalahan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003esignal-to-noise ratio jadi ukuran best practice: Intinya, dari banyak alert yang keluar, berapa yang beneran berguna dan bukan cuma noise.\u003c/li\u003e\n\u003cli\u003eklaim deepsec adalah punya \"very high signal to noise ratio\", tapi yang benar-benar meyakinkan adalah benchmark: repo besar apa, berapa confirmed, berapa false positive, dan berapa waktu triage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"relasi-dengan-swival-dan-kompetitor\"\u003eRelasi dengan Swival dan kompetitor\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relasi-dengan-swival-dan-kompetitor\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ediskusi di thread sempat menyinggung Swival karena konsepnya tampak mirip: multi-phase audit dengan triage, verification, patch generation.\u003c/li\u003e\n\u003cli\u003eGuillermo menekankan pembeda arsitektural: open source, parallel cloud sandbox, large repo testing, BYO agent/model/key, dan CLI-first.\u003c/li\u003e\n\u003cli\u003eyang jadi pertanyaan bukan siapa duluan, tapi apakah orchestration dan packaging operasionalnya berbeda.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"kenapa-ini-relevan-buat-gue\"\u003eKenapa ini relevan buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-relevan-buat-gue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ethread ini mengingatkan bahwa manusia bukan hilang, tapi pekerjaannya bergeser: dari nyari bug ke mendesain scope, membaca bukti, memvalidasi exploitability, menentukan severity, dan men-triage.\u003c/li\u003e\n\u003cli\u003eini juga terhubung dengan catatan \u003ccode\u003e[[notes.security.overtrust]]\u003c/code\u003e: selain ngecek codebase, kita harus ingat bahwa workstation dan tool lokal bisa jadi boundary risiko sendiri.\u003c/li\u003e\n\u003cli\u003ecatatan lain yang relevan:\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e[[notes.security.deepsec-docs]]\u003c/code\u003e untuk cara kerja Deepsec sebagai harness audit dan bukan cuma scanner.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[[notes.security.deepsec-harness]]\u003c/code\u003e untuk konsep orchestration agentic review dan bagaimana hasil harus masuk workflow.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[[notes.security.deepsec-challenges]]\u003c/code\u003e untuk kritik operasional: false positive, cost, dan apakah outputnya actionable.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e[[notes.security.agentic-coding-permission-boundary]]\u003c/code\u003e untuk fokus pada izin lokal dan filesystem access dalam agentic coding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003epertanyaan yang bener bukan lagi \"model apa?\" melainkan \"bagaimana finding diverifikasi, direproduksi, dan di-triage?\"\u003c/li\u003e\n\u003cli\u003ependekatan ini lebih cocok untuk scheduled audit, area sensitif, atau repo besar, bukan PR hook setiap commit.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight-kunci\"\u003eInsight kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-kunci\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003edeepsec\u003c/code\u003e menarik karena dia mengangkat orkestrasi agentic review sebagai produk, bukan hanya agentnya.\u003c/li\u003e\n\u003cli\u003enilai jadi dari sandbox + parallelism + reproducibility + triage.\u003c/li\u003e\n\u003cli\u003eini lebih dekat ke fuzzing atau CI security gate dalam hal skala dan eksplorasi, tapi bedanya hasilnya perlu penilaian semantik dan verifikasi manual.\u003c/li\u003e\n\u003cli\u003ekalau orang baca thread ini hanya sebagai \"AI security review bisa dilepas\", itu risiko besar. versi yang lebih pas adalah: \"AI bisa memperluas coverage, tapi manusia tetap penting untuk bukti dan keputusan.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003egithub (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecopilot (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-billing (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003etwitter (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.agentic-coding-permission-boundary\"\u003eAgentic coding permission boundary dan risiko filesystem lokal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-challenges\"\u003eDeepsec challenge: orchestration, false positives, cost, dan workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-docs\"\u003eDeepsec docs: workflow harness, bukan scanner sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-harness\"\u003eDeepsec: security harness untuk codebase besar\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/til.security.triage\"\u003eTIL: apa itu triage di security review\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":true},"commands":{"lookup":{"note":{"selectionMode":"extract","confirmVaultOnCreate":true,"vaultSelectionModeOnCreate":"smart","leaveTrace":false,"bubbleUpCreateNew":true,"fuzzThreshold":0.2}},"randomNote":{},"insertNoteLink":{"aliasMode":"none","enableMultiSelect":false},"insertNoteIndex":{"enableMarker":false},"copyNoteLink":{"aliasMode":"title"},"templateHierarchy":"template"},"workspace":{"dendronVersion":"0.83.0","vaults":[{"fsPath":"vault"}],"journal":{"dailyDomain":"daily","name":"journal","dateFormat":"y.MM.dd","addBehavior":"childOfDomain"},"scratch":{"name":"scratch","dateFormat":"y.MM.dd.HHmmss","addBehavior":"asOwnDomain"},"task":{"name":"","dateFormat":"","addBehavior":"childOfCurrent","statusSymbols":{"":" ","wip":"w","done":"x","assigned":"a","moved":"m","blocked":"b","delegated":"l","dropped":"d","pending":"y"},"prioritySymbols":{"H":"high","M":"medium","L":"low"},"todoIntegration":false,"createTaskSelectionType":"selection2link","taskCompleteStatus":["done","x"]},"graph":{"zoomS
