,"anchors":{"overview":{"type":"header","text":"Overview","value":"overview","line":15,"column":0,"depth":2},"1-masalah-fundamental-overtrust":{"type":"header","text":"1. Masalah fundamental Overtrust","value":"1-masalah-fundamental-overtrust","line":18,"column":0,"depth":2},"2-cara-kerja-tanpa-ai":{"type":"header","text":"2. Cara kerja tanpa AI","value":"2-cara-kerja-tanpa-ai","line":24,"column":0,"depth":2},"3-kategori-risiko-yang-dideteksi":{"type":"header","text":"3. Kategori risiko yang dideteksi","value":"3-kategori-risiko-yang-dideteksi","line":35,"column":0,"depth":2},"4-bedanya-dengan-secret-scanner-biasa":{"type":"header","text":"4. Bedanya dengan secret scanner biasa","value":"4-bedanya-dengan-secret-scanner-biasa","line":47,"column":0,"depth":2},"5-implementasi-nyata":{"type":"header","text":"5. Implementasi nyata","value":"5-implementasi-nyata","line":53,"column":0,"depth":2},"6-limitasi-dan-false-positive":{"type":"header","text":"6. Limitasi dan false positive","value":"6-limitasi-dan-false-positive","line":60,"column":0,"depth":2},"7-korelasi-dengan-agentic-coding-dan-deepsec":{"type":"header","text":"7. Korelasi dengan agentic coding dan Deepsec","value":"7-korelasi-dengan-agentic-coding-dan-deepsec","line":72,"column":0,"depth":2},"8-insight-penting":{"type":"header","text":"8. Insight penting","value":"8-insight-penting","line":80,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":86,"column":0,"depth":2},"practical-position":{"type":"header","text":"Practical position","value":"practical-position","line":100,"column":0,"depth":2},"related-zettels":{"type":"header","text":"Related Zettels","value":"related-zettels","line":106,"column":0,"depth":2}},"children":["notes.security.overtrust.workflow-detail"],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"overtrust-lokal-workstation-scanner-untuk-trust-boundary-bukan-bug-scanner\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overtrust-lokal-workstation-scanner-untuk-trust-boundary-bukan-bug-scanner\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat \u003ccode\u003echeese-cakee/overtrust\u003c/code\u003e sebagai lawan dari Deepsec. Deepsec nyari bug di codebase. Overtrust ngecek apakah workstation developer terlalu percaya pada tool, extension, process, dan config yang punya akses ke secret.\u003c/p\u003e\n\u003ch2 id=\"1-masalah-fundamental-overtrust\"\u003e1. Masalah fundamental Overtrust\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-masalah-fundamental-overtrust\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eworkstation developer sekarang juga attack surface.\u003c/li\u003e\n\u003cli\u003ebukan cuma secret yang ke-commit. secret bisa bocor gara-gara tool lokal punya akses file, process, atau shell.\u003c/li\u003e\n\u003cli\u003eOvertrust nanya: \"apa yang bisa nyentuh secret gue?\", bukan sekadar \"apa secret ada di repo?\"\u003c/li\u003e\n\u003cli\u003eini penting buat era agentic coding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-cara-kerja-tanpa-ai\"\u003e2. Cara kerja tanpa AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-cara-kerja-tanpa-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOvertrust sengaja deterministik, offline, lokal.\u003c/li\u003e\n\u003cli\u003esource code utamanya di \u003ccode\u003esrc/scanner/\u003c/code\u003e:\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ewalker.cpp\u003c/code\u003e buat file walk dan ignore path,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eclassifier.cpp\u003c/code\u003e buat deteksi jenis file,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emanifest.cpp\u003c/code\u003e buat parse manifest VS Code / npm / Dockerfile,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esecrets.cpp\u003c/code\u003e buat keyword → regex → entropy → FP guard,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprocscanner_linux.cpp\u003c/code\u003e / \u003ccode\u003eprocscanner_win.cpp\u003c/code\u003e buat scan process.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003esemua logika ditulis di C++. nggak ada cloud, nggak ada LLM, jadi nggak nambah trust problem.\u003c/li\u003e\n\u003cli\u003euntuk versi yang lebih detail tentang alur kerja lokal dan trust boundary, lihat \u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-kategori-risiko-yang-dideteksi\"\u003e3. Kategori risiko yang dideteksi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-kategori-risiko-yang-dideteksi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eIDE extension: terminal access, auth provider, debug adapter, always-on activation.\u003c/li\u003e\n\u003cli\u003enpm package: preinstall/postinstall, \u003ccode\u003ecurl | bash\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eDockerfile: root container, \u003ccode\u003ecurl | bash\u003c/code\u003e pada RUN.\u003c/li\u003e\n\u003cli\u003eSecrets: AWS, GitHub, OpenAI, Anthropic, Stripe, PEM.\u003c/li\u003e\n\u003cli\u003ecredential file: \u003ccode\u003e~/.aws/credentials\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, SSH private key.\u003c/li\u003e\n\u003cli\u003eKubernetes: \u003ccode\u003e~/.kube/config\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eshell history: \u003ccode\u003e.bash_history\u003c/code\u003e, \u003ccode\u003e.zsh_history\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eprocess Linux: \u003ccode\u003eCAP_SYS_PTRACE\u003c/code\u003e, \u003ccode\u003eCAP_SYS_ADMIN\u003c/code\u003e, sensitive FD.\u003c/li\u003e\n\u003cli\u003eprocess Windows: \u003ccode\u003eSeDebugPrivilege\u003c/code\u003e, \u003ccode\u003eSeTcbPrivilege\u003c/code\u003e, elevated token.\u003c/li\u003e\n\u003cli\u003eAI tool: Cursor, Copilot, Codeium, dll.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-bedanya-dengan-secret-scanner-biasa\"\u003e4. Bedanya dengan secret scanner biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-bedanya-dengan-secret-scanner-biasa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003esecret scanner biasa cuma nyari secret di file.\u003c/li\u003e\n\u003cli\u003eOvertrust juga ngecek siapa yang bisa akses secret itu sekarang.\u003c/li\u003e\n\u003cli\u003econtoh: \u003ccode\u003e.env\u003c/code\u003e bisa ke-flag sama secret scanner. Overtrust juga bakal lihat extension auth provider, npm script, atau process privileged.\u003c/li\u003e\n\u003cli\u003emenurut gue, Overtrust lebih mirip \"workstation exposure scanner\".\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-implementasi-nyata\"\u003e5. Implementasi nyata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-implementasi-nyata\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003elocal inspection: jalankan \u003ccode\u003e./build/overtrust\u003c/code\u003e buat audit workstation.\u003c/li\u003e\n\u003cli\u003edemo/tests: ada folder \u003ccode\u003edemo/\u003c/code\u003e buat ngecek fixture bahaya.\u003c/li\u003e\n\u003cli\u003eCI: \u003ccode\u003e--no-tui --report out.json --exit-code\u003c/code\u003e buat pipeline.\u003c/li\u003e\n\u003cli\u003eintegrasi tim: ideal buat preflight sebelum agentic tool jalan atau sebelum scan Deepsec.\u003c/li\u003e\n\u003cli\u003epraktik terbaik: jangan pakai \u003ccode\u003e--exit-code\u003c/code\u003e fail-all tanpa threshold, pakai report JSON buat triage.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-limitasi-dan-false-positive\"\u003e6. Limitasi dan false positive\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-limitasi-dan-false-positive\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOvertrust cuma risk indicator, bukan bukti breach.\u003c/li\u003e\n\u003cli\u003ebeberapa false positif mungkin muncul:\n\u003cul\u003e\n\u003cli\u003eextension auth provider nggak otomatis jahat,\u003c/li\u003e\n\u003cli\u003eDockerfile root nggak otomatis exploit,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecurl | bash\u003c/code\u003e bisa juga buat installer sah,\u003c/li\u003e\n\u003cli\u003eshell history bisa berisi command biasa.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003escore sederhana bikin orientasi gampang, tapi bisa oversimplify.\u003c/li\u003e\n\u003cli\u003eOvertrust cuma bisa baca yang usernya bisa akses. area protected nggak ke-scan.\u003c/li\u003e\n\u003cli\u003erules hardcoded perlu maintenance seiring ekosistem berubah.\u003c/li\u003e\n\u003cli\u003enggak ada threat intel cloud, jadi nggak deteksi reputasi package terbaru.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"7-korelasi-dengan-agentic-coding-dan-deepsec\"\u003e7. Korelasi dengan agentic coding dan Deepsec\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-korelasi-dengan-agentic-coding-dan-deepsec\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ethread cheesecake nanya: \"apa yang bisa dibaca agentic coding tool?\"\u003c/li\u003e\n\u003cli\u003eOvertrust jawab: \"workstation lo sendiri juga rentan.\" \u003c/li\u003e\n\u003cli\u003eDeepsec jawab: \"apakah codebase lo punya vuln?\"\u003c/li\u003e\n\u003cli\u003emenurut gue, mereka saling melengkapi.\u003c/li\u003e\n\u003cli\u003ejalankan Overtrust dulu buat ngecek boundary sebelum kasih agent akses.\u003c/li\u003e\n\u003cli\u003esetelah lingkungan lebih bersih, baru pake Deepsec buat audit kode.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"8-insight-penting\"\u003e8. Insight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-insight-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOvertrust bukan cuma anti-secret leak. Dia ngecek trust boundary workstation.\u003c/li\u003e\n\u003cli\u003edi era agentic tooling, developer sering kasih AI akses lokal tanpa sadar.\u003c/li\u003e\n\u003cli\u003epertanyaan yang lebih penting: \"apa izin process ini?\" bukan sekadar \"apakah provider aman?\"\u003c/li\u003e\n\u003cli\u003erisiko agentic coding termasuk privilege lokal dan trust pada extension.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/cheese-cakee/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.references/overtrust\u003c/code\u003e (local clone dari repo Overtrust)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eREADME.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/walker.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/classifier.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/manifest.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/secrets.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/procscanner_linux.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/scanner/procscanner_win.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/graph/graph.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/report.cpp\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edemo/\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"practical-position\"\u003ePractical position\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-position\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOvertrust cocok buat developer yang pengen tahu apakah workstation mereka terlalu terbuka.\u003c/li\u003e\n\u003cli\u003elebih cocok sebagai audit/preflight daripada blocking gate setiap commit.\u003c/li\u003e\n\u003cli\u003ejangan anggap ini pengganti secret scanner atau pentest.\u003c/li\u003e\n\u003cli\u003eidealnya dipakai bareng secret scanner, SCA, dan Deepsec.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-zettels\"\u003eRelated Zettels\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-zettels\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179968\"\u003eWorkstation trust boundary adalah attack surface utama di era AI-native engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179972\"\u003eSecret exposure bisa terjadi tanpa commit Git\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179979\"\u003eBiaya, sandbox, dan egress adalah concern arsitektur keamanan first-class\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179980\"\u003eKeamanan AI-native adalah kebiasaan harian, bukan event sekali jalan\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179983\"\u003eSandbox dan boundary adalah persyaratan untuk tool agentic aman\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eovertrust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.1777995556481\"\u003eAudit trust boundary lokal sebagai ide keamanan developer\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179968\"\u003eWorkstation trust boundary adalah attack surface utama di era AI-native engineering\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179971\"\u003eDeterministic local scanners melengkapi AI scanners dalam keamanan developer workflow\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179972\"\u003eSecret exposure bisa terjadi tanpa commit Git\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179975\"\u003eRule-based checks tetap penting di era AI-native security\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260505179978\"\u003eCI security gate butuh threshold dan baseline, bukan fail-on-any-finding\u003c/a\u003e\u003c/li\u003e
