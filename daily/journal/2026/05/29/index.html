ps":{"note":{"id":"daily.journal.2026.05.29","title":"2026-05-29","desc":"Refleksi eksperimen Codex macOS sandboxing dan praktik shell bersih untuk menghindari secret env kebocoran.","created":1780042631846,"updated":1780054605246,"tags":["daily","security","codex","sandboxing"],"custom":{},"fname":"daily.journal.2026.05.29","type":"note","vault":{"fsPath":"vault"},"contentHash":"67bead6d61142fa80fa8c2ed83cd2de2","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.29","id":"daily.journal.2026.05.29","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.29","id":"daily.journal.2026.05.29","vaultName":"vault"},"value":"tags.security","alias":"security","xvault":false,"to":{"fname":"tags.security"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.29","id":"daily.journal.2026.05.29","vaultName":"vault"},"value":"tags.codex","alias":"codex","xvault":false,"to":{"fname":"tags.codex"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.29","id":"daily.journal.2026.05.29","vaultName":"vault"},"value":"tags.sandboxing","alias":"sandboxing","xvault":false,"to":{"fname":"tags.sandboxing"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.29","id":"daily.journal.2026.05.29","vaultName":"vault"},"value":"notes.agentic-engineering.codex-macos-sandboxing","position":{"start":{"line":127,"column":3,"offset":5482},"end":{"line":127,"column":55,"offset":5534},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.agentic-engineering.codex-macos-sandboxing"}}],"anchors":{"hari-ini-gue-ngulik-codex-sandbox-di-macos-dari-sudut-env-hygiene":{"type":"header","text":"Hari ini gue ngulik Codex sandbox di macOS dari sudut env hygiene","value":"hari-ini-gue-ngulik-codex-sandbox-di-macos-dari-sudut-env-hygiene","line":15,"column":0,"depth":2},"insight-utama-yang-gue-dapat":{"type":"header","text":"Insight utama yang gue dapat","value":"insight-utama-yang-gue-dapat","line":19,"column":0,"depth":2},"workaround-operasional-yang-gue-rekam":{"type":"header","text":"Workaround operasional yang gue rekam","value":"workaround-operasional-yang-gue-rekam","line":31,"column":0,"depth":2},"setup-codex-lokal-yang-gue-simpan":{"type":"header","text":"Setup Codex lokal yang gue simpan","value":"setup-codex-lokal-yang-gue-simpan","line":49,"column":0,"depth":2},"global-vs-per-repoproject":{"type":"header","text":"Global vs per repo/project","value":"global-vs-per-repoproject","line":87,"column":0,"depth":2},"hasil-eksperimen-yang-gue-ingat":{"type":"header","text":"Hasil eksperimen yang gue ingat","value":"hasil-eksperimen-yang-gue-ingat","line":101,"column":0,"depth":2},"kenapa-ini-penting-buat-workflow-gue":{"type":"header","text":"Kenapa ini penting buat workflow gue","value":"kenapa-ini-penting-buat-workflow-gue","line":109,"column":0,"depth":2},"antirez-gpt-vs-opus-dan-lag-evaluasi-komunitas":{"type":"header","text":"Antirez, GPT vs Opus, dan lag evaluasi komunitas","value":"antirez-gpt-vs-opus-dan-lag-evaluasi-komunitas","line":120,"column":0,"depth":2},"tautan-terkait":{"type":"header","text":"Tautan terkait","value":"tautan-terkait","line":138,"column":0,"depth":2}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-29\"\u003e2026-05-29\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-29\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"hari-ini-gue-ngulik-codex-sandbox-di-macos-dari-sudut-env-hygiene\"\u003eHari ini gue ngulik Codex sandbox di macOS dari sudut env hygiene\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hari-ini-gue-ngulik-codex-sandbox-di-macos-dari-sudut-env-hygiene\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue sudah paham bahwa Seatbelt itu batasan akses proses, bukan secret manager. Yang bikin masalah bukan karena sandbox \"bocor\"; yang bikin masalah adalah kalau gue mulai Codex dari terminal yang sudah punya API key dan token.\u003c/p\u003e\n\u003ch2 id=\"insight-utama-yang-gue-dapat\"\u003eInsight utama yang gue dapat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-utama-yang-gue-dapat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau proses child sudah memegang env var secret dari parent shell, Seatbelt nggak otomatis menariknya lagi. Itu kayak lo sudah ngasih kertas berisi password ke anak, terus lo pasang pagar di sekitar dia: pagar nggak bisa bikin kertas itu hilang.\u003c/p\u003e\n\u003cp\u003eJadi pola yang lebih masuk akal adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejangan mulai Codex dari terminal yang penuh token\u003c/li\u003e\n\u003cli\u003ebersihkan environment dulu dengan \u003ccode\u003eenv -i\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ewhitelist hanya variabel yang aman seperti \u003ccode\u003eHOME\u003c/code\u003e, \u003ccode\u003ePATH\u003c/code\u003e, \u003ccode\u003eSHELL\u003c/code\u003e, \u003ccode\u003eTERM\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ejangan export secret global di \u003ccode\u003e~/.zshrc\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003epakai Keychain/secret manager dengan approval eksplisit bila perlu\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"workaround-operasional-yang-gue-rekam\"\u003eWorkaround operasional yang gue rekam\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workaround-operasional-yang-gue-rekam\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBukan: minta Seatbelt menyensor env.\nIni: mulai Codex dari shell yang bersih.\u003c/p\u003e\n\u003cp\u003eContoh yang gue catat:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003eenv\u003c/span\u003e -i \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eHOME\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$HOME\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003ePATH\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eSHELL\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$SHELL\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  \u003cspan class=\"token assign-left variable\"\u003e\u003cspan class=\"token environment constant\"\u003eTERM\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"token operator\"\u003e=\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"\u003cspan class=\"token environment constant\"\u003e$TERM\u003c/span\u003e\"\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e\\\u003c/span\u003e\n  codex\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSolusi gampangnya: buat \u003ccode\u003ecodex-safe\u003c/code\u003e di \u003ccode\u003e~/.zshrc\u003c/code\u003e, lalu jalankan Codex lewat situ. Itu yang harus jadi kebiasaan untuk repo yang belum sepenuhnya gue percaya.\u003c/p\u003e\n\u003ch2 id=\"setup-codex-lokal-yang-gue-simpan\"\u003eSetup Codex lokal yang gue simpan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#setup-codex-lokal-yang-gue-simpan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue juga nyimpen konfigurasi user-level di \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e supaya perilaku Codex CLI/IDE lebih mirip eksperimen \u003ccode\u003esandbox-exec\u003c/code\u003e:\u003c/p\u003e\n\u003cpre class=\"language-toml\"\u003e\u003ccode class=\"language-toml\"\u003e\u003cspan class=\"token key property\"\u003esandbox_mode\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"workspace-write\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapproval_policy\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"on-request\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eapprovals_reviewer\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"user\"\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003esandbox_workspace_write\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003enetwork_access\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003ewritable_roots\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude_tmpdir_env_var\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude_slash_tmp\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003etrue\u003c/span\u003e\n\n\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token table class-name\"\u003eshell_environment_policy\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einherit\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"core\"\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eignore_default_excludes\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token boolean\"\u003efalse\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eexclude\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*KEY*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*TOKEN*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*SECRET*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*PASSWORD*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"*CREDENTIAL*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"AWS_*\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"OPENAI_API_KEY\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GITHUB_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"GH_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"NPM_TOKEN\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"DATABASE_URL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n  \u003cspan class=\"token string\"\u003e\"PGPASSWORD\"\u003c/span\u003e\n\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003einclude_only\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\u003cspan class=\"token key property\"\u003eset\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIni baseline yang gue pake: workspace masih bisa dikerjain, network dimatikan, env sensitif tidak diwariskan, dan root tambahan cuma dibuka kalau perlu. Kalau repo asing, gue lebih ketat lagi dengan \u003ccode\u003einherit = \"none\"\u003c/code\u003e dan \u003ccode\u003einclude_only\u003c/code\u003e minimal. Baru kalau ada tool yang benar-benar butuh env spesifik, gue tambahkan satu per satu.\u003c/p\u003e\n\u003ch2 id=\"global-vs-per-repoproject\"\u003eGlobal vs per repo/project\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#global-vs-per-repoproject\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue sekarang melihatnya sebagai layer konfigurasi Codex, bukan setting sandbox macOS mentah. Global config di \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e adalah sabuk pengaman default yang harus konservatif. Per-project config di \u003ccode\u003e.codex/config.toml\u003c/code\u003e adalah izin kerja khusus untuk repo tertentu, dan hanya boleh dipakai kalau repo itu dipercaya.\u003c/p\u003e\n\u003cp\u003eProfile config \u003ccode\u003e~/.codex/.config.toml\u003c/code\u003e berguna untuk mode kerja yang berbeda—misalnya \u003ccode\u003eparanoid\u003c/code\u003e untuk repo asing atau \u003ccode\u003einternal\u003c/code\u003e untuk repo kantor. CLI flags paling kuat; pakai untuk override satu sesi tanpa mengubah config.\u003c/p\u003e\n\u003cp\u003eJadi prinsipnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eglobal = baseline aman\u003c/li\u003e\n\u003cli\u003eper-project = exception spesifik\u003c/li\u003e\n\u003cli\u003eprofile = mode kerja\u003c/li\u003e\n\u003cli\u003eCLI flag = override sementara\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu yang bikin setup Codex lebih sehat daripada sekadar nge-DIY \u003ccode\u003esandbox-exec\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"hasil-eksperimen-yang-gue-ingat\"\u003eHasil eksperimen yang gue ingat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hasil-eksperimen-yang-gue-ingat\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esandbox-exec\u003c/code\u003e bisa menahan akses file/network di luar workspace.\u003c/li\u003e\n\u003cli\u003etapi \u003ccode\u003eFAKE_API_KEY\u003c/code\u003e masih muncul kalau env dari parent shell ikut.\u003c/li\u003e\n\u003cli\u003eworkspace writable tetap bisa diubah kalau profile mengizinkan.\u003c/li\u003e\n\u003cli\u003enetwork deny bisa memblokir eksfiltrasi, tapi env var tetap bisa dibaca kalau sudah diwariskan.\u003c/li\u003e\n\u003cli\u003ecurrent working directory juga penting: kalau shell dijalankan dari path yang tidak diizinkan, buka shell bisa error \u003ccode\u003egetcwd\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-ini-penting-buat-workflow-gue\"\u003eKenapa ini penting buat workflow gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-penting-buat-workflow-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKarena gue mau pakai Codex lokal tanpa ngasih false sense of security. Sandbox itu bagian yang penting, tapi bukan satu-satunya. Gue butuh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eshell bersih sebagai lapisan pertama\u003c/li\u003e\n\u003cli\u003eapproval policy untuk network/escalation\u003c/li\u003e\n\u003cli\u003egit diff untuk review perubahan workspace\u003c/li\u003e\n\u003cli\u003esecret manager daripada export global\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau repo asing atau mencurigakan, gue masih pakai container/VM/remote sandbox.\u003c/p\u003e\n\u003ch2 id=\"antirez-gpt-vs-opus-dan-lag-evaluasi-komunitas\"\u003eAntirez, GPT vs Opus, dan lag evaluasi komunitas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#antirez-gpt-vs-opus-dan-lag-evaluasi-komunitas\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://x.com/antirez/status/2060017203592761819\"\u003ehttps://x.com/antirez/status/2060017203592761819\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eHari ini gue juga nyimak tweet Antirez tentang bagaimana internet baru “ngeh” kalau GPT sudah lebih baik dari Opus. Gue baca itu bukan cuma soal model, tapi soal proses opini di komunitas AI.\u003c/p\u003e\n\u003cp\u003eIntinya: dia membacanya sebagai kritik terhadap lag evaluasi. Model frontier berubah dalam hitungan minggu atau bulan, tapi opini orang sering masih stuck di pengalaman lama, brand reputation, atau benchmark yang telat.\u003c/p\u003e\n\u003cp\u003eYang gue tangkap:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAntirez tidak cuma bilang “GPT lebih bagus”. Dia bilang: kenapa hal yang menurut dia obvious butuh berbulan-bulan supaya komunitas menyadarinya.\u003c/li\u003e\n\u003cli\u003eBanyak orang tetap nempel ke Opus karena brand memory, bubble informasi, dan vibe Twitter.\u003c/li\u003e\n\u003cli\u003eBenchmark publik lama sering terlalu dangkal untuk pekerjaan engineering nyata.\u003c/li\u003e\n\u003cli\u003eDeepSWE muncul sebagai boundary baru yang coba ukur agentic coding panjang, tapi itu tetap satu lensa, bukan jawaban final.\u003c/li\u003e\n\u003cli\u003eYang paling penting: kalau mau benar-benar tahu, punya pipeline evaluasi sendiri terhadap task nyata lo lebih kuat daripada cuma ngikutin leaderboard atau tweet.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue sendiri pakai ini sebagai reminder: jangan anggap model “selalu sama” dari pengalaman beberapa bulan lalu. Kalau gue cuma pakai benchmark atau opini orang lain, kemungkinan besar gue akan ketinggalan.\u003c/p\u003e\n\u003ch2 id=\"tautan-terkait\"\u003eTautan terkait\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tautan-terkait\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.codex-macos-sandboxing\"\u003eCodex macOS sandboxing dengan Seatbelt\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecodex (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esandboxing (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,
