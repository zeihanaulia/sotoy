alue":"secretfile-scanning","line":82,"column":0,"depth":3},"manifestscript-auditing":{"type":"header","text":"Manifest/script auditing","value":"manifestscript-auditing","line":92,"column":0,"depth":3},"hostprocess-monitoring":{"type":"header","text":"Host/process monitoring","value":"hostprocess-monitoring","line":100,"column":0,"depth":3},"workstation--endpoint-security":{"type":"header","text":"Workstation / endpoint security","value":"workstation--endpoint-security","line":109,"column":0,"depth":3},"apakah-ini-ide-bagus-yang-gak-kepikiran-banyak-orang":{"type":"header","text":"Apakah ini ide bagus yang gak kepikiran banyak orang?","value":"apakah-ini-ide-bagus-yang-gak-kepikiran-banyak-orang","line":119,"column":0,"depth":2},"kesimpulan-gue":{"type":"header","text":"Kesimpulan gue","value":"kesimpulan-gue","line":129,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":142,"column":0,"depth":2},"rekomendasi-note":{"type":"header","text":"Rekomendasi note","value":"rekomendasi-note","line":152,"column":0,"depth":2},"related-notes":{"type":"header","text":"Related Notes","value":"related-notes","line":158,"column":0,"depth":2}},"children":[],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"evaluasi-overtrust-konsep-bagus-tapi-rule-based-dan-belum-all-cover\"\u003eEvaluasi Overtrust: konsep bagus tapi rule-based dan belum all-cover\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#evaluasi-overtrust-konsep-bagus-tapi-rule-based-dan-belum-all-cover\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat Overtrust sebagai proof-of-concept yang menarik: dia fokus ke workstation trust boundary, bukan cuma secret scanning. Itu ide bagus dan agak under-explored di dunia agentic tooling.\u003c/p\u003e\n\u003cp\u003eTapi jangan salah: implementation-nya memang hardcoded, dan itu bikin dia lebih cocok sebagai scanner rule-based dibandingkan produk mature yang comprehensive.\u003c/p\u003e\n\u003ch2 id=\"apa-yang-sudah-dia-cover\"\u003eApa yang sudah dia cover\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-sudah-dia-cover\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDari kode dan README, Overtrust ngelakuin beberapa hal penting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003escan filesystem lokal dan ignore path dengan rule \u003ccode\u003e.overtrustignore\u003c/code\u003e / \u003ccode\u003e.trustignore\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eklasifikasi file lewat path heuristik dan magic bytes (\u003ccode\u003eclassifier.cpp\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003eparse manifest VS Code, npm, Dockerfile untuk deteksi ekstensi, install script, dan \u003ccode\u003ecurl | bash\u003c/code\u003e (\u003ccode\u003emanifest.cpp\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003esecret detection dengan keyword pre-filter + regex + entropy + false-positive guard (\u003ccode\u003esecrets.cpp\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003eprocess scan di Linux untuk capabilities, seccomp, sensitive FD, dan AI tool detection (\u003ccode\u003eprocscanner_linux.cpp\u003c/code\u003e)\u003c/li\u003e\n\u003cli\u003eoutput report + trust score + JSON export + optional exit-code\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eItu kombinasi yang menarik karena dia nyambungin dua domain: file-level exposure dan runtime process privilege.\u003c/p\u003e\n\u003ch2 id=\"apakah-ini-sudah-meng-cover-semua\"\u003eApakah ini sudah meng-cover semua?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apakah-ini-sudah-meng-cover-semua\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJawabannya: nggak. Overtrust sengaja hardcoded, jadi dia hanya cover apa yang sudah dituliskan di kodenya.\u003c/p\u003e\n\u003cp\u003eContoh coverage yang dipastikan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eaws credentials\u003c/code\u003e di \u003ccode\u003e~/.aws/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ekubeconfig\u003c/code\u003e di \u003ccode\u003e~/.kube/config\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eshell history file\u003c/li\u003e\n\u003cli\u003eSSH private key patterns\u003c/li\u003e\n\u003cli\u003eDockerfile root / \u003ccode\u003ecurl | bash\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eVS Code extension auth providers, terminal access, debugger, always-on activation\u003c/li\u003e\n\u003cli\u003eknown AI tool names seperti Cursor, Copilot, Codeium\u003c/li\u003e\n\u003cli\u003epattern secret seperti \u003ccode\u003esk-\u003c/code\u003e, \u003ccode\u003eghp_\u003c/code\u003e, \u003ccode\u003exoxb-\u003c/code\u003e, \u003ccode\u003ePEM\u003c/code\u003e, dan lain-lain\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKarena semua itu hardcoded, risiko utamanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekalau secret atau tool baru muncul, Overtrust nggak akan tangkep sampai rulesnya diupdate\u003c/li\u003e\n\u003cli\u003ekalau file disimpan di lokasi tak terduga atau pakai nama nggak standar, classifier bisa miss\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eis_ai_tool()\u003c/code\u003e hanya berdasarkan nama proses yang disebutkan di kode\u003c/li\u003e\n\u003cli\u003eprocess scan cuma lihat privilege dan sensitive FDs, bukan apakah data benar-benar keluar lewat jaringan\u003c/li\u003e\n\u003cli\u003etidak ada threat intel/reputation, jadi hanya indikator statis\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi jangan kira ini all-cover. Dia cover sejumlah domain penting dengan cara deterministik, tapi dia bukan oracle workstation security.\u003c/p\u003e\n\u003ch2 id=\"flaw-utama-yang-gue-tangkep\"\u003eFlaw utama yang gue tangkep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#flaw-utama-yang-gue-tangkep\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-rule-based-bukan-learning\"\u003e1. Rule-based, bukan learning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-rule-based-bukan-learning\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBukan flaw kalau memang tujuannya deterministik. Tapi efeknya adalah maintenance burden dan blind spot. \u003ccode\u003esecrets.cpp\u003c/code\u003e pake regex + entropy + FP guard — bagus, tapi kalau format secret baru atau prefix baru muncul, lo harus patch kodenya.\u003c/p\u003e\n\u003ch3 id=\"2-heuristik-path-bisa-dilewati\"\u003e2. Heuristik path bisa dilewati\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-heuristik-path-bisa-dilewati\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau attacker/misal dev menyimpan credential di \u003ccode\u003e~/config/aws.config\u003c/code\u003e bukan \u003ccode\u003e~/.aws/credentials\u003c/code\u003e, Overtrust bisa saja miss. Sama dengan manifest: kalau extension pakai nama package lain dan ngasih auth capability tanpa kebiasaan \u003ccode\u003econtributes.authentication\u003c/code\u003e, tool ini bisa terlewat.\u003c/p\u003e\n\u003ch3 id=\"3-ai-tool-detection-terbatas\"\u003e3. AI tool detection terbatas\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-ai-tool-detection-terbatas\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003e\u003ccode\u003eis_ai_tool()\u003c/code\u003e cuma cek nama dan command line matching string seperti \u003ccode\u003ecopilot\u003c/code\u003e, \u003ccode\u003ecursor\u003c/code\u003e, \u003ccode\u003eclaude\u003c/code\u003e. Ini gampang dilewati dengan nama proses lain atau wrapper script.\u003c/p\u003e\n\u003ch3 id=\"4-process-scan-masih-statis\"\u003e4. Process scan masih statis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-process-scan-masih-statis\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eProses yang buka sensitive FD atau punya \u003ccode\u003eCAP_SYS_ADMIN\u003c/code\u003e itu warning bagus, tapi belum berarti exploit path selesai. Kalau process sudah punya akses tapi tidak benar-benar menggunakan data, nilai signal masih sulit.\u003c/p\u003e\n\u003ch3 id=\"5-kurang-konteks-jaringan-dan-runtime\"\u003e5. Kurang konteks jaringan dan runtime\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-kurang-konteks-jaringan-dan-runtime\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eOvertrust fokus workstation, tapi dia nggak lihat koneksi jaringan aktif, service binding, atau apakah app sedang mengekspose data. Di banyak threat model, itu penting.\u003c/p\u003e\n\u003ch3 id=\"6-no-policyconfig-customization-beyond-ignore\"\u003e6. No policy/config customization beyond ignore\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-no-policyconfig-customization-beyond-ignore\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDia punya ignore file. Tapi kalau lo butuh whitelist, severity tuning, atau custom rules, nggak jelas tersedia.\u003c/p\u003e\n\u003ch2 id=\"tools-sejenis-yang-lebih-mature\"\u003eTools sejenis yang lebih mature\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tools-sejenis-yang-lebih-mature\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau dilihat domainnya, Overtrust sejatinya berdiri di tengah beberapa kategori yang jauh lebih matang.\u003c/p\u003e\n\u003ch3 id=\"secretfile-scanning\"\u003eSecret/file scanning\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#secretfile-scanning\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/trufflesecurity/trufflehog\"\u003etruffleHog\u003c/a\u003e: scanner yang fokus ke history Git dan file system untuk pattern secret, credentials, dan konfigurasi sensitif.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/zricethezav/gitleaks\"\u003egitleaks\u003c/a\u003e: secret scanner untuk repo dan pipeline dengan rules library yang bisa di-custom.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/Yelp/detect-secrets\"\u003edetect-secrets\u003c/a\u003e: pre-commit secret detection engine yang lebih kuat karena bisa integrate ke workflow Git.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/awslabs/git-secrets\"\u003egit-secrets\u003c/a\u003e: AWS-centric secret prevention di Git hooks.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/betterleaks/betterleaks\"\u003ebetterleaks\u003c/a\u003e: secrets scanner modern dengan fokus performa dan konfigurabilitas.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/newrelic/rusty-hog\"\u003erusty-hog\u003c/a\u003e: secret scanning berbasis Rust untuk kecepatan dan rule set yang kuat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOvertrust punya overlap di bagian secret detection, tapi targetnya beda. Overtrust bukan cuma scan file; dia juga hubungkan secret dengan file type, manifest, dan process lokal. Tool mature di atas lebih bagus untuk scan repo/commit history, aturan secret yang kontinu, dan false-positive tuning.\u003c/p\u003e\n\u003ch3 id=\"manifestscript-auditing\"\u003eManifest/script auditing\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#manifestscript-auditing\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/hadolint/hadolint\"\u003ehadolint\u003c/a\u003e: Dockerfile linter yang cek best practice, compliance, dan potensi risk.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm audit\u003c/code\u003e: built-in audit untuk package dependency dan vulnerability di ekosistem npm.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/replicatedhq/dockerfilelint\"\u003edockerfilelint\u003c/a\u003e: linter Dockerfile lain dengan rule-based audit.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm-package-arg\u003c/code\u003e: tooling parse/manipulasi package spec, berguna untuk audit package manifest.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOvertrust juga parse manifest dan cari pola berbahaya seperti \u003ccode\u003ecurl | bash\u003c/code\u003e, extension auth provider, dan npm install script. Bedanya: tool khusus seperti \u003ccode\u003ehadolint\u003c/code\u003e atau \u003ccode\u003enpm audit\u003c/code\u003e punya coverage rule library jauh lebih luas, sementara Overtrust fokus ke kondisi lokal developer yang bisa jadi trigger eksfiltrasi atau build-time risk.\u003c/p\u003e\n\u003ch3 id=\"hostprocess-monitoring\"\u003eHost/process monitoring\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hostprocess-monitoring\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/falcosecurity/falco\"\u003eFalco\u003c/a\u003e: real-time runtime security monitoring dengan rule untuk proses, syscall, dan perilaku host.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/osquery/osquery\"\u003eosquery\u003c/a\u003e: query-based visibility untuk state host, proses, dan konfigurasi.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/draios/sysdig\"\u003esysdig\u003c/a\u003e: observability runtime untuk proses, network, dan system call.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eauditd\u003c/code\u003e: Linux audit daemon untuk event security dan perubahan file.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eProcess Explorer\u003c/code\u003e: tool Windows Sysinternals untuk inspeksi runtime process dan handle.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBagian process scan Overtrust paling mirip domain ini, tapi sangat terbatas. Overtrust lebih ke snapshot lokal dan flags privilege/sensitive FD; bukan continuous detection atau alerting runtime. Falco/osquery/sysdig/auditd punya observability jauh lebih kaya dan mature untuk threat hunting.\u003c/p\u003e\n\u003ch3 id=\"workstation--endpoint-security\"\u003eWorkstation / endpoint security\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#workstation--endpoint-security\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eCrowdStrike dan SentinelOne: EDR komersial dengan agent, telemetry, threat intelligence, dan respons otomatis.\u003c/li\u003e\n\u003cli\u003eGitGuardian Desktop: desktop-focused secret monitoring yang mendeteksi secret di file lokal dan clipboard.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi sini perbedaan paling besar: Overtrust adalah open-source audit prototype yang jalan sekali dan lokal. EDR produk mature punya cloud intelligence, deteksi behaviour, dan policy enforcement. GitGuardian Desktop lebih dekat secara goal secret detection, tapi bukan trust boundary audit yang menggabungkan process + manifest + secret dalam satu scan.\u003c/p\u003e\n\u003cp\u003eDari pencarian GitHub, ada juga beberapa open-source lokal workstation/config scanners, tapi belum besar dan biasanya sangat spesifik. Contohnya \u003ccode\u003eHost-Config-Review-Scanner\u003c/code\u003e atau proyek audit config workstation; mereka lebih niche dan belum mature sebagai produk umum.\u003c/p\u003e\n\u003cp\u003eIntinya: komponen dasar Overtrust bukan baru. Yang unik adalah packaging file, manifest, secret, dan process scan jadi satu audit lokal untuk developer workstation. Itu masih niche, bukan benar-benar tanpa precedent.\u003c/p\u003e\n\u003ch2 id=\"apakah-ini-ide-bagus-yang-gak-kepikiran-banyak-orang\"\u003eApakah ini ide bagus yang gak kepikiran banyak orang?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apakah-ini-ide-bagus-yang-gak-kepikiran-banyak-orang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIya dan nggak.\u003c/p\u003e\n\u003cp\u003eIya, karena ide \"scan workstation sebelum ngasih agentic tool akses\" itu bagus. Kebanyakan engineering security masih fokus ke repo atau pipeline, sementara agentic tools benar-benar memperluas attack surface ke workstation. Itu masih relatif under-explored.\u003c/p\u003e\n\u003cp\u003eTidak, karena komponennya sendiri bukan ide baru. Secret scanners, manifest auditors, dan process/host monitoring sudah ada, dan bahkan ada beberapa repo open-source yang mulai ngejar local workstation audit. Yang agak lebih unik adalah packaging keduanya jadi satu \"local trust boundary scanner\" untuk developer.\u003c/p\u003e\n\u003cp\u003eJadi kalau lo tanya apakah ini sepenuhnya out-of-the-box: tidak. Kalau lo tanya apakah ini arah yang layak diseriusin di konteks agentic coding, jawabannya iya.\u003c/p\u003e\n\u003ch2 id=\"kesimpulan-gue\"\u003eKesimpulan gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan-gue\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOvertrust itu bagus sebagai eksperimen dan direction.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eStrength: local, deterministic, berjalan tanpa cloud, fokus trust boundary.\u003c/li\u003e\n\u003cli\u003eWeakness: rule-based, hardcoded, blind spot untuk format/penamaan baru, dan tidak punya runtime network context.\u003c/li\u003e\n\u003cli\u003ePosisi: lebih layak disebut prototype/tool audit kerja daripada produk mature.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo mau ambil pelajaran dari Overtrust, hal yang worth diadopsi adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eaudit lokal itu penting untuk agentic workflows\u003c/li\u003e\n\u003cli\u003ejangan cuma cek secret files; cek process privilege dan tool ownership juga\u003c/li\u003e\n\u003cli\u003ehardcoded rules bisa cepat deployment, tapi butuh pipeline update kalau threat berubah\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/cheese-cakee/overtrust\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e.references/overtrust\u003c/code\u003e (local clone dari repo Overtrust)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/trufflesecurity/trufflehog\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/zricethezav/gitleaks\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/Yelp/detect-secrets\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/falcosecurity/falco\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://github.com/osquery/osquery\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ehttps://www.gitguardian.com/desktop\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"rekomendasi-note\"\u003eRekomendasi note\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rekomendasi-note\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003enotes.security.overtrust\u003c/code\u003e jadi summary high-level,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enotes.security.overtrust.workflow-detail\u003c/code\u003e jadi detail implementasi,\u003c/li\u003e\n\u003cli\u003enote ini cocok jadi evaluasi kekuatan vs flaw.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"related-notes\"\u003eRelated Notes\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-notes\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust\"\u003eOvertrust: lokal workstation scanner untuk trust boundary, bukan bug scanner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.overtrust.workflow-detail\"\u003eOvertrust workflow detail: cara kerja local scanner dan trust boundary\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.agentic-coding-permission-boundary\"\u003eAgentic coding permission boundary dan risiko filesystem lokal\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.deepsec-docs\"\u003eDeepsec docs: workflow harness, bu
