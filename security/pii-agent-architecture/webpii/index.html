t":1081},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.security.pii-agent-architecture"}},{"from":{"fname":"notes.security.pii-agent-architecture","id":"notes.security.pii-agent-architecture","vaultName":"vault"},"type":"backlink","position":{"start":{"line":60,"column":172,"offset":4924},"end":{"line":60,"column":220,"offset":4972},"indent":[]},"value":"notes.security.pii-agent-architecture.webpii"}],"anchors":{"problem":{"type":"header","text":"Problem","value":"problem","line":16,"column":0,"depth":2},"solution":{"type":"header","text":"Solution","value":"solution","line":19,"column":0,"depth":2},"real-case-implementation":{"type":"header","text":"Real case implementation","value":"real-case-implementation","line":22,"column":0,"depth":2},"relevance":{"type":"header","text":"Relevance","value":"relevance","line":25,"column":0,"depth":2}},"children":[],"parent":"notes.security.pii-agent-architecture","data":{}},"body":"\u003ch1 id=\"webpii-visual-pii-detection-for-computer-use-agents\"\u003eWebPII: Visual PII Detection for Computer-Use Agents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#webpii-visual-pii-detection-for-computer-use-agents\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"problem\"\u003eProblem\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#problem\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWebPII menggarisbawahi bahwa privacy agent sering mengabaikan PII visual. Screenshot UI atau form filling dapat berisi nama, alamat, email, dan data sensitif lainnya yang tidak terlihat oleh filter teks biasa.\u003c/p\u003e\n\u003ch2 id=\"solution\"\u003eSolution\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#solution\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaper ini menyediakan benchmark 44.865 gambar UI e-commerce yang dilabeli PII secara visual. WebPII mendorong penggunaan OCR-aware PII detection, visual layout understanding, dan kontekstualisasi untuk mengenali data sensitif dalam screenshot.\u003c/p\u003e\n\u003ch2 id=\"real-case-implementation\"\u003eReal case implementation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#real-case-implementation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam implementasi nyata, agent screen-reading atau UI automation harus menambahkan lapisan sanitasi screenshot sebelum melakukan OCR atau analisis. Setelah PII terdeteksi secara visual, sistem dapat meredaksi atau memutuskan apakah screenshot boleh diproses lebih lanjut.\u003c/p\u003e\n\u003ch2 id=\"relevance\"\u003eRelevance\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevance\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eWebPII memperluas arsitektur PII filter ke pipeline visual. Untuk agent berbasis PC atau browser, itu berarti data layar dan form input harus dilindungi sama seriusnya dengan teks prompt.\u003c/p\u003e\n\u003cp\u003eOriginal paper: \u003ca href=\"https://arxiv.org/abs/2603.17357\"\u003ehttps://arxiv.org/abs/2603.17357\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture\"\u003eArsitektur PII filter dan security agent\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esecurity (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epii (Private)\u003c/a\u003e\u003c/
