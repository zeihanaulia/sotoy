ps":{"note":{"id":"daily.journal.2026.05.15","title":"2026-05-15","desc":"Refleksi baca Escaping the Build Trap dan implikasinya untuk product thinking.","updated":1778806126293,"created":1778804841854,"tags":["daily","product-management","book"],"custom":{},"fname":"daily.journal.2026.05.15","type":"note","vault":{"fsPath":"vault"},"contentHash":"78b24186aa800d1ded398677aa7fb635","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"tags.product-management","alias":"product-management","xvault":false,"to":{"fname":"tags.product-management"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"tags.book","alias":"book","xvault":false,"to":{"fname":"tags.book"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"book-summaries.escaping-the-build-trap","position":{"start":{"line":23,"column":23,"offset":1208},"end":{"line":23,"column":65,"offset":1250},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.escaping-the-build-trap"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"book-summaries.escaping-the-build-trap","position":{"start":{"line":47,"column":3,"offset":2315},"end":{"line":47,"column":45,"offset":2357},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"book-summaries.escaping-the-build-trap"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"handbook.product-thinking.from-feature-to-service-design","position":{"start":{"line":48,"column":3,"offset":2476},"end":{"line":48,"column":63,"offset":2536},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"handbook.product-thinking.from-feature-to-service-design"}},{"type":"wiki","from":{"fname":"daily.journal.2026.05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"value":"notes.saas.product-vs-service","position":{"start":{"line":49,"column":3,"offset":2618},"end":{"line":49,"column":36,"offset":2651},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"notes.saas.product-vs-service"}}],"anchors":{"baca-escaping-the-build-trap":{"type":"header","text":"Baca Escaping the Build Trap","value":"baca-escaping-the-build-trap","line":12,"column":0,"depth":2},"struktur-utama-buku":{"type":"header","text":"Struktur utama buku","value":"struktur-utama-buku","line":23,"column":0,"depth":2},"insight-penting-yang-gue-tahan":{"type":"header","text":"Insight penting yang gue tahan","value":"insight-penting-yang-gue-tahan","line":35,"column":0,"depth":2},"relevansi-buat-saas-3-bulan":{"type":"header","text":"Relevansi buat SaaS 3 bulan","value":"relevansi-buat-saas-3-bulan","line":43,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat Juga","value":"lihat-juga","line":55,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":61,"column":0,"depth":2}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-15\"\u003e2026-05-15\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-15\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"baca-escaping-the-build-trap\"\u003eBaca \u003cem\u003eEscaping the Build Trap\u003c/em\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-escaping-the-build-trap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHari ini gue baca \u003cem\u003eEscaping the Build Trap\u003c/em\u003e oleh Melissa Perri. Inti yang paling nempel adalah: banyak tim merasa produktif karena backlog jalan, sprint penuh, dan fitur rilis rutin. Padahal satu-satunya yang benar-benar berarti adalah apakah kerja itu mengubah perilaku user dan hasil bisnis.\u003c/p\u003e\n\u003cp\u003eGue jadi lebih jelas bedain antara dua hal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eoutput = apa yang dibangun: fitur, halaman, API, dashboard, aplikasi.\u003c/li\u003e\n\u003cli\u003eoutcome = perubahan nyata: user lebih cepat selesai, conversion naik, cost turun, churn turun.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau cuma ngukur “apa yang selesai”, kita gampang masuk ke build trap. Kalau ngukur “masalah customer apa yang kita selesaikan dan dampaknya apa”, kita mulai bergerak ke product-led thinking.\u003c/p\u003e\n\u003ch2 id=\"struktur-utama-buku\"\u003eStruktur utama buku\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#struktur-utama-buku\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuku ini terasa ditulis seperti perjalanan keluar dari jebakan itu:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ediagnosis: apa itu build trap dan apa yang salah dengan sistem value.\u003c/li\u003e\n\u003cli\u003eperan: siapa yang bisa bantu organisasi berpikir benar.\u003c/li\u003e\n\u003cli\u003estrategy: bagaimana visi dan keputusan nyambung.\u003c/li\u003e\n\u003cli\u003eprocess: gimana tim belajar dari problem sebelum langsung bangun solusi.\u003c/li\u003e\n\u003cli\u003eorganisasi: gimana sistem reward, budgeting, dan safety bikin product thinking bertahan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eBagian ini dibahas di \u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"insight-penting-yang-gue-tahan\"\u003eInsight penting yang gue tahan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting-yang-gue-tahan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKalau mindset-nya masih project, ukuran suksesnya selesai. Kalau mindset-nya product, ukuran suksesnya dampak.\u003c/li\u003e\n\u003cli\u003eRole PM baru berguna kalau organisasinya outcome-driven; kalau nggak, PM cuma jadi penjaga backlog.\u003c/li\u003e\n\u003cli\u003eStrategy itu bukan slogan. Strategy adalah sistem keputusan untuk menentukan siapa customer kita, masalah mana yang penting, dan trade-off yang mau kita ambil.\u003c/li\u003e\n\u003cli\u003eProses product sehat itu memisahkan problem space dan solution space. Jangan lompat ke solusi sebelum paham masalah.\u003c/li\u003e\n\u003cli\u003eProduct-led organization butuh insentif yang mendukung outcome, bukan reward output.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"relevansi-buat-saas-3-bulan\"\u003eRelevansi buat SaaS 3 bulan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevansi-buat-saas-3-bulan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eYang paling berharga adalah pertanyaan awalnya berubah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esiapa user utama?\u003c/li\u003e\n\u003cli\u003emoment apa yang paling nyakitin buat mereka?\u003c/li\u003e\n\u003cli\u003eoutcome apa yang mereka butuh?\u003c/li\u003e\n\u003cli\u003eperubahan perilaku apa yang jadi tanda produk berguna?\u003c/li\u003e\n\u003cli\u003efitur minimum apa yang bisa membuktikan perubahan itu?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lo mulai dari fitur daftar belanja, lo bisa gampang banget masuk ke jebakan “tambah fitur biar kelihatan lengkap”.\u003c/p\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat Juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e — ringkasan \u003cem\u003eEscaping the Build Trap\u003c/em\u003e dengan fokus ke struktur diagnosis → role → strategy → process → organization\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.from-feature-to-service-design\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003c/a\u003e — learning path yang menjembatani buku ini dengan discovery dan service design\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — pembahasan product vs service di konteks SaaS\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue lihat buku ini sebagai reminder bahwa product management bukan soal bikin roadmap atau kelarinnya tiket. Ini soal nyambungin problem customer, outcome bisnis, strategi, eksperimen, dan delivery supaya kerja tim benar-benar bikin value.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct-management (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebook (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vau
