=\"anchor-heading icon-link\" href=\"#mapping-per-komentar-di-thread-mario-zechner-tentang-agentic-coding\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"konteks\"\u003eKonteks\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#konteks\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eIni bukan ringkasan umum lagi. Ini mapping per komentar untuk melihat perbedaan posisi, asumsi, dan arah argumen satu per satu di thread Mario Zechner.\u003c/p\u003e\n\u003cp\u003eSaya mengelompokkan keempat poros utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esetuju kuat dengan Lars\u003c/li\u003e\n\u003cli\u003esetuju tapi menambah nuansa\u003c/li\u003e\n\u003cli\u003eskeptis / kontra\u003c/li\u003e\n\u003cli\u003emeta / pinggiran\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"1-mario-zechner--posisi-awal-thread\"\u003e1. Mario Zechner — posisi awal thread\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-mario-zechner--posisi-awal-thread\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\"i really like the pain avoidance angle. slots into my ‘pain/friction is when you learn’ angle. when combined \u003e cognitive debt.\"\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nMario melihat inti argumen dari Lars sebagai \u003cstrong\u003epain avoidance\u003c/strong\u003e. Dia bukan sekadar bilang AI berisiko, tapi menyorot bahwa agentic workflow membuat manusia menghindari bagian kerja yang sebenarnya bikin mereka belajar.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efriction adalah medium belajar.\u003c/li\u003e\n\u003cli\u003ejika friction dihapus total, learning tertekan.\u003c/li\u003e\n\u003cli\u003eada utang pemahaman yang menumpuk di kepala.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke learning,\u003c/li\u003e\n\u003cli\u003efokus ke psikologi kerja,\u003c/li\u003e\n\u003cli\u003efokus ke konsekuensi jangka panjang berupa cognitive debt.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"2-andré-barbosa--ai-seperti-ngintip-jawaban\"\u003e2. André Barbosa — AI seperti ngintip jawaban\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-andré-barbosa--ai-seperti-ngintip-jawaban\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eUsing AI reminds me of just looking up the solution to a problem... you get the solution, but if you don't actually solve the problem yourself, you don't acquire the skill to solve similar problems\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nAndré setuju kuat dengan Lars, tapi menurunkan debat ke analogi pedagogis yang sederhana.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emendapatkan jawaban tidak sama dengan membangun kemampuan.\u003c/li\u003e\n\u003cli\u003eskill terbentuk lewat proses problem solving langsung.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke learning,\u003c/li\u003e\n\u003cli\u003efokus ke skill acquisition individu,\u003c/li\u003e\n\u003cli\u003efokus ke mekanisme pembelajaran: melihat jawaban vs mengerjakan sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"3-leo-tavares--pain-avoidance-ke-mental-model\"\u003e3. Leo Tavares — pain avoidance ke mental model\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-leo-tavares--pain-avoidance-ke-mental-model\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eEvery shortcut past understanding the system becomes architectural debt you can't see until it compounds. The real skill isn't steering agents — it's maintaining the mental model that tells you when to stop trusting them.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nLeo juga setuju kuat, tetapi mengangkat argumen ke level yang lebih tajam: mental model.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eshortcut melewati understanding adalah debt.\u003c/li\u003e\n\u003cli\u003eskill utama adalah menjaga mental model, bukan sekadar mengoperasikan agent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke quality,\u003c/li\u003e\n\u003cli\u003efokus ke trust boundary,\u003c/li\u003e\n\u003cli\u003efokus ke kapan harus berhenti percaya AI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"4-tg--jarak-dari-artifact-merusak-model-kepala\"\u003e4. TG — jarak dari artifact merusak model kepala\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-tg--jarak-dari-artifact-merusak-model-kepala\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eWorkflows that put distance between the engineer and the artifacts produced tend to corrupt the mental model of the codebase in the engineer’s head... poor software quality and slower velocity.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nTG setuju kuat dan membuatnya lebih operasional.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edistance dari artifact merusak pemahaman codebase.\u003c/li\u003e\n\u003cli\u003ehasil jangka panjangnya adalah quality buruk dan velocity melambat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke workflow design,\u003c/li\u003e\n\u003cli\u003efokus ke consequences pada kualitas dan kecepatan,\u003c/li\u003e\n\u003cli\u003emenolak narasi speed semata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"5-sergii-guslystyi--comprehension-debt\"\u003e5. Sergii Guslystyi — comprehension debt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-sergii-guslystyi--comprehension-debt\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe framing I landed on was comprehension debt: every cycle where a developer skips deep engagement, their capacity to catch problems in the next cycle erodes a little.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nSergii setuju kuat, tetapi memberi istilah yang lebih presisi: comprehension debt.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edeep engagement menghasilkan kapasitas menangkap masalah.\u003c/li\u003e\n\u003cli\u003esetiap siklus yang dilewati mengikis kemampuan itu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke learning quality,\u003c/li\u003e\n\u003cli\u003efokus ke konsekuensi iteratif,\u003c/li\u003e\n\u003cli\u003efokus ke erosion di kepala engineer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"6-youdontcare-klotzsche_--generalisasi-ke-leadership\"\u003e6. YouDontCare (@klotzsche_) — generalisasi ke leadership\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-youdontcare-klotzsche_--generalisasi-ke-leadership\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eAs leaders are promoted are they less effective at judgement and taste because they have less contact with the very thing that helped shape it?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nSetuju reflektif, dengan pergeseran ke fenomena umum leadership.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ejudgement dan taste dibentuk oleh kontak langsung dengan medium kerja.\u003c/li\u003e\n\u003cli\u003ekenaikan level bisa memutus kontak itu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke historical pattern,\u003c/li\u003e\n\u003cli\u003efokus ke generalisasi dari coding ke leadership,\u003c/li\u003e\n\u003cli\u003efokus ke risiko pemutusan kontak terhadap sense-making.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"7-bifkn--pain-ditunda-bukan-dihapus\"\u003e7. bifkn — pain ditunda, bukan dihapus\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-bifkn--pain-ditunda-bukan-dihapus\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eYou don't experience lots of pain while trying to use Agentic Coding? ... Some will experience that pain later than sooner, but it will come :)\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nSetuju sebagian, tetapi menambah nuansa penting.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epain tidak hilang; ia hanya deferred.\u003c/li\u003e\n\u003cli\u003edebt tetap jatuh tempo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke timing dari konsekuensi,\u003c/li\u003e\n\u003cli\u003efokus ke halusnya utang: tidak hilang cuma bergeser,\u003c/li\u003e\n\u003cli\u003ememperkuat ide debt.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"8-harald-kapper--ambiguity-vs-abstraction\"\u003e8. Harald Kapper — ambiguity vs abstraction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-harald-kapper--ambiguity-vs-abstraction\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003ea higher level of ambiguity is not a higher level of abstraction\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nSetuju dengan Lars dan menyorot satu kalimat filosofis kunci.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eabstraction yang baik menjaga kejelasan.\u003c/li\u003e\n\u003cli\u003eAI agentic bisa menambah ambiguitas, bukan level abstraksi yang sehat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke konsep teknis-filosofis,\u003c/li\u003e\n\u003cli\u003efokus ke perbedaan antara abstraction dan ambiguity.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"9-david-petrou--kontra-substansial\"\u003e9. David Petrou — kontra substansial\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-david-petrou--kontra-substansial\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePosisi:\nDia paling nyata mengajukan kontra di thread.\u003c/p\u003e\n\u003cp\u003eAsumsi utama dan arah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eagentic coding bisa bermasalah karena loop/harness belum matang, bukan karena paradigma ini intrinsik berbahaya.\u003c/li\u003e\n\u003cli\u003eproper loop closing adalah kunci.\u003c/li\u003e\n\u003cli\u003ekita masih early innings; kelemahan sekarang mungkin sifat transisional.\u003c/li\u003e\n\u003cli\u003eabstraction stack seperti ini adalah kelanjutan normal dari sejarah software.\u003c/li\u003e\n\u003cli\u003emasa depan tidak harus kembali ke craft coding manual.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eImplikasi praktis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke perbaikan workflow dan harness,\u003c/li\u003e\n\u003cli\u003ejangan jadikan kelemahan awal sebagai alasan untuk membatalkan paradigma,\u003c/li\u003e\n\u003cli\u003ebukan semua jarak dari artifact adalah fatal jika loop ditutup dengan benar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"10-hankito--kontra-pragmatis\"\u003e10. hankito — kontra pragmatis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-hankito--kontra-pragmatis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003ethe end ask is a non-starter ... “just do it the regular slow way manually and don’t use coding agents” ... nonstarter\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nKontra pragmatis: meski argumen Lars valid, resep akhirnya tidak realistis dalam dunia kerja tim modern.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etim dan organisasi jarang bersedia bayar biaya jangka pendek untuk kapasitas jangka panjang.\u003c/li\u003e\n\u003cli\u003eaturan \"slow and manual\" bukan solusi yang bisa dijual.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke viability,\u003c/li\u003e\n\u003cli\u003efokus ke insentif organisasi,\u003c/li\u003e\n\u003cli\u003efokus ke realitas implementasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"11-banshan--historical-inevitability\"\u003e11. Banshan — historical inevitability\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-banshan--historical-inevitability\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThe birth of anything new ... radicals and conservatives ... things will not revert to the old ways; instead, new solutions will be born.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nMeta-kontra moderat.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eperubahan teknologi biasanya kacau di awal.\u003c/li\u003e\n\u003cli\u003edunia tidak akan kembali ke cara lama.\u003c/li\u003e\n\u003cli\u003esolusi baru akan lahir.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke sejarah perubahan,\u003c/li\u003e\n\u003cli\u003efokus ke inevitability,\u003c/li\u003e\n\u003cli\u003efokus ke adaptasi, bukan rollback.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"12-chris-baldwin--kritik-meta\"\u003e12. Chris Baldwin — kritik meta\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-chris-baldwin--kritik-meta\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eThis is a link farming rabbit hole now isn’t it? How many links deep do we gotta go to say the most basic shit?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003ePosisi:\nMeta/pinggiran.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebeberapa argumen terasa terlalu obvious.\u003c/li\u003e\n\u003cli\u003ediskusi terlalu berputar pada hal yang sebetulnya sederhana.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArah argumen:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003efokus ke bentuk thread,\u003c/li\u003e\n\u003cli\u003efokus ke kelelahan atas link dan over-elaboration.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"13-marcin--mario--pinggiran-sosial\"\u003e13. Marcin + Mario — pinggiran sosial\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-marcin--mario--pinggiran-sosial\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKomentar tentang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebaca banyak,\u003c/li\u003e\n\u003cli\u003eno life,\u003c/li\u003e\n\u003cli\u003espeed reading.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePosisi:\nMeta/pinggiran.\u003c/p\u003e\n\u003cp\u003eAsumsi utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eendorsement ini datang dari pola literasi dan refleksi.\u003c/li\u003e\n\u003cli\u003ethread ini juga punya sisi sosial, bukan cuma substansi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"ringkasan-posisi\"\u003eRingkasan posisi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-posisi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKubu \"setuju kuat dengan Lars\":\nMario, André, Leo, TG, Sergii, Harald.\u003c/p\u003e\n\u003cp\u003eKubu \"setuju tapi menambah nuansa\":\nbifkn.\u003c/p\u003e\n\u003cp\u003eKubu \"skeptis / kontra\":\nDavid, hankito, Banshan.\u003c/p\u003e\n\u003cp\u003eKubu \"meta / pinggiran\":\nChris, Marcin + Mario sosial.\u003c/p\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eThread ini bukan sekadar pro vs kontra. Hampir semua orang berbicara soal hubungan AI, rasa sakit belajar, dan kemampuan membentuk mental model.\u003c/p\u003e\n\u003cp\u003ePerbedaannya ada di titik tekan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elearning,\u003c/li\u003e\n\u003cli\u003equality,\u003c/li\u003e\n\u003cli\u003eorg pressure,\u003c/li\u003e\n\u003cli\u003ehistorical inevitability,\u003c/li\u003e\n\u003cli\u003efuture optimism.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIndikator paham thread ini bukan sekadar tahu siapa pro dan kontra, tapi bisa membedakan mana yang berbicara soal learning, mana yang berbicara soal workflow design, mana yang berbicara soal insentif organisasi, dan mana yang berbicara soal historical pattern.\u003c/p\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding-is-a-trap\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eAgentic Coding Is a Trap\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding.thread-mario-zechner\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eThread Mario Zechner: Agentic Coding sebagai Compression Test\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai
