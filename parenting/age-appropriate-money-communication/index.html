ps":{"note":{"id":"notes.parenting.age-appropriate-money-communication","title":"Age-appropriate money communication untuk anak","desc":"Praktik mengajarkan konsep uang sesuai umur agar anak membangun skill keputusan, bukan sekadar patuh menabung.","updated":1779766477936,"created":1779766429336,"tags":["notes","personal-finance","parenting","financial-literacy"],"custom":{},"fname":"notes.parenting.age-appropriate-money-communication","type":"note","vault":{"fsPath":"vault"},"contentHash":"df1a89252840859d574d6327d6fa55bd","links":[{"type":"frontmatterTag","from":{"fname":"notes.parenting.age-appropriate-money-communication","id":"notes.parenting.age-appropriate-money-communication","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.parenting.age-appropriate-money-communication","id":"notes.parenting.age-appropriate-money-communication","vaultName":"vault"},"value":"tags.personal-finance","alias":"personal-finance","xvault":false,"to":{"fname":"tags.personal-finance"}},{"type":"frontmatterTag","from":{"fname":"notes.parenting.age-appropriate-money-communication","id":"notes.parenting.age-appropriate-money-communication","vaultName":"vault"},"value":"tags.parenting","alias":"parenting","xvault":false,"to":{"fname":"tags.parenting"}},{"type":"frontmatterTag","from":{"fname":"notes.parenting.age-appropriate-money-communication","id":"notes.parenting.age-appropriate-money-communication","vaultName":"vault"},"value":"tags.financial-literacy","alias":"financial-literacy","xvault":false,"to":{"fname":"tags.financial-literacy"}}],"anchors":{"prinsip-utama":{"type":"header","text":"Prinsip utama","value":"prinsip-utama","line":17,"column":0,"depth":2},"empat-pola-yang-perlu-dihindari":{"type":"header","text":"Empat pola yang perlu dihindari","value":"empat-pola-yang-perlu-dihindari","line":24,"column":0,"depth":2},"pendekatan-praktis-per-umur":{"type":"header","text":"Pendekatan praktis per umur","value":"pendekatan-praktis-per-umur","line":31,"column":0,"depth":2},"35-tahun":{"type":"header","text":"3–5 tahun","value":"35-tahun","line":33,"column":0,"depth":3},"69-tahun":{"type":"header","text":"6–9 tahun","value":"69-tahun","line":38,"column":0,"depth":3},"1012-tahun":{"type":"header","text":"10–12 tahun","value":"1012-tahun","line":43,"column":0,"depth":3},"1315-tahun":{"type":"header","text":"13–15 tahun","value":"1315-tahun","line":48,"column":0,"depth":3},"16-tahun":{"type":"header","text":"16+ tahun","value":"16-tahun","line":53,"column":0,"depth":3},"praktik-harian-yang-bisa-langsung-dipakai":{"type":"header","text":"Praktik harian yang bisa langsung dipakai","value":"praktik-harian-yang-bisa-langsung-dipakai","line":57,"column":0,"depth":2},"board-game-sebagai-medium-belajar-uang":{"type":"header","text":"Board game sebagai medium belajar uang","value":"board-game-sebagai-medium-belajar-uang","line":66,"column":0,"depth":2},"rekomendasi-game-per-level":{"type":"header","text":"Rekomendasi game per level","value":"rekomendasi-game-per-level","line":74,"column":0,"depth":3},"catatan-penting":{"type":"header","text":"Catatan penting","value":"catatan-penting","line":82,"column":0,"depth":3},"mindset-yang-ingin-dibangun":{"type":"header","text":"Mindset yang ingin dibangun","value":"mindset-yang-ingin-dibangun","line":89,"column":0,"depth":2},"referensi-yang-relevan":{"type":"header","text":"Referensi yang relevan","value":"referensi-yang-relevan","line":97,"column":0,"depth":2}},"children":[],"parent":"gq38f5tieb5w0lkc6yeno2w","data":{}},"body":"\u003ch1 id=\"age-appropriate-money-communication-untuk-anak\"\u003eAge-appropriate money communication untuk anak\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#age-appropriate-money-communication-untuk-anak\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eKomunikasi uang yang efektif bukan soal mengulang \"nabung ya\" terus menerus. Yang penting adalah mengajarkan anak bahwa uang adalah alat untuk membuat pilihan, bukan hanya perintah moral.\u003c/p\u003e\n\u003ch2 id=\"prinsip-utama\"\u003ePrinsip utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\"Menabung\" adalah perilaku akhir, bukan konsep dasar.\u003c/li\u003e\n\u003cli\u003eAnak harus melihat rantai: kerja → uang → pilihan → trade-off → konsekuensi → rencana.\u003c/li\u003e\n\u003cli\u003eJika anak hanya belajar aksi, dia bisa patuh menabung tapi tidak paham kenapa.\u003c/li\u003e\n\u003cli\u003eTujuan literasi uang anak adalah memberi bahasa untuk memahami pilihan hidup.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"empat-pola-yang-perlu-dihindari\"\u003eEmpat pola yang perlu dihindari\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#empat-pola-yang-perlu-dihindari\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eMenabung sebagai moral command: \"nanti sesat kalau boros\".\u003c/li\u003e\n\u003cli\u003eMengajar aksi tanpa konteks: \"masukkan celengan\" tanpa jelaskan fungsi uang.\u003c/li\u003e\n\u003cli\u003eMenanamkan takut uang: membuat uang jadi musuh, bukan alat.\u003c/li\u003e\n\u003cli\u003eMenyamaratakan semua umur: konsep sama, tapi kedalaman harus berubah.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"pendekatan-praktis-per-umur\"\u003ePendekatan praktis per umur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pendekatan-praktis-per-umur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"35-tahun\"\u003e3–5 tahun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#35-tahun\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eFokus pada uang sebagai alat tukar.\u003c/li\u003e\n\u003cli\u003eAjari bedakan \u003ccode\u003emau\u003c/code\u003e vs \u003ccode\u003ebutuh\u003c/code\u003e lewat permainan toko-tokoan.\u003c/li\u003e\n\u003cli\u003eContoh kalimat: \"Susu ini kita beli karena butuh. Permen ini untuk kalau masih ada sisa.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"69-tahun\"\u003e6–9 tahun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#69-tahun\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eKenalkan uang kecil berkala dan sistem tiga wadah: Pakai, Simpan, Berbagi.\u003c/li\u003e\n\u003cli\u003eBuat goal kecil: \"kalau kamu mau mainan Rp80 ribu, kita simpan Rp20 ribu setiap minggu.\"\u003c/li\u003e\n\u003cli\u003eBiarkan anak melihat pilihan dan konsekuensinya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"1012-tahun\"\u003e10–12 tahun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1012-tahun\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eMulai beri budget jajan mingguan.\u003c/li\u003e\n\u003cli\u003eAjari perbandingan harga, kualitas, dan opportunity cost.\u003c/li\u003e\n\u003cli\u003eContoh: \"Kalau kamu beli ini, kamu tidak bisa beli itu. Mana yang lebih penting?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"1315-tahun\"\u003e13–15 tahun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1315-tahun\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eAjak diskusi keluarga sederhana tentang alokasi uang.\u003c/li\u003e\n\u003cli\u003eKenalkan konsep biaya hidup, tabungan, dan utang.\u003c/li\u003e\n\u003cli\u003eBicarakan paylater/kartu kredit sebagai alat dengan batas risiko.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"16-tahun\"\u003e16+ tahun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#16-tahun\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eMasuk ke simulasi dunia nyata: gaji pertama, biaya hidup, rekening bank, BPJS, pajak, dan investasi kecil.\u003c/li\u003e\n\u003cli\u003eAjari bahwa keputusan finansial harus diukur dari bagaimana memengaruhi hidup sehari-hari.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"praktik-harian-yang-bisa-langsung-dipakai\"\u003ePraktik harian yang bisa langsung dipakai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#praktik-harian-yang-bisa-langsung-dipakai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBuat ritual money talk 10 menit per minggu.\u003c/li\u003e\n\u003cli\u003eGunakan three-jar system: Pakai / Simpan / Berbagi.\u003c/li\u003e\n\u003cli\u003eLakukan belanja sadar bersama anak: bandingkan harga dan fungsi.\u003c/li\u003e\n\u003cli\u003eGunakan goal chart sederhana untuk target tabungan.\u003c/li\u003e\n\u003cli\u003eJelaskan utang dengan analogi: pinjam hari ini berarti membayar kembali nanti.\u003c/li\u003e\n\u003cli\u003eAjari risiko lewat contoh sehari-hari: \"kalau semua telur di satu keranjang, jatuh semua pecah.\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"board-game-sebagai-medium-belajar-uang\"\u003eBoard game sebagai medium belajar uang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#board-game-sebagai-medium-belajar-uang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBoard game bisa jadi medium paling masuk akal karena anak belajar uang sebagai pilihan dan konsekuensi, bukan sekadar \"ada uangnya = beli\".\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTidak semua game bertema uang mengajar literasi finansial sehat. Banyak hanya mengajarkan menghitung atau bertransaksi.\u003c/li\u003e\n\u003cli\u003eGame yang baik mengajarkan skill seperti membuat pilihan, menunggu, memprioritaskan, dan merasakan konsekuensi kecil.\u003c/li\u003e\n\u003cli\u003eYang paling efektif adalah main dulu, lalu debrief singkat: \"putusan mana yang bagus? mana yang bikin susah?\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"rekomendasi-game-per-level\"\u003eRekomendasi game per level\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#rekomendasi-game-per-level\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e4–7 tahun\u003c/strong\u003e: fokus pada uang konkret dan nilai koin. Contoh: \u003cem\u003eMoney Bags Coin Value Game\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e5+ tahun\u003c/strong\u003e: \u003cem\u003eMonopoly Junior\u003c/em\u003e oke sebagai entry point, tetapi harus dipandu agar pelajaran tetap tentang uang keluar/masuk dan pilihan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e7–10 tahun\u003c/strong\u003e: mulai masuk ke allowance, earning, spending, saving. Contoh: \u003cem\u003eThe Allowance Game\u003c/em\u003e, \u003cem\u003eManaging My Allowance\u003c/em\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e10–13 tahun\u003c/strong\u003e: budgeting dan rekening. Contoh: \u003cem\u003eBankIt!\u003c/em\u003e atau game rekening bank sederhana.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e13+ tahun\u003c/strong\u003e: game ekonomi yang lebih kompleks seperti \u003cem\u003eMonopoly\u003c/em\u003e, \u003cem\u003eThe Game of Life\u003c/em\u003e, atau \u003cem\u003eCatan\u003c/em\u003e — dengan fokus pada cash flow, risiko, dan prioritas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"catatan-penting\"\u003eCatatan penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGame board hanya alat. Yang membuat pembelajaran nyampe adalah diskusi singkat setelah main.\u003c/li\u003e\n\u003cli\u003eTanpa debrief, anak cuma merasakan seru; dengan debrief, anak belajar reasoning.\u003c/li\u003e\n\u003cli\u003eUntuk konteks lokal, bisa juga buat versi homemade: uang mainan Rp50.000, kartu keinginan, kartu kebutuhan, kartu kejadian darurat, dan target \"goal tercapai plus masih punya dana darurat\".\u003c/li\u003e\n\u003cli\u003eWin condition yang sehat adalah target tercapai dan tetap punya buffer, bukan sekadar jadi paling kaya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mindset-yang-ingin-dibangun\"\u003eMindset yang ingin dibangun\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mindset-yang-ingin-dibangun\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUang punya batas.\u003c/li\u003e\n\u003cli\u003eSetiap pilihan punya trade-off.\u003c/li\u003e\n\u003cli\u003eMenyimpan bukan sekadar menahan, tapi menjaga pilihan nanti.\u003c/li\u003e\n\u003cli\u003eOrang dewasa juga membuat keputusan, bukan punya uang tak terbatas.\u003c/li\u003e\n\u003cli\u003eKeputusan kecil hari ini bisa membuka pilihan lebih besar nanti.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi-yang-relevan\"\u003eReferensi yang relevan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-yang-relevan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eCFPB Money as You Grow\u003c/li\u003e\n\u003cli\u003eFDIC Money Smart for Young People\u003c/li\u003e\n\u003cli\u003eOJK literasi keuangan dan buku saku \"Cerdas Mengelola Keuangan\"\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epersonal-finance (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eparenting (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003efinancial-literacy (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex
