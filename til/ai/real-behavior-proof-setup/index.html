03cli\u003ebehavior direkam\u003c/li\u003e\n\u003cli\u003eartifact ditempel ke PR\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi tools-nya harus menutup tiga kebutuhan utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekontrol environment\u003c/li\u003e\n\u003cli\u003ekontrol input\u003c/li\u003e\n\u003cli\u003ebukti output\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"tools-minimum-untuk-mulai\"\u003eTools minimum untuk mulai\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tools-minimum-untuk-mulai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePaling kecil yang diperlukan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGit\u003c/li\u003e\n\u003cli\u003eRuntime project sesuai stack\n\u003cul\u003e\n\u003cli\u003eNode.js / pnpm untuk JS/TS\u003c/li\u003e\n\u003cli\u003ePython / pytest untuk Python\u003c/li\u003e\n\u003cli\u003eGo / cargo untuk Go\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTest runner\n\u003cul\u003e\n\u003cli\u003eVitest / Jest / pytest / go test / cargo test\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eScript runner\n\u003cul\u003e\n\u003cli\u003ebash / npm scripts / Makefile / justfile\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eRecorder sederhana\n\u003cul\u003e\n\u003cli\u003ePlaywright video untuk web\u003c/li\u003e\n\u003cli\u003eOBS / ffmpeg untuk manual / desktop\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTempat simpan artifact\n\u003cul\u003e\n\u003cli\u003eGitHub Actions artifacts\u003c/li\u003e\n\u003cli\u003eS3/R2\u003c/li\u003e\n\u003cli\u003eattachment PR langsung\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTemplate PR comment\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau sudah punya ini, versi pertama sudah bisa jalan.\u003c/p\u003e\n\u003ch2 id=\"kalau-flow-nya-browserweb-app\"\u003eKalau flow-nya browser/web app\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kalau-flow-nya-browserweb-app\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eStack yang masuk akal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePlaywright\n\u003cul\u003e\n\u003cli\u003ebuka app\u003c/li\u003e\n\u003cli\u003ejalankan skenario\u003c/li\u003e\n\u003cli\u003erecord video / screenshot\u003c/li\u003e\n\u003cli\u003esimpan artifact\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eGitHub Actions\n\u003cul\u003e\n\u003cli\u003echeckout main\u003c/li\u003e\n\u003cli\u003ejalankan before\u003c/li\u003e\n\u003cli\u003echeckout PR\u003c/li\u003e\n\u003cli\u003ejalankan after\u003c/li\u003e\n\u003cli\u003eupload artifacts\u003c/li\u003e\n\u003cli\u003ecomment ke PR\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTools konkret:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGit\u003c/li\u003e\n\u003cli\u003eGitHub Actions\u003c/li\u003e\n\u003cli\u003eNode.js / pnpm / npm\u003c/li\u003e\n\u003cli\u003ePlaywright\u003c/li\u003e\n\u003cli\u003effmpeg (optional untuk trim/convert)\u003c/li\u003e\n\u003cli\u003egh CLI untuk comment PR\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kalau-flow-nya-desktop-app-seperti-telegram\"\u003eKalau flow-nya desktop app seperti Telegram\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kalau-flow-nya-desktop-app-seperti-telegram\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eTools-nya lebih berat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLinux VM / container dengan GUI\u003c/li\u003e\n\u003cli\u003eXvfb atau display server nyata\u003c/li\u003e\n\u003cli\u003eVNC / noVNC untuk inspect manual\u003c/li\u003e\n\u003cli\u003eTelegram Desktop\u003c/li\u003e\n\u003cli\u003effmpeg untuk screen recording\u003c/li\u003e\n\u003cli\u003escripted input tool\n\u003cul\u003e\n\u003cli\u003exdotool / ydotool\u003c/li\u003e\n\u003cli\u003ePlaywright kalau ada browser part\u003c/li\u003e\n\u003cli\u003ecustom automation\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk Telegram khususnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTelegram Desktop terinstal\u003c/li\u003e\n\u003cli\u003eakun Telegram test\u003c/li\u003e\n\u003cli\u003egrup / channel test\u003c/li\u003e\n\u003cli\u003ebot token untuk SUT\u003c/li\u003e\n\u003cli\u003esession persistence supaya login tidak ulang terus\u003c/li\u003e\n\u003cli\u003esecret management untuk token/session\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJangan remehkan real login/session. Kalau tiap run butuh login manual, workflow langsung rapuh.\u003c/p\u003e\n\u003ch2 id=\"satu-pc-sebagai-environment-eksekusi\"\u003e“Satu PC” sebagai environment eksekusi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#satu-pc-sebagai-environment-eksekusi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDalam konteks ini, “satu PC” bukan harus perangkat fisik khusus. Ini adalah satu environment eksekusi yang punya display/session untuk menjalankan app dan merekam behavior.\u003c/p\u003e\n\u003cp\u003eBentuknya bisa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePC/laptop lokal: cocok untuk eksperimen awal.\u003c/li\u003e\n\u003cli\u003eVM dengan GUI: cocok untuk automation serius.\u003c/li\u003e\n\u003cli\u003eCloud runner dengan virtual display: cocok untuk CI web/headless.\u003c/li\u003e\n\u003cli\u003eRemote desktop pool: cocok untuk desktop app nyata seperti Telegram Desktop.\u003c/li\u003e\n\u003cli\u003eContainer biasa: cukup kalau cuma web/headless test.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePerbedaan utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWeb app biasanya cukup dengan Playwright + Chromium + video recording di CI.\u003c/li\u003e\n\u003cli\u003eDesktop app nyata butuh GUI session, login session, dan recorder seperti ffmpeg.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTrade-off:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edisposable runner:\n\u003cul\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003ebersih\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003eaman\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003erepeatable\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003elogin ulang susah\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003esetup lebih lama\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003epersistent runner:\n\u003cul\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003esession login tetap ada\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003ebutuh jaga secret/state\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cul\u003e\n\u003cli\u003erentan noisy state\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"untuk-github-pr-automation\"\u003eUntuk GitHub PR automation\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#untuk-github-pr-automation\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMinimal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGitHub Actions\u003c/li\u003e\n\u003cli\u003eactions/checkout\u003c/li\u003e\n\u003cli\u003eactions/upload-artifact\u003c/li\u003e\n\u003cli\u003egh CLI\u003c/li\u003e\n\u003cli\u003eGitHub token dengan permission comment PR\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLebih proper:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCloudflare R2 / S3 / GCS\u003c/li\u003e\n\u003cli\u003emetadata artifact\n\u003cul\u003e\n\u003cli\u003ecommit SHA before\u003c/li\u003e\n\u003cli\u003ecommit SHA after\u003c/li\u003e\n\u003cli\u003etest command\u003c/li\u003e\n\u003cli\u003escenario name\u003c/li\u003e\n\u003cli\u003etimestamp\u003c/li\u003e\n\u003cli\u003eenvironment info\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"optional-tapi-bikin-workflow-matang\"\u003eOptional tapi bikin workflow matang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#optional-tapi-bikin-workflow-matang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBiar lebih disiplin:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elabel bot\u003c/li\u003e\n\u003cli\u003ereview bot\u003c/li\u003e\n\u003cli\u003echangelog checker\u003c/li\u003e\n\u003cli\u003ecode owner routing\u003c/li\u003e\n\u003cli\u003escoped test detector\u003c/li\u003e\n\u003cli\u003ebefore/after diff generator\u003c/li\u003e\n\u003cli\u003eevidence retention policy\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kenapa-mock-model-penting\"\u003eKenapa mock model penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-mock-model-penting\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eReal behavior proof lo harus terkontrol. Kalau pake model live, before/after bisa beda karena output model, bukan karena patch.\u003c/p\u003e\n\u003cp\u003eMock model yang deterministik membuat variabel pengujian jadi jelas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eprompt sama\u003c/li\u003e\n\u003cli\u003eresponse sama\u003c/li\u003e\n\u003cli\u003echannel sama\u003c/li\u003e\n\u003cli\u003eUI sama\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang diuji cuma patch / formatter / behavior change.\u003c/p\u003e\n\u003ch2 id=\"level-maturity-setup\"\u003eLevel maturity setup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#level-maturity-setup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eLevel 1 — paling murah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUnit/regression test\u003c/li\u003e\n\u003cli\u003eManual screen recording\u003c/li\u003e\n\u003cli\u003eManual PR comment\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLevel 2 — semi otomatis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePlaywright\u003c/li\u003e\n\u003cli\u003eGitHub Actions\u003c/li\u003e\n\u003cli\u003eauto upload artifact\u003c/li\u003e\n\u003cli\u003eauto PR comment\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLevel 3 — real behavior automation:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eVM/runner GUI\u003c/li\u003e\n\u003cli\u003effmpeg\u003c/li\u003e\n\u003cli\u003eVNC/noVNC\u003c/li\u003e\n\u003cli\u003ereal account/session\u003c/li\u003e\n\u003cli\u003emock service deterministik\u003c/li\u003e\n\u003cli\u003eauto before/after run\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eLevel 4 — agentic evidence pipeline:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCodex / agent untuk generate fix/proof notes\u003c/li\u003e\n\u003cli\u003ereview bot untuk correctness/security/changelog\u003c/li\u003e\n\u003cli\u003elabel bot untuk proof required/supplied\u003c/li\u003e\n\u003cli\u003eartifact server\u003c/li\u003e\n\u003cli\u003escenario registry\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"cara-pikir-yang-benar\"\u003eCara pikir yang benar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#cara-pikir-yang-benar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJangan lihat tools sebagai daftar belanja. Lihat sebagai rantai:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTest runner → membuktikan logic\u003c/li\u003e\n\u003cli\u003eMock service → membuat input deterministic\u003c/li\u003e\n\u003cli\u003eRunner / VM → jalankan app di environment nyata\u003c/li\u003e\n\u003cli\u003eRecorder → tangkap behavior\u003c/li\u003e\n\u003cli\u003eArtifact storage → simpan bukti\u003c/li\u003e\n\u003cli\u003ePR bot → bawa bukti ke tempat keputusan merge\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInsight-nya: setup terbaik bukan yang paling lengkap. Setup terbaik adalah yang menjawab pertanyaan:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eJika reviewer lihat PR ini, apakah dia bisa percaya bahwa bug yang diklaim sudah berubah behavior-nya?\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eKalau iya, MVP lo sudah benar.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\
