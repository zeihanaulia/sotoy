xtraction dengan retrieval","value":"13-hubungan-extraction-dengan-retrieval","line":270,"column":0,"depth":2},"14-failure-mode-extraction":{"type":"header","text":"14. Failure mode extraction","value":"14-failure-mode-extraction","line":278,"column":0,"depth":2},"15-insight-penutup":{"type":"header","text":"15. Insight penutup","value":"15-insight-penutup","line":288,"column":0,"depth":2},"related-documents":{"type":"header","text":"Related documents","value":"related-documents","line":294,"column":0,"depth":2}},"children":[],"parent":"ewcg9i7ugembnipiqrf195g","data":{}},"body":"\u003ch1 id=\"openviking-context-extraction\"\u003eOpenViking context extraction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#openviking-context-extraction\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eLink: \u003ca href=\"https://docs.openviking.ai/en/concepts/06-extraction\"\u003ehttps://docs.openviking.ai/en/concepts/06-extraction\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContext Extraction di OpenViking adalah proses mengubah input mentah seperti PDF, Markdown, HTML, repo code, image, video, audio, skill, atau session history menjadi struktur \u003ccode\u003eviking://...\u003c/code\u003e yang punya L0/L1, bisa dibaca dari AGFS, dan bisa dicari lewat Vector Index\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eIni bukan cuma summarization. Lebih tepat: \u003cstrong\u003epipeline ingestion + structuring + semantic generation + vectorization\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"1-pertanyaan-kunci-yang-gue-pegang\"\u003e1. Pertanyaan kunci yang gue pegang\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-pertanyaan-kunci-yang-gue-pegang\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKenapa OpenViking memisahkan parsing dan semantic generation?\u003c/li\u003e\n\u003cli\u003eApa yang dilakukan Parser?\u003c/li\u003e\n\u003cli\u003eApa yang dilakukan TreeBuilder?\u003c/li\u003e\n\u003cli\u003eApa yang dilakukan SemanticQueue?\u003c/li\u003e\n\u003cli\u003eBagaimana L0/L1 dibuat secara bottom-up?\u003c/li\u003e\n\u003cli\u003eBagaimana code repository diproses lewat AST Mode?\u003c/li\u003e\n\u003cli\u003eBagaimana Resource, Memory, dan Skill punya flow extraction yang berbeda?\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"2-kenapa-parsing-dan-semantic-generation-dipisah\"\u003e2. Kenapa parsing dan semantic generation dipisah?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-parsing-dan-semantic-generation-dipisah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003ePage ini menegaskan satu prinsip: parsing dan semantics harus dipisah.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eParser\u003c/code\u003e hanya membaca format, memecah struktur, dan menulis hasil sementara.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSemanticQueue\u003c/code\u003e menghasilkan makna: L0/L1, embeddings, vector index.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKenapa? Karena parsing harus deterministik, cepat, dan bebas biaya LLM. Semantic generation mahal, lambat, dan harus bisa berjalan async.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eParser membangun bentuk.\nSemanticQueue membangun makna.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eKalau dua ini dicampur, ingestion jadi lambat, mahal, dan debugging jadi susah.\u003c/p\u003e\n\u003ch2 id=\"3-parser--reader--temp-structurer\"\u003e3. Parser = reader + temp structurer\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-parser--reader--temp-structurer\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eParser membaca format input dan mengubahnya jadi struktur file sementara di temp directory.\u003c/p\u003e\n\u003cp\u003ePage bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e“Parser handles document format conversion and structuring, creating file structure in temp directory.”\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eParser tidak memanggil LLM.\u003c/p\u003e\n\u003cp\u003eHasilnya adalah \u003ccode\u003eParseResult\u003c/code\u003e yang mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003etemp_dir_path\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esource_format\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eparser_name\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eparse_time\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emeta\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJadi setelah parsing, OpenViking tahu di mana hasil sementara ada dan format asalnya.\u003c/p\u003e\n\u003ch3 id=\"format-input-yang-didukung\"\u003eFormat input yang didukung\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#format-input-yang-didukung\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eMarkdown (.md, .markdown)\u003c/li\u003e\n\u003cli\u003ePlain text (.txt)\u003c/li\u003e\n\u003cli\u003ePDF (.pdf)\u003c/li\u003e\n\u003cli\u003eHTML (.html, .htm)\u003c/li\u003e\n\u003cli\u003eCode (.py, .js, .go, dsb.)\u003c/li\u003e\n\u003cli\u003eImage (.png, .jpg, dsb.)\u003c/li\u003e\n\u003cli\u003eVideo (.mp4, .avi, dsb.)\u003c/li\u003e\n\u003cli\u003eAudio (.mp3, .wav, dsb.)\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk code repository, parser juga hormat \u003ccode\u003e.gitignore\u003c/code\u003e dan mengabaikan direktori non-code yang umum.\u003c/p\u003e\n\u003cp\u003eAtomic rule:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eParser tahu apa yang harus dimasukkan.\nParser juga tahu apa yang harus diabaikan.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"4-treebuilder--temp--agfs--queue-semantic-jobs\"\u003e4. TreeBuilder = temp → AGFS + queue semantic jobs\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-treebuilder--temp--agfs--queue-semantic-jobs\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah Parser selesai, \u003ccode\u003eTreeBuilder\u003c/code\u003e memindahkan struktur sementara ke AGFS dan mendaftarkan pekerjaan semantic.\u003c/p\u003e\n\u003cp\u003ePage menjelaskan flow utama:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e1. Find document root\n2. Determine target URI\n3. Recursively move directory tree\n4. Clean up temp directory\n5. Queue semantic generation\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3 id=\"find-document-root\"\u003eFind document root\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#find-document-root\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTreeBuilder memastikan result punya satu root konteks. Jika parsing menghasilkan banyak root tanpa struktur, konteks jadi ambigu.\u003c/p\u003e\n\u003ch3 id=\"determine-target-uri\"\u003eDetermine target URI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#determine-target-uri\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTreeBuilder menempatkan hasil ke base URI sesuai scope:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eresources\u003c/code\u003e → \u003ccode\u003eviking://resources\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003euser\u003c/code\u003e      → \u003ccode\u003eviking://user\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eagent\u003c/code\u003e     → \u003ccode\u003eviking://agent\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eScope ini menentukan world context: Resource, Memory, atau Skill.\u003c/p\u003e\n\u003ch3 id=\"move--cleanup--queue\"\u003eMove + cleanup + queue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#move--cleanup--queue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eTreeBuilder memindahkan file ke AGFS, kemudian menghapus temp.\nDia tidak membuat L0/L1. Itu pekerjaan \u003ccode\u003eSemanticQueue\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eTreeBuilder = pemindah struktur.\nSemanticQueue = pembuat makna.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"5-semanticqueue--async-l0l1--vectorization\"\u003e5. SemanticQueue = async L0/L1 + vectorization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-semanticqueue--async-l0l1--vectorization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eSemanticQueue\u003c/code\u003e adalah pipeline async yang membangun L0/L1 dan menghasilkan embeddings.\u003c/p\u003e\n\u003cp\u003ePesanannya biasanya berupa \u003ccode\u003eSemanticMsg\u003c/code\u003e yang membawa:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003euri\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003econtext_type\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003estatus\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ejob id\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKenapa pakai queue?\u003c/p\u003e\n\u003cp\u003eKarena L0/L1 sering perlu LLM/VLM call. Itu lebih lambat dan lebih mahal. Dengan queue, AGFS bisa terisi terlebih dahulu, lalu semantic processing berjalan di belakang layar.\u003c/p\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAGFS ready dulu.\nSemantic search menyusul.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"6-l0l1-dibuat-secara-bottom-up\"\u003e6. L0/L1 dibuat secara bottom-up\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-l0l1-dibuat-secara-bottom-up\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSemanticQueue memproses directory dari bawah ke atas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebuat L0/L1 untuk leaf nodes,\u003c/li\u003e\n\u003cli\u003ekumpulkan abstract child,\u003c/li\u003e\n\u003cli\u003ebuat overview parent,\u003c/li\u003e\n\u003cli\u003enaik ke root.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIni penting karena parent overview perlu tahu isi child sebelum bisa dirangkum.\u003c/p\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eoauth.md\u003c/code\u003e → buat \u003ccode\u003eoauth/.abstract.md\u003c/code\u003e dan \u003ccode\u003eoauth/.overview.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ejwt.md\u003c/code\u003e → buat \u003ccode\u003ejwt/.abstract.md\u003c/code\u003e dan \u003ccode\u003ejwt/.overview.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eapi-keys.md\u003c/code\u003e → buat \u003ccode\u003eapi-keys/.abstract.md\u003c/code\u003e dan \u003ccode\u003eapi-keys/.overview.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003elalu folder \u003ccode\u003eauth/\u003c/code\u003e → buat \u003ccode\u003e.abstract.md\u003c/code\u003e/\u003ccode\u003e.overview.md\u003c/code\u003e dari child abstracts\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAtomic idea:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAnak diringkas dulu.\nOrang tua merangkum anak-anaknya.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"7-ast-mode-untuk-code-repository\"\u003e7. AST Mode untuk code repository\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#7-ast-mode-untuk-code-repository\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eOpenViking punya mode khusus untuk repo code: AST Mode.\u003c/p\u003e\n\u003cp\u003ePage menulis bahwa code processing bisa pakai tree-sitter untuk mengekstrak skeleton tanpa LLM, supaya proses lebih murah.\u003c/p\u003e\n\u003ch3 id=\"code_summary_mode\"\u003e\u003ccode\u003ecode_summary_mode\u003c/code\u003e\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#code_summary_mode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003east\u003c/code\u003e: pakai AST skeleton untuk file besar, tidak memanggil LLM.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ellm\u003c/code\u003e: selalu pakai LLM untuk code.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003east_llm\u003c/code\u003e: buat skeleton dulu, lalu ringkas dengan LLM.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"mengapa-ast-mode-penting\"\u003eMengapa AST Mode penting?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mengapa-ast-mode-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCode repo bisa besar. Jika setiap file diringkas lewat LLM,\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebiaya jauh lebih tinggi,\u003c/li\u003e\n\u003cli\u003eproses lebih lambat,\u003c/li\u003e\n\u003cli\u003erate limit lebih berisiko.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAST Mode membantu ketika agent hanya butuh struktur:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eimports\u003c/li\u003e\n\u003cli\u003eclass names\u003c/li\u003e\n\u003cli\u003emethod signatures\u003c/li\u003e\n\u003cli\u003efunction signatures\u003c/li\u003e\n\u003cli\u003edocstring first lines\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContoh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass AuthClient(BaseClient):\n  def refresh_token(self, token: str) -\u003e Optional[str]:\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk pertanyaan struktur code, AST sering sudah cukup.\u003c/p\u003e\n\u003ch2 id=\"8-tiga-mode-code-summary\"\u003e8. Tiga mode code summary\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#8-tiga-mode-code-summary\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003east\u003c/code\u003e = murah dan struktural.\n\u003ccode\u003ellm\u003c/code\u003e = kaya semantik tapi mahal.\n\u003ccode\u003east_llm\u003c/code\u003e = struktur dulu, lalu semantic summary.\u003c/p\u003e\n\u003cp\u003eAST adalah optimasi, bukan single point of failure. Kalau AST gagal, pipeline fallback ke LLM.\u003c/p\u003e\n\u003ch2 id=\"9-resource-memory-dan-skill-punya-flow-berbeda\"\u003e9. Resource, Memory, dan Skill punya flow berbeda\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#9-resource-memory-dan-skill-punya-flow-berbeda\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow extraction dasarnya sama, tapi target dan \u003ccode\u003econtext_type\u003c/code\u003e berbeda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eResource → \u003ccode\u003eviking://resources/...\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eMemory   → \u003ccode\u003eviking://user/memories/...\u003c/code\u003e atau \u003ccode\u003eviking://agent/memories/...\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eSkill    → \u003ccode\u003eviking://agent/skills/...\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eResource biasanya berasal dari file/link eksternal.\nSkill biasanya sudah berupa definisi capability.\nMemory lahir dari session commit.\u003c/p\u003e\n\u003ch2 id=\"10-kenapa-context-extraction-lebih-dari-summarization\"\u003e10. Kenapa Context Extraction lebih dari summarization?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#10-kenapa-context-extraction-lebih-dari-summarization\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContext Extraction adalah pabrik bahan mentah OpenViking.\u003c/p\u003e\n\u003cp\u003eInput mentah belum berguna sampai dia:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003epunya alamat \u003ccode\u003eviking://...\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003epunya struktur folder,\u003c/li\u003e\n\u003cli\u003epunya L0/L1 untuk navigasi,\u003c/li\u003e\n\u003cli\u003epunya L2 sebagai detail asli,\u003c/li\u003e\n\u003cli\u003emasuk Vector Index agar bisa retrieval.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJadi extraction adalah pipeline ingestion + structuring + semantic generation + vectorization.\u003c/p\u003e\n\u003ch2 id=\"11-hubungan-extraction-dengan-storage\"\u003e11. Hubungan extraction dengan storage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#11-hubungan-extraction-dengan-storage\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eFlow lengkap:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eParser → temp tree\nTreeBuilder → AGFS\nSemanticQueue → L0/L1 ke AGFS\nEmbeddingQueue → Vector Index\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eStorage Architecture menyediakan tempat. Context Extraction menyediakan proses.\u003c/p\u003e\n\u003ch2 id=\"12-hubungan-extraction-dengan-context-layers\"\u003e12. Hubungan extraction dengan context layers\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#12-hubungan-extraction-dengan-context-layers\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eContext Layers adalah hasil:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eL0\u003c/code\u003e = \u003ccode\u003e.abstract.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL1\u003c/code\u003e = \u003ccode\u003e.overview.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eL2\u003c/code\u003e = original content\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContext Extraction adalah cara menghasilkan hasil itu.\u003c/p\u003e\n\u003ch2 id=\"13-hubungan-extraction-dengan-retrieval\"\u003e13. Hubungan extraction dengan retrieval\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#13-hubungan-extraction-dengan-retrieval\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eRetrieval bergantung pada kualitas extraction.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ebad parsing → bad tree → bad L0/L1 → bad index → bad retrieval\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"14-failure-mode-extraction\"\u003e14. Failure mode extraction\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#14-failure-mode-extraction\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eParser terlalu agresif split.\u003c/li\u003e\n\u003cli\u003eParser kurang split.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eTreeBuilder\u003c/code\u003e tidak menemukan root yang jelas.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eSemanticQueue\u003c/code\u003e tertunda.\u003c/li\u003e\n\u003cli\u003eLLM summary salah.\u003c/li\u003e\n\u003cli\u003eAST skeleton kehilangan logic penting.\u003c/li\u003e\n\u003cli\u003eMemory extraction salah kategori.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"15-insight-penutup\"\u003e15. Insight penutup\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#15-insight-penutup\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e★ Insight ─────────────────────────\u003c/p\u003e\n\u003cp\u003eContext Extraction adalah titik di mana data mentah berubah menjadi context agent yang terstruktur, searchable, navigable, dan reusable. OpenViking tidak cukup hanya “menyimpulkan ringkasan”. Dia perlu menjadikan input mentah punya format \u003ccode\u003eviking://\u003c/code\u003e, folder tree, L0/L1, L2, dan index semantic.\u003c/p\u003e\n\u003ch2 id=\"related-documents\"\u003eRelated documents\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related-documents\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.architecture\"\u003eOpenViking architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.storage-architecture\"\u003eOpenViking storage architecture\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-types\"\u003eOpenViking context types\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking.context-layers\"\u003eOpenViking context layers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openviking-context-database\"\u003eContext Database\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault/daily.journal.2026.06.03 (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTa
