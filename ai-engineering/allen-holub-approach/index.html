ps":{"note":{"id":"notes.ai-engineering.allen-holub-approach","title":"AI as Engineering Accelerator, Not Replacement: Allen Holub's Approach","description":"Pendekatan disiplin engineering dalam menggunakan AI coding agents untuk menghindari comprehension debt dan output volume tanpa value.","tags":["ai-coding","engineering-discipline","architecture","testing"],"created":1781158914526,"updated":1781161780979,"custom":{"description":"Pendekatan disiplin engineering dalam menggunakan AI coding agents untuk menghindari comprehension debt dan output volume tanpa value."},"fname":"notes.ai-engineering.allen-holub-approach","type":"note","vault":{"fsPath":"vault"},"contentHash":"da99f64a824cfc92b00bc4ccb28f1d70","desc":"","links":[{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.allen-holub-approach","id":"notes.ai-engineering.allen-holub-approach","vaultName":"vault"},"value":"tags.ai-coding","alias":"ai-coding","xvault":false,"to":{"fname":"tags.ai-coding"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.allen-holub-approach","id":"notes.ai-engineering.allen-holub-approach","vaultName":"vault"},"value":"tags.engineering-discipline","alias":"engineering-discipline","xvault":false,"to":{"fname":"tags.engineering-discipline"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.allen-holub-approach","id":"notes.ai-engineering.allen-holub-approach","vaultName":"vault"},"value":"tags.architecture","alias":"architecture","xvault":false,"to":{"fname":"tags.architecture"}},{"type":"frontmatterTag","from":{"fname":"notes.ai-engineering.allen-holub-approach","id":"notes.ai-engineering.allen-holub-approach","vaultName":"vault"},"value":"tags.testing","alias":"testing","xvault":false,"to":{"fname":"tags.testing"}},{"from":{"fname":"zettel.ai.separation-of-maker-and-checker","id":"zettel.ai.separation-of-maker-and-checker","vaultName":"vault"},"type":"backlink","position":{"start":{"line":17,"column":3,"offset":1067},"end":{"line":17,"column":48,"offset":1112},"indent":[]},"value":"notes.ai-engineering.allen-holub-approach"}],"anchors":{"inti-pemikiran":{"type":"header","text":"Inti Pemikiran","value":"inti-pemikiran","line":16,"column":0,"depth":2},"strategi-implementasi-waras":{"type":"header","text":"Strategi Implementasi \"Waras\"","value":"strategi-implementasi-waras","line":22,"column":0,"depth":2},"1-kerja-incremental--small-batches":{"type":"header","text":"1. Kerja Incremental \u0026 Small Batches","value":"1-kerja-incremental--small-batches","line":26,"column":0,"depth":3},"2-human-led-architecture":{"type":"header","text":"2. Human-Led Architecture","value":"2-human-led-architecture","line":31,"column":0,"depth":3},"3-arsitektur-sebagai-guardrail":{"type":"header","text":"3. Arsitektur sebagai Guardrail","value":"3-arsitektur-sebagai-guardrail","line":40,"column":0,"depth":3},"4-test-sebagai-kontrak-manusia-anti-self-justification":{"type":"header","text":"4. Test sebagai Kontrak Manusia (Anti-Self-Justification)","value":"4-test-sebagai-kontrak-manusia-anti-self-justification","line":45,"column":0,"depth":3},"kritik-terhadap-agent-swarm-dan-output-volume":{"type":"header","text":"Kritik terhadap \"Agent Swarm\" dan Output Volume","value":"kritik-terhadap-agent-swarm-dan-output-volume","line":51,"column":0,"depth":2},"sintesis-dengan-loop-engineering":{"type":"header","text":"Sintesis dengan Loop Engineering","value":"sintesis-dengan-loop-engineering","line":57,"column":0,"depth":2},"referensi":{"type":"header","text":"Referensi","value":"referensi","line":68,"column":0,"depth":2}},"children":[],"parent":"ru1khbyefapm8m391gs1waw","data":{}},"body":"\u003ch1 id=\"ai-as-engineering-accelerator-not-replacement-allen-holubs-approach\"\u003eAI as Engineering Accelerator, Not Replacement: Allen Holub's Approach\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ai-as-engineering-accelerator-not-replacement-allen-holubs-approach\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"inti-pemikiran\"\u003eInti Pemikiran\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#inti-pemikiran\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAllen Holub menekankan bahwa AI coding agents seharusnya menjadi \u003cstrong\u003eakselerator engineering\u003c/strong\u003e, bukan pengganti proses engineering itu sendiri. Kesalahan fatal banyak developer saat ini adalah menganggap \"AI maksimal\" berarti menyerahkan desain fitur besar ke agent dan menerima tumpukan kode yang terlalu luas untuk dipahami.\u003c/p\u003e\n\u003cp\u003eMenurut Allen, produktivitas bukan diukur dari volume output kode, tapi dari seberapa cepat sebuah \u003cem\u003estory\u003c/em\u003e selesai dengan kualitas tinggi dan kompleksitas yang terkendali.\u003c/p\u003e\n\u003ch2 id=\"strategi-implementasi-waras\"\u003eStrategi Implementasi \"Waras\"\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#strategi-implementasi-waras\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk menjaga kontrol dan kualitas, Allen menerapkan beberapa prinsip utama:\u003c/p\u003e\n\u003ch3 id=\"1-kerja-incremental--small-batches\"\u003e1. Kerja Incremental \u0026#x26; Small Batches\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-kerja-incremental--small-batches\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAlih-alih memberikan prompt besar untuk membangun seluruh fitur, Allen memecah pekerjaan menjadi batch kecil dan \u003cem\u003evertical slice\u003c/em\u003e yang tipis.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTujuan\u003c/strong\u003e: Menghindari \u003cem\u003ecomprehension debt\u003c/em\u003e dan memudahkan review.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMetode\u003c/strong\u003e: Membangun potongan kecil end-to-end yang memiliki nilai domain nyata, bukan membangun layer horizontal secara masif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-human-led-architecture\"\u003e2. Human-Led Architecture\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-human-led-architecture\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAI tidak boleh menjadi arsitek utama. Engineer tetap memegang kendali penuh atas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eStruktur besar sistem.\u003c/li\u003e\n\u003cli\u003eDefinisi API dan messaging.\u003c/li\u003e\n\u003cli\u003eBoundary antar komponen.\u003c/li\u003e\n\u003cli\u003eCara komponen masuk ke dalam sistem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAI digunakan untuk mengimplementasikan komponen kecil di dalam boundary yang sudah ditentukan oleh manusia.\u003c/p\u003e\n\u003ch3 id=\"3-arsitektur-sebagai-guardrail\"\u003e3. Arsitektur sebagai Guardrail\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-arsitektur-sebagai-guardrail\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eArsitektur yang koheren adalah guardrail terbaik bagi AI. Dengan boundary yang jelas, AI lebih sulit merusak bagian lain dari codebase.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePola yang disarankan\u003c/strong\u003e: DDD nested aggregates/entities, message-based components, dan hardened perimeters.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEfek\u003c/strong\u003e: AI bekerja di dalam \"kotak\" dengan interface yang jelas.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-test-sebagai-kontrak-manusia-anti-self-justification\"\u003e4. Test sebagai Kontrak Manusia (Anti-Self-Justification)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-test-sebagai-kontrak-manusia-anti-self-justification\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eIni adalah poin paling krusial. Allen \u003cstrong\u003etidak membiarkan AI menulis test\u003c/strong\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAlasannya\u003c/strong\u003e: AI cenderung menulis test yang membenarkan kode salah yang dibuatnya sendiri (\u003cem\u003eself-justification\u003c/em\u003e), atau hanya mengetes detail implementasi kecil, bukan behavior domain.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePola TDD\u003c/strong\u003e: Manusia menulis test terlebih dahulu \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e AI diminta membuat kode yang harus pass test tersebut.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePrinsip\u003c/strong\u003e: Yang menulis kode tidak boleh sekaligus menentukan bukti bahwa kodenya benar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kritik-terhadap-agent-swarm-dan-output-volume\"\u003eKritik terhadap \"Agent Swarm\" dan Output Volume\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kritik-terhadap-agent-swarm-dan-output-volume\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAllen mengkritik tren \"parallel swarm\" (menjalankan banyak agent paralel) sebagai upaya perusahaan AI untuk membakar token tanpa menghasilkan output yang benar-benar berguna.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCognitive Load\u003c/strong\u003e: Terlalu banyak agent paralel meningkatkan beban kognitif dan context switching.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMental Model\u003c/strong\u003e: Menghasilkan terlalu banyak kode sekaligus merusak mental model engineer terhadap sistemnya sendiri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"sintesis-dengan-loop-engineering\"\u003eSintesis dengan Loop Engineering\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#sintesis-dengan-loop-engineering\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJika \u003cem\u003eLoop Engineering\u003c/em\u003e (Addy Osmani/Matt Van Horn) fokus pada desain sistem, feedback, dan orkestrasi, maka pendekatan Allen Holub adalah \u003cstrong\u003esyarat disiplin\u003c/strong\u003e agar loop tersebut tidak menjadi mesin penghasil sampah.\u003c/p\u003e\n\u003cdiv class=\"table-responsive\"\u003e\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eDimensi\u003c/th\u003e\u003cth\u003eLoop Engineering (Sistem)\u003c/th\u003e\u003cth\u003eAllen Holub (Disiplin)\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eFokus\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eOrkestrasi, Feedback, Memory\u003c/td\u003e\u003ctd\u003eArsitektur, Test, Boundary\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eTujuan\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eOtomasi \u0026#x26; Leverage\u003c/td\u003e\u003ctd\u003eKualitas \u0026#x26; Understanding\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eRisiko\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eComprehension Debt\u003c/td\u003e\u003ctd\u003eUnder-utilization of AI\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003eSintesis\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003eLoop boleh jalan, tapi arsitektur dan test harus tetap dipegang manusia.\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"referensi\"\u003eReferensi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThread X: \u003ca href=\"https://x.co
