"line":19,"column":0,"depth":3},"build-trap-dan-value-exchange-system":{"type":"header","text":"Build Trap dan Value Exchange System","value":"build-trap-dan-value-exchange-system","line":32,"column":0,"depth":3},"project-vs-product-vs-service":{"type":"header","text":"Project vs Product vs Service","value":"project-vs-product-vs-service","line":41,"column":0,"depth":3},"product-manager-sebagai-respons-sistemik":{"type":"header","text":"Product Manager sebagai Respons Sistemik","value":"product-manager-sebagai-respons-sistemik","line":51,"column":0,"depth":3},"strategy-sebagai-sistem-keputusan":{"type":"header","text":"Strategy sebagai Sistem Keputusan","value":"strategy-sebagai-sistem-keputusan","line":77,"column":0,"depth":3},"process-problem-exploration-dan-product-kata":{"type":"header","text":"Process: Problem Exploration dan Product Kata","value":"process-problem-exploration-dan-product-kata","line":107,"column":0,"depth":3},"product-led-organization":{"type":"header","text":"Product-Led Organization","value":"product-led-organization","line":138,"column":0,"depth":3},"insight":{"type":"header","text":"Insight","value":"insight","line":168,"column":0,"depth":2},"link-ke-moc":{"type":"header","text":"Link ke MOC","value":"link-ke-moc","line":177,"column":0,"depth":2},"pertanyaan-terbuka":{"type":"header","text":"Pertanyaan Terbuka","value":"pertanyaan-terbuka","line":184,"column":0,"depth":2}},"children":[],"parent":"ae3bw38eg7l5p3ntry27x87","data":{}},"body":"\u003ch1 id=\"escaping-the-build-trap\"\u003eEscaping the Build Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#escaping-the-build-trap\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"ringkasan-utama\"\u003eRingkasan Utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasan-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003eEscaping the Build Trap\u003c/em\u003e menyusun sebuah argumen besar: banyak organisasi merasa mereka produktif karena terus mengirim fitur, padahal sebenarnya mereka terjebak membangun output. Value baru muncul ketika sesuatu yang dibangun dipakai, menyelesaikan masalah customer, dan menghasilkan perubahan nyata.\u003c/p\u003e\n\u003ch3 id=\"preface-build-trap-sebagai-masalah-organisasi\"\u003ePreface: Build Trap sebagai Masalah Organisasi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#preface-build-trap-sebagai-masalah-organisasi\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePreface berfungsi sebagai framing: build trap bukan hanya kesalahan PM, tapi kesalahan sistem organisasi. Michael Dell membuka dengan quote bahwa cara lama tidak akan terus bekerja. Melissa bercerita tentang pengalaman awalnya sebagai PM yang menulis requirement besar dan mengirimkannya ke developer, lalu produk itu tidak digunakan.\u003c/p\u003e\n\u003cp\u003ePoin utama Preface:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBuild trap muncul ketika tim fokus pada aktivitas internal (requirement doc, tiket, release) daripada outcome.\u003c/li\u003e\n\u003cli\u003ePM skill penting, tapi tidak cukup jika sistem insentif, struktur, dan budaya masih mendorong output-driven behavior.\u003c/li\u003e\n\u003cli\u003e“Product person” di sini luas: engineer, founder, PM, leader yang ikut menentukan fitur, prioritas, dan kualitas pengalaman.\u003c/li\u003e\n\u003cli\u003eProduct thinking membutuhkan sistem organisasi yang mendukung learning, customer understanding, dan outcome-based decision.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePreface juga menegaskan transisi dari opinion-driven product ke evidence-driven product melalui eksperimen. Melissa menyadari bahwa eksperimen membantu, tetapi eksperimen hanya bekerja kalau organisasi memberi ruang untuk belajar. Tanpa support organisasi, PM akan kembali ke kebiasaan lama karena sistem memberi sinyal yang salah.\u003c/p\u003e\n\u003ch3 id=\"build-trap-dan-value-exchange-system\"\u003eBuild Trap dan Value Exchange System\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#build-trap-dan-value-exchange-system\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart I memperkenalkan build trap melalui model value exchange system. Customer memberi waktu, uang, perhatian, data, atau trust. Perusahaan harus memberikan hasil yang nyata, kemudahan, efisiensi, atau pengalaman yang lebih baik.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOutput = fitur, halaman, API, dashboard, aplikasi.\u003c/li\u003e\n\u003cli\u003eOutcome = perubahan perilaku user, metrik bisnis naik, biaya turun, churn turun.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJika pertukaran value ini tidak sehat, fitur sebanyak apa pun tidak menyelamatkan produk.\u003c/p\u003e\n\u003ch3 id=\"project-vs-product-vs-service\"\u003eProject vs Product vs Service\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#project-vs-product-vs-service\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePerri membedakan tiga mindset:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProject: punya awal dan akhir; sukses diukur dari selesai.\u003c/li\u003e\n\u003cli\u003eProduct: hidup berkelanjutan; sukses diukur dari dampak dan relevansi.\u003c/li\u003e\n\u003cli\u003eService: pengalaman end-to-end, termasuk support, onboarding, billing, reliability, dan interaksi lain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau organisasi masih berpikir project, mereka akan terjebak menyelesaikan scope. Kalau berpikir product, mereka akan mengejar dampak. Kalau berpikir service, mereka akan mengejar pengalaman yang menyeluruh.\u003c/p\u003e\n\u003ch3 id=\"product-manager-sebagai-respons-sistemik\"\u003eProduct Manager sebagai Respons Sistemik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product-manager-sebagai-respons-sistemik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart II mengatakan: role PM bukan solusi langsung. PM adalah respons terhadap masalah sistemik ketika organisasi butuh orang yang menjaga arah product thinking.\u003c/p\u003e\n\u003cp\u003eDaftar babnya mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eBad Product Manager Archetypes\u003c/li\u003e\n\u003cli\u003eA Great Product Manager\u003c/li\u003e\n\u003cli\u003eThe Product Manager Career Path\u003c/li\u003e\n\u003cli\u003eOrganizing Your Teams\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBad PM archetypes muncul ketika organisasi output-driven. Contohnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePM yang cuma jadi project manager,\u003c/li\u003e\n\u003cli\u003ePM yang cuma jadi backlog secretary,\u003c/li\u003e\n\u003cli\u003ePM yang hanya meneruskan request stakeholder,\u003c/li\u003e\n\u003cli\u003ePM yang memonopoli keputusan sampai engineering dan design jadi eksekutor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang penting adalah bahwa PM yang sehat bukan tentang kontrol. PM yang sehat membantu tim memahami problem, memvalidasi opportunity, menghubungkan customer need dengan business goal, lalu mendukung keputusan produk yang lebih baik.\u003c/p\u003e\n\u003cp\u003eRole PM baru masuk setelah build trap dijelaskan karena PM adalah respons terhadap masalah sistemik. Kalau organisasi masih output-driven, PM akan dipaksa jadi penjaga backlog. Kalau organisasi outcome-driven, PM bisa jadi penghubung antara customer problem, business strategy, dan delivery team.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQuality of PM tidak bisa dipisahkan dari struktur organisasi.\u003c/li\u003e\n\u003cli\u003ePM buruk sering bukan hanya karena individunya, tapi karena sistemnya mendorong perilaku buruk.\u003c/li\u003e\n\u003cli\u003eRole clarity bergantung pada operating model.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"strategy-sebagai-sistem-keputusan\"\u003eStrategy sebagai Sistem Keputusan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#strategy-sebagai-sistem-keputusan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart III mendefinisikan strategy sebagai landasan keputusan.\u003c/p\u003e\n\u003cp\u003eDaftar babnya mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWhat Is Strategy?\u003c/li\u003e\n\u003cli\u003eStrategic Gaps\u003c/li\u003e\n\u003cli\u003eCreating a Good Strategic Framework\u003c/li\u003e\n\u003cli\u003eCompany-Level Vision and Strategic Intents\u003c/li\u003e\n\u003cli\u003eProduct Vision and Portfolio\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eStrategy adalah sistem keputusan, bukan slide cantik. Dia menjawab: kita mau menang di mana, dengan cara apa, untuk customer siapa, dan trade-off apa yang kita ambil?\u003c/p\u003e\n\u003cp\u003eTanpa strategy, product team mudah jatuh ke mode request-driven. Sales minta A, customer besar minta B, CEO minta C, kompetitor minta D, hingga roadmap menjadi daftar belanja fitur tanpa arah.\u003c/p\u003e\n\u003cp\u003eStrategic gap muncul ketika visi besar tidak terhubung ke pekerjaan tim sehari-hari. Vision harus dijembatani oleh strategic intent dan product vision, sehingga aktivitas tim sehari-hari sebenarnya mendukung tujuan yang lebih besar.\u003c/p\u003e\n\u003cp\u003eProduct vision harus lebih spesifik daripada company vision. Portfolio menjadi penting jika perusahaan punya banyak produk atau banyak area problem.\u003c/p\u003e\n\u003cp\u003ePolanya adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003evision\u003c/li\u003e\n\u003cli\u003estrategic intent\u003c/li\u003e\n\u003cli\u003eproduct vision\u003c/li\u003e\n\u003cli\u003eproduct initiatives\u003c/li\u003e\n\u003cli\u003eexperiments/features\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFitur berada di ujung bawah. Fitur adalah konsekuensi, bukan titik awal.\u003c/p\u003e\n\u003ch3 id=\"process-problem-exploration-dan-product-kata\"\u003eProcess: Problem Exploration dan Product Kata\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#process-problem-exploration-dan-product-kata\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart IV memperkenalkan Product Kata dan urutan proses:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe Product Kata\u003c/li\u003e\n\u003cli\u003eUnderstanding the Direction and Setting Success Metrics\u003c/li\u003e\n\u003cli\u003eProblem Exploration\u003c/li\u003e\n\u003cli\u003eSolution Exploration\u003c/li\u003e\n\u003cli\u003eBuilding and Optimizing Your Solution\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eProduct Kata tampaknya adalah pola berpikir iteratif: pahami tujuan, pahami kondisi sekarang, identifikasi obstacle, eksperimen, belajar, ulangi.\u003c/p\u003e\n\u003cp\u003eUrutan ini penting karena buku tidak langsung ke solusi. Dia mulai dari direction dan success metrics. Tanpa metrik sukses sebelum build, tim tidak punya navigasi yang jelas.\u003c/p\u003e\n\u003cp\u003eProblem exploration berfokus pada:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emasalah apa yang benar-benar terjadi?\u003c/li\u003e\n\u003cli\u003esiapa yang mengalami?\u003c/li\u003e\n\u003cli\u003eseberapa sering?\u003c/li\u003e\n\u003cli\u003eseberapa mahal dampaknya?\u003c/li\u003e\n\u003cli\u003eapakah problem ini worth solving?\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSolution exploration baru berfokus pada solusi yang mungkin, yang paling murah untuk divalidasi, yang paling mungkin menghasilkan outcome, dan bagaimana kita tahu solusi itu bekerja.\u003c/p\u003e\n\u003cp\u003eProduct process yang sehat memisahkan problem space dan solution space.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProblem space = realitas: pain, behavior, constraint, context.\u003c/li\u003e\n\u003cli\u003eSolution space = desain: fitur, flow, automation, UI, API, pricing, onboarding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau lompat terlalu cepat ke solution space, tim bisa saja membangun fitur rapi yang tidak penting. Product Kata adalah siklus belajar kecil, bukan sekali riset lalu build besar.\u003c/p\u003e\n\u003ch3 id=\"product-led-organization\"\u003eProduct-Led Organization\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product-led-organization\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePart V membahas kondisi organisasi yang mendukung product thinking.\u003c/p\u003e\n\u003cp\u003eChapter-nya mencakup:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eOutcome-Focused Communication\u003c/li\u003e\n\u003cli\u003eRewards and Incentives\u003c/li\u003e\n\u003cli\u003eSafety and Learning\u003c/li\u003e\n\u003cli\u003eBudgeting\u003c/li\u003e\n\u003cli\u003eCustomer Centricity\u003c/li\u003e\n\u003cli\u003eMarquetly: The Product-Led Company\u003c/li\u003e\n\u003cli\u003eAfterword dan Appendix untuk menguji apakah perusahaan benar-benar product-led\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInti bagian ini: build trap bukan cuma masalah individu. Build trap muncul dari sistem insentif.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau orang dipuji karena “fitur selesai banyak”, mereka akan mengejar fitur.\u003c/li\u003e\n\u003cli\u003eKalau budgeting berbasis project tahunan, tim akan mengemas pekerjaan sebagai project besar.\u003c/li\u003e\n\u003cli\u003eKalau komunikasi stakeholder selalu memakai output, tim akan melaporkan output.\u003c/li\u003e\n\u003cli\u003eKalau kegagalan eksperimen dihukum, orang akan pura-pura yakin dan berhenti belajar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eProduct-led organization bukan organisasi yang sekadar “punya PM”. Product-led berarti keputusan bisnis dan delivery diarahkan oleh outcome customer dan business impact.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau reward masih output-based, orang akan tetap mengejar output walaupun ngomongnya outcome.\u003c/li\u003e\n\u003cli\u003eKalau budgeting masih project-based, product team susah melakukan discovery berkelanjutan.\u003c/li\u003e\n\u003cli\u003eKalau tidak ada psychological safety, eksperimen akan berubah jadi sandiwara validasi.\u003c/li\u003e\n\u003cli\u003eCustomer centricity bukan “nanya customer mau fitur apa”, tapi memahami masalah dan konteks customer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eBagian akhir buku ini mengikat semua konsep sebelumnya ke sistem organisasi.\u003c/p\u003e\n\u003ch2 id=\"insight\"\u003eInsight\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBuild trap adalah jebakan metrik: “fitur selesai” vs “masalah customer selesai + dampak bisnis”.\u003c/li\u003e\n\u003cli\u003eProduct management tanpa pemahaman value mudah berubah menjadi backlog management.\u003c/li\u003e\n\u003cli\u003eProduct-led organization bukan sekadar punya PM; ini tentang sistem keputusan bisnis yang diarahkan oleh outcome.\u003c/li\u003e\n\u003cli\u003eRole PM efektif hanya kalau organisasi sudah outcome-driven.\u003c/li\u003e\n\u003cli\u003eStrategy adalah jembatan antara visi dan eksekusi; tanpa strategy roadmap jadi daftar belanja fitur.\u003c/li\u003e\n\u003cli\u003eProcess yang sehat memisahkan problem space dan solution space.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"link-ke-moc\"\u003eLink ke MOC\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#link-ke-moc\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.product-thinking\"\u003eMOC: Product Thinking\u003c/a\u003e — peta konten untuk product thinking dan build trap\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e — ringkasan buku yang lebih naratif\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.from-feature-to-service-design\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003c/a\u003e — learning path dari build trap ke service design\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.saas.product-vs-service\"\u003eProduct vs Service dalam SaaS\u003c/a\u003e — perbedaan product vs service untuk SaaS\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"pertanyaan-terbuka\"\u003ePertanyaan Terbuka\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pertanyaan-terbuka\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eBagaimana tim bisa membuat outcome yang terukur tanpa membuat discovery menjadi beban administratif?\u003c/li\u003e\n\u003cli\u003eSeberapa jauh mindset service harus membentuk cara product metric dipilih di SaaS B2B?\u003c/li\u003e\n\u003cli\u003eApa struktur feedback organisasi yang paling cepat mendeteksi when product thinking turns back into feature factory?\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #a03623;\" href=\"/sotoy/notes/tags.zettel\"\u003ezettel\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #154406;\" href=\"/sotoy/notes/tags.literature-note\"\u003eliterature-note\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct-thinking (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eoutcome-driven (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.product-thinking\"\u003eMOC: Product Thinking\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\u003e Why Dendron?\n\u003e\nDendron helps keep notes organized. Its \"seed\" and \"vault\" concepts make it easy to structure content and find what you need.\n\n## Find More\n\nIf you want to learn more or connect, check these links:\n\n- [Homepage (Dendron)](https://zeihanaulia.github.io/sotoy/)\n- [My GitHub](https://github.com/zeihanaulia)\n- [My Twitter / X](https://x.com/zeihanaulia)\n\nThanks for stopping by. If you have feedback or want to chat, feel free to reach out.\n"},"collectionChildren":null,"customHeadContent":null,"config":{"version":5,"dev":{"enablePreviewV2":
