ps":{"note":{"id":"handbook.ai.hybrid-api-self-host-strategy","title":"Hybrid API-first vs Self-host AI Strategy","desc":"Panduan keputusan antara API-first, self-host model kecil, dan GPU besar untuk enterprise biasa.","updated":1778604764488,"created":1778590925181,"tags":["handbook","ai","deployment"],"custom":{},"fname":"handbook.ai.hybrid-api-self-host-strategy","type":"note","vault":{"fsPath":"vault"},"contentHash":"3a8416f18c0d8b83003e884742158c97","links":[{"type":"frontmatterTag","from":{"fname":"handbook.ai.hybrid-api-self-host-strategy","id":"handbook.ai.hybrid-api-self-host-strategy","vaultName":"vault"},"value":"tags.handbook","alias":"handbook","xvault":false,"to":{"fname":"tags.handbook"}},{"type":"frontmatterTag","from":{"fname":"handbook.ai.hybrid-api-self-host-strategy","id":"handbook.ai.hybrid-api-self-host-strategy","vaultName":"vault"},"value":"tags.ai","alias":"ai","xvault":false,"to":{"fname":"tags.ai"}},{"type":"frontmatterTag","from":{"fname":"handbook.ai.hybrid-api-self-host-strategy","id":"handbook.ai.hybrid-api-self-host-strategy","vaultName":"vault"},"value":"tags.deployment","alias":"deployment","xvault":false,"to":{"fname":"tags.deployment"}}],"anchors":{"hybrid-ai-deployment-strategy-untuk-enterprise-yang-bukan-ai-first":{"type":"header","text":"Hybrid AI deployment strategy untuk enterprise yang bukan AI-first","value":"hybrid-ai-deployment-strategy-untuk-enterprise-yang-bukan-ai-first","line":14,"column":0,"depth":2},"kenapa-40-gpu-high-end-untuk-5-concurrent-coding-agents-biasanya-tidak-worth-it":{"type":"header","text":"Kenapa 40 GPU high-end untuk 5 concurrent coding agents biasanya tidak worth it","value":"kenapa-40-gpu-high-end-untuk-5-concurrent-coding-agents-biasanya-tidak-worth-it","line":18,"column":0,"depth":3},"model-risiko-dan-benefit-yang-harus-dimasukkan":{"type":"header","text":"Model risiko dan benefit yang harus dimasukkan","value":"model-risiko-dan-benefit-yang-harus-dimasukkan","line":34,"column":0,"depth":3},"empat-fase-strategi-yang-lebih-masuk-akal":{"type":"header","text":"Empat fase strategi yang lebih masuk akal","value":"empat-fase-strategi-yang-lebih-masuk-akal","line":52,"column":0,"depth":2},"phase-1--api-first-dengan-gateway-internal":{"type":"header","text":"Phase 1 — API-first dengan gateway internal","value":"phase-1--api-first-dengan-gateway-internal","line":54,"column":0,"depth":3},"phase-2--self-host-model-kecil-menengah-untuk-task-murah-dan-sensitif":{"type":"header","text":"Phase 2 — self-host model kecil-menengah untuk task murah dan sensitif","value":"phase-2--self-host-model-kecil-menengah-untuk-task-murah-dan-sensitif","line":71,"column":0,"depth":3},"phase-3--ukur-dulu-real-usage":{"type":"header","text":"Phase 3 — ukur dulu real usage","value":"phase-3--ukur-dulu-real-usage","line":89,"column":0,"depth":3},"phase-4--baru-hitung-dedicated-gpu-pool":{"type":"header","text":"Phase 4 — baru hitung dedicated GPU pool","value":"phase-4--baru-hitung-dedicated-gpu-pool","line":101,"column":0,"depth":3},"tier-model-yang-masuk-akal-untuk-kantor-biasa":{"type":"header","text":"Tier model yang masuk akal untuk kantor biasa","value":"tier-model-yang-masuk-akal-untuk-kantor-biasa","line":112,"column":0,"depth":2},"decision-rule-kasar":{"type":"header","text":"Decision rule kasar","value":"decision-rule-kasar","line":129,"column":0,"depth":2},"kapan-self-host-model-besar-bisa-dibenarkan":{"type":"header","text":"Kapan self-host model besar bisa dibenarkan","value":"kapan-self-host-model-besar-bisa-dibenarkan","line":145,"column":0,"depth":2},"kenapa-api-enterprise-biasanya-jadi-pilihan-terbaik-dulu":{"type":"header","text":"Kenapa API enterprise biasanya jadi pilihan terbaik dulu","value":"kenapa-api-enterprise-biasanya-jadi-pilihan-terbaik-dulu","line":166,"column":0,"depth":2},"ringkasannya":{"type":"header","text":"Ringkasannya","value":"ringkasannya","line":184,"column":0,"depth":2}},"children":[],"parent":"v8vcvx8qq0ha6rvthqocp2k","data":{}},"body":"\u003ch1 id=\"hybrid-api-first-vs-self-host-ai-strategy\"\u003eHybrid API-first vs Self-host AI Strategy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hybrid-api-first-vs-self-host-ai-strategy\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"hybrid-ai-deployment-strategy-untuk-enterprise-yang-bukan-ai-first\"\u003eHybrid AI deployment strategy untuk enterprise yang bukan AI-first\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hybrid-ai-deployment-strategy-untuk-enterprise-yang-bukan-ai-first\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau tujuan kantor cuma internal productivity / coding assistant, investasi deploy model 400B+ on-prem biasanya bukan keputusan bisnis yang sehat. Ini bukan soal \"bisa atau nggak\", tapi soal apakah value-nya cukup besar untuk membayar biaya komputasi, kapasitas, operasi, dan risiko.\u003c/p\u003e\n\u003ch3 id=\"kenapa-40-gpu-high-end-untuk-5-concurrent-coding-agents-biasanya-tidak-worth-it\"\u003eKenapa 40 GPU high-end untuk 5 concurrent coding agents biasanya tidak worth it\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-40-gpu-high-end-untuk-5-concurrent-coding-agents-biasanya-tidak-worth-it\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBiasanya hanya perusahaan yang AI compute-nya memang core business yang mau masuk level itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ehyperscaler atau cloud provider\u003c/li\u003e\n\u003cli\u003emodel lab dan R\u0026#x26;D lab\u003c/li\u003e\n\u003cli\u003ebig tech dengan produk AI global\u003c/li\u003e\n\u003cli\u003esovereign AI / government\u003c/li\u003e\n\u003cli\u003eenterprise finansial besar dengan volume dan compliance ekstrem\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk perusahaan non-AI, yang lebih realistis adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAPI-first untuk workload frontier dan tugas kompleks\u003c/li\u003e\n\u003cli\u003eself-host model kecil-menengah untuk task murah, sensitif, dan routable\u003c/li\u003e\n\u003cli\u003einternal gateway untuk kontrol data, audit, policy, dan fallback\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"model-risiko-dan-benefit-yang-harus-dimasukkan\"\u003eModel risiko dan benefit yang harus dimasukkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#model-risiko-dan-benefit-yang-harus-dimasukkan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eJangan bandingkan hanya token API vs listrik GPU. Masukkan juga semua biaya tersembunyi:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGPU depreciation\u003c/li\u003e\n\u003cli\u003eserver, storage, networking\u003c/li\u003e\n\u003cli\u003epower dan cooling\u003c/li\u003e\n\u003cli\u003erack dan facility\u003c/li\u003e\n\u003cli\u003eMLOps / DevOps / SRE salary\u003c/li\u003e\n\u003cli\u003eon-call incident\u003c/li\u003e\n\u003cli\u003emodel upgrade / quantization / patching\u003c/li\u003e\n\u003cli\u003eobservability dan monitoring\u003c/li\u003e\n\u003cli\u003esecurity review / compliance validation\u003c/li\u003e\n\u003cli\u003edowntime / incident cost\u003c/li\u003e\n\u003cli\u003eunderutilization\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eJika utilization hanya tinggi beberapa jam per hari, ROI-nya bisa jadi sangat buruk. API menang karena lo beli kapasitas elastis, bukan beli mesin yang idle.\u003c/p\u003e\n\u003ch2 id=\"empat-fase-strategi-yang-lebih-masuk-akal\"\u003eEmpat fase strategi yang lebih masuk akal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#empat-fase-strategi-yang-lebih-masuk-akal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"phase-1--api-first-dengan-gateway-internal\"\u003ePhase 1 — API-first dengan gateway internal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-1--api-first-dengan-gateway-internal\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eGunakan provider frontier untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecoding agent hard task\u003c/li\u003e\n\u003cli\u003ereasoning panjang dan kompleks\u003c/li\u003e\n\u003cli\u003edocument generation berkualitas tinggi\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGateway internal harus menambahkan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eredaction / masking\u003c/li\u003e\n\u003cli\u003eaudit log\u003c/li\u003e\n\u003cli\u003epolicy / approval flow\u003c/li\u003e\n\u003cli\u003ebudget limit\u003c/li\u003e\n\u003cli\u003emodel routing\u003c/li\u003e\n\u003cli\u003efallback\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"phase-2--self-host-model-kecil-menengah-untuk-task-murah-dan-sensitif\"\u003ePhase 2 — self-host model kecil-menengah untuk task murah dan sensitif\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-2--self-host-model-kecil-menengah-untuk-task-murah-dan-sensitif\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eSelf-host cocok untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003esummarization\u003c/li\u003e\n\u003cli\u003eclassification\u003c/li\u003e\n\u003cli\u003eextraction\u003c/li\u003e\n\u003cli\u003ePII detection/masking\u003c/li\u003e\n\u003cli\u003ereranking\u003c/li\u003e\n\u003cli\u003erouting\u003c/li\u003e\n\u003cli\u003esimple code review\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eModel yang masuk akal:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eQwen 7B/14B/32B/72B\u003c/li\u003e\n\u003cli\u003eLLaMA- or Mistral-class kecil-menengah\u003c/li\u003e\n\u003cli\u003emodel lokal untuk inference cepat dan data-sensitive\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"phase-3--ukur-dulu-real-usage\"\u003ePhase 3 — ukur dulu real usage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-3--ukur-dulu-real-usage\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKumpulkan telemetry 2–3 bulan sebelum bicara GPU besar:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emonthly API spend\u003c/li\u003e\n\u003cli\u003eaverage tokens per request\u003c/li\u003e\n\u003cli\u003epeak concurrent sessions\u003c/li\u003e\n\u003cli\u003efailure rate\u003c/li\u003e\n\u003cli\u003elatency requirement\u003c/li\u003e\n\u003cli\u003edata class (public / internal / confidential / PII)\u003c/li\u003e\n\u003cli\u003eestimated cost of self-host\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"phase-4--baru-hitung-dedicated-gpu-pool\"\u003ePhase 4 — baru hitung dedicated GPU pool\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#phase-4--baru-hitung-dedicated-gpu-pool\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHanya kalau:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAPI spend sudah mencapai angka ratusan juta / lebih per bulan\u003c/li\u003e\n\u003cli\u003evolume sudah stabil dan predictable\u003c/li\u003e\n\u003cli\u003eada kebutuhan data yang benar-benar tidak boleh keluar\u003c/li\u003e\n\u003cli\u003eada use case yang butuh latency lokal dan kontrol penuh\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau tidak, self-host model raksasa hanya akan jadi vanity infrastructure.\u003c/p\u003e\n\u003ch2 id=\"tier-model-yang-masuk-akal-untuk-kantor-biasa\"\u003eTier model yang masuk akal untuk kantor biasa\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tier-model-yang-masuk-akal-untuk-kantor-biasa\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eTier 1 — API frontier\n  OpenAI / Azure OpenAI / Anthropic / Bedrock / OpenRouter-style router\n  untuk coding agent, reasoning berat, generation kompleks.\n\nTier 2 — self-host kecil-menengah\n  Qwen 7B/14B/32B/72B untuk summarization, extraction, PII masking, routing, reranking.\n\nTier 3 — private gateway\n  semua request lewat gateway internal: masking, policy, audit log, budget, model routing, fallback.\n\nTier 4 — deploy GPU besar hanya kalau volume sudah terbukti\n  Bukan asumsi; dari telemetry nyata.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"decision-rule-kasar\"\u003eDecision rule kasar\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#decision-rule-kasar\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eAPI monthly cost \u0026#x3C; biaya 1–2 engineer infra + GPU rental/amortization\n  =\u003e pakai API.\n\nData tidak boleh keluar sama sekali\n  =\u003e self-host, tapi turunkan target model size.\n\nUsage sangat tinggi dan stabil 24/7\n  =\u003e self-host mulai masuk akal.\n\nUsage bursty / belum jelas\n  =\u003e API jauh lebih masuk akal.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"kapan-self-host-model-besar-bisa-dibenarkan\"\u003eKapan self-host model besar bisa dibenarkan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kapan-self-host-model-besar-bisa-dibenarkan\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBiasanya hanya kalau:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eworkload inference adalah core produk atau moat\u003c/li\u003e\n\u003cli\u003evolume sangat besar dan stabil\u003c/li\u003e\n\u003cli\u003ecompliance memaksa data on-prem\u003c/li\u003e\n\u003cli\u003eada tim operasi yang siap menangani MLOps besar\u003c/li\u003e\n\u003cli\u003eada model custom / fine-tuning yang jadi nilai tambah utama\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eUntuk kantor biasa, lebih sering masuk akal adalah kombinasi:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eCoding hard task        -\u003e API frontier model\nRepo understanding      -\u003e RAG + embeddings lokal\nSummarization           -\u003e model lokal 7B/14B/32B\nPII detection/masking   -\u003e lokal\nPolicy guardrail        -\u003e lokal + rules\nLong coding agent       -\u003e API, dengan redaction dan allowlist context\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"kenapa-api-enterprise-biasanya-jadi-pilihan-terbaik-dulu\"\u003eKenapa API enterprise biasanya jadi pilihan terbaik dulu\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-api-enterprise-biasanya-jadi-pilihan-terbaik-dulu\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ecost awal rendah\u003c/li\u003e\n\u003cli\u003escaling ditangani provider\u003c/li\u003e\n\u003cli\u003etim bisa fokus ke produk, bukan infra serving\u003c/li\u003e\n\u003cli\u003emodel frontier siap dipakai\u003c/li\u003e\n\u003cli\u003eprovider besar biasanya punya compliance support, DPA, retention control\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eRisiko utama yang harus dikelola:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003edata governance\u003c/li\u003e\n\u003cli\u003evendor lock-in\u003c/li\u003e\n\u003cli\u003erecurring token cost\u003c/li\u003e\n\u003cli\u003elatency\u003c/li\u003e\n\u003cli\u003eapproval compliance\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau bisnisnya belum butuh GPU besar, maka prioritasnya adalah bangun layer kontrolnya: gateway, policy, observability, model routing.\u003c/p\u003e\n\u003ch2 id=\"ringkasannya\"\u003eRingkasannya\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#ringkasannya\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk enterprise non-AI, strategi paling rasional adalah:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAPI-first untuk tugas frontier dan yang butuh kualitas model tinggi.\u003c/li\u003e\n\u003cli\u003eSelf-host model kecil-menengah untuk task murah dan sensitif.\u003c/li\u003e\n\u003cli\u003ePastikan semua request lewat gateway internal.\u003c/li\u003e\n\u003cli\u003eKumpulkan telemetry sebelum mulai investasi GPU besar.\u003c/li\u003e\n\u003cli\u003eOnly deploy model besar ketika volume, cost, dan compliance benar-benar menyokongnya.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eJika mau, bisa ditambah link ke \u003ccode\u003e[[til.ai.vllm-opencode-context-pressure]]\u003c/code\u003e sebagai catatan operasi self-host vLLM dan kapabilitas admission control.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ehandbook (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edeployment (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflecti
