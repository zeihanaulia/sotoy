,"text":"3. Agentic workflow vs cognitive debt","value":"3-agentic-workflow-vs-cognitive-debt","line":39,"column":0,"depth":3},"4-kenapa-ini-bukan-abstraction-layer-baru":{"type":"header","text":"4. Kenapa ini bukan abstraction layer baru?","value":"4-kenapa-ini-bukan-abstraction-layer-baru","line":50,"column":0,"depth":3},"5-kontradiksi-human-orchestrator":{"type":"header","text":"5. Kontradiksi human orchestrator","value":"5-kontradiksi-human-orchestrator","line":59,"column":0,"depth":3},"6-posisi-sehat-ai":{"type":"header","text":"6. Posisi sehat AI","value":"6-posisi-sehat-ai","line":65,"column":0,"depth":3},"struktur-argumen":{"type":"header","text":"Struktur Argumen","value":"struktur-argumen","line":76,"column":0,"depth":2},"prinsip-kunci":{"type":"header","text":"Prinsip Kunci","value":"prinsip-kunci","line":93,"column":0,"depth":2},"contoh-praktis":{"type":"header","text":"Contoh Praktis","value":"contoh-praktis","line":104,"column":0,"depth":2},"alert-junior-dan-supervision-paradox":{"type":"header","text":"Alert: Junior dan Supervision Paradox","value":"alert-junior-dan-supervision-paradox","line":120,"column":0,"depth":2},"relevansi":{"type":"header","text":"Relevansi","value":"relevansi","line":128,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":140,"column":0,"depth":2},"lihat-juga":{"type":"header","text":"Lihat Juga","value":"lihat-juga","line":151,"column":0,"depth":2}},"children":[],"parent":"notes","data":{}},"body":"\u003ch1 id=\"agentic-coding-is-a-trap\"\u003eAgentic Coding Is a Trap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#agentic-coding-is-a-trap\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca artikel Lars Faye sebagai peringatan, bukan penolakan terhadap AI. Yang gue tangkep adalah bahwa dia sedang menyerang model kerja tertentu: \u003cstrong\u003eagentic coding\u003c/strong\u003e, di mana AI mengambil alih inti problem solving sementara manusia cuma ngarahin, ngawasin, dan merevisi.\u003c/p\u003e\n\u003cp\u003eInti argumennya buat gue jelas: menulis code bukan cuma produksi syntax; itu medium berpikir. Kalau manusia melepas loop implementasi, yang hilang bukan cuma output, tapi juga proses membangun mental model.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"6-pertanyaan-kunci\"\u003e6 Pertanyaan Kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-pertanyaan-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-target-kritik\"\u003e1. Target kritik\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-target-kritik\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBuat gue, targetnya bukan AI-assisted coding secara umum. Dia melawan hype yang bilang manusia cukup menulis plan/spec lalu mundur dari code-writing.\u003c/p\u003e\n\u003ch3 id=\"2-kenapa-agentic-coding-trap\"\u003e2. Kenapa agentic coding \"trap\"?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-kenapa-agentic-coding-trap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUntuk gue, trap-nya ada di tiga lapis:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003epsikologis: terasa seperti jadi \"director\", padahal pemahaman makin kabur.\u003c/li\u003e\n\u003cli\u003eteknis: non-determinism AI memaksa ekosistem tambahan untuk spesifikasi, review, guardrail, retry.\u003c/li\u003e\n\u003cli\u003eekonomi: vendor dependency dan biaya token jadi sulit diprediksi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-agentic-workflow-vs-cognitive-debt\"\u003e3. Agentic workflow vs cognitive debt\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-agentic-workflow-vs-cognitive-debt\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eAgentic workflow memotong friction produktif yang biasa memaksa developer untuk:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ememecah masalah,\u003c/li\u003e\n\u003cli\u003ebikin hipotesis,\u003c/li\u003e\n\u003cli\u003emengetes,\u003c/li\u003e\n\u003cli\u003edebugging,\u003c/li\u003e\n\u003cli\u003engerasain konsekuensi desain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTanpa friction itu, output bisa muncul. Tapi pemahaman yang biasanya ikut tumbuh jadi lemah.\u003c/p\u003e\n\u003ch3 id=\"4-kenapa-ini-bukan-abstraction-layer-baru\"\u003e4. Kenapa ini bukan abstraction layer baru?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-kenapa-ini-bukan-abstraction-layer-baru\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eMenurut gue, analogi klasik compiler/framework salah tempat.\u003c/p\u003e\n\u003cp\u003eAbstraction sehat itu mengurangi detail sambil tetap menjaga kontrol.\nLLM agentic malah mengurangi kontak langsung sekaligus nambah ambiguitas.\u003c/p\u003e\n\u003cp\u003eKata kunci yang gue suka: \u003cstrong\u003e\"a higher level of ambiguity is not a higher level of abstraction.\"\u003c/strong\u003e\u003c/p\u003e\n\u003ch3 id=\"5-kontradiksi-human-orchestrator\"\u003e5. Kontradiksi human orchestrator\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-kontradiksi-human-orchestrator\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eKalau seseorang cuma jadi “human orchestrator”, itu terdengar elite. Tapi praktiknya, posisi itu butuh kompetensi yang cuma tumbuh dari implementasi langsung.\u003c/p\u003e\n\u003cp\u003eReview code saja gak cukup untuk membentuk kemampuan itu.\u003c/p\u003e\n\u003ch3 id=\"6-posisi-sehat-ai\"\u003e6. Posisi sehat AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#6-posisi-sehat-ai\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBuat gue, AI paling sehat kalau jadi bantuan sekunder:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebantu bikin spec dan plan,\u003c/li\u003e\n\u003cli\u003etetap pegang implementasi sendiri sampai paham,\u003c/li\u003e\n\u003cli\u003epakai pseudocode supaya jarak niat-ke-code tetap dekat,\u003c/li\u003e\n\u003cli\u003ereview output hanya dalam batas yang bisa diawasi dalam satu sitting,\u003c/li\u003e\n\u003cli\u003ejangan minta AI kerjakan sesuatu yang lo sendiri nggak bisa lakukan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"struktur-argumen\"\u003eStruktur Argumen\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#struktur-argumen\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue menangkap struktur argumennya seperti ini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAgentic coding menjauhkan manusia dari implementasi.\u003c/li\u003e\n\u003cli\u003eJarak itu mengurangi friction produktif.\u003c/li\u003e\n\u003cli\u003eHilangnya friction melemahkan mental model dan critical thinking.\u003c/li\u003e\n\u003cli\u003eCritical thinking diperlukan untuk mengawasi output AI.\u003c/li\u003e\n\u003cli\u003eMakin sering coding diserahkan ke AI, makin lemah kemampuan supervisi.\u003c/li\u003e\n\u003cli\u003eSkill internal turun, ketergantungan vendor naik.\u003c/li\u003e\n\u003cli\u003ePermukaan terlihat cepat, tapi sistem jadi rapuh.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eFormula ini bikin artikelnya terasa bukan sekadar keluhan. Dia membangun pola:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003espeed without intimacy → weaker understanding → weaker supervision → more dependence → more fragility\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003chr\u003e\n\u003ch2 id=\"prinsip-kunci\"\u003ePrinsip Kunci\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-kunci\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCoding adalah medium berpikir.\u003c/strong\u003e Bukan sekadar langkah terakhir setelah planning.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHigher ambiguity ≠ higher abstraction.\u003c/strong\u003e LLM bisa bikin kamu ngomong lebih tinggi level tapi justru nambah ambiguitas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFriction produktif itu aset.\u003c/strong\u003e Debugging dan kegagalan langsung melatih mental model.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReview tanpa produksi tidak cukup.\u003c/strong\u003e Jadi editor tanpa pernah nulis panjang sendiri membuat kemampuan design jadi dangkal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAI harus diturunkan statusnya.\u003c/strong\u003e Jadi tool bantu, bukan aktor utama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eVendor lock-in lebih dari dependency.\u003c/strong\u003e Ini soal erosi kapasitas independen dan habitus kerja.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"contoh-praktis\"\u003eContoh Praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eKalau lo pakai pola \u003cem\u003e\"biarkan AI generate code, dan manusia cukup review\"\u003c/em\u003e, indikatornya biasanya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ebanyak prompt tuning,\u003c/li\u003e\n\u003cli\u003ebanyak retry,\u003c/li\u003e\n\u003cli\u003ebanyak guardrail,\u003c/li\u003e\n\u003cli\u003eoutput yang tampak benar tapi nggak dipahami,\u003c/li\u003e\n\u003cli\u003ereview yang jadi beban.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eAlternatif yang gue anggap lebih sehat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAI bantu bikin outline, pembagian tugas, atau pseudocode.\u003c/li\u003e\n\u003cli\u003edeveloper tetap implementasi sebagian sendiri.\u003c/li\u003e\n\u003cli\u003eAI jadi asisten interaktif untuk eksplorasi, bukan agen eksekusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"alert-junior-dan-supervision-paradox\"\u003eAlert: Junior dan Supervision Paradox\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#alert-junior-dan-supervision-paradox\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMenurut gue, junior paling rentan karena belum punya stok friction historis. Mereka bisa langsung terseret ke workflow \"spec writer + agent reviewer\" tanpa pernah bangun pengalaman teknis dari nol.\u003c/p\u003e\n\u003cp\u003eReview code gak bisa menggantikan pengalaman membangun, debugging, dan discovery failure mode.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"relevansi\"\u003eRelevansi\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#relevansi\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue melihat artikel ini paling dekat dengan konsep \u003cstrong\u003eautomation complacency\u003c/strong\u003e di penerbangan dan operasi sistem:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eautomation meningkatkan throughput,\u003c/li\u003e\n\u003cli\u003emanusia jadi operator pengawas,\u003c/li\u003e\n\u003cli\u003eskill manual menurun,\u003c/li\u003e\n\u003cli\u003esaat edge case datang, pilot/operator kurang siap.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDalam konteks coding, degradasi skill sering lebih samar. AI output bisa tampak berjalan sementara, sampai sistem makin besar dan sulit di-debug.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eJangan biarkan AI mengambil alih bagian kerja yang justru menjaga ketajaman berpikir teknismu.\u003c/p\u003e\n\u003cp\u003eKalimat yang gue pegang:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau lo masih bisa jawab konkret dalam 10 menit pertama: \u003cem\u003e\"user dari kondisi buruk apa berubah ke kondisi lebih baik apa?\"\u003c/em\u003e — berarti service atau workflow itu mungkin sehat.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi coding, kalau lo gak bisa menjawab: \u003cem\u003e\"apa yang lo perlu pahami setelah nulis baris ini?\"\u003c/em\u003e, berarti lo mungkin lagi melewatkan medium berpikir.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"lihat-juga\"\u003eLihat Juga\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#lihat-juga\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding-is-a-trap\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eAgentic Coding Is a Trap\u003c/a\u003e — note analisis ini.\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003evault2/daily.journal.2026.05.12 (Private)\u003c/a\u003e — refleksi harian atas artikel Lars Faye.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ecoding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eautomation (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eskill (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca class=\"color-tag\" style=\"--tag-color: #ff9a8a;\" href=\"/sotoy/notes/tags.workflow\"\u003eworkflow\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-coding-is-a-trap\"\u003e\u003c
