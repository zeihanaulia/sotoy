"}],"anchors":{"referensi-utama":{"type":"header","text":"Referensi utama","value":"referensi-utama","line":17,"column":0,"depth":2},"apa-yang-penting-dari-presidio":{"type":"header","text":"Apa yang penting dari Presidio","value":"apa-yang-penting-dari-presidio","line":22,"column":0,"depth":2},"apa-yang-penting-dari-detect-secrets":{"type":"header","text":"Apa yang penting dari detect-secrets","value":"apa-yang-penting-dari-detect-secrets","line":31,"column":0,"depth":2},"apa-yang-penting-dari-pii-extract-base":{"type":"header","text":"Apa yang penting dari pii-extract-base","value":"apa-yang-penting-dari-pii-extract-base","line":39,"column":0,"depth":2},"pelajaran-arsitektur":{"type":"header","text":"Pelajaran arsitektur","value":"pelajaran-arsitektur","line":48,"column":0,"depth":2},"takeaway":{"type":"header","text":"Takeaway","value":"takeaway","line":60,"column":0,"depth":2},"riset-terbaru-2026":{"type":"header","text":"Riset terbaru 2026","value":"riset-terbaru-2026","line":66,"column":0,"depth":2},"temuan-tambahan-user-supplied-pii-dan-personal-ai":{"type":"header","text":"Temuan tambahan: user-supplied PII dan personal AI","value":"temuan-tambahan-user-supplied-pii-dan-personal-ai","line":75,"column":0,"depth":2},"use-case-hands-on-untuk-security-agent":{"type":"header","text":"Use case hands-on untuk security agent","value":"use-case-hands-on-untuk-security-agent","line":87,"column":0,"depth":2},"langkah-bukti-keamanan-agent":{"type":"header","text":"Langkah bukti keamanan agent","value":"langkah-bukti-keamanan-agent","line":93,"column":0,"depth":2},"contoh-snippet-pii-safe-agent":{"type":"header","text":"Contoh snippet PII-safe agent","value":"contoh-snippet-pii-safe-agent","line":101,"column":0,"depth":2},"catatan-praktis":{"type":"header","text":"Catatan praktis","value":"catatan-praktis","line":164,"column":0,"depth":2},"prinsip-pii-safe-untuk-llm-agent":{"type":"header","text":"Prinsip PII-safe untuk LLM agent","value":"prinsip-pii-safe-untuk-llm-agent","line":170,"column":0,"depth":2},"menangani-user-supplied-pii":{"type":"header","text":"Menangani user-supplied PII","value":"menangani-user-supplied-pii","line":182,"column":0,"depth":2}},"children":["notes.security.pii-agent-architecture.agent-boundary-pii-filtering","notes.security.pii-agent-architecture.agent-execution-environment","notes.security.pii-agent-architecture.camp","notes.security.pii-agent-architecture.chatbot-privacy-sensitivity","notes.security.pii-agent-architecture.hardening-x402","notes.security.pii-agent-architecture.llm-redactor","notes.security.pii-agent-architecture.memory-autonomous-agents","notes.security.pii-agent-architecture.opal","notes.security.pii-agent-architecture.pii-shield","notes.security.pii-agent-architecture.repair","notes.security.pii-agent-architecture.safeclaw-r","notes.security.pii-agent-architecture.separable-expert-architecture","notes.security.pii-agent-architecture.webpii"],"parent":"pzi0cboc61frvywcjrbk550","data":{}},"body":"\u003ch1 id=\"arsitektur-pii-filter-dan-security-agent\"\u003eArsitektur PII filter dan security agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#arsitektur-pii-filter-dan-security-agent\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cul\u003e\n\u003cli\u003eRiset ini fokus pada desain security agent yang bisa deteksi dan redaksi PII, bukan sekadar menebak entitas sensitif dengan satu regex.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"referensi-utama\"\u003eReferensi utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#referensi-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003emicrosoft/presidio\u003c/code\u003e: SDK modular untuk identifikasi dan de-identifikasi PII di teks dan gambar.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eYelp/detect-secrets\u003c/code\u003e: model baseline+diff untuk fokus pada perubahan baru dalam repositori kode.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epiisa/pii-extract-base\u003c/code\u003e: engine infrastruktur yang menyediakan framework, sementara deteksi aktual disuplai oleh plugin eksternal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-penting-dari-presidio\"\u003eApa yang penting dari Presidio\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-penting-dari-presidio\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eMemisahkan peran utama: analyzer, anonymizer, image redactor, dan structured PII.\u003c/li\u003e\n\u003cli\u003eMenggabungkan teknologi: NER, regex, rule-based logic, checksum, dan konektor ke model eksternal.\u003c/li\u003e\n\u003cli\u003eMenekankan bahwa deteksi otomatis membantu, tapi tidak bisa menjamin semua sensitive info terdeteksi.\u003c/li\u003e\n\u003cli\u003eIni cocok untuk agent privacy filter yang perlu:\n\u003cul\u003e\n\u003cli\u003eidentifikasi PII yang bisa di-redaksi,\u003c/li\u003e\n\u003cli\u003esupport multi-format (text + image),\u003c/li\u003e\n\u003cli\u003ecustom recognizer dan policy per domain.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-penting-dari-detect-secrets\"\u003eApa yang penting dari detect-secrets\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-penting-dari-detect-secrets\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ePattern utamanya: buat baseline, lalu cek perubahan baru.\u003c/li\u003e\n\u003cli\u003eFokus pada \"baru masuk\" mengurangi noise dan false positive dari artefak lama.\u003c/li\u003e\n\u003cli\u003eUntuk security agent, ini berarti:\n\u003cul\u003e\n\u003cli\u003eagent harus bisa mengenali konteks perubahan, bukan scan penuh setiap saat,\u003c/li\u003e\n\u003cli\u003eaudit daftar sensitif bisa dipisah antara item lama dan item baru,\u003c/li\u003e\n\u003cli\u003eini lebih efisien untuk pipeline yang dipakai terus-menerus.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"apa-yang-penting-dari-pii-extract-base\"\u003eApa yang penting dari pii-extract-base\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#apa-yang-penting-dari-pii-extract-base\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eEngine ini tidak melakukan deteksi sendiri; dia hanya menyediakan infrastruktur untuk task PII.\u003c/li\u003e\n\u003cli\u003eBukti arsitektur: \u003ccode\u003ecore engine\u003c/code\u003e + \u003ccode\u003edetector plugin\u003c/code\u003e + \u003ccode\u003edata base\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eArtinya desain terbaik adalah memisahkan platform dari aturan deteksi.\u003c/li\u003e\n\u003cli\u003eDengan begitu, kita bisa menambahkan:\n\u003cul\u003e\n\u003cli\u003eplugin baru untuk tipe PII khusus,\u003c/li\u003e\n\u003cli\u003emodel external untuk nama/alamat/organisasi,\u003c/li\u003e\n\u003cli\u003efallback regex/checksum untuk angka dan format tertentu.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"pelajaran-arsitektur\"\u003ePelajaran arsitektur\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#pelajaran-arsitektur\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDesain pipeline modular:\n\u003col\u003e\n\u003cli\u003ecollector (kumpulkan teks/dokumen/image),\u003c/li\u003e\n\u003cli\u003edetector (identifikasi kemungkinan PII),\u003c/li\u003e\n\u003cli\u003epolicy engine (tentukan apakah flag, mask, redact, atau audit),\u003c/li\u003e\n\u003cli\u003eredactor/anonymizer (hasilkan output aman).\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003eGunakan plugin atau registry untuk model dan pola PII; jangan hardcode semua jenis entitas di satu layer.\u003c/li\u003e\n\u003cli\u003eMinimal dua output penting:\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eflagged item\u003c/code\u003e untuk audit dan logging,\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eredacted output\u003c/code\u003e untuk data yang boleh diteruskan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003eTambahkan kemampuan incremental update kalau agent jalan terus: jangan rebuild seluruh index setiap input.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"takeaway\"\u003eTakeaway\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#takeaway\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eSecurity agent untuk PII paling kuat kalau dibangun sebagai sistem, bukan skrip tunggal.\u003c/li\u003e\n\u003cli\u003ePresidio memberi pola deteksi + redaksi; detect-secrets memberi pola change-focused scan; pii-extract-base memberi pola engine-plugin.\u003c/li\u003e\n\u003cli\u003eFokus arsitektur harus pada modularitas, auditability, dan pemisahan antara deteksi dan tindakan.\u003c/li\u003e\n\u003cli\u003eJika ingin lanjut, review dokumentasi resmi masing-masing repo karena akses riset masih partial dari batas rate limit/API.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"riset-terbaru-2026\"\u003eRiset terbaru 2026\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#riset-terbaru-2026\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCAMP (2604.16521)\u003c/code\u003e: fokus pada PII cross-turn dalam percakapan agentik, tidak cukup hanya mask tiap pesan. Sistem ini menjawab tiga pertanyaan: kelemahan per-turn masking, formalization risiko cumulative exposure melalui CPE, dan desain middleware untuk session-aware protection. \u003ca href=\"/sotoy/notes/zettel.1777875390302\"\u003eCross-turn PII exposure requires session-aware masking, not per-turn masking\u003c/a\u003e (detail note)\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ecamp.*\u003c/code\u003e notes: \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.per-turn-masking\"\u003ePer-turn masking gagal untuk agentic multi-turn chat\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.cpe\"\u003eCPE: mengukur risiko PII sebagai akumulasi session, bukan message\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.why-camp\"\u003eCAMP: apa yang baru dari solusi session-aware PII middleware\u003c/a\u003e, \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp.indexed-masking\"\u003eIndexed masking untuk agentic PII protection\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLLM-Redactor (2604.12064)\u003c/code\u003e: evaluasi empiris 8 teknik request privacy untuk LLM, termasuk local inference, redaction, semantik rephrasing, TEE, split inference, FHE, MPC, dan DP. Kombinasi paling praktis: local + redact + rephrase. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.llm-redactor\"\u003eLLM-Redactor: Privacy-Preserving LLM Requests\u003c/a\u003e (detail note)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eHardening x402 (2604.11430)\u003c/code\u003e: contoh nyata PII-safe agentic payment, dengan middleware pre-execution filter untuk metadata x402 agar URL/deskripsi/reason string yang mengandung PII ter-redact sebelum request dikirim. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.hardening-x402\"\u003eHardening x402: PII-Safe Agentic Payments\u003c/a\u003e (detail note)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePII boundary antara agent\u003c/code\u003e: adaptasi pola x402 ke dua-agent workflow, di mana brainstorming agent dan coding agent dipisahkan oleh PII guardrail dan sanitized artifact. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.agent-boundary-pii-filtering\"\u003ePII guardrail antar-agent: dari x402 ke brainstorming + coding agent\u003c/a\u003e (detail note)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePII Shield (2603.24895)\u003c/code\u003e: browser overlay yang memberi pengguna kontrol langsung atas redaction prompt AI, termasuk local LLM untuk deteksi entitas dan aktivitas smokescreen untuk mitigasi profiling. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.pii-shield\"\u003ePII Shield: Browser Overlay for Personal Data Management\u003c/a\u003e (detail note)\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eWebPII (2603.17357)\u003c/code\u003e: benchmark visual PII detection untuk screenshot UI agent/computer-use, yang menyorot kebutuhan sanitasi PII di visual pipeline, bukan hanya teks. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.webpii\"\u003eWebPII: Visual PII Detection for Computer-Use Agents\u003c/a\u003e (detail note)\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"temuan-tambahan-user-supplied-pii-dan-personal-ai\"\u003eTemuan tambahan: user-supplied PII dan personal AI\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#temuan-tambahan-user-supplied-pii-dan-personal-ai\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eOpal: Private Memory for Personal AI (2604.02522)\u003c/code\u003e: relevant untuk agent yang menyimpan konteks personal user secara lokal, membantu memisahkan informasi pengguna dari prompt yang dikirim ke model. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.opal\"\u003eOpal: Private Memory for Personal AI\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eSafeClaw-R: Towards Safe and Secure Multi-Agent Personal Assistants (2603.28807)\u003c/code\u003e: fokus pada keamanan dan privasi pada personal assistant multi-agent, cocok untuk kasus user request yang berisi data sensitif. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.safeclaw-r\"\u003eSafeClaw-R: Safe Multi-Agent Personal Assistants\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eSeparable Expert Architecture: Toward Privacy-Preserving LLM Personalization via Composable Adapters and Deletable User Proxies (2604.21571)\u003c/code\u003e: desain LLM personalization yang bisa meminimalkan exposure data personal dengan adapter yang bisa dihapus. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.separable-expert-architecture\"\u003eSeparable Expert Architecture: Privacy-Preserving Personalization\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eRePAIR: Interactive Machine Unlearning through Prompt-Aware Model Repair (2604.12820)\u003c/code\u003e: relevan untuk fallback ketika user-supplied PII sudah terlanjur mendarat di model, dengan prompt-aware model repair sebagai mekanisme mitigate. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.repair\"\u003eRePAIR: Redacting Personal Information in Response\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003ePrivacy as Permissible Operations: An ABAC Framework for Policy-Law Compliance (2604.10832)\u003c/code\u003e: memberi kerangka akses kontrol terhadap data personal pada aplikasi berbasis AI, penting untuk mendefinisikan policy sebelum agent mengeksekusi query.\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eAn AI Agent Execution Environment to Safeguard User Data (2604.19657)\u003c/code\u003e: model lingkungan eksekusi yang memisahkan akses data sensitif dari pipeline utama model. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.agent-execution-environment\"\u003eAI Agent Execution Environment to Safeguard User Data\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eAre Chatbots Ready for Privacy-Sensitive Applications? An Investigation into Input Regurgitation and Prompt-Induced Sanitization (2305.15008)\u003c/code\u003e: bukti bahwa input sensitif masih sering bocor kembali lewat respons dan sanitization sisi prompt tidak cukup andal. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.chatbot-privacy-sensitivity\"\u003ePrivacy-Sensitive Chatbots: Input Regurgitation and Sanitization\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ccode\u003eMemory for Autonomous LLM Agents: Mechanisms, Evaluation, and Emerging Frontiers (2603.07670)\u003c/code\u003e: memori lintas sesi jadi titik penting seandainya agent menyimpan PII dari user secara terpisah. Paper ini menguatkan bahwa agent memory harus diperlakukan sebagai layer governance tersendiri, dengan filtering sebelum store, retention policy, access scoping, dan audit, bukan sekadar ditangani sebagai chat history. \u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.memory-autonomous-agents\"\u003eMemory for Autonomous LLM Agents: Mechanisms, Evaluation, and Emerging Frontiers\u003c/a\u003e (detail note)\u003c/p\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003e\u003ca href=\"/sotoy/notes/zettel.1777874908001\"\u003eCross-session agent memory becomes a PII risk without governance\u003c/a\u003e — cross-session agent memory harus dilihat sebagai sumber sensitif yang butuh policy, bukan sekadar log percakapan.\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"use-case-hands-on-untuk-security-agent\"\u003eUse case hands-on untuk security agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#use-case-hands-on-untuk-security-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eAgen pembayaran autonomous: intercept request metadata sebelum dikirim ke payment gateway, redaksi nama, email, nomor akun, dan reason text.\u003c/li\u003e\n\u003cli\u003eMulti-turn customer support chatbot: pantau percakapan sepanjang sesi, simpan fragmen PII dalam registry, dan jalankan retroactive masking saat kombinasi entitas melewati ambang risiko.\u003c/li\u003e\n\u003cli\u003eBrowser-based personal AI assistant: jalankan local redaction overlay pada prompt sebelum diteruskan ke model cloud, sehingga data sensitif tidak meninggalkan perangkat.\u003c/li\u003e\n\u003cli\u003eVisual UI automation: deteksi PII di screenshot aplikasi atau form yang diisi pengguna, sehingga agen yang membaca layar hanya melihat versi anonymized.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"langkah-bukti-keamanan-agent\"\u003eLangkah bukti keamanan agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#langkah-bukti-keamanan-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDefinisikan threat model secara eksplisit: apakah ancamannya data leakage, reidentifikasi, atau payment metadata exposure?\u003c/li\u003e\n\u003cli\u003ePisahkan pipeline menjadi: input collector → detector → policy engine → redactor/anonymizer → audit logger.\u003c/li\u003e\n\u003cli\u003eTerapkan session-level state untuk kasus multi-turn dan cross-input, bukan hanya scan stateless per request.\u003c/li\u003e\n\u003cli\u003eTambahkan audit trail yang merekam entitas PII, keputusan policy, dan output yang dikirim agent.\u003c/li\u003e\n\u003cli\u003eEvaluasi dengan benchmark sintetis + skenario nyata: percakapan multi-turn, metadata pembayaran, screenshot UI, dan permintaan cloud LLM.\u003c/li\u003e\n\u003cli\u003eVerifikasi utilitas agent tidak rusak secara drastis: bandingkan output sebelum dan sesudah redaction, lalu pastikan tidak ada PII mentah tertinggal.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"contoh-snippet-pii-safe-agent\"\u003eContoh snippet PII-safe agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-snippet-pii-safe-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-python\"\u003e\u003ccode class=\"language-python\"\u003e\u003cspan class=\"token keyword\"\u003efrom\u003c/span\u003e typing \u003cspan class=\"token keyword\"\u003eimport\u003c/span\u003e List\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e Dict\n\n\u003cspan class=\"token keyword\"\u003eclass\u003c/span\u003e \u003cspan class=\"token class-name\"\u003ePiiItem\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003e__init__\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e entity_type\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e text\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e score\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003efloat\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token builtin\"\u003etype\u003c/span\u003e \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e entity_type\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003etext \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e text\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003escore \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e score\n\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003eto_dict\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        \u003cspan class=\"token keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\u003cspan class=\"token string\"\u003e\"type\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token builtin\"\u003etype\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"text\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003etext\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"score\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003escore\u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\n\n\u003cspan class=\"token keyword\"\u003eclass\u003c/span\u003e \u003cspan class=\"token class-name\"\u003ePiiRegistry\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003e__init__\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eitems\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e List\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003ePiiItem\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003eupdate\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e new_items\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e List\u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003ePiiItem\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eitems\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eextend\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003enew_items\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003ecompute_cpe\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e-\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e \u003cspan class=\"token builtin\"\u003efloat\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        weights \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"NAME\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.5\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"EMAIL\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.7\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"CREDIT_CARD\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e1.0\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"ADDRESS\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.8\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"PHONE\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.6\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n        \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n        \u003cspan class=\"token keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"token builtin\"\u003esum\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eweights\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eget\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eitem\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003e\u003cspan class=\"token builtin\"\u003etype\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e \u003cspan class=\"token number\"\u003e0.4\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e*\u003c/span\u003e item\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003escore \u003cspan class=\"token keyword\"\u003efor\u003c/span\u003e item \u003cspan class=\"token keyword\"\u003ein\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eitems\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n\n\u003cspan class=\"token keyword\"\u003eclass\u003c/span\u003e \u003cspan class=\"token class-name\"\u003eSafeAgent\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003e__init__\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e detector\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e redactor\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e threshold\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003efloat\u003c/span\u003e \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token number\"\u003e1.5\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003edetector \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e detector\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eredactor \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e redactor\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003ethreshold \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e threshold\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eregistry \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e PiiRegistry\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n    \u003cspan class=\"token keyword\"\u003edef\u003c/span\u003e \u003cspan class=\"token function\"\u003estep\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e text\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token builtin\"\u003estr\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token operator\"\u003e-\u003c/span\u003e\u003cspan class=\"token operator\"\u003e\u003e\u003c/span\u003e Dict\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n        found \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003edetector\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003escan\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003etext\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n        self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eregistry\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eupdate\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003efound\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n        cpe \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eregistry\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003ecompute_cpe\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n\n        \u003cspan class=\"token keyword\"\u003eif\u003c/span\u003e cpe \u003cspan class=\"token operator\"\u003e\u003e=\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003ethreshold\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n            safe_text \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eredactor\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003erewrite_history\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003eself\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eregistry\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e text\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n            status \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"review_required\"\u003c/span\u003e\n        \u003cspan class=\"token keyword\"\u003eelse\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n            safe_text \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e self\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eredactor\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eredact\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003etext\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e found\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e\n            status \u003cspan class=\"token operator\"\u003e=\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"ok\"\u003c/span\u003e\n\n        \u003cspan class=\"token keyword\"\u003ereturn\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e{\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"status\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e status\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"safe_text\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e safe_text\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"pii_items\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003eitem\u003cspan class=\"token punctuation\"\u003e.\u003c/span\u003eto_dict\u003cspan class=\"token punctuation\"\u003e(\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e)\u003c/span\u003e \u003cspan class=\"token keyword\"\u003efor\u003c/span\u003e item \u003cspan class=\"token keyword\"\u003ein\u003c/span\u003e found\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n            \u003cspan class=\"token string\"\u003e\"cpe\"\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e cpe\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e\n        \u003cspan class=\"token punctuation\"\u003e}\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003edetector.scan(text)\u003c/code\u003e bisa menggabungkan NER, regex, dan domain-specific rules.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eredactor.redact(...)\u003c/code\u003e menghasilkan placeholder terstruktur.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003erewrite_history(...)\u003c/code\u003e adalah analog CAMP: retroactive masking untuk seluruh session ketika skor risiko terlalu tinggi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"catatan-praktis\"\u003eCatatan praktis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#catatan-praktis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eGunakan model atau rule yang bisa dijalankan lokal untuk menjaga data tetap di dalam perimeter.\u003c/li\u003e\n\u003cli\u003eAudit log adalah bukti bahwa agent sudah menjalankan pemeriksaan PII; penting untuk security review.\u003c/li\u003e\n\u003cli\u003eUntuk hands-on, mulai dari case \u003ccode\u003ex402 metadata\u003c/code\u003e karena ada penerapan yang jelas: filter sebelum execution.\u003c/li\u003e\n\u003cli\u003eUntuk pembuktian keamanan, buat dua suite: \u003ccode\u003eprivacy tests\u003c/code\u003e (no PII leak) dan \u003ccode\u003eutility tests\u003c/code\u003e (agent masih bisa menyelesaikan tugas).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"prinsip-pii-safe-untuk-llm-agent\"\u003ePrinsip PII-safe untuk LLM agent\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-pii-safe-untuk-llm-agent\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eMasking harus terjadi sebelum prompt dikirim ke LLM\u003c/strong\u003e. Ini adalah lapisan pertama dan paling penting.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOutput filtering hanya safety net\u003c/strong\u003e, bukan satu-satunya pertahanan. Jika model sudah menerima PII mentah, risiko exposure tetap ada.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJangan pakai prompt-level safety saja\u003c/strong\u003e tanpa state-aware policy. Multi-turn agent harus menilai PII cross-turn, seperti \u003ccode\u003eCAMP\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePseudonymization dan placeholder replacement\u003c/strong\u003e lebih baik dari sekadar redaksi kasar karena menjaga konteks utilitas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAudit dan traceability\u003c/strong\u003e harus mencatat:\n\u003cul\u003e\n\u003cli\u003eentitas PII yang ditemukan,\u003c/li\u003e\n\u003cli\u003etransformasi yang dilakukan (mask/redact/pseudonymize),\u003c/li\u003e\n\u003cli\u003eapakah data dikirim ke LLM langsung atau melalui trusted local rewriting.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThreat model harus eksplisit\u003c/strong\u003e: data leakage, reidentification, payment metadata exposure, dan model memorization.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJika mungkin, gunakan local inference untuk filtering\u003c/strong\u003e sebelum call ke remote LLM. Ini meminimalkan jumlah informasi sensitif yang meninggalkan perimeter.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"menangani-user-supplied-pii\"\u003eMenangani user-supplied PII\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#menangani-user-supplied-pii\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUser boleh memasukkan PII secara eksplisit, tetapi agent tidak boleh langsung meneruskan PII itu ke model.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePisahkan data access dari generative reasoning\u003c/strong\u003e:\n\u003cul\u003e\n\u003cli\u003edata sensitif (rekening, tagihan, kondisi kesehatan) diambil melalui backend atau storage yang terkontrol,\u003c/li\u003e\n\u003cli\u003equery ke LLM dibuat dalam bentuk aman / abstrak.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eContoh pola\u003c/strong\u003e:\n\u003col\u003e\n\u003cli\u003euser: \"Berapa tunggakan saya?\"\u003c/li\u003e\n\u003cli\u003eagent: ambil \u003ccode\u003eaccount_id\u003c/code\u003e dan data billing secara lokal dari sistem internal\u003c/li\u003e\n\u003cli\u003eagent: buat prompt aman seperti \"Tampilkan status tagihan untuk Customers A\" atau gunakan template internal non-identifiable\u003c/li\u003e\n\u003cli\u003ekirim prompt ke LLM untuk memformat jawaban, bukan untuk mencari data mentah\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003eUntuk kesehatan, gunakan \u003ccode\u003epatient_case_123\u003c/code\u003e atau label serupa, bukan nama/NIK/identitas yang bisa direidentifikasi.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eJika PII ingin digunakan langsung dalam reasoning\u003c/strong\u003e (mis. diagnosis spesifik), lakukan itu di perimeter yang trusted dan jangan kirim mentah ke cloud LLM.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eoutput filter\u003c/code\u003e tetap digunakan, tapi dalam skenario ini fungsinya sebagai pengaman kedua, bukan deteksi utama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKunci\u003c/strong\u003e: agent dapat melayani request personal, tetapi model tidak boleh pernah mendapatkan PII mentah yang bisa bocor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003cstrong\u003eChildren\u003c/strong\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.agent-execution-environment\"\u003eAI Agent Execution Environment to Safeguard User Data\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.camp\"\u003eCAMP: Cross-Turn PII Protection for LLM Conversations\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.hardening-x402\"\u003eHardening x402: PII-Safe Agentic Payments\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.llm-redactor\"\u003eLLM-Redactor: Privacy-Preserving LLM Requests\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.memory-autonomous-agents\"\u003eMemory for Autonomous LLM Agents: Mechanisms, Evaluation, and Emerging Frontiers\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.opal\"\u003eOpal: Private Memory for Personal AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.pii-shield\"\u003ePII Shield: Browser Overlay for Personal Data Management\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.agent-boundary-pii-filtering\"\u003ePII guardrail antar-agent: dari x402 ke brainstorming + coding agent\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.chatbot-privacy-sensitivity\"\u003ePrivacy-Sensitive Chatbots: Input Regurgitation and Sanitization\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.repair\"\u003eRePAIR: Redacting Personal Information in Response\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.safeclaw-r\"\u003eSafeClaw-R: Safe Multi-Agent Personal Assistants\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.security.pii-agent-architecture.separable-expert-architecture\"\u003eSeparable Expert Architecture: Privacy-Preserving Personalization\u003c/a\u003e\u003c/li\u003e\n\u003cli\
