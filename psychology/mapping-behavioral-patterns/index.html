ed-care-framework","position":{"start":{"line":28,"column":65,"offset":1412},"end":{"line":28,"column":106,"offset":1453},"indent":[]},"xvault":false,"sameFile":false,"to":{"fname":"private.growth.limited-care-framework"}}],"anchors":{"mapping-and-mitigating-behavioral-patterns":{"type":"header","text":"Mapping and Mitigating Behavioral Patterns","value":"mapping-and-mitigating-behavioral-patterns","line":15,"column":0,"depth":1},"the-mapping-framework":{"type":"header","text":"The Mapping Framework","value":"the-mapping-framework","line":17,"column":0,"depth":2},"analyzing-the-pattern":{"type":"header","text":"Analyzing the Pattern","value":"analyzing-the-pattern","line":26,"column":0,"depth":2},"mitigation-strategy":{"type":"header","text":"Mitigation Strategy","value":"mitigation-strategy","line":32,"column":0,"depth":2}},"children":[],"parent":"k7whujrtxo2tvftwjvbq1jh","data":{}},"body":"\u003ch1 id=\"mapping-and-mitigating-behavioral-patterns\"\u003eMapping and Mitigating Behavioral Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mapping-and-mitigating-behavioral-patterns\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch1 id=\"mapping-and-mitigating-behavioral-patterns-1\"\u003eMapping and Mitigating Behavioral Patterns\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mapping-and-mitigating-behavioral-patterns-1\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"the-mapping-framework\"\u003eThe Mapping Framework\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#the-mapping-framework\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eUntuk memutus pola berulang, kita tidak bisa hanya mengandalkan niat. Kita perlu memetakan pola tersebut secara konkret menggunakan data.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eKomponen Pemetaan (Journaling):\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eEvent\u003c/strong\u003e: Apa yang terjadi? (Hari, jam, situasi).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEmosi\u003c/strong\u003e: Apa yang dirasakan? (Beri skor 1-5, misal: Malu 4/5, Iri 3/5).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePikiran\u003c/strong\u003e: Apa narasi internal yang muncul? (Misal: \"Gue paling tidak dilihat\").\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRespon Fisik/Perilaku\u003c/strong\u003e: Apa yang dilakukan tubuh dan tindakan nyata? (Misal: Diam, menarik diri).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"analyzing-the-pattern\"\u003eAnalyzing the Pattern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#analyzing-the-pattern\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eSetelah data terkumpul, tarik garis untuk melihat:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eSiapa\u003c/strong\u003e yang memicu?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKapan\u003c/strong\u003e dan \u003cstrong\u003edi mana\u003c/strong\u003e biasanya terjadi?\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKenapa\u003c/strong\u003e ini terjadi? (Cari emosi inti: \u003cem\u003eshame, guilt, burnout\u003c/em\u003e, atau takut dieksploitasi).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"mitigation-strategy\"\u003eMitigation Strategy\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#mitigation-strategy\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eMitigasi dilakukan dengan memotong rantai respons di titik-titik tertentu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eLevel Pikiran\u003c/strong\u003e: Menyadari bahwa narasi internal adalah \"suara protektif\", bukan hukum realitas.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLevel Emosi\u003c/strong\u003e: Memberi nama pada emosi untuk mengurangi intensitasnya.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLevel Perilaku\u003c/strong\u003e: Melakukan aksi kecil yang berbeda (misal: respons peduli terbatas).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLevel Relasi\u003c/strong\u003e: Memilih lingkungan yang memberikan feedback sehat, bukan sekadar afirmasi luka.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Fixing pola berulang butuh peta, bukan cuma niat.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eSee also: \u003ca href=\"/sotoy/notes/notes.psychology.recurring-patterns-vs-incidents\"\u003eRecurring Patterns vs Incidents\u003c/a\u003e, \u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eprivate.growth.limited-care-framework (Private)\u003c/a\u003e\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003epsychology (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ejournaling (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003ebehavioral-analysis (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"
