verifysh-can-catch","line":121,"column":0,"depth":2},"practical-benefit":{"type":"header","text":"Practical benefit","value":"practical-benefit","line":133,"column":0,"depth":2},"related":{"type":"header","text":"Related","value":"related","line":140,"column":0,"depth":2}},"children":[],"parent":"ft5muiemw6v0ic1yjur0c3t","data":{}},"body":"\u003ch1 id=\"single-verification-entrypoint\"\u003eSingle verification entrypoint\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#single-verification-entrypoint\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#overview\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBuat gue, \u003ccode\u003e./.ai/commands/verify.sh\u003c/code\u003e bukan standar universal. Itu adalah konvensi internal yang punya fungsi spesifik: satu executable entrypoint untuk semua verifikasi minimal.\u003c/p\u003e\n\u003cp\u003eKalau \u003ccode\u003eAGENTS.md\u003c/code\u003e bilang \"jangan selesai sebelum test pass\", \u003ccode\u003everify.sh\u003c/code\u003e adalah bentuk konkretnya. Dia adalah script yang bisa dijalankan agent, manusia, dan CI untuk membuktikan bahwa klaim \"sudah selesai\" punya bukti.\u003c/p\u003e\n\u003ch2 id=\"why-this-matters\"\u003eWhy this matters\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-this-matters\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eVerifikasi sering jadi tempat agent salah tebak.\nBukan karena agent nggak bisa menulis test, tapi karena dia sering nggak tahu command yang tepat di repo itu.\u003c/p\u003e\n\u003cp\u003eDi satu repo, verifikasi bisa berarti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003epnpm test\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm run lint\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ego test ./...\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epytest\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo test\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edotnet test\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esemgrep --config auto .\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egitleaks detect --source . --no-git\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eosv-scanner --recursive .\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau agent harus menebak semua ini, dia bisa gagal atau jalankan hal yang tidak lengkap.\u003c/p\u003e\n\u003cp\u003eDengan satu entrypoint, kita membuat definisi selesai jadi executable.\u003c/p\u003e\n\u003ch2 id=\"what-verifysh-sebenarnya-adalah\"\u003eWhat \u003ccode\u003everify.sh\u003c/code\u003e sebenarnya adalah\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#what-verifysh-sebenarnya-adalah\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ebukan tool khusus\u003c/li\u003e\n\u003cli\u003ebukan requirement path yang wajib dinamai demikian\u003c/li\u003e\n\u003cli\u003ebukan magic\u003c/li\u003e\n\u003cli\u003ebukan pengganti \u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003ebukan sensor otomatis\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDia adalah: \u003cstrong\u003esingle verification entrypoint\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eArtinya, tim menyediakan satu command stabil yang menyatukan semua check minimal.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003everify.sh\u003c/code\u003e hanya bisa mendeteksi N+1 jika repo sudah menaruh sensor N+1 di dalamnya: munculnya \u003ccode\u003esemgrep\u003c/code\u003e, regression test query-count, atau checker lain.\u003c/p\u003e\n\u003cp\u003eKalau isinya cuma:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e lint\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e typecheck\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003emaka \u003ccode\u003everify.sh\u003c/code\u003e belum tentu bisa menangkap N+1.\u003c/p\u003e\n\u003cp\u003eKalau repo ingin \u003ccode\u003everify.sh\u003c/code\u003e menangkap data-layer smell seperti N+1, maka sensor itu harus ditambahkan terlebih dulu — dan \u003ccode\u003everify.sh\u003c/code\u003e menjadi tombol untuk menjalankannya.\u003c/p\u003e\n\u003ch2 id=\"example\"\u003eExample\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#example\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token shebang important\"\u003e#!/usr/bin/env bash\u003c/span\u003e\n\u003cspan class=\"token builtin class-name\"\u003eset\u003c/span\u003e -euo pipefail\n\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e lint\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e typecheck\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUntuk repo yang security-sensitive, bisa ditambah:\u003c/p\u003e\n\u003cpre class=\"language-bash\"\u003e\u003ccode class=\"language-bash\"\u003e\u003cspan class=\"token shebang important\"\u003e#!/usr/bin/env bash\u003c/span\u003e\n\u003cspan class=\"token builtin class-name\"\u003eset\u003c/span\u003e -euo pipefail\n\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e lint\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e typecheck\n\u003cspan class=\"token function\"\u003epnpm\u003c/span\u003e \u003cspan class=\"token builtin class-name\"\u003etest\u003c/span\u003e\n\ngitleaks detect --source \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e --no-git\nosv-scanner --recursive \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\nsemgrep --config auto \u003cspan class=\"token builtin class-name\"\u003e.\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"why-aicommands\"\u003eWhy \u003ccode\u003e.ai/commands/\u003c/code\u003e?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#why-aicommands\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eItu juga bukan keharusan. Di sini pilihannya cuma supaya jelas bahwa script ini bagian dari harness agent.\u003c/p\u003e\n\u003cp\u003eBisa saja pathnya:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e./scripts/verify.sh\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e./bin/verify\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e./tools/check.sh\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e./ci/local-check.sh\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emake verify\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ejust verify\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003enpm run verify\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYang penting bukan pathnya. Yang penting ada satu entrypoint yang stabil.\u003c/p\u003e\n\u003ch2 id=\"how-to-use-it\"\u003eHow to use it\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#how-to-use-it\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi \u003ccode\u003eAGENTS.md\u003c/code\u003e, cukup tulis:\u003c/p\u003e\n\u003cpre class=\"language-text\"\u003e\u003ccode class=\"language-text\"\u003eBefore completion, run:\n\n./.ai/commands/verify.sh\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSetiap agent atau reviewer tahu persis apa yang harus dijalankan.\u003c/p\u003e\n\u003ch2 id=\"what-verifysh-can-catch\"\u003eWhat verify.sh can catch\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#what-verifysh-can-catch\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eAda tiga level sensor N+1 yang bisa ditambahkan ke \u003ccode\u003everify.sh\u003c/code\u003e:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eStatic check: Semgrep atau rule sederhana yang mencari query/repo call di dalam loop.\u003c/li\u003e\n\u003cli\u003eQuery-count regression test: behavior test yang memverifikasi jumlah query tetap bounded untuk banyak data.\u003c/li\u003e\n\u003cli\u003eRuntime/integration check: observability/profiler-based assertion pada query count selama request berjalan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003ccode\u003everify.sh\u003c/code\u003e sendiri bukan network inspector. Dia hanya menjalankan sensor yang sudah ada.\u003c/p\u003e\n\u003cp\u003eKalau belum ada sensor N+1, \u003ccode\u003everify.sh\u003c/code\u003e tidak akan ajaib tahu ada N+1.\u003c/p\u003e\n\u003ch2 id=\"practical-benefit\"\u003ePractical benefit\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#practical-benefit\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKonsistensi. Semua pihak menjalankan command yang sama.\u003c/li\u003e\n\u003cli\u003ePerubahan mudah. Tambah scan baru di script, agent nggak perlu tahu detailnya.\u003c/li\u003e\n\u003cli\u003eKurangi prompt panjang. Cukup refer ke satu command.\u003c/li\u003e\n\u003cli\u003eBukti klaim. Jika agent bilang \"verified\", dia bisa melaporkan hasil entrypoint yang dijalankan.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"related\"\u003eRelated\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#related\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.self-hosted-agent-runner\"\u003eSelf-Hosted Cloud Agent Runner\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.openclaw-personal-agent-orchestration\"\u003ePersonal Agent Orchestration\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.agentic-engineering.before-after-judgement-harness\"\u003eBefore-After: Senior Judgement ke Harness\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-engineering (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eharness (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003everification (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-coding (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260506180000\"\u003everify.sh is a verification entrypoint, not a sensor\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101200\"\u003eLargest AI opportunities are new work formats, not faster old workflows\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101400\"\u003eSpecification fuels classical software; verification fuels agentic AI\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101800\"\u003eAI moat can be a domain-specific verifier and RL environment\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260507101900\"\u003eAutomation frontier is defined by evaluator cost, not just model capability\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/notes.youtube.andrej-karpathy-from-vibe-coding-to-agentic-engineering\"\u003eAndrej Karpathy: From Vibe Coding to Agentic Engineering\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"type":"header","text":"Find More","value":"find-more","line":23,"column":0,"depth":2}},"children":["book-summaries","daily","handbook","notes","tags","til","zettel"],"parent":null,"data":{},"body":"\nWelcome to the homepage! I use Dendron to store and organize notes, ideas, and experiments I’m working on. Here are the main sections you’ll find on this site:\n\n1. **Learning Notes** — Practical notes on programming, recent technologies, and productivity tips.\n2. **Personal Projects** — Summaries of projects, experiments, and outcomes I’m working on or have completed.\n3. **Writings \u0026 Opinions** — Casual articles and reflections about technology, daily life, and other interesting topics.\n\nI’m constantly experimenting and learning. I hope the content here helps you as a reference, a starting point for discussion, or just light reading.\n\n\
