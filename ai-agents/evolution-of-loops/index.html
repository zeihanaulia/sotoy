/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Exit\u003c/td\u003e\u003ctd align=\"left\"\u003eLoop yang tidak tahu kapan berhenti\u003c/td\u003e\u003ctd align=\"left\"\u003eValidator bias/terlalu longgar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd align=\"left\"\u003e5\u003c/td\u003e\u003ctd align=\"left\"\u003e\u003cstrong\u003eOrchestration\u003c/strong\u003e\u003c/td\u003e\u003ctd align=\"left\"\u003eOrchestrator \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Worker \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e Verifier\u003c/td\u003e\u003ctd align=\"left\"\u003eKeterbatasan satu agent/task\u003c/td\u003e\u003ctd align=\"left\"\u003eCost, security, review bottleneck\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003chr\u003e\n\u003ch2 id=\"bedah-detail-tiap-tahap\"\u003eBedah Detail Tiap Tahap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#bedah-detail-tiap-tahap\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"1-react-reasoning--acting\"\u003e1. ReAct (Reasoning + Acting)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#1-react-reasoning--acting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePola yang menggabungkan \u003cem\u003ereasoning trace\u003c/em\u003e dan \u003cem\u003eaction\u003c/em\u003e. Model tidak hanya menghasilkan teks, tetapi berinteraksi dengan environment (misal: Wikipedia API, Shell).\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Model jangan hanya berpikir di internal; ia harus mengobservasi dunia luar untuk memperbarui pemahamannya.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"2-autogpt-autonomous-goal-seeking\"\u003e2. AutoGPT (Autonomous Goal-Seeking)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2-autogpt-autonomous-goal-seeking\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eUpaya untuk memindahkan agent dari \u003cem\u003etask-level\u003c/em\u003e ke \u003cem\u003egoal-level\u003c/em\u003e. Agent mencoba memecah goal besar menjadi subtask secara mandiri.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Transisi dari assistant yang menggunakan tool menjadi pencari tujuan otonom.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKritik\u003c/strong\u003e: Autonomy tanpa disiplin menghasilkan agent yang \"terlihat sibuk\" namun tidak produktif.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"3-ralph-loop-disciplined-iteration\"\u003e3. Ralph Loop (Disciplined Iteration)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#3-ralph-loop-disciplined-iteration\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePola yang menekankan pada \u003cem\u003econtext reset\u003c/em\u003e dan penggunaan filesystem sebagai memory utama, bukan chat history.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Gunakan repo sebagai memory; jangan biarkan chat history menjadi otak utama.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKarakteristik\u003c/strong\u003e: Menggunakan anchor file (misal: \u003ccode\u003eLOOP.md\u003c/code\u003e) untuk menjaga konsistensi antar iterasi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"4-goal-verified-stopping\"\u003e4. \u003ccode\u003e/goal\u003c/code\u003e (Verified Stopping)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#4-goal-verified-stopping\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eVersi produk dari loop yang memiliki \u003cem\u003estopping condition\u003c/em\u003e eksplisit. Loop berjalan hingga validator (deterministic atau model-based) mengonfirmasi penyelesaian.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Loop harus memiliki definisi \"selesai\" yang bisa diverifikasi secara eksternal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"5-multi-agent-orchestration-systemic-coordination\"\u003e5. Multi-agent Orchestration (Systemic Coordination)\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#5-multi-agent-orchestration-systemic-coordination\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eLayer tertinggi di mana sebuah \u003cem\u003eorchestrator\u003c/em\u003e mengelola banyak worker loop dengan peran spesifik (Implementer, Reviewer, Security Checker).\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAtomic Idea\u003c/strong\u003e: Agent bukan sekadar worker; ada manager loop yang mengatur distribusi kerja dan quality gate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"kesimpulan-tiap-solusi-adalah-respons-terhadap-failure-mode\"\u003eKesimpulan: Tiap Solusi adalah Respons terhadap Failure Mode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kesimpulan-tiap-solusi-adalah-respons-terhadap-failure-mode\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eEvolusi ini menunjukkan bahwa tidak ada tahap \"final\". Setiap kemajuan dalam otonomi menciptakan masalah baru di layer yang lebih tinggi (misal: dari masalah halusinasi \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e masalah koordinasi \u003cspan class=\"math math-inline\"\u003e\u003cspan class=\"katex\"\u003e\u003cspan class=\"katex-mathml\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\"\u003e\u003csemantics\u003e\u003cmrow\u003e\u003cmo\u003e→\u003c/mo\u003e\u003c/mrow\u003e\u003cannotation encoding=\"application/x-tex\"\u003e\\rightarrow\u003c/annotation\u003e\u003c/semantics\u003e\u003c/math\u003e\u003c/span\u003e\u003cspan class=\"katex-html\" aria-hidden=\"true\"\u003e\u003cspan class=\"base\"\u003e\u003cspan class=\"strut\" style=\"height:0.3669em;\"\u003e\u003c/span\u003e\u003cspan class=\"mrel\"\u003e→\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e masalah biaya \u0026#x26; security). \u003c/p\u003e\n\u003cp\u003eKunci dari implementasi yang sukses bukan pada pemilihan model tercanggih, melainkan pada desain \u003cstrong\u003estopping condition, feedback loop, state management, dan human-in-the-loop verification\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eReferensi: Artikel Matt Van Horn \u0026#x26; Diskusi Loop Engineering.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003enotes (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eai-agents (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eagentic-workflow (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eevolution (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260611140001\"\u003eAutonomy without Discipline is Noise\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.20260611140002\"\u003eThe Evolution of Agentic Control\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fs
