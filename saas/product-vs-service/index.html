05.15","id":"daily.journal.2026.05.15","vaultName":"vault"},"type":"backlink","position":{"start":{"line":49,"column":3,"offset":2618},"end":{"line":49,"column":36,"offset":2651},"indent":[]},"value":"notes.saas.product-vs-service"}],"anchors":{"prinsip-utama":{"type":"header","text":"Prinsip utama","value":"prinsip-utama","line":17,"column":0,"depth":2},"hris":{"type":"header","text":"HRIS","value":"hris","line":26,"column":0,"depth":2},"product":{"type":"header","text":"Product","value":"product","line":28,"column":0,"depth":3},"service":{"type":"header","text":"Service","value":"service","line":46,"column":0,"depth":3},"failure-mode":{"type":"header","text":"Failure mode","value":"failure-mode","line":57,"column":0,"depth":3},"crm":{"type":"header","text":"CRM","value":"crm","line":65,"column":0,"depth":2},"product-1":{"type":"header","text":"Product","value":"product-1","line":67,"column":0,"depth":3},"service-1":{"type":"header","text":"Service","value":"service-1","line":85,"column":0,"depth":3},"failure-mode-1":{"type":"header","text":"Failure mode","value":"failure-mode-1","line":97,"column":0,"depth":3},"contoh-saas-platform-engineering-internal":{"type":"header","text":"Contoh SaaS platform engineering internal","value":"contoh-saas-platform-engineering-internal","line":103,"column":0,"depth":2},"product-2":{"type":"header","text":"Product","value":"product-2","line":107,"column":0,"depth":3},"service-2":{"type":"header","text":"Service","value":"service-2","line":125,"column":0,"depth":3},"insight-penting":{"type":"header","text":"Insight penting","value":"insight-penting","line":139,"column":0,"depth":3},"synthesis":{"type":"header","text":"Synthesis","value":"synthesis","line":153,"column":0,"depth":2}},"children":[],"parent":"5wu46v0ljyhksnz0opr81m0","data":{}},"body":"\u003ch1 id=\"product-vs-service-dalam-saas\"\u003eProduct vs Service dalam SaaS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product-vs-service-dalam-saas\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eGue pakai tiga contoh untuk bikin perbedaan product vs service lebih nyata.\u003c/p\u003e\n\u003ch2 id=\"prinsip-utama\"\u003ePrinsip utama\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#prinsip-utama\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi SaaS B2B ada dua lapisan yang harus dipisah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCore capability\u003c/strong\u003e — hal utama yang software lakukan. Ini bagian product.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDelivery and experience system\u003c/strong\u003e — cara capability itu sampai, dipakai, dipelihara, dan terus memberi value. Ini bagian service.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eCustomer biasanya beli karena lapisan product. Mereka bertahan karena lapisan service.\u003c/p\u003e\n\u003ch2 id=\"hris\"\u003eHRIS\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#hris\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"product\"\u003eProduct\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFokusnya pada fitur HR inti:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eemployee data\u003c/li\u003e\n\u003cli\u003epayroll\u003c/li\u003e\n\u003cli\u003eleave management\u003c/li\u003e\n\u003cli\u003eattendance\u003c/li\u003e\n\u003cli\u003eperformance review\u003c/li\u003e\n\u003cli\u003eorg chart\u003c/li\u003e\n\u003cli\u003eapproval workflow\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePertanyaan product:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah fitur payroll ada?\u003c/li\u003e\n\u003cli\u003eapakah cuti otomatis bisa?\u003c/li\u003e\n\u003cli\u003eapakah approval berlapis tersedia?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"service\"\u003eService\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#service\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFokusnya pada pengalaman menjalankan HR lewat sistem itu:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eonboarding perusahaan baru secepat apa?\u003c/li\u003e\n\u003cli\u003eimport data karyawan dari Excel atau sistem lama mulus gak?\u003c/li\u003e\n\u003cli\u003esetup role HR/manager/employee gampang atau membingungkan?\u003c/li\u003e\n\u003cli\u003eapakah payroll rule bisa dipahami tanpa bantuan support panjang?\u003c/li\u003e\n\u003cli\u003esistem stabil saat tanggal gajian ramai?\u003c/li\u003e\n\u003cli\u003esupport dan incident handling cepat?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"failure-mode\"\u003eFailure mode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-mode\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eHRIS bisa kaya fitur, tapi kalau onboarding lama, mapping payroll sering salah, dan role permission membingungkan, maka customer akan bilang:\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eproduknya bagus, tapi capek dipakainya.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eItu artinya product-nya oke, service-nya buruk.\u003c/p\u003e\n\u003ch2 id=\"crm\"\u003eCRM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#crm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003ch3 id=\"product-1\"\u003eProduct\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFokusnya pada fitur sales \u0026#x26; pipeline:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003elead management\u003c/li\u003e\n\u003cli\u003epipeline sales\u003c/li\u003e\n\u003cli\u003econtact database\u003c/li\u003e\n\u003cli\u003eemail integration\u003c/li\u003e\n\u003cli\u003esales activity log\u003c/li\u003e\n\u003cli\u003eforecast dashboard\u003c/li\u003e\n\u003cli\u003eautomation workflow\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePertanyaan product:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah pipeline tracking lengkap?\u003c/li\u003e\n\u003cli\u003eapakah auto follow-up bisa dijalankan?\u003c/li\u003e\n\u003cli\u003eapakah dashboard forecast tersedia?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"service-1\"\u003eService\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#service-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eFokusnya pada pengalaman tim sales pakai CRM:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etim sales baru bisa aktif dalam 1 hari atau harus training 2 minggu?\u003c/li\u003e\n\u003cli\u003eimport kontak dari spreadsheet/CRM lama gampang gak?\u003c/li\u003e\n\u003cli\u003esetting pipeline bisa self-service gak?\u003c/li\u003e\n\u003cli\u003emobile experience nyaman buat sales lapangan?\u003c/li\u003e\n\u003cli\u003esync email/calendar stabil?\u003c/li\u003e\n\u003cli\u003edashboard cepat saat meeting penting?\u003c/li\u003e\n\u003cli\u003eadaptasi struktur tim atau region mudah?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"failure-mode-1\"\u003eFailure mode\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#failure-mode-1\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCRM dengan feature mendalam bisa kalah dari layanan yang fiturnya lebih tipis tapi onboardingnya cepat, penggunaan ringan, dan supportnya responsif.\u003c/p\u003e\n\u003cp\u003eItu yang sering terjadi di SaaS: service experience yang simpel dan andal bisa mengalahkan product depth yang rumit.\u003c/p\u003e\n\u003ch2 id=\"contoh-saas-platform-engineering-internal\"\u003eContoh SaaS platform engineering internal\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-saas-platform-engineering-internal\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eBayangkan platform internal yang bikin developer dan tim engineering bisa memanfaatkan self-service resource, deployment pipeline, observability, dan governance.\u003c/p\u003e\n\u003ch3 id=\"product-2\"\u003eProduct\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#product-2\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eCapability utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eself-service provisioning untuk environment dan pipeline\u003c/li\u003e\n\u003cli\u003eintegrasi dengan source control, issue tracker, dan cloud provider\u003c/li\u003e\n\u003cli\u003edashboard status build/deploy dan audit log\u003c/li\u003e\n\u003cli\u003epolicy guardrail dan permission model untuk tim\u003c/li\u003e\n\u003cli\u003ereusable template untuk deployment, observability, dan compliance\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePertanyaan product:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eapakah tim bisa buat environment dan pipeline sendiri tanpa menunggu platform team?\u003c/li\u003e\n\u003cli\u003eapakah integrasi devtools dan cloud provider sudah tersedia?\u003c/li\u003e\n\u003cli\u003eapakah status build/deploy mudah dipahami?\u003c/li\u003e\n\u003cli\u003eapakah setiap artifact punya audit trail dan ownership?\u003c/li\u003e\n\u003cli\u003eapakah platform ini bisa dipakai sebagai basis untuk banyak tim berbeda?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"service-2\"\u003eService\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#service-2\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003ePertanyaan service yang lebih luas:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eseberapa cepat tim baru bisa onboard ke platform?\u003c/li\u003e\n\u003cli\u003eapakah policy dan permission bisa dipahami tanpa konsultasi panjang?\u003c/li\u003e\n\u003cli\u003eapakah troubleshooting dan support response jelas?\u003c/li\u003e\n\u003cli\u003eapakah backup/gateway ketika integrasi eksternal gagal tersedia?\u003c/li\u003e\n\u003cli\u003eapakah platform bisa menjaga pengalaman stabil meski volume permintaan naik?\u003c/li\u003e\n\u003cli\u003eapakah observability dan alert bisa dipakai oleh tim aplikasi dengan gampang?\u003c/li\u003e\n\u003cli\u003eapakah biaya penggunaan dan resource visibility tersedia?\u003c/li\u003e\n\u003cli\u003eapakah feedback pengguna masuk ke iterasi platform?\u003c/li\u003e\n\u003cli\u003eapakah tim tambahan bisa mulai pakai platform tanpa manual besar?\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight-penting\"\u003eInsight penting\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eDalam contoh platform engineering, produk yang bagus hanyalah awal.\nService experience yang menentukan keberhasilan adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eonboarding tim,\u003c/li\u003e\n\u003cli\u003egovernance dan permission clarity,\u003c/li\u003e\n\u003cli\u003etransparency dan traceability,\u003c/li\u003e\n\u003cli\u003ereliability integrasi,\u003c/li\u003e\n\u003cli\u003eobservability dan recovery,\u003c/li\u003e\n\u003cli\u003efeedback loop.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau ini semua nggak terkelola, developer mungkin akan balik lagi ke cara manual meski platformnya punya fitur lengkap.\u003c/p\u003e\n\u003ch2 id=\"synthesis\"\u003eSynthesis\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#synthesis\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eDi ketiga contoh ini pola yang sama muncul:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eProduct\u003c/strong\u003e = apa yang sistem bisa lakukan.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eService\u003c/strong\u003e = bagaimana customer terus menerima manfaat dari itu secara konsisten.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDi SaaS B2B, capability menarik customer masuk. Experience yang bagus membuat mereka bertahan.\u003c/p\u003e\n\u003cp\u003eJadi, buat desain SaaS, jangan terlalu cepat berhenti di fitur. Lihat juga bagaimana fitur itu disampaikan, dioperasikan, dan terus dijaga sebagai bagian dari layanan.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003esaas (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eservice (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eproduct (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003eb2b (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003chr\u003e\n\u003cstrong\u003eBacklinks\u003c/strong\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/book-summaries.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.from-feature-to-service-design\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eLearning Path: Dari Feature Checklist ke Service Design Thinking\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/handbook.product-thinking.service-sense-and-journey-thinking\"\u003e\u003cinput type=\"checkbox\" disabled class=\"task-before task-status\"\u003e\u003cspan class=\"task-status-text\"\u003e(published)\u003c/span\u003eService Sense dan Journey Thinking: Dari Fitur Tempel ke Pengalaman yang Mengalir\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.literature.escaping-the-build-trap\"\u003eEscaping the Build Trap\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"/sotoy/notes/zettel.moc.multi-tenant-saas\"\u003eMOC: Multi-Tenant S
