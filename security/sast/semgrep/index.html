ps":{"note":{"id":"notes.security.sast.semgrep","title":"Semgrep sebagai SAST / static analysis tool","desc":"Semgrep sebagai application security tool untuk SAST dan static code analysis, plus arsitektur rule parsing dan use case.","updated":1778004109424,"created":1778003411841,"tags":["notes","security","sast","semgrep","static-analysis"],"custom":{},"fname":"notes.security.sast.semgrep","type":"note","vault":{"fsPath":"vault"},"contentHash":"b2abf691c87408745cc9b758917cefb5","links":[{"type":"frontmatterTag","from":{"fname":"notes.security.sast.semgrep","id":"notes.security.sast.semgrep","vaultName":"vault"},"value":"tags.notes","alias":"notes","xvault":false,"to":{"fname":"tags.notes"}},{"type":"frontmatterTag","from":{"fname":"notes.security.sast.semgrep","id":"notes.security.sast.semgrep","vaultName":"vault"},"value":"tags.security","alias":"security","xvault":false,"to":{"fname":"tags.security"}},{"type":"frontmatterTag","from":{"fname":"notes.security.sast.semgrep","id":"notes.security.sast.semgrep","vaultName":"vault"},"value":"tags.sast","alias":"sast","xvault":false,"to":{"fname":"tags.sast"}},{"type":"frontmatterTag","from":{"fname":"notes.security.sast.semgrep","id":"notes.security.sast.semgrep","vaultName":"vault"},"value":"tags.semgrep","alias":"semgrep","xvault":false,"to":{"fname":"tags.semgrep"}},{"type":"frontmatterTag","from":{"fname":"notes.security.sast.semgrep","id":"notes.security.sast.semgrep","vaultName":"vault"},"value":"tags.static-analysis","alias":"static-analysis","xvault":false,"to":{"fname":"tags.static-analysis"}},{"from":{"fname":"notes.agentic-engineering.before-after-judgement-harness","id":"notes.agentic-engineering.before-after-judgement-harness","vaultName":"vault"},"type":"backlink","position":{"start":{"line":721,"column":3,"offset":17365},"end":{"line":721,"column":34,"offset":17396},"indent":[]},"value":"notes.security.sast.semgrep"}],"anchors":{"use-case-praktis-semgrep":{"type":"header","text":"Use case praktis Semgrep","value":"use-case-praktis-semgrep","line":47,"column":0,"depth":3},"contoh-rule-yang-bisa-dibuat":{"type":"header","text":"Contoh rule yang bisa dibuat","value":"contoh-rule-yang-bisa-dibuat","line":68,"column":0,"depth":3}},"children":[],"parent":"tryrk3zvdqbdzg86dre9n4z","data":{}},"body":"\u003ch1 id=\"semgrep-sebagai-sast--static-analysis-tool\"\u003eSemgrep sebagai SAST / static analysis tool\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#semgrep-sebagai-sast--static-analysis-tool\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003cp\u003eYang gue lihat dari repo Semgrep resmi di \u003ccode\u003e.references/semgrep\u003c/code\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSemgrep bukan alat AI; dia adalah application security tool untuk SAST dan static code analysis.\u003c/li\u003e\n\u003cli\u003eRepo ini bukan cuma script Python sekali jalan. Dia sudah port ke OCaml dan dibangun dengan \u003ccode\u003edune\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/osemgrep/cli/CLI.ml\u003c/code\u003e adalah entry point utama untuk CLI. Dia nge-dispatch per subcommand seperti \u003ccode\u003escan\u003c/code\u003e, \u003ccode\u003eci\u003c/code\u003e, \u003ccode\u003elogin\u003c/code\u003e, \u003ccode\u003elogout\u003c/code\u003e, \u003ccode\u003elsp\u003c/code\u003e, \u003ccode\u003eshow\u003c/code\u003e, \u003ccode\u003etest\u003c/code\u003e, dan \u003ccode\u003evalidate\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eKalau command tertentu belum ter-handle di port OCaml, ada fallback ke \u003ccode\u003ePysemgrep.Fallback\u003c/code\u003e, jadi Semgrep masih bisa support edge case lama via Python.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eInti arsitekturnya bisa dibagi jadi tiga lapisan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003eCLI / subcommand dispatch\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esrc/osemgrep/cli/CLI.ml\u003c/code\u003e: baca argv, tentukan subcommand, kirim ke \u003ccode\u003eScan_subcommand.main\u003c/code\u003e, \u003ccode\u003eCi_subcommand.main\u003c/code\u003e, dll.\u003c/li\u003e\n\u003cli\u003eAda hook untuk fitur Pro / publish, tapi yang paling penting \u003ccode\u003escan\u003c/code\u003e adalah default.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eRule parsing dan model\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esrc/parsing/Parse_rule_formula.ml\u003c/code\u003e: parser untuk \u003ccode\u003epattern\u003c/code\u003e, \u003ccode\u003epattern-inside\u003c/code\u003e, \u003ccode\u003epattern-either\u003c/code\u003e, \u003ccode\u003epattern-regex\u003c/code\u003e, dan variabel metapola.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/rule/Rule.ml\u003c/code\u003e: mendefinisikan struktur rule Semgrep, metadata, layout, dan opsi tambahan seperti \u003ccode\u003eseverity\u003c/code\u003e, \u003ccode\u003elanguages\u003c/code\u003e, \u003ccode\u003emessage\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eParser ini ternyata menangani lebih dari sekadar string: dia juga mengecek \u003ccode\u003emetavariable-type\u003c/code\u003e, \u003ccode\u003efocus-metavariable\u003c/code\u003e, dan opsi \u003ccode\u003ealiengrep/spacegrep\u003c/code\u003e untuk target yang bukan sekadar sintaks standar.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eMatching engine\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003esrc/engine/Match_search_mode.ml\u003c/code\u003e: mengatur bagaimana pattern dicocokkan terhadap tree kode, terutama perbedaan antara \u003ccode\u003epattern:\u003c/code\u003e dan \u003ccode\u003epattern-inside:\u003c/code\u003e atau gabungan pattern.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/engine/Match_rules.ml\u003c/code\u003e: orkestrasi rule matching, termasuk penggabungan hasil dan bagaimana engine menjalankan rule terhadap AST target.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/matching/Pattern_vs_code.ml\u003c/code\u003e: bekerja di level yang lebih rendah untuk mencocokkan pattern AST dengan kode sumber sebenarnya.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esrc/engine/Xpattern_matcher.ml\u003c/code\u003e + \u003ccode\u003esrc/engine/Xpattern_match_*\u003c/code\u003e: berbagai backend matching untuk regex, spacegrep, dan bahasa custom.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eKarena Semgrep adalah \"semantic grep\", cara kerjanya bukan sekadar regex. Dia:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ememparsing source code ke AST / struktur yang bisa dimatch,\u003c/li\u003e\n\u003cli\u003ememparsing pattern Semgrep yang ditulis seperti kode biasa,\u003c/li\u003e\n\u003cli\u003emenemukan kecocokan antara pattern dan kode, termasuk metavariabel seperti \u003ccode\u003e$X\u003c/code\u003e, \u003ccode\u003e$Y\u003c/code\u003e, dan repetition patterns,\u003c/li\u003e\n\u003cli\u003elalu mengeluarkan temuan berdasarkan rule metadata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"use-case-praktis-semgrep\"\u003eUse case praktis Semgrep\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#use-case-praktis-semgrep\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e\n\u003cp\u003eGuardrail MR / PR\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003everify.sh\u003c/code\u003e bisa menjalankan \u003ccode\u003esemgrep --config .semgrep.yml\u003c/code\u003e dan gagal jika rule N+1 atau \u003ccode\u003erepository call in loop\u003c/code\u003e terpenuhi.\u003c/li\u003e\n\u003cli\u003eIni cocok buat pakai kembali judgement senior: kalau reviewer sering komentar \u003ccode\u003ehati-hati N+1\u003c/code\u003e, bisa ubah jadi rule Semgrep.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eCI / pre-commit linting\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSemgrep bisa jadi security lint yang jalan di pipeline sebelum test suite penuh.\u003c/li\u003e\n\u003cli\u003eContohnya: deteksi \u003ccode\u003esubprocess.run(..., shell=True)\u003c/code\u003e atau \u003ccode\u003eeval(...)\u003c/code\u003e di Python.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eSecurity scanning dan policy enforcement\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUntuk SAST, Semgrep OSS bagus untuk pola sintaks lokal.\u003c/li\u003e\n\u003cli\u003eUntuk dataflow/cross-file analysis, Semgrep AppSec Platform yang menyediakan kemampuan tambahan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eIDE support\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003erules dipakai di editor untuk deteksi langsung, bukan hanya batch scan.\u003c/li\u003e\n\u003cli\u003eIni jadi cepat feedback loop untuk developer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\n\u003cp\u003eCustom rule authoring\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003etim bisa bikin rule khusus domain: \u003ccode\u003edangerous HTTP header handling\u003c/code\u003e, \u003ccode\u003eraw SQL builder\u003c/code\u003e, \u003ccode\u003euntrusted input ke logging\u003c/code\u003e, \u003ccode\u003eN+1 query pattern\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"contoh-rule-yang-bisa-dibuat\"\u003eContoh rule yang bisa dibuat\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#contoh-rule-yang-bisa-dibuat\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cp\u003eBasic find:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003erules\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e insecure\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eshell\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ecall\n    \u003cspan class=\"token key atrule\"\u003elanguages\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003epython\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eseverity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e WARNING\n    \u003cspan class=\"token key atrule\"\u003emessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Jangan pake shell=True di subprocess.run\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e subprocess.run(\u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e shell=True)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003epattern-inside\u003c/code\u003e untuk target yang lebih sempit:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003erules\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e insecure\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eexec\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ein\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ehandler\n    \u003cspan class=\"token key atrule\"\u003elanguages\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003epython\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eseverity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e ERROR\n    \u003cspan class=\"token key atrule\"\u003emessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Eksekusi shell di dalam request handler\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003epattern-inside\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e|\u003c/span\u003e\u003cspan class=\"token scalar string\"\u003e\n      def handle_request(...):\n          ...\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e subprocess.run(\u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e,\u003c/span\u003e shell=True)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003epattern-either\u003c/code\u003e untuk logic OR:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003erules\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e sql\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003einjection\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eor\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eraw\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003esql\n    \u003cspan class=\"token key atrule\"\u003elanguages\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003epython\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eseverity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e WARNING\n    \u003cspan class=\"token key atrule\"\u003emessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Raw SQL atau string concatenation berbahaya\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003epattern-either\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e execute(\"SELECT \" + \u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e)\n      \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003epattern\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e raw_sql(\u003cspan class=\"token punctuation\"\u003e...\u003c/span\u003e)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMetavariable pattern:\u003c/p\u003e\n\u003cpre class=\"language-yaml\"\u003e\u003ccode class=\"language-yaml\"\u003e\u003cspan class=\"token key atrule\"\u003erules\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e\n  \u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003e \u003cspan class=\"token key atrule\"\u003eid\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e n\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eplus\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003eone\u003cspan class=\"token punctuation\"\u003e-\u003c/span\u003ecandidate\n    \u003cspan class=\"token key atrule\"\u003elanguages\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e[\u003c/span\u003epython\u003cspan class=\"token punctuation\"\u003e]\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003eseverity\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e WARNING\n    \u003cspan class=\"token key atrule\"\u003emessage\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token string\"\u003e\"Kemungkinan N+1: loop dengan query di dalamnya\"\u003c/span\u003e\n    \u003cspan class=\"token key atrule\"\u003epattern-inside\u003c/span\u003e\u003cspan class=\"token punctuation\"\u003e:\u003c/span\u003e \u003cspan class=\"token punctuation\"\u003e|\u003c/span\u003e\u003cspan class=\"token scalar string\"\u003e\n      for $ITEM in $COLLECTION:\n          $DB.query(...)\u003c/span\u003e\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode\u003e\nContoh ini yang paling relevan buat `verify.sh`: rule Semgrep ini bisa jadi sensor awal, sebelum pipeline coba verifikasi behavior query count nyata.\n\n### Hal penting yang gue catat dari repo\n\n- Repo ini memang salah satunya port ke OCaml, bukan versi Python semata. Jadi kodenya bukan hanya `semgrep` CLI Python, tapi engine yang lebih native.\n- Fallback ke `Pysemgrep.Fallback` masih ada, artinya sebagian perintah lama masih didukung lewat Python jika OCaml belum lengkap.\n- Rule parsing dan matching adalah dua stage berbeda: parse YAML/`pattern:` dulu, lalu match ke AST/kode.\n- `pattern-inside` bukan cuma nested search biasa; engine punya semantik khusus untuk menggabungkan ruang lingkup pattern dengan window di sekitarnya.\n\nKalau mau, gue bisa tambahkan section `how to inspect rule hits di repo` dengan file pointer seperti `src/engine/Match_rules.ml` dan `src/matching/Pattern_vs_code.ml` untuk jadikan note ini lebih teknis lagi.\n\u003c/code\u003e\u003c/pre\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\
