ps":{"note":{"id":"daily.journal.2026.05.14","title":"2026-05-14","desc":"Refleksi pembacaan buku Rust pattern dan mental model design Rust dibanding OOP.","updated":1778775961481,"created":1778769838232,"tags":["daily","rust","design-patterns"],"custom":{},"fname":"daily.journal.2026.05.14","type":"note","vault":{"fsPath":"vault"},"contentHash":"89ff80f61a3c9294edaab1dc7d86cfbc","links":[{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.14","id":"daily.journal.2026.05.14","vaultName":"vault"},"value":"tags.daily","alias":"daily","xvault":false,"to":{"fname":"tags.daily"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.14","id":"daily.journal.2026.05.14","vaultName":"vault"},"value":"tags.rust","alias":"rust","xvault":false,"to":{"fname":"tags.rust"}},{"type":"frontmatterTag","from":{"fname":"daily.journal.2026.05.14","id":"daily.journal.2026.05.14","vaultName":"vault"},"value":"tags.design-patterns","alias":"design-patterns","xvault":false,"to":{"fname":"tags.design-patterns"}}],"anchors":{"baca-buku-rust-tentang-design-pattern":{"type":"header","text":"Baca buku Rust tentang design pattern","value":"baca-buku-rust-tentang-design-pattern","line":14,"column":0,"depth":2},"insight-yang-gue-tangkap":{"type":"header","text":"Insight yang gue tangkap","value":"insight-yang-gue-tangkap","line":24,"column":0,"depth":3},"baca-thread-claudedevs-tentang-perubahan-programmatic-usage":{"type":"header","text":"Baca thread ClaudeDevs tentang perubahan programmatic usage","value":"baca-thread-claudedevs-tentang-perubahan-programmatic-usage","line":31,"column":0,"depth":2},"insight-penting-yang-gue-tahan":{"type":"header","text":"Insight penting yang gue tahan","value":"insight-penting-yang-gue-tahan","line":55,"column":0,"depth":3},"kenapa-ini-relevan-buat-gue":{"type":"header","text":"Kenapa ini relevan buat gue","value":"kenapa-ini-relevan-buat-gue","line":61,"column":0,"depth":3},"baca-martin-fowler-interrogatory-llm":{"type":"header","text":"Baca Martin Fowler: Interrogatory LLM","value":"baca-martin-fowler-interrogatory-llm","line":67,"column":0,"depth":2},"insight-yang-gue-ambil":{"type":"header","text":"Insight yang gue ambil","value":"insight-yang-gue-ambil","line":83,"column":0,"depth":3},"baca-harper-reed-llm-codegen-workflow":{"type":"header","text":"Baca Harper Reed: LLM codegen workflow","value":"baca-harper-reed-llm-codegen-workflow","line":91,"column":0,"depth":2},"baca-unmesh-joshi-what-is-code":{"type":"header","text":"Baca Unmesh Joshi: What Is Code?","value":"baca-unmesh-joshi-what-is-code","line":116,"column":0,"depth":2},"baca-thread-kun-tentang-hardened-npm-supply-chain":{"type":"header","text":"Baca thread Kun tentang hardened npm supply chain","value":"baca-thread-kun-tentang-hardened-npm-supply-chain","line":129,"column":0,"depth":2},"baca-thread-gergely-orosz-tentang-anders-hejlsberg":{"type":"header","text":"Baca thread Gergely Orosz tentang Anders Hejlsberg","value":"baca-thread-gergely-orosz-tentang-anders-hejlsberg","line":154,"column":0,"depth":2}},"children":[],"parent":"djv9ke3ors7sus2owix77ax","data":{}},"body":"\u003ch1 id=\"2026-05-14\"\u003e2026-05-14\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#2026-05-14\"\u003e\u003c/a\u003e\u003c/h1\u003e\n\u003ch2 id=\"baca-buku-rust-tentang-design-pattern\"\u003eBaca buku Rust tentang design pattern\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-buku-rust-tentang-design-pattern\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eHari ini gue baca daftar isi dan struktur buku \u003cem\u003eDesign Patterns and Best Practices in Rust\u003c/em\u003e. Yang paling nyantol adalah penekanannya: ini bukan buku yang ngajarin pattern klasik satu per satu, tapi buku yang ngajarin cara mikir ulang desain agar selaras dengan Rust.\u003c/p\u003e\n\u003cp\u003eGue mulai melihat tiga layer yang berbeda:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003emental model Rust dulu,\u003c/li\u003e\n\u003cli\u003elalu terjemahan pattern lama ke idiom Rust,\u003c/li\u003e\n\u003cli\u003ebaru akhirnya pattern yang benar-benar native Rust.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"insight-yang-gue-tangkap\"\u003eInsight yang gue tangkap\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-yang-gue-tangkap\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eKalau lo pindah dari Java/C#, kebiasaan membuat class hierarchy dan object-oriented design biasanya jadi jebakan.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eClone\u003c/code\u003e dan \u003ccode\u003eRc\u003c/code\u003e sering dipakai sebagai pelarian ketika borrow checker menolak, padahal itu bisa jadi tanda desain ownership yang kabur.\u003c/li\u003e\n\u003cli\u003eBorrow checker bukan musuh; dia feedback sistem desain. Kalau dia nggak terima, berarti lo harus jawab siapa pemilik data, siapa boleh baca, siapa boleh ubah.\u003c/li\u003e\n\u003cli\u003eDi Rust, pattern penting bukan karena namanya, tapi karena problem yang dia selesaikan dan apakah dia bisa di-encode di level type system.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"baca-thread-claudedevs-tentang-perubahan-programmatic-usage\"\u003eBaca thread ClaudeDevs tentang perubahan programmatic usage\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-thread-claudedevs-tentang-perubahan-programmatic-usage\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread terbaru ClaudeDevs: \u003ca href=\"https://x.com/ClaudeDevs/status/2054610152817619388\"\u003ehttps://x.com/ClaudeDevs/status/2054610152817619388\u003c/a\u003e. Inti thread ini bukan cuma angka credit, tapi mental contract antara pengguna dan subscription.\u003c/p\u003e\n\u003cp\u003eYang bikin banyak orang kesal adalah framing-nya: Anthropic bilang paid plan bisa klaim \"dedicated monthly credit\" untuk penggunaan programmatic. Mereka juga bilang batasan subscription nggak berubah karena tetap dikhususkan buat interactive use. Tapi dari sudut developer heavy user, itu terasa seperti akses programmatic yang dulu masuk dalam subscription sekarang dipisah ke kuota baru yang lebih kecil.\u003c/p\u003e\n\u003cp\u003eDua realitas ini bisa berdiri bareng:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKalau lo pake Anthropic dari perspektif mereka, ini adalah upaya agar programmatic usage nggak makan limit chat/Claude Code interaktif.\u003c/li\u003e\n\u003cli\u003eKalau lo pake Claude buat agentic workflow dan SDK, ini adalah perubahan ekonomi: akses yang terasa subscription-like sekarang jadi usage-metered.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eGue nangkep tiga alasan terbesar kemarahan ini:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIni tentang trust platform. Banyak orang udah bangun tooling di atas Claude Agent SDK, lalu rules billing-nya berubah setelah mereka invest waktu.\u003c/li\u003e\n\u003cli\u003eFraming sebagai \"free credit\" bikin salah fokus. Seharusnya yang dibahas adalah apakah ini bonus, atau justru plafon baru untuk usage yang sebelumnya dianggap termasuk plan.\u003c/li\u003e\n\u003cli\u003ePerubahan ini tidak cuma billing; dia memukul workflow developer, khususnya GitHub Actions, agent runner, IDE wrapper, dan third-party tools seperti Conductor / OpenClaw.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDari situ, gue ngebayangin konflik antara dua kategori penggunaan:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003einteractive user = chat / Claude Code langsung,\u003c/li\u003e\n\u003cli\u003eagentic/programmatic user = SDK, script, automation, third-party app.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalau Claude memisahkan dua beban ini, secara teknis masuk akal karena programmatic bisa boros. Tapi buat developer yang beli Claude karena agentic coding, ini terasa seperti nilai utama mereka dikurangin.\u003c/p\u003e\n\u003ch3 id=\"insight-penting-yang-gue-tahan\"\u003eInsight penting yang gue tahan\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-penting-yang-gue-tahan\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003ePerdebatan sebenarnya bukan soal kredibilitas angka credit, tapi soal reframe value lama jadi kuota baru.\u003c/li\u003e\n\u003cli\u003e\"Subscription limit tidak berubah\" dalam bahasa Anthropic bisa tetap berarti \"pengalaman gede lo berkurang\" untuk developer yang pakai SDK.\u003c/li\u003e\n\u003cli\u003eSaat platform mengubah aturan setelah adopsi terbentuk, istilah \"rug pull\" sering muncul karena ini bukan sekadar harga; ini soal landasan ekonomi tempat tooling dibangun.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3 id=\"kenapa-ini-relevan-buat-gue\"\u003eKenapa ini relevan buat gue\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#kenapa-ini-relevan-buat-gue\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eGue jadi lebih waspada kalau bangun workflow di atas API/SDK platform: jangan cuma hitung harga saat ini, tapi juga model governancenya.\u003c/li\u003e\n\u003cli\u003ePerubahan seperti ini biasanya lebih berbahaya untuk agentic workflow daripada API biasa, karena automation bisa mengaburkan batas antara interactive dan programmatic usage.\u003c/li\u003e\n\u003cli\u003eKalau lo kerja di produk open ecosystem, perubahan batas kuota SDK bisa jadi sinyal untuk sediakan fallback atau opsi alternatif bagi pengguna heavy.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"baca-martin-fowler-interrogatory-llm\"\u003eBaca Martin Fowler: Interrogatory LLM\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-martin-fowler-interrogatory-llm\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca artikel Martin Fowler tentang \"Interrogatory LLM\": LLM yang dipakai sebagai pewawancara konteks, bukan sekadar mesin jawaban. Inti artikel ini adalah memindahkan pekerjaan menulis konteks dari kepala manusia ke proses elicitation yang bisa dilakukan bertahap.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"https://martinfowler.com/bliki/InterrogatoryLLM.html\"\u003ehttps://martinfowler.com/bliki/InterrogatoryLLM.html\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYang nempel adalah lima pertanyaan penting:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eApa itu Interrogatory LLM?\u003c/li\u003e\n\u003cli\u003eKenapa LLM perlu mewawancarai manusia?\u003c/li\u003e\n\u003cli\u003eKenapa pertanyaan harus satu per satu?\u003c/li\u003e\n\u003cli\u003eApa bedanya membuat dokumen vs mereview dokumen?\u003c/li\u003e\n\u003cli\u003eApa konsekuensinya untuk knowledge work?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDari situ gue tangkap bahwa ini bukan sekadar prompt engineering. Ini soal mengubah konteks menjadi artefak yang layak dipakai oleh model lain. Kalau prompt biasa sering terasa sekali tembak dan rapuh, pola ini memandang prompt final sebagai produk dari percakapan yang benar.\u003c/p\u003e\n\u003ch3 id=\"insight-yang-gue-ambil\"\u003eInsight yang gue ambil\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#insight-yang-gue-ambil\"\u003e\u003c/a\u003e\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eInterrogatory LLM menempatkan LLM sebagai extractor, bukan eksekutor.\u003c/li\u003e\n\u003cli\u003eSatu pertanyaan atomik membantu jawaban lebih fokus dan membuat konteks lebih lengkap.\u003c/li\u003e\n\u003cli\u003eLLM bisa dipakai untuk review dokumen yang sudah ada, bukan hanya membuat dokumen baru.\u003c/li\u003e\n\u003cli\u003eIni sangat relevan di organisasi di mana banyak expert nggak suka nulis, tapi mereka bisa jawab pertanyaan jika diarahkan.\u003c/li\u003e\n\u003cli\u003eIntinya: prompt final yang bagus sering kali bukan ditulis langsung; dia dihasilkan dari proses wawancara konteks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"baca-harper-reed-llm-codegen-workflow\"\u003eBaca Harper Reed: LLM codegen workflow\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-harper-reed-llm-codegen-workflow\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca artikel Harper Reed tentang workflow LLM codegen: bukan sekadar prompt langsung ke model, tapi rangkaian artefak eksplisit—brainstorming, spec, planning, execution, test/iterate.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"https://harper.blog/2025/02/16/my-llm-codegen-workflow-atm/\"\u003ehttps://harper.blog/2025/02/16/my-llm-codegen-workflow-atm/\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eInti artikelnya kurang lebih 6 pertanyaan penting:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eApa workflow utama Harper untuk LLM coding?\u003c/li\u003e\n\u003cli\u003eKenapa dia mulai dari brainstorming/spec, bukan langsung coding?\u003c/li\u003e\n\u003cli\u003eKenapa planning dipisah dari execution?\u003c/li\u003e\n\u003cli\u003eApa bedanya workflow greenfield dan brownfield?\u003c/li\u003e\n\u003cli\u003eApa bahaya \"over my skis\" dalam AI coding?\u003c/li\u003e\n\u003cli\u003eApa insight sosial dari workflow ini: solo vs team?\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eYang paling nempel adalah ini:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003espec adalah artefak pusat, bukan dokumen administratif.\u003c/li\u003e\n\u003cli\u003eplanning membuat perubahan kecil yang bisa diuji, bukan lompatan besar.\u003c/li\u003e\n\u003cli\u003egreenfield butuh plan-heavy workflow; brownfield butuh context extraction dari repo sebelum mengubah apa pun.\u003c/li\u003e\n\u003cli\u003e\"over my skis\" adalah ketika velocity AI terlalu cepat sementara pemahaman manusia tertinggal.\u003c/li\u003e\n\u003cli\u003edalam tim, AI coding harus punya collaboration protocol, bukan cuma kerja single-player.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eKalimat yang paling pas buat artikel ini: \"AI coding yang bagus bukan soal model aja. Ini soal membuat LLM bergerak di rel kecil yang elo desain.\" \u003c/p\u003e\n\u003ch2 id=\"baca-unmesh-joshi-what-is-code\"\u003eBaca Unmesh Joshi: What Is Code?\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-unmesh-joshi-what-is-code\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca artikel Unmesh Joshi di Martin Fowler tentang \"What Is Code?\": \u003ca href=\"https://martinfowler.com/articles/what-is-code.html\"\u003ehttps://martinfowler.com/articles/what-is-code.html\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eYang paling nyantol buat gue adalah bahwa code bukan hanya instruksi untuk mesin, tapi juga vocabulary konseptual untuk manusia, tim, dan LLM. Nama kelas, nama modul, dan istilah domain bukan kosmetik; mereka membawa asumsi, boundary, dan cara berpikir.\u003c/p\u003e\n\u003cp\u003eUnmesh bikin dua poin utama:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ecode sebagai instruksi mesin, yang LLM sudah mulai commoditize,\u003c/li\u003e\n\u003cli\u003ecode sebagai model domain, yang justru jadi nilai utama ketika AI bisa generate syntax.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eDari situ gue jadi lebih waspada terhadap cognitive debt: nama-nama keren dan pattern enterprise bisa muncul cepat, tapi tim belum tentu paham model konseptualnya.\u003c/p\u003e\n\u003ch2 id=\"baca-thread-kun-tentang-hardened-npm-supply-chain\"\u003eBaca thread Kun tentang hardened npm supply chain\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-thread-kun-tentang-hardened-npm-supply-chain\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread Kunchenguid tentang hardening supply chain npm: intinya bukan soal scan semua package, tapi soal membuat cooldown policy supaya project nggak otomatis mengambil versi baru yang baru rilis.\u003c/p\u003e\n\u003cp\u003eLink: \u003ca href=\"https://x.com/kunchenguid/status/2054600854553206992\"\u003ehttps://x.com/kunchenguid/status/2054600854553206992\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eYang paling nempel adalah konsepnya: trust attachment harus ke versi package, bukan sekadar nama package. \u003ccode\u003echalk\u003c/code\u003e, \u003ccode\u003eeslint\u003c/code\u003e, atau package terkenal bisa dipercaya dari versi lama, tapi versi baru yang muncul pagi ini tetap berisiko kalau akun maintainer disusupi.\u003c/p\u003e\n\u003cp\u003eGuardrail utama yang dia pakai adalah:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAge: 10080\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eminimumReleaseAgeStrict: true\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eArtinya tiap dependency baru harus setidaknya 7 hari di registry sebelum pnpm boleh resolve dan install. Ini bukan ganti private registry; ini pake pnpm sebagai gatekeeper di depan npm registry.\u003c/p\u003e\n\u003cp\u003eGue lihat tiga lapisan praktis di desainnya:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003epolicy cooldown di level resolving versi baru,\u003c/li\u003e\n\u003cli\u003eCI harus pakai \u003ccode\u003epnpm install --frozen-lockfile\u003c/code\u003e,\u003c/li\u003e\n\u003cli\u003ebuild script hanya boleh jalan untuk dependency yang eksplisit di-allowlist.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eYang menarik: ini bukan security tool magis, tapi proses. Kalau dependency baru dipakai harus sadar ada buffer observasi. Kalau package internal butuh langsung, pakai \u003ccode\u003eminimumReleaseAgeExclude\u003c/code\u003e sebagai escape hatch — tapi jangan besar-besaran.\u003c/p\u003e\n\u003cp\u003eKalau mau adopsi, modelnya lebih ke \"delay gate\" ketimbang \"freeze forever\". Cooldown ini mesti sustainable, bukan bikin dependency management jadi ngeri.\u003c/p\u003e\n\u003ch2 id=\"baca-thread-gergely-orosz-tentang-anders-hejlsberg\"\u003eBaca thread Gergely Orosz tentang Anders Hejlsberg\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#baca-thread-gergely-orosz-tentang-anders-hejlsberg\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003cp\u003eGue baca thread Gergely Orosz soal interview/podcast Anders Hejlsberg: \u003ca href=\"https://x.com/GergelyOrosz/status/2054652158231167482\"\u003ehttps://x.com/GergelyOrosz/status/2054652158231167482\u003c/a\u003e. Thread ini bukan cuma nostalgia Turbo Pascal, Delphi, C#, dan TypeScript. Ini soal pola besar: bahasa yang menang biasanya bukan yang paling murni teori, tapi yang paling mampu menyelesaikan friksi developer di waktu yang tepat.\u003c/p\u003e\n\u003cp\u003eYang gue tangkep ada lima poin penting:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eAnders dianggap living legend bukan karena satu bahasa, tapi karena kontribusinya di beberapa fase: Turbo Pascal, Delphi, C#, dan TypeScript.\u003c/li\u003e\n\u003cli\u003eTurbo Pascal penting karena murah, cepat, dan interaktif—kombinasi yang menurunkan friksi ekonomi dan teknis.\u003c/li\u003e\n\u003cli\u003eC# lahir dari tekanan ekosistem, bukan sekadar ide teknis: konflik dengan Java membuat Microsoft butuh bahasa sendiri.\u003c/li\u003e\n\u003cli\u003eTypeScript menang karena tidak jadi \"C# to JavaScript\". Ia memperbaiki JavaScript dari dalam, bukan memaksa web keluar dari JavaScript.\u003c/li\u003e\n\u003cli\u003eDesain bahasa adalah permainan 10 tahun. Versi pertama perlu waktu, versi kedua memperbaiki, versi ketiga baru terasa matang.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eReply thread juga menarik:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eNostalgia Turbo Pascal mengingatkan bahwa tool yang benar-benar sukses seringkali membuat developer lebih cepat mengubah ide jadi program, bukan sekadar memberi kontrol paling dekat ke mesin.\u003c/li\u003e\n\u003cli\u003eSeorang reply di thread menegaskan bahwa skill besar saat ini bukan sekadar syntax JS/TS, tapi memahami type system dan modeling.\u003c/li\u003e\n\u003cli\u003eAda juga counterpoint yang bilang Anders terlalu dipuja, tapi itu justru menguatkan poin: inovasi sering ada di integrasi dan timing, bukan cuma di fitur abstrak.\u003c/li\u003e\n\u003cli\u003eAda komentar tentang tooling TypeScript di monorepo besar, yang menunjukkan tantangan selanjutnya: kinerja dan skalabilitas compiler/tooling.\u003c/li\u003e\n\u003cli\u003eAda juga klaim AI-assisted programming membuat TS lebih kuat karena typed codebase memberi sinyal yang lebih jelas untuk AI.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIntinya, thread ini menggarisbawahi satu lesson yang gede buat gue:\u003c/p\u003e\n\u003cp\u003eBahasa yang besar menang karena kompromi yang tepat antara kompatibilitas, produktivitas, tooling, dan timing. Turbo Pascal nggak menang karena paling canggih, C# nggak lahir dari idenya saja, TypeScript nggak menang karena sekadar nambah type. Mereka menang karena membaca friksi ekosistem dengan tepat.\u003c/p\u003e\n\u003chr\u003e\n\u003ch2 id=\"tags\"\u003eTags\u003ca aria-hidden=\"true\" class=\"anchor-heading icon-link\" href=\"#tags\"\u003e\u003c/a\u003e\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edaily (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003erust (Private)\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca title=\"Private\" href=\"https://wiki.dendron.so/notes/hfyvYGJZQiUwQaaxQO27q.html\" target=\"_blank\" class=\"private\"\u003edesign-patterns (Private)\u003c/a\u003e\u003c/li\u003e\n\u003c/ol\u003e","noteIndex":{"id":"root","title":"Hello and Welcome! 👋","desc":"","updated":1778468084907,"created":1724251163400,"tags":["x","twitter"],"custom":{"nav_order":0,"permalink":"/"},"fname":"root","type":"note","vault":{"fsPath":"vault"},"contentHash":"fbada016be66dbd4790f7e49ede05b67","links":[{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.x","alias":"x","xvault":false,"to":{"fname":"tags.x"}},{"type":"frontmatterTag","from":{"fname":"root","id":"root","vaultName":"vault"},"value":"tags.twitter","alias":"twitter","xvault":false,"to":{"fname":"tags.twitter"}}],"anchors":{"find-more":{"t
